      — docs.claude.com, «Claude''s ability to pick the right tool degrades once you exceed 30–50 available
      tools» (прочитано 2026-10-07, см. n34 и research/mcp-kontekst-otkaz.md §2); снятый флаг выдачи наборов
      по требованию у официального сервера GitHub — PR github/github-mcp-server#2512, влит 2026-05-20
      (см. n33). Мостик (§B.29) переписан под новое завершение кейса. Прежний передавал блоку субагента
      вопрос о повторяющейся роли — вопрос шестого кейса, тогда как следующий слайд блока (n36, «Сорок
      файлов ради ответа в одно слово») открывает кейс об объёме чтения. Новый мостик передаёт ровно это:
      пятый файл в конфигурации и один конечный контекст, в котором описания инструментов — лишь одна
      из статей. Пять файлов, порядок блоков и адресат мостика сохранены, сменился передаваемый вопрос.
      Стык помечен в отчёте сессии как правка, затрагивающая зону соседнего блока.'
