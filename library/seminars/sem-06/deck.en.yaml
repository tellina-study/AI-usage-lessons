    figure: ramka-n01-hero-sem06.png
    primary: 'A dark Ocean background, the same device as the previous class''s cover. A large title,
      and under it two lines: first, as a quiet aside — what happened this week; then, in a gold box —
      a short riddle of a question that the seminar answers within the next three minutes. The seminar''s
      question is not on the cover at all (it is on n04). The bottom third, full width, is the hero diagram
      (at least 40% of the slide''s area): on the left, a dashed card "the agent''s context" with two
      lines inside it — "the repository" and "the conversation with you" — and a caption underneath, "past
      that the agent sees nothing"; from it two arrows to two white cards on the right: "data from outside
      — MCP" and "trimmed permissions — subagent". Under that pair — a row of four segments: the first
      two (hook, skill) filled in a muted gray with the caption "closed last time", the next two (MCP,
      subagent) filled in gold with the caption "we settle these today".

      '
    backup: 'The diagram is drawn programmatically (the same figure renderer that built the previous class''s
      illustration) — it is not a photograph and not a screenshot. That is a legitimate route for a hero
      illustration: a diagram drawn by code does not pass itself off as an external source and fakes nothing,
      unlike a stylized card with a caption standing in for a real image. The four segments of the bottom
      row are the seminar''s axis (see n03/n61), not a separate invention: the same order of rows as on
      the axis and on the map.

      The owner''s round of edits (issue 225, §A2): the previous illustration ("a message" against "a
      fact") was removed entirely, together with the question it carried. The axis row was cut from five
      segments to four (§A1): the process was taken off the diagram, and the seminar''s ladder is hook
      · skill · MCP · subagent.

      The storytelling revision (issue 225, `PERESMOTR-STORITELLING.md`, reason 3 — "the opening is a
      table of contents, not a hook"; rule P2 — "every case has a person and a cost in it"). The cover
      carried the seminar''s question and nothing else: the room was handed the question before it had
      felt the shortfall, and the first five slides narrated the construction of the seminar. The cover
      now carries the FIRST MISS of the running story: the same project, the same developer, the agent
      answering confidently and wide of the mark, because part of the truth lives outside the repository;
      the cost is named outright (a missed deadline and a conversation with the client). The seminar''s
      question moved to n04 — to the point where there are already two misses with opposite causes behind
      it. In its place on the cover stands a short riddle of a question, and that riddle is the hook:
      the agent did not get dumber, so what stopped fitting.

      Layout mechanics: `g_cover` sorts the lines of a quote block by whether they end in a question mark
      — those go into the gold box, the rest into a quiet aside with a teal bar. That is why the aside
      and the question stand as SEPARATE blocks, each with its own pair of quotation marks: splitting
      one quote naively down the middle would leave the opening mark in one frame and the closing mark
      in the other (a live case, n04/n63 from the same build).

      What follows from this for the other sessions: `make_deck_yaml.py` pulls `deck.central_question`
      from the question in the gold box of the COVER. After this edit what stands there is the riddle,
      not the seminar''s question; the discrepancy is named outright, and the decision belongs to the
      consolidation session.

      The tracker is deliberately NOT named here. The first miss says only "not in the repository": the
      mechanism — the client''s tracker and a hand-carried transfer a few times a week — is presented
      by the scene of the first case (`n10`), and a repeat would eat it.

      The post-delivery consolidation (issue 225, `qa/svedenie-posle-provedeniya.md`): the seminar''s
      title was replaced with the one the owner approved — "Access to the outside and trimmed permissions"
      instead of "Access to the outside and a trimmed role". The word "role" was removed across the whole
      seminar as ours rather than the lecturer''s (`qa/RAZBOR-PROVEDENIYA.md` §A1); substituting "subagent"
      directly would have produced a tautology, and the phrase "trimmed permissions" already lives in
      the material (`n04`, `n05`). The same edit made the caption of the hero diagram''s lower-right card
      "trimmed permissions — subagent" instead of "its own role, trimmed permissions — subagent": the
      point size went up from 26 to 28 — the line got shorter, and the card settled into the same shape
