    duration_min: 1.5
    assertion: "Шесть источников независимо сходятся на одном: доступ снаружи расширяет площадь ошибки быстрее, чем растёт доверие к серверу, — а сколько времени в среднем занимает сама проверка перед подключением, не измерил ни один из них"
    learning_goal: "Свидетельства ступени 5 — таблица источник/тезис/сила доказательства + честный пробел (время самой процедуры проверки не измерено ни в одном источнике)"
