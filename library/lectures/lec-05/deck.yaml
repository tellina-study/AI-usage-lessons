# library/lectures/lec-05/deck.yaml  —  PART 1 of 2
#
# Deck-структура Лекции 5 «AI-продукт: полный жизненный цикл — от намерения до эксплуатации»
# (~50 слайдов: s01–s49 + s13a IBM Watson — cascade-safe suffix-ID).
#
# Source: chapter.md + chapter-part2/3/4.md (≥30k слов, 4 части) +
# notes/lecture-5-review/pdlc/final/plan-final.md §4 (slide list s01–s49 + s13a).
# Issue #189 · Branch: hc/pldlc-lesson5-c5cc1586
#
# ┌─ STRUCTURAL PRINCIPLE (owner v3 full-rewrite, 2026-09-06): each of 6 sections = ──┐
# │ ① intro + CLASSICAL BASE (process from scratch) → ② what AI adds (capabilities +  │
# │ best practices + tools 2025-26) → ③ AI limitations + what stays from classic →    │
# │ ④ on-point failure for that phase. 13 failures total, distributed by phase        │
# │ (not clustered). Keystone s05 (loop PDCA/OODA/BML) + s06 (cost/trust asymmetry).  │
# └─────────────────────────────────────────────────────────────────────────────────┘
#
# ┌─ SPLIT: deck.yaml >600 строк (Document Size Limit, waiver НЕТ) → разбит ──────┐
# │ deck.yaml      (ЭТОТ ФАЙЛ) — deck/palette/motif/typography/glossary_lock      │
# │                + ai_failure_judgment (top-level share) + slides s01..s27      │
# │                (Раздел 0 «Введение» через конец Раздела 3 «Build/Launch»).    │
# │ deck-part2.yaml — slides s28..s49 (Раздел 4 Measure/Experiment через          │
# │                Раздел 6 Governance/финал) + totals + verify_day_of_items +    │
# │                fact_check_items.                                              │
# │ Loader (rendered build-скрипт) читает ОБЕ части. Кросс-ссылка внизу.          │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ⚠ PHASE 5 STATUS: структура текста (deck.yaml + slides/*.md) ТОЛЬКО. Рендер PPTX +
# visual-loop — Phase 6 (следующая фаза). НЕ РЕНДЕРИТЬ в этой фазе.

deck:
  lecture_number: 5
  title: "Лекция 5. AI-продукт: полный жизненный цикл — от намерения до эксплуатации"
  audience: "студенты-инженеры 3 курса, универсально, без локального binding"
  duration_min: 100
  central_question: "Когда AI сделал сборку почти бесплатной — что стало настоящим узким местом продукта, и на каждой фазе цикла: какая классическая дисциплина остаётся, что AI ускоряет, и где AI-first ломается?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: ru
  status: draft-for-gate-b
  version: v1.0
  source: "chapter.md + chapter-part2/3/4.md (≥30k слов, 4 части)"
  plan: "notes/lecture-5-review/pdlc/final/plan-final.md §4"
  total_slides: 50          # s01–s49 + s13a (IBM Watson, cascade-safe suffix)
  curriculum_level: "Отраслевая лекция (после Л4 SDLC); L5 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "фазы петли продукта (discover→build→measure→learn→decide); каждая фаза = база→AI→ограничения→провал"
  glossary_lock: glossary.yaml

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # Канонические термины — из glossary.yaml (lecture-5 lock). Полный список там;
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  ref: "library/lectures/lec-05/glossary.yaml"
  headline_terms:
    - "петля обратной связи (discover→build→measure→learn→decide)"
    - "асимметрия стоимость/доверие"
    - "Customer Development (Бланк)"
    - "The Mom Test (Фитцпатрик)"
    - "фальсифицируемая гипотеза (вера→тест→дата)"
    - "reference dataset (эталонный набор)"
    - "Double Diamond"
    - "эвристики Нильсена"
    - "feature flag / canary / staged rollout / rollback"
    - "Stage-Gate go/kill"
    - "CC/CD vs CI/CD"
    - "agency-ladder"
    - "eval / offline-online eval / LLM-as-judge"
    - "pass@k vs pass^k"
    - "OEC / guardrail-метрика"
    - "SLI/SLO/error budget"
    - "LLMOps/AgentOps"
    - "model drift / silent drift"
    - "закон Гудхарта / reward hacking"
    - "Guardian Agent (Gartner)"
    - "maturity 0-5"
    - "operators→orchestrators"
    - "hidden human cost"

