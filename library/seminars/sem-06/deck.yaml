      смешанная формулировка «предотвращаем на входе, решаем после» вместо «предотвращаем — проверяем
      до подключения»: несёт обе половины блока без роста ячейки. Колонка «что делает» не менялась — она
      и так называла факт верно.

      Вторая прожарка (issue 225, P1-3): золото на этом слайде не выполнялось (0 золотых пикселей, промерено
