- id: n55
  file: slides/n55-d01-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: 'По чему искать фотографию: по тому, что про неё записали, — или по ней самой?'
  learning_goal: Дивайдер кейса D (А2 — называет проблему, не решение; П3 — форма «вопрос», отличная от
    форм дивайдеров кейсов A/B/C). Опирается на архив фотографий, уже построенный кейсом B этого же занятия
    (описания сделаны), и ставит вопрос поиска по нему — без раскрытия, какой из способов победит.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка вопроса крупно. Внизу дорожка четырёх кейсов, четвёртый подсвечен.

      '
    backup: Формулировка — `plan-peredelki/kejs-D-poisk.md` §1.1, дословно.
- id: n56
  file: slides/n56-d02-stsena.md
  type: problem_scenario
  duration_min: 1.0
  assertion: Ольге нужна фотография конкретного стенда с прошлого мероприятия — а поиска по архиву фотографий
    нет вовсе
  learning_goal: 'Сцена кейса D (П2 — человек и цена; С1 — схема постановки: сплошным то, что уже построено
    кейсами A/B/C, пунктиром узел «поиск», который строит этот кейс). Сквозной персонаж — Ольга (А13).
    Цена — час ручного перелистывания, посчитанный на фактическом размере корпуса кейса B (40 фотографий),
    не выдуманный.'
  visual:
    pattern: problem_scenario
    primary: 'Сверху — схема сплошным: «фотографии → модель → описания» (уже построено). Пунктиром — узел
