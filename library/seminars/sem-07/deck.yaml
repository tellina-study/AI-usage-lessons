    утверждает — чтобы не читался как запрет на автоматическую оценку вообще
  visual:
    pattern: cost_reversibility_spectrum
    primary: 'Горизонтальный спектр: дёшево/обратимо (письмо, можно переписать) слева — дорого/необратимо
      (покупка дома) справа. Чем правее точка действия после текущего шага, тем меньше смысла экономить
