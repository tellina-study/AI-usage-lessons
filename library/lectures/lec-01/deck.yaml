    learning_outcomes: [LO1, LO4]
    references: [anthropic-2024-effective-agents]
    visual:
      pattern: 6_step_loop_diagram
      primary: "Loop-схема 6 шагов (User input → System prompt + Chat history → LLM → New message → Append to history → Show user → loop) + 2 callout: «Контроль через системный промпт» (gold) и «Ограничение — контекстное окно (128k-1M токенов)» (gold)"

  - id: s17
