latin_kept_as_names:
  - name: "Customer Development"
    russian: "развитие клиента"
    first_appearance: "s08 — «Развитие клиента (Customer Development)», Стив Бланк"
    later_use: "русская форма («Развитие клиента» на s51)"
    replaces: ["«Customer Development» голой латиницей в ячейке итоговой матрицы s51"]
  - name: "«The Mom Test»"
    russian: "—  название книги, русского имени нет"
    first_appearance: "s08 — «книга «The Mom Test», Роб Фитцпатрик»"
    later_use: "в кавычках, с русским окружением («Развитие клиента и «The Mom Test»» на s51)"
    replaces: ["«Mom Test» без кавычек и без атрибуции (s51)"]
  - name: "Double Diamond"
    russian: "двойной ромб"
    first_appearance: "s15 — «Двойной ромб (Double Diamond)»"
    later_use: "только русская форма"
  - name: "Stage-Gate"
    russian: "рубеж «продолжать или закрыть»"
    first_appearance: "s22 — «Рубеж «продолжать или закрыть» (Stage-Gate, Роберт Купер)»"
    later_use: "только русская форма"
  - name: "OpenTelemetry"
    russian: "—  название стандарта"
    first_appearance: "s38a (в строке источника)"
  - name: >
      бренды и издания: Google, Zillow, Klarna, IBM Watson, Amazon Go / Amazon Fresh,
      Figma, Statsig, GrowthBook, Eppo, Langfuse, Braintrust, LangSmith, Arize Phoenix,
      Faros, LinearB, Lovable, Magic Patterns, bolt.new, axe-core, Deloitte, Gartner,
      Boston Consulting Group, FinOps Foundation, Nielsen Norman Group
    russian: "—  не переводятся"
    first_appearance: "по месту; каждое сопровождается ролью либо строкой источника"

# ══════════════════════════════════════════════════════════════════════
# C. Аббревиатуры — раскрытие при первом появлении в видимом слое (правило 3)
# ══════════════════════════════════════════════════════════════════════
abbreviations:
  - abbr: "WCAG"
    first: "s18"
    gloss_on_slide: "WCAG (Web Content Accessibility Guidelines, «правила доступности веб-содержимого»)"
  - abbr: "MVP"
    first: "s22"
    gloss_on_slide: "Минимально жизнеспособный продукт (MVP — minimum viable product), Эрик Райс"
    note: "Русская форма ведущая; на s51 — только «Минимально жизнеспособный продукт»."
  - abbr: "CI/CD"
    first: "s22"
    gloss_on_slide: "непрерывная интеграция и поставка (CI/CD — continuous integration / continuous delivery)"
  - abbr: "OEC"
    first: "s29"
    gloss_on_slide: "сводный критерий оценки (OEC, Overall Evaluation Criterion)"
  - abbr: "MSI"
    first: "s33"
    gloss_on_slide: "MSI, meaningful social interactions, «содержательные социальные взаимодействия»"
  - abbr: "MMLU"
    first: "s34"
    gloss_on_slide: "MMLU (Massive Multitask Language Understanding, сводный набор из 57 предметов)"
  - abbr: "MedQA"
    first: "s34"
    gloss_on_slide: "MedQA (набор вопросов в формате медицинского лицензионного экзамена)"
  - abbr: "SLI"
    first: "s37"
    gloss_on_slide: "Показатель уровня сервиса (SLI)"
  - abbr: "SLO"
    first: "s37"
    gloss_on_slide: "Цель уровня сервиса (SLO)"
  - abbr: "RFID"
    first: "s48"
    gloss_on_slide: "радиочастотные метки (RFID)"
  - abbr: "САПР"
    first: "s55"
    gloss_on_slide: "системы автоматизированного проектирования (САПР)"
proper_name_abbreviations_not_expanded:
  note: >
    Раскрытию не подлежат — это части имён собственных, а не термины курса:
    IBM, MD (MD Anderson), MIT, STAT (STAT News), AI (Google AI Overviews, Character.AI),
    NANDA (MIT NANDA), NLP (Eval4NLP), CX (CX Dive), FinOps (FinOps Foundation).

# ══════════════════════════════════════════════════════════════════════
# D. Остальные несущие термины — форма подтверждена по собранной деке
# ══════════════════════════════════════════════════════════════════════
terms:
  - canonical: "петля"
    aliases: ["цикл"]
    note: >
      Шесть фаз одной петли; «петля обратной связи» как длинная форма на слайдах не
      употребляется. Три независимых первоисточника названы на s06 (Деминг, Бойд, Райс).
  - canonical: "фаза"
    note: "Шесть фаз: исследование, дизайн, сборка и запуск, измерение, поддержка, управление."
  - canonical: "метрика решения"
    note: "Одна и с направлением; идёт в паре с метрикой-ограничителем (s29)."
  - canonical: "контрольная группа"
    note: "Не «удерживаемая группа». s29."
  - canonical: "случайное деление"
    note: "То, что и даёт причинность (s29)."
  - canonical: "переключатель функции"
    note: >
      feature flag. Не смешивать с «аварийным выключателем»: переключатель управляет
      видимостью функции и уровнем самостоятельности, выключатель гасит функцию по порогу.
  - canonical: "путь назад"
    aliases: ["откат", "возврат к прошлой версии"]
    note: "«Роллбэк» запрещён."
  - canonical: "дизайн-система"
    note: >
      Свод правил интерфейса; ограничитель ГЕНЕРАЦИИ (s17a). Механизмом контроля становится
      только машиночитаемая её часть.
  - canonical: "модель-судья"
    note: "Согласие с человеком проверяется отдельно; не оракул (s24b, s31a, s38a)."
  - canonical: "наблюдаемость"
    note: "Ось решения на s53; практика на s38a."
  - canonical: "обратимость"
    note: "Ось решения на s53."
  - canonical: "тихий дрейф"
    note: "Маскируется средним по всем ответам (s39, s51)."
  - canonical: "бюджет ошибок"
    note: "«Единица минус цель уровня сервиса» (s37)."
  - canonical: "угодливость"
    note: "Режим отказа фазы исследования: синтетический источник не скажет «нет» (s51)."
  - canonical: "закон Гудхарта"
    note: "С человеком и годом на слайде: «экономист Чарльз Гудхарт, 1975» (s32)."
  - canonical: "цена за единицу текста"
    aliases: ["стоимость запроса"]
    note: "s45a. Ограничитель, а не цель."
  - canonical: "базовая линия без ИИ"
    note: "Считать бесполезно, если не с чем сравнить (s45a, s51)."
  - canonical: "портфельное управление"
    note: "s45, s51."
  - canonical: "учения на отказ"
    note: "s38b. Не «дрилл»."
  - canonical: "разбор после сбоя"
    aliases: ["разбор"]
    note: "Не «постмортем»."

forbidden_anglicisms:
  - { wrong: "guardrail / guardrail-метрика", use: "метрика-ограничитель" }
