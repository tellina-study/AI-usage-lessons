slides:
  # ─── Section 4. Testing — TDD as a discipline (s22–s24) ───
  - id: s22
    file: slides-en/s22-divider-testing.md
    type: section_divider
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 0.5
    assertion: "Testing · TDD discipline — the test as an executable specification; a strong phase in the right role, but with the trap \"green tests ≠ working code\""
    learning_goal: "Section divider for section 4 (testing): the test as a machine-verifiable criterion"
    learning_outcomes: [LO1]
    chapter_ref: "§4 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"4\" on the right, soft-outline, SECTION 4 + subtitle \"Testing — TDD as a discipline\", a narrative bridge line on the left, roadmap bar of 8 cards (current 4 gold), tag \"strong in the right role · 1 failure\". NO timings."
    interaction: none

  - id: s23
    file: slides-en/s23-tdd-discipline.md
    type: assertion_visual
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "TDD-as-approach: the test is an executable specification, red-green-refactor with human ownership; the check is not outsourced to the model; nuance — the value is in the structure, not the ritual (TDD-first for an agent = ~3× tokens with no gain)"
    learning_goal: "The TDD practice as an approach + the nuance structure≠ritual (Böckeler ~3× tokens); tools secondary"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§4.1, §4.2 [for-slide-s22]"
    references: [willison-testing, fowler-testing, bockeler-thoughtworks, dora-report]
    interaction: none

  - id: s24
    file: slides-en/s24-all-green-mutation.md
    type: case_study
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "\"all green\" lies: an LLM readily reports \"all tests green\" while they fail — the gate is a deterministic run, not the model's report; coverage↑ mutation↓ (Meta 32/5.3% vs 2.4/15%)"
    learning_goal: "[SI] Failure: \"all green\" lies (Fowler); coverage↑(32/5.3%) mutation↓(2.4/15%, Meta); incident→regression test"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§4.3 [for-slide-s24]"
    references: [fowler-testing, willison-testing, meta-testgen]
    in_bucket: true
    verify_day_of: true

  # ─── Section 5. Review + Security — the discipline of skepticism (s25–s31) ───
  - id: s25
    file: slides-en/s25-divider-review-security.md
    type: section_divider
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 0.5
    assertion: "Review + Security · a second critical look at AI's output; counterintuitively — AI code must be reviewed MORE, not less"
    learning_goal: "Section divider for section 5 (review+security): the discipline of skepticism in one line"
    learning_outcomes: [LO1]
    chapter_ref: "§5 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"5\" on the right, soft-outline, SECTION 5 + subtitle \"Review + Security — the discipline of skepticism\", a narrative bridge line on the left, roadmap bar of 8 cards (current 5 gold), tag \"strong in capability · 4 failures\". NO timings."
    interaction: none

  - id: s26
    file: slides-en/s26-review-practice.md
    type: assertion_visual
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The review practice is not \"which AI reviewer is best\" but two human practices: adversarial review with fresh context (not the one who wrote it) + retained human accountability; AI review = assist, not gate"
    learning_goal: "The review practice: adversarial fresh-context + accountability; tools secondary; judgment assist/gate"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§5.2 [for-slide-s26]"
    references: [willison-testing, osmani-70-percent]
    interaction: none

  - id: s27
    file: slides-en/s27-review-failure-curl.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "Review failure: complacency toward AI code (Radar Hold) + curl-slop as a DDoS on maintainers — the asymmetry \"generate a fake in seconds / refute it in hours\"; AI review ~19% F1 against the human baseline"
    learning_goal: "[SI] Review failure: complacency (Radar Hold) + AI-review ~19% F1 vs human + curl valid-rate >15%→<5%"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.3 [for-slide-s27]"
    references: [thoughtworks-radar, stenberg-curl, codecrash]
    in_bucket: true
    verify_day_of: true

  - id: s28
    file: slides-en/s28-security-practice.md
    type: assertion_visual
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The security practice is the architectural breaking of the lethal trifecta (untrusted content + secrets + exfiltration channel) with four controls: least-privilege, sandbox, egress allowlist, a mandatory SAST/supply-chain gate"
    learning_goal: "The security practice: least-privilege/sandbox/SAST gate/lethal trifecta; tools secondary"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.4 [for-slide-s28]"
    references: [fowler-lethal-trifecta, github-agentic-workflows]
    verify_day_of: true

  - id: s29
    file: slides-en/s29-vulnerable-false-confidence.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The systemic risk is not \"AI sometimes writes vulnerable code\" but \"vulnerable code + heightened confidence that it is safe\": Stanford — people introduce vulnerabilities more often and more confidently; NYU ~40% (1689 programs / 89 MITRE scenarios)"
    learning_goal: "[SI] Security failure: Stanford insecure+overconfident + NYU ~40% (1689/89 MITRE Top-25 CWE)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.5 [for-slide-s27]"
    references: [stanford-perry, nyu-asleep-keyboard]
    in_bucket: true
    verify_day_of: true

  - id: s30
    file: slides-en/s30-slopsquatting-camoleak.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "Supply chain is a separate class: slopsquatting (registering a reproducibly-hallucinated package; 20% of 576k samples, 43% reproducibility) + CamoLeak (prompt injection, CVSS 9.6) — cured by architecture, not by a \"better model\""
    learning_goal: "[SI] Security failure: slopsquatting (576k, 43%) + CamoLeak CVSS 9.6 (supply-chain/prompt-injection class)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.6 [for-slide-s28]"
    references: [larson-slopsquatting, legit-camoleak]
    in_bucket: true
    verify_day_of: true

  - id: s31
    file: slides-en/s31-replit-culmination.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The Replit agent, during a code freeze, wiped the prod DB, lied, and rated itself 95/100 — level-D security does not live in the prompt, it lives outside the agent; accountability is not delegated"
    learning_goal: "[SI] Culmination: Replit by failure mode + class (Kiro, PocketOS 9 sec); accountability is not delegated"
    learning_outcomes: [LO1, LO7, LO4]
    chapter_ref: "§5.7 [for-slide-s29]"
    references: [replit-incident, fortune-replit, ai-incident-db]
    in_bucket: true
    verify_day_of: false

  # ─── Section 6. Delivery · Operations · Documentation (s32–s34) ───
  - id: s32
    file: slides-en/s32-divider-delivery-ops-docs.md
    type: section_divider
    section: "Section 6. Delivery · Operations · Documentation"
    duration_min: 0.5
    assertion: "Delivery + Operations + Documentation · three phases where the input is a state of the real world that is not in the text; the practice leads, the tool consumes"
    learning_goal: "Section divider for section 6: the point of the phases in one line"
    learning_outcomes: [LO1]
    chapter_ref: "§6 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"6\" on the right, soft-outline, SECTION 6 + subtitle \"Delivery · Operations · Documentation\", a narrative bridge line on the left, roadmap bar of 8 cards (current 6 gold), tag \"two thin phases + a bright spot · 3 failures\". NO timings."
    interaction: none

  - id: s33
    file: slides-en/s33-cicd-ops.md
    type: case_study
    section: "Section 6. Delivery · Operations · Documentation"
    duration_min: 3
    assertion: "Delivery — DORA-first: first a mature pipeline, then scale AI (\"AI amplifies what is already there\") + a hard human prod gate; AI consumes pipelines but does not own them; DORA — both halves (+throughput / -7.2% stability)"
    learning_goal: "[SI] CI/CD+Ops practices: DORA-first + prod gate; the DORA pair, both halves; operations — the weakest phase"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§6.1 [for-slide-s33]"
    references: [dora-report, osmani-70-percent]
    in_bucket: true
    verify_day_of: true

  - id: s34
    file: slides-en/s34-docs-bright-spot.md
    type: case_study
    section: "Section 6. Delivery · Operations · Documentation"
    duration_min: 3
    assertion: "Documentation is the only bright spot (DORA +7.5%, but ONLY paired with -7.2% stability); the practice is docs-as-context (code=truth), the generation pace ≤ the pace of understanding; the failure is cognitive debt"
    learning_goal: "[SI] Docs-as-context (code=truth) + cognitive-debt failure; DORA +7.5% paired with -7.2% stability"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§6.2 [for-slide-s34]"
    references: [dora-report, thoughtworks-radar, bockeler-thoughtworks]
    in_bucket: true
    verify_day_of: true

  # ─── Section 7. Synthesis — discipline by phase (s35–s40) ───
  - id: s35
    file: slides-en/s35-divider-synthesis.md
    type: section_divider
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 0.5
    assertion: "Synthesis · we assemble the decision apparatus: the matrix \"phase × leading practice × where the human is\", triangulation, the risk triad, the checklist"
    learning_goal: "Section divider for section 7 (synthesis): folding into a decision apparatus"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§7 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"7\" on the right, soft-outline, SECTION 7 + subtitle \"Synthesis — discipline by phase\", a narrative bridge line on the left, roadmap bar of 8 cards (current 7 gold), tag \"the decision apparatus\". NO timings."
    interaction: none

  - id: s36
    file: slides-en/s36-synthesis-matrix.md
    type: schema_matrix
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 3
    assertion: "The lecture's matrix: phase × leading practice × failure mode × where the human is mandatory; the vendor is the last, secondary, swappable column — eliminating the vendor catalog"
    learning_goal: "SYNTHESIS matrix reframed (#264): phase × leading practice × where the human is; vendor as a secondary column"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§7.1 [for-slide-s36]"
    references: []
    verify_day_of: true

  - id: s37
    file: slides-en/s37-triangulation.md
    type: case_study
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 3
    assertion: "Triangulation of three independent methods (DORA / GitClear / METR): individual AI gains ≠ systemic quality; the strength is in the convergence of independent methods → the method matters more than the tool"
    learning_goal: "[SI] Triangulation DORA(\"amplifies what is already there\")/GitClear/METR → the method matters more than the tool"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§7.2 [for-slide-s37]"
    references: [dora-report, gitclear, metr-study]
    in_bucket: true
    verify_day_of: true

  - id: s38
    file: slides-en/s38-risk-triad.md
    type: schema_quadrant
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 3
    assertion: "The risk triad (Böckeler) — a compact criterion for \"when AI yes / no\": probability × impact × detectability; vibe coding is admissible only at low × low × high, otherwise — discipline"
    learning_goal: "[SI] The risk triad (Böckeler) (probability×impact×detectability) as the deciding practice"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§7.3 [for-slide-s38]"
    references: [bockeler-thoughtworks]
    in_bucket: true
    verify_day_of: false

  - id: s39
    file: slides-en/s39-checklist.md
    type: assertion_visual
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 3
    assertion: "A checklist \"when AI yes / when no\" by phase — the distribution of the burden of proof; irreversibility/impact — the veto axis; Anthropic -17% (quiz 50% vs 67%, n=52) — when the goal is \"to learn\", delegating generation hurts"
    learning_goal: "[SI] Checklist §7.4 (LO4 entry) + Anthropic -17% junior; a task without timing/methodology"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§7.4, §7.5 [for-slide-s39]"
    references: [anthropic-skill-formation]
    in_bucket: true
    verify_day_of: true

  - id: s40
    file: slides-en/s40-bridge-qa.md
    type: hero_closing
    section: "Section 7. Synthesis — discipline by phase"
    duration_min: 3
    assertion: "AI changes the cost of writing code, but not the cost of understanding what to build and who is accountable; the phase-centric map + triangulation + the risk triad — a lens for every industry: the method transfers, not the list of tools"
    learning_goal: "Bridge to Seminar 4 + Q&A + conclusion; HERO closing (closes the emotional arc / bridges to the industry lectures)"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§7.6, Conclusion [for-slide-s40]"
    references: [anthropic-skill-formation]
    interaction: think_pause
    verify_day_of: false
    hero_required: true

