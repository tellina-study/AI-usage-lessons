      Постановка — по SETKA-KEYSOV-S9-part2.md, раздел «Кейс 6», подраздел «Постановка»: клиент прикладывает
      к заявке фотографию квитанции и отдельно пишет сумму текстом; снимок сделан телефоном, не отсканирован.

      Что сознательно НЕ показано: чем кончился замер. Числа «25 из 30», «2,9 px» и «0 из 15 / 15 из 15»
      живут в тактах n70, n71 и n73 — дивайдер, проговоривший итог, обнуляет и вопрос, и разбор (БРИФ
      §4a). Собственных чисел стенда на этом кадре нет вовсе, и это не упущение.

      Название кейса — «Чтение фотографии», дословно как в дорожке кейсов `rendered/deck-config.yaml`
      (`case_track`, пятый по счёту пункт), не формулировка «Фотография документа на входе» из заголовка
      раздела сетки: та — предметная, эта — функциональная, и расходиться с дорожкой кадр не должен.

      Персонаж на этом кадре не назван: сцена кейса (n65) называет Ольгу явно, дивайдер — только постановку.'
