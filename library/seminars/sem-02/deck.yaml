deck:
  seminar_number: 2
  title: "Семинар 2 — классифицируй и не ошибись"
  audience: "студенты 3 курса, направление 09.03.01, группа 1 — семинар идёт ПОСЛЕ Лекции 1 в тот же день (закрепление, не введение)"
  duration_min: 76
  format: "разбор+опрос_дискуссия"
  central_question: "Как за 60 секунд определить тип AI-решения и распознать, когда оно подводит?"
  learning_outcomes: [LO1, LO6, LO7]
  lo_note: "Закрепляет LO1 (классификация/выбор типа AI), LO6 (каталог типовых ошибок AI), LO7 (обоснованная критическая проверка) из Лекции 1."
  language: ru

slides:
  - id: s01
    file: slides/s01-hero-cover.md
    type: hero_cover
    assertion: "Классифицируй и не ошибись — тип AI, чек-лист и провалы"
    learning_goal: "Emotional hook + hero-иллюстрация: реальное фото bounding-box детекции, продолжает тему Лекции 1"
    visual:
      pattern: hero_cover_real_photo
      backup: assets/screenshots/s01-iou-bbox-real.jpg

  - id: s02
    file: slides/s02-recap.md
    type: assertion_visual
    assertion: "Две оси и один чек-лист — язык, который вы уже знаете"
    learning_goal: "Визуальный recap оси задача×модальность и чек-листа 2 вопроса + квадрант"
    visual:
      pattern: dual_panel_recap

  - id: s03
    file: slides/s03-tools-roster.md
    type: poll_reveal
    assertion: "Шесть инструментов — один и тот же вопрос: модель, чат, агент или приложение?"
    learning_goal: "Recap механики голосования + roster 6 инструментов раздела 2"
    visual:
      pattern: vote_mechanic_plus_roster_list

  - id: s04
    file: slides/s04-tools-1-2-q.md
    type: poll_reveal
    assertion: "Модель, чат, агент или приложение — инструменты 1 и 2"
    learning_goal: "Постановка для инструментов 1-2 (YOLO-детектор, AI-чат) — голосование до ответа"
    visual:
      pattern: vote_two_cards_no_answer

  - id: s05
    file: slides/s05-tools-1-2-a.md
    type: poll_reveal
    assertion: "Один проход без диалога — модель. Диалог без инструментов — чат"
    learning_goal: "Раскрытие ответов для инструментов 1-2 (YOLO-детектор, AI-чат)"
    visual:
      pattern: reveal_two_cards

  - id: s06
    file: slides/s06-copilot-pair-q.md
    type: poll_reveal
    assertion: "Один и тот же продукт, два режима использования — что это?"
    learning_goal: "Постановка ключевого момента раздела 2 (пара GitHub Copilot inline/Agent) — голосование до ответа"
    visual:
      pattern: vote_shared_brand_two_modes

  - id: s07
    file: slides/s07-copilot-pair-a.md
    type: poll_reveal
    assertion: "Один инструмент — два режима — два разных типа"
    learning_goal: "Ключевой момент раздела 2 — раскрытие ответа для пары GitHub Copilot inline/Agent"
    visual:
      pattern: vertical_pair_with_connector

  - id: s08
    file: slides/s08-tools-5-6-q.md
    type: poll_reveal
    assertion: "Модель, чат, агент или приложение — инструменты 5 и 6"
    learning_goal: "Постановка для инструментов 5-6 (YandexGPT, 200-PDF агент) — голосование до ответа"
    visual:
      pattern: vote_two_cards_no_answer

  - id: s09
    file: slides/s09-tools-5-6-a.md
    type: poll_reveal
    assertion: "AI «под капотом» — приложение. Самостоятельная работа с файлами — агент"
    learning_goal: "Раскрытие ответов для инструментов 5-6 (YandexGPT, 200-PDF агент)"
    visual:
      pattern: reveal_two_cards

  - id: s10
    file: slides/s10-scenarios-intro.md
    type: assertion_visual
    assertion: "Четыре инженерных сценария — чек-лист под давлением времени"
    learning_goal: "Методика раздела 3 (ЯДРО ЗАНЯТИЯ)"
    visual:
      pattern: process_4_step_strip

  - id: s11
    file: slides/s11-scenario-1-q.md
    type: quadrant
    assertion: "Фоновый скрипт проверки орфографии — куда его отнести?"
    learning_goal: "Сценарий 1/4 — постановка (голосование до ответа), самый чистый случай квадранта"
    visual:
      pattern: schema_quadrant_neutral

  - id: s12
    file: slides/s12-scenario-1-a.md
    type: quadrant
    assertion: "Фоновый скрипт проверки орфографии — разминка"
    learning_goal: "Сценарий 1/4 — раскрытие ответа: самый чистый случай (Модель)"
    visual:
      pattern: schema_quadrant

  - id: s13
    file: slides/s13-scenario-2-q.md
    type: quadrant
    assertion: "Ночной скрипт: баг-репорты → критичность → очереди Jira — куда его отнести?"
    learning_goal: "Сценарий 2/4 — постановка (голосование до ответа), наименее очевидный угол"
    visual:
      pattern: schema_quadrant_neutral

  - id: s14
    file: slides/s14-scenario-2-a.md
    type: quadrant
    assertion: "Ночной скрипт: баг-репорты → критичность → очереди Jira"
    learning_goal: "Сценарий 2/4 — раскрытие ответа: наименее очевидный угол (Приложение в автоматизации)"
    visual:
      pattern: schema_quadrant

  - id: s15
    file: slides/s15-scenario-3-q.md
    type: quadrant
    assertion: "AI-ассистент в IDE: inline-подсказка следующей строки — куда его отнести?"
    learning_goal: "Сценарий 3/4 — постановка (голосование до ответа), тот же паттерн, что Copilot inline"
    visual:
      pattern: schema_quadrant_neutral

  - id: s16
    file: slides/s16-scenario-3-a.md
    type: quadrant
    assertion: "AI-ассистент в IDE: inline-подсказка следующей строки"
    learning_goal: "Сценарий 3/4 — раскрытие ответа: тот же паттерн, что Copilot inline (Приложение)"
    visual:
      pattern: schema_quadrant

  - id: s17
    file: slides/s17-scenario-4-q.md
    type: quadrant
    assertion: "Coding-агент: находит баг, правит код, коммитит — куда его отнести?"
    learning_goal: "Сценарий 4/4 — постановка (голосование до ответа), пара со сценарием 3"
    visual:
      pattern: schema_quadrant_neutral

  - id: s18
    file: slides/s18-scenario-4-a.md
    type: quadrant
    assertion: "Coding-агент: находит баг, правит код, коммитит"
    learning_goal: "Сценарий 4/4 — раскрытие ответа: пара со сценарием 3 (Агент)"
    visual:
      pattern: schema_quadrant

  - id: s19
    file: slides/s19-where-not-needed.md
    type: reflection_question
    assertion: "Где обычный код справился бы не хуже — и что делать при сбое AI?"
    learning_goal: "Обязательный вопрос всем классом — AI-Failure/Judgment content"
    visual:
      pattern: two_column_criteria

  - id: s20
    file: slides/s20-hallucination-intro.md
    type: assertion_visual
    assertion: "Один точный факт, одна убедительная выдумка — какая деталь подложена?"
    learning_goal: "Механика раздела 4 + честная маркировка + связка с Семинаром 1"
    visual:
      pattern: mechanic_plus_disclosure_plus_callback

  - id: s21
    file: slides/s21-round-1-python-q.md
    type: comparison
    assertion: "Когда вышел первый стабильный релиз Python и кто его автор?"
    learning_goal: "Раунд 1/3 — постановка вопроса (голосование до ответа)"
    visual:
      pattern: side_by_side_symmetric_cards_no_reveal

  - id: s22
    file: slides/s22-round-1-python-a.md
    type: comparison
    assertion: "Вариант Б — подделка: конференция CWI, которой не было"
    learning_goal: "Раунд 1/3 — раскрытие ответа: факт утоплен в выдуманном контексте"
    visual:
      pattern: side_by_side_symmetric_cards_plus_reveal

  - id: s23
    file: slides/s23-round-2-http2-q.md
    type: comparison
    assertion: "Что такое HTTP/2 и чем он принципиально отличается от HTTP/1.1?"
    learning_goal: "Раунд 2/3 — постановка вопроса (голосование до ответа)"
    visual:
      pattern: side_by_side_symmetric_cards_no_reveal

  - id: s24
    file: slides/s24-round-2-http2-a.md
    type: comparison
    assertion: "Вариант Б — подделка: HTTP/2 работает поверх TCP, не UDP"
    learning_goal: "Раунд 2/3 — раскрытие ответа: реальный факт смешан с придуманным утверждением"
    visual:
      pattern: side_by_side_symmetric_cards_plus_reveal

  - id: s25
    file: slides/s25-round-3-btree-q.md
    type: comparison
    assertion: "Какая структура лежит в основе B-дерева и какова сложность поиска?"
    learning_goal: "Раунд 3/3 — постановка вопроса (голосование до ответа)"
    visual:
      pattern: stacked_symmetric_cards_no_reveal

  - id: s26
    file: slides/s26-round-3-btree-a.md
    type: comparison
    assertion: "Вариант Б — подделка: происхождение буквы «B» реально спорно"
    learning_goal: "Раунд 3/3 — раскрытие ответа: ложная уверенность без единственно верного ответа"
    visual:
      pattern: stacked_symmetric_cards_plus_reveal

  - id: s27
    file: slides/s27-hallucination-reflection.md
    type: reflection_question
    assertion: "Три маски галлюцинации — какая была самой незаметной?"
    learning_goal: "Закрывающая рефлексия раздела 4"
    visual:
      pattern: three_pattern_recap_plus_question

  - id: s28
    file: slides/s28-failures-intro.md
    type: assertion_visual
    assertion: "Bias / sycophancy / distribution shift — та же тройка, новые примеры"
    learning_goal: "Recap определений + честная маркировка авторских виньеток"
    visual:
      pattern: three_concepts_with_note

  - id: s29
    file: slides/s29-vignette-1-bias-q.md
    type: case_study
    assertion: "Скрининг резюме DevOps-инженеров занижает кандидатов без диплома — почему?"
    learning_goal: "Виньетка 1/4 — постановка (голосование до ответа)"
    visual:
      pattern: story_no_answer

  - id: s30
    file: slides/s30-vignette-1-bias-a.md
    type: case_study
    assertion: "Скрининг резюме DevOps-инженеров занижает кандидатов без диплома"
    learning_goal: "Виньетка 1/4 — раскрытие ответа: bias"
    visual:
      pattern: wide_story_bottom_answer

  - id: s31
    file: slides/s31-vignette-2-sycophancy-q.md
    type: case_study
    assertion: "AI хвалит код с необработанным пустым массивом — почему?"
    learning_goal: "Виньетка 2/4 — постановка (голосование до ответа)"
    visual:
      pattern: story_no_answer

  - id: s32
    file: slides/s32-vignette-2-sycophancy-a.md
    type: case_study
    assertion: "AI хвалит код с необработанным пустым массивом"
    learning_goal: "Виньетка 2/4 — раскрытие ответа: sycophancy"
    visual:
      pattern: left_answer_right_story

  - id: s33
    file: slides/s33-vignette-3-shift-q.md
    type: case_study
    assertion: "Классификатор обращений тихо деградирует на новой линейке продуктов — почему?"
    learning_goal: "Виньетка 3/4 — постановка (голосование до ответа)"
    visual:
      pattern: story_no_answer

  - id: s34
    file: slides/s34-vignette-3-shift-a.md
    type: case_study
    assertion: "Классификатор обращений тихо деградирует на новой линейке продуктов"
    learning_goal: "Виньетка 3/4 — раскрытие ответа: distribution shift"
    visual:
      pattern: wide_story_bottom_answer

  - id: s35
    file: slides/s35-vignette-4-ambiguous-q.md
    type: case_study
    assertion: "Стажёр спрашивает про «любимую» библиотеку логирования — и получает согласие"
    learning_goal: "Виньетка 4/4 — постановка (голосование до ответа), намеренно пограничная"
    visual:
      pattern: dashed_gold_border_story_no_answer

  - id: s36
    file: slides/s36-vignette-4-ambiguous-a.md
    type: case_study
    assertion: "Оба ответа верны — sycophancy и distribution shift объясняют одно и то же поведение"
    learning_goal: "Виньетка 4/4 — раскрытие: намеренно пограничная (sycophancy + distribution shift), без единственного правильного ответа"
    visual:
      pattern: dashed_gold_border_dual_answer

  - id: s37
    file: slides/s37-closing-reflection.md
    type: reflection_question
    assertion: "Что опаснее в вашей будущей профессиональной области?"
    learning_goal: "Закрывающая рефлексия раздела 5"
    visual:
      pattern: three_colored_tiles_question

  - id: s38
    file: slides/s38-bridge-lec2.md
    type: assertion_visual
    assertion: "Сегодня — снаружи. Дальше — заглянем внутрь модели"
    learning_goal: "Лёгкий мостик к Лекции 2, без раскрытия темы заранее"
    visual:
      pattern: hook_card_plus_tag_row

  - id: s39
    file: slides/s39-handout-memo.md
    type: summary
    assertion: "Как выбрать тип AI за 60 секунд"
    learning_goal: "Итоговая памятка на вынос — компиляция без нового материала"
    visual:
      pattern: two_column_cheatsheet

  - id: s40
    file: slides/s40-hero-closing.md
    type: hero_closing
    assertion: "От классификации снаружи — к тому, что внутри"
    learning_goal: "Bridge к Лекции 2; emotional payoff; реальное фото GPU"
    visual:
      pattern: hero_closing_bridge_photo
      backup: assets/screenshots/s-closing-gpu-real.jpg
