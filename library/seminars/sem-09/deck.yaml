- id: n73
  file: slides/n73-k6-format-vs-sverka.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Проверка формата ответа поймала ноль из пятнадцати неверных дат; сверка с независимо известным
    значением поймала все пятнадцать, без единого ложного срабатывания
  learning_goal: 'Инженерный payload кейса: разбор между проверкой формата и сверкой с независимым значением
    на одних и тех же собственных данных замера. Два числа счёта неверных дат (0 из 15 и 15 из 15) разведены
    подписями по тому, что именно каждое из них ловит; третье число — 15 из 15 верных совпадений — физически
    отделено словом «верных», хотя знаменатель у него после добора измерения случайно совпал с первыми
    двумя.'
  visual:
    pattern: measured_outcome_table
    primary: 'Две плашки рядом, каждая с явной подписью, что именно поймано: «проверка формата — 0 из
      15 неверных» и «сверка с независимым значением — 15 из 15 неверных», плюс строка про отсутствие
      ложных срабатываний на 15 ВЕРНЫХ случаях — другой счёт, тот же знаменатель после добора (совпадение,
      не методическая связь). Под плашками — честная оговорка, откуда взяты эти числа.

      '
    backup: 'Числа — из `stend/zamery-k5-k6/README.md`, Замер 4.1, раздел «Сверка как средство защиты»:
      15 неверных дат (после добора измерения — по 5 на каждом из трёх самых мелких разрешений, размеры
      «одна восьмая», «одна шестнадцатая», «одна тридцать вторая») — все 15 валидны по формату ДД.ММ.ГГГГ,
      проверка схемы прошла бы их все. Независимая сверка с истинной датой квитанции (известной заранее,
      это собственный синтетический документ) ловит все 15 расхождений без единого ложного срабатывания;
      на 15 случаях, где дата была верна (размеры «исходный», «половина», «четверть»), то же сравнение
      не срабатывает ни разу — 15 из 15 верных совпадений.

      ЧЕСТНАЯ МЕТОДИЧЕСКАЯ ОГОВОРКА СТОИТ НА КАДРЕ, не только в backup: демонстрация построена на ДАТЕ,
      потому что на дате отказов больше и они начинаются раньше по шкале сжатия (15 из 30 попыток, начиная
      с восьмой доли); на СУММЕ этого замера отказов заметно меньше — 5 из 30, только на самом мелком,
      тридцать второй доле (такт n70) — но они есть, не нулевые, после честного повтора 2026-10-27 (issue
      #299). В настоящем кейсе независимое значение — это сумма, которую клиент написал текстом в заявке,
      не заранее известная истина генератора квитанции; эта сессия замера такую сверку не собирала (нет
      текстового поля с заявленной суммой в вебхуке измерения) — показан тот же механизм на поле, где
      отказов больше, не на поле, где их меньше.

      Два числа счёта неверных дат — «0 из 15» и «15 из 15» — разведены подписями «что поймала проверка
      формата» / «что поймала сверка»; третье число, «15 из 15 верных совпадений», физически отделено
      словом «верных» от первых двух, хотя знаменатель у него после добора измерения случайно совпал —
      это совпадение чисел, не методическая связь. Требование БРИФ §2.'
