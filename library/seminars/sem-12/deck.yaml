  visual:
    pattern: bridge_forward
    primary: 'Содержательный шов плашкой — куда падала цена ошибки сегодня и куда она падает на следующем
      шаге; под ней — примеры, которые зал уже видел на этом же закрытии, как иллюстрация того же сдвига.

      '
    backup: Текст — дословно sem-13/ARCHITECTURE.md §2, «Содержательный шов». Примеры-иллюстрации («семь
      запросов из двенадцати», «модель исчезла из каталога») — не придуманы для мостика, это находки нитей
      n82/n83 этого же закрытия, уже показанные залу минуту назад. Номер следующей ступени дуги не печатается
      — тот же приём, что у sem-10/slides/n83-mostik-k-s11.md и sem-11/slides/n103-mostik-vpered.md.
