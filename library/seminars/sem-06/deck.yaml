    primary: 'Таблица двух строк в три колонки: источник · тезис · сила доказательства. Под таблицей —
      короткий вывод-формула, закрепляющий, что цена не нулевая ни разу. Ниже — плашка честного пробела
      отдельной строкой.'
    backup: 'Источник — section-2-subagent.md §A.1 «Свидетельства» + «Честный пробел», дословно. Обе цифры
      (15× и 3–10×) из одного вендора в разное время — не противоречие, разные базы сравнения, сказано
