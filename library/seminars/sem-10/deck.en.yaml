  learning_goal: 'Beat S2 (summary) — a direct continuation of n09 (structure). The headline finding is
    pulled out into its own gold tile (rule A11). Tables are kept apart per S6: accuracy is a share, cost
    is dollars, recall is its own tile, not mixed into one cell.'
  visual:
    pattern: measured_outcome_table
    primary: 'Two compact 4×3 tables (base size · whole prompt · keyword · vector) — one for accuracy
      only, one for cost in dollars only — and a golden tile with the headline failure number at 500 documents.

      '
    backup: 'Numbers — SETKA-KEYSOV.md Case 1 / stend/raw/case1-results.json, 10 SberQuAD questions ×
      4 base sizes (10/50/200/500, 500 added by an extra pass on 2026-11-01 per the owner''s comment "the
      current measurement is too easy") × 3 options. The questions were rebuilt a second time on 2026-11-02
      (issue #311) with lexical_gap/exact_match/ neutral stratification (Case 3''s methodology) — the
      old 10 questions were almost all "exact match," which trivially gave keyword recall@1=1.0 and didn''t
      test what was claimed. "Accuracy" = strict substring containment of the gold short answer — this
      understates the absolute numbers EQUALLY for every option (methodological disclaimer — in the notes,
      not on screen). The HTTP 400 error text is verbatim from the `exec_id: "2483"` field, the run of
      this rebuild.

      TWO TABLES INSTEAD OF ONE (rule S6 — "one column, one dimension," canon `forma-keysa-s-zamerom.md`
      §6): accuracy (a share) and cost (dollars) in separate tables. Recall@1 gets its own tile, because
      keyword and vector behave differently on it (keyword holds 0.8 across all four sizes without change;
      vector holds 1.0 on three of four and dips to 0.9 at 500) — that''s no longer one fact shared by
      both, but two separate observations, and mixing them into one sentence would be wrong.'
- id: n11
  file: slides-en/n11-k1-razbor-oshibok.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: For keyword, Russian case endings throw off the word match at any base size — the cause isn't
    the base's scale, it's the method
  learning_goal: 'Beat S2/S3/S4 (breakdown by group, n10''s successor): an explicit verdict on every example
    (S3), a systematic error on its own tile (S4). The group here isn''t a type of action but a type of
    ERROR, found in the measurement data itself after the questions were rebuilt on 2026-11-02 (issue
    #311). Part 1 of 2 (n12 is the vector error): split so each error gets its own frame (issue #311,
    the 15pt type floor leaves no room for two tables on one slide).'
  visual:
    pattern: measured_outcome_table
    primary: 'A table of examples: keyword misses the document because of case endings, repeating at any
      base size. Every row carries an INCORRECT verdict; the conclusion sits under the table.

      '
    backup: 'The example is verbatim from `stend/raw/case1-results.json` (the `details` field) and `corpus/corpus_case1.json`
      (document texts), with no change to the model''s answers.

      Error 1 (q4, q10 — keyword): `retrieved_doc_id` does NOT match `gold_doc_id` at ALL FOUR base sizes
      identically, including size 10, where there are no distractors at all — so the cause isn''t the
      base''s scale, it''s the comparison method itself. q4: the question "by paleontologists... Eldredge
      and... Gould" (instrumental case in Russian) against a document reading "paleontologists Eldredge
      and Gould" (nominative case); the overlap with the correct document, needle-4, is just one word
      ("year"); keyword found needle-2 (about Mozart, off-topic) — also one shared word ("year"), a coincidental
      match on an everyday word; with a tied score, keyword picked the wrong document. q10: the question
      "the model of the universe... taken as a basis" against document needle-10, "the Keplerian model
      of the universe is based on Copernicus''s model" — the overlap with the correct document is one
      word ("universe"); keyword found needle-3 (about a marathon) — there TWO words matched, "model"
      (from the phrase "the whole training model") and "universe" (from the phrase "world championships"),
      and the 2-to-1 margin pulled the choice away from the correct document.'
- id: n12
  file: slides-en/n12-k1-razbor-oshibok-vector.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: For vector, at 500 documents, a neighboring paragraph of the same article turns out closer
    in meaning than the gold one — a labeling edge case, not a miss by the method
  learning_goal: 'Beat S2/S3/S4 (breakdown by group, n11''s successor): an explicit verdict on the example
    (S3), a systematic error on its own tile (S4), a conclusion (S10). Part 2 of 2 (continuing n11 — the
    keyword error). Letter suffix brought to the deck''s attention (tools/seminar-production/README.md
    §1, issue #311).'
  visual:
    pattern: measured_outcome_table
    primary: 'An example table: at 500 documents, vector finds a paragraph that is substantively relevant
      but formally incorrect, from the same article. Verdict INCORRECT, with a conclusion below the table
      about the nature of SberQuAD''s "distractors" at this scale.

      '
    backup: 'The example is verbatim from `stend/raw/case1-results.json` (the `details` field) and `corpus/corpus_case1.json`
      (document texts), with no change to the model''s answers.

      Error 2 (q3 — vector, only at 500 documents): the gold document is needle-3, about a marathon; at
      500 documents vector finds `distractor-237` instead — judging by the shared footnote [17] in both
      texts, likely a neighboring paragraph of the SAME Wikipedia article about the marathon, which contains
      the literal numeric answer ("times get worse... above 14-16°C"), unlike needle-3, where the fact
      is phrased in general terms ("high temperatures... keep the best results out of reach"). The model
      answered confidently and sensibly in substance, but against the gold labeling — incorrectly. On
      this same question, keyword found the CORRECT document (needle-3), but the model still answered
      "no information" — because the literal number wasn''t in the text it found; it sat in the neighboring
      paragraph, which in this run went to distractor-237.

      METHODOLOGICAL CONCLUSION (say it out loud, don''t hide it): at a scale of 500 documents, part of
      SberQuAD''s "distractors" are actually neighboring paragraphs of the same article as the needle
      document. Formally having a single `gold_doc_id` doesn''t mean the rest of the corpus is irrelevant
      to the topic — recall@1 against one gold answer here understates the fact that the search found
      a substantively relevant text, just not that specific paragraph where the number lives.'
