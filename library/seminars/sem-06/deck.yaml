    копия: в каталоге одна ветка на всех, и переключение её меняет файлы под чужими руками. Зал пока не
    знает ни про отдельную копию, ни про то, что внутри одной сессии такой копии нет'
  visual:
    pattern: problem_scenario
    primary: 'Сверху — короткая строка о состоянии на входе: начатая и незакоммиченная правка. Четыре
      шага одной истории нумерованным списком: вторая сессия в том же каталоге, её собственная ветка,
      два отчёта об успехе, утренний разбор. Внизу — выделенная строка цены.'
    backup: 'Круг 5 (issue 225): сцена написана заново, прежняя (три недели расходящихся формулировок
      у диф-ревьюера) снята вместе с кейсом специализации. Герой — сквозной герой занятия (n01/n04), проект
      тот же вымышленный `signup-landing`; проверяемых цифр сцена не вводит. Поведение git в сцене — штатное
