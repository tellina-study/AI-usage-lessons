  learning_goal: 'Завязка кейса, перевёрнутая по сравнению со снятым прежним материалом: параллелизм показан
    как причина получить выгоду, не как фон, на котором что-то сломалось. Та же фактура (диф-ревьюер,
    три независимых изменения формы), что раньше стояла при сбое — сохранена по составу, переосмыслена
