  learning_goal: 'Открытый вопрос кейса: спрашивается действие, а не условие. Развилка спрашивает не «угадайте
    слово», а «обоснуйте выбор»: слово уже звучало в базе, и слайд это признаёт вслух. Карточка про сокращение
