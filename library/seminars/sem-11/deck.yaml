      RAG-систему для эксперта по охране труда», 2026-02-17, habr.com/ru/articles/1000424/ — на сюжет
      Ольгиного учебного центра (случай «Марк» по охране труда), тем же приёмом, которым Семинар 10 перенёс
      SberQuAD/CORD на заявки Ольги (sem-11/ARCHITECTURE.md §6). Числа Habr-случая (LLM-Score 0,72->0,92)
      в это занятие не переносятся — наш собственный замер измеряет свои числа на своём корпусе, разбор
      дальше.'
