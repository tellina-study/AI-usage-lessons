      — picture size before/after moderate compression ahead of sending to the content- check model, with
      a warning about reading text on the picture.

      '
    backup: 'The order "mechanical → model" isn''t arbitrary: the mechanical check is essentially free
      (a condition over a number) and deterministic, while any model call doing image recognition costs
      real money per call (a separate figure from the GENERATION cost on n51 — the checking model''s input
      is priced by image input tokens, not on the same scale as output generation, and this specific price
      wasn''t estimated here, to avoid mixing two different pricing models without verification); putting
      the cheap filter first saves model calls on files that won''t pass by format or size anyway — the
      same economy logic as Case 2''s hybrid solution (hash first, jev on what''s left), carried over
      to a picture. The answer about compression is VERBATIM from the voice-edit brief (`qa/BRIEF-GOLOSOVAYA-PRAVKA-2026-10-20.md`,
      lines 180-196, "Case 4 research question — answer (WebSearch, not invented)"): 4032×3024 uncompressed
      ≈1500 tokens, the same image at 720×540 at JPEG Q85 ≈300 tokens — a fivefold saving; the caveat
      about OCR-like tasks and the ~1024 px limit on the longer side — the same quote, the numbers weren''t
      changed. The source is marked on the slide as "public sources," not as a measurement on this rig
      — the checking model itself isn''t built on the rig (see n49/n51), so the token saving can''t be
      confirmed by our own run, only honestly cited.'
