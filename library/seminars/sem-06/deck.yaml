  duration_min: 1.25
  assertion: 'Отдельная роль — процесс со своим контекстным окном, вызываемый на одну задачу: вызов по
    имени или по описанию решает маршрутизацию, задача и возвращаемый итог идут текстом, а список инструментов
    решает, что роль может сделать физически'
  learning_goal: База инструмента до первого кейса этой ступени. Вводит три понятия (контекстное окно,
    итог без промежуточных действий, список инструментов) и переносимость приёма между продуктами — без
    привязки терминологии к одному вендору
  visual:
    pattern: base_and_edge
    primary: Две дорожки. Слева под пометкой «БАЗА» — определение одним предложением и три понятия с пояснением
      на месте. Справа — что решает маршрутизацию и что физически доступно роли. Под базой — переносимость
      приёма между продуктами. Три термина пилюлями.
    backup: 'Источник — section-2-subagent.md §A.1 «База» (таблица «БАЗА / ЧТО РЕШАЕТ ИСХОД») + абзац
      про переносимость, дословно по содержанию; раздел собран по форме sem-05/slides/n08 (две колонки,
      термины пилюлями, кромка — что решает исход). Переносимость названа до разбора кейсов по тому же
      мотиву, что в n37 исходника (part1b, Справка): чтобы приём не прочитался как универсальный стандарт
      раньше времени — материал ступени привязан к одному продукту.'
- id: n38
  file: slides/n38-vopros-chto-zavesti-ryadom-s-delegirovaniem.md
  type: reflection_question
  duration_min: 1.0
  assertion: Делегирование уже бесплатно, а формулировка расходится и один раз сработала против результата
    — зал выбирает, что завести, и обосновывает выбор рядом с четырьмя соседними карточками
  learning_goal: Открытый вопрос первого кейса. Слово «субагент» впервые названо прямо на одной из карточек
    — развилка требует обоснования выбора при четырёх настоящих соседях, целевого ответа на слайде нет,
    разбор идёт следующим слайдом
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — подводка в одну строку: делегирование уже бесплатно и ничего не требует
      настраивать. Ниже — сам вопрос в золотой рамке: обращение к залу и требование обосновать выбор при
      четырёх соседних карточках. Под ним — пять равных карточек в фиксированном порядке, ни одна не выделена.'
    backup: Вопрос и карточки — section-2-subagent.md §A.1 «Вопрос классу» + section-2-subagent-part1b.md
      n38, дословно. Состав карточек — пять настоящих вариантов, разбор каждого на следующем слайде. Слово
      «субагент» стоит на четвёртой карточке — первое явное называние термина в этом блоке.
- id: n39
  file: slides/n39-razbor-granitsa-razovoy-proverki-i-roli.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Все пять вариантов работают в своих случаях; граница, которая решает исход, проходит между
    разовой проверкой и ролью, которая повторяется настолько, что стоит зафиксировать её формулировку
    и отнять у неё лишнее
  learning_goal: 'Разбор всех пяти карточек в единой форме: вариант · где работает — конкретные случаи
    · ограничения. Первая карточка получает частичное признание; вывод выводится из сочетания колонок,
