- id: n29
  file: slides/n29-k3-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Правило работает месяц без единой жалобы — вопрос в том, как добиться, чтобы решение о пороге
    действительно никогда не принималось неверно
  learning_goal: 'Вопрос кейса 3: ЧЕТЫРЕ действия-выбора (было пять — см. backup, карточка «большинство
    голосов» убрана голосовой правкой 2026-10-20, issue #274), каждое проходит проверку §5 канона (подстановка
    повелительного глагола — написать/дать/поставить/сделать); без доводов и вердиктов рядом с карточками
    (А6/А12).'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху короткое напоминание сцены. Под ним вопрос в золотой рамке и ряд из ЧЕТЫРЁХ карточек
      равной ширины. Доводов и подсказок нет — разбор экраном позже.

      '
    backup: 'ИЗМЕНЕНИЕ (голосовая правка 2026-10-20, issue #274, BRIEF-GOLOSOVAYA §«Кейс 3»): было 5 карточек,
      владелец явно попросил вернуть 4 («убрать странный 5-й пункт... 4 варианта вполне нормально»), без
      указания, какую именно — решение принято здесь, с обоснованием.

      **Убрана карточка «прогнать несколько раз и взять большинство голосов».** Не потому что она похожа
      на другую (калькулятор и `IF`-узел — РАЗНЫЕ ответы, сливать их нет оснований, и мы их не сливаем).
      Убрана потому, что она логически слабее трёх оставшихся кроме IF-узла: сам эксперимент (n31–n32)
      уже доказывает про неё не «ограниченную пользу», а НУЛЕВУЮ. Ошибка версии 1 — систематическая: модель
      раз за разом одинаково неверно трактует саму границу условия. Голосование большинством защищает
      только от случайного шума — против систематической ошибки оно размножает ту же неверную интерпретацию,
      а не исправляет её. У трёх других действий — даже у ограниченных — есть хотя бы частичная ценность:
      «яснее правило» измеримо снижает (на практике даже снимает, см. n30) конкретно найденную неоднозначность;
      «калькулятор» честно измерен и честно хуже (n30); «числовое поле» снимает риск полностью там, где
      применимо. «Большинство голосов» не добавляет залу ничего, чего не закрыл уже сам эксперимент —
      оставлять её пятым вариантом значило бы тратить карточку на то, что уже решено, вместо новой развилки
      для рассуждения. Полная сводка всех вариантов и их измерений — `stend/refund-case3-all-variants-
      results.json`, раздел `card_majority_vote_REMOVED`.

      Четыре оставшихся — действия, не факты о модели (§5 канона): каждая карточка называет, ЧТО сделать
      с процессом, а не ЧТО умеет или не умеет модель.'
