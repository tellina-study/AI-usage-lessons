    duration_min: 1.5
    assertion: "Способы реализации систем с AI: не альтернативы, а слои"
    learning_goal: "Слоистая mental model для раздела 3 — каждый следующий слой включает предыдущий"
    learning_outcomes: [LO1, LO4]
    references: [anthropic-2024-effective-agents, weng-2023-agents]
    visual:
      pattern: nested_layers_diagram
      primary: "4 концентрических слоя (модель → чат → агент → приложение) с подписями компонентов; явная фраза «не альтернативы, а слои»"

  - id: s12
    file: slides/s12-classification-task-modality.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "Классификация AI-систем — две оси: тип задачи × модальность"
    learning_goal: "Дать рабочий язык для дальнейшего разбора типов реализаций"
    learning_outcomes: [LO1]
    references: [russell-norvig-2021, goodfellow-2016-dl]
    visual:
      pattern: 2d_classifier_matrix
      primary: "2D matrix: ось X — тип задачи (классификация / генерация / поиск / распознавание / прогноз / планирование), ось Y — модальность (текст / изображение / звук / видео / структурированные данные / код); 3 примера в ячейках (Translate / AlphaFold / YOLO)"

  - id: s13
    file: slides/s13-control-quadrant-3-ways.md
    type: comparison
    duration_min: 3.5
    assertion: "Одна задача, три способа: контроль распределяется между разработчиком и пользователем"
    learning_goal: "Слоистая модель через сравнение Model→Chat→Agent через квадрант контроля"
    learning_outcomes: [LO1, LO4]
    references: [anthropic-2024-effective-agents]
    visual:
      pattern: control_quadrant_2x2_with_task
      primary: "Сверху квадрант 2×2: X=Делегирование от пользователя (низкий→высокий), Y=Контроль разработчика (низкий→высокий); Модель=левый-нижний (низкий разраб + низкое делегирование), Чат=центр, Агент=правый-верхний (высокий разраб + высокое делегирование) в gold; пустые углы — «опасная зона» (правый-нижний) и «нет смысла» (левый-верхний); фиксированная задача снизу"
    interaction: live_demo

