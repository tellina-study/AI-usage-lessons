      `meta-llama/llama-3.1-8b-instruct`, `mistralai/ministral-8b-2512`) plus a decider on a fourth call
      to the same `qwen/qwen-2.5-7b-instruct` that plays the judge in the other rows — the decider-judge
      identity is named outright, so the difference in numbers doesn''t read as a difference in models.

      ACCURACY IS NAMED EXPLICITLY (C6): "converged/20" for code/judge/combination — the same numbers
      as on n39/n40a; for the mixture of experts — 20/20 under the LENIENT check (fixed for fragility
      to Russian morphology), noted that the literal (unhelpful) version of the check gave 14/20 — this
      is a finding about the check, not about the decider, see n32 and the report.

      COST — by OpenRouter''s price list for `qwen/qwen-2.5-7b-instruct`, read directly from `GET https://openrouter.ai/api/v1/models`
      with no authorization, on 2026-10-27 (code/judge/combination) and 2026-10-29 (mixture of experts):
      $0.0000001/input token, $0.0000002/output token for qwen (the mixture''s experts have their own
      models at their own prices; the total cost already accounts for that). This is the price list on
      the date of measurement, not an account billing statement.

      WHY THE MIXTURE OF EXPERTS'' COST IS NEARLY EQUAL TO THE COMBINATION''S, WHILE RELIABILITY DIFFERS:
      both cost 4.0 calls per question, but the combination reaches that number through a LOOP (retrying
      on disagreement), while the mixture of experts is ALWAYS EXACTLY 4.0 — a question is never cheaper
      or more expensive than its own difficulty. Predictable cost is the mixture of experts'' only real
      win, and it does not mean it''s more reliable: its 100% on this check rests on 50% stability to
      option order (n32), not on an independent quality assessment of each expert.'
