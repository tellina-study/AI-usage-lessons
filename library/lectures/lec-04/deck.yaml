# Р0 s01–s07 (введение + методическая рамка) · Р1 [s08] s09–s11 (требования) ·
# Р2 [s12] s13–s15 (архитектура) · Р3 [s16] s17–s21 (реализация) ·
# Р4 [s22] s23–s24 (тестирование) · Р5 [s25] s26–s31 (ревью+безопасность) ·
