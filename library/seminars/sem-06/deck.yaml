      разбор n16): владелец назвал прежний слайд («Вычеркнутая строка — та самая, без которой атака не
      проходит») умствованием с выдернутым контекстом — заголовок отсылал к экрану со-сборки вместо того,
      чтобы прямо сказать, о каком риске речь, а термин «смертельное трио» в таблице (слой 2) использовался
      раньше, чем на слайде появлялось его определение (плашка стояла ПОСЛЕ таблицы). Правка: заголовок
      прямо называет случившееся («чужая инструкция... заставила агента опубликовать приватный код»),
      плашка с определением трио переставлена перед таблицу — к моменту, когда слой 2 трио упоминает,
      оно уже названо. Факты, числа и даты не менялись ни на знак. Пересмотр по сторителлингу (issue 225,
      П6): слот 2,75 → 2,25 (речь 1,39 мин укладывается с запасом; отданные 0,5 мин ушли на n15), речь
      сокращена с 236 слов до 180. В справку добавлен возврат к сцене n09 — тот же поток чужого текста,
      в котором в сцене потерялась строка требования, здесь несёт чужую инструкцию. Факты, числа, даты
      и источники не менялись.'
- id: n17
