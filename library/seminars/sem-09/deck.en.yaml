- id: n25a
  file: slides-en/n25a-k2-kesh-svod.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: A cache read costs 0.107 of a direct read -- confirmed. But only three of the five models
    hand caching back at all, and our real knowledge base doesn't even reach the threshold on two of them
  learning_goal: 'Beat S2-2 (outcome round-up, review 2026-10-29): totals by provider, in big numbers,
