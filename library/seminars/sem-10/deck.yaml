      МОДЕЛЬ НАЗВАНА ПО ИМЕНИ (С5): `text-embedding-3-small` (эмбеддинг запроса, узел «Embed query») и
      `gpt-4o-mini` (реранкер, узел «LLM-реранкер») — обе видны прямо в подписи узла на холсте, в отличие
