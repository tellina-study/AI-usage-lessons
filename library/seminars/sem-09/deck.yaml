    pattern: mechanism_node_graph
    figure: k1-shema-samootchet-i-geyt.png
    primary: 'Две панели на одном кадре, читаются одним взглядом, построчно по трём вопросам слева: что
      делает модель · где записано решение · кто может его проверить. Слева «Версия 1 — решение внутри
      текста ответа», справа «Версия 2 — решение в отдельном поле». Палитра Ocean, кегль не ниже 7,5 pt.
      БЕЗ нижней строки с результатами прогонов — см. backup. Текста вокруг фигуры минимум: фигура сама
      несёт сопоставление, проза его не повторяет (правка волны 3, К1-8 по соседству — фигура прежде зажималась
      соседним текстом, который пересказывал её же три строки).

      '
    backup: 'ИМЯ ФИГУРЫ СМЕНЕНО решением оркестратора по ходу волны. Было две схемы на один такт (`k1-shema-samootchet.png`
      и `k1-shema-geyt.png`), а такт слоя 1 в карте §4 один — и правилось это не добавлением слайда, а
      сведением обеих форм в ОДНО сопоставление на одном кадре: `k1-shema-samootchet-i-geyt.png`. Основание
      — правило курса «сопоставление читается с одного взгляда» (CLAUDE.md, «Форма подачи слайда»); владелец
      называл его отсутствие системной ошибкой.

      Устройство обеих панелей — по SETKA-KEYSOV-S9.md, раздел «Кейс 1», подразделы «Постановка» и «Решение»,
      и по `stend/sborka.py`, функции `case1_v1` и `case1_v2`, то есть по настоящему составу сценариев
      на стенде.

      Имён узлов, имени оркестратора и латиницы на схеме нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящие холсты и настоящие панели — n10, n11,
      n14, n15.

      Порядок рассказа при этом НЕ нарушен (§4 канона: история одной итерации, а не два заранее поставленных
      опыта). Обе формы названы здесь только как устройство — так же, как они уже названы на разборе n08
      среди четырёх действий. Собирать и мерить мы продолжаем по очереди: версия 1 (n10–n11), её прогоны
      (n12–n13), затем самый дешёвый промежуточный ход — уверенность числом и порог, измеренный первым
      и отдельно (n13a, правка владельца 2026-10-27) — и только после него версия 2 (n14–n15). Правая
      панель этого кадра остаётся верной и для n13a: решение там тоже лежит в структурированном поле,
      которое сверяет код, просто поле другое — число, а не пункт базы.

      ПРОТЕЧКА В САМОЙ ФИГУРЕ — НАЙДЕНА 2026-10-26, ПРАВИТСЯ НЕ ЗДЕСЬ. Готовая `rendered/figures/k1-shema-samootchet-i-geyt.png`
      несёт нижнюю строку «Чего это стоило» с измеренными числами: **6 из 15** под версией 1 и **4 из
      15 · 2 из 15** под версией 2. Это весь итог тактов n12, n13 и n16 целиком, предъявленный на четыре
      экрана раньше — до того, как зал увидел хоть один прогон. Такая строка обнуляет и n13, и n16 ровно
      так же, как протечка на карточке обнуляет голосование (А6), только уровнем выше. Туда же попала
      и подпись под заголовком: «пятнадцать трудных вопросов (тема в базе есть, деталь другая)» — это
      постановка трудного случая, её вскрывает n13.

      ЧТО НУЖНО ОТ ФИГУРЫ НА ЭТОМ ТАКТЕ: верхние три строки сопоставления (что делает модель · где записано
      решение · кто может его проверить) — они и есть то сравнение «с одного взгляда», ради которого схемы
      сводили в одну. Нижнюю строку с числами и уточнение про пятнадцать трудных вопросов снять. Полный
      вариант с числами — законный кадр, но для такта ПОСЛЕ прогонов (n16 или n17), не для слоя 1.

      Это ровно тот случай, о котором предупреждает канон §7: подписи внутри схем — пиксели, и греп по
      собранной деке даёт по ним ноль. Мой греп по тринадцати файлам нашёл 0 протечек; число лежало в
      картинке. Искать такое надо в исходнике рисовалки — `rendered/make_figures_k1.py`.'
- id: n10
  file: slides/n10-k1-n8n-versiya1.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящий холст версии 1: четыре узла главного пути и ни одной развилки после модели'
  learning_goal: 'Слой 2 для версии 1 (§2 канона замысла кейса): настоящий снимок живого стенда с настоящими
    именами узлов, не стилизованная схема. На кадре видно главное свойство версии — после модели путь
    один.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-holst-v1.png
    primary: 'Настоящий снимок холста n8n живого стенда, широкий кроп главного пути: `Client question`
      → `Answer (free self-report)` → `Write row` → `Result screen`, и отдельно снизу подвешен узел модели
      `Model (answer, free)`.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case1-v1-canvas.png`, снят `stend/n8n_shots.py`
      на `n8n.lessons.tellian.io`. Стилизованной карточки вместо снимка здесь нет (БРИФ §5, [[no-mock-fallbacks]]).

      ПОМЕТКА «MODEL*» СНЯТА С КАДРА правкой 2026-10-29 (РАЗБОР, К1-9: «убрать мусор: звёздочки, пометки
      „модель*“. Обсуждали 100 раз»). Она видна на самом снимке холста (это свойство интерфейса n8n, снимок
      не трогаем), но текст слайда её больше не комментирует — абзац про смысл звёздочки снят целиком,
      а не сокращён.

      МОДЕЛЬ НАЗВАНА ПО ИМЕНИ (С5): `qwen/qwen-2.5-7b-instruct`, вызов без явно заданных настроек — `stend/sborka.py`,
      `ANSWER_MODEL`. Холст показывает только generic-имя узла `Model (answer, free)`; имя самой модели
      на картинке не видно (оно в учётных данных узла, а не в его подписи), поэтому называется текстом
      слайда.

      ТРЕБОВАНИЕ К КРОПУ, адресовано сессии, которая готовит фигуру: на исходном кадре левую треть закрывает
      всплывающая панель `Production Checklist` (три пункта про настройку уведомлений об ошибках). В кадр
      она попадать НЕ должна — область левее узла `Client question` отрезается. Хлебная крошка сверху
      содержит название сценария и в кроп не берётся; id сценария на исходном кадре не виден нигде (канон
      §3).

      Что на кадре видно буквально и о чём поэтому можно говорить: четыре узла главного пути в один ряд,
      подвешенный снизу узел модели, пометка `Model*` под узлом ответа, и — главное — после узла ответа
      ни одной развилки: стрелка одна, и ведёт она прямо к записи строки.

      Что на кадре НЕ видно и поэтому прозой рядом не утверждается: текст промта. Холст показывает карточки
      узлов, а не их открытые настройки. Панель настройки — отдельным экраном (n11), с собственным снимком.
      Это прямое следствие правки владельца 2026-10-20 по Семинару 8: не просить зал верить тексту слайда
      там, где снимок этого не показывает.'
