    type: section_divider
    duration_min: 0.25
    assertion: "Ступень 5 — доступ наружу: первые две ступени укрепляли то, что уже было внутри репозитория, а issue, которые нужно прочитать агенту, физически лежат снаружи и меняются без разработчика"
    learning_goal: "Разделитель ступени 5 (macro-уровень: gold 5-сегментный прогресс-бар пяти ступеней занятия, сегмент 3 — MCP). Тег называет масштаб кейса, не его исход"
    visual:
      pattern: section_divider_macro
