# Доступ наружу и урезанная роль
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n05    5.75 мин
#   MCP        n06–n32   38.00 мин
#   Субагент   n33–n59   34.75 мин
#   Сборка     n60–n63    6.00 мин
#   ИТОГО                  84.50 мин при слоте ?

deck:
  title: Доступ наружу и урезанная роль
  duration_min: 84.5
  central_question: 'Работу сегодня подтверждает не ваш агент: сервер сообщает "подключён", роль сообщает
    "сделано". Чем такое сообщение отличается от факта?'
  slide_count: 63
  axis: Две строки оси закрыты — хук и скилл, у каждой названо, чего от неё ждали и что вышло на деле;
    MCP, субагент и процесс остаются пустыми — сегодня закрываются ещё две
slides:
- id: n01
  file: slides/n01-oblozhka-vopros-zanyatiya.md
  type: hero_cover
  duration_min: 0.75
  assertion: Работу занятия подтверждают два чужих сообщения — статус сервера и вердикт роли, — и оба
    можно получить без единого факта за ними; весь час разбирает, чем такое сообщение отличается от факта
  learning_goal: 'Открытие одним центральным вопросом, без разгона и без оглавления. Занятие продолжает
    предыдущее, не начинается заново: вопрос держится на состоянии, которое зал увидит на следующем слайде,
    а не на памяти о прошлом занятии'
  visual:
    pattern: hero_cover
    figure: ramka-n01-hero-sem06.png
    primary: 'Тёмный Ocean-фон, тот же приём, что у обложки прошлого занятия. Крупный заголовок, под ним
      одна ведущая строка тихой формой реплики, затем вопрос занятия в золотой коробке. Нижняя треть во
      всю ширину — hero-схема (≥40% площади слайда), продолжающая иллюстрацию обложки прошлого занятия,
      не новая картинка с нуля: слева белая карточка «сообщение» с двумя подписями одна под другой — «сервер:
      подключено» и «роль: сделано» — от неё пунктирная стрелка со знаком вопроса к правой карточке «факт»
      с незалитой галочкой (вопрос задаётся, не отвечается). Под этой парой — ряд из пяти сегментов: первые
      два (хук, скилл) залиты приглушённым серым с подписью «закрыты в прошлый раз», следующие два (MCP,
      субагент) залиты gold с замком и подписью «сегодня — две из пяти», последний (процесс) — пунктиром,
      подпись «впереди».

      '
    backup: 'Схема рисуется программно (тот же рендерер фигур, что строил иллюстрацию прошлого занятия;
      конкретный скрипт и путь к файлу назначает сессия сборки деки) — не фотография и не скриншот. Это
      законный путь для hero-иллюстрации: схема, нарисованная кодом, не выдаёт себя за внешний источник
      и ничего не подделывает, в отличие от стилизованной карточки с подписью вместо настоящего изображения.
      Пять сегментов нижнего ряда — это ось занятия (см. n03/n60), не отдельная придумка: тот же порядок
      строк, что на вопросе и на карте. Фотографий и внешних изображений для обложки не использовано и
      не искалось — по решению автора блока: вопрос занятия ссылается только на устройство самого занятия
      (сервер против роли), а не на внешний сюжет, который фотография могла бы изображать.'
- id: n02
  file: slides/n02-gde-my-ostanovilis.md
  type: code_artifact
  duration_min: 1.25
  assertion: Хук подтверждён коммитом на отдельной ветке, не в main; скилл остаётся только планом; главная
    ветка не содержит ни одного из них — с этого состояния продолжается занятие
  learning_goal: 'Состояние репозитория, прочитанное с экрана, а не восстановленное по памяти о прошлом
    занятии: что на главной ветке, что на ветке с хуком, и где проходит честная граница между «подтверждено
    коммитом» и «только план»'
  visual:
    pattern: file_tree_snapshot
    primary: 'Ведущая строка про то, с какой точки занятие продолжается. Под ней — моноширинный листинг
      двух веток репозитория одна под другой: `main` (пусто) и `seminar-5-hook` (хук коммитом, скилл планом).
      Внизу подписью во всю ширину — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.1, проверено прямым чтением дерева (`ARCHITECTURE.md`
      §3): на ветке `main` каталога `.claude/` нет вовсе, `CLAUDE.md` — 24 строки / 4 раздела; на ветке
      `seminar-5-hook`, коммит `9803643`, лежат `.claude/settings.json` и `.claude/hooks/selftest-branch-guard.sh`,
      `CLAUDE.md` подрос до 40 строк / 5 разделов — все три подтверждены коммитом; файл `.claude/skills/deploy/SKILL.md`
      существует только в плане раздела скилла, коммита у него нет ни на одной ветке. Важная деталь: хук
      подтверждён коммитом, но этот коммит лежит на отдельной ветке, не в `main`. Главная ветка — та,
      которую увидит любой, кто просто клонирует репозиторий без указания ветки, — ничего из этого не
      содержит. Это не ошибка и не недоработка: занятие о доступе наружу и урезанной роли начинается именно
      с этой честности.'
- id: n03
  file: slides/n03-os-dve-stroki-zakryty.md
  type: recap_table
  duration_min: 1.25
  assertion: Две строки оси закрыты — хук и скилл, у каждой названо, чего от неё ждали и что вышло на
    деле; MCP, субагент и процесс остаются пустыми — сегодня закрываются ещё две
  learning_goal: 'Контрольная точка, с которой занятие продолжается, а не новая сборка: та же таблица,
    что закрыла прошлое занятие, дословно, без изменений в заполненных строках'
  visual:
    pattern: recap_table
    primary: 'Светлый фон и коробка-таблица, не сетка PPTX. Таблица на пять строк и четыре колонки: две
      верхние (хук, скилл) заполнены целиком, три нижние (MCP, субагент, процесс) — пунктирные пустые
      слоты. Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.2. Таблица, закрывшая прошлое занятие (файл `os-dve-stroki-zakryty.md`
      деки Семинара 5, слайд номер 65 той деки), предъявляется дословно, без изменений в формулировках
      двух заполненных строк — зал видел её в конце прошлого занятия, и переписывать её заново здесь означало
      бы выдавать повтор за новую работу. Порядок строк — хук, скилл, MCP, субагент, процесс — тот же,
      что на вопросе следующего слайда и на карте занятия; не меняется, на этом совпадении держится возврат
      вопроса в блоке 3.'
- id: n04
  file: slides/n04-vopros-soobschenie-ili-fakt.md
  type: reflection_question
  duration_min: 1.25
  assertion: 'Работу занятия подтверждает не агент зала: сервер сообщает «подключён», роль сообщает «сделано»
    — вопрос о том, чем такое сообщение отличается от факта, прозвучит сегодня дважды'
  learning_goal: 'Рамочный вопрос занятия, первое предъявление: без карточек-вариантов, без оценки ответов.
    Опирается только на то, что уже на экране — ось называет все пять строк по имени, карта занятия следом
    назовёт MCP и субагента'
  visual:
    pattern: reflection_question
    primary: 'Завязка — тихой формой реплики. Сам вопрос — дословно, крупно, в gold-рамке, вместе с обещанием
      второго предъявления. Карточек-вариантов на слайде нет: голосование из вариантов здесь не повторяется.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.3. Формулировка — рабочий вариант A, утверждённый
      на гейте A; в отчёте того же файла перечислены два альтернативных варианта (B, C) с обоснованием
      выбора A — дословное продолжение тезиса `ARCHITECTURE.md` §6 («разница между "подключено" и "работает",
      между отчётом и фактом»). Вопрос задаётся до первого кейса и предъявляется дословно второй раз в
      блоке 3 (n62) — на совпадении формулировки держится петля. Вопрос не называет MCP и субагента по
      имени: термины вводит база каждого блока перед его первым кейсом; ось (n03) уже называет все пять
      строк по имени, карта занятия (n05) следом покажет имена MCP и субагента.'
- id: n05
  file: slides/n05-karta-dva-bloka-shest-keysov.md
  type: lecture_map
  duration_min: 1.25
  assertion: 'Два блока сегодня, каждый с тремя кейсами: верхняя строка каждой карточки — наблюдаемая
    проблема, нижняя — «решаем», без ответа'
  learning_goal: 'Карта занятия: куда идём внутри сегодняшних двух блоков. Названия кейсов взяты словами
    заголовков их дивайдеров, без переформулировки и без ответов на карточках'
  visual:
    pattern: lecture_map
    primary: 'Два блока в порядке разбора, без минут и без методических пометок. Таблица 2×3: строка —
      блок, столбец — кейс. Верхняя строка каждой карточки — наблюдаемая проблема, слово в слово с половиной
      заголовка дивайдера кейса; нижняя — «решаем». Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.4. Подставлено при сшивке из заголовков дивайдеров
      `section-1-mcp.md` §A.1.1/§A.2.1, `section-1-mcp-part1b.md` §A.3.1 и `section-2-subagent.md` §A.1/§A.2/§A.3
      — сверено посимвольно при сшивке, расхождений не найдено. Процесс (пятая строка оси) на карте не
      изображается строкой-карточкой: она остаётся впереди, карта называет только то, что происходит сегодня.'
- id: n06
  file: slides/n06-chto-delat-kogda-dannyh-net-v-repozitorii.md
  type: section_divider
  duration_min: 0.5
  assertion: Всё, что мы заводили в проекте до сих пор, лежало внутри репозитория; теперь агенту регулярно
    нужны данные, которые физически находятся снаружи и меняются без нашего участия
  learning_goal: Развилка первого кейса блока. Заголовок называет наблюдаемую проблему и обещание решения;
    слова «сервер» и «MCP» не звучат — инструмент решения скрыт за наблюдаемой проблемой, тем же приёмом,
    что у хука на прошлом занятии
  visual:
    pattern: section_divider_macro
    tag: 4 хода сборки · 2 слоя провала
    primary: Тёмный Ocean-фон, заголовок в две строки, золотая линия под ним. Ниже — смысловая строка,
      затем тег. Внизу — дорожка кейсов блока.
    backup: 'Источник — rework/section-1-mcp.md §A.1.1, §B.1 (part1c.md). Заголовок дословно из плана,
      правило А2 (наблюдаемая проблема + обещание решения, инструмент не называется). Тег считает со-сборку
      (§A.1.6: 4 хода — операции, вычёркивание прав, ключ, область видимости) и слои провала (§A.1.9:
      эксфильтрация + DNS rebinding). Кейс 1 раздела перенесён из sem-05/rework/section-3-mcp.md без изменения
      содержания — проверено фактчеком, qa/fact-check-mcp.md §1, полное совпадение по датам и числам.'
- id: n07
  file: slides/n07-stsena-issue-vmesto-messendzhera.md
  type: problem_scenario
  duration_min: 1.25
  assertion: Заказчик заводит задачи и баги как issue прямо в репозитории; разработчик копирует текст
    в чат агенту и переносит результат обратно руками — несколько раз в неделю
  learning_goal: 'Завязка первого кейса: наблюдаемая проблема без решения. Зал видит растущую вручную
    операцию и ещё не знает, чем её заменят'
  visual:
    pattern: problem_scenario
    primary: Сверху — тихой формой подводка о заказчике и issue. Ниже — три шага одного и того же цикла
      нумерованным списком. Под ними выделенная строка о частоте и о том, что список задач физически находится
      снаружи репозитория.
    backup: Источник — rework/section-1-mcp.md §A.1.2, §B.2 (part1c.md). Перенесено из sem-05/rework/section-3-mcp.md
      §A.2 без изменения содержания — кейс 1 прошёл четыре круга правок и проверку фактов на прошлом занятии.
- id: n08
  file: slides/n08-baza-tri-primitiva-kto-initsiiruet.md
  type: base_and_edge
  duration_min: 1.0
  assertion: 'MCP — протокол, по которому агент подключается к внешней системе и получает три вида возможностей,
    различающихся тем, кто решает ими воспользоваться: модель, приложение или человек'
  learning_goal: База инструмента до первого кейса этого инструмента. Вводит три примитива протокола и
    оговорку про открытость и нейтрального владельца, которая работает независимо от провалов, разбираемых
    дальше в блоке
  visual:
    pattern: base_and_edge
    primary: Две дорожки. Слева под пометкой «БАЗА» — определение одним предложением и таблица трёх примитивов
      с тем, кто инициирует каждый. Справа — практический вывод и строка про открытость протокола и нейтрального
      владельца.
    backup: 'Источник — rework/section-1-mcp.md §A.1.3, §B.3 (part1c.md). Дата передачи протокола фонду
      (9 декабря 2025, Agentic AI Foundation, направленный фонд Linux Foundation) — проверено фактчеком
      против официального блога, VERIFIED (qa/fact-check-mcp.md §2.2 п.1). Область раздела — только подключение
      (§A.00): не авторство серверов, не протокол целиком, не сравнение реализаций.'
- id: n09
  file: slides/n09-vopros-chto-proverit-do-podklyucheniya.md
  type: reflection_question
  duration_min: 1.0
  assertion: Агенту регулярно нужно смотреть открытые issue и готовить черновики правок; перед подключением
    официального сервера зал выбирает, что проверить и в каком порядке
  learning_goal: 'Открытый вопрос первого кейса. Карточки задают предметность: общий жест в сторону осторожности
    не считается ответом, нужна конкретная проверка и её место в порядке. Целевого ответа на слайде нет,
    разбор идёт следующим слайдом'
  visual:
    pattern: question_with_option_cards
    primary: 'Золотая рамка с вопросом: что проверить до подключения официального сервера и в каком порядке.
      Под ней пять равных карточек в фиксированном порядке, ни одна не выделена. Ни цифр, ни источников
      на слайде.'
    backup: Источник — rework/section-1-mcp.md §A.1.4, §B.4 (part1c.md). Карточки — пять настоящих инженерных
      вариантов, разбор каждого на следующем слайде (§A.1.5).
- id: n10
  file: slides/n10-razbor-nuzhno-li-vobsche-potom-prava-potom-tsena.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: 'У каждого из пяти вариантов — случаи, где он работает, и ограничения; из их сочетания следует
    порядок: сначала нужно ли вообще, потом какие права, потом какая цена'
  learning_goal: 'Разбор всех пяти карточек в форме А7: вариант · где работает — конкретные случаи · ограничения.
    Вывод о порядке стоит отдельной строкой под таблицей, не ярлыком в клетке'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в три колонки: вариант · где он работает — конкретные случаи · ограничения.
      Порядок строк совпадает с порядком карточек вопроса. Под таблицей — вывод о последовательности из
      трёх вопросов.'
    backup: Источник — rework/section-1-mcp.md §A.1.5, §B.5 (part1c.md). Форма А7 — эталон, перенесённый
      с прошлого занятия. Таблица прав избыточности сервера и системного сканирования ~8000 серверов (>40%
      без проверки личности) — в Справке, не на видимом слое; источник этой цифры см. research/stage-5-mcp.md,
      не перепроверялось отдельно этим файлом (сверх скоупа задачи — пренесена из §B.5).
- id: n11
  file: slides/n11-sobiraem-operatsii-i-prava.md
  type: cobuilding
  duration_min: 1.5
  assertion: 'Барьер проектируется в два хода: сначала список операций, которые агент должен уметь, потом
    вычёркивание прав широкого токена, которые этот список не требует'
  learning_goal: 'Со-сборка, часть 1 из двух: операции фиксируются первыми, потом по каждой строке списка
    прав широкого токена проверяется, нужна ли она. Вычёркивание происходит на экране, строка за строкой'
  visual:
    pattern: cobuilding_config_reveal
    primary: Два хода на одном экране. Ход 1 — список из трёх операций, зафиксированный репликами зала.
      Ход 2 — список прав широкого токена по умолчанию, и по каждой строке вычёркивание на экране, пока
      не останется одна учётная запись и две операции.
    backup: Источник — rework/section-1-mcp.md §A.1.6 (часть 1), §B.6 (part1c.md). Операции и права —
      rework/section-1-khuk.md-аналог не используется; список прав по умолчанию берётся из research/stage-5-mcp.md.
      Артефакт .mcp.json и вычёркнутый экран — на следующем слайде.
- id: n12
  file: slides/n12-sobiraem-klyuch-i-oblast-vidimosti.md
  type: cobuilding
  duration_min: 1.25
  assertion: Ключ хранится в переменной окружения, не в файле; область видимости конфигурации — одна из
    трёх, и дефолт команды подключения кладёт сервер не туда, куда многие ожидают
  learning_goal: 'Со-сборка, часть 2 из двух: третий и четвёртый ход — где хранить ключ и в какую область
