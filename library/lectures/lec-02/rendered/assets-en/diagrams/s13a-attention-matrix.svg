<rect x="130" y="235" width="60" height="60" fill="#1C7293"/><text x="160" y="272" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
<rect x="200" y="235" width="60" height="60" fill="#065A82"/><text x="230" y="272" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.4</text>
