      интерфейса n8n — UI недостижим, см. backup): общий вход 3000₽ сверху, слева процесс (A) — модель
      читает текст правила и решает «эскалировать», справа процесс (B) — `IF`-узел сравнивает число и
      решает «одобрить». На схеме — execution id обеих троек прогонов и итоговый счёт эксперимента (3
