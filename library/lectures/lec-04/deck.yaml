slides:
  # ─── Раздел 0. Введение и методическая рамка (s01–s07) ───
  - id: s01
    file: slides/s01-metr-perception-gap-hook.md
    type: hero_cover
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 3
    assertion: "16 опытных разработчиков с AI работали на 19% дольше — а были уверены, что AI их ускоряет: ощущение продуктивности — гипотеза, не данные, поэтому надёжность даёт дисциплина, а не ощущение"
    learning_goal: "Hook: разрыв восприятия на чистом эксперименте; обоснование методико-first оси лекции"
    learning_outcomes: [LO7]
    chapter_ref: "§0.1 [for-slide-s01]"
    interaction: open_question
    verify_day_of: true
    hero_required: true

  - id: s02
    file: slides/s02-cover-roadmap.md
    type: cover
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 0.5
    assertion: "Лекция 4. AI в жизненном цикле разработки ПО"
    learning_goal: "Cover + roadmap разделов 0–7; превью git-loop дисциплины"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§0.1 [for-slide-s02]"
    interaction: none
    verify_day_of: false

  - id: s03
    file: slides/s03-bridge-lec3.md
    type: assertion_visual
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 2
    assertion: "Из Лекций 1–3 переносим готовый аппарат выбора архитектуры; Лекция 4 берёт одну индустрию и показывает, какая дисциплина делает AI надёжным по фазам"
    learning_goal: "Мост из Модуля 1: что переносим и не переобъясняем"
    learning_outcomes: [LO1]
    chapter_ref: "§0.2 [for-slide-s03]"
    interaction: none
    verify_day_of: false

  - id: s04
    file: slides/s04-central-question.md
    type: assertion_visual
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 2.5
    assertion: "Центральный вопрос — не «какой инструмент лучший», а «какая дисциплина делает AI-разработку надёжной по фазам»: инструмент вторичен, практика первична"
    learning_goal: "Центральный вопрос (§0.3) методико-first; цели через практику, не инструмент"
    learning_outcomes: [LO1, LO4, LO7]
    chapter_ref: "§0.3 [for-slide-s04]"
    interaction: none
    verify_day_of: false

  - id: s05
    file: slides/s05-keystone-git-loop.md
    type: assertion_visual
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 3
    keystone: true
    assertion: "AI-разработка как дисциплина — это цикл человеко-владеемых артефактов спека→ADR→план→PR→инцидент, каждым владеет человек; на этом скелете сходятся методики разных игроков"
    learning_goal: "KEYSTONE — git-loop дисциплины (диаграмма-цепочка артефактов) + определение фазы (вход/выход/артефакт) + неравномерность фаз; сходимость методик = 1 подпись"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§0.6 [for-slide-s05]"
    interaction: none
    verify_day_of: false

  - id: s06
    file: slides/s06-autonomy-ladder-lens.md
    type: assertion_visual
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 2
    assertion: "Лестница автономности A→D — вспомогательная линза (не несущая ось); и уровень автономии — свойство режима, а не бренда: один продукт живёт сразу на нескольких уровнях"
    learning_goal: "A→D демотированная линза + режим ≠ бренд одной строкой (границы B↔C / C↔D компактно)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§0.7 [for-slide-s06]"
    interaction: none
    verify_day_of: false

  - id: s07
    file: slides/s07-tool-secondary-thesis.md
    type: assertion_visual
    section: "Раздел 0. Введение и методическая рамка"
    duration_min: 2.5
    assertion: "Инструмент вторичен — методика определяет, инструмент исполняет; «внедрили AI-инструмент» ≠ «внедрили AI-дисциплину», и первое без второго умножает беспорядок"
    learning_goal: "[SI] Ведущий тезис v4: методика определяет, инструмент исполняет + провал «инструмент вместо практики»"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§0.8, §0.9 [for-slide-s07]"
    in_bucket: true
    interaction: none
    verify_day_of: false

  # ─── Раздел 1. Требования — первый артефакт, ещё до кода (s08–s11) ───
  - id: s08
    file: slides/s08-divider-requirements.md
    type: section_divider
    section: "Раздел 1. Требования — первый артефакт"
    duration_min: 0.5
    assertion: "Требования · spec-driven — фаза, где ведущее не код, а спецификация, которую человек написал, прочитал и принял"
    learning_goal: "Section divider раздела 1 (требования): смысл фазы одной строкой"
    learning_outcomes: [LO1]
    chapter_ref: "§1 (структурный divider)"
    partial_out_strict_in: true
    interaction: none
    verify_day_of: false

  - id: s09
    file: slides/s09-spec-driven-practice.md
    type: assertion_visual
    section: "Раздел 1. Требования — первый артефакт"
    duration_min: 3
    assertion: "Требования — первый артефакт, ещё до кода: практика spec-driven ставит между намерением и кодом человеко-ревьюируемую спеку; три голоса индустрии сходятся, что спека — центральный артефакт"
    learning_goal: "Практика spec-driven как дисциплина; визуал git-дерева со spec-файлами; Grove «~10-20%» как риторика, не измерение"
