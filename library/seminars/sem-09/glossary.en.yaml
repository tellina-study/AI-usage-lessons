# library/seminars/sem-09/glossary.en.yaml
# Glossary LOCK (EN) — Seminar 9 "Процесс отвечает человеку" /
# "The process answers the human". First EN track for this seminar (issue #172
# Bilingual Production Rule, issue #319). All translators of slides-en/*.md
# MUST use these exact forms — no per-agent drift across the 6 parallel case
# batches (+ intro/closing). consistency-checker verifies slides-en/*.md
# against this file.

seminar: 9
locked_at: "2026-11-08"

terms:
  # --- Carried over unchanged from sem-08/glossary.en.yaml (issue #172 continuity) ---
  - canonical: "node"
    ru: "узел"
    note: "n8n UI term, always lower-case unless at sentence start. Reused from sem-08."
  - canonical: "workflow"
    ru: "воркфлоу"
    note: "Reused from sem-08."
  - canonical: "live rig"
    ru: "стенд / живой стенд"
    note: "The real running n8n instance the seminar's own measurements were run on (stend/ in the repo), as opposed to a drawn schema or a hypothetical. Sem-09 mostly just says «стенд»; sem-08 locked the fuller «живой стенд» for the same referent — keep the single EN form 'live rig' for both."
  - canonical: "threshold"
    ru: "порог"
    note: "Reused from sem-08. In sem-09 this is specifically REFUND_THRESHOLD = 3000 ₽, the same constant Case 5 and Case 4 both exercise — imported from sem-08's own build."
  - canonical: "escalate / escalation"
    ru: "эскалировать / эскалация"
    note: "Reused from sem-08."
  - canonical: "approve / approval"
    ru: "одобрить / одобрение"
    note: "Reused from sem-08. In sem-09 also covers 'одобрила' said of the judge model in Case 3 ('the judge approved...')."
  - canonical: "extract / extraction"
    ru: "извлечь / извлечение"
    note: "Reused from sem-08. In sem-09 used for reading a number off a receipt photo (Case 6), not just pulling fields from request text."
  - canonical: "refund"
    ru: "возврат (денег)"
    note: "Reused from sem-08. Central to Case 4 and referenced again in Case 5's boundary nuance (the same REFUND_THRESHOLD)."
  - canonical: "deduplication / duplicate"
    ru: "дедупликация / дубликат"
    note: "Reused from sem-08. Only appears in sem-09 as part of the inherited S8 input state description (n02), not as a case topic of its own."
  - canonical: "request"
    ru: "заявка"
    note: "Reused from sem-08: an incoming request/ticket from a training-center client, not a technical API request."
  - canonical: "training center"
    ru: "учебный центр"
    note: "Reused from sem-08."
  - canonical: "coordinator"
    ru: "координатор"
    note: "Reused from sem-08: the recipient of the Telegram notification inherited from S8 (n02, n01). Distinct from 'administrator' (Olga's own role, new in this file) and from 'manager' (Case 4's escalation target, also new)."
  - canonical: "IF node"
    ru: "IF-узел"
    note: "Reused from sem-08."
  - canonical: "settings panel"
    ru: "панель настройки"
    note: "Reused from sem-08."
  - canonical: "compression"
    ru: "сжатие"
    note: "Reused from sem-08. In sem-09 this is Case 6's central mechanism — image compression before sending to the model — not S8's bitmap-size framing."
  - canonical: "judge model / LLM-as-judge"
    ru: "модель-судья"
    note: "Reused from sem-08. Central to Case 3 (checking the answer) and referenced again from Case 4's classifier comparison."

  # --- New for sem-09 ---
  - canonical: "administrator"
    ru: "администратор (учебного центра)"
    note: "Olga's own role/title across both S8 and S9 ('Ольга, администратор учебного центра') — keep distinct from 'coordinator' (a different recipient role) and 'manager' (Case 4's escalation target)."
  - canonical: "manager"
    ru: "менеджер"
    note: "Case 4's escalation target — whoever a suspected-manipulation or suspicious request gets routed to. A different role from 'administrator' (Olga) and 'coordinator' (the S8-inherited Telegram recipient); do not collapse the three into one English word."
  - canonical: "client / requester"
    ru: "клиент / обратившийся (обращающийся)"
    note: "Same person, two RU words used somewhat interchangeably across the deck for whoever contacted the training center. Render «обратившийся»/«обращающийся» as 'the requester' or 'the person who reached out' and «клиент» as 'the client' — keep whichever register the RU slide uses, but never invent a third English word for either."
  - canonical: "knowledge base"
    ru: "база знаний / справочник"
    note: "Case 1-2's 10-item FAQ-style reference (payment, reschedule, documents, refund, retake, missed class, certificate, course transfer, holidays, contact with the instructor) that lives entirely inside the prompt. «База знаний» and «справочник» are used as synonyms for this SAME object in sem-09 — unlike sem-08, where «справочник» named a narrower enum-normalization lookup list. Do not reuse sem-08's 'lookup list' here; both RU words map to 'knowledge base' in sem-09."
  - canonical: "KB item"
    ru: "пункт базы / пункт справочника"
    note: "One of the ten enumerated knowledge-base entries, `kb1`…`kb10` as a literal field value. Keep the enum values themselves verbatim (code, not prose)."
  - canonical: "self-report"
    ru: "самоотчёт"
    note: "The axis term of Case 1 and of the whole seminar's closing line: a decision ('answer vs. decline') that lives only inside the model's own free-text answer, with nothing else recording it — so it can't be checked or re-run the same way twice. Appears on the keystone-axis slide (n04/n77) and repeatedly through Case 1; keep this exact noun, do not vary it to 'self-assessment' or 'self-disclosure'."
  - canonical: "grounding / grounded in"
    ru: "опора / опираться (на пункт базы)"
    note: "The structured-field counterpart to self-report: the model names, in a separate field the code can check, which KB item its answer is grounded in. Keep the code identifier `grounded_in_item` and the node title `Grounded in known KB item?` verbatim (already English in the real screenshots)."
  - canonical: "gate"
    ru: "гейт / узел-условие"
    note: "The deterministic code check (an IF-style condition node) that decides pass-through vs. escalate based on a structured field, not on free text. Appears as production shorthand ('grounded-гейт') and in the visible node title `Grounded in known KB item?`."
  - canonical: "deterministic check"
    ru: "детерминированная проверка"
    note: "Case 3's Version 2 and Case 4's fallback: a code/test-based check, contrasted throughout with a judge model's verdict. Matches the EN form already used in sem-08's own slides-en (n08-k1-razbor.md)."
  - canonical: "structured output"
    ru: "структурированный вывод"
    note: "The JSON-schema-constrained model response (as opposed to free text), used across Case 1 (grounded_in_item), Case 3 (Judge verdict), and Case 5 (reasoning-field ordering)."
  - canonical: "classifier (model)"
    ru: "модель-классификатор"
    note: "Case 4's third defense: a separate, cheap model whose only job is to flag a manipulation attempt before the deciding model ever sees the request."
  - canonical: "cross-check (against an independent value)"
    ru: "сверка (с независимым значением / со вторым источником)"
    note: "The one mechanism the seminar repeatedly credits as actually catching errors that format-only validation misses — Case 4 (code-computed 30-day rule vs. the model's arithmetic) and Case 6 (comparing the photo-read amount against the client's own typed amount). Keep 'cross-check' consistent; do not vary to 'verification' or 'validation', which are used for other things in the deck (schema validation, format checks)."
  - canonical: "ground truth / reference answer"
    ru: "эталон"
    note: "Case 3's missing ingredient in Version 1 (self-review with no external эталон) vs. present in the code-check/judge comparisons. Use 'ground truth' where it reads as the measurement-literature term (Huang et al.), 'reference answer' where the RU is about this seminar's own graded test set — translator's judgment, but never 'standard' or 'benchmark'."
  - canonical: "retry"
    ru: "переделка"
    note: "One redo pass of the generator→checker loop in Case 3. The real node title is `Prepare retry` / `Retry or finish?` — already English, quote verbatim."
  - canonical: "retry limit"
    ru: "лимит переделок / потолок (попыток)"
    note: "The hard cap on redo passes before Case 3's loop escalates to Olga. Case 3's nuance: n8n's built-in loop has no such cap by default — it is set by hand with an expression and an IF node."
  - canonical: "loop"
    ru: "цикл"
    note: "The generator→checker→retry loop of Case 3. Generic n8n/production term, not seminar-specific, but recurs heavily — keep 'loop', not 'cycle'."
  - canonical: "anchor"
    ru: "якорь / якоря"
    note: "Case 3's Version 2 detail: already-passed checks are remembered ('anchored') between loop iterations so a new retry pass can't silently break a check it already satisfied. A deliberately literal translation — the RU itself uses the image of an anchor."
  - canonical: "plateau"
    ru: "плато"
    note: "Case 3 nuance: the retry curve flattens out (plateaus) fast where an external ground truth exists, but never plateaus — it just keeps declining — where it doesn't."
  - canonical: "abort / break off"
    ru: "обрыв"
    note: "The failure mode specific to structured output: execution stops before producing ANY answer (schema validation failure), as opposed to free text's 'soft' degradation (it writes something, even if wrong). Case 1: '2 из 15 — обрыв до проверки'. Keep 'abort' (noun/verb) as the primary rendering; 'break off' is acceptable where 'abort' reads too technical for the sentence."
  - canonical: "branch / branch point"
    ru: "развилка"
    note: "The canvas fork that appears only once the answer/escalate decision is pulled out of free text into a checkable field (Case 1, Version 2) — Version 1's canvas has none. Keep 'branch' for the canvas object, 'branch point' where the RU is naming the decision itself rather than the arrows."
  - canonical: "merge (into a single call)"
    ru: "слияние"
    note: "Case 6's own tested-and-rejected idea: combining the photo-read step and the cross-check step into one model call, instead of two. Keep lower-case 'merge' for this seminar-specific concept — do NOT confuse with n8n's own capitalized `Merge` node (a different, generic n8n primitive not used in sem-09's own canvases); if the slide ever needs to distinguish them, spell the node name with a capital M and quote it verbatim."
  - canonical: "echo (of the request)"
    ru: "эхо заявки"
    note: "Case 6's named failure: the merged single-call device 'reads' the amount by echoing the number the client already typed in the request text, rather than genuinely reading it off the photo — looks like a win on the scorecard, is actually a more dangerous failure."
  - canonical: "glyph height"
    ru: "высота символа / высота цифры"
    note: "Case 6's real mechanism (not file megapixels): the pixel height of a specific printed character/digit at a given resolution. Matches the literal term already used in the stand's own script name (`measure_date_glyph_height.py`) — use 'glyph height', not 'font size' or 'character size'."
  - canonical: "cache / caching"
    ru: "кэш / кэширование"
    note: "Case 2's own measured experiment (K2-19): prompt caching across five providers via OpenRouter."
  - canonical: "cache breakpoint"
    ru: "контрольная точка"
    note: "The Anthropic-specific `cache_control` marker whose placement among prompt blocks — not just the edit itself — decides whether the old cache survives a prompt edit. Case 2's 'main correction' to the previous (sem-07-era) blanket claim that appending to a list always busts the cache."
  - canonical: "exact match"
    ru: "точное совпадение"
    note: "Case 1's cheapest, weakest option: comparing the client's question string against a fixed list of topic wordings with zero model calls. Distinct from sem-08's 'exact match (hash)', which was a different mechanism (hash-based duplicate detection) — in sem-09 it's plain string matching, no hashing."
  - canonical: "confidence (score)"
    ru: "уверенность"
    note: "Case 1's third tested option: the model answers freely and also names a 0–100 confidence number; code thresholds on it. Keep 'confidence' for the number itself; 'confident' as the adjective for a wrong-but-assertive answer ('уверенно и неверно' → 'confidently, and wrongly')."
  - canonical: "task class"
    ru: "класс задачи"
    note: "The fixed closing phrase of every case's generalization beat ('класс задачи: …') — matches the EN wording already used in sem-08's own slides-en (n36-k3-obobshchenie.md: 'the class of task'). Keep 'task class', not 'type of task' or 'category'."
  - canonical: "failure class / failure mode"
    ru: "класс отказа"
    note: "A named recurring kind of failure (e.g. structured output's abort-with-nothing vs. free text's soft wrong answer) — distinct from 'task class' above, which names the KIND OF DECISION, not the kind of failure. Do not merge the two into one English word."
  - canonical: "boundary"
    ru: "граница"
    note: "The fixed closing beat of every case's nuances tact, stated in the imperative plain form the course requires ('граница, прямой формой'). Matches the EN wording already used in sem-08's own slides-en (n36-k3-obobshchenie.md and others: 'boundary'). Keep 'boundary', not 'limit' or 'edge case'."

  # --- Case titles (exact divider-slide wording, n05/n18/n29/n43/n55/n64) ---
  - canonical: "Case 1. Answer or Stay Silent"
    ru: "Кейс 1. Отвечать или промолчать"
    note: "Divider slide n05. ARCHITECTURE.md's fuller case name 'Чем отвечать и когда промолчать' ('What to answer with, and when to stay silent') refers to the same case — use this shorter divider wording wherever the slide itself says 'Кейс 1', keep the longer form only where the RU source itself uses the longer form (e.g. quoting the architecture table)."
  - canonical: "Case 2. Prompt Optimization"
    ru: "Кейс 2. Оптимизация промта"
    note: "Divider slide n18. Renamed from the earlier 'База знаний в промте' (owner decision 2026-10-29) — do not resurrect the old name; it now means something else (Case 1)."
  - canonical: "Case 3. Checking the Answer"
    ru: "Кейс 3. Проверка ответа"
    note: "Divider slide n29. ARCHITECTURE.md's fuller name 'Кто решает, что ответ годный' ('Who decides the answer is good enough') is the same case — same rule as Case 1 above."
  - canonical: "Case 4. Defense Against Injection and Manipulation"
    ru: "Кейс 4. Защита от инъекций и манипуляций"
    note: "Divider slide n43. Completely redefined 2026-10-29 (issue #303) — the old 'amount vs. threshold manipulation' framing no longer applies to this case name; do not carry over any pre-10-29 wording if translating older research notes."
  - canonical: "Case 5. Answer Reproducibility"
    ru: "Кейс 5. Повторяемость ответа"
    note: "Divider slide n55. ARCHITECTURE.md's fuller name 'Ответ, который уходит клиенту' ('The answer that goes out to the client') is the same case. This is the seminar's deliberate rhythm-break case (canon rule П4) — it adds no new node to the canvas."
  - canonical: "Case 6. Reading a Photo"
    ru: "Кейс 6. Чтение фотографии"
    note: "Divider slide n64. ARCHITECTURE.md's fuller name 'Фотография документа на входе' ('A photo of a document on input') is the same case."

  # --- A fixed client-facing phrase, quoted verbatim twice (n06, n77) ---
  - canonical: "please wait, a human will get back to you"
    ru: "подождите, вам ответит человек"
    note: "The exact escalation message shown to the client when the process declines to answer on its own. Quoted verbatim in both n06 (Olga's request) and n77 (the closing recap) — translate identically in both places, it is the SAME quoted string, not independently-worded paraphrases."

notes:
  - "n8n UI labels and node titles (`Client question`, `Answer (free self-report)`, `Write row`, `Result screen`, `Grounded in known KB item?`, `Pick KB item`, `Judge verdict`, `Code check`, `Retry or finish?`, `Prepare retry`, `Model (answer, free)`, `Model (T = 0)`, `Sampling Temperature`, `Provider Routing`, `Top P`, `Schema Type`, `Add Option`, `Receipt photo`, field names like `grounded_in_item`, `kb1`…`kb10`, `REFUND_THRESHOLD`) are English in the real screenshots already — do not re-translate or paraphrase them; quote verbatim exactly as in the RU slide, same rule as sem-08's own glossary."
  - "Model identifiers (`qwen/qwen-2.5-7b-instruct`, `qwen/qwen3-vl-8b-instruct`, `claude-haiku-5.5`, `gemini-2.5-flash`, `gpt-4.1-mini`, `deepseek-chat`, `qwen-2.5-7b-instruct`, etc.) are proper identifiers — keep verbatim, never translate or re-case."
  - "Scenario/configuration codes (`n4-0`, `n4-p`, `n4-r`, `n4-c`, `n4-pr`, `n4-pc`, `n4-rc`, `n4-prc`, `case1_v1`, `s9-m3-judge`, `s9-m3-code`, `s9-k2-experiment`) and file/path references (`stend/zamery-k4-novyy/README.md`, etc.) are identifiers — keep verbatim, do not translate."
  - "Anti-anglicism mandate is RU-only (CLAUDE.md § Bilingual Production Rule); does not apply to this EN track."
  - "Mirror-check instead: EN slides must contain 0 untranslated Russian fragments — proper nouns (Ольга → keep as 'Olga') and quoted RU UI strings excluded (there should be none; the UI is English)."
  - "Numbers, dates, thresholds, measured results (e.g. 6 of 15 on the hard case, jev-style confidence thresholds, 0.107× cache-read cost, 3000 ₽ threshold, glyph heights in px) MUST be carried over byte-for-byte unchanged — fact-checker verifies this against the RU slides, not against source data a second time. Currency: keep ₽ as the symbol (do not convert to $ or spell out 'rubles') unless the RU slide itself spells out the currency name."
  - "Where a term already appears in `library/seminars/sem-08/glossary.en.yaml` with the identical referent, this file reuses sem-08's exact English form (see the 'Carried over unchanged' block above) rather than inventing a new one — per CLAUDE.md's glossary-lock mandate for the bilingual track. Where sem-09 reuses a RU word for a DIFFERENT referent than sem-08 did (e.g. «справочник»), this file says so explicitly in that term's note rather than silently diverging."
  - "«Проверка практикой» has not yet run for this seminar at the time this glossary was locked (issue #225 applies after a live delivery, not before it) — if a future delivery changes any of the course-level terms a working instructor actually used out loud, that change goes through a glossary-lock revision, not a silent per-slide edit."
