      своей работы» с этого слайда СНЯТО: три предела подряд кончались им, и на третий раз зал уже не
      отвечает (находка прожарки). Вопрос остался на границе кейса про повод, где он первый. Число 202
      приведено как крайняя точка измерения роста библиотеки; промежуточных порогов в работе нет, и на
      слайде порог не называется. Круг 4: содержание не сокращено — это обязательная доля материала про
      границы и альтернативы. Четвёртая строка получила явное «падение УСПЕШНОСТИ»: прожарка круга 3 спрашивала
