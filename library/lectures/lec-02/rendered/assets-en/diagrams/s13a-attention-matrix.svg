<!-- Annotation for she->mouse — moved below the matrix -->
<rect x="290" y="575" width="160" height="40" rx="6" fill="#FEF5E0" stroke="#F0AB00" stroke-width="1.5"/>
<text x="370" y="592" text-anchor="middle" font-family="Arial" font-size="11" fill="#21295C" font-weight="bold">"she" attends to "mouse"</text>
<text x="370" y="608" text-anchor="middle" font-family="Arial" font-size="11" fill="#F0AB00" font-weight="bold">weight = 0.7 (gold cell)</text>

<!-- Bottom caption — moved right side, since annotation occupies bottom-centre -->
<text x="580" y="592" text-anchor="end" font-family="Arial" font-size="11" fill="#1C7293" font-style="italic">N x N links; for 100k</text>
<text x="580" y="608" text-anchor="end" font-family="Arial" font-size="11" fill="#1C7293" font-style="italic">— ~10 billion numbers</text>

</svg>
