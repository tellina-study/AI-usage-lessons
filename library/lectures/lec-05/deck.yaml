  - id: s01
    file: slides/s01-zillow-hook.md
    type: case_study
    section: "Раздел 0. Открытие"
    duration_min: 3
    assertion: "Алгопрогноз цен жилья закрыл целое направление Zillow: $500M+ списаний, ~2000 уволенных, акция −25% — обычная ошибка модели стала потерей бизнеса"
    learning_goal: "Hook (G-1 LOCKED): Zillow iBuying коллапс; рамкирование тезиса; payoff — s09"
    learning_outcomes: [LO6]
    chapter_ref: "§0.1 [for-slide-s01]"
    references: [cbs-zillow-2021, stanford-gsb-2022]
    in_bucket: false   # hook; раскрытие/урок — s09 (partial→out, plan §5)
    visual:
      pattern: case_study_contrast
      primary: "Слева — assertion + 3 числа Zillow в Ocean rounded box ($300M+ списание/квартал · $500M+ потери направления · ~2000 уволенных ~25% штата · акция −25%). Справа — open-Q + рамка «какой тип ИИ это был и почему не LLM». Gold highlight — «$500M+ / закрыто целое направление»."
