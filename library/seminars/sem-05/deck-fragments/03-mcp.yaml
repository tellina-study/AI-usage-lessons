  # --- Блок 3. MCP: доступ наружу (16 слайдов, 22,5 мин) ---
  - id: s38
    file: slides/s38-divider-mcp-dostup-naruzhu.md
    type: section_divider
    duration_min: 0.25
    assertion: "Ступень 5 — доступ наружу: первые две ступени укрепляли то, что уже было внутри репозитория, а issue, которые нужно прочитать агенту, физически лежат снаружи и меняются без разработчика"
    learning_goal: "Разделитель ступени 5 (macro-уровень: gold 5-сегментный прогресс-бар пяти ступеней занятия, сегмент 3 — MCP). Тег называет масштаб кейса, не его исход"
    visual:
      pattern: section_divider_macro
  - id: s39
    file: slides/s39-problema-issue-vmesto-messendzhera.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "Заказчик перестал писать в мессенджер и заводит задачи прямо в репозитории — почти каждая сессия теперь начинается и заканчивается ручным переносом текста между трекером и агентом"
    learning_goal: "Проблема ступени 5 — сцена на signup-landing, нейтральный тон, исход не предрешён: без вопроса, без карточек, без оценки"
    visual:
      pattern: problem_scenario
  - id: s40
    file: slides/s40-vopros-chto-proverit-do-podklyucheniya.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Агенту теперь регулярно нужно смотреть issue репозитория и готовить черновики правок; вы почти готовы подключить официальный сервер доступа к трекеру — выберите, что проверите до того, как это сделать, и в каком порядке"
    learning_goal: "Открытый вопрос ступени 5 — вопрос с готовым набором вариантов, БЕЗ цифр, БЕЗ источников, БЕЗ таблицы разбора, БЕЗ намёка на ответ"
    visual:
      pattern: question_with_option_cards
  - id: s41
    file: slides/s41-svidetelstva-shesti-istochnikov.md
    type: research_evidence
    duration_min: 1.5
    assertion: "Шесть источников независимо сходятся на одном: доступ снаружи расширяет площадь ошибки быстрее, чем растёт доверие к серверу, — а сколько времени в среднем занимает сама проверка перед подключением, не измерил ни один из них"
    learning_goal: "Свидетельства ступени 5 — таблица источник/тезис/сила доказательства + честный пробел (время самой процедуры проверки не измерено ни в одном источнике)"
    visual:
      pattern: evidence_table_with_gap
  - id: s42
    file: slides/s42-razbor-poryadok-treh-voprosov.md
    type: answer_breakdown
    duration_min: 1.75
    assertion: "Из пяти вариантов верный ответ — не одна проверка, а последовательность из трёх: сначала «нужно ли вообще», потом «с какими правами», и только потом «по какой цене»"
    learning_goal: "Разбор пяти карточек ступени 5 — где работает / почему рано / что вместо, целевой порядок выделен"
    visual:
      pattern: answer_breakdown_table
  - id: s43
    file: slides/s43-cobuilding-operatsii-i-prava.md
    type: cobuilding
    duration_min: 1.75
    assertion: "Файл конфигурации пишется в конце: сначала называются три операции, которые агент должен уметь, а затем построчно вычёркиваются права широкого токена, которые эти три операции не используют"
    learning_goal: "Совместное формирование MCP-подключения, вопросы 1–2: список операций и вычёркивание прав широкого токена — фрагменты проявляются по мере ответов зала, готовый файл целиком не показывается"
    visual:
      pattern: cobuilding_config_reveal
  - id: s44
    file: slides/s44-cobuilding-klyuch-i-oblast-vidimosti.md
    type: cobuilding
    duration_min: 1.25
    assertion: "Ключ хранится в переменной окружения, а не в файле, — с честной оговоркой, что это не гарантирует полной защищённости; а область видимости конфигурации решает, коммитится ли файл в репозиторий вообще"
    learning_goal: "Совместное формирование MCP-подключения, вопросы 3–4: хранение ключа и выбор области видимости (local/project/user), включая дефолт, о котором легко не знать"
    visual:
      pattern: cobuilding_config_reveal
  - id: s45
    file: slides/s45-resheniye-mcp-json-i-tri-primitiva.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Итог разговора — четыре содержательные строки в .mcp.json: чем запускается сервер, что запускается, откуда берётся ключ и какие у него права; а протокол различает инструмент, ресурс и подсказку по тому, кто решает их применить"
    learning_goal: "Решение ступени 5 — реальный .mcp.json из репозитория, ожидаемое дерево, и три примитива протокола с указанием инициатора для каждого"
    visual:
      pattern: code_artifact
  - id: s46
    file: slides/s46-mekhanika-oblasti-i-transporty.md
    type: mechanics
    duration_min: 2.5
    assertion: "Область видимости конфигурации — физически разные файлы, и при совпадении имени сервера побеждает вся запись приоритетной области целиком, а не смесь полей; поле command — не описание, а команда, которую реально запустят"
    learning_goal: "Механика ступени 5 — области видимости (local/project/user), приоритет при конфликте имён, транспорт stdio как исполняемая конфигурация, сравнение с http и sse"
    visual:
      pattern: mechanics_scope_transport
  - id: s47
    file: slides/s47-mekhanika-chto-popadaet-v-kontekst.md
    type: mechanics
    duration_min: 2.5
    assertion: "При старте сессии в контекст попадают только имена инструментов и общая инструкция сервера; полная схема конкретного инструмента подгружается отдельно, только когда модель сама решает, что он может понадобиться"
    learning_goal: "Механика ступени 5 — обнаружение (tools/list и другие), полное имя инструмента mcp__сервер__инструмент, режим отложенной загрузки и переменная ENABLE_TOOL_SEARCH — прямая опора под слайд цены в токенах"
    visual:
      pattern: mechanics_context_loading
  - id: s48
    file: slides/s48-mekhanika-status-i-otladka.md
    type: mechanics
    duration_min: 2.0
    assertion: "Зелёный статус подключения различает ровно один факт — поднялся ли процесс; для остального нужен отдельный статус, два разных тайм-аута и явное упоминание сервера в запросе, а два реальных отказа проекта показывают, как это выглядит на практике"
    learning_goal: "Механика ступени 5 — таблица статусов claude mcp list / /mcp, два тайм-аута (старт vs исполнение), переподключение, и два задокументированных отказа этого проекта"
    visual:
      pattern: mechanics_debug_status
  - id: s49
    file: slides/s49-tsena-v-tokenah.md
    type: token_cost
    duration_min: 0.75
    assertion: "«Подключение стоит X токенов» — не цена каждого подключения по умолчанию, а верхняя граница режима без отсрочки; проверить, в каком режиме находитесь вы сами, можно тем же способом, что и статус сервера"
    learning_goal: "Цена в токенах ступени 5 — таблица замеров с базой сравнения у каждой цифры, с явным условием: первая строка — худший случай, не дефолт. Кандидат на компрессию, не несущий для следующих слайдов"
    visual:
      pattern: token_cost_table
  - id: s50
    file: slides/s50-proval-ekfiltratsiya-smertelnoe-trio.md
    type: failure_vignette
    duration_min: 1.75
    assertion: "Персональный токен с правами на все репозитории плюс issue с встроенной инструкцией дают утечку без единой строчки эксплойта, а сервер сам может оказаться незащищённым сетевым сервисом — вообще без модели"
    learning_goal: "Провал ступени 5, слой 1 — эксфильтрация через связку прав (Invariant Labs, май 2025), смертельное трио, DNS rebinding без модели. Strict-in, не сжимается — прямой payoff co-building'а"
    visual:
      pattern: failure_vignette
  - id: s51
    file: slides/s51-proval-podklyuchen-ne-znachit-rabotaet.md
    type: failure_vignette
    duration_min: 1.75
    assertion: "Индикатор подключения проверяет ровно один факт — поднялся ли процесс, а три других отказа он не видит; и одобрение инструмента не окончательно — сокрытая инструкция доставляется модели в восьми случаях из восьми, не вызывая ни одного повторного одобрения"
    learning_goal: "Провал ступени 5, слой 2 — «подключён≠работает» с опорой на статус из слайда отладки + подмена описания инструмента после одобрения. Кандидат на компрессию, не несущий для следующих слайдов"
    visual:
      pattern: failure_vignette
  - id: s52
    file: slides/s52-kriterii-rano-i-ne-nuzhno.md
    type: criteria_boundary
    duration_min: 0.75
    assertion: "«Здесь ещё рано» — временное и ждёт сигнала повторяющейся боли; «здесь не нужно вообще» — постоянное: известный вызов CLI не станет MCP-сервером от роста доверия, а флаг read-only без независимой проверки — не повод подключать в режиме записи"
    learning_goal: "Критерий ступени 5 — «ещё рано» и «не нужно вообще», с отдельным стоп-критерием смертельного трио и дисциплиной после подключения"
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s53
    file: slides/s53-os-zanyatiya-mcp.md
    type: axis_placement
    duration_min: 0.5
    assertion: "Подключение сервера — решаем, по сигналу; дисциплина минимальных прав — предотвращаем, день 0, не ждёт сигнала сверх факта создания токена"
    learning_goal: "Строка в ось занятия ступени 5 + мостик к разделу про субагента. Никогда не режется"
    visual:
      pattern: axis_placement
