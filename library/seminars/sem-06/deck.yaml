- id: n63
  file: slides/n63-tot-zhe-vopros-vtoroy-raz.md
  type: reflection_question
  duration_min: 1.5
  assertion: Тот же вопрос открытия, дословно, второй раз за занятие; зал отвечает снова, и вслух называется,
    у кого ответ изменился и что именно его изменило
  learning_goal: 'Закрытие петли, открытой на n04: вопрос предъявляется дословно второй раз, знак в знак,
    и отвечает на него зал, а не лектор. Полный разбор того, что за занятие стало проверяемым, — на следующем
    слайде'
  visual:
    pattern: reflection_question
    primary: 'Напоминание о первом предъявлении — тихой формой реплики, и там же названо, что зал отвечает
      вслух. Сам вопрос — дословно тот же, что на n04, в gold-рамке, одним предложением. Карточек-вариантов
      нет, как и при первом предъявлении.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.3. Формулировка — дословно та же, что на n04 этого занятия,
      под идею круга правок владельца (issue 225, §А2): агент упирается в границы собственного контекста,
      часть работы требует данных снаружи, часть — отдельного исполнителя с урезанными правами. Отвечает
      зал: сначала — у кого ответ изменился, потом два-три голоса — что именно изменило. Лектор свой ответ
      не называет и чужие не оценивает.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`; передача сессии открытия — `qa/peresmotr-otkrytie.md`
      §3 и §7 п. 1). Открытие переписано: вопрос занятия теперь задаётся на `n04` после двух промахов
      и звучит иначе — «Работа вышла за контекст агента — что вы заводите первым: приносите внутрь то,
      чего внутри нет, или выносите наружу то, что внутрь не помещается?». Этот слайд нёс прежнюю формулировку
      («Агент видит только то, что лежит в репозитории и в разговоре с вами. Где заканчивается этот контекст
      — и что вы заводите первым: доступ наружу или отдельного исполнителя с урезанными правами?») — то
      есть петля занятия была разорвана: на экране второй раз стоял другой вопрос. Приведено знак в знак.

      Вторая правка того же круга — вёрстка. `g_question` в `build_sem06.py` делит блок-цитату на сцену
      и вопрос по ПЕРВОМУ предложению с вопросительным знаком. Прежний текст держал вопрос двумя предложениями,
      и на готовый PNG приезжал огрызок: «Агент видит только то…» уходило в тихую реплику, в золотую коробку
      попадало «Где заканчивается этот контекст…» без начала, да ещё с непарной кавычкой-ёлочкой внутри
      (проверено по снимку до правки). Теперь вопрос — одно предложение, целиком внутри одной пары кавычек;
      разбиение проходит ровно по границе «напоминание | вопрос», и в золотой коробке стоит полный вопрос
      занятия. Приписка «Что в вашем ответе изменилось — и что именно его изменило?» снята с экрана и
      перенесена в напоминание над вопросом: два вопросительных знака в одной золотой коробке читались
      как два разных вопроса залу.

      Литературная редактура (issue 225, qa/pravki-nahodok-svedeniya.md п.3). Золотая коробка этого слайда
      — `form_question`, единственная форма деки для вопроса залу, и стоит в ней тот же вопрос и то же
      начертание, что на `n04` при первом предъявлении: снимать жирное здесь значило бы развести два предъявления
      одного вопроса и сломать грамматику «одна работа — одна форма». Форма не тронута. Снят повтор заголовка:
      напоминание начиналось словами «Этот вопрос уже звучал в начале занятия» при заголовке «Этот вопрос
      уже звучал», и первая клауза повторяла его дословно. Стало «В начале занятия ответ на него вы держали
      при себе» — смысл тот же, эха нет. Разбиение на напоминание и вопрос проходит там же, по первому
      предложению с вопросительным знаком.'
