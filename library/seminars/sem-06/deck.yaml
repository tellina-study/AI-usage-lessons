      git-истории, а не состояние, которое читает инженер, открывший проект.

      Ревизия (issue 225, круг 2, сверка слайда с разделом): та же находка, что на n02 этого занятия,
      — шесть отдельных блоков `**Название**` + путь + статус через пустую строку не распознаются разборщиком
      как отдельные карточки (его формат `cards` — одна строка, пункты через «·»), текст схлопывался в
      один слитный абзац. Заменено на таблицу той же формы, что на n02/n03/n64 этого занятия; факты и
      пути не изменились.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 4): экран не тронут
      — ни таблица, ни честные метки, ни подпись. В речь добавлены три фразы, связывающие две новые строки
      схемы с двумя ходами занятия (принести внутрь / вынести наружу), чтобы схема читалась продолжением
      разрешения, начатого на `n64`, а не отдельной инвентаризацией. Справка дополнена двумя ответами
      (где смотреть собранные файлы целиком; почему у хука коммит есть, у скилла нет) — до нормы заметки
      круга 4.'
- id: n66
  file: slides/n66-tot-zhe-vopros-vtoroy-raz.md
  type: reflection_question
  duration_min: 1.5
  assertion: Тот же вопрос открытия, дословно, второй раз за занятие; зал отвечает снова, и вслух называется,
    у кого ответ изменился и что именно его изменило
  learning_goal: 'Закрытие петли, открытой на n04: вопрос предъявляется дословно второй раз, знак в знак,
    и отвечает на него зал, а не лектор. Полный разбор того, что за занятие стало проверяемым, — на следующем
    слайде'
  visual:
    pattern: reflection_question
    primary: 'Напоминание о первом предъявлении — тихой формой реплики, и там же названо, что зал отвечает
      вслух. Сам вопрос — дословно тот же, что на n04, в gold-рамке, одним предложением. Карточек-вариантов
      нет, как и при первом предъявлении.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.3. Формулировка — дословно та же, что на n04 этого занятия,
      под идею круга правок владельца (issue 225, §А2): агент упирается в границы собственного контекста,
      часть работы требует данных снаружи, часть — отдельного исполнителя с урезанными правами. Отвечает
      зал: сначала — у кого ответ изменился, потом два-три голоса — что именно изменило. Лектор свой ответ
      не называет и чужие не оценивает.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`; передача сессии открытия — `qa/peresmotr-otkrytie.md`
      §3 и §7 п. 1). Открытие переписано: вопрос занятия теперь задаётся на `n04` после двух промахов
      и звучит иначе — «Работа вышла за контекст агента — что вы заводите первым: приносите внутрь то,
      чего внутри нет, или выносите наружу то, что внутрь не помещается?». Этот слайд нёс прежнюю формулировку
      («Агент видит только то, что лежит в репозитории и в разговоре с вами. Где заканчивается этот контекст
      — и что вы заводите первым: доступ наружу или отдельного исполнителя с урезанными правами?») — то
      есть петля занятия была разорвана: на экране второй раз стоял другой вопрос. Приведено знак в знак.

      Вторая правка того же круга — вёрстка. `g_question` в `build_sem06.py` делит блок-цитату на сцену
      и вопрос по ПЕРВОМУ предложению с вопросительным знаком. Прежний текст держал вопрос двумя предложениями,
      и на готовый PNG приезжал огрызок: «Агент видит только то…» уходило в тихую реплику, в золотую коробку
      попадало «Где заканчивается этот контекст…» без начала, да ещё с непарной кавычкой-ёлочкой внутри
      (проверено по снимку до правки). Теперь вопрос — одно предложение, целиком внутри одной пары кавычек;
      разбиение проходит ровно по границе «напоминание | вопрос», и в золотой коробке стоит полный вопрос
      занятия. Приписка «Что в вашем ответе изменилось — и что именно его изменило?» снята с экрана и
      перенесена в напоминание над вопросом: два вопросительных знака в одной золотой коробке читались
      как два разных вопроса залу.'
- id: n67
  file: slides/n67-chem-zanyatie-konchaetsya.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Из шести сегодняшних кейсов опору несут два — статус сервера и урезанные права роли; остальные
    четыре опираются на документированное исследование, которое одной командой на занятии не воспроизвести.
    С собой зал уносит вопрос, которым выбирают между двумя ходами
  learning_goal: 'Чем занятие кончается: названо, про что можно задать проверяемый вопрос и получить ответ
    командой, а дальше — вопрос к собственному проекту, которым выбирают между доступом наружу и отдельным
    исполнителем. Асимметрия между двумя опорами и четырьмя её отсутствиями проговаривается вслух, один
    раз на всё занятие'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на шесть строк: кейс, опора («есть» / пусто), чем проверяется. Строки в порядке
      блоков и кейсов этого занятия. Ни одна строка не подсвечена — целевого ответа здесь нет. Под таблицей
      — тихая реплика про пробел проверяемости и последняя подпись слайда: вопрос, которым зал выбирает
      ход у себя.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.4. Опоры проверяемости — репозиторий курса (self-incrimination,
      роли без урезанных прав) и машина студента (`claude mcp list`, `/mcp`, `/skill-doctor`, `/context`).
      Итоговая сетка — единственное место занятия, где счёт назван целиком: опору несут кейс 2 MCP и кейс
      1 субагента — ровно те два, что предсказывал `research/setka-keysov.md` §3 до написания разделов.
      Четыре клетки без опоры — не недосмотр: большинство материала здесь — документированное исследование
      (CVE, arXiv, GitHub issues), которое одной командой в аудитории не воспроизвести.

      Круг правок владельца (issue 225, §А2): закрывающий абзац ссылался на «разницу между отчётом и фактом»
      — формулировку арки, которую круг снял целиком. Заменена на формулировку под новую несущую мысль
      занятия: агент упирается в границы своего контекста, расширяет его данными снаружи или отдельным
      исполнителем, и у каждого расширения своя цена; необъявленный пробел в том, что из этого проверяемо
      прямо сейчас, стоил бы дороже объявленного. Строка «четыре из пяти, пятая — процесс — впереди» снята
      (§А1): ось занятия — четыре строки, все четыре закрыты осью занятия.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 4 «закрытие инвентаризирует,
      а не разрешает»; правило П5 «зал прикладывает материал к себе»). Слайд кончал занятие итогом протокола:
      что стало проверяемым, где опоры нет. Это честно и остаётся на экране без изменений — таблица на
      шесть строк, обе колонки и объявление пробела те же. Добавлено то, ради чего занятие шло: последней
      подписью теперь стоит вопрос, которым зал выбирает ход у себя («чего ей не хватает — того, чего
      внутри нет вовсе, или места, занятого чтением?»), и сразу за ним — куда уходит каждый из двух случаев.
      Прежняя последняя подпись («Ось этого занятия закрыта — все четыре строки теперь можно хотя бы частично
      проверить») снята отсюда: утверждение о закрытой оси переехало на `n64`, где рядом с ним стоит сама
      таблица оси, и повторять его в конце второй раз незачем. Тихая реплика про пробел проверяемости
      сжата на треть, чтобы место под вопрос взялось из этого же слайда, а не из его слота. Это вопрос,
      не задание: правило «занятие кончается на том, что стало проверяемым, а не на домашней работе» (`AUTHOR-BRIEF.md`
      п. 11) держится — отвечать вслух и присылать ответ никто не просит, и в справке это сказано прямо.'
