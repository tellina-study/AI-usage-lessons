# library/lectures/lec-09/deck.en.yaml
#
# English twin of deck.yaml (RU is source of truth; CLAUDE.md § Bilingual Production Rule,
# issue #172). Faithful translation, same 66 slides, same structure. `file:` paths point at
# slides-en/ with the same filename stems as the RU `slides/` originals (translated 1:1 by a
# separate pass). Render (PPTX) pending, matching the RU deck's own `note:` field below.

deck:
  lecture_number: 9
  title: "The frontier that becomes its own laboratory"
  subtitle: "AI in civilian space"
  audience: "3rd-year engineering students, universal"
  duration_min: 75
  central_question: "Which solutions did space force into existence — and did they exist before space demanded them?"
  axis: "Space is a frontier: extreme conditions (distance, the absence of ready-made infrastructure, the cost of error) make off-the-shelf engineering solutions insufficient and force new ones to be created — not borrowed from gentler conditions, but invented specifically under this pressure."
  learning_outcomes: [LO1, LO2, LO3, LO4, LO5]
  language: en
  chapter_ref: "library/lectures/lec-09/chapter.md (+ part1b, part2, part2b, part3)"
  status: draft
  version: v1
  issue: 310
  branch: "issue-310-lec-09-refresh"
  note: >
    Phase 5 (structure + slide content). The render (PPTX, Phase 6) has not been performed —
    media fields point at assets that were actually downloaded, where they exist
    (library/lectures/lec-09/assets/razdel-{1,2,3,4}/...), or are honestly marked
    media_needed/gap where no asset was found (LeoLabs — a gap, explicitly recorded).
    Keystone Row 2 (§0.6) is left as an explicit open placeholder for the owner —
    do not fill it in on their behalf.
  sections:
    - {n: 0, name: "Introduction", slides: "s01-s13"}
    - {n: 1, name: "Autonomous robots in space", term: "autonomous robotics", slides: "s14-s25"}
    - {n: 2, name: "Remote control", term: "teleoperation", slides: "s26-s36"}
    - {n: 3, name: "Design and new capabilities", term: "AI-assisted design and forecasting", slides: "s37-s48"}
    - {n: 4, name: "Space for AI", term: "orbital computing", slides: "s49-s56"}
    - {n: 5, name: "Wrap-up", slides: "s57-s66"}
    - {n: 6, name: "Closing", slides: "s67-s68"}
    - {n: "QA", name: "Questions", slides: "s69"}

slides:
  # ===== Section 0. Introduction =====
  - id: s01
    file: slides-en/s01-cover.md
    type: hero_cover
    section: "0. Introduction"
    assertion: "The frontier that becomes its own laboratory"
    learning_goal: "Hook + the topic's claim: civilian space as a frontier that forces invention, not just application"
    media: "assets/razdel-1/corob-x/corobx-12-pia12954-marius-hills-skylight-moon.jpg"

  - id: s02
    file: slides-en/s02-obval-stoimosti-zapuska.md
    type: norm
    section: "0. Introduction"
    assertion: "Delivering a kilogram to orbit has gotten 18–20 times cheaper over two decades — the anchor of the whole lecture"
    learning_goal: "§0.1: the number that holds up the whole industry overview, with a methodological caveat about the price list"

  - id: s03
    file: slides-en/s03-sputnikov-i-dannykh-na-poryadok-bolshe.md
    type: norm
    section: "0. Introduction"
    assertion: "The number of satellites grew ~12-fold in 10 years, and data grew by multiples more — this can no longer be serviced by hand"
    learning_goal: "§0.2: the second explosion — the growth in satellite count and data volume as a direct consequence of the first"

  - id: s04
    file: slides-en/s04-kto-zapuskaet-i-s-kakoy-skorostyu.md
    type: schema_matrix
    section: "0. Introduction"
    assertion: "Reusability is no longer one company's privilege, but more than half of the world's launches still come from one country"
    learning_goal: "§0.2a: the structure of the players, concentration, and booster turnaround speed"

  - id: s05
    file: slides-en/s05-starship-plan-i-fakt.md
    type: norm
    section: "0. Introduction"
    assertion: "Starship has flown 14 flights and caught the booster three times — but has never once caught the second stage"
    learning_goal: "§0.3: the second turn of the cost-decline spiral — an honest line between fact and goal"

  - id: s06
    file: slides-en/s06-porog-a-ne-obeschanie.md
    type: norm
    section: "0. Introduction"
    assertion: "Google names a $200/kg threshold for orbital computing — today it costs 2.5–3 times more than its terrestrial counterpart"
    learning_goal: "§0.4: what the cost decline opens up — a threshold, not an achieved state"

  - id: s07
    file: slides-en/s07-pochemu-seychas-tri-frontira.md
    type: schema_matrix
    section: "0. Introduction"
    assertion: "Space-based power, lunar bases, and asteroid mining are 1970s ideas; only now has the entry threshold fallen"
    learning_goal: "§0.4a: why right now — the barrier of entry versus the barrier of economics"

  - id: s08
    file: slides-en/s08-os-lektsii-i-adresa-platezha.md
    type: norm
    section: "0. Introduction"
    assertion: "A frontier doesn't just require solutions — it gives rise to them"
    learning_goal: "§0.5: the lecture's axis and the four payment addresses (distance, data, human time, new capability)"

  - id: s09
    file: slides-en/s09-keystone-ot-shakhty-do-lunnoy-trubki.md
    type: norm
    section: "0. Introduction"
    assertion: "A solution built for an earthly mine turned out to fit a lunar lava tube — the frontier itself became a laboratory"
    learning_goal: "§0.6 Keystone: the NeBula/LAMP trio — presents the axis through a single measured case"

  - id: s10
    file: slides-en/s10-vopros-lektsii.md
    type: norm
    section: "0. Introduction"
    assertion: "Which solutions did space force into existence — and did they exist before space demanded them?"
    learning_goal: "§0.7: the lecture's question, spoken here for the first time"

  - id: s11
    file: slides-en/s11-karta-vechera-chetyre-fronta.md
    type: schema_matrix
    section: "0. Introduction"
    assertion: "Four fronts: the machine decides on its own, a human controls at a distance, a model designs, computing moves into space"
    learning_goal: "§0.8: the map of the evening — the lecture-map slide"

  - id: s12
    file: slides-en/s12-kak-chitat-chisla.md
    type: norm
    section: "0. Introduction"
    assertion: "A fact-number, a threshold-number, and an analyst's estimate-number — three different kinds of numbers, and they must not be confused"
    learning_goal: "§0.8a: the rule for reading the numbers in this lecture"

  - id: s13
    file: slides-en/s13-forma-razbora-pyat-shagov.md
    type: schema_pipeline
    section: "0. Introduction"
    assertion: "Every case study from here on is built the same way: cost of error → the classical regime → the model → the mechanism → what shifted"
    learning_goal: "§0.9: the form of the case study — the template by which all 13 cases are read"

  # ===== Section 1. Autonomous robots in space =====
  - id: s14
    file: slides-en/s14-divider-razdel-1.md
    type: divider
    section: "1. Autonomous robots in space"
    assertion: "1. Autonomous robots in space"
    learning_goal: "Divider: AEGIS, SPOC, COROB-X, LeoLabs — the chapter's maximum of autonomy"

  - id: s15
    file: slides-en/s15-stadiya-avtonomnaya-robototekhnika.md
    type: norm
    section: "1. Autonomous robots in space"
    assertion: "Autonomous robotics — deciding and physically acting without a dispatcher at every step"
    learning_goal: "§1.1: the term, the data, how it is obtained, the decision, the alternative — the chapter's maximum of autonomy"

  - id: s16
    file: slides-en/s16-gde-klassika-gde-model.md
    type: norm
    section: "1. Autonomous robots in space"
    assertion: "Geometry is solved by the classical approach, with no learning involved; recognizing an object amid noise is solved by a trained model"
    learning_goal: "§1.2: the boundary between automation and a trained model, drawn on this section's material"

  - id: s17
    file: slides-en/s17-metody-geometriya-i-sluchayny-les.md
    type: norm
    section: "1. Autonomous robots in space"
    assertion: "A stereo pair computes distance by geometry, not learning; a random forest is an ensemble of trees you can read all the way through"
    learning_goal: "§1.2a, blocks 1–2: stereo vision/parallax and random forest — carry AEGIS"

  - id: s18
    file: slides-en/s18-metody-karta-bez-gps-i-detektor.md
    type: schema_layered
    section: "1. Autonomous robots in space"
    assertion: "Three levels of SLAM stitch together the robots' maps without GPS; the YOLO detector finds an object in a single pass"
    learning_goal: "§1.2a, blocks 3–4: SLAM with a pose graph and CNN detection — carry COROB-X, continuing the keystone"

  - id: s19
    file: slides-en/s19-primer-aegis.md
    type: case_study
    section: "1. Autonomous robots in space"
    assertion: "AEGIS raised target-selection accuracy from 24% to 93% — without a single command from Earth"
    learning_goal: "§1.3: the AEGIS case study, graph a, keystone-level strength of evidence"

  - id: s20
    file: slides-en/s20-primer-spoc.md
    type: case_study
    section: "1. Autonomous robots in space"
    assertion: "SPOC labels Martian terrain with a deep network at 98% accuracy — already today on Earth, onboard only in the future"
    learning_goal: "§1.4: the SPOC case study, graph b, an Earth-side tool plus a forward-looking part"

  - id: s21
    file: slides-en/s21-primer-corob-x.md
    type: case_study
    section: "1. Autonomous robots in space"
    assertion: "Three robots reconnoitered a lunar lava tube where no classical analog on Earth existed at all"
    learning_goal: "§1.5: the COROB-X case study, graph c — a genuinely new task"

  - id: s22
    file: slides-en/s22-primer-leolabs.md
    type: case_study
    section: "1. Autonomous robots in space"
    assertion: "LeoLabs prioritizes the radar and issues up to 400% more conjunction warnings — but doesn't know how many maneuvers actually resulted from them"
    learning_goal: "§1.5a: the LeoLabs case study, the section's fourth case study (the 3+6 exception), graph b"

  - id: s23
    file: slides-en/s23-upominaniya-razdel-1.md
    type: norm
    section: "1. Autonomous robots in space"
    assertion: "The classical approach carries Perseverance for 90% of its route with no neural network at all; Starlink performs 300,000 maneuvers a year on its own"
    learning_goal: "§1.6: six mentions — a different task type, a different readiness status"

  - id: s24
    file: slides-en/s24-chto-dalo-i-potrebovalo-razdel-1.md
    type: schema_matrix
    section: "1. Autonomous robots in space"
    assertion: "The gain is large where the technology has been flying for years; where it hasn't flown, that is stated plainly"
    learning_goal: "§1.7 + the cumulative stage map: what it gave, what it required, three cells of the grid filled"

  - id: s25
    file: slides-en/s25-vyvod-razdela-1.md
    type: norm
    section: "1. Autonomous robots in space"
    assertion: "Geometry goes to the classical approach, recognizing an object amid noise goes to the model, and a genuinely new task has no classical analog at all"
    learning_goal: "§1.8: the conclusion of Section 1, a bridge to Section 2"

  # ===== Section 2. Remote control =====
  - id: s26
    file: slides-en/s26-divider-razdel-2.md
    type: divider
    section: "2. Remote control"
    assertion: "2. Remote control"
