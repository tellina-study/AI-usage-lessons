    section: "Раздел 2. Архитектура — до кода, и ею надо управлять"
    duration_min: 3
    assertion: "Управлять архитектурой с AI можно четырьмя практиками: ADR (durable-контекст), fitness-функции (надзор на каждом коммите), C4/архитектура-как-код (машиночитаемая), эволюционная архитектура — инструменты вторичны"
