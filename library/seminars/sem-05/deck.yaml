      рамке. Схема khuki-n32-sloi.png: два слоя настроек, из каждого стрелка в один и тот же вызов.'
    backup: 'Складывание уровней — research/mechanics-3-khuk.md §1.5, дословно из документации: «When
      you set the same list key… Claude Code combines the lists instead of picking one» и «All matching
      hooks run in parallel»; хуки — тоже список, поэтому личный из домашних настроек и проектный на то
      же событие сработают ОБА. Пять уровней настроек по приоритету там же. Честный пробел — STRUCTURE-PROPOSAL-part2.md
      К3 такт 7: сколько хуков в среднем стоит в реальном проекте и какова суммарная латентность по флоту
      не измерено никем, контролируемого эксперимента не существует. Поэтому кейс учит арифметике и методу,
