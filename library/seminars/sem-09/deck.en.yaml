    pattern: mechanism_field_contrast
    figure: k6-shema-vysota-simvola-en.png
    primary: 'A two-column figure on one file: a "amount, bigger font size" column and a "date, smaller
      font size" column, the same compression scale top to bottom — the amount breaks only on the last
      step, the date on the last two. Below — two threshold ranges ("1.5–3.1 px" for the amount, "2.9–5.8
      px" for the date) with an honest note that the ranges partly overlap, not split exactly in half.

      '
    backup: 'The mechanism follows SETKA-KEYSOV-S9-part2.md, section "Case 6," subsection "Nuances," item
      3: "the degradation threshold is tied to glyph height, not to the file''s megapixels." After the
      honest rerun of 2026-10-27 (fixing the prompt leak, issue #299), this support got stronger, not
      weaker: BEFORE the fix the amount "didn''t break at all," which looked like suspiciously stable
      behavior; AFTER the fix, two honest thresholds are visible for two fields of different height —
      exactly what the mechanism predicts.

      The amount''s base font size at full resolution is 64 pixels, the date''s base font size is 32 pixels
      (`stend/zamery-k5-k6/README.md`, Measurement 4.1): the date is set at half the size, and that''s
      the baseline without which the two different thresholds aren''t comparable. The actual glyph height
      (not the font size, but the measured font bounding box) at each compression step for the amount:
      49.0 / 24.5 / 12.2 / 6.1 / 3.1 / 1.5 px; for the date (`measure_date_glyph_height.py`, added 2026-10-27):
      23.0 / 11.5 / 5.8 / 2.9 / 1.4 / 0.7 px — exactly half the amount''s height at every step, as expected
      from a font size half as large.

      The amount''s threshold is strictly between `sixteenth` (3.1 px, 5/5 correct) and `thirtysecond`
      (1.5 px, 0/5 correct), that is, in the range 1.5–3.1 px. The date''s threshold is strictly between
      `quarter` (5.8 px, 5/5 correct) and `eighth` (2.9 px, 0/5 correct), that is, in the range 2.9–5.8
      px. The ranges PARTLY OVERLAP (a shared zone of 2.9–3.1 px) — this is not exactly half and not two
      separate zones, and the figure names this honestly rather than flattening it into a neat "half as
      much."

      What''s deliberately not on the frame: the reason why the amount''s margin is so much bigger than
      the date''s (a stable money-amount pattern, a large monospace font) is a separate, NOT measured
      hypothesis from beat n70 — repeating it here as part of the "mechanism" would mean passing off a
      guess as a finding.'
