      слайда ради этой находки не менялись.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 4 «закрытие инвентаризирует,
      а не разрешает»). Слайд открывал закрытие словами «Ось закрыта: четыре строки» — отчёт о проделанном,
      который ничего не разрешает. Занятие открывается двумя промахами одного человека (`n01`, `n04`);
