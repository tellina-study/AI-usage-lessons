# Знание вне промта
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 10
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n04    5.50 мин
#   Кейсы      n05–n76   59.75 мин
#   Разбавитель n77–n80    4.50 мин
#   Закрытие   n81–n83    5.00 мин
#   ИТОГО                  74.75 мин при слоте 90

deck:
  seminar_number: 10
  title: Знание вне промта
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 74.75
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + настоящие скрины живого
    холста n8n.lessons.tellian.io во всех четырёх кейсах (сняты Playwright через обход `~/.cache/page-shot-libs/x`,
    ограничение notes/mcp-limitations.md [#233-8] снято 2026-10-20) + схемы постановки задачи (сплошным
    — то, что уже собрано, пунктиром — то, что предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
    + четыре измеренных замера на этом стенде (SberQuAD для текста, CORD для изображений), протоколы в
    `stend/raw/`
  cover_hook: null
  central_question: Как устроить базу знаний, которая растёт?
  language: ru
  slide_count: 83
  axis: Четыре утверждения, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным, по
    строке за кейс
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: База знаний, которая весь прошлый семинар жила внутри промта, сегодня выходит за его пределы
  learning_goal: Обложка. Называет тему занятия и его ступень дуги — знание вне промта (ступень 4), не
    новую механику инструмента.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия на экране нет.

      '
    backup: 'Название — дословно из ARCHITECTURE.md (поле title) и SETKA-KEYSOV.md («Тема занятия»): откуда
      процесс берёт факты и почему считает их верными. Номер занятия на обложке не печатается — решение
      владельца, sem-06/qa/oblozhka-bez-nomera.md, тот же приём, что у обложек С8/С9. Фигуры на обложке
      нет сознательно: вопрос занятия задаётся дословно на n03 и возвращается на n81, и третье место на
      обложке сбило бы счёт этих двух (приём n01 Семинара 9).'
- id: n02
  file: slides/n02-shov-s9-s10.md
  type: content
  duration_min: 1.5
  assertion: 'С9 по плану дуги должен закончиться вопросом, с которого С10 начинается буквально: при каком
    размере базы «всё в промт» перестаёт быть разумным'
  learning_goal: 'Шов С9→С10. Входное состояние названо одной строкой словами, несущая работа кадра —
    критерий, которым по плану дуги должно закончиться прошлое занятие (канон §2 README: шов переносится
    дословно, не пересказывается — здесь применяется к плану дуги, а не к уже произведённому финальному
    экрану С9).'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: строка про входное состояние, под ней дословная цитата вопроса, которым
      закончился С9, под ней строка про то, что растёт.

      '
    backup: 'Объединённый выходной файл С9 (sem-09/stend/sborka.py::student_file()) существует только
      на непромерженной ветке issue-299-sem-09-issledovanie (ARCHITECTURE.md §2, открытая задача шва —
      эскалировано, не решается этим слайдом). Поэтому форма входа здесь — ТОЛЬКО то, что ARCHITECTURE.md
      зафиксировал как критерий, которым по плану дуги должно закончиться С9, не реконструкция всего финального
      экрана (который на непромерженной ветке работы по С9 заканчивается тремя условиями, а не одной фразой-критерием).
      Пять доработок С9 перечислены прозой (ответ клиенту, проверка ответа, полномочие кода на правило
      возврата, устойчивый формат, чтение фотографии) — без схемы узлов: схемы узлов С9 в этом рабочем
      дереве нет, выдумывать её нельзя (канон §8.7 «не реконструировать неизвестное»).'
- id: n03
  file: slides/n03-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Четыре утверждения, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным,
    по строке за кейс
  learning_goal: 'Несущая ось занятия: откуда процесс берёт факты и почему считает их верными. Вопрос
    занятия задаётся здесь дословно и дословно же возвращается на n81. Правая колонка открывается пустой
    и закрывается на n81, не здесь.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, четыре строки. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — дословно из SETKA-KEYSOV.md, раздел «Ось занятия» / rework/section-0-otkrytie.md,
      четыре строки в том же порядке. Вопрос занятия — тоже дословно оттуда. Тот же текст, знак в знак,
      стоит на n81; сверка двух мест обязательна при пересборке. ЗАГОЛОВОК И ПЕРВАЯ СТРОКА — ПРО САМУ
      ОСЬ (Pre-USER-GATE §6): заголовок называет вопрос, которым занятие мерит каждый свой разбор. Четыре
      строки (не шесть, как у С9) — по числу кейсов С10.'
- id: n04
  file: slides/n04-chto-segodnya.md
  type: content
  duration_min: 1.5
  assertion: Четыре кейса подряд и один концептуальный разбавитель; каждый кейс стоит на прогоне собственного
    стенда на реальных данных
  learning_goal: Обзор занятия. Называет четыре кейса по задаче (не по тезису) и разбавитель, без раскрытия
    находок. Матчит паттерн Lec-N-1 раздела «что разбирается сегодня» применительно к семинару.
  visual:
    pattern: content
    primary: 'Короткий список из пяти пунктов (четыре кейса + разбавитель), каждый — одна строка задачи
      без спойлера находки.

      '
    backup: 'Источник — rework/section-0-otkrytie.md, раздел «Что разбирается сегодня», переложено в компактный
      список. Имена кейсов — по задаче (канон §1 проектирования), совпадают с case_track конфига дословно.
      Нюанс про честный провал Кейса 4 (rework/section-0 «Нюанс, который открытие обязано назвать прямо»)
      сознательно НЕ вынесен на этот слайд: спойлер находки здесь нарушил бы А1/С2 (результат раньше самого
      кейса). Он называется в начале Кейса 4 (n60), не здесь.'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Десять пунктов справочника, с которыми Ольга работала на прошлом занятии, — это база на момент
    запуска, не её постоянный размер
  learning_goal: 'Дивайдер Кейса 1. Форма — сцена-продолжение: прямое развитие вопроса, которым закончился
    С9. Называет проблему (А2), измеренного результата не выдаёт.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Название кейса — «Хранение базы знаний», по функции (канон §1 проектирования — задача, не
      тезис/урок), совпадает с case_track дословно. Цитата — прямое продолжение вопроса С9, не придуманная
      сцена: SETKA-KEYSOV.md, Кейс 1, «Форма входа».'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга хочет тот же точный и дешёвый ответ при любом размере базы; версия 1 — просто дописывать
    базу в тот же промт без ограничения
  learning_goal: 'Такт сцены Кейса 1: живая постановка потребности — что хочет Ольга, какая версия 1 естественна,
    и чем она рискует при росте базы. Без вердикта и без числа прогона (правило А6/С2: находка — тактом
    вопроса и разбора, не здесь).'
  visual:
    pattern: problem_scenario
    figure: case1-shema-postanovka.png
    primary: 'Сверху — схема С1 (канон forma-keysa-s-zamerom.md §2): сплошным — поток, уже работающий
      с прошлого занятия (вопрос формой → весь текст справочника в промт целиком → модель отвечает, видя
      базу полностью); пунктирная золотая стрелка — то, что строит этот кейс: отдельное хранилище и поиск
      нужного куска, которые займут место узла «весь справочник целиком». Под схемой — плашка потребности
      («точный и дешёвый ответ при любом размере базы»), три альтернативы устройства решения без цифр
      и вердиктов, честный вопрос, который сцена оставляет открытым.

      '
    backup: 'Потребность и версия 1 — дословно из SETKA-KEYSOV.md / rework/ section-1-khranenie-bazy.md,
      «Постановка». Рядом с версией 1 названы (без разбора) ещё два реально рассматриваемых способа —
      keyword-поиск и векторное хранилище, как и требует постановка кейса целиком (не только вопроса):
      ни цифр, ни преимуществ/недостатков здесь нет, это такт вопроса (n07) и разбора (n10/n13).

      СХЕМА ПОСТАНОВКИ (правило С1) добавлена этой правкой: `rendered/ make_figures_sem10.py::case1_shema_postanovka()`,
      новая функция, не трогает существующие `case1_scheme`/`case2_scheme`/`case3_scheme`/ `case4_scheme`.
      Сплошной ряд — узлы, которые уже существуют и работают (форма вопроса, весь текст базы в промте,
      ответ модели); они продолжают постановку С9 (`n05`, speaker notes: «процесс научился отвечать обратившемуся
      сам — по справочнику из десяти пунктов, целиком вписанных в промт»). Пунктирная стрелка — единственный
      элемент схемы, которого ещё нет: она указывает на узел «весь справочник целиком», потому что именно
      его заменит решение этого кейса (подтверждено n15: «вместо того чтобы передавать модели всю базу...
      хранит базу отдельно»). Имени инструмента (n8n, OpenRouter) на этой схеме нет сознательно — она
      про поток сообщения, не про реализацию; реализация — слой 2, n16/n17/n18.

      МОДЕЛЬ НАЗВАНА НА САМОЙ СХЕМЕ (С5): узел «Модель отвечает» несёт подпись `gpt-4o-mini, вся база
      в промте` — то же имя, что везде в замере этого кейса (`stend/harness2.py::CHAT_MODEL`). В отличие
      от n15 (слой 1, архитектурная формулировка кейса, сознательно без имени инструмента И без имени
      модели — она обязана пережить смену обоих), эта схема — не архитектура решения, а живой поток сообщения,
      продолжающий С9, и модель в нём уже реально вызывается, поэтому С5 применяется к ней буквально.'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.0
  assertion: Три действия для растущей базы — ни одно не названо победителем заранее
  learning_goal: 'Вопрос Кейса 1: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор (§5 проектирования), а не факт о свойствах инструмента.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, три карточки равной ширины, без доводов и вердиктов. Разбор — следующим
      экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV.md, Кейс 1, «Вопрос залу»: три действия, не факты о возможностях
      инструмента (проверка §5 проектирования — в каждую подставляется повелительный глагол: «продолжать
      дописывать», «искать», «положить»).

      ПРАВКА 2026-11-12 (issue #311): в третьей карточке «вытаскивать нужный кусок» → «вытаскивать нужный
      документ». Зал голосует за карточку, а потом её замеряют: в Кейсе 1 поиск отдаёт ОДИН документ целиком
      (`stend/measure/case1_measure.py::vector_search_top1`, векторы посчитаны `embed_corpus.py` по полному
      тексту документа), нарезка на куски — предмет Кейса 2. Формулировка расходится с SETKA-KEYSOV.md,
      где карточка записана прежним словом; расхождение сознательное, кадр следует замеру.'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 1.0
  assertion: Три действия решают одну и ту же задачу разными средствами — какое из них выдержит рост базы,
    здесь ещё не говорится
  learning_goal: 'Качественный разбор трёх действий Кейса 1 СРАЗУ после вопроса (требование владельца
    курса: разбор следует за вопросом напрямую, без разрыва на такты структуры замера — n07 → n08 → дальше
    структура замера и результат). Разбор объясняет механизм и качественные плюсы/минусы без единого числа
    результата, по образцу n62-k4-razbor.md; канон С2 (`forma-keysa-s-zamerom.md`) не нарушен — до такта
    структуры замера на кадре нет ни одного результата. Названия действий дословно повторяют карточки
    вопроса n07.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Три строки. Никаких чисел на
      кадре.

      '
    backup: 'Текст — очищенная от чисел версия n13-k1-razbor.md (колонки «Как делает» и качественная часть
      «Преимущество»/«Недостатки»); все числовые величины ($, %, accuracy, recall@1) из исходной таблицы
      убраны, оставлен только механизм и качественное суждение.

      ПРАВКА 2026-11-12 (issue #311), две штуки. (1) ПО ФАКТУ ЗАМЕРА: в третьей строке «кусок» заменён
      на «документ», а «базу нужно разбить на куски и посчитать для каждого эмбеддинг» — на «для каждого
      документа базы нужно посчитать эмбеддинг». В Кейсе 1 нарезки нет: `stend/measure/embed_corpus.py`
      эмбеддит полный текст каждого документа, `case1_measure.py::vector_search_top1` отдаёт ОДИН документ
      целиком. Тот же сдвиг убран из второй строки («может не найти документ, в котором ответ есть»).
      Имя третьего действия приведено к карточке n07, которую правка тронула так же. (2) ПРОИЗВОДСТВЕННАЯ
      ЛЕКСИКА: слово «такт» снято из поля `assertion:` и из секции Assertion (она в этом жанре на кадр
      не выводится, но живёт в `deck.yaml` и в карте слайдов) — формулировка без счёта кадров, по образцу
      n25.'
- id: n09
  file: slides/n09-k1-struktura-zamera.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: Один и тот же набор из десяти вопросов проходит через все три действия на каждом из четырёх
    размеров базы — ни одного результата на этом кадре
  learning_goal: 'Такт С2 (структура замера, канон forma-keysa-s-zamerom.md §1): модель и её настройки,
    что варьируется в замере, пример вопроса и ожидаемый ответ — ДО того, как на кадре появится хоть одно
    число исхода. Вставлен между n07 (вопрос залу) и n10 (свод), чтобы зал увидел устройство теста раньше
    первой цифры (цена пропуска — slide 12 деки С9, разбор 2026-10-29: «я не понимаю, он ответил верно
    или неверно», когда три такта сжаты в один).'
  visual:
    pattern: measured_outcome_table
    primary: 'Плашка «что в замере» (размер базы, набор вопросов, модели, пример вопроса с эталонным ответом),
      под ней — таблица устройства трёх действий: как находится текст для ответа и сколько вызовов модели
      это стоит на вопрос. В подвале — плашка о втором вызове. Ни «верно», ни «неверно», ни одной accuracy/цены
      на этом кадре.

      '
    backup: 'НОВЫЙ ТАКТ, добавлен этой правкой (канон С2: «структура теста, до всяких результатов», `forma-keysa-s-zamerom.md`
      §1). До этой правки n10 сразу открывался сводом результатов — без отдельного кадра устройства теста
      перед ним, ровно тот дефект, который канон называет цитатой владельца о слайде 12 Семинара 9.

      ПРАВКА 2026-11-12 (issue #311, указание владельца): ПЛАШКА-ПОДВАЛ С ПРИМЕРОМ ВОПРОСА ЗАМЕНЕНА ТАБЛИЦЕЙ
      УСТРОЙСТВА ТРЁХ ДЕЙСТВИЙ плюс плашкой о втором вызове. Дословно: «вместо текущего подвала дать краткий
      комментарий, как работает полнотекстовый поиск по предложениям (keyword) и векторный поиск по чанкам,
      и что происходит с найденным результатом потом — передаётся в модель второй раз». Сам пример вопроса
      с эталонным ответом НЕ потерян — он переехал строкой в таблицу «что варьируется», потому что такт
      С2 обязан показать пример вопроса и эталонный ответ до первых чисел.

      ФОРМУЛИРОВКА ВЛАДЕЛЬЦА СВЕРЕНА С КОДОМ СТЕНДА И В ДВУХ МЕСТАХ НЕ ПОДТВЕРДИЛАСЬ — на кадр пошло то,
      что в коде; гипотеза осталась здесь: (1) «полнотекстовый поиск ПО ПРЕДЛОЖЕНИЯМ» — неверно для Кейса
      1: `stend/measure/case1_measure.py::keyword_search_top1` сравнивает вопрос с документом ЦЕЛИКОМ,
      на предложения не режет (`tokenize` того же файла принимает весь `doc["text"]` одной строкой); (2)
      «векторный поиск ПО ЧАНКАМ» — неверно для Кейса 1: `vector_search_top1` сравнивает вектор вопроса
      с вектором документа ЦЕЛИКОМ, а векторы документов посчитаны `embed_corpus.py` по полному тексту
      каждого документа; нарезка на куски — предмет Кейса 2, и на кадре это сказано явно, чтобы кадр не
      обещал того, чего в Кейсе 1 нет. (3) «передаётся в модель второй раз» — ПОДТВЕРДИЛОСЬ: найденный
      документ целиком уходит вторым, отдельным вызовом `llm_answer` (`harness2.py`) в `gpt-4o-mini`.

      УСТРОЙСТВО ПОИСКА ПО СЛОВАМ, дословно по `keyword_search_top1` и `tokenize`: регулярное выражение
      `[а-яёa-z0-9]+` режет текст на слова, выбрасываются слова из списка служебных (STOPWORDS, 140 слов)
      и все короче трёх букв (`len(t) > 2`); считается размер пересечения МНОЖЕСТВ уникальных слов вопроса
      и документа (`len(q_tokens & d_set)`); побеждает наибольший счёт, при равном счёте — тот документ,
      что встретился раньше (сравнение `score > best_score`, строго больше), а `case1_measure.py` собирает
      подборку как `needle + distractors`, то есть документы с ответами идут первыми. ВАЖНО: на кадр пошёл
      КОД. Прежняя редакция докстринга обещала нормировку на длину документа («простая TF-эвристика»),
      которой в коде нет — `score = overlap`; 2026-11-12 (issue #311) докстринг приведён к коду, сам код
      не тронут — по нему получены все числа Кейса 1.

      СЧЁТ ОБРАЩЕНИЙ К МОДЕЛЯМ: промт целиком — одно (ответ); поиск по словам — одно (ответ; сам поиск
      моделей не вызывает вовсе); поиск по смыслу — два (вектор вопроса и ответ). Оговорка для заметок,
      не для кадра: в самом ЗАМЕРЕ векторы десяти вопросов посчитаны заранее, одним пакетом (`embed_corpus.py`),
      поэтому столбец цены на n10 у варианта «по смыслу» считает только обращение за ответом; в живой
      системе вектор вопроса считается в момент запроса, и это второе обращение.

      МОДЕЛЬ И НАСТРОЙКИ (С5): `openai/gpt-4o-mini` — формирует финальный ответ по переданному тексту;
      `openai/text-embedding-3-small` — считает векторы вопроса и документов для векторного поиска. Оба
      вызова — через один и тот же вебхук стенда (`s10-raw-openrouter`), без явно заданных дополнительных
      настроек (температура и прочие параметры — по умолчанию): `stend/harness2.py`, `CHAT_MODEL`/`EMBED_MODEL`.
      Системная инструкция вызова ответа показана буквально на n18 — здесь не повторяется, чтобы не дублировать
      кадр.

      КОРПУС И ЧТО ВАРЬИРУЕТСЯ: `stend/measure/case1_measure.py`. Десять вопросов SberQuAD (открытый датасет
      вопросов-ответов по статьям русской Википедии с эталонной разметкой) — ОДИН И ТОТ ЖЕ набор на всех
      двенадцати комбинациях «размер базы × действие». Корпус на каждом размере состоит из десяти документов
      с ответами на эти вопросы («needle») плюс случайные документы-дистракторы до нужного объёма: 10
      = только needle, 50/200/500 = needle + дистракторы.

      ПРИМЕР — дословно из `raw/case1-results.json`, qid `q1`, размер базы 10 (тот же вопрос задаётся
      на всех четырёх размерах без изменений). Ожидаемый ответ — поле `reference_answer` протокола, не
      моя формулировка; `gold_doc_id` — документ, в котором этот ответ содержится. Вопросы Кейса 1 пересобраны
      2026-11-02 (issue #311) со стратификацией lexical_gap/exact_match/neutral — той же классификацией,
      что уже используется в Кейсе 3 (`corpus/corpus_case1.json`, поле `questions`, `lexical_class`);
      q1 относится к классу lexical_gap (overlap_ratio 0,2 — вопрос и документ делят мало слов в начальной
      форме).

      НИ ОДНОГО РЕЗУЛЬТАТА НА КАДРЕ (С2): ни accuracy, ни цены, ни recall, ни слова «ошибка». Устройство
      теста целиком — и останавливается здесь.'
- id: n10
  file: slides/n10-k1-rezultat-zamera.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: 'На 500 документах промт целиком не дорожает постепенно — он держит точность на одном уровне
    три шага подряд и затем физически отказывается отвечать: запрос превышает контекст модели'
  learning_goal: 'Такт С2 (свод) — прямое продолжение n09 (структура). Найти нужный документ и ответить
    верно — разные вещи, и кадр показывает это двумя соседними строками на каждом способе поиска. Таблицы
    разведены по С6: доли из десяти вопросов — одна таблица, цена в долларах — другая.'
  visual:
    pattern: measured_outcome_table
    primary: 'Две таблицы 5×5, обе развёрнуты одинаково: строка — действие и мера, столбец — размер базы.
      Первая таблица — доли из десяти вопросов, и у каждого способа поиска в ней ДВЕ строки: «нашёл нужный
      документ» и «ответил верно», чтобы разрыв между ними читался сверху вниз. Вторая таблица — цена
      одного вопроса в долларах.

      '
    backup: 'Числа — SETKA-KEYSOV.md Кейс 1 / stend/raw/case1-results.json, 10 вопросов SberQuAD × 4 размера
      базы (10/50/200/500, 500 добавлен доп. проходом 2026-11-01 по замечанию владельца «текущий замер
      слишком лёгкий») × 3 варианта. Вопросы пересобраны повторно 2026-11-02 (issue #311) со стратификацией
      lexical_gap/exact_match/neutral (методология Кейса 3) — старые 10 вопросов были почти все «точное
      совпадение», что тривиально давало keyword recall@1=1,0 и не проверяло заявленное. «Ответил верно»
      = строгое вхождение эталонного короткого ответа подстрокой — занижает абсолютные цифры ОДИНАКОВО
      для всех вариантов (эта оговорка о методе замера — в заметках, не на экране, §7.1). HTTP 400 текст
      ошибки — дословно из поля `exec_id: "2483"`, прогон этой пересборки.

      ПРАВКА 2026-11-12 (issue #311, указание владельца): ПЛАШКА-ПОДВАЛ УБРАНА, ни одно её число не потеряно.
      Дословно: «убрать подвальный блок». В подвале стояли recall@1 обоих способов и объяснение отказа
      на 500 документах. Решение: recall@1 — это РЕЗУЛЬТАТ, не оговорка о методе, поэтому он встал числом
      в таблицу по всем четырём размерам, а знаменатель отказа («≈160 000 токенов против контекста 128
      000») — в ту же ячейку, где стоит сам отказ (§7.2: знаменатель остаётся на кадре, рассуждение о
      надёжности замера уходит в заметки).

      ТАБЛИЦА КАЧЕСТВА ПЕРЕСОБРАНА: вместо одной строки accuracy на действие — по ДВЕ строки на каждый
      способ поиска, «нашёл нужный документ» и «ответил верно». Это и есть несущая мысль занятия: поиск
      по словам находит нужный документ в 8 случаях из 10, а верный ответ даёт в 4-5; поиск по смыслу
      находит в 10 из 10, отвечает верно в 6-7. Пока обе меры стояли в разных блоках кадра (accuracy в
      таблице, recall в подвале), разрыв между ними не читался вовсе.

      ПЕРЕСЧИТАНО ОТ СЫРЫХ ДАННЫХ, не взято с прежней редакции кадра: доли посчитаны по `details` протокола
      (`keyword.retrieved_correct`, `keyword.correct`, `vector.retrieved_correct`, `vector.correct`, `stuffing.correct`),
      сгруппированным по `corpus_size`, и сошлись с полем `summary` того же файла до последнего знака.
      Расхождений с числами прежней редакции кадра нет.

      ОБЕ ТАБЛИЦЫ РАЗВЁРНУТЫ ОДИНАКОВО (строка — мера, столбец — размер базы). Прежняя редакция держала
      размер базы в строках; разворот понадобился, чтобы пять мер качества поместились в один заголовок
      строки вместо пяти столбцов. Таблица цены развёрнута следом: две таблицы противоположной ориентации
      на одном кадре читаются неправильно — глаз переносит с первой на вторую привычку счёта.

      ТЕРМИНЫ. «Keyword»/«vector» в видимом слое заменены на «поиск по словам»/«поиск по смыслу» — те
      же слова, которыми говорит n09 и которыми названы действия на n13/n14. «Recall@1» и «accuracy» с
      кадра сняты по §5.20 (термин без объяснения на кадре не ставится) и заменены на «нашёл нужный документ»
      и «ответил верно»; заголовок столбца «Доля из 10 вопросов» объясняет, что значит 0,7.'
