- id: n73c
  file: slides-en/n73c-k6-edinyy-eho-zayavki.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: At the heaviest resolution, the single call doesn't read the photo at all — in all five repeats
    it substitutes what's written in the request as the read amount, and declares a match, even when the
    request is deliberately wrong
  learning_goal: 'Beat n73c (issue #299, Z3): a breakdown by group (C2, item 3) — Finding 1 of the zamery-k6-edinyy
    README, the single call''s load-bearing number for the case. Verbatim data from execution thirtysecond
    #1–5, set against the two-step device''s safe failure on the same resolution.'
  visual:
    pattern: answer_breakdown_table
    primary: 'A table of five live repeats at the `thirtysecond` resolution (53×64 px): whether the request
      is correct, what it states, what the model named as the read amount, what text it used to describe
      "what it saw," and what verdict it handed down. All five rows show the same thing: the read number
      exactly equals the stated number. Below the table — a "safe failure / dangerous confirmation" card
      comparing this with the two-step device''s behavior on the same file.

      '
    backup: 'Numbers from `stend/zamery-k6-edinyy/README.md`, section "Finding 1 (Main)": at `thirtysecond`
      (53×64 px, amount digit height 1.5 px), all 5 of 5 single-call repeats name the read amount as exactly
      `zayavka_sum_rub`, not the receipt''s true amount (18990) — including three cases where `zayavka_verna=False`
      (a deliberately wrong request). The `raw_text_seen` field changes its formatting to match the request
      each time (sometimes with "₽" and kopecks, sometimes without) — the model isn''t simply repeating
      a number, it''s composing a plausible "as if read" text string to go with it. The verdict in all
      5 of 5 is `sovpalo` ("matched"), including the three cases with a deliberately wrong request.

      Comparison with the two-step device — same README: at this same resolution, with no request text,
      the two-step device stably hallucinates the same number, unrelated to the truth — all 5 of 5 calls
      returned `sum_rub=1600` (`../zamery-k5-k6/results-k6-resolution.json`, `thirtysecond.entries[*].parsed.sum_rub`).
      The deterministic code compares `1600` to the request''s amount and almost never finds a match —
      the two-step device''s reading failure turns into a SAFE failure (the request goes to a manual check).
      In the single call, the same reading failure drifts toward the stated number — toward where the
      failure is DANGEROUS: a wrong request gets stamped "matched" and moves on without a check. The README
      calls this "a shift of the error''s direction from conservative to dangerous" — not a worsening
      of the same error, but a different failure class.

      An honest limit, stated plainly in the README: the anchoring is measured on n=3 of 3 (deliberately
      wrong requests at this resolution) and n=5 of 5 full repeats — the effect at this n is clean (100%),
      but that''s no basis for a precise rate of "how often" in the general case with a different receipt
      or a different model.'
- id: n73d
  file: slides-en/n73d-k6-edinyy-protivorechie.md
  type: answer_breakdown_table
  duration_min: 1.5
  assertion: At the sharpest resolution, the model reads the amount correctly five times out of five,
    and two times out of five still gets the verdict wrong — because it's comparing its own two numbers,
    written as different text, as if they were different
  learning_goal: 'Beat n73d (issue #299, Z3): the breakdown by group''s second finding (C2) — Finding
    2 of the zamery-k6-edinyy README. Shows that the single call''s failure doesn''t reduce to bad reading:
    at the best resolution, reading is flawless, and the cross-check still breaks — the language comparison
    step is unreliable on its own.'
  visual:
    pattern: answer_breakdown_table
    primary: 'A table of three live repeats at `full` resolution, where the stated amount matches the
      true one: the amount read, the amount from the request (both fields — the same number, different
      text), the model''s verdict, and whether it''s correct. Two of three verdicts are wrong with identical
      read numbers. Below the table — a comparison with deterministic code, which never errs on these
      same numbers.

      '
    backup: 'Numbers from `stend/zamery-k6-edinyy/README.md`, section "Finding 2": at `full` (49 px, the
      sharpest image) the amount is read correctly 5 out of 5 times, and EVERY time the model names `sum_rub="18990,00"`
      and `zayavka_sum_rub="18990"` — the same number written twice, in a different format (",00" and
      without). On the three repeats where `zayavka_verna=True` (the stated amount really equals the true
      one), the verdict diverges: `full #1` → `ne_sovpalo` ("didn''t match," wrong), `full #3` → `sovpalo`
      ("matched," correct), `full #5` → `ne_sovpalo` (wrong) — three DIFFERENT live calls on the SAME
      image with the same request gave two different outcomes with identical read numbers.

      This isn''t a photo-reading error (the amount is read correctly all 5 times) — it''s an error in
      the model''s own last language step: comparing the string "18990,00" with the string "18990." It
      seems the model doesn''t always normalize format before comparing, and sometimes treats a difference
      in notation (the presence of ",00") as a substantive discrepancy.

      Comparison with the two-step device: there, this step is deterministic code (`abs(a - b) < 0.01`
      after converting both strings to numbers), which never errs on identical numbers — for it, "18990,00"
      and "18990" are always the same value.

      An honest limit on the volume: n=2 errors out of 5 repeats, on one resolution, one receipt — a small
      sample; a 40% rate at `full` could be an artifact of these exact five calls, not a stable property
      of the model. The direction of the effect (comparing differently formatted strings sometimes fails)
      is shown cleanly — three reproductions of an identical input gave two different outcomes — but the
      exact rate of this failure would need a separate measurement with a bigger n.'
