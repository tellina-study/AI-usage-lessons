  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в три колонки: вариант · где работает — конкретные случаи · ограничения.
      Порядок строк совпадает с порядком карточек вопроса. Вывод — отдельная строка под таблицей.'
    backup: Источник — section-2-subagent.md §A.3 «Разбор» + «Вывод», section-2-subagent-part1c.md n60,
