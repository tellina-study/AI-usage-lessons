# library/lectures/lec-01/deck.yaml
#
# Deck-структура Лекции 1. Заполняется в sub-issues #54 (s05b) и #55 (s01-s05a).
# Schema — см. tools/presentation-build/README.md §6.
#
# Состав пилота #55: s01 → s02 → s03 → s04 → s05a → s05b (6 слайдов открытия лекции).
# Полный план — notes/lecture-1-review/final/new-plan-v4-final.md (29 слайдов).

deck:
  lecture_number: 1
  title: "Введение — AI вокруг нас"
  audience: "универсальная (инженерная аудитория)"
  duration_min: 75
  central_question: "Где AI работает, где — нет, и как это понять?"
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: ru
  status: draft

slides:
  - id: s01
    file: slides/s01-ice-breaker-cv.md
    type: live_demo
    duration_min: 3
    assertion: "Идентификация людей в реальном времени — уже с 2023 года на простом ноутбуке."
    learning_goal: "Открывающий hook: показать, что AI — рабочий локальный инструмент"
    learning_outcomes: [LO1, LO7]
    references: [yolov8-ultralytics-2023, mediapipe-google]
    visual:
      pattern: external_demo
      primary: "Live-камера на проекторе с bounding-box детекцией; слайд минимальный"
      backup: assets/code/ice-breaker-cv/backup/screenshot.png
    interaction: live_demo

  - id: s02
    file: slides/s02-cover.md
    type: cover
    duration_min: 0.5
    assertion: "Введение — AI вокруг нас"
    learning_goal: "Cover-слайд: визуально отличается от content slides (крупный title, декоративный «01», навигационный subtitle)"
    learning_outcomes: [LO1, LO4, LO6, LO7]
    references: []
    visual:
      pattern: cover_distinct
      primary: "Декоративная огромная «01» в outline; крупный title 60-72pt; короткий subtitle (навигационный, не обещание); hero motif справа"

  - id: s03
    file: slides/s03-poll-questions.md
    type: poll_reveal
    duration_min: 1.5
    assertion: "Сначала — ваша оценка, потом — данные"
    learning_goal: "Активировать аудиторию опросом; зафиксировать оценки до показа реальных цифр"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: poll_questions_only
      primary: "2 вопроса крупно (без ответов и цифр) — step 1 reveal"
    paired_with: s04

  - id: s04
    file: slides/s04-poll-reveal-data.md
    type: poll_reveal
    duration_min: 2
    assertion: "Разница между вашей оценкой и реальностью — карта ваших слепых зон про AI"
    learning_goal: "Раскрыть данные по AI в РФ; через эффект разрыва зафиксировать роль курса"
    learning_outcomes: [LO1, LO4]
    references: [vciom-2025, bloomberg-2025-deepseek, cybsafe-2024]
    visual:
      pattern: data_reveal
      primary: "Ключевые цифры крупно (ВЦИОМ 51%; DeepSeek 43% / ChatGPT 27% / YandexGPT 23% / GigaChat 15%) + инсайт-фраза снизу"
    paired_with: s03

  - id: s05a
    file: slides/s05a-instructor-card.md
    type: assertion_visual
    duration_min: 1
    assertion: "Кто я и почему мне это важно"
    learning_goal: "Короткая визитка преподавателя перед рамкой курса"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: instructor_card
      primary: "3 пункта 'обо мне' с явными placeholder'ами (контент не утверждён)"

  - id: s05b
    file: slides/s05b-course-frame.md
    type: assertion_visual
    duration_min: 1
    assertion: 'Главный вопрос курса — не "можно ли AI?", а "НУЖНО ли и ГДЕ?"'
    learning_goal: "Установить рамку курса; центральный вопрос в исследовательском тоне (показ, не обещание)"
    learning_outcomes: [LO1, LO4]
    references: [gartner-2025, ano-cifrovaya-ekonomika-2025]
    visual:
      pattern: central_question
      primary: "Большой исследовательский вопрос по центру; assertion сверху; стейкс мелким шрифтом"
