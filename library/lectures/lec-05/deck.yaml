      primary: "Слева — d08 (история = тренд+сезонность+шум, 4 ряда) в Ocean rounded box. Справа — аналогия «опытный товаровед» + цепочка прогноз→действие(закупка) + gold-плашка встроенной уязвимости «пока завтра похоже на вчера»."
