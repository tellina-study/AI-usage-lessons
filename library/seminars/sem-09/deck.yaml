      '
    backup: 'ТРИ УСЛОВИЯ — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», такт «Нюансы», пункт 3, с правкой:
      второе и третье условие получили собственное число (К2-19), первое осталось внешним — это пробел
      называется содержательно на кадре (§5.17), не оговоркой «наверняка что-то упустили».

      ПЕРВОЕ УСЛОВИЕ — ПОЛУЧИЛО ЧАСТИЧНОЕ ЧИСЛО (новое по сравнению с прежней редакцией). Собственного
      прогона на эффект чтения (провал середины на коротких пунктах) у нас всё ещё нет. Но у нас теперь
      есть число про РАЗМЕР: настоящий справочник занятия (266 слов, 10 пунктов) — 851 токен у Anthropic,
