# library/lectures/lec-02/deck.yaml
#
# Deck-структура Лекции 2 v2.0 (46 слайдов, 90 минут) — issue #183.
#
# Changelog v1.8 → v2.0:
# - Тайминг 75 → 90 мин (owner-решение #183); 35 → 46 слайдов.
# - Новая арка: «3 почему» → чек-лист 6 заблуждений (M1–M6); s01 REWORK (был
#   human-attention hook), s04 REWORK (вопрос v2 + 6 промисов), s38 REWORK payoff.
# - Методическая ось: inference-конвейер (keystone s04b в Разделе 0); на каждом
#   section divider — pipeline-прогресс (подсветка стадии, без «вы здесь», без минут).
# - 11 NEW слайдов: s07 (chat-шаблоны/STI), s09 (числа и код), s10 (glitch-токены),
#   s13 (три жизни эмбеддинга), s21 (KV-cache), s22 (prompt caching), s28 (T=0 ≠
#   детерминизм), s30 (structured outputs), s32 (reasoning-токены), s36 (ландшафт
#   2026), s37 (критика бенчмарков).
# - REWORK: s01, s03, s04, s08 (strawberry→cranberry 2026), s15 (similarity-граница),
#   s19 (лёгкий: +Q/K/V), s20 (полное закрытие M2), s38.
# - REFRESH (фактура 2026): s11, s23, s25, s29, s34, s41.
# - Перенумерация: id по плану v3.1 (s01–s42 с суффиксами a); старые slides-v1/
#   сохранены как база KEEP/REWORK.
# - Тон: систематизация для опытной аудитории («вы знали X — вот граница X»).
#
# СЧЁТ СЛАЙДОВ: план v3.1 заявляет «47 слайдов», но фактический построчный состав
# его таблиц = 46 (Р0:6, Р1:8, Р2:6, Р3:8, Р4:9, Р5:9). Канонично — 46.
# Построчная сумма duration_min = 84.0 (план заявляет 85: +0.5 «переход» в Р0
# и +0.5 расхождение в Р4, где таблица даёт 18.0 при заявленных 18.5) —
# разница отнесена в transitions_buffer_min.
#
# Source: chapter v2.1 (~19.6k слов, 3 части).
# Plan: notes/lecture-2-review/final/plan-v3.md (v3.1).

deck:
  lecture_number: 2
  title: "Лекция 2. Как работают современные большие модели"
  audience: "3 курс ИУ6 МГТУ Баумана; опытные пользователи LLM, многие ежедневно пишут код с ассистентами"
  duration_min: 90
  central_question: "Рассмотреть, как работает языковая модель, — и разобраться с важными деталями, которые меняют то, как вы строите промпты, агентов и решения."
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: ru
  status: draft
  version: v2.0
  source: "chapter v2.1 (~19.6k слов)"
  plan: "notes/lecture-2-review/final/plan-v3.md (v3.1)"
  total_slides: 46
  curriculum_level: introductory

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # v2 core — 26 терминов (17 из v1 + 9 новых по плану v3.1 §3); designer/critic enforce no drift.
  # Advanced-optional (chapter-only, без обязательного recall): prefill/decode, RoPE,
  # YaRN, TTFT, speculative decoding, MRL (matryoshka), adaptive thinking / effort, MoE.
  - токен
  - токенизация
  - BPE (Byte-Pair Encoding)
  - эмбеддинг
  - семантическое сходство
  - cosine similarity
  - механизм внимания
  - контекстное окно
  - in-context
  - сэмплинг
  - температура
  - top-p (nucleus sampling)
  - top-k
  - max_tokens
  - авторегрессионный
  - распределение вероятностей
  - слепота к буквам
  - KV-cache
  - prompt caching
  - chat-шаблон
  - специальный токен
  - reasoning-токены (thinking)
  - constrained decoding
  - batch-инвариантность
  - jagged intelligence («рваный интеллект»)
  - glitch-токен

misconceptions_map:
  # Риторическая рамка (plan v3.1 §2): 6 ложных утверждений; предъявляются s01,
  # мотивируют s04, закрываются внутри разделов, собираются на s38.
  # M-маркеры видимы ТОЛЬКО на s02a (overlay на карте) и s38 (payoff).
  M1: { statement: "Современные модели уже научились считать буквы в словах", closed_by: s08 }
  M2: { statement: "Роль system защищена архитектурно — подделать её нельзя", closed_by: [s07, s20] }  # s07 — слой 1 (роли — токены), s20 — полное закрытие (вес в attention)
  M3: { statement: "Окно 1M токенов = модель одинаково хорошо работает со всем объёмом", closed_by: s25 }
  M4: { statement: "temperature=0 даёт детерминированный ответ", closed_by: s28 }
  M5: { statement: "Reasoning-токены не видны — значит, и не оплачиваются", closed_by: s32 }
  M6: { statement: "Бенчмарки — надёжный способ выбрать модель", closed_by: s37 }

slides:
  # ─── Раздел 0. Введение (6 слайдов, 8.0 мин + 0.5 переход) ───
  - id: s01
    file: slides/s01-checklist-hook.md
    type: hook
    section: "Раздел 0. Введение"
    duration_min: 2.5
    assertion: "Шесть утверждений о LLM. Вы верите минимум в одно. Все шесть — ложь"
    learning_goal: "Hook-постер: шесть ложных утверждений; интерактив (руки) в notes; reveal устно"
    learning_outcomes: [LO7]
    chapter_ref: "§Введение [for-slide-s01]"
    visual:
      pattern: checklist_6_cards
      primary: "Постер-приманка (работает как афиша до начала лекции): крупно 36–44pt «Шесть утверждений о LLM. Вы верите минимум в одно.», под ним gold «Все шесть — ложь.». Ниже 6 утверждений компактными строками (16–18pt, читабельны с задней парты). Hero-фон: приглушённая иллюстрация «модель как чёрный ящик с трещинами» ≥40% площади."
    interaction: hands_poll

  - id: s02
    file: slides/s02-cover.md
    type: cover
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Лекция 2. Как работают современные большие модели"
    learning_goal: "Cover — title + lecture number + subtitle под новую арку"
    learning_outcomes: [LO1, LO4, LO6, LO7]
    chapter_ref: "§Введение [for-slide-s02]"
    visual:
      pattern: cover_clean
      primary: "Большая «02» в outline gold, title, subtitle «Конвейер инференса — и шесть границ, которые меняют инженерные решения» + hero motif (4-стадийная конвейер-иконка). Без roadmap-bar (карта — s02a)."

  - id: s02a
    file: slides/s02a-lecture-map.md
    type: roadmap
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Карта лекции — 6 разделов"
    learning_goal: "Карта маршрута + M-маркеры overlay (единственное место с M-метками кроме s38)"
    learning_outcomes: [LO1]
    chapter_ref: "§Карта главы [for-slide-s02a]"
    visual:
      pattern: lecture_roadmap_6_sections
      primary: "6 горизонтальных карточек (0 Введение / 1 Токенизация / 2 Эмбеддинги / 3 Внимание / 4 Сэмплинг / 5 Финал) с однострочными описаниями; активный Раздел 0 — gold-обводка. Overlay: маленькие chip-метки M1–M6 на карточках разделов, где заблуждение закрывается (Р1: M1+M2, Р3: M2+M3, Р4: M4+M5, Р5: M6). Без минут."

  - id: s03
    file: slides/s03-recap-lec1.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1.5
    assertion: "Объект сегодня — слой «модель» из четырёх слоёв Лекции 1"
    learning_goal: "Объект рассмотрения (слой «модель» в 4-слойной картине Lec-1) + bridge к внутренностям инференса"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s03]"
    visual:
      pattern: layers_recap_with_zoom
      primary: "Слева — nested layers из Lec-1 (модель → чат → агент → приложение), нижний слой «Модель» в gold. Справа — 2 строки: «Слой „модель“: stateless-инференс» → «Сегодня: разбираем, что внутри этого инференса»."

  - id: s04
    file: slides/s04-central-question.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1
    assertion: "Цель лекции: рассмотреть, как работает языковая модель, — и разобраться с деталями, которые меняют инженерные решения"
    learning_goal: "Цель лекции + чек-лист s01 как 6 промисов лекции"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§Введение [for-slide-s04]"
    visual:
      pattern: central_question_with_promises
      primary: "Цель лекции крупно (28–32pt bold #21295C), «важными деталями» — gold. Под ней — 6 компактных промис-чипов (по одному на заблуждение, без M-кодов): «почему исправленный strawberry ничего не доказывает», «почему роль работает — и подделывается», «что на деле умеет окно 1M», «почему T=0 не даёт одинаковых ответов», «сколько стоят невидимые токены», «чем заменить веру в бенчмарки». Gold-маркеры — вертикальные полосы на промис-чипах."

  - id: s04b
    file: slides/s04b-keystone-pipeline.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 2
    assertion: "Поток данных в LLM: слова → токены → векторы → LLM → векторы → токены → слова"
    learning_goal: "Keystone: 7-стадийный inference-конвейер целиком до первого погружения; повторяется прогрессом на всех дивайдерах"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s04b]"
    visual:
      pattern: pipeline_7_stages_horizontal
      primary: "Горизонтальный 7-стадийный конвейер: Текст → Токены → Векторы → LLM (gold center) → Распределение → Токен → Текст; под каждой стадией короткая подпись. Петля авторегрессии: стрелка от [Токен] назад ко входу с подписью «токены генерируются по одному; каждый добавляется ко входу». Под конвейером — 4 подкарточки Раздел 1/2/3/4 со стадиями, которые они разбирают. Gold callout: «слова — только на границах; внутри — векторы»."

  # ─── Раздел 1. Токенизация (8 слайдов, 14.5 мин) ───
  - id: s05a
    file: slides/s05a-section1-divider.md
    type: section_divider
    section: "Раздел 1. Токенизация"
    duration_min: 0.5
    assertion: "Раздел 1 — Токенизация: как модель видит ваш текст"
    learning_goal: "Divider: вход в стадию 1 конвейера"
    learning_outcomes: [LO1]
    chapter_ref: "§1"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "Большое «Раздел 1» (140pt gold), под ним «Токенизация», frame-фраза «Как модель видит ваш текст», tag «4 разбора · 3 провала». Внизу — мини-конвейер из s04b со стадией «Токены» в gold-подсветке (без текстовых маркеров, без минут)."

  - id: s05
    file: slides/s05-what-is-token.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 1.5
    assertion: "Токен — id из словаря модели. Не буква и не слово; статистически частая подпоследовательность"
    learning_goal: "Фиксация точного определения токена (темп ×2 — аудитория знает приблизительно)"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s05]"
    visual:
      pattern: token_examples_3_cases
      primary: "3 примера разметки: cat → [cat], tokenization → [token][ization], клубника → [к][луб][ника] (o200k_base). Gold callout: «1 токен ≈ 4 символа EN ≈ 2 RU». Caption: словарь и модель — два разных артефакта."

  - id: s06
    file: slides/s06-bpe-compromise.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "BPE — компромисс между алфавитом и словарём; словарь строится один раз перед обучением"
    learning_goal: "BPE + инженерная деталь «строится один раз / выборка на inference» + вендоры считают текст по-разному"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§1.2 [for-slide-s06]"
    visual:
      pattern: before_after_no_iteration
      primary: "Две колонки: обучающий корпус «low / lower / newest / widest» → BPE-словарь «low / er / new / est / wid». Gold callout: «словарь строится один раз до обучения; на inference — выборка готовых правил». Caption: разные вендоры режут один текст по-разному."

  - id: s07
    file: slides/s07-chat-templates.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 2.5
    assertion: "Chat-формат — соглашение поверх модели: роли system/user/assistant — те же токены в общем потоке"
    learning_goal: "Chat-шаблоны и специальные токены; протокольные роли ≠ «роли» из текста промпта; практический вывод (фильтрация входа, проверка шаблона); слой 1 закрытия M2 (полное закрытие — s20, forward-ref в notes)"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§1.3 [for-slide-s07]"
    visual:
      pattern: json_to_flat_stream_schema
      primary: "Строка-тезис: модель принимает один плоский поток токенов; chat-формат — соглашение поверх него. Слева — структурированный диалог {role, content}; стрелка «chat-шаблон» → плоский поток токенов со спецтокенами <|im_start|>system … <|im_end|> (моноширинно, teal). Справа — карточка «Протокольные роли ≠ „роли“ из текста» + карточка риска «Подделка» (gold-обводка). Внизу — блок «Что с этого»: фильтруйте внешний контент до контекста; при локальном запуске проверяйте chat-шаблон. Caption: вторая половина ответа — в разделе про внимание."

  - id: s08
    file: slides/s08-strawberry-2026.md
    type: case_study
    section: "Раздел 1. Токенизация"
    duration_min: 2.5
    assertion: "GPT-5.5 отвечает на strawberry — и ошибается на cranberry: точечный патч, а не навык"
    learning_goal: "Механизм слепоты к буквам (быстро — мем знаком) + диагноз 2026 + jagged intelligence; закрывает M1"
    learning_outcomes: [LO6, LO7]
    chapter_ref: "§1.4 [for-slide-s08]"
    visual:
      pattern: case_split_with_timeline
      primary: "Слева компактно — механизм: strawberry → [st][raw][berry], модель видит 3 токена, не 10 букв. Справа — карточки-факты: GPT-5.2 (дек 2025) «две r»; GPT-5.5 (апр 2026) strawberry ✓ / cranberry ✗ (gold); StrawberryBench — 847 вопросов, 7 уровней. Внизу callout: «рваный интеллект»: успех на впечатляющей задаче ≠ надёжность на простой."
    interaction: retrieval_live_attempt   # cranberry на актуальных моделях, live
    verify_day_of: true

  - id: s09
    file: slides/s09-numbers-and-code.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Токенизатор режет по частоте, а не по структуре: числа — чанками по 3 цифры, код — целыми отступами"
    learning_goal: "Числа и код как второй/третий случай расхождения нарезки со структурой; формат compact comparison (не case-study, чтобы не дублировать s08)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.5 [for-slide-s09]"
    visual:
      pattern: two_column_compare
      primary: "Строка-мотивация: числа и код — самые частые «нетекстовые» входы; от нарезки зависят арифметика и бюджет токенов. Колонка «Числа»: 1000000 → [100][000][0] — чанки слева направо ≠ разряды; right-to-left нарезка улучшает арифметику, спецсхемы до +33% (gold). Колонка «Код»: GPT-2 — 16 токенов на отступ 4-го уровня; GPT-4 — пробелы группами (словарь чинится — но не под все задачи сразу). Внизу — блок «Что делать»: разделители разрядов, вычисления в инструмент, единообразные отступы."

  - id: s10
    file: slides/s10-glitch-tokens.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Порядка 4% словаря — glitch-токены: словарь строится отдельно от модели, и часть записей остаётся недообученной"
    learning_goal: "Glitch-токены: от анекдота SolidGoldMagikarp к системному свойству конвейера (GlitchMiner 2026)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.6 [for-slide-s10]"
    visual:
      pattern: anecdote_to_mechanism
      primary: "Слева — story-карточка: SolidGoldMagikarp (2023, юзернейм с Reddit в словаре GPT). Центр — схема механизма: корпус словаря ≠ корпус модели → эмбеддинг у случайной инициализации. Справа — факт-карточка GlitchMiner (AAAI 2026): «порядка 4% словаря по одной из оценок» (gold), воспроизводится в открытых семействах Llama, Qwen, Gemma, Phi-3, Mistral. Внизу — блок «Что на практике»: экзотические строки → гипотеза glitch-токен, проверка плейсхолдером; в продуктах — нормализация/санитизация входа. Footer: системная особенность конвейера, не баг версии."

  - id: s11
    file: slides/s11-language-cost.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 1.5
    assertion: "Один и тот же текст по-русски стоит ≈2× дороже английского; o200k сократил разрыв на треть, но не убрал"
    learning_goal: "Стоимость языков + динамика 2024–2026 + следствия для chunking/max_tokens"
    learning_outcomes: [LO6]
    chapter_ref: "§1.7 [for-slide-s11]"
    visual:
      pattern: bar_chart_tokens_per_char
      primary: "Bar chart токены/символ: EN ~0.25, RU ~0.5 (gold), ZH ~0.8, Python ~0.4. Строка динамики: o200k_base — примерно −35% нелатинским, разрыв сокращается, но не исчезает. Внизу — блок «Что делать»: калибруйте лимиты в токенах на своём языке (фрагменты, max_tokens, окно); пакетная обработка — оцените перевод на английский (≈2× дешевле)."

  # ─── Раздел 2. Эмбеддинги (6 слайдов, 10.0 мин) ───
  - id: s12a
    file: slides/s12a-section2-divider.md
    type: section_divider
    section: "Раздел 2. Эмбеддинги"
    duration_min: 0.5
    assertion: "Раздел 2 — Эмбеддинги: пространство смыслов"
    learning_goal: "Divider: вход в стадию 2 конвейера"
    learning_outcomes: [LO1]
    chapter_ref: "§2"
