    file: slides/s01-cover.md
    type: hero_cover
    duration_min: 2
    assertion: "Лекция 17 — итоговая карта курса: где AI работает, где нет, и как это понять."
    learning_goal: "Чистый титульный слайд + диагностический хук (capstone)"
    section: 0
    chapter_ref: "Введение"
    failure_bucket: mixed
    media: true
    media_kind: "hero-визуал ≥40% (real-фото / коллаж кейсов / scatter-карта) добавляется в 8c-2"
    image_slot: hero-title

  - id: s02
    file: slides/s02-keystone-2d-plane.md
    type: schema
    duration_min: 2
    assertion: "Карта применимости ИИ: горизонталь — нужен ли AI, вертикаль — сколько ему доверить."
    learning_goal: "Keystone reveal: 2D-плоскость с осями и квадрантами (несущая ось capstone)"
    section: 0
    chapter_ref: "§0.3 — keystone reveal"
    failure_bucket: capability
    schema_subtype: schema_quadrant
    media: true
    media_kind: "schema_quadrant — 2 оси + 4 подписанных квадранта, без точек (точки придут в s20-s22)"

  - id: s03
