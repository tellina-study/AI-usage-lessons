# Первый работающий процесс
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n02    2.50 мин
#   Теория     n03–n05    6.50 мин
#   Кейсы      n06–n24   58.00 мин
#   Ось        n25–n26    5.50 мин
#   Выход      n27–n28    4.50 мин
#   ИТОГО                  77.00 мин при слоте 90

deck:
  seminar_number: 7
  title: Первый работающий процесс
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 77.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: null
  language: ru
  slide_count: 28
  axis: null
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Первый работающий процесс: триггер, шаг модели, запись результата'
  learning_goal: Обложка. Называет занятие и его место в дуге.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Круг 5, пересборка по переопределённой цели (KONTSEPTSIYA-7-12.md): семинар учит технике
      на уровне блоков инструмента. Прежние четыре деки в slides-v3-arhiv/ и slides-v4-arhiv/.'
- id: n02
  file: slides/n02-mostik.md
  type: problem_scenario
  duration_min: 2.0
  assertion: На прошлых занятиях собирали исполнителя; теперь собираем процесс, который им пользуется
  learning_goal: Шов с дугой С4–С6 и постановка задачи занятия. Знать прошлые занятия для участия не требуется.
  visual:
    pattern: problem_scenario
    primary: 'Две строки одна под другой: что собирали раньше (агент с правами, памятью, инструментами)
      и что собираем теперь (процесс: триггер, шаги, результат). Под ними золотая строка с задачей занятия.

      '
    backup: 'Форму шва взять с sem-06/slides/n02: без методических комментариев, всё нужное печатается
      на экране. Знать С4–С6 для участия не требуется (правило С5 n01).'
- id: n03
  file: slides/n03-teoriya-trigger-i-shagi.md
  type: taxonomy_compare_table
  duration_min: 2.0
  assertion: Процесс начинается с триггера и состоит из шагов; триггеры бывают трёх родов, и выбор между
    ними — первое проектное решение
  learning_goal: 'Теория 1 из 3, инструменто-агностичная: устройство процесса и роды триггеров. Имена
    блоков n8n даются справа, но главное слева.'
  visual:
    pattern: taxonomy_compare_table
    figure: teoriya-protsess-trigger-shagi.png
    primary: 'Схема сверху: триггер, затем три шага подряд, стрелками показано, что выход одного становится
      входом следующего. Под схемой таблица трёх родов триггера с примерами блоков n8n в правой колонке.

      '
    backup: 'Инструменто-агностичный слой идёт первым по §3 концепции: сначала устройство, потом его воплощение
      в конкретном инструменте.'
- id: n04
  file: slides/n04-teoriya-dannye-spiskom.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Между узлами ходит список элементов, и узел выполняется по разу на каждый элемент — отсюда
    половина странностей, которые встретятся дальше
  learning_goal: Теория 2 из 3, несущая. Без этого правила все четыре кейса читаются как магия, а вопросы
    «почему оно сделало это трижды» не разбираются.
  visual:
    pattern: mechanism_node_graph
    figure: teoriya-dannye-spiskom.png
    primary: 'Схема: слева список из трёх элементов, справа один узел, и от него три стрелки вниз — три
      выполнения. Под схемой правило крупно золотой строкой. Ниже — короткая строка про Execute Once.

      '
    backup: 'Главное теоретическое правило занятия. Из него прямо выводятся: цикл не нужен в большинстве
      случаев (С7), «нода выполнилась N раз» (С8), потеря данных при слиянии (С9). Произносится один раз
      здесь и дальше только вспоминается.'
- id: n05
  file: slides/n05-teoriya-shag-modeli-i-vyrazheniya.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Шаг модели — обычный узел: на вход данные, на выход данные; ответ приходит текстом и уходит
    наружу по сети, и из этих двух фактов следуют два сегодняшних кейса'
  learning_goal: Теория 3 из 3. Снимает ореол с шага модели и заранее объясняет, откуда возьмутся проблемы
    кейсов 2 и 3. Плюс синтаксис выражений — он понадобится сразу.
  visual:
    pattern: answer_breakdown_table
    primary: 'Две колонки: «что это значит» и «что из этого следует сегодня». Две строки — про текстовый
      ответ и про сетевой вызов. Под таблицей — блок про выражения с двумя строками синтаксиса и предупреждением
      про имена узлов.

      '
    backup: 'Связка теории с кейсами 2 и 3 сделана заранее и намеренно: когда проблема возникнет, она
      будет узнана, а не предъявлена как сюрприз.'
- id: n06
  file: slides/n06-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Их всё равно потом руками в таблицу перекладывают» — постановка первого кейса
  learning_goal: Дивайдер кейса 1. Называет наблюдаемую работу, не инструмент (правило А2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Сквозной пример дуги — обработка входящей заявки (KONTSEPTSIYA-7-12.md §7). Выбран вместо
      бота поддержки: бот не создаёт повода для циклов, слияния и сабфлоу, и ровно эти ступени в курсах
      рынка систематически пропускают.'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Из скольких узлов соберётся такой процесс и какие это узлы — первое решение зала
  learning_goal: Первое голосование. Вводная про блоки идёт ПОСЛЕ, иначе ответ выдан. Вариант «зависит»
    верен по сути и намеренно оставлен неполным.
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху постановка тремя строками: что на входе, что должно получиться, что сейчас делают
      руками. Ниже вопрос в золотой рамке и четыре карточки равной ширины, ни одна не подсвечена.

      '
    backup: 'Вводная по блокам n8n идёт после разбора (n08), а не здесь: названные заранее узлы превратили
      бы вопрос в угадывание подсказанного.'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: 'Каждый вариант отвечает на свой вопрос: два узла не решают задачу, четыре проверяют то,
    чего ещё нет, «зависит» верно и неполно'
  learning_goal: Разбор сразу за вопросом (правило А1), две содержательные колонки (А5). Здесь же называются
    блоки n8n — вводная, которая намеренно стояла после вопроса.
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки на четыре строки. Под ней — вводная блоками n8n: три названия узлов
      с одной строкой назначения каждому.

      '
    backup: 'Вариант «четыре узла» снимается доводом, который ведёт прямо в кейс 2: проверять пока нечего,
      значения ещё не выделены. Это и есть шов между кейсами.'
- id: n09
  file: slides/n09-k1-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 8.0
  assertion: 'Три узла: форма собирает заявку, шаг модели возвращает тему, таблица принимает строку'
  learning_goal: Такт «наше решение». Ведущий собирает это вживую на стенде; слайд самодостаточен и несёт
    схему, параметры и снимок холста — при отказе техники занятие идёт без потерь.
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-tri-uzla.png
    screenshot: SCREENSHOT-TODO-k1-holst.png
    primary: 'Сверху принципиальная схема: форма → шаг модели → строка в таблице. Под ней таблица параметров
      по трём узлам. Справа место под снимок холста n8n (добавляется, когда стенд будет снят).

      '
    backup: 'ЭКРАН ДЕМО. Ведущий собирает процесс на своём стенде; слайд показывается одновременно и остаётся
      на экране после. Снимок холста — страховка на случай отказа техники, не замена демо. Снимок холста
      ещё не снят: съёмка интерфейса требует входа в UI, которого у производства нет (есть только ключ
      управляющего API). Сам процесс на стенде собран и проверен прогоном (см. SETKA-KEYSOV-S7.md, раздел
      «Чего здесь нет»). До съёмки слайд собирается без него и работает. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12
      (n8n 2.42.7), прогон 3: процесс из трёх узлов отработал, в таблицу легла тема «Аналитика.» — одним
      словом, с точкой, которую модель добавила сама. Файл стадии — `stend/stadiya-1.json`.'
- id: n10
  file: slides/n10-k1-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Data Table не требует внешних учётных данных; Basic LLM Chain не умеет ни памяти, ни инструментов;
    собирать удобнее с ручного триггера
  learning_goal: Такт практик кейса 1. Включает строку сравнения инструментов — обязательный элемент по
    §5 концепции.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три практики списком, каждая одной строкой с пояснением. Внизу отдельной плашкой — сравнение
      инструментов на этом же приёме.

      '
    backup: 'Ограничение Basic LLM Chain (ни памяти, ни инструментов) названо здесь намеренно: оно готовит
      ступень агента на С11 и объясняет, почему там понадобится другой блок.'
- id: n11
  file: slides/n11-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «В таблице один столбец, и в нём абзац» — наблюдаемый результат первого кейса
  learning_goal: Дивайдер кейса 2. Проблема видна прямо из того, что собрали минуту назад.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Дивайдер опирается на результат демо кейса 1: зал только что видел, в каком виде пришла пометка.
      Форма дивайдера — реплика, как у кейса 1; разнообразие форм начинается с кейса 3.'
- id: n12
  file: slides/n12-k2-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Как получить от шага модели именно значения — второе решение зала
  learning_goal: Второе голосование. Все четыре варианта встречаются в живых системах; первые два зал
    применяет чаще всего, и их цена выясняется на разборе.
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху — что пришло и что нужно, двумя строками с примером реального ответа модели. Ниже
      вопрос в золотой рамке, четыре карточки равной ширины.

      '
    backup: 'Карточки описаны действием, а не именами блоков: имена прозвучат на разборе, иначе голосование
      превращается в узнавание знакомого слова.'
- id: n13
  file: slides/n13-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Просьба в промпте и регулярное выражение ломаются молча; штатный разборщик описывает финальный
    вывод; отдельный узел стоит лишнего вызова
  learning_goal: 'Разбор сразу за вопросом, две содержательные колонки. Ключевое слово разбора — «молча»:
    прогон остаётся зелёным, и это роднит первые два варианта.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки на четыре строки. Под ней золотая строка про то, что объединяет первые
      два варианта.

      '
    backup: '«Технический успех против делового» — формулировка из живого обсуждения практиков n8n; здесь
      передана своими словами без цитирования. «Прогон зелёный, данные негодные» ПРОВЕРЕНО на стенде 2026-10-12,
      прогон 6: три отказа вызова подряд, статус прогона — success.'
- id: n14
  file: slides/n14-k2-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 6.5
  assertion: 'Information Extractor со схемой из трёх атрибутов: тема, срочность, контакт — и данные ложатся
    в столбцы без разбора руками'
  learning_goal: Такт «наше решение» кейса 2, собирается вживую. Схема задаётся описаниями словами — самый
    наглядный из трёх способов задать её.
  visual:
    pattern: mechanism_node_graph
    figure: k2-shema-izvlechenie.png
    screenshot: SCREENSHOT-TODO-k2-atributy.png
    primary: 'Схема: форма → извлечение полей → таблица, где у среднего узла показаны три выходных поля.
      Под схемой — таблица трёх атрибутов с описаниями, как они задаются в узле. Справа место под снимок
      панели атрибутов.

      '
    backup: 'ЭКРАН ДЕМО. Процесс на стенде собран и проверен; снимок панели атрибутов ещё не снят — съёмка
      интерфейса требует входа в UI. Schema Type = From Attribute Descriptions выбран из трёх доступных
      как самый наглядный для аудитории: схема читается словами, без JSON. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12,
      прогоны 4 и 7: извлечение вернуло {тема: курс, срочность: сегодня, контакт: +7 916…}; на заявке
      с двумя темами вернулась одна («перенос занятия»), вторая исчезла без следа. Файл стадии — `stend/stadiya-2.json`.'
- id: n15
  file: slides/n15-k2-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Описание атрибута работает как инструкция; пустое поле нужно предусмотреть заранее; разбор
    формата у шага модели и у агента — разные механизмы
  learning_goal: Такт практик кейса 2. Главная практика — «чего нет в описании, того не будет в ответе»;
    граница названа в прямой форме.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три практики списком. Внизу плашка сравнения инструментов. Одна строка набрана как граница
      применимости.

      '
    backup: Запрет «структурированный вывод поверх агента» — из документации n8n по агентам; формулировка
      своя.
- id: n16
  file: slides/n16-k3-divider.md
  type: case_divider_fact
  duration_min: 0.5
  assertion: Понедельник, таблица, двое суток пропуска — дивайдер констатирует факт, а не передаёт чью-то
    реплику
  learning_goal: 'Дивайдер кейса 3. Форма сломана намеренно: два предыдущих дивайдера были репликами,
    третий — голая констатация, иначе зал предсказывает экраны (§4.2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним одна приглушённая строка. Дорожка кейсов, третий подсвечен.

      '
    backup: 'Намеренный сбой ритма форм дивайдеров (§4.2): кейсы 1 и 2 входили репликой, этот входит фактом.
      Фрагмент таблицы с дыркой показывается на стенде вживую, на слайд не выносится — экран на полминуты.'
- id: n17
  file: slides/n17-k3-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Что должен делать узел, когда вызов не удался — третье решение зала
  learning_goal: Третье голосование. Все четыре карточки — реальные значения настроек узла; это выясняется
    на разборе и обычно становится сюрпризом.
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке сверху, четыре карточки равной ширины. Над вопросом одна строка контекста:
      что стоит дальше по процессу.

      '
    backup: 'Вводная не нужна: зал выбирает поведение, а не блок. Что каждая карточка — это готовая настройка,
      сообщается на разборе.'
- id: n18
  file: slides/n18-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: Все четыре ответа — это значения настроек On Error и Retry On Fail в карточке любого узла;
    по умолчанию стоит Stop Workflow
  learning_goal: 'Разбор сразу за вопросом. Главный поворот: зал голосовал за поведение и, не зная того,
    выбирал из готового списка настроек инструмента.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки: имя настройки — поведение — когда уместно. Над таблицей одна строка-поворот.
      Настройка по умолчанию выделена.

      '
    backup: Четыре значения On Error плюс Retry On Fail — реальные настройки узла n8n, проверены по справочнику
      нод. Continue = Continue (regular output). Четыре значения On Error и Retry On Fail сверены со стендом
      (n8n 2.42.7); поведение `continueErrorOutput` проверено прогоном 6.
- id: n19
  file: slides/n19-k3-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 7.0
  assertion: Retry On Fail плюс выход error, из которого заявка пишется в ту же таблицу с пометкой «не
    разобрано» — ни одна заявка не теряется и видно, сколько их
  learning_goal: 'Такт «наше решение» кейса 3, собирается вживую. Отказ демонстрируется честно: ключ провайдера
    портится на глазах у зала.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-shema-dve-vetki.png
    screenshot: SCREENSHOT-TODO-k3-error-output.png
    primary: 'Схема: от шага модели два выхода — успешный в таблицу, error в тот же узел таблицы с пометкой.
      Под схемой три настройки с значениями. Справа место под снимок карточки настроек узла.

      '
    backup: 'ЭКРАН ДЕМО. Процесс на стенде собран и проверен; снимок карточки настроек ещё не снят — съёмка
      интерфейса требует входа в UI. Отказ для демонстрации вызывается порчей ключа провайдера — мгновенный
      и воспроизводимый отказ, в отличие от ожидания настоящего таймаута. В производстве тот же отказ
      воспроизведён подменой имени модели: поведение одного класса. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12, прогоны
      5 и 6: успешная ветка пишет три столбца; при испорченной модели журнал показал ТРИ попытки НА УЗЛЕ
      МОДЕЛИ, элемент ушёл в выход `error` с исходными данными формы плюс полем ошибки, строка «не разобрано»
      в таблице появилась, а статус прогона — success. Файл — `stend/stadiya-3.json`.'
- id: n20
  file: slides/n20-k3-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 3.0
  assertion: Бюджет повторов зажат в диапазон 2–5; повтор на платном вызове платит дважды; $execution.id
    не ключ идемпотентности; включение error-выхода ломает выражения на успешной ветке
  learning_goal: Такт практик кейса 3 — самый плотный в занятии. Последняя строка — открытый дефект инструмента,
    названный прямо.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Четыре практики списком. Последняя набрана как предупреждение о дефекте, отдельной рамкой.
      Внизу плашка сравнения инструментов.

      '
    backup: Все четыре проверены по исходникам и трекеру n8n. Дефект с paired item — открытый на момент
      производства; перед занятием проверить, закрыт ли.
- id: n21
  file: slides/n21-k4-divider.md
  type: case_divider_contradiction
  duration_min: 0.5
  assertion: На холсте правка есть, результатов по ней нет — оба утверждения верны одновременно
  learning_goal: Дивайдер кейса 4. Форма — два коротких утверждения, которые противоречат друг другу и
    оба верны; третий дивайдер был фактом, второй репликой, ритм не повторяется (§4.2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним две приглушённые строки подряд. Дорожка кейсов, четвёртый
      подсвечен.

      '
    backup: 'Намеренно не формулируется как чья-то ошибка: оба утверждения верны, в этом вся задача кейса.'
- id: n22
  file: slides/n22-k4-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Почему боевые прогоны идут по старому варианту — четвёртое решение зала
  learning_goal: 'Четвёртое голосование, и единственное, где правильных карточек две. Вводная идёт ПОСЛЕ:
    назови Publish заранее — вопроса не останется.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, четыре карточки. Без контекстной строки: весь контекст на предыдущем
      экране.

      '
    backup: Вводная про черновик и Publish идёт следующим экраном — иначе ответ выдан вместе с вопросом
      (§5 концепции).
- id: n23
  file: slides/n23-k4-razbor.md
  type: answer_breakdown_table
  duration_min: 3.5
  assertion: Сценарий автосохраняется в черновик постоянно, кнопки «Сохранить» нет; в боевой режим правка
    уходит отдельным действием Publish, и боевые прогоны исполняют опубликованную версию
  learning_goal: 'Вводная и разбор одним экраном: механика названа, и из неё сразу видно, какие две карточки
    верны и почему это одно и то же.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Сверху три строки механики. Ниже таблица четырёх карточек с вердиктом. Строка про исчезнувшее
      слово «активировать» — отдельной плашкой.

      '
    backup: Publish заменил Activate в n8n 2.x; слова «активировать» в интерфейсе больше нет. Проверено
      по справочнику; перед занятием сверить с версией стенда.
- id: n24
  file: slides/n24-k4-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 3.0
  assertion: Ручной прогон жрёт больше памяти, чем боевой; обработчик ошибок ручным запуском не проверяется
    вовсе; холст редактирует один человек
  learning_goal: Такт практик кейса 4. Вторая строка — предупреждение под Семинар 8, произнесённое заранее,
    чтобы там ожидаемое поведение не выглядело поломкой.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три практики списком, вторая выделена как предупреждение на будущее занятие. Внизу плашка
      сравнения инструментов.

      '
    backup: Error Trigger не срабатывает на ручном прогоне — это проверяется на С8. Фраза «на холсте ничего
      не произойдёт» готовит зал заранее.
- id: n25
  file: slides/n25-kc-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Нижняя ступень лестницы — «одного вызова достаточно», и вопрос в том, по какому признаку
    её видно
  learning_goal: Концептуальный разбавитель, один на занятие. Техника разбавляется решением «строить или
    не строить», а не рассуждением о роли человека.
  visual:
    pattern: question_with_option_cards
    primary: 'Короткая постановка двумя строками. Вопрос в золотой рамке, четыре карточки.

      '
    backup: Единственный неинструментальный экран занятия. Концептуальных вопросов по §5 концепции допускается
      один-два, не больше.
- id: n26
  file: slides/n26-kc-razbor.md
  type: criteria_checklist_and_boundary
  duration_min: 3.0
  assertion: Процесс оправдан, когда поток растёт, типов входа становится больше или результат уходит
    дальше без человека; объём сам по себе признаком не является
  learning_goal: 'Разбор концептуального вопроса. Главное: «мало» — не критерий, критерий — куда уходит
    результат.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Две группы признаков друг под другом: не надо / надо. Внизу граница в прямой форме — одна
      строка.

      '
    backup: 'Ответ на карточку «спросить модель один раз» даётся прямо: это нижняя ступень лестницы, и
      она законная.'
- id: n27
  file: slides/n27-vyhod.md
  type: outcome_artifact
  duration_min: 2.5
  assertion: С занятия уносится файл процесса из пяти узлов, который встаёт в свой n8n одним импортом
  learning_goal: 'Выход занятия предъявляется как артефакт: что собрано, из чего, и что с этим делать
    дома. Условие сквозной линии С7→С12.'
  visual:
    pattern: outcome_artifact
    figure: vyhod-shema-pyat-uzlov.png
    primary: 'Итоговая схема процесса целиком, с подписанными узлами и двумя ветками. Рядом карточка файла
      с именем и тремя шагами импорта.

      '
    backup: 'Файл СОБРАН И ПРОВЕРЕН на стенде 2026-10-12 (n8n 2.42.7): все четыре стадии выложены через
      управляющий API, опубликованы и прогнаны настоящими отправками формы — прогоны 3, 4, 5, 6, 7. Студенческий
      файл — та же стадия 4 со снятыми привязками к учётным данным и таблице этого стенда: у студента
      они свои, а чужой идентификатор читается как сломанный узел. Источник — `stend/sborka.py`.'
- id: n28
  file: slides/n28-mostik-k-s8.md
  type: bridge_forward
  duration_min: 2.0
  assertion: 'Процесс пока идёт одной дорогой: все заявки через один шаг; на Семинаре 8 появляются маршруты
    и проверка перед записью'
  learning_goal: Замыкание занятия и постановка следующего. Ступень называется своим именем, без обещания
    «будет интереснее».
  visual:
    pattern: bridge_forward
    primary: 'Схема текущего процесса бледно, поверх неё — развилка пунктиром в месте, где на С8 появится
      ветвление. Снизу три строки про следующее занятие.

      '
    backup: 'Ступень С8 по §6 концепции: ветвление и слияние, проверка результата шага. Не обещать сюда
      ни агентов, ни поиска по документам.'
