glossary_lock:
  # Канонические термины — из glossary.yaml (locked chapter v1.1, синхронизировано с re-spine v4).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  # forbidden_anglicisms: пайплайн→конвейер, фоллбэк→запасной вариант,
  # эдж-кейс→краевой случай, инсайт→вывод/наблюдение, деплой→развёртывание.
  - "фаза SDLC (стадия жизненного цикла со своими входом / выходом / артефактом)"
  - "методика vs инструмент (несущая дихотомия v4: методика определяет, инструмент исполняет)"
  - "человеко-владеемый артефакт (материальный результат фазы, за который отвечает человек и который версионируется)"
  - "git-loop дисциплины (цепочка версионируемых артефактов спека→ADR→план→PR→инцидент)"
  - "разрыв восприятия (perception gap — ощущение скорости ↔ измеренный факт)"
  - "лестница автономности (A автодополнение / B мелкие задачи / C кодинг-агент / D оркестратор) — демотированная линза"
  - автодополнение
  - кодинг-агент
  - оркестратор
  - "склонность доверять автомату (automation bias — ложная уверенность)"
  - "существенная vs привнесённая сложность (Brooks: essential / accidental)"
  - "«почти правильный» код"
  - 70%-проблема
  - "spec-driven development (разработка от спецификации)"
  - "интервьюирующий LLM (interrogatory LLM)"
  - "prompt-and-pray (антипаттерн: расплывчатый промпт → невысказанные допущения)"
  - "ADR (Architecture Decision Record — решили X, потому что Y, отвергли Z)"
  - "fitness-функция (автоматическая архитектурная проверка на каждом коммите)"
  - "C4 / архитектура-как-код (машиночитаемое описание архитектуры)"
  - "отравленный контекст (poisoned context — AI копирует плохие примеры кодбазы)"
  - "harness (харнес — детерминированный каркас проверок вокруг недетерминированной модели)"
  - "AGENTS.md (постоянный слой инструкций/конвенций, который агент читает каждую сессию)"
  - "context-engineering (управление контекстом: JIT / компакция / context-rot)"
  - "explore → plan → code → commit (дисциплина цикла работы)"
  - "SWE-bench (Verified публичный / Pro приватный контаминация-устойчивый)"
  - "TDD (разработка через тестирование, тест-первым)"
  - "mutation-тестирование (mutation score — доля убитых искусственных дефектов)"
  - quality-gate
  - "SAST / DAST / SCA / secret-scanning"
  - "supply-chain (цепочка поставок ПО)"
  - "slopsquatting (регистрация воспроизводимо-галлюцинируемого имени пакета)"
  - "prompt injection (инъекция в промпт)"
  - "Lethal Trifecta (доступ к секретам + недоверенный контент + канал утечки)"
  - "risk-triad Böckeler (probability × impact × detectability)"
  - "least-privilege (принцип наименьших привилегий)"
  - "egress-контроль (ограничение, куда агент отправляет данные)"
  - "cognitive debt (когнитивный долг — генерация обгоняет понимание)"
  - "accountability (ответственность, не делегируется ни в одной фазе)"
  - "триангуляция (DORA / GitClear / METR — сходимость независимых методов)"

