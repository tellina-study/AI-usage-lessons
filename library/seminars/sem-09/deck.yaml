- id: n55
  file: slides/n55-k5-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Один и тот же вопрос — и два разных обхождения одного и того же клиента, оба из настоящего
    прогона
  learning_goal: 'Дивайдер Кейса 5. Форма текста — ПРОТИВОПОСТАВЛЕНИЕ (БРИФ §4a: у каждого кейса занятия
    своя форма дивайдера, П3): два ответа на один и тот же вопрос рядом, без чисел. Называет проблему
    (А2), измеренного результата не выдаёт.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, два ответа друг под другом без единой цифры. Внизу дорожка шести кейсов занятия,
      пятый подсвечен.

      '
    backup: 'Форма «противопоставление» назначена этому дивайдеру БРИФ-ПРОИЗВОДСТВО §4a: формы «сцена»,
      «цифра», «вопрос» и «цитата» отданы Кейсам 1, 2, 3 и 4, форма «ставка» — Кейсу 6. Шесть дивайдеров
      подряд не читаются одной грамматикой (болезнь §4.1 №7, правило П3).

      ДВА ОТВЕТА ВЗЯТЫ НАСТОЯЩИМИ, не сочинёнными: оба — сокращённые перифразы execs 799 и 804 замера
      А протокола `stend/zamery-k5-povtorno/README.md` (десять повторов одного и того же вопроса при температуре
      0). exec 799: «обратитесь к администратору»; exec 804: названа точная сумма. Цифра самой суммы на
      дивайдер сознательно не взята — правило формы «без чисел» и правило БРИФ §4a «дивайдер, проговоривший
      итог, обнуляет разбор».

      Что сознательно НЕ показано: сколько раз какой ответ выпал, какой из двух верный и какой из них
      типичен. Все три вопроса происходят из одной и той же точки процесса, при одной и той же настройке,
      в один и тот же день — на дивайдере названа только проблема, без исхода.

      Название кейса — «Повторяемость ответа», по функции, как в дорожке кейсов `rendered/deck-config.yaml`
      (`case_track`).'
- id: n56
  file: slides/n56-k5-stsena.md
  type: problem_scenario
  duration_min: 1.5
