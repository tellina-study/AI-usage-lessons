  - id: s44
    file: slides/s44-cobuilding-klyuch-i-oblast-vidimosti.md
    type: cobuilding
    duration_min: 1.25
    assertion: "Ключ хранится в переменной окружения, а не в файле, — с честной оговоркой, что это не гарантирует полной защищённости; а область видимости конфигурации решает, коммитится ли файл в репозиторий вообще"
    learning_goal: "Совместное формирование MCP-подключения, вопросы 3–4: хранение ключа и выбор области видимости (local/project/user), включая дефолт, о котором легко не знать"
    visual:
      pattern: cobuilding_config_reveal
  - id: s45
    file: slides/s45-resheniye-mcp-json-i-tri-primitiva.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Итог разговора — четыре содержательные строки в .mcp.json: чем запускается сервер, что запускается, откуда берётся ключ и какие у него права; а протокол различает инструмент, ресурс и подсказку по тому, кто решает их применить"
    learning_goal: "Решение ступени 5 — реальный .mcp.json из репозитория, ожидаемое дерево, и три примитива протокола с указанием инициатора для каждого"
    visual:
      pattern: code_artifact
  - id: s46
    file: slides/s46-mekhanika-oblasti-i-transporty.md
