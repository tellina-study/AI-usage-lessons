      и источники не менялись.'
- id: n20
  file: slides/n20-kogda-hvataet-komandy-a-kogda-nuzhen-server.md
  type: criteria_boundary
  duration_min: 1.0
  assertion: MCP нужен, когда доступ требуется регулярно, из нескольких сессий, и агент сам решает, когда
    к источнику обращаться; не нужен, когда снимка данных достаточно, задача сводится к известному вызову
    CLI, или подключение достраивает третий элемент смертельного трио
  learning_goal: 'Обобщение кейса, прямо по правилу А7 (issue 225, круг 2 — владелец: «напиши: когда MCP
    нужен, когда не нужен, прямо чётко, не надо чтобы люди догадывались»). Рамка «ещё рано / не нужно
    вообще» снята целиком — обе колонки говорят про сам механизм, не про стадию решения. Естественный
    переход к следующему кейсу, не декларация оси'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки: «MCP нужен, когда» и «MCP не нужен, когда», по четыре строки в каждой,
      построчно зеркальные. Под таблицей — переходная строка к следующему кейсу без разворота в декларацию
      синтеза.'
    backup: 'Источник — rework/section-1-mcp.md §A.1.11, §B.11 (part1c.md). Заголовок — дословно из плана
      (пункты 16/18 сверки: свой заголовок на каждый предел, не общая рамка). Круг 2 правок владельца
      (issue 225, часть А7, построчный разбор n20): прежние заголовки «Ещё рано (ждёт сигнала)» / «Не
      нужно вообще (не вопрос момента)» сняты целиком — владелец прямо запретил эту рамку для итога раздела.
      Колонки переименованы в «MCP нужен, когда» / «MCP не нужен, когда», содержимое перегруппировано
      построчно зеркально (было: 4 пункта «рано» + 2 пункта «никогда» раздельными блоками; стало: 4 строки,
      в каждой — позитивное условие слева и его зеркальная противоположность справа). Стоп-критерий смертельного
      трио перенесён в правую колонку («не нужен») как прямое условие, а не как особый пункт внутри «рано»
      — по содержанию это ровно то же ограничение, что и раньше, просто без деления на «ждёт сигнала»
      и «структурное свойство». Факты и числа не менялись, только раскладка. Пересмотр по сторителлингу
      (issue 225, П1/П6): третья строка таблицы названа через список операций — то, за что по повороту
      кейса (n12, n18) и вносится постоянная плата; критерий тем самым замыкает поворот, а не стоит рядом
      с ним. Содержание строки то же: регулярность, рост числа операций, решение агента в моменте. Слот
      0,75 → 1,0, речь сокращена с 165 слов (1,27 мин при слоте 0,75) до 130 (1,00 мин); снятое ушло в
      справку.'
- id: n21
  file: slides/n21-divider-on-otkryl-sessiyu-i-nichego-ne-sprosil.md
  type: section_divider
  duration_min: 0.5
  assertion: 'Сессия открыта, ни одного вопроса агенту он ещё не задал — а часть контекста уже занята:
