# library/lectures/lec-12/deck.yaml
#
# Deck-структура Лекции 12 «AI в автоматизации производства и цифровые двойники»
# v1: ~39 слайдов (Phase 5-6: первый рендер).
#
# Phase 5-6 multi-artifact pipeline. Issue #133.
#
# Pattern carry-forward от Лекции 11:
#   - section dividers (8 шт.): s05/s14/s19/s24/s28/s32/s36/s38
#   - cover (s02), lecture-map (s03), glossary mini (s04), keystone (s02 cover-keystone)
#   - dedicated Q&A slide (s38), bridge к lec-13 (s39 closing hero)
#   - Hero on s01 (Hannover Messe / NVIDIA / Siemens, ≥40% area) + s39 (Toyota Digit, ≥40% area)
#   - Roadmap-bar только на dividers + cover (НЕ на каждом content slide)

deck:
  lecture_number: 12
  title: "AI в автоматизации производства и цифровые двойники"
  audience: "студенты-инженеры 3 курса (универсальная, не отраслевые специалисты)"
  duration_min: 75
  central_question: "На какой ступени автономии AI можно поднять процесс — A0/A1/A2/A3 — и где цифровой двойник обязателен как мост, а где AI не нужен вовсе?"
  learning_outcomes: [LO2, LO5, LO7]
  language: ru
  status: draft
  version: v1
  source: chapter v3 multi-part (status=reviewed, ~30k слов; chapter.md + chapter-part2.md + chapter-part3.md + chapter-part4.md)
  plan: notes/lecture-12-review/plan-v2.md
  keystone_axis: "Шкала автономии AI в производстве A0→A1→A2→A3; цифровой двойник — мост"

# Final slide list (39 slides):
#
# Section 0 — Cover + keystone + lecture-map + glossary + roadmap (5 мин):
#   s01 — hero hook: Hannover Messe + NVIDIA Omniverse / Siemens Composer
#   s02 — cover (lecture title + meta + roadmap-bar) + keystone foreshadow
#   s03 — lecture-map (8 horizontal section cards)
#   s04 — keystone: «Шкала автономии AI A0→A3» (4 ступени + disclaimer ISA-95)
#
# Section divider 1
#   s05 — divider §1: Что такое цифровой двойник в 2026
#
# Section 1 — §1 DT 2026 + Kritzinger + рынок + 75% fail (5 слайдов):
#   s06 — Kritzinger 3-уровневая taxonomy + ГОСТ Р 57700.37
#   s07 — 4-слойная архитектура (physical / sensors / model / AI-consumers)
#   s08 — рынок 36→180 + AI-mfg 155 + OPC-UA-AI 17,15
#   s09 — Southeast Asian Port failure $12M / 18 мес
#   s10 — data layer audit 5 questions
#
# Section divider 2
#   s11 — divider §2: A0 Наблюдать — vision QC + PdM
#
# Section 2 — §2 A0 (4 слайда):
#   s12 — vision QC + 99% tuned / 0,1-2% FP / cost-of-FP 100 годных
#   s13 — PdM ROI breakdown (Deloitte 10:1 + cement 57× + chemical $2M)
#   s14 — когда vision/PdM НЕ применим — альтернативы
#
# Section divider 3
#   s15 — divider §3: A1 Советовать — MES + alarm + PLC Copilot
#
# Section 3 — §3 A1 (4 слайда):
#   s16 — MES advisory + alarm prediction time-series
#   s17 — PLC Copilot 85% acc + ChatGPT MOV %M99999 failure split
#   s18 — engineer-in-loop architecture
#
# Section divider 4
#   s19 — divider §4: A2 Замыкать петлю + twin как песочница
#
# Section 4 — §4 A2 (4 слайда):
#   s20 — Yokogawa FKDPP в JSR 35 days
#   s21 — digital twin как песочница для RL (Omniverse / Composer)
#   s22 — sim-to-real gap concrete T=300°C / T=315°C + fouling
#   s23 — когда RL НЕ применим — MPC + formal verification
#
# Section divider 5
#   s24 — divider §4.5: A3 — единичные кейсы + 3 блокера
#
# Section 4.5 — §4.5 A3 (1 слайд):
#   s25 — Toyota Digit / BMW Leipzig + 3 блокера (regulatory + cost + complexity)
#
# Section divider 6
#   s26 — divider §5: Где AI НЕ применим
#
# Section 5 — §5 (6 слайдов):
#   s27 — Southeast Asian Port intro hero §5
#   s28 — 10 критериев + альтернатив matrix
#   s29 — worked example фарма + дозировка + FDA ±0,5% vs ±0,1%
#   s30 — Gartner 40% agentic + 30% GenAI PoC abandoned
#   s31 — 5 вопросов вендору
#
# Section divider 7
#   s32 — divider §6: OT/IT архитектура
#
# Section 6 — §6 (3 слайда):
#   s33 — 7-слойная архитектура (sensor → network → edge → MES → twin → cloud → human)
#   s34 — OPC UA + MQTT + TSN dataflow
#   s35 — Lighthouse Network 220+ + 16% EBIT
#
# Section divider 8
#   s36 — divider §7: РФ context + карьерный мост
#
# Section 7 — §7 (2 слайда):
#   s37 — российский кейс (ГОСТ + КАМАЗ + Норникель)
#   s38 — карьерный мост: 4 роли (AI/ML eng / DT eng / MES integration / Edge AI)
#
# Section 8 — §8 Закрытие + Q&A
#   s39 — closing hero: Toyota Digit (bridge к Лекции 13)

slides:
