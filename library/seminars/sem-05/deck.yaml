      end-to-end. Строки с прогоном тестов — арифметика от времени попытки, и на слайде это помечено:
      прогон тестов в песочнице не работает, браузер не стартует. Внешние цифры для порядка величины:
      claudekit hook-profiling.md — простой хук ~30 мс против него же с опросом процессов ~440 мс; dev.to
