# NO MEME DUPLICATION RULE (owner rule slides-meme-forward-minimal-text):
# s01 hook meme/visual is UNIQUE — not repeated on any divider or s02 cover.
# Cover (s02) meme + every section divider (s07/s14/s21/s28/s36/s44) each
# specify their OWN distinct, evergreen meme concept resolving to that
# slide's claim (never decorative, never a copy of s01 or of each other).
# ─────────────────────────────────────────────────────────────────────────

ai_failure_judgment:
  # AI-Failure & Judgment Content Rule (ENFORCED): ≥30% strict-in by MINUTES (not by slides), waiver UNAVAILABLE.
  # 13 solid IN-BUCKET slides (case+lesson+criterion+alternative, on-point to its own phase):
  strict_in_slides: [s12, s13, s13a, s19, s20, s26, s27, s33, s34, s40, s41, s42, s47, s48]
  count: 14   # 13 canonical plan failures + s13a IBM Watson (additional Discovery failure #3, added post-plan per course-curator LO3 sign-off note)
  share_by_minutes: "≈34.5 / ≈92 active min ≈ 37.5% (buffer above the 30% threshold; honest recount of the v3 plan: 13 canonical failures = 31.5 min / 92 = 34%; +s13a IBM Watson adds ≈3 more provisional minutes to the Discovery cluster, the result is stated as a 34-37.5% range, exact recount — Phase 7 methodology-critic against actual slide duration_min)."
  partial_out: [s01, s02, s03, s04, s06, s07, s07b, s08, s09, s10, s11, s14, s14b, s15, s16, s17, s18, s21, s21b, s22, s23, s24, s25, s28, s28b, s29, s30, s31, s32, s35, s36, s36b, s37, s38, s39, s43, s44, s44b, s45, s46, s49]
  note: >
    s05/s06 — the keystone axis (course-scaffold), NOT strict-in per Decision #78. Upside limitation
    slides (s11, s18, s25, s32, s39) — a criterion without its own on-point case — partial→out (v1
    lesson: don't pad the count with borderline slides). 6× sNNb ELI5 overviews (s07b/s14b/s21b/
    s28b/s36b/s44b, Phase 5 post-plan addition) — a methodical recap of the phase in plain terms,
    with no on-point case of its own — partial→out, not part of strict_in_slides. Holistic
    distribution: each of the 6 sections carries ≥2 on-point failures — S1: s12/s13/s13a (3) ·
    S2: s19/s20 (2) · S3: s26/s27 (2) · S4: s33/s34 (2) · S5: s40/s41/s42 (3) · S6: s47/s48 (2).
    No single-artifact concentration. chapter target ≥40% (per-part word count, methodology-critic
    Phase 3); slides/speech target ≥30% by minutes (Phase 7/10).

# ─────────────────────────────────────────────────────────────────────────
# Presentation order (plan-final §4): phases of the product loop, each
# base→AI→limitations→failure. S0 s01-s06 (intro+keystone) ·
# S1 [s07] s08-s13a (Discovery) · S2 [s14] s15-s20 (Design) ·
# S3 [s21] s22-s27 (Build/Launch) · continued in deck-part2.en.yaml:
# S4 [s28] s29-s35 (Measure/Experiment) · S5 [s36] s37-s43 (Support/Operate) ·
# S6 [s44] s45-s49 (Governance/finale).
# ─────────────────────────────────────────────────────────────────────────

slides:
  # ─── Section 0. Introduction + keystone (s01–s06) ───
  - id: s01
    file: slides-en/s01-hook-paradox.md
    type: hero_cover
    section: "Section 0. Introduction and keystone"
    duration_min: 3
    assertion: "Anthropic: weeks of work → hours; MIT: ~95% of pilots reportedly yield zero return — assembly is nearly free, but turning assembly into value is not; the paradox is the subject of the whole lecture"
    learning_goal: "Hook paradox: two facts are true at once; payoff at s47"
    learning_outcomes: [LO6]
    chapter_ref: "§0.1 [for-slide-s01]"
    interaction: open_question
    verify_day_of: true
    hero_required: true
    partial_out_strict_in: true

  - id: s02
    file: slides-en/s02-cover-roadmap.md
    type: cover
    section: "Section 0. Introduction and keystone"
    duration_min: 0.5
    assertion: "Lecture 5. AI Product: the full lifecycle — from intent to operation"
    learning_goal: "Cover + roadmap of the loop's 6 sections; unique meme (not a duplicate of s01)"
    learning_outcomes: [LO1, LO2, LO3, LO6]
    chapter_ref: "§0.2 [for-slide-s02]"
    interaction: none
    verify_day_of: false
    hero_required: true

  - id: s03
    file: slides-en/s03-lecture-map-loop.md
    type: process
    section: "Section 0. Introduction and keystone"
    duration_min: 1
    assertion: "The lecture's six sections are six arrows of one loop: discover → build → measure → learn → decide → back to discover"
    learning_goal: "Lecture-map = the loop, 6 sections on the arrows"
    learning_outcomes: [LO1]
    chapter_ref: "§0.2, §0.4 [for-slide-s03]"
    interaction: none
    verify_day_of: false

  - id: s04
    file: slides-en/s04-bridge-lec4-central-question.md
    type: comparison
    section: "Section 0. Introduction and keystone"
    duration_min: 2
    assertion: "The code loop (Lecture 4) lives inside the product loop: code is one step of the loop — now cheap — not the whole path from intent to operation"
    learning_goal: "Bridge from Lecture 4 + the chapter's central question"
    learning_outcomes: [LO1]
    chapter_ref: "§0.2, §0.3 [for-slide-s03, s04]"
    interaction: none
    verify_day_of: false

  - id: s05
    file: slides-en/s05-keystone-loop.md
    type: assertion_visual
    section: "Section 0. Introduction and keystone"
    duration_min: 2
    keystone: true
    assertion: "A statistician (Deming, PDCA), a fighter pilot (Boyd, OODA) and an entrepreneur (Ries, BML) independently drew the same blueprint: a product is a discover→build→measure→learn→decide loop"
    learning_goal: "KEYSTONE — the feedback loop, 3 independent primary sources + the single/double-loop nuance"
    learning_outcomes: [LO1]
    chapter_ref: "§0.4 [for-slide-s05]"
    interaction: none
    verify_day_of: false
    partial_out_strict_in: true

  - id: s06
    file: slides-en/s06-keystone2-asymmetry.md
    type: assertion_visual
    section: "Section 0. Introduction and keystone"
    duration_min: 1.5
    keystone: true
    assertion: "AI changes the cost and trust of every arrow of the loop asymmetrically: Build → near zero; Measure/Learn — trust falls; Observe/Orient — faster, but more fragile"
    learning_goal: "KEYSTONE-2 — cost/trust asymmetry + the meta-pattern \"the classic stays on every arrow\""
    learning_outcomes: [LO1, LO2]
    chapter_ref: "§0.5, §0.6, §0.7 [for-slide-s06]"
    interaction: think_pause
    verify_day_of: false
    partial_out_strict_in: true
    axis_slide: true   # ENFORCED: the lecture's load-bearing axis, NOT strict-in (Decision #78)

  # ─── Section 1. Discovery (s07–s13a) ───
  - id: s07
    file: slides-en/s07-divider-discovery.md
    type: section_divider
    section: "Section 1. Discovery"
    duration_min: 0.3
    assertion: "Discovery: intent and research — where does the hypothesis of what to build even come from"
