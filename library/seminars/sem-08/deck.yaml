      \ должна СНАЧАЛА извлечь число из текста (тот же вероятностный шаг, что и без калькулятора), а ПОТОМ\
      \ сама решить, вызывать ли инструмент и с какими аргументами — вероятностность не исчезает, она\
      \ переезжает на шаг раньше. (3) Для каждой из 4 карточек — РЕАЛЬНАЯ измеренная точность, кроме числового\
      \ поля формы (другая мера, см. ниже), с полным протоколом в `stend/refund-case3-all-variants-results.json`:\
      \ - «яснее правило» — НОВОЕ измерение этой волны (`stage-3c-model-\n  clearer.json`, webhook `s8-refund-clearer`):\
      \ 100/100 на\n  расширенном наборе из 100 запросов (включая все граничные и\n  неоднозначные случаи,\
      \ на которых версия 1 набрала 9 ошибок из\n  101). Переформулировка прошла реальный прогон, не осталась\n\
      \  теоретическим предположением.\n- «калькулятор» — НОВОЕ измерение этой волны (`stage-3d-agent-\n\
      \  calculator.json`, агент `@n8n/n8n-nodes-langchain.agent` +\n  `toolCalculator`): 56/100 — хуже\
      \ всех остальных вариантов.\n  Детали отказов (не выдуманные, из реального execution runData):\n\
      \  30/100 ответов агента не сводятся к чистому слову («.odобрить» —\n  смешанный алфавит, рассуждение\
      \ вслух с псевдокодом вместо\n  ответа, одно переключение на китайский язык); 11/100 — встроенный\n\
      \  Calculator-узел n8n вернул «I don't know how to do that» на\n  запрос вида «2500 < 3000» (умеет\
      \ арифметику, не умеет сравнения);\n  9/100 — ошибки РАЗБРОСАНЫ по всему диапазону сумм, не только\
      \ у\n  границы, чего не было ни у версии 1, ни у «яснее правило».\n- «IF-узел» = версия 2, измерение\
      \ этой волны на РАСШИРЕННОМ наборе:\n  0 ошибок из 101 (51 исходных + 50 новых — см. n31/n32).\n\
      - «числовое поле формы» — не измерено как точность, и это не\n  пробел: у варианта нет шага извлечения\
      \ вовсе, поэтому «точность\n  извлечения» здесь тривиальна (100% по конструкции — нечего\n  путать,\
      \ когда нет текста). Применимая мера — применимость\n  (можно ли менять форму заявки), не точность;\
      \ число не\n  придумано, где его физически нет.\nОтдельная честная находка этой волны, НЕ входящая\
      \ в 4 карточки (новая идея владельца, п.30 правки): жев (TypeSafe Decisions API) для извлечения\
      \ суммы — проверен на тестовом вызове и отклонён, его API структурно не поддерживает открытую числовую\
      \ экстракцию (только квантованные ответы noul/choice/score/box). Полный протокол — `stend/jev-extraction-diagnostics.json`.\
      \ Не добавлен в таблицу как карточка — это не то, что предлагал вопрос, и натягивать результат запрещено\
      \ прямым требованием задачи."
