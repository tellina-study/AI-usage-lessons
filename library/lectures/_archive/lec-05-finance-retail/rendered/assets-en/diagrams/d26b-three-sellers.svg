<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360"><rect width="1180" height="360" fill="none"/><rect x="20" y="14" width="372" height="332" rx="16" fill="#F4F7FA" stroke="#065A82" stroke-width="3"/><defs><clipPath id="clip5e4"><circle cx="78" cy="74" r="34"/></clipPath></defs><circle cx="78" cy="74" r="34" fill="#065A82" stroke="#21295C" stroke-width="3"/><g clip-path="url(#clip5e4)"><circle cx="78" cy="63.8" r="11.56" fill="#FFFFFF"/><ellipse cx="78" cy="100.52" rx="21.08" ry="19.72" fill="#FFFFFF"/></g><text x="128" y="84" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#065A82">Collaborative</text><text x="50" y="158" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">«People who bought what you did —</text><text x="50" y="186" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">also took this»</text><rect x="42" y="224" width="328" height="96" rx="10" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="1.5"/><text x="58" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">remembers the behavior PATTERN,</text><text x="58" y="290" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">doesn't know the product</text><rect x="406" y="14" width="372" height="332" rx="16" fill="#F4F7FA" stroke="#028090" stroke-width="3"/><defs><clipPath id="clip1072"><circle cx="464" cy="74" r="34"/></clipPath></defs><circle cx="464" cy="74" r="34" fill="#028090" stroke="#21295C" stroke-width="3"/><g clip-path="url(#clip1072)"><circle cx="464" cy="63.8" r="11.56" fill="#FFFFFF"/><ellipse cx="464" cy="100.52" rx="21.08" ry="19.72" fill="#FFFFFF"/></g><text x="514" y="84" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#028090">Content-based</text><text x="436" y="158" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">«Similar by description</text><text x="436" y="186" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">to your favorite item»</text><rect x="428" y="224" width="328" height="96" rx="10" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="1.5"/><text x="444" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">knows the CATALOG by heart,</text><text x="444" y="290" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">doesn't know the crowd</text><rect x="792" y="14" width="372" height="332" rx="16" fill="#F4F7FA" stroke="#21295C" stroke-width="3"/><defs><clipPath id="clip1b00"><circle cx="850" cy="74" r="34"/></clipPath></defs><circle cx="850" cy="74" r="34" fill="#21295C" stroke="#21295C" stroke-width="3"/><g clip-path="url(#clip1b00)"><circle cx="850" cy="63.8" r="11.56" fill="#FFFFFF"/><ellipse cx="850" cy="100.52" rx="21.08" ry="19.72" fill="#FFFFFF"/></g><text x="900" y="84" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" fill="#21295C">Hybrid</text><text x="822" y="158" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">«Both what similar people bought,</text><text x="822" y="186" font-family="Inter, Arial, sans-serif" font-size="20" fill="#21295C">and what's similar + context»</text><rect x="814" y="224" width="328" height="96" rx="10" fill="#FFFFFF" stroke="#E5EAF0" stroke-width="1.5"/><text x="830" y="262" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">combines both + the situation</text><text x="830" y="290" font-family="Inter, Arial, sans-serif" font-size="18" fill="#5B6678">(Friday evening, phone)</text></svg>