      (сколько серверов, кто их добавил, во что обошлось), а вопрос держится одной строкой и не вводит
      ни одного нового обстоятельства. Двухшаговая формулировка («что первым — что следующим») сохранена
      с прежнего круга: её ввела вторая прожарка (студент-симулятор: «карточки выглядят как альтернативы,
      а ответ — последовательность»), и для нового кейса она работает так же, потому что рабочих мер здесь
      тоже две. Пять карточек подобраны так, чтобы четыре из них зал называл сам: «контекст большой»,
      «отключить лишние», «сжимать чаще» — ходы, которые звучат первыми; «набор под задачу» опирается
      на области видимости из первого случая (n14); «описания по требованию» — поведение по умолчанию,
