# Что у Семинара 12 своё. Код сборщика — общий, в `tools/seminar-build/`.
#
# Правило, которое этот файл обслуживает (канон `tools/presentation-build/
# seminar-deck-kit.md`): дека собирается из ИМЕНОВАННОЙ БИБЛИОТЕКИ ПРИЁМОВ, и
# приём выбирается по полю `visual.pattern` слайда — ниже, в `genres`.
#
# Взято за образец у `library/seminars/sem-11/rendered/deck-config.yaml`
# (тот же трёхблочный состав — Введение/Кейсы/Закрытие, БЕЗ разбавителя вне
# дорожки кейсов, в отличие от Семинара 10) и переписано под сетку С12
# (ARCHITECTURE.md §4, SETKA-KEYSOV.md): ЧЕТЫРЕ кейса, без разбавителя.
#
# Написан сессией Кейса 3 (issue #351) по прямому поручению оркестратора —
# в момент написания на диске существуют ТОЛЬКО слайды Кейса 1 (n10-n24,
# другая сессия) и Кейса 3 (n50-n64, эта сессия). Кейсы 2 и 4, введение и
# закрытие ещё не произведены — границы блоков ниже описывают ЗАНЯТИЕ ЦЕЛИКОМ
# по плану оркестратора, не текущее состояние папки `slides/`. Три места,
# отмеченные ниже как ПРОВИЗОРНЫЕ, требуют правки тем, кто производит
# соответствующий кусок (не выдумано из воздуха, а оценено по бюджету
# ARCHITECTURE.md §4, где это прямо помечено).

seminar: "12"
issue: 351

langs:
  ru:
    slides: slides
    deck: deck.yaml
    out: sem-12.pptx
    blocks: [Введение, Кейсы, Закрытие]
  en:
    # Bilingual Production Rule (CLAUDE.md, issue #172). EN-трек
    # производится ПОСЛЕ приёмки RU, отдельной фазой — не в этом круге.
    slides: slides-en
    deck: deck.en.yaml
    out: sem-12-en.pptx
    head: head.en.yaml
    blocks: [Introduction, Cases, Closing]

# Границы блоков: [от, до, индекс блока, индекс ступени или null].
# ПЛАН оркестратора (не текущее состояние диска): введение n01-n09, кейсы
# n10-n79 (Кейс 1 n10-n24, Кейс 2 n25-n49, Кейс 3 n50-n64, Кейс 4 n65-n79),
# закрытие с n80. ПРОВИЗОРНО: верхняя граница закрытия (n88 ниже) — оценка
# по бюджету ARCHITECTURE.md §4 («мостик к С13» ~4 мин + «закрытие с
# заполненной осью» ~5 мин ≈ 9 мин, при ~1 мин/слайд это 8-9 слайдов), не
# измерение — поправить, когда закрытие будет реально написано.
razmetka:
  n:
    rows:
      - [1, 9, 0, null]
      - [10, 79, 1, 0]
      - [80, 88, 2, null]
    stages: []

# Дорожка кейсов на лёгком дивайдере: названия по ЗАДАЧЕ (канон §1
# проектирования — не тезис/урок), в порядке SETKA-KEYSOV.md. ПРОВИЗОРНО:
# короткие ярлыки изобретены этой сессией для дивайдера (полные названия
# SETKA-KEYSOV.md слишком длинны для пилюли — прецедент сем-11 §4.2,
# переполнение на всех пяти дивайдерах разом при похожей длине) — подлежат
# правке владельцем/оркестратором при сведении.
case_track:
  - Что писать в индекс
  - Картинка в числа
  - Чем искать
  - Порог похожести

# ВАЖНО, куплено дефектом С8 (сем-10 deck-config.yaml, комментарий к
# собственному n28): ключи ниже — ТОЧНЫЕ id дивайдеров кейсов, ИТОГОВАЯ
# нумерация. При любой вставке или перенумеровке слайдов этот блок правится
# В ТОМ ЖЕ КРУГЕ. n25/n65 — ПЛАН (Кейсы 2/4 не произведены ещё), не замер.
case_idx:
  n10: 0
  n25: 1
  n50: 2
  n65: 3

# `visual.pattern` → жанр из библиотеки приёмов (`tools/seminar-build/genres.py`).
# Имя, которого здесь нет, рисуется жанром `content` — нормальный, самый
# частый случай. Наблюдаемые у Кейсов 1 и 3 имена `problem_scenario`,
# `mechanism_node_graph`, `measured_outcome_table`, `test_structure_table` —
# как и у сем-10/11 — НЕ получают отдельной записи: различие между ними несёт
# роль блока-цитаты (`pattern_role` ниже), не отдельная раскладка. `axis_table`
# и `criteria` у Кейса 1 (n14/n21, n23) названы ИМЕНЕМ ЖАНРА напрямую — тоже
# не требуют записи (genre_fn берёт имя пэттерна как имя жанра, если ключа
# в словаре нет и это известное имя). Записи ниже нужны только там, где
# имя слайда РАСХОДИТСЯ с именем жанра.
genres:
  hero_cover: cover_centered
  case_divider_quote: case_divider
  question_with_option_cards: question
  keystone_axis: axis_table
  recap_table: axis_table
  criteria_checklist_and_boundary: criteria

# Роль блока-цитаты ПО УМОЛЧАНИЮ для этого приёма. Запись нужна только там,
# где умолчание (`formula`) неверно. `axis_table`/`criteria` добавлены сюда
# (не только `keystone_axis`/`recap_table`/`criteria_checklist_and_boundary`)
# потому что Кейс 1 называет эти же жанры напрямую по имени (n14/n21/n23) —
# без этой записи та же пара слайдов получила бы роль по умолчанию
# «formula» вместо «fact», разойдясь с Кейсом 3, который для тех же двух
# жанров пришёл через алиас и роль «fact»/«formula» уже имеет.
pattern_role:
  question_with_option_cards: question
  criteria_checklist_and_boundary: formula
  criteria: formula
  recap_table: fact
  keystone_axis: fact
  axis_table: fact
  measured_outcome_table: fact

# Приёмы, где зал ГОЛОСУЕТ карточками.
vote_patterns:
  - question_with_option_cards

# Дивайдеры кейса: `audit_takty_keysa` читает этот список, чтобы проверить
# порядок «дивайдер → сцена → вопрос» (А5a). У С12 один приём дивайдера
# кейса, разбавителя вне дорожки нет (как у С11) — список из одного имени.
divider_patterns: [case_divider_quote]

# Слайды, где фигура — подтверждающий бэкап ПОСЛЕ основных врезок. Пусто —
# не пробел: у Кейсов 1 и 3 фигура везде основной контент, не доказательство
# постфактум (тот же вывод, что у сем-11 при разборе её собственной Фазы 4).
fig_after: []

table_style: {}
gold_quote_sids: {}
figs: {}

# Врезки, где роль блока-цитаты задаётся ПО ID СЛАЙДА, не по приёму —
# заполняется по факту предупреждений "СХЕМА ЗАЖАТА"/подобных на реальной
# сборке (прецедент сем-10/11: n8n-экраны, полнокадровые схемы). Пусто на
# момент написания — первая пробная сборка (`build.py --block`) Кейсов 1 и 3
# не дала таких предупреждений; требует повторной проверки по мере
# добавления Кейсов 2/4.
quote_role_force: {}

deck_yaml:
  central_question_patterns: [question_with_option_cards]
  axis_pattern: keystone_axis
  head_defaults:
    seminar_number: 12
    audience: "3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами"
    format: >-
      слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) +
      схемы постановки задачи (сплошным — то, что уже собрано, пунктиром — то, что
      предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
      + измеренные замеры на корпусах CORD/SberQuAD (переиспользованы с Семинара 10,
      часть — новые на этом стенде), протоколы в `stend/`
    language: ru
    slot_min: 90

# ── Сторожа и генераторы ────────────────────────────────────────────────────

notes:
  # Коридор семинара по канону §5 — 250-450 слов на содержательный слайд,
  # единый на все классы (приём Семинара 7, не Семинара 6).
  bands:
    разделитель: [250, 450]
    голосование: [250, 450]
    содержательный: [250, 450]
    опорный: [250, 450]
    обложка: null
  anchor: {}

svodka:
  case_divider_patterns: [case_divider_quote]
  nachalo_default: "сцена Ольги, одностраничник"
  zal:
    question_with_option_cards: голосования карточками

sluzhebnoe:
  timing_patterns: [hero_cover, case_divider_quote, keystone_axis, recap_table]
  razdely: ["МОСТИК", "ШОВ С11→С12", "ОСЬ"]
