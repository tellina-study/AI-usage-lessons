- id: n11
  file: slides/n11-vopros-kak-dat-dostup-k-trekeru.md
  type: reflection_question
  duration_min: 1.0
  assertion: Агенту регулярно нужно смотреть открытые задачи трекера и готовить черновики правок; зал
