      нигде не было названо. Правка заголовка и подписи: заголовок называет разрешение («Что встало на
      место двух промахов»), подпись разводит промахи по строкам. **Таблица не тронута ни на знак** —
      все четыре строки, обе её колонки и порядок ступеней те же; правка живёт в заголовке, подписи и
