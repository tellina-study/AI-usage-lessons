    и слайд проверяет именно его. Разбор пяти карточек, форма А5 — две содержательные колонки. Концепт
    удерживается от переусложнения — ровно одно новое различие: время чтения и место, где это чтение лежит'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает / что не делает — ограничение.
