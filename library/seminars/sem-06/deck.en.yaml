      itself, this is not an illustrative assumption. The same page on the conversation being the same
      regardless of place: "The transport layer abstracts communication details from the protocol layer,
      enabling the same JSON-RPC 2.0 message format across all transport mechanisms". The same page on
      the protocol not describing how the server obtains the data: "MCP focuses solely on the protocol
      for context exchange", while tools are defined as "Executable functions that AI applications can
