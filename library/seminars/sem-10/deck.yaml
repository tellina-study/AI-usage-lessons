    primary: 'Настоящий скрин холста n8n живого стенда: Вопрос + корпус с эмбеддингами → Keyword overlap
      → Embed query (OpenRouter) → Cosine ranking (vector) → RRF fusion (hybrid) → LLM-реранкер (gpt-4o-mini)
      → Разбор ответа реранкера + итог → Result screen.

      '
    backup: 'ЗАМЕНА ПРОГРАММНОЙ СХЕМЫ НА НАСТОЯЩИЙ СКРИН этой правкой (канон `proektirovanie-keysa-i-voprosa.md`
