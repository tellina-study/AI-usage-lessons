- id: n27
  file: slides-en/n27-svidetelstva-opisaniya-ubrali-so-starta.md
  type: failure_vignette_table
  duration_min: 1.5
  assertion: The protocol's author called loading all the definitions at start-up a problem and measured
    it on his own examples; the same documentation gives 55,000 tokens on five servers and a drop in the
