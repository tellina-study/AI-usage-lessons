      Что на кадре НЕ видно и поэтому прозой рядом не утверждается: сам текст промта и значение `temperature`.
      Холст показывает карточки узлов, а не их открытые настройки.'
- id: n70
  file: slides/n70-k6-rezultat-summa.md
