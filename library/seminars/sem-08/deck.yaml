- id: n31a
  file: slides/n31a-k3-reveal.md
  type: metric_band_reveal
  duration_min: 0.5
  assertion: На одном и том же наборе из 101 запроса правило в промте ошиблось 9 раз, условие в коде —
    ни разу
  learning_goal: 'Такт-выплата: зал только что поднимал руки, угадывая число ошибок, и видит ответ одним
    экраном, до всякого разбора. Дальше (n32) то же число разбирается по блокам теста.'
  visual:
    pattern: metric_band_reveal
    primary: 'Белый экран, ряд из двух плашек: «9 из 101» (золотая, правило в промте) и «0 из 101» (условие
      в коде). Под рядом — одна строка о том, где именно стоят все девять. Больше на экране ничего.

      '
    backup: 'НОВЫЙ слайд волны 2а «конфетки» (issue #292, план §4.5), letter-tail между n31 и n32. Зачем:
      до него методология измерения (n31) упиралась сразу в таблицу разбора по шести блокам (n32), и ответ
      на вопрос «сколько же ошибок» зал читал внутри таблицы, одной ячейкой среди двадцати. Подготовленный
      вопрос залу стоит в конце заметок n31 — руки поднимаются ДО этого экрана, и экран существует ради
      той секунды, в которую зал сверяет свой прогноз с числом. Поэтому на нём нет ничего, кроме двух
      чисел и одной строки: любая третья врезка эту секунду тратит. Числа не новые и не пересчитанные
      — те же, что в n32 и в сводке прогона `stend/refund-case3-all-variants-results.json`: версия 1 —
      9 ошибок из 101, версия 2 — 0 из 101, все девять на сумме, ровно равной порогу. Жанр — `metric_band`
      (ряд плашек), `answer_breakdown_table` здесь не годится: таблица разбора — это уже n32. Единица
      суммы — «руб.», как во всей деке; знак ₽ не используется (notes/mcp-limitations.md [#274-1]: в плотных
      блоках он рендерится отдельным наложенным объектом).'
