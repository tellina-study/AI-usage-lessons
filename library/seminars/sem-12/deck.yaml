- id: n33
  file: slides/n33-razbor-vydumki.md
  type: content
  duration_min: 1.5
  assertion: Каждая выдумка рассказа — отдельный независимый случай, а не одна и та же ошибка пять раз
  learning_goal: 'С3 (разбор с вердиктами на реальных примерах, не абстракцией). Пять случаев, пять разных
