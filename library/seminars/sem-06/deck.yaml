    backup: 'Круг 5 (issue 225): вопрос и карточки написаны заново вместе с кейсом; прежние пять карточек
      («ничего — делегирование уже есть» … «позвать коллегу») сняты с кейсом специализации. Порядок карточек
      сведён с порядком строк разбора n53 (прожарка 2, P2 методиста). Первые две карточки — настоящие
      рабочие ответы, которые зал называет первыми; последние две несут вывод кейса и на слайде ничем
      не выделены. Правка после двух проведённых занятий (issue 225, qa/RAZBOR-PROVEDENIYA.md §C3): на
      самих занятиях вопрос «было ли у кого, что сессии дерутся в одной папке» дал ответы в обеих группах,
      тогда как абстрактные формулировки ответов не давали. Поэтому он встал первой строкой слайда, а
      выбор карточки идёт вторым ходом. Карточки, их порядок и разбор (n53) не менялись. Литературная
      редактура (issue 225, qa/pravki-nahodok-svedeniya.md п.1): со строки-указания снята фраза «Состав
      верного ответа до разбора не называю» — ведущий говорил о собственном приёме на экране зала, а это
      правило А4 канона семинаров, и место такой фразы в заметках. Сама строка приведена к длине четырёх
      остальных голосований: 39 слов → 17 при коридоре 16–20. Обстановка (задачи независимы, обе сессии
      нужны разом, каталог один), выбор и обоснование рядом с четырьмя соседними карточками сохранены;
      «что здесь меняют» несёт заголовок слайда, поэтому в строке не повторяется. Карточки и разбор не
      тронуты.'
