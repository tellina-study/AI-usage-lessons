- id: n37
  file: slides-en/n37-kriterii-chto-ostayotsya-v-kontekste-posle-otveta.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Reading is worth delegating when what you need out of it is a short conclusion — a fact,
    a yes/no, a list a few lines long that the work then proceeds from; if you are going to have to work
    with the whole volume you read, you will have to read it yourself in any case
  learning_goal: 'The close of the case: the criterion "when this works, when it does not" + the axis
    line (intuition/test), brought together with what the room said out loud at the vote. Stated directly,
    nothing left unsaid — rule A7 of round 2 still stands. Storytelling revision (issue 225, rule P5):
    this is also where the only "about yourself" question of the whole rung stands — the room applies
    the criterion to its own project. Round 5 (issue 225): the criterion was sharpened for the new scene
    — the boundary runs along whether the whole volume read is needed further on or only a few places
    out of it, and that is exactly the distinction that makes a search delegable and a refactoring not'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'The criterion block in two points: when delegating the reading makes sense, when it does
      not. Below it — the axis line with a thick gold bar on the left, no fill: intuition said / the test
      showed. As the last block — a short "about yourself" question.'
    backup: 'Owner''s round-3 slide (issue 225). The criterion and the axis line were written for the
      scene and the mechanics of the case; the format is the same as that of the closing slides of the
      rung''s other cases (criterion + axis line on one slide). Literary editing: the "not X, but Y" format
      was removed from every visible and spoken block. Storytelling revision (PERESMOTR-STORITELLING.md):
      the axis line was rewritten around the guess the room said out loud, and an "about yourself" block
      was added — rule P5, the only such question in the subagent section; the form is kept distinct from
      the "about yourself" question of the MCP section (n18): there the room recounts its current environment,
      here it recalls a task. Round 5 (issue 225, ZADANIE-KRUG-5.md): the word "window" was removed from
      the slide entirely (10 occurrences). The criterion was sharpened in the wake of the scene: the former
      wording separated "a short conclusion" from "the work continues on the same material", and in the
      new scene the work really does continue — in four files out of forty. The boundary was drawn where
      it actually runs: whether the WHOLE volume read is needed further on. The axis line was built out
      with the second change (where the result comes back to) — the very one that distinguishes a subagent
      from a second session.'
- id: n38
  file: slides-en/n38-divider-zadacha-prishla-odnoy-frazoy.md
  type: section_divider
  duration_min: 0.5
  assertion: The task arrives as one sentence with one deadline; there is more than one means of speeding
    it up, and the choice between them is made by the task itself
  learning_goal: 'The decision point of the case about laying work out and speeding it up. The form is
    a question to which the room already has a half-correct answer: yes, we will speed it up, but the
    means will come from somewhere other than where it is expected. The sense line promises a turn and
