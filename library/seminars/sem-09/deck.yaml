    версий починки и без чисел прогона.'
  visual:
    pattern: problem_scenario
    primary: 'Сверху — схема С1 текстовыми панелями: сплошной процесс (заявка → классификация → модель
      отвечает по справочнику → ответ), пунктиром — фокус этого кейса (настройки узла и текст промта).
      Сразу под схемой — прямая классификация проблемы одной строкой. Дальше рамка-врезка с обстановкой,
      пронумерованная хронология двух обращений, закрывающая плашка про цену. Версии решения на кадре
      нет, чисел прогона нет.

      '
    backup: 'СХЕМА С1 ДОБАВЛЕНА (разбор 2026-10-29, К5-1) — тем же приёмом, что уже применён к n19-k2-stsena.md
      (К2-4): текстовые панели, без PNG. Пунктир здесь — не новый узел на холсте (холст не меняется, П4),
      а фокус разбора: настройки узла модели и промт, от которых зависит, насколько одинаков ответ. Дотянуть
      до отдельной PNG-фигуры — решение designer-прохода, не этой правки.

      КЛАССИФИКАЦИЯ ПРОБЛЕМЫ ПЕРЕФОРМУЛИРОВАНА ЯВНО (К5-2), дословно по разбору: «не то что учебный процесс,
      а то, что клиенты получают разные ответы на один и тот же вопрос — надо сделать стабильно» (`qa/kommentarii/kommentarii-2026-10-29.md`,
      43:20). Прежняя редакция подводила к этому через хронологию, не называя классификацию отдельной
      строкой до неё — теперь строка стоит прямо под схемой, раньше первого повествовательного предложения.

      Персонаж — Ольга, администратор учебного центра (А13), тот же процесс, что отвечает клиентам с Кейса
      1 — новый узел сцена не вводит (сознательный сбой ритма этого кейса, П4, назван в сетке отдельно).

      Что сознательно НЕ показано: ни одной из пяти карточек вопроса, ни одного числа замера. Сцена ставит
      проблему и называет первую гипотезу инженера; что показал стенд — такты n60 и далее.'
