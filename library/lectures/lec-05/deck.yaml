deck:
  lecture_number: 5
  title: "Лекция 5. AI-продукт: полный жизненный цикл — от намерения до эксплуатации"
  audience: "студенты-инженеры 3 курса, универсально, без локального binding"
  duration_min: 90
  central_question: "Когда AI сделал сборку почти бесплатной — что стало настоящим узким местом продукта, и на каждой фазе цикла: какая классическая дисциплина остаётся, что AI ускоряет, и где AI-first ломается?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: ru
  status: draft-for-gate-b
  version: v2.0
  source: "chapter.md + chapter-part2..5.md (57 271 слово тела)"
  plan: "qa-reports/2026-09-28-rescope/chapter-coverage-for-practice-deck.md"
  total_slides: 54
  curriculum_level: "Отраслевая лекция (после Л4 SDLC); L5 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "фазы петли продукта (discover→build→measure→learn→decide); каждая фаза = база→AI→практика→ограничения→провал"
  glossary_lock: glossary.yaml

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  ref: "library/lectures/lec-05/glossary.yaml"
  locked_at: "2026-09-30"          # перевыпуск, issue #212 (прежний lock — 06.09, #189)
  headline_terms:
    - "петля из шести фаз; цена ошибки растёт вниз по петле"
    - "развитие клиента (Customer Development); «The Mom Test»"
    - "эталонный набор"
    - "двойной ромб (Double Diamond); эвристики Нильсена; дизайн-система"
    - "переключатель функции / канареечный выпуск / поэтапная раскатка / путь назад"
    - "рубеж «продолжать или закрыть» (Stage-Gate); рубеж остановки; человек на рубеже"
    - "шкала самостоятельности; уровень самостоятельности"
    - "модель-судья; оценка до выпуска и на живом потоке"
    - "метрика решения и метрика-ограничитель; сводный критерий оценки (OEC)"
    - "косвенная метрика; закон Гудхарта"
    - "показатель уровня сервиса (SLI) / цель уровня сервиса (SLO) / бюджет ошибок"
    - "наблюдаемость; тихий дрейф; аварийный выключатель"
    - "цена за единицу текста и базовая линия без ИИ; портфельное управление"
    - "три оси решения: обратимость, цена ошибки, наблюдаемость"
  note: >
    Lock перевыпущен 30.09.2026 (issue #212) после того, как восемь параллельных сессий
    русифицировали деку каждая в своём разделе и развели одиннадцать понятий. Прежний
    набор строился вокруг латинских форм («guardrail-метрика», «agency-ladder»,
    «reference dataset», «SLI/SLO/error budget») и деке больше не соответствовал.
    Что на что заменено и почему — в glossary.yaml, раздел `resolved_divergences`
    (у каждого канона поле `replaces`). Термины снятых слайдов (LLMOps/AgentOps,
    Guardian Agent, CC/CD, pass@k/pass^k) в headline-набор не возвращены: их несущих
    слайдов в деке нет. Речь (speech.md, speech-part2.md) на момент перевыпуска канону
    ещё НЕ соответствует — она переписывается отдельно по этому файлу.

