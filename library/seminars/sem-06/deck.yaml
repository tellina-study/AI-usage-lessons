    где может стоять сервер, где проходит граница машины и куда уходит запрос. Разбор механики по частям
    идёт следом; здесь — только расстановка и один вывод: MCP един для агента, наружу сервер говорит языком
    системы'
  visual:
    pattern: mechanics_with_figure
    figure: mcp-n08-gde-chto-stoit.png
    primary: 'Схема на весь слайд. Слева рамка «ВАША МАШИНА» — в ней агент, и в ней же первый вариант
      сервера; стрелка «1 — MCP» идёт от агента к серверу внутри рамки. Вторая стрелка, «2 — MCP по сети»,
      выходит из агента, пересекает границу машины и уходит в пунктирную рамку «ЧУЖАЯ МАШИНА» со вторым
      сервером. От каждого сервера стрелка «запрос» уходит вправо, в панель «ВНЕШНЯЯ СИСТЕМА»: четыре
      строки — трекер задач, база данных, витрина отчётов, внутренний сервис — и у каждой свой знак протокола
      (REST, SQL, GraphQL, gRPC). Под схемой две колонки общих комментариев: кто с кем говорит и что приходит
      обратно. Внизу золотая полоса: один сервер может ходить сразу в несколько систем, в каждую её способом,
      а агент этих способов не знает.'
    backup: 'Круг 5 правок владельца (issue 225, ZADANIE-KRUG-5.md, дословно): «добавь перед одностраничником
      по mcp слайд-схему где будет обозначена машина пользователя на ней агент, и дальше варианты — сервер
      на машине и он идет во внешнюю систему, сервер внешний и он идет во внешнюю систему. с какими-то
      общими комментариями как работает mcp. кстати покажи что он может идти сразу в разные протоколы
      — rest, grpc, graphql …». Номер временный — сквозную нумерацию проставляет сведение круга. Источник
      фактов. Спецификация MCP, страница «Architecture overview» (modelcontextprotocol.io/docs/learn/architecture,
      обращение 2026-10-07), дословно: «MCP server refers to the program that serves context data, regardless
      of where it runs. MCP servers can execute locally or remotely» — два места сервера названы самой
      спецификацией, это не иллюстративное допущение. Там же про единый разговор независимо от места:
      «The transport layer abstracts communication details from the protocol layer, enabling the same
      JSON-RPC 2.0 message format across all transport mechanisms». Там же про то, что протокол не описывает,
      чем сервер добывает данные: «MCP focuses solely on the protocol for context exchange», а инструменты
      определены как «Executable functions that AI applications can invoke to perform actions (e.g., file
      operations, API calls, database queries)» — отсюда законность четырёх знаков протокола на схеме:
      REST, SQL, GraphQL, gRPC названы как обычные способы, которыми спрашивают сами системы, а не как
      часть MCP. Подтверждение, что один и тот же сервер бывает в обоих местах: официальный сервер GitHub
      существует и удалённым (хостит GitHub, `https://api.githubcopilot.com/mcp/`), и локальным образом
      (`ghcr.io/github/github-mcp-server`) — README репозитория github/github-mcp-server, обращение 2026-10-07.
      Чего на слайде НЕТ намеренно — проверено построчно по n09, чтобы не дублировать одностраничник:
      имена транспортов (stdio/http), файл конфигурации и три области видимости, обнаружение возможностей
      (tools/list), формат полного имени инструмента, три статьи цены контекста, отдельный канал ответа
      и подпись вызова именем сервера. Единственное сознательное пересечение — одна строка про то, что
      локальный сервер поднимает среда при старте сессии: без неё схема не отвечает на «кто кого запускает»,
      прямо названное в задании круга. Рисовалка — rendered/make_figures_mcp.py, функция n08_gde_chto_stoit().
      Полотно 1600×760 px: на рабочей ширине слайда 12,23″ это 130,8 px/дюйм, самый мелкий текст схемы
      18 px = 9,9 pt при пороге деки 7,5 pt. Полотно 2400 px (как у n09) дало бы на том же тексте 6,6
      pt — ниже порога, поэтому ширина выбрана до первой отрисовки, а не после замера.'
