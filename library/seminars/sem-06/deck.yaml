- id: n58
  file: slides/n58-mekhanika-edinstvennyy-priyom-granitsa.md
  type: mechanics_map
  duration_min: 1.5
  assertion: Промежуток между ролями закрывает не координатор и не объединение в одну — его закрывает
    явная граница в описании каждой роли, в обе стороны; диф-ревьюер уже так делает, тестировщику нужна
    симметричная строка
  learning_goal: Единственный рабочий приём третьего кейса, показанный на двух реальных ролях сцены, не
    абстрактно. Граница делает промежуток видимым тому, кто читает оба описания рядом — не устраняет сам
    промежуток
  visual:
    pattern: mechanics_with_figure
    figure: subagent-n58-granitsa-dvukh-rolei.png
    primary: 'Схема: два прямоугольника зоны ответственности — диф-ревьюер (код) и тестировщик (поведение
      формы), каждый со своей строкой «НЕ для…». Между прямоугольниками — выделенная зона с подписью «промежуток,
      не поручен ни одной роли» (сценарий с пробелом перед доменом). Снизу подпись: граница делает промежуток
      видимым, не убирает его.'
    backup: 'Источник — section-2-subagent.md §A.3 «Механика» + section-2-subagent-part1c.md n62, дословно
      по содержанию. Фигура добавлена: абстрактное понятие «промежуток между границами» нагляднее как
      визуальный разрыв между двумя зонами, чем как два абзаца текста; аналог диаграммы n51.'
- id: n59
  file: slides/n59-kriterii-kogda-vtoraya-rol-opravdana.md
  type: criteria_boundary
  duration_min: 1.5
  assertion: Вторая роль оправдана, когда задача действительно параллелится — шаг одной роли не нуждается
