      только параметры рендера), `method.axes` (три оси, первая точка общая — один рендер, не три), `method.metrics`
      (пять метрик на точку), `method.boundary_rule` (три правила границы), `engines` (api — nvidia/nemotron-3.5-embed-1b:free,
      вектор 2048; clip — openai/clip-vit-base-patch32, вектор 512, локально), `timing` (по 630 вызовов
