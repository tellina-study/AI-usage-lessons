      (лимит участников, разбросанный по middleware / конфигу / миграциям / клиенту) — обычная ситуация
      любого продукта с тарифными планами; демо-репозиторий занятия для честной сцены на сорок файлов
      слишком мал, поэтому сцена идёт в рабочем продукте героя, и это сказано на экране первой же строкой.
      Цена пересчитана с часа на полчаса: пятнадцать минут объяснения, потраченные дважды, плюс возврат
      в прерванную работу — час при двадцатиминутном чтении читался натяжкой. ДЕНЬ НЕДЕЛИ НЕ НАЗВАН НАМЕРЕННО:
      открытие (n04) называет этот промах средой, и той же средой названа сцена первого кейса блока MCP
      (n10) — другой эпизод; третье вхождение слова закрепило бы путаницу.'
- id: n40
  file: slides/n40-vopros-chto-delat-s-etim-chteniem.md
  type: reflection_question
  duration_min: 0.75
  assertion: 'Править надо в четырёх местах, а чтобы их найти — открыть сорок файлов: зал выбирает карточку
    и называет вслух, за счёт чего она выигрывает'
  learning_goal: 'Вопрос классу без подсказки целевого ответа. Карточки называют варианты, не решение:
    чтение самому / вторая сессия / коллега / роль в своём контексте / правка по памяти. Круг 5 (issue
    225): карточка «вторая сессия» поставлена в набор вместо карточки «сохранить вопрос как скилл» — зал
    в любом случае называет этот вариант вслух, и место ему на слайде, а не в справке; скилл же отвечал
    на повторяемость, которой у разовой правки нет. Пересмотр по сторителлингу (issue 225, правило П1):
    зал просят назвать ПРИЧИНУ выбора вслух — почти наверняка прозвучит «быстрее», и поворот кейса на
    следующем слайде опровергает именно произнесённую залом версию, а не воображаемую. Разбор — на следующем
    слайде'
  visual:
    pattern: question_with_option_cards
    primary: Золотая коробка по центру с дословным вопросом, надзаголовок «· ВОПРОС», подпись «разбор
      — на следующем слайде». Пять карточек равной ширины внизу, ни одна не подсвечена.
    backup: 'Слайд круга 3 владельца (issue 225). Карточки сформулированы так, чтобы развести время чтения
      (не меняется ни одним вариантом) от места, где это чтение ложится, и от того, куда возвращается
      результат (меняются разными вариантами по-разному). Круг 5 (issue 225, ZADANIE-KRUG-5.md): состав
      карточек тронут один раз — «сохранить вопрос как скилл на будущее» заменена на «открыть вторую сессию
      и перенести список руками». Причина: владелец указал, что занятие не отвечает, почему герой не поднял
      вторую сессию; пока варианта не было на карточках, ответ на него жил только в справке, то есть для
      зала не существовал. Скилл при этом ничего не терял и ничего не решал в этой сцене: он отвечает
      на повторяемость, а правка тарифа разовая; приём не пропадает из занятия — он введён на прошлом
      и возвращается третьим кейсом этой ступени. Пересмотр по сторителлингу (PERESMOTR-STORITELLING.md,
      правило П1 «у каждого кейса свой поворот»): вопрос требует назвать основание выбора вслух, и справка
      велит записать прозвучавшее слово, а не спорить с ним.'
- id: n41
  file: slides/n41-razbor-bystree-ne-stalo-te-zhe-sorok-faylov.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: 'Произнесённая залом версия «быстрее» проверяется счётом и не подтверждается: роль открывает
    те же сорок файлов и читает их то же время — выигрывает она двумя другими вещами, освобождённым контекстом
    и тем, что список возвращается в ту же сессию, где лежит правка'
  learning_goal: 'Поворот кейса, предъявленный прямо: зал только что назвал основание своего выбора вслух,
    и слайд проверяет именно его. Разбор пяти карточек, форма А5 — две содержательные колонки. Круг 5
    (issue 225): строка «вторая сессия» отвечает на вопрос, который владелец назвал неотвеченным, — чем
    вторая сессия отличается от роли, если контекст у обеих свой. Концепт удерживается от переусложнения:
    два различия, время чтения против места, где оно ложится, и куда возвращается результат'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает / что не делает — ограничение.
      Порядок строк совпадает с порядком карточек вопроса. Вывод — отдельной строкой под таблицей: время
      чтения то же, меняются двое — чей контекст держит чтение и куда возвращается итог.'
    backup: 'Слайд круга 3 владельца (issue 225). Пять строк разбора написаны под сцену и вопрос этого
      кейса — прежний кейс о достоверности отчёта (журнал вызовов) снят целиком, см. section-2-subagent-otchet.md.
      Литературная правка: формат «не X, а Y» снят из всех видимых и речевых блоков слайда (правило деки,
      Часть Г ZADANIE-KRUG-2-VLADELTSA.md). Вторая прожарка (issue 225, P1-2): следующий по порядку слайд
      «что входит в контекст роли, что из него выходит» снят целиком — он дословно пересказывал контрактный
      факт, уже названный базой ступени (n37) и одностраничником (n38, блоки 3–4). Пересмотр по сторителлингу
      (issue 225, PERESMOTR-STORITELLING.md, правило П1): поворот стоит в ЗАГОЛОВКЕ и в первой фразе речи,
      не в выводе внизу. Круг 5 (issue 225, ZADANIE-KRUG-5.md): строка «скилл» заменена строкой «вторая
      сессия» вслед за карточками n40, и вывод под таблицей достроен — прежде он называл одно изменение
      («меняется, чьё окно их держит»), теперь два, потому что только второе отличает роль от второй сессии.
      Слово «окно» снято со слайда целиком (14 вхождений), заменено на «контекст».'
- id: n42
  file: slides/n42-svidetelstva-primer-est-izmereniy-net.md
  type: research_evidence
  duration_min: 0.75
  assertion: Дидактический пример из документации харнесса — роль прочитала 6100 токенов файлов, сессия
    получила итог в 420 токенов — показывает порядок экономии качественно; измерения по выборке реальных
    сессий нет ни у одного источника
  learning_goal: Число есть, но это иллюстрация одного сценария документации, не статистика. Честный пробел
    называется прямо и явно привязывается к уже названному в базе этой ступени — здесь он усиливается
    конкретным числом, остаётся тем же пробелом
  visual:
    pattern: mechanics_table
    primary: Короткая цитата дидактического примера крупным текстом с явной подписью «не измерение — пример
      из документации». Ниже — плашка честного пробела, привязанная к уже названному в базе ступени.
    backup: 'Источник — research/mechanics-6-subagent.md §2.2, дословно: «The subagent read 6,100 tokens
      of files. You got a 420-token result. That''s the context savings» (context-window.md, собственный
      учебный пример Anthropic, не измеренная статистика). Честный пробел — уже названный в базе этой
      ступени (n59 параллельной зоны): «числа для того, сколько контекста экономит субагент по сравнению
      с тем же объёмом работы в основной сессии, не нашлись ни в одном источнике». Круг 3 владельца (issue
      225): число новое для деки, используется впервые именно здесь. Круг 5 (issue 225, ZADANIE-KRUG-5.md,
      сквозное решение С1): слово «окно» снято со слайда целиком, заменено на «контекст»; «родитель» —
      на «сессию, которая позвала роль».'
- id: n43
  file: slides/n43-granitsa-chistyy-kontekst-ne-ot-vsego-podryad.md
  type: criteria_boundary
  duration_min: 0.75
  assertion: Контекст роли по умолчанию наследует описания всех подключённых серверов вызвавшей сессии
    целиком, даже тех, что для её задачи не нужны ни одним инструментом — фокус работает для содержимого
    репозитория, но не сам собой для того, что подключено серверами
  learning_goal: 'Граница применимости предыдущих двух слайдов: чистый контекст роли — не автоматически
    чистый по всем источникам. Прямая, дословная цитата документации об ошибках харнесса, без умствования.
    Мост к списку инструментов роли, который стоит пятым блоком на одностраничнике ступени. Круг 5 (issue
    225): третья полоса схемы базы ступени («описания подключённых серверов») предъявлена здесь ещё раз
    — теперь уже в контексте роли, и слайд опирается на неё, вместо того чтобы вводить мысль заново'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Короткий текстовый блок: дословная цитата про наследование инструментов серверов. Ниже —
      применение к сцене (трекер и сервер документации из прошлого раздела занятия попадают в контекст
      роли бесплатно, хотя к поиску не относятся). Нижняя строка — что с этим делать: тот же список инструментов
      роли, который стоит пятым блоком на одностраничнике ступени.'
    backup: 'Источник — research/mechanics-6-subagent.md §2.5, дословно из errors.md: «Subagents inherit
      every MCP tool definition from the parent session, which can fill their context window before the
      first turn. Disable MCP servers you are not using before spawning subagents.» Круг 3 владельца (issue
      225): новая граница, связывает блок MCP и блок субагента этого же занятия без повторения материала
      ни одного из них. Круг 5 (issue 225, ZADANIE-KRUG-5.md): слово «окно» снято со слайда целиком (10
      вхождений), «родитель» заменён на «сессию, которая позвала роль»; слайд опирается на верхний ярус
      схемы n37 (третья полоса, «описания подключённых серверов»), поэтому вводную часть речи удалось
      убрать, и слот ужат с 1,0 до 0,75 мин — это и есть компенсация за рост n37 с 1,25 до 2,0.'
- id: n44
  file: slides/n44-kriterii-chto-ostayotsya-v-kontekste-posle-otveta.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Делегировать чтение стоит, когда из него нужен короткий вывод — факт, да/нет, список в несколько
    строк, по которому дальше работают; если работать придётся со всем прочитанным объёмом, читать его
    придётся самому в любом случае
  learning_goal: 'Закрытие кейса: критерий «когда это работает, когда нет» + строка оси (интуиция/проверка),
    сведённая с тем, что зал произнёс вслух на голосовании. Прямая формулировка, без недосказанности —
    правило А7 круга 2 остаётся в силе. Пересмотр по сторителлингу (issue 225, правило П5): здесь же стоит
    единственный на всю ступень вопрос «к себе» — зал прикладывает критерий к собственному проекту. Круг
    5 (issue 225): критерий уточнён под новую сцену — граница проходит по тому, нужен ли дальше весь прочитанный
    объём или несколько мест из него, и именно это различие делает поиск делегируемым, а рефакторинг —
    нет'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Блок критерия двумя пунктами: когда делегировать чтение имеет смысл, когда нет. Ниже — строка
      оси толстой золотой планкой слева, без заливки: интуиция говорила / проверка показала. Последним
      блоком — короткий вопрос «к себе».'
    backup: 'Слайд круга 3 владельца (issue 225). Критерий и строка оси написаны под сцену и механику
      кейса; формат — тот же, что у закрывающих слайдов других кейсов ступени (критерий + строка оси одним
      слайдом). Литературная правка: формат «не X, а Y» снят из всех видимых и речевых блоков. Пересмотр
      по сторителлингу (PERESMOTR-STORITELLING.md): строка оси переписана под произнесённую залом догадку,
      добавлен блок «К себе» — правило П5, единственный такой вопрос в блоке субагента; форма разведена
      с двумя вопросами «к себе» блока MCP (n16 и n22): там зал пересчитывает своё текущее окружение,
      здесь — вспоминает задачу. Круг 5 (issue 225, ZADANIE-KRUG-5.md): слово «окно» снято со слайда целиком
      (10 вхождений). Критерий уточнён вслед за сценой: прежняя формулировка разводила «короткий вывод»
      и «работа продолжается на том же материале», и в новой сцене работа действительно продолжается —
      в четырёх файлах из сорока. Граница проведена там, где она и проходит: нужен ли дальше ВЕСЬ прочитанный
      объём. Строка оси достроена вторым изменением (куда возвращается итог) — тем самым, которым роль
      отличается от второй сессии.'
- id: n45
  file: slides/n45-divider-zadacha-prishla-odnoy-frazoy.md
  type: section_divider
  duration_min: 0.5
  assertion: Задача приходит одной фразой и одним сроком; средств ускорить её больше одного, и выбирает
    между ними сама задача
  learning_goal: 'Развилка кейса о раскладке и ускорении. Форма — вопрос, на который у зала уже есть наполовину
    верный ответ: ускорять будем, но средство придёт не оттуда, откуда его ждут. Смысловая строка обещает
    поворот и заранее говорит, что кейс — практика: задачу раскладывают вместе'
  visual:
    pattern: section_divider_macro
    primary: Тёмный Ocean-фон, заголовок-вопрос в одну-две строки, золотая линия под ним. Ниже — смысловая
      строка. Внизу — дорожка кейсов этой ступени, активная отметка — вторая.
    backup: 'Кейс заведён кругом 3 владельца (issue 225, ZADANIE-KRUG-3-SUBAGENT.md, кейс 2): параллелизм
      как причина заводить роль, а прежний кейс «вторая роль, границы путаются» — границей этого. Тег
      не ставится (правило А6). Круг 5 владельца (ZADANIE-KRUG-5.md): «5 тоже не понятный и не жизненный
      пример, лучше может как практику показать? и обсудить со студентами как декомпозировать и ускорять
      задачи? там не только субагенты же могут быть». Кейс перестал быть разбором чужой удачи (прежняя
      сцена четверга «три проверки разом») и стал практикой: задачу раскладывает зал. Заголовок развилки
      переписан с «Три правки, одна очередь. А если разом?» — прежний называл готовую раскладку (три независимые
      правки) ещё до того, как зал её сделал, и этим отнимал у практики её работу. Форма «вопрос» сохранена
      — она разведена с пятью остальными развилками занятия (n06 реплика, n19 строка-факт, n28 сцена,
      n36 цена, n55 парное утверждение) и своей не меняется. КАСКАД: ячейка карты n05 блока субагента,
      вторая («Задачи стоят в очереди, хотя друг от друга не зависят. Решаем.») расходится с этим заголовком
      — сведению переписать по тексту настоящего дивайдера, предложение в qa/krug5-subagent-keys2.md.'
- id: n46
  file: slides/n46-praktika-raskladyvaem-zadachu-vmeste.md
  type: cobuilding
  duration_min: 3.0
  assertion: Задача приходит одной фразой к понедельнику; зал раскладывает её на куски и по каждому отвечает,
    от чего он зависит, — и выходит, что независимых кусков три из шести, один стоит в очереди за другим,
    один лезет в чужой файл, один повторяется каждый раз
  learning_goal: 'Практика, два хода на одном экране. Ход 1 — зал называет куски задачи, лектор фиксирует
    шесть. Ход 2 — по каждому куску зал отвечает, от чего он зависит; здесь же зал просят назвать вслух
    догадку о числе исполнителей, которую через два экрана проверит разбор. Слот отдан залу: произносимая
    речь короткая намеренно, остальное время говорит зал'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Сверху — задача одной фразой в светлой карточке-реплике. Ниже таблица шести строк: два хода
      стоят заголовками колонок: ход 1 заполняет левую (куски, названные залом), ход 2 — правую (от чего
      зависит). Снизу — одна плашка со счётом: сколько кусков независимы.'
    backup: 'Круг 5 владельца (issue 225, ZADANIE-KRUG-5.md): «лучше может как практику показать? и обсудить
      со студентами как декомпозировать и ускорять задачи?». Прежняя сцена кейса (n46 «Четверг: три проверки
      разом, и это сработало») снята целиком: она была готовым разбором чужой удачи, в котором раскладка
      уже сделана за зал — три независимые правки предъявлялись как условие, а не как результат работы.
      Форма взята у со-сборки ступени MCP (n13/n14): два хода, экран заполняется репликами зала. Задача
      (лендинг с формой заявки, срок к понедельнику) взята из продукта самого занятия; состав кусков сверен
      с живым кодом демо-репозитория — src/validate.js (validateForm, карта MESSAGES), атрибут pattern
      в index.html (ARCHITECTURE.md §3, FIXES-PENDING 5-2). Числа времени не называются ни в одном куске:
      ни один источник этой ступени длительность таких работ не мерил. Слот 1,5 → 3,0: прибавка взята
      внутри кейса (n48 1,5 → 1,5 без роста, n49 0,75 → 0,5, n51 1,25 → 0,75, n52 1,5 → 1,25, n54 1,75
      → 1,25), сумма кейса не менялась — 11,75. Речь намеренно короче слота: разница и есть время зала.
      Сборка --block n4 показала переполнение (таблица 2,11″ при бюджете 1,95″, композиция до 7,78″ при
      полотне 7,50″) — шесть карточек хода 1 сняты с экрана: они дословно повторяли левую колонку таблицы,
      и после снятия экран встал в полотно без правки содержания.'
- id: n47
