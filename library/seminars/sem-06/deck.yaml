- id: n08
  file: slides/n08-baza-tri-primitiva-kto-initsiiruet.md
  type: base_and_edge
  duration_min: 0.75
  assertion: 'MCP (Model Context Protocol) — протокол, по которому агент подключается к внешней системе
    и получает три вида возможностей, различающихся тем, кто решает ими воспользоваться: модель, приложение
    или человек'
  learning_goal: База инструмента до первого кейса этого инструмента — три примитива протокола и кто ими
    распоряжается. Полный механизм (сервер, подключение, вызов, цена, ответ) и нейтральный владелец —
    на следующем слайде-одностраничнике, чтобы не дублировать содержание на двух экранах
  visual:
    pattern: base_and_edge
    primary: Две дорожки. Слева под пометкой «БАЗА» — определение одним предложением и таблица трёх примитивов
      с тем, кто инициирует каждый. Справа — практический вывод.
    backup: 'Источник — rework/section-1-mcp.md §A.1.3, §B.3 (part1c.md). Круг правок владельца (issue
      225, п.1 — «нет разбора mcp что это такое и как работает, описание mcp сервера»): слайд оставлен
      коротким намеренно — он вводит только словарь примитивов, разбор протокола/сервера целиком переехал
      на новый одностраничник n09 сразу следом, чтобы не ставить два разных по темпу объяснения подряд
      на одном экране. Нейтральный владелец (9 декабря 2025, Agentic AI Foundation) снят с видимого слоя
      как дубликат — факт остаётся в справке этого же слайда, его дата проверена фактчеком, VERIFIED (qa/fact-check-mcp.md
      §2.2 п.1). Область раздела — только подключение (§A.00): не авторство серверов, не протокол целиком,
      не сравнение реализаций.'
- id: n09
  file: slides/n09-mcp-tselikom-odnim-ekranom.md
  type: mechanics_map
  duration_min: 1.75
  assertion: 'MCP устроено из шести частей: где объявляется сервер, что это за программа и где она работает,
    что передаётся при подключении и при вызове, что из этого попадает в контекст и чего это стоит, и
    чем отвечает сервер'
  learning_goal: 'Одностраничник — опорный слайд блока, к которому возвращается весь кейс. Закрывает дословную
    просьбу владельца о разборе MCP и описании сервера (issue 225, п.1), отдельно от словаря примитивов,
    уже заданного базой на предыдущем слайде. Разворачивает понятия, которые иначе пришлось бы вводить
    по одному в каждом следующем разборе: обнаружение возможностей, полное имя инструмента, отложенную
    загрузку схем, канал ответа'
  visual:
    pattern: mechanics_with_figure
    figure: mcp-n09-mehanizm.png
    primary: 'Схема на весь слайд: шесть пронумерованных блоков, у каждого своя подложка, сетка — два
      столбца сверху, две полосы во всю ширину снизу. 1 — где объявляется: файл и область видимости, коротко,
      подробности — дальше в кейсе. 2 — что такое сервер и где работает: отдельная программа, локальный
      процесс или удалённый сервис, кто её запускает. 3 — что передаётся при подключении: клиент сам спрашивает
      список возможностей, без участия модели. 4 — что передаётся при вызове: имя с префиксом сервера
      и аргументы. 5 — что из этого попадает в контекст и чего это стоит: конвейер из трёх шагов, худший
      случай — ссылкой на отдельный слайд этого же кейса. 6 — чем отвечает сервер и что среда делает с
      ответом: отдельный канал результата, подпись именем сервера в выводе.'
    backup: 'Образец — n11 Семинара 5 (`sem-05/slides/n11-struktura-khuka-tselikom.md`, схема `khuki-n12-ustroystvo.png`):
      та же грамматика (шесть пронумерованных блоков со своей подложкой), состав блоков СВОЙ — механика
      MCP, не копия хука. Источник фактов — `sem-05/research/mechanics-5-mcp.md` §1.1/§1.4 (транспорты,
      кто физически запускает процесс), §2.1 (`tools/list`/`prompts/list`/`resources/list` — discovery-запросы
      отправляет клиент сам, не по требованию модели), §2.2 (полное имя `mcp__<сервер>__<инструмент>`),
      §2.3 (tool search, `ENABLE_TOOL_SEARCH`, имена и инструкции при старте, полная схема по требованию),
      §2.4 (вызов в выводе подписан именем сервера). Рисовалка — `rendered/make_figures_mcp.py`, функции
      `bhead`/`bpanel` + секция «n09» (issue 225, п.4). Новый слайд круга правок, временный номер — сквозную
      нумерацию проставит сшивка.'
- id: n10
  file: slides/n10-vopros-chto-proverit-do-podklyucheniya.md
  type: reflection_question
  duration_min: 1.0
  assertion: Агенту регулярно нужно смотреть открытые issue и готовить черновики правок; зал выбирает,
    каким способом дать ему доступ снаружи — и почему именно этим
  learning_goal: 'Открытый вопрос первого кейса, переставленный с «что проверить до подключения» на выбор
    между способами достать данные снаружи (владелец, issue 225, п.2 дословно). Карточки задают предметность:
    не абстрактная осторожность, а конкретный способ и его обоснование. Целевого ответа на слайде нет,
    разбор идёт следующим слайдом'
  visual:
    pattern: question_with_option_cards
    primary: 'Золотая рамка с вопросом: каким способом дать агенту доступ к трекеру — и почему. Под ней
      пять равных карточек в фиксированном порядке, ни одна не выделена. Ни цифр, ни источников на слайде.'
    backup: 'Источник — замечание владельца к кругу правок (issue 225, п.2 дословно): «кроме работы собственно
      mcp положим выбор — api, Mcp удаленный, свой mcp Сервер…». Три обязательных варианта из цитаты —
      api, удалённый MCP-сервер, свой сервер; два добавленных для полноты картины — локальный MCP-сервер
      (развести «готовый сервер» на «где физически работает», источник — mechanics-5-mcp.md §1.4) и разовая
      команда (унаследована из прежнего набора карточек этого слайда — там она уже стояла «не хватит ли
      обычной команды», источник §A.1.4 rework/section-1-mcp.md не меняется по содержанию, меняется форма).
      Прежние карточки про права/токены/звёзды/официальность сервера не потеряны: «права» и «токены» разбираются
      ниже по кейсу без изменений (со-сборка, цена в токенах), «официальность не гарантирует поведение»
      входит ограничением строки «удалённо» на следующем слайде. Разбор — на следующем слайде (§A.1.5
      переписан).'
- id: n11
  file: slides/n11-razbor-pyat-sposobov-dostupa.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: У каждого из пяти способов — случаи, где он работает, и ограничения; для регулярного доступа
    нескольких сессий к общему трекеру два способа отпадают сразу, а между оставшимися двумя законными
    — выбор, который кейс делает осознанно
  learning_goal: 'Разбор всех пяти карточек в форме А7: вариант · где работает — конкретные случаи · ограничения.
    Вывод объясняет, почему для ЭТОГО кейса выбирается именно локальный сервер, и прямо называет удалённый
    сервер вторым законным вариантом — владелец (issue 225, п.2): «положим выбор», разбор обязан показывать,
    почему выбирается то, что выбирается'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в три колонки: вариант · где он работает — конкретные случаи · ограничения.
      Порядок строк совпадает с порядком карточек вопроса. Под таблицей — вывод, какие способы отпадают
      и почему между двумя оставшимися выбор не формальность.'
    backup: 'Источник карточек — замечание владельца, см. backup слайда n10. Факт про смену транспорта
      официального примера GitHub (локальный npx → удалённый http api.githubcopilot.com/mcp/) — research/mechanics-5-mcp.md
      §1.6, дословно: «это не делает решение раздела курса неверным… но стоит явно проговорить на занятии
      как живой пример того, что официальный путь может со временем смениться». Ограничение строки «удалённо»
      (официальность не гарантирует поведение) — та же формулировка, что держала прежняя версия этого
      слайда, источник не менялся. Прежние карточки (права/токены/звёзды) не потеряны: права — со-сборка
      дальше по кейсу без изменений, цена в токенах — отдельный слайд дальше без изменений, «официальность»
      вошла ограничением строки 2 этой таблицы.'
- id: n12
  file: slides/n12-sobiraem-operatsii-i-prava.md
  type: cobuilding
  duration_min: 1.5
  assertion: 'Барьер проектируется в два хода: сначала список операций, которые агент должен уметь, потом
    вычёркивание прав широкого токена, которые этот список не требует'
  learning_goal: 'Со-сборка, часть 1 из двух: операции фиксируются первыми, потом по каждой строке списка
    прав широкого токена проверяется, нужна ли она. Вычёркивание происходит на экране, строка за строкой'
  visual:
    pattern: cobuilding_config_reveal
    primary: Два хода на одном экране. Ход 1 — список из трёх операций, зафиксированный репликами зала.
      Ход 2 — список прав широкого токена по умолчанию, и по каждой строке вычёркивание на экране, пока
      не останется одна учётная запись и две операции.
    backup: 'Источник — rework/section-1-mcp.md §A.1.6 (часть 1), §B.6 (part1c.md). Операции и права —
      rework/section-1-khuk.md-аналог не используется; список прав по умолчанию берётся из research/stage-5-mcp.md.
      Артефакт .mcp.json и вычёркнутый экран — дальше по кейсу. Круг правок (issue 225, замечания 3/5
      — читаемость): операции «Ход 1» были записаны голым текстом через «·» без обратных кавычек — разборщик
      не распознавал их как карточки и склеивал весь блок (вопрос Ход 1 + список операций + вопрос Ход
      2) в один жирный абзац без переносов, видимый в превью одной слитной репликой. Починка — операции
      обёрнуты в обратные кавычки (тот же синтаксис карточек, что на n09/n10): теперь Ход 1 и Ход 2 —
      два отдельных акцентных блока, между ними — три читаемые карточки операций, содержание не менялось
      ни на знак.'
- id: n13
  file: slides/n13-sobiraem-klyuch-i-oblast-vidimosti.md
  type: cobuilding
  duration_min: 1.25
  assertion: Ключ хранится в переменной окружения, не в файле; область видимости конфигурации — одна из
    трёх, и дефолт команды подключения кладёт сервер не туда, куда многие ожидают
  learning_goal: 'Со-сборка, часть 2 из двух: третий и четвёртый ход — где хранить ключ и в какую область
    положить файл конфигурации. Дефолт команды называется явно, чтобы снять типичную путаницу «у меня
    работает — у вас нет»'
  visual:
    pattern: cobuilding_config_reveal
    figure: mcp-n13-oblasti.png
    primary: Два хода на одном экране. Ход 3 — ключ в переменной окружения. Ход 4 — три области видимости
      конфигурации с пометкой, какая для чего и какая — дефолт команды подключения.
    backup: 'Источник — rework/section-1-mcp.md §A.1.6 (часть 2), §B.7 (part1c.md). Порядок приоритета
      областей и физические файлы — переносится на следующий слайд вместе с артефактом .mcp.json. Визуальная
      сессия (issue 225): таблица «Область · Когда уместна» заменена слоёной схемой (rendered/make_figures_mcp.py)
      — три области видимости в стопке карточек, дефолт local отмечен золотом, замыкающая оговорка про
      расхождение «у меня работает» перенесена в схему целиком. Markdown-тело Visual оставлено пустым
      по тому же соглашению, что у n43/n54/n62: визуальный контент живёт в схеме.'
- id: n14
  file: slides/n14-artefakt-mcp-json-tri-oblasti.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Итог разговора — четыре строки в файле: чем запускается сервер, что запускается, откуда
    берётся ключ, и — вне файла — какие права у этого ключа'
  learning_goal: Артефакт решения двух со-сборок. Разобран по строкам, с механикой трёх областей конфигурации
    и порядком приоритета. Честно назван как целевое решение, не подтверждённое коммитом
  visual:
    pattern: code_artifact
    figure: mcp-n14-prioritet.png
    primary: Код файла .mcp.json на светлом поле, четыре строки существа отмечены подписями. Ниже — схема
      приоритета при конфликте имён (шесть ступеней, местоположение файла — на каждой).
    backup: 'Источник — rework/section-1-mcp.md §A.1.7, §B.8 (part1c.md). Честный пробел — это целевое
      решение раздела, снятое с более раннего захвата демо-репозитория; коммита с ним в текущей ветке
      demo-проекта нет, и в репозитории курса такого файла тоже нет (§A.00, назван один раз на весь блок).
      Бюджет круга правок (issue 225): 1.5→1.25 мин — «где объявляется» (файл, команда, ключ) уже предъявлено
      блоком 1 одностраничника n09, здесь это повтор с меньшим темпом объяснения, не первое знакомство;
      содержание и схема приоритета не менялись. Визуальная сессия (issue 225): таблица «Область · Физически
      · Приоритет» (3 строки) заменена вертикальной лестницей приоритета (rendered/make_figures_mcp.py)
      — все шесть ступеней из заметки докладчика (личная → проектная → общая личная → плагин → коннектор
      → политика организации), не только три из таблицы; физический файл подписан на каждой ступени.'
- id: n15
  file: slides/n15-tsena-v-tokenah-verhnyaya-granitsa.md
  type: mechanics_map
  duration_min: 0.75
  assertion: Цена подключения в токенах — это утверждение о режиме без отложенной загрузки; худший случай
    даёт верхнюю границу, не гарантированную цену каждого подключения
  learning_goal: 'Механика цены: что реально попадает в контекст при старте сессии, от чего зависит отложенная
    загрузка схем инструментов, и где проходит верхняя граница худшего случая. Кандидат на компрессию
    при нехватке времени'
  visual:
    pattern: mechanics_table
    figure: mcp-n15-dolya-okna.png
    primary: Доля окна показана как пропорция (закрашенная полоса 21% от 200К), не перечислена числом
      в таблице; рядом — сравнение 1 365 против 44 026 токенов тем же приёмом (два бруска, подписанные
      абсолютными числами, с 32-кратной разницей золотом).
    backup: 'Источник — rework/section-1-mcp.md §A.1.8, §B.9 (part1c.md). Доля окна 21% добавлена при
      сшивке (qa/chetvyortaya-stena-otchet.md п.4, source getunblocked.com) — тот же источник и сценарий,
      без пересчёта. Второй, другой по методике замер (zhang-liz, 13,1%) существует и не приведён на видимый
      слой — расхождение объяснено разным составом серверов в замере, не ошибкой переноса. Фактчек: VERIFIED
      по ENABLE_TOOL_SEARCH (qa/fact-check-mcp.md §2.2 п.10). Визуальная сессия (issue 225): таблица из
      двух строк заменена схемой (rendered/ make_figures_mcp.py) — доля окна нарисована пропорцией (закрашенная
      полоса на шкале 0..200К), а не названа числом в ячейке; сравнение 1 365/44 026 — двумя брусками
      на общем масштабе, а не парой цифр в строке. Замыкающая оговорка про ENABLE_TOOL_SEARCH остаётся
      текстовым блоком под схемой — это проверочная команда, не часть пропорции.'
- id: n16
  file: slides/n16-proval-ekfiltratsiya-i-dns-rebinding.md
  type: failure_vignette
  duration_min: 2.75
  assertion: 'Три возможности вместе делают утечку возможной без единой строчки кода эксплойта: доступ
    к приватным данным, обработка недоверенного внешнего контента, канал наружу; без хотя бы одной атака
    этого типа невозможна в принципе'
  learning_goal: 'Провал возвращается к экрану со-сборки: строка «все репозитории, включая приватные»,
    которую только что вычеркнули, — ровно та, без которой сценарий не проходит. Два слоя: с моделью в
    контуре и без неё вовсе'
  visual:
    pattern: failure_vignette_table
    primary: 'Над таблицей — одна строка связи с экраном со-сборки. Таблица двух слоёв: что произошло
      · база сравнения. Под ней — отдельная плашка с определением «смертельного трио».'
    backup: 'Источник — rework/section-1-mcp.md §A.1.9, §B.10 (part1c.md). Перенесено из sem-05/rework/section-3-mcp.md
      без изменения содержания — фактчек qa/fact-check-mcp.md §1 и §2.2 п.2–3: Invariant Labs (май 2025)
      и Willison «смертельное трио» (16.06.2025) — VERIFIED. CVE-2026-61742 (DBHub, CVSS 9.3) — унаследовано
      из fact-check-round1.md Семинара 5, не перепроверялось повторно. Оговорка про Strix.ai как вторичный
      разбор числа «2 запроса» держится в самом тексте слоя 2.'
- id: n17
  file: slides/n17-kogda-hvataet-komandy-a-kogda-nuzhen-server.md
  type: criteria_boundary
  duration_min: 0.75
  assertion: Сервер ещё рано подключать, если доступ разовый или редкий и снимка данных достаточно; подключать
    не нужно вообще, если задача сводится к известному вызову команды — цена в токенах от доверия к серверу
    не исчезнет
  learning_goal: 'Обобщение кейса: два разных по природе предела, не одна общая рамка. «Ещё рано» ждёт
    сигнала и может перестать быть верным; «не нужно вообще» — структурное свойство задачи. Естественный
    переход к следующему кейсу, не декларация оси'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки: «ещё рано» и «не нужно вообще», каждая с перечнем условий. Под таблицей
      — переходная строка к следующему кейсу без разворота в декларацию синтеза.'
    backup: 'Источник — rework/section-1-mcp.md §A.1.10, §B.11 (part1c.md). Заголовок — дословно из плана
      (пункты 16/18 сверки: свой заголовок на каждый предел, не общая рамка). Раздел не несёт отдельного
      слайда синтеза «предотвращаем/решаем» — он живёт в блоке промежуточной оси (вне зоны этого файла).'
- id: n18
  file: slides/n18-chto-delat-kogda-server-podklyuchen-a-raboty-net.md
  type: section_divider
  duration_min: 0.5
  assertion: Сервер подключён правильно, права вычеркнуты, ключ в переменной окружения — и всё равно работы
    от него нет, а статус продолжает гореть зелёным
  learning_goal: 'Развилка второго кейса. Начинается с состояния, в котором никто не ошибся: сборка из
    первого кейса была честной. Ломается другое — разница между «процесс поднялся» и «агент получил то,
    что просил»'
  visual:
    pattern: section_divider_macro
    tag: 5 статусов подключения · 2 слоя провала
    primary: Тёмный Ocean-фон, заголовок в две строки, золотая линия под ним. Ниже — смысловая строка,
      затем тег. Внизу — дорожка кейсов блока.
    backup: Источник — rework/section-1-mcp.md §A.2.1, §B.12 (part1c.md). Второй кейс написан заново на
      доказательной базе research/mechanics-5-mcp.md. Тег считает строки таблицы статусов подключения
      (§A.2.5) и слои провала (§A.2.7).
- id: n19
  file: slides/n19-stsena-zelenyy-status-nulevoy-rezultat.md
  type: problem_scenario
  duration_min: 1.0
  assertion: 'Сервер стоит две недели, агент отвечает, что всё сделал, в репозитории — ни одного черновика,
    а статус показывает ровно то же, что и всю неделю: подключён'
  learning_goal: Завязка второго кейса. У нас на руках ровно два факта — отчёт о выполнении и отсутствие
    результата — и зелёный статус между ними. Решения на слайде нет
  visual:
    pattern: problem_scenario
    primary: 'Сверху — подводка о сервере, который стоит две недели. Ниже — три факта одной сцены: просьба,
      ответ агента, пустой репозиторий. Статус подключения вынесен отдельной строкой.'
    backup: Источник — rework/section-1-mcp.md §A.2.2, §B.13 (part1c.md). Сырьё — research/mechanics-5-mcp.md
      §3–4.
- id: n20
  file: slides/n20-vopros-chto-proverit-pri-zelenom-statuse.md
  type: reflection_question
  duration_min: 1.5
  assertion: Сервер стоит две недели, агент отчитался о выполнении, в репозитории пусто, статус тот же;
    зал выбирает, что проверить дальше
  learning_goal: Открытый вопрос второго кейса. Пять решений, все законные, ни одно не выделено. Разбор
    идёт следующим слайдом вплотную
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — подводка в одну строку, повтор сцены предыдущего слайда без цифр и
      деталей: сервер стоит, агент отчитался, в репозитории пусто. Ниже — вопрос в золотой рамке. Под
      ней пять равных карточек, ни одна не выделена.'
    backup: 'Источник — rework/section-1-mcp.md §A.2.3, §B.14 (part1c.md). Карточки — пять настоящих вариантов,
      текст не менялся; разбор каждого на следующем слайде, порядок строк n21 совпадает с порядком карточек
      здесь — не менять. Круг правок владельца (issue #225, п.3/5): владелец назвал вопрос недостаточно
      подробным для чтения без устного пояснения. Добавлена подводка-повтор сцены отдельной тихой формой
      перед золотой рамкой вопроса — приём, уже используемый в деке (n38, n49) для той же цели: вопрос
      читается сам по себе, не требуя памяти о предыдущем слайде. Текст карточек не менялся.'
- id: n21
  file: slides/n21-razbor-status-suzhaet-no-ne-dokazyvaet.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: Подробный статус — обязательный первый шаг, но он лишь сужает область поиска; работу доказывает
