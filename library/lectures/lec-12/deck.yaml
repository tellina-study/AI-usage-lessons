    type: hero_cover
    duration_min: 1
    assertion: "AI поднимается по шкале автономии A0→A3; цифровой двойник — единственный известный мост между ступенями."
    learning_goal: "Hero hook + foreshadow keystone (физика ↔ AI bridge)"
    failure_bucket: out

