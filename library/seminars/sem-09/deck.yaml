      стенд-испытан в этом виде», не оставлена пустой без объяснения (С6).

      '
    backup: 'Текст разбора сведён из SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Разбор», и уложен
      в форму без переписывания по сути.

      ИМЕНОВАННЫЙ OVERRIDE (§8.3 канона). Issue #274 (Семинар 8) решил не класть собственные числа стенда
      на этот кадр, чтобы не лишать такты n37-n42 того, что они вскрывают. Это решение остаётся в силе
      для строк 1-3: их «Недостатки» и теперь их «Числа» несут ТОЛЬКО внешние цитаты (Huang, Zheng) или
      явную пометку «не стенд-испытан» — код как единственный из первых трёх, что реально прогнан на нашем
      стенде, получает в «Числа» итоговую сводку (100%/20, 1,0 вызов/вопрос), которая и так полностью
      раскрыта на n39/n40 позже, то есть ничего не крадёт у тактов разбора. Для строки 4 (смесь экспертов)
      ситуация другая: владелец прямо попросил числовой столбец ИМЕННО на этом кадре («не хватает отдельного
      столбца на 4-м слайде с числами», 2026-10-29) — у смеси экспертов в этой деке нет отдельного такта
      разбора по группам, весь её числовой итог живёт здесь и на n40 (строка цены). Это НЕ восстановление
      старого 3-колоночного формата (issue #274 было про ДРУГОЙ вопрос — вердикты «верно/неверно» на этом
      кадре, а не числа вообще), и не тихое нарушение: названо прямо, а не выполнено молча.

      ЧИСЛА СТРОКИ 4 — `stend/zamery-k3-smes/README.md`, раздел «Терпимая проверка → обновлённые правки
      деки» (АКТУАЛЬНАЯ, не превышенная буквальная версия — та таблица снята, не удалена, см. файл). 20/20
      — доля формально верных ОТВЕТОВ РЕШАТЕЛЯ после починки проверки на русскую морфологию (число словами,
      склонённый контакт); 4,0 вызова/вопрос и $0,0042/20 вопросов не зависят от починки проверки (вызовы
      и цена не пересчитываются грейдингом); 50% (12 вопросов) — устойчивость выбора решателя к перестановке
      букв, из `raw/permutatsiya-8.json`, и ГРЕЙДИНГ НА ЭТО ЧИСЛО НЕ ВЛИЯЕТ (считается по тождеству выбранного
      эксперта, не по формальной верности).

      ЧИСЛА, ОСТАВШИЕСЯ НА КАДРЕ В «НЕДОСТАТКАХ», И ИХ ИСТОЧНИКИ, все внешние, все из CHISLA-SVERENO.md:
      95,5 → 91,5 → 89,0 — строка 11 (Huang и соавторы, arXiv:2310.01798, статус «сверено ранее оркестратором,
      как есть»); «в 94% случаев отзыв — всё выглядит хорошо» — строка 12 (arXiv:2303.17651, статус СВЕРЕНО,
      цитата найдена дословно); 65,0% · 46,2% · 23,8% · 75,0% — строка 13 (Zheng и соавторы, arXiv:2306.05685,
      статус СВЕРЕНО, все числа найдены построчно).

      ЧЕГО ВЗЯТЬ НЕ УДАЛОСЬ, названо прямо, а не заменено похожим: сетка в третьей строке даёт «+11 процентных
      пунктов на задаче с надёжным тестом, −3 на задаче с ненадёжным, доля ложноположительных тестов 1,4%
      против 16,3%». Этих чисел нет в CHISLA-SVERENO.md ни одной строкой, а брать их из `research/*` запрещено
      (БРИФ §2). Недостаток третьей строки поэтому сформулирован без числа — через свойство критерия,
      которое кейс дальше и измеряет сам. Вынесено оркестратору отчётом.

      Имена авторов на видимом слое стоят латиницей — так же, как `Kamath` и `Obermeyer` на n08 и n17:
      правило курса требует ссылок на работы и авторов на самом кадре. В заметках те же имена записаны
      по-русски.

      РАБОЧИХ ЯРЛЫКОВ ЗАМЕРА (A/B/C, S1, prc) НА КАДРЕ НЕТ: эксперты названы по роли («три маленькие модели»,
      «решатель»), не буквами из `zamery-k3-smes/README.md`.'
- id: n33
  file: slides/n33-k3-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Проверка перед отправкой — это круг с тремя обязательными частями: кто пишет, кто решает
    и что происходит, когда круг не сошёлся'
  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента. Названы обе части, которые чаще всего забывают: потолок попыток и ветвь
    «не сошлось».'
  visual:
    pattern: mechanism_node_graph
    figure: k3-shema-tsikl.png
    primary: 'Схема в два ряда, ДВЕ последовательные развилки одной формы (перерисовано 2026-10-29, правка
      владельца): «Сошлось?» — да направо в «Отправка клиенту», нет вниз в «Потолок исчерпан?» — да направо
      в «Передать Ольге», нет налево в «Переделку», которая возвращается в генератор. Отдельной плашкой
      — потолок в три попытки. Палитра Ocean, кегль не ниже 7,5 pt.

      '
    backup: 'Устройство круга — по SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Решение», слой 1, и
      по `stend/zamery-k1-k3/README.md` (сценарий с кодовой проверкой: генератор, проверяющий, развилка,
      до трёх попыток, явная ветвь «не сошлось»).

      ПЕРЕРИСОВАНО 2026-10-29 (issue #303). Владелец прочитал прежнюю версию (одна Т-образная перемычка
      на обе развилки) как «матрицу», не цепочку: «передать Ольге отправку клиента, она внизу, такая матрица
      получилась... давай замкнуть цепочку: сошлось — да, вправо, отправка клиенту; сошлось — нет, вниз,
