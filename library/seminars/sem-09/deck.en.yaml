      knowledge base reach the threshold".

      '
    backup: 'THE NUMBERS AND THEIR SOURCE. 0.107x and 1.25x (a write) are from `stend/zamery-k2-kesh/README.md`,
      Table 3: the same prompt at 3793-3794 tokens, `anthropic/claude-haiku-5.5`, a direct read at $0.00037940
      against a cache read at $0.00004045 -- a ratio of 0.107, a 9.4x difference. A write (a cold call)
      is $0.00047342, a ratio of 1.248.

      BY PROVIDER (Table 1): caching metrics are returned by Anthropic (with an explicit breakpoint),
      Gemini, and OpenAI -- all three show a read ratio from 0.1x to 0.25x. DeepSeek and Qwen, through
      this broker (DeepInfra, Phala), don''t return cache metrics at all -- `cached` = 0 on every call
      for both models; this isn''t a measurement error, it''s an honest fact about the broker: DeepSeek''s
      own automatic caching lives on its native API, and it isn''t exposed through DeepInfra (`README.md`,
