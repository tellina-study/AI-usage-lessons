- id: n41
  file: slides/n41-k3-obobshchenie.md
  type: answer_breakdown_table
  duration_min: 1.0
  assertion: 'Класс задачи: перепроверка ответа самой моделью без внешнего критерия правильности — с высокой
    вероятностью ухудшение; код надёжнее судьи ровно до той степени, до какой надёжен сам критерий'
  learning_goal: 'Обобщение кейса — переносимая формулировка без имени инструмента. Второе утверждение
    обязательно стоит рядом с первым: без него кейс читается как «код всегда прав», чего собственный замер
    не показал.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Две плашки-утверждения одна под другой, каждая полной фразой; под ними строка класса задачи,
      выделенная золотым, и короткая строка про то, что из этого следует для сборки процесса.

      '
    backup: 'Обе формулировки — по SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Обобщение», переносимые,
      без имени оркестратора и без имён узлов.

      Второе утверждение («код надёжнее ровно до той степени, до какой надёжен сам критерий») стоит здесь
      не как смягчение, а как обязательная половина вывода: собственный замер дал коду один ложный отказ
      из шести, и обобщение, которое этого не упоминает, расходится с собственным же измерением кейса.

      Отдельной строкой названо то, что из вывода следует для сборки: проверяющего проверяют тем же вниманием,
      что и генератора. Это и есть переносимая часть — она не зависит ни от инструмента, ни от модели.

      Числа на этом кадре не повторяются: они предъявлены тактами n37, n38, n39 и n40, а обобщение, пересказывающее
      числа, съедает место, на котором должна стоять формулировка.'
- id: n42
  file: slides/n42-k3-nyuansy-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.0
  assertion: Проверка кодом ставится там, где критерий можно записать и прочитать; там, где критерия нет,
    не строится ни код, ни надёжный судья — и это известно до сборки
  learning_goal: 'Нюансы и граница Кейса 3 прямой формой (А7): «когда нужно · когда не нужно», с названным
    пределом самого приёма — хрупкостью подстрочной проверки к падежу, измеренной на собственном стенде.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три пронумерованные плашки нюансов, под ними таблица в два столбца «когда нужно · когда
      не нужно» — строго под противопоставление, — и закрывающая плашка предела приёма с собственным измерением.

      '
    backup: 'Нюансы — по SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Нюансы», все три.

      Нюанс 1 держится внешними числами из CHISLA-SVERENO.md: строка 12 (arXiv:2303.17651, статус СВЕРЕНО
      — пять значений по шагам переделки найдены дословно) и строка 11 (Huang и соавторы, arXiv:2310.01798).
      Прирост первого шага 2,05 пункта и четвёртого 0,45 посчитаны из этих пяти значений и названы на
      кадре приростами, а не самостоятельными измерениями. Формулировку сетки «с эталоном кривая затухает»
      я сузил до того, что подтверждено сверкой: там, где прирост есть, он быстро затухает; там, где критерия
      правильности нет вовсе, кривая идёт вниз. Утверждать, что первое измерение проводилось именно с
      внешним эталоном, по CHISLA-SVERENO.md нельзя. Вынесено оркестратору отчётом.

      Нюанс 2 — свойство встроенного цикла: счётчик попыток ставится вручную. Номер шаблона и имя выражения
      на кадр не вынесены (CHISLA-SVERENO.md, строка 15, статус «не перепроверено в этом заходе»): на
      кадре стоит механика, которая от номера шаблона не зависит.

      ОБЯЗАТЕЛЬНАЯ ОГОВОРКА СЕТКИ СТОИТ ЗАКРЫВАЮЩЕЙ ПЛАШКОЙ, не сноской: хрупкость точного совпадения
      подстроки к падежу, 1 случай из 6 (`stend/zamery-k1-k3/README.md`, разбор «не сошлось» и пункты
      2 и 6 раздела «Что не подтвердилось»). Вместе с ней — обе честные половины оттуда же: тот же вопрос
      в сборке без круга получил ответ в нужном падеже и проверку прошёл, то есть это разброс выборки,
      а не различие сборок; и сама эта проверка написана автором замера, а не взята образцом, — аккуратнее
      написанный критерий этой слабости не имел бы.

      ОБНОВЛЕНО 2026-10-26: именно этот конкретный случай починен и перемерен — `code_check_node()` получил
      regex-ветку для kb5, толерантную к падежу, перемер дал 6 из 6 (execution 829–834, `README.md` §
      «Починка 2026-10-26»). Это не отменяет вывод плашки: проверка ловит форму, не смысл, — починка устранила
      один измеренный случай проявления этого свойства, а не свойство целиком. Остальные пять ключевых
      слов регулярки не получили — их падежный риск не измерен и не исключён.

      Граница — прямой формой, двумя колонками. Правая колонка опирается на измеренное этим же кейсом
      (цена в вызовах, ложные отказы), а не на общие слова про применимость.'
