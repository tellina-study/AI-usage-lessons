      ниже — два разбора дословными цитатами тех ошибок, что порог пропустил.

      '
    backup: 'Числа — `stend/zamery-k1-k3/README.md`, Замер 3 (исполнения 840-854), построенный и измеренный
      `build_case1_confidence.py` на живом стенде, webhook `s9-answer-confidence`. Грейдинг — по тому
