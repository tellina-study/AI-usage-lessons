      взяты из part2b.md §B.1 дословно. Четвёртая, цена техподдержки, выведена из механики цепочки ступени
      1 (шаг draft берёт контекст из базы знаний ПО МЕТКЕ — слайд механики цепочки, ступень 1): неверная
