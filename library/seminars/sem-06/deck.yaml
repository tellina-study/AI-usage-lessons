# Доступ наружу и урезанная роль
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n05    5.75 мин
#   MCP        n06–n34   38.25 мин
#   Субагент   n35–n64   35.00 мин
#   Сборка     n65–n68    6.00 мин
#   ИТОГО                  85.00 мин при слоте ?

deck:
  title: Доступ наружу и урезанная роль
  duration_min: 85.0
  central_question: 'Где заканчивается этот контекст — и что вы заводите первым: доступ наружу или отдельного
    исполнителя с урезанными правами?'
  slide_count: 68
  axis: Две строки оси закрыты — хук и скилл, у каждой названо, что она делает и чего не делает; MCP и
    субагент остаются пустыми — сегодня закрываются обе
slides:
- id: n01
  file: slides/n01-oblozhka-vopros-zanyatiya.md
  type: hero_cover
  duration_min: 0.75
  assertion: 'Агент упирается в границы собственного контекста: часть работы требует данных снаружи, часть
    — отдельного исполнителя с урезанными правами; занятие разбирает оба расширения и их цену'
  learning_goal: 'Открытие одним центральным вопросом, без разгона и без оглавления. Занятие продолжает
    предыдущее, не начинается заново: вопрос держится на состоянии, которое зал увидит на следующем слайде,
    а не на памяти о прошлом занятии'
  visual:
    pattern: hero_cover
    figure: ramka-n01-hero-sem06.png
    primary: 'Тёмный Ocean-фон, тот же приём, что у обложки прошлого занятия. Крупный заголовок, под ним
      одна ведущая строка тихой формой реплики, затем вопрос занятия в золотой коробке. Нижняя треть во
      всю ширину — hero-схема (≥40% площади слайда): слева пунктирная карточка «контекст агента» с двумя
      строками внутри — «репозиторий» и «разговор с вами» — и подписью снизу «дальше агент не видит ничего»;
      от неё две стрелки к двум белым карточкам справа: «данные снаружи — MCP» и «своя роль, урезанные
      права — субагент». Под этой парой — ряд из четырёх сегментов: первые два (хук, скилл) залиты приглушённым
      серым с подписью «закрыты в прошлый раз», следующие два (MCP, субагент) залиты gold с подписью «решаем
      сегодня».

      '
    backup: 'Схема рисуется программно (тот же рендерер фигур, что строил иллюстрацию прошлого занятия;
      конкретный скрипт и путь к файлу назначает сессия сборки деки) — не фотография и не скриншот. Это
      законный путь для hero-иллюстрации: схема, нарисованная кодом, не выдаёт себя за внешний источник
      и ничего не подделывает, в отличие от стилизованной карточки с подписью вместо настоящего изображения.
      Четыре сегмента нижнего ряда — это ось занятия (см. n03/n65), не отдельная придумка: тот же порядок
      строк, что на вопросе и на карте. Фотографий и внешних изображений для обложки не использовано и
      не искалось — по решению автора блока: вопрос занятия ссылается только на устройство самого занятия
      (контекст агента и то, чем он расширяется), а не на внешний сюжет, который фотография могла бы изображать.

      Круг правок владельца (issue 225, §А2): прежняя иллюстрация («сообщение» против «факта», с пунктирной
      стрелкой и незалитой галочкой) снята целиком вместе с вопросом, который она держала — «агенты к
      достоверности никакого отношения не имеют вообще, это про другое: про интеграцию, про выделение
      подзадачи, ограничение контекста». Новая схема рисует именно это: где у контекста агента кончается
      край и чем его раздвигают. Ряд оси сокращён с пяти сегментов до четырёх (§А1): процесс со схемы
      снят целиком, не оставлен пунктирным — лестница занятия теперь хук · скилл · MCP · субагент.'
- id: n02
  file: slides/n02-gde-my-ostanovilis.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Четыре вещи уже есть в репозитории: хук подтверждён коммитом, скилл остаётся только планом,
    файл инструкций вырос, документационный слой с решениями на месте — с этого состояния продолжается
    занятие'
  learning_goal: 'Состояние репозитория, прочитанное с экрана, а не восстановленное по памяти о прошлом
    занятии: что уже подтверждено коммитом, что только запланировано, и где проходит честная граница между
    этими двумя'
  visual:
    pattern: state_cards
    primary: 'Ведущая строка про то, с какой точки занятие продолжается. Под ней — светлая таблица-коробка
      на четыре строки, не тёмный терминал: «хук» (коммит есть), «скилл» (только план, коммита нет), «CLAUDE.md»
      (строк и разделов стало больше), «DECISIONS.md» (документационный слой, без изменений). Внизу подписью
      во всю ширину — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.2, проверено прямым чтением дерева (`ARCHITECTURE.md`
      §3): `.claude/settings.json` и `.claude/hooks/selftest-branch-guard.sh` подтверждены коммитом `9803643`;
      `.claude/skills/deploy/SKILL.md` существует только в плане раздела скилла, коммита у него нет; `CLAUDE.md`
      подрос с 24 строк / 4 разделов до 40 строк / 5 разделов — подтверждено коммитом; `DECISIONS.md`
      — часть документационного слоя репозитория с Семинара 4 (`sem-05/ARCHITECTURE.md` §2), в прошлое
      занятие не менялся и здесь показан без изменений — то, что уже заведено, не теряется между занятиями.
      Круг правок владельца (issue 225, §А2 карты): прежняя форма слайда — моноширинный листинг двух версий
      репозитория одна под другой в тёмном код-блоке — заменена на светлую таблицу; упоминание о том,
      что хук и CLAUDE.md лежат отдельно от того, что увидит любой, кто просто клонирует репозиторий,
      — снято со слайда целиком, это внутренняя деталь git-истории, а не состояние, которое читает инженер,
      открывший проект. Таблица показывает четыре вещи как они есть сейчас, без пояснения, где именно
      в истории репозитория каждая лежит.

      Ревизия (issue 225, круг 2, сверка слайда с разделом): исходная форма «карточек» — отдельные блоки
      `**Название**` + путь + статус, разделённые пустой строкой — не распознаётся разборщиком `slide_parts.py`
      как отдельные карточки (формат `cards` там — ОДНА строка, пункты через «·» с обратными кавычками,
      не абзацы через пустую строку); такой текст схлопывался в один слитный жирный абзац без переносов,
      что прямо противоречило описанию «четыре отдельные карточки» в этом же `backup`. Заменено на таблицу
      («Ступень» / «Путь или артефакт» / «Статус») — ту же форму, что уже рендерится корректно на `n03`/`n65`
      этого занятия; факты не изменились.'
