      and N candidate excerpts..."

      '
    backup: 'Source of the frame: `stend/n8n-screenshots-raw/case3-reranker- panel.png` (an HTTP Request
      node → chat/completions, Body field → JSON), captured by `stend/n8n_shots.py` in the EXPANDED view.
      Crop — `rendered/compose_case3_n8n_shots.py`: the upper Method/URL/ Authentication/Credential Type
      fields are NOT taken into the frame — this same HTTP Request node, pointed at the same OpenRouter
      credential, was already shown once and named in text on the panels of Case 1 (n16/n17/n18); a repeat
      breakdown would add nothing new, just the same thing again. The single substantive piece taken is
      "Specify Body: Using JSON" → the JSON field, where the MODEL''S NAME and the start of the system
      prompt are visible.

      FULL TEXT OF THE SYSTEM PROMPT (not fully visible on the frame, clipped by panel height; verbatim
      in the original — `stend/measure/case3_rerank_measure.py::rerank_llm`): "You are a search-result
      reranker. You are given a question and {N} candidate excerpts, numbered 1..{N}. Reorder the candidate
      numbers from most relevant to the question to least relevant. Reply with STRICTLY a JSON array of
      numbers — a permutation of all the numbers, with no explanations. Example answer: [3,1,4,2,5,6,7,8,9,10]"
      — with N=10 (the merge node''s TOP_N, n54). The user message — "Question: {question}\n\nCandidates:\n{numbered
      list of texts}". TRANSLATOR''S FLAG: the real stend run actually sent this prompt to gpt-4o-mini
      in RUSSIAN, not in this English rendering — the glossary note on this point (glossary.en.yaml "notes"
      list) says to translate quoted prompt content like any other text but flag that the real run used
      Russian; this note is that flag, the English above is the natural EN equivalent for the slide, not
      a claim about what was actually transmitted to the model.

      THE MODEL IS NAMED EXPLICITLY (C5): `openai/gpt-4o-mini` — visible right in the JSON body on the
      frame, with no call settings beyond the required ones (no explicit temperature). THE COST OF THE
      STEP, COMPUTED (not an abstract percentage): ~$0.00033 per call — more expensive than the entire
      keyword/vector search-and-answer pipeline of Case 1 (~$0.00005) — stend/raw/case3-rerank-results.json,
      n51.

      BRIDGE TO n57: the prompt asks the model to return a STRICT permutation of the numbers — it neither
      adds nor removes candidates, only rearranges the ten already given. This is the direct reason why
      the reranker physically cannot raise a document that wasn''t among the top-10 candidates before
      it (the nuance about the question with vector at 26th place, n57), and why it sometimes moves an
      already-correct result to the wrong place (the nuance about the question "An example of water barriers?",
      n57): the model reads only those ten texts and decides anew, not knowing that one of them was already
      right.'
