- id: n31
  file: slides/n31-granitsa-stupeni-chetyre-voprosa.md
  type: criteria_boundary
  duration_min: 2.0
  assertion: Маршрут по заранее заданным классам работает, когда список классов закрыт, ответ — выбор
    одной готовой ветки, и ошибку видно по одному результату; проверяется это четырьмя вопросами к собственной
    задаче, четвёртый из которых — про величину, которую системе велено максимизировать
  learning_goal: Граница ступени 2 (правило А7, прямая форма) и вопрос к себе (правило П5). Первые три
    вопроса — та же граница, что в section-2-routing.md §A.4 и ARCHITECTURE.md §5, переписанная из решётки-зеркала
    в проверяемые вопросы; четвёртый добавлен кейсом IRS и спрашивает про выбор целевой величины. Передача
    к одному агенту — называется, не разбирается. Источник — section-2-routing.md §A.4, part4b.md §B.4,
    ARCHITECTURE.md §5.
  visual:
    pattern: boundary_self_check
    primary: 'Сверху — короткий блок про то, когда маршрута хватает. Ниже — таблица на четыре строки и
      две колонки: вопрос к своей задаче / при каком ответе маршрута не хватит; строки читаются парами,
      вопрос слева и его последствие справа. Внизу — передача к следующей ступени одной строкой, без разворота
      в декларацию синтеза.

      '
    backup: 'Первые три строки — та же граница, что section-2-routing.md §A.4 и ARCHITECTURE.md §5 («классы
      заранее неизвестны или пересекаются → маршрутизации не хватает — предвестник одного агента»). Форма
      изменена по опус-ревью: прежняя решётка-зеркало «классы известны / классы неизвестны» читалась как
      две колонки одного и того же утверждения и к своей задаче не прикладывалась. Четвёртая строка —
      вклад кейса IRS (part4b.md §B.3): выбор максимизируемой величины проверкой модели не покрывается.
      Приём `boundary_self_check` — новое имя в словаре деки: приём границы `criteria_checklist_and_boundary`
      разводит двухколоночную таблицу в две отдельные плашки, и построчная пара «вопрос → последствие»
      при этом теряется; здесь нужна именно таблица, поэтому приём падает в `g_content`. Следующая ступень
      названа ровно как строка 6 лестницы занятия («один агент»), без счёта занятий и без номера семинара.'
- id: n32
  file: slides/n32-os-promezhutochnaya.md
  type: recap_ladder
  duration_min: 2.5
  assertion: Три нижние ступени закрыты — хватит одного вызова, цепочка, маршрут с decision-моделью; шесть
    ступеней выше закрывают следующие пять занятий дуги
  learning_goal: 'Замыкание контракта, открытого третьим экраном занятия: та же лестница, та же геометрия,
    три нижние ступени теперь залиты и отмечены галочкой. Это не пересказ шести кейсов — зал видит тот
    же объект с другим результатом и уносит рабочее правило: у вопроса «хватит одного вызова, нужна цепочка
    или нужен маршрут» с этого момента есть ответ по ступеням.

    '
  visual:
    pattern: ladder_steps_figure
    figure: os-n32-lestnitsa-tri-zakryty.png
    primary: 'Та же схема, что на третьем экране занятия, с точностью до пикселя: девять ступеней снизу
      вверх, ломаная по внешним углам. Три нижние ступени залиты золотом, у каждой галочка; полоса справа
      читает «закрыто». Шесть верхних остаются серыми. Под схемой — строка о том, чем они закрываются,
      и рабочее правило одной формулой.

      '
    backup: 'Источник: `ARCHITECTURE.md` §6 (три нижние закрыты, шесть пустых) и `SPLIT-PLAN-7-12.md`
      §2 (те же девять ступеней, те же названия узлов, без переименования).

      Зеркальная пара к `n03`: `rendered/make_figures_mostik.py` рисует обе схемы одной функцией с одним
      переключателем, поэтому расхождение геометрии между открытием и закрытием невозможно по построению
      — разница ровно в заливке трёх нижних ступеней, в галочке на них и в слове внутри полосы справа.

      Кругом правок по опус-ревью снято два прежних свойства этого экрана. Форма таблицы на девять строк
      с колонками «Закрывает» и «Статус» заменена на ту же лестницу, что в открытии: прежде открытие и
      закрытие показывали одну и ту же таблицу с разницей в три ячейки и забирали вдвоём одиннадцать минут
      занятия. Время ужато с шести минут до двух с половиной. Пересказ границы ступени 2 снят отсюда целиком:
      её прямой формой даёт предыдущий экран (`criteria_checklist_and_boundary`), и второй раз она здесь
      звучала бы повтором.'
