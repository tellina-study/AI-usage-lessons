- id: n31
  file: slides/n31-k3-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре действия, спектром от «проверяет сама модель» до «проверяет код» и «не проверяет никто,
    решает частота»
  learning_goal: 'Вопрос Кейса 3: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор, то есть действие, которое можно совершить, а не факт о возможностях
    инструмента (§5 канона замысла кейса).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      слева проверку делает сама модель, справа — код либо частота повторов. Пояснений, доводов и пометок
      на карточках нет, разбор следующим экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Вопрос»; формулировки
      не переписаны. Вопрос в рамке — тоже дословная строка оттуда.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не говорит, сколько вызовов модели стоит, и ни одна не намекает,
      что правильных больше одной. Собственных чисел стенда (0 из 6, 5 из 5, три вердикта на одном тексте)
      на этом экране нет вовсе — им место в тактах n37 и n38. Внешних чисел тоже нет: они стоят экраном
      позже, в разборе.

      Проверка на рамку факта (§5 канона замысла кейса): каждая карточка уже начинается глаголом действия
      — «попросить», «спросить», «прогнать», «прогнать». Ни одна не превращается в утверждение о свойстве
      инструмента («судья ловит смысл, но путает порядок») — все четыре остались действиями, которые можно
      выбрать и собрать.

      Порядок карточек — спектр, а не вразнобой: первая оставляет проверку внутри той же модели, вторая
      зовёт вторую модель, третья не вызывает модель для проверки вовсе, четвёртая отменяет саму идею
      проверки и заменяет её частотой повторов.'
- id: n32
  file: slides/n32-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Три из четырёх действий отдают вердикт о годности ответа той самой машине, которая этот ответ
    и сочинила
  learning_goal: 'Разбор сразу за вопросом (А1), 4-колоночная форма «действие · как делает · преимущество
    · недостатки» (А5, голосовая правка владельца 2026-10-20, issue #274). Без вердиктов «верно/неверно»
    и без чисел собственного замера.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Четыре строки, колонки вердикта
      нет — решение следующим экраном. Ряды чисел в колонке недостатков набраны одним блоком с подписями,
      чтобы «было → стало» читалось как пара, а не как три отдельные цифры.

      '
    backup: 'Текст разбора сведён из SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Разбор», и уложен
      в 4-колоночную форму без переписывания по сути.

      СОБСТВЕННЫЕ ЧИСЛА СТЕНДА СНЯТЫ С ЭТОГО КАДРА, осознанно. В сетке колонки «недостатки» второй и третьей
      строк уже называют измеренное («тот же судья расходится с собой», «точное совпадение подстроки не
      распознало верный ответ в другом падеже, 1 из 6»). Здесь их нет: основание — голосовая правка владельца
      2026-10-20 (issue #274) по этому же такту Семинара 8 и решение оркестратора по этой волне. Разбор,
      проговоривший итог прогона, лишает такты n37 и n38 ровно того, что они вскрывают.

      ЧИСЛА, ОСТАВШИЕСЯ НА КАДРЕ, И ИХ ИСТОЧНИКИ, все внешние, все из CHISLA-SVERENO.md: 95,5 → 91,5 →
      89,0 — строка 11 (Huang и соавторы, arXiv:2310.01798, статус «сверено ранее оркестратором, как есть»);
      «в 94% случаев отзыв — всё выглядит хорошо» — строка 12 (arXiv:2303.17651, статус СВЕРЕНО, цитата
      найдена дословно); 65,0% · 46,2% · 23,8% · 75,0% — строка 13 (Zheng и соавторы, arXiv:2306.05685,
      статус СВЕРЕНО, все числа найдены построчно).

      ЧЕГО ВЗЯТЬ НЕ УДАЛОСЬ, названо прямо, а не заменено похожим: сетка в третьей строке даёт «+11 процентных
      пунктов на задаче с надёжным тестом, −3 на задаче с ненадёжным, доля ложноположительных тестов 1,4%
      против 16,3%». Этих чисел нет в CHISLA-SVERENO.md ни одной строкой, а брать их из `research/*` запрещено
      (БРИФ §2). Недостаток третьей строки поэтому сформулирован без числа — через свойство критерия,
      которое кейс дальше и измеряет сам. Вынесено оркестратору отчётом.

      Имена авторов на видимом слое стоят латиницей — так же, как `Kamath` и `Obermeyer` на n08 и n17:
      правило курса требует ссылок на работы и авторов на самом кадре. В заметках те же имена записаны
      по-русски.'
- id: n33
  file: slides/n33-k3-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Проверка перед отправкой — это круг с тремя обязательными частями: кто пишет, кто решает
    и что происходит, когда круг не сошёлся'
  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента. Названы обе части, которые чаще всего забывают: потолок попыток и ветвь
    «не сошлось».'
  visual:
    pattern: mechanism_node_graph
    figure: k3-shema-tsikl.png
    primary: 'Схема в два ряда: вопрос — генератор — проверяющий — развилка «сошлось?», и ниже обратный
      ход «переделка» со стрелкой назад к генератору, ветвь «передать Ольге» и ветвь «отправка клиенту».
      Отдельной плашкой — потолок в три попытки. Палитра Ocean, кегль не ниже 7,5 pt.

      '
    backup: 'Устройство круга — по SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Решение», слой 1, и
      по `stend/zamery-k1-k3/README.md` (сценарий с кодовой проверкой: генератор, проверяющий, развилка,
      до трёх попыток, явная ветвь «не сошлось»).

      Имён узлов, имени оркестратора и латиницы на схеме нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящий холст и настоящая панель — экранами
      дальше, n34 и n35.

      Про «якоря» из сетки. Сетка описывает узел, накапливающий уже подтверждённые проверки между попытками.
      На стенде это сделано проще и строже: проверяющий на каждой попытке считает ВСЕ пять требований
      заново, поэтому переделка не может починить одно и сломать другое незаметно. Схема говорит именно
      это — отдельного узла-накопителя на кадре нет, потому что его нет и на стенде.

      НАХОДКА, ВЫНЕСЕНА ОРКЕСТРАТОРУ ОТЧЁТОМ, а не поправлена молча: фигура `k3-shema-tsikl.png` уже несёт
      в нижней плашке измеренное число («точного совпадения подстроки не хватило, чтобы узнать верный
      по смыслу ответ в другом падеже — 1 случай из 6»). Это результат такта n37 и оговорка такта n42,
      и на такте решения он стоит раньше, чем измерение предъявлено. В видимом тексте этого слайда числа
      нет; снимать его из уже нарисованной фигуры — решение оркестратора, не автора слайда (фигуры в зону
      этой сессии не входят).'
- id: n34
  file: slides/n34-k3-n8n-tsikl.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящий холст круга: развилка после проверки, возврат по низу кадра и две разные концовки
    — «ok» и «не сошлось»'
  learning_goal: 'Слой 2 Кейса 3, первая половина (§2 канона замысла кейса): настоящий снимок живого стенда
    с настоящими именами узлов. На кадре видно то, чего не было на холсте Кейса 1, — путь назад.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-holst-tsikl.png
    primary: 'Настоящий снимок холста n8n живого стенда. Главный ряд слева направо: `Client question`
      → `Pick KB item` → `Generate answer` → `Code check` → `Retry or finish?`; снизу к узлу ответа подвешен
      `Model (generate)`, под узлом видна пометка `Model*`. Справа — вторая развилка `Converged?` и две
      концовки. Снизу — `Prepare retry` и длинная стрелка возврата вдоль нижнего края кадра.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case3-cycle-code-canvas.png`, снят `stend/n8n_shots.py`
      на живом стенде. Стилизованной карточки вместо снимка здесь нет (БРИФ §5).

      Что на кадре видно буквально и о чём поэтому можно говорить: семь узлов главного пути, подвешенный
      снизу узел модели, пометка `Model*`, две развилки с подписями выходов `true` и `false`, два разных
      экрана-финала (`Result screen (ok)` и `Result screen (не сошлось)`) и стрелка, которая от `Prepare
      retry` уходит вправо, вниз и затем влево вдоль всего нижнего края кадра обратно ко входу `Pick KB
      item`.

      Что на кадре НЕ видно и поэтому прозой рядом не утверждается: ни текст промта генератора, ни код
      проверяющего, ни счётчик попыток. Холст показывает карточки узлов, а не их открытые настройки. Панель
      проверяющего — отдельным экраном (n35), со своим снимком.

      Имя сценария в хлебной крошке в кроп не берётся; id сценария и id прогонов на кадре не видны нигде
      (канон §3). Слово «замер» из имени сценария на видимый слой не выносится (БРИФ §3).'
- id: n35
  file: slides/n35-k3-nastroyka-proveryayushchego.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящая панель проверяющего: семнадцать строк кода, в которых пять требований записаны
    буквально и каждое возвращает свою причину отказа'
  learning_goal: 'Слой 2 Кейса 3, вторая половина: настоящий снимок панели настройки. Видно, что критерий
    — это текст, который можно прочитать целиком, и что отказ приходит с причиной, написанной заранее,
    а не сочинённой в момент проверки.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-panel-proveryayushchego.png
    primary: 'Настоящий снимок панели узла проверки: вкладка `Parameters`, поле `Mode` в положении `Run
      Once for Each Item`, поле `Language` в положении `JavaScript` и ниже сам код — семнадцать пронумерованных
      строк, видимых целиком.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case3-code-check-panel.png`, снят `stend/n8n_shots.py`
      на живом стенде; код в кадре читается построчно и совпадает с `stend/zamery-k1-k3/sborka_zamer3.py`.

      ИМЯ УЗЛА В КАДР НЕ ПОПАЛО: панель снята от вкладки `Parameters`, а хлебная крошка с именем осталась
      выше кропа. Поэтому имя названо словами на самом кадре — `Code check`, ровно так, как оно стоит
      на холсте n34, где его видно. Это не домысел: имя прочитано с предыдущего снимка, а не придумано.

      Что на кадре видно буквально: положение `Run Once for Each Item` (узел отрабатывает каждый ответ
      по отдельности), язык `JavaScript`, семнадцать строк кода и подсказка интерфейса под полем. Пять
      требований видны как шесть проверок — «целиком на русском» распадается на две строки, отдельно латиница
      и отдельно иероглифы.

      Что прозой рядом НЕ утверждается: ничего про промт судьи-модели. Его панель на этом кадре не показана,
      и сравнение «та же формулировка у кода и у судьи» делается на такте методологии, где оно и измерено.

      Строка `const ok = reasons.length === 0` названа отдельно: это и есть всё правило приёмки целиком
      — список причин пуст, значит ответ годен.'
- id: n36
  file: slides/n36-k3-eksperiment-metodologiya.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: Код и судья получили одну и ту же формулировку пяти требований и один и тот же текст ответа
    — 36 вызовов на живом стенде, четыре сборки
  learning_goal: 'Такт методологии: что именно мерили, на чём и сколько. Без этого экрана числа следующего
    такта не значат ничего — и честно назван предел замера: вариант с судьёй в цикле прогнан на четырёх
    вопросах из шести.'
  visual:
    pattern: mechanism_node_graph
    primary: 'Четыре врезки подряд: зачем мерить · что считается годным ответом · какие четыре сборки
      прогнаны и сколько вызовов каждая · где у замера предел. Снимка на кадре нет: холст и панель уже
      показаны двумя экранами раньше.

      '
    backup: 'Всё содержание — из `stend/zamery-k1-k3/README.md`, Замер 2: пять требований дословно из
      раздела «Задача», шесть вопросов по шести пунктам справочника, четыре сборки и число вызовов каждой
      из таблицы «Фактическое число вызовов» (6 + 8 + 16 + 6 = 36).

      Сборка `judge-check` названа отдельной врезкой, потому что она и есть несущая часть замысла: она
      даёт коду и судье ОДИН И ТОТ ЖЕ готовый текст. Без неё сравнение было бы сравнением двух разных
      выборок ответов, и находка n37 не читалась бы как расхождение проверяющих.

      ПРЕДЕЛ ЗАМЕРА НАЗВАН НА КАДРЕ, а не спрятан в заметки: вариант с судьёй внутри цикла прогнан на
      четырёх вопросах из шести — остановлено по бюджету вызовов, а не потому, что находка перестала подтверждаться
      (протокол, раздел «Замер 2, вариант judge, прогнан не полностью»).

      Имя модели (`qwen/qwen-2.5-7b-instruct`) на кадре названо как «одна и та же модель во всех четырёх
      сборках»: для довода важно именно это тождество, а не марка. Id сценариев, адреса вебхуков и номера
      прогонов на видимый слой не идут (БРИФ §2).

      Слово «замер» из имени сценариев на стенде на кадр не вынесено: на слайде это процесс кейса, а не
      измерительная оснастка (БРИФ §3).'
- id: n37
  file: slides/n37-k3-eksperiment-rezultat.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: На одном и том же тексте судья-модель не одобрила ни одного ответа, забракованного кодом,
    — 0 из 6, и ложно забраковала все 5, которые код принял верно
  learning_goal: 'Результат эксперимента. Поворот кейса (П1): заказывали «как часто судья мягче кода»,
    измерили 0 из 6, и настоящее расхождение оказалось обратным — пять ложных отказов из пяти, с фактически
    неверными причинами. На слайд идёт измеренное, не ожидавшееся.'
  visual:
    pattern: measured_outcome_table
    primary: 'Полоса из двух плашек с несущей парой «0 из 6» и «5 из 5», подписи разводят их явно. Под
      полосой — таблица шести вопросов: длина ответа, вердикт кода, вердикт судьи и причина судьи с пометкой,
      верна она или нет. Внизу — дословная цитата одного ответа вместе с вердиктом.

      '
    backup: 'Все числа и все формулировки — из `stend/zamery-k1-k3/README.md`, Замер 2, раздел «Несущее
      число кейса»: таблица шести вопросов приведена построчно, длины ответов и причины судьи перенесены
      дословно.

      ОСНОВАНИЕ ДЛЯ ПАРЫ ЧИСЕЛ, обе половины обязательны. «0 из 6» — ответ на заданный вопрос замера («сколько
      раз судья признал годным то, что код забраковал»). «5 из 5» — то, что измерение показало вместо
      этого: из шести первых ответов код принял пять и забраковал один; судья забраковал все шесть, то
      есть ошибся на всех пяти принятых. Без первого числа второе читалось бы как число без базы.

      ЧЕГО НА КАДРЕ НЕТ И НЕ БУДЕТ: формулировки «судья мягче кода». Она не подтверждена измерением —
      прямо записано и в ARCHITECTURE.md, и в разделе «Что не подтвердилось» протокола. Измеренное направление
      обратное, и оно сильнее исходной гипотезы.

      Две дословные цитаты протокол называет годными на слайд как есть; взята одна — про перевод на другой
      курс, где причина отказа («длиннее 280 символов») опровергается длиной самого ответа на том же кадре.
      Вторая (сертификат, «не упоминает деталь») уходит на n38, где она же становится первым из трёх вердиктов.

      Единственное согласие кода и судьи (вопрос про пересдачу) оставлено в таблице и названо верным по
      делу: таблица, где все шесть строк обвиняют судью, была бы отбором удобных строк.

      Номера прогонов на видимом слое не стоят (БРИФ §2) — они в протоколе.'
- id: n38
  file: slides/n38-k3-sudya-ne-soglasen-s-soboy.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Один и тот же по существу текст судья вернул, вернул снова и одобрил на третьей попытке —
    три разных вердикта подряд без единого содержательного изменения
  learning_goal: Несущий кадр кейса. Ложный отказ (n37) ещё можно списать на строгость проверяющего; здесь
    же проверяющий расходится сам с собой на тексте, который не менялся по существу, — и это снимает саму
    возможность на него опереться.
  visual:
    pattern: measured_outcome_table
    primary: 'Три ступени одна под другой — попытка, дословный текст, вердикт и причина, — набранные так,
      чтобы разница между текстами читалась с одного взгляда: отличается одно словосочетание. Под ступенями
      — плашка цены: два лишних круга, четыре лишних вызова. Таблицы на кадре нет: форма предыдущего экрана
      здесь сознательно не повторяется.

      '
    backup: 'Три попытки — дословно из `stend/zamery-k1-k3/README.md`, Замер 2, раздел «Непредусмотренная,
      но прямо подтверждающая находка»: вопрос про срок появления сертификата, круг с судьёй, три попытки.
      Длины (169, 172, 172 знака), тексты и причины вердиктов перенесены с кадра протокола без правки.

      ПОЧЕМУ ЭТОТ КАДР СИЛЬНЕЕ ПРЕДЫДУЩЕГО, и почему он подан иначе. На n37 судья ошибается — это ещё
      можно списать на излишнюю строгость проверяющего и даже назвать безопасной стороной ошибки. Здесь
      у него нет устойчивого вердикта вообще: один и тот же по существу текст получает «нет», «нет» и
      «да». Проверяющий, чей вердикт зависит от попытки, не бракует и не пропускает — он лишает смысла
      само понятие проверки. Отсюда и другая форма подачи: не таблица сравнения, а три ступени одного
      текста, читаемые сверху вниз.

      ПРИЧИНА ВТОРОЙ ПОПЫТКИ («длина ответа превышает 280 символов» при 172 знаках) — тот же класс ложной
      причины, что на n37; она оставлена, потому что показывает: расхождение с собой идёт не от нового
      довода, а от повторения уже опровергнутого.

      ПРИЧИНА ПЕРВОЙ ПОПЫТКИ — буквально цифра «2», без единого слова объяснения. Это не сокращение и
      не пересказ: так в протоколе, и так приходит вердикт в процесс.

      Цена названа числами того же прогона: два лишних круга, четыре лишних вызова модели (каждая попытка
      — генерация плюс вердикт). Кодовая проверка на семантически том же ответе остановилась бы на первой
      попытке.'
- id: n39
  file: slides/n39-k3-razbor-versiy.md
  type: answer_breakdown_table
  duration_min: 1.5
  assertion: На одном наборе вопросов код ошибся один раз из шести и объяснимо, судья — пять раз из шести
    и ложными причинами; внешние измерения показывают ту же асимметрию на других задачах
  learning_goal: 'Разбор версий ПОСЛЕ теста (§4 канона замысла кейса): обе версии сравниваются на том
    прогоне, который проблему и нашёл, а не абстрактными свойствами. Ошибка кода названа вместе с ошибкой
    судьи — иначе это не разбор, а приговор.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в два столбца «проверяет модель» и «проверяет код», пять строк сравнения на одном
      и том же прогоне. Под таблицей — плашка внешних измерений и плашка с единственным отказом кода,
      разобранным честно.

      '
    backup: 'Собственные числа — из `stend/zamery-k1-k3/README.md`, Замер 2: сводка («сошлось» и число
      попыток по трём сборкам) и раздел «Несущее число кейса». Попытки взяты СЧЁТОМ, а не средним: протокол
      печатает среднее «1,5» для кодовой сборки, тогда как собственный перечень попыток в той же строке
      (1,1,3,1,1,1) даёт восемь попыток на шесть вопросов, то есть 1,33. Расхождение вынесено оркестратору
      отчётом; на кадр взяты счётные числа, которые сходятся с таблицей вызовов замера.

      Внешние числа — CHISLA-SVERENO.md, строка 11 (Huang и соавторы, arXiv:2310.01798) и строка 13 (Zheng
      и соавторы, arXiv:2306.05685), обе со статусом «как есть».

      ЕДИНСТВЕННЫЙ ОТКАЗ КОДА РАЗОБРАН НА ЭТОМ ЖЕ КАДРЕ, а не спрятан: ответ был верным по смыслу, и проверка
      его не узнала из-за падежа — «до второй субботы» вместо требуемой подстроки «вторую субботу». Протокол
      прямо требует держать эту оговорку рядом с числом, иначе кадр обвиняет не того участника.

      ОБНОВЛЕНО 2026-10-26: этот конкретный отказ починен (regex, толерантный к падежу, вместо точного
      `includes()`) и перемерен — 6 из 6 (execution 829–834, `stend/zamery-k1-k3/README.md` § «Починка
      2026-10-26»). Кадр держит оба числа: что было измерено на этом прогоне (1 из 6) и что починка дала
      при перемере (6 из 6) — история находки не стирается.

      Столбцы названы «проверяет модель» и «проверяет код», а не «версия 1» и «версия 2»: на стенде измерялись
      именно эти две сборки круга, и приписывать им номера версий значило бы говорить о том, чего в замере
      не было. Самопроверка без внешнего критерия держится внешним измерением и стоит отдельной плашкой.'
- id: n40
  file: slides/n40-k3-tsena-sudi.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: 'Судья стоит двух вызовов модели на попытку против одного у кода: 16 вызовов на четыре готовых
    ответа против 8 вызовов на шесть'
  learning_goal: Цена проверяющего, названная отдельно от его точности. Число вызовов — то, что видно
    в счёте за месяц и в ожидании обратившегося; оно складывается с пятью ложными отказами из шести, а
    не заменяет их.
  visual:
    pattern: measured_outcome_table
    primary: 'Две плашки с несущей парой «1 вызов на попытку» и «2 вызова на попытку», под ними короткая
      таблица трёх сборок: попытки, вызовы и вызовов на один готовый ответ. Внизу — плашка про то, что
      цена измеряется не только деньгами.

      '
    backup: 'Числа — из `stend/zamery-k1-k3/README.md`, таблица «Фактическое число вызовов» и сводка Замера
      2: без цикла 6 вызовов на 6 вопросов; кодовая сборка 8 попыток и 8 вызовов на 6 вопросов; сборка
      с судьёй 8 попыток и 16 вызовов на 4 вопроса.

      ПРОИЗВОДНЫЕ ЧИСЛА ПОСЧИТАНЫ ЗДЕСЬ И НАЗВАНЫ ПРОИЗВОДНЫМИ: 8 ÷ 6 = 1,3 вызова на готовый ответ у
      кода и 16 ÷ 4 = 4,0 у судьи. Подписи разводят их явно, чтобы пара не читалась как два числа об одном
      и том же (БРИФ §2). Среднее число попыток из протокола (1,5 для кодовой сборки) на кадр не взято:
      оно расходится с собственным перечнем попыток в той же строке протокола (1,1,3,1,1,1 — это 1,33).
      Расхождение вынесено оркестратору отчётом.

      Почему у судьи два вызова на попытку: первый пишет ответ, второй выносит вердикт. У кода вызов один
      — вердикт считается без модели. Это видно на снимке панели n35: ни одной модели к узлу проверки
      не подключено.

      Сборка без цикла стоит в таблице как база сравнения: без неё «8 вызовов» не с чем сопоставить.

      Денежных сумм на кадре нет сознательно: цена вызова у разных моделей разная и меняется, а соотношение
      «один против двух» — свойство устройства, а не прайса.'
