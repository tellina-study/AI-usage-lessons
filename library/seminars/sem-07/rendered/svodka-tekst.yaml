# Прозаическая часть карты слайдов и имена кейсов — то, что из слайдов не
# выводится. Всё остальное в `SVODKA-SLAIDOV.md` считает `make_svodka.py`:
# состав, номера, типы, заголовки, минуты и итоги. Руками карту не правят
# (канон §8.5) — правят этот файл либо сам слайд.

title: "Карта слайдов — Семинар 7"

# Имя кейса — короткое, для карты. Дивайдер называет проблему словами сцены,
# и в заголовок карты он не годится. Кейсов четыре, один блок: занятие
# собирает ОДИН процесс на четырёх стадиях, а не обходит четыре темы.
keysy:
  1: три узла — первый работающий процесс целиком
  2: от прозы к значениям — извлечение полей по описаниям
  3: вызов не удался — повтор и вторая ветка
  4: черновик против опубликованной версии

# Полные имена блоков для заголовков карты. Сборщик деки знает их короткими,
# дорожке больше и не нужно.
bloki:
  Кейсы: "Кейсы — один процесс на четырёх стадиях"
  Теория: "Теория — устройство процесса до первого кейса"
  Ось: "Ось — когда процесс строить не надо"
  Выход: "Выход — что уносят с занятия"

# Состав «начала блока» — текст для подзаголовка, если алгоритм (`groups()` в
# `make_svodka.py`) найдёт его в блоке. На этой деке блок кейсов начинается
# сразу с дивайдера кейса 1, поэтому «начала» у него нет, и это честная
# структура, а не дефект. Запись держится про запас.
nachalo: {}

vstupleniye: |
  Таблица собрана из файлов слайдов, а не из плана: номер, блок, тип, заголовок экрана и минуты
  взяты из фронтматтера и первой строки каждого файла. Границы блоков — из статической таблицы
  сборщика деки (`build_sem07.SECTIONS`). Границы кейсов выведены по дивайдерам кейса — все
  четыре несут один приём `case_divider_quote`.

  Нумерация сквозная, `n01`…`n28`, без буквенных хвостов. Занятие открывает дугу из шести
  семинаров про построение процессов на языковых моделях (`KONTSEPTSIYA-7-12.md`): сегодня
  закрывается нижняя ступень лестницы — триггер, шаг, запись результата, получение значений
  вместо прозы, поведение при отказе и разница между черновиком и опубликованной версией.

  Занятие ведётся как живое демо с ноутбука ведущего; снимки холста — страховка, не замена
  демо. Такт «наше решение» в каждом кейсе собирается на стенде на глазах у зала, и слайд при
  этом самодостаточен: на нём принципиальная схема и таблица параметров, так что при отказе
  техники занятие идёт без потерь и без переключения режимов.

  Кейсов четыре плюс один концептуальный разбавитель, и все четыре — стадии ОДНОГО процесса:
  кейс 1 собирает его из трёх узлов, кейс 2 меняет средний узел, кейс 3 добавляет повтор и
  вторую ветку, кейс 4 объясняет, почему собранное работает не так, как выглядит. На выходе
  занятия — файл процесса, который студент ставит себе одним импортом.
