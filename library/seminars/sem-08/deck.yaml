      модель/ключи/пунктуация ≈80) без двух текстов — ≈420 символов; плюс два обращения — итого ≈500 символов
      на вызов (запрос jev длиннее: явная инструкция и оба критерия, которых у промпта модели-судьи нет).

      Символы → токены — иллюстративное допущение ≈2 символа на токен для русского текста (НЕ измеренный
      факт, грубое правило счёта, токенизатор этого конкретно не проверялся): модель-судья ≈110 входных
      токенов, выход короткий («Да.» / «Нет.» — см. llm_judge_raw в duplicate-check-results.json) ≈5 токенов;
      jev ≈250 входных токенов, выход $0 по прайсу (Decisions API возвращает вероятность, не текст).

      Стоимость за вызов: модель-судья ≈110×$0,15/млн + 5×$0,60/млн ≈ $0,0000197; jev ≈250×$0,042/млн
      ≈ $0,0000105. На ≈300 вызовов в месяц: модель-судья ≈$0,006/месяц, jev ≈$0,003/месяц — ОБА меньше
