- id: n48
  file: slides/n48-razbor-odna-redaktsiya-prohodit-obe.md
  type: answer_breakdown
  duration_min: 1.75
  assertion: 'Обе проверки проходит только редакция из трёх частей: что делает, когда звать и когда не
    звать — последняя и удерживает скилл от лишнего срабатывания'
  learning_goal: 'Разбор всех пяти карточек по форме А7: вариант · где он работает конкретными случаями
    · ограничения. Выбор выводится строкой под таблицей из сочетания двух колонок, а не объявляется ярлыком
