deck:
  lecture_number: 4
  title: "Лекция 4. AI в разработке программного обеспечения"
  audience: "3 курс ИУ6, инженеры-разработчики (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "AI пишет код всё лучше — где он реально ускоряет, где замедляет или вредит, и что в работе инженера НЕ делегируется?"
  learning_outcomes: [LO1, LO4, LO7]
  language: ru
  status: draft
  version: v1
  source: chapter v1.1 finalized (~22300 слов, 3 части)
  plan: notes/lecture-4-software-review/final/plan-v2-final.md (v2-final §4)
  total_slides: 35          # 32 (s01–s32 нумерация неизменна) + 3 suffix-ID дивайдера s04a/s24a/s28a (Решение #101)
  curriculum_level: "Module 1, первая отраслевая (после обзорных Л1–Л3)"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # Канонические термины — из glossary.yaml (locked 2026-05-16, chapter v1.1).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  # forbidden_anglicisms: пайплайн→конвейер, фоллбэк→запасной вариант,
  # эдж-кейс→краевой случай, инсайт→вывод/наблюдение.
  - "лестница автономности (A автодополнение / B мелкие задачи / C кодинг-агент / D оркестратор+трекер)"
  - автодополнение
  - кодинг-агент
  - оркестратор
  - "«почти правильный» код"
  - 70/80%-проблема
  - "perception-gap (разрыв ощущение↔измеренный факт)"
  - "SWE-bench (Verified / Pro)"
  - "TDD (разработка через тестирование, тест-первым)"
  - spec-driven development
  - trunk-based development
  - quality-gate
  - mutation-тестирование
  - SAST / DAST / SCA
  - secret-scanning
  - "supply-chain (цепочка поставок ПО)"
  - "slopsquatting (галлюцинация имени пакета)"
  - prompt injection (инъекция в промпт)
  - "vibe-coding (антипаттерн: без тестов/спеки/гейтов)"
  - accidental vs essential complexity (Brooks)
  - confused-deputy
  - docs-as-code
  - "AGENTS.md / CLAUDE.md (машиночитаемый контекст агента)"
  - "accountability (ответственность, не делегируется)"
  - "least-privilege (принцип наименьших привилегий)"

