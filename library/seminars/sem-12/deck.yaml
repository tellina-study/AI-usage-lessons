- id: n30
  file: slides/n30-k2-dva-enkodera.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: Текст и картинка попадают в общее пространство не из коробки, а через отдельное контрастное
    обучение — и даже после него остаются на измеренном расстоянии 0,82
  learning_goal: 'Такт 1, шаг 2. Механика ARCHITECTURE.md §8.1: «два энкодера в одно пространство, косинус
    между картинкой и фразой» — зал предсказывает, почему поиск словами по картинке вообще возможен. Закрывает
    строку, которой закончился Семинар 10 этого же курса («подпись теряет то, что видно на самой картинке»)
    — здесь у неё механическое объяснение, не пересказ памяти о прошлом занятии (С8: состояние описано
    заново).'
  visual:
    pattern: mechanism_node_graph
    figure: case2-two-encoders.png
    primary: 'Схема: картинка и текст идут через раздельные энкодеры → проекция в общую размерность →
      L2-нормировка → матрица косинусов в батче → контрастная функция потерь. Плашка модального зазора
      — 0,82.

      '
    backup: 'Устройство и числа — CLIP, arXiv:2103.00020 (Radford et al., OpenAI, 2021): 400 млн пар картинка-подпись,
      32 эпохи, батч 32 768, температура начинается с 0,07 и обрезается, чтобы не раздувать итоговые числа
      больше чем в 100 раз. Модальный зазор 0,82 — arXiv:2203.02053 (Liang et al., NeurIPS 2022), измерено
      на единичной гиперсфере (0 — совпадение центров облаков, 2 — противоположные полюса).'
