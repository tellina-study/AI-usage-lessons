    block_plans: plans/          # поимённые минуты кадров
    cut_order: CUT-ORDER.md
    decisions: decisions-owner.md
    images: deck/images.md
  generator: deck/make_deck_yaml.py   # выгружает ЭТОТ файл из slides/*.md; перезапускать после правок фронтматтера

