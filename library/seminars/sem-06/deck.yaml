  learning_goal: 'Вопрос классу без подсказки целевого ответа. Карточки называют варианты, не решение:
    чтение самому / вторая сессия / коллега / субагент в своём контексте / правка по памяти. Круг 5 (issue
    225): карточка «вторая сессия» поставлена в набор вместо карточки «сохранить вопрос как скилл» — зал
    в любом случае называет этот вариант вслух, и место ему на слайде, а не в справке; скилл же отвечал
    на повторяемость, которой у разовой правки нет. Пересмотр по сторителлингу (issue 225, правило П1):
    зал просят назвать ПРИЧИНУ выбора вслух — почти наверняка прозвучит «быстрее», и поворот кейса на
    следующем слайде опровергает именно произнесённую залом версию, а не воображаемую. Разбор — на следующем
    слайде'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — строка про свою правку: у кого поиск мест стоил дороже самой правки
      и сколько файлов пришлось открыть. Ниже золотая коробка по центру с дословным выбором, надзаголовок
      «· ВОПРОС», подпись «разбор — на следующем слайде». Пять карточек равной ширины внизу, ни одна не
      подсвечена.'
    backup: 'Слайд круга 3 владельца (issue 225). Карточки сформулированы так, чтобы развести время чтения
      (не меняется ни одним вариантом) от места, где это чтение ложится, и от того, куда возвращается
      результат (меняются разными вариантами по-разному). Круг 5 (issue 225, ZADANIE-KRUG-5.md): состав
      карточек тронут один раз — «сохранить вопрос как скилл на будущее» заменена на «открыть вторую сессию
      и перенести список руками». Причина: владелец указал, что занятие не отвечает, почему герой не поднял
      вторую сессию; пока варианта не было на карточках, ответ на него жил только в справке, то есть для
      зала не существовал. Скилл при этом ничего не терял и ничего не решал в этой сцене: он отвечает
      на повторяемость, а правка тарифа разовая; приём не пропадает из занятия — он введён на прошлом
