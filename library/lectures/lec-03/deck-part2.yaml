slides:
  # ─────────────────────────────────────────────────────────────────────
  # Раздел 2. RAG (~11 мин)
  # ─────────────────────────────────────────────────────────────────────
  - id: s09
    file: slides/s09-section2-divider-rag.md
    type: section_divider
    section: "Раздел 2. RAG"
    duration_min: 1
    assertion: "Раздел 2 — RAG: поиск-дополненная генерация поверх эмбеддингов Лекции 2"
    chapter_ref: "§2.1 [for-slide-s09]"

  - id: s10
    file: slides/s10-rag-principle.md
    type: process
    section: "Раздел 2. RAG"
    duration_min: 3
    assertion: "RAG = индексация → retrieval → генерация с опорой; «не знаю» — корректный ответ, выдумка — дефект"
    learning_goal: "Принцип RAG в 3 шага + инвариант grounding"
    chapter_ref: "§2.1 [for-slide-s10]"
    references: [lewis-2020-rag]
    subtype: schema_pipeline

  - id: s11
    file: slides/s11-when-rag-right.md
    type: assertion_visual
    section: "Раздел 2. RAG"
    duration_min: 2.5
    assertion: "RAG оправдан при сильном сигнале по признакам — и отсутствии блокеров с «когда НЕ»"
    learning_goal: "Когда RAG правильный выбор (§2.2)"
    chapter_ref: "§2.2 [for-slide-s11]"
    references: [u-niah-2025]
    changed_in_v4: "#221/#222 — убран жаргон конъюнкция/дизъюнкция; формулировка §2.2 «сигнал + нет блокеров»"

  - id: s12
    file: slides/s12-when-not-rag.md
    type: comparison
    section: "Раздел 2. RAG"
    duration_min: 2.5
    assertion: "Когда RAG НЕ нужен: влезает в окно → full-context; фикс. политика → lookup; данные live через API/MCP → инструмент напрямую"
    learning_goal: "3 критерия «когда НЕ RAG» (§2.3)"
    chapter_ref: "§2.3 [for-slide-s12]"
    subtype: schema_matrix
    changed_in_v4: "#223/#224 — 3-й критерий = live API/MCP (не observability; observability остаётся на s13)"

  - id: s13
    file: slides/s13-rag-fails-air-canada.md
    type: case_study
    section: "Раздел 2. RAG"
    duration_min: 3
    assertion: "«Вернул что-то ≠ вернул правильное»: RAG без observability тихо деградирует; Air Canada — отказ grounding"
    learning_goal: "Провал RAG на масштабе + Air Canada revisited (§2.4, §2.5)"
    chapter_ref: "§2.4, §2.5 [for-slide-s13]"
    references: [barnett-2024-rag-failures, mccarthy-tetrault-2024]

  # ─────────────────────────────────────────────────────────────────────
  # Раздел 3. Fine-tune (~9 мин) — реордер: определение → PEFT → критерии → forgetting
  # ─────────────────────────────────────────────────────────────────────
  - id: s13a
    file: slides/s13a-section3-divider-finetune.md
    type: section_divider
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 0.3
    assertion: "Раздел 3 — fine-tuning против промпта и RAG: проблема не в знании, а в поведении модели"
    chapter_ref: "§3 [for-slide-s14]"

  - id: s13b
    file: slides/s13b-what-is-fine-tuning.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 1.5
    assertion: "Fine-tuning меняет САМИ ВЕСА; на практике почти всегда LoRA/PEFT, не full-FT"
    learning_goal: "Определение fine-tuning + строка LoRA/PEFT (§3.1)"
    chapter_ref: "§3.1 [for-slide-s14]"
    subtype: schema_pipeline
    changed_in_v4: "#225 — добавлена строка «на практике почти всегда LoRA/PEFT»"

  - id: s15
    file: slides/s15-peft-not-full-ft.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2
    assertion: "PEFT (LoRA/QLoRA) почти всегда лучше full-FT; 98,4% моделей с тегом PEFT — это LoRA"
    learning_goal: "PEFT вместо full-FT + LoRA baseline с оговоркой (§3.2)"
    chapter_ref: "§3.2 [for-slide-s15]"
    references: [hf-peft-2026]
    order_note: "#226 — PEFT сразу после определения, до критериев"
    changed_in_v4: "добавлен LoRA-adoption baseline 98.4% с обязательной оговоркой (доля среди PEFT-тегированных)"

  - id: s17
    file: slides/s17-finetune-criteria.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2.5
    assertion: "FT сузился до поведения: знание→RAG, поведение→PEFT, детерминированное→код; гибрид — норма"
    learning_goal: "Критерии «что куда» + гибрид как норма 2026 (failure/judgment)"
    learning_outcomes: [LO7]
    chapter_ref: "§3.3, §3.5 [for-slide-s17]"
    new_in_v5: "#185 — FT-критерии вернулись отдельным слайдом (был merged в s14)"

  - id: s14
    file: slides/s14-fine-tuning-narrowed.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2.5
    assertion: "Дистилляция = отдельная техника (teacher FT + student distill), НЕ вид fine-tuning"
    learning_goal: "Дистилляция как отдельная compression-техника (критерии перенесены на s17)"
    chapter_ref: "§3.1, §3.3, §3.5 [for-slide-s14]"
    subtype: schema_matrix
    changed_in_v4: "MERGED старые s14+s17; P0 #227 — дистилляция = «fine-tune teacher + дистилляция student, две отдельные техники», НЕ вид fine-tuning"
    changed_in_v5: "#185 — s14 сфокусирован на дистилляции; критерии → s17"

  - id: s16
    file: slides/s16-catastrophic-forgetting.md
    type: case_study
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2.5
    assertion: "Узкий агрессивный fine-tuning ломает общие способности; без eval-петли и версий — критерий «не делай»"
    learning_goal: "Провал catastrophic forgetting (§3.4)"
    chapter_ref: "§3.4 [for-slide-s16]"
    references: [luo-2023-catastrophic-forgetting]

