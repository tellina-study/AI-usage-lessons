    backup: 'Схема рисуется rendered/make_figures_c4.py (PIL, холст 1600×500 = 12,23″ рабочей ширины;
      пол кегля 16 px = 8,8 pt при пороге деки 7,5 pt; переполнение коробок проверяется самим генератором,
