    file: slides/s10-requirements-methodics.md
    type: assertion_visual
    section: "Раздел 1. Требования — первый артефакт"
    duration_min: 2.5
    assertion: "Методики дают три рекомендации, как дисциплинированно писать спеку: малые изолированно-тестируемые единицы, интервьюирующий LLM, спека-как-проверка — инструменты исполняют их и вторичны"
    learning_goal: "Рекомендации методик (Spec-Kit-метод, interrogatory LLM, deliberative alignment); вендоры вторичным рядом"
    learning_outcomes: [LO7, LO4]
    chapter_ref: "§1.2 [for-slide-s09]"
    references: [spec-kit, openai-deliberative-alignment, fowler-intent]
    interaction: none
    verify_day_of: true

  - id: s11
