# Семинар 4 — финальная сборка v6 (раунд 6: сведение пяти параллельных правок — R6-1
# гейт готовности виден с раздела 0, R6-2 правило трёх адресов кейса 1.3, R6-3 кейс 2.1
# переставлен вокруг таблицы четырёх слоёв, R6-4 кейс 2.2 честная формулировка «отдельные
# файлы (ADR)» + издержки структуры, R6-5 пять новых слайдов).
#
# v6 меняет относительно v5 (52 слайда, 81 мин):
# (R6-1) Новый слайд 0.5c «Что заведено в первый день» (раздел 0) — закрывает пробел,
#   откуда взялись артефакты кейсов 1.2/2.1/2.3 до их появления поимённо. Кейс 1.1
#   (s11) приведён в соответствие: CLAUDE.md на входе не пустой целиком, в нём уже есть
#   строка гейта готовности.
# (R6-2) Кейс 1.3 получил новый целевой ответ — «правило трёх адресов» (функция → код,
#   класс файлов → шаблон путей, проект → корень) — и новый слайд-разбор (s26,
#   исследование ч.2 + разбор), вставленный после механики пяти каналов доставки (s25).
# (R6-3) Кейс 1.2: исследование+разбор разделены на два слайда (s18 — две таблицы
#   источников + разбор карточек; s19 — формула «просьбы/законы» + развёрнутый блок «можно
#   ли сегодня обойтись без хука»), плюс новый слайд s21 «Что ещё заводится сразу» (три
#   день-0-практики вдобавок к гейту).
# (R6-4) Кейс 2.1: таблица четырёх слоёв записи переставлена перед разбором карточек
#   (s32, было после решения) — разбор (s33) теперь опирается на уже показанные слои,
#   а не переобъясняет их устно.
# (R6-5) Кейс 2.2: целевой ответ уточнён — «отдельные файлы (ADR), не тематические» —
#   согласовано с решением кейса (структура ADR — файл на решение, не на тему); Letta-
#   контрпример уточнён («файловое хранилище» — не «только grep», автоматическая индексация
#   и поиск по смыслу); новый слайд s45 «Цена структуры» — четыре издержки на собственном
#   doc/adr/ кейса, отдельно от контрпримера Letta (было на одном перегруженном слайде).
# (R6-6) Кейс 2.1 (s35, реальный DECISIONS.md) и кейс 2.2 (s39-s42) сведены к одной
#   формулировке отклонённого решения — «сторонние виджеты в форму не добавляем» — вместо
#   двух разных на соседних слайдах.
#
# Раздел 0 (открытие, s01-s08, 13 мин) — новый слайд s07 «что заведено в первый день».
# Раздел 1 (файл инструкций, 3 кейса, s09-s27, 32 мин) — было 16 слайдов, стало 19: кейс
#   1.2 получил 2 новых слайда (исследование+разбор разделены на s18/s19 + новый s21),
#   кейс 1.3 получил 1 новый слайд (s26).
# Раздел 2 (память, 3 кейса, s28-s54, 34.75 мин) — было 26 слайдов, стало 27: кейс 2.2
#   получил новый слайд s45 «цена структуры»; кейс 2.1 (s31-s37) физически переставлен —
#   таблица четырёх слоёв (s32) идёт перед разбором (s33), а не после решения.
# Раздел 3 (закрытие, s55-s57, 4.5 мин) — без изменений в структуре, две строки сводной
#   таблицы (s55) обновлены под новые целевые ответы кейсов 1.3 и 2.2.
#
# Источники старой структуры v5: slides старого deck.yaml (52 слайда) — R5-0..R5-4
# (раунд 5, смена оси день-0/жди-сигнала) остаются в силе как методический фундамент;
# v6 их не отменяет, а сводит пять параллельных правок пяти сессий в одну связную колоду.
#
# Слайдов было 52 (v5), стало 57 (v6). Детали — rework/section-*.md (v5/v6) +
# rendered/iteration-log.md.
deck:
  seminar_number: 4
  title: "Семинар 4 — Сборка кодинг-агента: день-0 база или жди сигнала"
  audience: "студенты 3 курса, направление 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами в работе"
  duration_min: 86  # material 83.75 (13 раздел 0 + 32 раздел 1 + 34.25 раздел 2 + 4.5 раздел 3) + ~2.25 мин резерва
  format: "слайды фасилитатора + открытые вопросы с карточками-вариантами (вопрос ДО исследования, R5-3) + совместное формирование конфигурации с залом (без живого терминала)"
  central_question: "Что в конфигурации агента стоит закладывать сразу, на день 0, как базовую практику — а что нельзя знать заранее, потому что оно специфично для вашего проекта?"
  learning_outcomes: [LO7, LO6, LO3]
  case: "signup-landing — лендинг с формой заявки на демо-урок: требования зафиксированы в spec.md и README до первой сессии агента; сборка, тест формы, деплой, задачи в трекере; один разработчик с агентом, фиксированная дата показа заказчику. Занятие подробно разбирает 2 из 5 слотов харнесса (файл инструкций, память), по 3 кейса на каждый — три специфичны для проекта (ждать сигнала: 1.1, 1.3, 2.2), три — универсальная гигиена (день 0: 1.2, 2.1, 2.3); остальные 3 слота + 2 практических слоя (хук, процесс) — Семинар 5."
  language: ru
  slide_count: 57
  timing_budget: "83,75 мин материала (13 раздел 0 + 32 раздел 1 + 34,25 раздел 2 + 4,5 раздел 3 закрытие) + ~2,25 мин резерва = 86; раздел 0 вырос с 12 до 13 мин (новый слайд «что заведено в первый день», сводит день-0-артефакты кейсов 1.2/2.1/2.3 в одно место до их появления поимённо), раздел 1 вырос с 29,5 до 32 мин (кейс 1.2 получил 2 новых слайда — разделение исследования/разбора и «что ещё заводится сразу»; кейс 1.3 получил новый слайд-разбор с целевым ответом «правило трёх адресов»), раздел 2 вырос с 32,75 до 34,25 мин (кейс 2.2 получил новый слайд «цена структуры», кейс 2.1 физически переставлен без изменения суммарного времени). Итоговая длительность занятия выросла с 81 до 86 мин — осознанное решение оркестратора при сведении пяти параллельных правок: каждая добавляет содержательный, а не косметический материал (честная база дня 0, уточнённые целевые ответы, разведённые слайды провала)."
  failure_share: "посчитано по каждому кейсу отдельно (доля research+answer_breakdown+failure_vignette+criteria_boundary слайдов от длительности кейса, включая новые слайды): 1.1=(0.5+5+1.5)/9≈78%, 1.2=(0.5+4+3+1.5+1.5)/13≈81%(включая новый слайд «что ещё заводится сразу», который сам не failure/evidence, но не меняет вывод — исследование+разбор+критерий составляют ядро), 1.3=(3+3+1.5)/10.5≈71%(включая новый слайд-разбор s26), 2.1=(1+1+1.25+1.75+3+1)/12.25≈73%(таблица слоёв s32 учтена как research_evidence-подобная опора разбора), 2.2=(1.25+1.25+1.5+1.5+2.0+0.75)/13.25≈62%(включая новый слайд «цена структуры»), 2.3=(1.5+1.25+3.25+1)/10.75≈62%. Все 6 кейсов индивидуально ≥30% с большим запасом (AI-Failure & Judgment Content Rule, strict-in). Агрегированная доля по всему занятию заметно выше порога 30% и распределена холистически по всем 6 кейсам, не сконцентрирована в одном."
  source: "library/seminars/sem-04/rework/section-0-otkrytie.md + section-0-otkrytie-part2.md + section-1-fayl-instrukciy.md + section-1-fayl-instrukciy-part2.md + section-1-fayl-instrukciy-part3.md + section-2-pamyat.md + section-2-pamyat-part1b.md + section-2-pamyat-part2.md + section-2-pamyat-part3.md + section-2-pamyat-timings.md (раунд 6 — сведение пяти параллельных сессий правок в одну колоду, оркестратор). Supersedes v5 deck.yaml (52 слайда, раунд 5 — R5-0 смена оси + R5-1 визуальная унификация дивайдеров + R5-2 раздел 0 переписан + R5-3 вопрос до исследования + R5-4 README-плашка)."

slides:
  # --- Раздел 0. Открытие: задача от заказчика, spec.md, сквозной кейс, два режима, что заведено сразу, карта (13 мин) ---
  - id: s01
    file: slides/s01-oblozhka-centralnyy-vopros.md
    type: hero_cover
    duration_min: 1
    assertion: "Конфигурация агента — набор решений, которые принимаются по ходу работы над проектом: часть окупается с первого дня, часть нельзя принять заранее"
    learning_goal: "Открытие занятия одной мыслью и одним вопросом — без оглавления и разгона; ось занятия (день-0 vs жди сигнала) звучит в первой минуте и держит всё занятие"
    visual:
      pattern: hero_cover
  - id: s02
    file: slides/s02-zadacha-zakazchika-vopros.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Задача приходит в формулировке заказчика: что должно получиться — есть, устройства кода, критериев готовности и границ действий — нет"
    learning_goal: "Постановка задачи от заказчика дословной цитатой + открытая дискуссия «отдаём как есть или сначала фиксируем требования» — вход в сквозной проект"
    visual:
      pattern: open_discussion
  - id: s03
    file: slides/s03-spec-md-trebovaniya.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Требования раскладываются на функциональные и нефункциональные и ложатся в spec.md первым коммитом; README описывает устройство репозитория и заводится тем же коммитом"
    learning_goal: "Структурированная запись требований — иллюстративный пример spec.md, явно помеченный не-захватом; README как отдельный артефакт продуктового слоя"
    visual:
      pattern: code_artifact
  - id: s04
    file: slides/s04-pustoy-repozitoriy-i-povorot.md
    type: code_artifact
    duration_min: 2
    assertion: "Агент собрал работающий прототип по спеке без единого уточняющего вопроса — и структуру репозитория при этом выбрал сам, потому что spec.md её не описывает"
    learning_goal: "Первый прогон сквозного проекта: реальный пустой репозиторий, задача из спеки, собранный прототип; структурные решения приняты агентом молча — вход в кейс 1.1"
    visual:
      pattern: terminal_task_and_dialogue
  - id: s05
    file: slides/s05-vopros-dva-rezhima.md
    type: reflection_question
    duration_min: 1
    assertion: "Настраивая агента в новом репозитории, каждый работает в одном из двух режимов — заложить базу сразу или дождаться реальной проблемы"
    learning_goal: "Первый открытый вопрос занятия — самодиагностика на двух режимах; БЕЗ разбора и БЕЗ подсветки, разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s06
    file: slides/s06-razbor-dva-rezhima.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: "Оба режима рабочие — вопрос в том, к какому типу решения они применяются: специфичное для проекта ждёт сигнала, универсальная гигиена заводится сразу"
    learning_goal: "Разбор двух режимов — вводит явную ось «день-0 / жди сигнала» и отделяет её от тезиса Лекции 3 про тонкого агента"
    visual:
      pattern: dual_mode_breakdown
  - id: s07
    file: slides/s07-chto-zavedeno-v-pervyy-den.md
    type: assertion_visual
    duration_min: 1
    assertion: "Кроме спеки и README в репозиторий в тот же день кладётся ещё три вещи — ни одна из них не ждала сигнала"
    learning_goal: "Список того, что заведено в первый день (0.5c) — закрывает пробел, откуда взялись артефакты кейсов 1.2/2.1/2.3, до того, как они встретятся поимённо; вставлен после разбора двух режимов (0.5b), чтобы не подсказывать вопрос 0.5"
    visual:
      pattern: day_zero_checklist
  - id: s08
    file: slides/s08-karta-ekipirovki-sokraschennaya.md
    type: keystone_axis
    duration_min: 3.5
    assertion: "Конфигурация агента раскладывается на пять слотов; сегодняшний проект задействует два — инструкции-правила и память"
    learning_goal: "Единый слайд карты экипировки — co-building пяти слотов по памяти с Лекции 3, два в фокусе, правило лестницы"
    visual:
      pattern: keystone_scope_map
  # --- Раздел 1. Файл инструкций: 3 кейса — роль/репозиторий, базовые процессы, вложенные файлы (32 мин) ---
  - id: s09
    file: slides/s09-divider-fayl-instrukciy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 1 — файл инструкций: три развилки про один и тот же файл, в том порядке, в котором они встречаются в работе над проектом"
    learning_goal: "Разделитель раздела 1 (macro-уровень: gold 4-сегментный прогресс-бар + номерной значок раздела)"
    visual:
      pattern: section_divider_macro
  - id: s10
    file: slides/s10-divider-keys-1-1-rol-i-repozitoriy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.1 — роль агента и общее описание репозитория: чем заполняется пустой файл инструкций, когда за плечами один прогон"
    learning_goal: "Разделитель кейса 1.1 (micro-уровень: teal 3-сегментный прогресс-бар, без номерного значка раздела). Тег называет тему развилки, не её исход — классификация «день-0 / по сигналу» собирается в разделе 3"
    visual:
      pattern: section_divider_micro
  - id: s11
    file: slides/s11-keys-1-1-problema-overview.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Прототип собран, следующая сессия будет завтра — в CLAUDE.md уже есть строка гейта готовности, остальное пусто, а стандартный первый раздел такого файла называется «Repository overview»"
    learning_goal: "Проблема кейса 1.1 — сценарий-развилка на входе в CLAUDE.md, где кроме строки гейта пока ничего нет. БЕЗ вопроса, БЕЗ карточек, БЕЗ оценки вариантов — они на следующих слайдах"
    visual:
      pattern: problem_scenario
  - id: s12
    file: slides/s12-keys-1-1-vopros.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Выбор из пяти вариантов: что из перечисленного попадёт в файл сейчас, перед следующей сессией"
    learning_goal: "Открытый вопрос кейса 1.1 (звучит ДО исследования) — вопрос с готовым набором вариантов, БЕЗ цифр, БЕЗ источников, БЕЗ таблицы разбора"
    visual:
      pattern: question_with_option_cards
  - id: s13
    file: slides/s13-keys-1-1-issledovanie-i-razbor.md
    type: research_evidence
    duration_min: 5
    assertion: "Repository overview измеримо не повышает успешность и стоит контекста — а структурированное описание, если оно нужно, живёт в README.md и не дублируется в CLAUDE.md"
    learning_goal: "Исследование+разбор кейса 1.1, слитые в один заход после голосования — четыре источника, честный пробел, таблица разбора пяти позиций, целевой ответ и README-плашка на уровне целевого ответа"
    visual:
      pattern: research_and_answer_combined
  - id: s14
    file: slides/s14-keys-1-1-reshenie-pustoy-fayl.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "Описание структуры репозитория в CLAUDE.md не появляется: сигнала для него нет — а первое содержимое у файла появится уже в следующем кейсе, и по другой причине"
    learning_goal: "Решение кейса 1.1 — пустой файл как содержательный итог для repository overview, мостик к кейсу 1.2"
    visual:
      pattern: assertion_visual
  - id: s15
    file: slides/s15-divider-keys-1-2-processy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.2 — базовые процессы: гейт готовности и цикл «план → код → улучшение», записанные в файл инструкций"
    learning_goal: "Разделитель кейса 1.2 (micro-уровень: teal 3-сегментный прогресс-бар, без номерного значка раздела). Тег называет тему развилки, не её исход — классификация «день-0 / по сигналу» собирается в разделе 3"
    visual:
      pattern: section_divider_micro
  - id: s16
    file: slides/s16-keys-1-2-problema-gotovo-raskhoditsya.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Гейт готовности лежит в CLAUDE.md с дня 0 — и дважды подряд «готово» прозвучало до того, как доставку заявки проверили руками"
    learning_goal: "Проблема кейса 1.2 — состояние файла инструкций и что произошло на первой неделе. БЕЗ вопроса, БЕЗ карточек, БЕЗ формулировки решения"
    visual:
      pattern: problem_scenario
  - id: s17
    file: slides/s17-keys-1-2-vopros.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Гейт-фраза уже есть с самого начала и не сработала — выбор из пяти вариантов, что делать дальше, чтобы реально сработало в следующей сессии"
    learning_goal: "Открытый вопрос кейса 1.2 (звучит ДО исследования) — слайд-вопрос с готовым набором вариантов, БЕЗ единой цифры, БЕЗ источника, БЕЗ таблицы разбора"
    visual:
      pattern: question_with_option_cards
  - id: s18
    file: slides/s18-keys-1-2-issledovanie-i-razbor.md
    type: research_evidence
    duration_min: 4
    assertion: "Текстовый гейт без тулинга не просто бесполезен, а вреден — регрессии выросли почти до 10%; ни один из пяти вариантов зала не решает проблему системно, кроме передачи проверки механизму вне текста"
    learning_goal: "Исследование+разбор кейса 1.2, часть 1 (слайд 1.2.4) — две мини-таблицы источников (гейты + цикл улучшения), честный пробел, таблица разбора пяти карточек; формула и развёрнутый блок про хук — на следующем слайде"
    visual:
      pattern: research_and_answer_combined
  - id: s19
    file: slides/s19-keys-1-2-mozhno-li-bez-huka.md
    type: research_evidence
    duration_min: 3
    assertion: "Правила в промпте — просьбы, правила в коде — законы; текстовый гейт ловит честную ошибку, но не держится под давлением — граница для механизма проходит там, где действие, цена и частота названы"
