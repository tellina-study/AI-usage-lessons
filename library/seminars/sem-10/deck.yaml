# Знание вне промта
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 10
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n04    5.50 мин
#   Кейсы      n05–n42   38.00 мин
#   Разбавитель n43–n46    4.50 мин
#   Закрытие   n47–n49    5.00 мин
#   ИТОГО                  53.00 мин при слоте 90

deck:
  seminar_number: 10
  title: Знание вне промта
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 53.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + программные схемы
    экрана n8n.lessons.tellian.io (живой холст недостижим в этой среде, notes/mcp-limitations.md [#233-8])
    + четыре измеренных замера на этом стенде (SberQuAD для текста, CORD для изображений), протоколы в
    `stend/raw/`
  cover_hook: null
  central_question: Как устроить базу знаний, которая растёт?
  language: ru
  slide_count: 49
  axis: Четыре утверждения, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным, по
    строке за кейс
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: База знаний, которая весь прошлый семинар жила внутри промта, сегодня выходит за его пределы
  learning_goal: Обложка. Называет тему занятия и его ступень дуги — знание вне промта (ступень 4), не
    новую механику инструмента.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия на экране нет.

      '
    backup: 'Название — дословно из ARCHITECTURE.md (поле title) и SETKA-KEYSOV.md («Тема занятия»): откуда
      процесс берёт факты и почему считает их верными. Номер занятия на обложке не печатается — решение
      владельца, sem-06/qa/oblozhka-bez-nomera.md, тот же приём, что у обложек С8/С9. Фигуры на обложке
      нет сознательно: вопрос занятия задаётся дословно на n03 и возвращается на n47, и третье место на
      обложке сбило бы счёт этих двух (приём n01 Семинара 9).'
- id: n02
  file: slides/n02-shov-s9-s10.md
  type: content
  duration_min: 1.5
  assertion: 'С9 по плану дуги должен закончиться вопросом, с которого С10 начинается буквально: при каком
    размере базы «всё в промт» перестаёт быть разумным'
  learning_goal: 'Шов С9→С10. Входное состояние названо одной строкой словами, несущая работа кадра —
    критерий, которым по плану дуги должно закончиться прошлое занятие (канон §2 README: шов переносится
    дословно, не пересказывается — здесь применяется к плану дуги, а не к уже произведённому финальному
    экрану С9).'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: строка про входное состояние, под ней дословная цитата вопроса, которым
      закончился С9, под ней строка про то, что растёт.

      '
    backup: 'Объединённый выходной файл С9 (sem-09/stend/sborka.py::student_file()) существует только
      на непромерженной ветке issue-299-sem-09-issledovanie (ARCHITECTURE.md §2, открытая задача шва —
      эскалировано, не решается этим слайдом). Поэтому форма входа здесь — ТОЛЬКО то, что ARCHITECTURE.md
      зафиксировал как критерий, которым по плану дуги должно закончиться С9, не реконструкция всего финального
      экрана (который на непромерженной ветке работы по С9 заканчивается тремя условиями, а не одной фразой-критерием).
      Пять доработок С9 перечислены прозой (ответ клиенту, проверка ответа, полномочие кода на правило
      возврата, устойчивый формат, чтение фотографии) — без схемы узлов: схемы узлов С9 в этом рабочем
      дереве нет, выдумывать её нельзя (канон §8.7 «не реконструировать неизвестное»).'
- id: n03
  file: slides/n03-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Четыре утверждения, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным,
    по строке за кейс
  learning_goal: 'Несущая ось занятия: откуда процесс берёт факты и почему считает их верными. Вопрос
    занятия задаётся здесь дословно и дословно же возвращается на n47. Правая колонка открывается пустой
    и закрывается на n47, не здесь.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, четыре строки. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — дословно из SETKA-KEYSOV.md, раздел «Ось занятия» / rework/section-0-otkrytie.md,
      четыре строки в том же порядке. Вопрос занятия — тоже дословно оттуда. Тот же текст, знак в знак,
      стоит на n47; сверка двух мест обязательна при пересборке. ЗАГОЛОВОК И ПЕРВАЯ СТРОКА — ПРО САМУ
      ОСЬ (Pre-USER-GATE §6): заголовок называет вопрос, которым занятие мерит каждый свой разбор. Четыре
      строки (не шесть, как у С9) — по числу кейсов С10.'
- id: n04
  file: slides/n04-chto-segodnya.md
  type: content
  duration_min: 1.5
  assertion: Четыре кейса подряд и один концептуальный разбавитель; каждый кейс стоит на прогоне собственного
    стенда на реальных данных
  learning_goal: Обзор занятия. Называет четыре кейса по задаче (не по тезису) и разбавитель, без раскрытия
    находок. Матчит паттерн Lec-N-1 раздела «что разбирается сегодня» применительно к семинару.
  visual:
    pattern: content
    primary: 'Короткий список из пяти пунктов (четыре кейса + разбавитель), каждый — одна строка задачи
      без спойлера находки.

      '
    backup: 'Источник — rework/section-0-otkrytie.md, раздел «Что разбирается сегодня», переложено в компактный
      список. Имена кейсов — по задаче (канон §1 проектирования), совпадают с case_track конфига дословно.
      Нюанс про честный провал Кейса 4 (rework/section-0 «Нюанс, который открытие обязано назвать прямо»)
      сознательно НЕ вынесен на этот слайд: спойлер находки здесь нарушил бы А1/С2 (результат раньше самого
      кейса). Он называется в начале Кейса 4 (n34), не здесь.'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Десять пунктов справочника, с которыми Ольга работала на прошлом занятии, — это база на момент
    запуска, не её постоянный размер
  learning_goal: 'Дивайдер Кейса 1. Форма — сцена-продолжение: прямое развитие вопроса, которым закончился
    С9. Называет проблему (А2), измеренного результата не выдаёт.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Название кейса — «Хранение базы знаний», по функции (канон §1 проектирования — задача, не
      тезис/урок), совпадает с case_track дословно. Цитата — прямое продолжение вопроса С9, не придуманная
      сцена: SETKA-KEYSOV.md, Кейс 1, «Форма входа».'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга хочет тот же точный и дешёвый ответ при любом размере базы; версия 1 — просто дописывать
    базу в тот же промт без ограничения
  learning_goal: 'Такт сцены Кейса 1: живая постановка потребности — что хочет Ольга, какая версия 1 естественна,
    и чем она рискует при росте базы. Без вердикта и без числа прогона (правило А6/С2: находка — тактом
    вопроса и разбора, не здесь).'
  visual:
    pattern: problem_scenario
    primary: 'Плашка потребности сверху («точный и дешёвый ответ при любом размере базы»), под ней — три
      альтернативы устройства решения без цифр и вердиктов, под ней — честный вопрос, который сцена оставляет
      открытым.

      '
    backup: 'Потребность и версия 1 — дословно из SETKA-KEYSOV.md / rework/ section-1-khranenie-bazy.md,
      «Постановка». Рядом с версией 1 названы (без разбора) ещё два реально рассматриваемых способа —
      keyword-поиск и векторное хранилище, как и требует постановка кейса целиком (не только вопроса):
      ни цифр, ни преимуществ/недостатков здесь нет, это такт вопроса (n07) и разбора (n08/n09).'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.0
  assertion: Три действия для растущей базы — ни одно не названо победителем заранее
  learning_goal: 'Вопрос Кейса 1: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор (§5 проектирования), а не факт о свойствах инструмента.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, три карточки равной ширины, без доводов и вердиктов. Разбор — следующим
      экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV.md, Кейс 1, «Вопрос залу»: три действия, не факты о возможностях
      инструмента (проверка §5 проектирования — в каждую подставляется повелительный глагол: «продолжать
      дописывать», «искать», «положить»).'
- id: n08
  file: slides/n08-k1-rezultat-zamera.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: 'На 500 документах промт-стаффинг не дорожает — он физически отказывается отвечать: запрос
    превышает контекст модели'
  learning_goal: 'Результат прогона на четырёх размерах базы (10/50/200/500 документов SberQuAD), до качественного
    разбора. Числа — не на глаз: замер gpt-4o-mini + text-embedding-3-small через стенд. Headline-находка
    вынесена отдельной золотой плашкой (правило А11).'
  visual:
    pattern: measured_outcome_table
    primary: 'Компактная таблица 4×3 (размер базы · промт целиком · поиск keyword/vector), под ней golden-плашка
      с headline-числом отказа на 500 документах.

      '
    backup: Числа — SETKA-KEYSOV.md Кейс 1 / stend/raw/case1-results.json, 10 вопросов SberQuAD × 4 размера
      базы (10/50/200/500, 500 добавлен доп. проходом 2026-11-01 по замечанию владельца «текущий замер
      слишком лёгкий») × 3 варианта. «Accuracy» = строгое вхождение эталонного короткого ответа подстрокой
      — занижает абсолютные цифры ОДИНАКОВО для всех вариантов (methodological disclaimer — в заметках,
      не на экране). HTTP 400 текст ошибки — дословно из raw_error поля замера.
- id: n09
  file: slides/n09-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 1.5
  assertion: Два способа отдельного поиска держат одну и ту же низкую цену на любом размере базы — промт-стаффинг
    платит за объём, которого у них нет
  learning_goal: Разбор сразу за результатами замера (А1-производное — здесь разбор идёт за цифрами, а
    не за вопросом напрямую, т.к. С6 кейса оговаривает многосторонний замер разом, не последовательную
    итерацию). 4-колоночная форма «Действие · Как делает · Преимущество · Недостатки» (правило А5), числа
    — с предыдущего экрана.
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Три строки.

      '
    backup: Текст разбора — SETKA-KEYSOV.md Кейс 1 / rework/section-1-khranenie- bazy.md, «Разбор вариантов»,
      уложен в 4-колоночную форму без переписывания по сути. Числа — те же, что на n08, не повторены полностью,
      а свёрнуты до диапазона.
- id: n10
  file: slides/n10-k1-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: Вместо того чтобы передавать модели всю базу, процесс хранит её отдельно и по запросу находит
    только нужные куски
  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента. Слой 2 — экран n8n, следующим слайдом.'
  visual:
    pattern: content
    primary: 'Одна плашка-формула с архитектурным тезисом, без имени инструмента и без имени узла.

      '
    backup: 'Формулировка — SETKA-KEYSOV.md Кейс 1, «Решение», слой 1, дословно. Имён узлов, имени оркестратора
      и латиницы на этом слайде нет сознательно: §2 канона требует от слоя 1 формулировки, которая переживёт
      смену инструмента. Настоящий экран — n11.'
- id: n11
  file: slides/n11-k1-n8n-ekran.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: У n8n 2.42.7 нет готового узла «эмбеддинг через OpenRouter» — и эмбеддинг, и финальный вызов
    модели собраны обычным HTTP Request с предустановленными учётными данными
  learning_goal: 'Слой 2 Кейса 1: программная схема экрана n8n (живой холст недостижим в этой среде, [#233-8])
    с настоящими именами узлов и реальными значениями execution 2112. Врезка держит роль fact, не formula
    (quote_role_force), чтобы не зажимать схему.'
  visual:
    pattern: mechanism_node_graph
    figure: case1-n8n-vector-scheme.png
    primary: 'Программная схема в духе n8n: formTrigger → Embed query (httpRequest) → Simple Vector Store
      (Code, cosine) → Answer (httpRequest, модель). Внизу — врезка про отсутствие штатного узла эмбеддинга
      и результат execution 2112.

      '
    backup: Схема сгенерирована rendered/make_figures_sem10.py по образцу stend/make_figures_case1_case4.py
      — тот же инструмент (n8n_canvas_kit.py), те же реальные числа execution 2112 (needle-1, score 0,590,
      верный ответ про давление выше 35 атм). Это НЕ скриншот — холст n8n недостижим в этой рабочей среде
      (notes/mcp-limitations.md [#233-8]); подпись-дисклеймер внутри самой схемы.
- id: n12
  file: slides/n12-k1-rezultat-obobshchenie.md
  type: content
  duration_min: 1.0
  assertion: Обратившемуся не видно разницы — Ольге видно, во сколько обходится каждый следующий ответ
    при росте базы
  learning_goal: 'Результат и обобщение Кейса 1: что видит обратившийся vs Ольга, и принцип, переносимый
    на любой оркестратор (не только n8n).'
  visual:
    pattern: content
    primary: 'Две плашки рядом: «обратившемуся», «Ольге» — затем плашка-формула переносимого принципа.

      '
    backup: Текст — SETKA-KEYSOV.md Кейс 1, «Результат и обобщение», дословно.
- id: n13
  file: slides/n13-k1-nyuansy-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.0
  assertion: 'Хранилище оправдывает себя ростом базы, а не её наличием: на десяти документах разница некритична,
    на пятистах — её не с чем сравнивать'
  learning_goal: 'Обобщение и граница Кейса 1 прямой формой (А7): «когда нужно · когда не нужно», плюс
    устаревший индекс как типовая проблема ступени (ARCHITECTURE.md §3), подтверждённая логикой, не отдельным
    замером. Первая строка оси занятия закрывается здесь.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Критерий отдельной плашкой наверху, таблица в два столбца «когда нужно · когда не нужно»,
      плашка про устаревший индекс, плашка закрытия первой строки оси.

      '
    backup: Критерий и граница — SETKA-KEYSOV.md / rework/section-1-khranenie- bazy.md, «Нюансы», числа
      — те же четыре размера базы, что на n08/n09, без повтора полной таблицы.
- id: n14
  file: slides/n14-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Куски базы, с которыми работал прошлый кейс, — не десять строчек FAQ, а настоящие многостраничные
    регламенты
  learning_goal: 'Дивайдер Кейса 2. Форма — факт из практики (канон §8.2: форма входа у каждого кейса
    разная). Называет проблему (А2), не решение.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Внизу дорожка четырёх кейсов занятия, второй подсвечен.

      '
    backup: 'Название кейса — «Разбиение документа на части», по задаче, совпадает с case_track. Факт-переход
      — из SETKA-KEYSOV.md Кейс 2, «Форма входа»: куски базы не десять строчек, а настоящие документы.'
- id: n15
  file: slides/n15-k2-stsena.md
  type: problem_scenario
  duration_min: 1.0
  assertion: Версия 1 — резать документ на части фиксированного размера, по счёту символов, не глядя на
    то, где проходят границы предложений
  learning_goal: 'Такт сцены Кейса 2: потребность (нужный кусок не теряет смысл после разреза) + версия
    1 как первая естественная попытка. Без числа прогона (разбор — следующими тактами, после вопроса).'
  visual:
    pattern: problem_scenario
    primary: 'Плашка потребности, версия 1 простой прозой, честный вопрос, который сцена оставляет открытым.

      '
    backup: SETKA-KEYSOV.md Кейс 2, «Постановка», дословно.
- id: n16
  file: slides/n16-k2-vopros.md
  type: question_with_option_cards
