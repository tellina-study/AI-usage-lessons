    type: hero_cover
    section: "Раздел 0. Введение и keystone"
    duration_min: 3
    assertion: "Anthropic: недели работы → часы; MIT: ~95% пилотов якобы дают ноль отдачи — сборка почти бесплатна, а превращение сборки в ценность нет; парадокс — предмет всей лекции"
    learning_goal: "Hook-парадокс: два факта одновременно правдивы; payoff s47"
    learning_outcomes: [LO6]
    chapter_ref: "§0.1 [for-slide-s01]"
    interaction: open_question
    verify_day_of: true
    hero_required: true
    partial_out_strict_in: true

  - id: s02
