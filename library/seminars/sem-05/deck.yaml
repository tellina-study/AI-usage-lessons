    backup: 'СВЕДЕНО СЕССИЕЙ ОБОБЩЕНИЯ (круг 4, стык 7 сверки): шапка второй колонки была «Условие срабатывания»,
      а схема прямо под ней подписывает свои две полосы «широкий матчер» и «узкий матчер» — одно и то
      же названо на одном слайде двумя словами, и зал видит это рядом. Шапка приведена к слову схемы.
      «Матчер» — термин, введённый базой n08 («Событие, матчер, решение») и продиктованный владельцем
      голосом («я не уверен, что в матчере только 3 варианта», 18:13); «условие срабатывания» — его пояснение.
      Остальные семнадцать мест, где пояснение стоит вместо термина, сведены НЕ здесь: это каскад по всей
      деке, и SVERKA-POLNOTY §7 отдаёт его литературной фазе. Круг 4, ПЕРЕЕХАЛ ПОСЛЕ РАЗБОРА и ПЕРЕОФОРМЛЕН
      рамкой. Порядок продиктован владельцем дословно (qa/zamechaniya-golosom-keysy-1-4.txt, 32:36): «дальше
      вопрос, разбор… и разбор, откуда берётся час — тоже хорошие вычисления; как померить у себя — отличный
      слайд, тогда оставляем». Этот же порядок стал сквозным решением круга по правилу А1 (rework-r4/PLAN.md
      §1.2): свидетельства вперёд увести нельзя — AUTHOR-BRIEF §4 запрещает цифры и источники до вопроса,
      — а между вопросом и разбором они стоять больше не могут. СОДЕРЖАНИЕ И ВЫЧИСЛЕНИЯ НЕ ТРОНУТЫ: владелец
      назвал их хорошими. Изменена только рамка: слайд читается как подтверждение разбора («решение принято
      — вот арифметика»), а не как материал к ответу. ОПИСАНИЕ СХЕМЫ ПРИВЕДЕНО В СООТВЕТСТВИЕ С САМОЙ
      СХЕМОЙ: прежний текст обещал «два столбика в одном масштабе, второй выше в сотни раз», тогда как
      схема перерисована ещё в круге 3 (коммит 0a1ca98f) и рисует обе строки на одной линейке без пола,
