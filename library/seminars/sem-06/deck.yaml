    primary: 'Таблица из двух строк: «вторая роль оправдана» и «одна роль дешевле». Внизу — строка оси
      ступени целиком, без сокращений.'
    backup: 'Источник — section-2-subagent.md §A.3 «Критерий» + «Строка оси» + «Переход к следующему занятию»,
      section-2-subagent-part1c.md n63 и завершающий блок, дословно. Закрывающий абзац («Несколько ролей
      вместо одной — решаем по структуре задачи…») — locked-формула (ARCHITECTURE.md §7, litpravka-otchet.md
