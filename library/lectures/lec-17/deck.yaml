# library/lectures/lec-17/deck.yaml
#
# Deck-структура Лекции 17 «Систематизация знаний и навыков — инженерная карта AI» (capstone курса).
# v2 (Phase 8c-1, GATE B restructure): 37 слайдов. Issue #145.
#
# Изменения v1 → v2 (owner GATE B feedback, 7 правок; content-правки 8c-1 = A/B/C):
#   A (#1+#3): intro свёрнут — s01 чистый ТИТУЛЬНЫЙ + s02 keystone сразу; central-question
#              свёрнут в s01 хук; roadmap-слайд удалён; lecture-map перемещён перед Разделом 3.
#   B (#7): убраны ВСЕ ссылки на номера лекций (L4/L5/L10...) из visible + speaker_notes;
#           заменены на «индустрия + памятная деталь кейса».
#   C (#4+#5): удалён s40 (ESO closing hero); QA → последний слайд, упрощён («Вопросы? · До новых встреч»).
#   image_slot: размечен на case-subject слайдах (8c-img уже добыл 26 real images в assets/screenshots/).
#
# Pattern carry-forward от Лекции 15 (merged reference):
#   - section dividers (4 шт.): s03 / s10 / s18 / s27
#   - hero на s01 (clean cover, hero-визуал ≥40% добавляется в 8c-2)
#   - dedicated Q&A slide (s37, последний) — Lec-13/14/15 pattern
#   - lecture-map / 16 отраслей (s19) — lead-in к Разделу 3
#   - roadmap-bar / section markers ТОЛЬКО на dividers + cover (НЕ на каждом content slide)
#
# Keystone (LOCKED owner decision GATE A):
#   2D-плоскость инженерной карты AI. Горизонталь X = Применимость ИИ (AI fit) от
#   детерминированного non-AI до full AI; вертикаль Y = Лестница автономии L0→L5
#   (advisory → fully autonomous). Все 16 отраслей курса — точки на этой плоскости.
#   Предъявлена отдельным keystone-слайдом s02 ДО первого погружения.
#
# Module color coding (для scatter plots; группировка по характеру, не по номеру лекции):
#   Module 1 (основы + ранние отрасли)        → #065A82 (Ocean primary mid)
#   Module 2 (тяжёлая промышленность/оборона)  → #028090 (Teal secondary)
#   Module 3 (инфраструктура/наука)            → #F0AB00 (Gold highlight)

deck:
  lecture_number: 17
  title: "Систематизация знаний и навыков — инженерная карта AI"
  audience: "студенты-инженеры 3 курса (универсальная, не отраслевые специалисты)"
  duration_min: 75
  central_question: "Где AI работает, где — нет, и как это понять?"
  learning_outcomes: [LO1, LO2, LO3, LO4, LO5, LO6, LO7, LO8]
  language: ru
  status: draft
  version: v2
  source: "chapter v3 multi-part (5 parts, ~30 109 слов): chapter.md + chapter-part2.md + chapter-part3.md + chapter-part3b.md + chapter-part4.md"
  plan: "notes/lecture-17/planning/plan-v1.md (GATE A approved v1.1)"
  keystone_axis: "2D-плоскость: Применимость ИИ (X, non-AI → full AI) × Лестница автономии L0→L5 (Y)"
  media_target_share: 0.55

# Final slide list (37 slides). Подробный per-slide контент — slides/sNN-*.md
# Раздел 0 (вход) s01-s02 | Раздел 1 s03-s09 | Раздел 2 s10-s17
# Раздел 3 s18-s26 (s19 — карта 16 отраслей, lead-in) | Раздел 4 s27-s31 | Раздел 5 s32-s36 | Q&A s37
# Section dividers: s03, s10, s18, s27 (s32 — overview-as-intro для R5; Q&A s37 dedicated, последний)
# Hero slides: s01 (title/cover) + s37 (Q&A/closing, hero-визуал в 8c-2)
# Worked examples: s09 (ЖКХ-вода через 7 критериев), s17 (приём экзаменов через лестницу)
# Failure deep-dives: s28-s30 (12 провалов card-grid), s31 synthesis 3 mega-pattern

slides:
