# Архив изображений
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 12
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n09    6.00 мин
#   Кейсы      n10–n79   77.75 мин
#   Закрытие   n80–n88    9.00 мин
#   ИТОГО                  92.75 мин при слоте 90

deck:
  seminar_number: 12
  title: Архив изображений
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 92.75
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + схемы постановки задачи
    (сплошным — то, что уже собрано, пунктиром — то, что предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
    + измеренные замеры на корпусах CORD/SberQuAD (переиспользованы с Семинара 10, часть — новые на этом
    стенде), протоколы в `stend/`
  cover_hook: null
  central_question: Чем читать форму заявки?
  language: ru
  slide_count: 75
  axis: Чем и как описать картинку, чтобы описание было верным и полным — несущий вопрос занятия, сказанный
    владельцем прямо, и сегодня он проверяется на трёх материалах четырьмя кейсами
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Процесс уже читает фотографию и ищет текст по смыслу; сегодня эти два умения складываются
    в архив изображений, который отвечает на вопрос, а не просто хранит файлы
  learning_goal: 'Обложка круга 2 (issue #351). Прежняя обложка круга 1 держала ту же формулировку и не
    ссылалась на состав кейсов по имени — поэтому переносится почти без правки, источник освежён: PEREDELKA-2026-11-24.md
    §1–§3 (новый состав, снятый корпус чеков) и ZAKRYTIE-BRIEF.md §7 (несущий вопрос занятия сместился).
    Обложка не называет ни один из четырёх кейсов и не называет номер ступени дуги — он открытый вопрос
    (ARCHITECTURE.md §6, не решён кругом 2).'
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия и номера ступени дуги на экране нет.

      '
    backup: 'Название и тема — обобщённая формулировка, не привязанная к составу кейсов (устойчива к перестановке
      состава между кругами). Номер семинара и номер ступени дуги на обложке не печатаются — тот же приём,
      что у обложек С6/С8/С9/С11 (sem-06/qa/oblozhka-bez-nomera.md), и отдельно обязателен здесь: ARCHITECTURE.md
      §6 оставляет номер ступени дуги («картинка на входе») открытым вопросом владельцу, присваивать его
      самовольно нельзя. Фигуры на обложке нет сознательно: ось занятия ставится дословно на n05, третье
      место на обложке сбило бы счёт с её будущим закрытием.'
- id: n02
  file: slides/n02-shov-s11-os-zakryta.md
  type: content
  duration_min: 1.0
  assertion: Пять усложнений прошлого занятия измерены, и у каждого своя цена — но все пять про текст,
    и ни одно не спрашивает, что процесс знает о картинке
  learning_goal: 'Шов с С11, один кадр. Перенесено из круга 1 почти без правки: кадр не ссылается ни на
    состав кейсов, ни на корпус круга 2 — он целиком о находках С11. Дословная таблица из sem-11/slides/n100-os-zakryta.md
    остаётся в заметках целиком, на видимом слое — одна строка итога своими словами + наблюдение, ради
    которого кадр существует. Термины С11 (recall@1, HyDE, multi-query) глоссированы по одному слову при
    первом появлении, не оставлены на видимом слое без расшифровки.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: одна строка о том, чем закрылось прошлое занятие, своими словами,
      без терминов и чисел; под ней крупно — наблюдение, ради которого кадр существует.

      '
    backup: Источник наблюдения и чисел — sem-11/slides/n100-os-zakryta.md, раздел «Visual» (таблица перенесена
      в заметки этого слайда полностью, не сокращена). На видимом слое ни одного англицизма без расшифровки
      и ни одной цифры в пунктах.
- id: n03
  file: slides/n03-stroka-s10.md
  type: content
  duration_min: 1.0
  assertion: 'Семинар 10 закрылся обещанием, которое прошлое занятие не трогало: подпись к картинке теряет
    то, что на ней видно, и прямое сравнение картинок на стенде не заработало — и сегодня это обещание
    наконец получает прямой ответ'
  learning_goal: 'Долг С10, перенесён из круга 1 почти без правки (кадр не называет состав кейсов и не
    привязан к корпусу чеков). Дословная цитата закрывающей строки С10 (sem-10/rework/section-6-zakrytie.md,
    раздел «Ось занятия, теперь заполненная», четвёртая строка). Правка круга 2, последняя строка слайда:
    долг адресован не абстрактно «сегодняшнему дню», а конкретно кейсу D этого занятия (PEREDELKA-2026-11-24.md
    §3: «сведённый кейс D ищет по описаниям из предыдущих примеров»), без раскрытия находок D — только
    факт, что сравнение поставлено.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: дословная цитата закрывающей строки С10 — крупно, во весь кадр, двумя
      частями (левая/правая половина исходной строки таблицы). Под ней — одна строка о том, что этот долг
      пережил целое занятие и закрывается сегодня.

      '
    backup: Текст — дословно sem-10/rework/section-6-zakrytie.md, раздел «Ось занятия, теперь заполненная»,
      четвёртая строка. Перенесена крупно и целиком, не сокращена и не пересказана. Последняя строка слайда
      называет кейс, который сегодня ставит прямое сравнение «по словам против по вектору», без спойлера
      его числа — это работа n06, не этого кадра.
- id: n04
  file: slides/n04-stsena-opisanie-ne-otvechaet.md
  type: content
  duration_min: 1.0
  assertion: Архив Ольги принял три новых типа материала за месяц, и у каждого — свой способ описания;
    но то, что процесс записал о снимке, снова и снова не отвечает на тот вопрос, который ему на самом
    деле задают
  learning_goal: 'Сцена вступления круга 2, один кадр (потребность + цена вместе, тот же приём, что круг
    1 — канон требует их вместе). Переписана целиком под PEREDELKA-2026-11-24.md §3: архив круга 1 держал
    сканы чеков, архив круга 2 держит документы (не чеки), фотографии и материалы перед публикацией —
    кадр называет это обобщённо, без чисел и находок конкретных кейсов. Плашка «Цена» берёт формулировки
    цен из собственных сцен кейсов A и B этого круга (rework/section-A-dokumenty.md «Постановка»; rework/section-B-fotografii.md
    «Постановка»), не числа замеров — тот же приём, что был в кадре круга 1 (n11/n51 там). Без спойлера
    находок кейсов. Не повторяет сцену ни одного из четырёх кейсов буквально.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: плашка «Что изменилось» (три новых типа материала, три новых вопроса
      к архиву) и плашка «Цена» (два конкретных случая, которые уже произошли) рядом.

      '
    backup: 'Текст — продюсерское обобщение PEREDELKA-2026-11-24.md §3 (три новых кейса на трёх материалах:
      документы, фотографии, материалы перед публикацией) в вводную, не кейсовую, сцену. Плашка «Цена»
      берёт формулировки цен из «Постановки» кейсов A и B, не числа замеров. Не упоминает кейс C по числу
      или находке — у него пока нет сданного замера (ZAKRYTIE-BRIEF.md §6), только упомянут как новый
      тип вопроса к архиву, без деталей постановки.'
- id: n05
  file: slides/n05-os-zanyatiya.md
  type: keystone_axis
  duration_min: 1.5
  assertion: Чем и как описать картинку, чтобы описание было верным и полным — несущий вопрос занятия,
    сказанный владельцем прямо, и сегодня он проверяется на трёх материалах четырьмя кейсами
  learning_goal: 'Несущая ось занятия круга 2 — переписана целиком (PEREDELKA-2026-11-24.md §3: «несущий
    вопрос занятия сместился. Был — что записать в индекс. Стал — чем и как описать картинку, чтобы это
    было верно и полно»; дословная формулировка — PEREDELKA §1, владелец, 2026-11-24). Ось объявлена ОДНИМ
    кадром, не двумя: прежняя форма («Выглядит надёжным / Чем оказывается», четыре строки по числу кейсов)
    не перенесена — у круга 2 ось не распадается по одной строке на кейс (нити закрытия ZAKRYTIE-BRIEF.md
    §2–§5 идут поперёк кейсов, не по одному на кейс), и повторное предъявление прежней оси студентам,
    которые её не видели, было бы вымышленной историей, не правкой факта. Экономия кадра против круга
    1 (который держал ось на n05 + состав на n06 раздельно, итого тот же счёт кадров) сознательная: заголовок
    и первая строка — про саму ось (Pre-USER-GATE §6).'
  visual:
    pattern: keystone_axis
    primary: 'Вопрос занятия крупной плашкой на верхней половине кадра. Под ним — две плашки рядом: «чем»
      и «как», каждая с короткой расшифровкой. Внизу — одна строка, сколько материалов и кейсов это сегодня
      проверяют, без имён кейсов (имена — на следующем кадре).

      '
    backup: Текст вопроса — дословно PEREDELKA-2026-11-24.md §1 (цитата владельца) и §3 («несущий вопрос
      занятия сместился»). Расшифровка «чем»/«как» — продюсерское пояснение вопроса, не отдельная цитата.
      Число кейсов и материалов — факт состава (PEREDELKA §3), без спойлера находок.
- id: n06
  file: slides/n06-chto-segodnya.md
  type: content
  duration_min: 1.0
  assertion: 'Четыре кейса подряд: что доставать из документа, что записывать о фотографии, есть ли на
    кадре запрещённое, и как по записанному искать'
  learning_goal: Обзор занятия круга 2 — переписан целиком под новый состав (PEREDELKA-2026-11-24.md §3,
    §16). Называет четыре кейса по задаче (не по тезису), в порядке их диапазонов кадров (n10–n69), без
    раскрытия находок — матчит паттерн С10/С11/круга 1 (имена кейсов по задаче, не по выводу). Без минут
    на видимом слое (запрет курса).
  visual:
    pattern: content
    primary: 'Список из четырёх пунктов, каждый — одна-две строки задачи без спойлера находки. Порядок
      пунктов — порядок диапазонов кадров (PEREDELKA-2026-11-24.md §16): документы → фотографии → запрещённое
      → поиск.

      '
    backup: 'Источник — PEREDELKA-2026-11-24.md §3 (столбец «задача») и §16 (порядок диапазонов кадров).
      Имена кейсов — по задаче, не по находке: сетка круга 1 (`SETKA-KEYSOV-KRUG-1.md`) источником этого
      кадра не служит; действующая сетка — `SETKA-KEYSOV.md`. Минут на кадре нет (запрет курса — тайминг
      только во фронтматтере).'
- id: n10
  file: slides/n10-a-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Заявка приходит картинкой, карточку заполняет процесс — а потом сам по ней действует, никого
    не переспросив
  learning_goal: 'Дивайдер Кейса A. Называет проблему (А2), не решение (proektirovanie-keysa-i-voprosa.md
    §1): предмет — чем читать поля входящего скана, не вывод о победе одного метода. Дорожка кейсов занятия,
    первый из четырёх подсвечен. Оборот «ручается» заменён действием (литкритика Н2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка проблемы крупно. Внизу дорожка кейсов занятия, первый подсвечен.

      '
    backup: Имя кейса («Распознавание документов») — задача/функция, не тезис (проверка §1 proektirovanie-keysa-i-voprosa.md).
      Корпус и методы — stend/zamery-A/README.md.
- id: n11
  file: slides/n11-a-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Неверная цифра телефона в карточке заявки стоила слушателю дня задержки, а Ольге — часа ручного
    обзвона
  learning_goal: 'Такт сцены Кейса A (А2, П2 — человек и цена), сквозной персонаж Ольга (А13). Схема постановки
    С1 в том же кадре (forma-keysa-s-zamerom.md §2, донорская форма Кейсов 1/2 этого занятия: сплошное
    — уже работающий поток, пунктир — узел, который кейс решает сегодня; совмещение со сценой держит порядок
    тактов канона дивайдер→сцена→вопрос).'
  visual:
    pattern: problem_scenario
    figure: a-shema-postanovka.png
    primary: 'Сверху — схема С1: сплошной поток «заявка сканом → процесс читает поля → карточка Ольге»,
      пунктирная золотая стрелка на узле решения. Под схемой — сцена Ольги прозой и цена.

      '
    backup: Схема — rendered/make_figures_a.py::a_shema_postanovka, правило С1. Сцена и цена — план кейса
      §2 («Сцена и цена»), kejs-A-dokumenty.md.
- id: n12
  file: slides/n12-a-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре действия для чтения полей скана — не названо, какое из них точнее и какое дешевле
  learning_goal: 'Вопрос Кейса A: четыре карточки-действия, без вердиктов и доводов за/против (А6). Карточки
    — дизайн-выбор, не факт о возможностях (proektirovanie-keysa-i-voprosa.md §5). Разбор — сразу следующим
    кадром (А1). Регистр (§0 брифа issue #351): снято ликбезное определение OCR, заменено инженерной конкретикой
    (движок, режим работы).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, четыре карточки равной ширины, без вердиктов — только довод за каждым
      действием.

      '
    backup: 'Карточки — план кейса §3 («Вопрос залу»), переформулированы действием (proektirovanie-keysa-i-voprosa.md
      §5): глагол действия у каждого варианта, ни один не называет, какой из трёх точнее или дешевле.'
- id: n13
  file: slides/n13-a-razbor-variantov.md
  type: content
  duration_min: 2.0
  assertion: 'Четыре действия — четыре колонки: как делает, что выигрывает, что теряет'
  learning_goal: 'Разбор действия/варианта — единая форма курса (А5): Действие | Как делает | Преимущество
    | Недостатки. Сразу за вопросом (А1), до чисел замера. Находка 5 брифа issue #351: добавлена вывод-плашка
    о риске гибрида (двух рисков вместо одного), найдена находками владельца как кадр без явного вывода.'
  visual:
    pattern: content
    primary: 'Таблица 4 колонки, 4 строки (мультимодальная модель / OCR+правила / гибрид / картинка с
      подсказкой). Плашка вывода про двойной риск — после таблицы. Отдельной строкой — пояснение слова
      «подсказка».

      '
    backup: Форма — канон README.md §3.1 (А5), дословная формулировка владельца. Числа цены — забегание
      из stend/zamery-A/README.md «Модель и настройки», подробный замер — на следующих кадрах, здесь не
      повторяется.
- id: n14
  file: slides/n14-a-mekhanika.md
  type: mechanism_node_graph
  duration_min: 1.25
  assertion: Мультимодальная модель режет скан на патчи и превращает их в токены — чем крупнее скан, тем
    дороже вызов
  learning_goal: 'Механика вызова мультимодальной модели (С5: модель и настройки названы на кадре). Наследует
    подачу Кейса 1 этого же занятия (канон §7 — не переизобретать форму). Литкритика Н46: снят оборот
    «это не абстрактное наблюдение — это измеренное число... не теоретическая оценка».'
  visual:
    pattern: mechanism_node_graph
    figure: a-mekhanika.png
    primary: 'Схема: скан → разбивка на тайлы → патчи-токены → ответ+цена, плашка цены внизу. Отдельная
      плашка — во что обходится подсказка по деньгам и по времени.

      '
    backup: 'Механика — rendered/make_figures_a.py::a_mekhanika. Цена — stend/zamery-A/README.md «Цена
      и время» (100 реальных вызовов, цена посчитана по каждому; Веха 3 issue #351, расширение корпуса
      30→100).'
- id: n15
  file: slides/n15-a-struktura-zamera.md
  type: content
  duration_min: 2.0
  assertion: 100 форм, 4 группы полей, 369 целевых значений — до единого результата
  learning_goal: 'С2 такт 1 (forma-keysa-s-zamerom.md §1): структура теста ДО результатов. Корпус одним
    числом, группы названы и посчитаны, пример вопроса+ответа+причины на группу. Имя модели названо (С5).
    Находка 5 брифа issue #351: добавлена вывод-плашка про устройство корпуса (не про результат — на этом
    кадре его нет). Доводка (Веха 3, issue #351, 2026-11-24): числа обновлены с замера n=30 на замер n=100
    (`stend/zamery-A/README.md`); таблица несёт оба счёта разом: сколько целевых полей в корпусе (369)
