# library/seminars/sem-10/glossary.en.yaml
# Glossary LOCK (EN) — Seminar 10 "Знание вне промта — РАГ" /
# "Knowledge outside the prompt — RAG". First EN track for this seminar
# (issue #172 Bilingual Production Rule, issue #322). All translators of
# slides-en/*.md MUST use these exact forms — no per-agent drift across the
# 4 parallel case batches + the concept interlude. consistency-checker
# verifies slides-en/*.md against this file.

seminar: 10
locked_at: "2026-11-09"

terms:
  # --- Carried over unchanged from sem-08/sem-09 (same referent) ---
  - canonical: "node"
    ru: "узел"
    note: "n8n UI term, always lower-case unless at sentence start. Reused from sem-08/sem-09 — heavily used in sem-10 (Simple Vector Store node, Code nodes, HTTP Request node)."
  - canonical: "knowledge base"
    ru: "база знаний / справочник"
    note: "Reused from sem-09, SAME object continued into this seminar: Olga's 10-item справочник from sem-09 is the sem-10 opening scene's starting point (n05/n06) before it grows past what fits in a prompt. «База знаний» and «справочник» stay synonyms for it here exactly as in sem-09 — do not introduce a third English word."
  - canonical: "request"
    ru: "заявка"
    note: "Reused from sem-08/sem-09: an incoming request/ticket from a training-center client (now often carrying a photo of a form/receipt, Case 4's continuation of the sem-08→sem-09 binary-data line). Not a technical API request."
  - canonical: "requester / client"
    ru: "обратившийся / клиент"
    note: "Reused from sem-09's «client / requester» entry, same two interchangeable RU words for the same person. Render «обратившийся» as 'the requester' and «клиент» as 'the client', matching whichever register the RU slide uses — never invent a third English word."
  - canonical: "administrator"
    ru: "администратор (учебного центра)"
    note: "Olga's own role/title, unchanged from sem-08/sem-09 («Ольга, администратор учебного центра»)."
  - canonical: "boundary"
    ru: "граница"
    note: "Reused from sem-09 (matches sem-08's own slides-en wording too): the fixed closing beat of every case's nuances tact, stated in the imperative plain form the course requires. Heavily used in sem-10 (28 of 83 slides) — every case's Нюансы section closes on one. Keep 'boundary', not 'limit' or 'edge case'."
  - canonical: "task class"
    ru: "класс задачи"
    note: "Reused from sem-09's own entry (matches sem-08's slides-en wording 'the class of task'). The fixed closing phrase of a case's generalization beat."

  # --- New for sem-10: storage, chunking, search (RAG core vocabulary) ---
  - canonical: "chunk"
    ru: "кусок"
    note: "The dominant RU word for this concept across the deck is the plain native noun «кусок» (piece), used in 41 of 83 slides — NOT the anglicism «чанк», which appears only once (n33, in passing). Translate «кусок» as 'chunk' regardless, since that is the RAG-standard English term this course is teaching toward. Code identifiers (`chunk_size`, `chunkFixed`, `chunkStructural`, `chunkWordBoundary`, the field `chunk`) are already English — quote verbatim, do not re-derive them from the RU prose word."
  - canonical: "chunking / splitting (a document into chunks)"
    ru: "нарезка (документа на части) / резать на куски"
    note: "The action Case 2 is about. RU slides say «нарезка» / «резать», not «чанкирование» (which appears nowhere in slides/*.md). EN still renders this as 'chunking' — the English RAG term — even though the RU source avoids the loanword; this is a case of EN-standard vocabulary for a RU-native phrasing, not a 1:1 lexical mirror. Keep 'split' as the verb where the RU sentence structure reads more naturally that way, 'chunk' (verb) where RU uses «резать на куски» as the deliberate action."
  - canonical: "chunk size"
    ru: "размер куска"
    note: "The tested independent variable of Case 2 (120/180/220/300/450 characters). Code identifier `chunk_size` — keep verbatim where quoted as a field name, not prose."
  - canonical: "fixed-size chunking"
    ru: "нарезка фиксированным размером / резать строго по счёту символов"
    note: "Case 2's v1 (the naive first attempt), and the title of its Code node (see notes below — custom RU node titles get translated, unlike stock n8n UI labels)."
  - canonical: "sentence-boundary chunking"
    ru: "нарезка по границам предложений"
    note: "Case 2's v2, the winning option (0–1.4% broken answers vs. v1's 2.8–12.5%)."
  - canonical: "word-boundary chunking"
    ru: "нарезка по границам слов"
    note: "Case 2's v3, added in the 2026-11-02 follow-up pass. Sits between v1 and v2 on every tested size, never beats v2."
  - canonical: "fixed-size chunking with overlap"
    ru: "нарезка фиксированным размером с перекрытием"
    note: "Case 2's v4, also added 2026-11-02. 15% overlap of chunk size; halves v1's broken-answer rate but does not close the gap to v2."
  - canonical: "overlap"
    ru: "перекрытие"
    note: "The v4 mechanism above — do not confuse with Case 4's unrelated 'overlap' sense if one ever appears; in sem-10 this word is Case 2-only."
  - canonical: "vector store / vector database"
    ru: "векторное хранилище"
    note: "Case 1's architectural answer: storing chunks + their embeddings outside the prompt. The n8n stock node is literally named 'Simple Vector Store' — quote that node title verbatim, but render the general RU phrase «векторное хранилище» as 'vector store' in prose."
  - canonical: "embedding"
    ru: "эмбеддинг"
    note: "Already an English loanword in the RU slides (35 of 83 files) — the numeric representation of a chunk's or image's meaning that the vector store indexes and searches by. Code/field names like `EMBED_MODEL`, `Embed query`, `Embed image` are n8n/stend identifiers — quote verbatim."
  - canonical: "keyword search / full-text search"
    ru: "поиск по словам / поиск по совпадению слов / полнотекстовый поиск"
    note: "All three RU phrasings name the SAME option across Cases 1 and 3: matching on word overlap, zero model calls. Render as 'keyword search' in the option-card / comparison-table contexts (matches the n8n node label «Keyword overlap», already English) and as 'full-text search' only where the RU slide itself uses «полнотекстовый» (owner's own explicit industry-terminology instruction, issue #311: 'use industry terms — reranker, full-text, vector search'). Do not silently pick one EN word for both RU phrasings if a slide uses them side by side to make a distinction."
  - canonical: "vector search / semantic search"
    ru: "поиск по смыслу (вектор) / векторный поиск"
    note: "The embedding-based search option, contrasted with keyword search throughout Cases 1 and 3. Render «векторный поиск» as 'vector search'; «поиск по смыслу» as 'semantic search' where the RU slide is making the intuitive pitch ('it understands meaning') rather than naming the mechanism."
  - canonical: "hybrid search"
    ru: "гибридный поиск"
    note: "Case 3's third option: combining keyword and vector signals via RRF before deciding. 12 of 83 slides. The n8n node is literally labelled «RRF fusion (hybrid)» — already English, quote verbatim."
  - canonical: "Reciprocal Rank Fusion (RRF)"
    ru: "Reciprocal Rank Fusion (RRF)"
    note: "Already spelled out in English in the RU slides (8 of 83 files, e.g. n42-k3-rrf-formula.md) with the RU gloss given alongside it on first use — carry the English term straight through unchanged, there is nothing to translate. `k=60` and the formula constant are identifiers — keep verbatim."
  - canonical: "reranker / LLM reranker"
    ru: "реранкер / LLM-реранкер"
    note: "Case 3's 4th/5th option: gpt-4o-mini re-sorts the hybrid's or vector's top-10 candidates by relevance. 15 of 83 slides. Render «реранкер» as 'reranker' and «LLM-реранкер» as 'LLM reranker' (no hyphen needed in English). The node title «LLM-реранкер (gpt-4o-mini)» mixes a RU label with an English model id — translate the RU half to 'LLM reranker (gpt-4o-mini)', keep the model id verbatim."
  - canonical: "bi-encoder"
    ru: "би-энкодер"
    note: "n45's mechanism explainer: query and document are embedded SEPARATELY, compared only as two finished vectors — this is what ordinary vector search does. Contrasted with cross-encoder below; do not merge the two into one English word."
  - canonical: "cross-encoder"
    ru: "кросс-энкодер"
    note: "n45: what a reranker actually is internally — query and EACH candidate are fed into the model TOGETHER, as one input, so the model can read direct word-to-word interaction between them. This is the mechanism-level name for 'reranker'; a slide may use either term depending on whether it's talking about the user-facing action (reranker) or the internal architecture (cross-encoder) — keep both distinct English terms, matching the RU distinction."
  - canonical: "recall@1 / recall@3"
    ru: "recall@1 / recall@3"
    note: "Already English metric notation in the RU slides — carry through completely unchanged, including the @ digit. Do not expand, translate, or rename (e.g. do not write 'hit-rate@1')."
  - canonical: "hit-rate"
    ru: "—"
    note: "Not a term this seminar's slides actually use (the deck uses recall@1/@3 and 'average rank of the correct document' instead) — recorded here only because it is RAG-standard vocabulary a translator might reach for. Do not introduce it into slides-en where the RU original uses recall@1/@3; match the RU metric name exactly, per-slide."
  - canonical: "average rank (of the correct document)"
    ru: "средний ранг (верного документа)"
    note: "Case 3's third metric alongside recall@1/@3 — the mean position of the gold document across the 50-question pool. Keep 'average rank', not 'mean rank' or 'MRR' (this is NOT the Mean Reciprocal Rank formula, just a plain positional average — do not conflate the two even though both are retrieval metrics)."
  - canonical: "distractor"
    ru: "дистрактор"
    note: "Already an English loanword in the RU slides: a document that looks similar to the correct one but isn't it. Case 3 also has the stronger, named-cluster version below — keep the two distinct."
  - canonical: "confusable cluster"
    ru: "путающий кластер"
    note: "Case 3's 2026-11-01 corpus addition: 8 groups of real SberQuAD contexts that deliberately split a single rare entity (e.g. one cluster about Bob Dylan, another about Siberia), making the distractor problem harder than generic noise. Keep distinct from the plain 'distractor' above — a confusable cluster is a specific, constructed device, not any old near-miss document."
  - canonical: "lexical gap"
    ru: "лексический разрыв"
    note: "One of Case 3's three question classes (lexical_gap/exact_match/neutral, `lexical_class` field): a question that shares almost no words with the text containing its answer — vector search's strong zone, keyword search's weak zone."
  - canonical: "exact match"
    ru: "точное совпадение"
    note: "The opposite class from lexical gap: a question whose key number/name is literally present in the source text — keyword search's strong zone. Also used generically elsewhere in the deck (Case 1's cheapest matching option) — same English rendering either way, context disambiguates which specific use is meant."
  - canonical: "neutral (question)"
    ru: "нейтральн[ый/ая] (вопрос)"
    note: "Case 3's third question class: neither a lexical gap nor an exact match — where lexical overlap alone decides nothing either way."
  - canonical: "stale index"
    ru: "устаревший индекс"
    note: "Case 1's named 'typical problem of this rung' (n20/n21): the vector store is a COPY of the knowledge base taken at indexing time — it holds no live link to the source, so a source update that hasn't been reindexed yet is served back confidently and wrongly, with no signal that it's stale. Keep 'stale index' as the fixed noun phrase; 'reindexing' for «переиндексация» (the fix, not a one-time setup step)."
  - canonical: "cutoff threshold"
    ru: "порог отсечения"
    note: "A generic engineering sense of «порог» used in sem-10 (cutoff point in a ranking/comparison), distinct from sem-08/sem-09's REFUND_THRESHOLD constant — there is no refund threshold in this seminar. Translate plainly as 'cutoff threshold' or 'threshold', per sentence; do not import sem-08/09's specific refund framing."
  - canonical: "glyph height"
    ru: "высота символа / высота цифры"
    note: "NOT used in sem-10 — this is sem-09's Case 6 term (image legibility at a given resolution). Recorded here only to flag that sem-10's own resolution-sensitivity findings (Case 4's titan/CLIP tests) use DIFFERENT framing (pixel dimensions of the whole scan, e.g. 300×450, and 64×96 thumbnails) — do not reuse 'glyph height' language when translating Case 4's resolution discussion."

  # --- New for sem-10: multimodal / image search (Case 4) ---
  - canonical: "multimodal embedding"
    ru: "мультимодальный эмбеддинг"
    note: "Case 4's tested-and-failed option (б): embedding an image directly into the same vector space as text, instead of captioning it first. 9 of 83 slides. `voyage-multimodal-3` does not exist on this stend's OpenRouter catalog (452 models checked, zero voyage/embed models); the one working candidate found, `amazon/titan-embed-image-v1`, returns a bit-identical vector for different images at real scan resolution (cosine = 1.0 to 9 decimal places) — a confirmed non-working result, not a weakened version of the option. Keep model ids verbatim."
  - canonical: "Voyage Multimodal 3"
    ru: "voyage-multimodal-3"
    note: "Proper model identifier. ARCHITECTURE.md §5 uses the human-readable form 'Voyage Multimodal 3' in prose; the slides/stend use the literal API id `voyage-multimodal-3` lower-case with hyphens. Match whichever form the specific RU sentence uses — prose name vs. literal id — do not normalize one into the other. Either way: this model DOES NOT EXIST on this stend's OpenRouter catalog; do not let a translation imply it was tested successfully."
  - canonical: "perceptual hash"
    ru: "перцептивный хэш / отпечаток картинки (perceptual hash)"
    note: "Already an English loanword quoted directly in the RU slides (e.g. n62, n68: 'perceptual hash' in Latin script inside RU prose) — carry straight through unchanged. «Отпечаток картинки» ('image fingerprint') is the RU descriptive gloss for the same concept, used alongside the English term on first mention — render as 'image fingerprint (perceptual hash)' to match that pairing where the RU slide itself pairs them, plain 'perceptual hash' elsewhere."
  - canonical: "average hash (a-hash)"
    ru: "average-hash"
    note: "The specific perceptual-hash algorithm used (ARCHITECTURE.md §5), compared by Hamming distance. Already English in source — quote verbatim."
  - canonical: "Hamming distance"
    ru: "расстояние Хэмминга"
    note: "The bit-difference metric (out of 64 bits) perceptual hash similarity is measured by. Standard CS term — translate plainly, do not invent a different phrase."
  - canonical: "CORD (Consolidated Receipt Dataset)"
    ru: "CORD (Consolidated Receipt Dataset)"
    note: "Case 4's image corpus — `naver-clova-ix/cord-v2` on HuggingFace, test split, 30 real receipt/form scans with OCR + semantic field labels. Proper noun / dataset name, spell out on first use exactly as ARCHITECTURE.md §5 does, then CORD on its own. Keep the HuggingFace id `naver-clova-ix/cord-v2` verbatim wherever quoted as a path/id rather than prose."
  - canonical: "CLIP / SigLIP / DINOv2"
    ru: "CLIP / SigLIP / DINOv2"
    note: "n76's 'local, no OpenRouter at all' experiment: industry-standard local image-embedding models (owner's own question from the plan: 'are there really no local embedding models for images?'). CLIP ViT-B/32 is the one actually tested; SigLIP and DINOv2 are named as siblings, not tested. Proper nouns — keep verbatim, never translate or expand."
  - canonical: "OpenRouter"
    ru: "OpenRouter"
    note: "The API aggregator/provider every model call in this seminar goes through (text embeddings, gpt-4o-mini, the reranker, the failed multimodal-embedding attempts). Proper noun — keep verbatim. «OpenRouter-кредэншл»/«OpenRouter-credential» → 'OpenRouter credential' (the n8n credential object, not a translated compound)."

  # --- Case titles (exact divider-slide wording, n05/n22/n39/n59/n77) ---
  - canonical: "Case 1. Knowledge Base Storage"
    ru: "Кейс 1. Хранение базы знаний"
    note: "Divider slide n05. Matches `case_track` entry 1 verbatim, same rule the RU divider follows (its heading must match case_track word-for-word) — the EN divider heading and any future EN case_track list entry must use this exact wording, not a paraphrase."
  - canonical: "Case 2. Splitting a Document into Chunks"
    ru: "Кейс 2. Разбиение документа на части"
    note: "Divider slide n22. Matches `case_track` entry 2 verbatim — same cross-reference rule as Case 1 above."
  - canonical: "Case 3. Choosing a Search Method"
    ru: "Кейс 3. Чем искать нужный кусок"
    note: "Divider slide n39. RU literally reads 'What to search the needed chunk WITH' — i.e. which search method/tool. 'Choosing a Search Method' renders the task (not the RU words one-for-one) the same way sem-09 rendered task-named RU titles into natural English noun phrases. Matches `case_track` entry 3 verbatim — same cross-reference rule."
  - canonical: "Case 4. Image Search"
    ru: "Кейс 4. Поиск по изображениям"
    note: "Divider slide n59. Matches `case_track` entry 4 verbatim — same cross-reference rule. Explicitly the closing case of the binary-data line that started in sem-08 and continued in sem-09 (ARCHITECTURE.md §2) — a translator should not word this as a brand-new, unrelated topic."
  - canonical: "Relevant ≠ Correct"
    ru: "Релевантно ≠ верно"
    note: "The concept interlude's own divider-slide title (n77), distinct from and shorter than the interlude's descriptive name below. This exact three-word form (with the ≠ glyph, not spelled 'not equal to') is what appears ON the slide — keep it verbatim wherever quoting the slide title itself."
  - canonical: "Concept interlude — Google AI Overviews, 'relevant ≠ correct'"
    ru: "Концептуальный разбавитель — Google AI Overviews, «релевантно ≠ верно»"
    note: "The FULL descriptive name used in ARCHITECTURE.md/SETKA-KEYSOV.md section headings (as opposed to the shorter on-slide divider title 'Relevant ≠ Correct' above). 'Interlude' (not 'filler', 'break', 'detour', or 'digression') is the locked English word for «разбавитель» — short, neutral, and the single word used everywhere this concept needs a one-word label, including the `blocks:` list in deck-config.yaml's `en:` block. 'Concept interlude' is the two-word prose form; 'Interlude' alone is the block-label form. Do not vary between sessions/slides."

  # --- Post-translation reconciliation (issue #322 followup, 2026-11-09):
  # ad-hoc calls made independently by the 5 parallel translating agents,
  # verified consistent (or made consistent) across all batches and locked
  # here so the glossary is a true record of what was actually used. ---
  - canonical: "incident"
    ru: "случай"
    note: "Scoped to the concept interlude only (n77–n80): the two real-world failures (Google AI Overviews, NYC's MyCity chatbot). Chosen to avoid colliding with 'Case 1–4' terminology — verified it does not leak into any other RU sense of «случай» elsewhere in the deck (e.g. grammatical 'case' in n11 is a different word and already renders as 'case' correctly, not 'incident')."
  - canonical: "rig"
    ru: "стенд"
    note: "The course's own measurement/demo setup (n8n + stend/ scripts). Verified consistent across all 25 slides using «стенд» in this sense, in every case (1–4) plus intro/closing. Distinct from `stend/` path references, which stay verbatim as identifiers per the notes below."
  - canonical: "tile"
    ru: "плашка"
    note: "A boxed fact/number callout on a slide. Verified consistent (tile/tiles) across all 44 slides using «плашка», spanning intro, all four cases, and the concept interlude — no divergence found."
  - canonical: "frame"
    ru: "кадр"
    note: "The methodology's own term for a single rendered slide (distinct from «слайд», the markdown/text side, and «экран», a literal screen/UI — see n16's own sentence distinguishing «текст слайда» from «кадр»). Case 1's and Case 4's batches used 'frame' consistently; Case 2's and Case 3's batches (plus one intro slide, n02) independently drifted to 'slide' or 'screen' for the same word in ~15 places (the fixed closing line 'Никаких чисел на кадре' alone diverged between n08='frame' and n25/n26/n42/n44='screen'). All found instances fixed to 'frame' — see n02, n08, n09, n25, n26, n27, n28, n29, n30, n41, n42, n43, n44, n45, n46, n47, n49, n53, n64, n65, n70, n74. Where RU itself uses «слайд» or «экран» in the same sentence (e.g. n16, n35, n53's 'the slide no longer references it', n72's 'on one slide'), that distinction is preserved — only «кадр» maps to 'frame'."
  - canonical: "beat"
    ru: "такт"
    note: "A measurement-exposition sub-step (forma-keysa-s-zamerom.md §1, C2). Verified consistent ('beat'/'beats') across all 45 slides using «такт», no divergence found — unlike «кадр» above, this one didn't drift."
  - canonical: "soft duplicate / hard duplicate"
    ru: "мягкий дубль / жёсткий дубль"
    note: "Case 4's two near-duplicate checks for perceptual hash (n72/n74/n75/n76): a plain recompressed copy vs. one with rotation/crop. Verified internally consistent within Case 4; the concept doesn't appear in any other case."
  - canonical: "prompt-stuffing"
    ru: "промт-стаффинг"
    note: "Case 1's named v0 (dumping the whole base into the prompt). Appears well beyond Case 1 — also in Case 4 (n68) and the interlude/closing (n77, n80). Found genuinely inconsistent: the dominant hyphenated form 'prompt-stuffing' (9 instances, n10/n14/n15/n18/n19/n20/n21) competed with an unhyphenated 'prompt stuffing' (n68) and, worse, a mistranslation 'prompt staffing' (n77, n80 ×2) — 'staffing' is not a word this concept means. All four fixed to the hyphenated 'prompt-stuffing'."
  - canonical: "the session's axis"
    ru: "ось занятия"
    note: "The keystone axis named on n03 and closed on n81, referenced again mid-arc on n73. Verified consistent — all three slides (plus n82's indirect reference) use 'the session's axis' with no divergence into 'the seminar's axis' or 'the thread' or similar."

