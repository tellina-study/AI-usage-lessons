    компании
  learning_goal: 'Третья волна (BRIEF-PROIZVODSTVO.md §0/§4): Zillow переписан как полный бизнес-кейс,
    не укороченный разбавитель. Дивайдер и сцена остаются слитыми в один экран (решение с прошлой волны),
    но бизнес-контекст — что такое iBuying и как работал Zillow Offers — теперь явно на экране, не только
    в заметках. Цитата CEO — первой строкой.'
  visual:
    pattern: section_divider_macro
    primary: 'Тёмный экран-сцена. Цитата CEO в две строки с подписью, под ней — ряд из трёх числовых плашек,
      под ними — одна строка-мост к «Одобрению возврата». Номерного значка нет: Zillow вне дорожки кейсов.
      Дорожка блоков занятия внизу — единственное золото экрана.

      '
    backup: 'ВОЛНА 2а «конфетки» (issue #292, план §4.4), полная перевёрстка видимого слоя. Было: четыре
      абзаца курсивом подряд, из которых последний обрезался нижним краем — хвост «составил ~$80 000»
      на рендере просто не виден (дефект волны 0 п.3, починен здесь). Плюс золотой номерной значок «1»,
      обещавший залу первый раздел из нескольких, которого нет: Zillow — разбавитель вне дорожки кейсов
      (ARCHITECTURE.md §6). Стало: цитата сокращена до двух строк многоточием (смысл не менялся — выброшены
      «Мы определили, что», «наблюдаемая», «вообще»), три несущих числа вынесены в ряд плашек (правило
      §5.12 «числа — плашками»), а абзац «что такое Zillow Offers» и полные цифры ($407,9 млн за год,
      9680 куплено / 3032 продано, из которых и считается средний убыток) вплетены в заметки связным текстом.
      Числа на экране — те же, что прежде, с точностью до округления подписи: $304 млн (точно $304,4 млн),
      ~2000 человек (≈25% штата), ~$80 000. Приём слайда назван прежним именем (`section_divider_macro`),
      поменялся ЖАНР, которым дека его рисует, — `macro_scene` вместо `divider` (deck-config.yaml, `genres`).
      Числа сверены слово в слово с SETKA-KEYSOV-S8-part2.md, раздел «Концептуальный разбавитель — Zillow»,
      и library/lectures/lec-05/ chapter-part3.md §5.4 — не менялись с прошлой волны. Бизнес-контекст
      (абзац про iBuying) — новый текст этой волны, по прямому требованию БРИФа §4 («бизнес-контекст:
      что такое iBuying, как работало»), сведён из того же раздела SETKA part2, без добавленных деталей
      сверх источника.'
