    learning_outcomes: [LO1, LO4, LO6]
    references: [vciom-2025-oct, dam-2024-llm-chatbots]
    visual:
      pattern: case_card_with_distribution
      primary: "Кейс корпоративного чата + bar chart 5 LLM РФ multi-select + возврат к central question"

  - id: s18
    file: slides/s18-agent-architecture-schema.md
    type: process
    duration_min: 1.5
    assertion: "Агент = чат + оркестратор + внешняя память + инструменты"
