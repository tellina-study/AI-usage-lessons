- id: n15
  file: slides/n15-k1-panel-poiska.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: Внутри узла «Simple Vector Store» нет отдельной базы данных — это цикл по всем документам
    и косинусное сравнение каждого с вопросом, прямо в теле узла
  learning_goal: 'Слой 2 Кейса 1, такт 2 из 3: настоящая панель настройки узла поиска, РАЗВЁРНУТЫЙ вид
    редактора кода (не сжатый — урок Семинара 9: сжатый вид обрезает текст).'
  visual:
    pattern: mechanism_node_graph
    figure: case1-n8n-vector-panel-real.png
    primary: 'Настоящий скрин развёрнутого редактора кода узла «Simple Vector Store»: JavaScript-функция
      `cos(a, b)` считает косинусное сходство, цикл по `payload.corpus` держит лучший найденный документ.

      '
    backup: 'Источник кадра: `stend/n8n-screenshots-raw/case1-vector-store-panel.png` (узел `Code`, режим
      «Run Once for All Items», язык JavaScript), снят `stend/n8n_shots.py` в РАЗВЁРНУТОМ виде редактора
      (кнопка expand — тот же урок Семинара 9, что сжатый вид обрезает текст). Кроп — `rendered/compose_case1_n8n_shots.py`:
      убраны вкладки Parameters/Settings и поля Mode/Language сверху (служебная часть интерфейса, не код
      узла) и подсказка тулкита снизу; сам код не дорисован и не изменён ни одним символом.

      ЧТО НА КАДРЕ ВИДНО БУКВАЛЬНО: шесть строк кода. Строка 1 читает входной `payload` (вопрос + корпус
      документов с их эмбеддингами). Строка 2 достаёт эмбеддинг вопроса `qvec`. Строка 3 — сама функция
      косинусного сходства, написанная вручную (`d/(Math.sqrt(na)*Math.sqrt(nb))`), без обращения к внешней
      библиотеке. Строки 4–6 — цикл по всем документам корпуса, сравнение каждого с `qvec`, сохранение
      лучшего.

      ЧЕГО НА КАДРЕ НЕТ И ПОЭТОМУ ПРОЗОЙ НЕ УТВЕРЖДАЕТСЯ: отдельного сервиса векторной базы данных. «Simple
      Vector Store» — имя узла n8n, а не название внешнего продукта; хранилище живёт внутри самого payload,
      поиск — обычный перебор в памяти. Это не ограничение именно этого прогона — штатный узел n8n так
      и устроен для небольших корпусов; настоящая внешняя векторная БД понадобится не здесь, а при росте
      базы далеко за пределы того, что помещается в памяти одного вызова.'
- id: n16
  file: slides/n16-k1-panel-otveta.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Промт узла ответа явно запрещает модели выходить за пределы найденного куска: «Отвечай ТОЛЬКО
