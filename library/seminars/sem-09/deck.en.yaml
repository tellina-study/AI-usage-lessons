- id: n73
  file: slides-en/n73-k6-format-vs-sverka.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Checking the response's format caught zero of fifteen wrong dates; cross-checking against
    an independently known value caught all fifteen, with not a single false alarm
  learning_goal: 'The case''s engineering payload: a breakdown between a format check and a cross-check
    against an independent value, on the same measurement''s own data. The two counts of wrong dates (0
    out of 15 and 15 out of 15) are distinguished by captions naming exactly what each one catches; a
    third number — 15 out of 15 correct matches — is physically set apart with the word ''correct,'' even
    though its denominator happens to coincide with the first two after the measurement was topped up.'
  visual:
    pattern: measured_outcome_table
    primary: 'Two cards side by side, each with an explicit caption naming what''s caught: "format check
      — 0 of 15 wrong" and "cross-check against an independent value — 15 of 15 wrong," plus a line about
      there being no false alarms on 15 CORRECT cases — a different count, the same denominator after
      topping up (a coincidence, not a methodological link). Below the cards — an honest caveat about
      where these numbers come from.

      '
    backup: 'Numbers from `stend/zamery-k5-k6/README.md`, Measurement 4.1, section "Cross-Checking as
      a Defense": 15 wrong dates (after topping up the measurement — 5 on each of the three smallest resolutions,
      sizes "eighth," "sixteenth," "thirty-second") — all 15 are valid by the DD.MM.YYYY format, a schema
      check would pass all of them. An independent cross-check against the receipt''s true date (known
      in advance, since this is our own synthetic document) catches all 15 discrepancies with not a single
      false alarm; on 15 cases where the date was correct (sizes "original," "half," "quarter"), the same
      comparison never fires — 15 of 15 correct matches.

      AN HONEST METHODOLOGICAL CAVEAT STANDS ON THE FRAME, not only in the backup: the demonstration is
      built on the DATE, because the date has more failures and they start earlier on the compression
      scale (15 out of 30 attempts, starting at the eighth fraction); on the AMOUNT in this same measurement,
      failures are noticeably fewer — 5 out of 30, only at the smallest, thirty-second fraction (beat
      n70) — but they exist, not zero, after the honest rerun of 2026-10-27 (issue #299). In the real
      case, the independent value is the amount the client typed as text in the request, not an already-known
      truth from the receipt generator; this measurement session didn''t build that cross-check (there''s
      no text field with a stated amount in the measurement''s webhook) — the same mechanism is shown
      on the field where failures are more common, not on the one where they''re fewer.

      The two counts of wrong dates — "0 of 15" and "15 of 15" — are distinguished by captions, "what
      the format check caught" / "what the cross-check caught"; a third number, "15 of 15 correct matches,"
      is physically set apart with the word "correct" from the first two, even though its denominator
      happens to coincide after the measurement was topped up — that''s a coincidence of numbers, not
      a methodological link. A BRIEF §2 requirement.'
