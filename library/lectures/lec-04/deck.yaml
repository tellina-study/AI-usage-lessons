    duration_min: 3
    assertion: "prompt-and-pray — не «плохой инструмент», а пропуск дисциплины: модель молча достраивает требования дефолтами; корень провала — существенная сложность намерения (Brooks), которая не делегируется"
    learning_goal: "[SI] Провал prompt-and-pray + ироничная иллюстрация; урок human-intent = существенная сложность; overclaim «спека=истина»"
    learning_outcomes: [LO1, LO7, LO4]
