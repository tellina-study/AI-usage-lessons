  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Критерий одной плашкой прямой формой — у Zillow один порог риска, не выбор между двумя режимами,
      поэтому не двухколоночная таблица «нужно/не нужно». Под критерием — явная связка с Кейсом 3 второй
      плашкой.

      '
    backup: Текст критерия и связки — дословно SETKA-KEYSOV-S8.md, раздел Zillow, «Критерий». Полный разбор
