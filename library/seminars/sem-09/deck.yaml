  learning_goal: 'Такт сцены Кейса 5: схема С1 (разбор 2026-10-29, К5-1) сверху — существующий процесс
    сплошными блоками, пунктиром то, что разбираем сегодня. Классификация проблемы — прямая (К5-2): не
