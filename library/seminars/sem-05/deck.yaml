  learning_goal: 'Несущая ось занятия, предъявленная пустой таблицей до первого погружения: два вопроса,
    по которым дальше раскладывается каждая ступень. Неприкосновенный слайд, не режется ни при каком дефиците
    времени; ни одна ячейка здесь не заполняется'
  visual:
    pattern: keystone_scope_map
    primary: 'Светлый фон и коробка-таблица, не сетка PPTX. Ведущая строка — про саму ось, набрана формой
      тезиса. Под ней таблица на пять строк и четыре колонки: заполнены только имена ступеней в первой
      колонке, все остальные ячейки — пунктирные пустые слоты. Внизу подписью во всю ширину — единственная
