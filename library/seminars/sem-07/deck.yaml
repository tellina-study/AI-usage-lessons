  learning_goal: 'Разбор карточек предыдущего экрана. Форма — две колонки (правило А5, та же, что в разборе
    кейса A ступени). Каждая из четырёх строк отвечает содержательно: пустых отметок «не тот признак»
    на экране нет. Числа и масштаб — Obermeyer et al., Science 2019. Источник — rework/section-2-routing.md
    §A.2.4, rework/section-2-routing-part3b.md §B.3.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки, две колонки — кандидат и то, что это число считает помимо болезни;
      ячейки короткие, назывными оборотами, строка верного ответа подсвечена. Под таблицей две короткие
      плашки: общее направление всех четырёх и числа кейса вместе со способом, которым посчитано второе
      из них.

      '
    backup: 'ЧТО ИЗМЕРЕНО, А ЧТО РАЗОБРАНО — граница проходит по строкам таблицы. Исследование (Obermeyer,
      Z. et al., «Dissecting racial bias in an algorithm used to manage the health of populations», Science,
      2019, DOI 10.1126/science.aax2342) измеряло ОДИН признак — тот, который алгоритм действительно использовал
      (прошлые расходы), и все числа кейса относятся к нему. Три остальные строки — разбор пути, которым
      число попадает в страховую базу, и ни одна из них не приписывает исследованию замера, которого оно
      не делало; поэтому и заголовок колонки говорит о том, что число считает, без ссылки на замер. Механизм
      доступа, на котором держатся эти три строки, в источниках кейса назван прямо: «poorer patients,
      even when insured, tend to use medical services less frequently or have reduced access to them because
      of time and location constraints», «without a trusting doctor-patient relationship, black individuals
      are less likely to request extra care and end up paying for it» (Scientific American, 24.10.2019,
      разбор того же исследования; прямое чтение страницы). ПРЕЖНЯЯ ВЕРСИЯ ставила в три строки отметку
      «не тот признак» — разбор Опуса назвал это отметкой в бланке вместо разбора; выбран путь «сказать
      про каждую конкретно», потому что четыре кандидата расходятся именно механизмом, а общий для них
