- id: n31
  file: slides/n31-k3-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре действия, спектром от «проверяет сама модель» до «проверяет код» и «не проверяет никто,
    решает частота»
  learning_goal: 'Вопрос Кейса 3: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор, то есть действие, которое можно совершить, а не факт о возможностях
    инструмента (§5 канона замысла кейса).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      слева проверку делает сама модель, справа — код либо частота повторов. Пояснений, доводов и пометок
      на карточках нет, разбор следующим экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S9.md, раздел «Кейс 3», подраздел «Вопрос»; формулировки
      не переписаны. Вопрос в рамке — тоже дословная строка оттуда.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не говорит, сколько вызовов модели стоит, и ни одна не намекает,
      что правильных больше одной. Собственных чисел стенда (0 из 6, 5 из 5, три вердикта на одном тексте)
      на этом экране нет вовсе — им место в тактах n37 и n38. Внешних чисел тоже нет: они стоят экраном
      позже, в разборе.

      Проверка на рамку факта (§5 канона замысла кейса): каждая карточка уже начинается глаголом действия
      — «попросить», «спросить», «прогнать», «прогнать». Ни одна не превращается в утверждение о свойстве
      инструмента («судья ловит смысл, но путает порядок») — все четыре остались действиями, которые можно
      выбрать и собрать.

      Порядок карточек — спектр, а не вразнобой: первая оставляет проверку внутри той же модели, вторая
      зовёт вторую модель, третья не вызывает модель для проверки вовсе, четвёртая отменяет саму идею
      проверки и заменяет её частотой повторов.'
- id: n32
  file: slides/n32-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Три из четырёх действий отдают вердикт о годности ответа той самой машине, которая этот ответ
