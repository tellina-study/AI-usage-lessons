- id: n43
  file: slides/n43-k3-rrf-mekhanika.md
  type: content
  duration_min: 0.5
  assertion: RRF складывает очки документа из обоих списков — наверх выходит самый ровный кандидат, и
    первого места в одном списке для этого мало
  learning_goal: 'Явная просьба владельца (issue #311): «добавь в кейс пояснение что такое rrf». Имя формулы
    уже называет n42; здесь нужны сама запись, её разбор по строкам и числовой пример, профессионального
    уровня. Вставлен между n42 (действия, формула названа по имени) и n44 (четвёртое действие, реранкер)
    — RRF принадлежит третьему действию (гибрид), не четвёртому.'
  visual:
    pattern: content
    primary: 'Плашка с самой записью формулы и смыслом константы, под ней — таблица на пяти учебных кандидатах
      с РАСЧЁТОМ ПО СТРОКАМ: место в каждом списке, очко за это место дробью, сумма очков, итоговое место.
      Числа — учебная иллюстрация механики, не измеренный результат стенда (измеренные числа — на n51/n58
      дальше в этом же кейсе).

      '
    backup: 'k=60 — настоящая константа узла слияния стенда: `stend/measure/ case3_measure.py`, `def rrf_fuse(rank_a,
      rank_b, k=60)`, очко считается как `1.0 / (k + i + 1)` при нумерации мест с нуля, то есть ровно
      1/(60 + место). Проверено чтением файла 2026-11-12. Тот же узел настоящая панель n8n дальше в этом
      кейсе рисует буквальным кодом.

      ПРАВКА 2026-11-12 (issue #311, указание владельца), четыре пункта:

      (1) ФОРМУЛА ВЫНЕСЕНА НА КАДР. Прежняя редакция этого поля объясняла отсутствие формулы ссылкой на
      §5.14 «запрет научной записи» — ЭТО НЕВЕРНОЕ ПРОЧТЕНИЕ ПРАВИЛА. §5.14 запрещает научную запись (степени
      вида 1,687·10⁵, которые со сцены теряются). Под запрет дробь не попадает: 1/(60 + место) произносится
      ровно так, как написана, и владелец прямо попросил её показать: «не хватает самой формулы RRF —
      не только словами, реальная запись».

      (2) РАСЧЁТ ПО КАЖДОЙ СТРОКЕ НА КАДРЕ. Было видно только итоговое место; теперь в таблице стоят очко
      за каждое место и сумма. Округление: очко показано ДРОБЬЮ вместо десятичной записи — сознательно.
      При четырёх знаках после запятой сумма округлённых слагаемых расходится с округлённой суммой (0,0161
      + 0,0156 = 0,0317 при точном 0,031754 → 0,0318), и кадр противоречил бы сам себе на глазах у зала.
      Дробь точна, читается вслух и прямо показывает применённую формулу; единственное десятичное число
      в строке — сумма, округлённая от точного значения до четырёх знаков, как в прежней редакции.

      (3) ДОБАВЛЕНЫ ДВА КАНДИДАТА — те, которых в примере не хватало: Г первый по словам и двадцатый по
      смыслу, Д пятидесятый по словам и первый по смыслу. Оба проигрывают всем трём ровным, и это ЧЕСТНЫЙ
      счёт, не подгонка: при k=60 вес первого места (1/61 ≈ 0,0164) лишь немногим больше веса третьего
      (1/63 ≈ 0,0159), поэтому однобокому кандидату достаточно опуститься в другом списке ниже четвёртого
      места, чтобы проиграть ровному. Порог посчитан: Б набирает 0,032002; кандидату с первым местом остаётся
      0,032002 − 1/61 = 0,015609, что соответствует месту ниже 4,06 — то есть пятому и дальше. Места 20
      и 50 взяты заметно ниже порога, чтобы проигрыш читался без спора. Полная арифметика: А 1/62 + 1/64
      = 0,031754; Б 1/63 + 1/62 = 0,032002; В 1/64 + 1/63 = 0,031498; Г 1/61 + 1/80 = 0,028893; Д 1/110
      + 1/61 = 0,025484. Порядок: Б, А, В, Г, Д.

      (4) ПЛАШКА-ПОДВАЛ СНЯТА. Владелец: «убери случаи в конце». В хвосте кадра был ровно один перечень
      такого рода — нижняя плашка-вывод «Кандидат Б не был первым ни по словам, ни по смыслу — но нигде
      не был и слабым…». Она снята по трём сходящимся причинам: с двумя новыми кандидатами её первая половина
      стала просто неверной (теперь в примере ЕСТЬ кандидаты, первые в одном из списков); написана она
      запрещённым форматом сопоставления (`tools/editorial/README.md` §1); и вывод теперь несёт сама таблица
      — столбцы «сумма» и «итоговое место» стоят рядом. Другого перечня случаев в файле нет: по `git log
      -p` файл создан одним коммитом и правился только этим кругом.

      (5) ЗАГОЛОВОК обновлён с «трёх кандидатов» на «пяти» и помечен учебным характером примера.'
