deck:
  lecture_number: 5
  title: "Лекция 5. AI в финансовом секторе и ритейле"
  audience: "3 курс ИУ6 (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "Финансы и ритейл — отрасли максимального внедрения ИИ. Под какую задачу — какой тип ИИ, почему именно он (а не LLM везде), и где этот тип ломается?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: ru
  status: draft
  version: v1
  source: chapter v2 finalized (~22650 слов, 3 части)
  plan: notes/lecture-5-review/final/plan-v2-final.md (v2-final §4)
  total_slides: 33          # 32 LOCKED (s01–s32) + s04a suffix divider
  curriculum_level: "Модуль 1, вторая отраслевая (после Л4 ПО; Л1–Л3 обзорные)"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # Канонические термины — из glossary.yaml (locked 2026-05-17, chapter v2).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  # forbidden_anglicisms: пайплайн→конвейер, фоллбэк→запасной вариант,
  # эдж-кейс→краевой случай, инсайт→вывод/наблюдение. Оставить: чёрный ящик, скоринг.
  - "единый паттерн карточки типа ИИ (course-scaffold; НЕ в strict-in)"
  - "прогнозирование временных рядов (time-series forecasting)"
  - "distribution shift (дрейф распределения)"
  - "асимметрия цены ошибки"
  - "поиск аномалий (anomaly detection)"
  - "AML (атрибут fraud-задачи, не отдельный тип)"
  - "false positive / false negative (FP/FN), матрица ошибок"
  - "cost-sensitive (стоимостно-взвешенная оценка)"
  - "precision ↔ recall (точность ↔ полнота)"
  - "кредитный скоринг (scoring)"
  - "reason codes (коды причин)"
  - "прокси-предвзятость (proxy bias)"
  - "collaborative filtering / content-based filtering / hybrid recommender"
  - "cold-start / popularity bias / over-specialization / serendipity"
  - "filter bubble (информационный пузырь)"
  - "dynamic pricing (динамическое ценообразование)"
  - "прокси≠цель (единый класс ошибки главы)"
  - "grounding (опора на источник) / fact-checking"
  - "KYC / liveness / hidden human cost"
  - "PII (персональные данные) / ФЗ-152"
  - "circuit-breaker / kill-switch (аварийный выключатель)"
  - "SHAP (метод объяснения вклада признаков)"
  - "iBuying (алгоритмическая скупка жилья)"
  - "augmentation vs замена"

