  - id: s29
    file: slides-en/s29-human-validator-nanda.md
    type: assertion_visual
    section: "Section 5. The decision framework"
    duration_min: 1.5
    assertion: "The agent acts — the human checks the result and the facts; ~95% of pilots with no ROI — it's about integration"
    chapter_ref: "§5.4 [for-slide-s29]"
