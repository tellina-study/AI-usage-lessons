- id: n21
  file: slides/n21-a-dve-opory.md
  type: content
  duration_min: 1.75
  assertion: 'На 151 поле входы расходятся: правило «верь скану» взяло бы 84 поля, модель взяла 75 — и
    в этих девяти почти весь проигрыш метода'
  learning_goal: 'Кадр заведён 2026-11-26 (issue #351) по прямому указанию владельца: при внесении четвёртого
    действия обязательно показать, ПОЧЕМУ оно не повышает точность, и показать собственным кадром, а не
    строкой в своде. Содержание измерено, не выведено: сводный лист `stend/zamery-A/CHISLA-POSLE-PRAVKI-ETALONA.md`
    §5, раздел «Расхождений двух входов», и `README-metod-4.md` § «За кем идёт метод 4, когда два входа
    расходятся». Числа стоят ПОСЛЕ правки эталона (151 из 363, 38%, 24 поля, 50% → 17%); в задании этой
    сессии они были процитированы по отчёту до правки (152, 36%, 25, 44% → 16%) — описка диспетчера, подтверждённая
    им же 2026-11-26 вместе с указанием считать лист последней истиной. Решения владельца курса эта описка
    не касается. Надёжность двух входов названа ПОРОЗНЬ, двумя отдельными строками с подписью у каждой:
    правило §5.14 канона формы запрещает ставить два похожих числа в одну фразу (цена пропуска — «68 участников»
    и «36 указаний», слипшиеся на чтении Лекции 6). Место кадра: после свода (n16), разборов промахов
    (n17-n19) и поворота цены (n20) — поворот называет сделку, этот кадр объясняет, почему у подсказки
    сделки нет вовсе. Шов на вход построен последним абзацем заметок n20, шов на выход — четвёртым критерием
    n22. ПЕРЕДЕЛКА 2026-11-26, круг 2 (находка сессии закрытия, передана диспетчером; подтверждена мной
    независимым пересчётом по raw/scored_all.json с score.normalize). Прежняя редакция кадра несла ЗАМКНУТЫЙ
    показатель: плашки «надёжность скана 75 из ста» и «надёжность подсказки 38 из ста» были 46/61 и 25/66
    — точность ответа ВНУТРИ корзины, а корзины заданы тем, за каким входом пошла сама модель. Довод,
    ставящий точку (формулировка сессии закрытия, сильнее довода «доли посчитаны на разных наборах»):
    будь модель ИДЕАЛЬНЫМ арбитром, она уходила бы за подсказку только там, где подсказка права, и «надёжность
    подсказки в её корзине» вышла бы под 100% — при том что подсказка остаётся худшим входом. Показатель,
    растущий при улучшении того, что он якобы опровергает, не измеряет ничего. Честные числа на ОБЩЕМ
    наборе 151 поля: скан верен 84 (55,6%), подсказка 35 (23,2%), отношение 2,40× — не «вдвое» и не «вчетверо».
    Оба входа неверны на 40 полях, на 8 верны оба сразу (повторяющаяся подпись поля, грейдер принимает
    любой ответ группы) — поэтому 84+35 не равно 119 за вычетом нуля. Несущее утверждение переписано на
    контрфактический счёт: правило «при расхождении верь скану» взяло бы 84 поля, модель взяла 75, и эти
    9 полей есть 9 из 10 полей, которые метод теряет на всём корпусе. Прежний заголовок вывода «модель
    не арбитрирует» снят как слишком сильный: в каждой корзине выбранный вход прав чаще своей базы (75,4%
    против 55,6%; 37,9% против 23,2%), то есть выбор несёт сигнал. Что именно за сигналом — сличение источников
    или чувствительность к трудности поля — замер не различает, и обе версии названы в заметках. Вместо
    равенства 46/61 у обоих методов (оно ТАВТОЛОГИЧНО: корзина «за сканом» определена тождеством их ответов,
    и 46=46 не может выйти иначе) на кадр поставлена честная проверка того же утверждения на наборе, заданном
    ВХОДАМИ: на 212 полях, где подсказка согласна со сканом, метод 1 верен 189 раз, метод 4 — 188. Подтверждения
    текстом не существует как эффекта. Минута поднята 1,5 → 1,75: кадр несёт контрфактический счёт. ПРАВКА
    ФОРМЫ 2026-11-26 (issue #351, круг формы `n82a`): вывод-плашка несла семь чисел внутри прозы (84 ·
    75 · десять · девять · 212 · 189 · 188), и несущая пара кадра — та, что стоит в его же `assertion`,
    — лежала внутри предложения, тогда как два ПОДЧИНЁННЫХ факта (надёжность скана 84/151, подсказки 35/151)
    имели каждый свою плашку. Иерархия была перевёрнута. Контрфактическая пара вынесена отдельной плашкой
    третьей в ряд с теми двумя («взяло бы 84 поля · взяла 75 · разница 9»), остальное содержание плашки
    осталось на месте; следствие «девять из десяти потерянных» переехало в неё же следующей фразой. Полосой-таблицей
    пара НЕ делалась сознательно: замер показал два предупреждения ПОДГОНКИ вместо одного и кегль полосы
    11 pt (ниже пола 12 pt, §5.12), тогда как плашка стоит вровень с соседями на 11,5 pt и попутно подняла
    основную таблицу кадра с 10,5 до 11,5 pt. Остаётся одно предупреждение ПОДГОНКИ (таблица 1,90″ при
    бюджете 1,92″) — кадр и прежде шёл по верхней границе высоты. Числа не менялись ни одно; заметки не
    тронуты.'
  visual:
    pattern: content
    primary: 'Плашка-экспозиция (на скольких полях входы разошлись и что считали), таблица трёх исходов
      с точностью каждого против точности одной картинки на тех же полях, две отдельные плашки надёжности
      входов (порознь, с подписью у каждой), вывод-плашка. Механизм «подсказка передаёт ошибку» (36 полей,
      12 против 17, случай `Fcbruary`) снят с видимого слоя в заметки: кадр не выдерживал пятой плашки
      по высоте, а владелец разрешил решать это по месту. Разобранный случай владельца сохранён целиком
      — он произносится, а не читается с экрана.

      '
    backup: 'Числа — stend/zamery-A/CHISLA-POSLE-PRAVKI-ETALONA.md §5 (строки «Расхождений двух входов»,
      «Скопированных ошибок распознавания»). Определение «ответ взят из распознанного текста» названо
      в README-metod-4.md до счёта, не подобрано под результат: нормализованный ответ непуст, является
