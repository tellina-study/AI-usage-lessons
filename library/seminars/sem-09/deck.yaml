      `Response Format`, `Presence Penalty`, `Timeout`, `Max Retries`, `Top P`, `Provider Routing`. Счёт
      сделан по самому снимку, построчно.

      ИМЯ УЗЛА В КАДР НЕ ПОПАЛО: кроп уходит в раскрытый список `Add Option`, который перекрывает верхнюю
      строку диалога с названием. Поэтому имя названо словами на этом же кадре — оно прочитано с заголовка
      диалога того же самого снимка до кропа, точно так же, как на n35 имя узла Кейса 3 прочитано с соседнего
      кадра, а не придумано.

      ПРОВЕРКА ВТОРОЙ И ТРЕТЬЕЙ КАРТОЧЕК РАЗБОРА ПО ЭТОМУ ЖЕ СНИМКУ: `Provider Routing` присутствует в
      списке доступных, но не добавлена — блок маршрутизации провайдера у этого узла в принципе есть (карточка
      2 опирается на реальную возможность). Параметра `seed` в списке нет ни в каком виде — не переименован,
      не скрыт за другим словом, просто отсутствует (карточка 3 ссылается на то, чего у узла нет физически).

      Что сознательно НЕ показано: содержимое поля промта (оно то же самое, что в Кейсе 1, и уже было
      на кадре n11) и сам ответ модели — тот приходит на следующих тактах. Id узла, id сценария и webhook-адрес
      на кадре не видны (канон §3).'
- id: n60
  file: slides/n60-k5-tri-ishoda.md
  type: measured_outcome_table
