    assertion: "Агенту теперь регулярно нужно смотреть issue репозитория и готовить черновики правок; вы почти готовы подключить официальный сервер доступа к трекеру — выберите, что проверите до того, как это сделать, и в каком порядке"
    learning_goal: "Открытый вопрос ступени 5 — вопрос с готовым набором вариантов, БЕЗ цифр, БЕЗ источников, БЕЗ таблицы разбора, БЕЗ намёка на ответ"
    visual:
      pattern: question_with_option_cards
  - id: s41
    file: slides/s41-svidetelstva-shesti-istochnikov.md
