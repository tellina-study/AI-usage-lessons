    дальше не строится, и это сказано прямо, не спрятано'
  learning_goal: 'Схема, а не захват дерева: тот же способ честной пометки, которым мостик этого же занятия
    уже отметил скилл. Занятие о границе контекста агента не прячет собственную недостроенность: демо-репозиторий
    дальше не строится, и это сказано прямо, той же меткой, что у скилла'
  visual:
    pattern: state_cards
    primary: 'Ведущая строка — пометка «СХЕМА, НЕ СНИМОК». Под ней — светлая таблица-коробка на шесть
      строк, не тёмный терминал: верхние четыре строки повторяют таблицу мостика без изменений (хук, скилл,
      CLAUDE.md, DECISIONS.md), две новые строки — сегодняшние ступени, обе с меткой «по плану, коммита
      нет». Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.2. Демо-репозиторий дальше не строится (`SPLIT-PLAN-6-7.md`
      §1, решение владельца): артефакты MCP и роли субагента в `tellina-study/signup-landing-demo` не
      появятся. Метка у обоих — та же, что у скилла на мостике этого занятия: «по плану, коммита нет».
      Имена `.mcp.json` и `diff-reviewer.md` не изобретены — это артефакты кейса 1 каждой ступени, подтверждённого
      материалом полностью (`research/setka-keysov.md` §1.1, §2.1); подтверждено при сшивке — сданные
      разделы используют ровно эти пути без изменений (`section-1-mcp.md` §A.1.7, `section-2-subagent.md`
      §A.1).

      Круг правок владельца (issue 225, §А4): моноширинный листинг с двумя версиями репозитория (прежняя
      форма этого слайда, зеркально n02) заменён на светлую таблицу — правило «тёмные блоки кода и терминальные
      врезки переводятся в светлую форму» действует на весь деку, не только на названные слайды. Деление
      на «ветка main» / «ветка seminar-5-hook» снято тем же решением, что и на n02: это внутренняя деталь
      git-истории, а не состояние, которое читает инженер, открывший проект.

      Ревизия (issue 225, круг 2, сверка слайда с разделом): та же находка, что на n02 этого занятия,
      — шесть отдельных блоков `**Название**` + путь + статус через пустую строку не распознаются разборщиком
      как отдельные карточки (его формат `cards` — одна строка, пункты через «·»), текст схлопывался в
      один слитный абзац. Заменено на таблицу той же формы, что на n02/n03/n65 этого занятия; факты и
      пути не изменились.'
- id: n67
  file: slides/n67-tot-zhe-vopros-vtoroy-raz.md
  type: reflection_question
  duration_min: 1.5
  assertion: Тот же вопрос открытия, дословно, второй раз за занятие; зал отвечает снова, и вслух называется,
    у кого ответ изменился и что именно его изменило
  learning_goal: 'Закрытие петли, открытой на n04: вопрос предъявляется дословно второй раз, и отвечает
    на него зал, а не лектор. Полный разбор того, что за занятие стало проверяемым, — на следующем слайде'
  visual:
    pattern: reflection_question
    primary: 'Напоминание о первом предъявлении — тихой формой реплики. Сам вопрос — дословно тот же,
      в gold-рамке, вместе со вторым вопросом про изменение ответа. Карточек-вариантов нет, как и при
      первом предъявлении.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.3. Формулировка — дословно та же, что на n04 этого занятия,
      новая, под идею круга правок владельца (issue 225, §А2): агент упирается в границы собственного
      контекста, часть работы требует данных снаружи, часть — отдельного исполнителя с урезанными правами.
      Отвечает зал: сначала — у кого ответ изменился, потом два-три голоса — что именно изменило. Лектор
      свой ответ не называет и чужие не оценивает.'
- id: n68
  file: slides/n68-chto-stalo-proveryaemym.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Из шести сегодняшних кейсов опору несут два — статус сервера и урезанные права роли; остальные
    четыре опираются на документированное исследование, которое одной командой на занятии не воспроизвести
  learning_goal: 'Чем занятие кончается: не список файлов, а то, про что можно задать проверяемый вопрос
    и получить ответ командой. Асимметрия между двумя опорами и четырьмя её отсутствиями проговаривается
    вслух, один раз на всё занятие'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на шесть строк: кейс, опора («есть» / пусто), чем проверяется. Строки в порядке
      блоков и кейсов этого занятия. Ни одна строка не подсвечена — целевого ответа здесь нет. Под таблицей
      — абзац, не зависящий от итоговой сетки, и единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.4. Опоры проверяемости — репозиторий курса (self-incrimination,
      роли без урезанных прав) и машина студента (`claude mcp list`, `/mcp`, `/skill-doctor`, `/context`).
      Итоговая сетка — единственное место занятия, где счёт назван целиком: опору несут кейс 2 MCP и кейс
      1 субагента — ровно те два, что предсказывал `research/setka-keysov.md` §3 до написания разделов.
      Четыре клетки без опоры — не недосмотр: большинство материала здесь — документированное исследование
      (CVE, arXiv, GitHub issues), которое одной командой в аудитории не воспроизвести.

      Круг правок владельца (issue 225, §А2): закрывающий абзац ссылался на «разницу между отчётом и фактом»
      — формулировку арки, которую круг снял целиком. Заменена на формулировку под новую несущую мысль
      занятия: агент упирается в границы своего контекста, расширяет его данными снаружи или отдельным
      исполнителем, и у каждого расширения своя цена; необъявленный пробел в том, что из этого проверяемо
      прямо сейчас, стоил бы дороже объявленного. Строка «четыре из пяти, пятая — процесс — впереди» снята
      (§А1): ось занятия — четыре строки, все четыре закрыты осью занятия.'
