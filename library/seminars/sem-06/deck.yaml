    backup: 'Источник — section-2-subagent-part1a2.md §A.2 «Механика границы», section-2-subagent-part1c.md
      n48. Круг 3 владельца (issue 225): перенесено как граница кейса о параллелизме. Пересмотр по сторителлингу
