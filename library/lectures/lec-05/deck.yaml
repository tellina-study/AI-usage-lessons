# сняло вопросы залу) · totals.share_notes противоречил totals.time_by_role_min в том же
# файле · glossary_lock числил «эталонный набор», снятый вместе с переделкой s24b.
# Σ хронометража после сведения: 101,6 мин (объявлялось 98,1 при 54 записях; +1,5 s14a
# +2,0 s36c). Оба новых слайда несли свой duration_min в .md с момента появления —
# отсутствовали они именно в манифестах, не на диске.
# Прежняя (первая) сверка 2026-09-30: манифесты объявляли 56 / 102,1, факт был 54 / 98,1.
# Снято владельцем при той правке: s05 (keystone-повтор, аргумент сжат в s06) и s54
# (чек-лист, содержание в s53). Пересобраны по содержанию: s04 и s24c.
