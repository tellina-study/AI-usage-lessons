  learning_goal: 'Требование оркестратора по итогам Вехи A1: разделить промахи гибрида на поломку формата
    против содержательной ошибки — числом, не предположением. Измерено, не постулировано. Литкритика Н18
    (заголовок — предмет, не наш метод счёта), Н27 (снята производственная кухня «оркестратор спросил»),
    Н14 (снята самопохвала «проверено честно»). Доводка (Веха 3, issue #351, 2026-11-24) — переписано
    по содержанию, не подставлены цифры: на n=100 поломок формата 0 (было 5/65=7,7%), включая ту же форму
    `83594639`, что ломалась на n=30 — на этом прогоне она распарсилась корректно. Новый центр кадра:
    это НЕ значит, что риск исчез — вызов недетерминирован (температура не задана явно), и частота этого
    отказа не измерена стабильно ни одним из двух прогонов (1 случай на n=30, 0 на n=100 — обе точки реальны
    и расходятся сильнее, чем сам риск). Старая вывод-плашка «если починить формат — +5 полей» снята:
    с 0 поломками нечего чинить, расчёт утратил почву. Класс «уверенно-неверно» у гибрида вырос и по доле
    (53,3%→60,3%), и в абсолютных числах (32→88) — подтвердился на большем объёме, не ослаб; параллельно
    у мультимодальной модели (см. n16/n17) тот же по природе класс «уверенно почти то» дал обратную картину
    — доля упала (19%→10,7%), но абсолютное число выросло (5→8): это усиление находки на большей выборке,
    а не её ослабление, несмотря на падение доли.'
  visual:
