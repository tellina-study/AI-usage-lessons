<rect x="270" y="365" width="60" height="60" fill="#F0AB00" stroke="#21295C" stroke-width="3"/><text x="300" y="402" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#21295C">0.7</text>
<rect x="340" y="365" width="60" height="60" fill="#1C7293"/><text x="370" y="402" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
