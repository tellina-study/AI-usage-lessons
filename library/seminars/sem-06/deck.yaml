      225, fact-check round 2, 2026-10-05): ячейка MCP цитировала вывод разбора способов доступа («сначала
      нужно ли вообще, потом права, потом цена») в формулировке, которую круг правок уже заменил на другую
      (разбор n12 теперь заканчивается выбором между удалённым и локальным сервером, не порядком трёх
      вопросов) — цитата не отражала то, что сейчас говорит разбор. Заменено на единственный факт, который
      остаётся верным и подтверждён n19: права урезаются до подключения, не после, и без вычеркнутой строки
      воспроизводится документированная эксфильтрация.

      Вторая прожарка (issue 225, P2, методист): колонка «предотвращаем / решаем» у строки MCP называла
      весь блок «предотвращаем», хотя по ARCHITECTURE.md §4 ось блока MCP смешанная — кейс 1 действительно
      предотвращает урезанием прав до подключения, кейсы 2 и 3 решают: как проверить то, что уже подключено,
