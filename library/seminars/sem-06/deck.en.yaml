      the frame. The second arrow, "2 — MCP over the network", leaves the agent, crosses the machine''s
      boundary and goes into a dashed frame "SOMEBODY ELSE''S MACHINE" with the second server in it. From
      each server an arrow "request" runs to the right, into the panel "EXTERNAL SYSTEM": four lines —
      the issue tracker, a database, a reporting mart, an internal service — and each with its own protocol
      mark (REST, SQL, GraphQL, gRPC). Under the diagram, two columns of general comments: who talks to
      whom and what comes back. At the bottom a gold bar: one server can go into several systems at once,
      into each in that system''s own way, and the agent does not know those ways.'
    backup: 'Round 5 of the owner''s edits (issue 225, ZADANIE-KRUG-5.md, verbatim): "ahead of the mcp
      one-pager add a diagram slide marking the user''s machine with the agent on it, and then the variants
      — the server on the machine and it goes into the external system, the server external and it goes
      into the external system. with some general comments on how mcp works. by the way show that it can
