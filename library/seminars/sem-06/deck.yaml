- id: n38
  file: slides/n38-stsena-otvet-poluchil-pravku-nachal-zanovo.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'Разработчик получил верный ответ на вопрос да/нет, прочитав сорок файлов, — и вернувшись
    к правке, ради которой открывал сессию, обнаружил, что агент переспрашивает объяснённое утром: окно
    занято чужим чтением, час ушёл на повтор'
  learning_goal: 'Завязка кейса: объём чтения, нужного для короткого ответа, никак не связан с длиной
    самого ответа, а платит за это человек — временем, потраченным дважды на одно объяснение. Узнаваемая
    рабочая ситуация (лимит тарифа разбросан по кодовой базе), не сконструированная под мораль — владелец
    прямо отверг «примеры из пальца» в прошлом круге. Пересмотр по сторителлингу (issue 225, правило П2):
    сцена перестала описывать состояние системы и стала эпизодом сквозного героя занятия с названной ценой;
    она же предъявляет целиком второй промах открытия («нужное влезло внутрь и вытеснило работу», n04,
    строка вторая). Решение не называется'
  visual:
    pattern: problem_scenario
    primary: 'Пять шагов нумерованным списком: чем была занята сессия с утра, вопрос технического директора,
      где на самом деле живёт лимит (четыре точки), сколько файлов нужно открыть, чтобы ответить честно,
      и что случилось при возврате к собственной правке. Внизу выделенная строка: цена — час на повторное
      объяснение, и прямая отсылка ко второму промаху открытия.'
    backup: 'Сцена круга 3 владельца (issue 225), переписанная пересмотром по сторителлингу (PERESMOTR-STORITELLING.md,
      причина 2 «в занятии нет людей и нет цены» + правило П2). Было: безличное описание состояния — «лимит
      живёт не в одном месте», «набирается больше сорока файлов», «правка остаётся лежать в той же вкладке».
      Факты те же, промаха и цены не было ни у кого. Стало: эпизод того же разработчика, который два занятия
      подряд заводил в этом проекте хук и скилл, с ценой, названной в понятном залу: час на повторное
      объяснение правки и сессия, начатая заново. Класс сцены — ровно тот, что назвал владелец: «понять,
      где в проекте живёт некоторое поведение, и для этого прочитать десятки файлов». Деталь (лимит участников
      тарифа, разбросанный по middleware / конфигу / миграциям / клиенту) — обычная ситуация любого продукта
      с тарифными планами; демо-репозиторий занятия для честной сцены на сорок файлов слишком мал, поэтому
      сцена идёт в рабочем продукте героя, и это сказано на экране первой же строкой, а не подразумевается.
      Правка выбрана намеренно НЕ связанной с самим вопросом (выгрузка отчёта), чтобы было видно: контекст
      занимает чтение, а не предстоящая работа. ДЕНЬ НЕДЕЛИ НЕ НАЗВАН НАМЕРЕННО: открытие (n04) называет
      этот промах средой, и той же средой названа сцена первого кейса блока MCP (n09) — другой эпизод;
      третье вхождение слова закрепило бы путаницу. Связь с открытием держится содержанием («второй промах,
      предъявленный целиком»), а не датой, поэтому сведение вправе проставить день с любой стороны, не
      трогая этот слайд.'
- id: n39
  file: slides/n39-vopros-chto-delat-s-etim-chteniem.md
  type: reflection_question
  duration_min: 0.75
  assertion: Вопрос да/нет, а ответ собирается из контроллера, пяти конфигов, пятнадцати миграций и десятка
    тестов — зал выбирает карточку и называет вслух, за счёт чего она выигрывает
  learning_goal: 'Вопрос классу без подсказки целевого ответа. Карточки называют варианты, не решение:
    чтение самому / коллега / субагент в своём окне / скилл на будущее / ответ без проверки. Пересмотр
    по сторителлингу (issue 225, правило П1): зал просят назвать ПРИЧИНУ выбора вслух — почти наверняка
    прозвучит «быстрее», и поворот кейса на следующем слайде опровергает именно произнесённую залом версию,
    а не воображаемую. Разбор — на следующем слайде'
  visual:
    pattern: question_with_option_cards
    primary: Золотая коробка по центру с дословным вопросом, надзаголовок «· ВОПРОС», подпись «разбор
      — на следующем слайде». Пять карточек равной ширины внизу, ни одна не подсвечена.
    backup: 'Слайд круга 3 владельца (issue 225). Карточки сформулированы так, чтобы развести время чтения
      (не меняется ни одним вариантом) от места чтения (меняется только третьим). Пересмотр по сторителлингу
      (PERESMOTR-STORITELLING.md, правило П1 «у каждого кейса свой поворот»): прежде вопрос просил выбрать
      карточку, а догадку «так будет быстрее» справка велела гасить на месте — поворот на следующем слайде
      опровергал версию, которую зал вслух не произносил, и потому читался как уточнение. Теперь вопрос
      требует назвать основание выбора вслух, и справка велит записать прозвучавшее слово, а не спорить
      с ним. Прежняя формулировка хвоста («скажите, что именно выбранный вариант меняет: время чтения
      или что-то другое») снята: она подсказывала, что ответ «время» неверен, то есть обезвреживала догадку
      до того, как та прозвучит.'
- id: n40
  file: slides/n40-razbor-bystree-ne-stalo-te-zhe-sorok-faylov.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: 'Произнесённая залом версия «быстрее» проверяется счётом и не подтверждается: роль открывает
