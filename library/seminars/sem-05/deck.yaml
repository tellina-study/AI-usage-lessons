  visual:
    pattern: answer_breakdown_table
    primary: Таблица на три колонки и пять строк по форме А7. Ни одна строка не подсвечена. Под таблицей
      — строка вывода, затем правило третьего лица.
    backup: 'СВЕДЕНО СЕССИЕЙ ОБОБЩЕНИЯ (круг 4, стык 9 сверки): золотая подсветка четвёртой строки снята.
      Эталон формы А7 — n10 кейса 1, и его backup говорит прямо: подсветка в грамматике деки означает
      «целевой ответ» и пред-объявляла бы его, поэтому её сняли вместе с ярлыком. Из шести разборов деки
      подсвеченной строка оставалась только здесь — n20, n29, n38, n59 и сам n10 жирного в колонке вариантов
      не имеют ни одного. Вывод под таблицей называет выбор словами («Четвёртую берём потому, что…»),
      так что подсветка ничего не добавляла, кроме второго, более раннего объявления того же ответа. Форма
      приведена к А7 (круг 4). Две проверки, на которых стоит кейс, не потеряны: первая («откроется, когда
      надо») легла в колонку «где работает», вторая («промолчит, когда не надо») — в «ограничения», потому
      что промах второй проверки и есть ограничение редакции. Ярлык «единственная редакция, проходящая
      обе» из клетки убран — вывод стоит отдельной строкой и выводится из сочетания колонок (PLAN-part2.md
      §К5). Законность третьей редакции названа прямо, как требует А7 для случая «оба варианта имеют место
      быть». Запрет первого лица приводится дословно по официальным best practices; «не сообщает когда»
      названо официальной причиной несрабатывания — формулировка документации, а не оценка курса.'
- id: n49
  file: slides/n49-cobuilding-tri-varianta-frontmattera.md
  type: cobuilding
  duration_min: 1.0
  assertion: Два наивных фронтматтера ломаются каждый по своей причине; третий собирает зал — по одному
    предложению на каждый из трёх вопросов
  learning_goal: Собираем описание вслух на настоящем артефакте. Каждый наивный вариант ломается по своей
    причине, и обе причины названы. Рядом — официальные примеры «как не надо», дословно
  visual:
    pattern: cobuilding_description_assembly
    primary: 'Сверху — таблица трёх вариантов: у первых двух причина поломки названа, у третьего ячейка
      отправляет к вопросам. Ниже — таблица трёх вопросов и того, куда ложится каждый ответ. Собранного
      фронтматтера на этом слайде НЕТ — он на следующем.'
    backup: 'Третья строка таблицы намеренно не несёт ответа, и собранный фронтматтер вынесен на отдельный
      слайд: пока ответ напечатан рядом с вопросом, диктовать залу нечего — владелец вернул этот дефект
      отдельным замечанием. Шапка «Спрашиваем у зала» снята по правилу А4 (круг 4): это указание лектору,
      а не материал; осталось «Вопрос». Формат вопросов повторяет приём, которым собирался хук. Три запрещённые
      формулировки и одобренный пример убраны с экрана ради места и целиком лежат в заметках — дословно
      по официальным best practices. Описание — артефакт для демо-репозитория signup-landing, каталог
      .claude/skills/deploy/, на дереве помечен «по плану, коммита пока нет».'
- id: n50
  file: slides/n50-cobuilding-chto-prodiktoval-zal.md
  type: cobuilding
  duration_min: 1.0
  assertion: 'Три ответа зала складываются в одно поле: что делает — третьим лицом, по каким словам звать,
    и где сработать не должен'
  learning_goal: Ответ на три вопроса предыдущего слайда. Показывается ТОЛЬКО после того, как зал продиктовал
    свои формулировки — иначе диктовать нечего
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Одна моноширинная карточка: собранный фронтматтер с подписью, что он собран из трёх ответов.
      Ниже — две проверки, которыми его проверяют в обе стороны.'
    backup: 'Слайд отделён от вопросов намеренно: пока собранное описание напечатано рядом с вопросами,
      зал читает ответ вместо того, чтобы его давать. Нижняя карточка — один из возможных ответов, а не
      эталон: если формулировки зала другие, берутся они, важен состав, а не слова. Артефакт для демо-репозитория
      signup-landing, на дереве помечен «по плану, коммита пока нет».'
- id: n51
  file: slides/n51-cobuilding-telo-naivnoe-i-chego-net.md
  type: cobuilding
  duration_min: 0.75
  assertion: 'Тело без литеральных команд задачу не решает, а переносит: угадывание переезжает из файла
    инструкций внутрь скилла'
  learning_goal: 'Вторая половина сборки: тело скилла. Наивный вариант валиден и срабатывает — и именно
    поэтому его дефект незаметен. Рабочий вариант называет по одной команде на шаг, и ровно один способ'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Наивное тело из общих слов, под ним — в чём его дефект. Ниже — тот же список шагов с пустыми
      местами под команды: их называет зал. Собранного тела на этом слайде НЕТ — оно на следующем.'
    backup: 'Команды вынесены на следующий слайд: пока они напечатаны рядом с вопросом «какой командой»,
      называть залу нечего. Сами команды взяты из артефакта демо-репозитория signup-landing (research/mechanics-4-skill.md
      §3). Шагов пять, литеральных команд три: четвёртый и пятый шаги — ручная проверка и запись, и на
      слайде они так и выглядят, без выдуманной команды.'
- id: n52
  file: slides/n52-cobuilding-telo-kotoroe-prodiktoval-zal.md
  type: cobuilding
  duration_min: 1.25
  assertion: 'Пять шагов, у каждого названо действие целиком: три литеральные команды и два шага, которые
    исполняются руками'
  learning_goal: Ответ на вопрос предыдущего слайда. Шагов пять, команд три — и это сказано вслух, вместо
    того чтобы придумывать команды там, где их нет. Рядом с каждой командой сказано, что она делает
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Одна моноширинная карточка: тело из пяти шагов с командами на местах, где они есть. Под
      ней — разбор трёх команд словами. Ниже — официальное правило про один способ и честная арифметика
      «шагов пять, команд три».'
    backup: 'Время поднято с 0,75 до 1,25 минуты (круг 4): на слайде пять шагов, три литеральные команды
      и у каждой теперь пояснение словами — прожарка круга 3 насчитала здесь 45 секунд на 229 слов и назвала
      их непроходимыми. Разбор команд словами добавлен по правилу А9 («неоднородная аудитория»): команды
      внутри карточки не комментируются, чтобы не портить артефакт, пояснение стоит отдельной таблицей
      под ним. Слайд отделён от вопроса намеренно: пока команды напечатаны рядом с вопросом «какой командой»,
      называть залу нечего. Команды взяты из артефакта демо-репозитория signup-landing (research/mechanics-4-skill.md
      §3); четвёртый и пятый шаг команды не имеют, и выдуманной на слайде нет.'
- id: n53
  file: slides/n53-proval-sfokusirovannyy-obgonyaet.md
  type: failure_vignette
  duration_min: 1.0
  assertion: Сфокусированный скилл обгоняет исчерпывающий набор на той же выборке задач — интуиция «раз
    пишу, напишу полным» измеримо проигрывает
  learning_goal: 'Провал уже принятого решения: описание написали правильно, а тело раздули. Направление
    подтверждено первоисточником, числового разрыва в работе нет — и это сказано на слайде, а не скрыто'
  visual:
    pattern: failure_vignette
    primary: 'Таблица двух строк: интуиция и что измерено против неё. Ниже — официальная рекомендация
      про объём отдельной формой. Внизу — оговорка пунктиром про отсутствующее число.'
    backup: 'Первоисточник — SkillsBench: «сфокусированные скиллы максимум с тремя модулями обгоняют более
      крупные или исчерпывающие наборы», та же 87-задачная выборка, варьируется структура скилла. Слово
      «модуль» в работе НЕ РАСКРЫТО — файл, раздел, вложение? — поэтому из видимого слоя снято целиком,
      осталось направление без жаргона. Числовой размер разрыва из работы тоже не извлечён: процента на
      слайде нет, и его отсутствие названо вслух. КРУГ 4, СОКРАЩЕНИЕ 1,50 → 1,00: пункт 3 CUT-ORDER.md,
      взят под три правки о переносимости (n03 третья колонка, n64 разбор переноса, n65 объяснение). Видимый
      слой не тронут — обе строки таблицы, рекомендация и оговорка о силе утверждения на месте; сжата
      речь: 136 слов → 125, выброшены повторы того, что и так написано на слайде. Пункт выбран не нами:
      CUT-ORDER называет этот провал самым слабым из пяти провалов деки — направление без числа.'
- id: n54
  file: slides/n54-granitsa-dokuda-reshaet-opisanie.md
  type: criteria_boundary
  duration_min: 1.0
  assertion: Одного описания хватает, пока спутать скилл не с чем и зовут его теми же словами; дальше
    решает уже не текст описания
  learning_goal: 'Предел применимости кейса: докуда судьбу скилла решает его описание и что берут за этим
    пределом. Третья строка снимает ложную безальтернативность — автовыбор можно и выключить'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Две плашки бок о бок: докуда описания хватает и что берут за пределом. Построчно парами.
      Внизу — вопрос залу и переходная строка.'
    backup: 'Прежняя редакция плана предела у этого кейса не предусматривала — считалось, что у описания
      границы нет. Прожарка показала обратное: кейс оставался единственным, из которого зал уходил с ответом
      «как надо» и без ответа «до каких пор». Третья строка опирается на флаг disable-model-invocation
      (research/mechanics-4-skill.md §2.1): при true скилл вызывается только явно, а модель его описание
      не видит вовсе. КРУГ 4, СОКРАЩЕНИЕ 1,50 → 1,00: пункт 1 CUT-ORDER.md, взят под три правки о переносимости
      (n03 третья колонка, n64 разбор переноса, n65 объяснение). ВОПРОС НЕ СНЯТ — владелец про содержание
      сказал «оставляй», и CUT-ORDER писался на случай нехватки времени В АУДИТОРИИ, а не на случай правки.
      Сокращён ТАКТ сбора: вместо двух-трёх собранных примеров — один, и дальше. Освобождённые 0,50 мин
      — это ровно время, когда говорил зал, и других 0,50 мин на этом слайде нет: речь и так 125 слов
      при норме 120–130 для слота 1,00. Видимый слой не тронут: все три строки предела, вопрос и переходная
      строка на месте. ЧТО ЭТО СТОИТ: единственное место блока, где зал прикладывает материал к своей
      работе, становится короче; CUT-ORDER ставит этот пункт первым именно потому, что смысл третьей строки
      — выключенный автовызов — читается как критерий и без собранных примеров.'
- id: n55
  file: slides/n55-divider-takoy-skill-uzhe-napisan.md
  type: section_divider
  duration_min: 0.5
  assertion: 'Задача стоит сегодня, готовое чужое решение на неё уже есть, а своё — это недели работы:
    решаем, что в этом случае делать'
  learning_goal: Разделитель кейса про чужой скилл. Называет наблюдаемую развилку приобретения — срок
    против срока — и не называет, чем кейс кончится
  visual:
    pattern: section_divider_macro
    tag: 1 официальный скилл · 4 замера · 3 условия отказа
    primary: Тёмный Ocean-фон, заголовок, золотая линия. Ниже — смысловая строка, затем тег со счётом
      кейса. Внизу — дорожка разделов занятия.
    backup: 'Круг 4, правило А2: заголовок переименован от наблюдаемой проблемы. Прежний — «Такой скилл
      уже написан — и лучше, чем напишете вы. Вопрос в том, что вы вместе с ним впускаете» — владелец
      назвал негодным образцом дословно, в одном списке с «Хук не ломается — он замедляет» и «Вынести
      процедуру легко»: это утверждение автора о мире, а вторая половина вперёд разбора называет сам вывод
      кейса. Новый заголовок держит форму, которую владелец произнёс сам («Решаем, что делать, когда…»),
      и ограничен тем, что человек наблюдает: срок задачи и срок своей работы. Про исполняемый код в заголовке
      не сказано ничего — это целевой ответ развилки 6, и развилка остаётся починенной (qa/roast3-redaktor-metodika.md
      §2). Тег называет счёт: один официальный скилл (провал), четыре замера (свидетельства), три условия
      отказа (разбор).'
- id: n56
  file: slides/n56-stsena-svoy-za-nedeli-ili-gotovyy-segodnya.md
  type: problem_scenario
  duration_min: 1.25
  assertion: Задача решается готовым скиллом сегодня или своим за недели; и качество готового при этом
    честно выше
  learning_goal: 'Сцена кейса: настоящая развилка приобретения, а не собственный фронтматтер. Сильная
    сторона готового названа первой и не занижена — иначе решение фальшивое'
  visual:
    pattern: problem_scenario_with_figure
    figure: skilly-svoy-ili-gotovyy.png
    primary: 'Сверху — задача и то, что готовое решение на неё уже существует. Ниже — схема выбора: своё
      против готового по четырём меркам, с последней строкой, где своё выигрывает. Внизу — реплика про
      момент, когда решение принимается.'
    backup: 'Официальный скилл разбора PDF существует и описан в документации Agent Skills; его описание
      приведено там дословно как образец хорошего — «Extract text and tables from PDF files, fill forms,
      merge documents». Оценка «недели» — не измерение, а оценка объёма работы, и на слайде она так и
      подписана. Сцена намеренно не про наш репозиторий: прежняя сцена этого кейса повторяла сцену предыдущего,
      и владелец назвал её дублем. Таблица сравнения снята: она повторяла схему строка в строку, а схема
      богаче — четыре мерки против трёх. Это и освободило схеме её ширину, вместо того чтобы поджимать
      саму схему. Круг 4: содержание слайда и схемы не тронуто, заметка переписана по А5 на две части.
      В прежней заметке говорилось «первые две строки таблицы» и «третья строка — единственная, где своё
      выигрывает» — счёт остался от снятой таблицы сравнения: в схеме мерок четыре, и своё выигрывает
      по четвёртой. Со схемы снята строка «четвёртая — единственная, ради которой стоит этот кейс»: это
      разговор про устройство занятия, запрещённый AUTHOR-BRIEF §3 п. 5.'
- id: n57
  file: slides/n57-baza-chto-prihodit-vmeste-so-skillom.md
  type: base_and_edge
  duration_min: 0.75
  assertion: Вместе со скиллом приходит каталог с исполняемым кодом, который запускается с правами вашей
    сессии, а разрешение вы даёте один раз
  learning_goal: 'База кейса: чужой скилл — не текст, а каталог с кодом. Кромка — разрыв между разовым
    разрешением и постоянными правами: содержимое может измениться после того, как вы согласились'
  visual:
    pattern: base_and_edge
    primary: 'Две равные дорожки: слева что физически приходит вместе со скиллом, справа разрыв между
      разовым разрешением и постоянными правами. Под базой — три термина пилюлями, под ними — одна строка
      о том, что из этого уже показывали и что здесь новое.'
    backup: 'Устройство каталога и запуск скриптов через оболочку — официальная документация, та же, что
      на структурном слайде n40. Разрыв «разовое согласие, постоянные права» описан академической таксономией
      как single-approval persistent trust model; на слайде он назван по-русски и без ссылки. Круг 4:
      добавлена строка, честно называющая повтор. Прожарка круга 3 нашла необъявленный повтор в этом кейсе
      и потребовала назвать его вслух, а не заставлять зал гадать, «это новое или я уже слышал». Наряд
      адресовал требование этому слайду по нумерации прожарки (там кейс 6 — это n53–n61, сдвиг на два);
      сам повтор замеров живёт на n60 и там уже помечен словами «уже видели». Повтор ЭТОГО слайда — другой
      и настоящий: состав каталога (тело, вложения, скрипты рядом) показан на карте скиллов n40 целиком,
      и зал его действительно уже видел. Новое здесь — чьи права достаются скрипту и сколько раз спрашивают
      согласие; строка это и разделяет. Слайд стоит до вопроса, цифр и источников не несёт и правилу А1
      не противоречит — поэтому остаётся на месте.'
- id: n58
  file: slides/n58-vopros-berete-ili-pishete.md
  type: reflection_question
  duration_min: 1.25
  assertion: 'Выбор из пяти карточек: что делаете с готовым чужим скиллом, который объективно лучше вашего
    будущего'
  learning_goal: 'Открытый вопрос кейса. Без цифр, без источников, без выделений. Карточка «не ставить»
    — не соломенное чучело: у неё есть законная область, и разбор её называет'
  visual:
    pattern: question_with_option_cards
    primary: Завязка тихой формой, вопрос в золотой рамке, под ним пять равных карточек. Ни цифр, ни источников,
      ни выделений.
    backup: 'Подводка не оценивает ни одну карточку: она повторяет расклад сцены и передаёт решение залу.
      Целевой ответ — порядок из двух шагов, и это сказано словом «делаете», а не подсказкой. Карточка
      «не ставить вовсе» получает в разборе настоящую область применения, а не роль отвергнутой. Круг
      4: карточки и подводка не тронуты — развилка 6 была сломана и починена в круге 3 снятием одного
      предложения подводки, и статус терять нельзя. Разбор n59 встаёт вплотную за этим слайдом (правило
      А1); свидетельства n60, стоявшие между ними, уехали за разбор. Слот 1,50 → 1,25: четверть минуты
      отдана n61, где прожарка нашла незакрытую дыру. Проверено замером: произносимая часть заметки —
      1,25 мин слота хватает с запасом, потому что на слайде вопроса говорит зал, а не лектор. Заметка
      переписана по А5 на две части; справочная разбирает, что зал назовёт по каждой из пяти карточек.'
- id: n59
  file: slides/n59-razbor-vychitat-potom-stavit.md
  type: answer_breakdown
  duration_min: 2.0
  assertion: Сначала вычитать то, что исполняется, потом ставить; для необратимого — ставить с выключенным
    автовызовом. «Не ставить» тоже имеет свою область
  learning_goal: 'Разбор всех пяти карточек по единой форме: где вариант работает конкретными случаями
    и чем ограничен. Решение следует из сочетания колонок и стоит отдельной строкой под таблицей, а не
    ярлыком в клетке'
  visual:
    pattern: answer_breakdown_table
    primary: Таблица на три колонки и пять строк, ни одна строка не подсвечена. Под таблицей — строка
