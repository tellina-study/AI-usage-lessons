- id: n23
  file: slides/n23-divider-odin-ball-raznaya-tyazhest.md
  type: section_divider
  duration_min: 1.75
  assertion: Коммерческий алгоритм риск-прогнозирования, которым пользуются госпитали и страховщики в
    США, превращает данные пациента в один балл, и этот балл решает, кто попадёт в программу усиленного
    наблюдения, а кто дождётся следующего обострения
  learning_goal: 'Дивайдер кейса Optum, форма — число (правило П3: дивайдеры кейсов разной формы; у соседних
    кейсов ступени это реплика и вопрос). Называет проблему и её цену для человека сразу, до механики.
    Масштаб назван числом (~200 млн человек/год). Источник — rework/section-2-routing-part3b.md §B.1,
    ARCHITECTURE.md §5.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, два числа крупно (17,7% → 46,5%), под ними одна приглушённая строка: что
      значит каждое из чисел, что означает остаться снаружи программы, и на каком масштабе это считается.
      Внизу — дорожка трёх кейсов ступени, второй подсвечен.

      '
    backup: 'Числа и масштаб — Obermeyer, Z. et al., «Dissecting racial bias in an algorithm used to manage
      the health of populations», Science, 2019, DOI 10.1126/science.aax2342. Независимо перепроверено
      оркестратором (SVERKA-PLAN.md п.3) — совпадает точно. Цена для человека («ждать, пока болезнь обострится»)
      поднята из заметок на экран по разбору Опуса: в прежней версии дивайдера человека на экране не было
      вовсе, были две доли и масштаб.'
- id: n24
  file: slides/n24-stsena-odin-ball-raznaya-tyazhest.md
  type: problem_scenario
  duration_min: 2.0
  assertion: При одном и том же балле риска у чёрных пациентов в среднем на 26,3% больше активных хронических
    заболеваний — разрыв держится у всей группы сразу и в одну сторону, поэтому это свойство самого алгоритма,
    а шум измерения так себя не ведёт
  learning_goal: 'Сцена кейса Optum: замер вместо таблицы из двух строк и один конкретный человек на экране.
    Довод «шум гасится усреднением, смещение от усреднения крепнет» готовит вопрос следующего экрана.
    Источник — rework/section-2-routing-part3b.md §B.1.'
  visual:
    pattern: problem_scenario
    figure: optum-c5-odin-ball-dva-stolbika.png
    primary: 'Схема во всю ширину: два столбика разной высоты, под каждым одна и та же подпись «один и
      тот же балл риска»; прирост правого столбика залит золотом и вынесен числом (+26,3%). Под схемой
      — один конкретный человек из правого столбика и формула про шум против систематического смещения.

      '
    backup: '26,3% — замер исследования среди пациентов самого высокого разряда риска (Obermeyer et al.,
      Science, 2019; формулировка сверена прямым чтением разбора Scientific American от 24.10.2019: «among
      all patients classified as very high-risk, black individuals turned out to have 26.3 percent more
      chronic illnesses than white ones (despite sharing similar risk scores)»). Разряд назван прямо на
      схеме — иначе число читалось бы как свойство любой пары пациентов с одинаковым баллом. Состав расходов
      («те же деньги ушли на экстренные визиты при обострениях диабета и давления») — оттуда же: «black
      patients tended to pay for more active interventions such as emergency visits for diabetes or hypertension
      complications». Прежняя версия слайда показывала таблицу из двух строк «белый пациент / чёрный пациент»
      с качественной оценкой «заметно тяжелее»; замена на замер и на одного человека — по разбору Опуса.
      Множественное число в подписях к столбикам обязательно: 26,3% измерены по группам, пара конкретных
      людей таким числом не описывается. Схема рисуется `rendered/make_figures_c5.py`.'
- id: n25
  file: slides/n25-vopros-chem-zamenili-potrebnost-v-pomoshchi.md
  type: reflection_question
  duration_min: 1.75
  assertion: Расы на входе алгоритма нет ни в одном поле; вопрос в том, что из четырёх доступных чисел
    он взял вместо непосредственно неизмеримой «потребности в помощи» и почему такой выбор уводит результат
    по линии расы
  learning_goal: Вопрос кейса Optum. Четыре карточки одинаково правдоподобны, выбор идёт рассуждением
    о том, что каждое число успевает накопить по дороге в базу, а не узнаванием. Источник — rework/section-2-routing.md
    §A.2.3, rework/section-2-routing-part3b.md §B.2.
  visual:
    pattern: question_with_option_cards
    primary: 'В золотой рамке — вопрос дословно. Под рамкой четыре равные карточки в фиксированном порядке,
      ни одна не подсвечена. Ни цифр, ни источников на экране.

      '
    backup: 'Порядок карточек сохранён прежний (диагнозы · расходы · препараты · обращения), чтобы таблица
      разбора читалась с этим экраном строка в строку: каждая из четырёх карточек получает там свою строку
      с содержательным ответом.'
- id: n26
  file: slides/n26-razbor-proshlye-raskhody-kak-podmena-potrebnosti.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: Алгоритм взял прошлые расходы на здравоохранение; расходы складываются из каждого оплаченного
    контакта с медициной, поэтому вместе с тяжестью болезни в них записана история доступа к ней, и алгоритм
    выучил обе связи разом
  learning_goal: 'Разбор карточек предыдущего экрана. Форма — две колонки (правило А5, та же, что в разборе
    кейса A ступени). Каждая из четырёх строк отвечает содержательно: пустых отметок «не тот признак»
    на экране нет. Числа и масштаб — Obermeyer et al., Science 2019. Источник — rework/section-2-routing.md
    §A.2.4, rework/section-2-routing-part3b.md §B.3.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки, две колонки — кандидат и то, что это число считает помимо болезни;
      строка верного ответа подсвечена. Под таблицей — вывод про общее направление всех четырёх и формула
      с числами масштаба.

      '
    backup: 'ЧТО ИЗМЕРЕНО, А ЧТО РАЗОБРАНО — граница проходит по строкам таблицы. Исследование (Obermeyer,
      Z. et al., «Dissecting racial bias in an algorithm used to manage the health of populations», Science,
      2019, DOI 10.1126/science.aax2342) измеряло ОДИН признак — тот, который алгоритм действительно использовал
      (прошлые расходы), и все числа кейса относятся к нему. Три остальные строки — разбор пути, которым
      число попадает в страховую базу, и ни одна из них не приписывает исследованию замера, которого оно
      не делало; поэтому и заголовок колонки говорит о том, что число считает, без ссылки на замер. Механизм
      доступа, на котором держатся эти три строки, в источниках кейса назван прямо: «poorer patients,
      even when insured, tend to use medical services less frequently or have reduced access to them because
      of time and location constraints», «without a trusting doctor-patient relationship, black individuals
      are less likely to request extra care and end up paying for it» (Scientific American, 24.10.2019,
      разбор того же исследования; прямое чтение страницы). ПРЕЖНЯЯ ВЕРСИЯ ставила в три строки отметку
      «не тот признак» — разбор Опуса назвал это отметкой в бланке вместо разбора; выбран путь «сказать
      про каждую конкретно», потому что четыре кандидата расходятся именно механизмом, а общий для них
      вывод (все смещаются в одну сторону) без разобранных строк звучал бы утверждением без опоры.'
- id: n27
  file: slides/n27-divider-proverka-prohodit-chisto.md
  type: section_divider
  duration_min: 1.5
  assertion: 'Кейс Optum вскрыли одним сравнением: удобный признак против прямого измерения нужной величины.
    В налоговом кейсе это сравнение проходит чисто — и разрыв по расе всё равно появляется'
  learning_goal: 'Дивайдер кейса C. Форма — утверждение-обещание поворота, четвёртая форма дивайдеров
    деки после цитаты, цифры и вопроса (правило П3). Обещает именно поворот этого кейса, а не повтор вопроса
    кейса Optum (правило П1): инструмент, который зал получил экраном раньше, здесь отработает и ничего
    не найдёт. Источник — section-2-routing.md §A.3.1, rework/section-2-routing-part4b.md §B.1.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, заголовок-утверждение крупно, золотая линия под ним. Ниже — одна смысловая
      строка про то, что переносится между кейсами. Внизу — дорожка трёх кейсов ступени, кейс C подсвечен.
      Цифры на дивайдере нет намеренно: 2,9–4,7× впервые появляется на следующем экране, вместе со сценой.

      '
    backup: Источник — section-2-routing.md §A.3.1, part4b.md §B.1. Довод «один случай показывает инцидент,
      два случая с разной механикой показывают закономерность» остаётся частью заметок дивайдера и отдельным
      тезис-слайдом не разворачивается. Прежний заголовок этого дивайдера повторял вопрос кейса Optum
      («Как число, в котором расы вообще нет, даёт результат, разный по расе?») — снят опус-ревью как
      повтор вопроса, на который зал уже знает ответ.
- id: n28
  file: slides/n28-stsena-irs-pismo-o-proverke.md
  type: problem_scenario
