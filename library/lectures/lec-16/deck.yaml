# library/lectures/lec-16/deck.yaml
#
# Deck-структура Лекции 16 «AI в нефтегазовой отрасли и добыче ресурсов».
#
# Phase 5+6 multi-artifact pipeline. Issue #144.
# Source: plan-v2 (42 slides) + chapter v2.1 (5 parts, ~32k слов).
#
# Pattern carry-forward от Лекции 14:
#   - 42 слайдов
#   - Section dividers: s06 (Q1), s13 (Q3), s21 (Q2), s28 (Q4), s34 (Russia)
#   - cover (s02), lecture-map (s04), keystone (s05), Q&A (s41)
#   - Hero на s01 (Permian VIIRS NASA Earth Observatory, ≥40% area)
#     + s42 (MethaneSAT global methane map EDF/Google февраль 2026, ≥40% area)

deck:
  lecture_number: 16
  title: "AI в нефтегазовой отрасли и добыче ресурсов"
  audience: "студенты-инженеры 3 курса (универсальная, не отраслевые специалисты)"
  duration_min: 75
  central_question: "В каком квадранте матрицы данные × физика AI становится мультипликатором классических методов, а где он либо essential, либо опасен — на материале 10 documented failures индустрии 2014-2026?"
  learning_outcomes: [LO1, LO2, LO3, LO7]
  language: ru
  status: draft
  version: v1
  source: "chapter v2.1 multi-part (chapter.md + chapter-part2.md + chapter-part3.md + chapter-part4.md + chapter-part5.md, ~32k слов)"
  plan: "notes/lecture-16-review/2026-05-27-phase1-plan/plan-v2.md"
  keystone_axis: "Матрица данные × физика (2×2 quadrants): Q1 mature production, Q2 methane MRV, Q3 frontier exploration, Q4 energy transition"

# Slide structure (42 slides, plan-v2):
#
# Section 0 — Введение + keystone (≈7 минут): s01-s05
# Section 1 — Q1 mainstream production (≈11 минут): s06-s12 (includes s07b buffer)
# Section 2 — Q3 frontier exploration (≈12 минут): s13-s19
# Section 3 — Q2 methane MRV (≈12 минут): s20-s27
# Section 4 — Q4 energy transition (≈9 минут): s28-s33
# Section 5 — Россия (≈6 минут): s34-s36
# Section 6 — Cross-cutting risks (≈5 минут): s37-s38
# Section 7 — Закрытие + Q&A (≈3 минут активного + 10 Q&A buffer): s39-s42

