      сохраняются в `.claude/settings.local.json` основной копии и действуют во всех копиях; «A worktree
      is a fresh checkout, so initialize your development environment there», перенос файлов вне версий
      — `.worktreeinclude`. Команда git для ручного завода — из того же раздела (`git worktree add ../project-feature-a
