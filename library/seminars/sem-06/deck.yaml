    primary: 'Таблица двух строк в три колонки: источник · тезис · сила доказательства. Под таблицей —
      отдельная плашка-предостережение про цифру «79%» и плашка честного пробела.'
    backup: Источник — section-2-subagent.md §A.3 «Свидетельства» + «Осторожность со счётом» + «Честный
      пробел», section-2-subagent-part1c.md n61, дословно по содержанию. Числа в таблице — цифрами, как
