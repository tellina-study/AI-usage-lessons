    assertion: "После требований — архитектура, а не сразу код: «решить, что строить» — существенная сложность (Brooks); пропуск фазы даёт эрозию и когнитивный долг"
    learning_goal: "[SI] Необходимость архитектуры после требований (не код); Brooks essential complexity; пропуск фазы → эрозия"
