- id: n31
  file: slides/n31-razbor-proshlye-raskhody-kak-podmena-potrebnosti.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: Алгоритм взял прошлые расходы на здравоохранение; расходы складываются из каждого оплаченного
