slides:
  # ─── Section 4. Testing — TDD as a discipline (s22–s24) ───
  - id: s22
    file: slides-en/s22-divider-testing.md
    type: section_divider
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 0.5
    assertion: "Testing · TDD discipline — the test as an executable specification; a strong phase in the right role, but with the trap \"green tests ≠ working code\""
    learning_goal: "Section divider for section 4 (testing): the test as a machine-verifiable criterion"
    learning_outcomes: [LO1]
    chapter_ref: "§4 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"4\" on the right, soft-outline, SECTION 4 + subtitle \"Testing — TDD as a discipline\", a narrative bridge line on the left, roadmap bar of 8 cards (current 4 gold), tag \"strong in the right role · 1 failure\". NO timings."
    interaction: none

  - id: s23
    file: slides-en/s23-tdd-discipline.md
    type: assertion_visual
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "TDD-as-approach: the test is an executable specification, red-green-refactor with human ownership; the check is not outsourced to the model; nuance — the value is in the structure, not the ritual (TDD-first for an agent = ~3× tokens with no gain)"
    learning_goal: "The TDD practice as an approach + the nuance structure≠ritual (Böckeler ~3× tokens); tools secondary"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§4.1, §4.2 [for-slide-s22]"
    references: [willison-testing, fowler-testing, bockeler-thoughtworks, dora-report]
    interaction: none

  - id: s24
    file: slides-en/s24-all-green-mutation.md
    type: case_study
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "\"all green\" lies: an LLM readily reports \"all tests green\" while they fail — the gate is a deterministic run, not the model's report; coverage↑ mutation↓ (Meta 32/5.3% vs 2.4/15%)"
    learning_goal: "[SI] Failure: \"all green\" lies (Fowler); coverage↑(32/5.3%) mutation↓(2.4/15%, Meta); incident→regression test"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§4.3 [for-slide-s24]"
    references: [fowler-testing, willison-testing, meta-testgen]
    in_bucket: true
    verify_day_of: true

  - id: s25b
    file: slides-en/s25b-bdd-trunk-based.md
    type: assertion_visual
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "BDD and trunk-based are settled by balance, not by description: BDD gives a shared language with a non-technical stakeholder, but costs an extra layer and outside Ruby is not mainstream (~27%); trunk-based keeps up with the pace of agent commits, but requires feature flags and real test coverage"
    learning_goal: "Round 6 block 3 (owner): explicit \"+\" and \"−\" for each methodology + a micro-example for each — for someone seeing BDD/trunk-based for the first time"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§4.4 [for-slide-s25b]"
    references: [cucumber-bdd, trunk-based-dev]
    verify_day_of: true
    interaction: none
    # EN-sync block 4 (#172/#162): EN twin of the RU round-2 insert, rebuilt
    # in round 6 block 3. Sits after s24 (all-green-mutation), before s25c.

  - id: s25c
    file: slides-en/s25c-test-tooling-matrix.md
    type: schema_matrix
    section: "Section 4. Testing — TDD as a discipline"
    duration_min: 3
    assertion: "The local toolkit closes five channels in which the agent is blind without a tool: data (Testcontainers), network (MSW / WireMock OSS), user interface (Playwright), your own checks (a skill wrapper), an air-gapped setup (local test generation) — and for each it names exactly what cannot be done without it"
    learning_goal: "Round 6 block 3 (owner): +Playwright and +local test generation as the 4th and 5th categories; the rows reframed to \"what it does / what is impossible without it\""
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§4.5 [for-slide-s25c]"
    references: [testcontainers, msw, wiremock, pytest-generator-distil]
    verify_day_of: true
    interaction: none
    # EN-sync block 4 (#172/#162): EN twin of the RU round-2 insert, rebuilt
    # in round 6 block 3. Sits after s25b, before s25 (divider Section 5).

  # ─── Section 5. Review + Security — the discipline of skepticism (s25–s31) ───
  - id: s25
    file: slides-en/s25-divider-review-security.md
    type: section_divider
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 0.5
    assertion: "Review + Security · a second critical look at AI's output; counterintuitively — AI code must be reviewed MORE, not less"
    learning_goal: "Section divider for section 5 (review+security): the discipline of skepticism in one line"
    learning_outcomes: [LO1]
    chapter_ref: "§5 (structural divider)"
    partial_out_strict_in: true
    visual:
      pattern: section_divider_with_roadmap
      primary: "The section_divider template (unified). A giant \"5\" on the right, soft-outline, SECTION 5 + subtitle \"Review + Security — the discipline of skepticism\", a narrative bridge line on the left, roadmap bar of 8 cards (current 5 gold), tag \"strong in capability · 4 failures\". NO timings."
    interaction: none

  - id: s26
    file: slides-en/s26-review-practice.md
    type: assertion_visual
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The review practice is not \"which AI reviewer is best\" but two human practices: adversarial review with fresh context (not the one who wrote it) + retained human accountability; AI review = assist, not gate"
    learning_goal: "The review practice: adversarial fresh-context + accountability; tools secondary; judgment assist/gate"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§5.2 [for-slide-s26]"
    references: [willison-testing, osmani-70-percent]
    interaction: none

  - id: s27
    file: slides-en/s27-review-failure-curl.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "Review failure: complacency toward AI code (Radar Hold) + curl-slop as a DDoS on maintainers — the asymmetry \"generate a fake in seconds / refute it in hours\"; AI review ~19% F1 against the human baseline"
    learning_goal: "[SI] Review failure: complacency (Radar Hold) + AI-review ~19% F1 vs human + curl valid-rate >15%→<5%"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.3 [for-slide-s27]"
    references: [thoughtworks-radar, stenberg-curl, codecrash]
    in_bucket: true
    verify_day_of: true

  - id: s28
    file: slides-en/s28-security-practice.md
    type: assertion_visual
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The security practice is the architectural breaking of the lethal trifecta (untrusted content + secrets + exfiltration channel) with four controls: least-privilege, sandbox, egress allowlist, a mandatory SAST/supply-chain gate"
    learning_goal: "The security practice: least-privilege/sandbox/SAST gate/lethal trifecta; tools secondary"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.4 [for-slide-s28]"
    references: [fowler-lethal-trifecta, github-agentic-workflows]
    verify_day_of: true

  - id: s29
    file: slides-en/s29-vulnerable-false-confidence.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The systemic risk is not \"AI sometimes writes vulnerable code\" but \"vulnerable code + heightened confidence that it is safe\": Stanford — people introduce vulnerabilities more often and more confidently; NYU ~40% (1689 programs / 89 MITRE scenarios)"
    learning_goal: "[SI] Security failure: Stanford insecure+overconfident + NYU ~40% (1689/89 MITRE Top-25 CWE)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.5 [for-slide-s27]"
    references: [stanford-perry, nyu-asleep-keyboard]
    in_bucket: true
    verify_day_of: true

  - id: s30b
    file: slides-en/s30b-amazon-q-wiper.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "A third, mechanically separate failure class: trust is needed not only in what the agent produces or reads, but in what the agent itself is made of — an unaudited contributor merged a malicious system prompt straight into an official Amazon Q Developer release"
    learning_goal: "The supply-chain risk of the AI tool itself (not only of its output or its input) — a third failure mechanism next to slopsquatting and CamoLeak"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.6 [for-slide-s30b]"
    references: [amazon-q-wiper]
    in_bucket: true
    verify_day_of: true
    interaction: none
    # EN-sync block 4 (#172/#162): EN twin of the RU round-3 insert. Sits
    # after s29 (vulnerable + false confidence), before s30 (supply chain).

  - id: s30
    file: slides-en/s30-slopsquatting-camoleak.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "Supply chain is a separate class: slopsquatting (registering a reproducibly-hallucinated package; 20% of 576k samples, 43% reproducibility) + CamoLeak (prompt injection, CVSS 9.6) — cured by architecture, not by a \"better model\""
    learning_goal: "[SI] Security failure: slopsquatting (576k, 43%) + CamoLeak CVSS 9.6 (supply-chain/prompt-injection class)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§5.6 [for-slide-s28]"
    references: [larson-slopsquatting, legit-camoleak]
    in_bucket: true
    verify_day_of: true

  - id: s31
    file: slides-en/s31-replit-culmination.md
    type: case_study
    section: "Section 5. Review + Security — the discipline of skepticism"
    duration_min: 3
    assertion: "The Replit agent, during a code freeze, wiped the prod DB, lied, and rated itself 95/100 — level-D security does not live in the prompt, it lives outside the agent; accountability is not delegated"
    learning_goal: "[SI] Culmination: Replit by failure mode + class (Kiro, PocketOS 9 sec); accountability is not delegated"
    learning_outcomes: [LO1, LO7, LO4]
    chapter_ref: "§5.7 [for-slide-s29]"
    references: [replit-incident, fortune-replit, ai-incident-db]
    in_bucket: true
    verify_day_of: false

