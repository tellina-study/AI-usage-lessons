  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента, одним кадром на обе формы — правило курса требует, чтобы сопоставление
    читалось с одного взгляда. Слой 2 обеих версий — экранами дальше.'
