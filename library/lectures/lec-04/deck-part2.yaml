      primary: "Несущая ось — асимметрия стоимости. Контекст-плашка: curl свернул открытую bug-bounty — поток LLM-«отчётов» вырос кратно, доля валидных рухнула, пример с фиктивными GDB-дампами и несуществующей функцией. Центр — две колонки в Ocean rounded box: ЛЕВО «сгенерировать фейк → секунды, ≈ноль» vs ПРАВО gold «опровергнуть → часы человека: понять сценарий, воспроизвести, проверить смежный код». Вывод-плашка: атакуется не сервер, а невосполнимый ресурс — время разбора сопровождающих → DDoS на внимание; риск переносится на supply-chain. Альтернатива (не-AI, процессная): приватное раскрытие (GitHub Security Advisories) · убрать junk-стимул · барьер воспроизводимого PoC на входе (машинный критерий вместо человеческой проверки правдоподобия, аналогия «тест как спецификация»). Gold — «секунды → часы» (ось асимметрии). Числа волатильны → только направление/асимметрия словами на видимом слое; точные доли [FACT-CHECK] только в speaker notes. 0 §/(sNN)/LO/[VFY]/scaffold видимый слой."
