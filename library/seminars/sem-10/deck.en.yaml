  file: slides-en/n18-k1-panel-otveta.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'The answer node''s prompt explicitly forbids the model from going beyond the found chunk:
    ''Answer ONLY from the text below. If the answer isn''t there — write "no information"'''
  learning_goal: 'Layer 2 of Case 1, beat 3 of 3: a real prompt panel for the Answer (RAG) node, EXPANDED
    view. This system instruction is the direct cause of the ''no information'' answers we''ll break down
    in the next beats (a bridge to n11).'
  visual:
    pattern: mechanism_node_graph
    figure: case1-n8n-answer-panel-real.png
    primary: 'A real screenshot of the expanded "Prompt (User Message)" field of the Answer (RAG) node:
      "Answer ONLY from the text below. If the answer isn''t in the text — write "no information." Text:
      {{ $json.chunk }}".

      '
    backup: 'Frame source: `stend/n8n-screenshots-raw/case1-answer-panel.png` (the HTTP Request → chat/completions
      node, the Prompt (User Message) field), captured by `stend/n8n_shots.py` in EXPANDED view. Crop
      — `rendered/compose_case1_n8n_shots.py`: the top "Save time with an example" block and the prompt-source
      selector field were removed, as were the Require Specific Output Format / Enable Fallback Model
      toggles at the bottom (not used in this node). The prompt''s own text wasn''t changed by even one
      character — it''s verbatim from `stend/harness2.py::llm_answer`, the call''s system message.

      THIS INSTRUCTION IS THE SAME FOR ALL THREE ACTIONS (a C5 corollary): prompt-stuffing gets this same
      system instruction on top of the entire base''s text, keyword and vector get it on top of a single
      found chunk (`{{ $json.chunk }}`). The difference between actions isn''t in the model''s instruction
      — it''s in what text gets substituted into `{{ $json.chunk }}`: the whole knowledge base or one
      chunk.

      BRIDGE TO THE NEXT BEAT: it''s exactly this line — "if the answer isn''t in the text — write ''no
      information''" — that''s the direct cause of why prompt-stuffing, at large base sizes, answers literally
      "no information" several times (n11/n10): not because the model isn''t trying, but because it''s
      explicitly allowed and instructed to say so if it can''t find the fact. At a small base there''s
      plenty to search through; at a large one, as the number of similar distractor documents grows, correctly
      locating its own fact inside a wall of text doesn''t always succeed — and that''s exactly when this
      instruction kicks in.'
