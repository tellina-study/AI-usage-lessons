deck:
  seminar_number: 2
  title: "Семинар 2. Когда ИИ, каким и на чём"
  audience: "студенты-инженеры (практикующие, многие/все работают в ИТ, активно пользуются AI-чатами и вайбкодят) — семинар идёт после Лекции 1, до Лекций 2-3"
  format: "разбор_дискуссия"
  central_question: "Семь реальных кейсов — и в каждом ответ меняют вводные, которых не было в первой постановке"
  learning_outcomes: [LO1, LO7]
  lo_note: "Закрепляет LO1 (выбор типа AI-решения под задачу) и LO7 (обоснованная критическая проверка) из Лекции 1 — на уровне применения к реалистичным инженерным постановкам, а не повторения определений."
  language: ru
  pivot_note: "issue #182 — деck полностью заменяет пре-пивотный вариант (структура «воронка решений» с явным фреймворком, worksheet'ами и искусственными кейсами), возвращённый владельцем курса на REVISE. Новая структура — кейс-центричная: семь реалистичных кейсов, каждый со своим выбором; фреймворк не выпячивается, вопросники и памятки-процедуры убраны. Механика занятия — открытое обсуждение всей аудиторией (plenary), без малых групп и без формального подсчёта ответов."
  source_of_truth: "library/seminars/sem-02/brief.md + facilitator-guide.md + facilitator-guide-part2.md"

slides:
  - id: s01
    file: slides/s01-hero-cover.md
    type: hero_cover
    assertion: "Семинар 2. Когда ИИ, каким и на чём"
    learning_goal: "Emotional hook + hero-иллюстрация: сегодня разбираем реальные инженерные решения, а не схему"
    visual:
      pattern: hero_cover_real_photo
      backup: assets/screenshots/s01-*.jpg

  - id: s02
    file: slides/s02-seven-cases.md
    type: assertion_visual
    assertion: "Сегодня — семь кейсов, и в каждом есть выбор"
    learning_goal: "Обзор занятия без схемы-процедуры: показать состав кейсов, не выпячивать фреймворк"
    visual:
      pattern: list_seven_cases

  - id: s03
    file: slides/s03-case1-divider.md
    type: section_divider
    assertion: "Кейс 1. Документы поставщиков"
    learning_goal: "Visual divider — переход в кейс 1, лёгкий тег выбора без выпячивания процедуры"
    visual:
      pattern: section_divider_plain

  - id: s04
    file: slides/s04-case1-setup.md
    type: case_study
    assertion: "Бухгалтерия вручную переносит накладные поставщиков в 1С — можно автоматом?"
    learning_goal: "Постановка кейса 1 — живая реплика продакта, два примера идентичного формата"
    visual:
      pattern: two_document_cards_plus_question

  - id: s05
    file: slides/s05-case1-intro2.md
    type: case_study
    assertion: "Архив за три года — сорок поставщиков"
    learning_goal: "Вводная-факт без выводов — только новая деталь и вопрос"
    visual:
      pattern: scattered_formats_cards_plus_question

  - id: s06
    file: slides/s06-case1-verdict.md
    type: case_study
    assertion: "Гибрид: LLM извлекает, код проверяет. Два примера — не выборка"
    learning_goal: "Разбор кейса 1 — LLM-извлечение + жёсткая валидация кодом; урок про размер выборки"
    visual:
      pattern: hybrid_pipeline_illustration

  - id: s07
    file: slides/s07-quickfire-logs.md
    type: case_study
    assertion: "Персоналка в логах — одна технология на всё?"
    learning_goal: "Quickfire постановка — только вопрос, без подсказки границы решения"
    visual:
      pattern: single_card_plus_question

  - id: s08
    file: slides/s08-quickfire-logs-verdict.md
    type: case_study
    assertion: "Regex для телефонов и email, NER/LLM для имён в свободном тексте"
    learning_goal: "Разбор quickfire — граница между детерминированным методом и моделью проходит внутри одной задачи"
    visual:
      pattern: two_column_split_verdict

  - id: s09
    file: slides/s09-from-life-1.md
    type: case_study
    assertion: "Из жизни: Epic Sepsis Model — провал; Ramp — успех"
    learning_goal: "Vendor-метрика без независимой проверки vs замена ручной обработки с мизерным покрытием"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s10
    file: slides/s10-case2-divider.md
    type: section_divider
    assertion: "Кейс 2. Помощник поддержки"
    learning_goal: "Visual divider — переход в кейс 2, лёгкий тег выбора"
    visual:
      pattern: section_divider_plain

  - id: s11
    file: slides/s11-case2-setup.md
    type: case_study
    assertion: "ИИ-помощник для операторов техподдержки — подсказки ответов, поиск похожих обращений"
    learning_goal: "Постановка кейса 2 — живая реплика, операторы живут в helpdesk весь день"
    visual:
      pattern: single_card_plus_question

  - id: s12
    file: slides/s12-case2-intro2.md
    type: case_study
    assertion: "Коробочный helpdesk без открытого API — вендор не отвечает даже на письма"
    learning_goal: "Вводная — реплика ИТ-директора, без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s13
    file: slides/s13-case2-verdict.md
    type: case_study
    assertion: "Сбоку, смена вендора или пересмотр задачи — единственно верного ответа нет"
    learning_goal: "Разбор кейса 2 — 3 варианта с ценой каждого, намеренная неоднозначность"
    visual:
      pattern: three_option_cards_with_cost

  - id: s14
    file: slides/s14-quickfire-product-descriptions.md
    type: case_study
    assertion: "Отдельный ИИ-сервис для описаний товаров — хорошая идея?"
    learning_goal: "Quickfire постановка — только вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s15
    file: slides/s15-quickfire-product-verdict.md
    type: case_study
    assertion: "Кнопка в существующей админке каталога, а не отдельный сервис"
    learning_goal: "Разбор quickfire — встроенность побеждает отдельный продукт"
    visual:
      pattern: single_card_verdict

  - id: s16
    file: slides/s16-kite-vs-copilot.md
    type: case_study
    assertion: "Kite закрылся, Copilot — в 90% Fortune 100. Одна технология, разная встроенность"
    learning_goal: "Из жизни: коммерческая цена архитектурного выбора встроить или своё; плюс анекдот про standalone-устройства"
    visual:
      pattern: two_column_comparison_plus_footnote

  - id: s17
    file: slides/s17-rag-schema.md
    type: assertion_visual
    assertion: "RAG одним потоком: вопрос → поиск по базе → фрагменты в контекст → ответ"
    learning_goal: "Интуиция RAG за один абзац перед кейсом, где она понадобится"
    visual:
      pattern: horizontal_flow_4_steps

  - id: s18
    file: slides/s18-agent-schema.md
    type: assertion_visual
    assertion: "Агент циклом: план → инструмент → проверка → дальше"
    learning_goal: "Интуиция агента за один абзац перед кейсом, где она понадобится"
    visual:
      pattern: circular_flow_4_steps

  - id: s19
    file: slides/s19-case3-divider.md
    type: section_divider
    assertion: "Кейс 3. Протоколы встреч"
    learning_goal: "Visual divider — переход в кейс 3, лёгкий тег выбора"
    visual:
      pattern: section_divider_plain

  - id: s20
    file: slides/s20-case3-setup.md
    type: case_study
    assertion: "После каждой встречи кто-то полчаса пишет протокол руками — автоматизируем?"
    learning_goal: "Постановка кейса 3 — живая реплика, транскрипт целиком помещается"
    visual:
      pattern: single_card_plus_question

  - id: s21
    file: slides/s21-case3-intro2.md
    type: case_study
    assertion: "Руководству понравилось — теперь спрашивают: что решали по проекту X за полгода?"
    learning_goal: "Вводная 1 — реплика без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s22
    file: slides/s22-case3-verdict1.md
    type: case_study
    assertion: "Теперь обоснован RAG — база растёт и не влезает в контекст"
    learning_goal: "Разбор вводной 1 — рост базы обосновывает RAG"
    visual:
      pattern: growing_database_illustration

  - id: s23
    file: slides/s23-case3-intro3.md
    type: case_study
    assertion: "Поручения из протоколов мы всё равно руками переносим в таск-трекер"
    learning_goal: "Вводная 2 — реплика без выводов"
    visual:
      pattern: fact_card_plus_question

  - id: s24
    file: slides/s24-case3-verdict2.md
    type: case_study
    assertion: "Действие во внешней системе — нужен workflow/агент. Архитектуру двигают требования"
    learning_goal: "Разбор вводной 2 — действие во внешней системе обосновывает агента; итоговый урок"
    visual:
      pattern: external_system_action_illustration_plus_verdict

  - id: s25
    file: slides/s25-quickfire-digest.md
    type: case_study
    assertion: "Дайджест по чатам и почте — какая архитектура нужна?"
    learning_goal: "Quickfire постановка — только вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s26
    file: slides/s26-quickfire-digest-verdict.md
    type: case_study
    assertion: "Агент нужен — обход источников; RAG не нужен — нет произвольного запроса к большой базе"
    learning_goal: "Разбор quickfire — частая ошибка: RAG путают с «много источников»"
    visual:
      pattern: two_column_needed_not_needed

  - id: s27
    file: slides/s27-from-life-2.md
    type: case_study
    assertion: "Octomind отказался от LangChain после 12+ месяцев в проде. Deep Research и coding-агенты — где агент необходим"
    learning_goal: "Из жизни: негативный пример фреймворка + класс задач, где агентный цикл действительно нужен"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s28
    file: slides/s28-case4-divider.md
    type: section_divider
    assertion: "Кейс 4. Звонки продаж"
    learning_goal: "Visual divider — переход в кейс 4, лёгкий тег выбора"
    visual:
      pattern: section_divider_plain

  - id: s29
    file: slides/s29-case4-setup.md
    type: case_study
    assertion: "Карточка звонка: потребность, возражения, договорённости — какая архитектура, где считать?"
    learning_goal: "Постановка кейса 4 — живая реплика руководителя продаж"
    visual:
      pattern: single_card_plus_question

  - id: s30
    file: slides/s30-case4-intro1.md
    type: case_study
    assertion: "В записях звонков — телефоны, адреса, иногда паспортные данные"
    learning_goal: "Вводная 1 — реплика юриста, без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s31
    file: slides/s31-case4-verdict1.md
    type: case_study
    assertion: "Персональные данные наружу нельзя — 420-ФЗ: оборотный штраф 1-3% выручки"
    learning_goal: "Разбор вводной 1 — нормативная база про персональные данные"
    visual:
      pattern: fact_card_plus_regulation_strip

  - id: s32
    file: slides/s32-case4-intro2.md
    type: case_study
    assertion: "Нет GPU-сервера и бюджета. Нужны пять полей в CRM, не беседа"
    learning_goal: "Вводная 2 — две реплики без выводов"
    visual:
      pattern: two_quote_cards_plus_question

  - id: s33
    file: slides/s33-case4-verdict2.md
    type: case_study
    assertion: "Задача сузилась до шаблона — локальная модель 7-8 млрд параметров справляется"
    learning_goal: "Разбор вводной 2 — сужение задачи; двойной урок сложности и чувствительности"
    visual:
      pattern: single_card_plus_dual_lesson

  - id: s34
    file: slides/s34-from-life-3.md
    type: case_study
    assertion: "Samsung: 3 утечки за 19 дней после разрешения ChatGPT. JetBrains и Apple — малые модели в проде уже сейчас"
    learning_goal: "Из жизни: негативный пример утечки + позитивный пример локальных моделей с counterfactual к frontier"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s35
    file: slides/s35-your-task.md
    type: assertion_visual
    assertion: "У кого есть похожая задача с работы?"
    learning_goal: "Открытое приглашение перенести метод занятия на реальную задачу аудитории — без worksheet"
    visual:
      pattern: open_invitation_illustration

  - id: s36
    file: slides/s36-lessons.md
    type: summary
    assertion: "Что унести: уроки семи кейсов"
    learning_goal: "Итоговая компиляция — по одной строке-уроку на кейс, прослеживаемо к разборам"
    visual:
      pattern: seven_lesson_lines

  - id: s37
    file: slides/s37-homework-reading.md
    type: summary
    assertion: "Домашнее чтение: Klarna, NYC MyCity, бонус Tahoe за $1"
    learning_goal: "Необязательное чтение, закрывающее несколько выборов на одном длинном примере"
    visual:
      pattern: three_reading_cards

  # резерв — показываются только при остатке времени (лестница резерва, guide part2)
  - id: s38
    file: slides/s38-reserve-klarna.md
    type: case_study
    reserve: true
    assertion: "Klarna, 2023-2025: одна история — четыре развилки"
    learning_goal: "Резерв: применить все четыре типа выборов целиком к одному длинному публичному кейсу"
    visual:
      pattern: four_row_case_breakdown

  - id: s39
    file: slides/s39-reserve-dedup-setup.md
    type: case_study
    reserve: true
    assertion: "Дедупликация новостей — нужно склеивать сообщения об одном событии в одну карточку"
    learning_goal: "Резервный quickfire — постановка и вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s40
    file: slides/s40-reserve-dedup-verdict.md
    type: case_study
    reserve: true
    assertion: "Fuzzy-matching закрывает ~90% случаев дешевле и предсказуемее. LLM — на остаток"
    learning_goal: "Резерв: возврат к границе regex/модель на новом материале"
    visual:
      pattern: two_card_setup_vs_split_verdict

  - id: s41
    file: slides/s41-hero-closing.md
    type: hero_closing
    assertion: "Сегодня вы решали, что строить. Лекция 2 — как модель устроена внутри"
    learning_goal: "Bridge к Лекции 2; emotional payoff"
    visual:
      pattern: hero_closing_bridge_photo
      backup: assets/screenshots/s41-*.jpg
