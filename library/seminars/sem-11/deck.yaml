  learning_goal: 'Слой 2 Кейса 1, такт 1 из 3: настоящий скрин живого холста стенда (снят `stend/n8n_shots_case1.py`,
    workflow CfRWQAELoIAbDPRm, обход [#233-8] снят 2026-10-20). Панели двух узлов — следующими двумя тактами
