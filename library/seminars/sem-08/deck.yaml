      (1900×1100), кроп (230, 340, 1740, 810) → 1510×470, без перерисовки, собран в rendered/make_figures_k2.py
      функцией test_stend_real(), сохранён как library/seminars/sem-08/rendered/figures/k2-n8n-test-stend-real.png.

      На кадре — холст воркфлоу «C8 · Кейс 2 — тест дедупликации (стенд, 4 схемы)», тот самый тестовый
      процесс, на котором измерены числа, уже стоящие в таблице выше (хэш 15/20, TF-IDF 13/20, LLM-судья
      17/20, jev 20/20). Текст на кадре читается буквально, построчно: узел `Test pair (webhook)` (триггер,
      подпись выхода `POST`) ведёт двумя стрелками — к узлу `Jev decision (noul)` (тип `httpRequest`,
      подпись `POST: https://openrouter.ai/...`) и к узлу `LLM judge` (вход `Input 2`, зигзаг-иконка);
      отдельный узел `Judge model` подключён к `LLM judge` пунктирной линией с подписью `Model` (обязательный
      суб-узел модели, тип связи — chat-модель, не прямой поток данных). Оба узла — `Jev decision (noul)`
      и `LLM judge` — сходятся в узел `Combine` (подпись `combine`, два подписанных входа `Input 1` /
      `Input 2`), дальше `Combine` → `Shape result` (фигурные скобки — узел трансформации) → `Respond`
      (возврат ответа вебхука). Хэш и TF-IDF на этом холсте НЕ изображены как узлы — эти две схемы не
      вызывают внешнюю модель и посчитаны локальным скриптом (`stend/_gen_duplicate_check_pairs.py` +
      сравнение строк/ косинуса), не на живом стенде; канвас показывает именно те два узла, что действительно
      вызывают модель (LLM-судья и jev) — ровно то, что нуждалось в подтверждении скрином, в отличие от
      хэша и TF-IDF, которые не куда снимать. Кроп обрезает заголовок канваса (строка с названием воркфлоу),
      бейдж `Published`, вкладки `Editor/Executions/Evaluations`, левую колонку иконок приложения, правую
      плавающую панель зума/поиска, кнопку «Execute workflow» и нижнюю панель `Logs` — workflow/execution
      id на итоговом кадре нет нигде (канон §2–§3 `tools/seminar-production/ README.md`).

      БЮДЖЕТ ВЫСОТЫ (тем же кругом правки): слайд уже стоял на потолке — таблица в 5 колонок при 10,5
      pt занимала 2,79″ из отведённых 2,81″ ещё ДО фигуры (`build.py`, замер до правки). С фигурой (натуральная
      высота ~3,81″ при текущем кропе) сумма естественных высот четырёх блоков (интро-строка 1,08″ + таблица
      3,81″ + находка 2,63″ + фигура 3,81″ — `DEBUG`-замер `tools/seminar-build/roles.py:compose()`) вчетверо
      превышала отведённые 5,89″, и пропорциональное сжатие уводило таблицу ниже пола ступени 2 (9 pt,
      2,30″) — `build.py` возвращал ПЕРЕПОЛНЕНИЕ (×3) и ЗА КРАЕМ ПОЛОТНА (композиция кончалась на 7,42″
      при высоте полотна 7,50″, нижний блок не виден). Снята вводная строка «20 тестовых пар: ...» целиком
      (её факты — состав 10/10, 3 близкие темы — дублируются в колонках таблицы, см. строку TF-IDF «2
      ложных срабатывания на близких темах»); «Честная находка» сжата с 3 развёрнутых предложений до 3
      компактных — все три находки (TF-IDF не спасает порог, jev обошёл модель-судью, обе платные схемы
      дешевле цента) сохранены, длина текста ~47% от исходной. После обеих правок — без ПЕРЕПОЛНЕНИЯ и
      без ЗА КРАЕМ ПОЛОТНА: таблица садится на пол ступени 2 (9 pt, «НА ДНЕ КЕГЛЯ» — ниже приём не умеет,
      но бюджет 2,29″ практически равен нужным 2,30″, в пределах погрешности рендера) — тот же уровень
      сжатия, что уже принят на n46 этой же деки, не новый прецедент. Рендер проверен визуально (`pdftoppm`
      страницы n20) и чекером наложений (`check_text_overlap_pdf.py` — 0 наложений на n20): текст не наезжает,
      таблица, находка и фигура читаются целиком, без подрезки (см. QA-прогон `build.py` после правки,
      отчёт оркестратору).'
