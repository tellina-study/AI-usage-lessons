# Что у Семинара 11 своё. Код сборщика — общий, в `tools/seminar-build/`.
#
# Правило, которое этот файл обслуживает (канон `tools/presentation-build/
# seminar-deck-kit.md`): дека собирается из ИМЕНОВАННОЙ БИБЛИОТЕКИ ПРИЁМОВ, и
# приём выбирается по полю `visual.pattern` слайда — ниже, в `genres`.
#
# Взято за образец у `library/seminars/sem-10/rendered/deck-config.yaml` и
# переписано под сетку С11 (ARCHITECTURE.md §4, SETKA-KEYSOV.md): ПЯТЬ
# кейсов, БЕЗ разбавителя (ARCHITECTURE.md §4 явно фиксирует отсутствие
# лёгкого довеска — все пять техкейсов полноценные). 98 слайдов, Фаза 4
# (issue #345).
#
# Слайды изначально (Фаза 4) несли намеренный разрыв нумерации на
# n22/n39/n40 (параллельные диапазоны кейсов, канон §1 `tools/seminar-
# production/README.md`) и шли n01-n04 / n05-n97 / n98-n101. Разрыв сведён
# этим же кругом: `python3 tools/seminar-build/make_deck_yaml.py --seminar 11`
# → `python3 tools/seminar-production/renumber_slides.py library/seminars/
# sem-11 --targets <список slides/*.md + rendered/deck-config.yaml> --protect
# <защита двух строк n98-mostik-vpered.md, ссылающихся на sem-10/slides/
# n83-mostik-k-s11.md — ЧУЖОЙ слайд, не свой>` — и ВРУЧНУЮ для `n100`/`n101`
# (3-значные номера TOKEN-регулярка скрипта не ловит: `\d{2}` ровно две
# цифры, `n100`/`n101` не совпадают ни разрыва ни переименования). Числа
# ниже — уже ИТОГОВЫЕ (после сведения): кейсы n05-n94, закрытие n95-n98.

seminar: "11"
issue: 345

langs:
  ru:
    slides: slides
    deck: deck.yaml
    out: sem-11.pptx
    blocks: [Введение, Кейсы, Закрытие]
  en:
    # Bilingual Production Rule (CLAUDE.md, issue #172). EN-трек
    # производится ПОСЛЕ приёмки RU, отдельной фазой — не в этом круге.
    slides: slides-en
    deck: deck.en.yaml
    out: sem-11-en.pptx
    head: head.en.yaml
    blocks: [Introduction, Cases, Closing]

# Границы блоков: [от, до, индекс блока, индекс ступени или null].
# ИТОГОВАЯ (сведённая) нумерация: введение n01-n04, кейсы n05-n94, закрытие
# n95-n98.
razmetka:
  n:
    rows:
      - [1, 4, 0, null]
      - [5, 94, 1, 0]
      - [95, 98, 2, null]
    stages: []

# Дорожка кейсов на лёгком дивайдере: названия по ЗАДАЧЕ (канон §1
# проектирования — не тезис/урок), в порядке подтверждённом владельцем
# 2026-11-14 (issue #345). У этого занятия нет разбавителя вне дорожки
# (ARCHITECTURE.md §4) — все пять кейсов внутри неё.
#
# ПЯТЬ пунктов (не четыре, как у С10) делают пилюлю `K.roadmap` на 21%
# УЖЕ, чем у С10 (cw = 2.29″ против 2.91″), а сам приём на занятиях без
# `type_scale` держит ВЫСОТУ пилюли фиксированной (0.42″, см. docstring
# `deck_kit.roadmap`) — не растёт под текст. Полные формулировки
# ARCHITECTURE.md §4 / SETKA-KEYSOV.md (например «Классификация вопроса →
# динамические веса RRF-гибрида», 53 символа) переносятся туда дословно;
# здесь — короче, иначе слово проваливалось под нижний край залитой
# карточки на всех пяти дивайдерах разом (`check_tracks_pdf.py`,
# «ВЫВАЛИЛСЯ»/«РЕЖЕТ», стр. 5/22/38/58/74 до этой правки). Замерено
# `metrics.text_h` при cw=2.29″: каждая строка ниже держится в одну строку
# на 12,5pt (высота ≤0.41″ при потолке плашки 0.42″).
case_track:
  - Трансформация запроса
  - Продвинутый чанкинг
  - Динамические веса RRF
  - Семантическое размытие поиска
  - Самокоррекция поиска

# ВАЖНО, куплено дефектом С8 (его deck-config.yaml, комментарий к его
# собственному n27): ключи ниже — ТОЧНЫЕ id дивайдеров кейсов, ИТОГОВАЯ
# (сведённая) нумерация. При любой вставке или перенумеровке слайдов этот
# блок правится В ТОМ ЖЕ КРУГЕ.
case_idx:
  n05: 0
  n22: 1
  n38: 2
  n58: 3
  n74: 4

# `visual.pattern` → жанр из библиотеки приёмов (`tools/seminar-build/genres.py`).
# Имя, которого здесь нет, рисуется жанром `content` — нормальный, самый
# частый случай. У С11 это большинство имён: `mechanism_node_graph`,
# `problem_scenario`, `answer_breakdown_table`, `measured_outcome_table`,
# `failure_vignette`, `test_structure_table` — различие между ними несёт
# роль блока-цитаты (`pattern_role` ниже), не отдельная раскладка. Решение
# по `failure_vignette` — по прямому прецеденту Семинаров 6/7 (их
# `deck-config.yaml`, `pattern_role`): это НЕ отдельный жанр, роль цитаты
# `formula` и так жанровое умолчание (`roles.quote_role`), запись здесь для
# явности. `test_structure_table` (n80, единственный слайд с этим именем) —
# трёхколоночная таблица без цитат, жанр `content` рисует её без остатка;
# четырёхколоночный `axis_table` (AXIS_COLS) здесь не подходит по форме
# (3 колонки, не ось занятия), оставлено на безопасном умолчании.
genres:
  hero_cover: cover_centered
  case_divider_quote: case_divider
  question_with_option_cards: question
  keystone_axis: axis_table
  recap_table: axis_table
  criteria_checklist_and_boundary: criteria
  bridge_forward: closing

# Роль блока-цитаты ПО УМОЛЧАНИЮ для этого приёма. Запись нужна только там,
# где умолчание (`formula`) неверно.
pattern_role:
  question_with_option_cards: question
  answer_breakdown_table: formula
  criteria_checklist_and_boundary: formula
  failure_vignette: formula
  recap_table: fact
  keystone_axis: fact
  measured_outcome_table: fact

# Приёмы, где зал ГОЛОСУЕТ карточками.
vote_patterns:
  - question_with_option_cards

# Дивайдеры кейса: `audit_takty_keysa` читает этот список, чтобы проверить
# порядок «дивайдер → сцена → вопрос» (А5a). У С11 один приём дивайдера
# кейса, разбавителя вне дорожки нет — список из одного имени.
divider_patterns: [case_divider_quote]

# Слайды, где фигура — подтверждающий бэкап ПОСЛЕ основных врезок. У С11 все
# n8n-экраны и схемы постановки показывают фигуру КАК основной контент
# (первой), ни одного случая «текст теперь, скрин как доказательство потом»
# не найдено при разборе Фазы 4 — список пуст, не пробел.
fig_after: []

table_style: {}
gold_quote_sids: {}
figs: {}

# Врезки вокруг настоящих снимков/схем (слой 2, такт «решение» — полный
# холст n8n каждого кейса; и такт «сцена»/«механика» там, где рядом со
# схемой стоит содержательная цитата) по умолчанию рисуются ролью "formula"
# (жирным, с весом тезиса-итога) — вес, рассчитанный на тезис, здесь съедал
# бы место у самой фигуры. "fact" — тот же компактный приём, что держит
# факты и числа на остальных слайдах деки. Пять записей (n16/n27/n49/n68/
# n81) — полнокадровый снимок холста каждого кейса, по прямому прецеденту
# С10 `deck-config.yaml` (там та же точечная запись стоит ровно на одном
# «n8n-ekran»/«n8n-canvas» слайде на кейс). Остальные шесть
# (n06/n18/n28/n29/n39/n70) — у С11, в отличие от С10, сцена и отдельные
# панели узлов тоже несут фигуру рядом с цитатой-находкой, и первая сборка
# (`build.py --all`) напечатала «СХЕМА ЗАЖАТА» ровно на этих шести (место
# съедено соседними блоками, не природный потолок приёма) — та же починка,
# тот же симптом. Ключи — ИТОГОВАЯ (сведённая) нумерация.
quote_role_force:
  n06: fact
  n16: fact
  n18: fact
  n27: fact
  n28: fact
  n29: fact
  n39: fact
  n49: fact
  n68: fact
  n70: fact
  n81: fact

deck_yaml:
  central_question_patterns: [question_with_option_cards]
  axis_pattern: keystone_axis
  head_defaults:
    seminar_number: 11
    audience: "3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами"
    format: >-
      слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) +
      настоящие скрины живого холста n8n.lessons.tellian.io во всех пяти кейсах +
      схемы постановки задачи (сплошным — то, что уже собрано, пунктиром — то, что
      предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
      + пять измеренных замеров на этом стенде (корпус SberQuAD, переиспользован с
      Семинара 10), протоколы в `stend/`
    language: ru
    slot_min: 90

# ── Сторожа и генераторы ────────────────────────────────────────────────────

notes:
  # Коридор семинара по канону §5 — 250-450 слов на содержательный слайд,
  # единый на все классы (приём Семинара 7, не Семинара 6).
  bands:
    разделитель: [250, 450]
    голосование: [250, 450]
    содержательный: [250, 450]
    опорный: [250, 450]
    обложка: null
  anchor: {}

svodka:
  case_divider_patterns: [case_divider_quote]
  nachalo_default: "сцена Ольги, одностраничник"
  zal:
    question_with_option_cards: голосования карточками

sluzhebnoe:
  timing_patterns: [hero_cover, case_divider_quote, keystone_axis, recap_table]
  razdely: ["МОСТИК", "ШОВ С10→С11", "ОСЬ"]
