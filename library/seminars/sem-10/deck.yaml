- id: n12
  file: slides/n12-k1-razbor-oshibok-vector.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: 'На вопросе про температуру промахнулись оба способа поиска, и по разным причинам: поиск
    по словам нашёл нужный текст и не получил из него ответа, поиск по смыслу на 500 документах взял соседний
    абзац той же статьи'
  learning_goal: 'Такт С2/С3/С4 (разбор по группам, преемник n11): явный вердикт на каждой строке (С3),
    причина вердикта отдельным столбцом; вывод кадра несут сами два вердикта и столбец причин, отдельной
    плашки-вывода нет — она на этом кадре не помещается в пол кегля 15pt. Часть 2 из 2 (продолжение n11
    — ошибка поиска по словам). Кадр показывает, что найти нужный документ и ответить по нему верно —
    разные работы: на одном вопросе сломались обе, порознь.'
  visual:
    pattern: measured_outcome_table
    primary: 'Плашка с вопросом и эталонным ответом (экспозиция), под ней — таблица на ДВЕ строки, по
      строке на способ поиска: какой документ нашёл · что ответила модель · вердикт · почему вердикт такой.
      Подвальной плашки нет.

      '
    backup: 'Пример — дословно из `stend/raw/case1-results.json` (поле `details`) и `corpus/corpus_case1.json`
      (тексты документов), без изменения ответов модели.

      ПРАВКА 2026-11-12 (issue #311, указание владельца): «переформулировать, сейчас непонятно». Переписано
      четыре места, факты сверены заново.

      (1) ЗАГОЛОВОК СПОРИЛ С СОДЕРЖИМЫМ. Было: «Систематическая ошибка vector: путает соседние абзацы»,
      а кадр при этом говорил, что ответ модели содержательно разумен. Плюс «систематическая» здесь неверно:
      случай единичный (q3) и только на одном размере базы из четырёх. Новый заголовок называет случай
      вместо диагноза (§5.18, §6.2).

      (2) «ОБЩАЯ СНОСКА [17]» на кадре ничего не называла (§5.21). Объяснено на месте: одна и та же сноска
      в обоих текстах — признак того, что это куски одной статьи. Проверено: `[17]` стоит и в `needle-3`,
      и в `distractor-237`.

      (3) ВЕРДИКТ «НЕВЕРНО (по эталону — содержательно разумно)» читался как два вердикта в одной клетке.
      Разведено: вердикт — своё слово, причина — свой столбец.

      (4) ПОДВАЛЬНАЯ ПЛАШКА про поиск по словам развёрнута во ВТОРУЮ СТРОКУ таблицы: на одном вопросе
      сломались оба способа, и это видно только рядом.

      ФАКТИЧЕСКАЯ ПОПРАВКА, НАЙДЕННАЯ ПРИ СВЕРКЕ (прежняя редакция кадра вводила в заблуждение). Снятая
      плашка говорила: модель ответила «нет информации», «потому что буквального числа в найденном тексте
      не было, оно лежало в соседнем абзаце». Из этого читалось, будто ответа в `needle-3` не было вовсе.
      ЭТО НЕВЕРНО: эталонный ответ — слово «высокая» (поле `reference_answer`), и оно стоит в `needle-3`
      дословно, последней фразой: «Другая проблема — это высокая температура летом, которая не позволяет
      показывать марафонцам наилучшие результаты». То есть нужный текст был найден, ответ в нём был, и
      модель его всё равно не выдала. Вероятная причина (это ИНФЕРЕНЦИЯ, на кадре помечена оговоркой «судя
      по ответу»): вопрос «какая температура» прочитан как просьба назвать градусы, а градусов в этом
      абзаце нет. На кадр вынесен проверяемый факт, объяснение — с оговоркой.

      ОБЛАСТЬ ДЕЙСТВИЯ, проверено по всем четырём размерам: поиск по словам находит `needle-3` на 10/50/200/500
      и на всех четырёх отвечает «нет информации». Поиск по смыслу находит `needle-3` на 10/50/200 и отвечает
      так же; `distractor-237` он берёт ТОЛЬКО на 500.

      МЕТОДОЛОГИЧЕСКИЙ ВЫВОД (в заметки, не на кадр, §7.1): на масштабе 500 документов часть «дистракторов»
      SberQuAD — соседние абзацы той же статьи, что и needle-документ. Формально единственный `gold_doc_id`
      не означает, что остальной корпус по теме нерелевантен; мера «нашёл нужный документ» против одного
      эталона здесь недооценивает то, что поиск нашёл содержательно уместный текст.

      ТЕРМИНЫ: «vector»/«keyword» в видимом слое заменены на «поиск по смыслу»/«поиск по словам» — те
      же слова, что на n09/n10/n11.'
