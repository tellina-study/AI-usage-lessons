# library/lectures/lec-02/deck.yaml
#
# Deck-структура Лекции 2 v1.5 (35 слайдов).
# v1.5 (Phase 8.8): s01 hook redesign + new s04b/s09a/s13a + s11 removed +
# s12 reformulated. Net: 33 − 1 (s11) + 3 (s04b/s09a/s13a) = 35.
# Source: chapter v1.1 (status=reviewed, ~11400 слов).
# Plan: notes/lecture-2-review/final/plan-v2-final.md (v2.1).

deck:
  lecture_number: 2
  title: "Лекция 2. Как работают современные большие модели"
  audience: "3 курс ИУ6 МГТУ Баумана, инженеры-разработчики (универсально)"
  duration_min: 75
  central_question: "Что происходит внутри LLM между моим запросом и ответом — и какие из этих внутренних механизмов меняют, как я её использую?"
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: ru
  status: draft
  version: v1.6
  source: chapter v1.1 (status=reviewed, ~11400 слов)
  plan: notes/lecture-2-review/final/plan-v2-final.md (v2.1)
  total_slides: 36
  curriculum_level: introductory

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # 17 canonical terms — preserved from chapter v1.1; designer/critic enforce no drift.
  - токен
  - токенизация
  - BPE (Byte-Pair Encoding)
  - эмбеддинг
  - семантическое сходство
  - cosine similarity
  - механизм внимания
  - контекстное окно
  - in-context
  - сэмплинг
  - температура
  - top-p (nucleus sampling)
  - top-k
  - max_tokens
  - авторегрессионный
  - распределение вероятностей
  - слепота к буквам

slides:
  # ─── Раздел 0. Введение (8 мин, 4 слайда: s01-s04) ───
  - id: s01
    file: slides/s01-live-tokenizer-demo.md
    type: hook
    section: "Раздел 0. Введение"
    duration_min: 2
    assertion: "Модель видит ваш запрос не словами и не буквами — а токенами"
    learning_goal: "Открывающий hook через визуализацию токенизации реального запроса"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s01]"
    visual:
      pattern: token_rainbow_3_examples
      primary: "v1.5: token rainbow — 3 строки с примерами на 3 типах входа (EN: 'tokenization is fascinating' → 5 токенов; RU: 'Привет, как дела?' → 5 токенов; Code: 'def hello(name):' → 4 токена) с цветными chip'ами и количеством токенов. Gold callout: «один и тот же смысл — разное число токенов; EN дешевле RU почти в 2×»."
      backup: "static-first; no live demo (replaced strawberry-test per user feedback round 4)"

  - id: s02
    file: slides/s02-cover-roadmap.md
    type: cover
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Лекция 2. Как работают современные большие модели"
    learning_goal: "Cover — title + lecture number + subtitle + pictogram"
    learning_outcomes: [LO1, LO4, LO6, LO7]
    chapter_ref: "§Введение [for-slide-s02]"
    visual:
      pattern: cover_clean
      primary: "Большая «02» в outline gold, title 48pt, lecture tag, под ним subtitle с 4 этапами + hero motif (4-стадийный pipeline иконка). v1.4: bottom roadmap_bar убран — карта переехала на отдельный s02a."

  - id: s02a
    file: slides/s02a-lecture-map.md
    type: roadmap
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Карта лекции — 6 разделов"
    learning_goal: "Общая карта: что будет, в каком порядке"
    learning_outcomes: [LO1]
    chapter_ref: "§Карта главы"
    visual:
      pattern: lecture_roadmap_6_sections
      primary: "6 пронумерованных горизонтальных карточек по разделам (0 Введение / 1 Токенизация / 2 Эмбеддинги / 3 Внимание / 4 Сэмплинг / 5 Финал) с короткими описаниями. Активный раздел (Раздел 0) подсвечен gold-обводкой карточки, без минут."

  - id: s03
    file: slides/s03-recap-lec1.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1.5
    assertion: 'Сегодня углубляем слой «модель» из четырёх слоёв Лекции 1'
    learning_goal: "Recap Лекции 1 §3.2 + bridge к внутренностям модели"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s03]"
    visual:
      pattern: layers_recap_with_zoom
      primary: "Слева — маленькая копия nested layers из Lec-1 (модель → чат → агент → приложение) с подсветкой нижнего слоя «Модель» в gold. Справа — bullet-bridge «что мы знаем: модель = stateless inference (Lec-1 §3.2)» → «что узнаем сегодня: что внутри inference»."

  - id: s04
    file: slides/s04-central-question.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1
    assertion: "Главный вопрос: что внутри LLM меняет то, как мы её используем?"
    learning_goal: "Центральный вопрос + 3 промиса-якоря (callback к Lec-1 §5.3)"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§Введение [for-slide-s04]"
    visual:
      pattern: central_question_with_promises
      primary: "Центральный вопрос крупно (32pt bold #21295C). Снизу — 3 промиса-якоря в Ocean rounded boxes: (1) почему промпт с ролью лучше (→ Раздел 3), (2) почему AI плохо считает буквы (→ Раздел 1), (3) почему один запрос даёт разные ответы (→ Раздел 4). 3-я промиса с gold-маркером «payoff в s24»."

  # ─── Раздел 1. Токенизация (11.5 мин, 5 слайдов: s04a divider + s05-s08) ───
  - id: s04a
    file: slides/s04a-section1-tokens.md
    type: section_divider
    section: "Раздел 1. Токенизация"
    duration_min: 0.5
    assertion: "Раздел 1 — Токенизация: как модель видит ваш текст"
    learning_goal: "Section divider раздела 1 — переход к токенам"
    learning_outcomes: [LO1]
    chapter_ref: "§1 [for-slide-s04a]"
    visual:
      pattern: section_divider_with_roadmap
      primary: "Большое «Раздел 1» по центру (140pt gold). Под ним — «Токенизация». Frame-фраза «Как модель видит ваш текст». Внизу — roadmap-bar (6 секций) с gold-маркером на «1 Токены»."

  - id: s04b
    file: slides/s04b-data-flow.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 1
    assertion: "Поток данных в LLM: слова → токены → векторы → LLM → векторы → токены → слова"
    learning_goal: "Roadmap всего inference-конвейера перед детальным разбором каждого этапа"
    learning_outcomes: [LO1]
    chapter_ref: "§1 [for-slide-s04b]"
    visual:
      pattern: pipeline_7_stages_horizontal
      primary: "v1.5 NEW: горизонтальный 7-stage pipeline: Текст → Токены → Векторы → LLM (gold center) → Распределение → Токен → Текст. Под каждой стадией — короткая подпись. Под pipeline — 4 sub-cards Раздел 1/2/3/4 указывают какие стадии будем разбирать."

  - id: s05
    file: slides/s05-what-is-token.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Токен — id из словаря модели. Не буква и не слово; статистически частая подпоследовательность"
    learning_goal: "Базовое определение токена + ориентир «1 токен ≈ символы»"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s05]"
    visual:
      pattern: token_examples_3_cases
      primary: "3 примера разметки: cat → [cat] (1 токен / 1 id), tokenization → [token][ization], клубника → [к][луб][ника]. Внизу gold-callout: «в среднем 1 токен ≈ 4 символа EN ≈ 2 RU». Inline poll-prompt: «как разрезалось бы слово сильнее?»"

  - id: s06
    file: slides/s06-bpe-compromise.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "BPE — компромисс между алфавитом и словарём; словарь строится один раз перед обучением"
    learning_goal: "Что такое BPE + ключевая инженерная деталь «build once, lookup at inference»"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§1.2 [for-slide-s06]"
    visual:
      pattern: before_after_no_iteration
      primary: "Two columns Before/After: Before — обучающий корпус «low / lower / newest / widest»; After — BPE-словарь «low / er / new / est / wid». Без пошаговой итерации. Внизу — gold callout: «BPE-словарь строится один раз до обучения; в inference — lookup готовых правил»."

  - id: s07
    file: slides/s07-why-ai-cant-count-letters.md
    type: case_study
    section: "Раздел 1. Токенизация"
    duration_min: 3
    assertion: 'AI ошибается в «сколько r в strawberry» — потому что слова не из букв, а из 2-3 токенов'
    learning_goal: "Слепота к буквам — структурное ограничение + retrieval moment"
    learning_outcomes: [LO6, LO7]
    chapter_ref: "§1.3 [for-slide-s07]"
    visual:
      pattern: case_split_with_consequences
      primary: "Слева — strawberry → [st][raw][berry] (3 токена в o200k_base; модель видит 3, не 10 букв). Справа — 3 практических следствия в motif cards: (a) подсчёт символов, (b) опечатки → другие токены, (c) регистр и пробелы — разные id. Gold callout: «для побитово-точных операций — внешний инструмент, не LLM»."
    interaction: retrieval_live_attempt
    verify_day_of: true

  - id: s08
    file: slides/s08-cross-language-cost.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Один и тот же текст по-русски стоит в 2× дороже, чем по-английски"
    learning_goal: "Cross-language unfairness в токенизации + инженерное следствие для batch"
    learning_outcomes: [LO6]
    chapter_ref: "§1.4 [for-slide-s08]"
    visual:
      pattern: bar_chart_tokens_per_char
      primary: "Bar chart токены/символ для 4 языков: EN ~0.25, RU ~0.5, ZH ~0.8, Code (Python) ~0.4. RU bar выделен gold. Внизу — gold callout: «API-стоимость RU ≈ 2× EN. Batch на английском, если допустимо»."

  # ─── Раздел 2. Эмбеддинги (11.5 мин, 5 слайдов: s08a divider + s09-s12) ───
  - id: s08a
    file: slides/s08a-section2-embeddings.md
    type: section_divider
    section: "Раздел 2. Эмбеддинги"
    duration_min: 0.5
    assertion: "Раздел 2 — Эмбеддинги: пространство смыслов"
    learning_goal: "Section divider раздела 2 — переход к векторам"
    learning_outcomes: [LO1]
    chapter_ref: "§2 [for-slide-s08a]"
    visual:
      pattern: section_divider_with_roadmap
      primary: "Большое «Раздел 2» по центру (140pt gold). Под ним — «Эмбеддинги». Frame-фраза «Пространство смыслов». Внизу — roadmap-bar (6 секций) с gold-маркером на «2 Эмбеддинги»."

  - id: s09
    file: slides/s09-what-is-embedding.md
    type: assertion_visual
    section: "Раздел 2. Эмбеддинги"
    duration_min: 2
    assertion: "Каждому токену в памяти модели сопоставлен вектор; он выучен на тренировке и затем фиксирован"
    learning_goal: "Что такое эмбеддинг + lookup из learned embedding table"
    learning_outcomes: [LO1]
    chapter_ref: "§2.1 [for-slide-s09]"
    visual:
      pattern: token_to_vector_lookup
      primary: "Схема: [кот] → стрелка lookup → вектор [0.21, -0.45, 0.88, ..., 0.13] (5 размерностей с многоточием). Mini-callout справа: «text-embedding-3-small 1536 dim; text-embedding-3-large 3072 dim; внутренний эмбеддинг GPT-4 — тысячи измерений [FACT-CHECK]»."

  - id: s09a
    file: slides/s09a-embedding-space.md
    type: assertion_visual
    section: "Раздел 2. Эмбеддинги"
    duration_min: 1.5
    assertion: "Пространство эмбеддингов — это сотни-тысячи измерений; близкие по смыслу токены лежат рядом"
    learning_goal: "Что такое пространство эмбеддингов: размерность, как координаты выучиваются, проекция в 2D для интуиции"
    learning_outcomes: [LO1]
    chapter_ref: "§2.1 [for-slide-s09a]"
    visual:
      pattern: embedding_space_2d_concept
      primary: "v1.5 NEW: 2D scatter (PCA-style) — 3 кластера: животные {кот/собака/тигр}, транспорт {машина/авто/мотоцикл}, языки прог {Python/JavaScript}. Подписи осей как «измерение 1/2 ≈ живое/абстрактное». Справа 3 fact-cards: размерность (1536-3072), обучение (similar contexts → close vectors), проекция (PCA/t-SNE)."

  - id: s10
    file: slides/s10-sentence-similarity.md
    type: case_study
    section: "Раздел 2. Эмбеддинги"
    duration_min: 3
    assertion: "Близость в пространстве эмбеддингов = семантическая близость; в 2026 это работает на уровне предложений"
    learning_goal: "Sentence similarity на современных embeddings + cosine как мера"
    learning_outcomes: [LO1]
    chapter_ref: "§2.2 [for-slide-s10]"
    visual:
      pattern: similarity_heatmap_5x5
      primary: "Heatmap 5×5 cosine similarity для 5 предложений: (1) Как настроить SSL, (2) Установка HTTPS-сертификата, (3) Деплой React-компонента, (4) Сборка React-приложения, (5) Рецепт борща. Видны кластеры: 1↔2 ~0.85, 3↔4 ~0.78, борщ vs техническое ~0.05-0.15. Cells цветовая шкала Ocean (тёмный = высокое сходство)."

  # v1.5: s11 (3 uses of embeddings — similarity/clustering/search) REMOVED.
  # User feedback round 4 #5: «убрать, будем на следующей лекции разбирать».
  # Deferred to Лекция 3 (RAG).

  - id: s12
    file: slides/s12-semantic-vs-fulltext.md
    type: assertion_visual
    section: "Раздел 2. Эмбеддинги"
    duration_min: 2
    assertion: "Эмбеддинги — фундамент понимания LLM: модель работает в пространстве векторов, не строк"
    learning_goal: "Reformulation: эмбеддинги как фундамент LLM-понимания + обратное преобразование вектор→токен→слово"
    learning_outcomes: [LO1]
    chapter_ref: "§2.4 [for-slide-s12]"
    visual:
      pattern: vertical_pipeline_plus_3_examples
      primary: "v1.5 REFORMULATED: слева — вертикальная схема в обе стороны (слова → токены → векторы → LLM gold center → векторы → токены → слова), справа — 3 motif cards с иконками (перефразирования / синонимы / cross-lang) объясняющие, что даёт эмбеддингам «понимание». Gold callout: «семантическая близость на уровне предложений — основа понимания»."

  # ─── Раздел 3. Механизм внимания (18 мин, 5 слайдов: s13-s17) ───
  - id: s13
    file: slides/s13-section-divider-attention.md
    type: section_divider
    section: "Раздел 3. Механизм внимания"
    duration_min: 0.5
    assertion: "Раздел 3 — Механизм внимания: как модель решает, что важно сейчас"
    learning_goal: "Single section divider лекции (для самого плотного раздела)"
    learning_outcomes: [LO1]
    chapter_ref: "§3 [for-slide-s13]"
    visual:
      pattern: section_divider_with_roadmap
      primary: "Большое «Раздел 3» по центру слайда (mega 120pt в outline gold). Под ним мелким — «Механизм внимания». Внизу — roadmap-bar (5 карточек) с gold-маркером «Вы здесь — Раздел 3»."

  - id: s13a
    file: slides/s13a-attention-matrix.md
    type: assertion_visual
    section: "Раздел 3. Механизм внимания"
    duration_min: 2
    assertion: "Внимание — это матрица: каждый токен смотрит на все остальные одновременно"
    learning_goal: "Attention как матричная операция, не линейная — основа понимания multi-head + квадратичной стоимости"
    learning_outcomes: [LO1]
    chapter_ref: "§3.1 [for-slide-s13a]"
    visual:
      pattern: attention_matrix_7x7_heatmap
      primary: "v1.5 NEW: слева — 7×7 attention matrix для предложения «Кот съел мышь, потому что она была голодна», cell «она→мышь» подсвечена gold (0.7). Цвет cell кодирует weight (#21295C dark = high, #E3ECF3 light = low). Справа — 3 fact-cards: размерность (N×N, quadratic cost), пересчёт на каждом шаге, multi-head параллельность."

  - id: s14
    file: slides/s14-what-is-attention.md
    type: assertion_visual
    section: "Раздел 3. Механизм внимания"
    duration_min: 3
    assertion: "Attention выдаёт распределение весов на все токены контекста (сумма = 1) — какие токены важны сейчас"
    learning_goal: "Базовое определение attention через метафору фонарика + 3 факта"
    learning_outcomes: [LO1]
    chapter_ref: "§3.1 [for-slide-s14]"
    visual:
      pattern: flashlight_metaphor_plus_bar
      primary: "Слева — метафора «фонарик в тёмной комнате»: луч света падает на несколько предметов (= токенов) с разной яркостью. Справа — bar chart distribution весов на 8 токенов контекста, сумма = 1. Высота bar = «толщина стрелки» = вес внимания. Один bar gold (самый высокий вес)."

  - id: s15
    file: slides/s15-worked-example-role-effect.md
    type: case_study
    section: "Раздел 3. Механизм внимания"
    duration_min: 5
    assertion: "Role-токены получают повышенный вес в attention — это объясняет, почему промпт с ролью работает лучше"
    learning_goal: "Worked example (Part A) + role-effect (Part B) — первое из 3 «почему»"
    learning_outcomes: [LO7]
    chapter_ref: "§3.2 [for-slide-s15]"
    visual:
      pattern: two_part_attention_example
      primary: "Part A (вверху): предложение «Кот съел мышь, потому что она была голодна» с стрелками от «она» к «мышь» (толстая), «была» (средняя), «голодна» (тонкая). Disclaimer мелким: «упрощение — реальный attention map содержит сотни связей». Part B (внизу): 2 колонки side-by-side — без роли «Объясни асинхронность» (короткий контекст) vs с ролью «Ты эксперт по Python. Объясни асинхронность джуниору.» (role-токены подсвечены ярче). Gold callout: «1-е из 3 "почему" Лекции 1 §5.3»."
    interaction: retrieval_think_pause

  - id: s16
    file: slides/s16-context-window.md
    type: assertion_visual
    section: "Раздел 3. Механизм внимания"
    duration_min: 2
    assertion: "Контекстное окно — физический предел того, сколько модель видит одновременно"
    learning_goal: "Эволюция context window + квадратичная стоимость attention"
    learning_outcomes: [LO6]
    chapter_ref: "§3.3 [for-slide-s16]"
    visual:
      pattern: bar_chart_3_points_timeline
      primary: "Bar chart 3 точки на временной оси: GPT-3.5 (2022) 4k, Claude 3.5 (2024) 200k, Claude 4.7 (2026) 1M. Каждый bar выше следующего (логарифмическая шкала). Bar 1M подсвечен gold. Gold callout: «стоимость attention растёт квадратично от длины. 1M ≈ 16× дороже 100k»."
    verify_day_of: true

  - id: s17
    file: slides/s17-long-context-fails.md
    type: case_study
    section: "Раздел 3. Механизм внимания"
    duration_min: 2
