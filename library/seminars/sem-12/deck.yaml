# Архив изображений
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 12
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n09    6.50 мин
#   Кейсы      n10–n79   74.50 мин
#   Закрытие   n80–n88    6.50 мин
#   ИТОГО                  87.50 мин при слоте 90

deck:
  seminar_number: 12
  title: Архив изображений
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 87.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + схемы постановки задачи
    (сплошным — то, что уже собрано, пунктиром — то, что предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
    + измеренные замеры на корпусах CORD/SberQuAD (переиспользованы с Семинара 10, часть — новые на этом
    стенде), протоколы в `stend/`
  cover_hook: null
  central_question: Что процесс записывает об изображении при загрузке в архив?
  language: ru
  slide_count: 74
  axis: Процесс записал, что увидел на картинке; чем ручаемся, что по этой записи найдётся нужное — четыре
    утверждения, каждое выглядит разумным, и каждое сегодня будет измерено
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Процесс уже читает фотографию и ищет текст по смыслу; сегодня это складывается в одно умение
    — собрать архив изображений, способный самостоятельно отвечать на вопрос
  learning_goal: 'Обложка. Называет тему словами ARCHITECTURE.md §1 (собрать и проверить архив изображений),
    не номер ступени дуги — он открытый вопрос (ARCHITECTURE.md §6, issue #351).'
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия и номера ступени дуги на экране нет.

      '
    backup: 'Название и тема — дословный смысл ARCHITECTURE.md §1 («После С12 студент умеет собрать и
      проверить архив изображений, по которому процесс отвечает на вопросы»). Номер семинара и номер ступени
      дуги на обложке не печатаются — тот же приём, что у обложек С6/С8/С9/С11 (sem-06/qa/oblozhka-bez-nomera.md),
      и отдельно обязателен здесь: ARCHITECTURE.md §6 оставляет номер ступени дуги («картинка на входе»)
      открытым вопросом владельцу, присваивать его самовольно нельзя. Фигуры на обложке нет сознательно:
      ось занятия ставится дословно на n05, третье место на обложке сбило бы счёт с её будущим закрытием.'
- id: n02
  file: slides/n02-shov-s11-os-zakryta.md
  type: content
  duration_min: 1.0
  assertion: Пять усложнений прошлого занятия измерены, и у каждого своя цена — но все пять про текст,
    и ни одно не спрашивает, что процесс знает о картинке
  learning_goal: 'Шов с С11, один кадр. Правка дозаказчика 2026-11-21: дословная таблица из sem-11/slides/n100-os-zakryta.md
    с терминами С11 (recall@1, HyDE, multi-query) и числами в пунктах читается в принятой деке С11 (зал
    шёл к ним весь вечер), но на вторую минуту вступления С12 несёт чужой итог без разбега — таблица снята
    с видимого слоя, на кадре — одна строка итога своими словами + наблюдение, ради которого кадр существует
    (оно и было написано сильнее подписи под таблицей, теперь оно главное). Полная таблица и имена приёмов
    — в заметках, глоссированы по одному слову при первом появлении.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: одна строка о том, чем закрылось прошлое занятие, своими словами,
      без терминов и чисел; под ней крупно — наблюдение, ради которого кадр существует.

      '
    backup: Источник наблюдения и чисел — sem-11/slides/n100-os-zakryta.md, раздел «Visual» (таблица перенесена
      в заметки этого слайда полностью, не сокращена). На видимом слое ни одного англицизма без расшифровки
      и ни одной цифры в пунктах — соседние кейсы этого занятия сегодня снимали то же самое с видимого
      слоя, расхождения между кадрами одного занятия быть не должно.
- id: n03
  file: slides/n03-stroka-s10.md
  type: content
  duration_min: 1.0
  assertion: 'Семинар 10 закрылся обещанием, которое прошлое занятие не трогало: подпись к картинке теряет
    то, что на ней видно, и прямое сравнение картинок на стенде не заработало'
  learning_goal: 'Долг, названный в ARCHITECTURE.md §2 прямо: закрывающая строка С10 (sem-10/rework/section-6-zakrytie.md,
    раздел «Ось занятия, теперь заполненная», четвёртая строка), процитированная дословно и крупно — не
    пересказом в подзаголовке (правка дозаказчика 2026-11-21: «сильнейший кадр вступления», цитата должна
    стоять дословно и крупно). Это обещание пережило целое занятие (С11), которое его не касалось — см.
    n02.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: дословная цитата закрывающей строки С10 — крупно, во весь кадр, двумя
      частями (левая/правая половина исходной строки таблицы). Под ней — одна строка о том, что этот долг
      пережил целое занятие и закрывается сегодня.

      '
    backup: Текст — дословно sem-10/rework/section-6-zakrytie.md, раздел «Ось занятия, теперь заполненная»,
      четвёртая строка (та же цитата, что ARCHITECTURE.md §2 приводит как долг шва). Перенесена крупно
      и целиком, не сокращена и не пересказана.
- id: n04
  file: slides/n04-stsena-arkhiv-ne-otvechaet.md
  type: content
  duration_min: 1.0
  assertion: Архив сканов Ольги вырос за месяц; вопросов к нему стало больше одного, а честного способа
    отвечать на все эти вопросы одним механизмом так и не появилось
  learning_goal: 'Сцена вступления, один кадр (потребность + цена вместе, по правке дозаказчика 2026-11-21:
    «канон требует их вместе» — не два отдельных такта, как в формальном разборе кейса с замером, здесь
    это вводная сцена всего занятия, не замер отдельного кейса). Продолжает сквозного персонажа Ольгу
    и её архив сканов, уже введённые на С10 (sem-10/slides/n60-k4-stsena.md) и упоминаемые в С11 — не
    знакомит заново (канон §8, С8: опора на память зала о прошлых занятиях запрещена как постановка, но
    пересказ заново того, что уже показано схемой, — тоже лишнее; здесь архив называется словами, без
    повторной схемы постановки С10). Без спойлера находок конкретных кейсов этого занятия.'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: плашка «Что изменилось» (архив вырос, вопросов больше одного) и плашка
      «Цена» (конкретный провал Ольги) рядом.

      '
    backup: 'Текст — продюсерское обобщение ARCHITECTURE.md §1 («картинку он видел дважды... закончился
      честным „прямое сравнение картинок не заработало“») и SETKA-KEYSOV.md (сцены кейсов 1 и 3 этого
      занятия, которые работают с тем же архивом) в вводную, не кейсовую, сцену. Плашка «Цена» берёт формулировки
      цен из сцен кейсов 1 и 3 (n11: час на ручной пересмотр папки; n51: повторно оплаченная справка)
      — цены сцен, не числа замеров. Честная оговорка «прямое сравнение картинок на этом стенде технически
      не заработало» сохранена дословно в заметках. Не повторяет сцену ни одного из четырёх кейсов буквально
      — обобщает общую постановку дня без раскрытия конкретных чисел или находок.'
- id: n05
  file: slides/n05-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Процесс записал, что увидел на картинке; чем ручаемся, что по этой записи найдётся нужное
    — четыре утверждения, каждое выглядит разумным, и каждое сегодня будет измерено
  learning_goal: 'Несущая ось занятия, оставлена двухминутной по правке дозаказчика 2026-11-21 («это keystone,
    не режьте»). Левая колонка — дословно ARCHITECTURE.md §3, четыре строки в том же порядке. Вопрос занятия
    — дословно ARCHITECTURE.md §1 («её вопрос: процесс записал, что увидел на картинке; чем ручаемся,
    что по этой записи найдётся нужное»). Правая колонка открывается пустой и закрывается на закрывающем
    слайде занятия (не в этой сессии).'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, четыре строки. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — дословно из ARCHITECTURE.md §3. Вопрос занятия — дословно из ARCHITECTURE.md
      §1. ЗАГОЛОВОК И ПЕРВАЯ СТРОКА — ПРО САМУ ОСЬ (Pre-USER-GATE §6): заголовок называет вопрос, которым
      занятие мерит каждый свой разбор. Четыре строки — по числу кейсов С12 (BRIEF-PROIZVODSTVO.md §10).'
- id: n06
  file: slides/n06-chto-segodnya.md
  type: content
  duration_min: 1.0
  assertion: 'Четыре кейса подряд: что процесс запоминает о картинке, как картинка становится числами,
    чем её искать и как число похожести превращается в вердикт'
  learning_goal: 'Обзор занятия, один кадр (по правке дозаказчика 2026-11-21: «шаги сборки архива» и «четыре
    кейса» — один и тот же список, порядок шагов читается из самого списка, без отдельного кадра-обзора).
    Называет четыре кейса по задаче (не по тезису), без раскрытия находок — матчит паттерн С10/С11 (sem-10/slides/n04,
    sem-11/slides/n04). Без минут на видимом слое (запрет курса).'
  visual:
    pattern: content
    primary: 'Список из четырёх пунктов, каждый — одна-две строки задачи без спойлера находки. Порядок
      пунктов — порядок, в котором картинка проходит через архив: запись → числа → поиск → вердикт.

      '
    backup: Источник — SETKA-KEYSOV.md, сводная таблица и дивайдеры кейсов 1–4. Имена кейсов — по задаче
      (канон §1 проектирования). Находки (например, что происходит с полем «персональные данные», или
      что побеждает бесплатная модель, или что метод отвечает одним документом на любой запрос) сознательно
      НЕ вынесены на этот слайд — спойлер здесь нарушил бы А1/С2 (результат раньше самого кейса). Минут
      на кадре нет (запрет курса — тайминг только во фронтматтере).
- id: n10
  file: slides/n10-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Процесс просит модель описать фотографию и получает связный абзац — верный по содержанию
    и бесполезный для будущего запроса
  learning_goal: 'Дивайдер Кейса 1. Называет проблему (А2), не решение и не тезис (А10 на уровне кейса
    — proektirovanie-keysa-i-voprosa.md §1): предмет — «что процесс пишет в индекс», не вывод «подробнее
    не значит лучше». Дорожка четырёх кейсов занятия, первый подсвечен.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка проблемы крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Название кейса и формулировка проблемы — SETKA-KEYSOV.md Кейс 1, строка «Дивайдер-проблема»,
      дословный смысл. Имя кейса («Что процесс пишет в индекс») — задача/функция, не тезис (проверка §1
      proektirovanie-keysa-i-voprosa.md: прочитать имя человеку, который дальше не видел текста — по одному
      названию нельзя угадать, чем кейс кончится).'
- id: n11
  file: slides/n11-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольге нужна фотография с выпускного без посторонних и с логотипом — процесс отдаёт шесть
    снимков, и ни один не отвечает на заданный вопрос
  learning_goal: 'Такт сцены Кейса 1 (А2, П2 — человек и цена). Схема постановки С1: сплошное — поток,
    который уже работает (фото в архив → модель описывает абзацем → абзац лежит рядом с файлом); пунктирная
    золотая стрелка — узел, который кейс решает сегодня: чем именно описание должно быть.'
  visual:
    pattern: problem_scenario
    figure: k1-shema-postanovka.png
    primary: 'Сверху — схема С1: сплошной поток «фото → модель описывает → абзац в архиве», пунктирная
      золотая стрелка указывает на узел решения этого кейса. Под схемой — сцена Ольги прозой и цена.

      '
    backup: 'Схема — `rendered/make_figures_k1.py::k1_shema_postanovka`, правило С1 forma-keysa-s-zamerom.md
      §2: сплошное — уже работающий поток, пунктир — узел, который предстоит решить сегодня. Сцена и цена
      — дословный смысл SETKA-KEYSOV.md Кейс 1, строка «Сцена-человек-цена», и research/01-opisaniya-i-indeks.md
      «Постановка».'
- id: n12
  file: slides/n12-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.0
  assertion: Три действия для описания фотографии при загрузке в архив — без подсказки, какое из них лучше
    находит нужное через месяц
  learning_goal: 'Вопрос Кейса 1: три карточки-действия, без вердиктов и доводов за/против (А6). Разбор
    — сразу следующим тактом (А1).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, три карточки равной ширины, без вердиктов.

      '
    backup: 'Карточки — SETKA-KEYSOV.md Кейс 1, «Ось сравнения», переформулированы действием, не фактом
      о возможностях (proektirovanie-keysa-i-voprosa.md §5): «записывать свободную подпись» / «заполнять
      поля по схеме» / «записывать гибрид» — глагол действия у каждого варианта, ни один не называет,
      какой из трёх лучше справится с непредвиденным вопросом.'
- id: n13
  file: slides/n13-k1-struktura-zamera1.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 30 сканов CORD, три варианта описания на каждый, одна и та же модель — структура замера до
    единого результата
  learning_goal: 'С2 такт 1 (forma-keysa-s-zamerom.md §1): структура теста ДО результатов. Модель и настройки
    названы (С5). Реальный скан с сеткой патчей показывает механику «кадр → патчи → токены» (ARCHITECTURE.md
    §8.1). Настоящий пример одного скана и трёх сгенерированных описаний рядом, дословно из raw/descriptions_results.json.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-scan-grid.png
    primary: 'Плашка вызова (модель и настройки, С5). Настоящий скан CORD с сеткой патчей поверх (не перерисован
      — наша разметка на реальном снимке). Таблица: вариант · что возвращает модель · пример ответа на
      этом же скане, дословно.

      '
    backup: Числа и факты — stend/zamery-k1/README.md, «Модель и настройки» и «Структура теста (С2, такт
      1)». Пример — receipt_28, дословно из raw/descriptions_results.json::per_call («receipt_28|caption»,
      «|fields», «|hybrid») — не сокращено по смыслу, длинная подпись приведена целиком. Сетка 6×9 патчей
      — иллюстративная, подпись на схеме называет число патчей без утверждения о точном устройстве токенизатора
      модели (этого числа нет в документации OpenRouter). Результатов на этом кадре нет — они на n14 (такт
      2).
- id: n14
  file: slides/n14-k1-svod-zamera1.md
  type: axis_table
  duration_min: 0.75
  assertion: Поля верны на 13 из 16 лёгких запросов, подпись — на 1, гибрид — на нуле; на трудных запросах
    не берёт никто
  learning_goal: 'С2 такт 2 (свод). Числа — плашкой и таблицей (А11), не внутри абзаца. Группы запросов
    (лёгкие/трудные) те же, что в экспозиции на n13 — дословно (forma-keysa-s-zamerom.md §1, такт 2: имена
    и порядок групп совпадают с экспозицией).'
  visual:
    pattern: axis_table
    figure: k1-recall-chart.png
    primary: 'Схема-график доли запросов с верным первым документом для трёх вариантов на лёгких и трудных
      запросах. Под ней — таблица с длиной и ценой, одна размерность на колонку (С6).

      '
    backup: Числа — stend/zamery-k1/README.md «Свод (С2, такт 2)» и дополнение 2026-11-21 (расширенный
      набор 16 лёгких + 3 трудных, не старые 2 запроса). recall@1 0,8125/0,0625/0,0 на лёгких; 0,0/0,0/0,0
      на трудных. Длина и цена — из исходного прохода на 90 вызовах, не зависят от набора запросов.
- id: n15
  file: slides/n15-k1-razbor-polya.md
  type: content
  duration_min: 1.25
  assertion: Три промаха полей на 16 запросах — не три независимые ошибки, а одна ошибка извлечения, задевшая
