    assertion: "Two of the harness's five slots are closed today; the other three plus both mechanical layers (hook, process) — Seminar 5"
    learning_goal: "Section 3's synthesis, step 3.2 — the session's honest coverage is named directly, in the same even tone as section 0's scope statement; the map of the five slots is not re-assembled through co-building, it is shown as a static final version"
