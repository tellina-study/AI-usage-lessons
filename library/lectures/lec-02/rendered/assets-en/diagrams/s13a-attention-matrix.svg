<rect x="130" y="300" width="60" height="60" fill="#B3CADD"/><text x="160" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#21295C">0.1</text>
<rect x="200" y="300" width="60" height="60" fill="#1C7293"/><text x="230" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
<rect x="270" y="300" width="60" height="60" fill="#1C7293"/><text x="300" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
<rect x="340" y="300" width="60" height="60" fill="#21295C"/><text x="370" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">1.0</text>
<rect x="410" y="300" width="60" height="60" fill="#065A82"/><text x="440" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.3</text>
<rect x="480" y="300" width="60" height="60" fill="#1C7293"/><text x="510" y="337" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
