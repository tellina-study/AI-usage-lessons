    backup: 'Источник — section-2-subagent.md §A.2 «Критерий» + «Строка оси», section-2-subagent-part1b.md
      n56, дословно. Круг 2 правок владельца (issue 225, §А2): закрывающий абзац («Доверие к отчёту роли
