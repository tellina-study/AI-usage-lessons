    backup: 'Устройство — по SETKA-KEYSOV-S9-part2.md, раздел «Кейс 6», подраздел «Решение», слой 1: «фото
      и текст заявки → классическое распознавание переводит фото в текст → модель получает текст (не пиксели)
      вместе с суммой из заявки → код сравнивает извлечённое число с суммой из текста клиента».

