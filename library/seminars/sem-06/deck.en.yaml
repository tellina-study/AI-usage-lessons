      The attribution in the material follows the provenance of every piece: the admission is the course
      author''s, searching for working keys is his own experience, and blocking within seconds is an account
      by students, named as an account. [FACT-CHECK: whether the named provider publishes a watchdog for
      leaked keys as a stated property of its service and what the declared blocking time is — this was
      entered into the material PRECISELY as an account by students from a previous cohort, not as a verified
