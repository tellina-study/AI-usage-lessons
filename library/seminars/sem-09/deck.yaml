      Что на кадре видно буквально: восемь узлов, из них три новых по сравнению с версией 1 — узел проверки,
      узел уведомления Ольги и второй экран ответа; две помеченные ветки `true` и `false` от узла проверки;
      модель подвешена к узлу ответа так же, как в версии 1 — она никуда не делась. Пометка со звёздочкой
