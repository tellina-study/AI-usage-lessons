    backup: 'Строка про хук из клонированного репозитория сводит узел, который прожарка нашла дважды подряд:
      сорок минут хук хвалят за приезд с клоном без установки, двадцать минут спустя объясняют, что чужой
      каталог с кодом исполняется с правами сессии. Рядом эти две мысли не ставил никто; поставлены здесь,
      потому что кейс именно про то, что впускаешь. Владелец заказал кейс словами «есть классный отлаженный
      внешний, и его лучше взять, чем самим рожать» — предел обязан отвечать именно на это, поэтому левая
