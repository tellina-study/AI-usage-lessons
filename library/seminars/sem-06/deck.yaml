    сессий и риски при работе субагентов в одной папке»). Развилка предъявляет поворот кейса целиком:
    интуиция зала «работают разом — развести надо всех» ставится рядом с тем, что поле изоляции у субагента
    существует и почти не используется. Дальше кейс этот поворот доказывает: n58 — два случая столкновения
    в производстве самого курса; n59 — цена возврата, из-за которой копию субагенту не дают. Слово «субагент»
    стоит знакомым — его ввела база ступени (n30)'
  visual:
    pattern: section_divider_macro
    primary: Тёмный Ocean-фон, заголовок в две строки, золотая линия под ним. Ниже — смысловая строка,
      несущая поворот целиком. Внизу — дорожка кейсов этой ступени, активная отметка — третья.
    backup: 'Круг 5 (issue 225, ZADANIE-KRUG-5.md, замечание владельца по кейсу 6). Прежний кейс («Роль
