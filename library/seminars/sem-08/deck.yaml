      числа, что и на n20/n21, не пересчитаны заново.

      Пример одной пары для конкретности (id 6, перефразировка, реальные тексты из набора): «когда можно
      оплатить занятие?» → «как мне внести оплату за курс», jev_noul = 0.76 — выше порога, jev верно распознал
      перефразировку там, где хэш и TF-IDF дают 0 по конструкции (разные строки, нет общих значимых слов).

      Execution id нигде не упомянуты — ни в тексте слайда, ни в заметках, ни на фигуре (канон §3): вместо
      номеров прогонов — id пары из тестового набора (1–20), это идентификатор данных, а не идентификатор
      стенда.'
