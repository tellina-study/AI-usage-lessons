- id: n57
  file: slides/n57-mostik-k-s9.md
  type: bridge_forward
  duration_min: 2.5
  assertion: Сегодня каждый шаг по очереди получал модель или код, одной дорогой для любого входа; на
    Семинаре 9 разные входы начинают требовать разных путей
  learning_goal: Замыкание занятия и постановка следующего. Ступень называется своим именем, без обещания
    «будет интереснее».
  visual:
    pattern: bridge_forward
    figure: mostik-s9-razvilka.png
    primary: 'Две строки одной ширины. Верхняя, приглушённая, — сегодняшний процесс: любая заявка → одна
      цепочка → один выход. Нижняя — та же заявка приходит на развилку (единственное золото схемы), и
      от неё расходятся три пути: про оплату, про перенос занятия и пунктиром — вход, не подошедший ни
      под одну ветку, у которого путь по умолчанию. Под схемой одна строка о том, из чего состоит следующее
      занятие.

      '
    backup: 'ВОЛНА 2б «конфетки» (issue #292, план §4.13): текстовый бокс «Сейчас / Дальше» заменён схемой
      `mostik-s9-razvilka.png` (рисовалка `rendered/make_figures_n57.py`, где записаны и раскладка, и
      причины каждого решения). Прежний бокс писал развилку словами со стрелками- символами в одну строку
      — три пути читались перечислением, а не ветвлением, то есть именно та разница, ради которой существует
      следующее занятие, на экране отсутствовала. Вдобавок бокс был золотым и стоял рядом с золотой планкой
      «Семинар 9: …» — два акцента при одном допустимом (§3.8 плана). Схема снимает оба: ветвление показано
      формой, золото осталось одно — на узле развилки, а планка под схемой набрана фактом.

      План §4.13 допускал «развилку пунктиром ПОВЕРХ бледной текущей схемы»; выбрано другое — две отдельные
      строки. Причина в рисовалке: наложение одного графа на другой читается как один сложный граф, и
      студент не знает, какие линии «сегодня», а какие «дальше».

      Содержание строго по KONTSEPTSIYA-7-12.md §7, строка С9: «ветвление: условие против переключателя,
      классификация как шаг, ветка по умолчанию, слияние»; типовая проблема «вход, не подходящий ни под
      одну ветку; Merge режет по первому входу»; концептуальный разбавитель «Optum или IRS — на чём классификатор
      решает» (выбор между двумя кейсами ещё не сделан на момент этого файла — не предрешаю его здесь).'
