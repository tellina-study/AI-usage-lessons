# Прозаическая часть карты слайдов и имена кейсов — то, что из слайдов не
# выводится. Всё остальное в `SVODKA-SLAIDOV.md` считает `make_svodka.py`:
# состав, номера, типы, заголовки, минуты и итоги. Руками карту не правят
# (канон §8.5) — правят этот файл либо сам слайд.

title: "Карта слайдов — Семинар 6 (сведение после проведения)"

# Имя кейса — короткое, для карты. Дивайдер называет проблему словами сцены,
# и в заголовок карты он не годится. Нумерация кейсов сквозная по занятию.
keysy:
  1: данных нет в репозитории
  2: подключённые серверы занимают контекст до начала работы
  3: чтение вытесняет из контекста саму правку
  4: задача пришла одной фразой, средств ускорить больше одного
  5: исполнителей несколько, рабочая папка одна

# Полные имена блоков для заголовков карты. Сборщик деки знает их короткими
# («MCP», «Субагент») — дорожке больше и не нужно.
bloki:
  MCP: MCP, доступ наружу
  Субагент: Субагент, урезанная роль

# Состав «начала ступени» — тех экранов блока, что стоят до первой сцены.
nachalo:
  MCP: развилка кейса 1, база, схема, одностраничник
  Субагент: развилка кейса 3, база, одностраничник

vstupleniye: |
  Таблица собрана из файлов слайдов, а не из плана: номер, блок, тип, заголовок экрана и минуты
  взяты из фронтматтера и первой строки каждого файла. Границы блоков и кейсов выведены по
  развилкам (`section_divider_macro`) — тем же способом, каким их выводит сборщик деки.

  Нумерация сквозная, `n01`…`n64`, без буквенных хвостов. Она сведена при сведении после
  проведения (issue 225, `qa/svedenie-posle-provedeniya.md`): свёртка слабого кейса оставила
  в деке дырку, а четыре внесённых куска стояли с буквой на конце (`n14a`, `n49a`, `n49b`,
  `n59a`). Все номера в отчётах `qa/`, записанные до 2026-10-10, относятся к прежней
  нумерации; карта соответствия — в том же отчёте сведения.

  Кейсов на занятии пять: два в блоке MCP, три в блоке субагента. Кейс «сервер подключён, а
  агент через него не ходит» свёрнут до одного экрана внутри кейса подключения — ведущий снял
  его вслух в обеих группах (`qa/RAZBOR-PROVEDENIYA.md` §A2). В обоих блоках развилка первого
  кейса, база и одностраничник вынесены в «начало ступени»: сначала устройство инструмента,
  потом рабочие развилки.
