      0 перекидываний из 10 и 0 расхождений набора из 10. Находка СМЕНИЛА ФОРМУ, а не исчезла: вместо
      случайной нестабильности — устойчивая ошибка и устойчивое противоречие (канон §8.11, пятый замер
      производства, поправка к правилу «ноль проверяется на лёгкость случая»).

      СТРОКА СРАВНЕНИЯ С ЛЁГКИМ ВОПРОСОМ — из `stend/zamery-k5-k6/README.md`, Замер 3.1: 25 повторов при
