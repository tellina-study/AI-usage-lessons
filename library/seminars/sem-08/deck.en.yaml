# Where the model decides, and where code must
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 08
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Introduction n01–n03    5.50 мин
#   Axis       n04–n04    4.00 мин
#   Cases      n05–n50   92.50 мин
#   Closing    n51–n53    7.25 мин
#   ИТОГО                 118.75 мин при слоте 90

deck:
  seminar_number: 8
  title: Where the model decides, and where code must
  audience: 3rd-year students, 09.03.01 — practicing engineers, all already use AI assistants daily
  duration_min: 118.75
  format: facilitator slides + open questions with option cards (question BEFORE the breakdown) + a measured
    experiment in Case 3 (51 runs, later extended to 101); during the session the facilitator does not
    edit any n8n node live — only runs already-prepared workflows (owner decision, see ARCHITECTURE.md
    §4)
  cover_hook: null
  central_question: How do you assemble the notification text from these three values?
  language: en
  slide_count: 67
  axis: 'Four rows — and in each one, something that looks reliable today. The right column is empty:
    we will fill it in one row at a time, one per case.'
  slot_min: 90
slides:
- id: n01
  file: slides-en/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Every new step the chain picks up today is checked against one question: does the model
    decide this, or should code?'
  learning_goal: Cover slide. Names the session's topic and places it on the same arc rung as S7 — a chain,
    not a new rung.
  visual:
    pattern: hero_cover
    primary: 'Dark Ocean gradient, a large title, a thin gold bar, a subtitle line. No seminar number
      on screen (owner decision, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Third production wave (issue #274, the owner''s extended feedback, 16 points). The session''s
      topic is verbatim from SETKA-KEYSOV-S8.md: "where in the chain the model decides, and where code
      must." Wave 1 (n01–n16): intro, axis, Case "Notifications".'
