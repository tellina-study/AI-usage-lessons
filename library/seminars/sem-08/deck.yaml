# Где решает модель, а где должен — код
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 08
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    5.50 мин
#   Ось        n04–n04    4.00 мин
#   Кейсы      n05–n50   82.00 мин
#   Закрытие   n51–n53    7.00 мин
#   ИТОГО                  98.50 мин при слоте 90

deck:
  seminar_number: 8
  title: Где решает модель, а где должен — код
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 98.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + измеренный эксперимент
    Кейса 3 (51 прогон); на занятии ведущий ничего не редактирует в узлах n8n вживую — только прогоняет
    уже готовые процессы (решение владельца, см. ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Как собрать текст уведомления из этих трёх значений?
  language: ru
  slide_count: 53
  axis: 'Четыре строки — и в каждой то, что сегодня выглядит надёжным. Правая колонка пуста: мы заполним
    её по одной строке за кейс'
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Каждый новый шаг, который цепочка получает сегодня, проверяется одним вопросом: это решает
    модель, или должен решать код?'
  learning_goal: Обложка. Называет тему занятия и его место на той же ступени дуги, что и С7 — цепочка,
    не новая ступень.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Третья волна производства (issue #274, развёрнутая обратная связь владельца, 16 пунктов).
      Тема занятия — дословно из SETKA-KEYSOV-S8.md: «где в цепочке решение принимает модель, а где должен
      — код». Волна 1 (n01–n14): ввод, ось, кейс «Уведомления».'
- id: n02
  file: slides/n02-shov-s7-s8.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Входное состояние — буквально файл student.json с прошлого занятия: шесть узлов, без единого
    изменения'
  learning_goal: 'Шов С7→С8: процесс предъявлен как есть, не пересказан. Повод для сегодняшних кейсов
    — не то, что эти шесть узлов плохие, а то, что цепочке предстоят новые шаги, которым этот вопрос ещё
    не задавали.'
  visual:
    pattern: mechanism_node_graph
    figure: shov-s7-s8.png
    primary: 'Программная схема шести узлов student.json как есть, примитивами слева направо: форма (триггер)
      → извлечение полей (+ подключённая модель) → справочник → запись → экран результата, плюс отдельной
      веткой — отказ: повтор три попытки на узле извлечения → отдельная запись «не разобрано» → отдельный
      экран. Никаких новых узлов на этой схеме нет — это точка старта, не решение.

      '
    backup: Схема — rendered/make_figures_n02.py, составлена по sem-07/stend/ student.json (узлы form
      → extract+model → vocab → запись → экран, retryOnFail/maxTries=3 на extract, вторая ветка на status=not_parsed).
      Геометрия и подписи — та же стилистика, что на выходной схеме Семинара 7 (sem-07/rendered/make_figures_s7.py,
      функция protsess, стадии 3–4). Ни одного узла сверх того, что было на стенде С7 к концу занятия,
      не добавлено (ARCHITECTURE.md §2, шов). Содержание узлов — буквально sem-07/stend/student.json.
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: taxonomy_compare_table
  duration_min: 2.5
  assertion: 'Та же ступень, что и в прошлый раз: цепочка. Сегодня мы не поднимаемся выше — мы её усложняем'
  learning_goal: 'Короткое напоминание лестницы дуги, не повторный ввод — аудитория уже видела этот экран
    на С7. Закрепляет: вопрос «модель или код» живёт внутри одной ступени, не требует перехода на следующую.'
  visual:
    pattern: taxonomy_compare_table
    figure: lestnitsa-dugi.png
    primary: 'Та же лестница из девяти ступеней, что и на прошлом занятии, золотая полоса стоит на том
      же месте, что и в прошлый раз — она не сдвинулась. Короткая подпись вместо повторного объяснения
      всей лестницы.

      '
    backup: 'Напоминание, не переобучение: полный ввод лестницы и правило «не поднимайся без требования,
      которого ступень ниже не закрывает» уже были на С7 (sem-07/slides/n02-lestnitsa-dugi.md). Фигура
      `lestnitsa-dugi.png` уже существует в rendered/figures/ этого занятия — переиспользуется, не рисуется
      заново.'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 4.0
  assertion: 'Четыре строки — и в каждой то, что сегодня выглядит надёжным. Правая колонка пуста: мы заполним
    её по одной строке за кейс'
  learning_goal: Ось занятия, дословно из SETKA-KEYSOV-S8.md. Правая колонка открывается пустой (Pre-USER-GATE
    §6, keystone-axis check) и закрывается в конце занятия (n51), не здесь.
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, четыре строки. Левая колонка заполнена, правая — пуста, клетки пунктирные.
      Под таблицей одна строка про то, что правая колонка закроется по ходу занятия, не вся сразу в конце.

      '
    backup: Текст левой колонки — дословно из SETKA-KEYSOV-S8.md, раздел «Ось занятия», не переформулирован.
      Правая колонка в SETKA размечена служебными пометками «закроется в кейсе…» для производства — на
      видимом слайде их нет, колонка пуста целиком (прямое указание брифа этой волны).
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Марина, координатор учебного центра, попросила одно сообщение в Telegram на каждую многотемную
    заявку
  learning_goal: 'Дивайдер кейса 1. Название по функции (канон §1): «Уведомления», не тезис. Реплика —
    потребность, не решение (А2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Название кейса — «Уведомления», по функции, не по уроку («лишний шаг цепочки» — отклонённый
      вариант, проверка §1 канона proektirovanie-keysa- i-voprosa.md: по одному имени нельзя угадать,
      чем кейс закончится). Реплика — развёрнутая формулировка потребности Марины из SETKA-KEYSOV-S8.md,
      не буквальная цитата (в источнике потребность дана не как прямая речь).'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 2.5
  assertion: Версия 1 добавила отдельный шаг модели, который сочиняет текст уведомления свободно — и один
    раз вставила в сообщение буквальный текст-плейсхолдер
  learning_goal: 'Такт сцены: конкретный целевой текст (дан постановкой) + версия 1 + находка практики
    (плейсхолдер), без вычитывания из таблицы — связный рассказ с конкретным примером, не абстракция.'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с целевым примером текста уведомления, под ней — описание версии 1 и реальная
      находка (плейсхолдер в тексте у Олега). Без таблиц, без системных идентификаторов стенда.

      '
    backup: Целевой текст и находка — дословно из SETKA-KEYSOV-S8.md («Потребность — конкретно» и «Что
      показала практика») и BRIEF-PROIZVODSTVO.md §3; находка подтверждена реальным прогоном стенда (см.
      stend/README.md, «Кейс 1» — номер execution в backup не выносится на слайд по канону §3). Прежняя
      формулировка находки в раннем черновике SETKA («подписала заявку как «срочный повторный звонок»»)
      не использована — она не совпадает с реально зафиксированным результатом стенда и с прямым указанием
      этой волны; открытый вопрос оркестратору указан в финальном отчёте.
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Четыре действия, явным спектром от полной свободы модели до полной алгоритмической сборки
  learning_goal: 'Вопрос кейса 1: голые карточки-действия, без доводов и вердиктов (А6, канон §5 — дизайн-выбор,
    не факт).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      от «модель решает всё» до «алгоритм решает всё». Без пояснений и доводов на карточках — разбор экраном
      позже.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S8.md, раздел «Вопрос залу: как собрать текст уведомления
      из этих трёх значений?», не переформулированы. Каждая карточка — действие («заполняем», «зовём модель»,
      «добавляем»), не факт о возможностях инструмента (канон §5).'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Три из четырёх действий решают задачу, которой у Марины уже нет: все значения извлечены
    заранее, интерпретировать нечего'
  learning_goal: Разбор сразу за вопросом (А1), единая форма «что делает / чего не делает» (А5), без вердиктов
    «верно/неверно».
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · что делает · чего не делает или ограничение. Без колонки вердикта —
      решение экраном дальше.

      '
    backup: Текст разбора — сведён из SETKA-KEYSOV-S8.md, раздел «Разбор», не переформулирован по сути,
      только уложен в табличную форму (А5).
- id: n09
  file: slides/n09-k1-shema-s-llm.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Архитектурная схема версии 1: форма → извлечение → узел-модель сочиняет текст свободно →
    Telegram'
  learning_goal: Слой 1 (архитектура, системно-нейтрально) для версии с LLM — один слайд, без имён вендора
    в формулировке решения (канон §2). Первая из двух архитектурных схем для сравнения.
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-s-llm.png
    primary: 'Принципиальная схема без имён вендора: форма → извлечение полей → узел-модель (сочиняет
      текст свободно) → отправка в Telegram. Ровно четыре блока в ряд, одна стрелка-ветка к существующей
      цепочке.

      '
    backup: 'Системно-нейтральная формулировка узла — «шаг, который вызывает модель на каждый прогон и
      получает от неё свободный текст» — не называет конкретный инструмент (канон §2: формулировка не
      должна меняться, если завтра цепочку собирают не в n8n). Фигура входит в список §5 BRIEF-PROIZVODSTVO.md;
      если на момент сборки файла ещё нет на диске — имя финальное, сверка перед финальной сборкой.'
- id: n10
  file: slides/n10-k1-shema-bez-llm.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Архитектурная схема версии 2: форма → извлечение → узел подстановки значений в шаблон →
    Telegram'
  learning_goal: Слой 1 (архитектура), вторая схема — без LLM. Разница с предыдущим экраном ровно в одном
    узле, не в остальной цепочке (прямое сравнение, а не отдельная история).
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-bez-llm.png
    primary: 'Та же принципиальная схема, что и на предыдущем экране, с заменой ровно одного блока: форма
      → извлечение полей → узел подстановки значений (шаблон) → отправка в Telegram.

      '
    backup: Системно-нейтральная формулировка — «подстановка значений в фиксированную форму вместо вызова
      модели» (канон §2, прямой пример корректной формулировки первого слоя). Фигура из списка §5 BRIEF-PROIZVODSTVO.md.
- id: n11
  file: slides/n11-k1-n8n-versiya1.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'Настоящая конфигурация версии с моделью: узел «Compose notification (LLM)» с реальным промптом
    и узлом модели рядом'
  learning_goal: 'Слой 2 для версии 1 — n8n-стилизованная схема (программная, не снимок живого UI — недостижим
    в этой среде, см. врезку в SETKA и notes/mcp-limitations.md #233-8), с настоящими именами узлов и
    настоящим промптом. Без workflow/execution id на экране (канон §3).'
  visual:
    pattern: mechanism_node_graph
    figure: k1-n8n-versiya1.png
    primary: 'Программно нарисованная схема в визуальном языке n8n: узел «Compose notification (LLM)»
      с видимым текстом промпта, рядом узел модели, стрелка к узлу отправки в Telegram. Без таблиц id,
      без служебных идентификаторов стенда.

      '
    backup: 'Программная схема, НЕ снимок живого UI — живой скрин недостижим в этой среде окончательно
      (решение владельца, ARCHITECTURE.md §5). Имена узлов и промпт — настоящие, из stend/stage-1-before.json:
      узел «Compose notification (LLM)» (chainLlm), модель «Model (notification)» (openai/gpt-4o-mini).
      Workflow/execution id этой версии в документации производства (stend/README.md), на слайде не выносятся
      (канон §3).'
- id: n12
  file: slides/n12-k1-n8n-versiya2.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'Настоящая конфигурация версии-шаблона: один узел подстановки значений, без единого обращения
    к модели'
  learning_goal: Слой 2 для версии 2 — та же n8n-стилизованная схема, теперь с узлом подстановки вместо
    узла модели. Второй слой обязателен на каждой версии, не только на одной (канон §2).
  visual:
    pattern: mechanism_node_graph
    figure: k1-n8n-versiya2.png
    primary: 'Программно нарисованная схема: узел «Compose notification (template)» с видимым выражением
      шаблона вместо промпта, стрелка к тому же узлу отправки в Telegram, что и в версии с моделью. Узла
      модели на этой схеме нет вовсе.

      '
    backup: 'Программная схема, не снимок живого UI (та же оговорка, что у n11). Выражение — настоящее,
      из stend/stage-1-after.json: узел «Compose notification (template)» (`Set`/`Edit Fields`), три значения
      (имя, тема, доп. темы). Workflow/execution id на слайде не выносятся (канон §3). РАЗРЕШЁННОЕ РАСХОЖДЕНИЕ
      (сведение волн): волна n01–n14 нашла честную несостыковку — целевой пример текста в n06 содержал
      «Контакт», которого это выражение не собирает. Оркестратор поправил цель в SETKA-KEYSOV-S8.md и
      в n05–n08 на три значения без контакта (контакт уже виден на экране результата, уведомление решает
      одну задачу — заметить многотемность) — теперь цель и реализация совпадают, открытого вопроса нет.'
- id: n13
  file: slides/n13-k1-obobshchenie.md
  type: answer_breakdown_table
  duration_min: 1.0
  assertion: 'Не каждый текстовый вывод — это генерация. Класс задачи: сборка сообщения из уже извлечённых
    значений по фиксированной форме'
  learning_goal: Обобщение, принцип переносимый на любой оркестратор, класс задачи назван явно (такт «обобщение»,
    ARCHITECTURE.md §3). Не смешивается с нюансами — те отдельным тактом на следующем экране.
  visual:
    pattern: answer_breakdown_table
    primary: 'Компактная таблица в две строки: принцип и класс задачи. Без вердиктов, без повторения разбора
      предыдущих экранов.

      '
    backup: Текст — дословно из SETKA-KEYSOV-S8.md, раздел «Обобщение», уложен в табличную форму. Нюансы
      кейса не включены сюда намеренно — они отдельный такт (n14), чтобы обобщение не превращалось во
      второй разбор.
- id: n14
  file: slides/n14-k1-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.0
  assertion: Модель нужна при реальной вариативности контента; шаблон достаточен, когда форма одна и все
    значения уже структурированы — первая строка оси закрыта
  learning_goal: Нюансы (два класса) + критерий + закрытие первой строки оси, в одной форме с С7/С6 (criteria_checklist_and_boundary).
    Критерий переносимый, без имени инструмента.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица двух нюансов, под ней — критерий отдельной плашкой и строка закрытия первой строки
      оси.

      '
    backup: Текст нюансов и критерия — дословно из SETKA-KEYSOV-S8.md, раздел «Нюансы» и «Критерий». Закрытие
      строки оси перенесено сюда буквально же формулировкой, а не новой фразой.
- id: n15
  file: slides/n15-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Это ведь тот же вопрос, с которым он писал два часа назад?» — потребность кейса, сформулированная
    через реплику администратора
  learning_goal: Дивайдер кейса 2. Потребность называется прямо через то, что чувствует администратор,
    а не через готовый вывод о том, каким инструментом её закрывать (канон §1).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
