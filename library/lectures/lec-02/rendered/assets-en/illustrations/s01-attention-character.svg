<svg xmlns="http://www.w3.org/2000/svg" width="900" height="700" viewBox="0 0 900 700">
  <!-- Friendly seated character, thinking, being pulled by 3 distractions.
       Style-inspired by Storyset/unDraw flat-illustration conventions —
       simple geometric character, no copyrighted reference art used. -->

  <!-- Ground shadow -->
  <ellipse cx="450" cy="640" rx="230" ry="24" fill="#F4F7FA"/>

  <!-- Character body (sitting, rounded) -->
  <ellipse cx="450" cy="470" rx="140" ry="160" fill="#1C7293"/>
  <!-- Body highlight -->
  <ellipse cx="410" cy="430" rx="60" ry="80" fill="#21295C" opacity="0.18"/>

  <!-- Legs (simple crossed rounded shapes) -->
  <ellipse cx="380" cy="610" rx="70" ry="30" fill="#065A82"/>
  <ellipse cx="520" cy="610" rx="70" ry="30" fill="#065A82"/>

  <!-- Arms reaching slightly, relaxed -->
  <ellipse cx="325" cy="440" rx="30" ry="70" fill="#1C7293" transform="rotate(-18 325 440)"/>
  <ellipse cx="575" cy="440" rx="30" ry="70" fill="#1C7293" transform="rotate(18 575 440)"/>
  <circle cx="300" cy="500" r="26" fill="#F4F7FA" stroke="#1C7293" stroke-width="3"/>
  <circle cx="600" cy="500" r="26" fill="#F4F7FA" stroke="#1C7293" stroke-width="3"/>

  <!-- Head -->
  <circle cx="450" cy="300" r="105" fill="#F4F7FA" stroke="#1C7293" stroke-width="4"/>
  <!-- Hair / brain outline hint -->
  <path d="M 355 270 Q 380 190 450 195 Q 520 190 545 270" fill="none" stroke="#065A82" stroke-width="6" stroke-linecap="round"/>

  <!-- Eyes: one looking straight (focused), one drifting up-left toward distraction -->
  <circle cx="420" cy="300" r="9" fill="#21295C"/>
  <circle cx="480" cy="292" r="9" fill="#21295C"/>

  <!-- Eyebrows, slightly worried/distracted -->
  <path d="M 400 275 Q 420 265 440 275" fill="none" stroke="#21295C" stroke-width="4" stroke-linecap="round"/>
  <path d="M 460 268 Q 480 256 502 268" fill="none" stroke="#21295C" stroke-width="4" stroke-linecap="round"/>

  <!-- Small open mouth -->
  <ellipse cx="450" cy="345" rx="14" ry="9" fill="#21295C"/>

  <!-- ============ Distraction 1: phone notification (top-left) ============ -->
  <g>
    <rect x="130" y="120" width="90" height="150" rx="16" fill="#FFFFFF" stroke="#065A82" stroke-width="4"/>
    <rect x="150" y="150" width="50" height="8" rx="4" fill="#1C7293"/>
    <rect x="150" y="170" width="50" height="8" rx="4" fill="#DCE6EC"/>
    <rect x="150" y="190" width="35" height="8" rx="4" fill="#DCE6EC"/>
    <circle cx="205" cy="128" r="16" fill="#F0AB00"/>
    <text x="205" y="134" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#21295C">!</text>
  </g>
  <!-- dotted pull-line phone -> head -->
  <path d="M 225 190 Q 300 220 372 268" fill="none" stroke="#1C7293" stroke-width="3" stroke-dasharray="6,8"/>

  <!-- ============ Distraction 2: stray thought bubble (top-right) ============ -->
  <g>
    <circle cx="700" cy="150" r="14" fill="#F4F7FA" stroke="#028090" stroke-width="3"/>
    <circle cx="730" cy="180" r="20" fill="#F4F7FA" stroke="#028090" stroke-width="3"/>
    <ellipse cx="775" cy="225" rx="68" ry="54" fill="#F4F7FA" stroke="#028090" stroke-width="4"/>
    <text x="775" y="215" text-anchor="middle" font-family="Arial" font-size="15" fill="#065A82">buy</text>
    <text x="775" y="240" text-anchor="middle" font-family="Arial" font-size="15" fill="#065A82">tickets?</text>
  </g>
  <path d="M 690 235 Q 610 250 528 278" fill="none" stroke="#028090" stroke-width="3" stroke-dasharray="6,8"/>

  <!-- ============ Distraction 3: task/document (bottom-right) ============ -->
  <g>
    <rect x="660" y="430" width="110" height="130" rx="10" fill="#FFFFFF" stroke="#21295C" stroke-width="4"/>
    <rect x="678" y="455" width="74" height="7" rx="3" fill="#1C7293"/>
    <rect x="678" y="472" width="74" height="7" rx="3" fill="#DCE6EC"/>
    <rect x="678" y="489" width="50" height="7" rx="3" fill="#DCE6EC"/>
    <rect x="678" y="516" width="60" height="7" rx="3" fill="#DCE6EC"/>
    <path d="M 690 535 l 10 10 l 20 -22" fill="none" stroke="#F0AB00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M 660 465 Q 600 430 545 390" fill="none" stroke="#21295C" stroke-width="3" stroke-dasharray="6,8"/>

</svg>
