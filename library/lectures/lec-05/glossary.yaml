# E. Расхождения с главой — СПРАВКА, не задача
# ══════════════════════════════════════════════════════════════════════
# Владелец решил, что глава остаётся как есть. Здесь зафиксировано, где глава говорит
# иначе, чем канон, — чтобы это не читалось как незамеченный дрейф и чтобы будущая правка
# главы (если она будет) знала объём.
chapter_divergences:
  - concept: "метрика-ограничитель"
    chapter_form: "guardrail (73 вхождения латиницей)"
    weight: "крупнейшее расхождение"
  - concept: "рубеж"
    chapter_form: "гейт (84) / gate (22); «рубеж» — 1"
    weight: "крупнейшее расхождение"
  - concept: "косвенная метрика"
    chapter_form: "прокси (35)"
  - concept: "эталонный набор"
    chapter_form: "эталонный набор (15) + reference dataset (17) параллельно"
    weight: "канон совпадает, но латинский дубль в главе остаётся"
  - concept: "канареечный выпуск"
    chapter_form: "канареечный (14) + canary (15)"
  - concept: "двойной ромб"
    chapter_form: "Double Diamond (12) / «алмаз» (11); «ромб» — 0"
  - concept: "аварийный выключатель"
    chapter_form: "circuit breaker (12)"
  - concept: "цена ошибки"
    chapter_form: "«стоимость ошибки» (8) наравне с «цена ошибки» (7) — внутри главы обе"
  - concept: "шкала самостоятельности"
    chapter_form: "«лестница агентности» (1); понятие в главе почти не именуется"
  - concept: "поэтапная раскатка"
    chapter_form: "совпадает (11); расхождения нет"

