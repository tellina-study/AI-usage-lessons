  learning_goal: 'Граница применимости предыдущих двух слайдов: чистый контекст субагента — не автоматически
    чистый по всем источникам. Прямая, дословная цитата документации об ошибках харнесса, без умствования.
    Мост к списку инструментов субагента, который стоит пятым блоком на одностраничнике ступени. Круг
    5 (issue 225): третья полоса схемы базы ступени («описания подключённых серверов») предъявлена здесь
