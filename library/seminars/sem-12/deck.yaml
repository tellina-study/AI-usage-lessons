  learning_goal: 'Сквозное число закрытия, ИСПРАВЛЕНО оркестратором после пересборки (несущее противоречие
    с n81): первая редакция этого кадра включала кейс C в счёт «4 из 4» по наивной сумме ошибок — ровно
    той мере, которую n81 этим же закрытием дисквалифицировал («сложение двух типов ошибок в одно число
    спрятало то, что решает дело»). Счёт по дисквалифицированной мере противоречил собственному выводу
