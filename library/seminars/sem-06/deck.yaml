      (не суммирующим WebFetch — notes/mcp-limitations.md [#225-1]). Дословно: «A git worktree is a separate
      working directory with its own files and branch, sharing the same repository history and remote
      as your main checkout»; флаг и дефолты — «Pass --worktree or -w with a name… By default, the worktree
      is created under .claude/worktrees/<name>/ at your repository root, on a new branch named worktree-<name>»;
      «Run the command again with a different name in another terminal to start a second isolated session»;
      общее — «The repository''s .git directory: git commands in a worktree write to the main repository''s
