    метод + правка эталона). Числа строк 1-3 переведены на знаменатель 363 по сводному листу `stend/zamery-A/
    CHISLA-POSLE-PRAVKI-ETALONA.md` §2: 73,4 → 75,2 · 59,9 → 61,7 · 33,2 → 33,9. Сделка кадра НЕ изменилась
