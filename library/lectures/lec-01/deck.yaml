deck:
  lecture_number: 1
  title: "Что такое AI? История, классификация, общие понятия"
  audience: "универсальная (без привязки к ИУ6)"
  duration_min: 75
  central_question: "Где AI работает, где — нет, и как это понять?"
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: ru
  status: draft
  version: v3.4
  source: chapter v3.3 (status=reviewed, ~17350 слов), issue #153 (21-fix polish) + issue #155 batch 1 (10-fix polish, pending chapter/speech sync)
  plan: notes/lecture-1-review/final/new-plan-v5-final.md + qa-reports/2026-05-13-user-feedback-23/REQUIREMENTS.md + issue #153 + issue #155

slides:
