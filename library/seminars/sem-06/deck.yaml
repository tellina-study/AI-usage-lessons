      снял по всему занятию целиком — заменён на новую строку оси под мысль о границе делегирования. Прежняя
      пометка «locked-формула, не сжимается и не перефразируется» (ARCHITECTURE.md §7, litpravka-otchet.md
      §1.2d/§5) относилась к ЗАПРЕТУ НА СТИЛИСТИЧЕСКОЕ сжатие при литературной правке, не к содержательной
      неизменности — явное решение владельца о содержании этого круга её не отменяет, а делает её неприменимой:
