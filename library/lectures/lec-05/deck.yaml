deck:
  lecture_number: 5
  title: "Лекция 5. AI-продукт: полный жизненный цикл — от намерения до эксплуатации"
  audience: "студенты-инженеры 3 курса, универсально, без локального binding"
  duration_min: 90
  central_question: "Когда AI сделал сборку почти бесплатной — что стало настоящим узким местом продукта, и на каждой фазе цикла: какая классическая дисциплина остаётся, что AI ускоряет, и где AI-first ломается?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: ru
  status: draft-for-gate-b
  version: v2.0
  source: "chapter.md + chapter-part2..5.md (57 271 слово тела)"
  plan: "qa-reports/2026-09-28-rescope/chapter-coverage-for-practice-deck.md"
  total_slides: 56
  curriculum_level: "Отраслевая лекция (после Л4 SDLC); L5 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "фазы петли продукта (discover→build→measure→learn→decide); каждая фаза = база→AI→практика→ограничения→провал"
  glossary_lock: glossary.yaml

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  ref: "library/lectures/lec-05/glossary.yaml"
  locked_at: "2026-09-30"          # перевыпуск, issue #212 (прежний lock — 06.09, #189)
  headline_terms:
    - "петля из шести фаз; цена ошибки растёт вниз по петле"
    - "развитие клиента (Customer Development); «The Mom Test»"
    - "двойной ромб (Double Diamond); эвристики Нильсена; дизайн-система"
    - "переключатель функции / канареечный выпуск / поэтапная раскатка / путь назад"
    - "рубеж «продолжать или закрыть» (Stage-Gate); рубеж остановки; человек на рубеже"
    - "шкала самостоятельности; уровень самостоятельности"
    - "модель-судья; оценка до выпуска и на живом потоке"
    - "метрика решения и метрика-ограничитель; сводный критерий оценки (OEC)"
    - "косвенная метрика; закон Гудхарта"
    - "показатель уровня сервиса (SLI) / цель уровня сервиса (SLO) / бюджет ошибок"
    - "наблюдаемость; тихий дрейф; аварийный выключатель"
    - "цена за единицу текста и базовая линия без ИИ; портфельное управление"
    - "три оси решения: обратимость, цена ошибки, наблюдаемость"
  note: >
    СВЕДЕНО 01.10.2026 (issue #212): из headline-набора снят «эталонный набор». Приём с этим
    именем стоял на s24b; владелец переделал слайд целиком в мутационные тесты, потому что
    эталонный набор почти дословно повторял петлю оценок Раздела 4 (так и записано в
    rendered/slides_band6.py, функция s24b). По собранной деке словосочетание оставалось
    ровно в одном месте — в требовании оси «Наблюдаемость» на обобщающем s53, то есть
    итоговый слайд предписывал приём, которому лекция не учила. Заменено на «петля оценок» —
    имя приёма на его слайде s31a слово в слово. Формы «guardrail» и «reference dataset»
    живут теперь только в несобираемых builder-функциях (s43, s54), помеченных
    «[НЕ В СОСТАВЕ ДЕКИ]».
    Lock перевыпущен 30.09.2026 (issue #212) после того, как восемь параллельных сессий
    русифицировали деку каждая в своём разделе и развели одиннадцать понятий. Что на что
    заменено и почему — в glossary.yaml, раздел `resolved_divergences` (здесь не
    дублируется). Термины снятых слайдов в headline-набор не возвращены: их несущих слайдов
    в деке нет. Речь (speech.md, speech-part2.md) на момент перевыпуска канону ещё НЕ
    соответствовала — она переписывается отдельно и этой сессии не принадлежит.

# NO MEME DUPLICATION RULE (owner rule slides-meme-forward-minimal-text): мем s01
# уникален и не повторяется ни на обложке, ни на дивайдерах; у обложки s02 и у каждого
# дивайдера (s07/s14/s21/s28/s36/s44/s50) — свой вечнозелёный мем под своё утверждение.

ai_failure_judgment:
  # Правило курса (ENFORCED): ≥30% strict-in по МИНУТАМ, waiver для L5 НЕДОСТУПЕН.
  # Учёт strict-in, не weighted: смешанный слайд идёт как out целиком.
  # ДВА ЧИСЛА НИЖЕ РАЗНЫЕ, потому что классификация пяти слайдов границ — открытый вопрос,
  # а не арифметика. Решает владелец. Ни одно число не подогнано под порог.

  # ── 1. По действующим флагам in_bucket в slides/*.md ──
  strict_in_slides: [s12, s13a, s19, s26, s27, s33, s34, s40, s41, s42, s47, s48, s53]
  count: 13
  strict_in_minutes: 28.0
  share_declared: >
    28,0 из 101,6 = 27,6% — НИЖЕ порога. Это главный результат сведения: прежняя редакция
    объявляла 28,5% от Σ 98,1, и доля упала не потому, что со слайдов что-то сняли, а
    потому, что в Σ вошли два добавленных владельцем слайда (s14a 1,5 и s36c 2,0), оба
    out-of-bucket: знаменатель вырос, числитель нет. Поимённо: s12 2,5 · s13a 2,0 · s19 2,0 ·
    s26 2,5 · s27 1,5 · s33 2,0 · s34 2,0 · s40 2,5 · s41 2,0 · s42 2,0 · s47 2,5 · s48 2,0 ·
    s53 2,5 = 28,0.
  s53_recheck: >
    Пометка in_bucket у s53 перепроверена по видимому слою (сессия, снявшая с него прогон
    двух случаев, просила об этом прямо). Опиралась она на три оси и требование по каждой —
    «когда человека с рубежа убрать можно, когда нельзя», — и весь видимый слой слайда
    по-прежнему состоит только из этого. Прогон Google AI Overviews / Zillow ушёл в заметки
    и там цел. Пометка в силе, вклад 2,5 мин сохраняется.

  # ── 2. Измеренный вердикт по пяти слайдам границ (решает владелец) ──
  limits_verdict:
    rule: >
      Слайд in_bucket, только если ВЕСЬ видимый слой попадает в одну из четырёх категорий
      правила: (A) провал + урок · (B) разбор ограничения или риска · (C) явный критерий
      «здесь ИИ не применим» · (D) сравнение с более подходящим инструментом. Любой
      содержательный блок вне A–D делает слайд partial_out; общая оговорка in_bucket не
      создаёт. Читался видимый слой собранного .pptx целиком, блок за блоком, не фронтматтер
      и не заметки. Вердикты вынесены ДО подсчёта доли; полные цитаты решающих блоков — в
      докладе сессии сведения оркестратору.
    s11:  "IN (1,5). Все четыре блока в A–D: невозможность несогласия (B) · зеркало согласия 72–91% против 7–28% (B) · три критерия «когда живой разговор строго лучше» (C+D) · потеря 20–40% деталей при пропущенном шаге (A)."
    s18:  "PARTIAL_OUT (2,0) — единственный из пяти. Решающий блок: «Отсюда три приёма подачи, которых в классике нет» — о том, КАК проектировать, то есть смягчение ограничения, а не ограничение, критерий или альтернатива. Самый близкий вердикт из пяти: при weighted-учёте слайд прошёл бы."
    s25:  "IN (1,5). Удвоение очереди на проверку (B) · стоимость двух операций (B) · «Разрыв 70 процентов» с расхождением опытный/начинающий (A) · «Определение готовности обязано вобрать эти 30%» (A). Блока о применении ИИ нет."
    s32:  "IN (2,0). Закон Гудхарта (B) · «Лодка, которая никогда не финиширует»: +20% очков при нуле финишей (A) · взлом вознаграждения (B) · «Эскалация, которой не обучали» (A) · два следствия (A)."
    s39:  "IN (2,0). Зелёные графики при падающем доверии (B) · тихий дрейф (B) · дрейф правил (B) · Klarna май 2025 с названным уроком (A) · «Что остаётся обязательным: путь к человеку, ответственность за ответ, дисциплина разбора инцидентов» (C)."
    share_if_applied: >
      Четыре вердикта IN добавляют 7,0 мин: 35,0 из 101,6 = 34,4%, порог пройден с запасом
      4,4 пп; из ≈82 активных — 42,7%. Устойчивость к cut_order: после всех 33 пунктов
      Σ 81,6, strict-in 28,5 = 34,9% — при сокращении доля держится. С s18 было бы 36,4%;
      вариант не предлагается, приведён чтобы видеть: s18 стоит 2,0 мин и исхода не решает.
    blocked_on: >
      Флаги НЕ переставлены. Пометки живут и в манифесте, и в slides/*.md, а s11/s18/s25/
      s32/s39.md в мандат сессии сведения не входили; переставить только здесь значило бы
      развести манифест с источником истины — завести ровно тот дефект, который эта сверка
      закрывает. Нужно решение владельца плюс один проход по пяти .md. До него в силе
      число из пункта 1 — 27,6%. Осторожность «пометить partial_out на всякий случай»
      занижает долю так же неверно, как завышение: обратная ошибка в этом issue уже
      случалась (5,0 мин классики записали как применение ИИ, исправлено переучётом
      s24c/s45b).

  partial_out: [s01, s02, s03, s04, s06, s07, s08, s10, s11a, s11b, s11, s14, s14a, s15,
                s17, s17a, s18, s21, s22, s23, s24a, s24b, s24c, s25, s28, s29, s30a, s31a,
                s32, s36, s36c, s37, s38a, s38b, s39, s44, s45, s45a, s45b, s46, s50, s51,
                s55]
  partial_out_count: 43
  holistic_check: >
    Каждый из шести разделов фазы несёт ≥1 on-point провал: Р1 — s12/s13a · Р2 — s19 ·
    Р3 — s26/s27 · Р4 — s33/s34 · Р5 — s40/s41/s42 · Р6 — s47/s48; Р7 несёт инструмент
    решения s53. Концентрации в одном разделе нет. После правок владельца 2026-10-01 состав
    сменился на двух слайдах без изменения их числа: s13a — Humane AI Pin вместо IBM Watson,
    s19 — отзыв Tesla 23V-838 вместо Character.AI. У s22 появился случай Foghorn (закрытый
    проект лаборатории X), у s38a — бот поддержки Cursor (апрель 2025); оба слайда остаются
    partial_out: случай там — один блок внутри слайда о классике и о применении, а не весь
    слайд. s46 перестал быть диагностикой зрелости предприятия и стал аппаратом оценки любой
    функции; остаётся partial_out, хотя два его пункта из четырёх («против какой базы», «при
    каком результате её закрывают») — критерии в смысле категории C: два других про оценку
    вообще, и strict-in этого не засчитывает.

