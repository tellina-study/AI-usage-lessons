# Один вызов, цепочка, маршрут
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n03    8.00 мин
#   Ступень 1  n04–n18   27.75 мин
#   Ступень 2  n19–n33   29.50 мин
#   Ось        n34–n34    6.00 мин
#   ИТОГО                  71.25 мин при слоте 90

deck:
  seminar_number: 7
  title: Один вызов, цепочка, маршрут
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 71.25
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: Тот же самый классификационный шаг — только теперь от его ответа зависит, какой из
    четырёх маршрутов получит письмо. Нужно ли здесь гонять полноценный вызов модели, который сочиняет
    объяснение, или достаточно того, что сразу возвращает одну метку?
  language: ru
  slide_count: 34
  axis: На С4–С6 собирали одного агента — права, память, инструменты, проверяемость каждого шага. Сегодня
    — процесс, который использует LLM как один шаг из многих.
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka-odin-vyzov-tsepochka-marshrut.md
  type: hero_cover
  duration_min: 0.5
  assertion: Этим занятием открывается дуга из шести семинаров про процессы на LLM поверх агентов; начинаем
    с нижней ступени — один вызов, цепочка, маршрут.
  learning_goal: 'Чистая обложка, не контент-слайд: называет занятие и его место в дуге, ничего не объясняет
    и ничего не доказывает с кейсов. Переход уровня (С4–С6 → процесс поверх LLM) остаётся за мостиком
    (`b0-mostik-urovenj`), завязка «где здесь искусственный интеллект» — за `n03-otkuda-zdes-iskusstvennyy-intellekt`;
    обложка не повторяет материал ни одного из двух и не забирает у них работу. Номер занятия не выносится
    на экран как значок или цифра — решение владельца (issue 225, `sem-06/qa/oblozhka-bez-nomera.md`),
    снявшее исключение для Семинаров 2–5; место в дуге названо словами в подзаголовке, не цифрой на обложке.

    '
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, тот же приём, что у обложки Семинара 6 — без hero-схемы и без вопроса-загадки,
      на этой обложке их нет: единственные элементы — крупный центрированный заголовок и под ним одна
      строка подзаголовка о месте занятия в дуге. Тонкая золотая полоса между заголовком и подзаголовком
      — минимальный golden-accent, держит правило «золото хотя бы раз на слайде» без добавления содержания.
      Никакой цифры семинара и никакой подписи «СЕМИНАР 7» на экране — ни крупной, ни мелкой, ни в углу.

      '
    backup: 'Заголовок — `ARCHITECTURE.md` frontmatter `title` без префикса «Семинар 7 —»: префикс принадлежит
      заголовку документа и метаданным, не экрану — тот же сдвиг виден на обложке Семинара 6, где на слайде
      стоит «Доступ наружу и урезанные права» без «Семинар 6». Подзаголовок — краткая перефразировка `ARCHITECTURE.md`
      §1 (переход уровня с С4–С6), без единой цифры и утверждения из разделов 1 или 2: ни Zillow, ни Optum/UnitedHealth,
      ни IRS, ни механика email-пайплайна на обложку не выносятся — это прямое требование задачи, не пропуск.

      Решение не давать hero-иллюстрацию, в отличие от обложек С5/С6, — намеренное упрощение по прямому
      заданию («минимальный текст на самой обложке — название + подзаголовок, не контент»). Первая иллюстрация
      занятия — в мостике (`b0`, печатная таблица из девяти строк) и в `n03` (схема «письмо → триггер
      → HTTP-запрос → карточка в трекере»); обложка перед ними не забирает их материал и не предвосхищает
      лестницу.

      Файл временный: `_cover-semianr-7.md`. Id и порядковый номер (`n03`) — за оркестратором при сборке
      деки; нынешний файл `n03-otkuda-zdes-iskusstvennyy-intellekt.md` на тот момент сдвигается дальше
      по номерам, остальные файлы этой папки не трогались.'
- id: n02
  file: slides/n02-mostik-urovenj.md
  type: recap_table
  duration_min: 5
  assertion: На С4–С6 собирали одного агента — права, память, инструменты, проверяемость каждого шага.
    Сегодня — процесс, который использует LLM как один шаг из многих.
  learning_goal: 'Переход уровня, не новый разгон: от устройства одного исполнителя к устройству процесса,
    который этим исполнителем (или просто одним вызовом модели) пользуется. Лестница из девяти строк (SPLIT-PLAN
    §2) показана пустой целиком — ни одна строка не закрыта — и этим задаёт визуальный контракт, который
    сегодняшнее занятие и пять следующих заполняют по одной-две строки. Явно снято требование помнить
    С1–С6: участие в занятии не требует этой памяти.

    '
  visual:
    pattern: recap_table
    primary: 'Светлый фон, коробка-таблица на девять строк (не тёмный терминал, не список). Четыре колонки:
      «Строка» (0–8), «Что» (название узла процесса), «Закрывает» (номер семинара, которому строка назначена
      по SPLIT-PLAN), «Статус» — на этом слайде все девять ячеек статуса одинаковые и пустые («пусто»),
      без исключений. Внизу — одна подпись-формула во всю ширину, без кавычек-реплики (золотая роль по
      умолчанию для recap_table).

      '
    backup: 'Источник: `ARCHITECTURE.md` §1 (текст перехода, цитируется почти дословно) и §2 (бюджет блока
      «Мостик» в составе занятия); таблица — `SPLIT-PLAN-7-12.md` §2 целиком, девять строк, без сокращений
      и без переименования приёмов (правило §3 "абстракции не изобретаются" — prompt chaining, routing,
      parallelization, evaluator-optimizer, orchestrator-workers оставлены как названы в плане). Правило
      «знать С1–С6 не обязательно» — С5 `n03`, наследуется без изменений. Это зеркальная пара слайду `b3-os-promezhutochnaya`:
      та же таблица, та же форма, читается в конце занятия с тремя закрытыми нижними строками — здесь
      она открывает контракт, там его частично выполняет.'
- id: n03
  file: slides/n03-otkuda-zdes-iskusstvennyy-intellekt.md
  type: scene_reveal
  duration_min: 2.5
  assertion: 'Три коробки и две стрелки — письмо, триггер, HTTP-запрос, карточка в трекере — не содержат
    ни одного вызова модели: правило, написанное один раз, срабатывает одинаково и на первом письме, и
    на тысячном'
  learning_goal: 'Открытие ступени — развести автоматизацию и искусственный интеллект на наблюдаемой картинке,
    прежде чем в ту же цепочку встанет первый вызов модели. Вопрос не закрывается ответом «нигде» — он
    переезжает на уровень выше и этим открывает кейс A: не «нужен ли здесь ИИ», а какому шагу он нужен,
    а какому нет'
  visual:
    pattern: scene_diagram_and_reveal
    primary: 'Три коробки и две стрелки без единого диалога с моделью: письмо → триггер → HTTP-запрос
      → карточка в трекере. Под схемой — вопрос залу четырьмя карточками, нижняя («нигде») — верный ответ,
      выделена сразу (reveal без отдельного цикла голосования — экран открывает ступень, а не опрашивает
      зал отдельно). Закрывающая реплика — формула о том, что вопрос переезжает на уровень выше.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.0 и `rework/section-1-chaining-part1b.md` §B.1.
      Единственный маркер открытия ступени — n03 (не n03–n02, как предполагалось при постановке задачи
      разделу: автор раздела собрал сцену, вопрос и разбор в один экран; n02 в тексте раздела не используется
      — см. `SVERKA-PLAN.md` п.1). Ответ предъявляется на этом же экране, а не на следующем: правило А1
      («разбор сразу за вопросом») соблюдено буквально — здесь это один и тот же экран, потому что раздел
      не завёл для разбора отдельный маркер.'
- id: n04
  file: slides/n04-divider-ya-tak-i-otvechayu.md
  type: section_divider
  duration_min: 0.5
  assertion: '«Я так и отвечаю: читаю письмо, минуту думаю, печатаю ответ» — фраза человека, который каждый
    день отвечает на письма в почте поддержки, без единого слова про модель или автоматизацию'
  learning_goal: 'Дивайдер кейса A называет наблюдаемую проблему репликой человека, а не формулой с именем
    приёма (правило А2) — тот же ход, что на ступени MCP Семинара 6: инструмент прячется за узнаваемой
    сценой, и зал сначала узнаёт в ней себя или коллег, а потом — какой приём её меняет'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, реплика сотрудника поддержки крупно в кавычках. Внизу — дорожка трёх кейсов
      ступени (A · B · C), кейс A подсвечен. Без тега с минутами и без слов «модель» / «цепочка» — только
      сцена.

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.2, `section-1-chaining.md` §A.1.1 и §A.00.
      Правило А2 (дивайдер называет проблему, не решение) в силе; приём совпадает с MCP-кейсом Семинара
      6 (`sem-06/slides/n07-*.md`) — инструмент назван только на следующем экране. Кейс A этого раздела
      — учебная механика, а не документированный публичный случай (честный пробел, названный прямо в §A.00);
      кейсы B и C дальше — документированные публичные случаи с источниками.'
- id: n05
  file: slides/n05-stsena-i-vopros-chetyre-pisma.md
  type: scene_question
  duration_min: 1.75
  assertion: 'Простые письма сотрудник закрывает за минуту по памяти; сложные — после истории заказа и
    политики возврата: вопрос в том, хватит ли одного вызова модели с доступом к базе знаний на все письма
    сразу'
  learning_goal: 'Сцена и вопрос — прямое продолжение дивайдера: четыре письма почты поддержки, два простых
    и два сложных, и вопрос про ОДИН вызов с RAG — ровно тот критерий, по которому дальше кейс разводит
    письма на два класса'
  visual:
    pattern: scene_cards_and_question
    primary: 'Четыре карточки-письма (пароль / статус заказа / повреждённая упаковка / оптовая закупка)
      в ряд равной ширины, без подсветки — голосование вслепую. Под ними — вопрос залу золотой коробкой:
      хватит ли одного вызова модели с RAG на все четыре письма? Три варианта ответа ниже вопроса.

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.3, `section-1-chaining.md` §A.1.2. RAG
      упомянут с пояснением (retrieval — поиск релевантного кусочка документации перед тем, как модель
      формулирует ответ), термин уже разбирался на предыдущих занятиях курса — здесь не вводится заново,
      только напоминается скобкой.'
- id: n06
  file: slides/n06-razbor-zavisit-ot-pisma.md
  type: answer_breakdown
  duration_min: 2.25
  assertion: 'Правильный ответ — «зависит», и дальше кейс разворачивает обе стороны: простым письмам одного
    вызова с RAG достаточно, смешанным и спорным — нет, потому что ничья уверенность в ответе там не проверена'
  learning_goal: 'Разбор сразу за вопросом (правило А1). Форма — два содержательных столбца (правило А5):
    когда одного вызова достаточно, когда недостаточно. Вывод прямо ссылается на уже введённое курсом
    правило лестницы («справится ли один вызов — так и сделайте») и готовит почву для структуры из нескольких
    шагов'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на два столбца: «одного вызова с RAG достаточно, когда» / «одного вызова недостаточно,
      когда» — прямое применение к четырём письмам сцены. Ниже — пунктирная оговорка про непроверенную
      уверенность, а под ней отдельной золотой планкой (приём n08/n11) — формула-вывод: не «умнее один
      вызов», а структура с проверяемым промежуточным результатом (ИСПРАВЛЕНО фикс-кругом — на слайде
      не было золотого акцента).

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.4, `section-1-chaining.md` §A.1.3. Правило
      лестницы («справится ли один промпт или один вызов + RAG — так и сделайте») — глава Лекции 3 §4.3,
      уже введено курсом ранее; здесь не переопределяется, только применяется к новому случаю.'
- id: n07
  file: slides/n07-taksonomiya-workflow-i-agent.md
  type: taxonomy_table
  duration_min: 2.0
  assertion: 'Путь, предопределённый в коде, — workflow; путь, который сама модель определяет по ходу
    работы, — агент: письмо обрабатывается тремя известными шагами в известном порядке, и это противоположность
    кодинг-агенту, собранному на С4–С6'
  learning_goal: Явная таксономия до механики (приём Nate Herk / Anthropic Building Effective Agents,
    уже введённый в главе Лекции 3 §4.3) — отвечает на вопрос «чем это отличается от агента, которого
    собирали на С4-С6», прежде чем называть структуру по имени
  visual:
    pattern: taxonomy_compare_table
    primary: 'Два столбца друг против друга: «агент (С4–С6)» и «workflow (здесь)» — по одному и тому же
      набору строк (кто решает путь, известен ли порядок шагов заранее, что покупается и что теряется).
      Внизу — короткий вывод: предсказуемая по форме задача получает workflow.

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.5, `section-1-chaining.md` §A.1.4. Различение
      введено со ссылкой на Anthropic, Building Effective Agents (2024), уже разобранное в главе Лекции
      3 §4.3; атрибуция формулировки Nate Herk — по заданию, без независимой дополнительной проверки в
      этой сессии (сноска источника в §A.1.4 раздела, веб-поиск по имени не дал читаемого результата).'
- id: n08
  file: slides/n08-mehanika-prompt-chaining.md
  type: mechanism
  duration_min: 2.25
  assertion: 'Prompt chaining — фиксированная последовательность вызовов, где выход одного становится
    входом следующего: здесь — два вызова модели (classify, draft) и человеческий гейт, а ключевой пункт
    всей механики — детерминированная проверка МЕЖДУ первым и вторым вызовом'
  learning_goal: 'Механика вводится по звеньям — classify / draft / человеческий гейт — и явно выделяет
    то, что обычно теряется при пересказе: проверка между шагами важнее самих шагов, и именно она становится
    предметом следующих двух экранов (артефакт, провал)'
  visual:
    pattern: mechanism_pipeline
    primary: 'Горизонтальный pipeline из трёх звеньев: classify → [проверка метки] → draft → человеческий
      гейт. Средний элемент (проверка) визуально выделен отдельной рамкой между первыми двумя звеньями
      — не растворён в стрелке. Под схемой — формула про то, что проверяет каждый из двух гейтов.

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.6, `section-1-chaining.md` §A.1.5. Термин
      prompt chaining остаётся на английском с русским пояснением — глоссарий курса, глава Лекции 3 §4.3.'
- id: n09
  file: slides/n09-artefakt-chetyre-stroki.md
  type: code_artifact
  duration_min: 1.5
  assertion: 'Четыре строки кода несут четыре факта: classify возвращает метку, не текст; проверка стоит
    ДО второго вызова; draft получает метку и контекст, а не голое письмо; последняя операция — положить
    черновик в очередь человека, не отправить его клиенту'
  learning_goal: 'Минимальная со-сборка — формальный слайд без мема (правило formal-vs-meme), код показывает
    ровно то, что отличает правильно собранную цепочку от разбора провала на следующем экране: удаление
    любого из четырёх фактов превращает рабочую цепочку в ломающуюся'
  visual:
    pattern: code_block_with_callouts
    primary: 'Тёмная моноширинная карточка с четырьмя строками кода Python (единственный тёмный блок на
      светлом слайде, по словарю приёмов). Под карточкой — четыре коротких пояснения, по одному на факт,
      каждое привязано к своей строке. В самом низу — золотая формула-итог (тот же приём, что у n08/n11):
      удаление любого факта ломает цепочку (ИСПРАВЛЕНО фикс-кругом — на слайде не было золотого акцента).

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.7, `section-1-chaining.md` §A.1.6. Код
      — иллюстративный минимум без деталей реализации `call_classify`/`call_draft`/`retrieve` — не привязан
      к конкретному фреймворку.'
- id: n10
  file: slides/n10-proval-metka-protekaet-molcha.md
  type: failure_vignette
  duration_min: 2.25
  assertion: 'Убери проверку между classify и draft, и ошибка первого звена молча протекает во второе:
    письмо о возврате из-за повреждённой упаковки помечается как «другое» и получает нейтральный шаблон
    вместо решения — ответ выглядит так же профессионально, как и правильный'
  learning_goal: 'Провал возвращается к артефакту предыдущего экрана: убрана ровно одна вещь (проверка
    метки), человеческий гейт превращён в формальность — и видно, что молчаливое протекание ошибки неотличимо
    внешне от правильного результата'
  visual:
    pattern: failure_vignette_before_after
    primary: 'Над текстом — ссылка на артефакт предыдущего экрана («убрали проверку метки, человеческий
      гейт стал формальностью»). Ниже — два черновика письма рядом, оба выглядят одинаково профессионально:
      один — по верной метке «возврат», другой — по ошибочной метке «другое». Разница не видна по форме,
      только по содержанию.

      '
    backup: 'Источник: `rework/section-1-chaining-part1b.md` §B.8, `section-1-chaining.md` §A.1.7. Сценарий
      учебный (кейс A этого раздела — не документированный публичный случай, см. `section-1- chaining.md`
      §A.00), несёт механику приёма, не инцидент конкретной компании.'
- id: n11
  file: slides/n11-granitsa-kogda-tsepochki-hvataet.md
