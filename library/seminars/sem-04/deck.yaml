deck:
  seminar_number: 4
  title: "Семинар 4 — Сборка кодинг-агента: лестница роста конфигурации"
  audience: "студенты 3 курса, направление 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами в работе"
  duration_min: 75  # material 73.0 (пересчитано после review-раунда Fix 1/Fix 4, было 71.0) + ~2 мин резерва (было 4 — сокращён, чтобы вместить рост; резерв не аллоцирован по конкретному слайду/разделу)
  format: "слайды фасилитатора + открытые вопросы с карточками-вариантами (вопрос и разбор — раздельные слайды, R3-4) + совместное формирование конфигурации с залом (без живого терминала)"
  central_question: "У вас репозиторий и агент, который в нём работает — какой блок конфигурации добавить первым, и как понять, что следующий добавлять ещё рано?"
  learning_outcomes: [LO7, LO6, LO3]  # TODO: подтвердить у оркестратора после показа — LO7 (архитектурный выбор инструментов) точно остаётся; LO6 (критическое отношение к утверждениям об ИИ / честная сила доказательства) уместен — центральная тема всех 6 кейсов; LO3 менее очевиден для памяти/файла инструкций конкретно, финальное решение — отдельный шаг оркестратора после показа владельцу
  case: "signup-landing — лендинг с формой заявки на демо-урок: сборка, тест формы, деплой, задачи в трекере; один разработчик с агентом, фиксированная дата показа заказчику. Занятие подробно разбирает 2 из 5 слотов харнесса (файл инструкций, память), по 3 кейса на каждый; остальные 3 слота + 2 практических слоя (хук, процесс) — Семинар 5."
  language: ru
  slide_count: 53
  timing_budget: "73,0 мин материала (10 раздел 0 + 28 раздел 1 + 30,5 раздел 2 + 4,5 раздел 3 закрытие) + ~2 мин резерва = 75; резерв сокращён с 4 до ~2 мин после review-раунда, чтобы вместить рост раздела 2 (+2,0 мин: Fix 1 добавил проблема+исследование кейса 2.1 отдельными слайдами +1,0, Fix 4 добавил 2 divider'а кейсов 2.2/2.3 +1,0), без урезания провалов/критериев по содержанию — см. rework/section-2-pamyat-part3.md §D.2"
  failure_share: "посчитано по каждому кейсу отдельно (доля research+answer_breakdown+failure_vignette+criteria_boundary слайдов от длительности кейса), не только в среднем: 1.1=59%, 1.2=65%, 1.3=61%, 2.1=54% (было 50% до Fix 1 — выросло, т.к. добавленный research-слайд s29 тоже входит в failure/evidence-бюджет), 2.2=61%, 2.3=62%. Все 6 кейсов индивидуально ≥30% с большим запасом (AI-Failure & Judgment Content Rule, strict-in). Агрегированная доля по всему занятию (сумма failure/evidence-минут всех 6 кейсов / 73,0 мин общего материала) ≈ 48% — заметно выше порога 30% и распределена холистически по всем 6 кейсам, не сконцентрирована в одном."
  source: "library/seminars/sem-04/rework/section-0-otkrytie.md + section-1-fayl-instrukciy.md + section-2-pamyat.md + section-2-pamyat-part2.md + section-2-pamyat-part3.md + section-3-zakrytie.md (v4, review-раунд 2026-09-22 — Fix 1-7 после четырёхстороннего ревью). Supersedes v4 раунд 4 deck.yaml (49 слайдов, до review-раунда) и v3 deck.yaml (72 слайда, 90 мин, 7 ступеней)."

slides:
  # --- Раздел 0. Открытие: требования, кейс, карта экипировки (10 мин) ---
  - id: s01
    file: slides/s01-oblozhka-centralnyy-vopros.md
    type: hero_cover
    duration_min: 1
    assertion: "Скопированная конфигурация — это чужие решения без чужих триггеров"
    learning_goal: "Открытие занятия одной мыслью и одним вопросом — без оглавления и разгона; центральный вопрос ставится в первую минуту и держит всё занятие; speaker notes сокращены вдвое (R3-1a)"
    visual:
      pattern: hero_cover
  - id: s02
    file: slides/s02-trebovaniya-karkas.md
    type: assertion_visual
    duration_min: 0.5
    assertion: "Часть требований видно, открыв редактор. Часть — нет, сколько угодно смотри в код"
    learning_goal: "Открытие совместного формирования №1 — пустой каркас требований в двух группах по три, с текстовой строкой-мостиком на самом слайде, объясняющей принцип деления ДО первого ответа зала (R3-2)"
    visual:
      pattern: cobuilding_empty_frame
  - id: s03
    file: slides/s03-trebovaniya-zapolneno.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "Шесть требований делятся ровно пополам: три увидит в коде любой, три не будут видны нигде"
    learning_goal: "Закрытие совместного формирования №1 — деление 3 + 3 как несущая арифметика всего занятия; три «невидимых» требования станут содержимым файла инструкций в следующем разделе"
    visual:
      pattern: cobuilding_filled_frame
  - id: s04
    file: slides/s04-zadacha-i-chto-proizoshlo.md
    type: code_artifact
    duration_min: 2
    assertion: "Репозиторий буквально пуст, а агент, получив задачу целиком, не задал ни одного уточняющего вопроса — и то, чего он не знал, решил за вас молча"
    learning_goal: "Постановка сквозного кейса и поворот раздела 0 на одном слайде (R3-1b, слит из v2 s04+s05) — реальный пустой репозиторий, дословная задача, факт отсутствия уточняющих вопросов; монолог фасилитатора ограничен ≈150 словами"
    visual:
      pattern: terminal_task_and_dialogue
  - id: s05
    file: slides/s05-vopros-kakoy-blok-pervym.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Первый блок конфигурации выбирают из восьми вариантов на экране — и «ничего» среди них не менее весомый вариант, чем остальные семь"
    learning_goal: "Первый открытый вопрос занятия — слайд-вопрос с готовым набором вариантов (семь ступеней плюс «ничего»), переформулирован в явную рамку выбора (R3-3); БЕЗ таблицы разбора и подсветки ответа (R3-4) — разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s06
    file: slides/s06-razbor-tonkiy-agent.md
    type: answer_breakdown
    duration_min: 1
    assertion: "Бремя доказательства лежит на том, кто усложняет, а не на том, кто остаётся внизу"
    learning_goal: "Разбор четырёх типовых позиций первого вопроса как четыре явных критерия «здесь ещё рано» (R3-4, новый слайд) + целевой ответ «ничего» и определение тонкого агента из Лекции 3"
    visual:
      pattern: answer_breakdown_table
  - id: s07
    file: slides/s07-karta-ekipirovki-sokraschennaya.md
    type: keystone_axis
    duration_min: 3.5
    assertion: "Из пяти слотов экипировки агента сегодня подробно разбираются два — инструкции-правила и память; остальные три и оба практических слоя — дальше, Семинаром 5"
    learning_goal: "Единый слайд карты экипировки (R4-0, слиты бывшие два слайда v3 «пустая/заполненная») — co-building пяти слотов по памяти с Лекции 3, два акцентных в фокусе, честный scope-statement «сегодня два, дальше — Семинар 5», правило лестницы"
    visual:
      pattern: keystone_scope_map
  # --- Раздел 1. Файл инструкций: 3 кейса — роль/репозиторий, базовые процессы, вложенные файлы (28 мин) ---
  - id: s08
    file: slides/s08-divider-fayl-instrukciy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 1 — файл инструкций: три отдельные развилки про один и тот же файл, в порядке, в котором реально растёт репозиторий"
    learning_goal: "Разделитель раздела 1, обзор трёх кейсов без деталей — ориентирует зал на структуру раздела до первого кейса"
    visual:
      pattern: section_divider
  - id: s09
    file: slides/s09-divider-keys-1-1-rol-i-repozitoriy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.1 — роль агента и общее описание репозитория: что писать в пустой файл, пока не случилось ни одной реальной сессии"
    learning_goal: "Разделитель кейса 1.1, одна строка смысла — ориентирует зал на конкретную развилку до сценария"
    visual:
      pattern: section_divider
  - id: s10
    file: slides/s10-keys-1-1-problema-overview.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "Первый инстинкт — открыть пустой файл и начать с описания структуры репозитория; привычка сильная, но это ровно та фраза «так делают в хороших проектах», которую занятие проверяет впервые"
    learning_goal: "Проблема кейса 1.1 — сценарий-развилка на входе в пустой CLAUDE.md плюс анекдот коллеги про устаревший overview, сжато под сокращённый бюджет кейса"
    visual:
      pattern: problem_scenario
  - id: s11
    file: slides/s11-keys-1-1-issledovanie.md
    type: research_evidence
    duration_min: 2.5
    assertion: "Repository overview измеримо не помогает и стоит контекста — кроме единственного подтверждённого исключения: репозитория без другой документации вообще"
    learning_goal: "Исследование кейса 1.1 — четыре источника разной силы доказательства плюс честная пометка пробела (AI-Failure & Judgment Content Rule)"
    visual:
      pattern: research_evidence
  - id: s12
    file: slides/s12-keys-1-1-vopros.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Перед пустым CLAUDE.md выбор из пяти вариантов — и «пока ничего» среди них не менее весомый вариант, чем остальные четыре"
    learning_goal: "Открытый вопрос кейса 1.1 — слайд-вопрос с готовым набором вариантов, БЕЗ таблицы разбора и подсветки ответа (R3-4) — разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s13
    file: slides/s13-keys-1-1-razbor.md
    type: answer_breakdown
    duration_min: 2.5
    assertion: "Правильный ответ на этом шаге — не какой текст написать, а пока никакой: файл остаётся пустым, потому что триггер ещё не сработал"
    learning_goal: "Разбор кейса 1.1 — таблица пяти позиций + целевой ответ + критерий «здесь ещё рано», полностью без сокращений"
    visual:
      pattern: answer_breakdown_table
  - id: s14
    file: slides/s14-keys-1-1-reshenie-pustoy-fayl.md
    type: assertion_visual
    duration_min: 1.0
    assertion: "CLAUDE.md остаётся пустым — не из лени, а потому что нет сигнала; первый настоящий сигнал придёт через неделю"
    learning_goal: "Решение кейса 1.1 — пустой файл как содержательный итог, мостик к кейсу 1.2, сжато под сокращённый бюджет"
    visual:
      pattern: assertion_visual
  - id: s15
    file: slides/s15-divider-keys-1-2-processy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.2 — базовые процессы: гейт-фраза и цикл «план → код → улучшение» на первой реальной боли проекта"
    learning_goal: "Разделитель кейса 1.2, одна строка смысла — ориентирует зал на конкретную развилку до сценария"
    visual:
      pattern: section_divider
  - id: s16
    file: slides/s16-keys-1-2-problema-gotovo-raskhoditsya.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "Заказчик пишет: заявка не пришла — тест зелёный, «готово» сказано, а тест проверяет только пустые поля; записанный текстовый гейт не изменил поведение при повторе"
    learning_goal: "Проблема кейса 1.2 — «готово» расходится с реальностью, гейт записан и нарушен повторно, сжато под сокращённый бюджет"
    visual:
      pattern: problem_scenario
  - id: s17
    file: slides/s17-keys-1-2-issledovanie.md
    type: research_evidence
    duration_min: 3.5
    assertion: "Текстовый гейт без тулинга не просто бесполезен, а вреден — регрессии выросли почти до 10%; self-repair с реальной проверкой работает, голая самокритика систематически вредит"
    learning_goal: "Исследование кейса 1.2 — две мини-таблицы (гейты + цикл улучшения) плюс честная пометка пробела, полностью без сокращений"
    visual:
      pattern: research_evidence
  - id: s18
    file: slides/s18-keys-1-2-vopros.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Гейт-фраза уже есть и не сработала — выбор из пяти вариантов, что делать дальше, чтобы реально сработало в следующей сессии"
    learning_goal: "Открытый вопрос кейса 1.2 — слайд-вопрос с готовым набором вариантов, БЕЗ таблицы разбора и подсветки ответа (R3-4) — разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s19
    file: slides/s19-keys-1-2-razbor.md
    type: answer_breakdown
    duration_min: 3.0
    assertion: "Честный ответ сегодня: мы всё равно запишем гейт текстом, потому что это лучше, чем ничего, но прямо скажем себе, что он ненадёжен"
    learning_goal: "Разбор кейса 1.2 — таблица пяти позиций + двухчастный критерий «здесь ещё рано» (гейт и цикл улучшения), полностью без сокращений"
    visual:
      pattern: answer_breakdown_table
  - id: s20
    file: slides/s20-keys-1-2-reshenie-itogovyy-claude-md.md
    type: code_artifact
    duration_min: 1.0
    assertion: "Итоговый файл — тринадцать строк: критерий готово, гейт-предупреждение, честная оговорка предела; AGENTS.md — симлинк на тот же файл"
    learning_goal: "Решение кейса 1.2 — реальный итоговый CLAUDE.md (пересъёмка без трёх лишних строк дублирования package.json), механика загрузки, симлинк AGENTS.md и острый край cp -R, сжато под сокращённый бюджет"
    visual:
      pattern: code_artifact
  - id: s21
    file: slides/s21-divider-keys-1-3-vlozhennye-fayly.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.3 — вложенные AGENTS.md/CLAUDE.md по подпапкам: стоит ли дробить файл, когда репозиторий подрастёт"
    learning_goal: "Разделитель кейса 1.3, одна строка смысла — ориентирует зал на конкретную развилку до сценария"
    visual:
      pattern: section_divider
  - id: s22
    file: slides/s22-keys-1-3-problema-tests-claude-md.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "Разработчик выносит правила тестов в tests/CLAUDE.md и ждёт, что агент подхватит его сам, когда работает именно в этой папке — логично звучит, но стоит проверить, что там реально происходит с загрузкой"
    learning_goal: "Проблема кейса 1.3 — сценарий выноса правил в подпапку, сжато под сокращённый бюджет"
    visual:
      pattern: problem_scenario
  - id: s23
    file: slides/s23-keys-1-3-issledovanie.md
    type: research_evidence
    duration_min: 3.0
    assertion: "Вложенный файл грузится on-demand, только по факту чтения — не по факту нахождения в папке; контролируемое исследование не нашло пользы от разбиения, а практика показывает регулярные отказы вплоть до архитектурного предела"
    learning_goal: "Исследование кейса 1.3 — механизм загрузки + эмпирическая таблица (контролируемое исследование + реальные issue), полностью без сокращений"
    visual:
      pattern: research_evidence
  - id: s24
    file: slides/s24-keys-1-3-vopros.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Как гарантировать, что агент реально прочитает конвенции из tests/CLAUDE.md — выбор из пяти вариантов"
    learning_goal: "Открытый вопрос кейса 1.3 — слайд-вопрос с готовым набором вариантов, БЕЗ таблицы разбора и подсветки ответа (R3-4) — разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s25
    file: slides/s25-keys-1-3-razbor.md
    type: answer_breakdown
    duration_min: 2.5
    assertion: "Редкое сочетание: контролируемое исследование не нашло пользы даже там, где здравый смысл её обещал, а практика показывает регулярные отказы вплоть до архитектурного предела"
    learning_goal: "Разбор кейса 1.3 — таблица пяти позиций + целевой ответ + критерий «здесь ещё рано», полностью без сокращений"
    visual:
      pattern: answer_breakdown_table
  - id: s26
    file: slides/s26-keys-1-3-reshenie-most-k-pamyati.md
    type: assertion_visual
    duration_min: 1.0
    assertion: "Репозиторий остаётся с одним корневым файлом; три кейса — три решения знания, известного заранее, но есть знание другого рода, которое появляется по ходу работы — это раздел второй, память"
    learning_goal: "Решение кейса 1.3 + финальный мостик раздела 1 к разделу 2 (память) — итог трёх кейсов, сжато под сокращённый бюджет, мостик сохранён близко к дословному"
    visual:
      pattern: assertion_visual
  # --- Раздел 2. Память: 3 кейса — плоский файл, вики-память, задачная память (30.5 мин) ---
  - id: s27
    file: slides/s27-divider-pamyat-keys-2-1.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 2 — память: то, что агент помнит между сессиями, а не то, что вы написали ему заранее"
    learning_goal: "Разделитель раздела 2 + тег кейса 2.1, одна строка смысла — переход от раздела 1 без пересказа всего обзора"
    visual:
      pattern: section_divider
  - id: s28
    file: slides/s28-keys-2-1-problema.md
    type: problem_scenario
    duration_min: 0.5
    assertion: "Уже отклонённое решение всплывает снова, потому что разговор, в котором его приняли, закончился — а его содержимое нигде не осталось"
    learning_goal: "Проблема кейса 2.1 — сценарий-боль (отклонённое решение всплывает снова) + точная диагностика (файл инструкций тут ни при чём, дело в устройстве модели), отдельным слайдом перед исследованием (структурный фикс R4-2: проблема → исследование → вопрос)"
    visual:
      pattern: problem_scenario
  - id: s29
    file: slides/s29-keys-2-1-issledovanie.md
    type: research_evidence
    duration_min: 1.0
    assertion: "Presence paradox из кейса 1.1 применяется и здесь: то, что лежит в DECISIONS.md, стоит контекста в каждой сессии независимо от того, нужна ли эта конкретная запись сегодня"
    learning_goal: "Короткая грунтовка перед вопросом кейса 2.1 — не новое исследование, а перенос уже знакомого механизма (Gloaguen et al., presence paradox, определён на слайде исследования кейса 1.1) на новый объект: append-only лог решений. Явная связка «мы это уже видели» вместо повторного независимого измерения"
    visual:
      pattern: research_evidence
  - id: s30
    file: slides/s30-keys-2-1-vopros.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Выберите, куда записать отклонённое решение — из карточек ниже — так, чтобы не объяснять его в третий раз"
    learning_goal: "Открытый вопрос кейса 2.1 дословно с пятью карточками-вариантами — без таблицы разбора, разбор на следующем слайде; сценарий и диагностика уже показаны на предыдущем слайде, здесь — только вопрос (структурный фикс R4-2)"
    visual:
      pattern: question_with_option_cards
  - id: s31
    file: slides/s31-keys-2-1-razbor.md
    type: answer_breakdown
    duration_min: 1.25
    assertion: "Командное решение с обоснованием идёт в DECISIONS.md, личное предпочтение — в авто-память, выводимое из кода — никуда"
    learning_goal: "Разбор пяти позиций ответа зала кейса 2.1 + целевой ответ «оба механизма разом, с разделением ролей» без сокращений"
    visual:
      pattern: answer_breakdown_table
  - id: s32
    file: slides/s32-keys-2-1-cobuilding-korziny.md
    type: assertion_visual
    duration_min: 1.75
    assertion: "Не всё, что узнал агент, вообще стоит записывать — третья корзина такая же законная, как первые две"
    learning_goal: "Совместное формирование кейса 2.1: сортировка пяти карточек-фактов по трём корзинам плюс сборка итоговой записи — сохранены обе ключевые карточки (src/main.js и упавший тест)"
    visual:
      pattern: cobuilding_baskets_and_record
  - id: s33
    file: slides/s33-keys-2-1-reshenie-decisions-md.md
    type: code_artifact
    duration_min: 0.75
    assertion: "Два параллельных механизма, не один: авто-память живёт вне репозитория, DECISIONS.md — git-трекнутый лог «почему» внутри него"
    learning_goal: "Конкретное решение кейса 2.1: реальный DECISIONS.md, дерево репозитория и diff его создания — оба механизма кратко"
    visual:
      pattern: code_and_tree
  - id: s34
    file: slides/s34-keys-2-1-tablica-treh-sloev.md
    type: comparison_table
    duration_min: 0.75
    assertion: "Разница между слоями не в формате — оба markdown, — а в том, кто инициирует запись и кто её потом увидит"
    learning_goal: "Таблица трёх слоёв записи: файл инструкций / авто-память / DECISIONS.md — по авторству, месту жизни, загрузке, ревью"
    visual:
      pattern: comparison_table
  - id: s35
    file: slides/s35-keys-2-1-proval-otravlenie-i-effektivnost.md
    type: failure_vignette
    duration_min: 3.0
    assertion: "Память по умолчанию читается как доверенный контекст, а не как данные — и включение памяти не обязательно улучшает результат"
    learning_goal: "Провал/ограничение кейса 2.1, два слоя разной природы: отравление памяти (SpAIware) и измеренное «память есть ≠ память помогает» — без сокращений"
    visual:
      pattern: failure_vignette
  - id: s36
    file: slides/s36-keys-2-1-kriteriy-i-granica.md
    type: criteria_boundary
    duration_min: 1.0
    assertion: "Плоского файла достаточно, пока история решений влезает в контекст целиком и связей между записями ещё нет"
    learning_goal: "Критерий «здесь ещё рано» для плоского файла + явная граница, когда DECISIONS.md перестаёт справляться — переход к кейсу 2.2"
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s37
    file: slides/s37-divider-keys-2-2-struktura-viki.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 2.2 — структурированная вики-память: тот же журнал решений, но разросшийся настолько, что плоский лог перестал быть удобным"
    learning_goal: "Разделитель кейса 2.2, одна строка смысла — ориентирует зал на конкретную развилку до сценария (структурный фикс Fix 4: у 2.2 должен быть свой divider, как у 1.1/1.2/1.3/2.1)"
    visual:
      pattern: section_divider
  - id: s38
    file: slides/s38-keys-2-2-scenariy-razroshiysya-log.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Файл технически на месте, но пользоваться им дольше, чем не пользоваться — линейный лог не хранит связей между записями"
    learning_goal: "Сценарий-боль кейса 2.2: разросшийся DECISIONS.md, потерянная связь между записью №3 и отменяющей её записью №31"
    visual:
      pattern: scenario_pain
  - id: s39
    file: slides/s39-keys-2-2-vopros.md
    type: reflection_question
    duration_min: 1.25
    assertion: "Тридцать восемь записей и потерянная связь между двумя из них — повод выбрать, как реорганизовать журнал решений, а не заводить его заново"
    learning_goal: "Открытый вопрос кейса 2.2 дословно + пять карточек-вариантов — без таблицы разбора, разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s40
    file: slides/s40-keys-2-2-razbor.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: "Разбить на тематические файлы со сквозными ссылками — целевой ответ, но не бесплатный: структура сама создаёт новую нагрузку"
    learning_goal: "Разбор пяти позиций ответа зала кейса 2.2 без сокращений + целевой ответ с явным списком издержек"
    visual:
      pattern: answer_breakdown_table
  - id: s41
    file: slides/s41-keys-2-2-reshenie-struktura-viki.md
    type: code_artifact
    duration_min: 1.0
    assertion: "Запись явно ссылается на связанную запись — то, чего в плоском append-only логе не было в принципе"
    learning_goal: "Решение кейса 2.2: структура тематических файлов со сквозными ссылками — пример явно помечен как иллюстративный, не захваченный"
    visual:
      pattern: code_structure_illustrative
  - id: s42
    file: slides/s42-keys-2-2-proval-letta-i-izderzhki.md
    type: failure_vignette
    duration_min: 3.5
    assertion: "Структура — не гарантированный выигрыш и не бесплатный апгрейд: простое файловое хранилище обошло графовую систему памяти, а сама структура добавляет свою собственную нагрузку"
    learning_goal: "Провал/ограничение кейса 2.2 без сокращений: Letta-контрпример, staleness/duplication/maintenance, честная оговорка про свежесть непроверенных источников"
    visual:
      pattern: failure_vignette
  - id: s43
    file: slides/s43-keys-2-2-kriteriy-i-most.md
    type: criteria_boundary
    duration_min: 0.75
    assertion: "Единиц-десятков тематических файлов, которые правят один-два человека, достаточно — полноценная система памяти требует замеров на своём масштабе, не общего совета"
    learning_goal: "Критерий «ещё рано» для структуры кейса 2.2 + мостик к кейсу 2.3 — смена оси с «навсегда» на «одна задача»"
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s44
    file: slides/s44-divider-keys-2-3-operativnaya-pamyat.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 2.3 — операционная память: не «что решено навсегда», а «что происходит прямо сейчас в одной задаче»"
    learning_goal: "Разделитель кейса 2.3, одна строка смысла — ориентирует зал на смену оси (навсегда → одна задача) до сценария (структурный фикс Fix 4: у 2.3 должен быть свой divider, как у 1.1/1.2/1.3/2.1/2.2)"
    visual:
      pattern: section_divider
  - id: s45
    file: slides/s45-keys-2-3-scenariy-vtoraya-sessiya.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "Вторая сессия многошаговой задачи начинается не с продолжения, а с повторного анализа с нуля — и с конфликта с уже принятыми по ходу мелкими решениями"
    learning_goal: "Сценарий-боль кейса 2.3: вторая сессия визард-задачи начинается заново, повторяя сделанное и нарушая принятые по ходу договорённости"
    visual:
      pattern: scenario_pain
  - id: s46
    file: slides/s46-keys-2-3-vopros.md
    type: reflection_question
    duration_min: 1.25
    assertion: "Агент после сжатия контекста или в новой сессии должен продолжить с того места, где остановился, а не начать заново"
    learning_goal: "Открытый вопрос кейса 2.3 дословно + пять карточек-вариантов — без таблицы разбора, разбор на следующем слайде"
    visual:
      pattern: question_with_option_cards
  - id: s47
    file: slides/s47-keys-2-3-razbor.md
    type: answer_breakdown
    duration_min: 1.25
    assertion: "Один файл на задачу — план, лог хода, результаты — целевой ответ для линейной задачи с одним агентом и одним разработчиком"
    learning_goal: "Разбор пяти позиций ответа зала кейса 2.3 без сокращений + целевой ответ с явной оговоркой об упрощении до файла"
    visual:
      pattern: answer_breakdown_table
  - id: s48
    file: slides/s48-keys-2-3-reshenie-fayl-na-zadachu.md
    type: code_artifact
    duration_min: 1.0
    assertion: "Файл задачи ссылается на журнал решений, а не дублирует его — и это осознанное упрощение паттерна, полностью раскрываемого в другом месте"
    learning_goal: "Решение кейса 2.3: .tasks/active/signup-wizard.md с планом/логом/результатами, помечен иллюстративным, с явным упрощением до файла"
    visual:
      pattern: code_artifact_illustrative
  - id: s49
    file: slides/s49-keys-2-3-proval-ustarevshiy-plan.md
    type: failure_vignette
    duration_min: 3.0
    assertion: "Плохой план хуже отсутствия плана вообще — и это подтверждено количественно, а не только интуицией"
    learning_goal: "Провал/ограничение кейса 2.3 без сокращений: устаревший план вреднее его отсутствия (13 п.п., 100% на 30 прогонах), Index Sickness (n=1, честная оговорка), нишевость практики"
    visual:
      pattern: failure_vignette
  - id: s50
    file: slides/s50-keys-2-3-kriteriy-fayl-vs-papka.md
    type: criteria_boundary
    duration_min: 1.0
    assertion: "Одного файла на задачу достаточно, пока задача линейная и её ведёт один агент и один разработчик — иначе оправдан переход к папке"
    learning_goal: "Критерий «файл vs папка» для операционной памяти задачи + честная оговорка про распространённость практики, закрывающая раздел"
    visual:
      pattern: criteria_checklist_and_boundary
  # --- Раздел 3. Закрытие: синтез шести развилок, честный охват, финальный вопрос (4.5 мин) ---
  - id: s51
    file: slides/s51-shest-razvilok-odin-vopros.md
    type: recap_table
    duration_min: 1.5
    assertion: "Шесть развилок сегодняшнего занятия отвечали на один и тот же скрытый вопрос: текст-просьба или механическое принуждение"
    learning_goal: "Синтез раздела 3, шаг 3.1 — впервые называет вслух общий скрытый вопрос, объединяющий три развилки раздела 1 (файл инструкций) и три развилки раздела 2 (память); слово «может» — единственный визуальный акцент, без цветового кодирования правильно/неправильно"
    visual:
      pattern: recap_table
  - id: s52
    file: slides/s52-chestnyy-okhvat-dva-iz-pyati.md
    type: scope_statement
    duration_min: 1.5
    assertion: "Сегодня закрыты два слота харнесса из пяти; остальные три плюс оба механических слоя (хук, процесс) — Семинар 5"
    learning_goal: "Синтез раздела 3, шаг 3.2 — честный охват занятия называется прямо тем же ровным тоном, что scope-statement раздела 0; карта пяти слотов не пересобирается co-building'ом заново, показывается статичной итоговой версией"
    visual:
      pattern: scope_statement
  - id: s53
    file: slides/s53-finalnyy-vopros-perenos-na-svoy-repozitoriy.md
    type: closing_question
    duration_min: 1.5
    assertion: "Перенесите шесть сегодняшних решений на свой репозиторий — и проверьте, какое из них держится только на просьбе текстом"
    learning_goal: "Синтез раздела 3, шаг 3.3 — финальный открытый вопрос занятия, единственный без карточек-вариантов: у каждого в зале свой репозиторий и свой ответ, общего набора карточек не существует; ответы вслух не собираются"
    visual:
      pattern: closing_question
