- id: n64
  file: slides/n64-perenos-barera-na-drugogo-agenta.md
  type: answer_breakdown
  duration_min: 1.25
  assertion: 'Наш барьер ветки переносится на другой агент решениями целиком: переписываются объявление
    и форма ответа, а там, где механизма нет вовсе, решение держит слой надёжнее исходного'
  learning_goal: 'Разбор одного переноса на живом материале занятия: что происходит с собранным барьером
    на четырёх других агентах. Отвечает на вопрос, который зал задаёт сам — привязано ли это к одному
    инструменту; ответ даётся не ярлыком, а разбором, и источник проверки назван вслух'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица четырёх строк в три колонки: агент · что делаем с нашим барьером · что становится
      с решением. Ни одна строка не подсвечена: вывод стоит отдельной строкой под таблицей, последней
      строкой — оговорка об источнике проверки.'
    backup: 'СВЕДЕНО СЕССИЕЙ ОБОБЩЕНИЯ (круг 4, стык 11 сверки) — слайд утверждал общность не там, где
      её нет. Строка Aider называла отсутствующими «хуки, скиллы, субагенты», а research/perenosimost-stupeney.md
      §1 и §3.2–3.4 называет другую тройку: хук, MCP и субагент. Скилл у Aider под запрет не попадает
      — Agent Skills это открытый формат, перенос скилла там `cp -r`, а не переписывание (§3.2); отсутствует
      именно доступ наружу (§3.3: «у Aider нативной поддержки MCP нет», проверено по полному перечню параметров
      конфигурации). Справка при этом говорила «нет ни одного из пяти механизмов вовсе» — исследование
      говорит «трёх из пяти» (§1), то есть счёт был завышен вдвое с лишним и отменял процесс, который
      у Aider как раз работает: AGENTS.md он читает (§5). Обе формулировки приведены к исследованию. Круг
      4, новый слайд. Поставлен отдельным словом владельца: вопрос «надо проверить и явно указать в определениях
      — зависят ли рассматриваемые инструменты от кодинг-агента (надеюсь нет)» и следом «тогда надо будет
      это пояснить». Факт стоит на n03 третьей колонкой, объяснение — строкой на n64, а этот слайд — разбор
      одного переноса целиком. Материал: research/perenosimost-stupeney.md §5 (разбор переноса на семь
      агентов, проверка 2026-10-01 по 17 первоисточникам). ФОРМА взята с n10 (эталон разбора, кейс 1):
      три колонки, ни одна строка не подсвечена, вывод отдельной строкой — rework-r4/PLAN-part2.md §К5.
      СОСТАВ СТРОК. Четвёртой строки нет и быть не должно: три из них — те, что §10 исследования называет
      устроенным принципиально иначе (миллисекунды у Gemini, отсутствие «спросить» у Windsurf, отсутствие
      механизма у Aider), а первая обязана стоять первой, иначе слайд врёт умолчанием. Исследование нашло,
      что переносимы ТРИ ступени из пяти, а хук у трёх поставщиков из семи читается прямо в нашем формате;
      слайд из одних провалов переноса сказал бы обратное тому, что проверено. ПОЧЕМУ ИМЕННО ЭТИ ТРИ ПРОВАЛА.
      Миллисекунды Gemini — отказ того же класса, что третий кейс деки разбирает (таймаут × частота),
      но добытый переносом, а не оплошностью автора. Windsurf — прямая потеря одного из ПЯТИ решений n12
      («что делать, если проверка не смогла ответить»): там нет объекта решения вовсе, запретить можно
      только кодом выхода. Aider — вывод, а не пробел: механизма нет, решение в силе, держит его защита
      ветки на площадке, то есть ровно «второй барьер, который от клетки не зависит» с n24, и он надёжнее
      исходного. ЧЕСТНЫЙ ПРОБЕЛ НА ВИДИМОМ СЛОЕ (§11 исследования, обязательно): живой проверки переноса
      не делали НИ НА ОДНОМ агенте — всё выведено из документации поставщиков. У Cursor это острее прочих:
      его документация не описывает, какой вход получает импортированный хук Claude Code, и «ноль правок»
      выведено из описания его СОБСТВЕННОГО события. Последняя строка слайда говорит это вслух; подать
      «ноль правок» как измеренное было бы ровно тем, чему занятие учит не верить. МЕСТО В ДЕКЕ: перед
      n64, то есть до закрывающего объяснения. По номеру слайд попадает в диапазон блока скиллов, по смыслу
      относится к сборке — та же развилка, что уже описана у n33 в build_sem05.SECTIONS_BY_PREFIX; надзаголовок
      и нумерацию сводит отдельная сессия. ВЁРСТКА: первая колонка узкая, и шапка «Куда переносим» ломалась
      ПОСЕРЕДИНЕ СЛОВА на три строки, наезжая на первую строку таблицы. Сборочные сторожа молчали, check_tracks_pdf
      тоже (он ловит фигуру, режущую текст, а не текст, наехавший на текст) — поймано глазом на настоящем
      PNG. Шапка укорочена до «Агент». Перечень в первой ячейке — через запятую, не через «·»: точка-разделитель
      даёт перенос там, где его не ждёшь.'
