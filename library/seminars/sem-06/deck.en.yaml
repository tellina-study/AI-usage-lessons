  format: facilitator slides + open questions with option cards (the question comes BEFORE the breakdown)
    + building the artifact together with the room + the mechanics on worked examples; no live terminal
  cover_hook: The agent did not get dumber — so what stopped fitting?
  central_question: 'The work has run past the agent''s context — which do you set up first: bringing
    inside what is not inside, or carrying outside what does not fit inside?'
