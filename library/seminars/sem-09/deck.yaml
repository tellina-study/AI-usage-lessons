    экспертов (З4); колонка «Числа» добавлена ПО ПРЯМОЙ ПРОСЬБЕ ВЛАДЕЛЬЦА — это именованный override решения
    issue #274 (§8.3 канона: отменил — поправь сторож и назови), а не тихий возврат старого формата.'
