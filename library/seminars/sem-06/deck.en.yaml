- id: n15
  file: slides-en/n15-pochemu-galochki-proshchyolkivayut.md
  type: mechanics_map
  duration_min: 1.5
  assertion: The service asks about permissions once — when the key is issued, and the move "tick every
    box in case it turns out to be needed" is made by almost everyone, the course's author included; a
    key like that lives not in the repository but in a secrets store, and its leaking is watched over
    by the provider — by the account of students from a previous cohort, a key exposed in a public repository
    is blocked within seconds
  learning_goal: 'The honest continuation of the decision about the key: knowing which permissions are
    needed and issuing exactly those are different things, and they come apart on a single movement of
    the mouse. The slide names the motive for which permissions get issued broad, the place the key lives
    after it is issued, and the cost of a leak together with the boundary of the protection the provider
    gives'
  visual:
    pattern: mechanics_table
    primary: 'At the top — a line about the one moment when permissions are asked about. Below — a table
      in two substantive columns across four rows: the move almost everyone makes, and what in it comes
      expensive; the secrets store and the provider''s watchdog stand as rows of the same table. A line
      in gold closes it: the watchdog covers one channel out of many, and a narrow key remains the only
      thing within your power.'
    backup: 'Source — a topic the course''s author developed at length in both delivered classes of this
      deck and that the materials only brushed against (transcripts: `qa/rasshifrovki/gruppa-1.txt`, 16:54–17:56;
      `qa/rasshifrovki/gruppa-2.txt`, 18:11–22:02). Entered per section B of the delivery breakdown (`qa/RAZBOR-PROVEDENIYA.md`),
      item 4.

      The verbatim supports. The moment of issue: "it asks you, now which actions will you trust to this
      key" (gr. 2, 19:09). The author''s admission, which the delivery breakdown calls the strongest place
      in both classes (§C2): "your humble servant does the same thing: every box there is, I click straight
      through, but in reality that is what you should not do" (gr. 2, 19:09); "I usually get lazy, because
      I think, what if at some point later I need to do something, surely I am not going to reissue a
      new key for that" (gr. 2, 19:25); the same in group 1 — "I am guilty of just taking whatever I want
      so as not to think further about what it is going to do" (16:54). The store: "you should of course
