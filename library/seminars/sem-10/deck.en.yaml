  audience: 3rd-year students, 09.03.01 — practicing engineers, all already use AI assistants
  duration_min: 74.75
  format: facilitator slides + open questions with option cards (question BEFORE the breakdown) + real
    screenshots of the live n8n.lessons.tellian.io canvas across all four cases (captured via Playwright
    working around `~/.cache/page-shot-libs/x`, the notes/mcp-limitations.md [#233-8] restriction lifted
    2026-10-20) + problem-setup diagrams (solid lines for what is already built, dashed for what is still
    to be done; canon `tools/seminar-production/forma-keysa-s-zamerom.md`) + four measured runs on this
    rig (SberQuAD for text, CORD for images), protocols in `stend/raw/`
  cover_hook: null
  central_question: How to build a knowledge base that grows?
  language: en
  slide_count: 83
  axis: Four claims, each one looks reliable; what each turned out to be is filled in with measurement,
    one row per case
  slot_min: 90
