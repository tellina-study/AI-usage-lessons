# Первый работающий процесс
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 07
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n06   12.00 мин
#   Ось        n07–n07    2.00 мин
#   Кейсы      n08–n40   67.50 мин
#   Закрытие   n41–n43    7.00 мин
#   ИТОГО                  88.50 мин при слоте 90

deck:
  seminar_number: 7
  title: Первый работающий процесс
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 88.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: Как своевременно и качественно разбирать 200 писем в день?
  language: ru
  slide_count: 43
  axis: null
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Первый работающий процесс: триггер, шаг модели, запись результата'
  learning_goal: Обложка. Называет занятие и его место в дуге.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Круг 5, пересборка по переопределённой цели (KONTSEPTSIYA-7-12.md): семинар учит технике
      на уровне блоков инструмента. Прежние четыре деки в slides-v3-arhiv/ и slides-v4-arhiv/.'
- id: n02
  file: slides/n02-lestnitsa-dugi.md
  type: taxonomy_compare_table
  duration_min: 3.0
  assertion: 'Девять ступеней сложности процесса и шесть занятий, которые их закрывают: сегодня — вторая
    снизу'
  learning_goal: 'Карта дуги вторым экраном занятия: зал сразу видит, где он и куда идёт. Повествование,
    а не таблица.'
  visual:
    pattern: taxonomy_compare_table
    figure: lestnitsa-dugi.png
    primary: 'Лестница из девяти ступеней снизу вверх во всю ширину, сегодняшняя золотом, справа у каждой
      — занятие. Под ней две строки связного текста, без таблиц.

      '
    backup: 'Перенесена В НАЧАЛО по прямой просьбе владельца (2026-10-13): «давай в начало добавим». Прежде
      стояла после первого кейса — доводом, что девять незнакомых слов не лягут; владелец этот довод отклонил,
      и он был неверным: лестница не вводит термины, а показывает дорогу.'
- id: n03
  file: slides/n03-iz-lektsii-lestnitsa.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Workflow — процесс с заранее заданным порядком шагов; агент определяет порядок сам. У workflow
    пять схем, и все пять с заданным путём
  learning_goal: Определение workflow и агента (Лекция 3 §4.3) плюс пять схем workflow списком. Заголовок
    называет предмет (А10), ссылок на лекцию в видимом тексте нет (А4).
  visual:
    pattern: problem_scenario
    primary: 'Две врезки с определениями, под ними пронумерованный список пяти схем — каждая одной строкой
      с примером. Таблиц нет.

      '
    backup: 'Переписано из таблицы в повествование по правке владельца (2026-10-13): «нормального повествования
      вместо табличек сейчас нет». Источник — library/lectures/lec-03/chapter-part3.md §4.3.'
- id: n04
  file: slides/n04-iz-lektsii-multiagenty.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Надёжность последовательных шагов перемножается: десять шагов по 95% дают 60%. Отсюда и
    цена агентов, и правило начинать с одного'
  learning_goal: 'Арифметика надёжности и цены по правилу А11: шесть несущих пар крупно, под ними короткий
    комментарий, что каждая пара значит.'
  visual:
    pattern: problem_scenario
    primary: 'Шесть пар чисел крупной таблицей без шапки — метрика первична. Под ней три коротких комментария,
      по одному на пару строк: что число значит и что из него следует.

      '
    backup: 'Числа сверены с library/lectures/lec-03: 0,95^10 ≈ 60%, 0,9^10 ≈ 35%, 4× и 15× токенов, 17,2×
      против 4,4× (Kim et al., 2026). Форма по правилу А11 (решение владельца 2026-10-13): «структура
      и метрика первична, но обязательно должна быть пояснена» — прежние абзацы, внутри которых числа
      надо было выискивать, заменены парами.'
- id: n05
  file: slides/n05-vidy-instrumentov.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Три класса инструментов: конвейеры между системами, платформы для агентов и конструкторы
    LLM-приложений — выбор решают два вопроса, кто запускает и что считается шагом'
  learning_goal: 'Введение: из какого класса взят n8n и почему. По-человечески, с названиями, повествованием
    — без таблицы.'
  visual:
    pattern: problem_scenario
    primary: 'Три блока, по одному на класс: слева класс задачи человеческой формулировкой, в середине
      пример, справа — системы этого класса. Внизу одна строка про различие по запуску.

      '
    backup: 'Форма по правке владельца (2026-10-13): «в блоке класс задачи, пример и справа от блока системы».
      Прежняя закрывающая врезка про «два вопроса, которые решают выбор» снята его же решением; различие
      по запуску — то единственное из неё, что проверяется на экране, — осталось одной строкой. Про закрытие
      Flowise — в заметках, не на экране.'
- id: n06
  file: slides/n06-n8n-zachem-i-kak.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'n8n — интеграционный оркестратор с визуальным холстом: процесс рисуется узлами, между узлами
    ходят данные, запускается снаружи, и всё это видно в журнале прогонов'
  learning_goal: Устройство n8n до входа внутрь. Пять блоков, в каждом ключевая мысль выделена; заголовок
    называет предмет (А10).
  visual:
    pattern: mechanism_node_graph
    figure: n8n-holst-stage1.png
    primary: 'Снимок холста n8n во всю ширину, с подписанными прямо на нём четырьмя вещами: холст · узел
      · карточка узла · журнал прогонов. Под снимком таблица устройства в две колонки. Рисованной схемы
      здесь НЕТ намеренно: поддельный интерфейс запрещён правилом курса, а настоящий снимок — весь смысл
      этого экрана.

      '
    backup: 'Добавлено 2026-10-12 по правке владельца: «потом слайд про n8n для чего, как устроено и только
      потом внутрь». Это же закрывает P0-3 прожарки: предмет занятия впервые появляется на экране ДО того,
      как про него говорят. СНИМОК СНЯТ с живого стенда 2026-10-13: холст стадии 1, шесть узлов, подключённая
      модель и значок Published. СНИМОК С ЖИВОГО СТЕНДА 2026-10-13 стоит рисунком слайда.'
- id: n07
  file: slides/n07-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: 'Один процесс в четыре приёма: классификация и сохранение, две темы, отказ модели, публикация
    версии'
  learning_goal: 'Карта занятия и несущая ось в одной таблице: перечислены четыре кейса, колонка «чем
    оказалось» пуста и закрывается в конце (Pre-USER-GATE §6).'
  visual:
    pattern: keystone_axis
    primary: 'Таблица четырёх кейсов: номер и название, что собираем, что будет выглядеть рабочим, и пустая
      колонка «чем оказалось» с пунктирными клетками. Внизу одна строка про то, что четвёртая колонка
      заполнится к концу занятия.

      '
    backup: 'Конструкция взята из принятых Семинаров 4 и 6: ось открывается с дырками (в Семинаре 6 ось
      открывается с двумя пустыми строками из четырёх и закрывается заполненной в его предпоследнем блоке).
      В С7 этого не было вовсе — главная находка прожарки методической критики, вердикт REJECT. Круг 8
      (правка владельца 2026-10-13): «убери тут и везде вопросы про работу, оставь только перечисление
      кейсов». Вопрос занятия («возьмите процесс со своей работы…») снят с экрана по правилу А12; ось
      не отменена, а сведена с картой занятия в одну таблицу — строка теперь называет кейс, а не абстрактную
      радость.'
- id: n08
  file: slides/n08-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Заявки с формы читает человек и переносит в таблицу руками, проставляя тему и срочность
  learning_goal: Дивайдер кейса 1. Заголовок сухой и называет предмет (А10); наблюдаемая работа, не инструмент
    (А2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Заголовок круга 8 (правка владельца 2026-10-13): реплика «их всё равно потом руками перекладывают»
      уехала с заголовка во врезку — по заголовку должно быть видно, о чём экран (А10). Сквозной пример
      дуги — обработка входящей заявки (KONTSEPTSIYA-7-12.md §7). Выбран вместо бота поддержки: бот не
      создаёт повода для циклов, слияния и сабфлоу, и ровно эти ступени в курсах рынка систематически
      пропускают.'
- id: n09
  file: slides/n09-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Администратор читает двадцать заявок в день и переносит их в таблицу руками; ошибка в теме
    или срочности задерживает обработку минимум на день
  learning_goal: 'Такт сцены кейса 1 в форме принятых семинаров: связный рассказ с хронологией и ценой,
    а не таблица, из которой зал вычитывает постановку.'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой, под ней пронумерованная хронология дня, и закрывающий абзац
      про цену. Таблиц нет.

      '
    backup: 'Переписано по правке владельца (2026-10-13): «нормальная постановка кейса, а не эта с непонятным
      вычитыванием из таблицы». Форма взята с принятого Семинара 6 (сцена вторника): врезка → хронология
      по пунктам → абзац цены.'
- id: n10
  file: slides/n10-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Писем стало 200 в день — четыре способа разбирать такой поток, и у каждого своя область,
    где он правильный
  learning_goal: 'Вопрос кейса 1: голые карточки без доводов, вопросов «к себе» нет (А12). Подсказок нет
    — разбор экраном позже.'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху новая вводная — поток вырос вдесятеро. Под ней вопрос в золотой рамке и ряд карточек
      равной ширины. Никаких пояснений к карточкам: они на разборе.

      '
    backup: 'Переписано по правке владельца (2026-10-13): «просто выбор вариантов, а не варианты с подсказками
      сразу». Прежняя колонка «довод за него» была подсказкой и обнуляла голосование. Вопрос переформулирован
      со счёта узлов на выбор способа: считать узлы — угадывать число, а здесь выбирают подход, и несколько
      вариантов законны. Круг 8 (правка владельца 2026-10-13): вопрос «к себе» снят по правилу А12; постановка
      заменена ростом потока до 200 писем в день — у прежней («что поставить между формой и таблицей»)
      не было повода что-либо менять, двадцать писем Ольга разбирала. Карточки переименованы его же словами:
      «добавить сотрудников» вместо «оставить человеку», «алгоритмическая NLP-классификация» вместо «правила
      по ключевым словам», у четвёртой назван исход того, что не вошло в справочник. Пятая карточка («шаг
      + проверка + показ результата») свёрнута в четвёртую: показ результата — не выбор способа разбора,
      а свойство нашей сборки.'
- id: n11
  file: slides/n11-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Все четыре законны; разделяет их то, чем гарантируется значение в клетке — и какой ценой
    на живом потоке
  learning_goal: 'Разбор сразу за вопросом: прикидка точности на живом потоке плюс «что делает / чего
    не делает», без вердиктов. Поворот — характер отказа.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: способ · что делает · что не делает или ограничение. Под ней — поворот и строка
      про то, какие варианты остаются законными под требование.

      '
    backup: 'Вердикты «верно / неверно» сняты по правке владельца (2026-10-13): «надо понимать, что все
      они могут быть правильными и это нормально». Форма повторяет разбор принятого Семинара 6: что делает
      / чего не делает. Круг 8 (правка владельца 2026-10-13): добавлена колонка прикидки точности на живом
      потоке и отдельная врезка про 100% значений из справочника («важно для систем»); второй вывод —
      «что остаётся под наше требование» — снят. Числа собраны фактчекером по первоисточникам, ссылки
      в заметках; на экране они поданы как ПРИКИДКА, и в заметках прямо сказано, что замера всех четырёх
      способов на одном потоке не существует.'
- id: n12
  file: slides/n12-sistema-obzor.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Всё хозяйство процесса лежит на одном экране: сами процессы, учётные данные, прогоны, переменные
    и таблицы — отдельными вкладками'
  learning_goal: 'Обзор системы перед входом внутрь: зал должен понимать, где что лежит, прежде чем смотреть
    на отдельный узел.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-spisok-protsessov.png
    primary: 'Снимок обзорного экрана n8n: вкладки, четыре процесса занятия и счётчики прогонов сверху.
      Под снимком — две врезки о том, что здесь читают.

      '
    backup: 'СНИМОК С ЖИВОГО СТЕНДА 2026-10-13. Заведён по правке владельца (2026-10-13): «перед этим
      слайдом добавь слайды со скринами с обзором системы — процесс, креды».'
- id: n13
  file: slides/n13-sistema-kredy.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Учётные данные — отдельная сущность с проверкой соединения: ключ вводится один раз, хранится
    скрытым и в файл процесса не попадает'
  learning_goal: 'Учётные данные как механизм: зачем они отдельно от сценария и что это даёт при передаче
    процесса другому человеку.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-kredy-karta.png
    primary: 'Снимок карточки учётных данных: имя, тип, зелёная строка «соединение проверено», поле ключа
      точками. Под снимком три врезки о следствиях.

      '
    backup: СНИМОК С ЖИВОГО СТЕНДА 2026-10-13, учётные данные `OpenRouter account`. Ключ на снимке скрыт
      самим интерфейсом — показывать его было бы нельзя ни при каких условиях, и это тот случай, когда
      инструмент не даёт ошибиться.
- id: n14
  file: slides/n14-k1-obzor.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Вот процесс целиком на холсте: шесть узлов, у каждого номер и одна строка о том, что он
    делает'
  learning_goal: Взгляд сверху ДО погружения в параметры. Снимок живого холста с нумерованными метками
    — зал видит устройство целиком прежде, чем увидит карточку узла.
  visual:
    pattern: mechanism_node_graph
    figure: obzor-k1.png
    primary: 'Снимок холста с живого стенда во всю ширину, на нём шесть нумерованных меток, под снимком
      — расшифровка номеров.

      '
    backup: 'Добавлено по правке владельца (2026-10-13): «не хватает скрина процесса с пояснениями на
      каждый кейс, сразу ныряем внутрь, а взгляда сверху нет». Метки положены ПОВЕРХ настоящего кадра,
      интерфейс не перерисован.'
- id: n15
  file: slides/n15-k1-reshenie-parametry.md
  type: mechanism_node_graph
  duration_min: 4.0
  assertion: Список объявлен схемой-перечислением, сверка держит его выражением, и зал предсказывает результат
    до прогона
  learning_goal: 'Вторая половина такта «наше решение»: что настраиваем в двух несущих узлах, и предсказание
    зала перед прогоном.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-uzel-izvlecheniya.png
    primary: 'Снимок карточки узла извлечения со схемой. Под ним две строки параметров и вопрос-предсказание
      золотой рамкой.

      '
    backup: 'Отделено от предыдущего экрана: вместе состав узлов и параметры не влезали, таблица уходила
      на 9 пунктов и композиция вылезала за рабочее поле. Выражение сверки стоит здесь — там, где применяется,
      а не в снятом экране теории, после которого оно в деке не встречалось ни разу. СНИМОК С ЖИВОГО СТЕНДА
      стоит рисунком слайда. Круг 8 (правка владельца 2026-10-13): «добавь как подложку скрин схемы и
      выдели там блок, который смотрим; вместо json вынеси скрин настройки узла и описание ключевых параметров,
      без кода». Рисунок собран из двух настоящих кадров: полоса холста с золотой рамкой вокруг узла извлечения
      — сверху, карточка самого узла — под ней. Текст слайда переписан с выражений на описание полей;
      JSON и выражение сверки остались только в заметках, для тех, кто спросит.'
- id: n16
  file: slides/n16-k1-chto-vidit-chelovek.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'Вход и выход процесса — две веб-страницы, которые даёт сам инструмент: форма с объяснением
    на входе и экран со всеми четырьмя шагами на выходе'
  learning_goal: Такт «что видит человек» кейса 1. Зал должен увидеть оба края процесса глазами того,
    кто им пользуется, — и понять, что промежуточные шаги печатаются на экране намеренно.
  visual:
    pattern: mechanism_node_graph
    figure: n8n-vhod-i-rezultat.png
    primary: 'Два настоящих кадра рядом: слева форма — вход процесса, справа экран результата с четырьмя
      шагами. Под ними три врезки о том, зачем на экране промежуточные шаги. Рисунок — склейка двух снимков
      со стенда, не макет.

      '
    backup: 'СНИМКИ С ЖИВОГО СТЕНДА 2026-10-13: форма `s7-stage-1` и её экран завершения после настоящей
      отправки заявки (строка 16 в таблице `requests`). Слайд заведён по правке владельца: «сделай примеры
      такими, чтобы они показывали не только ввод, но и промежуточные шаги и результат где-то сразу —
      на форме, всплывающем окне, чате, чтобы можно было без хождений и переключений сразу показать».'
- id: n17
  file: slides/n17-k1-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Закрытый список нужен, когда результат читает следующий шаг, и не нужен, когда его читает
    человек; предел — список, в котором нет «иначе»
  learning_goal: 'Критерий вместо эссе: двухколоночная таблица «когда нужно / когда не нужно» с названным
    пределом, плюс строка закрытия первой строки оси.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки, клетки полными фразами. Под ней — названный предел отдельной плашкой
      и строка закрытия оси.

      '
    backup: 'Форма взята из принятых Семинаров 4 и 6 («MCP нужен, когда… не нужен, когда…»). Прежние два
      экрана — «что переносится в любой инструмент» и «где ломается классификация — три класса» — сведены
      сюда: прожарка методической критики показала, что восемь таких экранов несли 41% всего видимого
      текста занятия и при этом ничего не показывали и не решали.'
- id: n18
  file: slides/n18-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «В заявке две темы, а в таблице одна» — наблюдаемый результат первого кейса
  learning_goal: Дивайдер кейса 2. Проблема видна прямо из того, что собрали минуту назад, и на том же
    экране результата.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Опирается на прогон кейса 1: заявка «перенести занятие и как оплатить» вернула одну тему.
      Проверено на стенде, прогоны 2 и 4.'
- id: n19
  file: slides/n19-k2-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'Вторник: заявка про перенос и оплату попала в таблицу с одной темой, Ольга закрыла её, а
    про счёт человек спросил сам через три дня'
  learning_goal: 'Сцена кейса 2 в форме принятых семинаров: рассказ с хронологией и ценой. Процесс отработал
    честно — ломается не он, а граница наших обещаний.'
  visual:
    pattern: problem_scenario
    primary: 'Врезка с обстановкой, хронология по пунктам, абзац про цену и границу обещанного.

      '
    backup: 'Случай взят из прогона стадии 1 на стенде (прогоны 2 и 4): заявка с двумя темами вернула
      одну, вторая не попала никуда.'
- id: n20
  file: slides/n20-k2-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Что писать в тему, когда их в заявке две — четыре способа, и все четыре встречаются в живых
    системах
  learning_goal: 'Вопрос без подсказок: голые карточки, вопросов «к себе» нет (А12). Выбор содержательный
    — все четыре варианта собираются одинаково легко.'
  visual:
    pattern: question_with_option_cards
    primary: 'Текст заявки врезкой, вопрос в золотой рамке и ряд карточек без пояснений.

      '
    backup: 'Пояснения к карточкам сняты по правке владельца (2026-10-13). Заявка напечатана целиком:
      прежде зал решал про заявку, которой перед ним не было. Круг 8 (правка владельца 2026-10-13): вопрос
      «к себе» снят по правилу А12; вопрос переформулирован с «что писать в тему» на «как корректируем
      устройство процесса» — спрашивается правка конструкции, а не содержимое клетки. Карточки заменены
      его списком: «главную и пометку» снята, добавлено «расширять справочник всеми сочетаниями тем».'
- id: n21
  file: slides/n21-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Все четыре законны; разделяет их то, на кого ложится вторая тема. Берём расщепление письма
    на две строки
  learning_goal: 'Разбор без вердиктов: что делает способ и чего не делает. Поворот — разница между «уверен
    и неправ» и «не знаю и говорю об этом».'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: способ · что делает · что не делает или ограничение. Под ней поворот и строка про
      то, что остаётся под нашу задачу.

      '
    backup: Вердикты сняты по правке владельца. Третий способ — задел Семинара 9 (несколько строк из одного
      входа), и он назван, а не умолчан.
- id: n22
  file: slides/n22-k2-obzor.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: Тот же процесс плюс один узел расщепления; схема извлечения отдаёт список тем, остальное
    не трогается
  learning_goal: 'Взгляд сверху перед правкой: зал видит настоящий холст стадии 2б и что к нему добавился
    ровно один узел.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-holst-2b.png
    primary: 'Снимок холста стадии 2б во всю ширину: семь узлов в ряд, среди них новый Split topics. Под
      снимком — две врезки о том, что изменилось и что нет.

      '
    backup: 'СНИМОК С ЖИВОГО СТЕНДА 2026-10-15, процесс «С7 · стадия 2б — расщепление записи». Правка
      владельца к этому слайду была «точно ли тот скрин?» — и нет, прежде здесь стоял холст СТАДИИ 1 с
      двумя метками, то есть кейс 2 показывал процесс, которого в нём нет. Стадия 2б заведена на стенде
      в этот же день и проверена настоящей отправкой: письмо с двумя темами дало две строки (id 19 и 20
      таблицы requests).'
- id: n23
  file: slides/n23-rasshcheplenie.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Расщепление — не особый блок, а следствие модели данных: между узлами идёт список элементов,
    и каждый следующий узел выполняется по разу на каждый элемент'
  learning_goal: 'Механика расщепления через модель данных n8n. Сюда свёрнут прежний отдельный экран «как
    данные ходят в n8n»: там он стоял в кейсе 1, где расщепления нет и список всегда из одного элемента.'
  visual:
    pattern: mechanism_node_graph
    figure: teoriya-dannye-spiskom.png
    primary: 'Схема прохода списка элементов через узлы. Под ней три врезки: модель данных, что делает
      узел расщепления, и чем за это платят.

      '
    backup: 'Перенесено по правке владельца (2026-10-13): «16 слайд в этом кейсе не нужен, результат ввода
      всегда один — или убрать, или перенести в другой раздел». Перенесён в кейс 2, где список впервые
      становится длиннее одного и где из него сразу следует наблюдаемый результат — две строки. ПРОВЕРЕНО
      НА СТЕНДЕ 2026-10-15: после Split topics элементов 2, строк записано 2, темы «перенос занятия» и
      «оплата».'
- id: n24
  file: slides/n24-k2-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Одно письмо с двумя темами даёт две строки в таблице — обе темы из справочника, у каждой
    свой маршрут
  learning_goal: 'Результат кейса 2 данными: две строки из одного письма, крупно и без окружающей таблицы.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-razbitye-stroki.png
    primary: 'Только две строки таблицы `requests` под её шапкой — те самые, что вышли из одного письма.
      Большая таблица на шестнадцать строк снята: на ней разбитые строки терялись.

      '
    backup: 'ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12 (n8n 2.42.7), стадия 2, 10 строк таблицы: ни одной пустой
      темы, ни одной темы вне справочника — включая заявку из одного слова «ок» и бессмысленный ввод.
      Заявка с тремя темами дала «оплата» + пометку «перенос занятия · другое». СНИМОК ТАБЛИЦЫ `requests`
      СО СТЕНДА 2026-10-13 стоит рисунком слайда: он показывает то, что утверждает слайд, прямо данными
      — ни одной пустой темы на шестнадцати строках, включая строки с мусорным вводом, у которых тема
      «другое». Снимок карточки узла сверки (`n8n-kartochka-sverki.png`) уступил ему место: карточка показывает
      УСТРОЙСТВО, а такт «наше решение» в этом кейсе про РЕЗУЛЬТАТ. Принципиальная схема `k2-shema-trudnye-zayavki.png`
      уступила место ещё кругом раньше — схема уже была показана в кейсе 1.'
- id: n25
  file: slides/n25-chto-vidit-polzovatel.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'На экране результата видно не только темы, но и само расщепление: сколько элементов вышло
    после него и сколько строк записано'
  learning_goal: 'Второй край кейса 2: что человек видит сразу после отправки. Показ промежуточного шага
    здесь несёт прямую пользу — расхождение «тем две, а строка одна» видно без журнала.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-split-rezultat.png
    primary: 'Снимок экрана результата после настоящей отправки письма с двумя темами: четыре шага, среди
      них отдельный шаг расщепления со счётчиком. Рядом — две врезки о том, зачем счётчик на экране.

      '
    backup: 'СНИМОК С ЖИВОГО СТЕНДА 2026-10-15, форма стадии 2б, письмо «можно перенести занятие со вторника?
      И подскажите, как оплатить». На экране: темы «перенос занятия · оплата», элементов после расщепления
      2, строк записано 2.'
- id: n26
  file: slides/n26-k2-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Запись расщепляют, когда у частей разные исполнители и сроки, и не расщепляют, когда заявка
    имеет смысл только целиком; предел — учёт без договорённости
  learning_goal: 'Критерий кейса 2 (расщепление записи) плюс закрытие второй строки оси. Форма принятых
    семинаров: когда нужно / когда не нужно + названный предел.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами. Под ней предел отдельной плашкой и строка закрытия
      второй строки оси.

      '
    backup: 'Круг 8: критерий переписан вслед за сменой решения кейса — с «законного «не знаю»» на расщепление
      записи (правка владельца 2026-10-13 к слайдам 19, 21 и 22). Законное воздержание осталось в разборе
      как второй вариант из четырёх; отдельным критерием оно больше не стоит, потому что кейс его не выбирает
      — иначе сторож требовал бы границу для приёма, которого в собранном процессе нет.'
- id: n27
  file: slides/n27-k3-divider.md
  type: case_divider_fact
  duration_min: 0.5
  assertion: Понедельник, таблица, двое суток пропуска — дивайдер констатирует факт, а не передаёт чью-то
    реплику
  learning_goal: 'Дивайдер кейса 3. Форма сломана намеренно: два предыдущих дивайдера были репликами,
    третий — голая констатация, иначе зал предсказывает экраны (§4.2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним одна приглушённая строка. Дорожка кейсов, третий подсвечен.

      '
    backup: 'Намеренный сбой ритма форм дивайдеров (§4.2): кейсы 1 и 2 входили репликой, этот входит фактом.
      Фрагмент таблицы с дыркой показывается на стенде вживую, на слайд не выносится — экран на полминуты.'
- id: n28
  file: slides/n28-k3-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Понедельник, девять утра: в таблице пятница и понедельник, выходных нет вовсе, и никто не
    знает, что процесс делал эти два дня'
  learning_goal: 'Сцена кейса 3: рассказ с хронологией, где половина фактов — про неизвестное. Отсутствие
    записи дороже ошибки, и это видно из самой сцены.'
  visual:
    pattern: problem_scenario
    primary: 'Врезка, хронология по пунктам, абзац про то, что сторож не сработал и сработать не мог.

      '
    backup: 'Главное свойство сцены: половина пунктов — про то, чего мы НЕ знаем. Это и делает отсутствие
      записи дороже ошибки.'
- id: n29
  file: slides/n29-k3-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Что должен делать узел, когда вызов не удался — третье решение зала
  learning_goal: Третье голосование. Все четыре карточки — реальные значения настроек узла; это выясняется
    на разборе и обычно становится сюрпризом.
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке сверху, под ним четыре карточки равной ширины — все одинаковые, без
      подсветки и без доводов.

      '
    backup: 'Вводная не нужна: зал выбирает поведение, а не блок. Что каждая карточка — это готовая настройка,
      сообщается на разборе. Круг 9 (правка владельца 2026-10-15): варианты были набраны таблицей «вариант
      · довод за него». Сборщик превращает такую таблицу в ряд карточек, ОТБРАСЫВАЯ вторую колонку и подсвечивая
      первую строку — на экране первый вариант стоял в золотой пунктирной рамке, то есть отмеченным. Доводы
      сняты по правилу А6, карточки набраны обычным рядом, подсветки нет ни у одной. Строка «дальше по
      процессу у нас запись в таблицу» снята его же правкой.'
- id: n30
  file: slides/n30-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Все четыре ответа — это значения настроек On Error и Retry On Fail в карточке любого узла;
    по умолчанию стоит Stop Workflow
  learning_goal: 'Разбор сразу за вопросом. Главный поворот: зал голосовал за поведение и, не зная того,
    выбирал из готового списка настроек инструмента.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки: имя настройки — поведение — когда уместно. Над таблицей одна строка-поворот.
      Настройка по умолчанию выделена.

      '
    backup: Четыре значения On Error плюс Retry On Fail — реальные настройки узла n8n, проверены по справочнику
      нод. Continue = Continue (regular output). Четыре значения On Error и Retry On Fail сверены со стендом
      (n8n 2.42.7); поведение `continueErrorOutput` проверено прогоном 6.
- id: n31
  file: slides/n31-k3-obzor.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'У узла извлечения появился второй выход, подписанный Error, и своя ветка: та же таблица
    с пометкой и свой экран'
  learning_goal: Взгляд сверху на процесс с веткой отказа — прежде чем открывать вкладку настроек. Видно
    повтор на узле и то, что ветка ведёт не в тупик.
  visual:
    pattern: mechanism_node_graph
    figure: obzor-k3.png
    primary: 'Снимок холста стадии 3, красным отмечены повтор на узле, второй выход Error и ветка отказа.
      Под снимком — расшифровка.

      '
    backup: Значок повтора на узле виден на самом кадре (две стрелки по кругу) — это единственное место,
      где настройка узла заметна снаружи, не открывая карточку.
- id: n32
  file: slides/n32-k3-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 6.0
  assertion: 'Retry On Fail плюс выход error: заявка идёт в ту же таблицу со status = not_parsed и на
    свой экран — ни одна не теряется, и отказ видно сразу'
  learning_goal: 'Такт «наше решение» кейса 3, собирается вживую. Отказ демонстрируется честно: ключ провайдера
    портится на глазах у зала.'
  visual:
    pattern: mechanism_node_graph
    figure: n8n-holst-vetka-otkaza.png
    primary: 'Схема: от узла извлечения два выхода — успешный в справочник, таблицу и экран, error в ту
      же таблицу с пометкой и свой экран. Под схемой две настройки. Справа место под снимок карточки настроек
      узла.

      '
    backup: 'Круг 9 (правка владельца 2026-10-15): строка «Предскажите. Сейчас испорчу ключ…» с экрана
      снята — это реплика ведущего перед показом, её место в заметках, а не на слайде. ЭКРАН ДЕМО. Процесс
      на стенде собран и проверен; снимок снят с живого стенда 2026-10-13. Отказ для демонстрации вызывается
      порчей ключа провайдера — мгновенный и воспроизводимый отказ, в отличие от ожидания настоящего таймаута.
      В производстве тот же отказ воспроизведён подменой имени модели: поведение одного класса. ПРОВЕРЕНО
      НА СТЕНДЕ 2026-10-12, прогоны 5 и 6: успешная ветка пишет три столбца; при испорченной модели журнал
      показал ТРИ попытки НА УЗЛЕ МОДЕЛИ, элемент ушёл в выход `error` с исходными данными формы плюс
      полем ошибки, строка «не разобрано» в таблице появилась, а статус прогона — success. Файл — `stend/stage-3.json`.
      СНИМОК С ЖИВОГО СТЕНДА 2026-10-13 стоит рисунком слайда. Принципиальная схема `k3-shema-dve-vetki.png`
      на этом экране уступила ему место: такт «наше решение» — второй слой подачи, инструмент, а схема
      уже была показана в кейсе 1.'
- id: n33
  file: slides/n33-k3-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Повтор нужен на временных отказах идемпотентных операций и не нужен на постоянных и на операциях
    с последствиями; предел — отказ, которому некуда идти
  learning_goal: Критерий кейса 3 плюс закрытие третьей строки оси. Правила надёжности здесь из инженерной
    практики распределённых систем, не из оркестратора.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами. Под ней предел отдельной плашкой, число про умножение
      нагрузки и строка закрытия третьей строки оси.

      '
    backup: Идемпотентность, лавина повторов, разброс задержек, «повторять в одном месте стека» и число
      243 (три попытки на каждом из пяти слоёв) — из инженерной библиотеки Amazon. Сведены прежние два
      экрана кейса 3.
- id: n34
  file: slides/n34-k4-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Значение из справочника, прогон зелёный — и тема при этом неверная; процесс об этом не сообщает
    никому
  learning_goal: 'Дивайдер кейса 4. Называет проблему, не приём (А2): распознано не так.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов, четвёртый подсвечен.

      '
    backup: 'Кейс заменён по решению владельца (2026-10-15): прежний кейс 4 был про публикацию версии;
      публикация свёрнута в один экран после кейса, а на её место встал разбор того, как поднимать качество
      распознавания. Причина — это и есть главный вопрос, который задаёт любой, кто собрал такой процесс,
      и ответ на него требует вернуться к запросу, второй модели и правилам.'
- id: n35
  file: slides/n35-k4-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Заявка про счёт получила тему «курс»: значение законное, прогон зелёный, ошибку видит только
    человек — и отметить её негде'
  learning_goal: 'Сцена кейса 4: показать смысловую ошибку на конкретной заявке и назвать, почему её не
    видит ни один из построенных сторожей.'
  visual:
    pattern: problem_scenario
    primary: 'Врезка с текстом заявки и тем, что записал процесс. Под ней — пронумерованная хронология
      того, как ошибка доходит до человека, и абзац цены.

      '
    backup: 'Заявка взята той же конструкции, что в кейсах 1-2: смешанная формулировка, где тема звучит
      в первом предложении, а дело — во втором. Такие заявки на стенде действительно уходят в «курс»:
      проверено 2026-10-15.'
- id: n36
  file: slides/n36-k4-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Четыре способа поднять качество распознавания — запрос, вторая модель, правила поверх, модель
    помощнее
  learning_goal: 'Вопрос кейса 4 без подсказок: четыре способа повысить качество, все четыре применяются
    в живых системах.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, под ним четыре одинаковые карточки без доводов и без подсветки.

      '
    backup: 'Карточки — четыре способа, которые владелец назвал прямо (2026-10-15): промптинг, усиление
      второй моделью, алгоритмические правила. Четвёртым добавлена более сильная модель — он первым приходит
      в голову и его стоит разобрать, а не обойти. Пятый способ, дообучение на своих данных, в карточки
      не вынесен: он требует размеченной истории, которой у центра нет, и разбирается голосом на следующем
      экране.'
- id: n37
  file: slides/n37-k4-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Запрос даёт больше всего прироста за наименьшие деньги; вторая модель и правила — узкие добавки;
    модель помощнее стоит дороже каждый день
  learning_goal: 'Разбор кейса 4: что даёт каждый способ, чем платим. Поворот — без отметки ошибок ни
    один прирост не измерить.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: способ · что даёт · чем платим. Под ней поворот про измеримость.

      '
    backup: 'Цифры из тех же первоисточников, что в разборе кейса 1 (ссылки в заметках). Прирост от примеров
      в запросе: 0,351 без примеров → 0,406 на двенадцати примерах, лучшая конфигурация 0,475 — macro-F1,
      четырёхклассовая задача разбора обращений, arXiv:2605.15680. Ансамбль из четырёх запросов 0,61 против
      0,57 у одиночного — CEUR Vol-3551 paper 4. Правила как добавка к модели: +2-3 п.п. — arXiv:1808.02636.'
- id: n38
  file: slides/n38-k4-reshenie.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Решение из двух частей: усиленный запрос — описания категорий, примеры заявок и правило
    воздержания; и столбец отметки ошибки, которым человек делает качество измеримым'
  learning_goal: Решение кейса 4. Первая часть — что именно дописывается в запрос; вторая — столбец отметки,
    без которого прирост не проверяется.
  visual:
    pattern: mechanism_node_graph
    primary: 'Четыре врезки: три — что дописывается в запрос, четвёртая — какой столбец добавляется в
      таблицу. Снимка здесь нет намеренно: карточка того же узла уже показана в кейсе 1, а ужатая до трети
      ширины она нечитаема — замерено на снимке круга 9.

      '
    backup: 'Рисунок тот же, что на экране настройки узла в кейсе 1, и это намеренно: правка качества
      живёт В ТОМ ЖЕ поле, которое зал уже видел, — новых узлов не появляется. Столбец отметки заведён
      по прямому указанию владельца (2026-10-15): «надо в таблицу добавить признак ошибки от человека
      для отметки человеком, если модель неправильно проставила».'
- id: n39
  file: slides/n39-k4-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Качество поднимают запросом, пока ошибки разные; второй моделью — когда цена ошибки высока;
    правилами — на узкий повторяющийся случай; предел — улучшение без замера
  learning_goal: 'Критерий кейса 4 плюс закрытие четвёртой строки оси. Форма принятых семинаров: когда
    нужно / когда не нужно + названный предел.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами, под ней предел и строка закрытия четвёртой строки
      оси.

      '
    backup: Критерий написан под новый кейс 4 (качество распознавания), заменивший кейс про публикацию
      — решение владельца 2026-10-15.
- id: n40
  file: slides/n40-publikatsiya.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'Правки сохраняются сами в черновик, а в бой уходят отдельным действием: ручной запуск идёт
    по черновику, боевые прогоны — по опубликованной версии'
  learning_goal: 'Публикация одним экраном: различие черновика и опубликованной версии плюс правило, что
    проверять настоящим событием. Прежде это был целый кейс — свёрнут по решению владельца.'
  visual:
    pattern: mechanism_node_graph
    figure: obzor-k4.png
    primary: 'Полоса верха интерфейса со значком состояния. Под ней три врезки: что сохраняется само,
      что уходит в бой отдельным действием и что из этого следует для проверки.

      '
    backup: 'Свёрнуто из шести экранов в один по решению владельца (2026-10-15): «а вопрос с публикацией
      — одним слайдом». Содержание сохранено целиком: различие черновика и опубликованной версии, расхождение
      ручного и боевого путей, список того, что проверяется только настоящим событием, и предупреждение
      про файл сценария перед передачей. СНИМОК С ЖИВОГО СТЕНДА, полоса состояния процесса.'
- id: n41
  file: slides/n41-os-zakryta.md
  type: keystone_axis
  duration_min: 2.5
  assertion: 'Таблица оси заполнена: четыре пары «выглядит рабочим — чем оказался», и все четыре зал видел
    своими глазами'
  learning_goal: Закрытие оси занятия. Пары стоят рядом; вопрос занятия возвращается залу дословно.
  visual:
    pattern: keystone_axis
    primary: 'Та же таблица, что в начале занятия, теперь с заполненной правой колонкой. Под ней возврат
      вопроса занятия золотой строкой.

      '
    backup: 'Парный экран к оси в начале. Конструкция из принятых Семинаров 4 и 6: ось закрывается заполненной
      таблицей и возвратом вопроса дословно (в Семинаре 6 — закрытие оси и возврат вопроса двумя соседними
      экранами; в Семинаре 4 — то же в финале).'
- id: n42
  file: slides/n42-vyhod.md
  type: outcome_artifact
  duration_min: 2.5
  assertion: С занятия уносится файл процесса из восьми узлов — шесть на успешном пути и два на ветке
    отказа, — который встаёт в свой n8n одним импортом
  learning_goal: 'Выход занятия предъявляется как артефакт: что собрано, из чего, и что с этим делать
    дома. Условие сквозной линии С7→С12.'
  visual:
    pattern: outcome_artifact
    figure: vyhod-shema-protsess.png
    primary: 'Итоговая схема процесса целиком: шесть узлов успешного пути с номерами шагов плюс два на
      ветке отказа. Рядом карточка файла с именем и тремя шагами импорта.

      '
    backup: 'Файл СОБРАН И ПРОВЕРЕН на стенде 2026-10-12 (n8n 2.42.7): все четыре стадии выложены через
      управляющий API, опубликованы и прогнаны настоящими отправками формы; в таблице 10 строк, ни одной
      пустой темы и ни одной вне справочника. Студенческий файл — та же стадия 4 со снятыми привязками
      к учётным данным и таблице этого стенда. Источник — `stend/sborka.py`.'
- id: n43
  file: slides/n43-mostik-k-s8.md
  type: bridge_forward
  duration_min: 2.0
  assertion: 'Процесс пока идёт одной дорогой: все заявки через один шаг; на Семинаре 8 появляются маршруты
    и проверка перед записью'
  learning_goal: Замыкание занятия и постановка следующего. Ступень называется своим именем, без обещания
    «будет интереснее».
  visual:
    pattern: bridge_forward
    primary: 'Схема текущего процесса бледно, поверх неё — развилка пунктиром в месте, где на С8 появится
      ветвление. Снизу три строки про следующее занятие.

      '
    backup: 'Ступень С8 по §6 концепции: ветвление и слияние, проверка результата шага. Не обещать сюда
      ни агентов, ни поиска по документам.'
