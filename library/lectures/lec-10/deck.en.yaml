    assertion: "AppHarvest, Plenty, Bowery: $1.37B+ in losses, 14 bankruptcies in 2025. The controllers worked, CV recognized, ML predicted. What didn't work was the energy arithmetic: LED ≈ 100× free sunlight."
    section: "Р1"
    slide_type: "content"
    layout: "3x3-mini-table"
    timing_min: 2.5
