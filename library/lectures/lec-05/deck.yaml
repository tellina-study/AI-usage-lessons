ai_failure_judgment:
  # AI-Failure & Judgment Content Rule (ENFORCED): ≥30% strict-in по МИНУТАМ (не по слайдам), waiver НЕДОСТУПЕН.
  # 13 solid IN-BUCKET слайдов (кейс+урок+критерий+альтернатива, on-point к своей фазе):
  strict_in_slides: [s12, s13, s13a, s19, s20, s26, s27, s33, s34, s40, s41, s42, s47, s48]
  count: 14   # 13 канонических провалов плана + s13a IBM Watson (доп. Discovery-провал #3, added post-plan per course-curator LO3 sign-off note)
  share_by_minutes: "≈34.5 / ≈92 активных мин ≈ 37.5% (buffer над порогом 30%; honest recount v3 плана: 13 канонических провалов = 31.5 мин / 92 = 34%; +s13a IBM Watson добавляет ещё ~3 мин provisional к Discovery-кластеру, итог указан как диапазон 34-37.5%, точный пересчёт — Phase 7 methodology-critic по факту duration_min слайдов)."
  partial_out: [s01, s02, s03, s04, s06, s07, s08, s09, s10, s11, s14, s15, s16, s17, s18, s21, s22, s23, s24, s25, s28, s29, s30, s31, s32, s35, s36, s37, s38, s39, s43, s44, s45, s46, s49]
  note: >
    s05/s06 — keystone-ось (course-scaffold), НЕ strict-in по Решению #78. Upside-слайды-ограничения
    (s11, s18, s25, s32, s39) — критерий без собственного on-point кейса — partial→out (v1 lesson: не
    padding'овать зачётом граничных). Холистичность: каждый из 6 разделов несёт ≥2 on-point провала —
    Р1: s12/s13/s13a (3) · Р2: s19/s20 (2) · Р3: s26/s27 (2) · Р4: s33/s34 (2) · Р5: s40/s41/s42 (3) ·
    Р6: s47/s48 (2). Single-artifact concentration отсутствует. chapter target ≥40% (per-part word count,
    methodology-critic Phase 3); slides/speech target ≥30% по минутам (Phase 7/10).

