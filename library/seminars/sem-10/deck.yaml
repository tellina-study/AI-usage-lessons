      пронумерованных 1..{N}. Переупорядочи номера кандидатов от самого релевантного вопросу к наименее
      релевантному. Ответь СТРОГО JSON-массивом чисел — перестановкой всех номеров, без пояснений. Пример
      ответа: [3,1,4,2,5,6,7,8,9,10]» — с N=10 (TOP_N узла слияния, n54). Пользовательское сообщение —
      `Вопрос: {question}\n\nКандидаты:\n{нумерованный список текстов}`.

      МОДЕЛЬ НАЗВАНА ПО ИМЕНИ (С5): `openai/gpt-4o-mini` — видно прямо в теле JSON на кадре, без настроек
      вызова помимо обязательных (без явной температуры). ЦЕНА ШАГА, ПОСЧИТАННАЯ (не абстрактный процент):
      ~$0,00033 за вызов — дороже, чем весь keyword/vector-пайплайн поиска и ответа Кейса 1 целиком (~$0,00005)
      — stend/raw/case3-rerank- results.json, n51.

      МОСТ К n57: промт просит модель вернуть СТРОГУЮ перестановку номеров — она не добавляет и не убирает
      кандидатов, только переставляет уже данные десять. Это прямая причина того, почему реранкер физически
      не может поднять документ, которого не было среди top-10 кандидатов до него (нюанс про вопрос с
      вектором на 26-м месте, n57), и почему он иногда переставляет уже верный результат не туда (нюанс
      про вопрос «Пример водных преград?», n57): модель читает только эти десять текстов и решает заново,
      не зная, что один из них уже был прав.'
