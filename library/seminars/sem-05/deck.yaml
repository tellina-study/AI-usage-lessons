      каждое проверено на этом слайде. ПЕРВОЕ: завязка больше не называет условие срабатывания, поэтому
      вводная формула переписана через величины, названные на разборе, — частота и цена одного прогона;
      на снятую с завязки формулировку слайд не опирается. ВТОРОЕ: база n27 снята, поэтому ни слова «матчер»,
      ни слова «таймаут» здесь не требуется — правило сформулировано действиями и шагами. ТРЕТЬЕ: свидетельства
      n30 теперь идут до этого слайда (порядок n28 → n29 → n30 → n31 → n32 → n33), значит пара чисел 27
      мс × 1 против 1 137 мс × 20 к моменту показа уже прозвучала и работает напоминанием, а не первым
      предъявлением. ДОБАВЛЕНА строка «за пределом» — по форме предела второго случая (n24), где за колонками
      стоит то, чем решение заменяют, когда оно перестаёт работать. Прежняя редакция обрывалась на сортировке
      и предела самого правила не называла; это и был её недостроенный такт. Содержание про границы не
      сокращено. ОБОБЩЕНИЕ сохранено с круга 3 (владелец: «надо более обобщённо и для тех, кто слаб в
      гите и программировании»): названия команд оставлены только примером. Числовая пара одна: 27 мс,
