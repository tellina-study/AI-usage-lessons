      На кадре — холст воркфлоу «C8 · Кейс 2 — тест дедупликации (стенд, 4 схемы)», тот самый тестовый
      процесс, на котором измерены числа, уже стоящие в таблице выше (хэш 15/20, TF-IDF 13/20, LLM-судья
      17/20, jev 20/20). Текст на кадре читается буквально, построчно: узел `Test pair (webhook)` (триггер,
      подпись выхода `POST`) ведёт двумя стрелками — к узлу `Jev decision (noul)` (тип `httpRequest`,
      подпись `POST: https://openrouter.ai/...`) и к узлу `LLM judge` (вход `Input 2`, зигзаг-иконка);
      отдельный узел `Judge model` подключён к `LLM judge` пунктирной линией с подписью `Model` (обязательный
