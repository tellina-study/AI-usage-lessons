# Раздел 0 (открытие, s01-s07) + Раздел 1 (файл инструкций, 3 кейса, s08-s26) собраны из
# rework/section-0-otkrytie.md + rework/section-1-fayl-instrukciy.md.
# Раздел 2 (память, 3 кейса, s27-s50) собран из rework/section-2-pamyat.md + part2 + part3.
# Раздел 3 (закрытие, s51-s53) собран из rework/section-3-zakrytie.md.
# Слайды старых ступеней 3-7 (хук/скилл/MCP/субагент/процесс, старые s25-s72) перенесены в
# library/seminars/sem-05/slides/ — сырьё для отдельного производственного цикла Семинара 5,
# без доработки в этом раунде (REWORK-REQUIREMENTS-v4.md R4-3).
#
# review-раунд (2026-09-22): четырёхсторонний ревью (methodology-critic APPROVE-WITH-POLISH,
# presentation-critic APPROVE-WITH-POLISH, student-simulator, reader-simulator APPROVE-CLEAN)
# дал 5 независимых P1-находок — по правилу проекта REVISE-раунд перед показом. Применены
# Fix 1-7: (1) кейс 2.1 получил отдельные слайды проблема+исследование (было склеено с
# вопросом, единственный кейс без исследования между проблемой и вопросом); (2) термин
# "presence paradox" определён на s11 (использовался на s19/s25/s29 без определения);
# (3) s53 (было s49) визуально переработан — больше не дублирует таблицу s51 (было s47);
# (4) кейсы 2.2/2.3 получили собственные divider-слайды (s37, s44), как у остальных 4 кейсов;
# (5) исправлены три overclaim (s52 "семь позиций" → "пять слотов", s01 "окончательно — в
# конце занятия" → смягчено, формула "просьбы/законы" в кейсе 1.2 сделана безусловной);
# (6) закрыты TODO learning_outcomes/failure_share; (7) companion-документы (handout/rubric/
# plan/facilitator-guide) помечены как устаревшие (v3, требуют отдельной пересборки под v4).
# Слайдов было 49, стало 53 (+2 Fix 1, +2 Fix 4). Детали — rework/*.md §Fix N +
