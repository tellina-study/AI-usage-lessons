- id: n36
  file: slides/n36-granitsa-chistyy-kontekst-ne-ot-vsego-podryad.md
  type: criteria_boundary
  duration_min: 0.75
  assertion: Контекст субагента по умолчанию наследует описания всех подключённых серверов вызвавшей сессии
    целиком, даже тех, что для его задачи не нужны ни одним инструментом — фокус работает для содержимого
