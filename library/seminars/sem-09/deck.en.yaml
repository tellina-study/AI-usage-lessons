      sentence about the ceiling, and the notes'' last paragraph was rewritten with a third point.

      THE NUMBERS ARE A MANUAL CHECK, NOT AN AUTOMATIC GRADER. On both scenarios, the automatic grader
      (`grade_q1`/`grade_q2`, taken unchanged from the single-technique measurements) disagreed with a
      line-by-line reading of every answer: scenario 1 gave 9 out of 10 by the grader against 10 out of
      10 by reading (execution 1816 — the grader caught the word "manager" inside "and not through the
      manager," missing the negation in front of it); scenario 2 gave 4 out of 10 by the grader against
      5 out of 10 by reading (executions 1819, 1821, 1822 — the grader failed to recognize an unfamiliar
      phrasing of the caveat). ORCHESTRATOR''S DECISION: only the numbers AFTER the manual check go on
      the frame and into the notes — these are the measurement''s own numbers, not the method used to
      count them. The grader''s disagreement with the reading is a finding about the reliability of our
      own script (canon §8.6, the same finding for the third time in this measurement folder), not about
      the model''s behavior on the client''s question; the student doesn''t need it for the case''s conclusion,
      and it doesn''t go on the frame — its place is here, in the backup, and in the measurement''s own
      README, for traceability.

      WHY SCENARIO 1''S NUMBER IS 10 OUT OF 10, NOT 9: on this question, description is already at the
      ceiling (ten out of ten without few-shot, n60). Adding few-shot on top of a ceiling can''t physically
      push it higher — telling "doesn''t hurt" apart from "can''t possibly hurt" is impossible on this
      question, and the frame says so directly.

      WHY THE "6 VS. 5" DIFFERENCE ON SCENARIO 2 ISN''T CALLED A REGRESSION: one answer out of a sample
      of ten is one different binary run of the model; at n=10, a difference like this can''t be told
      apart from ordinary run-to-run spread without re-measuring description alone in the same session
      (which wasn''t in budget — 20 of the 25 allowed calls were already used). What''s firmly proven
      is only that the combination is no better than description alone; calling it "few-shot hurts" on
      this data would be a stretch.'
