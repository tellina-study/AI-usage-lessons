- id: n08
  file: slides-en/n08-gde-chto-stoit-agent-server-sistema.md
  type: mechanics_map
  duration_min: 1.25
  assertion: 'The agent runs on the user''s machine; the server stands either on that same machine or
    at somebody else''s — and the agent asks it the same way either way. It is the server that goes out
    to the external system, and it talks to that system in the system''s own language: REST, gRPC, GraphQL,
    SQL'
  learning_goal: 'An introductory diagram ahead of the one-pager: it gives the picture in space — where
    the agent stands, where the server may stand, where the machine''s boundary runs and where the request
    goes. The breakdown of the mechanics piece by piece comes next; here — only the placement and one
    conclusion: MCP is one and the same for the agent, and outward the server talks in the system''s language'
  visual:
    pattern: mechanics_with_figure
    figure: mcp-n08-gde-chto-stoit.png
    primary: 'A diagram filling the slide. On the left a frame "YOUR MACHINE" — the agent is in it, and
