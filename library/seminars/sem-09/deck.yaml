- id: n15
  file: slides/n15-k1-nastroyka-geyta.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящая панель проверки: условие целиком помещается в одну строку и спрашивает ровно одно
    — есть ли названный пункт в списке существующих'
  learning_goal: 'Слой 2 для версии 2, вторая половина: настоящий снимок панели условия, где выражение
    читается дословно. Зал читает проверку своими глазами и видит, о чём она НЕ спрашивает, — до того,
    как увидит результат прогона.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-geyt-v2.png
    primary: 'Настоящий снимок панели узла `Grounded in known KB item?`: раздел `Conditions`, слева выражение
      со списком `kb1`…`kb10` и вызовом `.includes(...)`, посередине `is equal to`, справа `true`. Выражение
      на кадре видно целиком, в три строки.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case1-v2-check-panel.png`, снят `stend/n8n_shots.py`.
      Выражение на кадре читается дословно и совпадает с `stend/sborka.py`, функция `case1_v2`, узел `c1_grounded_if`
      — прозой рядом ничего не досказано, слайд показывает то же, что показывает снимок.

      Это тот слайд кейса, который делает находку n16 предсказуемой ДО её показа: зал читает условие сам
      и может сказать, о чём оно не спрашивает. Поэтому разбор того, что условие проверяет и чего не проверяет,
      стоит здесь, а измеренные последствия — экраном дальше. Чисел прогона на этом экране нет сознательно.

      Русское предложение стоит раньше выражения (§7 канона замысла кейса): первая строка видимого слоя
      называет, что делает узел, и только потом идёт латиница.

      `kb1`…`kb10` — настоящие имена пунктов справочника на стенде, не условные обозначения для слайда;
      расшифровка всех десяти — в такте сцены (n06).'
- id: n16
  file: slides/n16-k1-rezultat-geyt.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: 'Проверка убрала уверенную ложь и принесла два новых исхода: 4 ответа из 15 прошли её с неверным
    содержанием, 2 из 15 оборвались до любого ответа'
  learning_goal: 'Вторая половина поворота кейса: решение стало проверяемым, и у этого есть названная
    цена. Числа — обе стороны сразу, выигрыш и плата, без вердикта «версия 2 лучше».'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица сравнения двух версий на одних и тех же пятнадцати вопросах — строка «хороший исход»,
      строка «уверенный неверный ответ», строка «прошло проверку с неверным содержанием», строка «оборвалось
      до ответа». Под таблицей — один разбор дословной цитатой и плашка про класс отказа, которого у свободного
      текста нет.

      '
    backup: 'Числа — из `stend/zamery-k1-k3/README.md`, Замер 1, сводная таблица: хороший исход 9 из 15
      у обеих версий; уверенный неверный ответ — 6 из 15 у версии 1 и не бывает у версии 2 по устройству;
      прошло проверку с неверным содержанием — 4 из 15 (вопросы Q6, Q9, Q12, Q15); оборвалось до проверки
      — 2 из 15 (Q8, Q10, вывод не уложился в заданную схему, выполнение завершилось ошибкой до узла проверки).
      Прогоны 620–648 (чётные).

      Разбор — находка В протокола, вопрос Q12 про перевод на более дешёвый курс: верный пункт — про перевод
      на другой курс, где сказано только «пересчитывается администратором индивидуально»; модель сослалась
      на пункт про возврат денег — существующий пункт, но не тот, и условие этого не заметило, потому
      что имя пункта настоящее.

      Числа 4 из 15 и 2 из 15 разведены подписями («прошло проверку» против «не дошло до проверки») —
      запрет на два похожих числа в одной фразе (БРИФ §2).

      Номера прогонов на видимом слое не стоят.

      Вердикта «версия 2 лучше» на слайде нет сознательно: обе цены названы, критерий — такт n17.'
- id: n17
  file: slides/n17-k1-obobshchenie-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.5
  assertion: Решение «отвечать или передать» выносится в отдельное поле тогда, когда ответ уходит человеку
    без второго чтения; проверяемость решения — не то же самое, что его правильность
  learning_goal: 'Обобщение и граница Кейса 1 прямой формой (А7): «когда нужно · когда не нужно», с названным
    пределом самого приёма и с документированным случаем, где та же ошибка стоила иначе. Первая строка
    оси занятия закрывается здесь.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Критерий отдельной плашкой наверху, под ним таблица в два столбца «когда нужно · когда не
      нужно» — строго под противопоставление, — затем плашка предела приёма, плашка документированного
      случая с парой «было → стало» одним блоком, и строка закрытия первой строки оси занятия.

      '
    backup: 'Критерий — по SETKA-KEYSOV-S9.md, раздел «Кейс 1», подраздел «Обобщение», переносимая формулировка
      без имени инструмента.

      Обе колонки таблицы опираются на СОБСТВЕННОЕ измеренное: 2 обрыва из 15 у строгого вывода и 0 из
      5 перефразировок у точного совпадения на прошлом занятии.

      ВНЕШНИЙ СЛУЧАЙ ВОЗВРАЩЁН НА КАДР решением оркестратора по ходу волны. Первая редакция этого слайда
      его не несла — по указанию, которое оркестратор затем отменил как свою же ошибку: отклонён владельцем
      был Air Canada (2026-10-24, «уже несколько раз был этот пример»), и открытый пробел остаётся только
      для случая из ИНЖЕНЕРНОЙ практики. Границу Кейса 1 держит Obermeyer и соавторы, 2019 (`10.1126/science.aax2342`),
      как и назначено ARCHITECTURE.md §6 и тактом «Нюансы» сетки, пункт 3.

      Числа взяты из раздела «Доснято оркестратором 2026-10-24» в конце CHISLA-SVERENO.md, где все шесть
      утверждений имеют статус СВЕРЕНО по прочитанному целиком первоисточнику (PDF, 9 страниц). Пометки
      «по вторичному пересказу» на слайде НЕТ и быть не должно: строка 30 таблицы того же файла, которая
      её требовала, отменена 2026-10-24 и сама отсылает к этому разделу.

      На кадр взято ровно то, что несёт такт: что предсказывали вместо чего, пара «было → стало» одним
      блоком (48 772 → 7 758, это и есть 84%), и несущая строка — правка не меняла ни модель, ни обучение,
      ни признаки, ни выборку. Остальное из пункта 3 сетки (26,3% при равном балле, 4,8 против 3,8 заболеваний,
      воспроизведение производителем на 3 695 943 пациентах) сознательно НЕ вынесено: четыре числа на
      закрывающем кадре перестают читаться, а 4,8 против 3,8 — ровно та пара похожих чисел в одной фразе,
      которую запрещает БРИФ §2. Эти подробности живут в заметках ведущего и в сетке.

      Масштаб ставки назван нашим собственным числом — «двадцать заявок в день» из сцены n06, а не «сорок»
      из пункта 3 сетки: сцена занятия говорит двадцать, и кадр обязан сходиться с ней, а не с черновиком.
      Расхождение вынесено оркестратору отчётом.

      ОТКРЫТЫЙ ПУНКТ, здесь не закрытый молча: документированного случая из ИНЖЕНЕРНОЙ практики под эту
      границу по-прежнему нет — Air Canada отклонён, замены не подобрано, выдумывать запрещено (§4.3 канона).

      Предел приёма назван прямой строкой, а не оговоркой в конце: поле делает решение проверяемым, но
      не делает его верным — это ровно то, что измерено на n16 (4 из 15 прошли проверку с неверным содержанием).'
- id: n18
  file: slides/n18-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Справочник уходит в модель целиком при каждом обращении, и чем больше он становится, тем
    больше уходит
  learning_goal: 'Дивайдер Кейса 2. Форма текста — ЦИФРА (БРИФ §4a: у каждого кейса занятия своя форма
    дивайдера, П3). Цифра здесь — постановка (сколько уходит в модель), не итог замера: итога у этого
    кейса и нет.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, пара чисел крупно одной плашкой — вопрос клиента против справочника, который
      уходит вместе с ним. Внизу дорожка шести кейсов занятия, второй подсвечен.

      '
    backup: 'Форма «цифра» назначена этому дивайдеру БРИФ-ПРОИЗВОДСТВО §4a: формы «сцена», «вопрос», «цитата»,
      «противопоставление» и «ставка» отданы остальным пяти кейсам, чтобы шесть дивайдеров подряд не читались
      одной грамматикой (болезнь §4.1 №7, правило П3).

      ОТКУДА ЧИСЛА. Оба посчитаны по настоящему тексту промта на стенде — `stend/sborka.py`, функция `kb_text`
      и список `KB_ITEMS`. Справочник как он стоит в промте (строка «База знаний учебного центра:» плюс
      десять пунктов полным текстом) — 223 слова, 1705 знаков. Вопрос в плашке — настоящий вопрос первого
      прогона (`stend/README.md`, `IN_KB_QUESTIONS`), шесть слов. Счёт слов — тем же счётчиком, которым
      меряются заметки деки (`tools/seminar-build/notes_budget.py`, функция `words`), чтобы число было
      воспроизводимым, а не на глаз.

      Это НЕ измерение поведения модели: ни одного прогона за этими числами не стоит, они описывают размер
      того, что уходит в модель. Собственного замера у Кейса 2 нет вовсе — единственный такой из шести
      (ARCHITECTURE.md §7), и дивайдер поэтому не может выдать итога, даже если бы хотел.

      Что сознательно НЕ показано: ни слова про порядок пунктов, про кэш и про то, что из этого выйдет.
      Дивайдер называет проблему (А2) — размер того, что едет в модель каждый раз, — и останавливается.

      Название кейса — «База знаний в промте», по предмету, как в дорожке кейсов `rendered/deck-config.yaml`
      (`case_track`).'
- id: n19
  file: slides/n19-k2-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга дописывает в справочник новые темы по следам вопросов, на которые процесс не ответил,
    и каждый дописанный пункт едет к модели вместе со всеми остальными
  learning_goal: 'Такт сцены Кейса 2: живая постановка потребности Ольги — что она делает со справочником,
    зачем и чем за это платит центр. Без версии решения и без внешних чисел: это постановка, а не разбор.'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой (справочник после месяца работы процесса), под ней пронумерованная
      хронология того, как справочник растёт, закрывающая плашка про цену и реплика-просьба Ольги. Ни
      одного числа прогона на кадре нет — их у этого разбора и не будет.

      '
    backup: 'Потребность — из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подразделы «Форма входа» и «Постановка»:
      Ольга пополняет справочник (программа лояльности, скидка за друга, демо-занятие), новый пункт дописывается
      в конец текущего списка, порядок попадания пунктов в промт никого не беспокоит.

      Три новые темы названы ровно те, что в сетке, и они же — три вопроса вне базы из первого прогона
      Кейса 1 (`stend/sborka.py`, `OUT_OF_KB_QUESTIONS`). Шов внутри занятия получается без натяжки: зал
      эти три вопроса уже видел на экране разбора «Отвечать или промолчать».

      Персонаж — Ольга, администратор учебного центра (А13), и тот же объём работы, что в сцене Кейса
      1 (`n06-k1-stsena.md`): двадцать заявок в день.

      ЧЕГО ЗДЕСЬ СОЗНАТЕЛЬНО НЕТ. Сетка в «Форме входа» говорит сильнее: «база выросла, и ответы стали
      хуже на том, что в ней ЕСТЬ». Этого утверждения на кадре нет, и вот почему: ровно эта проверка на
      наших коротких пунктах спроектирована и НЕ прогнана (`[ЗАМЕР НЕ ГОТОВ]`, такт «нюансы» сетки, пункт
      3). Утверждать её в сцене — значит выдать внешнее измерение за наш опыт. Сцена поэтому ставит задачу
      («справочник растёт, порядок никто не выбирает») и называет цену, а то, что про расположение измерено,
      приходит разбором — внешней работой и с названным именем.

      Вынесено оркестратору отчётом как расхождение с сеткой: смягчение формы входа, не отказ от неё.'
- id: n20
  file: slides/n20-k2-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре способа расположить растущий справочник — от «не думать об этом вовсе» до «не держать
    его в промте»
  learning_goal: 'Вопрос Кейса 2: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор, то есть действие, которое можно совершить со справочником, а
    не факт о свойствах модели (§5 канона замысла кейса).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      слева «порядок не выбирается вовсе», справа «справочника в промте нет». Пояснений, доводов против
      и пометок на карточках нет — разбор следующим экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Вопрос»; формулировки
      не переписаны.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не перечисляет состав собираемого решения, нигде не сказано, сколько
      вариантов разумных. Внешние измерения (середина списка, кэш) на этом экране не стоят вовсе — им
      место в тактах n21, n25 и n26.

      Отдельная проверка на четвёртой карточке: слова «следующее занятие», «отдельное хранилище» и имени
      приёма на ней НЕТ. Назвать её завтрашней темой значит пометить её как заведомо правильную и снять
      с голосования — это тот же вред, что вердикт на карточке, только вежливее одетый. Чем она является
      для дуги, говорит такт границы (n28).

      Проверка на рамку факта (§5 канона замысла кейса): в каждую карточку подставляется повелительный
      глагол — «дописывать», «переносить», «повторять», «искать». Ни одна не превращается при этом в утверждение
      о свойстве модели («модель хуже читает середину») — все четыре остались действиями со справочником.

      Порядок карточек — спектр, а не вразнобой: первая не выбирает порядок вовсе, вторая делает порядок
      решением, третья пытается обойти вопрос порядка повтором, четвёртая убирает справочник из промта.'
- id: n21
  file: slides/n21-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Три из четырёх способов оставляют справочник внутри промта — и тогда расположение пункта
    в списке остаётся свойством процесса, выбранным или доставшимся по истории
  learning_goal: 'Разбор сразу за вопросом (А1), 4-колоночная форма «действие · как делает · преимущество
    · недостатки» (А5, голосовая правка владельца 2026-10-20, issue #274). Без вердиктов «верно/неверно».
    Внешние измерения названы по имени работы — собственного прогона у этого разбора нет.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Четыре строки, колонки вердикта
      нет — решение следующим экраном. Несущая пара чисел в первой строке набрана плашкой, чтобы читалась
      одним блоком, а не выискивалась внутри ячейки.

      '
    backup: 'Текст разбора сведён из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Разбор», и уложен
      в 4-колоночную форму без переписывания по сути.

      ЧИСЛА И ИХ ИСТОЧНИК. Единственная пара чисел на кадре — 56,1% закрытой книги и разброс больше 20
      процентных пунктов по положению документа — CHISLA-SVERENO.md, строка 42 (Liu и соавторы, arXiv:2307.03172,
      статус «сверено ранее оркестратором», на слайд «как есть»). База к числу названа прямо в той же
      ячейке: 56,1% — это ответы той же модели, когда ей не дают НИ ОДНОГО документа, и именно с этим
      сравнивается документ, положенный в середину. Из `research/*` не взято ничего (БРИФ §2).

      Третья строка (повтор вопроса вокруг списка) оставлена БЕЗ чисел сознательно: оба наблюдения — из
      той же работы Liu и соавторов, но отдельной строки в CHISLA-SVERENO.md под них нет, потому что сверка
      шла по числам, а эти два утверждения качественные. Ставить их с цифрой значило бы занести несверенное
      число на кадр. Вынесено оркестратору отчётом.

      СОБСТВЕННОГО ПРОГОНА ЗА ЭТОЙ ТАБЛИЦЕЙ НЕТ, и ни одна ячейка не притворяется нашим опытом: везде,
      где стоит измерение, названо имя работы. Это единственный разбор занятия в таком положении (ARCHITECTURE.md
      §7).

      Четвёртая строка НЕ названа «следующим занятием» и не помечена как правильная: на разборе она разбирается
      наравне с тремя остальными — по тому, что даёт и чего стоит сегодняшним инструментом. Чем она является
      для дуги, говорит такт границы (n28).'
- id: n22
  file: slides/n22-k2-reshenie-sloy1.md
  type: mechanism_node_graph
