      две развилки зеркальной формы («да» всегда направо, выход из круга; «нет» всегда к следующему шагу).
      Текст ниже СОКРАЩЁН: то, что теперь видно на самой схеме (прямой ход, ветвь «не сошлось», потолок),
      текстом не пересказывается — двойная подача той же мысли съедала место, которого фигуре и так не
      хватало (СХЕМА ЗАЖАТА, 42% площади до правки).

      Имён узлов, имени оркестратора и латиницы на схеме нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящий холст и настоящая панель — экранами
      дальше, n34 и n35.

      Про «якоря» из сетки. Сетка описывает узел, накапливающий уже подтверждённые проверки между попытками.
      На стенде это сделано проще и строже: проверяющий на каждой попытке считает ВСЕ пять требований
      заново, поэтому переделка не может починить одно и сломать другое незаметно. Схема говорит именно
      это — отдельного узла-накопителя на кадре нет, потому что его нет и на стенде.

      НАХОДКА, ВЫНЕСЕНА ОРКЕСТРАТОРУ ОТЧЁТОМ, а не поправлена молча: фигура `k3-shema-tsikl.png` уже несёт
      в нижней плашке измеренное число («точного совпадения подстроки не хватило, чтобы узнать верный
      по смыслу ответ в другом падеже — 1 случай из 6»). Это результат такта n37 и оговорка такта n42,
      и на такте решения он стоит раньше, чем измерение предъявлено. В видимом тексте этого слайда числа
      нет; снимать его из уже нарисованной фигуры — решение оркестратора, не автора слайда (фигуры в зону
      этой сессии не входят).'
- id: n34
  file: slides/n34-k3-n8n-tsikl.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящий холст круга: развилка после проверки, возврат по низу кадра и две разные концовки
    — «ok» и «не сошлось»'
  learning_goal: 'Слой 2 Кейса 3, первая половина (§2 канона замысла кейса): настоящий снимок живого стенда
    с настоящими именами узлов. На кадре видно то, чего не было на холсте Кейса 1, — путь назад.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-holst-tsikl.png
    primary: 'Настоящий снимок холста n8n живого стенда. Главный ряд слева направо: `Client question`
      → `Pick KB item` → `Generate answer` → `Code check` → `Retry or finish?`; снизу к узлу ответа подвешен
      `Model (generate)`, под узлом видна пометка `Model*`. Справа — вторая развилка `Converged?` и две
      концовки. Снизу — `Prepare retry` и длинная стрелка возврата вдоль нижнего края кадра.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case3-cycle-code-canvas.png`, снят `stend/n8n_shots.py`
      на живом стенде. Стилизованной карточки вместо снимка здесь нет (БРИФ §5).

      Что на кадре видно буквально и о чём поэтому можно говорить: семь узлов главного пути, подвешенный
      снизу узел модели, пометка `Model*`, две развилки с подписями выходов `true` и `false`, два разных
      экрана-финала (`Result screen (ok)` и `Result screen (не сошлось)`) и стрелка, которая от `Prepare
      retry` уходит вправо, вниз и затем влево вдоль всего нижнего края кадра обратно ко входу `Pick KB
      item`.

      Что на кадре НЕ видно и поэтому прозой рядом не утверждается: ни текст промта генератора, ни код
      проверяющего, ни счётчик попыток. Холст показывает карточки узлов, а не их открытые настройки. Панель
      проверяющего — отдельным экраном (n35), со своим снимком.

      Имя сценария в хлебной крошке в кроп не берётся; id сценария и id прогонов на кадре не видны нигде
      (канон §3). Слово «замер» из имени сценария на видимый слой не выносится (БРИФ §3).'
- id: n35
  file: slides/n35-k3-nastroyka-proveryayushchego.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящая панель проверяющего: семнадцать строк кода, в которых пять требований записаны
    буквально и каждое возвращает свою причину отказа'
  learning_goal: 'Слой 2 Кейса 3, вторая половина: настоящий снимок панели настройки. Видно, что критерий
    — это текст, который можно прочитать целиком, и что отказ приходит с причиной, написанной заранее,
    а не сочинённой в момент проверки.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-panel-proveryayushchego.png
    primary: 'Настоящий снимок редактора кода узла проверки — восемнадцать пронумерованных строк, видимых
      целиком, обрезанных ТЕСНО вокруг блока кода (без вкладок/полей Mode-Language/подсказки интерфейса
      — они названы словами на кадре, не повторяют собой скриншот).

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case3-code-check-panel.png`, снят `stend/n8n_shots.py`
      на живом стенде, затем ТЕСНО обрезан вокруг самого блока кода — `crop_k3_panel_tight.py` (issue
      #303: исходный кадр с вкладками/полями/подсказкой рисовался на 4% своей площади, слишком высокий
      для своей ширины). Обрезка — не пересъёмка и не стилизация: те же пиксели настоящего снимка, без
      добавленных и без изменённых. Код в кадре читается построчно и совпадает с `stend/zamery-k1-k3/sborka_zamer3.py`.

      ИМЯ УЗЛА, РЕЖИМ И ЯЗЫК В КАДР НЕ ПОПАЛИ (обрезаны вместе с вкладками): названы словами на самом
      слайде — `Code check` (имя прочитано с холста n34, где оно видно), `Run Once for Each Item`, `JavaScript`.
      Это не домысел, а перенос уже предъявленного факта из текста кадра, а не с картинки.

      Что на кадре видно буквально: восемнадцать строк кода целиком. Пять требований видны как шесть проверок
      — «целиком на русском» распадается на две строки, отдельно латиница и отдельно иероглифы.

      Что прозой рядом НЕ утверждается: ничего про промт судьи-модели. Его панель — отдельный кадр n35a,
      настоящий снимок (БРИФ §3).

      Строка `const ok = reasons.length === 0` названа отдельно: это и есть всё правило приёмки целиком
      — список причин пуст, значит ответ годен.'
- id: n35a
  file: slides/n35a-k3-nastroyka-sudi.md
  type: mechanism_node_graph
  duration_min: 0.5
  assertion: Та же модель, что у генератора, с теми же пятью требованиями в тексте промта — только вердикт
    она не пишет кодом, а сочиняет
  learning_goal: 'Слой 2 Кейса 3, недостающая пара к n34/n35: настоящий снимок панели узла-судьи (К3-12/13,
    правка владельца 2026-10-29 — «если мы тут проверяем судьёй, не хватает схемы с моделькой судьёй»).
    Имя модели и настройки — явно (С5), рядом с кодовым проверяющим, не вместо него.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-panel-sudi.png
    primary: 'Настоящий снимок панели узла-судьи `Judge verdict`: поле `Text` с промтом (пункт базы +
      вопрос клиента), `Schema Type` — `Define using JSON Schema`, и сама JSON-схема вывода — `ok` (boolean)
      и `reason` (string), оба обязательны.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case3-judge-panel.png`, снят `stend/n8n_shots.py`
      на живом стенде (запасной кадр, ранее не использовался на деке — взят в работу этой правкой), тесно
      обрезан вокруг содержательных полей тем же методом, что n35 (убраны вкладки `Parameters/Settings`,
      кнопка `Execute step`, раздел `Options` снизу — в нём `No properties`, содержания нет).

      МОДЕЛЬ НАЗВАНА ЯВНО (С5), СЛОВАМИ НА КАДРЕ, А НЕ НА СКРИНЕ: узел `Judge verdict` — тип `informationExtractor`,
      подключённая языковая модель — `qwen/qwen-2.5-7b-instruct` через тот же credential `OpenRouter account`,
      что у генератора (`sborka_zamer3.py`, узел `lmChatOpenRouter`). Настройки модели — `options: {}`,
      то есть БЕЗ переопределения температуры: используется умолчание провайдера, то же самое, что и у
      генератора и у кода (единственное отличие между ветками — какой узел выносит вердикт, не настройка
      модели).

      ЧЕГО НА КАДРЕ НЕ ВИДНО И ПОЭТОМУ ПРОЗОЙ НЕ УТВЕРЖДАЕТСЯ: сам текст промта обрезан по ширине (`Вопрос
      клиента: {{ ... }}` продолжается за кадром) — полный текст совпадает с `judge_criteria_text()` в
      `sborka_zamer3.py`, не домысливается по обрывку. Пять требований в промте — та же формулировка слово
      в слово, что в коде `Code check` (n35); тождество формулировок — предпосылка всего сравнения кода
      и судьи на тактах n36-n41, а не этого кадра.

      Текста под фигурой НЕТ СОЗНАТЕЛЬНО (как на n35): у этого скриншота тоже портретный кадр (806×1320),
      и любой конкурирующий текстовый блок забирает высоту, которой и так не хватает. Всё содержательное
      — в заметках.'
- id: n36
  file: slides/n36-k3-eksperiment-metodologiya.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: Код и судья получили одну и ту же формулировку пяти требований и один и тот же текст ответа
    — 36 вызовов на живом стенде, четыре сборки
  learning_goal: 'Такт методологии: что именно мерили, на чём и сколько. Без этого экрана числа следующего
    такта не значат ничего — и честно назван предел замера: вариант с судьёй в цикле прогнан на четырёх
    вопросах из шести.'
  visual:
    pattern: mechanism_node_graph
    primary: 'Четыре врезки подряд: зачем мерить · что считается годным ответом · какие четыре сборки
      прогнаны и сколько вызовов каждая · где у замера предел. Снимка на кадре нет: холст и панель уже
      показаны двумя экранами раньше.

      '
    backup: 'Всё содержание — из `stend/zamery-k1-k3/README.md`, Замер 2: пять требований дословно из
      раздела «Задача», шесть вопросов по шести пунктам справочника, четыре сборки и число вызовов каждой
      из таблицы «Фактическое число вызовов» (6 + 8 + 16 + 6 = 36).

      Сборка `judge-check` названа отдельной врезкой, потому что она и есть несущая часть замысла: она
      даёт коду и судье ОДИН И ТОТ ЖЕ готовый текст. Без неё сравнение было бы сравнением двух разных
      выборок ответов, и находка n37 не читалась бы как расхождение проверяющих.

      ПРЕДЕЛ ЗАМЕРА НАЗВАН НА КАДРЕ, а не спрятан в заметки: вариант с судьёй внутри цикла прогнан на
      четырёх вопросах из шести — остановлено по бюджету вызовов, а не потому, что находка перестала подтверждаться
      (протокол, раздел «Замер 2, вариант judge, прогнан не полностью»).

      Имя модели (`qwen/qwen-2.5-7b-instruct`) на кадре названо как «одна и та же модель во всех четырёх
      сборках»: для довода важно именно это тождество, а не марка. Id сценариев, адреса вебхуков и номера
      прогонов на видимый слой не идут (БРИФ §2).

      Слово «замер» из имени сценариев на стенде на кадр не вынесено: на слайде это процесс кейса, а не
      измерительная оснастка (БРИФ §3).'
- id: n37
  file: slides/n37-k3-eksperiment-rezultat.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: На 20 ответах, которые код принял как подходящие, судья отверг 19 — и каждая из 19 причин
    отказа опровергается самим текстом ответа
  learning_goal: 'Обновлено 2026-10-27 — полный замер 20×3 вместо исходных 6. Поворот кейса (П1): заказывали
    «как часто судья мягче кода», и это по-прежнему не измерено в чистом виде на новой выборке (код не
    отверг НИ ОДНОГО из 20 первых ответов) — но встречное направление подтвердилось и усилилось: было
    5 ложных отказов из 5 измеримых, стало 19 из 20.'
  visual:
    pattern: measured_outcome_table
    primary: 'Плашка с несущим числом «19 из 20» и пояснением, что обратная половина сравнения в этой
      выборке не измерена. Под ней — таблица из 7 представительных строк (полные 20 — в протоколе): длина
      ответа, вердикт судьи, причина и почему она ложная. Внизу — дословная цитата одного ответа с вердиктом
      и новый класс ошибки (легитимное число названо нарушением).

      '
    backup: 'Числа — `stend/zamery-k1-k3/README.md`, § «Замер 4 — Кейс 3, полный замер 20×3», подраздел
      «Расширение judge-check на 20 вопросов». Источник — `raw/zamer3-judgecheck-20.json`, execution 1034–1053,
      переиспользует первые ответы кода из `raw/zamer3-full-20.json` (не новая генерация).

      ПОЧЕМУ «0 ИЗ 6» ПРЕЖНЕЙ ВЕРСИИ НЕ ПОВТОРЕНО БУКВАЛЬНО: на прежней выборке код отверг 1 ответ из
      6 (kb5, падёж), и это давало измеримое «судья одобрил то, что код забраковал» (= 0). На новой выборке
      код принял ВСЕ 20 первых ответов на первой попытке — отвергнутых кодом текстов для сравнения нет.
      Это не недостаток измерения — это честный побочный эффект того, что код в этом прогоне ни разу не
      ошибся, и скрывать это было бы хуже, чем назвать прямо.

      ПОЛНАЯ ТАБЛИЦА ВСЕХ 20 — в README; на кадре 7 строк: 3 повторяющихся класса ложной причины (длина/деталь/номер
      правила) + новый класс (легитимное число названо нарушением) + единственное согласие.

      НОВЫЙ КЛАСС ОШИБКИ (не было на выборке 6): «ответ содержит число 18» — судья отверг легитимное число
      ИЗ ТЕЛА БАЗЫ (kb3, совершеннолетие) как «число не из базы», хотя код (той же проверкой списка разрешённых
      чисел) правильно его пропустил.

      Номера прогонов на видимом слое не стоят (БРИФ §2) — они в протоколе.'
- id: n38
  file: slides/n38-k3-sudya-ne-soglasen-s-soboy.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: На полном замере 20×3 судья получил ПОБАЙТОВО ИДЕНТИЧНЫЙ текст дважды подряд и вынес два
    разных вердикта — отказ, затем одобрение, без единого изменённого символа
  learning_goal: 'Несущий кадр кейса, теперь на более сильном примере из полного замера 20×3 (было: похожий,
    но не идентичный текст на 3 вопросах). Ложный отказ (n37) ещё можно списать на строгость проверяющего;
    здесь проверяющий расходится сам с собой на ТОМ ЖЕ САМОМ тексте — это снимает саму возможность на
    него опереться.'
  visual:
    pattern: measured_outcome_table
    primary: 'Две ступени одна под другой — попытка, дословный текст, вердикт и причина — набранные так,
      чтобы читалось: текст между ступенями НЕ МЕНЯЛСЯ ВООБЩЕ. Ниже — вторая, подтверждающая пара (сертификат,
      из прежней версии кадра, с минимальным изменением словосочетания) и плашка цены.

      '
    backup: 'Главный пример — `raw/zamer3-full-20.json`, `variants.judge`, вопрос «Можно написать в общий
      чат...» (kb10), execution в диапазоне 989–1008 (см. README § «Замер 4»). Оба текста ответа побайтово
      совпадают (173 знака) — сверено прямым сравнением строк, не на глаз.

      ПОЧЕМУ ЭТОТ ПРИМЕР СИЛЬНЕЕ ПРЕЖНЕГО (сертификат, 169/172 знака, одно изменённое словосочетание):
      там можно было бы (ошибочно) предположить, что судья отреагировал на разницу между «окончания курса»
      и «последнего занятия». Здесь разницы НЕТ ВООБЩЕ — тот же вызов модели вернул тот же текст, и тот
      же вызов судьи на том же тексте вернул другой вердикт. Единственная переменная — случайность самого
      судьи.

      ВТОРОЙ ПРИМЕР (сертификат) оставлен как ПОДТВЕРЖДЕНИЕ, не как замена: тот же вопрос, что был на
      прежней версии кадра, тот же паттерн ложной причины («не упоминает деталь», хотя деталь дословно
      в тексте) и то же почти неизменное словосочетание между попытками. Находка n38 — не случайность
      одного прогона, она воспроизведена на новой, более широкой выборке.

      Цена названа числами этого же прогона: на вопросе про общий чат — 1 лишний круг, 2 лишних вызова
      (вместо 1 попытки — 2); это дешевле прежнего примера (сертификат — 2 лишних круга), но явление то
      же.'
