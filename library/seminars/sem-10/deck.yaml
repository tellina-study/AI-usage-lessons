- id: n70
  file: slides/n70-k4-n8n-panel.md
  type: mechanism_node_graph
  duration_min: 0.5
  assertion: 'Тело запроса — не текст с именем модели на виду, а выражение `{{ $json.body }}»: картинка
    и модель собраны узлом раньше, этот узел их только отправляет'
  learning_goal: 'Слой 2 Кейса 4, такт 2 из 2: настоящая панель параметров узла Embed image — JSON-тело
    как выражение, не литерал. Credential OpenRouter — тот же тип, что в Кейсе 1 (не повторяется здесь
    подробно — уже назван и показан на n17, С8: не предполагать память зала о другом занятии, но это тот
    же день и тот же узел курса, достаточно сослаться). Отдельный такт (letter-tail, сведение README §1),
    не уплотнение в n69.'
  visual:
    pattern: mechanism_node_graph
    figure: case4-n8n-embed-panel-real.png
    primary: 'Настоящий скрин нижней части панели параметров узла `Embed image`: `Body Content Type: JSON`
      → `Specify Body: Using JSON` → `JSON: {{ $json.body }}`.

      '
    backup: 'Источник: `stend/n8n-screenshots-raw/case4-embed-image-panel.png` (846×1846, снят `stend/n8n_shots.py`),
      кроп — `rendered/compose_case4_real_screens.py::embed_panel()` — вырезка (0,1253)-(846,1621), пропорция
      кадра 846×368 ≈ 2,3 (та же пропорция, что кроп панели `Simple Vector Store` Кейса 1, подобрана по
      тому же потолку высоты `deck_kit.FIG_NATURAL_H`, иначе кадр встаёт узкой колонкой с предупреждением
      «СХЕМА ЗАЖАТА»).

      ПОЧЕМУ ВЗЯТА ИМЕННО ЭТА ЧАСТЬ ПАНЕЛИ, А НЕ ВЕРХНЯЯ (`Method`/`URL`/ `Authentication`/`Credential
      Type`/`OpenRouter account`): полная форма узла 846×1846 целиком не ложится в альбомный кадр ни одним
      куском нужной высоты — выбор между верхом и низом обязателен, выбран низ. URL-эндпоинт `/v1/embeddings`
      и тип credential «OpenRouter» уже один раз показаны и названы текстом на панели Кейса 1 (`n17`,
      тот же день занятия) — повторный разбор здесь добавил бы не новое, а то же самое (правило отбора
      — проектирование узла, Кейс 4 Семинара 8: «подтверждение тождества узла, не вторая лекция про то
      же самое»). Нижняя часть показывает то, чего на панели Кейса 1 не было вовсе: тело запроса как ВЫРАЖЕНИЕ,
      не литеральный текст.

      ЧТО ИМЕННО ВИДНО И ЧТО ИЗ ЭТОГО СЛЕДУЕТ: поле `JSON` содержит не саму картинку и не имя модели буквально,
      а ссылку `{{ $json.body }}` — n8n-выражение, подставляющее значение, посчитанное ВЫШЕ по цепочке
      (в узле, который готовит тело запроса — имя модели, data URL картинки и структуру JSON). Это честно
      показывает устройство узла, а не прячет его: сама картинка на этом кадре не видна по той же причине,
      по которой её не видно ни на одной панели курса — системные идентификаторы и большие бинарные значения
      на экран не выносятся (канон proektirovanie-keysa-i-voprosa.md §3), а здесь дополнительно — просто
      потому что к моменту показа панели вживую узел ещё не выполнен с реальным входом (то же свойство
      момента съёмки, что и у пустого `INPUT` на панелях Кейса 4 Семинара 8).'
