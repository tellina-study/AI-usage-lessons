#
# Deck structure of Lecture 5 "AI Product: the full lifecycle — from intent to operation"
# (56 slides: s01–s49 + s13a IBM Watson — cascade-safe suffix ID + 6× sNNb ELI5 overviews).
#
# This is the ENGLISH source-of-truth twin of deck.yaml. RU is the source of truth (bilingual
# rule, CLAUDE.md § Bilingual Production Rule); this file is a full faithful duplicate, not a
# machine gloss. It is documentation, NOT read at render time (EN render is a later phase).
#
# Source: chapter.md + chapter-part2/3/4.md (≥30k words RU, 4 parts) +
# notes/lecture-5-review/pdlc/final/plan-final.md §4 (slide list s01–s49 + s13a).
# Issue #189 / #172 · Branch: hc/pldlc-lesson5-c5cc1586
#
# ┌─ STRUCTURAL PRINCIPLE (owner v3 full-rewrite, 2026-09-06): each of 6 sections = ──┐
# │ ① intro + CLASSICAL BASE (process from scratch) → ② what AI adds (capabilities +  │
# │ best practices + tools 2025-26) → ③ AI limitations + what stays from the classic → │
# │ ④ an on-point failure for that phase. 13 failures total, distributed by phase      │
# │ (not clustered). Keystone s05 (loop PDCA/OODA/BML) + s06 (cost/trust asymmetry).   │
# └─────────────────────────────────────────────────────────────────────────────────┘
#
# ┌─ SPLIT: deck.yaml >600 lines (Document Size Limit, no waiver) → split ────────┐
# │ deck.en.yaml   (THIS FILE) — deck/palette/motif/typography/glossary_lock      │
# │                + ai_failure_judgment (top-level share) + slides s01..s27      │
# │                (Section 0 "Introduction" through the end of Section 3         │
# │                "Build/Launch").                                               │
# │ deck-part2.en.yaml — slides s28..s49 (Section 4 Measure/Experiment through    │
# │                Section 6 Governance/finale) + totals + verify_day_of_items +  │
# │                fact_check_items.                                              │
# │ Loader (rendered build script) reads BOTH parts. Cross-link at the bottom.    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# ⚠ EN RENDER STATUS: text structure only (deck.en.yaml + slides-en/*.md). PPTX render is a
# later phase. DO NOT RENDER in this phase.

deck:
  lecture_number: 5
  title: "Lecture 5. AI Product: the full lifecycle — from intent to operation"
  audience: "3rd-year engineering students, universal, no local binding"
  duration_min: 100
  central_question: "Now that AI made assembly almost free — what became the product's real bottleneck, and on every phase of the loop: which classical discipline stays, what does AI speed up, and where does AI-first break?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: en
  status: draft-for-gate-b
  version: v1.0
  source: "chapter.md + chapter-part2/3/4.md (≥30k words RU, 4 parts) — EN twin"
  plan: "notes/lecture-5-review/pdlc/final/plan-final.md §4"
  total_slides: 56          # s01–s49 + s13a (IBM Watson, cascade-safe suffix) + 6× sNNb ELI5 overviews
  curriculum_level: "Industry lecture (after Lecture 4 SDLC); L5 = strict-in ≥30% mandatory, waiver UNAVAILABLE"
  deck_parts: [deck.en.yaml, deck-part2.en.yaml]   # split >600 lines; loader reads both
  axis: "phases of the product loop (discover→build→measure→learn→decide); each phase = base→AI→limitations→failure"
  glossary_lock: glossary.en.yaml

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # Canonical terms — from glossary.en.yaml (lecture-5 EN lock). Full list there;
  # designer/critic enforce no drift; alias only 1× at first mention.
  ref: "library/lectures/lec-05/glossary.en.yaml"
  headline_terms:
    - "feedback loop (discover→build→measure→learn→decide)"
    - "cost/trust asymmetry"
    - "Customer Development (Blank)"
    - "The Mom Test (Fitzpatrick)"
    - "falsifiable hypothesis (belief→test→date)"
    - "reference dataset"
    - "Double Diamond"
    - "Nielsen heuristics"
    - "feature flag / canary / staged rollout / rollback"
    - "Stage-Gate go/kill"
    - "CC/CD vs CI/CD"
    - "agency ladder"
    - "eval / offline-online eval / LLM-as-judge"
    - "pass@k vs pass^k"
    - "OEC / guardrail metric"
    - "SLI/SLO/error budget"
    - "LLMOps/AgentOps"
    - "model drift / silent drift"
    - "Goodhart's law / reward hacking"
    - "Guardian Agent (Gartner)"
    - "maturity 0-5"
    - "operators→orchestrators"
    - "hidden human cost"

