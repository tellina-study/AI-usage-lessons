  visual:
    pattern: section_divider_macro
    primary: A dark Ocean background, a one- or two-line headline question, a gold rule under it. Below
      — the sense line. At the bottom — the case track of this rung, with the second marker active.
    backup: 'The case was set up in the owner''s round 3 (issue 225, ZADANIE-KRUG-3-SUBAGENT.md, case
      2): parallelism as a reason to set up a subagent, with the former case "a second role, the boundaries
      get confused" as its boundary. No tag is set (rule A6). Owner''s round 5 (ZADANIE-KRUG-5.md): "5
      isn''t a clear or a lifelike example either, maybe better to show it as a practical exercise? and
      discuss with the students how to decompose and speed up tasks? it''s not only subagents there, after
      all". The case stopped being a breakdown of somebody else''s good luck (the former Thursday scene,
      "three checks at once") and became a practical exercise: the room lays the task out. The headline
      of the decision point was rewritten from "Three edits, one queue. What if all at once?" — the old
      one named a ready-made layout (three independent edits) before the room had made it, and in doing
      so took away from the exercise the work it exists for. The "question" form is kept — it is distinct
      from the seminar''s four other decision points (n06 a remark, n21 a scene, n29 a cost, n50 a count
