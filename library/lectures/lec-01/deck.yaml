    duration_min: 0.5
    assertion: "План лекции"
    learning_goal: "Дать студенту общую карту: что будет, в каком порядке, к чему мы движемся"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: lecture_roadmap_timeline
      primary: "Горизонтальный timeline-roadmap (визуальный паттерн как у редизайна s29 — цветовые модульные блоки), 5 разделов лекции (Открытие / Что такое AI / Где мы сейчас / 4 способа / Границы + заключение), текущий раздел (0) подсвечен gold. Без минут на слайде."

  - id: s05a
    file: slides/s05a-instructor-card.md
    type: assertion_visual
    duration_min: 1
    assertion: "Кто я и почему мне это важно"
    learning_goal: "Короткая визитка преподавателя"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: instructor_card
      primary: "Monogram-tile + 3 motif cards (briefcase / lightbulb / users)"

  # ─── Раздел 1. Что такое AI (7 мин) ───
  - id: s05c
    file: slides/s05c-section1-divider.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 1 — Что такое AI"
    learning_goal: "Visual divider — переход к определениям, истории и классификации AI"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: section_divider_with_progress
      primary: "Большое «Раздел 1» + title + 1-фраза-фрейм «Определения, история, классификация» + roadmap-bar внизу с gold-подсветкой текущей секции"

  - id: s06
    file: slides/s06-multiple-definitions.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "Определений AI много — потому что AI это движущаяся цель"
    learning_goal: "Множественность определений AI + AI Effect как причина"
    learning_outcomes: [LO1]
    references: [russell-norvig-2021, iso-iec-22989-2022, mitchell-1997, mccorduck-2004]
    visual:
      pattern: four_approaches_compact_table
      primary: "4 подхода в компактной 2×2 grid (квадранты Russell-Norvig // ISO/IEC 22989 // через обучение // через бенчмарки) + AI Effect callout снизу с Tesler цитатой"

  - id: s06a
    file: slides/s06a-prehistory-1943.md
    type: assertion_visual
    duration_min: 1
    assertion: "Идея нейросети старше самого термина «искусственный интеллект» на 13 лет"
    learning_goal: "Факт-мостик: предыстория 1943 (Мак-Каллок — Питтс) перед историей 1956-2026"
    learning_outcomes: [LO1]
    references: [mcculloch-pitts-1943]
    visual:
      pattern: fact_bridge
      primary: "Компактный факт-слайд: 1943 (формальный нейрон Мак-Каллока — Питтса) vs 1956 (Дартмут, термин «AI») — 13-летний разрыв, gold-акцент на «13 лет»"

  - id: s07
    file: slides/s07-timeline-2017.md
    type: process
    duration_min: 4
    assertion: "70 лет AI: открытия, зимы, точка перелома 2017"
    learning_goal: "Сжатый таймлайн AI; AI Effect через примеры"
    learning_outcomes: [LO1]
    references: [vaswani-2017-attention, mccorduck-2004, dhar-2024-paradigms]
    visual:
      pattern: horizontal_timeline_grouped
      primary: "Линейка 1950→2026 в 3 группах + gold-точка на 2017 + AI Effect callout"

  # ─── Раздел 2. Где мы сейчас (6.5 мин) ───
  - id: s07a
    file: slides/s07a-section2-divider.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 2 — Где мы сейчас"
    learning_goal: "Visual divider — переход к масштабу AI как инфраструктуры и прорывам 2023-2026"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: section_divider_with_progress
      primary: "Большое «Раздел 2» + title + 1-фраза-фрейм «AI как инфраструктура, прорывы 2023-2026» + roadmap-bar внизу с gold-подсветкой текущей секции"

  - id: s08
    file: slides/s08-scale-numbers.md
    type: data_chart
    duration_min: 3
    assertion: "AI стал инфраструктурой за 3 года: 900M WAU, 51% разработчиков ежедневно, 46% Copilot-кода"
    learning_goal: "Масштаб AI в цифрах + парадокс «массовое внедрение + массовый провал»"
    learning_outcomes: [LO1]
    references: [stack-overflow-2025, openai-2026-wau, github-octoverse-2025, cnews-vedomosti-2026, grand-view-research-2026, gartner-2024]
    visual:
      pattern: stat_grid_callout
      primary: "Сетка из 4 метрик (900M / 51% / 46% / $390.9B→$539.5B) + gold counter-fact «90% откатов»"

  - id: s09
    file: slides/s09-breakthroughs-2023-2026.md
    type: case_study
    duration_min: 3
    assertion: "Пространство открыто: 4 прорыва 2023–2026 от не-первых игроков"
