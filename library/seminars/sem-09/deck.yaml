  visual:
    pattern: mechanism_node_graph
    figure: k6-shema-chtenie-i-sverka.png
    primary: 'Схема в один ряд: фото → модель qwen/qwen3-vl-8b-instruct (пиксели, имя на схеме) → сумма
      и дата → сверка в коде с суммой из заявки → развилка «совпали?». Палитра Ocean, кегль не ниже 7,5
      pt. Без единого измеренного числа.

      '
    backup: 'ПРАВКА УСТРОЙСТВА (issue #299, `stend/zamery-k6-edinyy/README.md`, раздел «Расхождения с
      декой — адреса, не пересказ»). Прежняя редакция несла узел «классическое распознавание» между фото
      и моделью. На стенде такого узла нет ни в одном из двух измеренных устройств — ни в двухшаговом
      (`zamery-k5-k6/sborka.py`, узел `k6_http`), ни в едином (`zamery-k6-edinyy/sborka.py`, узел `k6e_http`):
      фотография в обоих случаях идёт в модель `qwen/qwen3-vl-8b-instruct` целиком, пикселями. Правка
      снимает заявление о распознавании и называет реальное устройство: модель читает фотографию и возвращает
      сумму и дату; эти значения код сравнивает с суммой, которую клиент написал в тексте заявки, — модель
      этот текст не получает вовсе.

      Имя модели — на схеме и в видимом теле этого кадра (С5, строгое правило владельца): кадр реализации
      без имени модели — дефект, даже если имя стоит только в заметках.

      Три блока вместо пяти. Прежняя редакция несла два отдельных блока на каждую ветвь исхода (совпали
      / разошлись) плюс отдельный блок про надёжность текста заявки — сборка отмечала ПЕРЕПОЛНЕНИЕ (четыре
      блока) и композицию ниже рабочего поля. Оба исхода сведены в один блок; вопрос о надёжности текста
      заявки — отдельный нюанс устройства, не часть базового контура, и живёт в заметках этого кадра (развёрнут
      дальше, на `n75`).

      Имён оркестратора, id сценария и прочей латиницы кроме имени модели на схеме нет сознательно: §2
      канона требует от слоя 1 формулировки, которая переживёт смену ИНСТРУМЕНТА (вызов, узел, провайдер),
      но не обязана прятать, ЧТО читает фотографию, — это измерено, не абстрактно, и скрывать имя здесь
      значило бы прятать честный результат. Настоящий холст — экраном дальше, `n69`.

      Чисел на этом кадре нет: схема слоя 1 показывает устройство, не измеренные исходы — числа этого
      кейса живут в тактах `n70`, `n71`, `n72`, `n73` и в новых тактах `n73a`–`n73e` (единый вызов против
      двух шагов, issue #299).'
- id: n69
  file: slides/n69-k6-n8n-chtenie-kartinki.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Настоящий холст замера: три узла, и ни одного из них, который сверяет прочитанное с текстом
    заявки'
  learning_goal: 'Слой 2 Кейса 6 (§2 канона замысла кейса): настоящий снимок живого стенда, не стилизованная
    схема. Кадр честно показывает, что именно было собрано для измерения — только чтение, без сверки.'
  visual:
    pattern: mechanism_node_graph
    figure: k6-holst-chtenie.png
    primary: 'Настоящий снимок холста n8n живого стенда, три узла в один ряд: приём фотографии → сборка
      запроса к модели → вызов модели с изображением. Подписи узлов — как на холсте, латиницей в кавычках/бэктиках,
      остальной текст кадра на русском.

      '
    backup: 'Снимок настоящий: сценарий «С9 · замер K6 — чтение фотографии квитанции» на живом `n8n.lessons.tellian.io`,
      снят `stend/n8n_shots.py` (БРИФ §3, таблица «Сценарии на стенде по кейсам», строка 6). Стилизованной
      карточки вместо снимка здесь нет (БРИФ §5, [[no-mock-fallbacks]]).

      Три узла на холсте, названия настоящие, взяты из исходника сборки (`stend/zamery-k5-k6/sborka.py`,
      функция `k6_read`): `Receipt photo` (приём фотографии через форму), `Build vision request` (собирает
      тело запроса — модель, фотография в нужной провайдеру кодировке), `Read receipt (OpenRouter vision)`
      (прямой вызов к модели с изображением и вопросом «прочитай сумму и дату»).

      ПРОВЕРЕНО ПО ГОТОВОЙ ФИГУРЕ (`rendered/figures/k6-holst-chtenie.png`, открыта этой сессией): три
      карточки узлов, подписи дословно совпадают с названиями выше, пути вебхука/id/учётных данных на
      кадре нет, стрелки простые без развилок. Требование к кропу ниже — подтверждённое, не гипотетическое.

      ЧЕСТНОЕ ОГРАНИЧЕНИЕ, названо прямо в видимом теле, а не скрыто: этот холст — измерительный стенд
      для одного вопроса («как читает фотографию сама модель, без ничего вокруг»), не собранное решение
      кейса. Узла классического распознавания и узла сравнения двух чисел на нём нет — их устройство разобрано
      схемой слоя 1 (n68) как то, что имеет смысл строить дальше, а не то, что буквально стоит на этом
      холсте.

      ТРЕБОВАНИЕ К КРОПУ (выполнено на готовой фигуре): на кадре не должен быть виден путь вебхука, id
      сценария и любые учётные данные провайдера — только карточки трёх узлов и соединяющие их стрелки,
      без открытых настроек HTTP-узла, где ключ подключён. Панель с текстом запроса к модели, если её
