- id: n60
  file: slides/n60-razbor-granitsa-v-obe-storony.md
  type: answer_breakdown
  duration_min: 1.75
  assertion: 'Четвёртая карточка нужна здесь: третья добавляет роль ради проблемы, которую создали первые
