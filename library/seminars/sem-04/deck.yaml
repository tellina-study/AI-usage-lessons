# Семинар 4 — финальная сборка v5 (раунд 5: смена оси «день-0 vs жди сигнала» + структурный
# порядок вопрос-до-исследования, REWORK-REQUIREMENTS-v5.md).
#
# v5 меняет относительно v4 (53 слайда, 73 мин):
# (R5-0) Новая центральная ось занятия: специфичное для проекта (ждать сигнала: кейсы 1.1,
#   1.3, 2.2) vs универсальная гигиена (заводить на день 0: кейсы 1.2, 2.1, 2.3). Заменяет
#   прежнюю ось «тонкий агент: жди триггер для всего», которая неверно расширяла тезис
#   Лекции 3 на вопрос универсальной инженерной гигиены.
# (R5-1) Визуальная унификация дивайдеров: macro (раздел, 4-сегментный gold progress-bar +
#   номерной значок раздела) явно отличается от micro (кейс, 3-сегментный teal progress-bar,
#   без значка) — было визуально почти неразличимо.
# (R5-2) Раздел 0, слайды 0.2–0.4 полностью переписаны: цитата задачи заказчика → открытая
#   дискуссия «можно ли дать сразу» → структурированная запись требований (spec.md, кладётся
#   в репозиторий) → демо-кейс, где видно, чего даже хорошая спека не покрывает (структура
#   репозитория) — прямой мост к кейсу 1.1. Заменяет старое деление «видно в коде / нигде не
#   видно».
# (R5-3) Универсальный порядок внутри всех 6 кейсов: проблема → ВОПРОС (карточки, БЕЗ единой
#   цифры, БЕЗ источника) → голосование → ИССЛЕДОВАНИЕ + разбор (только после голосования).
#   В v4 исследование звучало ДО вопроса и по факту подсказывало ответ. Разделы 1 и 2
#   пересобраны под этот порядок; кейсы 2.2/2.3 получили НОВЫЕ отдельные слайды-исследования
#   (раньше исследование было нигде не заведённой частью речи фасилитатора).
# (R5-4) Кейс 1.1: README-оговорка («структурированное описание должно быть — но в README.md,
#   не в CLAUDE.md») поднята из сноски критерия в заметную gold-плашку разбора, на уровне
#   целевого ответа.
#
# Раздел 0 (открытие, s01-s07, 12 мин) — s02/s03/s04/s05/s06 переписаны полностью под R5-0/R5-2.
# Раздел 1 (файл инструкций, 3 кейса, s08-s23, 29.5 мин) — было 16 слайдов на кейсы (19 с
#   учётом раздельных divider'ов v4), стало 16: исследование+разбор слиты в один слайд на
#   кейс (было раздельно), вопрос переставлен раньше.
# Раздел 2 (память, 3 кейса, s24-s49, 32.75 мин) — было 24 слайда, стало 26: кейсы 2.2 и 2.3
#   получили новые отдельные слайды-исследования (R5-3), кейс 2.1 переставлен (вопрос раньше
#   исследования, решение без diff — R5-0: файл заведён на день 0, диафф «new file mode»
#   противоречил бы рамке).
# Раздел 3 (закрытие, s50-s52, 4.5 мин) — синтез переписан под новую ось день-0/сигнал.
#
# Источники старой структуры v4: slides старого deck.yaml — Fix 1-7 (review-раунд v4,
# 2026-09-22) остаются в силе как методический фундамент (presence paradox definition,
# честная сила доказательства, divider на каждый кейс) — v5 их не отменяет, а надстраивает.
#
# Слайдов было 53 (v4), стало 52 (v5). Детали — rework/section-*.md (v5) +
# rendered/iteration-log.md.
deck:
  seminar_number: 4
  title: "Семинар 4 — Сборка кодинг-агента: день-0 база или жди сигнала"
  audience: "студенты 3 курса, направление 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами в работе"
  duration_min: 81  # material 78.75 (12 раздел 0 + 29.5 раздел 1 + 32.75 раздел 2 + 4.5 раздел 3) + ~2.25 мин резерва
  format: "слайды фасилитатора + открытые вопросы с карточками-вариантами (вопрос ДО исследования, R5-3) + совместное формирование конфигурации с залом (без живого терминала)"
  central_question: "Что в конфигурации агента стоит закладывать сразу, на день 0, как базовую практику — а что нельзя знать заранее, потому что оно специфично для вашего проекта?"
  learning_outcomes: [LO7, LO6, LO3]
  case: "signup-landing — лендинг с формой заявки на демо-урок: требования зафиксированы в spec.md и README до первой сессии агента; сборка, тест формы, деплой, задачи в трекере; один разработчик с агентом, фиксированная дата показа заказчику. Занятие подробно разбирает 2 из 5 слотов харнесса (файл инструкций, память), по 3 кейса на каждый — три специфичны для проекта (ждать сигнала: 1.1, 1.3, 2.2), три — универсальная гигиена (день 0: 1.2, 2.1, 2.3); остальные 3 слота + 2 практических слоя (хук, процесс) — Семинар 5."
  language: ru
  slide_count: 52
  timing_budget: "78,75 мин материала (12 раздел 0 + 29,5 раздел 1 + 32,75 раздел 2 + 4,5 раздел 3 закрытие) + ~2,25 мин резерва = 81; раздел 0 вырос с 10 до 12 мин (новый содержательный слайд spec.md + явный вопрос/разбор новой оси), раздел 2 вырос с 30,5 до 32,75 мин (новые слайды-исследования кейсов 2.2/2.3 впервые получили честный тайминг вместо незаученной части речи), раздел 1 немного сократился (29,5 vs 28 — слияние исследование+разбор в один заход на кейс). Итоговая длительность занятия выросла с 75 до 81 мин — осознанное решение оркестратора: раунд 5 добавляет содержательные фиксы (новая ось, README-плашка, честный тайминг исследований), а не косметику."
  failure_share: "посчитано по каждому кейсу отдельно (доля research+answer_breakdown+failure_vignette+criteria_boundary слайдов от длительности кейса): 1.1=(0.5+5+1.5)/9=78%(исследование+разбор+часть критерия внутри одного слайда, оценка консервативно по времени всего merged-слайда), 1.2=(6.5)/10.5=62%, 1.3=(5.5)/9.5=58%, 2.1=(1+1.25+1.75+3+1)/11.5=69%, 2.2=(1.25+1.5+3.5+0.75)/11.25=62%, 2.3=(1+1.25+3+1)/10=62%. Все 6 кейсов индивидуально ≥30% с большим запасом (AI-Failure & Judgment Content Rule, strict-in). Агрегированная доля по всему занятию (сумма failure/evidence-минут всех 6 кейсов / 78,75 мин общего материала) заметно выше порога 30% и распределена холистически по всем 6 кейсам, не сконцентрирована в одном."
  source: "library/seminars/sem-04/rework/section-0-otkrytie.md + section-1-fayl-instrukciy.md + section-2-pamyat.md + section-2-pamyat-part2.md + section-2-pamyat-part3.md + section-3-zakrytie.md (v5, раунд 5 — R5-0 смена оси + R5-1 визуальная унификация дивайдеров + R5-2 раздел 0 переписан + R5-3 вопрос до исследования + R5-4 README-плашка). Supersedes v4 deck.yaml (53 слайда, review-раунд Fix 1-7) и v3 deck.yaml (72 слайда, 90 мин, 7 ступеней)."

slides:
  # --- Раздел 0. Открытие: задача от заказчика, spec.md, сквозной кейс, два режима, карта (12 мин) ---
  - id: s01
    file: slides/s01-oblozhka-centralnyy-vopros.md
    type: hero_cover
    duration_min: 1
    assertion: "Часть скопированной конфигурации — универсальная гигиена, которую стоило завести с первого дня; часть — чужие решения под чужой репозиторий, которые ничего не говорят про ваш собственный"
    learning_goal: "Открытие занятия одной мыслью и одним вопросом — новая ось занятия (день-0 vs жди сигнала, R5-0) звучит уже в первой минуте"
    visual:
      pattern: hero_cover
  - id: s02
    file: slides/s02-zadacha-zakazchika-vopros.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Заказчик формулирует задачу по-человечески, без единого слова о структуре, критериях готовности или границах действий — и с этим текстом вы открываете чат с агентом"
    learning_goal: "Постановка задачи от заказчика дословной цитатой + открытая дискуссия «можно ли дать это агенту сразу» (R5-2, новый слайд)"
    visual:
      pattern: open_discussion
  - id: s03
    file: slides/s03-spec-md-trebovaniya.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Требования — функциональные и нефункциональные — раскладываются и записываются в spec.md до того, как агент увидел хоть строку задачи; README фиксирует описание репозитория отдельно от файла инструкций"
    learning_goal: "Структурированная запись требований (R5-2) — методический пример spec.md, мостик к кейсу 1.1"
    visual:
      pattern: code_artifact
  - id: s04
    file: slides/s04-pustoy-repozitoriy-i-povorot.md
    type: code_artifact
    duration_min: 2
    assertion: "Репозиторий буквально пуст, задача передана через спеку, а агент не задал ни одного уточняющего вопроса — и то, чего spec.md по определению не покрывает, структуру репозитория, решил за вас молча"
    learning_goal: "Сквозной кейс через spec.md (R5-2) — поворот сдвинут на то, чего спека заведомо не покрывает — прямой мост к кейсу 1.1"
    visual:
      pattern: terminal_task_and_dialogue
  - id: s05
    file: slides/s05-vopros-dva-rezhima.md
    type: reflection_question
    duration_min: 1
    assertion: "Настраивая нового агента в новом репозитории, каждый ближе к одному из двух режимов — заложить базу сразу или ждать, пока не заболит"
    learning_goal: "Первый открытый вопрос занятия — самодиагностика на двух режимах (R5-0), заменяет вопрос из восьми карточек харнесса v4"
    visual:
      pattern: question_with_option_cards
  - id: s06
    file: slides/s06-razbor-dva-rezhima.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: "И то и другое — не ошибка, а привычка, которая права ровно наполовину: специфичное для проекта ждёт сигнала, универсальная гигиена заводится сразу"
    learning_goal: "Разбор двух режимов (R5-0) — вводит явную ось «день-0 / жди сигнала», отдельно от тезиса Лекции 3 про тонкого агента"
    visual:
      pattern: dual_mode_breakdown
  - id: s07
    file: slides/s07-karta-ekipirovki-sokraschennaya.md
    type: keystone_axis
    duration_min: 3.5
    assertion: "Из пяти слотов экипировки агента сегодня подробно разбираются два — инструкции-правила и память; остальные три и оба практических слоя — дальше, Семинаром 5"
    learning_goal: "Единый слайд карты экипировки — co-building пяти слотов, честный scope-statement, правило лестницы"
    visual:
      pattern: keystone_scope_map
  # --- Раздел 1. Файл инструкций: 3 кейса — роль/репозиторий, базовые процессы, вложенные файлы (29.5 мин) ---
  - id: s08
    file: slides/s08-divider-fayl-instrukciy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 1 — файл инструкций: три отдельные развилки про один и тот же файл, в порядке, в котором реально растёт репозиторий"
    learning_goal: "Разделитель раздела 1 (macro-уровень, R5-1)"
    visual:
      pattern: section_divider_macro
  - id: s09
    file: slides/s09-divider-keys-1-1-rol-i-repozitoriy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.1 — роль агента и общее описание репозитория: что писать в пустой файл, пока не случилось ни одной реальной сессии"
    learning_goal: "Разделитель кейса 1.1 (micro-уровень, R5-1)"
    visual:
      pattern: section_divider_micro
  - id: s10
    file: slides/s10-keys-1-1-problema-overview.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Первый инстинкт — открыть пустой файл и начать с описания структуры репозитория; привычка сильная, но это ровно та фраза «так делают в хороших проектах», которую занятие проверяет впервые"
    learning_goal: "Проблема кейса 1.1 — сценарий-развилка плюс анекдот коллеги. БЕЗ вопроса и карточек"
    visual:
      pattern: problem_scenario
  - id: s11
    file: slides/s11-keys-1-1-vopros.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Перед пустым CLAUDE.md выбор из пяти вариантов — и «пока ничего» среди них не менее весомый вариант, чем остальные четыре"
    learning_goal: "Открытый вопрос кейса 1.1 (R5-3: до исследования) — БЕЗ единой цифры, БЕЗ источника"
    visual:
      pattern: question_with_option_cards
  - id: s12
    file: slides/s12-keys-1-1-issledovanie-i-razbor.md
    type: research_evidence
    duration_min: 5
    assertion: "Repository overview измеримо не помогает и стоит контекста — а структурированное описание, если оно вообще нужно, должно жить в README.md, не дублироваться в CLAUDE.md"
    learning_goal: "Исследование+разбор кейса 1.1, слитые в один заход (R5-3) — четыре источника, целевой ответ, заметная README-плашка (R5-4)"
    visual:
      pattern: research_and_answer_combined
  - id: s13
    file: slides/s13-keys-1-1-reshenie-pustoy-fayl.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "CLAUDE.md остаётся пустым — не из лени, а потому что нет сигнала; первый настоящий сигнал придёт через две недели"
    learning_goal: "Решение кейса 1.1 — пустой файл как содержательный итог, мостик к кейсу 1.2"
    visual:
      pattern: assertion_visual
  - id: s14
    file: slides/s14-divider-keys-1-2-processy.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.2 — базовые процессы: гейт-фраза заводится проактивно на день 0, вместе со spec.md — и всё равно не срабатывает дважды подряд"
    learning_goal: "Разделитель кейса 1.2 (micro-уровень, R5-1), тег отражает день-0 рамку (R5-0)"
    visual:
      pattern: section_divider_micro
  - id: s15
    file: slides/s15-keys-1-2-problema-gotovo-raskhoditsya.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Гейт готовности заведён с первого дня, вместе со spec.md — и всё равно «готово» расходится с реальностью дважды подряд"
    learning_goal: "Проблема кейса 1.2 (R5-0: проактивная день-0 рамка). БЕЗ вопроса и карточек"
    visual:
      pattern: problem_scenario
  - id: s16
    file: slides/s16-keys-1-2-vopros.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Гейт-фраза уже есть с самого начала и не сработала — выбор из пяти вариантов, что делать дальше"
    learning_goal: "Открытый вопрос кейса 1.2 (R5-3: до исследования) — БЕЗ единой цифры"
    visual:
      pattern: question_with_option_cards
  - id: s17
    file: slides/s17-keys-1-2-issledovanie-i-razbor.md
    type: research_evidence
    duration_min: 6.5
    assertion: "Текстовый гейт без тулинга не просто бесполезен, а вреден — регрессии выросли почти до 10%; правила в промпте — просьбы, правила в коде — законы"
    learning_goal: "Исследование+разбор кейса 1.2, слитые в один заход (R5-3) — две мини-таблицы, безусловная формула, двухчастный критерий"
    visual:
      pattern: research_and_answer_combined
  - id: s18
    file: slides/s18-keys-1-2-reshenie-itogovyy-claude-md.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Итоговый файл — тринадцать строк: критерий готово, гейт-предупреждение, честная оговорка предела; AGENTS.md — симлинк на тот же файл"
    learning_goal: "Решение кейса 1.2 — реальный итоговый CLAUDE.md, механика загрузки, симлинк AGENTS.md"
    visual:
      pattern: code_artifact
  - id: s19
    file: slides/s19-divider-keys-1-3-vlozhennye-fayly.md
    type: section_divider
    duration_min: 0.5
    assertion: "Кейс 1.3 — вложенные AGENTS.md/CLAUDE.md по подпапкам: стоит ли дробить файл, когда репозиторий подрастёт"
    learning_goal: "Разделитель кейса 1.3 (micro-уровень, R5-1)"
    visual:
      pattern: section_divider_micro
  - id: s20
    file: slides/s20-keys-1-3-problema-tests-claude-md.md
    type: problem_scenario
    duration_min: 1.5
    assertion: "Разработчик выносит правила тестов в tests/CLAUDE.md и ждёт, что агент подхватит его сам — логично звучит, но стоит проверить, что там реально происходит с загрузкой"
    learning_goal: "Проблема кейса 1.3 — сценарий выноса правил в подпапку. БЕЗ вопроса и карточек"
    visual:
      pattern: problem_scenario
  - id: s21
    file: slides/s21-keys-1-3-vopros.md
    type: reflection_question
    duration_min: 0.5
    assertion: "Как гарантировать, что агент реально прочитает конвенции из tests/CLAUDE.md — выбор из пяти вариантов"
    learning_goal: "Открытый вопрос кейса 1.3 (R5-3: до исследования) — БЕЗ единой цифры"
    visual:
      pattern: question_with_option_cards
  - id: s22
    file: slides/s22-keys-1-3-issledovanie-i-razbor.md
    type: research_evidence
    duration_min: 5.5
    assertion: "Вложенный файл грузится on-demand, только по факту чтения; контролируемое исследование не нашло пользы от разбиения, а практика показывает регулярные отказы вплоть до архитектурного предела"
    learning_goal: "Исследование+разбор кейса 1.3, слитые в один заход (R5-3) — механизм загрузки + эмпирическая таблица, целевой ответ"
    visual:
      pattern: research_and_answer_combined
  - id: s23
    file: slides/s23-keys-1-3-reshenie-most-k-pamyati.md
    type: assertion_visual
    duration_min: 1.5
    assertion: "Репозиторий остаётся с одним корневым файлом; три кейса — три решения знания, известного заранее, но есть знание другого рода — раздел второй, память"
    learning_goal: "Решение кейса 1.3 + финальный мостик раздела 1 к разделу 2"
    visual:
      pattern: assertion_visual
  # --- Раздел 2. Память: 3 кейса — плоский файл (день 0), вики-память (по сигналу), задачная память (день 0) (32.75 мин) ---
  - id: s24
    file: slides/s24-divider-pamyat-keys-2-1.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 2 — память: то, что агент помнит между сессиями; кейс 2.1 — плоский файл, заведённый на дне 0"
