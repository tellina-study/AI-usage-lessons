  visual:
    pattern: criteria
    primary: Таблица три строки (когда нужен каждый способ) + плашка-граница.
- id: n37
  file: slides/n37-rezultat.md
  type: recap_table
  duration_min: 0.5
  assertion: Запись о фотографии выбирают под вопросы, которые архиву зададут, — список этих вопросов
    решают до того, как вопрос прозвучит
  learning_goal: 'Итог кейса (С10) + оговорка о чистоте набора одной строкой (С13.3). Без чисел соседнего
    кейса на кадре (решение оркестратора: сведение — в закрытии).'
  visual:
    pattern: recap_table
    primary: Плашка итога одной мыслью + плашка оговорки чистоты.
- id: n38
  file: slides/n38-mostik-k-d.md
  type: content
  duration_min: 0.5
  assertion: Три способа описания готовы — а ищется ли по этим самым записям, проверит следующий кейс
  learning_goal: 'Мост П4/С1 к кейсу D этого же занятия: честно объявляет границу («мы не проверяли поиск»),
