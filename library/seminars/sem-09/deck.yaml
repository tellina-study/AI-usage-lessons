  visual:
    pattern: measured_outcome_table
    primary: 'Две плашки рядом, каждая с явной подписью, что именно поймано: «проверка формата — 0 из
      11» и «сверка с независимым значением — 11 из 11», плюс строка про отсутствие ложных срабатываний
      на 15 верных случаях. Под плашками — честная оговорка, откуда взяты эти 11 и 15.

      '
    backup: 'Числа — из `stend/zamery-k5-k6/README.md`, Замер 4.1, раздел «Сверка как средство защиты»:
      11 неверных дат (все из такта n71, размеры «одна восьмая», «одна шестнадцатая», «одна тридцать вторая»)
