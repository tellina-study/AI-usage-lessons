- id: n59
  file: slides/n59-sobiraem-tri-hoda-imya-prava-format.md
  type: cobuilding
  duration_min: 1.5
  assertion: Роль собирается в три хода — имя и описание, список инструментов, формат ответа; это и есть
    специализация по ролям и инструкциям, и второй ход вычёркивает правку из списка, потому что роли из
    сцены нужно было только находить проблему
  learning_goal: 'Проектирование вслух: имя/описание решает маршрутизацию, список инструментов — состав
    арсенала независимо от текста инструкции, формат ответа делает вердикты сравнимыми между вызовами.
    Правильную сборку даёт следующий слайд. Круг 3 (issue 225, ZADANIE-KRUG-3-SUBAGENT.md): замечание
    владельца по всему блоку — слово «специализация» не звучало ни разу, хотя это и есть главная причина
    заводить роль. Слайд, который буквально собирает имя+инструкцию+права, назвал приём своим словом в
    лид-строке Visual и в открывающей фразе заметок: имя — звать явно, инструкция — не пересказывать условия
    заново, права — не дать сделать то, за чем не звали'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Таблица в три колонки: что решаем · варианты · что меняет выбор. Три строки. Во второй строке
      — полный список инструментов роли, из которого вычёркивается правка: зал отвечает, нужен ли он,
      вычёркивание показано визуально.'
    backup: 'Источник — section-2-subagent.md §A.1 «Со-сборка» + «Собственный ход раздела», дословно по
      содержанию; section-2-subagent-part1b.md n59 даёт ту же таблицу в связной речи, включая выдержанную
      паузу на вопросе о праве правки. Текст-как-инструкция против списка-как-арсенала — собственный ход
      этого раздела, не формула хука прошлого занятия (она отдана Семинару 5 и не повторяется). Круг пересмотра
      по сторителлингу (issue 225, П6): речь сокращена с 236 до 188 слов — ответ про пустой список находок
      и объяснение формата переставлены в справку, три хода и пауза на вопросе о праве правки сохранены.
      Круг 3 владельца (issue 225): перед существующей цитатой добавлена лид-фраза, называющая приём «специализация
      ролей по инструкциям» прямо и привязывающая имя/инструкцию/права к их отдельным причинам — факт
      не меняется, цитата дальше та же, знак в знак.'
- id: n60
  file: slides/n60-artefakt-fayl-diff-reviewer.md
  type: code_artifact
  duration_min: 0.75
  assertion: 'Собранная роль — один файл: имя и описание с границей применимости, строка tools: Read,
