- id: n25b
  file: slides/n25b-k2-kesh-tochka-validatsii.md
  type: content
  duration_min: 2.5
  assertion: Кэш читается от начала промта до первого изменившегося места — а у Anthropic то, где проходит
    эта граница, решает не правка сама по себе, а то, как текст перед ней разбит на блоки
  learning_goal: 'Такт С2-3 (разбор по группам, разбор 2026-10-29): главная поправка кейса — старое утверждение
    «дописывание в конец сбрасывает весь кэш целиком» было верно только для ОДНОЙ раскладки и неверно
    как общее правило (К2-15). Заменяет снятый n26 (слово «ловушка» убрано, К2-14) и несёт свидетельство
    владельца про долю попаданий (К2-13) с явной оговоркой.'
  visual:
    pattern: content
    figure: k2-shema-kesh-lovushka.png
    primary: 'Условие кэша тремя строками (без слова «ловушка»). Дальше — два столбца с одной и той же
      правкой: один блок текста (кэш сгорает) и четыре блока с переехавшей точкой (кэш уцелевает), одна
      и та же модель, одна и та же правка, разница в цене — в 9,8 раза. Снизу — врезка со свидетельством
      владельца про долю попаданий, с оговоркой.

      '
    backup: 'СНЯТ СТАРЫЙ слайд «кэш-ловушка» (К2-14: убрать «ловушку» из первых двух блоков условий).
      Слово снято везде на этом кадре: условие называется прямой формой, без метафоры капкана.

      ГЛАВНАЯ ПОПРАВКА (К2-15). Старое утверждение («дописать пункт в конец — сбрасывается весь накопленный
      кэш целиком») владелец усомнился верно по сути и неверно в одном слове: он спросил, не читается
      ли кэш до точки расхождения всегда. Ответ разложен на три части (`stend/zamery-k2-kesh/README.md`,
      «Прямой ответ на вопрос владельца»): (1) у Anthropic кэш НЕ включён по умолчанию — без `cache_control`
      не кэшируется ничего (Таблица 5, серия без точки — 0/0/0 на всех вызовах); (2) «зачитывает до точки
      расхождения» — верно, и это поведение провайдеров с автоматическим кэшем (Gemini, OpenAI); (3) «инвалидации
      не будет, если дописано после точки» — верно, но ТОЛЬКО при правильно выставленной точке. Доказательство
      — Таблица 5: один и тот же дописанный пункт, одна и та же модель, два разных исхода по тому, как
      разбит текст на блоки — один блок: 0 прочитано, 3834 записано, цена 1,271× (кэш сгорел); четыре
      блока с точкой на новом блоке: 3762 прочитано, 68 записано, цена 0,129× (кэш уцелел). Разница —
      9,8 раза по цене одного и того же вызова. Документация Anthropic называет механику прямо: «Cache
      writes occur only at your breakpoint… The system does not write entries for any earlier position»;
      хэш «кумулятивный», поэтому «changing any block at or before the breakpoint produces a different
      hash» — в одноблочной раскладке позади точки просто нет записи, которую можно найти.

      КАК ВЫСТАВЛЯЕТСЯ ТОЧКА ВООБЩЕ (прямой ответ на «как эта контрольная точка выставляется вообще»,
      К2-15): явным полем `cache_control: {"type": "ephemeral"}` на БЛОКЕ контента (не на уровне всего
      промта), не больше четырёх точек на запрос. Если справочник отправлен одним текстовым блоком с точкой
      в его конце — любая правка внутри блока меняет весь блок, и записи позади него нет. Если справочник
      разбит на несколько блоков (например, «старые 10 пунктов» отдельным блоком, новый 11-й — своим),
      а точка переставлена на НОВЫЙ последний блок — старые блоки остаются найденными по хэшу, и сгорает
      только дописанная часть. Правило на кадр: не «дописывать безопасно», а «дописывать безопасно, если
      точка стоит на новом блоке, а не внутри старого».

      СВИДЕТЕЛЬСТВО ВЛАДЕЛЬЦА (К2-13), с оговоркой (README, раздел «Свидетельство владельца про 98–99%
      попаданий»): это НЕ наш замер — стенд делает одиночные вызовы, не агентские прогоны, и долю попаданий
      этим способом не измерить. Арифметика сходится: при измеренном множителе чтения 0,107× и доле попаданий
      98–99% счёт за вход падает до 0,12–0,13 от исходного — экономия 87–89%, что согласуется с «до 90%»
      владельца. Опубликованный диапазон у реальных агентских трасс честнее и шире: 92,2–98,6% (TurnCost
      98,6%, TraceLab 95,7% в среднем и 97,9% на шагах инструмента, vLLM 92,2%), и название этого диапазона
      — рядом со свидетельством, не вместо него.

      ОБРАТНЫЙ СЛУЧАЙ остаётся без изменений по сути (кэш живёт минуты, у части провайдеров — час; справочник,
      который правят чаще, не экономит, а переплачивает 1,25× вместо 1×).

      Фигура `k2-shema-kesh-lovushka.png` требует правки генератора под эту поправку (слово «ловушка»
      в докстроке `rendered/make_figures_k2.py`, правка — отдельным шагом этой же сессии, не здесь).'
- id: n26a
  file: slides/n26a-k2-pyat-napravleniy-zamer.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: Пять направлений структурирования промта проверены 84 вызовами на вопросах, которые уже путали
    модель в Кейсе 1 — прежде чем смотреть на исход, вот что и на чём проверялось
  learning_goal: Такт С2-1 для второго замера кейса (структура, без результатов, К2-16/К2-17/К2-18, разбор
    2026-10-29). Правка владельца 2026-10-27, собственный замер по пяти направлениям структурирования
    промта. Перестроен из прежней редакции, которая показывала структуру и результат одним кадром — нарушение
    С2.
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица из пяти строк-направлений: что сравнивали · сколько вопросов · пример формата/позиции
      на каждое направление. Результатов на кадре нет ни одного — ни доли верных, ни слова «лучше».

      '
    backup: 'ПЕРЕСТРОЕНО (К2-16, К2-17, К2-18, разбор 2026-10-29). Прежняя редакция этого кадра несла
      пять строк «направление · что сравнили · результат» одним экраном — структура и исход вперемешку,
      нарушение С2 («не хватает описания: сколько вопросов, какие блоки»; «по каждому блоку — с примерами,
      без результата на этом кадре»; «сначала структура теста → сводная табличка → подробно каждый блок»).
      Столбец результата снят ЦЕЛИКОМ с этого кадра и переехал в n26b.

      Числа — `stend/zamery-k2/README.md`, замер 2026-10-27, execution 856–939, 84 вызова, сценарий `s9-k2-experiment`.
      Вопросы — подмножество трудных вопросов Кейса 1 (`voprosy_zamer1.py`), для прямой сравнимости: это
      та же задача, на которой модель уже путалась в разборе «Отвечать или промолчать», и пять направлений
      проверяют, чинит ли её перестройка промта — не новую задачу с нуля.

      Модель и настройки (С5) — одна и та же для всех 84 вызовов, тот же узел и та же модель, что у стенда
      занятия (`qwen/qwen-2.5-7b- instruct` через n8n, universal-узел, промт целиком из кода); это названо
      явно, в отличие от прежней редакции, где модель не стояла на кадре структуры вовсе.

      Выборки маленькие (5–15 на направление) — на кадре это названо прямо в столбце «вопросов», не спрятано
      (С9 не запрещает называть размер выборки — запрещает самоуничижительную оговорку поверх названного
      числа, не сам факт малой выборки).'
- id: n26b
  file: slides/n26b-k2-pyat-napravleniy-razbor.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Ни одно из пяти направлений не почистило ошибки сравнения чисел из Кейса 1 — а строгая условная
    форма правила измеренно хуже обычной прозы, не лучше
  learning_goal: 'Такты С2-2+С2-3 (свод и разбор по направлениям, объединённые — замер не про верно/неверно
    ответов группами, а про влияние структуры, разбор короче пяти экранов): результат по каждому направлению
    с вердиктом и выводом (С3, С10), плюс честная поправка по направлению «стабильность префикса» — латентность
    не метрика кэша, и этот вопрос с тех пор измерен отдельно и правильно.'
  visual:
    pattern: measured_outcome_table
    primary: 'Та же таблица пяти направлений, теперь со столбцом исхода и вердиктом. Снизу — выделенная
      плашка про условную форму (хуже прозы) и плашка про честную границу: что эти пять направлений не
      чинят.

      '
    backup: 'ИМЕНА И ПОРЯДОК НАПРАВЛЕНИЙ — дословно те же, что на n26a (С2: экспозиция и свод называют
      группы одинаково).

      ЧИСЛА — `stend/zamery-k2/README.md`, тот же прогон, что и на n26a.

      ПОПРАВКА ПО НАПРАВЛЕНИЮ «СТАБИЛЬНОСТЬ ПРЕФИКСА» (убирает устаревшее «эффект кэша не подтверждён»).
      Прежняя формулировка опиралась на замер латентности через узел `chainLlm` (1178 мс против 794 мс)
      — это ВРЕМЯ ОТВЕТА, не метрика кэша: узел отдаёт наружу только текст и `executionTime`, поле `usage.cached_tokens`
      не видно вовсе, а латентность определяется сетью и очередью посредника, не попаданием в кэш (`stend/zamery-k2-kesh/README.md`,
      «Почему прежний замер ничего не мог показать»). Кроме того, модель того замера, `qwen/qwen-2.5-7b-
      instruct`, скидки за кэш у своего исполнителя не имеет вовсе — измерять там было нечего в принципе.
      Вопрос «работает ли кэш и от чего зависит» с тех пор измерен отдельно, через поле `usage` настоящего
      провайдера, а не через время ответа — 119 вызовов, пять провайдеров, результат не словом «не подтверждён»,
      а точным условием. Эта строка таблицы больше не несёт вывода про кэш — только факт, что ТАК кэш
      не измерить, и отсылку к тому, что вопрос решён правильным способом.

      Собственного числа у направления «стабильность префикса» в ЭТОЙ таблице больше нет — оно единственное
      из пяти, где заявленный результат оказался ошибкой устройства замера, а не находкой; остальные четыре
      сохранены как измерено.'
- id: n27
  file: slides/n27-k2-obobshchenie.md
  type: content
  duration_min: 1.5
  assertion: Текст, вставленный в промт целиком, имеет не только содержание, но и места — и для чтения,
    и для цены; оба свойства остаются и тогда, когда в промт попадает не вся база, а только найденный
    кусок
  learning_goal: 'Выводы кейса (К2-20, разбор 2026-10-29: прежний кадр «класс задачи — расположение пункта
    в промте» снят целиком — владелец назвал финал кейса неправильным). Два вывода — чтение и кэш, каждый
    со своей базой — плюс обязательная оговорка про применимость за пределами сегодняшней маленькой базы.'
  visual:
    pattern: content
    primary: 'Два вывода плашками друг под другом (чтение, цена), под ними — выделенная оговорка про применимость
      к большой базе и RAG, и закрывающая строка со счётом кейса.

      '
    backup: 'СТАРЫЙ КАДР СНЯТ ЦЕЛИКОМ (К2-20): «Класс задачи: расположение пункта в промте», framing вокруг
      теории Lost-in-the-Middle (Salvatore и соавторы) и привязка к оси занятия. Владелец назвал финал
      кейса неправильным прямо, без уточнения, что именно неверно, — снято всё, включая теоретическую
      врезку. Теоретическая часть (U-образная кривая как свойство обучения модели, не баг архитектуры)
      ПЕРЕЕХАЛА в пятый столбец разбора n21 (К2-6), где она уже стоит рядом с действием, которое объясняет,
      — повторно сюда не выносится.

      ДВА ВЫВОДА, не один: кейс проверил два разных свойства одного и того же текста — как оно ЧИТАЕТСЯ
      (внешнее измерение, Liu и соавторы, не наш прогон) и сколько оно СТОИТ (собственный прогон, 119
      вызовов, пять провайдеров). Разводить их обязательно: у первого нет своего числа на нашем материале,
      у второго есть, и смешивание выдало бы первое за измеренное.

      ОБЯЗАТЕЛЬНАЯ ОГОВОРКА (К2-2, К2-20): находки релевантны и тогда, когда база знаний больше промта
      и туда кладут только найденный кусок (RAG, Кейс следующего занятия) — список, собранный из кусков,
      имеет ту же физику расположения и ту же контрольную точку кэша, что список, лежащий в промте целиком.
      Разница только в том, кто решает, какие куски попадут в список, — не в том, действуют ли на этот
      список те же правила.

      СЧЁТ КЕЙСА закрывает сквозную линию этого занятия тем же способом, что у остальных пяти разборов:
      названо число случаев, названо число расхождений с ожиданием.'
- id: n28
  file: slides/n28-k2-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.5
  assertion: 'Держать базу знаний целиком в промте разумно, пока держатся три условия сразу: база мала,
