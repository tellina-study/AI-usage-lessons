- id: n54
  file: slides/n54-proval-zapret-srabotal-a-komanda-proshla.md
  type: failure_vignette
  duration_min: 1.0
  assertion: Хук внутри субагента вынес решение «запретить», а команда всё равно выполнилась — задокументировано
    два независимых случая; здесь границу не пересекает управляющий сигнал, не текст итога
  learning_goal: 'Второй провал кейса, глубже первого, о той же границе: там не пересёк границу текст
    итога, здесь не пересекает её сигнал, который обычно считают надёжнее содержания отчёта. Сработавший
    барьер — не то же самое, что барьер, который устоял'
  visual:
    pattern: failure_vignette_with_figure
    figure: subagent-n54-signal-ne-dohodit.png
    primary: 'Схема в две полосы. Ожидание: хук внутри субагента решает «deny» → решение поднимается к
      родителю → вызов остановлен. Факт: хук внутри субагента решает «deny» → решение не долетает до родителя
      → вызов исполняется. Разрыв отмечен на стрелке между субагентом и родителем. Под схемой — два коротких
      случая текстом, сжатых круга правок (замечание 5) до одной фразы на случай.'
    backup: 'Источник — section-2-subagent.md §A.2 «Провал» + section-2-subagent-part1b.md n54, дословно
      по содержанию. Фигура не менялась (круг 2, issue 225): подписи на схеме уже нейтральны и фактологичны
      («решение доходит/не доходит до родителя», «вызов остановлен/исполняется») — переработки под новую
      рамку не требуют. Фигура добавлена в прошлом круге: это центральный payoff кейса (управляющий сигнал
      тоже не всегда пересекает границу), и разрыв в сигнальном пути нагляднее как схема, чем как два
      абзаца подряд.'
- id: n55
  file: slides/n55-chego-ne-zakryvayut-format-i-zhurnal.md
  type: criteria_boundary
  duration_min: 1.0
