      A NAMED COLLISION, FLAGGED TO THE ORCHESTRATOR (not resolved silently). The owner''s review names
      FOUR pairs of options: "base at the start / at the end", "append to the end / move it", "frequent
      items to the start / to the end", "repeat the question before / after the base". This is NOT four
