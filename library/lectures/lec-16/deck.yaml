  - id: s38
    file: slides/s38-2020-crash-deepwater.md
    type: failure_case
    duration_min: 2
    assertion: "2020 oil crash — 107 000 рабочих мест за 6 месяцев (9,7% индустрии). Industry cyclicality > AI hype cycle. Deepwater Horizon 2010 — alarm bypass + 11 deaths + $60 млрд = 20% годовой выручки BP."
    learning_goal: "Cross-cutting failure: cyclicality + Deepwater Horizon anchor"
    failure_bucket: strict_in
    media_tier: 3

  # ===== Section 7 — Closing =====

  - id: s39
    file: slides/s39-synthesis-matrix.md
    type: keystone_synthesis
    duration_min: 1.5
    assertion: "4-квадрантный синтез + 10 documented failures. Когда AI работает: Q1 multiplier + Q2 essential. Когда осторожно: Q3 augmentation. Когда опасно: Q4 long-horizon + safety-critical SIS."
    learning_goal: "Synthesis: возврат к keystone + 10 failures recap"
    failure_bucket: strict_in
    media_tier: self_render

  - id: s40
    file: slides/s40-three-cornerstones.md
    type: framework
    duration_min: 1
    assertion: "3 cornerstone концепта для Лекции 17: (1) AI judgment как структурная задача; (2) альтернатива-как-исходный уровень; (3) industry cyclicality > AI hype cycle."
    learning_goal: "Bridge к Лекции 17 — systematization"

  - id: s41
    file: slides/s41-qa.md
    type: qa
    duration_min: 0.5
    assertion: "Q&A — 3-5 ключевых вопросов для exit ticket."
    learning_goal: "Q&A frame"

  - id: s42
    file: slides/s42-hero-methanesat-map.md
