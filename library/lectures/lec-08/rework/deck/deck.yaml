# library/lectures/lec-08/rework/deck/deck.yaml  --  часть 1 из 2
#
# Служебный манифест деки Лекции 8 «Узнавание стоило доверия бесплатно -- сколько оно
# стоит теперь». Issue #289 · ветка issue-289-lec-08-rework.
#
# ЧТО ЭТО. Опись 71 кадров деки со служебными полями на каждый: идентификатор,
# тип кадра, заголовок, адрес в главе (`chapter_ref`) и `timing_min`. Тайминг и
# методические поля живут ЗДЕСЬ и во фронтматтере файла кадра -- на видимом слое кадра
# они запрещены (CLAUDE.md § «No Timing / No Methodology in Slides»), переносить их
# туда нельзя.
#
# ЧЕМ ЭТО НЕ ЯВЛЯЕТСЯ -- входом сборки. `rendered/build_lec08.py` читает фронтматтер
# `slides/*.md` и не импортирует этот файл ни одной строкой -- то же устройство, что
# в Лекции 7, и та же причина: два описания одного состава способны разойтись, ничего
# не сломав, если одно из них читает сборка, а другое -- только человек. Поэтому
# КАЖДОЕ поле ниже выгружено из фронтматтера файла кадра программой, кроме одного --
# `chapter_ref`: в главе Лекции 8 маркеры `[for-slide-sNN]` есть (~90 штук). Фикс-раунд
# issue #289 (2026-10-24, consistency-checker P0) нашёл, что большинство из них
# указывали не на тот кадр, который носит их номер -- деку перенумеровывали несколько
# раз, а метки в тексте главы не обновлялись следом -- и пересчитал КАЖДЫЙ маркер по
# содержанию (абзац главы против `title`/`assertion` кадра), не подстановкой номера.
# Маркеры в самом тексте главы с тех пор тоже исправлены на верные номера -- `CHAP`
# ниже и маркеры в прозе главы теперь согласованы. Адрес каждого кадра здесь по-прежнему
# назначен чтением текста главы, а не автоматическим переносом значения маркера --
# метод не меняется оттого, что его результат теперь совпадает с текстом маркера.
#
# СОСТАВ, посчитанный с диска: 71 кадров, сквозная нумерация s01-s71, без
# вставленных кадров с буквенным хвостом (в отличие от Лекции 7, здесь порядок показа
# и нумерация кадров совпадают один в один).
#
# КАК ЧИТАТЬ ПОЛЕ `marks`: `in_bucket` -- кадр целиком внутри ведра провалов и границ
# (partial -> false) · `vfy` -- на кадре есть число под пересверку в день лекции ·
# `status` -- состояние файла кадра · `media_status` -- `wired` (поле `media`
# заполнено, кадр реально встаёт в сборку), `needs_media` (`media_needed` просит
# снимок/схему, но `media` ещё пусто -- на момент сборки этого манифеста таких 28
# из 71), `no_decision` (оба поля пусты).
#
# ЧАСТИ: deck.yaml (мета + Разделы 0-3, вход через релиз/приём аудиторией) ·
#        deck-part2.yaml (Разделы 4-7, права/кадровый рынок/сборка/закрытие + totals).

