      уже предъявлен тактом n71 и обобщён тактом n74, повторение здесь раздуло бы кадр без новой мысли.

      ОБЕ ОБЯЗАТЕЛЬНЫЕ ОГОВОРКИ СТОЯТ ЗАКРЫВАЮЩИМИ ПЛАШКАМИ, не сноской, обе вслух:

      (1) Квитанции синтетические — по SETKA, нюанс 5, первая половина: сделаны этой же сессией для демонстрации
      механизма на управляемом примере, не замер качества модели на потоке живых документов.

      (2) Ломаются оба поля, но при разной высоте символа — по SETKA, нюанс 3 (обновлён честным повтором
      2026-10-27, issue #299): дата ломается раньше, на восьмой доле (0 из 15, такт n71), сумма позже,
      только на самом мелком размере (0 из 5 на 53×64, такт n70); обобщать до «фотографии читаются плохо»
      измерение не позволяет.

      Граница — прямой формой, двумя колонками: правая опирается на устройство самого приёма (есть ли
      второй источник, читает ли решение человек), не на общие слова про применимость.'
- id: n75a
  file: slides/n75a-k6-svodka-tochnosti-kejsov.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Шесть кейсов измерили шесть разных вещей на разных базах и разных N — сравнивать их одной
    шкалой нечестно; но во всех шести лучший измеренный результат держался не на тексте, который модель
    пишет о себе, а на том, что проверяется отдельно от этого текста
  learning_goal: 'Правка владельца 2026-10-27 (issue #299), просьба повторена дважды: явное кросс-кейсовое
    сравнение точностей всех шести кейсов занятия в одном месте, которого в деке не было вовсе (n74 сознательно
    закрывает Кейс 6 без переклички). Методическая опасность названа прямо и снята оговоркой: шесть кейсов
    мерили разное — разные задачи, разные базовые линии, разные N — и единую шкалу «кейс X лучше кейса
    Y» строить нельзя. Форма — таблица «кейс · что измерено · число · N», без сортировки и без рейтинга.'
  visual:
    pattern: measured_outcome_table
    primary: 'Закрывающая оговорка-плашка сверху (шкалы не сравнимы, это не рейтинг), под ней таблица
      из шести строк — по кейсу: что именно измерено, число с протокола, размер выборки N. Снизу — одна
