    and in the results'), not apart from it. Row five is the mixture of experts (Z4).
  visual:
    pattern: measured_outcome_table
    primary: 'A table of five builds (no loop, code, judge, combination, mixture of experts): model, attempts/calls,
      calls per question, accuracy, cost. Below it, a banner on where the cost comes from, and a banner
      noting that the mixture of experts'' cheapness doesn''t match its reliability.

      '
    backup: 'Numbers — `stend/zamery-k1-k3/README.md`, § "Measurement 4 — Case 3, full 20×3 measurement":
      code/judge/combination each measured on 20 questions (executions 969–1031, `raw/zamer3-full-20.json`).
      The "no loop" row STAYS on the original 6 questions (executions 767–772) — it wasn''t part of the
      20×3 extension, and the table says so openly rather than hiding it. The "mixture of experts" row
      — `stend/zamery-k3-smes/README.md`, section "Lenient check → updated deck fixes" (the CURRENT version,
