  file: slides-en/n01-oblozhka-dostup-naruzhu-i-urezannye-prava.md
  type: hero_cover
  duration_min: 0.75
  assertion: An agent that knew everything about the project starts missing — the work has run past the
    edge of its context; the seminar breaks down the two opposite moves that push that edge outward, and
