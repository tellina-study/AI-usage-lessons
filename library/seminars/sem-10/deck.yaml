      реально собран). «Keyword overlap» считает ранжирование по словам ПЕРВЫМ узлом, используя уже готовые
      эмбеддинги корпуса из входной формы; «Embed query (OpenRouter)» считает эмбеддинг ТОЛЬКО вопроса
      (эмбеддинги документов уже посчитаны заранее, как и в Кейсе 1); «Cosine ranking (vector)» сравнивает
