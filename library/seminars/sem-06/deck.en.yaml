- id: n39
  file: slides-en/n39-praktika-raskladyvaem-zadachu-vmeste.md
  type: cobuilding
  duration_min: 3.0
  assertion: The task arrives as one sentence due Monday; the room lays it out into pieces and answers
    for each one what it depends on — and it turns out that three pieces out of six are independent, one
