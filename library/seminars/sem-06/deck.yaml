    pattern: problem_scenario
    primary: 'Два ряда: «было» — три прямоугольника подряд со стрелкой «ждём» между ними; «стало» — три
      прямоугольника в один ряд без ожидания между ними. Внизу подпись: итоги приходят примерно тогда
      же, когда пришёл бы один.'
    backup: Фактура (диф-ревьюер, три независимых изменения формы) — та же, что раньше стояла в сцене
      прежнего кейса о достоверности отчёта (section-2-subagent-otchet.md); круг 3 владельца прямо требует
