- id: n03
  file: slides/n03-os-predotvraschaem-ili-reshaem.md
  type: keystone_axis
  duration_min: 1.75
  assertion: 'Рядом с файлом инструкций ставят пять механизмов, и различаются они тем, кто приводит каждый
    в действие: среда, сам агент, внешняя система, отдельная роль, порядок работы'
  learning_goal: 'Словарь занятия: пять усилений, по строке на каждое. Слайд даёт залу слова, которыми
    тот ответит на следующий вопрос, и не говорит, какое усиление лучше и какие из них разбираются сегодня.
    Неприкосновенный слайд, не режется ни при каком дефиците времени'
  visual:
    pattern: keystone_scope_map
    primary: 'Светлый фон и коробка-таблица, не сетка PPTX. Ведущая строка — про то, что перед залом словарь,
      а не рекомендация. Под ней таблица на пять строк и две колонки: слева имя усиления, справа одна
      строка — что это такое. Все десять ячеек заполнены; пунктирных слотов на слайде нет. Замыкающей
      подписи нет: слайд кончается последней строкой таблицы.'
    backup: 'Круг 4, переписан целиком. Прежняя редакция — пустая таблица оси на пять строк и четыре колонки,
      где заполнены были только имена ступеней, а пятнадцать ячеек стояли пунктирными слотами. Владелец
      прочёл её вслух и назвал дословно: «нерастопная табличка с попыткой дать инструкцию… и в принципе
      не очень понятно, зачем это нужно, потому что что будет сегодня мы говорим через слайд, а здесь
      по идее должна быть подводка к следующему вопросу» (qa/zamechaniya-golosom-keysy-1-4.txt, 00:56
      и 01:12). Состав новой редакции продиктован там же, 01:42: «скорее, какую-нибудь в одну строчку
      дать краткое обозначение, что такое хук, скилл, субагент, процесс — и ребята, отталкиваясь от этого,
      дальше уже на следующем слайде давали бы ответы на вопросы». АДРЕС ЗАМЕЧАНИЯ: сводка qa/ZAMECHANIYA-VLADELTSA-ROUND4.md
      относит «нерастопную табличку» к слайду 4 — это ошибка сводки. В расшифровке фраза стоит внутри
      абзаца про третий слайд, и зачитанный там заголовок — заголовок этого слайда; таблицы на n04 и n05
      нет вовсе, а здесь она была. Формулировки хука и скилла взяты ДОСЛОВНО с баз механики n08 и n36
      — зал не должен услышать два разных определения хука за пять минут. MCP раскрывается при первом
      появлении (tools/editorial/README.md §3, правило безусловное). Порядок строк совпадает с порядком
      карточек на n04 и n67: на этом держится возврат вопроса в закрытии. Колонок «Вы ожидали / На деле»
      здесь больше нет — пустых ячеек на слайде не осталось, и пара живёт только на n65, где она переформулирована
      в «Что обещает устройство / Что показала проверка». Ось занятия при этом не исчезает: она остаётся
      на n65, где таблица заполнена на две строки из пяти, и сетап у неё теперь не пустые слоты, а пять
      определений. ТРЕТЬЯ КОЛОНКА, КРУГ 4: владелец — «надо проверить и явно указать в определениях —
      зависят ли рассматриваемые инструменты от кодинг-агента (надеюсь нет)». Пять формулировок взяты
      ДОСЛОВНО из research/perenosimost-stupeney.md §7 (вариант «третья колонка»; там же запасной вариант
      «вторым предложением в колонке „Что это“» на случай, если колонка не влезает — настоящим рендером
      проверено, что влезает). Здесь только ФАКТ, без объяснения: на этом слайде зал ещё не видел ни одного
      механизма, и объяснять разницу «приём против записи» ему пока нечем — объяснение стоит в закрытии
      на n65, разбор одного переноса целиком — на n64. Слот 1,50 → 1,75: колонка читается дольше (цена
      названа в §8 исследования). Проверено 2026-10-01 по 17 первоисточникам; ни одно утверждение не держится
      на вторичных обзорах.'
- id: n04
  file: slides/n04-vopros-chto-zaveli-by-pervym.md
  type: reflection_question
  duration_min: 1.5
  assertion: Выбор из пяти усилений, сделанный для этого репозитория и его состояния, а не вообще — и
    тот же вопрос прозвучит сегодня второй раз
  learning_goal: Первый открытый вопрос занятия — самодиагностика без подсказок, без цифр и без источников.
    Вопрос привязан к состоянию репозитория с предыдущего слайда; обещание второго предъявления стоит
    на слайде, а не в заметках, потому что на нём держится закрытие занятия
  visual:
    pattern: question_with_option_cards
    primary: 'Завязка — тихой формой реплики, две строки. Сам вопрос — дословно, крупно, в gold-рамке,
      вместе с обещанием второго предъявления: они читаются как одно обязательство. Под ними пять карточек-вариантов
      одним словом каждая, в том же порядке, что строки оси, ни одна не подсвечена. Ни цифры, ни источника,
      ни таблицы разбора, ни намёка на целевой ответ — воздух вокруг карточек оставлен намеренно.'
    backup: 'rework/section-0-otkrytie.md §A.5/§B.5. Привязка к репозиторию — дословно то, что напечатано
      на n02: форма заявки, тесты, двадцать строк инструкций; ничего сверх этого вопрос не предполагает.
      Второе предъявление того же вопроса с теми же карточками — n67; ВОПРОСИТЕЛЬНОЕ ПРЕДЛОЖЕНИЕ на двух
      слайдах совпадает знак в знак, иначе повтор не читается как повтор. Порядок карточек тот же, что
      порядок строк на n03. КРУГ 4: из подводки снято второе предложение «Перед вами пять усилений, каждое
      из которых превращает текст в то, что срабатывает само» — после переписывания n03 оно дублировало
      его целиком, строкой позже. Отсылки к предыдущему слайду на его месте нет намеренно: разговор про
      устройство занятия запрещён контрактом (AUTHOR-BRIEF.md §3 п. 5), а словарь зал только что видел
      и так. Вопросительное предложение и обещание второго предъявления не тронуты: владелец их не трогал,
      и на обещании держится закрытие. Плашка «разбор — на следующем слайде» печатается рендерером (build_sem05.py),
      снимает её сквозной прогон волны 4; в «## Visual» такой строки нет и не добавлено. Заметки этого
      слайда сознательно короткие: говорит зал (SECTION-SESSION-BRIEF.md § «ИСПРАВЛЕНИЕ правила о заметках»,
      п. 2).'
- id: n05
  file: slides/n05-karta-dve-stupeni-shest-razvilok.md
  type: lecture_map
  duration_min: 2.0
  assertion: 'Две ступени и шесть развилок: у каждой названа проблема, которую видит пользователь, и то,
    что на ней решается'
  learning_goal: 'Карта занятия: где мы и куда идём. Каждая развилка названа тем, что пользователь наблюдает,
    и тем, что на ней решается; на выходе репозиторий отличается от того, что на n02, ровно на две строки'
  visual:
    pattern: lecture_map
    figure: ramka-n05-karta.png
    primary: 'Схема figures/ramka-n05-karta.png во всю ширину: две ступени друг под другом, у каждой —
      имя и три развилки в ряд. У каждой развилки наблюдаемая проблема сверху и строка «решаем» под ней.
      Под ними во всю ширину — пунктирная рамка следующего занятия с тремя именами, у MCP расшифровка.
      Ни минут, ни ответов, ни методических пометок, ни плашек про каталог `.claude/`.'
    backup: 'Круг 4, три правки. ПЕРВАЯ: снята нижняя полоса «на входе: каталога .claude/ нет» → стрелка
      → «на выходе: .claude/» — «это совершенно бесполезная информация, убрать надо» (qa/zamechaniya-golosom-keysy-1-4.txt,
      04:40). Обе её половины зал уже знает: отсутствие каталога напечатано последней строкой дерева на
      n02, а появление — строкой под схемой, которую владелец оставил («наверное, оставил»). ВТОРАЯ: снята
      строка «Выбор на каждой развилке делает зал. Ответ предъявляется только после ответа зала» — правило
      А4, подсказок лектору на слайде быть не должно: «это же не инструкция преподавателя, это презентация…
      мне самому я прекрасно помню, что они должны сделать, а когда нужно будет, чтобы зал ответил на
      вопрос, я его задам» (05:13). Вторая половина этой строки была собственной починкой круга 3 — ею
      заменили проверяемо ложное обещание «ни на одной ответ не напечатан заранее» (qa/roast3-redaktor-metodika.md
      §2); со слайда она ушла В ЗАМЕТКИ, а не пропала, поэтому регресса нет: ложного обещания на слайде
      не осталось, честное звучит голосом. ТРЕТЬЯ: шесть развилок переименованы по А2 — от наблюдаемой
      пользователем проблемы, а не от решения. Два названия продиктованы владельцем дословно: кейс 1 «решаем,
      как заставить агент строго следовать наши процедуры» (03:46) и кейс 3 «решаем, что делать, когда
      агент стал работать медленнее и захуков» (04:40); остальные четыре собраны по тому же образцу. ЭТИ
      ШЕСТЬ СВЕРЕНЫ с заголовками дивайдеров n06, n16, n25, n34, n44, n55 сессией обобщения (круг 4, стык
      1 сверки): расходились пять строк из шести, правилась ЭТА схема, ни один дивайдер не тронут. Самое
      грубое расхождение — шестая строка: её боль была наблюдением ПЯТОГО кейса («тринадцать процедур
      лежат, двенадцать не срабатывают»), а решение — шестого, то есть строка была собрана из двух разных
      кейсов; нашла это сессия кейса 6. Вторая строка несла «когда вмешиваться и как жёстко» — остаток
      матричного аппарата клеток, снятого с n19 ещё в круге 4, то есть карта обещала развилку, которой
      в кейсе больше нет. Четвёртая называла целевой ответ словом «вынести» — ровно та утечка, из-за которой
      переименован сам дивайдер (backup n34). Верхняя строка каждой карточки теперь берётся из заголовка
      дивайдера слово в слово — та его половина, которая называет наблюдаемую проблему; нижняя называет,
      что на развилке решается, и ответа не содержит. Разбивка по строкам — в комментарии к блоку STEPS
      в rendered/make_figures_ramka.py. Артефакты ступеней — .claude/settings.json + .claude/hooks/ и
      .claude/skills/deploy/SKILL.md. Артефакты трёх ступеней следующего занятия здесь намеренно не называются.'
- id: n06
  file: slides/n06-divider-v-fayle-net-pro-vetki.md
  type: section_divider
  duration_min: 0.5
  assertion: 'Процедура работы с репозиторием записана в инструкциях и загружена, а коммит всё равно уходит
