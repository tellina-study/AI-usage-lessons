- id: n68
  file: slides/n68-k6-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: Модель `qwen/qwen3-vl-8b-instruct` читает фотографию пикселями и называет сумму с датой;
    код отдельно сравнивает прочитанное с суммой из текста заявки
  learning_goal: 'Правка 2026-10-29 (issue #299, stend/zamery-k6-edinyy): убран узел классического распознавания
    — на стенде фотография всегда идёт в модель пикселями, в обоих измеренных устройствах (двухшаговом
    и едином). Слой 1 такта «наше решение» называет модель прямо на кадре (С5) и показывает архитектуру,
