  visual:
    pattern: mechanism_node_graph
    figure: case-b-shema-postanovka.png
    primary: 'Схема С1 (как на кадре). Под ней — компактный список восьми групп корпуса, без таблицы (бюджет
      высоты).

      '
    backup: Схема — `rendered/make_figures_B.py::case_b_shema_postanovka()`. Корпус — `plan-peredelki/korpusa.md`
      §2.2 + `stend/zamery-B/razmetka.json` (сводка курации).
- id: n29
  file: slides/n29-razbor-tablitsa.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Полнота рассказа покупается выдумками, честность тегов — чужим словарём, точность полей —
    слепотой к непредусмотренному
  learning_goal: Разбор А5, четыре колонки, дословная форма владельца. Схему полей пишет сессия производства
    из своей разметки и вопросов Ольги, а не из головы — названо явно.
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица 4×4: действие × (как делает / преимущество / недостатки).

      '
    backup: Таблица — kejs-B-fotografii.md §4, дословно; модели и настройки — С5, указаны в каждой строке.
- id: n30
  file: slides/n30-mehanika.md
  type: content
  duration_min: 2.0
  assertion: Детектор не «плохо видит» доску — слова «доска» в его словаре нет вовсе; разметку-истину
    для сверки писал человек, до единого модельного вызова
  learning_goal: 'Механика такта: чьё решение — словарь 80 классов; откуда берётся истина для сверки (человек
    до модели, не модель-джадж другой модели, канон §8.12).'
  visual:
    pattern: content
    primary: 'Два примера бок о бок: один снимок, два ответа (рассказ и YOLO-теги). Плашка про разметку-истину
      снизу.'
- id: n31
  file: slides/n31-struktura-zamera.md
  type: test_structure_table
  duration_min: 1.5
  assertion: 40 снимков, три вызова на каждый, читаем глазами против разметки — не моделью-джаджем
  learning_goal: 'С2-1 (forma-keysa-s-zamerom.md): корпус, прогоны, метрики, лёгкий/трудный случай — до
    чисел замера, не вперемешку с ними.'
  visual:
    pattern: test_structure_table
    figure: case-b-light-hard.png
    primary: 'Короткая плашка трёх чисел замера (корпус · группы · прочтения). Основное место кадра —
      фигура лёгкого/трудного случая, у неё уже есть собственные подписи «лёгкий/трудный» пикселями; повторять
      их текстом рядом незачем. Модели вызова и список метрик — в заметках, не на кадре, чтобы схема не
      зажималась.

      '
    backup: 'Структура — kejs-B-fotografii.md §5. Фигура — `rendered/make_figures_B.py::case_b_light_hard()`,
      оба снимка `deck_allowed: true` в `razmetka.json`.'
- id: n32
  file: slides/n32-svod-zamera.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Детектор берёт 86,7% своего словарного потолка; рассказ не называет 56,2% строк разметки;
