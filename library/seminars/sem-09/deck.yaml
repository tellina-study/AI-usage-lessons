      надёжность.

      Связь с CLAUDE.md § AI-Failure & Judgment Content Rule: это и есть пример «здесь ИИ не нужен» —
      задача целиком вычислима, и правильный инженерный выбор не «защитить модель от инъекции», а «не
      отдавать модели то, что отдавать ей не нужно».'
