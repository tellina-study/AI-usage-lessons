      они все равнозначные». Для студента все шесть блоков — части ОДНОГО теста на 101 запрос, а не исходный/добавленный
      слой; деление на «исходные 51» и «новые 50» — факт ПРОИЗВОДСТВА (когда какие строки добавили в набор),
