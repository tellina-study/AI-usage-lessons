deck:
  seminar_number: 2
  title: "Семинар 2. Когда ИИ, каким и на чём"
  audience: "студенты-инженеры (практикующие, многие/все работают в ИТ, активно пользуются AI-чатами и вайбкодят) — семинар идёт после Лекции 1, до Лекций 2-3"
  format: "разбор_дискуссия"
  central_question: "Семь реальных кейсов — и в каждом ответ меняют вводные, которых не было в первой постановке"
  learning_outcomes: [LO1, LO7]
  lo_note: "Закрепляет LO1 (выбор типа AI-решения под задачу) и LO7 (обоснованная критическая проверка) из Лекции 1 — на уровне применения к реалистичным инженерным постановкам, а не повторения определений."
  language: ru
  pivot_note: "issue #182 — деck полностью заменяет пре-пивотный вариант (структура «воронка решений» с явным фреймворком, worksheet'ами и искусственными кейсами), возвращённый владельцем курса на REVISE. Новая структура — кейс-центричная: семь реалистичных кейсов, каждый со своим выбором; фреймворк не выпячивается, вопросники и памятки-процедуры убраны. Механика занятия — открытое обсуждение всей аудиторией (plenary), без малых групп и без формального подсчёта ответов."
  revision_note_v3: "issue #182 — третья ревизия (v2→v3) по 23 замечаниям владельца курса (GATE B REVISE). Ключевые изменения: расширенный реалистичный шум в каждой постановке и вводной; замена негативного кейса Epic Sepsis Model → CNET (арифметическая ошибка вместо повторного использования); подробный разбор NER/slovnet в quickfire логов; Kite/Copilot переведены в хронологический таймлайн + новый отдельный слайд про standalone-устройства (Humane AI Pin, Rabbit R1); схема-расширение v1→v2→v3 в кейсе 3 (приглушённые старые блоки + цветные новые) вместо ladder-полосы; замена «RAG и агент в проде» на Morgan Stanley (позитив) + Replit (негатив), Octomind сведён к футеру; объединённый слайд юрист+правовая карта на 3 юрисдикции (РФ/ЕС/США) вместо одной 420-ФЗ карточки; расширенный разбор локальной модели — T-lite/T-pro, 4-bit квантование, LoRA; замена JetBrains → Apple Intelligence + Google Gemini Nano; убраны все ladder-полосы («Разовый вызов → RAG → Агент», «Ход 1/2/3») по всей деке; заголовки убрали «из жизни», divider-слайды называются по теме выбора, а не по номеру кейса. 41 → 42 слайда."
  source_of_truth: "library/seminars/sem-02/brief.md + facilitator-guide.md + facilitator-guide-part2.md"

slides:
  - id: s01
    file: slides/s01-hero-cover.md
    type: hero_cover
    assertion: "Семинар 2. Когда ИИ, каким и на чём"
    learning_goal: "Emotional hook + hero-иллюстрация: сегодня разбираем реальные инженерные решения, а не схему"
    visual:
      pattern: hero_cover_real_photo
      backup: assets/screenshots/s01-*.jpg

  - id: s02
    file: slides/s02-four-choices.md
    type: assertion_visual
    assertion: "Сегодня — четыре выбора, семь кейсов"
    learning_goal: "Обзор занятия простым списком: четыре типа выбора + состав кейсов, без схемы-процедуры"
    visual:
      pattern: four_choices_list_plus_seven_cases

  - id: s03
    file: slides/s03-case1-divider.md
    type: section_divider
    assertion: "ИИ или обычный код?"
    learning_goal: "Visual divider — переход в кейс 1, тема выбора вместо номера кейса"
    visual:
      pattern: section_divider_plain

  - id: s04
    file: slides/s04-case1-setup.md
    type: case_study
    assertion: "Бухгалтерия тонет в накладных поставщиков — можно автоматом?"
    learning_goal: "Постановка кейса 1 — живая реплика продакта с шумом, два примера + целевая таблица 1С"
    visual:
      pattern: three_document_cards_plus_question

  - id: s05
    file: slides/s05-case1-intro2.md
    type: case_study
    assertion: "Прислали ZIP на 4,2 ГБ — и форматы разъехались"
    learning_goal: "Вводная-факт без выводов — только новая деталь и вопрос"
    visual:
      pattern: scattered_formats_cards_plus_question

  - id: s06
    file: slides/s06-case1-verdict.md
    type: case_study
    assertion: "Гибрид: LLM извлекает, код проверяет. Изучайте данные, не верьте на слово"
    learning_goal: "Разбор кейса 1 — LLM-извлечение + жёсткая валидация кодом; урок про размер выборки"
    visual:
      pattern: hybrid_pipeline_illustration

  - id: s07
    file: slides/s07-quickfire-logs.md
    type: case_study
    assertion: "Персоналка в логах — как максимально быстро и дёшево очистить?"
    learning_goal: "Quickfire постановка с шумом — вопрос про скорость и цену"
    visual:
      pattern: single_card_plus_question

  - id: s08
    file: slides/s08-quickfire-logs-verdict.md
    type: case_study
    assertion: "Regex для телефонов и email, компактный NER для имён в свободном тексте"
    learning_goal: "Разбор quickfire — граница между детерминированным методом и малой моделью проходит внутри одной задачи"
    visual:
      pattern: two_column_split_verdict

  - id: s09
    file: slides/s09-cnet-ramp.md
    type: case_study
    assertion: "Когда нужна была формула — и когда ИИ закрыл нерешаемое"
    learning_goal: "Арифметическая ошибка LLM там, где нужна детерминированная формула, vs замена ручной обработки с мизерным покрытием"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s10
    file: slides/s10-case2-divider.md
    type: section_divider
    assertion: "Встроить или делать своё?"
    learning_goal: "Visual divider — переход в кейс 2, тема выбора вместо номера кейса"
    visual:
      pattern: section_divider_plain

  - id: s11
    file: slides/s11-case2-setup.md
    type: case_study
    assertion: "ИИ-помощник для операторов техподдержки — подсказки ответов, поиск похожих обращений"
    learning_goal: "Постановка кейса 2 — живая реплика с шумом, операторы живут в helpdesk весь день"
    visual:
      pattern: single_card_plus_question

  - id: s12
    file: slides/s12-case2-intro2.md
    type: case_study
    assertion: "Коробочный helpdesk без открытого API — систему купили 4 года назад"
    learning_goal: "Вводная — реплика ИТ-директора с шумом, без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s13
    file: slides/s13-case2-verdict.md
    type: case_study
    assertion: "Сбоку, смена вендора или пересмотр задачи — единственно верного ответа нет"
    learning_goal: "Разбор кейса 2 — 3 варианта с ценой каждого, намеренная неоднозначность + когда какой выбирают на практике"
    visual:
      pattern: three_option_cards_with_cost

  - id: s14
    file: slides/s14-quickfire-product-descriptions.md
    type: case_study
    assertion: "Отдельный ИИ-сервис для описаний товаров — хорошая идея?"
    learning_goal: "Quickfire постановка с шумом — только вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s15
    file: slides/s15-quickfire-product-verdict.md
    type: case_study
    assertion: "Кнопка в существующей админке каталога, а не отдельный сервис"
    learning_goal: "Разбор quickfire — встроенность побеждает отдельный продукт; когда отдельный сервис оправдан"
    visual:
      pattern: single_card_verdict

  - id: s16
    file: slides/s16-kite-vs-copilot.md
    type: case_study
    assertion: "17 месяцев на одном рынке — Kite закрылся, Copilot дошёл до 90% Fortune 100"
    learning_goal: "Коммерческая цена архитектурного выбора встроить или своё, показанная хронологией"
    visual:
      pattern: timeline_horizontal

  - id: s17
    file: slides/s17-standalone-devices.md
    type: case_study
    assertion: "Отдельное устройство против фичи в телефоне"
    learning_goal: "Тот же организационный урок на другом масштабе — устройство конкурирует с привычкой не переключаться"
    visual:
      pattern: two_device_cards_plus_photo

  - id: s18
    file: slides/s18-case3-divider.md
    type: section_divider
    assertion: "Разовый вызов, RAG или агент?"
    learning_goal: "Visual divider — переход в кейс 3, тема выбора вместо номера кейса"
    visual:
      pattern: section_divider_plain

  - id: s19
    file: slides/s19-rag-schema.md
    type: assertion_visual
    assertion: "RAG одним потоком: вопрос → поиск по базе → фрагменты в контекст → ответ"
    learning_goal: "Интуиция RAG за один абзац перед кейсом, где она понадобится"
    visual:
      pattern: horizontal_flow_4_steps

  - id: s20
    file: slides/s20-agent-schema.md
    type: assertion_visual
    assertion: "Агент циклом: план → инструмент → проверка → дальше"
    learning_goal: "Интуиция агента за один абзац перед кейсом, где она понадобится"
    visual:
      pattern: circular_flow_4_steps

  - id: s21
    file: slides/s21-case3-setup.md
    type: case_study
    assertion: "После созвона транскрипт приходит письмом — нужен протокол: решения, поручения, сроки"
    learning_goal: "Постановка кейса 3 — живая реплика с шумом, транскрипт целиком помещается"
    visual:
      pattern: single_card_plus_question

  - id: s22
    file: slides/s22-case3-verdict1.md
    type: case_study
    assertion: "Схема v1: письмо с транскриптом → вызов модели с шаблоном → протокол"
    learning_goal: "Разбор постановки — один разовый вызов, ни хранилища, ни цикла"
    visual:
      pattern: schema_v1_single_call

  - id: s23
    file: slides/s23-case3-intro2.md
    type: case_study
    assertion: "Протоколы копятся в общей папке — что мы решали по подрядчику X в мае?"
    learning_goal: "Вводная-поиск — реплика без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s24
    file: slides/s24-case3-verdict2.md
    type: case_study
    assertion: "Схема v2: растущий архив требует RAG — поиск по базе поверх разового вызова"
    learning_goal: "Разбор вводной 1 — рост базы обосновывает RAG, схема видимо расширяет schema v1"
    visual:
      pattern: schema_v2_expansion

  - id: s25
    file: slides/s25-case3-intro3.md
    type: case_study
    assertion: "Половина поручений из майских протоколов до сих пор без исполнителя"
    learning_goal: "Вводная-поручения — реплика без выводов, только факт и вопрос"
    visual:
      pattern: fact_card_plus_question

  - id: s26
    file: slides/s26-case3-verdict3.md
    type: case_study
    assertion: "Схема v3: действие во внешней системе — нужен агент поверх RAG"
    learning_goal: "Разбор вводной 2 — действие во внешней системе обосновывает агента; итоговый урок"
    visual:
      pattern: schema_v3_expansion

  - id: s27
    file: slides/s27-quickfire-digest.md
    type: case_study
    assertion: "Дайджест по чатам и почте — какая архитектура нужна?"
    learning_goal: "Quickfire постановка с шумом — только вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s28
    file: slides/s28-quickfire-digest-verdict.md
    type: case_study
    assertion: "Агент нужен — обход источников; RAG не нужен — нет произвольного запроса к большой базе"
    learning_goal: "Разбор quickfire — частая ошибка: RAG путают с «много источников»"
    visual:
      pattern: two_column_needed_not_needed

  - id: s29
    file: slides/s29-rag-agent-in-prod.md
    type: case_study
    assertion: "RAG и агент в проде: Morgan Stanley — успех; Replit — провал"
    learning_goal: "Успешный RAG в масштабе vs агент, нарушивший прямую инструкцию в проде"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s30
    file: slides/s30-case4-divider.md
    type: section_divider
    assertion: "Внешний API или локальный инференс?"
    learning_goal: "Visual divider — переход в кейс 4, тема выбора вместо номера кейса"
    visual:
      pattern: section_divider_plain

  - id: s31
    file: slides/s31-case4-setup.md
    type: case_study
    assertion: "Карточка звонка: потребность, возражения, договорённости — как это построить?"
    learning_goal: "Постановка кейса 4 — живая реплика с шумом"
    visual:
      pattern: single_card_plus_question

  - id: s32
    file: slides/s32-legal-map.md
    type: case_study
    assertion: "Персональные данные в записях — и правовая карта трёх юрисдикций"
    learning_goal: "Реплика юриста с контекстом появления + карта регулирования РФ/ЕС/США"
    visual:
      pattern: quote_card_plus_three_jurisdiction_cards

  - id: s33
    file: slides/s33-case4-intro2.md
    type: case_study
    assertion: "Нет GPU-сервера и бюджета. Нужны пять полей в CRM, не беседа"
    learning_goal: "Вводная 2 — две реплики с фоновым шумом, без выводов"
    visual:
      pattern: two_quote_cards_plus_question

  - id: s34
    file: slides/s34-case4-verdict.md
    type: case_study
    assertion: "Задача сузилась до шаблона — локальная модель 7-8 млрд параметров справляется"
    learning_goal: "Разбор вводной 2 — что именно раскопал инженер про малые модели; двойной урок сложности и чувствительности"
    visual:
      pattern: single_card_plus_dual_lesson

  - id: s35
    file: slides/s35-samsung-apple-gemini.md
    type: case_study
    assertion: "19 дней от разрешения ChatGPT до трёх утечек в Samsung. Малые модели уже в кармане"
    learning_goal: "Негативный пример утечки + позитивный пример on-device моделей у половины аудитории"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s36
    file: slides/s36-your-task.md
    type: assertion_visual
    assertion: "У кого есть похожая задача с работы?"
    learning_goal: "Открытое приглашение перенести метод занятия на реальную задачу аудитории — без worksheet"
    visual:
      pattern: open_invitation_illustration

  - id: s37
    file: slides/s37-lessons.md
    type: summary
    assertion: "Что унести: уроки семи кейсов"
    learning_goal: "Итоговая компиляция — по одной строке-уроку на кейс, прослеживаемо к разборам"
    visual:
      pattern: seven_lesson_lines

  - id: s38
    file: slides/s38-homework-reading.md
    type: summary
    assertion: "Домашнее чтение: Klarna, NYC MyCity, бонус Tahoe за $1"
    learning_goal: "Необязательное чтение, закрывающее несколько выборов на одном длинном примере"
    visual:
      pattern: three_reading_cards

  # резерв — показываются только при остатке времени (лестница резерва, guide part2)
  - id: s39
    file: slides/s39-reserve-klarna.md
    type: case_study
    reserve: true
    assertion: "Klarna, 2023-2025: одна история — четыре развилки"
    learning_goal: "Резерв: применить все четыре типа выборов целиком к одному длинному публичному кейсу"
    visual:
      pattern: four_row_case_breakdown

  - id: s40
    file: slides/s40-reserve-dedup-setup.md
    type: case_study
    reserve: true
    assertion: "Дедупликация новостей — нужно склеивать сообщения об одном событии в одну карточку"
    learning_goal: "Резервный quickfire — постановка и вопрос"
    visual:
      pattern: single_card_plus_question

  - id: s41
    file: slides/s41-reserve-dedup-verdict.md
    type: case_study
    reserve: true
    assertion: "Fuzzy-matching закрывает ~90% случаев дешевле и предсказуемее. LLM — на остаток"
    learning_goal: "Резерв: возврат к границе regex/модель на новом материале"
    visual:
      pattern: two_card_setup_vs_split_verdict

  - id: s42
    file: slides/s42-hero-closing.md
    type: hero_closing
    assertion: "Сегодня вы решали, что строить. Лекция 2 — как модель устроена внутри"
    learning_goal: "Bridge к Лекции 2; emotional payoff"
    visual:
      pattern: hero_closing_bridge_photo
      backup: assets/screenshots/s42-*.jpg
