      Вердикта «версия 2 лучше» на слайде нет сознательно: обе цены названы, критерий — такт n17.

      МОДЕЛЬ НАЗВАНА И НА РЕЗУЛЬТАТЕ (С5, правка 2026-10-29), не только на реализации (n10, n11, n13a,
      n14, n15): `qwen/qwen-2.5-7b-instruct`, одна и та же для обеих версий, без явно заданных настроек.'
- id: n17
  file: slides/n17-k1-obobshchenie-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.5
  assertion: Решение «отвечать или передать» выносится в отдельное поле тогда, когда ответ уходит человеку
    без второго чтения; проверяемость решения — не то же самое, что его правильность
  learning_goal: 'Обобщение и граница Кейса 1 прямой формой (А7): «когда нужно · когда не нужно», с названным
    пределом самого приёма и с документированным случаем, где та же ошибка стоила иначе. Первая строка
    оси занятия закрывается здесь.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Критерий отдельной плашкой наверху, под ним таблица в два столбца «когда нужно · когда не
      нужно» — строго под противопоставление, — затем плашка предела приёма, плашка документированного
      случая с парой «было → стало» одним блоком, и строка закрытия первой строки оси занятия.

      '
    backup: 'Критерий — по SETKA-KEYSOV-S9.md, раздел «Кейс 1», подраздел «Обобщение», переносимая формулировка
      без имени инструмента.

      Обе колонки таблицы опираются на СОБСТВЕННОЕ измеренное: 2 обрыва из 15 у строгого вывода и 0 из
      5 перефразировок у точного совпадения на прошлом занятии.

      ВНЕШНИЙ СЛУЧАЙ ВОЗВРАЩЁН НА КАДР решением оркестратора по ходу волны. Первая редакция этого слайда
      его не несла — по указанию, которое оркестратор затем отменил как свою же ошибку: отклонён владельцем
      был Air Canada (2026-10-24, «уже несколько раз был этот пример»), и открытый пробел остаётся только
      для случая из ИНЖЕНЕРНОЙ практики. Границу Кейса 1 держит Obermeyer и соавторы, 2019 (`10.1126/science.aax2342`),
      как и назначено ARCHITECTURE.md §6 и тактом «Нюансы» сетки, пункт 3.

      Числа взяты из раздела «Доснято оркестратором 2026-10-24» в конце CHISLA-SVERENO.md, где все шесть
      утверждений имеют статус СВЕРЕНО по прочитанному целиком первоисточнику (PDF, 9 страниц). Пометки
      «по вторичному пересказу» на слайде НЕТ и быть не должно: строка 30 таблицы того же файла, которая
      её требовала, отменена 2026-10-24 и сама отсылает к этому разделу.

      На кадр взято ровно то, что несёт такт: что предсказывали вместо чего, пара «было → стало» одним
      блоком (48 772 → 7 758, это и есть 84%), и несущая строка — правка не меняла ни модель, ни обучение,
      ни признаки, ни выборку. Остальное из пункта 3 сетки (26,3% при равном балле, 4,8 против 3,8 заболеваний,
      воспроизведение производителем на 3 695 943 пациентах) сознательно НЕ вынесено: четыре числа на
      закрывающем кадре перестают читаться, а 4,8 против 3,8 — ровно та пара похожих чисел в одной фразе,
      которую запрещает БРИФ §2. Эти подробности живут в заметках ведущего и в сетке.

      Масштаб ставки назван нашим собственным числом — «двадцать заявок в день» из сцены n06, а не «сорок»
      из пункта 3 сетки: сцена занятия говорит двадцать, и кадр обязан сходиться с ней, а не с черновиком.
      Расхождение вынесено оркестратору отчётом.

      ОТКРЫТЫЙ ПУНКТ, здесь не закрытый молча: документированного случая из ИНЖЕНЕРНОЙ практики под эту
      границу по-прежнему нет — Air Canada отклонён, замены не подобрано, выдумывать запрещено (§4.3 канона).

      Предел приёма назван прямой строкой, а не оговоркой в конце: поле делает решение проверяемым, но
      не делает его верным — это ровно то, что измерено на n16 (4 из 15 прошли проверку с неверным содержанием).'
- id: n18
  file: slides/n18-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Часть ответов уходит неверной не потому, что нужного пункта нет в справочнике, а из-за того,
    в каком месте промта он лежит
  learning_goal: 'Дивайдер Кейса 2 (переименован К2-1: «База знаний в промте» → «Оптимизация промта» —
    прежнее название занято Кейсом 1 и означало там другое). Форма текста — ЦИФРА (БРИФ §4a, П3). Цифра
    здесь — постановка (сколько уходит в модель при каждом обращении), не итог замера.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, пара чисел крупно одной плашкой — вопрос клиента против справочника, который
      уходит вместе с ним. Внизу дорожка шести кейсов занятия, второй подсвечен.

      '
    backup: 'ПЕРЕИМЕНОВАНИЕ (К2-1, разбор владельца 2026-10-29). Прежнее название «База знаний в промте»
      снято: оно уже занято Кейсом 1 (там база знаний — предмет первого разбора) и обозначало там другое.
      Новое имя — «Оптимизация промта» — называет само действие, которым кейс занят: не «база растёт»,
      а «промт с этой базой нужно собирать правильно».

      СМЫСЛ КЕЙСА ПЕРЕПИСАН (К2-2, К2-3). Прежняя рамка — «справочник растёт, непонятно, куда класть новый
      пункт» — снята как слишком мягкая. Настоящая рамка: ПРОБЛЕМА — часть ответов уходит неверной; ИСТОЧНИК
      — эту неверность даёт сам справочник, а не его отсутствие (именно это и показывает разбор n21: пункт,
      который в справочнике ЕСТЬ, может быть прочитан хуже, чем его отсутствие вовсе); ПРЕДПОЛОЖЕНИЕ —
      промт нужно оптимизировать: как справочник лежит, где расположен, как с ним работают. Справочник
      при этом растёт и ВСЁ ЕЩЁ целиком помещается в промт — это не кейс про маленькую базу ради простоты,
      это кейс про текст, у которого есть физика расположения независимо от размера: то же самое работает
      и тогда, когда база больше промта и в него попадает только найденный кусок (RAG) — собранный промт
      всё равно нужно укладывать оптимально.

      Дивайдер проблему НАЗЫВАЕТ (А2), но не выдаёт механизм (почему именно расположение портит ответ)
      и не выдаёт измеренный результат — это разбор n21 и дальше.

      ОТКУДА ЧИСЛА. Оба посчитаны по настоящему тексту промта — `stend/zamery-k2-kesh/baza.py` (10 настоящих
      пунктов Кейса 2) и `stend/sborka.py`, функция `kb_text`. Справочник как он стоит в промте (заголовок
      плюс десять пунктов полным текстом) — 229 слов, 1665 знаков (`stend/zamery-k2-kesh/README.md`, Таблица
      7). Вопрос в плашке — настоящий вопрос первого прогона Кейса 1 (`stend/README.md`, `IN_KB_QUESTIONS`),
      шесть слов.

      Это НЕ измерение поведения модели: ни одного прогона за этими двумя числами не стоит, они описывают
      размер того, что уходит в модель. Собственный замер у Кейса 2 ТЕПЕРЬ ЕСТЬ (К2-19, см. такты дальше
      — 119 вызовов на пяти провайдерах про кэш плюс 84 вызова про пять направлений структурирования)
      — но не на этом кадре, дивайдер его не предъявляет.

      Название в дорожке кейсов `rendered/deck-config.yaml` (`case_track`) требует синхронной правки тем
      же переименованием — вынесено оркестратору отдельно.'
- id: n19
  file: slides/n19-k2-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга дописывает в справочник новые темы по следам вопросов, на которые процесс не ответил
    — и каждый дописанный пункт уезжает к модели вместе со всеми остальными тем же текстом, в котором
    едет вопрос клиента
  learning_goal: 'Такт сцены Кейса 2 (переименован К2-1: «Оптимизация промта»): живая постановка потребности
    Ольги плюс схема С1 — сплошным существующий процесс, пунктиром то, что в этом кейсе добавляется (Ольга
    руками дополняет справочник, который дальше входит в вызов модели как часть промта). Без версии решения
    и без внешних чисел: это постановка, а не разбор.'
  visual:
    pattern: problem_scenario
    primary: 'Сверху — компактная схема С1: сплошной линией заявка → классификация → модель отвечает по
      справочнику → ответ (уже существующий процесс, не меняется). Отдельно, пунктиром, сбоку — «Ольга
      руками дополняет справочник», стрелка от этого блока входит в блок «модель отвечает»: это и есть
      то, что в кейсе предстоит рассмотреть — как содержимое справочника попадает в вызов. Дальше — рамка-врезка
      с обстановкой, пронумерованная хронология роста справочника, закрывающая плашка про цену и реплика-просьба
      Ольги. Ни одного числа прогона на кадре нет.

      '
    backup: 'СХЕМА С1 ДОБАВЛЕНА (разбор 2026-10-29, К2-4): прежде кадр открывался прямо рамкой-врезкой
      без схемы процесса — нарушение С1 (`forma-keysa-s-zamerom.md` §2), отмеченное в BRIEF §2a как нарушенное
      в Кейсе 2. Схема рисуется текстовым блоком (строчными панелями, без отдельного PNG): готового файла-фигуры
      под этот такт в БРИФ §5 не закреплено, а заводить новую фигуру при живом производстве — отдельное
      решение оркестратора по дизайну; вынесено отчётом. Решение дотянуть схему до PNG — за designer-проходом.

      Пунктирный блок специально назван ДЕЙСТВИЕМ Ольги, а не свойством процесса: «Ольга руками дополняет
      справочник» — то, что в этом кейсе кейс и разбирает (как это дополнение физически оказывается в
      вызове модели), а не новый узел на холсте. На холсте, который зал видел в Кейсе 1, пунктирного блока
      нет и не появится — K2-22/n24 отдельно говорит, что холст не меняется вовсе.

      Потребность — из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подразделы «Форма входа» и «Постановка»: Ольга
      пополняет справочник (программа лояльности, скидка за друга, демо-занятие), новый пункт дописывается
      в конец текущего списка, порядок попадания пунктов в промт никого не беспокоит.

      Три новые темы названы ровно те, что в сетке, и они же — три вопроса вне базы из первого прогона
      Кейса 1 (`stend/sborka.py`, `OUT_OF_KB_QUESTIONS`). Шов внутри занятия получается без натяжки: зал
      эти три вопроса уже видел на экране разбора «Отвечать или промолчать».

      Персонаж — Ольга, администратор учебного центра (А13), и тот же объём работы, что в сцене Кейса
      1 (`n06-k1-stsena.md`): двадцать заявок в день.

      РАМКА ПЕРЕСТАВЛЕНА НА НОВУЮ ПРОБЛЕМУ (К2-2, К2-3): сцена теперь явно говорит, что дело не только
      в новых пунктах — часть ответов на старые, давно существующие пункты, может уходить неверной из-за
      их места в списке. Это НЕ измерено на кадре сцены — утверждение принадлежит разбору (n21) и там
      и измерено; здесь оно названо как потребность, которую Ольга формулирует вопросом, а не как наш
      опыт.

      ЧЕГО ЗДЕСЬ СОЗНАТЕЛЬНО НЕТ. Сетка в «Форме входа» говорит сильнее: «база выросла, и ответы стали
      хуже на том, что в ней ЕСТЬ». Числа под это утверждение приходят внешним измерением (Liu и соавторы,
      разбор n21) — на кадре сцены внешнего имени нет, оно появляется там, где и измерено.

      Вынесено оркестратору отчётом: смягчение формы входа сохранено с прежней редакции (число не наше),
      переставлена рамка проблемы (К2-3).'
- id: n20
  file: slides/n20-k2-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре способа расположить растущий справочник — от «не думать об этом вовсе» до «не держать
    его в промте»
  learning_goal: 'Вопрос Кейса 2 (переименован К2-1: «Оптимизация промта»): голые карточки-действия, без
    вердиктов, без цены, без состава решения (А6). Формулировки уточнены К2-5: каждый вариант явно называет
    свой бинарный выбор (куда перенести, до или после), а не общее направление без адреса.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      слева «порядок не выбирается вовсе», справа «справочника в промте нет». Пояснений, доводов против
      и пометок на карточках нет — разбор следующим экраном.

      '
    backup: 'ФОРМУЛИРОВКИ УТОЧНЕНЫ (К2-5, разбор 2026-10-29). Прежняя редакция называла направление без
      адреса («переносить важное к началу или концу» без указания, что это выбор между двумя конкретными
      местами; «повторять вопрос вокруг списка» без указания, что можно повторить только до, только после
      или с двух сторон). Новая редакция называет КОНКРЕТНЫЙ бинарный выбор внутри каждой карточки — это
      ближе к тому, что потом разбирается числом на n21.

      НАЗВАННАЯ КОЛЛИЗИЯ, ВЫНЕСЕНА ОРКЕСТРАТОРУ (не решена молча). Разбор владельца называет ЧЕТЫРЕ пары
      вариантов: «база в начале / в конце», «дописывать в конец / переносить», «частые пункты в начало
      / в конец», «повторять вопрос до / после базы». Это НЕ четыре независимые карточки первого порядка
      — «база в начале промта целиком / база в конце промта целиком» (сразу после указания vs сразу перед
      вопросом клиента) — это отдельное архитектурное решение про место САМОГО СПИСКА, ортогональное трём
      остальным, которые про порядок ПУНКТОВ внутри списка. Два варианта прочтения: (а) добавить «база
      в начале/в конце» пятой карточкой — тогда голосование становится про два разных вопроса сразу, и
      зал выбирает одно из пяти, не зная, что выбирает по двум осям; (б) оставить четыре карточки про
      порядок ПУНКТОВ (как сейчас), а вопрос «где стоит список целиком» перенести в такт решения (n22),
      где он и обсуждается explicитно (К2-7, К2-8). Выбран вариант (б): он сохраняет карточки голосуемыми
      действиями (А6) и не плодит пятый вариант, который на самом деле отвечает на другой вопрос. Решение
      вынесено оркестратору на подтверждение.

      Карточки — по смыслу из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Вопрос»; формулировки уточнены
      этой правкой, не переписаны по сути.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не перечисляет состав собираемого решения, нигде не сказано, сколько
      вариантов разумных. Внешние измерения (середина списка, кэш) на этом экране не стоят вовсе — им
      место в тактах n21, n25 и дальше.

      Отдельная проверка на четвёртой карточке: слова «следующее занятие», «отдельное хранилище» и имени
      приёма на ней НЕТ. Назвать её завтрашней темой значит пометить её как заведомо правильную и снять
      с голосования — это тот же вред, что вердикт на карточке, только вежливее одетый. Чем она является
      для дуги, говорит такт границы (n28).

      Проверка на рамку факта: в каждую карточку подставляется повелительный глагол — «дописывать», «переносить»,
      «повторять», «искать». Ни одна не превращается при этом в утверждение о свойстве модели («модель
      хуже читает середину») — все четыре остались действиями со справочником.

      Порядок карточек — спектр, а не вразнобой: первая не выбирает порядок вовсе, вторая делает порядок
      решением, третья пытается обойти вопрос порядка повтором, четвёртая убирает справочник из промта.'
- id: n21
  file: slides/n21-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.25
  assertion: Три из четырёх способов оставляют справочник внутри промта — и тогда расположение пункта
    в списке остаётся свойством процесса, выбранным или доставшимся по истории
  learning_goal: 'Разбор сразу за вопросом (А1), 5-колоночная форма — к форме А5 (действие · как делает
    · преимущество · недостатки) добавлена пятая колонка «что показывает исследование» (К2-6, разбор 2026-10-29:
    теоретические выкладки отдельным столбцом — в прежней 4-колоночной форме они терялись внутри «недостатков»
    и не считывались). Без вердиктов «верно/неверно». Внешние измерения названы по имени работы — собственного
    прогона у этого разбора нет.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки · что показывает исследование.
      Пять строк — четыре действия и строка «база в начале / в конце промта» отдельно под таблицей, колонки
      вердикта нет — решение следующим экраном. Несущая пара чисел набрана плашкой, чтобы читалась одним
      блоком, а не выискивалась внутри ячейки.

      '
    backup: 'НАЗВАННАЯ КОЛЛИЗИЯ С А5 (вынесена оркестратору, не решена молча). А5 закрепляет ровно четыре
      колонки дословной формулировкой владельца (issue #274). К2-6 этой же правки просит отдельный столбец
      для теории. Разрешение здесь — пятая колонка добавлена ЭТОМУ разбору явно по новому требованию той
      же правки: её нет у разборов других кейсов, расширение не предлагается как общее правило. Та же
      коллизия уже названа канонически для С6 (`forma-keysa-s-zamerom.md` §12.2) — пятый столбец здесь
      решает её тем же способом, которым предложено решать столбец числа: пятая колонка внутри формы А5,
      не вынесенная плашка рядом.

      Текст разбора сведён из SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Разбор», и уложен в 5-колоночную
      форму без переписывания по сути. Формулировки действий синхронизированы с К2-5 (бинарный адрес выбора
      внутри каждого действия, см. n20).

      ЧИСЛА И ИХ ИСТОЧНИК. Пара чисел на кадре — 56,1% закрытой книги и разброс больше 20 процентных пунктов
      по положению документа — CHISLA-SVERENO.md, строка 42 (Liu и соавторы, arXiv:2307.03172, статус
      «сверено ранее оркестратором», на слайд «как есть»). База к числу названа прямо в той же ячейке:
      56,1% — это ответы той же модели, когда ей не дают НИ ОДНОГО документа, и именно с этим сравнивается
      документ, положенный в середину. Из `research/*` не взято ничего (БРИФ §2).

      Пятый столбец несёт ИМЕННО теоретическую рамку: что из этого следует про МЕХАНИЗМ (учили модель
      так-то → эффект такой-то), не числа — числа остаются в «преимуществе»/«недостатках», где они уже
      были и где их видно рядом с конкретным действием.

      Третья строка (повтор вопроса вокруг списка) оставлена почти без чисел сознательно: оба наблюдения
      — из той же работы Liu и соавторов, но отдельной строки в CHISLA-SVERENO.md под них нет, потому
      что сверка шла по числам, а эти два утверждения качественные. Ставить их с цифрой значило бы занести
      несверенное число на кадр. Вынесено оркестратору отчётом.

      СОБСТВЕННОГО ПРОГОНА ЗА ЭТОЙ ТАБЛИЦЕЙ НЕТ, и ни одна ячейка не притворяется нашим опытом: везде,
      где стоит измерение, названо имя работы.

      Четвёртая строка НЕ названа «следующим занятием» и не помечена как правильная: на разборе она разбирается
      наравне с тремя остальными — по тому, что даёт и чего стоит сегодняшним инструментом. Чем она является
      для дуги, говорит такт границы (n28).'
- id: n22
  file: slides/n22-k2-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: Справочник остаётся в промте целиком, но порядок его пунктов перестаёт быть осадком истории
    и становится параметром процесса — и у этого параметра есть явное основание, не вкус
  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента. Правка К2-7/К2-8 (разбор 2026-10-29): решение явно ОБОСНОВАНО (а не
    предъявлено как факт), и рядом стоит таблица визуальных вариантов до/после — что именно меняется при
    переносе пункта.'
  visual:
    pattern: mechanism_node_graph
    figure: k2-shema-promt-i-kesh.png
    primary: 'Схема промта сверху вниз: указание процессу → справочник целиком → контрольная точка → вопрос
      клиента. Под схемой — одна плашка-решение и таблица «до / после» трёх перестановок (история добавления,
      важное к началу, важное к концу). Палитра Ocean, кегль не ниже 7,5 pt.

      '
    backup: 'ПРАВКА ВЁРСТКИ (2026-10-29, пересборка после разбиения Кейса 2). Схема делила кадр с ШЕСТЬЮ
      текстовыми блоками плюс таблицей — композиция не помещалась (`НЕ ПОМЕСТИЛОСЬ`/`ЗА КРАЕМ ПОЛОТНА`),
      таблица проваливалась на дно лестницы кеглей, а сама схема сжималась до 50% ширины. Два блока («почему
      список стоит именно здесь», «чего не меняем») убраны с видимого кадра — оба уже пересказаны в заметках
      докладчика словом в слово, факт не потерян, потерян только дубль. У таблицы те же три строки и три
      столбца, что были, — укорочены только подписи ячеек. Смысл и числа не менялись.

      СТАЛО (К2-7, К2-8, разбор 2026-10-29). Прежняя редакция предъявляла решение («часто спрашиваемые
      — к началу или концу») без объяснения, откуда оно взялось — владелец назвал это прямо: «решение,
      непонятно, откуда берётся» (про n23, тот же такт решения, слой 2). Обоснование добавлено явно: решение
      следует из разбора n21 — начало и конец списка читаются лучше середины (Liu и соавторы), значит,
      порядок пунктов внутри списка обязан быть ВЫБОРОМ, а не историей добавления, иначе середина списка
      заполняется случайно, тем, что туда попало по времени, а не тем, что туда можно безопасно положить.

      ВИЗУАЛЬНЫЕ ВАРИАНТЫ ПЕРЕСТАНОВКИ (К2-8) добавлены таблицей «до/после» непосредственно под схемой
      — без нового PNG: готового скрина «после перестановки» на диске нет, и его сознательно не рисуют
      стилизованной подделкой ([[no-mock-fallbacks]]), а строят текстовым сопоставлением трёх раскладок
      одного и того же списка из десяти пунктов. Дотянуть это до отдельной фигуры — решение designer-прохода,
      не этой правки; вынесено оркестратору отчётом как открытый пункт.

      ПРО МЕСТО САМОГО СПИСКА (не пунктов внутри него). n21 оставил этот вопрос ортогональным и перенёс
      его сюда. Ответ: список остаётся там, где лежит сейчас — между указанием и вопросом клиента, НЕ
      переезжает к самому концу промта. Причина: именно сюда указывает то же исследование — вопрос клиента
      и так стоит у одного из «хороших» краёв (конец промта), а указание процессу занимает другой край
      (начало); переносить список ближе к вопросу означало бы сдвинуть его в сторону уже занятого хорошего
      края и одновременно отдалить от инструкции, которая тоже должна читаться надёжно. Выбор — оставить
      список между двумя уже сильными краями, а работу с серединой списка вести перестановкой ПУНКТОВ
      внутри него (см. ниже), не переносом всего блока целиком.

      СТАЛАЯ ПОМЕТКА СНЯТА. Прежняя редакция несла длинную пометку «РЕШЕНИЕ ЗА ОРКЕСТРАТОРОМ: расхождение
      между тактом и готовой фигурой» — к дате этой правки расхождение уже закрыто: `make_figures_k2.py`
      третьим кругом (2026-10-26) развёл две фигуры по функциям `sloy1()` (эта, без чисел и без ловушки)
      и `kesh()` (`k2-shema-kesh-lovushka.png`, числа и сравнение); обе фигуры на диске датированы той
      же правкой — `rendered/figures/k2-shema-promt-i-kesh.png`, 2026-10-26 08:14, то же время, что у
      скрипта. Фигура на этом такте верная, пометку держать больше не нужно.

      Решение — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Решение», слой 1: база знаний лежит
      в промте целиком, но порядок пунктов — явный параметр процесса, частые и критичные темы к началу
      или концу списка, не в порядке исторического добавления. Устройство промта — по настоящему тексту
      на стенде (`stend/sborka.py`, `case1_v1`).

      Имён узлов, имени оркестратора и латиницы на кадре нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящая панель — следующим экраном.'
- id: n23
  file: slides/n23-k2-n8n-promt.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Настоящее поле промта: справочник лежит в нём целиком, все десять пунктов полным текстом,
    между указанием и вопросом клиента'
  learning_goal: 'Слой 2 такта «наше решение»: настоящий снимок панели настройки. Зал видит собственными
    глазами, что справочник — это не отдельное хранилище и не приложение к запросу, а строки внутри того
    же текстового поля, что и всё остальное.'
  visual:
    pattern: mechanism_node_graph
    figure: k2-promt-baza.png
    primary: 'Настоящий снимок панели настройки узла ответа с развёрнутым полем промта: текст виден целиком
      — вводная строка, заголовок справочника, десять пунктов подряд полным текстом, подстановка вопроса
      клиента и закрывающее указание. Акцент — на блоке справочника, он занимает почти весь кадр.

      '
    backup: 'ЧЕСТНОСТЬ КАДРА УСИЛЕНА (К2-7, разбор 2026-10-29: «решение — непонятно, откуда берётся»).
      Этот снимок — ИСХОДНОЕ состояние справочника, то самое, по которому разбор n21 и нашёл провал середины;
      порядок пунктов, выбранный в n22 (частые — к краю), на этом кадре ЕЩЁ не применён, и видимый текст
      теперь говорит это прямо, а не оставляет читателю самому заметить, что порядок пунктов здесь — «оплата
      первой, связь с преподавателем десятой», то есть история добавления, не решение n22.

      ИСТОЧНИК ФИГУРЫ НАЗВАН ТОЧНО: `k2-promt-baza.png` снят с развёрнутого поля промта узла `Answer (free
      self-report)` — того самого узла версии 1 Кейса 1 (`stend/sborka.py`, функция `case1_v1`), исходный
      кадр `stend/n8n-screenshots-raw/case1-v1-prompt-expanded.png`. Фигура уже лежит в `rendered/figures/`,
      кадр прочитан глазами: видны вводная строка, строка «База знаний учебного центра:», все десять пунктов
      полным текстом, подстановка вопроса клиента и закрывающее указание «если не уверена — честно напиши,
      что не знаешь».

      ЭТО ТОТ ЖЕ КАДР, ЧТО У КЕЙСА 1, И ЭТО СКАЗАНО ВСЛУХ, не замаскировано. Сетка (подраздел «Решение»,
      слой 2) планировала снять панель узла `Answer with grounding (structured)` до и после перестановки
      пунктов. Снимка «после перестановки» на диске нет, и выдумывать его запрещено ([[no-mock-fallbacks]]).
      Взят настоящий имеющийся кадр, а предмет такта от этого не страдает: показать надо, что справочник
      лежит в промте ЦЕЛИКОМ, — и именно это кадр показывает лучше любого другого. Открытый пункт остаётся
      и вынесен оркестратору отчётом повторно: кадра «порядок пунктов переставлен» у занятия нет; n22
      закрывает этот пробел таблицей «до/после» без нового снимка (К2-8).

      Акцент смещён относительно Кейса 1 сознательно. Там тот же снимок работал на закрывающий абзац (просьба
      честно признать незнание), и разбор шёл по нему. Здесь работает середина кадра — сам блок справочника,
      его объём и то, что каждый пункт набран обычным текстом, как в записке человеку.

      Короткие ярлыки пунктов видны на самом снимке; в текст слайда они не вынесены (§7 канона замысла
      кейса: русское предложение раньше любого перечисления на латинице). Имени сценария и номера прогона
      на кадре нет (канон §3).'
- id: n24
  file: slides/n24-k2-rezultat.md
  type: result_preview
  duration_min: 1.0
  assertion: 'На экране не меняется ничего: ни у обратившегося, ни на холсте у Ольги — всё решение уместилось
    в порядок строк внутри одного поля'
  learning_goal: 'Такт результата Кейса 2. Честно назван единственный на занятии разбор без собственного
    прогона: что решение даёт — сказано внешним измерением и с именем работы, что оно стоит — сказано
    своими словами и прямо.'
  visual:
    pattern: result_preview
    primary: 'Два мокапа рядом: экран ответа, который видит обратившийся (до и после — неотличимы), и
      холст процесса (до и после — неотличимы). Под ними плашка о том, чем это решение держится, и плашка
      его цены.

      '
    backup: 'Содержание — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Результат»: новый узел на
      холсте не добавляется, меняется содержимое уже существующего промта; обратившийся не видит изменений.

      ФОРМУЛИРОВКА СЕТКИ СМЯГЧЕНА СОЗНАТЕЛЬНО, и это главное решение этого слайда. Сетка пишет: «по мере
      роста базы ответы на частые темы не теряют точность, а теряли бы, если бы порядок оставался историческим».
      Как утверждение о НАШЕМ процессе это не измерено ни разу: собственная проверка на коротких пунктах
      нашего справочника спроектирована и не прогнана (`[ЗАМЕР НЕ ГОТОВ]`, такт «нюансы» сетки, пункт
      3). На кадре поэтому стоит то, что правда: чем решение держится (внешней работой, с именем) и чего
      у него нет (своего прогона).

      ПЕРЕИМЕНОВАНИЕ (К2-1): заголовок и видимый текст приведены к новому имени кейса «Оптимизация промта»
      — прежнее «База знаний в промте» уже занято Кейсом 1.

      ПЛАШКА «СВОЕГО ПРОГОНА НЕТ» ПОСТАВЛЕНА ИМЕННО ЗДЕСЬ, а не в конце кейса, потому что это такт, на
      котором у остальных пяти разборов стоят собственные числа. Пустое место лучше называть там, где
      его ищут. Формулировка согласована с закрытием занятия — `n76-os-zakryta.md` говорит о том же той
      же мыслью: «собственного прогона на этом стенде нет, опора внешняя».

      Мокапов «до и после» два, и они намеренно неотличимы: это и есть содержание такта. Для сборки фигуры
      они не нужны — оба состояния показываются текстовым представлением, как у `result_preview` Семинара
      8 (`sem-08/slides/n12-k1-rezultat-preview.md`).

      Числа на кадре: ни одного собственного. Внешнее — только ссылка на уже показанную работу разбора
      (n21), без повторного вынесения её цифр.'
- id: n25
  file: slides/n25-k2-kesh-struktura-zamera.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Пять провайдеров, пять серий вызовов, 119 обращений — устройство замера кэша, прежде чем
    на экране появится хоть одно число результата
  learning_goal: 'Такт С2-1 (структура замера, разбор 2026-10-29): корпус, группы и ожидание по каждой
    группе — ДО результата. Заменяет снятый n25 (К2-9, старый кадр с теоретическими множителями без собственного
    прогона) и открывает перепрогнанный замер кэша (К2-19, З2). Модель и её настройки названы (С5).'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица из пяти строк-групп: что проверяли · на чём · сколько вызовов · что ожидали по документации
      провайдера. Результатов на кадре нет — ни одного числа исхода. Сверху — плашка с именами моделей
      и способом вызова.

      '
    backup: 'СНЯТ СТАРЫЙ n25 (К2-9: «грохнуть — не работает»). Прежний кадр несущий множители 1,25×/2×/0,1×
      и внешний пример ProjectDiscovery без единого собственного числа; владелец отклонил его как неработающий.
      На его месте — структура собственного перепрогнанного замера (К2-19, З2 из `qa/kommentarii/RAZBOR-2026-10-29.md`).

      МОДЕЛИ И НАСТРОЙКИ (С5), все пять через один и тот же посредник OpenRouter, узел `httpRequest` на
      `/v1/chat/completions`, тело запроса собрано целиком на стороне python, параметры у каждой модели
      — без изменений, кроме явного поля `cache_control` там, где оно проверяется: `anthropic/claude-haiku-5.5`
      (исполнитель Anthropic, порог кэша 512 токенов), `google/gemini-2.5-flash` (исполнитель Google AI
      Studio, порог 2048), `openai/gpt-4.1-mini` (исполнитель OpenAI, порог 1024), `deepseek/deepseek-chat`
      (исполнитель DeepInfra), `qwen/qwen-2.5-7b- instruct` (исполнитель Phala, модель стенда занятия).

      ПЯТЬ СЕРИЙ, 119 ВЫЗОВОВ — `stend/zamery-k2-kesh/README.md`, раздел «Как пересобрать» и таблицы 1–8:
      S1 — 20 вызовов, кто из пяти моделей вообще отдаёт метрики кэша; S2 — 36 вызовов, куда дописывать
      правку базы (без правки / в конец / в середину / в начале) на автоматических провайдерах; S3 — 27
      вызовов, как у Anthropic выставлена контрольная точка (один блок текста против четырёх); S4 — 24
      вызова, трёхкратный повтор спорных случаев S2; S5 — 12 вызовов, настоящий справочник занятия (10
      пунктов, не раздутая синтетика).

      ОЖИДАНИЕ ПО КАЖДОЙ ГРУППЕ — из документации провайдеров, названной по первоисточнику, НЕ из нашего
      прежнего предположения: Anthropic документирует явный `cache_control` («Opt in with cache_control»);
      Gemini и OpenAI документируют автоматический кэш без параметра («enabled by default»); документация
      Anthropic же утверждает, что запись происходит «только в точке» и что хэш «кумулятивный» — отсюда
      ожидание, что раскладка блоков должна иметь значение. Каждое из трёх ожиданий проверяется отдельной
      группой, и подтверждается оно не одинаково — это такт результата, не этот.

      Собственный замер же взят с привязкой к настоящему тексту занятия: база — `stend/zamery-k2-kesh/baza.py`,
      10 настоящих пунктов Кейса 2 (из тех же десяти, что на n23) плюс 50 синтетических для серий, где
      кэш нужно наблюсти на тексте выше порога (раздутая база — условие наблюдаемости эффекта, не свойство
      нашей задачи, см. такт n25a).

      НИ ОДНОГО РЕЗУЛЬТАТА НА КАДРЕ (С2): ни «включился», ни «сработало», ни процента. Структура теста
      целиком, и останавливается здесь.'
- id: n25a
  file: slides/n25a-k2-kesh-svod.md
