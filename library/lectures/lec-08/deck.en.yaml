# library/lectures/lec-08/deck.en.yaml
#
# Deck structure for Lecture 8 "AI in the creative industries and media" (39 slides).
#
# Source: chapter v2 + plan v2 (USER GATE 0 approved).
# Phase 5 multi-artifact pipeline — slides content alignment.
# Issue #119 · Media-heavy ≥80% (≥33/39 slides with embedded media + fallback).
#
# Palette LOCKED v3: Ocean Gradient (#21295C / #065A82 / #1C7293) + Teal
# (#028090) secondary + Gold (#F0AB00) ≥1×/slide.
# Visual motif: "Ocean rounded box" (radius 12, surface #F4F7FA, stroke #1C7293).

deck:
  lecture_number: 8
  title: "AI in the creative industries and media"
  audience: "third-year engineering students (general audience, not designers/artists)"
  duration_min: 75
  central_question: "What has AI done to the creative industry by 2026 — and where is it reasonable for an engineer to say \"AI is not needed here\"?"
  learning_outcomes: [LO1, LO2, LO4, LO5]
  language: en
  status: draft
  version: v1
  source: chapter v2
  plan: library/lectures/lec-08/plan.md

slides:
  # ─── Section 0. Opening + keystone (9.5 min) ───
  - id: s01
    file: slides-en/s01-ice-breaker-suno-firefly.md
    type: live_demo
    duration_min: 3
    assertion: "AI generates a production-grade artifact in seconds without special skills — this is a new baseline capability of the creative industry."
    learning_goal: "Opening hook: live demo of music (Suno) or image (Firefly)"
    learning_outcomes: [LO1]
    chapter_ref: "§0.1 — What generative media models do today"
    references: [suno-create, firefly-adobe, vivideo-2026]
    visual:
      pattern: external_demo
      primary: "Live URL Suno (primary) / Firefly (fallback) + QR + screenshot + before/after cost"
      backup: assets/backup/s01-suno-firefly-mockup.png
    interaction: live_demo

  - id: s02
    file: slides-en/s02-cover.md
    type: cover
    duration_min: 0.1
    assertion: "Lecture 8. AI in the creative industries and media"
    learning_goal: "Cover slide: title + meta"
    learning_outcomes: []
    chapter_ref: "frontmatter"
    references: []
    visual:
      pattern: cover_distinct
      primary: "Hero cover: large outline \"08\" + title 36pt + duration; Ocean palette"

  - id: s03
    file: slides-en/s03-central-question.md
    type: assertion_visual
    duration_min: 2
    assertion: "What has AI done to the creative industry by 2026 — and where is it reasonable for an engineer to say \"AI is not needed here\"?"
    learning_goal: "Pose the central question of the lecture"
    learning_outcomes: [LO1]
    chapter_ref: "§0 — Central question of the lecture"
    references: []
    visual:
      pattern: cover_distinct
      primary: "Central question large in Ocean rounded box + the 2 halves of the question visually separated"

  - id: s04
    file: slides-en/s04-lecture-map.md
