# issue-301-lec-08-rebuild). ВЫГРУЖЕНА программой
# `make_deck_yaml_v5.py` из `slides/*.md` — руками не правится, при
# любой правке фронтматтера перезапускается.
#
# ЧЕМ ЭТО НЕ ЯВЛЯЕТСЯ — входом сборки. `deck/build_lec08_v5.py`
# читает фронтматтер файлов кадров напрямую и этот файл не
# импортирует. Два описания одного состава способны разойтись, ничего
# не сломав, если одно читает сборка, а другое — только человек;
# поэтому здесь каждое поле выгружено, а не записано.
#
# Тайминг и методические поля живут ЗДЕСЬ и во фронтматтере — на
# видимом слое кадра они запрещены (CLAUDE.md § «No Timing / No
# Methodology in Slides»).
#
# СОСТАВ, посчитанный с диска: 100 кадров.

