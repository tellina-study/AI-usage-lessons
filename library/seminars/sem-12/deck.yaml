  assertion: Три способа искать по архиву фотографий — ни один не назван провальным заранее
  learning_goal: 'Вопрос кейса D, переформулирован по подходам (находка владельца 1, круг 3). Карточка
    устроена в три такта, одинаково у всех трёх и одинаково с кейсом C (согласовано сессией `s12-keys-C-peredelka`):
