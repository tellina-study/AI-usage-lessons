    backup: Форма А7 — та же, что sem-05/slides/n10. Содержание — section-2-subagent.md §A.1 «Разбор»
      + «Вывод», дословно по смыслу; section-2-subagent-part1b.md n39 даёт ту же таблицу в связной речи.
- id: n40
  file: slides/n40-svidetelstva-tsena-delegirovaniya-i-probel.md
  type: research_evidence
  duration_min: 0.75
  assertion: Мультиагентная работа тратит заметно больше токенов, чем обычный чат; число, сколько контекста
    экономит отдельная роль по сравнению с тем же объёмом работы в основной сессии, в литературе не нашлось
  learning_goal: 'Свидетельства идут после разбора и подтверждают цену, уже видную из сцены: число усиливает
