      OpenAI; gpt-image-1, предшественник этой модели, снимается с продажи 23.10.2026 — поэтому взята
      актуальная версия). Допущение выбора уровня — продюсерское: карточка уведомления не требует наивысшей
      точности генерации, поэтому ориентир — среднее качество, ≈$0,034/картинку; если владелец сочтёт
