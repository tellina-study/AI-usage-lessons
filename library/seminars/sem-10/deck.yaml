      \ шаги 1-2, и\n  каталог эмбеддингов провайдера (прочитан прямым запросом).\n\nЧЕТВЁРТАЯ СТРОКА\
      \ ОСИ: левая половина взята ДОСЛОВНО с n03 («если умеем искать текст — картинку найдём тем же способом,\
      \ просто подписав её словами»); сверка двух мест обязательна при пересборке. Правая половина на\
      \ n81 ПРИВЕДЕНА В СООТВЕТСТВИЕ с этим кадром правкой issue #311: она несла прежнюю формулировку\
      \ про технически не работающее сравнение картинок, теперь говорит то же, что говорит закрытие здесь\
      \ — облик документа, отбор модели двумя проверками, живой отпечаток. Три числа строки (0,967 против\
      \ 0,233; одна модель из девяти; перекрёст 5,6-7,3 раза) взяты с этого кадра."
- id: n77
  file: slides/n77-razbavitel-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Четыре кейса сегодня учили находить нужный кусок — ни один из них не проверял, что найденное
    верно
  learning_goal: Открытие концептуального разбавителя. Форма — та же, что у дивайдеров кейсов (case_divider_quote),
    но НЕ зарегистрирован в case_idx конфига — дорожка кейсов не рисуется (разбавитель вне case_track,
    ARCHITECTURE.md §4). Называет проблему, не решение.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Дорожки кейсов на этом экране НЕТ — разбавитель
      не входит в case_track (отличие от n05/n22/n39/n59).

      '
    backup: Переход — SETKA-KEYSOV.md / rework/section-5-razbavitel-ai- overviews.md, «Зачем это здесь»,
      дословно. sid n77 сознательно отсутствует в case_idx конфига — g_case_divider рисует дорожку только
      если idx найден, иначе рисует дивайдер без неё.
- id: n78
  file: slides/n78-razbavitel-ai-overviews.md
  type: content
  duration_min: 1.5
  assertion: Google AI Overviews нашёл текст, который действительно был про сыр и пиццу — источником оказалась
    старая шутка, а не кулинарная рекомендация
  learning_goal: 'Случай 1 концептуального разбавителя: Google AI Overviews, 2024. Факты даны на уровне
    широко задокументированного публичного случая (множество независимых СМИ), без завышенной точности
    дат/цитат, которую этот уровень проверки не может подтвердить.'
  visual:
    pattern: content
    primary: 'Плашка-факт про случай, плашка-вывод про разницу между «релевантно» и «верно».

      '
    backup: Случай широко задокументирован независимо множеством изданий (май 2024, запуск AI Overviews
      в поиске Google) — один из самых публично обсуждаемых примеров года. Точная формулировка источника
      (шуточный комментарий на форуме) дана без утверждения точной даты публикации исходного комментария
      — см. fact_check_flags rework/section-5, этот уровень детализации не проверялся прямым чтением первоисточника
      в рамках этой сессии.
- id: n79
  file: slides/n79-razbavitel-nyc-mycity.md
  type: content
  duration_min: 1.5
  assertion: Чат-бот MyCity отвечал уверенно, грамматически безупречно и материалом, который по теме относился
    к вопросу — а вывод при этом противоречил закону города
  learning_goal: 'Случай 2 концептуального разбавителя: чат-бот NYC MyCity, документированный журналистским
    расследованием (The Markup, 2024). Факты на уровне широко задокументированного случая, без завышенной
    точности деталей.'
  visual:
    pattern: content
    primary: 'Плашка-факт про случай, плашка-вывод про уверенность без верности.

      '
    backup: 'Документированный случай журналистского расследования The Markup (Colin Lecher, 29 марта
      2024): чат-бот городской администрации Нью-Йорка для малого бизнеса давал юридически неверные ответы
      — в частности, говорил, что можно забирать себе чаевые сотрудников, и что можно отказывать арендаторам
      с жилищными субсидиями.'
- id: n80
  file: slides/n80-razbavitel-sintez.md
  type: content
  duration_min: 1.0
  assertion: Ни один из четырёх кейсов сегодняшнего занятия не застрахован от этого автоматически самим
    фактом, что он использует поиск
  learning_goal: 'Синтез разбавителя: почему это касается всех четырёх кейсов занятия. Критерий метрик
    recall/ранга явно назван недостаточным сам по себе. Мостик к С12 (оценка качества и выключатель) назван,
    без раскрытия механики.'
  visual:
    pattern: content
    primary: 'Плашка-синтез (почему касается всех 4 кейсов), плашка про то, что это не повод отказаться
      от поиска, плашка-мостик к будущей ступени.

      '
    backup: SETKA-KEYSOV.md / rework/section-5, «Почему это касается каждого» + «Нюанс к разбавителю»,
      дословно. Упоминание С12 — ARCHITECTURE.md §1 (ступень 6 лестницы дуги), без раскрытия механики
      оценки/выключателя.
- id: n81
  file: slides/n81-os-zakryta.md
  type: recap_table
  duration_min: 2.0
  assertion: 'Четыре строки оси заполнены измеренным: в каждой интуиция была не глупостью, а неполной
    картиной, которую закрыл прогон'
  learning_goal: Закрытие оси занятия. Каждая правая клетка — число с прогона, который зал уже видел.
    Вопрос занятия возвращается дословно, тем же текстом, что на n03.
  visual:
    pattern: recap_table
    primary: 'Та же таблица, что открывала занятие (n03), теперь с заполненной правой колонкой. Под ней
      — вопрос занятия тем же текстом.

      '
    backup: 'Левая колонка — дословно та же, что на n03. Правая — собрана из тактов «обобщение» и «нюансы»
      четырёх кейсов, числа — SETKA-KEYSOV.md актуальной версии (доп. проход 2026-11-01, пересборка вопросов
      Кейса 1 2026-11-02): на этом слайде использованы только финальные, пересобранные числа.

      ЧЕТВЁРТАЯ СТРОКА ПЕРЕСОБРАНА ПРАВКОЙ issue #311. Прежняя правая клетка говорила, что прямое сравнение
      картинок на этом стенде технически не работает и модель возвращает одинаковый вектор для разных
      изображений, — с тех пор рабочая модель найдена и измерена, и это стало историей ОТБОРА (n64-n66).
      Формулировка взята с закрытия на последнем кадре Кейса 4 (n76d), числа — stend/raw/case4_mm_full_retrieval.json
      (0,967 против 0,233 на снимке под углом) и case4_working_mm_results.json (9 моделей каталога, в
      работу прошла одна). Третье направление закрытия — перекрёст 5,6-7,3 раза в пользу отпечатка (case4_quality_limits.json)
      — на видимый слой НЕ встало по замеру сборки: с ним таблица переполняется на 0,31″ и композиция
      уходит ниже рабочего поля; оно живёт в заметке к этой строке. Левая половина строки не тронута и
      по-прежнему дословно совпадает с n03; сверка двух мест обязательна при пересборке.'
- id: n82
  file: slides/n82-schyot-zanyatiya.md
  type: content
  duration_min: 1.5
  assertion: 'Четыре кейса, четыре самостоятельных замера на реальных данных — ни один не на придуманном
    числе, и отрицательные результаты показаны как есть: снятая проверкой модель и измеренная потеря на
    слиянии'
  learning_goal: Счёт занятия (сквозная линия получает число, не остаётся впечатлением — CLAUDE.md stroenie-i-povestvovanie.md
    §4.2). Что переезжает дальше по циклу — цена решения каждого кейса, не бесплатный выигрыш.
  visual:
    pattern: content
    primary: 'Плашка-счёт (4 кейса, реальные датасеты, два показанных как есть отрицательных результата),
      плашка «что переезжает дальше» по каждому кейсу.

      '
    backup: 'Счёт — по корпусам: SberQuAD (Кейсы 1-3), CORD (Кейс 4). «Что переезжает дальше» — SETKA-KEYSOV.md
      / rework/section-6-zakrytie.md, «Что переезжает дальше по циклу», числа актуализированы под финальную
      версию замера.

      СЧЁТ ПЕРЕСОБРАН ПРАВКОЙ issue #311. Прежняя версия говорила, что один из четырёх прогонов закончился
      нерабочим результатом: на момент её написания прямое сравнение картинок в Кейсе 4 не работало вовсе.
      С тех пор рабочая модель найдена и измерена, и честным отрицательным результатом остались два других
      — снятая первой же проверкой модель (stend/raw/case4_working_mm_results.json, шаги 1-2: 9 моделей
      каталога принимают картинку, в работу прошла одна) и измеренная потеря слияния рангов на картинках
      (stend/raw/case4_fusion_results.json: минус 11 сканов из 30 на снимке под углом).'
- id: n83
  file: slides/n83-mostik-k-s11.md
  type: bridge_forward
  duration_min: 1.5
  assertion: Сегодня процесс научился находить факты вне промта; следующая ступень — что происходит, когда
    процессу дают не только знание, но и право действовать от имени компании
  learning_goal: Мостик к С11 (ступень 5 лестницы дуги — модель с полномочиями). Содержание обещания ограничено
    тем, что держится решением владельца (название и вопрос ступени 5, ARCHITECTURE.md §1), не черновиком
    механики С11.
  visual:
    pattern: bridge_forward
    primary: 'Вопрос следующей ступени плашкой, под ним — как вопросы С9 и С10 сходятся к нему, под ним
      строка про то, чего знание вне промта само по себе не чинит.

      '
    backup: 'Название и вопрос ступени 5 — ARCHITECTURE.md §1 («Модель с полномочиями — С11»), KONTSEPTSIYA-7-12.md
      §6 (лестница дуги). Механика С11 на этот слайд не выносится (та же дисциплина, что С9→С10: не обещать
      механику следующего занятия раньше срока). Отдельно назван честный предел: разбавитель этого занятия
      (релевантно ≠ верно) сам не чинится ни выносом базы, ни полномочием — чинится ступенью 6 (С12, оценка
      качества и выключатель).'
