# Модель хронометража — как в Лекции 4 и НЕ МЕНЯЕТСЯ: duration_min слайда = время ПОЛНОГО
# прохода по нему, Σ намеренно больше слота, а разрыв закрывает cut_order (deck-part2.yaml)
# в три яруса. Цель по разделу — это НЕ цель по слайду: сжимать duration_min содержательных
