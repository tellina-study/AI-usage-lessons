- id: n15
  file: slides/n15-urok-tsena-i-obratimost.md
  type: lesson_boundary
  duration_min: 2.0
  assertion: 'Где в цепочке нужен гейт — вопрос цены и обратимости следующего шага, не вкуса: письмо можно
    переписать, купленный дом — нет; это не довод против автоматической оценки, а довод против того, чтобы
    она сама запускала обязывающее действие'
  learning_goal: Урок кейса B обобщает механизм кейса A (ошибка первого звена молча доходит до результата)
