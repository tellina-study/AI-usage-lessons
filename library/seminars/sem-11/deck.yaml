  visual:
    pattern: mechanism_node_graph
    figure: case1-hyde-n8n-canvas-real.png
    primary: 'Настоящий скрин холста n8n живого стенда: Форма (вопрос + корпус с эмбеддингами) → Сочинить
      гипотетический ответ (gpt-4o-mini) → Разбор HyDE-документа → Embed HyDE-документ (text-embedding-3-small)
      → Simple Vector Store (cosine top-1 по HyDE) → Answer (RAG) по найденному куску (gpt-4o-mini) →
      Result screen.

      '
    backup: 'НАСТОЯЩИЙ ЖИВОЙ СКРИН, не программная схема: `stend/sborka_case1_hyde.py` собрал и опубликовал
      workflow `CfRWQAELoIAbDPRm` на `n8n.lessons. tellian.io` через управляющий REST API (`X-N8N-API-KEY`);
      запущен `stend/n8n_shots_case1.py` (playwright, обход `~/.cache/page-shot-libs/x`, логин `N8N_UI_EMAIL`/`N8N_UI_PASSWORD`,
      та же техника, что `sem-10/stend/ n8n_shots.py`). Источник кадра: `stend/n8n-screenshots-raw/ case1-hyde-canvas.png`,
      кроп — `rendered/compose_case1_hyde_shots.py` (Pillow — ImageMagick в этой среде недоступен), убран
      только висящий «+»-коннектор справа от Result screen; сам холст не пересобран и не дорисован ни
      одним пикселем.

      ПОЧЕМУ ЭТО HyDE, А НЕ MULTI-QUERY: архитектура Слоя 1 (n15) называет оба устройства равноправными
      примерами одного и того же механического слота — «один дополнительный узел перед эмбеддингом». HyDE
      линеен (один абзац → один эмбеддинг → один поиск), multi-query требует фан-аут на 3 ветки эмбеддинга
      и слияние RRF — на канвасе это либо втрое больше узлов, либо цикл по элементам, неочевидный на статичном
      кадре. Этот живой скрин иллюстрирует МЕХАНИЗМ добавления шага; multi-query уже измерен числом на
      всех 50 вопросах собственным Python-харнессом (n09-n14), не повторяется здесь вторым снимком того
      же слота.

      ЧЕСТНО НАЗВАННЫЙ ПРОБЕЛ: отдельного живого скрина канваса с видимым ветвлением на 3 переформулировки
      (multi-query) для этого кейса не снято — `stend/README.md`, раздел «Что осталось открытым», называет
      это прямо; на канвасе такая логика выглядела бы расширением уже снятой схемы Кейса 3 Семинара 10
      (`case3-rrf-panel.png`) ещё одним HTTP Request-узлом перед эмбеддингом. Решение не снимать второй
      скрин — этой сессии, по экономии кадра деки, не скрытая недоделка.

      МОДЕЛИ НАЗВАНЫ ПО ИМЕНИ (С5): `openai/gpt-4o-mini` (генерация HyDE- абзаца и финальный ответ) и
      `openai/text-embedding-3-small` (эмбеддинг HyDE-документа) — видны текстом на узлах холста, настроены
      без явно заданных дополнительных параметров.

      ДЕМО-ПРОГОН, НЕ ПОВТОР ОСНОВНОГО ЗАМЕРА: корпус — 10 реальных документов (подмножество того же 500-документного
      корпуса SberQuAD, не выдуманный текст), вопрос — `c3q10` из основного замера (n12). Назначение кадра
      — показать механику живого холста, не повторить число основного замера.'
