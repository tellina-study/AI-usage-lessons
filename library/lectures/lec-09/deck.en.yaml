  - id: s47
    file: slides-en/s47-chto-dalo-i-potrebovalo-razdel-3.md
    type: schema_matrix
    section: "3. Design and new capabilities"
    assertion: "The cost of a model's error grows from an engineer's hours to decisions that affect people who have nothing to do with the model at all"
    learning_goal: "§3.8 + the cumulative stage map: eight cells filled after three sections"

  - id: s48
    file: slides-en/s48-vyvod-razdela-3.md
    type: norm
    section: "3. Design and new capabilities"
    assertion: "The model expands the space of options — it replaces the final check in none of the four cases"
