      настоящие, переизмерены 2026-10-19 на НОВОМ наборе 20 пар (исходный набор первого измерения нигде
      не сохранился — временный workflow первого прохода был удалён; генератор и набор этого прохода —
      stend/_gen_duplicate_check_pairs.py и stend/duplicate-check-test-pairs.json, полный протокол — stend/duplicate-check-results.json):
      хэш 15/20, TF-IDF-косинус 13/20, LLM-судья 17/20 — см. BRIEF-PROIZVODSTVO.md §3. Четвёртая схема
      (jev, TypeSafe Decisions API, endpoint POST https://openrouter.ai/api/alpha/decisions, модель typesafe/jev-1.13)
      измерена 2026-10-20 на том же наборе 20 пар через production-workflow stage-2-duptest.json (id gs5uhluV74yu045D):
      20/20, порог классификации 0,5 (jev_noul >= 0,5 => дубль), разделение чистое — jev_noul 0,70–0,97
