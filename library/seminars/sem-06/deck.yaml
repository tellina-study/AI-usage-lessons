- id: n61
  file: slides/n61-svidetelstva-mast-i-tsena-koordinatsii.md
  type: research_evidence
  duration_min: 1.5
  assertion: От 41 до 87% размеченных трасс мультиагентных систем — провальные, и несогласованность между
    агентами — одна из трёх основных причин; на последовательной задаче мультиагентная схема без структуры
    усиливает число ошибок в 17,2 раза
  learning_goal: 'Масштаб, не единичный случай: доказательная база этого кейса — исследования, не демонстрация
    на машине студента. Явная осторожность с эффектной цифрой «79%» — тренирует критическое чтение источника,
    не просто его цитирование. Честный пробел называется прямо'
  visual:
    pattern: evidence_table_with_gap
    primary: 'Таблица двух строк в три колонки: источник · тезис · сила доказательства, библиография сжата
      до автора и arXiv-номера. Под таблицей — короткая плашка, привязывающая цифру рассогласования к
      диф-ревьюеру и тестировщику из сцены, затем предостережение про «79%» и плашка честного пробела.'
    backup: 'Источник — section-2-subagent.md §A.3 «Свидетельства» + «Осторожность со счётом» + «Честный
      пробел», section-2-subagent-part1c.md n61, по содержанию дословно; числа не менялись. В круге правок
      (issue 225, замечания 3/5/6) слайд сжат и заземлён: таблица лишилась полных названий статей (остались
      автор + краткое имя + arXiv), добавлена плашка «для наших двух ролей» — она указывает уже стоявший
      в таблице процент рассогласования на нашу сцену n58, без нового факта — приём из общего задания
      круга «числа оставить, рядом поставить то, что они значат». Исправление (issue 225, fact-check round
      2, 2026-10-05): атрибуция «Kim, Liu и др.» расходилась с библиографией курса (`sem-05/research/stage-6-subagent.md`,
      «Kim, Y., Gu, K., Park, C. и др.») — прямое чтение `arxiv.org/abs/2512.08296` подтвердило первых
      троих авторов препринта как Yubin Kim, Ken Gu, Chanwoo Park (Liu встречается дальше в списке из
      19 соавторов, не среди первых трёх); исправлено на «Kim, Gu, Park и др.». Источник путаницы — байлайн
      сопроводительного блога Google Research (Kim и Xin Liu), который называет не тех же людей, что первые
      авторы самого препринта.'
- id: n62
  file: slides/n62-mekhanika-edinstvennyy-priyom-granitsa.md
  type: mechanics_map
  duration_min: 1.25
  assertion: Промежуток между ролями закрывает не координатор и не объединение в одну — его закрывает
    явная граница в описании каждой роли, в обе стороны; диф-ревьюер уже так делает, тестировщику нужна
    симметричная строка
  learning_goal: Единственный рабочий приём третьего кейса, показанный на двух реальных ролях сцены, не
    абстрактно. Граница делает промежуток видимым тому, кто читает оба описания рядом — не устраняет сам
    промежуток
  visual:
    pattern: mechanics_with_figure
    figure: subagent-n62-granitsa-dvukh-rolei.png
    primary: 'Схема: два прямоугольника зоны ответственности — диф-ревьюер (код) и тестировщик (поведение
      формы), каждый со своей строкой «НЕ для…». Между прямоугольниками — выделенная зона с подписью «промежуток,
      не поручен ни одной роли» (сценарий с пробелом перед доменом). Снизу подпись: граница делает промежуток
      видимым, не убирает его.'
    backup: 'Источник — section-2-subagent.md §A.3 «Механика» + section-2-subagent-part1c.md n62, дословно
      по содержанию. Фигура добавлена: абстрактное понятие «промежуток между границами» нагляднее как
      визуальный разрыв между двумя зонами, чем как два абзаца текста; аналог диаграммы n54.'
- id: n63
  file: slides/n63-granitsa-kogda-koordinatsiya-okupaetsya.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Узкая роль поверх одной правки окупается; неструктурированный «рой» без границ или лишний
    координатор поверх уже не согласованных ролей — цена без выигрыша
  learning_goal: 'Расширение границ применимости кейса 3 по замечанию владельца о границах (круг правок,
    issue 225): где именно проходит черта, за которой координация сама становится ценой — на одном конкретном
    отраслевом развороте мнения, не на перечислении цифр'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица из двух строк: «координация ещё окупается» и «координация уже дороже выигрыша»,
      как на следующем слайде. Внизу — строка, привязывающая вывод к диф-ревьюеру и тестировщику этой
      сцены.'
    backup: 'Источник — library/seminars/sem-05/research/stage-6-subagent.md (запись о развороте Cognition,
      12.06.2025 → 22.04.2026), по содержанию дословно. Новый материал кейса: источник в деке раньше не
      использовался, добавлен по замечанию владельца о границах применимости. Числа — отраслевой пример
      другой команды, не измерение на сцене этого кейса; это названо прямо в речи. Исправление (issue
      225, fact-check round 2, 2026-10-05): заметки докладчика несли ложно-точную «год и десять месяцев»
      между постами при разнице ≈10 месяцев 10 дней — исправлено на «десять месяцев», подтверждено и прямым
      чтением источника (`cognition.com/blog/multi-agents-working`, дата 22.04.26, дословно «10 months
      ago, I wrote Don''t Build Multi-Agents»), и первым постом (`cognition.com/blog/dont-build-multi-agents`,
      дата 06.12.25). Та же проверка подтвердила дословно «catches an average of 2 bugs per PR, of which
      roughly 58% are severe» и «mostly a distraction» — обе цитаты верны, расхождений с ранее сохранённым
      текстом нет. Честный пробел добавлен в заметки: источник не публикует счёт «сколько находилось бы
      без отдельной роли-ревьюера» — только абсолютное число находок (P1-4, baseline/counterfactual mandate).'
- id: n64
  file: slides/n64-kriterii-kogda-vtoraya-rol-opravdana.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Вторая роль оправдана, когда задача действительно параллелится — шаг одной роли не нуждается
    в выводе другой; там, где шаги зависимы, разбиение на роли умножает ошибку вместо того, чтобы складывать
    надёжность
  learning_goal: Обобщение третьего кейса и всей ступени. Закрывается строкой оси, которая держит вывод
    всех трёх кейсов, и мостиком к следующему занятию без счёта ступеней и без номера
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица из двух строк: «вторая роль оправдана» и «одна роль дешевле». Внизу — строка оси
      ступени целиком, без сокращений.'
    backup: 'Источник — section-2-subagent.md §A.3 «Критерий» + «Строка оси» + «Переход к следующему занятию»,
      section-2-subagent-part1c.md n64 и завершающий блок, дословно. Закрывающий абзац («Несколько ролей
      вместо одной — решаем по структуре задачи…») — locked-формула (ARCHITECTURE.md §7, litpravka-otchet.md
      §1.2d/§5): не сжимается и не перефразируется, не тронут кругом правок 2. Переходный абзац к следующему
      занятию присоединён как продолжение закрытия кейса (part1c, пометка «без отдельного слайда»). Круг
      2 правок владельца (issue 225, §А1): прежняя формулировка перехода называла предмет словом «процесс»
      и анонсировала его как «тему следующего занятия» — рисунок «пятая ступень остаётся впереди», запрещённый
      по всему занятию целиком. Абзац переписан без этого слова и без прямой анонсации темы: называет
      нерешённый вопрос по существу (путь работы целиком, не итог одной роли), передаёт разговор дальше
      без счёта и без слова «раздел». Производственная связка «вердикт BLOCK → раздел про процесс» (историческая,
      из sem-05) остаётся зафиксированной в section-2-subagent.md, на видимом слое слова «процесс» нет.
      Отдельный слайд `n63` (граница: где координация перестаёт окупаться) вставлен перед этим слайдом
      по замечанию владельца о границах применимости — критерий и ось на этом слайде (`n64`) не затронуты
      тем изменением.'
- id: n65
  file: slides/n65-os-chetyre-stroki-zapolneny.md
  type: recap_table
  duration_min: 1.5
  assertion: Все четыре строки оси заполнены — хук, скилл, MCP, субагент; у каждой названо, что механизм
    делает и чего не делает
  learning_goal: 'Контрольная точка на четыре строки, без афоризма и без призыва к действию: строки хук/скилл
    переносятся дословно с мостика этого же занятия, MCP и субагент заполнены разбором сегодняшних двух
    блоков'
  visual:
    pattern: recap_table
    primary: 'Таблица на четыре строки, тот же вид, что на n03: теперь заполнены все четыре. Две содержательные
      колонки — «что делает» и «что не делает / ограничение» — плюс короткая колонка «предотвращаем /
      решаем». Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.1. Строки «хук» и «скилл» переносятся дословно с таблицы
      n03 этого же занятия — без изменений, зал видел их уже на мостике. Строки «MCP» и «субагент» подставлены
      при сшивке из строки оси кейса 1 каждого раздела (`research/setka-keysov.md` §1.1/§2.1, `section-2-subagent.md`
      A.1 «Строка оси»; у MCP отдельного слайда оси не было, формулировка собрана из §A.00/§A.1.3/§A.1.5
      того же раздела при сшивке). Формат ячейки — тот же, что у хука и скилла.

      Круг правок владельца (issue 225, §А1+§А5): строка «процесс» снята полностью — лестница занятия
      заканчивается на субагенте, четыре строки — вся ось этого занятия, не четыре из пяти. Колонки «что
      обещает устройство» / «что показала проверка» заменены на «что делает» / «что не делает — ограничение»,
      тем же способом, что на n03. Правые ячейки MCP и субагента — самые плотные на слайде, слегка сжаты
      (MCP: цепочка «сначала… потом… затем» заменена стрелками; субагент: сняты повторы «это» и слово
      «настолько»/«вовсе» без потери смысла) — факты, числа и источник не менялись. Исправление (issue
      225, fact-check round 2, 2026-10-05): ячейка MCP цитировала вывод разбора способов доступа («сначала
      нужно ли вообще, потом права, потом цена») в формулировке, которую круг правок уже заменил на другую
      (разбор n11 теперь заканчивается выбором между удалённым и локальным сервером, не порядком трёх
      вопросов) — цитата не отражала то, что сейчас говорит разбор. Заменено на единственный факт, который
      остаётся верным и подтверждён n16: права урезаются до подключения, не после, и без вычеркнутой строки
      воспроизводится документированная эксфильтрация.'
- id: n66
  file: slides/n66-chto-poyavilos-shema-ne-snimok.md
  type: code_artifact
  duration_min: 1.5
  assertion: 'Два файла этого занятия — .mcp.json и файл роли субагента — останутся только планом: демо-репозиторий
    дальше не строится, и это сказано прямо, не спрятано'
  learning_goal: 'Схема, а не захват дерева: тот же способ честной пометки, которым мостик этого же занятия
    уже отметил скилл. Занятие о границе контекста агента не прячет собственную недостроенность: демо-репозиторий
    дальше не строится, и это сказано прямо, той же меткой, что у скилла'
  visual:
    pattern: state_cards
    primary: 'Ведущая строка — пометка «СХЕМА, НЕ СНИМОК». Под ней — светлая таблица-коробка на шесть
      строк, не тёмный терминал: верхние четыре строки повторяют таблицу мостика без изменений (хук, скилл,
      CLAUDE.md, DECISIONS.md), две новые строки — сегодняшние ступени, обе с меткой «по плану, коммита
      нет». Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-3-os.md` §A.2. Демо-репозиторий дальше не строится (`SPLIT-PLAN-6-7.md`
      §1, решение владельца): артефакты MCP и роли субагента в `tellina-study/signup-landing-demo` не
      появятся. Метка у обоих — та же, что у скилла на мостике этого занятия: «по плану, коммита нет».
      Имена `.mcp.json` и `diff-reviewer.md` не изобретены — это артефакты кейса 1 каждой ступени, подтверждённого
      материалом полностью (`research/setka-keysov.md` §1.1, §2.1); подтверждено при сшивке — сданные
      разделы используют ровно эти пути без изменений (`section-1-mcp.md` §A.1.7, `section-2-subagent.md`
      §A.1).

      Круг правок владельца (issue 225, §А4): моноширинный листинг с двумя версиями репозитория (прежняя
      форма этого слайда, зеркально n02) заменён на светлую таблицу — правило «тёмные блоки кода и терминальные
