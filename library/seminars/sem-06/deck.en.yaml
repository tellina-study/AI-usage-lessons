    pattern: cobuilding_config_reveal
    primary: 'At the top — the task in one sentence, in a light remark card. Below it a table of six rows:
      the two moves stand as column headings, move 1 fills the left (the pieces named by the room), move
      2 the right (what it depends on). At the bottom — a single plate with the count: how many pieces
      are independent.'
    backup: 'Owner''s round 5 (issue 225, ZADANIE-KRUG-5.md): "maybe better to show it as a practical
      exercise? and discuss with the students how to decompose and speed up tasks?". The case''s former
      scene (n39, "Thursday: three checks at once, and it worked") was removed entirely: it was a ready-made
