deck:
  lecture_number: 4
  title: "Лекция 4. AI в жизненном цикле разработки ПО (SDLC)"
  audience: "3 курс ИУ6, инженеры-разработчики (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "AI пишет код всё лучше — но что делает AI-разработку надёжной? Не инструмент, а инженерная дисциплина по фазам SDLC: какой человеко-владеемый артефакт и какая проверка нужны на каждой фазе, где методики разных игроков сходятся — и что не делегируется инструменту ни в одной фазе?"
  learning_outcomes: [LO1, LO4, LO7]
  language: ru
  status: draft-for-gate-b
  version: v4.5
  source: "chapter v4 methodology-first (~34.5k, 5 частей)"
  plan: notes/lecture-4-software-review/final/plan-v4-methodology-first.md (v4 §4)
  total_slides: 58          # v4.5 (#162 round 6 — сводный проход пяти блоков): +1 s14b (конкретные артефакты четырёх архитектурных практик, между s14 и s15 — блок 1), −1 s21 (anti-hype-бенчмарки, старый display 32 — удалён по прямому указанию владельца, блок 3), +1 s03b (статистика внедрения в отрасли: Stack Overflow 2025 / DORA 2025, между s03 и s04 — блок 5); блоки 2 и 4 правили только содержимое существующих слайдов. 57 → 58. Было 57: v4.4 (#162 round 3 QA-fix): +7 slides s09b/s17b/s18b/s20g/s30b/s33b/s37b (AWS Kiro vs 847-deployments · Gemini CLI self-review · curation honest limits · Register .env secrets · Amazon Q wiper · BT Group/Azure Triangle vs IaC-insecurity · Uber+Kiro dual-register) + s20d/s20e ORDER SWAP + content fixes (s16 AI-periphery / s21+s37-triangulation GitClear-2026 / s25c rebuilt / s34 risk-calibrated gate / s37-matrix vendor-column removed); было 50 (v4.3 round 2: +5 slides s11b/s20f/s25b/s25c/s35b; было 45 v4.2; было 41 v4.1). v4.4.1 (post-critic QA-fix, this file): +id s05f (previously-undeclared foundations slide — the actual root cause of 56-declared-ids-vs-57-slides; see s05f entry below) + s30b re-positioned between s29/s30 (was mis-declared between s30/s31) + s39/s40 file: paths corrected (s40-checklist.md / s41-bridge-qa.md) — declared slide count now 57/57, matches rendered PPTX exactly.
  curriculum_level: "Module 1, первая отраслевая (после обзорных Л1–Л3); L4 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "методико-first: фаза SDLC × ведущая практика (методика: артефакт + кто предписывает + почему); инструмент — вторичная иллюстрация"

