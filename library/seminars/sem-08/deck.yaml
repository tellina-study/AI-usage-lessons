# Семинар 8 — Где решает модель, а где должен решать код
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 08
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    5.50 мин
#   Ось        n04–n04    4.00 мин
#   Кейсы      n05–n43   84.00 мин
#   Закрытие   n44–n46    7.00 мин
#   ИТОГО                 100.50 мин при слоте 90

deck:
  seminar_number: 8
  title: Семинар 8 — Где решает модель, а где должен решать код
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 100.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + измеренный эксперимент
    Кейса 3 (51 прогон); на занятии ведущий ничего не редактирует в узлах n8n вживую — только прогоняет
    уже готовые процессы (решение владельца, см. ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Когда шагу цепочки нужна модель, а когда — шаблон?
  language: ru
  slide_count: 46
  axis: Четыре вещи в сегодняшней цепочке выглядят надёжными; чем каждая из них окажется, покажет свой
    кейс
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Четыре новых шага одного процесса — и один вопрос на каждый: это решает модель, или это
    должен решать код?'
  learning_goal: Обложка. Название занятия берётся из ARCHITECTURE.md буквально, без перефразирования.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка снизу.
      Номера семинара на экране нет (решение владельца, унаследовано с С7, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: Заголовок взят буквально из ARCHITECTURE.md (фронтматтер `title`), без перефразирования. Второе
      занятие дуги С7–С12 (KONTSEPTSIYA-7-12.md).
- id: n02
  file: slides/n02-shov-s7-s8.md
  type: mechanism_node_graph
  duration_min: 3.0
  assertion: Входное состояние Семинара 8 — тот же процесс из шести узлов, которым закончился Семинар
    7, без единого изменения
  learning_goal: Шов между занятиями печатается буквально, не пересказывается (tools/seminar-production/README.md
    §2, правило 1). Короткая фраза вслух задаёт рамку всего занятия.
  visual:
    pattern: mechanism_node_graph
    primary: 'Цепочка узлов слева направо, именами из живого процесса, без изменений: Request form → Extract
      fields (+ Model) → Vocabulary check → Write row → Result screen. Отдельной строкой ниже — ветка
      отказа на Extract fields. Ни форма, ни цвет узлов не правятся: тот же холст, на котором закончилось
      прошлое занятие.

      '
    backup: 'Живого снимка n8n здесь нет и не будет на этом экране: UI-доступа к стенду у этой сессии
      нет (BRIEF-PROIZVODSTVO.md §3). Имена узлов — буквально из `sem-07/stend/student.json`, не пересказаны.
      Шов переносится дословно (tools/seminar-production/README.md §2, правило 1).'
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: taxonomy_compare_table
  duration_min: 2.0
  assertion: Сегодня остаёмся на той же ступени дуги, что и в прошлый раз, — цепочка — и идём в неё глубже,
    не выше
  learning_goal: 'Краткое напоминание карты дуги, не повторный ввод: аудитория уже видела лестницу на
    С7 (ARCHITECTURE.md §2 — дорожная карта переносится, не пересказывается заново).'
  visual:
    pattern: taxonomy_compare_table
    figure: lestnitsa-dugi.png
    primary: 'Тот же снимок лестницы, что был на С7 (переиспользуется, не рисуется заново) — золотая ступень
      «цепочка» в том же месте. Одна строка текста под ней, без повторного объяснения всех девяти ступеней.

      '
    backup: 'Фигура повторно используется из sem-07/rendered/figures/lestnitsa-dugi.png — положение золотой
      ступени не меняется между С7 и С8: обе темы стоят на ступени 1, «цепочка» (sem-07/KONTSEPTSIYA-7-12.md
      §6). Правка владельца: напоминание кратко, не повторный ввод (ARCHITECTURE.md §2).'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 4.0
  assertion: Четыре вещи в сегодняшней цепочке выглядят надёжными; чем каждая из них окажется, покажет
    свой кейс
  learning_goal: 'Ось занятия: таблица открывается с пустой правой колонкой и закрывается в самом конце,
    заполненной экраном каждого кейса, не рассказом (Pre-USER-GATE §6, keystone-axis check).'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки: «Выглядит надёжным» (заполнена, четыре строки) и «Чем оказался» (пустая
      во всех четырёх клетках). Под таблицей одна строка о том, что правая колонка заполнится по ходу
      занятия.

      '
    backup: Таблица и строки — буквально из SETKA-KEYSOV-S8.md, раздел «Ось занятия». Правая колонка оставлена
      пустой на экране (не текстом-подсказкой «закроется в Кейсе N» — это рабочая пометка автора сетки,
      не то, что видит зал). Форма — keystone_axis, как на С7 (n07/n41); закрывается в n44 этого занятия.
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Отдельный узел-модель сочиняет уведомление координатору заново на каждый прогон — и иногда
    добавляет в текст то, чего в заявке не было
  learning_goal: Дивайдер кейса 1. Заголовок сухой, называет предмет (А10); дивайдер называет проблему,
    не решение (А2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика координатора крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: Реплика — буквальная цитата координатора Марины из SETKA-KEYSOV-S8.md, раздел «Кейс 1». Форма
      входа в кейс — «реплика координатора» (ARCHITECTURE.md §3, таблица форм входа).
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: LLM-узел формирует уведомление по четырём известным полям и один раз добавляет деталь, которой
    не было в заявке — технически узел не ошибся
  learning_goal: 'Такт сцены кейса 1: хронология и цена, человек и конкретный случай (П2 канона), не таблица.'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой, под ней пронумерованная хронология, и закрывающий абзац цены.
      Таблиц нет.

      '
    backup: Хронология и находка — буквально из SETKA-KEYSOV-S8.md «Кейс 1 — Постановка» и из «Состояние
      стенда» (execution 42, плейсхолдер «[Имя координатора]»). Форма — problem_scenario, как на принятом
      Семинаре 7 (n09).
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Когда шагу цепочки нужна модель, а когда хватает шаблона — вопрос с четырьмя вариантами,
    разбор следующим экраном
  learning_goal: 'Вопрос кейса 1: голые карточки без доводов и вердиктов (А6), вопросов «к себе» на экране
    нет (А12).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, под ним ряд из четырёх карточек равной ширины. Никаких пояснений
      к карточкам — они на разборе следующим экраном.

      '
    backup: Карточки — буквально четыре варианта из SETKA-KEYSOV-S8.md «Кейс 1 — Вопрос залу», без изменений
      формулировок. Разбор — на следующем экране (А1).
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Только один из четырёх вариантов описывает наш сегодняшний случай; остальные три либо описывают
    другую задачу, либо связывают решение с тем, что на него не влияет
  learning_goal: 'Разбор сразу за вопросом: что каждый вариант делает и чего не делает, словами SETKA,
    без «верно/неверно» (А1, А5/А6).'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: вариант · что показывает разбор. Под ней — поворот: только один вариант говорит
      про наш сегодняшний случай.

      '
    backup: Текст разбора — SETKA-KEYSOV-S8.md, Кейс 1, «Разбор», слово в слово. Без «верно/неверно» —
      описание области действия каждого варианта (BRIEF-PROIZVODSTVO.md §2).
- id: n09
  file: slides/n09-k1-obzor.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'На стенде заранее собраны и опубликованы две готовые версии одного и того же шага: одна
    с LLM-узлом, другая — с подстановкой значений в шаблон'
  learning_goal: 'Взгляд на обе версии шага ДО прогона: зал видит, что сравнивается, прежде чем увидит
    результат. Без снимка — UI недостижим (BRIEF-PROIZVODSTVO.md §3).'
  visual:
    pattern: mechanism_node_graph
    primary: 'Два блока рядом, без снимка холста (недостижим на этом стенде): слева «до» — отдельный LLM-узел
      перед отправкой; справа «после» — узел подстановки переменных перед тем же отправителем. Под блоками
      — одна строка про то, что дальше прогоняется готовая заявка, а не правится узел.

      '
    backup: 'Обе версии и их id — буквально из SETKA-KEYSOV-S8.md «Кейс 1 — Наше решение» и «Состояние
      стенда». Живого снимка холста n8n для этого стенда нет: доступен только управляющий API, не веб-интерфейс
      (BRIEF-PROIZVODSTVO.md §3; notes/mcp-limitations.md [#229-3], [#233-8]).'
- id: n10
  file: slides/n10-k1-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 4.0
  assertion: Та же пара заявок через версию «до» даёт связный, но каждый раз разный текст — и один раз
    плейсхолдер вместо имени; версия «после» — одна и та же фиксированная форма, мгновенно, без модели
  learning_goal: 'Такт «наше решение»: прогон уже готовых процессов, не правка узла (ARCHITECTURE.md §4).
    Данные — настоящие executions стенда, не пересказ.'
  visual:
    pattern: mechanism_node_graph
    primary: 'Таблица трёх executions с текстом заявки и отправленным уведомлением, подписанная `n8n.lessons.tellian.io`.
      Под таблицей — находка про плейсхолдер отдельной плашкой.

      '
    backup: 'ДАННЫЕ С ЖИВОГО СТЕНДА, не мок: BRIEF-PROIZVODSTVO.md §3 и SETKA-KEYSOV-S8.md «Состояние
      стенда», подтверждено прямым чтением `runData` каждого execution. Workflow `nl5BbbHdbNYFuRwQ` (до)
      / `m6CmcGmqVfZHcKZy` (после), `n8n.lessons.tellian.io`. Скриншота холста/UI нет — живой браузерный
      экран для этого стенда недостижим (BRIEF §3); вместо него — таблица реальных полей, как уже делает
      n32-k3-reshenie-demo.md у С7.'
- id: n11
  file: slides/n11-k1-obobshchenie.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Не каждый текстовый вывод — это генерация: вставить известные значения в известную форму
    — задача форматирования, а не задача модели'
  learning_goal: 'Обобщение кейса 1: принцип и явно названный класс задачи, форвард-мостик к Кейсу 4 (тот
    же паттерн на бинарных данных).'
  visual:
    pattern: answer_breakdown_table
    primary: 'Короткая таблица «форматирование / генерация» на три строки критерия, под ней — плашка с
      названием класса задачи и форвард-мостик к Кейсу 4.

      '
    backup: Содержание — буквально из SETKA-KEYSOV-S8.md «Кейс 1 — Обобщение» и рационале разбора варианта
      3 («кто придумывает форму»). Класс задачи назван явно, как того требует ARCHITECTURE.md §3 (такт
      «обобщение»).
- id: n12
  file: slides/n12-k1-nyuansy-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Модель нужна при реальной вариативности содержания, шаблон достаточен, когда форма сообщения
    не меняется; первая строка оси закрыта
  learning_goal: 'Критерий кейса 1 плюс два класса нюансов и закрытие первой строки оси (форма принятых
    семинаров: n17/n33 С7).'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки «шаблона достаточно / модель нужна». Под ней — две плашки нюансов
      и строка закрытия первой строки оси.

      '
    backup: Критерий и оба нюанса — буквально из SETKA-KEYSOV-S8.md «Кейс 1 — Нюансы» и «Критерий». Форма
      — criteria_checklist_and_boundary, как на принятых Семинарах (n17/n33 С7).
- id: n13
  file: slides/n13-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «В таблице заявок — два совпадающих контакта за одно утро» — факт, который запускает второй
    кейс
  learning_goal: Дивайдер кейса 2. Форма входа — констатация факта из записи, а не пересказ того, что
    почувствовал человек (ARCHITECTURE.md §3).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, факт крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Факт из SETKA-KEYSOV-S8.md, Кейс 2, постановка: один и тот же контакт обращается дважды за
      утро — первый раз слово в слово, второй раз другими словами. Workflow на стенде — c7evxIhox45tn127.'
- id: n14
  file: slides/n14-k2-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Один и тот же человек обращается дважды: первый раз слово в слово тот же вопрос, что неделю
    назад, второй раз в тот же день — другими словами'
  learning_goal: 'Сцена кейса 2: хронология, которая объясняет, почему механическая проверка видит повтор
    только один раз из двух. Ломается не узел, а граница того, что хэш умеет сравнивать.'
  visual:
    pattern: problem_scenario
    primary: 'Хронология по пунктам (неделю назад → сегодня, первое обращение → сегодня, второе обращение),
      под ней абзац про то, что поймала проверка и что пропустила.

      '
    backup: Текст и порядок событий — SETKA-KEYSOV-S8.md, Кейс 2, постановка, слово в слово. Механизм
      проверки (хэш нормализованного текста, окно времени) — тот же абзац.
- id: n15
  file: slides/n15-k2-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Что умеет каждый вид проверки на повтор — четыре утверждения о механической проверке и проверке
    смыслом, не все из них верны
  learning_goal: 'Вопрос без подсказок: голые карточки, вопросов «к себе» нет (А12). Карточки — утверждения
    о том, что умеет каждый вид проверки, а не выбор метода.'
  visual:
    pattern: question_with_option_cards
    primary: 'Два текста заявки врезкой, вопрос в золотой рамке и ряд карточек без пояснений.

      '
    backup: Карточки — четыре утверждения из SETKA-KEYSOV-S8.md, Кейс 2, «Вопрос залу», слово в слово.
      Без доводов и вердиктов (БРИФ §2).
- id: n16
  file: slides/n16-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Два из четырёх утверждений описывают область каждой проверки верно; два остальных — обобщения,
    которые звучат разумно и не выдерживают проверки
  learning_goal: 'Разбор без вердиктов: что каждая проверка делает и чего не делает, своими словами из
    SETKA. Поворот — обе проверки ошибаются по-разному, а не одна точнее другой.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: утверждение · что показывает разбор. Под ней поворот — две проверки ошибаются по-разному,
      не одна точнее другой.

      '
    backup: Текст разбора — SETKA-KEYSOV-S8.md, Кейс 2, «Разбор», слово в слово. Без стамп «верно/неверно»
      — описание области действия каждой проверки.
- id: n17
  file: slides/n17-k2-obzor.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Перед записью заявки стоят два фильтра по очереди: дешёвый механический решает точные повторы
    сам, спорные случаи передаёт на LLM-проверку, а не наоборот'
  learning_goal: Механика двухступенчатой проверки через модель данных процесса, без скриншота UI (БРИФ
    §3 — живой экран n8n для этого стенда недостижим).
  visual:
    pattern: mechanism_node_graph
    primary: 'Схема: вход заявки → узел хэша и окна времени → точное совпадение (решено сразу) или неоднозначно
      → узел LLM-проверки → запись или отказ. Под схемой врезки: что делает первый фильтр, что передаётся
      на второй, почему в этом порядке.

      '
    backup: 'Устройство — SETKA-KEYSOV-S8.md, Кейс 2, «Наше решение», слово в слово. Workflow на стенде
      — c7evxIhox45tn127 (узлы `Exact duplicate in window?` и `Same question, reworded? (LLM)`, сверено
      БРИФом §3). Скриншота холста нет по БРИФ §3: живой браузерный экран n8n для этого стенда недостижим.'
- id: n18
  file: slides/n18-k2-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 5.0
  assertion: Execution 51 остановлен механическим фильтром и молча пропал без записи и ответа — а статус
