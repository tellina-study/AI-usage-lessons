# library/lectures/lec-05/glossary.yaml
# Glossary LOCK — Лекция 5 «AI-продукт: полный жизненный цикл — от намерения до эксплуатации».
#
# ПЕРЕВЫПУСК 2026-09-30, issue #212. Прежний lock (06.09.2026, issue #189) собирался ДО
# русификации деки: его канонические формы («guardrail-метрика», «agency-ladder»,
# «reference dataset», «pass@k vs pass^k», «SLI / SLO / error budget») больше не
# соответствовали ни одному артефакту, и восемь параллельных сессий русифицировали каждая
# свой раздел независимо — отсюда одиннадцать разошедшихся понятий
# (qa-reports/2026-09-30-roast/consistency.md §4).
#
# Этот файл собран НЕ из плана, а из фактического употребления: собранная дека
# (rendered/lec-05.pptx, видимый слой + заметки), slides/*.md и билдеры
# rendered/slides_band1..6.py. Одно понятие — одно каноническое обозначение.
#
# ПРАВИЛА ВЫБОРА КАНОНА (владелец, 2026-09-30):
#   1. Русское, если оно рабочее. Курс для русскоязычной аудитории.
#   2. Латиница остаётся только там, где она — ИМЯ: продукт, компания, издание, метод без
#      принятого русского имени. Не переводится, но при первом появлении получает русское
#      пояснение рядом.
#   3. Каждая аббревиатура раскрывается при первом появлении в видимом слое.
#   4. Поле `replaces` фиксирует, какие формы канон вытеснил, — чтобы следующая правка
#      не откатила его назад.
#
# ОБЛАСТЬ ДЕЙСТВИЯ: RU-артефакты (slides/*.md, rendered/slides_band*.py без суффикса _en,
# speech.md, speech-part2.md). EN-трек (slides-en/, *_en.py, deck.en.yaml, speech.en.md)
# живёт по своему глоссарию — glossary.en.yaml — и этим файлом не управляется.
#
# СТАТУС АРТЕФАКТОВ на момент перевыпуска:
#   slides/*.md + rendered/slides_band*.py — приведены к канону (эта же правка).
#   rendered/lec-05.pptx — пересобран из них.
#   speech.md + speech-part2.md — НЕ приведены: речь переписывается отдельной сессией
#     по этому файлу (поэтому он и перевыпускается первым).
#   chapter*.md — по решению владельца НЕ правится; расхождения перечислены в
#     `chapter_divergences` ниже как справка, не как задача.

lecture: 5
locked_at: "2026-09-30"
supersedes: "glossary.yaml lock 2026-09-06 (issue #189) — построен до русификации деки"
issue: "#212"
source: >
  Фактическое употребление: rendered/lec-05.pptx (видимый слой + заметки лектора),
  slides/*.md (54), rendered/slides_band1..6.py. Отчёт о расхождениях —
  qa-reports/2026-09-30-roast/consistency.md §4.

# ══════════════════════════════════════════════════════════════════════
# A. Одиннадцать сведённых понятий — то, ради чего перевыпущен lock
# ══════════════════════════════════════════════════════════════════════
resolved_divergences:

  - canonical: "метрика-ограничитель"
    definition: >
      Величина, которую при эксперименте мониторят, но не оптимизируют: она ловит ущерб,
      которого метрика решения не видит.
    introduced_on: "s29 (база Раздела 4)"
    used_on: [s29, s30a, s32, s33, s51, s53]
    replaces: ["страховочная метрика", "страховочная (guardrail) метрика", "guardrail",
               "guardrail-метрика", "OEC / guardrail-метрика (форма прежнего lock)"]
    rationale: >
      Преобладающая форма и единственная, введённая на слайде-базе раздела. «Страховочная»
      жила только на двух слайдах синтеза (s51, s53) и тянула за собой латинское
      `guardrail` в повествовательный слой итоговой матрицы.
    note: >
      Не путать с «ограничителем» в других значениях: дизайн-система — ограничитель
      ГЕНЕРАЦИИ (s17a), «ослабить ограничители» на учениях — защитные правила модели
      (s38b, s39), «стоимость запроса — ограничитель, а не цель» (s45a) — это применение
      того же принципа «мониторим, не оптимизируем», форма канона сохранена.

  - canonical: "эталонный набор"
    definition: >
      Небольшая коллекция реальных случаев, для каждого из которых заранее записано, какой
      ответ считается приемлемым. Проверяется не код, а ответ модели.
    introduced_on: "s24b (ЧТО ЭТО — полное определение на слайде)"
    used_on: [s23, s24a, s24b, s31a, s53]
    replaces: ["набор проверочных примеров", "набор случаев", "reference dataset",
               "эталонный набор (reference dataset)"]
    rationale: >
      Обе формы русские, но «эталонный набор» короче, уже принят речью и главой и
      согласуется с «эталоном» на оси наблюдаемости (s53). «Набор проверочных примеров»
      существовал только на слайдах и расходился со всем остальным.

  - canonical: "шкала самостоятельности"
    definition: >
      Порядок, в котором системе отдают право решать: подсказывает → предлагает решение,
      подтверждает человек → решает сама и возвращает человеку трудное. Одна позиция на
      шкале — «уровень самостоятельности».
    position_term: "уровень самостоятельности"
    introduced_on: "s24a (заголовок + подпись под схемой)"
    used_on: [s23, s24a, s53]
    replaces: ["ступени доверия", "лестница уровней доверия", "уровень доверия",
               "шкала самостоятельности/ступени доверия вперемешку", "ступень автономии",
               "лестница автономии", "лестница агентности", "agency-ladder"]
    rationale: >
      Было ПЯТЬ форм одного понятия. Выбрана та, что уже стояла подписью под самой схемой.
      Слово «ступень» намеренно отдано другому понятию — ступеням поэтапной раскатки
      (s24c), иначе два соседних слайда одного раздела называют «ступенью» разное.
    note: "«Уровень доверия» как риторика снят: он читался как второе имя того же понятия."

  - canonical: "поэтапная раскатка"
    definition: >
      Новое включают не всем сразу, а долями аудитории; на каждой ступени заранее назван
      признак остановки и проверенный путь назад.
    step_term: "ступень раскатки"
    introduced_on: "s24c (практика Раздела 3)"
    used_on: [s21, s23, s24a, s24c, s26, s29, s53]
    replaces: ["постепенная раскатка", "канареечная фаза",
               "blue-green / staged rollout (поэтапная раскатка) — форма прежнего lock"]
    rationale: >
      Форма, совпадающая с речью и главой; «постепенная» существовала только на слайдах.
    related:
      - canonical: "канареечный выпуск"
        definition: "Первая, самая узкая ступень поэтапной раскатки."
        introduced_on: "s22 (в ряду классической механики релиза)"
        used_on: [s22, s24c, s53]
        note: "Режим, а не процесс: «канареечная фаза» как синоним раскатки — снято."

  - canonical: "косвенная метрика"
    definition: >
      Величина, которую легко измерить и которую берут вместо той, что интересует на самом
      деле. Взламывается первой и потому всегда идёт в паре с метрикой-ограничителем.
    introduced_on: "s28 (дивайдер Раздела 4) → разворачивается на s32/s33"
    used_on: [s28, s32, s33, s38a, s51]
    replaces: ["прокси", "прокси-метрика", "показатель-посредник", "косвенный признак"]
    rationale: >
      Было ЧЕТЫРЕ формы, три из них видимы студенту на четырёх разных слайдах.
      «Косвенная метрика» — стандартный русский термин; «прокси» — транслитерация,
      «показатель-посредник» жил в одной ячейке итоговой матрицы.

  - canonical: "рубеж"
    definition: >
      Точка, в которой принимается решение «продолжать или закрыть» либо «пропускать
      дальше или остановить». Рубеж с человеком — тот, который не проходится без решения
      человека.
    introduced_on: "s22 («Рубеж «продолжать или закрыть»», Stage-Gate, Роберт Купер)"
    used_on: [s13a, s21, s22, s27, s45, s51, s53]
    replaces: ["гейт", "человеческий гейт", "go/kill-гейт", "стадийно-гейтовый процесс",
               "гейт остановки", "Stage-Gate go/kill (форма прежнего lock)"]
    rationale: >
      Русская форма уже введена на слайде-базе с именем метода рядом; «гейт» —
      транслитерация, дожившая только до двух слайдов синтеза.
    phrasing:
      - "рубеж «продолжать или закрыть» — решение о судьбе проекта (s22, s27)"
      - "рубеж остановки — блокирующая проверка перед выпуском (s51)"
      - "без человека на рубеже — фазу отдают ИИ без обязательного решения человека (s53)"
    note: "«Stage-Gate» остаётся именем метода на s22 (правило 2), с русским пояснением рядом."

  - canonical: "двойной ромб"
    latin_name: "Double Diamond"
    definition: >
      Два цикла «расширить набор вариантов → свести к одному»: сначала выбирают задачу,
      потом решение.
    introduced_on: "s15 — «Двойной ромб (Double Diamond)», латиница как глосс при первом появлении"
    used_on: [s15, s51]
    replaces: ["Double Diamond голой латиницей в повествовательном слое (s51)",
               "два алмаза", "двойной алмаз"]
    rationale: >
      Имя метода сохранено, но только как глосс при первом появлении (правило 2). Дальше —
      русская форма, уже введённая на s15.

  - canonical: "цена ошибки"
    definition: "Во что обойдётся ошибка: деньги, репутация, здоровье, ответственность."
    introduced_on: "s24c → ось решения на s53"
    used_on: [s22, s24b, s24c, s51, s53]
    replaces: ["стоимость ошибки"]
    note: >
      Не путать со «стоимостью запроса» (s45a) — это цена единицы работы, а не цена
      ошибки.

  - canonical: "цель уровня сервиса (SLO)"
    definition: "Планка, которую команда обещает держать; бюджет ошибок — «единица минус цель»."
    introduced_on: "s37 — «Цель уровня сервиса (SLO)», рядом «Показатель уровня сервиса (SLI)»"
    used_on: [s37, s51]
    replaces: ["целевой уровень сервиса", "SLI / SLO / error budget (форма прежнего lock)"]
    rationale: "Русская форма первой, аббревиатура в скобках при первом появлении (правило 3)."

  - canonical: "аварийный выключатель"
    definition: >
      Механизм, выключающий функцию целиком по заранее названному числовому порогу, — а не
      следующая итерация промпта.
    introduced_on: "s42 (разбор городского бота)"
    used_on: [s42]
    replaces: ["выключатель", "аварийный размыкатель", "circuit breaker"]
    rationale: >
      Голый «выключатель» путался с «переключателем функции» (feature flag) на s22/s23 —
      это разные механизмы. Прилагательное разводит их надёжно.

  - canonical: "эвристики Нильсена"
    definition: >
      Десять коротких правил удобства (1994): знающий человек за полчаса проходит по ним
      готовый вариант и отвечает на вопрос, недоступный машине, — понятно ли это живому
      человеку.
    introduced_on: >
      s15 — «Десять эвристик Якоба Нильсена (1994) — короткий список правил удобства: …»
      (форма + определение в одной строке)
    used_on: [s15, s17a, s18, s51]
    replaces: ["правила удобства (как самостоятельное имя)", "правила Нильсена",
               "эвристики понятности", "эвристики без числа и имени"]
    note: >
      «Короткий список правил удобства» остаётся, но только как ОПРЕДЕЛЕНИЕ внутри первого
      появления на s15, не как второе имя понятия.

