# Семинар 5 — «Когда просьбы недостаточно: барьер, загрузка по требованию, доступ наружу»
# Первое из двух занятий (issue #211). Source-of-truth: rework/section-0/1/2/3 + block-z5.
# Заметки: 8981 слово на 79 мин = 114 слов/мин (эталон отчитанной деки Семинара 4 — 108).

deck:
  seminar_number: 5
  title: "Семинар 5 — Когда просьбы недостаточно: барьер, загрузка по требованию, доступ наружу"
  audience: "3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами"
  duration_min: 88.0  # после переделки примеров в кейсы; слот 90
  format: "слайды фасилитатора + открытые вопросы с карточками (вопрос ДО исследования) + совместное формирование артефакта + механика на примерах; живого терминала нет"
  central_question: "Правило было прочитано — и всё равно нарушено. Если сейчас, без единой детали о конкретном проекте, можно завести только одно усиление — какое?"
  language: ru
  slide_count: 50
  axis: "предотвращаем или решаем — и где подводит интуиция; ось общая на два занятия, здесь заполняются три строки из пяти"
  slot_min: 90

slides:
  - id: s01
    file: slides/s01-oblozhka-centralnyy-vopros.md
    type: hero_cover
    duration_min: 0.75
    assertion: Пять усилений превращают текстовую просьбу в барьер, который агент не обходит, даже если
      захочет — у каждого своя цена и своё место, где интуиция предсказывает не то, что показывает проверка;
      сегодня разбираются три из них
    learning_goal: Открытие занятия одним вопросом, без разгона — прямое продолжение последней фразы Семинара
      4; ось «предотвращаем/решаем + где расходятся интуиция и проверка» заявлена в первой минуте
    visual:
      pattern: hero_cover
  - id: s02
    file: slides/s02-gde-my-ostanovilis.md
    type: code_artifact
    duration_min: 1.25
    assertion: 'Репозиторий на входе в занятие — рабочий прототип с продуктовым, конфигурационным и документационным
      слоями, но каталога `.claude/` в нём нет вовсе: ни хука, ни скилла, ни настроенного MCP-сервера'
    learning_goal: «Где мы остановились» — сверенное состояние репозитория после Семинара 4; явное отсутствие
      .claude/ как точка входа в занятие
    visual:
      pattern: file_tree_snapshot
  - id: s03
    file: slides/s03-os-zanyatiya-keystone.md
    type: keystone_axis
    duration_min: 1.5
    assertion: Каждое усиление либо заводится заранее, на день 0, либо только по сигналу — и у каждого есть
      место, где интуиция предсказывает не то, что показывает проверка
    learning_goal: Keystone-слайд оси занятия — пустая таблица на пять строк, общая на два занятия; три
      строки заполнятся сегодня, две ждут следующего занятия. Неприкосновенный слайд, не режется ни при
      каком дефиците времени
    visual:
      pattern: keystone_scope_map
  - id: s04
    file: slides/s04-vopros-chto-zavesti-pervym.md
    type: reflection_question
    duration_min: 1.5
    assertion: 'Выбор из пяти карточек: какое из пяти усилений завели бы первым, без единой детали о конкретном
      проекте — и тот же вопрос прозвучит сегодня второй раз'
    learning_goal: Первый открытый вопрос занятия — самодиагностика без подсказок, без цифр и без источников;
      обещание второго предъявления вопроса стоит на слайде, а не в заметках, потому что на нём держится
      закрытие занятия
    visual:
      pattern: question_with_option_cards
  - id: s05
    file: slides/s05-pravilo-poryadka.md
    type: answer_breakdown
    duration_min: 3.0
    assertion: У вопроса нет единственно верного ответа — есть правило из трёх вопросов, по которому зал
      сам разложит любое усиление, включая то, которого в пяти карточках нет
    learning_goal: 'Разбор пяти карточек отдаётся залу вместе с критерием: три вопроса, по которым усиление
      попадает в «день 0», «завожу сейчас» или «жду сигнала». Правило применяется вслух ровно к одной карточке
      — к хуку, чей сигнал уже публичен; остальные четыре зал раскладывает по ходу занятия'
    visual:
      pattern: dual_mode_breakdown
  - id: s06
    file: slides/s06-karta-zanyatiya.md
    type: lecture_map
    duration_min: 1.0
    assertion: Три ступени сегодня в порядке разбора — хук, скилл, MCP — и что каждая добавляет в репозиторий;
      субагент и процесс на следующем занятии
    learning_goal: Карта занятия — навигация по трём сегодняшним ступеням через артефакты, которые они добавляют
      в репозиторий, без тайминга и без методических пометок
    visual:
      pattern: lecture_map
  - id: s07
    file: slides/s07-divider-ne-srabotal-vyglyadit-kak-srabotal.md
    type: section_divider
    duration_min: 0.5
    assertion: Барьер, который молчит, потому что пропустил, и барьер, который молчит, потому что сломан,
      снаружи неразличимы — установка барьера не конец работы, а её начало
    learning_goal: Разделитель ступени 3. Заголовок называет боль ступени, а не её решение; тег называет
      масштаб кейса, не его исход
    visual:
      pattern: section_divider_macro
  - id: s08
    file: slides/s08-deystvie-tsena-chastota-nazvany.md
    type: problem_scenario
    duration_min: 1.0
    assertion: 'Критерий прошлого занятия — назови действие, цену и частоту — в этом проекте выполнен целиком:
      прямой коммит в main, сорванный показ заказчику, повтор в той же сессии минутами позже'
    learning_goal: 'Завязка ступени 3 — не повторное открытие того, что текст ненадёжен, а предъявление
      выполненного условия: барьер пора ставить. Состояние, а не диагноз'
    visual:
      pattern: problem_scenario
  - id: s09
    file: slides/s09-vopros-chto-uvidet-chtoby-schitat-rabotayuschim.md
    type: reflection_question
    duration_min: 1.5
    assertion: 'Барьер поставлен — вопрос залу: что нужно увидеть, чтобы считать его работающим, а не просто
      установленным'
    learning_goal: Открытый вопрос ступени 3, на который отвечает именно эта ступень и никакая другая. БЕЗ
      цифр, БЕЗ источников, БЕЗ намёка на целевой ответ. Целевой ответ — негативный контроль, и его почти
      никогда не называют
    visual:
      pattern: question_with_option_cards
  - id: s10
    file: slides/s10-svidetelstva-i-chestnyy-probel.md
    type: research_evidence
    duration_min: 1.0
    assertion: 'Шесть источников сходятся на одном: барьер опознаётся работающим не по тому, что он установлен,
      а по тому, что его заставили и отказать, и пропустить — а распространённости тихо сломанных барьеров
      не измерил никто'
    learning_goal: Свидетельства ступени 3 — таблица источник/что показывает/сила доказательства, отсортированная
      по силе, плюс честный пробел. Идёт ДО разбора ответов зала
    visual:
      pattern: evidence_table_with_gap
  - id: s11
    file: slides/s11-razbor-proverka-kotoruyu-ne-nazyvayut.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: Четыре названные проверки доказывают, что барьер запускается и умеет запрещать; ни одна из
      них не доказывает, что он пропускает — а барьер, который только запрещает, проверен наполовину
    learning_goal: Разбор ответов зала — что каждая проверка ловит и чего не ловит; целевой ответ (негативный
      контроль) назван прямо и вынесен в критерий, который держит остаток ступени
    visual:
      pattern: answer_breakdown_table
  - id: s12
    file: slides/s12-sobiraem-barer-pyat-resheniy.md
    type: cobuilding
    duration_min: 3.0
    assertion: 'Хук собирается пятью решениями, и два из них неочевидны: ветку определяет symbolic-ref,
      а не rev-parse, а на «это ещё не репозиторий» хук отвечает не тишиной и не запретом, а вопросом'
    learning_goal: 'Совместное формирование барьера — все пять решений с ценой каждого; развёрнуто на двух,
      где интуиция даёт неверный ответ. Большой такт: зал отвечает, конфигурация проявляется по ходу'
    visual:
      pattern: cobuilding_config_reveal
  - id: s13
    file: slides/s13-barer-kotoryy-videli-rabotayuschim.md
    type: code_artifact
    duration_min: 1.75
    assertion: 'Собранный хук — реальный файл, который исполнялся: четыре захваченных срабатывания закрывают
      обе половины проверки — запрет, пропуск, состоявшийся коммит и вопрос вне репозитория'
    learning_goal: 'Решение ступени 3 — конфигурация целиком и четыре реальных срабатывания. Третье срабатывание
      отвечает на вопрос зала: это и есть негативный контроль, который почти никто не назвал'
    visual:
      pattern: code_artifact
  - id: s14
    file: slides/s14-proval-odin-pyat-form-mimo-barera.md
    type: failure_vignette
    duration_min: 2.0
    assertion: Пять форм той же самой команды проходят мимо барьера молча — не из-за небрежности условия,
      а потому что оболочка раскрывает слова уже после того, как хук принял решение по тексту
    learning_goal: 'Провал ступени 3, слой 1 — прямой обход именно этого хука: реальный прогон самотеста,
      пять форм с причиной по каждой, структурная невозможность закрыть класс перечислением. Strict-in'
    visual:
      pattern: failure_vignette
  - id: s15
    file: slides/s15-proval-dva-obosli-promolchal-ne-uvidel.md
    type: failure_vignette
    duration_min: 2.0
    assertion: Хук может отказать тихо будучи написанным правильно, может приехать с чужим репозиторием
      как исполняемый код — и в любом случае не видит человека, набравшего ту же команду в своём терминале
    learning_goal: Провал ступени 3, слой 2 — конфигурация как чужой исполняемый код, причины тихого отказа,
      слепое пятно к человеку и к субагенту. Здесь формула прошлого занятия впервые ограничивается, а не
      повторяется. Strict-in
    visual:
      pattern: failure_vignette
  - id: s16
    file: slides/s16-mekhanika-tochka-perekhvata-i-vkhod.md
    type: mechanics
    duration_min: 3.0
    assertion: 'Барьер занимает одну из тридцати трёх точек жизненного цикла и срабатывает после того, как
      модель собрала аргументы: команда написана целиком — и приходит она хуку полным описанием вызова,
      из которого он берёт одно поле'
    learning_goal: 'Механика ступени 3 — точка перехвата и её вход одной мыслью: где именно сидит хук, что
      он в этой точке уже знает, чего не узнает никогда и почему одно поле распаковывается, а не ищется
      текстом. Отвечает на «почему барьер молчит» с предыдущих двух слайдов'
    visual:
      pattern: mechanics_event_map
  - id: s17
    file: slides/s17-mekhanika-chto-vozvraschaetsya.md
    type: mechanics
    duration_min: 1.75
    assertion: Хук отвечает двумя независимыми способами, и код 2 блокирует даже поверх собственного разрешения
      в объекте; а ответ не по формату молчит четырьмя разными способами, а не одним
    learning_goal: 'Механика ступени 3 — контракт ответа: код возврата против объекта решения, приоритет
      между хуками, четыре различимых формы тишины. Четвёртая форма — единственная, которой нет нигде'
    visual:
      pattern: mechanics_response_contract
  - id: s18
    file: slides/s18-mekhanika-kak-poverit-bareru.md
    type: mechanics
    duration_min: 2.75
    assertion: Тихих отказов два принципиально разных, и страшнее выглядит не опасный; различить их и закрыть
      обе половины барьера — три шага, у каждого своё средство
    learning_goal: 'Механика ступени 3 — ответ на вопрос, которым открылась ступень: каталог режимов отказа,
      средства их опознать и три шага проверки, третий из которых и есть негативный контроль. Диагностика
      доводится до починки. Strict-in'
    visual:
      pattern: mechanics_debug_toolkit
  - id: s19
    file: slides/s19-kriterii-tormoz-i-ne-tot-instrument.md
    type: criteria_boundary
    duration_min: 1.0
    assertion: Хук становится тормозом раньше, чем это заметят как ошибку; а полное текстовое перечисление
      всех форм одной команды — не «пока рано», а недостижимо по устройству
    learning_goal: 'Критерий ступени 3 — разведение двух разных вопросов: «здесь ещё рано» (про момент)
      и «здесь не тот инструмент» (про задачу), с базой сравнения у каждой цифры. Strict-in'
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s20
    file: slides/s20-os-zanyatiya-i-samoizoblichenie.md
    type: axis_placement
    duration_min: 1.0
    assertion: Правило было нарушено до того, как мы взялись за барьер; а в репозитории самого курса лежит
      исполняемый хук, которого не регистрирует ничто — ровно тот случай, что разбирался весь раздел
    learning_goal: Строка в ось занятия + самоизобличающий пример, проверяемый двумя командами, + мостик
      к следующей ступени на самом слайде
    visual:
      pattern: axis_placement
  - id: s21
    file: slides/s21-divider-nalog-na-kontekst.md
    type: section_divider
    duration_min: 0.5
    assertion: За текст файла инструкций вы платите в каждой сессии, а открываете его в день приёмки. Хук
      уже стоит, дальше вопрос цены
    learning_goal: Разделитель ступени 4. Вводит метафору налога словами, которые лектор произносит вслух;
      тег называет масштаб кейса, не его исход
    visual:
      pattern: section_divider_macro
  - id: s22
    file: slides/s22-sluchay-svoy-repozitoriy.md
    type: problem_scenario
    duration_min: 1.75
    assertion: Файл инструкций этого курса — 690 строк при собственном пределе в 600. Двадцать восемь из
      них нужны в день приёмки, а читаются всегда
    learning_goal: 'Сцена ступени 4 на проверяемом артефакте: файл, числа, даты, коммит. Без вопроса, без
      карточек, без вывода — вывод делает зал на следующих двух слайдах'
    visual:
      pattern: problem_scenario
  - id: s23
    file: slides/s23-vopros-kuda-vynesti-protseduru.md
    type: reflection_question
    duration_min: 1.25
    assertion: 'Выбор из пяти карточек: куда вынести сверку перед приёмкой, чтобы агент сам понял, когда
      её открыть'
    learning_goal: 'Открытый вопрос ступени 4. БЕЗ цифр, БЕЗ источников, БЕЗ намёка на целевой ответ. Первая
      карточка — законная позиция: по мерке из сцены до предела ещё далеко'
    visual:
      pattern: question_with_option_cards
  - id: s24
    file: slides/s24-chto-pokazali-chetyre-komandy.md
    type: code_artifact
    duration_min: 1.5
    assertion: 'Четыре команды и четыре ответа: счёт с предыдущего слайда можно пересчитать самому. Экономику
      на масштабе одного репозитория не мерил никто'
    learning_goal: Свидетельства ступени 4 предъявляются как воспроизводимый замер, а не как третья за занятие
      таблица источников. Зал может повторить каждую строку у себя
    visual:
      pattern: code_artifact
  - id: s25
    file: slides/s25-razbor-dlina-fayla-ne-otvechaet.md
    type: answer_breakdown
    duration_min: 2.25
    assertion: 'Длина файла на вопрос «пора ли» не отвечает: при двухстах строках те же двадцать восемь
      стоили бы столько же. Считать надо загрузки впустую'
    learning_goal: 'Разбор пяти карточек ступени 4. Первая карточка получает настоящий ответ, а не ярлык
      антипаттерна: её аргумент со сцены разбирается по существу и заменяется рабочей меркой'
    visual:
      pattern: answer_breakdown_table
  - id: s26
    file: slides/s26-cobuilding-nash-skill-ne-srabatyvaet.md
    type: cobuilding
    duration_min: 1.5
    assertion: 'Наш build-deck виден в перечне как «build-deck: build-deck»: описанием стала первая строка
      файла. Готовое описание лежит строкой ниже, и его никто не читает'
    learning_goal: 'Совместное формирование ступени 4, ход 1 — исправление настоящего скилла этого курса:
      наблюдаемое состояние файла, что из него видит модель, и три официальных антипаттерна описания. Целевой
      ответ на слайде не показан'
    visual:
      pattern: cobuilding_bad_example_reveal
  - id: s27
    file: slides/s27-cobuilding-tri-chasti-i-vstrechnoe-sokraschenie.md
    type: cobuilding
    duration_min: 3.0
    assertion: 'Описание — три части: что делает, когда использовать, когда не использовать. Те же двадцать
      восемь строк мы вырезаем из CLAUDE.md'
    learning_goal: 'Совместное формирование ступени 4, ход 2 вместе с решением: три части описания на настоящем
      файле курса, встречное сокращение с настоящим счётом, две проверки и ответ на вопрос «когда он станет
      виден»'
    visual:
      pattern: cobuilding_artifact_reveal
  - id: s28
    file: slides/s28-mekhanika-pervaya-stroka-i-tri-urovnya.md
    type: mechanics
    duration_min: 2.75
    assertion: 'В контексте всегда лежит только первый уровень — имя и описание. Читаются они при одном
      условии: первая строка файла — три дефиса'
    learning_goal: 'Механика ступени 4 одним тактом: три уровня загрузки, условие, при котором фронтматтер
      вообще читается, и точный механизм подстановки, объясняющий сцену с build-deck'
    visual:
      pattern: mechanics_level_one_defaults
  - id: s29
    file: slides/s29-mekhanika-shest-prichin-i-pochinka-kazhdoy.md
    type: mechanics
    duration_min: 2.5
    assertion: Четыре средства отладки спрашивают всё точнее. У каждой из шести причин молчания есть своя
      починка, и две вы уже написали
    learning_goal: 'Механика ступени 4 — каталог отказов, доведённый до починки: схема даёт порядок вопросов
      и чем спрашивать, таблица — причину, её заметность и конкретное действие'
    visual:
      pattern: mechanics_debug_toolkit
  - id: s30
    file: slides/s30-proval-podmenennyy-i-prosto-pokhozhiy.md
    type: failure_vignette
    duration_min: 2.75
    assertion: 'Скилл вредит двумя способами, и оба незаметны: подменённый чужой запускается с вашими правами,
      а свой, честный, уводит работу не туда'
    learning_goal: Провал ступени 4 — один разобранный случай подмены и второй слой без злодея, показанный
      на наших собственных скиллах. Три числа, у каждого названа база
    visual:
      pattern: failure_case_story
  - id: s31
    file: slides/s31-kriterii-kogda-skill-ne-nuzhen.md
    type: criteria_boundary
    duration_min: 2.25
    assertion: 'Процедура просит скилла не всегда: нужна каждую сессию, нужна один раз, нельзя нарушить
      ни разу — заводить рано. А набор «про запас» вреден'
    learning_goal: Критерий ступени 4 — «ещё рано» и «не нужно вообще» двумя разными плашками. В каждой
      строке — настоящий пример из этого репозитория, а не только формулировка правила
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s32
    file: slides/s32-os-sudbu-skilla-reshaet-opisanie.md
    type: axis_placement
    duration_min: 1.5
    assertion: Ступень встаёт в ось как «решаем, по сигналу». Судьбу скилла решает описание снаружи, а содержание
      внутри — нет
    learning_goal: Строка ступени 4 в ось занятия и переход к ступени, которую файлом внутри репозитория
      уже не закрыть. В ось записывается ровно одна строка — та же, что на сводной таблице занятия
    visual:
      pattern: axis_placement
  - id: s33
    file: slides/s33-divider-mcp-dostup-naruzhu.md
    type: section_divider
    duration_min: 0.5
    assertion: Барьер и процедура укрепляли то, что уже лежало в файлах; работа, которую агент должен делать
      дальше, лежит снаружи и меняется без разработчика
    learning_goal: Разделитель ступени 5. Заголовок называет боль, тег называет разбираемый случай — дату
      и исход, а не авторские единицы счёта
    visual:
      pattern: section_divider_macro
  - id: s34
    file: slides/s34-problema-issue-vmesto-messendzhera.md
    type: problem_scenario
    duration_min: 1.5
    assertion: Две задачи этой недели лежат в трекере, а не в файлах, и каждая доезжает до агента шестью
      ручными шагами — потому что единственное, чего в репозитории нет, это список открытых задач
    learning_goal: 'Сцена ступени 5 в грамматике s08: три кадра подряд, подтверждённый коммитом артефакт,
      дословные слова заказчика, пересчитываемое число шагов. Состояние и развилка — без вопроса, без оценки,
      без исхода'
    visual:
      pattern: problem_scenario_with_figure
  - id: s35
    file: slides/s35-vopros-chto-proverit-do-podklyucheniya.md
    type: reflection_question
    duration_min: 1.5
    assertion: Агенту регулярно нужны открытые задачи трекера; вы почти готовы подключить официальный сервер
      — что проверите до этого и в каком порядке
    learning_goal: 'Открытый вопрос ступени 5. Спрашивается ПОРЯДОК, а не одна карточка. БЕЗ цифр, БЕЗ источников,
      БЕЗ намёка на целевую последовательность. Заметки минимальны: говорит зал'
    visual:
      pattern: question_with_option_cards
  - id: s36
    file: slides/s36-svidetelstva-lestnitsa-proveryaemosti.md
    type: research_evidence
    duration_min: 1.5
    assertion: Каждый новый сервер — это новый способ потерять данные, и оснований доверять ему ровно столько
      же, сколько было до подключения
    learning_goal: Свидетельства ступени 5. Полосы упорядочены по тому, кто мог источник перепроверить;
      слайд даёт залу десятисекундное задание, а не зачитывается
    visual:
      pattern: evidence_table_with_gap
  - id: s37
    file: slides/s37-razbor-poryadok-treh-voprosov.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: 'Верный ответ — не одна проверка, а порядок из трёх: сначала «нужно ли вообще», потом «с
      какими правами», и только потом «по какой цене»'
    learning_goal: 'Разбор пяти карточек ступени 5: целевой ответ — последовательность, а не пункт; две
      «не-проверки» разобраны на конкретном случае, а не высмеяны'
    visual:
      pattern: answer_breakdown_with_figure
  - id: s38
    file: slides/s38-cobuilding-operatsii-i-prava.md
    type: cobuilding
    duration_min: 2.0
    assertion: 'Зал называет три операции, и на экране создания токена вычёркивается всё, чего эти три операции
      не требуют: доступ сужается до одного репозитория и четырёх строк прав'
    learning_goal: Совместное формирование, ходы 1–2. Права вычёркиваются НА НАСТОЯЩЕМ экране, с настоящими
      именами строк, — иначе повторить это завтра нельзя. Прямая расплата за ход — на слайде инцидента
    visual:
      pattern: cobuilding_with_figure
  - id: s39
    file: slides/s39-cobuilding-klyuch-i-oblast-vidimosti.md
    type: cobuilding
    duration_min: 2.0
    assertion: Ключ кладётся в окружение оболочки, подключение делается одной командой, и флаг области в
      этой команде решает, увидит ли запись кто-нибудь кроме вас
    learning_goal: 'Совместное формирование, ходы 3–4. Ступень становится повторяемой: названы место ключа,
      сама команда и роль каждого флага. Без этого слайда раздел заканчивался рассказом'
    visual:
      pattern: cobuilding_with_figure
  - id: s40
    file: slides/s40-resheniye-mcp-json-i-tri-primitiva.md
    type: code_artifact
    duration_min: 1.25
    assertion: Команда записала в .mcp.json четыре решения разговора — чем запускать, что запускать, откуда
      брать ключ, — а пятое, права этого ключа, в файле не лежит вовсе
    learning_goal: 'Решение ступени 5: настоящий .mcp.json с разметкой «какая строка отвечает на какой вопрос
      разговора», плюс три вещи, которые сервер отдаёт агенту, различённые по тому, кто решает их применить'
    visual:
      pattern: code_artifact_with_figure
  - id: s41
    file: slides/s41-mekhanika-ot-fayla-do-instrumenta.md
    type: mechanics
    duration_min: 2.5
    assertion: Одно и то же действие стоит 1 365 токенов обычной командой и 44 026 через инструмент сервера,
      и разница объясняется третьим тактом механики — тем, что именно доезжает до модели
    learning_goal: 'Большой такт механики ступени 5: где запись лежит, что из неё исполняется, что из сервера
      попадает в контекст. Цена подаётся как следствие режима загрузки и получает здесь свой механизм, а
      не отдельный слайд'
    visual:
      pattern: mechanics_with_figure
  - id: s42
    file: slides/s42-mekhanika-poryadok-otladki.md
    type: mechanics
    duration_min: 2.5
    assertion: Зелёный статус говорит только о том, что процесс поднялся; два отказа этого курса — оба при
      зелёном или почти зелёном статусе — нашлись четвёртым шагом, прямым запуском команды из конфигурации
    learning_goal: Большой такт отладки ступени 5. Каждый шаг назван КОМАНДОЙ, а не действием; оба разобранных
      отказа названы по имени, с датой, причиной и починкой — это случаи, а не строки таблицы
    visual:
      pattern: mechanics_with_figure
  - id: s43
    file: slides/s43-proval-ekfiltratsiya-smertelnoe-trio.md
    type: failure_vignette
    duration_min: 2.25
    assertion: 26 мая 2025 агент прочитал задачу в чужом публичном репозитории, выполнил вложенную в неё
      инструкцию и сам открыл правку с содержимым приватных репозиториев — сработало то самое право, которое
      мы вычеркнули десять минут назад
    learning_goal: 'Провал ступени 5, слой 1 — разбор названного инцидента: дата, продукт, приманка, что
      утекло. Трио получает имя и номера здесь, чтобы критерий на s45 мог на них сослаться'
    visual:
      pattern: failure_vignette_with_figure
  - id: s44
    file: slides/s44-proval-odobrenie-ne-navsegda.md
    type: failure_vignette
    duration_min: 1.75
    assertion: Пакет пятнадцать версий вёл себя честно, в шестнадцатой получил одну строку, которая тайно
      копировала каждое письмо на чужой адрес, — и повторно одобрения не спросил никто
    learning_goal: Провал ступени 5, слой 3. Разобранный случай с именем и датой вместо абзаца статистики;
      эксперимент стоит третьим кадром как объяснение, почему повторного вопроса не было
    visual:
      pattern: failure_vignette_with_figure
  - id: s45
    file: slides/s45-kriterii-razovoy-zadache-i-izvestnoy-komande.md
    type: criteria_boundary
    duration_min: 1.75
    assertion: 'Разовой задаче сервер не нужен пока — задаче, которая сводится к известной команде, он не
      нужен никогда: первое ждёт сигнала, второе не изменится от роста доверия'
    learning_goal: Критерий ступени 5. Каждая строка получает пример, иначе это памятка. Стоп-критерий отделён
      от пунктов для размышления и опирается на названное трио
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s46
    file: slides/s46-os-tri-stroki-iz-pyati.md
    type: recap_table
    duration_min: 2.0
    assertion: Три строки оси закрыты — хук, скилл, MCP, каждая с расхождением между интуицией и проверкой;
      субагент и процесс остаются пустыми до следующего занятия
    learning_goal: 'Контрольная точка, не развязка: та же таблица, что открывала занятие пустой, теперь
      с тремя заполненными строками; синтез и тезисы на вынос — в закрытии следующего занятия, не здесь'
    visual:
      pattern: recap_table
  - id: s47
    file: slides/s47-derevo-repozitoriya-za-zanyatie.md
    type: code_artifact
    duration_min: 1.25
    assertion: Три ступени добавили в репозиторий два файла, подтверждённых коммитом, и два блока по плану
      без коммита — граница между «написано» и «уже работает» показана на слайде, а не спрятана
    learning_goal: Дерево репозитория за занятие — явная граница подтверждённого коммитом и запланированного;
      та же дисциплина «не путать план с фактом», которая была темой всего занятия
    visual:
      pattern: file_tree_snapshot
  - id: s48
    file: slides/s48-tot-zhe-vopros-vtoroy-raz.md
    type: reflection_question
    duration_min: 3.0
    assertion: Тот же вопрос открытия и те же пять карточек — второй раз за занятие; зал отвечает снова,
      и вслух называется, у кого ответ изменился и что его изменило
    learning_goal: 'Закрытие петли, открытой на s04: вопрос предъявляется дословно второй раз, теми же пятью
      карточками, и отвечает на него зал, а не лектор. Разбор того, что за час стало проверяемым, — только
      на следующем слайде'
    visual:
      pattern: question_repeat
  - id: s49
    file: slides/s49-chto-uzhe-razlozheno.md
    type: answer_breakdown
    duration_min: 1.5
    assertion: Три карточки из пяти теперь раскладываются по артефакту, который можно открыть и проверить;
      две не раскладываются ничем — их ступени впереди
    learning_goal: 'Разбор второго голосования: что за час стало проверяемым и чем именно. Асимметрия между
      «разложено по артефакту» и «не разложено вовсе» проговаривается вслух; ответ по двум оставшимся не
      даётся и не намекается'
    visual:
      pattern: answer_breakdown_table
  - id: s50
    file: slides/s50-perenos-na-svoy-repozitoriy.md
    type: closing_question
    duration_min: 1.5
    assertion: Три сегодняшних усиления переносятся на свой рабочий репозиторий по тому же правилу — и третья
      корзина, «не нужно вообще», стоит на слайде наравне с первыми двумя
    learning_goal: 'Перенос на личный контекст — единственное место занятия, где материалом служит не signup-landing,
      а репозиторий каждого в зале. Ответы вслух не собираются и не разбираются: вопрос инициирует перенос,
      а не проверяет знание'
    visual:
      pattern: transfer_exercise
