      (эмбеддинги документов уже посчитаны заранее, как и в Кейсе 1); «Cosine ranking (vector)» сравнивает
      этот эмбеддинг со всеми документами; и только после того, как ОБА списка (`keyword_rank`, `vector_rank`)
      готовы, узел «RRF fusion (hybrid)» сливает их. Два сигнала логически независимы и могли бы считаться
      в двух параллельных ветвях — реальный сценарий выбрал линейную цепочку одного исполнения, это решение
      реализации, не требование архитектуры (слой 1, n52).

      МОДЕЛЬ НАЗВАНА ПО ИМЕНИ (С5): `text-embedding-3-small` (эмбеддинг запроса, узел «Embed query») и
      `gpt-4o-mini` (реранкер, узел «LLM-реранкер») — обе видны прямо в подписи узла на холсте, в отличие
      от Кейса 1, где имя модели в подписи узла не показано.

      ДЕМО-ПРОГОН, НЕ ПОВТОР ОСНОВНОГО ЗАМЕРА: показывает механику холста на маленьком подмножестве корпуса
      (8 документов, включая путающую пару на сущности «Звёздный»), не повторяет числа recall@1/@3 основного
      замера на 500 документах/50 вопросах (n46/n48) — `stend/README.md` § «Доп. проход 2026-11-01», execution
      на этом сценарии.'
- id: n54
  file: slides/n54-k3-panel-sliyaniya.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Слияние — тринадцать строк кода: Reciprocal Rank Fusion с k=60, без единого обращения к
    модели'
  learning_goal: 'Слой 2 Кейса 3, такт 2 из 3: настоящая панель настройки узла слияния, РАЗВЁРНУТЫЙ вид
    редактора кода (не сжатый — урок Семинара 9: сжатый вид обрезает текст).'
  visual:
    pattern: mechanism_node_graph
    figure: case3-n8n-rrf-panel-real.png
    primary: 'Настоящий скрин развёрнутого редактора кода узла «RRF fusion (hybrid)»: функция `rrf(rankA,
      rankB, k=60)` считает Reciprocal Rank Fusion двух списков и возвращает топ-10 кандидатов с текстом.

      '
    backup: 'Источник кадра: `stend/n8n-screenshots-raw/case3-rrf-panel.png` (узел `Code`, режим «Run
      Once for All Items», язык JavaScript), снят `stend/n8n_shots.py` в РАЗВЁРНУТОМ виде редактора. Кроп
      — `rendered/compose_case3_n8n_shots.py`: убраны вкладки Parameters/Settings и поля Mode/Language
      сверху (служебная часть интерфейса, не код узла) и подсказка тулкита снизу; все 13 строк кода видны
      целиком, ни одна не обрезана.

      ЧТО НА КАДРЕ ВИДНО БУКВАЛЬНО: функция `rrf(rankA, rankB, k=60)` (строки 2–7) — классическая формула
      Reciprocal Rank Fusion: каждому документу каждого списка начисляется `1/(k+i+1)`, где `i` — позиция
      документа в этом списке, очки от обоих списков складываются. Строка 8 вызывает её на `d.keyword_rank`
      и `d.vector_rank` — двух списках, которые уже посчитали предыдущие узлы холста (n53). Строки 9–12
      берут топ-10 документов объединённого рейтинга и достают их текст из корпуса. Строка 13 возвращает
      результат — объединённый ранг, id топ-10 и их текст — следующему узлу.

      МОДЕЛЬ НЕ НАЗВАНА, И ЭТО ЧЕСТНО (С5-следствие): в этом узле её и нет. RRF — классическая, не-ИИ
      формула; это явно видно по коду — ни одного вызова HTTP, ни одного обращения к OpenRouter. Единственные
      два числа, которые этот код решает сам, без модели, — `k=60` (сглаживающая константа формулы) и
      `TOP_N=10` (сколько кандидатов передать дальше реранкеру).'
