      «четверть»), то же сравнение не срабатывает ни разу — 15 из 15 верных совпадений.

      ЧЕСТНАЯ МЕТОДИЧЕСКАЯ ОГОВОРКА СТОИТ НА КАДРЕ, не только в backup: демонстрация построена на ДАТЕ,
      потому что на дате отказ реально случился; на СУММЕ этого замера отказов не нашлось вовсе (такт
