- id: n54
  file: slides-en/n54-k3-panel-sliyaniya.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'The merge is thirteen lines of code: Reciprocal Rank Fusion with k=60, with not a single
    model call'
  learning_goal: 'Layer 2 of Case 3, beat 2 of 3: a real configuration panel of the merge node, the EXPANDED
    view of the code editor (not collapsed — a Seminar 9 lesson: the collapsed view cuts off text).'
  visual:
    pattern: mechanism_node_graph
    figure: case3-n8n-rrf-panel-real.png
    primary: 'A real screenshot of the expanded code editor of the "RRF fusion (hybrid)" node: the function
      `rrf(rankA, rankB, k=60)` computes Reciprocal Rank Fusion of two lists and returns the top-10 candidates
      with their text.

      '
    backup: 'Source of the frame: `stend/n8n-screenshots-raw/case3-rrf-panel.png` (a `Code` node, mode
      "Run Once for All Items," language JavaScript), captured by `stend/n8n_shots.py` in the EXPANDED
      view of the editor. Crop — `rendered/compose_case3_n8n_shots.py`: the Parameters/Settings tabs and
      the Mode/Language fields at the top are removed (the interface''s housekeeping part, not the node''s
      code), as is the toolkit hint at the bottom; all 13 lines of code are visible in full, none are
      cut off.

      WHAT IS LITERALLY VISIBLE ON THE FRAME: the function `rrf(rankA, rankB, k=60)` (lines 2–7) — the
      classic Reciprocal Rank Fusion formula: each document of each list is scored `1/(k+i+1)`, where
      `i` is the document''s position in that list, and the scores from both lists are summed. Line 8
      calls it on `d.keyword_rank` and `d.vector_rank` — the two lists the previous canvas nodes already
      computed (n53). Lines 9–12 take the top-10 documents of the merged ranking and pull their text from
      the corpus. Line 13 returns the result — the merged rank, the top-10 ids, and their text — to the
      next node.

      THE MODEL ISN''T NAMED, AND THAT''S HONEST (a C5 consequence): there isn''t one in this node. RRF
      is a classic, non-AI formula; this is plainly visible from the code — not a single HTTP call, not
      a single call to OpenRouter. The only two numbers this code decides on its own, with no model, are
      `k=60` (the formula''s smoothing constant) and `TOP_N=10` (how many candidates to pass on to the
      reranker).'
