      широко задокументированные инциденты, допустимо как есть»; на кадре они стоят без цифр ущерба именно
      поэтому, и несут они не число, а разницу: был ли у шага реальный канал исполнения.

      Служебный код уязвимости на видимый слой не вынесен — случай назван словами; код оставлен здесь
      для прослеживаемости.

      Предел приёма назван прямой строкой, а не оговоркой в конце: отдельное поле убирает подмену там,
      где у решения есть источник истины вне текста, и не строится там, где такого источника по природе
