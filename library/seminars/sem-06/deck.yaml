- id: n17
  file: slides/n17-podklyucheno-ne-znachit-chto-agent-tuda-hodit.md
  type: mechanics_map
  duration_min: 1.0
  assertion: 'Зелёная отметка подключения — факт о процессе: он поднялся и ответил. Обращался ли к серверу
