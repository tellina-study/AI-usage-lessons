ai_failure_judgment:
  # AI-Failure & Judgment Content Rule (ENFORCED): ≥30% strict-in по МИНУТАМ, waiver НЕДОСТУПЕН.
  strict_in_slides: [s12, s13a, s19, s26, s27, s33, s34, s40, s41, s42, s47, s48, s53]
  count: 13
  strict_in_minutes: 28.0
  share_by_minutes: >
    28,0 из 98,1 мин полного прохода (сверка issue #212, 2026-09-30: снят s05, снят s54 —
    содержание вошло в s53, слайд-инструмент решения s53 сам перешёл из partial_out в
    in_bucket по фронтматтеру slides/s53-decision-triad.md) = 28,5%; из ≈82 активных мин =
    34,1%. Со слайдами границ («что остаётся человеку», «здесь ИИ не тот инструмент»: s11
    1,5 · s18 2,0 · s25 1,5 · s32 2,0 · s39 2,0 = 9,0 мин) — 37,0 из 98,1 = 37,7%.
  guard_after_rescope: >
    Аудит пересборки предупредил прямо: слайд-практика по конструкции смешанный (механизм и
    артефакт — «как применять», граница и критерий — bucket-контент), поэтому менять провалы
    на практики один к одному нельзя — доля упадёт. Сверка issue #212 (2026-09-30) закрыла
    этот риск с другой стороны: слайд s53 после слияния с бывшим чек-листом s54 (три оси +
    требование по каждой оси = распределение бремени доказательства, «когда ИИ да, когда
    нет», а не механизм применения) сам квалифицирован в slides/s53-decision-triad.md как
    in_bucket, а не partial_out — перенесён в strict_in_slides. Guard-условие: сумма минут
    (провалы + s53 + границы) ≥ 30% активного времени держится с запасом. По факту сборки
    37,0 из 82 активных = 45,1%. Классификация границ оставлена консервативной (partial→out);
    окончательный пересчёт strict-in — за methodology-critic на Ф7.
