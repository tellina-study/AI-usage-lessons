  - id: s01
    file: slides/s01-ice-breaker-cv.md
    type: live_demo
    duration_min: 3
    assertion: "Идентификация людей в реальном времени — на ноутбуке, без интернета, с 2023 года."
    learning_goal: "Открывающий hook: AI — рабочий локальный инструмент"
    learning_outcomes: [LO1]
    references: [yolov8-ultralytics-2023, mediapipe-google]
    visual:
      pattern: external_demo
      primary: "Mock YOLO inference output (2 человека в bbox) обрамлён Ocean rounded box; assertion слева"
      backup: assets/code/ice-breaker-cv/backup/screenshot.png
    interaction: live_demo

  - id: s00a
    file: slides/s00a-welcome.md
    type: cover
    duration_min: 0.5
    assertion: "Добро пожаловать на курс «Отраслевое применение систем искусственного интеллекта»"
    learning_goal: "Короткое приветствие перед титульным слайдом лекции 1"
    learning_outcomes: []
    references: []
    visual:
      pattern: welcome_hero
      primary: "Hero/title-composition в Ocean palette, тонированный фон, крупная типография; БЕЗ Ocean rounded box motif (motif — только для content-слайдов)"

  - id: s00b
    file: slides/s00b-course-hook.md
    type: assertion_visual
    duration_min: 1
    assertion: 'Главный вопрос курса — не «можно ли AI?», а «нужно ли и где?»'
    learning_goal: "Хук вовлечения перед титулом: воронка внедрения + центральный вопрос курса"
    learning_outcomes: [LO1, LO4]
    references: [gartner-2024, cnews-vedomosti-2026]
    visual:
      pattern: central_question
      primary: "Funnel 100% → 10% (gold endpoint, *illustration of principle*) слева + main takeaway + central question справа"

  - id: s02
    file: slides/s02-cover.md
    type: cover
    duration_min: 0.5
    assertion: "Что такое AI? История, классификация, общие понятия"
    learning_goal: "Cover-слайд: визуально отличается от content slides"
    learning_outcomes: [LO1, LO4, LO6]
    references: []
    visual:
      pattern: cover_distinct
      primary: "Декоративная «01» в outline, title 64pt, navigational subtitle, hero motif справа"

  - id: s02a
    file: slides/s02a-lecture-map.md
