<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
<rect width="720" height="640" fill="#FFFFFF"/>

<!-- Title -->
<text x="360" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#21295C">Attention matrix 7x7 (single-head, simplified)</text>
<text x="360" y="52" text-anchor="middle" font-family="Arial" font-size="12" fill="#1C7293" font-style="italic">"The cat ate the mouse, because she was hungry"</text>

<!-- Column labels (top) -->
<text x="160" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">cat</text>
<text x="230" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">ate</text>
<text x="300" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">mouse</text>
<text x="370" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#21295C" font-weight="bold">be-</text>
<text x="370" y="93" text-anchor="middle" font-family="Arial" font-size="11" fill="#21295C" font-weight="bold">cause</text>
<text x="440" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">she</text>
<text x="510" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">was</text>
<text x="580" y="92" text-anchor="middle" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">hungry</text>

<!-- Row labels (left) — colored boxes for matrix cells -->
<!-- Helper: each cell is 60×60, starts at x=130, y=100; gap=10 between cells via spacing -->

<!-- Cell color mapping:
  v >= 0.9: #21295C (almost black/dark)  (diagonal)
  v 0.5-0.7: GOLD #F0AB00 (highlight for she->mouse)
  v 0.3-0.5: #065A82 dark
  v 0.2-0.3: #1C7293 medium
  v 0.1-0.2: #B3CADD light
  v <0.1: #E3ECF3 very light
-->

<!-- Row 1: cat -->
<text x="120" y="138" text-anchor="end" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">cat</text>
<rect x="130" y="105" width="60" height="60" fill="#21295C"/><text x="160" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">1.0</text>
<rect x="200" y="105" width="60" height="60" fill="#065A82"/><text x="230" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.3</text>
<rect x="270" y="105" width="60" height="60" fill="#1C7293"/><text x="300" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
<rect x="340" y="105" width="60" height="60" fill="#B3CADD"/><text x="370" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#21295C">0.1</text>
<rect x="410" y="105" width="60" height="60" fill="#B3CADD"/><text x="440" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#21295C">0.1</text>
<rect x="480" y="105" width="60" height="60" fill="#B3CADD"/><text x="510" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#21295C">0.1</text>
<rect x="550" y="105" width="60" height="60" fill="#E3ECF3"/><text x="580" y="142" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#21295C">0.0</text>

<!-- Row 2: ate -->
<text x="120" y="203" text-anchor="end" font-family="Arial" font-size="12" fill="#21295C" font-weight="bold">ate</text>
