      '
    backup: 'WORDING TIGHTENED (K2-5, review 2026-10-29). The earlier edit named a direction with no address
      ("move important items to the start or the end" without saying this is a choice between two specific
      spots; "repeat the question around the list" without saying you can repeat it only before, only
      after, or on both sides). The new edit names a SPECIFIC binary choice inside each card -- closer
