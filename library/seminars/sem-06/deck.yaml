- id: n32
  file: slides/n32-stsena-nashyol-chetyre-mesta-pravku-nachal-zanovo.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'Разработчик нашёл все четыре места, где проверяется лимит участников, прочитав сорок файлов
    в той же сессии, где уже была объяснена правка, — и когда дошло до самой правки, агент переспросил
    объяснённое утром: контекст занят чужим чтением, полчаса ушло на повтор'
  learning_goal: 'Завязка кейса: объём чтения, нужного для короткого вывода, не связан с размером вывода,
    а результат этого чтения нужен там же, где лежит работа. Узнаваемая рабочая ситуация (новый тариф
    и лимит, разъехавшийся по кодовой базе), не сконструированная под мораль — владелец прямо отверг «примеры
    из пальца». Круг 5 (issue 225): сцена заменена целиком. Прежняя была про посторонний вопрос технического
    директора, и зал законно спрашивал, почему герой не открыл под него вторую сессию; на этот вопрос
    занятие не отвечало. Теперь чтение служит правке, которая лежит в этой же сессии, и результат чтения
    обязан вернуться сюда же — вторая сессия даёт ответ, но не возвращает его в работу. Сцена же предъявляет
    целиком второй промах открытия («нужное влезло внутрь и вытеснило работу», n04, строка вторая). Решение
    не называется'
  visual:
    pattern: problem_scenario
    primary: 'Пять шагов нумерованным списком: задача дня, пятнадцать минут объяснения агенту, зачем нужен
      поиск перед правкой, где на самом деле живёт лимит (четыре места) и сколько файлов надо открыть,
      и что случилось, когда дошло до самой правки. Внизу выделенная строка: цена — полчаса на повтор
      объяснения, и прямая отсылка ко второму промаху открытия.'
    backup: 'Круг 5 (issue 225, ZADANIE-KRUG-5.md, дословно: «не понятно почему он на отвлеченный вопрос
      не поднял вторую сессию. надо что-то более жизненное и логичное»). Было: технический директор спрашивал
      в чате про лимит бесплатного тарифа, герой читал сорок файлов и отвечал «да, но…», а правка, под
      которую открыли сессию, была намеренно НЕ связана с вопросом — и вместе с этой несвязанностью исчезала
      причина читать именно здесь. Стало: чтение и правка — одна работа. Герой правит лимит, и чтобы править,
      ему нужен список мест, где лимит проверяется; список нужен агенту, который правит, то есть в этой
      сессии. Поворот кейса не тронут (субагент читает не быстрее, экономится место в контексте) — изменилось
      только то, почему чтение не вынести. Класс сцены — ровно тот, что назвал владелец кругом раньше:
      «понять, где в проекте живёт некоторое поведение, и для этого прочитать десятки файлов». Деталь
      (лимит участников, разбросанный по middleware / конфигу / миграциям / клиенту) — обычная ситуация
      любого продукта с тарифными планами; демо-репозиторий занятия для честной сцены на сорок файлов
      слишком мал, поэтому сцена идёт в рабочем продукте героя, и это сказано на экране первой же строкой.
      Цена пересчитана с часа на полчаса: пятнадцать минут объяснения, потраченные дважды, плюс возврат
      в прерванную работу — час при двадцатиминутном чтении читался натяжкой. ДЕНЬ НЕДЕЛИ НЕ НАЗВАН НАМЕРЕННО:
      открытие (n04) называет этот промах средой, и той же средой названа сцена первого кейса блока MCP
      (n10) — другой эпизод; третье вхождение слова закрепило бы путаницу.'
- id: n33
  file: slides/n33-vopros-chto-delat-s-etim-chteniem.md
  type: reflection_question
  duration_min: 0.75
  assertion: 'Править надо в четырёх местах, а чтобы их найти — открыть сорок файлов: зал сперва вспоминает
