    backup: 'Данные — BRIEF-PROIZVODSTVO.md §3 «Кейс 3», проверено оркестратором напрямую через n8n API
      2026-10-18 чтением runData, не пересказ. Живой браузерный скрин экрана /executions/<id> недостижим
