    file: slides/s05-pattern-why-not-llm.md
    type: assertion_visual
    section: "Раздел 1. Прогнозирование рядов"
    duration_min: 1.5
    assertion: "Прогноз ряда — предсказание следующего ЧИСЛА с трендом и сезонностью; LLM предсказывает следующий ТОКЕН ТЕКСТА — это структурно разные задачи"
    learning_goal: "Тип ИИ под прогноз = классическая статистика/ML; «почему НЕ LLM» операционализирован 3 фразами"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s05]"
    references: []
    in_bucket: false
    visual:
