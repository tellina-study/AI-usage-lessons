  - id: s32
    file: slides-en/s32-primer-predskazatelnaya-kompensatsiya.md
    type: case_study
    section: "2. Remote control"
    assertion: "The model predicts the picture forward by the amount of the latency and cuts task time by up to 26% — but the human still makes the decisions"
    learning_goal: "§2.5: the predictive latency compensation case study, a research-stage result"

  - id: s33
    file: slides-en/s33-primer-astrobee.md
    type: case_study
    section: "2. Remote control"
    assertion: "Astrobee demonstrated a \"warm start\": the model proposes a trajectory, and the classical controller refines it"
    learning_goal: "§2.6: the Astrobee case study, TRL5, with the developing organization explicitly named"

  - id: s34
    file: slides-en/s34-upominaniya-razdel-2.md
    type: norm
    section: "2. Remote control"
    assertion: "Telesurgery over Starlink operates at a latency of ~130 ms — but there is no trained model in the decision at all"
    learning_goal: "§2.7: exoskeletons, Earth–ISS latency, telesurgery as an honest zero case"

  - id: s35
    file: slides-en/s35-chto-dalo-i-potrebovalo-razdel-2.md
    type: schema_matrix
    section: "2. Remote control"
    assertion: "From automation on a pre-designated segment to automation on every cycle, but never the final word"
    learning_goal: "§2.8 + the cumulative stage map: five cells filled after two sections"

  - id: s36
    file: slides-en/s36-vyvod-razdela-2.md
    type: norm
    section: "2. Remote control"
    assertion: "The human stays in the loop for as long as latency and the speed of events genuinely allow it"
    learning_goal: "§2.9: the conclusion of Section 2, a bridge back to Section 1 — why autonomy on Mars is necessary, not merely convenient"

  # ===== Section 3. Design and new capabilities =====
  - id: s37
    file: slides-en/s37-divider-razdel-3.md
    type: divider
    section: "3. Design and new capabilities"
    assertion: "3. Design and new capabilities"
    learning_goal: "Divider: the Raptor surrogate, Claude's rover route, AIFS/AIGEFS, NASA's generative design"

  - id: s38
    file: slides-en/s38-stadiya-proektirovanie-i-prognoz.md
    type: norm
    section: "3. Design and new capabilities"
