      primary: "2 панели в Ocean rounded box: X5 (3 stat-плашки: >70% точность · +5 млрд ₽ · −2% списаний, gold на +5 млрд) + Магнит (импортозамещение SAP/Blue Yonder → своя F&R). Вывод-плашка «ни один не взял LLM — тип диктуется задачей». Footer — атрибуция+[VFY-day-of] caveat."
