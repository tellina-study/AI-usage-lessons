    же форме — коротким синтезом, не заполнением клеток, которых не было. Дословная фраза вопроса — та
    же, что на n05, подана плашкой-возвратом; заголовок переписан, чтобы не повторять эту же плашку словами
    (находка оркестратора при пиксельном просмотре — заголовок и плашка говорили одно и то же). Исправлена
    гонка чисел «три/четыре» (находка оркестратора): кейсов и способов-ответов на «чем» — четыре, не три,
    по всему кадру и фронтматтеру. Добавлен четвёртый видимый блок — ряд названий нитей без чисел-спойлеров
    — чтобы заполнить нижнюю треть кадра содержанием, а не пустотой (находка оркестратора при пиксельном
    просмотре).'
  visual:
    pattern: recap_table
    primary: 'Вопрос занятия крупной плашкой (тот же текст, что на n05, возврат к оси). Под ним — одна
      строка синтеза. Ниже — ряд из четырёх названий нитей без чисел. Внизу — переход к сквозному числу.

