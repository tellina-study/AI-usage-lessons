  file: slides-en/n03-lestnitsa-napominanie.md
  type: arc_ladder_recap
  duration_min: 2.0
  assertion: Six rungs of trust in the model, one per session; today's is the third, answering a human
  learning_goal: 'A reminder of the arc ladder, not a re-introduction. The slide carries the ladder figure:
