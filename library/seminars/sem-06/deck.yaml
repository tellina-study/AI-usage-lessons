      Круг правок владельца (issue 225, §А1+§А5): строка «процесс» снята полностью — лестница занятия
      заканчивается на субагенте, четыре строки — вся ось этого занятия, не четыре из пяти. Колонки «что
      обещает устройство» / «что показала проверка» заменены на «что делает» / «что не делает — ограничение»,
