      ИСТОЧНИК ВРЕЗКИ «НЕ ПОЧИНИТСЯ САМО» И ЕГО ОСОБОЕ ПОЛОЖЕНИЕ. Такт «Нюансы» сетки, пункт 1, опирается
      на работу 2025 года «Lost in the Middle: An Emergent Property from Information Retrieval Demands
      in LLMs» (arXiv:2510.10276, Salvatore, Wang, Zhang). Этой работы НЕТ в CHISLA-SVERENO.md — сверка
