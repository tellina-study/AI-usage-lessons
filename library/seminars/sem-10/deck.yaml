      МОСТ К n57: промт просит модель вернуть СТРОГУЮ перестановку номеров — она не добавляет и не убирает
      кандидатов, только переставляет уже данные десять. Это прямая причина того, почему реранкер физически
      не может поднять документ, которого не было среди top-10 кандидатов до него (нюанс про вопрос с
