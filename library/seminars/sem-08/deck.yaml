# Где решает модель, а где должен — код
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 08
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    4.00 мин
#   Ось        n04–n04    2.50 мин
#   Кейсы      n05–n48   87.00 мин
#   Закрытие   n49–n51    7.00 мин
#   ИТОГО                 100.50 мин при слоте 90

deck:
  seminar_number: 8
  title: Где решает модель, а где должен — код
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 100.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + измеренный эксперимент
    Кейса 3 (51 прогон); на занятии ведущий ничего не редактирует в узлах n8n вживую — только прогоняет
    уже готовые процессы (решение владельца, см. ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Как собрать уведомление из уже известных значений заявки?
  language: ru
  slide_count: 51
  axis: Где в цепочке решение принимает модель, а где должен — код, и что молчит, когда эту границу не
    назвали явно?
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Цепочка с прошлого занятия получает новые шаги; для каждого спрашиваем одно: решает это
    модель, или должен решать код'
  learning_goal: Обложка. Называет занятие и его место в дуге; номера семинара на экране нет (решение
    владельца, sem-06/qa/oblozhka-bez-nomera.md).
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет.

      '
    backup: 'Вторая волна производства (issue #274) — первый прогон собрал деку, прошёл всех критиков,
      и владелец отклонил подход деки целиком, не детали; пять структурных претензий формализованы каноном
      proektirovanie-keysa-i-voprosa.md и применены по всей деке начиная с этого слайда. Заголовок повторяет
      ось занятия (ARCHITECTURE.md §1), не тезис одного кейса.'
- id: n02
  file: slides/n02-shov-s7-s8.md
  type: mechanism_node_graph
  duration_min: 2.0
  assertion: 'Процесс печатается как есть — шесть узлов с прошлого занятия, включая ветку отказа; сегодня
    к каждому новому шагу мы будем задавать один вопрос: решает это модель, или должен решать код'
  learning_goal: 'Шов С7→С8: входное состояние показано дословно, без пересказа; формулировка вопроса
    занятия произносится здесь первым разом, до оси (ARCHITECTURE.md §2).'
  visual:
    pattern: mechanism_node_graph
    primary: 'Схема шести узлов, напечатанная как есть: форма → извлечение полей со схемой → сверка со
      справочником → запись в таблицу → экран результата, плюс ветка отказа от узла извлечения. Под схемой
      — одна реплика крупно.

      '
    backup: 'Источник: SETKA-KEYSOV-S8.md «Шов: от чего мы начинаем» — входное состояние дословно student.json
      из sem-07/stend (шесть узлов С7, включая уже построенную ветку отказа на узле извлечения). Статус
      «не распознано» на экране — человеческое имя значения; реальное поле хранения (`not_parsed`) из
      student.json — только здесь, в backup, не на видимом слое (канон proektirovanie-keysa-i-voprosa.md
      §3).'
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: taxonomy_compare_table
  duration_min: 1.5
  assertion: Мы остаёмся на той же ступени лестницы дуги, что и в прошлый раз — цепочка; сегодня мы её
    не поднимаем, а заканчиваем
  learning_goal: 'Короткое напоминание лестницы дуги, не повторный ввод: аудитория уже видела обе картинки
    на С7 (ARCHITECTURE.md §2).'
  visual:
    pattern: taxonomy_compare_table
    figure: lestnitsa-dugi.png
    primary: 'Тот же снимок лестницы дуги, что на С7 — золотая ступень «цепочка» не сдвинулась. Под ним
      короткое сравнение в две строки: что держал С7, что держит С8.

      '
    backup: 'Фигура lestnitsa-dugi.png переносится без изменений из sem-07/rendered/ figures — С7 и С8
      стоят на ОДНОЙ ступени («цепочка»), это не ошибка и не повтор: ARCHITECTURE.md §1 прямо называет
      С8 «первой ступенью лестницы… цепочка», той же, на которой прошёл С7. Напоминание короткое по прямому
      требованию BRIEF-PROIZVODSTVO.md §4 — полный ввод лестницы был на С7 и не повторяется здесь.'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.5
  assertion: Где в цепочке решение принимает модель, а где должен — код, и что молчит, когда эту границу
    не назвали явно?
  learning_goal: 'Keystone-слайд оси занятия, предъявлен до первого кейса (Pre-USER-GATE Walkthrough §6):
    заголовок и первая строка — про саму ось, не про устройство занятия.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица из четырёх строк: левая колонка заполнена, правая — пустые клетки с пометкой, каким
      кейсом каждая закроется.

      '
    backup: 'Источник: SETKA-KEYSOV-S8.md «Ось занятия». Левая колонка — дословно из SETKA, правая — не
      придумана, а помечена ссылкой на кейс, который её закроет; заполнится экраном соответствующего кейса,
      не рассказом (канон proektirovanie-keysa-i-voprosa.md §1: вопрос — про проектирование, не про факт).'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Учебный центр ведёт заявки через форму — и до сих пор координатор Марина узнаёт о сложных
    случаях только если сама заходит на экран результата, а заходит она не на каждую
  learning_goal: Дивайдер кейса 1. Название кейса — по функции («Уведомления»), не по тезису (канон §1);
    дивайдер называет потребность, не решение (А2, расширенное канон §1).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика Марины крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: Название «Уведомления» — по функции, не по тезису «Лишний шаг цепочки» первого прогона (канон
      proektirovanie-keysa-i-voprosa.md §1, таблица переименований ARCHITECTURE.md §0). Источник потребности
      — SETKA-KEYSOV-S8.md, Кейс 1, абзац «Потребность».
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 3.0
  assertion: Версия 1 добавила узел-модель, который сочиняет текст уведомления с нуля на каждый прогон;
    на одной из реальных заявок в тексте оказался буквальный плейсхолдер вместо имени координатора
  learning_goal: 'Такт сцены кейса 1: потребность уже названа дивайдером, здесь — версия 1 и честная находка
    практики, без вердикта (разбор — следующий такт).'
  visual:
    pattern: problem_scenario
    primary: 'Врезка с версией 1, пронумерованная хронология доработки, абзац цены. Отдельно — находка
      практики цитатой: реальный текст с плейсхолдером.

      '
    backup: 'Находка — реальная, со стенда (SETKA-KEYSOV-S8.md «Состояние стенда», Кейс «Уведомления»:
      прогон на заявке Олега вставил буквальный плейсхолдер «[Имя координатора]»). Использован этот верифицированный
      случай, а не иллюстративная строка «срочный повторный звонок» из прозы SETKA «Что показала практика»
      — она менее конкретна и не привязана к настоящему прогону; замена сделана явно, не молча (канон
      README §4.3: пример из собственной практики, не из пальца). Номер прогона на стенде — только в SETKA,
      не на этом слайде (канон proektirovanie-keysa-i-voprosa.md §3).'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Четыре действия, которыми можно собрать уведомление из уже известных значений заявки — зал
    выбирает действие, не угадывает факт
  learning_goal: 'Вопрос кейса 1: карточки-действия без доводов и вердиктов (канон §5, усиление А6). Разбор
    — следующим экраном.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и четыре карточки равной ширины. Никаких пояснений рядом с карточками
      — они на разборе.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S8.md, Кейс 1, «Вопрос залу»; уже сформулированы действиями
      (канон §5: «подставить», «дать», «доверить», «усилить» — не факты о возможностях модели).'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Три из четырёх действий не решают задачу так, как она сформулирована; решает её подстановка
    значений в готовую форму — разница не в том, выглядит ли результат языком, а в том, кто придумывает
    его форму
  learning_goal: 'Разбор сразу за вопросом: что делает / чего не делает каждое действие, без вердиктов
    «верно-неверно» (А5, А1).'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · что делает · чего не делает. Под ней — поворот про то, кто придумывает
      форму сообщения.

      '
    backup: Содержание — дословно из SETKA-KEYSOV-S8.md, Кейс 1, «Разбор». «Чего не делает» для первой
      строки — не изобретено отдельно, перенесено из «Нюансы» того же кейса (шаблон не навсегда безопасен
      при росте вариативности), чтобы строка таблицы не оставалась с одной половиной.
- id: n09
  file: slides/n09-k1-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: Сборка сообщения из уже извлечённых значений по фиксированной форме — задача форматирования,
    не задача генерации; если форма сообщения не меняется по сути от заявки к заявке, узел не вызывает
    модель вовсе
  learning_goal: 'Слой 1 такта «наше решение»: архитектурное решение без привязки к инструменту (канон
    §2) — читается без единого английского слова и без имени узла.'
  visual:
    pattern: mechanism_node_graph
    primary: 'Одна плашка-правило крупно, без схемы интерфейса и без имён узлов.

      '
    backup: 'Источник: SETKA-KEYSOV-S8.md, Кейс 1, «Наше решение», Слой 1 — дословно. Системно-нейтральная
      формулировка (канон §2): она не изменится, если завтра цепочку собирают не в n8n, а в любом другом
      оркестраторе. Реализация в конкретном инструменте — следующие два слайда.'
- id: n10
  file: slides/n10-k1-reshenie-sloy2a.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Узел-модель версии 1 получает четыре значения заявки и промпт, который просит сочинить текст
    уведомления с нуля на каждый прогон
  learning_goal: 'Слой 2а такта «наше решение»: настоящая конфигурация узла версии 1 — промпт текстом,
    без workflow/execution id на экране (канон §2–§3).'
  visual:
    pattern: mechanism_node_graph
    primary: 'Цитата настоящего промпта узла-модели крупным блоком. Под ней — список значений заявки,
      которые он получает на вход.

      '
    backup: 'Промпт — реальный, из конфигурации стенда (BRIEF-PROIZVODSTVO.md §3, узел `chainLlm`, человеческое
      имя на стенде «Compose notification (LLM)»). Английское имя узла и workflow id — только здесь, в
      backup, не на видимом слое (канон §3): на экране узел называется по-человечески — «узел-модель».
      Прогон демонстрируется живым кликом по форме, не правкой узла (ARCHITECTURE.md §4).'
- id: n11
  file: slides/n11-k1-reshenie-sloy2b.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Узел подстановки версии 2 использует одно выражение-шаблон и не вызывает модель; на той же
    паре заявок видно, где версия 1 вставила плейсхолдер, а версия 2 — нет
  learning_goal: 'Слой 2б такта «наше решение»: настоящая конфигурация версии 2 (выражение шаблона) плюс
    оба реальных результата рядом — без workflow/execution id (канон §2–§3).'
  visual:
    pattern: mechanism_node_graph
    primary: 'Цитата настоящего выражения узла подстановки. Под ней — два реальных текста рядом: версия
      1 с плейсхолдером, версия 2 без него.

      '
    backup: 'Выражение — упрощённая форма реального выражения стенда (полная версия со ссылками на узлы
      `$(''Request form'')`/`$(''Vocabulary check'')` — BRIEF-PROIZVODSTVO.md §3, узел `Set`/`Edit Fields`,
      человеческое имя на стенде «Compose notification (template)»); на видимом слое — значение параметра
      без ссылок на внутренние узлы (канон §3), форма совпадает с тем, как SETKA-KEYSOV-S8.md уже цитирует
      это выражение в тексте кейса. Тексты обоих результатов — реальные, со стенда (SETKA-KEYSOV-S8.md
      «Состояние стенда»): плейсхолдер «[Имя координатора]» (заявка Олега, версия 1) и детерминированный
      текст (заявка Светланы, версия 2). Номер прогона на стенде — не на этом слайде.'
- id: n12
  file: slides/n12-k1-obobschenie.md
  type: answer_breakdown_table
  duration_min: 1.5
  assertion: Не каждый текстовый вывод — это генерация; узел-модель не упал и не ошибся технически, он
    просто не был нужен для задачи сборки сообщения из уже известных значений
  learning_goal: 'Обобщение: класс задачи назван явно, без эссе; форвард-связка с кейсом «Карточка в Telegram»
    на той же форме «прогон зелёный, результат тихо не тот».'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица двух версий и их итога. Под ней — класс задачи плашкой и форвард-связка с кейсом
      4.

      '
    backup: 'Источник: SETKA-KEYSOV-S8.md, Кейс 1, «Обобщение» — дословно, включая форвард-связку с кейсом
      «Карточка в Telegram» (та же форма провала — там на бинарных данных, здесь на тексте).'
- id: n13
  file: slides/n13-k1-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.0
  assertion: Модель нужна при реальной вариативности контента; шаблон достаточен, когда форма сообщения
    всегда одна и меняются только значения — и у обоих вариантов есть своя цена
  learning_goal: Нюансы (два класса) + критерий «когда нужна модель / когда достаточно шаблона» + закрытие
    первой строки оси (ARCHITECTURE.md §3).
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Два нюанса плашками, под ними критерий в две колонки, под ним строка закрытия первой строки
      оси.

      '
    backup: 'Источник: SETKA-KEYSOV-S8.md, Кейс 1, «Нюансы» и «Критерий» — дословно. Строка закрытия оси
      — та же формулировка, что открыта на n04, первая строка таблицы.'
- id: n14
  file: slides/n14-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Мне прислали тот же вопрос второй раз — зачем отвечать как в первый?» — потребность кейса
  learning_goal: 'Дивайдер кейса 2. Потребность называется прямо — не запускать цепочку с нуля на повторное
    обращение, если ответ уже есть (канон §1: постановка кейса — потребность, не костыль).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Потребность сформулирована по proektirovanie-keysa-i-voprosa.md §1: не «у нас плохой хэш»,
      а что нужно координатору. Источник текста — SETKA-KEYSOV-S8.md, Кейс 2, раздел «Потребность».'
- id: n15
  file: slides/n15-k2-stsena.md
  type: problem_scenario
  duration_min: 2.5
  assertion: Точное совпадение после нормализации ловит буквальный повтор мгновенно и бесплатно — и пропускает
    тот же вопрос, заданный другими словами, в то же утро
  learning_goal: 'Сцена кейса 2: потребность, версия 1 (точное совпадение) и находка практики на двух
    реальных случаях одного утра — через что срывается механическое сравнение, видно на конкретных текстах,
    не абстрактно.'
  visual:
    pattern: problem_scenario
    primary: 'Врезка с версией 1, два реальных случая по пунктам, абзац про границу совпадения.

      '
    backup: Источник — SETKA-KEYSOV-S8.md, Кейс 2, разделы «Версия 1» и «Что показала практика». Тексты
      заявок — реальные формулировки из этого документа, для слайда не придуманы.
- id: n16
  file: slides/n16-k2-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Как построить проверку на повтор — четыре действия, каждое встречается в живых системах
  learning_goal: 'Вопрос без подсказок (А12): карточки — действия, не факты о возможностях (канон §5).
    Зал проектирует порядок проверки, не угадывает свойство инструмента.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек-действий без пояснений.

      '
    backup: 'Карточки — SETKA-KEYSOV-S8.md, Кейс 2, раздел «Вопрос залу», без изменения формулировки.
      Все четыре — действия (канон §5): «сравнивать», «спросить», «проверить» — глаголы, не утверждения
      о свойствах инструмента.'
- id: n17
