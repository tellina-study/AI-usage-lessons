  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Короткий текстовый блок: дословная цитата про наследование инструментов серверов. Ниже —
      применение к сцене (трекер и сервер документации из прошлого раздела занятия попадают в контекст
      субагента бесплатно, хотя к поиску не относятся). Нижняя строка — что с этим делать: тот же список
      инструментов субагента, который стоит пятым блоком на одностраничнике ступени.'
    backup: 'Источник — research/mechanics-6-subagent.md §2.5, дословно из errors.md: «Subagents inherit
      every MCP tool definition from the parent session, which can fill their context window before the
      first turn. Disable MCP servers you are not using before spawning subagents.» Круг 3 владельца (issue
      225): новая граница, связывает блок MCP и блок субагента этого же занятия без повторения материала
      ни одного из них. Круг 5 (issue 225, ZADANIE-KRUG-5.md): слово «окно» снято со слайда целиком (10
      вхождений), «родитель» заменён на «сессию, которая позвала роль»; слайд опирается на верхний ярус
      схемы n30 (третья полоса, «описания подключённых серверов»), поэтому вводную часть речи удалось
      убрать, и слот ужат с 1,0 до 0,75 мин — это и есть компенсация за рост n30 с 1,25 до 2,0.'
- id: n37
  file: slides/n37-kriterii-chto-ostayotsya-v-kontekste-posle-otveta.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Делегировать чтение стоит, когда из него нужен короткий вывод — факт, да/нет, список в несколько
    строк, по которому дальше работают; если работать придётся со всем прочитанным объёмом, читать его
    придётся самому в любом случае
  learning_goal: 'Закрытие кейса: критерий «когда это работает, когда нет» + строка оси (интуиция/проверка),
    сведённая с тем, что зал произнёс вслух на голосовании. Прямая формулировка, без недосказанности —
    правило А7 круга 2 остаётся в силе. Пересмотр по сторителлингу (issue 225, правило П5): здесь же стоит
    единственный на всю ступень вопрос «к себе» — зал прикладывает критерий к собственному проекту. Круг
    5 (issue 225): критерий уточнён под новую сцену — граница проходит по тому, нужен ли дальше весь прочитанный
    объём или несколько мест из него, и именно это различие делает поиск делегируемым, а рефакторинг —
    нет'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Блок критерия двумя пунктами: когда делегировать чтение имеет смысл, когда нет. Ниже — строка
      оси толстой золотой планкой слева, без заливки: интуиция говорила / проверка показала. Последним
      блоком — короткий вопрос «к себе».'
    backup: 'Слайд круга 3 владельца (issue 225). Критерий и строка оси написаны под сцену и механику
      кейса; формат — тот же, что у закрывающих слайдов других кейсов ступени (критерий + строка оси одним
      слайдом). Литературная правка: формат «не X, а Y» снят из всех видимых и речевых блоков. Пересмотр
      по сторителлингу (PERESMOTR-STORITELLING.md): строка оси переписана под произнесённую залом догадку,
      добавлен блок «К себе» — правило П5, единственный такой вопрос в блоке субагента; форма разведена
      с вопросом «к себе» блока MCP (n18): там зал пересчитывает своё текущее окружение, здесь — вспоминает
      задачу. Круг 5 (issue 225, ZADANIE-KRUG-5.md): слово «окно» снято со слайда целиком (10 вхождений).
      Критерий уточнён вслед за сценой: прежняя формулировка разводила «короткий вывод» и «работа продолжается
      на том же материале», и в новой сцене работа действительно продолжается — в четырёх файлах из сорока.
      Граница проведена там, где она и проходит: нужен ли дальше ВЕСЬ прочитанный объём. Строка оси достроена
      вторым изменением (куда возвращается итог) — тем самым, которым субагент отличается от второй сессии.'
- id: n38
  file: slides/n38-divider-zadacha-prishla-odnoy-frazoy.md
  type: section_divider
  duration_min: 0.5
  assertion: Задача приходит одной фразой и одним сроком; средств ускорить её больше одного, и выбирает
    между ними сама задача
  learning_goal: 'Развилка кейса о раскладке и ускорении. Форма — вопрос, на который у зала уже есть наполовину
    верный ответ: ускорять будем, но средство придёт не оттуда, откуда его ждут. Смысловая строка обещает
    поворот и заранее говорит, что кейс — практика: задачу раскладывают вместе'
  visual:
    pattern: section_divider_macro
    primary: Тёмный Ocean-фон, заголовок-вопрос в одну-две строки, золотая линия под ним. Ниже — смысловая
      строка. Внизу — дорожка кейсов этой ступени, активная отметка — вторая.
    backup: 'Кейс заведён кругом 3 владельца (issue 225, ZADANIE-KRUG-3-SUBAGENT.md, кейс 2): параллелизм
      как причина заводить субагента, а прежний кейс «вторая роль, границы путаются» — границей этого.
      Тег не ставится (правило А6). Круг 5 владельца (ZADANIE-KRUG-5.md): «5 тоже не понятный и не жизненный
      пример, лучше может как практику показать? и обсудить со студентами как декомпозировать и ускорять
      задачи? там не только субагенты же могут быть». Кейс перестал быть разбором чужой удачи (прежняя
      сцена четверга «три проверки разом») и стал практикой: задачу раскладывает зал. Заголовок развилки
      переписан с «Три правки, одна очередь. А если разом?» — прежний называл готовую раскладку (три независимые
      правки) ещё до того, как зал её сделал, и этим отнимал у практики её работу. Форма «вопрос» сохранена
      — она разведена с четырьмя остальными развилками занятия (n06 реплика, n21 сцена, n29 цена, n50
      парное утверждение) и своей не меняется. КАСКАД: ячейка карты n05 блока субагента, вторая («Задачи
      стоят в очереди, хотя друг от друга не зависят. Решаем.») расходится с этим заголовком — сведению
      переписать по тексту настоящего дивайдера, предложение в qa/krug5-subagent-keys2.md.'
- id: n39
  file: slides/n39-praktika-raskladyvaem-zadachu-vmeste.md
  type: cobuilding
  duration_min: 3.0
  assertion: Задача приходит одной фразой к понедельнику; зал раскладывает её на куски и по каждому отвечает,
    от чего он зависит, — и выходит, что независимых кусков три из шести, один стоит в очереди за другим,
    один лезет в чужой файл, один повторяется каждый раз
  learning_goal: 'Практика, два хода на одном экране. Ход 1 — зал называет куски задачи, лектор фиксирует
    шесть. Ход 2 — по каждому куску зал отвечает, от чего он зависит; здесь же зал просят назвать вслух
    догадку о числе исполнителей, которую через два экрана проверит разбор. Слот отдан залу: произносимая
    речь короткая намеренно, остальное время говорит зал'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Сверху — задача одной фразой в светлой карточке-реплике. Ниже таблица шести строк: два хода
      стоят заголовками колонок: ход 1 заполняет левую (куски, названные залом), ход 2 — правую (от чего
      зависит). Снизу — одна плашка со счётом: сколько кусков независимы.'
    backup: 'Круг 5 владельца (issue 225, ZADANIE-KRUG-5.md): «лучше может как практику показать? и обсудить
      со студентами как декомпозировать и ускорять задачи?». Прежняя сцена кейса (n39 «Четверг: три проверки
      разом, и это сработало») снята целиком: она была готовым разбором чужой удачи, в котором раскладка
      уже сделана за зал — три независимые правки предъявлялись как условие, а не как результат работы.
      Форма взята у со-сборки ступени MCP (n13/n14): два хода, экран заполняется репликами зала. Задача
      (лендинг с формой заявки, срок к понедельнику) взята из продукта самого занятия; состав кусков сверен
      с живым кодом демо-репозитория — src/validate.js (validateForm, карта MESSAGES), атрибут pattern
      в index.html (ARCHITECTURE.md §3, FIXES-PENDING 5-2). Числа времени не называются ни в одном куске:
      ни один источник этой ступени длительность таких работ не мерил. Слот 1,5 → 3,0: прибавка взята
      внутри кейса (n41 1,5 → 1,5 без роста, n42 0,75 → 0,5, n46 1,25 → 0,75, n47 1,5 → 1,25, n49 1,75
      → 1,25), сумма кейса не менялась — 11,75. Речь намеренно короче слота: разница и есть время зала.
      Правки после проведения (issue 225, qa/RAZBOR-PROVEDENIYA.md §A4): ведущий назвал постановку коряво
      сформулированной («посмотрите, как бы немножко коряво сформулирована», гр. 2, 46:54) и переизлагал
      её своими словами в обеих группах. Причина была в том, что на экране стояли только фраза заказчика
      и строка «это вся постановка»: что за проект, где лежит код и что делать залу, приходилось добавлять
      голосом. Теперь постановка читается с листа целиком — задача, срок, проект с двумя файлами, отсутствие
      уточнений — и оба хода с третьей строкой выписаны под ней. Структура практики не менялась: зал раскладывает
      сам, таблица ниже остаётся сверкой. Состав шести кусков, зависимости и счёт независимых не тронуты.
      Сборка --block n4 показала переполнение (таблица 2,11″ при бюджете 1,95″, композиция до 7,78″ при
      полотне 7,50″) — шесть карточек хода 1 сняты с экрана: они дословно повторяли левую колонку таблицы,
      и после снятия экран встал в полотно без правки содержания.'
- id: n40
  file: slides/n40-vopros-chem-uskoryaem.md
  type: reflection_question
  duration_min: 1.0
  assertion: Задача разложена — зал сперва называет, чем сам уже разгонял задачу разом, и этим же средством
    решает, чем ускорять эту; карточек пять, субагент среди них один, и каждая карточка просит назвать
    кусок, на котором она работает
  learning_goal: 'Вопрос классу без подсказки целевого ответа. Пять карточек — пять средств ускорения,
    из них отдельный исполнитель только одно; остальные четыре старше его. Выбор одиночный и честный:
    карточка плюс кусок, на котором она работает. Ошибка, которую разбор и показывает, — одна карточка
    на все шесть кусков'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — строка про свой опыт: кто уже разгонял задачу разом и чем именно.
      Ниже золотая коробка по центру с дословным выбором, надзаголовок «· ВОПРОС». Пять карточек равной
      ширины внизу, ни одна не подсвечена.'
    backup: 'Круг 5 владельца (issue 225, ZADANIE-KRUG-5.md): «там не только субагенты же могут быть».
      Прежние четыре карточки («ничего не менять», «объединить три правки в одно задание», «сначала проверить
      зависимость, потом по вызову роли на каждую», «параллелить всегда») снимаются: все четыре были вариациями
      одного средства — числа субагентов, — и разговора о других средствах не допускали вовсе. Новые пять
      названы владельцем дословно: куски по очереди · несколько сессий · роли разом · повторяемое в проверку,
      которая гоняется сама · сузить задачу. Голосование остаётся одно на кейс и остаётся на n40 — шестое
      голосование занятия, положение в деке не менялось (CUT-ORDER.md, защищённый список). Честность одиночного
      выбора сохранена приёмом второй прожарки: карточку просят назвать вместе с куском, поэтому ответ
      целиком лежит в одной карточке, а не в связке двух. Слот 0,75 → 1,0: четверть минуты взята у n42.
      Правка после двух проведённых занятий (issue 225, qa/RAZBOR-PROVEDENIYA.md §C3): вопросы про собственный
      опыт зала давали ответы, абстрактные — нет. Поэтому выбор карточки стоит теперь вторым ходом, а
      первым — чем человек сам уже разгонял задачу разом. Карточки, их порядок и разбор (n41) не менялись.
      Термин «роль» по всему занятию заменён на «субагент» (§A1 того же разбора) — поэтому третья карточка
      читается «раздать куски субагентам»; дословные цитаты владельца и снятых карточек выше оставлены
      как сказаны.'
- id: n41
  file: slides/n41-razbor-parallelnost-lezhit-v-zadache.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: 'Ни одно из пяти средств не ускоряет все шесть кусков: параллельность лежит в задаче, и в
    этой её ровно на три куска — субагенты берут её там, где она есть, и умножают ошибку там, где её нет'
  learning_goal: 'Поворот кейса, названный поворотом. Догадка зала считала исполнителей: шесть кусков
    — шесть исполнителей. Разбор переносит причину выигрыша с числа исполнителей на свойство задачи и
    раскладывает пять средств по кускам, на которых каждое работает. Форма А5 — две содержательные колонки'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает / что не делает — ограничение.
      Под таблицей — плашка поворота, золотом: число независимых кусков ставится рядом с числом исполнителей,
      которое зал назвал вслух.'
    backup: 'Круг 5 владельца (issue 225, ZADANIE-KRUG-5.md): разбор пяти средств вместо разбора четырёх
      вариантов одного средства. Поворот кейса сохранён дословно и остался заголовком слайда — «Параллельность
      лежит в задаче»: он выдержал переход в практику, потому что зал теперь упирается в зависимость кусков
      сам. Числа 17,2 и 4,4 сюда НЕ подняты намеренно — они стоят на n47 и n49, где названы источник и
      условие измерения; здесь на них только указано вперёд. Строка про несколько сессий в одной папке
      держится одной клаузой намеренно: папка и конфликты файлов — зона соседнего кейса ступени, и разворачивать
      их здесь значило бы отобрать у него содержание (передано строкой в qa/krug5-subagent-keys2.md).'
- id: n42
  file: slides/n42-mekhanika-fon-i-predel-subagentov.md
  type: mechanics_map
  duration_min: 0.5
  assertion: 'Параллельный запуск — механика харнесса, не ручная настройка: субагенты уходят в фон и работают
    одновременно друг с другом и с основной сессией; предел — двадцать одновременно работающих субагентов
    по умолчанию, не на общее число субагентов за сессию'
  learning_goal: 'Опора под поворот: одновременность берётся из харнесса, настраивать её не нужно — значит,
    вся цена решения приходится на раскладку. Конкретный, проверяемый факт механики, не абстракция'
  visual:
    pattern: mechanics_table
    primary: 'Коробка из двух строк: субагенты уходят в фон и работают одновременно; предел — двадцать
      одновременно работающих, и меняется он переменной окружения. Под коробкой одна строка золотом: за
      всю сессию предела нет вовсе.'
    backup: 'Источник — research/mechanics-6-subagent.md §1.5, дословно по содержанию: fork mode включён
      по умолчанию в интерактивной сессии с версии 2.1.232; «Claude Code runs the subagent in the background...
      and Claude can''t ask for the foreground»; concurrent limit по умолчанию 20 (CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS,
      ошибка «Concurrent subagent limit reached» на 21-й); общего предела на число субагентов за всю сессию
      нет — только на одновременно работающие. Круг 5 владельца (issue 225): экран и числа не тронуты,
      речь привязана к раскладке практики, слово «окно» заменено на «контекст» в справке (сквозное решение
      С1). Слот 0,75 → 0,5 — четверть минуты отдана голосованию n40, где говорит зал; речь подрезана под
      слот. Литературная редактура (issue 225, qa/pravki-nahodok-svedeniya.md п.3): весь экран был одним
      жирным абзацем в золотой скобке — два абзаца источника сборщик сводил в один блок, и жирным выходили
      все пять строк. Разверстано по грамматике деки: механика ушла двумя строками в коробку обычным начертанием,
      золотой осталась одна мысль — что за всю сессию предела нет. Парное противопоставление «на одновременность,
      не на количество за сессию» разведено на два самостоятельных утверждения (tools/editorial/README.md
      §1): предел назван в коробке, его отсутствие — золотой строкой. Числа, версия и переменная окружения
      не менялись.'
- id: n43
  file: slides/n43-orkestrator-i-dochernie-sessii.md
  type: mechanics_map
  duration_min: 1.5
  assertion: 'Рядом с рабочей сессией поднимают сессию-оркестратора, которая запускает дочерние полноценные
    сессии: в дочернюю сессию можно прийти руками, и она сама запускает субагентов — ярусов становится
    три; цена — обвязка и то, что оркестратор узнаёт об итоге дочерней только когда сходит и проверит'
  learning_goal: 'Третий ход рядом с двумя разобранными. Субагент и дочерняя сессия отвечают на один запрос
    — делать куски одновременно — и расходятся по двум свойствам, которые решают выбор: можно ли прийти
    руками и можно ли уйти ещё на ярус вниз. Критерий назван размером куска, цена названа тремя строками'
  visual:
    pattern: mechanics_table
    figure: subagent-n43-tri-yarusa.png
    primary: 'Сверху — схема трёх ярусов: рабочая сессия, сессия-оркестратор, дочерние сессии и субагенты
      под ними; на дочерней отмечено, что в неё можно зайти руками, на субагенте — что от него приходит
      только итог. Под схемой — таблица в две содержательные колонки: что даёт дочерняя сессия и чего
      она стоит. Замыкает слайд строка критерия золотом: маленький кусок — субагенту, крупный — дочерней
      сессии. Строка про то, чья это практика, живёт в подписи схемы.'
    backup: 'Источник — рабочая практика автора курса, рассказанная на обоих проведённых занятиях этой
      деки (расшифровки: `qa/rasshifrovki/gruppa-1.txt`, 32:33; `qa/rasshifrovki/gruppa-2.txt`, 43:34,
      52:02–53:36, 55:38). В материалах этого не было, и автор сказал это прямо: «в эту лекцию не внёс»
      (гр. 1, 39:54). Внесено по разделу B разбора проведения (`qa/RAZBOR-PROVEDENIYA.md`) — проверка
      практикой: то, что добавляют от себя дважды, материалу не хватает.

      Дословные опоры. Сам ход: «я поднимаю сессию, которая говорит оркестратор, и поднимаю ещё для себя
      другие сессии рабочие» (гр. 1, 32:33). Два преимущества над субагентом: «в дочернюю сессию можно
      прийти, во-первых, чем-нибудь посмотреть или написать, и во-вторых, она сама по себе может порождать
      уже субагентов, то есть получается большая вложенность иерархии, как следствие более сложные задачи
      таким образом можно решать» (гр. 1, 32:33); то же в группе 2 — «чем мне вариант нравится параллельной
      сессии: тем, что мы делаем здесь более сложную структуру, которая может решать более сложную задачу»
      (43:34). Цена: «она требует какой-то минимальной обвязки вокруг» (гр. 1, 31:57), «главная сессия
      узнаёт о том, что дочка что-то сделала, только когда периодически проверяет» (гр. 2, 52:52). Критерий:
      «если задачки маленькие, то на субагенты, если большие, то на сессии» (гр. 2, 55:38).

      Три способа обвязки названы им же (гр. 2, 52:26–53:36): готовый управляющий слой; имитация через
      трекер задач (назван плохим — именно из-за того, что итог виден только при проверке); оконный менеджер
      терминала, в чьих панелях сессии и поднимают, и в которые можно зайти. Названия инструментов на
      экран не вынесены намеренно: своя разработка автора упоминалась им без названия, а оконный менеджер
      — деталь одной конфигурации, которая к факту трёх ярусов отношения не имеет.

      Чего на экране нет и почему. Числа «сколько сессий держать» сюда не подняты: они стоят на следующем
      экране вместе с конфигурацией, на которой померены. Ограничение внимания человека, которое он тут
      же называл («3–5 мне хватает»), не вынесено ни в каком виде: там же он сам разобрал, что опора на
      «семь плюс-минус два» ничем не подтверждается (гр. 2, 51:22), и вносить число, которое автор при
      зале назвал выдумкой, было бы заменой одной неподтверждённой опоры на другую. Проверка закрыта (`qa/fact-check-7-plus-minus-2.md`,
      2026-10-10): первоисточник Миллера реален и число в нём измерено, а не выдумано, но измеряет оно
      другое — предел различения по одному признаку и объём непосредственной памяти, которые сам Миллер
      разводит и называет их совпадение «нездоровым пифагорейским»; современная работа (Cowan, 2001) даёт
      для рабочей памяти около четырёх. Решение по итогам проверки — **не вносить ни как опору, ни как
      разоблачение**: к составу контекста и границе субагента число отношения не имеет, а на вопрос «сколько
      сессий держать» материал уже отвечает собственным замером памяти машины на следующем экране.

      Терминология: слайд написан на «субагенте» с самого начала — слово «роль» в нём не появляется (переименование
      по всей деке ведёт соседняя сессия того же круга).'
- id: n44
  file: slides/n44-tsena-v-zheleze.md
  type: mechanics_map
  duration_min: 1.0
  assertion: 'Сессии стоят памяти машины: по замеру автора курса на облачной виртуалке с 16 ГБ работа
    начинает спотыкаться с двадцати одновременных сессий и обрывается на тридцати-сорока — порядок величины
    выходит 1–2 ГБ на сессию в покое; предел инструмента в двадцать одновременных субагентов железо может
    перебить раньше'
  learning_goal: 'Цена предыдущего хода, названная в единицах, которые проверяются на своей машине. Замер
    подан как замер одного человека на одной конфигурации с названной базой (16 ГБ), не как индустриальная
    норма: читатель получает порядок величины и способ перемерить у себя. Отдельно разведены два предела
    — одновременность субагентов внутри сессии и память машины под сессии'
  visual:
    pattern: mechanics_table
    primary: 'Сверху — строка о том, чей это замер и на какой машине. Ниже — таблица в две содержательные
      колонки: что померено и что из этого следует, три строки. Под таблицей — короткая строка про разницу
      в языке, на котором написан сам агент. Замыкает слайд строка золотом: порядок величины, который
      стоит перемерить у себя.'
    backup: 'Источник — замер автора курса на своей машине, названный на обоих проведённых занятиях этой
      деки (расшифровки: `qa/rasshifrovki/gruppa-1.txt`, 34:31; `qa/rasshifrovki/gruppa-2.txt`, 53:36–55:38).
      Внесено по разделу B разбора проведения (`qa/RAZBOR-PROVEDENIYA.md`), пункт 2.

      Дословные опоры. База и порог: «у меня виртуалка 16 гибов в облаке, на 20 сессиях ей становится
      нехорошо» (гр. 1, 34:31); «у меня виртуалка, моя облачная, она начиная с 20 где-то начинается, а
      на 30–40, в зависимости от их объёма, она погибает» (гр. 2, 54:03). Удельный расход: «как минимум
      2 гига на сессию нужно» (гр. 1, 34:31), «грубо совсем грубо где-то 1–2 гига на сессию надо закладывать
      оперативки, даже в пассивном строе» (гр. 2, 54:03) — в материал взята вилка 1–2 ГБ как более поздняя
      и более осторожная формулировка того же замера, с оговоркой «в покое». Удивление: «казалось бы,
      это тонкий клиент, который туда-сюда гоняется в текстике… рано нам отказываться от хороших ноутов
      с хорошей памятью» (гр. 1, 34:58).

      Язык агента: «один типа на джейсе написан, другой… что-то из них написано на Rust, и он прям вот
      в 10 раз легче» (гр. 2, 54:42). Кратность на экран НЕ вынесена: в той же фразе автор путался, какой
      из двух инструментов на каком языке написан, и кратность назвал на глаз. На экране стоит «заметно
      легче», в заметке сказано прямо, что кратность названа на глаз и единицы не фиксировались. Названия
      двух инструментов не приводятся по той же причине. [FACT-CHECK: на каком языке написан каждый из
      распространённых агентских клиентов и каков реальный разрыв по памяти — в материал НЕ внесено; при
      внесении нужен замер, а не впечатление]

      База для чисел (CLAUDE.md, § «Baseline / Counterfactual Mandate»): 16 ГБ названы прямо, и вилка
      1–2 ГБ с ними сходится — 16 / 20 ≈ 0,8 ГБ на сессию у нижнего порога. Контрфакт назван в заметке:
      одна-две сессии на такой машине расхода не создают вовсе, цена появляется только на десятке.

      Разведение двух пределов — находка этого круга, не слова автора: предел в двадцать одновременных
      субагентов (`n42`, переменная окружения) относится к одновременности ВНУТРИ одной сессии, а 1–2
      ГБ — к числу САМИХ сессий. Совпадение обоих чисел на двадцати случайно, и сказать это нужно, иначе
      читатель сложит два разных предела в один.

      Терминология: слайд написан на «субагенте», слово «роль» в нём не появляется.

      Литературная редактура (issue 225, qa/pravki-nahodok-svedeniya.md п.5): заголовок «Цена в железе»
      был назывным словосочетанием среди заголовков-утверждений и заголовков-сцен. Стало «Сессии стоят
      памяти машины» — то же, что говорит `assertion` слайда первой же клаузой. Число двадцать в заголовок
      намеренно НЕ вынесено: двумя слайдами раньше, на `n42`, двадцать означает другой предел, и сам этот
      слайд разводит два предела прямой строкой — заголовок, повторяющий число, сводил бы их обратно.
      Содержание, таблица, оговорки и открытый `[FACT-CHECK]` выше не тронуты. Имя файла слайда оставлено
      прежним: по канону семинаров (§1) файл, манифест и фронтматтер сходятся по номерам и минутам, а
      не по слогу заголовка.'
- id: n45
  file: slides/n45-stsena-spravochnik-i-forma-poroznj.md
  type: problem_scenario
  duration_min: 1.25
  assertion: 'Справочник и форма, которая на него опирается, уходят двум субагентам одновременно; общего
    описания задачи нет. Обе работы сделаны честно и быстро, а вместе не работают: поля в справочнике
    одни, на форме другие — и сводить их дольше, чем заняла сама настройка'
  learning_goal: 'Проверка поворота на отрицательном примере — на двух кусках, которые опираются друг
    на друга. Параллельность здесь была настоящей и ничего не стоила; не хватило общего описания задачи,
    которое оба исполнителя читают до начала. Сцена рабочая, из настраиваемой платформы: там параллелить
    особенно соблазнительно, потому что это не код'
  visual:
    pattern: problem_scenario
    primary: 'Два прямоугольника рядом — справочник (состав полей) и форма (какие поля показывает и проверяет),
      между ними — стрелка «опирается на» и узкая зона без владельца: общего описания задачи нет. Внизу
      — исход: поля разошлись, работы сведены вручную.'
    backup: 'Правки после проведения (issue 225, qa/RAZBOR-PROVEDENIYA.md §A3). Прежняя сцена — диф-ревьюер
      и тестировщик на одном неделимом куске, два честных `PASS` и пробел перед доменом — забракована
      ведущим в обеих группах вслух: «не придумал хороший пример… с красивого примера я сходу не придумал»
      (гр. 1, 41:06), «там не очень удачный пример, просто красивая картинка» (гр. 2, 56:27). Оба раза
      он подставил свой, рабочий, и оба раза один и тот же: на настраиваемой платформе параллельно настраивают
      справочник и форму, которая на него опирается; общего описания задачи нет, поля расходятся, сводить
      долго (гр. 1, 43:36; гр. 2, 56:54–57:39). Сцена переписана на него. Доказательная часть кейса не
      тронута: числа и источники n47 (MAST, 1600+ трасс, 37%, Google Research, разворот позиции Cognition)
      остались как есть — менялась сцена, не свидетельства. Пример студента группы 1 (дробление в тестировании
      и анализе кода снижает качество и пропускает проблемы, гр. 1, 41:51–42:12) и прежняя пара диф-ревьюер/тестировщик
      сохранены в заметках как второй и третий вид того же расхождения. Привязка к практике n39 осталась,
      но на уровне урока, а не куска: там условие назвали вслух, здесь его не написал никто. Слот 1,25
      не менялся. Литературная редактура (issue 225, qa/pravki-nahodok-svedeniya.md п.3): обстановка сцены
      выходила на экран одним жирным абзацем в золотой скобке — шесть строк жирного, в которых жирное
      начертание уже ничего не выделяло. Текст сцены не тронут ни словом: обстановка перенесена в коробку
      обычным начертанием, золотой осталась одна мысль — исход, ради которого сцена и рассказывается.
      Шагами по номерам сцена НЕ переписана: такую правку владелец отложил за собой (находка F3 сведения),
      пример принадлежит ведущему.'
