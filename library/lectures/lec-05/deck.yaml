# library/lectures/lec-05/deck.yaml  —  PART 1 of 2
#
# Deck-структура Лекции 5 «AI-продукт: полный жизненный цикл — от намерения до эксплуатации».
# 56 слайдов, Σ 102,1 мин полного прохода при слоте 90 (≈82 активных + ≈8 на вопросы).
#
# Source: chapter.md + chapter-part2..5.md (57 271 слово тела) + аудит пересборки
# qa-reports/2026-09-28-rescope/chapter-coverage-for-practice-deck.md.
# Issue #212 · Branch: issue-212-lec05-parity-lec04
#
# ПОРЯДОК ВНУТРИ ФАЗЫ (пересборка 2026-09-28): дивайдер → классика одной строкой-
# определением → что ИИ меняет → практика (одна-три) → ограничения → провал фазы.
# Приём стоит ПОСЛЕ названной классики и ДО разбора провала, чтобы читался как ответ на
# только что показанную проблему. В разделах 4, 5 и 6 отдельного слайда «что ИИ меняет»
# нет: его работу несут сами практики — каталог инструментов свёрнут (аудит §6, −13 мин).
#
# Снято ранее (5): s09 Mom Test · s16 эвристики Нильсена · s30 ловушки эксперимента ·
#   s13 Deloitte (слит в s10 границей) · s20 iTutorGroup (слит в s18).
# Снято здесь (13): s07b/s14b/s21b/s28b/s36b/s44b обзоры-введения (профиль аудитории,
#   CLAUDE.md) · s24 (лестница агентности поглощена s24a) · s31 (лестница оценок — s31a) ·
#   s38 (наблюдаемость — s38a/s38b) · s35 и s43 посекционные синтезы (дублируют дивайдеры
#   и s51) · s49 (числа дублируют s47, «где человек» — s51, «да и нет» — s55) ·
#   s52 триангуляция (методология исследований — чужая дисциплина, остаётся в главе §7.2).
# Добавлено (12): практики s11a s11b s17a s24a s24b s24c s30a s31a s38a s38b s45a s45b
#   — 22,0 мин пошагового применения ИИ изначально; ретайминг под реальный темп речи
#   (issue #212, 2026-09-28) поднял их до 31,5 мин — устный текст практик 3 539 слов
#   при 115 слов/мин требует 31 минуту, было 22,0 при факте 161 слово/мин.
#
# deck.yaml (ЭТОТ ФАЙЛ) — deck/palette/motif/typography/glossary_lock + ai_failure_judgment
#   + interaction_summary + слайды Р0..Р3. deck-part2.yaml — слайды Р4..Р7 + totals +
#   cut_order + protected_tier + verify_day_of_items + fact_check_items.
# Loader (rendered/build_lec05.py) читает ОБЕ части.

deck:
  lecture_number: 5
  title: "Лекция 5. AI-продукт: полный жизненный цикл — от намерения до эксплуатации"
  audience: "студенты-инженеры 3 курса, универсально, без локального binding"
  duration_min: 90
  central_question: "Когда AI сделал сборку почти бесплатной — что стало настоящим узким местом продукта, и на каждой фазе цикла: какая классическая дисциплина остаётся, что AI ускоряет, и где AI-first ломается?"
  learning_outcomes: [LO1, LO2, LO3, LO6]
  language: ru
  status: draft-for-gate-b
  version: v2.0
  source: "chapter.md + chapter-part2..5.md (57 271 слово тела)"
  plan: "qa-reports/2026-09-28-rescope/chapter-coverage-for-practice-deck.md"
  total_slides: 56
  curriculum_level: "Отраслевая лекция (после Л4 SDLC); L5 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "фазы петли продукта (discover→build→measure→learn→decide); каждая фаза = база→AI→практика→ограничения→провал"
  glossary_lock: glossary.yaml

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  ref: "library/lectures/lec-05/glossary.yaml"
  headline_terms:
    - "петля обратной связи (discover→build→measure→learn→decide)"
    - "асимметрия стоимость/доверие"
    - "Customer Development (Бланк); фальсифицируемая гипотеза (вера→тест→дата)"
    - "эталонный набор (reference dataset)"
    - "Double Diamond; дизайн-система и гейт доступности в сборке"
    - "feature flag / канареечная раскатка / откат; Stage-Gate go/kill"
    - "лестница агентности (agency-ladder)"
    - "оценка до развёртывания и на живом трафике; модель-судья"
    - "успешен во всех попытках против успешен хотя бы в одной"
    - "OEC / guardrail-метрика / пред-регистрация эксперимента"
    - "SLI/SLO/бюджет ошибок; порог сжигания; тихий дрейф модели"
    - "закон Гудхарта"
    - "стоимость на запрос и базовая линия без ИИ; operators→orchestrators"
  note: >
    Термины, ушедшие вместе со снятыми слайдами, остаются в glossary.yaml и в главе, но
    из headline-набора деки убраны: их несущие слайды сняты (LLMOps/AgentOps — s38,
    Guardian Agent — s38, CC/CD — s24, pass@k/pass^k — s31). Смысл сохранён на слайдах-
    практиках по-русски: «успешен во всех попытках, а не хотя бы в одной» (s24a, s31a),
    наблюдаемость с версиями промпта и модели (s38a), аварийный размыкатель (s38b).

# NO MEME DUPLICATION RULE (owner rule slides-meme-forward-minimal-text): мем s01
# уникален и не повторяется ни на обложке, ни на дивайдерах; у обложки s02 и у каждого
# дивайдера (s07/s14/s21/s28/s36/s44/s50) — свой вечнозелёный мем под своё утверждение.

ai_failure_judgment:
  # AI-Failure & Judgment Content Rule (ENFORCED): ≥30% strict-in по МИНУТАМ, waiver НЕДОСТУПЕН.
  strict_in_slides: [s12, s13a, s19, s26, s27, s33, s34, s40, s41, s42, s47, s48]
  count: 12
  strict_in_minutes: 25.5
  share_by_minutes: >
    25,5 из 102,1 мин полного прохода (после ретайминга практик, issue #212) = 25,0%; из
    ≈82 активных мин = 31,1% (не меняется: практики partial_out, ретайминг Σ не задевает
    strict_in_minutes). Со слайдами границ («что остаётся человеку», «здесь ИИ не тот
    инструмент»: s11 1,5 · s18 2,0 · s25 1,5 · s32 2,0 · s39 2,0 = 9,0 мин) — 34,5 из
    102,1 = 33,8%. С инструментом решения s53 (2,5) и чек-листом s54 (2,0) — 39,0 из
    102,1 = 38,2%.
  guard_after_rescope: >
    Аудит пересборки предупредил прямо: слайд-практика по конструкции смешанный (механизм и
    артефакт — «как применять», граница и критерий — bucket-контент), поэтому менять провалы
    на практики один к одному нельзя — доля упадёт. Guard-условие: сумма минут
    (провалы + границы + триада + чек-лист) ≥ 30% активного времени. По факту сборки 39,0 из
    82 активных = 47,6%, запас есть. Классификация границ оставлена консервативной
    (partial→out), как и до пересборки; окончательный пересчёт strict-in — за
    methodology-critic на Ф7.
  partial_out: [s01, s02, s03, s04, s05, s06, s07, s08, s10, s11, s11a, s11b, s14, s15,
                s17, s17a, s18, s21, s22, s23, s24a, s24b, s24c, s25, s28, s29, s30a,
                s31a, s32, s36, s37, s38a, s38b, s39, s44, s45, s45a, s45b, s46, s50,
                s51, s53, s54, s55]
  holistic_check: >
    Каждый из шести разделов фазы несёт ≥1 on-point провал: Р1 — s12/s13a · Р2 — s19 ·
    Р3 — s26/s27 · Р4 — s33/s34 · Р5 — s40/s41/s42 · Р6 — s47/s48. Раздел 2 остался с одним
    после переноса iTutorGroup в s18 соседним классом ошибки без модели: кейс учил
    автоматизации, а не применению ИИ.

# RETRIEVAL-ПРАКТИКА (issue #212). Вопрос напечатан в видимом слое блоком [Бейдж-пауза];
# ответ рядом не печатается. duration_min не увеличен: 10–20 секунд укладываются в проход.
interaction_summary:
  points:
    - { slide: s01,  format: open_question,         note: "хук-парадокс" }
    - { slide: s06,  format: think_pause,           note: "keystone-асимметрия" }
    - { slide: s10,  format: retrieval_think_pause, note: "ИИ-персона прошла онбординг целиком — что в устройстве такого источника мешает ему сказать «нет». Отвечает следующий слайд s11a границей приёма" }
    - { slide: s11a, format: retrieval_pause,       note: "пять персон ответили одинаково — это про продукт или про вопрос" }
    - { slide: s17a, format: retrieval_pause,       note: "трижды попросили генератор «сделай доступно» — почему четвёртая формулировка не поможет" }
    - { slide: s24b, format: retrieval_think_pause, note: "порог по классу риска до прогона — предсказание перед провалами s26/s27" }
    - { slide: s30a, format: retrieval_think_pause, note: "правило остановки, записанное до включения — предсказание перед s33" }
    - { slide: s39,  format: retrieval_pause,       note: "один сигнал своей системы, которого нет ни в одном дашборде — перенос на свою задачу" }
    - { slide: s46,  format: retrieval_pause,       note: "«95% ИИ-пилотов провалились» — какой первый вопрос задаёте цифре. Отвечает следующий слайд s47" }
    - { slide: s53,  format: retrieval_think_pause, note: "автоответ на публичные отзывы — прогнать свой случай по трём осям" }
    - { slide: s55,  format: qa_minimal,            note: "Q&A" }
  coverage: "8 разделов из 8; 11 точек. Р0 — 2 · Р1 — 2 · Р2 — 1 · Р3 — 1 · Р4 — 1 · Р5 — 1 · Р6 — 1 · Р7 — 2."
  leak_check: >
    Перепроверено после пересборки по новому порядку показа, а не по старому. Две точки
    требовали проверки заново. s10: вопрос про механизм синтетического источника теперь
    отвечает s11a (следующий слайд, граница «пять субагентов дают пять коррелированных
    выборок»), а не через слайд — расстояние сократилось, утечки вперёд нет, потому что до
    s10 ни один слайд этого не печатает. s46: вопрос про знаменатель стоит непосредственно
    перед s47 — ради этого s46 оставлен после практик Раздела 6, а не перед ними; s45a и
    s45b печатают базовую линию для стоимости запроса, но не разбирают статистику пилотов.

