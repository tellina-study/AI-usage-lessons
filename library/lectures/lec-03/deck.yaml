deck:
  lecture_number: 3
  title: "Лекция 3. Архитектуры AI-систем: агенты, RAG, API"
  audience: "3 курс ИУ6, инженеры-разработчики (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "У меня есть задача и доступ к LLM. Какую архитектуру выбрать — и когда правильный ответ «не ИИ»?"
  learning_outcomes: [LO7, LO4]
  language: ru
  status: final
  version: v3.1
  source: chapter v1.1 finalized (~22450 слов, 3 части)
  plan: notes/lecture-3-review/final/plan-v2-final.md (v2-final §4)
  total_slides: 36          # s01–s30 monotonic + s04a/s13a/s13b/s23a/s25a/s31
  curriculum_level: introductory
  deck_parts: [deck.yaml, deck-part2.yaml]   # U-9 split; loader reads both

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # 25 canonical terms — from glossary.yaml (locked 2026-05-16, chapter v1.1).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  - архитектура AI-системы
  - промпт
  - few-shot (примеры в промпте)
  - Chain-of-thought (пошаговое рассуждение)
  - faithfulness (верность рассуждения)
  - RAG (Retrieval-Augmented Generation)
  - retrieval (поиск релевантного)
  - grounding (опора на источник)
  - observability (наблюдаемость)
  - golden set (эталонный проверочный набор)
  - fine-tuning (дообучение)
  - PEFT (LoRA/QLoRA)
  - distillation (дистилляция)
  - контекст-инжиниринг
  - context rot (деградация на длинном контексте)
  - tool use / function calling
  - MCP (Model Context Protocol)
  - агент (plan → act → check → iterate)
  - workflow (предопределённые пути)
  - prompt injection (инъекция в промпт)
  - least-privilege (принцип наименьших привилегий)
  - ZDR (Zero Data Retention)
  - BAA (Business Associate Agreement)
  - catastrophic forgetting (катастрофическое забывание)
  - distillation (дистилляция)

