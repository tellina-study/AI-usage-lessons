      ЕДИНСТВЕННОЕ ЧИСЛО НА КАДРЕ — внешнее: Thinking Machines, «80 уникальных завершений из 1000 при
      T=0, расхождение на 103-м токене» (CHISLA-SVERENO.md, строка 19, статус СВЕРЕНО дословно). Это не
