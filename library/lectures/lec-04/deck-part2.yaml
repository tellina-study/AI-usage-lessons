    assertion: "TDD с агентом: форсить порядок «сначала тест» не работает (Böckeler: выигрыша нет, токенов ~3×) — работает рецепт из пяти шагов: человек формулирует, ЧТО тест утверждает; порядок генерации оставлен агенту; утверждения ревьюит человек; прогон — детерминированный исполнитель; гейт — по доле пойманных дефектов, не по покрытию"
    learning_goal: "Round 6 block 3 (owner): не лозунг «структура ≠ ритуал», а конкретный работающий рецепт из 5 шагов вместо форсинга TDD-порядка агенту; инструменты вторично"
    learning_outcomes: [LO7, LO1]
    chapter_ref: "§4.1, §4.2 [for-slide-s22]"
    references: [willison-testing, fowler-testing, bockeler-thoughtworks, dora-report]
    interaction: none

