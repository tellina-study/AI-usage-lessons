    pattern: criteria_checklist_and_boundary
    primary: 'Две плашки бок о бок: где скилл честно окупается и что делают за пределом. Построчно парами,
      чтобы разница читалась по горизонтали. Внизу — переходная строка.'
    backup: 'Третья строка правой плашки опирается на измерение про размер библиотеки и разбирается отдельным
      кейсом дальше; здесь она названа, но не раскрыта. Ни одна строка не остаётся без альтернативы: граница
      говорит не только «нет», но и «вместо чего».'
- id: n44
  file: slides/n44-divider-protsedura-napisana-kto-otkroet.md
  type: section_divider
  duration_min: 0.5
  assertion: Тело скилла в контексте не лежит. До срабатывания модель видит одну строку — и по ней решает,
    открывать файл или нет
  learning_goal: 'Разделитель кейса про описание. Называет напряжение и развилку, а не вывод: что решает
    судьбу правильно написанного файла — вопрос, на который зал отвечает через три слайда'
  visual:
    pattern: section_divider_macro
    tag: 3 части описания · 2 длины, которые путают
    primary: Тёмный Ocean-фон, заголовок-развилка, золотая линия. Ниже — смысловая строка, затем тег со
      счётом кейса. Внизу — дорожка разделов занятия.
    backup: 'Прежний заголовок «Тела скилла в контексте нет» формулировал вывод — зал получал ответ до
      вопроса и дальше слушал подтверждение. Слово «описание» в заголовке не звучит: оно появляется карточками
      вопроса на n46.'
- id: n45
  file: slides/n45-stsena-build-deck-build-deck.md
  type: problem_scenario
  duration_min: 1.0
  assertion: Двенадцать скиллов из тринадцати в этом репозитории показывают вместо описания собственное
    имя — а годное описание лежит строкой ниже и в перечень не попадает
  learning_goal: 'Сцена кейса: перечень скиллов настоящей сессии. Видно, что сломано, и видно, что исправное
    содержание рядом есть — не попадает только то, по чему делается выбор'
  visual:
    pattern: problem_scenario
    primary: 'Моноширинная карточка с перечнем скиллов этой сессии, тринадцать строк подряд. Ниже — вторая
      карточка: начало одного файла, где видно, где лежит годное описание. Внизу — реплика про проверку.'
    backup: Перечень снят с этой сессии 2026-09-30; тот же результат даёт head -5 .claude/skills/*/SKILL.md,
      полная таблица — assets/captures/11-skills-frontmatter-table.md. Единственная строка с настоящим
      описанием — pre-user-gate, единственный скилл курса с фронтматтером.
- id: n46
  file: slides/n46-baza-opisanie-i-dve-dliny.md
  type: base_and_edge
  duration_min: 0.75
  assertion: Описание вставляется в системный промпт, и выбор делается по нему; а когда перечень не помещается
    в бюджет, описания отнимают у наименее вызываемых скиллов
  learning_goal: 'База кейса: что такое описание и куда оно попадает. Кромка — две разные длины для двух
    разных целей, из чего следует правило «ключевой случай первым». Здесь ничего не решается'
  visual:
    pattern: base_and_edge
    primary: 'Две равные дорожки: слева куда попадает описание и что модель видит до выбора, справа что
      происходит при переполнении перечня. Под базой — три термина пилюлями. Под дорожками — строка про
      то, что нашей деке урезание не грозит.'
    backup: 'ИСПРАВЛЕНО после замечания владельца. Прежняя формулировка «перечень отображает до 1536 и
      обрезает конец» читалась как предел на ВЕСЬ перечень и вводила в заблуждение. По первоисточнику:
      1536 знаков — жёсткий потолок на ОДНУ запись (description плюс when_to_use); 1024 — валидационный
      предел самого поля description; а у всего перечня бюджет — 1% окна модели, и при переполнении описания
      отнимаются начиная с наименее вызываемых скиллов. На дорожку вынесен последний факт: он единственный
      решает что-то в этом кейсе. Два предела на одну запись оставлены в заметках. research/mechanics-4-skill.md
      §1.1 и §2.3.'
- id: n47
  file: slides/n47-vopros-kakoe-opisanie-srabotaet.md
  type: reflection_question
  duration_min: 1.5
  assertion: 'Выбор из пяти описаний одного и того же настоящего скилла: какое из них сработает, когда
    надо, и промолчит, когда не надо'
  learning_goal: 'Вопрос на проектирование, а не на теорию: зал выбирает не «что должно быть в описании»,
    а конкретную строку для конкретного файла. Пятая карточка длиннее целевой и при этом запрещена — длина
    не подсказывает ответ'
  visual:
    pattern: question_with_option_cards
    primary: Завязка тихой формой с двумя проверками, которым описание обязано удовлетворить. Вопрос в
      золотой рамке, под ним пять карточек — пять вариантов одной и той же строки. Ни цифр, ни источников,
      ни выделений.
    backup: 'Пять карточек — пять редакций описания настоящего скилла курса build-deck, того самого, что
      на сцене виден как «build-deck: build-deck». Лестница идёт от бедной формулировки к полной, затем
      запрещённая форма от первого лица — она длиннее целевой, поэтому «выбирай самое подробное» не срабатывает
      как эвристика. Прежняя редакция спрашивала «что должно быть в описании» — условие, а не проектное
      решение; владелец назвал это теоретическим вопросом.'
- id: n48
  file: slides/n48-razbor-odna-redaktsiya-prohodit-obe.md
  type: answer_breakdown
  duration_min: 2.25
  assertion: 'Обе проверки проходит только редакция из трёх частей: что делает, когда звать и когда не
    звать — последняя и удерживает скилл от лишнего срабатывания'
  learning_goal: Разбор всех пяти карточек. У каждой отвергнутой названо место, где она правильная. Видимый
    слой не утверждает, что именно сказал зал, — это ожидание живёт в заметках фасилитатора
  visual:
    pattern: answer_breakdown_table
    primary: Таблица на три колонки и пять строк. Целевая строка набрана жирным целиком — рендерер подсвечивает
      её золотом. Под таблицей — пара «плохо и хорошо» отдельной формой.
    backup: Запрет первого лица приводится дословно по официальным best practices вместе с обеими запрещёнными
      формулировками и одобренной. «Не сообщает когда» названо главной официальной причиной несрабатывания
      — формулировка документации, а не оценка курса.
- id: n49
  file: slides/n49-cobuilding-tri-varianta-frontmattera.md
  type: cobuilding
  duration_min: 1.0
  assertion: Два наивных фронтматтера ломаются каждый по своей причине; третий собирает зал — по одному
    предложению на каждый из трёх вопросов
  learning_goal: Собираем описание вслух на настоящем артефакте. Каждый наивный вариант ломается по своей
    причине, и обе причины названы. Рядом — официальные примеры «как не надо», дословно
  visual:
    pattern: cobuilding_description_assembly
    primary: 'Сверху — таблица трёх вариантов: у первых двух причина поломки названа, у третьего ячейка
      отправляет к вопросам. Ниже — таблица трёх вопросов залу и того, куда ложится каждый ответ. Собранного
      фронтматтера на этом слайде НЕТ — он на следующем.'
    backup: 'Третья строка таблицы намеренно не несёт ответа, и собранный фронтматтер вынесен на отдельный
      слайд: пока ответ напечатан рядом с вопросом, диктовать залу нечего — владелец вернул этот дефект
      отдельным замечанием. Формат вопросов повторяет приём n13, где так же собирался хук. Три запрещённые
      формулировки и одобренный пример убраны с экрана ради места и целиком лежат в заметках — дословно
      по официальным best practices. Описание — артефакт для демо-репозитория signup-landing, каталог
      .claude/skills/deploy/, на дереве помечен «по плану, коммита пока нет».'
- id: n50
  file: slides/n50-cobuilding-chto-prodiktoval-zal.md
  type: cobuilding
  duration_min: 1.0
  assertion: 'Три ответа зала складываются в одно поле: что делает — третьим лицом, по каким словам звать,
    и где сработать не должен'
  learning_goal: Ответ на три вопроса предыдущего слайда. Показывается ТОЛЬКО после того, как зал продиктовал
    свои формулировки — иначе диктовать нечего
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Одна моноширинная карточка: собранный фронтматтер с подписью, что он собран из трёх ответов.
      Ниже — две проверки, которыми его проверяют в обе стороны.'
    backup: 'Слайд отделён от вопросов намеренно: пока собранное описание напечатано рядом с вопросами,
      зал читает ответ вместо того, чтобы его давать. Нижняя карточка — один из возможных ответов, а не
      эталон: если формулировки зала другие, берутся они, важен состав, а не слова. Артефакт для демо-репозитория
      signup-landing, на дереве помечен «по плану, коммита пока нет».'
- id: n51
  file: slides/n51-cobuilding-telo-naivnoe-i-chego-net.md
  type: cobuilding
  duration_min: 0.75
  assertion: 'Тело без литеральных команд задачу не решает, а переносит: угадывание переезжает из файла
    инструкций внутрь скилла'
  learning_goal: 'Вторая половина сборки: тело скилла. Наивный вариант валиден и срабатывает — и именно
    поэтому его дефект незаметен. Рабочий вариант называет по одной команде на шаг, и ровно один способ'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Наивное тело из общих слов, под ним — в чём его дефект. Ниже — тот же список шагов с пустыми
      местами под команды: их называет зал. Собранного тела на этом слайде НЕТ — оно на следующем.'
    backup: 'Команды вынесены на следующий слайд: пока они напечатаны рядом с вопросом «какой командой»,
      называть залу нечего. Сами команды взяты из артефакта демо-репозитория signup-landing (research/mechanics-4-skill.md
      §3). Шагов пять, литеральных команд три: четвёртый и пятый шаги — ручная проверка и запись, и на
      слайде они так и выглядят, без выдуманной команды.'
- id: n52
  file: slides/n52-cobuilding-telo-kotoroe-prodiktoval-zal.md
  type: cobuilding
  duration_min: 0.75
  assertion: 'Пять шагов, у каждого названо действие целиком: три литеральные команды и два шага, которые
    исполняются руками'
  learning_goal: Ответ на вопрос предыдущего слайда. Шагов пять, команд три — и это сказано вслух, вместо
    того чтобы придумывать команды там, где их нет
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Одна моноширинная карточка: тело из пяти шагов с командами на местах, где они есть. Ниже
      — официальное правило про один способ и честная арифметика «шагов пять, команд три».'
    backup: 'Слайд отделён от вопроса намеренно: пока команды напечатаны рядом с вопросом «какой командой»,
      называть залу нечего. Команды взяты из артефакта демо-репозитория signup-landing (research/mechanics-4-skill.md
      §3); четвёртый и пятый шаг команды не имеют, и выдуманной на слайде нет.'
- id: n53
  file: slides/n53-proval-sfokusirovannyy-obgonyaet.md
  type: failure_vignette
  duration_min: 1.5
  assertion: Сфокусированный скилл обгоняет исчерпывающий набор на той же выборке задач — интуиция «раз
    пишу, напишу полным» измеримо проигрывает
  learning_goal: 'Провал уже принятого решения: описание написали правильно, а тело раздули. Направление
    подтверждено первоисточником, числового разрыва в работе нет — и это сказано на слайде, а не скрыто'
  visual:
    pattern: failure_vignette
    primary: 'Таблица двух строк: интуиция и что измерено против неё. Ниже — официальная рекомендация
      про объём отдельной формой. Внизу — оговорка пунктиром про отсутствующее число.'
    backup: 'Первоисточник — SkillsBench: «сфокусированные скиллы максимум с тремя модулями обгоняют более
      крупные или исчерпывающие наборы», та же 87-задачная выборка, варьируется структура скилла. Слово
      «модуль» в работе НЕ РАСКРЫТО — файл, раздел, вложение? — поэтому из видимого слоя снято целиком,
      осталось направление без жаргона. Числовой размер разрыва из работы тоже не извлечён: процента на
      слайде нет, и его отсутствие названо вслух.'
- id: n54
  file: slides/n54-granitsa-dokuda-reshaet-opisanie.md
  type: criteria_boundary
  duration_min: 0.75
  assertion: Одного описания хватает, пока спутать скилл не с чем и зовут его теми же словами; дальше
    решает уже не текст описания
  learning_goal: 'Предел применимости кейса: докуда судьбу скилла решает его описание и что берут за этим
    пределом. Третья строка снимает ложную безальтернативность — автовыбор можно и выключить'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Две плашки бок о бок: докуда описания хватает и что берут за пределом. Построчно парами.
      Внизу — вопрос залу и переходная строка.'
    backup: 'Прежняя редакция плана предела у этого кейса не предусматривала — считалось, что у описания
      границы нет. Прожарка показала обратное: кейс оставался единственным, из которого зал уходил с ответом
      «как надо» и без ответа «до каких пор». Третья строка опирается на флаг disable-model-invocation
      (research/mechanics-4-skill.md §2.1): при true скилл вызывается только явно, а модель его описание
      не видит вовсе.'
- id: n55
  file: slides/n55-divider-takoy-skill-uzhe-napisan.md
  type: section_divider
  duration_min: 0.5
  assertion: Такой скилл уже написан, и написан лучше, чем напишете вы. Вопрос в том, что вы вместе с
    ним впускаете
  learning_goal: 'Разделитель кейса про чужой скилл. Называет напряжение честно с обеих сторон: готовое
    действительно лучше, и именно поэтому решение непростое'
  visual:
    pattern: section_divider_macro
    tag: 1 официальный скилл · 4 замера · 3 условия отказа
    primary: Тёмный Ocean-фон, заголовок, золотая линия. Ниже — смысловая строка, затем тег со счётом
      кейса. Внизу — дорожка разделов занятия.
    backup: 'Развилка намеренно не начинается с риска: кейс должен кончиться условиями, при которых чужое
      — правильный выбор, а не выводом «чужое опасно». Тег называет счёт: один официальный скилл, два
      замера каталога, три вещи, которые приходят вместе.'
- id: n56
  file: slides/n56-stsena-svoy-za-nedeli-ili-gotovyy-segodnya.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Задача решается готовым скиллом сегодня или своим за недели; и качество готового при этом
    честно выше
  learning_goal: 'Сцена кейса: настоящая развилка приобретения, а не собственный фронтматтер. Сильная
    сторона готового названа первой и не занижена — иначе решение фальшивое'
  visual:
    pattern: problem_scenario_with_figure
    figure: skilly-svoy-ili-gotovyy.png
    primary: 'Сверху — задача и то, что готовое решение на неё уже существует. Ниже — схема выбора: своё
      против готового по четырём меркам, с последней строкой, где своё выигрывает. Внизу — реплика про
      момент, когда решение принимается.'
    backup: 'Официальный скилл разбора PDF существует и описан в документации Agent Skills; его описание
      приведено там дословно как образец хорошего — «Extract text and tables from PDF files, fill forms,
      merge documents». Оценка «недели» — не измерение, а оценка объёма работы, и на слайде она так и
      подписана. Сцена намеренно не про наш репозиторий: прежняя сцена этого кейса повторяла сцену предыдущего,
      и владелец назвал её дублем. Таблица сравнения снята: она повторяла схему строка в строку, а схема
      богаче — четыре мерки против трёх. Это и освободило схеме её ширину, вместо того чтобы поджимать
      саму схему.'
- id: n57
  file: slides/n57-baza-chto-prihodit-vmeste-so-skillom.md
  type: base_and_edge
  duration_min: 0.75
  assertion: Вместе со скиллом приходит каталог с исполняемым кодом, который запускается с правами вашей
    сессии, а разрешение вы даёте один раз
  learning_goal: 'База кейса: чужой скилл — не текст, а каталог с кодом. Кромка — разрыв между разовым
    разрешением и постоянными правами: содержимое может измениться после того, как вы согласились'
  visual:
    pattern: base_and_edge
    primary: 'Две равные дорожки: слева что физически приходит вместе со скиллом, справа разрыв между
      разовым разрешением и постоянными правами. Под базой — три термина пилюлями.'
    backup: Устройство каталога и запуск скриптов через оболочку — официальная документация, та же, что
      на структурном слайде n40. Разрыв «разовое согласие, постоянные права» описан академической таксономией
      как single-approval persistent trust model; на слайде он назван по-русски и без ссылки.
- id: n58
  file: slides/n58-vopros-berete-ili-pishete.md
  type: reflection_question
  duration_min: 1.5
  assertion: 'Выбор из пяти карточек: что делаете с готовым чужим скиллом, который объективно лучше вашего
    будущего'
  learning_goal: 'Открытый вопрос кейса. Без цифр, без источников, без выделений. Карточка «не ставить»
    — не соломенное чучело: у неё есть законная область, и разбор её называет'
  visual:
    pattern: question_with_option_cards
    primary: Завязка тихой формой, вопрос в золотой рамке, под ним пять равных карточек. Ни цифр, ни источников,
      ни выделений.
    backup: 'Подводка не оценивает ни одну карточку: она повторяет расклад сцены и передаёт решение залу.
      Целевой ответ — порядок из двух шагов, и это сказано словом «делаете», а не подсказкой. Карточка
      «не ставить вовсе» получает в разборе настоящую область применения, а не роль отвергнутой.'
- id: n59
  file: slides/n59-svidetelstva-otobrannyy-i-sluchaynyy.md
  type: research_evidence
  duration_min: 1.75
  assertion: Прирост измерен у отобранного скилла; средний из открытых каталогов вдвое хуже по той же
    рубрике, а четверть из них несёт уязвимость
  learning_goal: 'Свидетельства кейса: четыре измерения, каждое ведёт к своему шагу решения. Прирост оправдывает
    «взять», качество экосистемы — «отобрать», доля уязвимых — «вычитать», множитель скриптов — что именно
    читать'
  visual:
    pattern: evidence_table_with_gap
    primary: 'Таблица четырёх измерений: что измерено, от какой базы, к какому шагу решения ведёт. Ниже
      — оговорка пунктиром про несопоставимость с другим замером.'
    backup: '33,9→50,5 и 6,2/12 против 10,1/12 — SkillsBench, те же 87 задач и 18 связок модель+среда.
      26,1% / 5,2% / 2,12× (OR=2,12, p<0,001) — Agent Skills in the Wild, корпус 31 132, детектор с точностью
      86,7% и полнотой 82,5%; все три подтверждены по первичному abstract. Четвёртая колонка добавлена
      намеренно: владелец просил меньше цифр, но чтобы каждая была описана — здесь у каждой названо, какое
      решение она обслуживает.'
- id: n60
  file: slides/n60-razbor-vychitat-potom-stavit.md
  type: answer_breakdown
  duration_min: 2.25
  assertion: Сначала вычитать то, что исполняется, потом ставить; для необратимого — ставить с выключенным
    автовызовом. «Не ставить» тоже имеет свою область
  learning_goal: 'Разбор всех пяти карточек. Целевой — порядок из двух шагов. У карточки «не ставить»
    названа настоящая область применения, а не роль отвергнутой: это условие, при котором отказ правильный'
  visual:
    pattern: answer_breakdown_table
    primary: Таблица на три колонки и пять строк. Целевая строка набрана жирным целиком — рендерер подсвечивает
      её золотом. Под таблицей — рабочее правило отдельной формой.
    backup: '68,8% из 125 функциональных провалов — дифференциальный анализ: тот же прогон со скиллом
      и без, на тех же задачах; число обслуживает строку «взять как есть» и больше нигде в кейсе не повторяется.
      Карточка «не ставить» получает три условия, при которых она верна, — иначе она соломенное чучело
      ради целевого ответа.'
- id: n61
  file: slides/n61-artefakt-chto-chitat-v-chuzhom-skille.md
  type: code_artifact
  duration_min: 1.5
  assertion: Вычитка чужого скилла — четыре места в определённом порядке, и одно средство проверяет фронтматтер
    без запуска сессии
  learning_goal: 'Артефакт кейса: где смотреть, что именно искать и чем проверить. Порядок обратный интуитивному
    — сначала исполняемое, тело последним'
  visual:
    pattern: code_artifact
    primary: 'Моноширинная карточка: каталог чужого скилла с пометками, что смотреть в каждом месте и
      в каком порядке. Ниже — таблица четырёх мест с тем, что в них ищут. Внизу — строка про средство,
      работающее без живой сессии.'
    backup: 'Порядок обхода следует из измерения 2,12×, приведённого свидетельствами: скрипты вперёд тела.
      claude plugin validate находит нечитаемый фронтматтер без живой сессии, доступно с v2.1.233 — research/mechanics-4-skill.md
      §4.3. Живого снимка вывода команды нет, и на слайде поэтому только её назначение, а не вымышленный
      вывод.'
- id: n62
  file: slides/n62-proval-oficialnyy-skill-i-katalog.md
  type: failure_vignette
  duration_min: 1.75
  assertion: Официальный скилл производителя переделали так, что он тихо запускал шифровальщика; а в одном
    каталоге за одиннадцать дней число вредоносных выросло с 341 до 824
  learning_goal: 'Провал уже принятого решения: вычитали и взяли — а содержимое поменялось после. Бьёт
    по самому безопасному варианту выбора, официальному, а не по сомнительному'
  visual:
    pattern: failure_vignette_with_figure
    figure: skilly-chuzhoy-katalog.png
    primary: 'Случай с официальным скиллом тихой формой сверху. Ниже — схема двух замеров каталога: сколько
      было и сколько стало, в общем масштабе, с выводом про долю. Внизу — строка про то, что из этого
      следует для порядка.'
    backup: 'Случай с официальным открытым скиллом-конвертером и вставленной функцией, тихо запускающей
      программу-шифровальщика, — воспроизведённый исследователями пример, раскрытый производителю; это
      доказательство возможности, а не наблюдаемая распространённость, и так и подписано. Два замера одного
      каталога подтверждены независимыми пересказами: первичный адрес публикации сменился после поглощения
      компании, на слайде поэтому только имя каталога. Таблица двух замеров снята: схема несёт те же числа
      с базами и вдобавок показывает их в общем масштабе — таблица была её пересказом словами. Схема получила
      свою ширину за счёт снятого дубля, а не за счёт поджатия.'
- id: n63
  file: slides/n63-granitsa-kogda-chuzhoy-pravilnyy-vybor.md
  type: criteria_boundary
  duration_min: 0.75
  assertion: Чужой скилл — правильный выбор, когда предмет общий, есть кому вычитать исполняемое и действие
    обратимо; за пределом берут своё или не берут вовсе
  learning_goal: 'Предел применимости: кейс кончается условиями, при которых чужое правильно, а не выводом
    «чужое опасно». Три условия проверяемы до установки'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Две плашки бок о бок: когда чужой скилл правильный выбор и что делают за пределом. Внизу
      — вопрос залу и переходная строка.'
    backup: Владелец заказал кейс словами «есть классный отлаженный внешний, и его лучше взять, чем самим
      рожать» — предел обязан отвечать именно на это, поэтому левая плашка сформулирована как условия
      «берите», а не как оговорка к запрету. Число 202 приведено как крайняя точка измерения роста библиотеки;
      промежуточных порогов в работе нет, и на слайде порог не называется.
- id: n64
  file: slides/n64-os-dve-stroki-zakryty.md
  type: recap_table
  duration_min: 2.0
  assertion: Две строки оси закрыты — хук и скилл, у каждой названо, чего от неё ждали и что вышло на
    деле; MCP, субагент и процесс остаются пустыми до следующего занятия
  learning_goal: 'Контрольная точка, не развязка: та же таблица, что открывала занятие пустой, теперь
    с двумя заполненными строками. Синтез и тезисы на вынос — в закрытии следующего занятия, не здесь'
  visual:
    pattern: recap_table
    primary: 'Та же вёрстка, что у keystone-слайда n03, до ширины колонок — зал должен узнать таблицу,
      а не увидеть новую. Ведущая строка — мостик с последней ступени, формой тезиса. Таблица: две верхние
      строки заполнены, три нижние — пунктирные пустые слоты, колонки те же и в том же порядке. Внизу
      подписью — единственная подпись слайда. Ни синтеза, ни тезисов на вынос, ни афоризма в рамке.'
    backup: 'rework/block-z5-os-promezhutochnaya.md §A.1/§B.2. Формулировки строк сведены с axis_placement-слайдами
      нынешней деки, откуда они и взяты: строка «хук» — s20 («Решаем — правило уже было нарушено, когда
      мы взялись за барьер» / «поставили хук — коммит в main закрыт»), строка «скилл» — s32 («решаем,
      по сигналу» / «важно содержание; описание — деталь, допишем позже» / «без точного описания-триггера
      не сработает вообще: выбор идёт по описанию, а не по содержимому»). Колонка «проверка показала»
      у хука приведена к числу, которое блок «Хуки» реально предъявляет и печатает сам: из ШЕСТИ форм
      одной команды барьер отклоняет ОДНУ и молчит на пяти (n15, assets/captures/35-selftest-branch-guard-run.txt
      — 9 PASS / 5 LIMIT / 0 FAIL), плюс человека с терминалом он не видит вовсе (n16). Прежняя формулировка
      «обходится пятью воспроизведёнными способами» называла пять без базы сравнения; база — шесть форм.
      ВАЖНО: в новой деке axis_placement-слайдов внутри блоков НЕТ (см. STRUCTURE-PROPOSAL-slides.md),
      поэтому эта таблица — второй показ оси, а не третий; строки не дублируются больше нигде. Числа расхождений
      не называются: обещание «одного на ступень» с n03 не давалось.'
- id: n65
  file: slides/n65-chto-poyavilos-v-repozitorii.md
  type: code_artifact
  duration_min: 1.25
  assertion: Две ступени добавили в репозиторий два файла, подтверждённых коммитом, и один по плану без
    коммита — граница между «написано» и «уже работает» показана на слайде, а не спрятана
  learning_goal: Итоговое дерево репозитория с явной границей подтверждённого коммитом и запланированного
    — та же дисциплина «не путать план с фактом», которая была темой всего занятия
  visual:
    pattern: file_tree_snapshot
    primary: 'Ведущая строка про то, что каталога `.claude/` на входе не существовало вовсе. Под ней —
      моноширинный листинг: каждая новая строка помечена своей ступенью и меткой происхождения, у хука
      — номер коммита, у скилла — «по плану, коммита пока нет». Отдельным блоком — рост файла инструкций
      с двадцати строк и трёх разделов до сорока и пяти, с именами обоих новых разделов. Внизу подписью
      — единственная подпись слайда.'
    backup: 'rework/block-z5-os-promezhutochnaya.md §A.2. .claude/settings.json и .claude/hooks/selftest-branch-guard.sh
      — ветка seminar-5-hook, коммит 9803643, сверено напрямую gh api …/git/trees (ARCHITECTURE.md §2а,
      rework/section-1-khuk.md §A.7/§A.16). Рост CLAUDE.md 20/3 → 40/5 и имена обоих новых разделов —
      gh api …/contents/CLAUDE.md?ref=seminar-5-hook → wc -l = 40, подсчёт ##-заголовков = 5 (ARCHITECTURE.md
      §2а, ПРОВЕРЕНО НАПРЯМУЮ). .claude/skills/deploy/SKILL.md — по плану блока скиллов, коммита на момент
      сборки нет; граница проводится НА СЛАЙДЕ, не в примечании. Промежуточное состояние CLAUDE.md «26
      строк» не показывается ни здесь, ни на n02: прямого git-состояния на 26 строк в репозитории не существует,
      оно выводилось арифметически (qa/number-provenance.md строка 31).'
- id: n66
  file: slides/n66-tot-zhe-vopros-vtoroy-raz.md
  type: reflection_question
  duration_min: 1.5
  assertion: Тот же вопрос открытия и те же пять карточек — второй раз за занятие; зал отвечает снова,
    и вслух называется, у кого ответ изменился и что именно его изменило
  learning_goal: 'Закрытие петли, открытой на n04: вопрос предъявляется дословно второй раз, теми же пятью
    карточками, и отвечает на него зал, а не лектор. Разбор того, что за час стало проверяемым, — только
    на следующем слайде'
  visual:
    pattern: question_repeat
    primary: 'Тот же приём и та же раскладка, что у n04, и это важно: зал должен узнать слайд, не прочитав
      ни слова. Напоминание о первом предъявлении — тихой формой реплики. Сам вопрос — дословно тот же,
      в gold-рамке, вместе со вторым вопросом про изменение ответа. Под ним те же пять карточек в том
      же порядке, ни одна не подсвечена — ни одна не стала «правильной» за час. Ни таблицы, ни итогов,
      ни намёка на целевой ответ.'
    backup: 'Вопросительное предложение взято с n04 ЗНАК В ЗНАК: «В этом репозитории — с его формой заявки,
      тестами и двадцатью строками инструкций — какое из пяти вы завели бы первым?». Изменено ровно одно:
      обещание «этот вопрос прозвучит сегодня второй раз» снято (оно исполнено) и на его месте стоит вопрос
      про изменение ответа. Карточки и их порядок совпадают с n04 и с порядком строк оси на n03. Петля
      скопирована с Семинара 4 (sem-04/slides/s49), где возврат к залу был отдельным слайдом. Полный разбор
      всех пяти строк остаётся закрытию следующего занятия (section-6-zakrytie.md §A.4); здесь занятие
      заканчивается неопределённостью намеренно.'
- id: n67
  file: slides/n67-chto-za-chas-stalo-proveryaemym.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Под двумя карточками из пяти теперь лежит файл, который можно открыть и проверить командой;
    под тремя остальными такого файла нет — их ступени впереди
  learning_goal: 'Разбор второго голосования: что за час стало проверяемым и чем именно. Асимметрия между
    «разложено по артефакту» и «не разложено вовсе» проговаривается вслух; ответ по трём оставшимся не
    даётся и не намекается'
  visual:
    pattern: answer_breakdown_table
    figure: ramka-n62-chto-razlozheno.png
    primary: 'Ведущая строка формой тезиса. Под ней — схема figures/ramka-n62-chto-razlozheno.png во всю
      ширину: пять строк ступеней в том же порядке, что карточки на n04 и n61. У двух верхних — заполненная
      плашка с тем, что показало занятие, и рядом чип с артефактом, которым это проверяется. У трёх нижних
      — пунктирные пустые слоты той же ширины, без текста: сегодня их нечем заполнить. Внизу — оговорка
      пунктирной формой. Ни одна строка не подсвечена золотом: целевого ответа нет и здесь.'
    backup: 'rework/block-z5-os-promezhutochnaya.md §A.3/§B.4, с двумя правками по существу. Первая: разложенных
      строк ДВЕ, не три — доступ наружу уехал в Занятие 6 целиком. Вторая: утверждение «процесс заводится
      на день 0 без сигнала вовсе» снято — занятие про субагента и процесс не сказало ничего, кроме того,
      что их ступени впереди, и писать «заявлено, но не проверено» значит записать залу ответ, которого
      он не слышал. Артефакты в чипах: у хука — .claude/settings.json и самотест на ветке seminar-5-hook,
      коммит 9803643, который печатает свои дыры сам (n15); у скилла — фронтматтер с описанием-триггером,
      по которому идёт выбор (n47/n48).'
