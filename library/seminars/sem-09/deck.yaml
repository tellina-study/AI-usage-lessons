  duration_min: 1.5
  assertion: Дата набрана мельче суммы и ломается чисто на шаге, где сумма ещё держится без единой ошибки
    — сумма сломается только двумя шагами позже, на самом мелком размере
  learning_goal: 'Вторая половина поворота кейса: не сжатие вообще, а конкретное поле ломается — и ломается
    не шумом, а уверенной, почти всегда повторяемой неверной догадкой. Собственный замер, дословные ответы,
    впервые с собственной высотой символа даты (измерена отдельно 2026-10-27, issue #299).'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица тех же шести размеров файла с высотой цифры даты на каждом и исходом «дата верна».
      Под ней — разбор дословных неверных ответов и плашка про устойчивость ошибки (почти всегда одна
      и та же неверная догадка).

      '
    backup: 'Числа — из `stend/zamery-k5-k6/README.md`, Замер 4.1, таблица «дата верна» по тем же шести
      размерам: исходный, половина, четверть — 5 из 5 каждый; одна восьмая, одна шестнадцатая и одна тридцать
      вторая — 0 из 5 каждый. Истинная дата квитанции — 12.09.2026.

      Высота цифры даты измерена отдельно впервые 2026-10-27 (`measure_date_glyph_height.py`, тот же метод,
      что и для суммы — реальный рендер шрифта DejaVuSansMono-Bold кеглем 32, bbox; значения записаны
      в `receipts-manifest.json` как `date_glyph_height_px`). По разрешениям: 23,0 / 11,5 / 5,8 / 2,9
      / 1,4 / 0,7 пикселя — ровно половина высоты символа суммы на каждом шаге, потому что дата набрана
      кеглем 32 против 64 у суммы. До этой правки подпись «6,1 px» на `n72` по ошибке называла высоту
      символа СУММЫ на шаге `eighth`, а не даты (README, раздел «Файлы в этой папке», запись про `measure_date_glyph_height.py`)
      — отдельного столбца высоты именно даты в деке до сих пор не было.

      Дословные неверные ответы (`results-k6-resolution.json`, по полю `date`): на размере «одна восьмая»
      все 5 повторов (execution 1090–1094) — `12.04.2024`; на «одна шестнадцатая» все 5 повторов (execution
      1095–1099) — `18.09.2024`, другое значение, тоже полное единогласие; на «одна тридцать вторая» (execution
      1100–1104) — 4 из 5 повторов `05.04.2024`, 1 из 5 (execution 1102) `05.04.2025`. Поле `raw_text_seen`
      (что модель заявила, что видит) verbatim-верно для суммы на размерах, где сумма ещё читается верно
      (eighth, sixteenth — такт n70); на thirtysecond неверны уже оба поля, и там `raw_text_seen` дословно
      совпадает с тем неверным числом, которое назвала модель, — она не путает «не вижу» с «вижу неправильно»
      ни для даты, ни для суммы.

      Номера прогонов и идентификаторы исполнений на видимом слое не стоят.'
- id: n72
  file: slides/n72-k6-vysota-simvola.md
  type: mechanism_field_contrast
  duration_min: 1.0
  assertion: Два поля одного и того же файла ломаются на разных шагах одного и того же сжатия — потому
    что у них разная высота символа на старте, не потому что файл стал меньше
  learning_goal: 'Механизм, который объясняет поворот кейса: порог деградации завязан на высоту символа
    конкретного поля, не на мегапиксели или разрешение файла целиком. Честный повтор 2026-10-27 (issue
    #299) даёт этому механизму более сильное подтверждение, чем протёкший прогон: ДВА РАЗНЫХ порога для
    двух полей разной высоты, не одно поле без порога вовсе. Числа 25 из 30 (сумма) и 0 из 15 (дата) уже
    вскрыты тактами n70/n71 и здесь возвращаются как диапазоны высоты символа.'
  visual:
    pattern: mechanism_field_contrast
    figure: k6-shema-vysota-simvola.png
    primary: 'Фигура в два столбца на одном файле: столбец «сумма, кегль крупнее» и столбец «дата, кегль
      мельче», одна и та же шкала сжатия сверху вниз — сумма ломается только на последнем шаге, дата на
      двух последних. Внизу — два диапазона порога («1,5–3,1 px» для суммы, «2,9–5,8 px» для даты) с честной
      пометкой, что диапазоны пересекаются частично, не расходятся ровно вдвое.

      '
    backup: 'Механизм — по SETKA-KEYSOV-S9-part2.md, раздел «Кейс 6», подраздел «Нюансы», пункт 3: «порог
      деградации завязан на высоту символа, не на мегапиксели файла». После честного повтора 2026-10-27
      (починка протечки промта, issue #299) это подтверждение стало сильнее, не слабее: ДО починки сумма
      «не ломалась вовсе», что выглядело как подозрительно устойчивое поведение; ПОСЛЕ починки видно два
      честных порога у двух полей разной высоты — ровно то, что механизм и предсказывает.

      Базовый кегль суммы на полном размере — 64 пикселя, базовый кегль даты — 32 пикселя (`stend/zamery-k5-k6/README.md`,
      Замер 4.1): дата набрана вдвое мельче, это и есть база, без которой два разных порога не сопоставимы.
      Фактическая высота символа (не кегль, а измеренный bbox шрифта) на каждом шаге сжатия для суммы:
      49,0 / 24,5 / 12,2 / 6,1 / 3,1 / 1,5 px; для даты (`measure_date_glyph_height.py`, добавлено 2026-10-27):
      23,0 / 11,5 / 5,8 / 2,9 / 1,4 / 0,7 px — ровно половина высоты суммы на каждом шаге, что и ожидаемо
      при вдвое меньшем кегле.

      Порог суммы — строго между `sixteenth` (3,1 px, 5/5 верно) и `thirtysecond` (1,5 px, 0/5 верно),
      то есть в диапазоне 1,5–3,1 px. Порог даты — строго между `quarter` (5,8 px, 5/5 верно) и `eighth`
      (2,9 px, 0/5 верно), то есть в диапазоне 2,9–5,8 px. Диапазоны ЧАСТИЧНО ПЕРЕСЕКАЮТСЯ (общая зона
      2,9–3,1 px) — это не ровно вдвое и не раздельные зоны, и фигура называет это честно, а не выпрямляет
      до красивого «вдвое ниже».

      Что сознательно не на кадре: причина, почему у суммы запас прочности настолько больше, чем у даты
      (устойчивый шаблон денежного числа, крупный моноширинный шрифт) — это отдельное, НЕ измеренное предположение
      такта n70, повторять его здесь как часть «механизма» значило бы выдать догадку за находку.'
