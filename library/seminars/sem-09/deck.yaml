- id: n60
  file: slides/n60-k5-tri-ishoda.md
  type: measured_outcome_table
  duration_min: 2.25
  assertion: Три трудных вопроса, по десять повторов каждый, температура ноль, одна и та же база знаний
    — и три разных вида негодности к отправке, ни один из которых не виден в журнале прогонов
  learning_goal: 'Несущий кадр кейса. Поворот (П1): обе гипотезы замера НЕ подтвердились — решение у границы
    не перекидывалось, набор пунктов не плясал. Вместо этого — находка сильнее ожидавшейся: устойчиво
    неверный ответ и устойчиво противоречащий себе ответ. Ось кейса: повторяемость и правильность — независимые
    свойства.'
  visual:
    pattern: measured_outcome_table
    figure: k5-shema-tri-ishoda.png
    primary: 'Фигура несущей схемы во всю ширину: три колонки «Разброс · Устойчивая ошибка · Устойчивое
      противоречие», в каждой — вопрос, десять кружков исхода, итоговое число плашкой и что получает клиент;
      внизу строка сравнения с лёгким вопросом. Фигура несёт все числа целиком — под ней только короткая
      методологическая рамка, без повтора таблицей (готовая фигура уже даёт ровно ту структуру, которую
      должна была нести таблица, и дублировать её текстом значило бы напечатать один и тот же разбор дважды
      подряд на одном экране).

      '
    backup: 'Числа и формулировки — дословно из `stend/zamery-k5-povtorno/README.md` (executions 799–828,
      30 вызовов из разрешённых 32) и SETKA-KEYSOV-S9-part2.md, раздел «Кейс 5», подраздел «Результат».

      ПРАВКА ОРКЕСТРАТОРУ, причина и решение. Первая редакция этого файла несла markdown-таблицу с теми
      же тремя вопросами и теми же числами, что и готовая фигура `k5-shema-tri-ishoda.png` (проверено
      просмотром готовой фигуры глазами: заголовок, три колонки, кружки исхода, те же плашки «3 исхода
      из 10» / «10 из 10» дважды, та же строка сравнения «25 повторов, 0 расхождений» внизу). Таблица
      снята: фигура уже держит ровно тот текст и те числа, которые таблица бы повторила — сопоставление
      (канон §7.1 и форма §5.19) читается с фигуры с одного взгляда, второй такой же текст ниже не добавляет
      довода, а дробит внимание зала между двумя одинаковыми источниками одной и той же цифры. Оставлены
      две короткие врезки: методологическая рамка (что это за три замера) и синтез, которого на фигуре
      нет буквально — что все три находки не видны в журнале прогонов.

      ТРИ «ИЗ 10» РАЗВЕДЕНЫ ЯВНО, каждое своей строкой и своей подписью (правило формы §5.14 — два похожих
      числа не в одной фразе без разводящих подписей): вопрос про арифметику даёт **3 разных исхода из
      10**; вопрос про границу правила даёт **10 из 10 одну и ту же неверную ветку**; вопрос про совмещение
      двух пунктов даёт **0 расхождений набора из 10**, но ответ, противоречащий себе **10 из 10** раз.
      Это три разных числа про три разных вопроса — не три замера одного и того же явления.

      ЧЕСТНЫЙ ОТРИЦАТЕЛЬНЫЙ РЕЗУЛЬТАТ НАЗВАН ПРЯМО: гипотеза замера ждала, что у границы правила решение
