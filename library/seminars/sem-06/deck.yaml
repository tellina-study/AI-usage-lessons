      проверки.'
    backup: 'Источник — section-2-subagent.md §A.1 «Провал» + section-2-subagent-part1b.md n44 «Речь»,
      дословно, включая цитату отказа харнесса. Число «четырнадцать файлов, тринадцать без поля» перенесено
