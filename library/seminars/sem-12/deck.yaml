    §5 и §9). Добавлена четвёртая строка — картинка с подсказкой, 72,5% при $3,923, — и вторая плашка:
    подсказка платит не деньгами, а точностью. Введён столбец «что у модели на входе»: имена трёх нижних
    строк все содержат «распознанный текст», и без разводки они в четырёхстрочной таблице слипаются. Минута
