- id: n51
  file: slides/n51-stsena-vtoraya-sessiya-perekryla-vetku.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Разработчик открыл вторую сессию в том же каталоге, чтобы не ждать первую; вторая завела
    свою ветку, и незаконченная правка первой уехала в чужой коммит — обе сессии доложили, что справились
  learning_goal: 'Завязка третьего кейса: наблюдаемая проблема без решения, с человеком и названной ценой.
