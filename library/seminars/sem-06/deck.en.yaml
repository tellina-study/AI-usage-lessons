  learning_goal: 'The checkable cases of the second case: what exactly well-known teams did with tool
    definitions, and how we know about it. The slide takes away a convenient false frame — the refusal
    concerns the loading of definitions at start-up, and the servers stayed; and there is no single answer
    across the industry, the last row being the direct opposite of the first three'
  visual:
    pattern: failure_vignette_table
    primary: 'Four numbered rows: what was done and where it is known from, each with its own source and
      date. At the bottom, in a gold line — what follows from this for the room, with a direct statement
      that the industry has no identical answer.'
    backup: 'Source — rework/section-1-mcp-part1b.md §A.3.7, §B.27 (part1e.md). Round 5 (issue 225): the
      slide was written anew for the replacement of the case. The previous three cases (Unicode hiding,
      the Deadbugz campaign, the postmark-mcp incident) were taken out of the seminar along with the previous
      case and were not carried over into the new one. The evidence base is research/mcp-kontekst-otkaz.md,
      all four rows VERIFIED against the primary sources, twice: by a fact-checker subagent and then independently
      by the session''s orchestrator through a verbatim substring search over the downloaded page (not
      over the search snippet), accessed 2026-10-07. Row 1: anthropic.com/engineering/code-execution-with-mcp,
      "Nov 04, 2025" (the machine-readable date on the page is 2025-11-04) — "Tool definitions overload
      the context window"; "This reduces the token usage from 150,000 tokens to 2,000 tokens—a time and
      cost saving of 98.7%"; "present MCP servers as code APIs rather than direct tool calls". The example
      in the article is the Google Drive and Salesforce servers, the method of measurement is not disclosed
      on the page, and so on the slide this is called an example from the article, not an industry norm.
      Row 2: docs.claude.com/en/docs/agents-and-tools/tool-use/tool-search-tool — "A typical multiserver
      setup (GitHub, Slack, Sentry, Grafana, and Splunk) can consume ~55k tokens in definitions before
      Claude does any work. Tool search typically reduces this by over 85 percent, loading only the 3–5
      tools Claude needs for a given request"; "Claude''s ability to pick the right tool degrades once
      you exceed 30–50 available tools". In that paragraph of the documentation it says "multiserver setup"
      and the word MCP is absent — which is why the slide lists the servers themselves and does not impute
      the protocol to them. This is also an independent confirmation of the figure of 55,000 that stands
      in the deck on n18 from a different source. Row 3: github.blog "How we''re making GitHub Copilot
      smarter with fewer tools", Anisha Agarwal & Connor Peet, November 19, 2025 — "trims the default
      40 built-in tools down to 13 core ones"; "improve success rates by 2-5 percentage points" (the page''s
      markup has non-breaking spaces, so a direct grep for the string without them returns nothing — checked
      and recorded). The limit of 128 tools per request — code.visualstudio.com/docs/copilot/agents/agent-tools,
      "Cannot have more than 128 tools per request". The pair of figures 190/400 milliseconds from the
      same blog the slide deliberately does NOT take: on the page the acronym TTFT is expanded two different
      ways in one sentence, which is a defect in the primary source. Row 4: manus.im/blog/Context-Engineering-for-AI-Agents-Lessons-from-Building-Manus,
      Yichao ''Peak'' Ji, 2025/7/18 — "We tried that in Manus too. But our experiments suggest a clear
      rule: unless absolutely necessary, avoid dynamically adding or removing tools mid-iteration"; the
      reasons are the invalidation of the KV cache and the model getting confused about earlier steps;
      in its place the section "Mask, Don''t Remove". What was NOT confirmed and is not put on the slide:
      the owner''s formulation that "large companies have started abandoning MCP" — not one primary source
      confirms it, and every team checked keeps its servers; Cloudflare Code Mode explains its own move
      by the distribution of training data, there is not one instance of the words "context window" on
      their page, and they give no figures at all; the --dynamic-toolsets flag of GitHub''s official server
      was deleted in v1.1.0 (see n26); Block/Goose, Shopify, Stripe, Vercel, Sourcegraph — no public statements
      on the topic were found. The details are in research/mcp-kontekst-otkaz.md § "What was NOT confirmed".
      An edit after two delivered classes (issue 225, qa/RAZBOR-PROVEDENIYA.md §A5): in both classes something
      unverified was said aloud — that large companies, named by name, had abandoned MCP en masse — followed
      immediately by a promise to look into how the story ended. The slide stood on verified material
      the whole time, but the refutation lay in the reference material as a general paragraph and did
      not fire when spoken aloud. It is now carried out as a separate direct line at the start of the
      note: "this is how it gets retold — the primary sources do not confirm it — this is what they do
      confirm". There are no names in the refutation, deliberately: there is no primary source on them
      in either direction (research/mcp-kontekst-otkaz.md § "What was NOT confirmed", items 1, 9, 10),
      and naming them would mean arguing with an equally unverifiable formulation. The figures, sources,
      dates and four rows of the visible layer did not change.'
- id: n28
