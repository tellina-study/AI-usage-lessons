- id: n41
  file: slides/n41-sobiraem-tri-hoda-imya-prava-format.md
  type: cobuilding
  duration_min: 1.5
  assertion: Роль собирается в три хода — имя и описание, список инструментов, формат ответа; второй ход
    вычёркивает правку из списка, потому что роли из сцены нужно было только находить проблему
  learning_goal: 'Проектирование вслух: имя/описание решает маршрутизацию, список инструментов — состав
    арсенала независимо от текста инструкции, формат ответа делает вердикты сравнимыми между вызовами.
    Правильную сборку даёт следующий слайд'
  visual:
    pattern: cobuilding_config_reveal
    primary: 'Таблица в три колонки: что решаем · варианты · что меняет выбор. Три строки. Во второй строке
      — полный список инструментов роли, из которого вычёркивается правка: зал отвечает, нужен ли он,
      вычёркивание показано визуально.'
    backup: Источник — section-2-subagent.md §A.1 «Со-сборка» + «Собственный ход раздела», дословно по
      содержанию; section-2-subagent-part1b.md n41 даёт ту же таблицу в связной речи, включая выдержанную
      паузу на вопросе о праве правки. Текст-как-инструкция против списка-как-арсенала — собственный ход
      этого раздела, не формула хука прошлого занятия (она отдана Семинару 5 и не повторяется).
- id: n42
  file: slides/n42-artefakt-fayl-diff-reviewer.md
  type: code_artifact
  duration_min: 1.0
  assertion: 'Собранная роль — один файл: имя и описание с границей применимости, строка tools: Read,
    Grep, Glob без Write и Edit, и поведенческая инструкция формата ответа'
  learning_goal: 'Артефакт разбирается по происхождению и честно помечен как файл для разбора, не клонируемый
    артефакт занятия. Короче всего остального файла — строка tools: — и делает больше всего'
  visual:
    pattern: code_artifact
    primary: 'Четыре пункта списком на светлой подложке — те же четыре части файла, что раньше шли моноширинным
      блоком: имя, описание с границей, строка tools:, тело роли инлайн-кодом внутри обычного текста.
      Снизу — подпись о происхождении: файл для разбора, не артефакт для клонирования.'
    backup: 'Файл — section-2-subagent.md §A.1 «Артефакт», дословно, значения полей не менялись ни на
      знак. Происхождение и статус «не клонируемый артефакт» — ARCHITECTURE.md §A.0 и прямое решение владельца
      «репу забей» (не появляется в демо-репозитории курса). Граница «НЕ для ревью архитектурных решений»
      — предметная область проекта, не курса. Круг 2 владельца (issue 225, правило А4 — «чёрный фон с
      белыми буквами убрать», распространяется на всю деку, не только на названные слайды): рендерер (`deck_kit.terminal_card`,
      `build_sem06.block_drawer`, kind `code`) безусловно красит ЛЮБОЙ ```-блок тёмной карточкой `CODE_BG
      = #161C30`, независимо от содержимого — обхода на уровне разметки нет (тот же дефект, что кейс 3
      блока MCP нашёл и починил на n32, `qa/krug2-mcp-keys3.md`). Починка тем же приёмом: файл роли снят
      с тройных кавычек и подан четырьмя пунктами списка (`numbered_list`, светлая подложка SURFACE) —
      то же содержание, та же дословность значений, другая форма. Открытый вопрос рендерера для «сведения»
      тот же, что назвал кейс 3: пока в деке остаются слайды с кодом в тройных кавычках, они будут тёмными,
      пока их авторы не уберут кавычки тем же приёмом либо рендерер не получит светлый вариант карточки
      для кода.'
- id: n43
  file: slides/n43-rol-tselikom-odnim-ekranom.md
  type: mechanics_map
  duration_min: 2.0
  assertion: 'Роль устроена из шести частей: где объявляется, как её позвать и как увидеть, кого позвали,
    что приходит на вход и что уходит обратно, что значит каждая запись списка прав и чем всё это оплачивается'
  learning_goal: 'Полная картина роли одним экраном — опорный слайд кейса, к которому возвращаются провал
    (состояние 3 блока 5 — запись не резолвится) и критерий. Круг после гейта B (issue 225, замечание
    4 владельца): прежняя версия слайда несла только три факта (вход/выход/права) — те же факты сохранены
    без изменений, добавлены три новых блока, которых раньше не было ни на одном слайде кейса целиком:
    где объявляется роль построчно по полям файла, как её позвать и отличить явный вызов от автовыбора
    моделью, и сводка цены делегирования'
  visual:
    pattern: mechanics_with_figure
    figure: subagent-n43-rol-tselikom.png
    primary: 'Схема на весь слайд, шесть пронумерованных блоков со своей подложкой. Два яруса по два блока:
      1 — где объявляется (настоящий кусок `diff-reviewer.md` светлой карточкой — имя и права дословно,
      не абстрактная подпись поля без значения — плюс две строки, что делают `description:` и тело файла)
      и 2 — как позвать и как увидеть, кого позвали (явно / по описанию / строка в чате). 3 — что приходит
      на вход (системный промпт роли, задача, иерархия инструкций, снимок репозитория — и чего нет) и
      4 — что уходит обратно (только итог, канал в одну сторону). Ниже, во всю ширину — 5: три состояния
      записи `tools:` (не указано → всё; пустой список → ничего, но жива; не резолвится → не запускается).
      Внизу узкой золотой плашкой — 6: чем оплачивается.'
    backup: 'Источник — section-2-subagent.md §A.1 «Артефакт» и «Механика» (блоки 1, 3, 4, 5) + library/seminars/sem-05/research/mechanics-6-subagent.md
      §1.2–1.3 и §4.1 (блок 2 — явный вызов vs автовыбор по description, строка транскрипта `<имя>(<задача>)`,
      «general-purpose вместо ожидаемого имени — маршрутизация не сработала», дословная цитата quickstart-документации)
      и §2.3 (блок 1 — name/description обязательны, остальные поля опциональны). Блок 5, исход «пустой
      список — жива без инструментов»: подтверждено повторной проверкой (issue 225, fact-check round 2,
      2026-10-05) прямым `curl` по `code.claude.com/docs/en/errors`, раздел «Agent would be spawned with
      zero tools» — дословно: «If you leave the tools list empty, or disallowedTools removes every entry
      in it, Claude Code also skips the refusal and launches the subagent without tools» (прежний прогон
      через суммирующий `WebFetch` этого не нашёл — известное ограничение, `notes/mcp-limitations.md`
      `[#225-1]`). Блок 6 — то же число, что на n40 (15×/3–10×, Anthropic), без нового факта, с явной
      отсылкой «подробности и честный пробел — в свидетельствах кейса», не повтор ради повтора. Круг 2
      владельца (issue 225): блок 1 пересобран — та же просьба, что укрупнила одностраничник MCP n08 («показать
      мини-шаблон файла»), применена к роли. Было: пять строк подписей полей без значений (`.claude/agents/<имя>.md`,
      `name:`, `description:`, `tools:`, `тело файла`). Стало: настоящая выдержка из `diff-reviewer.md`
      (n42) в светлой карточке (`code_card`, `rendered/ make_figures_subagent.py`) — три строки с реальными
      значениями (`name: diff-reviewer`, `tools: Read, Grep, Glob`), плюс две оставшиеся строки-подписи
      там, где значение не умещается коротко (`description:`, `тело файла`). Факты не менялись — то же
      содержание, что несла прежняя версия, подано дословной выдержкой вместо абстрактных подписей. Форма
      — по образцу sem-05/slides/n11 «Хук целиком, одним экраном» (полная карта одним экраном, к которой
      возвращаются; визуальный контент живёт в схеме, markdown-тело Visual пустое; номер каждого блока
      — кружок). Бюджет: слайд вырос с 1,5 до 2,0 минуты — рост скомпенсирован сокращением n40/n41/n44
      этого же кейса (qa/krug-vladeltsa-subagent-keys1.md). Палитра — без красного; золото — кружки-номера
      и рамка блока 6, не реже раза на слайде.'
- id: n44
  file: slides/n44-proval-vse-tools-rezolvilis-v-nol.md
  type: failure_vignette
