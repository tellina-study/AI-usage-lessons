  visual:
    pattern: measured_outcome_table
    primary: 'Таблица шести размеров одного и того же файла, с высотой цифры суммы на каждом и исходом
      «сумма верна». На последней строке — чистый слом: 0 из 5. Под таблицей — плашка итога (порог найден,
      но дальше ожидаемого) и честная оговорка про возможное (не измеренное) объяснение запаса прочности.

      '
    backup: 'Числа — из `stend/zamery-k5-k6/README.md`, Замер 4.1 (честный повтор 2026-10-27 после починки
      протечки промта, issue #299 — см. README «Протечка промта обнаружена и исправлена»; прежняя версия
      этого такта держалась на протёкшем прогоне, где промт содержал реальную сумму receipt-01 как «пример
      формата» — старые числа архивированы в `results-k6-resolution-PROTECHKA-2026-10-27.json` и больше
      не источник). Одна и та же состаренная квитанция в шести размерах (чистый ресайз одного файла без
      повторной съёмки), по 5 живых вызовов на каждом из шести размеров, 30 вызовов единым честным прогоном
      (executions 1075–1104, `results-k6-resolution.json`). Высота цифры суммы на полном размере — 49,0
      пикселя, измерено реальным рендером шрифта, не предположено.

      Итог по каждому размеру: исходный (1698×2074) — высота 49,0, верно 5 из 5; половина (849×1037) —
      высота 24,5, верно 5 из 5; четверть (424×518) — высота 12,2, верно 5 из 5; одна восьмая (212×259)
      — высота 6,1, верно 5 из 5; одна шестнадцатая (106×129) — высота 3,1, верно 5 из 5; одна тридцать
      вторая (53×64) — высота 1,5, верно **0 из 5**. Итого 25 из 30.

      На тридцать второй доле все 5 повторов (execution 1100–1104) сходятся на одном и том же неверном
      числе: модель отвечает `1600` вместо истинных `18990`, и поле `raw_text_seen` каждый раз дословно
      совпадает с этим же неверным числом — `1600,00 ₽`, не `18 990,00 ₽`. Не шум — одна и та же уверенная
      неверная догадка пять раз подряд.

      Правдоподобное объяснение, почему запас прочности у суммы настолько больше, чем у даты (жирный моноширинный
      шрифт, вдвое крупнее остальных полей, и короткий устойчивый паттерн «N NNN,00 ₽»), стоит в README
      как НЕ измеренное отдельно — на кадре оно названо прямо как открытый вопрос, не как причина.

      Номера прогонов и идентификаторы исполнений на видимом слое не стоят (БРИФ §2).'
