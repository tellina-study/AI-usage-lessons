#
# Deck-структура Лекции 4 «AI в жизненном цикле разработки ПО (SDLC)» (41 слайд — v4.1: +слайд-фундамент s05, keystone→s06, дивайдеры без тег-плашек).
#
# Source: chapter v4 methodology-first (~34.5k, 5 частей) +
# plan v4-methodology-first §4 (послайдовая карта s01–s41 (v4.1: s05 foundations, s06 keystone-цикл).
# Issue #170 · Branch: hc/lesson4-498d0d8c
#
# ┌─ RE-SPINE (v4, owner redirect #264): ось «фазы SDLC» СОХРАНЕНА, но внутри ──┐
# │ каждой фазы ВЕДЁТ методическая ПРАКТИКА/дисциплина (кто предписывает +      │
# │ почему + человеко-владеемый артефакт). ИНСТРУМЕНТЫ — компактный ВТОРИЧНЫЙ   │
# │ блок «чем делают сегодня» с суждением «устойчивый паттерн / хайп[VFY]».     │
# │ НЕ вендор-каталог. Keystone s06 = цикл ФАЗ лекции (Требования→…→Документация→,           │
# │ артефактов спека→ADR→план→PR→инцидент). Архитектура переписана (#259):      │
# │ необходимость + ADR/fitness/C4. Харнес добавлен (#262). TDD-дисциплина      │
# │ (#263). Синтез-матрица reframed «фаза × практика × человек» (#264).         │
# │ 7 section-dividers: s08(Р1) s12(Р2) s16(Р3) s22(Р4) s25(Р5) s32(Р6) s35(Р7)│
# │ Р0 s01–s08 = открытие (s05 сводка практик, s06 keystone-цикл), без дивайдера.                                       │
# └───────────────────────────────────────────────────────────────────────────┘
#
# ┌─ SPLIT: deck.yaml >600 строк (Document Size Limit, waiver НЕТ) → разбит ──┐
# │ deck.yaml      (ЭТОТ ФАЙЛ) — deck/palette/motif/typography/glossary_lock  │
# │                + ai_failure + slides s01..s21 (через конец Раздела 3).    │
# │ deck-part2.yaml — slides s22..s40 + totals + ai_failure_judgment +        │
# │                verify_day_of_items + fact_check_items.                    │
# │ Loader (rendered build-скрипт) читает ОБЕ части. Кросс-ссылка внизу.      │
# └────────────────────────────────────────────────────────────────────────┘
#
# Phase 5 (структура): deck.yaml + slides/*.md из finalized главы v4; рендер PPTX —
# Phase 6 (следующая фаза). Speaker-notes маркеры [for-slide-sNN] в chapter* (v4.1 сдвиг +1 от s06).

deck:
  lecture_number: 4
  title: "Лекция 4. AI в жизненном цикле разработки ПО (SDLC)"
  audience: "3 курс ИУ6, инженеры-разработчики (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "AI пишет код всё лучше — но что делает AI-разработку надёжной? Не инструмент, а инженерная дисциплина по фазам SDLC: какой человеко-владеемый артефакт и какая проверка нужны на каждой фазе, где методики разных игроков сходятся — и что не делегируется инструменту ни в одной фазе?"
  learning_outcomes: [LO1, LO4, LO7]
  language: ru
  status: draft-for-gate-b
  version: v4.0
  source: "chapter v4 methodology-first (~34.5k, 5 частей)"
  plan: notes/lecture-4-software-review/final/plan-v4-methodology-first.md (v4 §4)
  total_slides: 41          # v4.1: s01–s41; 7 section-dividers s09/s13/s17/s23/s26/s33/s36 (сдвиг +1); s05 foundations, s06 keystone
  curriculum_level: "Module 1, первая отраслевая (после обзорных Л1–Л3); L4 = strict-in ≥30% mandatory, waiver НЕДОСТУПЕН"
  deck_parts: [deck.yaml, deck-part2.yaml]   # split >600 строк; loader reads both
  axis: "методико-first: фаза SDLC × ведущая практика (методика: артефакт + кто предписывает + почему); инструмент — вторичная иллюстрация"

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # Канонические термины — из glossary.yaml (locked chapter v1.1, синхронизировано с re-spine v4).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  # forbidden_anglicisms: пайплайн→конвейер, фоллбэк→запасной вариант,
  # эдж-кейс→краевой случай, инсайт→вывод/наблюдение, деплой→развёртывание.
  - "фаза SDLC (стадия жизненного цикла со своими входом / выходом / артефактом)"
  - "методика vs инструмент (несущая дихотомия v4: методика определяет, инструмент исполняет)"
  - "человеко-владеемый артефакт (материальный результат фазы, за который отвечает человек и который версионируется)"
  - "git-loop дисциплины (цепочка версионируемых артефактов спека→ADR→план→PR→инцидент)"
  - "разрыв восприятия (perception gap — ощущение скорости ↔ измеренный факт)"
  - "лестница автономности (A автодополнение / B мелкие задачи / C кодинг-агент / D оркестратор) — демотированная линза"
  - автодополнение
  - кодинг-агент
  - оркестратор
  - "склонность доверять автомату (automation bias — ложная уверенность)"
  - "существенная vs привнесённая сложность (Brooks: essential / accidental)"
  - "«почти правильный» код"
  - 70%-проблема
  - "spec-driven development (разработка от спецификации)"
  - "интервьюирующий LLM (interrogatory LLM)"
  - "prompt-and-pray (антипаттерн: расплывчатый промпт → невысказанные допущения)"
  - "ADR (Architecture Decision Record — решили X, потому что Y, отвергли Z)"
  - "fitness-функция (автоматическая архитектурная проверка на каждом коммите)"
  - "C4 / архитектура-как-код (машиночитаемое описание архитектуры)"
  - "отравленный контекст (poisoned context — AI копирует плохие примеры кодбазы)"
  - "harness (харнес — детерминированный каркас проверок вокруг недетерминированной модели)"
  - "AGENTS.md (постоянный слой инструкций/конвенций, который агент читает каждую сессию)"
  - "context-engineering (управление контекстом: JIT / компакция / context-rot)"
  - "explore → plan → code → commit (дисциплина цикла работы)"
  - "SWE-bench (Verified публичный / Pro приватный контаминация-устойчивый)"
  - "TDD (разработка через тестирование, тест-первым)"
  - "mutation-тестирование (mutation score — доля убитых искусственных дефектов)"
  - quality-gate
  - "SAST / DAST / SCA / secret-scanning"
  - "supply-chain (цепочка поставок ПО)"
  - "slopsquatting (регистрация воспроизводимо-галлюцинируемого имени пакета)"
  - "prompt injection (инъекция в промпт)"
  - "Lethal Trifecta (доступ к секретам + недоверенный контент + канал утечки)"
  - "risk-triad Böckeler (probability × impact × detectability)"
  - "least-privilege (принцип наименьших привилегий)"
  - "egress-контроль (ограничение, куда агент отправляет данные)"
  - "cognitive debt (когнитивный долг — генерация обгоняет понимание)"
  - "accountability (ответственность, не делегируется ни в одной фазе)"
  - "триангуляция (DORA / GitClear / METR — сходимость независимых методов)"

ai_failure:
  # AI-Failure & Judgment Content Rule (ENFORCED): ≥30% strict-in, waiver НЕДОСТУПЕН для L4.
  # Целиком-in-bucket слайды (провал+урок / лимит / «когда не AI» / сравнение с альтернативой):
  strict_in_slides: [s07, s11, s13, s15, s20, s21, s24, s27, s29, s30, s31, s33, s34, s37, s38, s39]
  count: 16
  share_by_slides: "16/40 = 40% по слайдам (буфер +10 пп над порогом 30%). partial→out (Решение #78): s01 hook, s02 cover, s03 мост, s04 ЦВ, s05 keystone (несущая ось = course-scaffold), s06 демотированная линза A→D, s08/s12/s16/s22/s25/s32/s35 дивайдеры, s09/s10 практика+рекомендации требований (partial-upside), s14 подходы архитектуры (upside), s17/s18/s19 практики реализации (upside), s23 TDD-практика (upside), s26 практика ревью (upside), s28 практика безопасности (upside), s32 дивайдер, s36 матрица (упаковка), s40 мост+Q&A. Кластеры распределены по 7 разделам: s07-Р0 · s11-Р1 · s13/s15-Р2 · s20/s21-Р3 · s24-Р4 · s27/s29/s30/s31-Р5 · s33/s34-Р6 · s37/s38/s39-Р7 — single-artifact concentration отсутствует."

