- id: n43
  file: slides-en/n43-orkestrator-i-dochernie-sessii.md
  type: mechanics_map
  duration_min: 1.5
  assertion: 'Alongside the working session people bring up an orchestrator session, which launches full-blown
    child sessions: you can walk into a child session by hand, and it launches subagents of its own —
    so there come to be three tiers; the cost is the scaffolding, and the fact that the orchestrator learns
    a child''s result only when it goes and checks'
  learning_goal: 'A third move alongside the two already examined. A subagent and a child session answer
    one request — do the pieces at the same time — and diverge on two properties that decide the choice:
    whether you can walk in by hand, and whether you can go one tier further down. The criterion is named
    by the size of the piece, the cost is named in three lines'
  visual:
    pattern: mechanics_table
    figure: subagent-n43-tri-yarusa.png
    primary: 'At the top — a diagram of three tiers: the working session, the orchestrator session, the
      child sessions and the subagents beneath them; the child session is marked as one you can walk into
      by hand, the subagent as one that only sends back a result. Under the diagram — a table in two substantive
      columns: what a child session gives and what it costs. The slide is closed by a criterion line in
      gold: a small piece to a subagent, a large one to a child session. The line about whose practice
      this is lives in the diagram''s caption.'
    backup: 'The source is the course author''s own working practice, told at both of the classes this
      deck was delivered in (transcripts: `qa/rasshifrovki/gruppa-1.txt`, 32:33; `qa/rasshifrovki/gruppa-2.txt`,
      43:34, 52:02-53:36, 55:38). It was not in the materials, and the author said so directly: "didn''t
      put it into this lecture" (group 1, 39:54). Added under section B of the delivery breakdown (`qa/RAZBOR-PROVEDENIYA.md`)
      — the practice test: what gets added off the cuff twice is what the material is missing.

      Verbatim supports. The move itself: "I bring up a session that acts as the orchestrator, and I bring
      up other working sessions for myself as well" (group 1, 32:33). The two advantages over a subagent:
      "you can walk into a child session, first, to look at something or write something, and second,
      it can spawn subagents of its own, so you get a deeper nesting of the hierarchy, and as a result
      you can solve more complex tasks that way" (group 1, 32:33); the same in group 2 — "what I like
      about the parallel-session option is that we build a more complex structure here, one that can solve
      a more complex task" (43:34). The cost: "it needs some minimal scaffolding around it" (group 1,
      31:57), "the main session finds out that the child has done something only when it checks periodically"
      (group 2, 52:52). The criterion: "if the little tasks are small, then subagents; if they''re big,
      then sessions" (group 2, 55:38).

      The three ways of doing the scaffolding were named by him as well (group 2, 52:26-53:36): an off-the-shelf
      control layer; an imitation via the issue tracker (called bad — precisely because the result is
      visible only when you check); a terminal window manager, in whose panes the sessions are brought
      up and which you can walk into. The names of the tools are deliberately not put on the screen: the
      author''s own development was mentioned by him without a name, and the window manager is a detail
      of one configuration that has nothing to do with the fact of three tiers.

      What is not on the screen and why. Figures for "how many sessions to keep" are not brought up here:
      they stand on the next screen together with the configuration they were measured on. The limit of
      a person''s attention, which he named on the spot ("3-5 is enough for me"), is not carried over
      in any form: in the same breath he worked out himself that leaning on "seven plus or minus two"
      is supported by nothing (group 2, 51:22), and introducing a number the author called made up in
      front of the room would be swapping one unsupported support for another. The check is closed (`qa/fact-check-7-plus-minus-2.md`,
      2026-10-10): Miller''s original source is real and the number in it is measured rather than invented,
      but what it measures is something else — the limit of discrimination along a single dimension and
      the span of immediate memory, which Miller himself keeps apart and whose coincidence he calls "a
      pernicious, Pythagorean coincidence"; modern work (Cowan, 2001) gives about four for working memory.
      The decision after the check — **do not bring it in either as a support or as a debunking**: the
      number has nothing to do with the composition of the context or with the boundary of a subagent,
      and the question "how many sessions to keep" is already answered by the material''s own measurement
      of machine memory on the next screen.

      Terminology: the slide was written on "subagent" from the start — the word "role" does not appear
      in it (the renaming across the whole deck is being done by the neighboring session of the same round).'
- id: n44
  file: slides-en/n44-tsena-v-zheleze.md
  type: mechanics_map
  duration_min: 1.0
  assertion: 'Sessions cost machine memory: by the course author''s own measurement, on a cloud VM with
    16 GB the work starts stumbling at twenty concurrent sessions and gives out at thirty to forty — which
    puts the order of magnitude at 1-2 GB per session; the tool''s cap of twenty concurrent subagents
    may be overtaken by the hardware sooner'
  learning_goal: 'The cost of the previous move, named in units that can be checked on your own machine.
    The measurement is presented as one person''s measurement on one configuration with a named baseline
    (16 GB), not as an industry norm: the reader gets an order of magnitude and a way to re-measure it
    for themselves. Two separate caps are kept apart — the concurrency of subagents inside a session,
    and machine memory for sessions'
  visual:
    pattern: mechanics_table
    primary: 'At the top — a line saying whose measurement this is and on what machine. Below — a table
      in two substantive columns: what was measured and what follows from it, three rows. Under the table
      — a short line about the difference made by the language the agent itself is written in. The slide
      is closed by a line in gold: the order of magnitude, which is worth re-measuring for yourself.'
    backup: 'The source is the course author''s measurement on his own machine, named at both of the classes
      this deck was delivered in (transcripts: `qa/rasshifrovki/gruppa-1.txt`, 34:31; `qa/rasshifrovki/gruppa-2.txt`,
      53:36-55:38). Added under section B of the delivery breakdown (`qa/RAZBOR-PROVEDENIYA.md`), item
      2.

      Verbatim supports. The baseline and the threshold: "I''ve got a 16-gig VM in the cloud, at 20 sessions
      it starts feeling unwell" (group 1, 34:31); "I''ve got a VM, my cloud one, it starts somewhere from
      20, and at 30-40, depending on how big they are, it dies" (group 2, 54:03). The per-unit consumption:
      "you need at least 2 gigs per session" (group 1, 34:31), "roughly, very roughly, you have to budget
      somewhere around 1-2 gigs of RAM per session, even when they''re just sitting idle" (group 2, 54:03)
      — the 1-2 GB range was taken into the material as the later and more cautious wording of the same
      measurement, with the caveat "at rest". The surprise: "you''d think it''s a thin client that just
      shuttles text back and forth... it''s too early for us to give up good laptops with good memory"
      (group 1, 34:58).

      The agent''s language: "one''s sort of written in JS, the other... one of them is written in Rust,
      and it''s like 10 times lighter" (group 2, 54:42). The multiple is NOT put on the screen: in the
      same sentence the author was getting confused about which of the two tools was written in which
      language, and he named the multiple by eye. The screen says "noticeably lighter", and the notes
      say outright that the multiple was named by eye and the units were not recorded. The names of the
      two tools are not given for the same reason. [FACT-CHECK: which language each of the common agent
      clients is written in, and what the real gap in memory is — NOT brought into the material; bringing
      it in requires a measurement, not an impression]

      The baseline for the figures (CLAUDE.md, § "Baseline / Counterfactual Mandate"): the 16 GB is named
      outright, and the 1-2 GB range agrees with it — 16 / 20 ≈ 0.8 GB per session at the lower threshold.
      The counterfactual is named in the notes: one or two sessions on a machine like that create no expense
      at all, the cost only appears at a dozen.

      Keeping the two caps apart is this round''s own finding, not the author''s words: the cap of twenty
      concurrent subagents (`n42`, the environment variable) applies to concurrency INSIDE one session,
      whereas the 1-2 GB applies to the number of SESSIONS themselves. The coincidence of both numbers
      at twenty is accidental, and that needs saying, or the reader will add two different caps into one.

      Terminology: the slide was written on "subagent", the word "role" does not appear in it.

      Literary editing (issue 225, qa/pravki-nahodok-svedeniya.md item 5): the headline "The cost in hardware"
      was a nominal phrase among headlines that state things and headlines that set scenes. It became
      "Sessions cost machine memory" — the same thing the slide''s `assertion` says in its very first
      clause. The number twenty is deliberately NOT put in the headline: two slides earlier, on `n42`,
      twenty means a different cap, and this very slide keeps the two caps apart in a direct line — a
      headline repeating the number would fold them back together. The content, the table, the caveats
      and the open `[FACT-CHECK]` above are untouched. The slide''s file name is left as it was: by the
      seminar canon (§1) the file, the manifest and the frontmatter agree by numbers and minutes, not
      by the wording of the headline.'
