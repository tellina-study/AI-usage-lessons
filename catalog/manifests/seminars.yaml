# Seminar catalog manifest
# Synchronised with catalog/manifests/course.yaml (single source of truth).
# 17 seminars: 14 предметных + 3 контрольных (S8, S12, S17 — Рубежные контроли 1/2/3).
# S1-S8 (модуль M1) наполнены в Phase 2 pack 1 (issue #51).
# S9-S17 пока placeholder ("TBD" / []) — наполняются в Phase 2 pack 2 и 3.
seminars:
  - number: 1
    title: "Чек-лист «Какой тип AI выбрать»: 4 вопроса инженера ИУ6"
    type: предметный
    module: M1
    related_lecture: 1
    summary: >-
      Применяем чек-лист 4 вопросов из лекции 1 (повторяемость / диалог /
      внешние инструменты / готовое приложение) к четырём «живым» инженерным
      задачам. Малые группы по 3-4 человека выбирают архетип
      (модель / чат / агент / приложение), обосновывают на доске, преподаватель
      разбирает 2-3 ответа публично. В финале — короткий опрос-рефлексия
      «какой тип AI вы используете НЕ по делу» как мост к лекции 2.
    learning_outcomes: [LO1, LO4, LO6]
    format: групповой_анализ+опрос_дискуссия
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 2
    title: "Почему промпт работает: разбор через токены, контекст и attention"
    type: предметный
    module: M1
    related_lecture: 2
    summary: >-
      Берём 6 готовых промптов (3 рабочих, 3 ломающихся) и строим объяснение
      ПОЧЕМУ — на уровне токенизации, длины контекста, температуры, эффекта
      «AI не считает буквы». Демонстрация в браузере (tokenizer-визуализатор,
      температура), студенты в парах предсказывают поведение модели до
      запуска. Цель — связать архитектурные знания с инженерным решением
      «как переписать промпт, чтобы он не ломался».
    learning_outcomes: [LO1, LO6, LO7]
    format: разбор+демо
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 3
    title: "Архитектурный выбор: чат, агент, RAG или API — разбор трёх кейсов"
    type: предметный
    module: M1
    related_lecture: 3
    summary: >-
      Команды получают три инженерных задачи (поиск ответа в 200 PDF /
      бот техподдержки на корпоративной базе / разовый аналитический отчёт)
      и за 25 мин выбирают архитектуру (чат / агент / RAG / fine-tune / API),
      обосновывают по 4 критериям: контроль, стоимость, шаги, инструменты.
      Защита решений у доски (5 мин на команду), преподаватель «ломает»
      слабые обоснования вопросами. Финальный разбор — типичные ошибки
      выбора архитектуры (overengineering агентом там, где хватает чата).
    learning_outcomes: [LO7, LO4]
    format: кейс+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 4
    title: "AI в цикле разработки ПО: Copilot vs Cursor vs coding-agent"
    type: предметный
    module: M1
    related_lecture: 4
    summary: >-
      Преподаватель показывает одну и ту же задачу разработки (написать
      и протестировать функцию) тремя способами: IDE-автодополнение
      (Copilot), AI-чат в IDE (Cursor) и coding agent (Claude Code).
      Студенты в группах оценивают по чек-листу (контроль, скорость,
      детерминизм, доверие к коду). Дискуссия по статистике 84% / 46%
      «использую vs не доверяю» — где доверие оправдано инженерно,
      а где это лень или культ карго. Итог — личный профиль использования
      AI в учебных проектах студента.
    learning_outcomes: [LO1, LO4, LO7]
    format: демо+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 5
    title: "Fact-checking AI на финансовых данных: проверка 5 заявлений"
    type: предметный
    module: M1
    related_lecture: 5
    summary: >-
      Мини-практика по fact-checking: каждой команде выдаются 5 «утверждений
      о AI в банках/ритейле РФ» (часть верные, часть галлюцинации, часть
      устаревшие данные 2022-2023). За 30 мин команды проверяют каждое
      по первоисточникам (Банк России, отчёты банков, ВЦИОМ), маркируют
      «верно / частично / ложь», объясняют, как именно AI ошибся (галлюцинация
      / устаревший факт / правильно понятые цифры в неверном контексте).
      Разбор — антипаттерн «AI знает всё» на конкретных примерах из домена
      студентов.
    learning_outcomes: [LO1, LO2, LO3, LO6]
    format: мини_практика+разбор
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 6
    title: "Генеративный дизайн и цена ошибки: разбор инженерных кейсов"
    type: предметный
    module: M1
    related_lecture: 6
    summary: >-
      Разбираем три кейса генеративного дизайна и AI-расчётов: один
      успешный (топологическая оптимизация кронштейна Airbus A320),
      один с дорогой ошибкой (Mars Climate Orbiter — единицы измерения),
      один спорный (AI-предложение нагрузки без верификации FEA).
      В малых группах студенты определяют: какие проверки инженер ИУ6
      обязан сделать ДО выпуска чертежа, где AI допустим, где
      обязателен пересчёт человеком. Финал — мини-чек-лист «что
      проверять в выходе генеративной модели для машиностроения».
    learning_outcomes: [LO1, LO2, LO7]
    format: кейс+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 7
    title: "AI-диагностика: sensitivity, specificity и вопрос ответственности"
    type: предметный
    module: M1
    related_lecture: 7
    summary: >-
      Кейс mosmed.ai: студентам выдаются исходные метрики
      (sensitivity / specificity / PPV / NPV) AI-системы скрининга
      и три клинических сценария. Команды считают, сколько ложно-положительных
      и ложно-отрицательных будет на 10 000 пациентов и обосновывают,
      допустима ли система. Вторая часть — этическая дискуссия по схеме
      «если AI ошибся — кто несёт ответственность: разработчик / врач /
      больница / регулятор?» с привязкой к FDA AI/ML framework и кейсу
      DSP-1181. Студенты публично формулируют свою позицию.
    learning_outcomes: [LO1, LO2, LO3, LO8]
    format: кейс+опрос_дискуссия
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 8
    title: "Разбор L8 (креатив, авторское право) и Рубежный контроль 1"
    type: контрольный
    module: M1
    related_lecture: 8
    summary: >-
      Семинар-водораздел модуля M1. Первые 30 мин — разбор кейсов из
      лекции 8: правовой статус AI-контента в РФ vs ЕС vs США, спор
      Stability AI vs Getty, дипфейки и атрибуция. Оставшиеся 45 мин —
      Рубежный контроль 1: тест из 15 вопросов по LO1-LO8 модуля
      (классификация AI / выбор архитектуры / fact-checking /
      этика / границы) + один кейс на письменный анализ по чек-листу.
      Цель — зафиксировать, что студент способен применять знания M1,
      а не только узнавать их.
    learning_outcomes: [LO1, LO2, LO3, LO4, LO5, LO6, LO7, LO8]
    format: разбор+контроль
    duration_min: 75
    duration_ahours: 2
    rubezhnyi_control: 1
    status: draft
    updated_at: "2026-04-29"

