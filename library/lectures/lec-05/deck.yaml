    duration_min: 2
    assertion: "Zillow: distribution shift × необратимое авто-действие без circuit-breaker = потеря направления; Opendoor выжил на том же типе ИИ — решает не модель, а обвязка"
    learning_goal: "Эталон failure-слайда: payoff hook; distribution shift+асимметрия с нуля; Knight callback; критерий+альтернатива (ЦВ-возврат 1)"
    learning_outcomes: [LO2, LO6]
    chapter_ref: "§1.5 [for-slide-s09]"
    references: [cbs-zillow-2021, ssrn-4121706, sec-knight-2013]
