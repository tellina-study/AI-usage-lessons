      зал действительно говорит вслух на n39 («прочитает быстрее»), и проверка опровергает именно это.
      (2) Добавлен блок «К себе» — правило П5, единственный такой вопрос в блоке субагента. Форма разведена
      с двумя вопросами «к себе» блока MCP (n15 и n21): там зал пересчитывает своё текущее окружение («сколько
      серверов подключено», «когда видели имя в выводе»), здесь — вспоминает задачу («назовите вопрос,
      ответ на который — одна строка»). Вопрос поставлен ПОСЛЕ поворота намеренно: зал прикладывает к
      себе уже проверенный критерий, а не догадку.'
- id: n44
  file: slides/n44-divider-tri-pravki-odna-ochered.md
  type: section_divider
  duration_min: 0.5
  assertion: Три независимых правки ждут проверки одна за другой, и очевидный ход — запустить их разом;
    знак вопроса здесь настоящий, потому что через неделю тот же ход обойдётся нашему разработчику дороже,
    чем сэкономил
  learning_goal: 'Развилка кейса о параллелизме. Форма — вопрос, на который зал уже знает «очевидный»
    ответ: развилка обещает поворот, а не процедуру (пересмотр по сторителлингу, причина 1). Смысловая
    строка заранее держит вторую половину кейса, где тот же ход подводит, — и этим две половины кейса
    читаются как одна история, а не как кейс плюс граница'
  visual:
    pattern: section_divider_macro
    primary: Тёмный Ocean-фон, заголовок-вопрос в одну-две строки, золотая линия под ним. Ниже — смысловая
      строка. Внизу — дорожка кейсов этой ступени, активная отметка — вторая.
    backup: 'Кейс заведён кругом 3 владельца (issue 225, ZADANIE-KRUG-3-SUBAGENT.md, кейс 2): параллелизм
      как причина заводить роль, а прежний кейс «вторая роль, границы путаются» — границей этого. Тег
      не ставится (правило А6). Пересмотр по сторителлингу (PERESMOTR-STORITELLING.md, П1 + П3 + П4):
      прежний заголовок «Несколько независимых задач стоят в очереди друг за другом» был первой из шести
      одинаковых формул «решаем, что делать, когда…». Форма разведена с соседями: кейс 1 блока MCP взял
      реплику (n06), кейс 2 блока MCP — строку-факт (n18); здесь — вопрос с настоящим знаком вопроса.
      Название по-прежнему от наблюдаемой проблемы (правило А2): три правки в одной очереди. Слово «роль»
      в заголовок не вынесено — решение на развилке не называется. КАСКАД: ячейка карты n05 («Несколько
      независимых задач стоят в очереди друг за другом. Решаем.») сверена знак в знак с прежним заголовком
      и теперь расходится с ним — сведению перечитать, как уже расходятся ячейки n06 и n18.'
- id: n45
  file: slides/n45-stsena-chetverg-tri-proverki-razom.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'В четверг разработчик запускает три проверки одним действием вместо трёх ожиданий подряд,
    итоги приходят примерно тогда же, когда пришёл бы один, — и урок он снимает такой: больше ролей, быстрее
    работа'
  learning_goal: 'Первый акт истории кейса: приём срабатывает, человек доволен и снимает с удачи неверный
    урок — считает исполнителей и не записывает условие. Этот урок произносится на экране вслух, потому
    что через два слайда тот же человек применит его не туда, и цена будет его'
  visual:
    pattern: problem_scenario
    primary: 'Два ряда: «было» — три прямоугольника подряд со стрелкой «ждём» между ними; «стало» — три
      прямоугольника в один ряд без ожидания между ними. Под рядами — плашка с выводом, который разработчик
      снял для себя.'
    backup: 'Фактура (диф-ревьюер, три независимых изменения формы) — та же, что стояла в сцене прежнего
      кейса о достоверности отчёта (section-2-subagent-otchet.md); круг 3 владельца требует сохранить
      её, переосмыслив роль с фона сбоя в причину выгоды. Числа времени не называются — только порядок
      (было последовательно, стало одновременно); точная цифра ожидания не измерялась ни на одном источнике
      этой ступени. Пересмотр по сторителлингу (П2): сцена была состоянием дел; стала датированным эпизодом
      одного человека — того же разработчика, который заводил хук и скилл на прошлых занятиях. Добавлена
      одна строка, которой раньше не было, — урок, который он снял с удачи: «больше ролей — быстрее».
      Она здесь завязка, и она же через два слайда стоит ему недели.'
- id: n46
  file: slides/n46-vopros-chto-beryom-v-privychku.md
  type: reflection_question
  duration_min: 0.75
  assertion: Приём сработал — решаем, что из него стоит взять в привычку, и заодно отвечаем себе, что
    именно дало выигрыш
  learning_goal: 'Вопрос классу без подсказки целевого ответа. Четыре карточки, одна из них — целевая
    без оговорок: сначала проверить независимость, потом запускать параллельно по роли на задачу, одним
    шагом. Второй вопрос, заданный устно вместе с первым, — что именно дало выигрыш: три роли или три
    независимых задачи. Он подводит к повороту разбора и не подсказывает карточку'
  visual:
    pattern: question_with_option_cards
    primary: Золотая коробка по центру с дословным вопросом, надзаголовок «· ВОПРОС», подпись «разбор
      — на следующем слайде». Четыре карточки равной ширины внизу, ни одна не подсвечена.
    backup: 'Слайд заведён кругом 3 владельца (issue 225). Вторая прожарка (студент-симулятор): карточки
      «параллельно по роли» и «сначала проверить зависимость» были разделены — целевой ответ на деле был
      их связкой, и честного одиночного выбора не было. Карточки сведены в одну целевую; было пять, стало
      четыре. Пересмотр по сторителлингу (П1): состав четырёх карточек защищён и не тронут ни на знак,
      шесть голосований занятия тоже (CUT-ORDER.md). Изменена только формулировка вопроса: он опирается
      на слово «сработало» из сцены, и к нему устно добавлен второй вопрос — что именно дало выигрыш.
      Второй вопрос карточку не подсказывает: обе половины («три роли» и «три независимых задачи») звучат
      одинаково правдоподобно, пока разбор не разведёт их.'
- id: n47
  file: slides/n47-razbor-parallelnost-lezhit-v-zadache.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Выигрыш в четверг дала независимость трёх задач — роли её только забрали; параллельность
    лежит в задаче, и роли берут её там, где она есть, и умножают ошибку там, где её нет
  learning_goal: 'Поворот кейса, названный поворотом. Интуиция зала (и урок, который герой снял в четверг)
    считает исполнителей: больше ролей — быстрее и надёжнее. Разбор переносит причину выигрыша с числа
    исполнителей на свойство задачи и этим заранее объясняет, почему через два слайда тот же приём подведёт.
    Форма А5 — две содержательные колонки'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица четырёх строк в две содержательные колонки: что делает / что не делает — ограничение.
      Под таблицей — плашка поворота, золотом: причина выигрыша переносится с числа ролей на свойство
      задачи.'
    backup: 'Слайд заведён кругом 3 владельца (issue 225). Вторая прожарка (студент-симулятор): прежние
      карточки «отдельный вызов роли на каждую задачу параллельно» и «сначала проверить зависимость» были
      разделены; строки сведены в одну целевую, было пять, стало четыре. Пересмотр по сторителлингу (П1):
      состав и смысл четырёх строк не тронуты, текст ячеек подрезан. Заголовок был «Параллельно — только
      когда независимо» — формулировка верная, но читавшаяся как процедура. Стал самим поворотом. Вывод
      под таблицей переписан: он больше не пересказывает целевую карточку, а называет, что именно сработало
      в четверг, и этим держит вторую половину кейса. Числа 17,2 и 4,4 сюда НЕ подняты намеренно — они
      стоят на n51 и n53, где названы источник и условие измерения; здесь на них только указано вперёд.'
- id: n48
  file: slides/n48-mekhanika-fon-i-predel-roley.md
  type: mechanics_map
  duration_min: 0.75
  assertion: 'Параллельный запуск — механика харнесса, не ручная настройка: роли уходят в фон и работают
    одновременно друг с другом и с основной сессией; предел — двадцать одновременно работающих ролей по
    умолчанию, не на общее число ролей за сессию'
  learning_goal: 'Опора под поворот: одновременность берётся из харнесса, настраивать её не нужно — значит,
    вся работа решения приходится на первый шаг, на проверку независимости. Конкретный, проверяемый факт
    механики, не абстракция'
  visual:
    pattern: mechanics_table
    primary: 'Короткий блок: «роли уходят в фон, работают одновременно» и «предел — 20 одновременно работающих,
      не на всю сессию». Нижняя строка — переменная окружения, которой предел меняется.'
    backup: 'Источник — research/mechanics-6-subagent.md §1.5, дословно по содержанию: fork mode включён
      по умолчанию в интерактивной сессии с версии 2.1.232; «Claude Code runs the subagent in the background...
      and Claude can''t ask for the foreground»; concurrent limit по умолчанию 20 (CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS,
      ошибка «Concurrent subagent limit reached» на 21-й); общего предела на число ролей за всю сессию
      нет — только на одновременно работающие. Круг 3 владельца (issue 225): новый материал для деки.
      Пересмотр по сторителлингу (П6): экран не тронут, факты и числа те же; речь подрезана и привязана
      к повороту предыдущего слайда — механика бесплатна, поэтому вся цена решения лежит на проверке независимости.'
- id: n49
  file: slides/n49-stsena-cherez-nedelyu-drugaya-zadacha.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'Через неделю разработчик применяет урок четверга к одной крупной правке: зовёт второго проверяющего,
    получает два честных PASS — и собранная из них картина «правка проверена» не описывает ничего, потому
    что между зонами двух ролей остался промежуток'
  learning_goal: 'Второй акт истории: тот же человек повторяет число исполнителей на задаче, под которой
    больше нет условия независимости. Поворот предыдущего слайда проверяется на нём же — задача была одна,
    и роли её не распараллелили, а разрезали. Фактура сцены (диф-ревьюер, тестировщик, два PASS, пробел
    перед доменом) не менялась'
  visual:
    pattern: problem_scenario
    primary: 'Два прямоугольника зоны ответственности рядом — диф-ревьюер (код) и тестировщик (поведение
      формы), между ними — узкая зона без подписи владельца. Внизу — сценарий: email с пробелом перед
      доменом, который не попал ни в одну из двух зон.'
    backup: 'Источник — section-2-subagent.md §A.3 «Сцена», section-2-subagent-part1c.md n49; фактура
      дословно. Круг 3 владельца (issue 225): прежний отдельный кейс о второй роли стал границей кейса
      о параллелизме. Пересмотр по сторителлингу (П2 + П4): сцена привязана к тому же человеку и к той
      же неделе — она теперь второй акт одной истории, а не вторая сцена двух разных. Названо, что именно
      он повторил: число ролей без условия под ним. Названо, что он из двух честных ответов собрал: картину
      «правка проверена», которой не соответствует ничего. Факты, формулировки PASS и сценарий с пробелом
      перед доменом не тронуты.'
- id: n50
  file: slides/n50-razbor-pyat-variantov-dlya-promezhutka.md
  type: answer_breakdown
  duration_min: 1.25
  assertion: Из пяти вариантов работает один — явно расписанная граница каждой роли, в обе стороны; третья
    роль-координатор добавляет цену быстрее, чем снижает риск, а объединение в одну роль возвращает к
    широкому доступу, от которого ступень уже отказалась
  learning_goal: 'Разбор идёт прямо, без отдельного слайда-вопроса: главное голосование кейса уже прошло.
    Рабочий вариант работает тем же, чем работал приём четверга, — он называет условие вслух, а не добавляет
    исполнителя. Форма А5 — две содержательные колонки'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает / что не делает — ограничение.
      Вывод — отдельной строкой под таблицей.'
    backup: 'Источник — section-2-subagent.md §A.3 «Разбор» + «Вывод», section-2-subagent-part1c.md n50;
      состав пяти строк и их смысл не менялись. Отдельный слайд-вопрос с карточками снят кругом 3 владельца:
      голосование по этому же материалу уже прошло на n46. Пересмотр по сторителлингу (П4 + П6): заголовок
      был построен на отрицании двух вариантов и читался раньше самого разбора; стал прямым. Текст ячеек
      подрезан, вывод переписан так, что он держит поворот кейса: рабочий вариант называет условие, а
      не добавляет исполнителя. Речь перестала пересказывать таблицу вслух — слот сокращён с 1,50 до 1,25,
      четверть минуты отдана в резерв занятия.'
- id: n51
  file: slides/n51-svidetelstva-masshtab-ne-edinichnyy-sluchay.md
  type: research_evidence
  duration_min: 1.5
  assertion: У диф-ревьюера и тестировщика из прошлой сцены нет третьей роли, которая сверяла бы их согласованность
    — а по измерению на 1600+ трассах мультиагентных систем рассогласование между агентами держит 37%
    провалов, почти вровень со спецификацией самой задачи
  learning_goal: 'Масштаб, не единичный случай: доказательная база этой границы — исследования, не демонстрация
    на машине студента. Слайд стоит на минуте низкой энергии занятия — заголовок и первая строка сразу
    называют наши две роли, не абстрактный процент; явная осторожность с эффектной цифрой «79%» уходит
    в заметки, не висит отдельной плашкой на экране. Честный пробел называется прямо'
  visual:
    pattern: evidence_table_with_gap
    primary: 'Короткая плашка сверху, ДО таблицы: диф-ревьюер и тестировщик работают без третьей роли,
      сверяющей их согласованность — вот к чему таблица ниже. Таблица двух строк в три колонки: источник
      · тезис · сила доказательства, библиография сжата до автора и arXiv-номера. Под таблицей — одна
      плашка честного пробела; предостережение про «79%» уходит в заметки докладчика, на экране не висит
      второй плашкой.'
    backup: 'Источник — section-2-subagent.md §A.3 «Свидетельства» + «Осторожность со счётом» + «Честный
      пробел», section-2-subagent-part1c.md n50, по содержанию дословно; числа не менялись (круг 3 владельца,
      issue 225 — материал переносится без изменения формулировок и источников). Атрибуция «Kim, Gu, Park
      и др.» — исправление fact-check round 2 (2026-10-05), сохранено как есть. Вторая прожарка (issue
      225, студент-симулятор): слайд стоит на минуте ≈64–65, самой уязвимой точке занятия по вниманию,
      и нёс абстрактные проценты первым, привязку к нашим двум ролям — третьей плашкой внизу мелким шрифтом.
      Три стопки под таблицей (роли / осторожность со счётом / честный пробел) перегружали именно ту точку,
      где плотность следовало снижать. Правка: привязка к ролям вынесена В ЗАГОЛОВОК И НАЧАЛО слайда (assertion
      + плашка перед таблицей, не после), «осторожность со счётом» снята с видимого слоя в заметки докладчика
      (предостережение произносится устно, не держит отдельную рамку на экране) — с трёх видимых блоков
      после таблицы до одного. Числа и факты не менялись, только порядок подачи и число видимых блоков.
      Пересмотр по сторителлингу (П6): экран не тронут ни на знак — числа, источники, плашка привязки
      к двум ролям и честный пробел те же. Речь подрезана (205 слов → 170) и на одну фразу привязана к
      повороту кейса: зависимость шагов стоит дороже, чем параллельность экономит. Предостережение про
      «79%» переведено из речи в справку целиком — произносится по месту, слот не занимает.'
- id: n52
  file: slides/n52-mekhanika-edinstvennyy-priyom-granitsa.md
  type: mechanics_map
  duration_min: 0.75
  assertion: Промежуток между ролями закрывает явная граница в описании каждой роли, в обе стороны; диф-ревьюер
    уже так делает, тестировщику нужна симметричная строка
  learning_goal: Единственный рабочий приём этой границы, показанный на двух реальных ролях сцены, не
    абстрактно. Граница делает промежуток видимым тому, кто читает оба описания рядом — не устраняет сам
    промежуток
  visual:
    pattern: mechanics_with_figure
    figure: subagent-n52-granitsa-dvukh-rolei.png
    primary: 'Схема: два прямоугольника зоны ответственности — диф-ревьюер (код) и тестировщик (поведение
