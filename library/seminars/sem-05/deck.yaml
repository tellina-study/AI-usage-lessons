    backup: 'Круг 4: слайд переехал ПОСЛЕ разбора n60 (правило А1 — между вопросом и разбором не стоит
      ничего). Роль изменилась вместе с местом: до круга 4 он давал материал для размышления перед ответом,
      теперь подтверждает уже принятое решение, поэтому третья колонка названа «какой шаг подтверждает»,
      а не «к какому шагу ведёт». Два корпуса разведены СТРУКТУРНО, по требованию прожарки круга 3: вместо
      одной таблицы с оговоркой под ней — две таблицы, и шапка каждой называет свой обход и свой размер
      корпуса. Прежняя оговорка «два обхода — не один» на слайде была, но прожарка её не прочитала как
      достаточную, и это справедливо: различие жило в примечании, а не в разметке. Слот 1,50 → 1,25: разведение
      по таблицам короче, чем объяснение словами, а четверть минуты нужна n61. Числа: 33,9→50,5 и 6,2/12
