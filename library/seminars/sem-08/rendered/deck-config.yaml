# Что у Семинара 8 своё. Код сборщика — общий, в `tools/seminar-build/`.
#
# Правило, которое этот файл обслуживает (канон `tools/presentation-build/
# seminar-deck-kit.md`): дека собирается из ИМЕНОВАННОЙ БИБЛИОТЕКИ ПРИЁМОВ, и
# приём выбирается по полю `visual.pattern` слайда — ниже, в `genres`.
# Решение по каждому новому имени приёма пишет сам автор слайда, в поле
# `backup:` его фронтматтера; здесь только сводка соответствий.
#
# Взято за образец у `library/seminars/sem-07/rendered/deck-config.yaml` и
# переписано под сетку С8 (BRIEF-PROIZVODSTVO.md §4): 51 слайд (вторая волна,
# применение канона proektirovanie-keysa-i-voprosa.md), четыре кейса + Zillow
# вне дорожки кейсов.

seminar: "08"
issue: 274

langs:
  ru:
    slides: slides
    deck: deck.yaml
    out: sem-08.pptx
    # Имена блоков занятия — ими подписана дорожная карта на дивайдерах.
    blocks: [Введение, Ось, Кейсы, Закрытие]
  en:
    # Bilingual Production Rule (CLAUDE.md, issue #172): EN track, добавлен
    # 2026-10-20 (issue #274). Прозаическая шапка — из отдельного файла
    # (кириллицу в EN-артефакт переносить нельзя), см. `head_file` ниже.
    slides: slides-en
    deck: deck.en.yaml
    out: sem-08-en.pptx
    head: head.en.yaml
    blocks: [Introduction, Axis, Cases, Closing]

# Границы блоков: [от, до, индекс блока, индекс ступени или null].
#
# Границы задаются НОМЕРОМ ИЗ ИДЕНТИФИКАТОРА слайда, а не его порядковой
# позицией в деке: `D.where(sid)` сравнивает `lo <= D.num(sid) <= hi`, а
# `D.num` читает число из имени (`n52a` → 52). Поэтому буквенные хвосты
# (n11a, n14a, n22a, n23a, n30a, n30b, n34a, n34b, n49a, n50a, n52a) границ
# не сдвигают — они попадают в блок своего числа.
#
# 67 слайдов (волна 0 «конфетки», 2026-10-22): введение n01–n03, ось n04,
# кейсы+Zillow n05–n54, закрытие n55–n57.
#
# ПОЧИНЕНО волной 0 (issue #292): строки стояли `[5, 50, …]` и `[51, 53, …]`
# от третьей волны, когда деки было 53 слайда и закрытие действительно
# занимало n51–n53. После вставок Кейса 4 закрытие переехало на n55–n57, а
# прежние границы относили к «Закрытию» n51/n52/n52a/n53 — экраны самого
# Кейса 4, — и оставляли n54–n57 ВНЕ любого блока: `where()` возвращал им
# пустой раздел, а карта слайдов теряла четыре последних слайда целиком.
razmetka:
  n:
    rows:
      - [1, 3, 0, null]
      - [4, 4, 1, null]
      - [5, 54, 2, 0]
      - [55, 57, 3, null]
    stages: [2]

# Дорожка кейсов на лёгком дивайдере: рисуется по этому списку, названия —
# по функции (канон §1), не по тезису. Zillow (n39) НЕ входит — концептуальный
# разбавитель вне дорожки кейсов (ARCHITECTURE.md §6), его дивайдер собран
# другим приёмом (section_divider_macro), не case_divider_quote.
case_track: [Уведомления, Проверка на повтор, Одобрение возврата, Карточка в Telegram]
case_idx:
  n05: 0
  n17: 1
  n27: 2
  n45: 3
  # Ключи — ТОЧНЫЕ id дивайдеров кейса: `D.case_idx().get(sid)` ищет по
  # совпадению строки, и ключ, отставший от перенумерации, молча лишает
  # дивайдер дорожки кейсов (`K.roadmap` не вызывается вовсе).
  #
  # ПОЧИНЕНО полностью волной 0 «конфетки» (issue #292): к этому моменту
  # стале оставались `n15` (фактический дивайдер Кейса 2 — `n17-k2-divider.md`)
  # и `n43` (Кейса 4 — `n45-k4-divider.md`); их дивайдеры собирались без
  # дорожки. Ключ `n27` (стоял `n25`) был починен раньше, в issue #274.
  # Теперь все четыре ключа совпадают с именами файлов, и дорожка кейсов
  # рисуется на всех четырёх дивайдерах — n05, n17, n27, n45.

# `visual.pattern` → жанр из библиотеки приёмов (`tools/seminar-build/
# genres.py`). Имя, которого здесь нет, рисуется жанром `content` — и это
# нормальный, самый частый случай.
genres:
  hero_cover: cover_centered
  # ВОЛНА 2а «конфетки» (issue #292, план §4.4): Zillow (n39) собирается не
  # развилкой РАЗДЕЛА, а экраном-сценой макро-разбора. Причина — не вкус:
  # развилка раздела несёт сквозной золотой номерной значок («1» на экране,
  # обещавший зал первый раздел из нескольких, которого нет — Zillow стоит
  # вне дорожки кейсов, ARCHITECTURE.md §6) и умеет рисовать только заголовок
  # со смысловой строкой, из-за чего три числа разбора уезжали в ту же
  # курсивную стену и выходили за нижний край. `macro_scene` рисует цитату с
  # подписью, ряд числовых плашек и строку-мост. Имя ПРИЁМА не менялось —
  # поменялся жанр, которым дека его рисует; у Семинаров 6 и 7 то же имя
  # по-прежнему указывает на `divider`.
  section_divider_macro: macro_scene
  case_divider_quote: case_divider
  # Такт-выплата Кейса 3 (n31a, план §4.5): ряд крупных чисел и одна строка
  # под ним, больше ничего.
  metric_band_reveal: metric_band
  question_with_option_cards: question
  reflection_question: question
  guess_the_number: question
  recap_table: axis_table
  keystone_axis: axis_table
  taxonomy_compare_table: content
  criteria_checklist_and_boundary: criteria
  base_and_edge: base_edge
  outcome_artifact: closing
  # `bridge_forward` СНЯТ с жанра `closing` волной 2б «конфетки» (issue #292,
  # план §4.13). Жанр `closing` устроен так: ПЕРВАЯ цитата слайда становится
  # золотым боксом вопроса, а схема встаёт СРАЗУ ПОД НИМ, — это приём «вопрос
  # открытия, заданный второй раз». У n57 вопроса открытия нет: его первая
  # цитата — опись следующего занятия («Семинар 9: условие против
  # переключателя…»). Пока у слайда не было фигуры, разница не читалась;
  # с появлением схемы-развилки она стала видна сразу и замерена: опись
  # уехала наверх золотым боксом и забрала высоту, схеме осталось 3,20″ из
  # 4,30″ — 64% ширины полосы и предупреждение `СХЕМА ЗАЖАТА [n57]`.
  #
  # Без записи приём собирается жанром по умолчанию (`content`): схема
  # первой, во всю отведённую высоту, опись — планкой под ней. Ровно так же
  # собран `bridge_forward` Семинара 7 (его `deck-config.yaml` этот приём
  # тоже не называет), то есть это возврат к общему поведению, а не местное
  # отклонение. `outcome_artifact` (n56) на `closing` остаётся: там первая
  # цитата — настоящий вопрос, и фигуры у слайда нет.

# Роль блока-цитаты ПО УМОЛЧАНИЮ для этого приёма. Запись нужна только там,
# где умолчание (`formula`) неверно, или наоборот — где текст вопроса не
# означает вопроса залу.
pattern_role:
  question_with_option_cards: question
  reflection_question: question
  guess_the_number: question
  answer_breakdown_table: formula
  answer_breakdown_schema: formula
  criteria_checklist_and_boundary: formula
  base_and_edge: fact
  recap_table: fact
  keystone_axis: fact
  # Строка под полосой плашек на n31a — наблюдение, не вывод-формула:
  # золото на этом экране уже занято плашкой «9 из 101» (§3.8 плана).
  metric_band_reveal: fact

# ── Вид приёмов этой деки ───────────────────────────────────────────────────
#
# ВОЛНА 2а «конфетки» (issue #292, план §4.2 и §4.3). Обе записи — ПАРАМЕТРЫ
# ЭТОЙ деки, не смена общего умолчания: без них код жанров идёт прежней
# веткой знак в знак, и пересборка Семинаров 6 и 7 после этой правки даёт
# побайтово тот же видимый слой (проверено снимком всех фигур и прогонов —
# `rendered/iteration-log-w2a.md`, регресс W2a-R1).

# Крючок на дивайдере кейса: был 14 pt приглушённым серо-синим курсивом —
# на Семинаре 7 это приписка к реплике, здесь это единственная строка
# напряжения на экране. Белый, а не `ON_DARK`: светлый угол градиента
# (`#1C7293`) даёт `ON_DARK` 4,11:1 — ниже порога AA; белый даёт 5,42:1.
# Курсив при этом остаётся только настоящим репликам (строка открывается
# «ёлочкой») — n05 и n17; n27 и n45 несут не речь, а находку.
case_divider:
  hook_size: 21
  hook_color: WHITE

# ВОЛНА 3а «конфетки» (issue #292, план §3.5 — «WCAG AA ≥4,5:1»). Подпись
# ступени, до которой занятие ещё не дошло, набиралась `ON_DARK_MUTE`
# `#9FAEC4` на плашке `PILL_OFF` `#3E4C8A`. Замерено по настоящему рендеру
# (цвет строки из pptx, фон — пиксель страницы PNG): **3,58:1**, то есть
# ниже порога AA. На дивайдерах кейсов таких подписей три (n05), две (n17) и
# одна (n27) — это имена кейсов, которые зал читает, чтобы понять, что
# впереди, а не декорация.
#
# `ON_DARK` `#D6E2EC` на той же плашке даёт **6,12:1**. Тише белого (белый
# здесь 8,06:1 и занят ПРОЙДЕННОЙ ступенью), то есть иерархия «пройдено
# светлее будущего» не ломается, а различие пройденного и будущего всё равно
# несёт заливка плашки — тиловая против тёмно-синей.
#
# Запись параметризует ЭТУ деку: умолчание в `deck_kit.roadmap` осталось
# прежним (`ON_DARK_MUTE`), и Семинары 6/7 собираются знак в знак.
roadmap:
  future_color: ON_DARK

# ПУСТОТА ПОД n22a И n50a ОСТАЁТСЯ — волна 3а «конфетки» (issue #292) её
# замерила и не закрыла; это запись о незакрытом, а не о сделанном.
#
# Волна 2б передала наблюдение «нижняя треть пуста на n22a, n34a, n50a,
# n30a». Замер по рендеру (нижний непустой пиксель страницы против рабочего
# поля 6,92″ из 7,5″ = 92,3%) подтвердил его на ДВУХ слайдах из четырёх:
# n22a — 84,5%, n50a — 84,8%, то есть около 0,6″ пустой полосы; а n34a
# (92,1%) и n30a (90,5%) доходят до поля, и равнять у них нечего.
#
# Почему не закрыто. У обоих на экране ровно два блока: кроп панели
# настройки и одна строка-вывод. Фигура уже во всю ширину полосы, и её
# высота задана соотношением сторон кадра (3,83 у n22a, 3,75 у n50a) —
# расти ей некуда; порядок блоков менять некуда; добавлять на экран
# содержание волне полировки нельзя (§9 плана). Перекроп кадров выше —
# работа волны 1 (съёмка стенда), не полировки.
#
# Деление свободного хода поровну пробовалось и откачено — замеры и причина
# записаны в `tools/seminar-build/roles.py`, функция `compose`.

# Строка-интрига на обложке (план §4.2): помечается в исходнике целиком
# жирным и рисуется крупнее подзаголовка-навигации и белым.
cover:
  hook_size: 19
  hook_color: WHITE

# Приёмы, где зал ГОЛОСУЕТ карточками: их блок `cards` рисуется рядом
# «ВЫБЕРИ», а не пилюлями терминов, и к ним применяется аудит «ответ рядом с
# вопросом».
vote_patterns:
  - question_with_option_cards
  - guess_the_number
  - scene_cards_and_question

# Дивайдеры: у них другая грамматика — риторический вопрос в заголовке
# перехода не голосование, разбор ему не положен.
#
# ВАЖНО: здесь, в отличие от Семинара 7, стоит ТОЛЬКО `case_divider_quote`.
# `audit_takty_keysa` (audits.py) читает именно этот список, чтобы проверить
# порядок «дивайдер → сцена → вопрос» для ДИВАЙДЕРОВ КЕЙСА — и это правило
# не действует на Zillow (n39): концептуальный разбавитель вне дорожки
# кейсов (ARCHITECTURE.md §6), с бюджетом 7 минут без демо и без отдельного
# экрана сцены — дивайдер и сцена слиты в один экран сознательно
# (BRIEF-PROIZVODSTVO.md §4). У Семинара 7 `section_divider_macro` стоял в
# этом списке «про запас» и ни разу не встречался на реальном слайде — здесь
# он встречается (n39), и его грамматика ДРУГАЯ, поэтому он не в этом списке.
divider_patterns: [case_divider_quote]

# Слайды, где фигура — подтверждающий бэкап, добавленный ПОСЛЕ основных
# врезок (не вводная схема): рисуется последней, не первой. n31 — голосовая
# правка 2026-10-20 (issue #274), реальный скрин двух вариантов Кейса 3
# (калькулятор + яснее правило) как доказательная база к числам из n30.
# n20 — тем же приёмом, тем же днём (владелец: «ты сам смотрел на скрины? в
# последнем разделе почти нет, в остальных тоже мало»): реальный скрин
# воркфлоу тестового стенда Кейса 2 как доказательная база к таблице 4 схем.
# Кейс 4 ту же жалобу решает ОТДЕЛЬНЫМ letter-tail слайдом (n48a), не
# fig_after на n48 — на n48 уже стоят таблица + два текстовых блока, и
# fig_after там будил реальный дефект, пойманный `check_tracks_pdf.py`
# (фигура заходила на текст над собой); решение и разбор — в backup n48a.
fig_after: [n20, n31]

# Слайды, где ПЕРВАЯ таблица — не таблица, а ряд числовых плашек (приём
# «полоса плашек», жанр `metric_band`). Волна 2б «конфетки» (issue #292,
# план §4.7): сцена Кейса 1 (n06) показывает кадр стенда, числа дня Ольги и
# её реплику — три вещи, а не одну, поэтому такт-выплата `metric_band_reveal`
# ей не годится (там на экране не должно быть ничего, кроме ряда и строки),
# а карточка таблицы прячет числа внутрь абзаца, что §3.2 плана запрещает.
# Запись ПАРАМЕТРИЗУЕТ этот жанр для этой деки: без неё код идёт прежней
# веткой знак в знак, и пересборка Семинаров 6 и 7 после правки не меняется.
# n07 добавлен волной 3а (план §6.4): на экране вопроса полоса несёт УСЛОВИЕ
# задачи — «3 значения» на входе и «1 строка» на выходе, — и стоит ПЕРЕД
# вопросом, потому что разбор под вопросом запрещён правилом А1 (сторож
# `audit_question_answer`). До правки слайд был из двух блоков, и нижние
# 23,4% экрана пустовали при рабочем поле 92,3% (§3.3). Умение читать эту
# запись дописано жанру `question`; умолчание — пустой список.
# n51 добавлен волной 2в (план §3.2, «числа — плашками»): шаг генерации
# собран и ИЗМЕРЕН на стенде, и три его числа — цена карточки, месяц, размер
# файла — несущие. Карточкой таблицы они ушли бы внутрь абзаца; такт-выплата
# (`metric_band_reveal`) слайду не годится — на экране кроме полосы стоят
# кадр холста и строка про формат.
metric_band_sids: [n06, n07, n51]

# Осознанные исключения из стандартной рамки таблицы `#1C7293`.
#
# `answer_breakdown_table.slots: false` — волна 0 «конфетки» (issue #292): в
# таблице разбора пустая ячейка значит «писать нечего», а не «зал заполнит».
# Единственная такая ячейка деки — колонка «Пример запроса» в строке «Итого»
# на n32: у итога примера нет и быть не может, а серая штриховая плашка-слот
# обещала залу заполнение, которого не будет. Слоты остаются включёнными
# там, где они и нужны, — у оси занятия (n04, `keystone_axis`): её правая
# колонка открывается пустой и закрывается по строке на кейс.
table_style:
  answer_breakdown_table:
    slots: false

# Слайды, где единственная подпись-итог начинается с «ёлочки» и потому была
# бы опознана как тихая реплика докладчика.
gold_quote_sids: {}

# Точечное переопределение роли там, где общий механизм неверен. Запись
# СПИСКОМ назначает роль по блокам, по порядку цитат слайда; `null` —
# «эту решает общий механизм».
#
# n20 (волна 2а, план §4.10): под таблицей четырёх схем стоит глосс термина
# «jev» — работа, которой у деки до сих пор не было. Общий механизм дал бы
# ей `formula` (умолчание приёма `answer_breakdown_table`), то есть вторую
# золотую планку на экране рядом с находкой — два акцента вместо одного
# (§3.8 плана). Форма `footnote` рисует её тем, что она есть: мелкой серой
# строкой под тонкой линией.
quote_role_force:
  n20: [footnote, null]
  # n15 (волна 2б, план §4.8): после сведения обобщения с критерием на экране
  # стоят три врезки. Умолчание приёма (`formula`) дало бы три золотых планки
  # подряд, то есть три «главных» на одном экране и ни одного (§3.8 плана).
  # Класс задачи — не вывод, а постановка: он ОПИСЫВАЕТ, с чем мы имели дело,
  # и читается перед нюансами. Форма `fact` рисует его тиловой врезкой.
  #
  # ТРЕТЬЯ запись добавлена второй половиной волны 2б: при `null` золотыми
  # выходили ДВЕ планки подряд — критерий и закрытие строки оси, — и §3.8
  # («два золотых акцента на экране — дефект») нарушался ровно так же, просто
  # на одну планку меньше. Замерено по снимку: образец этой деки — n31a волны
  # 2а, где золотая плашка стоит ОДНА, а строка под ней набрана `fact`.
  # Золото здесь остаётся критерию: заголовок слайда («когда нужна модель,
  # когда достаточно шаблона») спрашивает именно о нём, а закрытие строки оси
  # подводит итог кейса и читается как факт.
  n15: [fact, null, fact]
  # n06 (волна 2б, план §4.7): на сцене Кейса 1 рядом стоят золотая плашка
  # «20 заявок» и реплика Ольги. По умолчанию реплика получала форму
  # `formula` — золотую планку, — и на экране оказывались ДВА золотых акцента
  # при одном допустимом (§3.8). Форма `speech` для неё не уступка вёрстке, а
  # собственное имя этой строки: план §4.7 так её и называет — «реплика Ольги
  # одной строкой», и это настоящая прямая речь, то есть единственное место,
  # где §3.5 курсив разрешает. Золото остаётся несущему числу сцены.
  n06: [speech]
  # n23a (волна 2б, план §4.12): под кадром таблицы стоят две врезки —
  # выноски к строкам кадра и вывод. Обе по умолчанию шли `formula`, то есть
  # двумя золотыми планками подряд (§3.8). Выноски — не вывод, а чтение
  # кадра вслух, поэтому им `fact`; золото остаётся выводу.
  n23a: [fact, null]
  # n51 (волна 2в): на экране полоса плашек, и её первая плашка — золотая
  # (значение набрано жирным: измеренная цена карточки — несущее число
  # слайда). Строка под полосой по умолчанию получила бы `formula`, то есть
  # вторую золотую планку рядом (§3.8 плана). Она не вывод, а поправка к
  # собственной прежней заметке слайда — почему перекодировка в цепочке
  # нужна; форма `fact` рисует её тиловой врезкой. Тот же разбор, что у
  # n31a и n23a.
  n51: [fact]

deck_yaml:
  central_question_patterns: [question_with_option_cards, guess_the_number]
  axis_pattern: keystone_axis
  # Бутстрап шапки — только для самой первой сборки, когда deck.yaml ещё не
  # существует вовсе; дальше прозаические поля переносятся из него.
  head_defaults:
    seminar_number: 8
    audience: "3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами"
    format: >-
      слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) +
      измеренный эксперимент Кейса 3 (51 прогон); на занятии ведущий ничего не
      редактирует в узлах n8n вживую — только прогоняет уже готовые процессы
      (решение владельца, см. ARCHITECTURE.md §4)
    language: ru
    slot_min: 90

# ── Сторожа и генераторы ────────────────────────────────────────────────────

notes:
  # Калибровка объёма заметок ЭТОГО занятия — канон называет коридор 250–450
  # на содержательный слайд для семинара (не 500–800, это норма лекций).
  bands:
    разделитель: [250, 450]
    голосование: [250, 450]
    содержательный: [250, 450]
    опорный: [250, 450]
    обложка: null
  anchor: {}

svodka:
  case_divider_patterns: [section_divider_macro, case_divider_quote]
  # Дивайдер, который режет блок, но кейсом НЕ является. Zillow (n39) —
  # концептуальный разбавитель вне дорожки кейсов (ARCHITECTURE.md §6), и
  # счёт кейсов карты обязан его пропускать: до волны 0 «конфетки» (issue
  # #292) рубрики печатались подряд по дивайдерам, из-за чего карта называла
  # Zillow «Кейсом 4», а Кейс 4 занятия — «Кейсом 5», против самой деки
  # (`case_track` — четыре имени, дивайдер n45 — «Кейс 4. Карточка в
  # Telegram»). Минуты и состав разбавителя карта показывает по-прежнему.
  razbaviteli:
    n39: "Концептуальный разбавитель — Zillow: цена пропущенного гейта (вне дорожки кейсов занятия)"
  nachalo_default: "развилка, одностраничник"
  zal:
    question_with_option_cards: голосования карточками
    scene_cards_and_question: голосование-сцена вслепую
    guess_the_number: устная оценка числа

sluzhebnoe:
  timing_patterns: [hero_cover, section_divider_macro, case_divider_quote, keystone_axis]
  razdely: ["МОСТИК", "ШОВ С7→С8", "ОСЬ", "ZILLOW"]
