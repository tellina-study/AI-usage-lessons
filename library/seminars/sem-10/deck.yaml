      \ по картинкам = картинка плюс текст рядом с ней» — §1.2 и §1.4\n  п. 3: Milvus и Qdrant сливают\
      \ картиночный вектор с текстовым той же\n  формулой, Vespa и eBay — взвешенной суммой.\n· UniDoc-Bench:\
      \ точность на десяти — текст 0,406, картинка 0,275,\n  слияние 0,479, единая мультимодальная модель\
      \ 0,341; 1600 пар\n  «вопрос — ответ» из 8 областей. §1.2.\n· Реранкер: у провайдера этого стенда\
