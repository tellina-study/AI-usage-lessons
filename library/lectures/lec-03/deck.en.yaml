  - id: s27b
    file: slides-en/s27b-agent-starter-kit.md
    type: assertion_visual
    section: "Section 5. The decision framework"
    duration_min: 2
    assertion: "The agent starter kit — a thin default + justified triggers for adding complexity"
    chapter_ref: "§5.2b [for-slide-s27a]"
