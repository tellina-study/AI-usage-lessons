- id: n40
  file: slides-en/n40-vopros-chem-uskoryaem.md
  type: reflection_question
  duration_min: 1.0
  assertion: The task is laid out — the room first names what it has itself already used to drive a task
    through all at once, and with that same means decides what to speed this one up with; there are five
    cards, a subagent is one of them, and every card asks for the piece it works on to be named
  learning_goal: 'A question to the class with no hint at the target answer. Five cards — five means of
