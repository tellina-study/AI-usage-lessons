      ПО ПРОВАЙДЕРАМ (Таблица 1): кэш отдают метрики у Anthropic (с точкой), Gemini и OpenAI — у всех
      троих отношение чтения от 0,1× до 0,25×. DeepSeek и Qwen на этом посреднике (DeepInfra, Phala) кэша
