    как таблица отказа прозой. Закрывается строкой оси, которая держит вывод кейса, без изменений'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: Таблица в две колонки — «роли ещё нет» и «роль не нужна вовсе», как было. Под ней — строка-статистика
      самоизобличения курса (три числа жирным, через точку), компакт, не абзац. В самом низу — строка
      оси, без сокращений.
    backup: 'Источник — section-2-subagent.md §A.1 «Критерий» + section-2-subagent-part1b.md n45 «Речь»,
      дословно. Числа самоизобличения проверены в этом репозитории напрямую 2026-10-04: `ls .claude/agents/*.md
      | wc -l` = 14; `grep -L "^tools:" .claude/agents/*.md | wc -l` = 13; `grep -n "^tools:" .claude/agents/*.md`
      = ровно 1 строка (literary-editor.md, значение `All tools`) — совпадает с источником без расхождений.
