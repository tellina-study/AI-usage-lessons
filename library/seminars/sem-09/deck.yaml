      ОБЕ ОБЯЗАТЕЛЬНЫЕ ОГОВОРКИ СТОЯТ ЗАКРЫВАЮЩИМИ ПЛАШКАМИ, не сноской, обе вслух:

      (1) Квитанции синтетические — по SETKA, нюанс 5, первая половина: сделаны этой же сессией для демонстрации
      механизма на управляемом примере, не замер качества модели на потоке живых документов.

