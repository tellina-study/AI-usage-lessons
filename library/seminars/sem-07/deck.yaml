# Первый работающий процесс
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 07
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n05   12.00 мин
#   Ось        n06–n06    2.00 мин
#   Кейсы      n07–n32   64.00 мин
#   Закрытие   n33–n35    7.00 мин
#   ИТОГО                  85.00 мин при слоте 90

deck:
  seminar_number: 7
  title: Первый работающий процесс
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 85.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: 'И вопрос к себе, пока голосуете: у вас на работе в каком-нибудь процессе стоит повтор
    при отказе? Знаете ли вы, что там выбрано по умолчанию — или оно просто стоит как поставилось?'
  language: ru
  slide_count: 35
  axis: null
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Первый работающий процесс: триггер, шаг модели, запись результата'
  learning_goal: Обложка. Называет занятие и его место в дуге.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Круг 5, пересборка по переопределённой цели (KONTSEPTSIYA-7-12.md): семинар учит технике
      на уровне блоков инструмента. Прежние четыре деки в slides-v3-arhiv/ и slides-v4-arhiv/.'
- id: n02
  file: slides/n02-iz-lektsii-lestnitsa.md
  type: taxonomy_compare_table
  duration_min: 3.0
  assertion: 'Из Лекции 3: лестница архитектур и различение workflow против агента — workflow оркеструется
    по предопределённым путям, агент определяет свой путь сам'
  learning_goal: 'Введение 1 из 4. Пересказ Лекции 3 §4.3, а не новое содержание: зал должен вспомнить
    лестницу и пять паттернов, потому что сегодня мы весь семинар стоим на одной её ступени.'
  visual:
    pattern: taxonomy_compare_table
    primary: 'Сверху лестница шести ступеней одной строкой, сегодняшняя подсвечена. Ниже таблица пяти
      паттернов workflow из лекции: имя, что делает, пример. Внизу определение различения двумя строками.

      '
    backup: 'Заменяет прежний экран «что дали модели» по правке владельца (2026-10-12): «дай слайд или
      явно перескажи, что мы показывали в лекции про варианты организации воркфлоу, агентов и мультиагентов,
      вместо твоих фантазий». Источник — library/lectures/lec-03/chapter-part3.md §4.3 и part5 §5.1 (лестница);
      первоисточник лекции — Anthropic, Building Effective Agents.'
- id: n03
  file: slides/n03-iz-lektsii-multiagenty.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: 'Из Лекции 3: мульти-агент не апгрейд, потому что надёжность шагов перемножается, а токены
    множатся кратно — и поэтому workflow остаётся рабочей ступенью'
  learning_goal: 'Введение 2 из 4. Пересказ арифметики из Лекции 3: p^n, кратность токенов, топология.
    Объясняет, почему шесть занятий дуги идут снизу вверх, а не сразу к агентам.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в три колонки: что перемножается, число из лекции, что из этого следует. Внизу золотая
      строка с правилом «начинай с одного сильного».

      '
    backup: 'Числа — из Лекции 3 §4.3 и Deep-dive box 5: 0,95^10 ≈ 60%; одиночный агент ≈ 4× токенов против
      чата, мульти-агент ≈ 15×; амплификация ошибок 17,2× у «роя» против 4,4× у централизованной оркестрации
      (Kim et al., 2026). Пересказ, а не новое содержание — требование владельца.'
- id: n04
  file: slides/n04-vidy-instrumentov.md
  type: taxonomy_compare_table
  duration_min: 3.0
  assertion: 'Три класса инструментов: конвейеры между системами, платформы для агентов и конструкторы
    LLM-приложений — выбор решают два вопроса, кто запускает и что считается шагом'
  learning_goal: 'Введение 3 из 4. По-человечески и с примерами: зал должен понимать, из какого класса
    мы взяли один и почему, без лирики.'
  visual:
    pattern: taxonomy_compare_table
    primary: 'Таблица в четыре колонки: как называется по-человечески, для чего берут, кто может запустить,
      кто в классе. Клетки короткими живыми фразами. Под таблицей — два вопроса выбора, одной строкой.

      '
    backup: 'Переписано по правке владельца (2026-10-12): «классы инструментов — надо почеловечнее и с
      примерами описать, а лирические описания (два примечания на слайде) — убрать». Оба примечания сняты:
      про «делит не ИИ» — сведено в два вопроса выбора, про закрытие Flowise — ушло в заметки.'
- id: n05
  file: slides/n05-n8n-zachem-i-kak.md
  type: mechanism_node_graph
  duration_min: 3.0
  assertion: 'n8n — интеграционный оркестратор с визуальным холстом: процесс рисуется узлами, между узлами
    ходят данные, запускается снаружи, и всё это видно в журнале прогонов'
  learning_goal: 'Введение 3 из 3: зачем выбран n8n и как он устроен — ДО того, как внутрь. Зал должен
    знать слова «холст», «узел», «прогон», «журнал» прежде, чем услышит их как известные.'
  visual:
    pattern: mechanism_node_graph
    screenshot: SCREENSHOT-TODO-n8n-holst.png
    primary: 'Снимок холста n8n во всю ширину, с подписанными прямо на нём четырьмя вещами: холст · узел
      · карточка узла · журнал прогонов. Под снимком таблица устройства в две колонки. Рисованной схемы
      здесь НЕТ намеренно: поддельный интерфейс запрещён правилом курса, а настоящий снимок — весь смысл
      этого экрана.

      '
    backup: 'Добавлено 2026-10-12 по правке владельца: «потом слайд про n8n для чего, как устроено и только
      потом внутрь». Это же закрывает P0-3 прожарки: предмет занятия впервые появляется на экране ДО того,
      как про него говорят. СНИМОК ОБЯЗАТЕЛЕН — без него экран не выполняет свою работу.'
- id: n06
  file: slides/n06-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Процесс, который работает, и процесс, за который можно ручаться, — разные процессы. Сегодня
    увидим разницу четыре раза
  learning_goal: Несущая ось занятия, предъявленная ДО первого кейса (Pre-USER-GATE §6). Таблица открывается
    с четырьмя пустыми строками и закрывается заполненной в конце.
  visual:
    pattern: keystone_axis
    primary: 'Сверху ось одной фразой, крупно. Ниже таблица четырёх строк: «что выглядит рабочим» заполнено,
      «чем это оказалось» — пусто, с пунктирными клетками. Внизу строка про то, что клетки заполнятся
      к концу занятия.

      '
    backup: 'Конструкция взята из принятых Семинаров 4 и 6: ось открывается с дырками (в Семинаре 6 ось
      открывается с двумя пустыми строками из четырёх и закрывается заполненной в его предпоследнем блоке).
      В С7 этого не было вовсе — главная находка прожарки методической критики, вердикт REJECT.'
- id: n07
  file: slides/n07-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Их всё равно потом руками в таблицу перекладывают» — постановка первого кейса
  learning_goal: Дивайдер кейса 1. Называет наблюдаемую работу, не инструмент (правило А2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Сквозной пример дуги — обработка входящей заявки (KONTSEPTSIYA-7-12.md §7). Выбран вместо
      бота поддержки: бот не создаёт повода для циклов, слияния и сабфлоу, и ровно эти ступени в курсах
      рынка систематически пропускают.'
- id: n08
  file: slides/n08-k1-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Администратор читает двадцать заявок в день и переносит их в таблицу руками — сорок минут,
    и к концу их делают механически
  learning_goal: 'Такт СЦЕНЫ кейса 1 — описание с человеком и ценой, до вопроса. Порядок тактов принятых
    Семинаров 4 и 6: дивайдер → сцена → вопрос → разбор → детали.'
  visual:
    pattern: problem_scenario
    primary: 'Таблица в две колонки: что происходит сейчас и во что это обходится. Клетки полными фразами.
      Под таблицей — что должно получиться, золотой строкой.

      '
    backup: 'Добавлено по правке владельца (2026-10-12): «почему ты в кейсах не используешь тот же формат,
      который был в предыдущих семинарах — слайд описание, слайд вопрос с вариантами (без протечек), разбор
      вариантов и дальше пошли детали». Сцены в деке не было вовсе: вопрос шёл сразу за дивайдером, то
      есть зал ещё ничего не потерял, когда его спрашивали.'
- id: n09
  file: slides/n09-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Из скольких узлов соберётся процесс, который решает задачу полностью — первое решение зала
  learning_goal: 'Первое голосование. Карточки описаны полностью, чтобы выбор был осознанным: зал видит,
    что именно в каждом варианте есть и чего нет.'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху постановка двумя строками с явным требованием к результату. Ниже вопрос в золотой
      рамке, четыре карточки — каждая с составом, а не одним словом.

      '
    backup: 'Карточки расписаны по правке владельца: «в примерах отвратительно короткие описания и пропали
      варианты». Число на обложке снято — оно выдавало ответ (находка прожарки).'
- id: n10
  file: slides/n10-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: 'Три узла дают запись, но не решение: тема будет какой угодно, срочности не будет вовсе,
    а проверить результат можно только походом в таблицу'
  learning_goal: 'Разбор сразу за вопросом. Главное: разница между «заработало» и «можно поручиться» —
    это два конкретных узла, и оба придётся обосновать.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в три колонки на четыре строки, клетки полными фразами. Под ней золотая строка про
      два недостающих узла.

      '
    backup: 'Шесть узлов — проверенная на стенде стадия 1 (`stend/stage-1.json`), а не оценка: форма,
      извлечение, модель, сверка, запись, экран.'
- id: n11
  file: slides/n11-k1-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 4.0
  assertion: 'Шесть узлов на холсте, и шаг модели — это два узла: сам шаг и подключённая к нему модель'
  learning_goal: 'Такт «наше решение» кейса 1. Вводится то, что иначе всплывает как известное: шаг модели
    — это ДВА узла, и выражение в поле. Зал предсказывает результат до прогона.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-shest-uzlov.png
    screenshot: SCREENSHOT-TODO-k1-holst.png
    primary: 'Сверху снимок холста с шестью узлами. Под ним таблица узлов в три колонки — имя на холсте,
      что в карточке, зачем он здесь, клетки полными фразами. Ниже — вопрос-предсказание золотой строкой
      перед прогоном.

      '
    backup: 'Счёт исправлен на ШЕСТЬ (прожарка P0-2): узел модели — отдельная коробка на холсте, подключённая
      к извлечению, и зал считает то, что видит. Прежние «пять узлов» опровергались экраном на седьмой
      минуте. Выражения перенесены сюда из снятого экрана теории: они стоят там, где применяются, а не
      висят за четыре слайда до применения.'
- id: n12
  file: slides/n12-k1-reshenie-parametry.md
  type: mechanism_node_graph
  duration_min: 4.0
  assertion: Список объявлен схемой-перечислением, сверка держит его выражением, и зал предсказывает результат
    до прогона
  learning_goal: 'Вторая половина такта «наше решение»: что настраиваем в двух несущих узлах, и предсказание
    зала перед прогоном.'
  visual:
    pattern: mechanism_node_graph
    screenshot: SCREENSHOT-TODO-k1-kartochka-uzla.png
    primary: 'Снимок карточки узла извлечения со схемой. Под ним две строки параметров и вопрос-предсказание
      золотой рамкой.

      '
    backup: 'Отделено от предыдущего экрана: вместе состав узлов и параметры не влезали, таблица уходила
      на 9 пунктов и композиция вылезала за рабочее поле. Выражение сверки стоит здесь — там, где применяется,
      а не в снятом экране теории, после которого оно в деке не встречалось ни разу.'
- id: n13
  file: slides/n13-k1-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Закрытый список нужен, когда результат читает следующий шаг, и не нужен, когда его читает
    человек; предел — список, в котором нет «иначе»
  learning_goal: 'Критерий вместо эссе: двухколоночная таблица «когда нужно / когда не нужно» с названным
    пределом, плюс строка закрытия первой строки оси.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки, клетки полными фразами. Под ней — названный предел отдельной плашкой
      и строка закрытия оси.

      '
    backup: 'Форма взята из принятых Семинаров 4 и 6 («MCP нужен, когда… не нужен, когда…»). Прежние два
      экрана — «что переносится в любой инструмент» и «где ломается классификация — три класса» — сведены
      сюда: прожарка методической критики показала, что восемь таких экранов несли 41% всего видимого
      текста занятия и при этом ничего не показывали и не решали.'
- id: n14
  file: slides/n14-slovar-tipy-blokov.md
  type: taxonomy_compare_table
  duration_min: 3.0
  assertion: Девять классических типов блоков, из которых собирается любой процесс, и чем каждый является
    в n8n
  learning_goal: Теория 1 из 3. Слева — словарь, который переживёт любой интерфейс; справа — его воплощение
    в инструменте, на котором смотрим. Последняя строка — единственный новый тип.
  visual:
    pattern: taxonomy_compare_table
    primary: 'Таблица в три колонки на девять строк: тип блока, что делает, чем является в n8n. Последняя
      строка выделена золотым — единственный новый тип. Под таблицей строка про то, какие строки закрывает
      сегодняшнее занятие.

      '
    backup: 'Требование владельца (2026-10-12): переиначить теорию на классические типы блоков с явным
      отображением на n8n. Девять строк соответствуют девяти ступеням лестницы дуги (KONTSEPTSIYA-7-12.md
      §6) — так, чтобы на каждом занятии закрывалась своя строка этой же таблицы.'
- id: n15
  file: slides/n15-dannye-spiskom.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: В n8n между узлами идёт список элементов, и узел выполняется по разу на каждый элемент
  learning_goal: 'Модель данных n8n после первой сборки: правило про список, обёртка json и два следствия,
    которые стоят денег.'
  visual:
    pattern: mechanism_node_graph
    figure: teoriya-dannye-spiskom.png
    primary: 'Схема: слева список из трёх элементов, справа один узел, от него три стрелки — три выполнения.
      Под схемой правило крупной золотой строкой, ниже одна строка про обёртку json.

      '
    backup: 'Требование владельца (2026-10-12): этот слайд описывать именно для n8n. Разделён на два экрана,
      потому что правило и четыре следствия на одном уводили таблицу на 9 пунктов — с задних рядов не
      читается.'
- id: n16
  file: slides/n16-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «В заявке две темы, а в таблице одна» — наблюдаемый результат первого кейса
  learning_goal: Дивайдер кейса 2. Проблема видна прямо из того, что собрали минуту назад, и на том же
    экране результата.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Опирается на прогон кейса 1: заявка «перенести занятие и как оплатить» вернула одну тему.
      Проверено на стенде, прогоны 2 и 4.'
- id: n17
  file: slides/n17-k2-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Вторник, администратор проверяет собранное: заявка про перенос и оплату попала в таблицу
    с одной темой, и про оплату никто не узнал'
  learning_goal: 'Такт сцены кейса 2: человек и цена. Проблема предъявлена случаем, а не рассуждением.'
  visual:
    pattern: problem_scenario
    primary: 'Таблица в две колонки: что сделал процесс и чем это кончилось для человека. Под ней — вопрос
      без вариантов, как переход к следующему экрану.

      '
    backup: 'Сцена добавлена по правке владельца: прежде кейс 2 начинался дивайдером и сразу вопросом.
      Случай взят из прогона стадии 1 на стенде (прогоны 2 и 4).'
- id: n18
  file: slides/n18-k2-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Что должно попасть в тему, когда в заявке их две — второе решение зала
  learning_goal: Второе голосование. Все четыре варианта встречаются в живых системах, и выбор между ними
    — не вкус, а решение про то, кто разбирает остаток.
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху текст заявки целиком, одной строкой в рамке. Ниже вопрос в золотой рамке, четыре
      карточки равной ширины.

      '
    backup: Карточки описаны поведением, не именами блоков. Третий вариант — задел Семинара 9 (несколько
      строк из одной заявки).
- id: n19
  file: slides/n19-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: 'Четыре ответа различаются не сложностью сборки, а тем, кто разбирает остаток: никто, человек,
    следующий шаг или тот, кто читает пометку'
  learning_goal: 'Разбор сразу за вопросом. Ключ: выбор про то, кто доделывает работу за процессом, и
    «другое» — честный ответ, а не отказ.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в три колонки на четыре строки. Под ней золотая строка про то, что эти четыре ответа
      на самом деле различают.

      '
    backup: Третий вариант (две строки из одной заявки) — задел Семинара 9; здесь он назван и отложен
      явно, а не промолчан.
- id: n20
  file: slides/n20-k2-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Берём «другое» плюс пометку: справочник получает четвёртое значение и отдельный столбец
    «ещё в заявке», и обе темы остаются видны'
  learning_goal: Такт «наше решение» кейса 2. Собирается вживую на четырёх трудных заявках; на экране
    результата видно, что решил справочник и что осталось в пометке.
  visual:
    pattern: mechanism_node_graph
    figure: k2-shema-trudnye-zayavki.png
    screenshot: SCREENSHOT-TODO-k2-vocabulary.png
    primary: 'Сверху та же схема шести узлов, справочник обведён золотым кольцом. Под ней таблица четырёх
      трудных заявок и того, что получилось. Справа место под снимок узла справочника.

      '
    backup: 'ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12 (n8n 2.42.7), стадия 2, 10 строк таблицы: ни одной пустой
      темы, ни одной темы вне справочника — включая заявку из одного слова «ок» и бессмысленный ввод.
      Заявка с тремя темами дала «оплата» + пометку «перенос занятия · другое».'
- id: n21
  file: slides/n21-k2-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Законное «не знаю» нужно, когда вход шире вашего списка, и не нужно, когда вход вы контролируете
    сами; предел — очередь без владельца
  learning_goal: 'Критерий кейса 2 плюс закрытие второй строки оси. Форма принятых семинаров: когда нужно
    / когда не нужно + названный предел.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами. Под ней предел отдельной плашкой и строка закрытия
      второй строки оси.

      '
    backup: Сведены прежние «что переносится в любой инструмент» и «где ломается справочник — три класса».
      Приём «законное воздержание» в литературе зовётся abstention; слово даётся залу как переносимое.
- id: n22
  file: slides/n22-k3-divider.md
  type: case_divider_fact
  duration_min: 0.5
  assertion: Понедельник, таблица, двое суток пропуска — дивайдер констатирует факт, а не передаёт чью-то
    реплику
  learning_goal: 'Дивайдер кейса 3. Форма сломана намеренно: два предыдущих дивайдера были репликами,
    третий — голая констатация, иначе зал предсказывает экраны (§4.2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним одна приглушённая строка. Дорожка кейсов, третий подсвечен.

      '
    backup: 'Намеренный сбой ритма форм дивайдеров (§4.2): кейсы 1 и 2 входили репликой, этот входит фактом.
      Фрагмент таблицы с дыркой показывается на стенде вживую, на слайд не выносится — экран на полминуты.'
- id: n23
  file: slides/n23-k3-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: 'Понедельник, девять утра: в таблице пятница и понедельник, выходных нет вовсе, и никто не
    знает, что процесс делал эти два дня'
  learning_goal: 'Такт сцены кейса 3: человек, цена и неизвестность. Двое суток пропуска предъявлены как
    случай, а не как предупреждение.'
  visual:
    pattern: problem_scenario
    primary: 'Таблица в две колонки: что видно и что из этого неизвестно. Под ней — строка про то, что
      сторож не сработал, потому что сработать ему не на чем.

      '
    backup: 'Сцена добавлена по правке владельца. Главное её свойство: половина клеток — про НЕИЗВЕСТНОЕ,
      и это то, что делает отсутствие записи дороже ошибки.'
- id: n24
  file: slides/n24-k3-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Что должен делать узел, когда вызов не удался — третье решение зала
  learning_goal: Третье голосование. Все четыре карточки — реальные значения настроек узла; это выясняется
    на разборе и обычно становится сюрпризом.
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке сверху, четыре карточки равной ширины. Над вопросом одна строка контекста:
      что стоит дальше по процессу.

      '
    backup: 'Вводная не нужна: зал выбирает поведение, а не блок. Что каждая карточка — это готовая настройка,
      сообщается на разборе.'
- id: n25
  file: slides/n25-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: Все четыре ответа — это значения настроек On Error и Retry On Fail в карточке любого узла;
    по умолчанию стоит Stop Workflow
  learning_goal: 'Разбор сразу за вопросом. Главный поворот: зал голосовал за поведение и, не зная того,
    выбирал из готового списка настроек инструмента.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки: имя настройки — поведение — когда уместно. Над таблицей одна строка-поворот.
      Настройка по умолчанию выделена.

      '
    backup: Четыре значения On Error плюс Retry On Fail — реальные настройки узла n8n, проверены по справочнику
      нод. Continue = Continue (regular output). Четыре значения On Error и Retry On Fail сверены со стендом
      (n8n 2.42.7); поведение `continueErrorOutput` проверено прогоном 6.
- id: n26
  file: slides/n26-k3-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 6.0
  assertion: 'Retry On Fail плюс выход error: заявка идёт в ту же таблицу со status = not_parsed и на
    свой экран — ни одна не теряется, и отказ видно сразу'
  learning_goal: 'Такт «наше решение» кейса 3, собирается вживую. Отказ демонстрируется честно: ключ провайдера
    портится на глазах у зала.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-shema-dve-vetki.png
    screenshot: SCREENSHOT-TODO-k3-error-output.png
    primary: 'Схема: от узла извлечения два выхода — успешный в справочник, таблицу и экран, error в ту
      же таблицу с пометкой и свой экран. Под схемой две настройки. Справа место под снимок карточки настроек
      узла.

      '
    backup: 'ЭКРАН ДЕМО. Процесс на стенде собран и проверен; снимок карточки настроек ещё не снят — съёмка
      интерфейса требует входа в UI. Отказ для демонстрации вызывается порчей ключа провайдера — мгновенный
      и воспроизводимый отказ, в отличие от ожидания настоящего таймаута. В производстве тот же отказ
      воспроизведён подменой имени модели: поведение одного класса. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12, прогоны
      5 и 6: успешная ветка пишет три столбца; при испорченной модели журнал показал ТРИ попытки НА УЗЛЕ
      МОДЕЛИ, элемент ушёл в выход `error` с исходными данными формы плюс полем ошибки, строка «не разобрано»
      в таблице появилась, а статус прогона — success. Файл — `stend/stage-3.json`.'
- id: n27
  file: slides/n27-k3-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Повтор нужен на временных отказах идемпотентных операций и не нужен на постоянных и на операциях
    с последствиями; предел — отказ, которому некуда идти
  learning_goal: Критерий кейса 3 плюс закрытие третьей строки оси. Правила надёжности здесь из инженерной
    практики распределённых систем, не из оркестратора.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами. Под ней предел отдельной плашкой, число про умножение
      нагрузки и строка закрытия третьей строки оси.

      '
    backup: Идемпотентность, лавина повторов, разброс задержек, «повторять в одном месте стека» и число
      243 (три попытки на каждом из пяти слоёв) — из инженерной библиотеки Amazon. Сведены прежние два
      экрана кейса 3.
- id: n28
  file: slides/n28-k4-divider.md
  type: case_divider_contradiction
  duration_min: 0.5
  assertion: На холсте правка есть, результатов по ней нет — оба утверждения верны одновременно
  learning_goal: Дивайдер кейса 4. Форма — два коротких утверждения, которые противоречат друг другу и
    оба верны; третий дивайдер был фактом, второй репликой, ритм не повторяется (§4.2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним две приглушённые строки подряд. Дорожка кейсов, четвёртый
      подсвечен.

      '
    backup: 'Намеренно не формулируется как чья-то ошибка: оба утверждения верны, в этом вся задача кейса.'
- id: n29
  file: slides/n29-k4-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Поправили промпт, проверили ручным запуском, через сутки заявки разобраны по-старому — и
    правка на холсте всё это время была на месте
  learning_goal: 'Такт сцены кейса 4: оба утверждения верны одновременно, и это не чья-то забывчивость.
    Сцена предъявляет противоречие, вопрос ищет причину.'
  visual:
    pattern: problem_scenario
    primary: 'Таблица в две колонки: что сделали и что получилось. Под ней — строка про то, что проверка
      руками показывала правильный результат всё это время.

      '
    backup: Сцена добавлена по правке владельца. Прежний дивайдер уже содержал противоречие — теперь он
      только объявляет кейс, а разворачивает сцена.
- id: n30
  file: slides/n30-k4-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Почему боевые прогоны идут по старому варианту — четвёртое решение зала
  learning_goal: 'Четвёртое голосование, и единственное, где правильных карточек две. Вводная идёт ПОСЛЕ:
    назови Publish заранее — вопроса не останется.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, четыре карточки. Без контекстной строки: весь контекст на предыдущем
      экране.

      '
    backup: Вводная про черновик и Publish идёт следующим экраном — иначе ответ выдан вместе с вопросом
      (§5 концепции).
- id: n31
  file: slides/n31-k4-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: Сценарий автосохраняется в черновик постоянно, кнопки «Сохранить» нет; в боевой режим правка
    уходит отдельным действием Publish, и боевые прогоны исполняют опубликованную версию
  learning_goal: 'Вводная и разбор одним экраном: механика названа, и из неё сразу видно, какие две карточки
    верны и почему это одно и то же.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Сверху три строки механики. Ниже таблица четырёх карточек с вердиктом. Строка про исчезнувшее
      слово «активировать» — отдельной плашкой.

      '
    backup: Publish заменил Activate в n8n 2.x; слова «активировать» в интерфейсе больше нет. Проверено
      по справочнику; перед занятием сверить с версией стенда.
- id: n32
  file: slides/n32-k4-kriteriy.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Отдельная проверка в боевом режиме нужна там, где путь существует только в бою; предел —
    то, что уезжает вместе с файлом сценария
  learning_goal: Критерий кейса 4 плюс закрытие четвёртой строки оси. Единственный пункт занятия про безопасность
    — здесь, перед тем как студенты начнут обмениваться файлами.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки полными фразами. Под ней предел про экспорт отдельной плашкой и строка
      закрытия четвёртой строки оси.

      '
    backup: 'Сведены прежние два экрана кейса 4. Строка про экспорт — прямое следствие производства: студенческий
      файл пришлось собирать со снятыми привязками, иначе в нём уезжали ссылки на учётные данные и таблицу
      стенда.'
- id: n33
  file: slides/n33-os-zakryta.md
  type: keystone_axis
  duration_min: 2.5
  assertion: 'Таблица оси заполнена: четыре пары «выглядит рабочим — чем оказался», и все четыре зал видел
    своими глазами'
  learning_goal: Закрытие оси занятия. Пары стоят рядом; вопрос занятия возвращается залу дословно.
  visual:
    pattern: keystone_axis
    primary: 'Та же таблица, что в начале занятия, теперь с заполненной правой колонкой. Под ней возврат
      вопроса занятия золотой строкой.

      '
    backup: 'Парный экран к оси в начале. Конструкция из принятых Семинаров 4 и 6: ось закрывается заполненной
      таблицей и возвратом вопроса дословно (в Семинаре 6 — закрытие оси и возврат вопроса двумя соседними
      экранами; в Семинаре 4 — то же в финале).'
- id: n34
  file: slides/n34-vyhod.md
  type: outcome_artifact
  duration_min: 2.5
  assertion: С занятия уносится файл процесса из восьми узлов — шесть на успешном пути и два на ветке
    отказа, — который встаёт в свой n8n одним импортом
  learning_goal: 'Выход занятия предъявляется как артефакт: что собрано, из чего, и что с этим делать
    дома. Условие сквозной линии С7→С12.'
  visual:
    pattern: outcome_artifact
    figure: vyhod-shema-protsess.png
    primary: 'Итоговая схема процесса целиком: шесть узлов успешного пути с номерами шагов плюс два на
      ветке отказа. Рядом карточка файла с именем и тремя шагами импорта.

      '
    backup: 'Файл СОБРАН И ПРОВЕРЕН на стенде 2026-10-12 (n8n 2.42.7): все четыре стадии выложены через
      управляющий API, опубликованы и прогнаны настоящими отправками формы; в таблице 10 строк, ни одной
      пустой темы и ни одной вне справочника. Студенческий файл — та же стадия 4 со снятыми привязками
      к учётным данным и таблице этого стенда. Источник — `stend/sborka.py`.'
- id: n35
  file: slides/n35-mostik-k-s8.md
  type: bridge_forward
  duration_min: 2.0
  assertion: 'Процесс пока идёт одной дорогой: все заявки через один шаг; на Семинаре 8 появляются маршруты
    и проверка перед записью'
  learning_goal: Замыкание занятия и постановка следующего. Ступень называется своим именем, без обещания
    «будет интереснее».
  visual:
    pattern: bridge_forward
    primary: 'Схема текущего процесса бледно, поверх неё — развилка пунктиром в месте, где на С8 появится
      ветвление. Снизу три строки про следующее занятие.

      '
    backup: 'Ступень С8 по §6 концепции: ветвление и слияние, проверка результата шага. Не обещать сюда
      ни агентов, ни поиска по документам.'
