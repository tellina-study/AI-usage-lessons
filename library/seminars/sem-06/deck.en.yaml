    pattern: reflection_question
    primary: 'A table of two rows — the two misses of one week, with the cause of each beside it. The
      rows are deliberately opposite: the first one''s cause is "this is not inside at all", the second
      one''s is "everything needed fit inside and crowded the work out". Under the table — the seminar''s
      question itself, word for word, in large type, in a gold frame. There are no option cards: the vote-between-options
      is not repeated here.

      '
    backup: 'Source: `rework/block-0-mostik.md` §A.4.

      The owner''s round of edits (issue 225, §A2): the previous question ("the server reports ''connected'',
      the role reports ''done'' — how is that different from a fact") was removed entirely, together with
      the trustworthiness arc it carried. The load-bearing thought accepted then: part of the agent''s
      work needs data from outside, part of it needs a separate worker with a trimmed context and trimmed
      permissions.

      The storytelling revision (issue 225, `PERESMOTR-STORITELLING.md`, reason 3 "the opening is a table
      of contents, not a hook" + rules P1 "every case has a turn of its own" and P2 "a person and a cost").
      Before this edit the slide restated in its own words what the cover had already said in full, and
      asked its question into a void — the room had not lost anything yet. Now both misses of the running
      story are on the screen: the first was told on the cover, the second is presented here, and their
      causes stand beside them. The turn of the section is that the causes are OPPOSITE: "does not fit"
      means two different things, and they are treated by moves that run toward each other. The seminar''s
      map (n05) and the whole order of the sections rest on that opposition.

      The wording of the question was rewritten (the previous one: "The agent sees only what lies in the
      repository and in the conversation with you. Where does that context end — and what do you set up
      first: access to the outside, or a separate worker with trimmed permissions?"). Two reasons. The
      first sentence of the previous question is now shown by a scene rather than pronounced in the abstract.
      The second named the two moves by their construction ("access to the outside", "trimmed permissions")
      — the new wording names them by their direction ("bring inside what is not inside" / "carry outside
      what does not fit inside"), and in that pair you can hear that these are two answers to one question.
      The rule "the question does not name MCP and the subagent by name" is kept: the names are introduced
      by the seminar''s map next and by the base of each section.

      LOOP: the question is presented word for word a second time in section 3 (`n63`) — the return rests
      on the wording matching. After this edit `n63` and `block-3-os.md` §A.3 carry the PREVIOUS text
      and must be brought to the new one character for character; that is the closing session''s zone,
      it is not edited here, and the discrepancy is named outright.

      Layout mechanics: `g_question` splits the quote block into the scene and the question at the first
      sentence with a question mark. That is why the question is written as ONE sentence — otherwise its
      first half ("the work has run past the agent''s context") would drift off into the quiet aside and
      a stub would land in the gold box.'
