# Один вызов, цепочка, маршрут
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n03    5.50 мин
#   Ступень 1  n04–n16   25.75 мин
#   Ступень 2  n17–n31   28.50 мин
#   Ось        n32–n32    2.50 мин
#   ИТОГО                  62.25 мин при слоте 90

deck:
  seminar_number: 7
  title: Один вызов, цепочка, маршрут
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 62.25
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: Тот же самый классификационный шаг — только теперь от его ответа зависит, какой из
    четырёх маршрутов получит письмо. Нужно ли здесь гонять полноценный вызов модели, который сочиняет
    объяснение, или достаточно того, что сразу возвращает одну метку?
  language: ru
  slide_count: 32
  axis: Девять ступеней — это процессы, которые пользуются одним агентом или просто одним вызовом модели;
    занятие закрывает три нижние, шесть верхних закрывают следующие пять занятий дуги
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka-odin-vyzov-tsepochka-marshrut.md
  type: hero_cover
  duration_min: 0.5
  assertion: Этим занятием открывается дуга из шести семинаров про процессы на больших языковых моделях
    поверх агентов; начинаем с нижней ступени — один вызов, цепочка, маршрут.
  learning_goal: 'Чистая обложка, не контент-слайд: называет занятие и его место в дуге, ничего не объясняет
    и ничего не доказывает кейсами. Завязка («где здесь искусственный интеллект») — следующий экран, `n02`;
    лестница из девяти ступеней — третий, `n03`. Обложка не повторяет материал ни одного из двух и не
    забирает у них работу. Номер занятия не выносится на экран как значок или цифра — решение владельца
    (issue 225, `sem-06/qa/oblozhka-bez-nomera.md`), снявшее исключение для Семинаров 2–5; место в дуге
    названо словами в подзаголовке, не цифрой на обложке.

    '
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, тот же приём, что у обложки Семинара 6 — без hero-схемы и без вопроса-загадки,
      на этой обложке их нет: единственные элементы — крупный центрированный заголовок и под ним одна
      строка подзаголовка о месте занятия в дуге. Тонкая золотая полоса между заголовком и подзаголовком
      — минимальный golden-accent, держит правило «золото хотя бы раз на слайде» без добавления содержания.
      Никакой цифры семинара и никакой подписи «СЕМИНАР 7» на экране — ни крупной, ни мелкой, ни в углу.

      '
    backup: 'Заголовок — `ARCHITECTURE.md` frontmatter `title` без префикса «Семинар 7 —»: префикс принадлежит
      заголовку документа и метаданным, не экрану — тот же сдвиг виден на обложке Семинара 6, где на слайде
      стоит «Доступ наружу и урезанные права» без «Семинар 6». Подзаголовок — краткая перефразировка `ARCHITECTURE.md`
      §1 (переход уровня с С4–С6), без единой цифры и утверждения из разделов 1 или 2: ни Zillow, ни Optum/UnitedHealth,
      ни IRS, ни механика email-пайплайна на обложку не выносятся — это прямое требование задачи, не пропуск.

      Сокращение LLM раскрыто прямо в подзаголовке («большие языковые модели») — круг правок по опус-ревью:
      до него первое слово занятия, которое зал видит на экране, было аббревиатурой. В заголовке занятия
      аббревиатур нет вовсе.

      Решение не давать hero-иллюстрацию, в отличие от обложек С5/С6, — намеренное упрощение по прямому
      заданию («минимальный текст на самой обложке — название + подзаголовок, не контент»). Первая иллюстрация
      занятия — на следующем экране (`n02`, схема «письмо → правило-триггер → карточка в трекере»), вторая
      — лестница из девяти ступеней на `n03`; обложка перед ними не забирает их материал.'
- id: n02
  file: slides/n02-gde-zdes-iskusstvennyy-intellekt.md
  type: scene_reveal
  duration_min: 3
  assertion: 'Три коробки и две стрелки — письмо, правило-триггер, карточка в трекере — обходятся без
    единого вызова модели: правило написано один раз и срабатывает одинаково на первом письме и на тысячном'
  learning_goal: 'Завязка занятия и первый содержательный экран: зал ищет в работающем процессе искусственный
    интеллект, не находит и получает ответ «нигде». Вопрос этим не закрывается — он переезжает уровнем
    выше («какому шагу процесса модель нужна») и этим открывает первый кейс. Второй работой экрана названа
    цена: на нём впервые звучит, чем кончается занятие — закрытый бизнес и 2000 уволенных там, где между
    оценкой модели и необратимым действием не стояло проверки.

    '
  visual:
    pattern: scene_diagram_and_reveal
    figure: mostik-n02-pochta-bez-modeli.png
    primary: 'Схема во всю ширину: три коробки и две стрелки — письмо, правило-триггер, карточка в трекере;
      на второй стрелке подписан HTTP-запрос. Под схемой, внутри самой картинки, — реплика инженера, который
      это правило настроил. Ниже четыре карточки-варианта, нижняя («нигде») отмечена верной. Под карточками
      две строки: куда переезжает вопрос и чего он стоит.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.0 и `rework/section-1-chaining-part1b.md` §B.1.
      Ответ предъявляется на этом же экране (правило А1 — разбор сразу за вопросом; раздел не завёл для
      разбора отдельного маркера, поэтому вопрос и ответ стоят в одном кадре).

      Экран стоит ВТОРЫМ, сразу за обложкой, — порядок изменён кругом правок по опус-ревью («открытие
      как оглавление»): прежде первой шла лестница из девяти строк на пять минут, а завязка стояла третьей
      и получала две с половиной. Теперь завязка открывает занятие, а лестница читается следующим экраном
      как карта, уже после того, как зал понял, какой вопрос эта карта раскладывает.

      Схема рисуется, а не описывается словами (`rendered/make_figures_mostik.py`): вопрос «где в картинке
      искусственный интеллект» к абзацу не задаётся. HTTP-запрос — подпись на стрелке, а не четвёртая
      коробка: он и есть то, чем правило действует наружу, отдельного узла процесса в нём нет.

      Строка о цене — та же компания, что разбирается кейсом B этой ступени; имя, цифры списания и источники
      там, здесь только исход и его база (2000 человек — четверть штата). Это сознательный заём вперёд,
      а не дубль: зал в первые минуты занятия должен знать, чем оно кончится.'
- id: n03
  file: slides/n03-lestnitsa-devyat-stupeney.md
  type: recap_ladder
  duration_min: 2
  assertion: Девять ступеней — это процессы, которые пользуются одним агентом или просто одним вызовом
    модели; занятие закрывает три нижние, шесть верхних закрывают следующие пять занятий дуги
  learning_goal: 'Карта занятия, прочитанная ПОСЛЕ завязки: зал уже знает, какой вопрос она раскладывает
    («какому шагу процесса модель нужна»), и смотрит на лестницу как на ответ по ступеням. Здесь же проходит
    переход уровня с С4–С6 (от устройства одного исполнителя к устройству процесса, который им пользуется)
    и вопрос к собственной работе: на какой ступени стоит процесс, который участник уже где-то собрал.

    '
  visual:
    pattern: ladder_steps_figure
    figure: mostik-n03-lestnitsa.png
    primary: 'Схема во всю ширину: девять ступеней снизу вверх, левый край каждой сдвинут вправо — ломаная
      по внешним углам рисует лестницу. Три нижние ступени в золотой рамке, справа от них золотая полоса
      «сегодня»; шесть верхних серые и пустые. Под схемой — одна строка о том, чем закрываются верхние
      ступени, и вопрос залу о собственном процессе.

      '
    backup: 'Девять ступеней — `SPLIT-PLAN-7-12.md` §2 дословно, без переименования и без сокращения приёмов
      (правило «абстракции не изобретаются», `tools/seminar-production/README.md` §3). Переход уровня
      — `ARCHITECTURE.md` §1. Правило «знать С1–С6 для участия не обязательно» (наследуется с С5) живёт
      в заметках.

      Экран стоит ТРЕТЬИМ, после завязки, — порядок изменён кругом правок по опус-ревью («открытие как
      оглавление»): прежде лестница открывала занятие, занимала пять минут и печаталась таблицей из девяти
      строк с колонками «Закрывает» и «Статус», где девять раз подряд стояло «пусто». Колонка статуса
      снята целиком: пустая ступень видна и без слова. Колонка «Закрывает» свёрнута в одну подпись под
      схемой. Время ужато с пяти минут до двух.

      Схема рисуется `rendered/make_figures_mostik.py` (`mostik-n03-lestnitsa.png`) и геометрически совпадает
      до пикселя со схемой `n32` (`os-n32-lestnitsa-tri-zakryty.png`): зеркальная пара, один и тот же
      объект, прочитанный в конце занятия с другим результатом. Разница между двумя файлами — заливка
      трёх нижних ступеней, галочка на них и слово в полосе справа.

      `pattern: ladder_steps_figure` — новое имя приёма этой деки (второй слайд с ним — `n32`). Собственного
      жанра в `build_sem07.py` оно не требует и намеренно не заводит: приём падает в `g_content`, который
      рисует объявленную схему и блоки по порядку, — ровно то, что здесь нужно. Прежний `recap_table`
      (`g_axis_table`) схему не рисует вовсе и для лестницы непригоден.'
- id: n04
  file: slides/n04-divider-ya-tak-i-otvechayu.md
  type: section_divider
  duration_min: 0.5
  assertion: '«Я так и отвечаю: читаю письмо, минуту думаю, печатаю ответ» — работа сотрудника почты поддержки,
    описанная без единого слова про модель'
  learning_goal: 'Дивайдер кейса A называет наблюдаемую работу репликой человека (правило А2): зал сначала
    узнаёт будничное действие, и только потом — машину, которая это действие уже выполнила за него'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, реплика сотрудника поддержки крупно в кавычках. Внизу — дорожка трёх кейсов
      ступени (A · B · C), кейс A подсвечен. Без тега с минутами, без слов «модель» и «цепочка».

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.1.1 и §A.00, `-part1b.md` §B.2. Кейс A — сквозной
      учебный сценарий; документированным публичным случаем он не является, и это названо прямо в §A.00
      раздела и повторено в заметке. Кейсы B и C ступени — документированные случаи с источниками.'
- id: n05
  file: slides/n05-stsena-otvet-uzhe-napisan.md
  type: scene_question
  duration_min: 2.25
  assertion: 'Письмо про разбитую упаковку пришло утром, через секунду в очереди лежал готовый ответ —
    вежливый, грамотный, уверенный; вопрос один: отправляем'
  learning_goal: 'Поворот кейса заряжается здесь: зал голосует за отправку готового текста, потому что
    по форме к нему не придраться. Ошибка зала — предмет следующего экрана, и она случается у всех'
  visual:
    pattern: scene_cards_and_question
    primary: 'Две колонки равной ширины: слева письмо клиента, справа готовый ответ целиком, крупным кеглем
      — зал обязан прочесть его за десять секунд и не найти к чему придраться. Под ними золотой коробкой
      вопрос и три карточки-варианта.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.1.2 и §A.1.7, `-part1b.md` §B.3. Письмо про повреждённую
      упаковку и ответ по метке «другое» взяты из разбора провала раздела; здесь они предъявлены ДО механики,
      чтобы зал проголосовал прежде, чем узнает устройство. Как устроен автоответ внутри — на n06, граф
      целиком — на n07.'
- id: n06
  file: slides/n06-razbor-vezhlivo-i-bez-resheniya.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: 'В ответе есть всё, кроме решения: слова «возврат» в нём нет — черновик собран по метке «другое»,
    и под этой меткой в базе знаний лежит общий шаблон'
  learning_goal: 'Разбор сразу за голосованием (А1), две колонки (А5). Поворот кейса: зал одобрил текст,
    в котором права клиента на возврат нет вовсе, и узнаёт, что решил это первый шаг — метка, которую
    никто не проверял'
  visual:
    pattern: answer_breakdown_table
    primary: 'Две колонки: «что в ответе есть» и «чего в нём нет». Правая колонка выделена — она и есть
      находка. Под таблицей — раскрытие механизма двумя строками (метка → база знаний по метке), и золотой
      планкой формула-вывод.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.1.7 и §A.1.5, `-part1b.md` §B.8. Закрытый список
      меток (`пароль` · `статус заказа` · `возврат` · `жалоба` · `другое`) и шаблон под меткой «другое»
      — оттуда же. Граф цепочки целиком раскрывается на следующем экране (n07), здесь названы только два
      шага, которые объясняют текст.'
- id: n07
  file: slides/n07-mehanika-graf-tsepochki.md
  type: mechanism
  duration_min: 2.75
  assertion: 'Цепочка целиком: два вызова модели, один ромб между ними и очередь человека в конце — ромб
    стоит ДО второго вызова и в коде занимает одну строку'
  learning_goal: 'Механика предъявлена графом узлов вместо листинга: овал — вызов модели, прямоугольник
    — код, ромб — проверка. Та же картинка с погашенным ромбом стоит на следующем экране, и разница читается
    за полсекунды. Таксономия workflow/агент свёрнута в две строки под схемой'
  visual:
    figure: c1-graf-tsepochki.png
    pattern: mechanism_node_graph
    primary: 'Граф узлов во всю ширину: письмо → classify → ромб «метка в списке?» → draft → очередь человека
      → клиент; ветка «нет» уводит письмо человеку целиком. Легенда форм внизу схемы, строка кода — подписью
      к ромбу, не отдельным блоком. Под схемой — две строки про путь, записанный в коде, и путь, который
      выбирает модель.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.1.4, §A.1.5, §A.1.6, `-part1b.md` §B.5–B.7. Схема
      рисуется `rendered/make_figures_c1.py` той же функцией, что и схема следующего экрана, — геометрия
      у них общая по построению. Термин prompt chaining оставлен на английском с русским пояснением по
      глоссарию курса.'
- id: n08
  file: slides/n08-proval-pogasshiy-romb.md
  type: failure_vignette
  duration_min: 2.5
  assertion: 'Тот же граф с погашенным ромбом — это и есть автоответ из сцены: метка «другое» прошла дальше,
    draft написал по ней гладкий текст, очередь подтвердила не читая'
  learning_goal: 'Провал предъявлен как одна снятая деталь на той же схеме — ромб погас, ветка «человеку
    целиком» молчит. Рядом два черновика: одобренный залом и тот, который написал бы тот же draft по верной
    метке. Оба вежливые, решение есть в одном'
  visual:
    figure: c1-graf-pogasshiy-romb.png
    pattern: failure_vignette_before_after
    primary: 'Та же схема, что на предыдущем экране, с одним отличием: ромб серый и перечёркнут, ветка
      «нет» погасла, путь письма красный. Под схемой — два черновика рядом, оба вежливые; решение есть
      только в правом.

      '
    backup: 'Источник: `rework/section-1-chaining.md` §A.1.7, `-part1b.md` §B.8. Схема рисуется той же
      функцией `graph()` из `rendered/make_figures_c1.py`, что и схема n07, с аргументом `dead=True`:
      геометрия, координаты и подписи общие, различаются состояние ромба, цвет пути и три подписи. Правый
      черновик собран по условиям возврата учебного магазина из того же сценария.'
- id: n09
  file: slides/n09-granitsa-vypishite-svoi-klassy.md
  type: criteria_boundary
  duration_min: 2.0
  assertion: 'Проверка на своей задаче: выпишите классы входа одним списком — список, который кончается,
    цепочка держит; список, который кончается словом «прочее», она держит только с ромбом'
  learning_goal: 'Граница дана прямой формой (А7) как действие, которое зал может выполнить на своей задаче:
    выписать список классов и прочитать его последнюю строку. Здесь же первый вопрос «к себе» на видимом
    слое — приём прикладывается к своей работе вместо учебного магазина'
  visual:
    pattern: self_check_boundary
