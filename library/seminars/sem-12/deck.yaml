    ровно с тем, насколько наш вопрос расходится с вопросом, который задавал себе разметчик
  learning_goal: Нить вторая закрытия (ZAKRYTIE-BRIEF.md §3), дополнена числами кейса C, переданными оркестратором
    напрямую (сообщение в сессию, проверено лично по сырью после гибели измерительной сессии кейса C без
    ветки и коммита; перенесено в коммит 12ab3f85c4 на issue-351-seminars-12-13-kartinki). Число A (2
    из 145) — собственная правка этой сессии против брифинга (см. n82 предыдущей редакции), подтверждена
    оркестратором как уже принятая. Малый знаменатель на 69% (29 снимков) и на 5 из 14 (14 снимков) назван
    на кадре явно — по прямому требованию оркестратора и по notes/decisions.md 2026-11-24 «малый знаменатель
    — не свидетельство».
  visual:
    pattern: content
    primary: 'Три строки «кейс — что нашли — база», упорядоченные по росту расхождения вопроса с разметчиком.
      Внизу — число D (наши собственные запросы) отдельной плашкой и правило нити.

      '
    backup: Числа B и D — ZAKRYTIE-BRIEF.md §3, проверены первичным источником. Число A — исправлено этой
      сессией (2 из 145, не 3 — см. зону «не моя», находка отправлена оркестратору). Числа C — переданы
      оркестратором лично, проверены им по сырью, не с пересказа погибшей сессии замера.
- id: n83
  file: slides/n83-chuzhoy-arkhiv-smertnost.md
  type: content
  duration_min: 1.25
  assertion: Два внешних основания занятия умерли за время, пока его производили — не из-за ошибки в коде,
    а потому что процесс, построенный на чужом архиве, наследует его смертность
  learning_goal: Нить третья закрытия (ZAKRYTIE-BRIEF.md §4). Модель — находка производства 21.11.2026,
    зафиксирована в SETKA-KEYSOV.md (устаревший по составу файл, но конкретная запись о модели — дата
    и число — факт производства, не зависящий от состава кейсов; наследуется по PEREDELKA-2026-11-24.md
    §7, строка «Модель исчезла из каталога через 17 дней»). Бакет — notes/mcp-limitations.md [#351-4],
    замерено 2026-11-24 прямым HEAD-запросом, 18 из первых 40 проверенных отсутствуют (45,0%), пул — 796
    подтверждённых человеком позитивов; число уточнено против брифинга («45% из 796») до точного «18 из
    40 проверенных, пул 796» — чтобы не создавать видимость, что проверены все 796.
  visual:
    pattern: content
    primary: 'Два случая рядом, оба с явной базой и датой. Внизу — одна строка итога, без усреднения двух
      разных по природе смертей.

      '
    backup: 'Числа проверены первичными источниками: SETKA-KEYSOV.md (модель) и notes/mcp-limitations.md
      [#351-4] (бакет). Знаменатель бакета назван точно — проверены первые 40 из пула 796, не весь пул.'
- id: n84
  file: slides/n84-opredelenie-reshaet.md
  type: content
  duration_min: 1.25
  assertion: Один и тот же ответ модели на два похожих кадра получил два разных вердикта — и разница не
    в модели, а в том, какое определение запрещённого выбрал владелец; на всём корпусе эта граница создаёт
    практически весь перекос ложных тревог
  learning_goal: 'Нить четвёртая закрытия (ZAKRYTIE-BRIEF.md §5) — качественная находка «ведро/плакат»
    закреплена решением владельца, PEREDELKA-2026-11-24.md §13.1 и §15.1. Пара чисел 24 из 25 / 1 из 68
    — подтверждена оркестратором напрямую как число этой же нити (сообщение в сессию) и проверена этой
    сессией лично по сырью: library/seminars/sem-12/stend/zamery-C/raw/vision_results.jsonl, срез по дир-каталогам
    C-smoking (валтест-жёсткий-негатив, предмет курения без человека) и C-smoking-negtrain (обычный негатив),
    коммит 12ab3f85c4 — независимый пересчёт совпал с присланными числами точно. Стык с кейсом B (выдумка
    поля) — по ZAKRYTIE-BRIEF.md §5, подан общей формулировкой без числа (не её зона — кейс C).'
  visual:
    pattern: content
    primary: 'Два кадра рядом текстом (ведро окурков / плакат с рекламой), один столбец «ответ модели»
      (одинаковый), один столбец «вердикт» (разный). Под ними — пара чисел на весь корпус («24 из 25»
      рядом с «1 из 68») и вывод про стык с кейсом B.

      '
    backup: Текст кадров — дословная передача находки PEREDELKA-2026-11-24.md §13.1 и §15.1 (решение владельца
      о определении класса курения, у1′). Пара 24/25 и 1/68 — проверена этой сессией по сырым данным,
      совпала с присланными оркестратором числами. Стык с кейсом B — по ZAKRYTIE-BRIEF.md §5, подан как
      названный случай, не как измеренная частота.
