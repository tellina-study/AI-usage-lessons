- id: n29
  file: slides/n29-stsena-odin-ball-raznaya-tyazhest.md
  type: problem_scenario
  duration_min: 2.0
  assertion: При одном и том же балле риска у чёрных пациентов в среднем на 26,3% больше активных хронических
    заболеваний — разрыв держится у всей группы сразу и в одну сторону, поэтому это свойство самого алгоритма,
    а шум измерения так себя не ведёт
