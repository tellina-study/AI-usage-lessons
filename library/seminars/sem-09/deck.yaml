      '
    backup: 'ЧИСЛА И ИХ ИСТОЧНИК. 0,107× и 1,25× (запись) — `stend/zamery-k2-kesh/README.md`, Таблица
      3: тот же промт на 3793–3794 токена, `anthropic/claude-haiku-5.5`, прямое чтение 0,00037940 $ против
