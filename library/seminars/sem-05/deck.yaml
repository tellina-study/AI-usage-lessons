  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Разделительная формула сверху. Ниже — две плашки бок о бок: слева что остаётся на каждом
      изменении, справа что уходит на пул-реквест. В каждой строке цена одного прогона и множитель. Внизу
      — переходная строка к следующему разделу.'
    backup: 'ОБОБЩЁН по требованию владельца (обход деки, замечание к n33): «надо более обобщённо и для
      тех, кто слаб в гите и программировании». Критерий переписан через частоту и цену, названия команд
      убраны из формулировки правила и оставлены только как пример. Числовая пара оставлена ОДНА (27 мс
      × 1 против 1 137 мс × 20): строка про синтаксическую проверку 124 мс снята — она ничего не решала,
