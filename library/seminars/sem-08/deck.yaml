    primary: 'Таблица на 4 строки, 5 колонок: схема · верно из 20 · что поймала · что пропустила · стоимость
      и скорость. Под ней — честная находка про порог и короткая методология теста. Без сырых чисел jev
      на видимом слое.

      '
