# Где решает модель, а где должен — код
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 08
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    5.50 мин
#   Ось        n04–n04    4.00 мин
#   Кейсы      n05–n50   92.50 мин
#   Закрытие   n51–n53    7.25 мин
#   ИТОГО                 118.75 мин при слоте 90

deck:
  seminar_number: 8
  title: Где решает модель, а где должен — код
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 118.75
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + измеренный эксперимент
    Кейса 3 (51 прогон); на занятии ведущий ничего не редактирует в узлах n8n вживую — только прогоняет
    уже готовые процессы (решение владельца, см. ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Как собрать текст уведомления из этих трёх значений?
  language: ru
  slide_count: 67
  axis: 'Четыре строки — и в каждой то, что сегодня выглядит надёжным. Правая колонка пуста: мы заполним
    её по одной строке за кейс'
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Каждый новый шаг, который цепочка получает сегодня, проверяется одним вопросом: это решает
    модель, или должен решать код?'
  learning_goal: Обложка. Называет тему занятия и его место на той же ступени дуги, что и С7 — цепочка,
    не новая ступень.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Третья волна производства (issue #274, развёрнутая обратная связь владельца, 16 пунктов).
      Тема занятия — дословно из SETKA-KEYSOV-S8.md: «где в цепочке решение принимает модель, а где должен
      — код». Волна 1 (n01–n16): ввод, ось, кейс «Уведомления».'
- id: n02
  file: slides/n02-shov-s7-s8.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: У нас есть процесс по классификации входящих обращений — шесть узлов, те же, что работали
    в конце прошлого занятия
  learning_goal: 'Шов С7→С8: процесс предъявлен настоящим снимком, не пересказан и не нарисован программно.
    Повод для сегодняшних кейсов — не то, что эти шесть узлов плохие, а то, что цепочке предстоят новые
    шаги, которым этот вопрос ещё не задавали.'
  visual:
    pattern: mechanism_node_graph
    figure: shov-s7-obzor-klassifikatsii.png
    primary: 'Настоящий снимок живого холста n8n с прошлого занятия (не схема): шесть узлов слева направо,
      каждый с номером, под снимком — короткая расшифровка номеров одной строкой. Ветка отказа на этом
      конкретном снимке не показана — про неё отдельно говорят заметки.

      '
    backup: 'Правка владельца 2026-10-20 (issue #274): «не вот эту страшненькую схему покажем, а покажем
      скрин из н8н, который уже есть, и краткое внизу описание — не этот же процесс, который кто-то запомнит,
      кто-то не вспомнит, а напишем, что у нас есть процесс по классификации». Снимок — `sem-07/rendered/figures/obzor-k1.png`,
      реальный кадр живого стенда с размеченными метками (`sem-07/rendered/annotate_shots.py`, функция
      `annotate`, вызов `obzor-k1.png`: метки положены поверх настоящего кадра, интерфейс не перерисован),
      скопирован без изменений в `sem-08/rendered/figures/shov-s7-obzor-klassifikatsii.png`. Прежняя программная
      схема (`make_figures_n02.py`, `shov-s7-s8.png`) была верной по составу узлов, но нарисована кодом,
      а не снята с экрана — оставлена в репозитории как история решения, слайд её больше не использует.
      Ветка отказа (повтор 3 попытки → отдельная строка `status=not_parsed` → отдельный экран) на самом
      снимке не попала в кадр — она описана словами в заметках, не выдумана: состав подтверждён прямым
      чтением `sem-07/stend/student.json`.'
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: taxonomy_compare_table
  duration_min: 2.5
  assertion: 'Та же ступень, что и в прошлый раз: цепочка. Сегодня мы не поднимаемся выше — мы её усложняем'
  learning_goal: 'Короткое напоминание лестницы дуги, не повторный ввод — аудитория уже видела этот экран
    на С7. Закрепляет: вопрос «модель или код» живёт внутри одной ступени, не требует перехода на следующую.'
  visual:
    pattern: taxonomy_compare_table
    figure: lestnitsa-dugi.png
    primary: 'Та же лестница из девяти ступеней, что и на прошлом занятии, золотая полоса стоит на том
      же месте, что и в прошлый раз — она не сдвинулась. Короткая подпись вместо повторного объяснения
      всей лестницы.

      '
    backup: 'Напоминание, не переобучение: полный ввод лестницы и правило «не поднимайся без требования,
      которого ступень ниже не закрывает» уже были на С7 (sem-07/slides/n02-lestnitsa-dugi.md). Фигура
      `lestnitsa-dugi.png` уже существует в rendered/figures/ этого занятия — переиспользуется, не рисуется
      заново.'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 4.0
  assertion: 'Четыре строки — и в каждой то, что сегодня выглядит надёжным. Правая колонка пуста: мы заполним
    её по одной строке за кейс'
  learning_goal: Ось занятия, дословно из SETKA-KEYSOV-S8.md. Правая колонка открывается пустой (Pre-USER-GATE
    §6, keystone-axis check) и закрывается в конце занятия (n55), не здесь.
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, четыре строки. Левая колонка заполнена, правая — пуста, клетки пунктирные.
      Под таблицей одна строка про то, что правая колонка закроется по ходу занятия, не вся сразу в конце.

      '
    backup: Текст левой колонки — дословно из SETKA-KEYSOV-S8.md, раздел «Ось занятия», не переформулирован.
      Правая колонка в SETKA размечена служебными пометками «закроется в кейсе…» для производства — на
      видимом слайде их нет, колонка пуста целиком (прямое указание брифа этой волны).
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Ольга, администратор учебного центра, попросила одно сообщение в Telegram на каждую многотемную
    заявку
  learning_goal: 'Дивайдер кейса 1. Название по функции (канон §1): «Уведомления», не тезис. Реплика —
    потребность, не решение (А2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Название кейса — «Уведомления», по функции, не по уроку («лишний шаг цепочки» — отклонённый
      вариант, проверка §1 канона proektirovanie-keysa- i-voprosa.md: по одному имени нельзя угадать,
      чем кейс закончится). Реплика — развёрнутая формулировка потребности Ольги (А13, сквозной администратор
      курса во всех кейсах курса, образец sem-07/slides/n09-k1-stsena.md) из SETKA-KEYSOV-S8.md, не буквальная
      цитата (в источнике потребность дана не как прямая речь, и персонаж там назван «Марина» — переименование
      по голосовой правке владельца 2026-10-20, issue #274; SETKA-KEYSOV-S8.md этой правкой не редактировался,
      расхождение имени — известный открытый пункт для оркестратора при следующем сведении волн).'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Ольга видит многотемную заявку только открыв экран результата — а открывает его не на каждую
    заявку сразу, и многотемная заявка иногда ждёт до следующей проверки
  learning_goal: 'Такт сцены кейса 1 в форме принятых семинаров (образец sem-07/slides/n09-k1-stsena.md):
    живая постановка потребности Ольги — кто она, что делает, что ломается — без версии решения и без
    находки практики. Обе перенесены в такт разбора на настоящих прогонах (голосовая правка владельца
    2026-10-20, issue #274: «а что показала практика» не место в постановке).'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой (продолжение процесса классификации с прошлого занятия), под
      ней пронумерованная хронология дня Ольги, закрывающий абзац про цену и реплика-просьба. Таблиц нет,
      версии решения нет.

      '
    backup: 'Переписано по голосовой правке владельца (2026-10-20, issue #274): прежняя версия вводила
      «Версия 1» и находку практики («плейсхолдер») прямо в постановку кейса — отклонено владельцем явно.
      Персонаж — Ольга, не Марина (А13, сквозной администратор курса во всех кейсах, образец sem-07/slides/n09-k1-stsena.md).
      Целевой пример текста уведомления и три значения (имя, тема, доп. темы) — по смыслу из SETKA-KEYSOV-S8.md
      «Потребность — конкретно» (персонаж там остался «Марина» — известное открытое расхождение, SETKA
      не редактирован этой правкой), но вплетены внутрь просьбы Ольги, а не стоят отдельной абстрактной
      технической фразой после цитаты (вторая правка того же голосового комментария).'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Четыре действия, явным спектром от полной свободы модели до полной алгоритмической сборки
  learning_goal: 'Вопрос кейса 1: голые карточки-действия, без доводов и вердиктов (А6, канон §5 — дизайн-выбор,
    не факт).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      от «модель решает всё» до «алгоритм решает всё». Без пояснений и доводов на карточках — разбор экраном
      позже.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S8.md, раздел «Вопрос залу: как собрать текст уведомления
      из этих трёх значений?», не переформулированы. Каждая карточка — действие («заполняем», «зовём модель»,
      «добавляем»), не факт о возможностях инструмента (канон §5).'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Три из четырёх действий решают задачу, которой у Ольги уже нет: все значения извлечены заранее,
    интерпретировать нечего'
  learning_goal: 'Разбор сразу за вопросом (А1), 4-колоночная форма «действие · как делает · преимущество
    · недостатки» (А5, голосовая правка владельца 2026-10-20, issue #274, заменяет прежнюю 2-колоночную
    форму — README.md §3/§8.3 уже обновлены этой же волной). Без вердиктов «верно/неверно».'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Четыре строки, без колонки вердикта
      — решение экраном дальше.

      '
    backup: 'Текст разбора — сведён из SETKA-KEYSOV-S8.md, раздел «Разбор», не переформулирован по сути,
      уложен в 4-колоночную форму (А5, новое решение владельца, не восстановление старого канона — см.
      README.md §8.3). Ссылки на находку практики («видели на практике») убраны из этого такта и перенесены
      вперёд, на настоящие прогоны (n13) — на момент этого разбора находка залу ещё не показана (голосовая
      правка владельца 2026-10-20, issue #274).'
- id: n09
  file: slides/n09-k1-shema-s-llm.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Архитектурная схема версии 1: форма → извлечение → узел-модель сочиняет текст свободно →
    Telegram'
  learning_goal: Слой 1 (архитектура, системно-нейтрально) для версии с LLM — один слайд, без имён вендора
    в формулировке решения (канон §2). Первая из двух архитектурных схем для сравнения.
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-s-llm.png
    primary: 'Принципиальная схема без имён вендора: форма → извлечение полей → узел-модель (сочиняет
      текст свободно) → отправка в Telegram. Ровно четыре блока в ряд, одна стрелка-ветка к существующей
      цепочке.

      '
    backup: 'Системно-нейтральная формулировка узла — «шаг, который вызывает модель на каждый прогон и
      получает от неё свободный текст» — не называет конкретный инструмент (канон §2: формулировка не
      должна меняться, если завтра цепочку собирают не в n8n). Фигура входит в список §5 BRIEF-PROIZVODSTVO.md;
      если на момент сборки файла ещё нет на диске — имя финальное, сверка перед финальной сборкой. Эта
      схема дополнительно служит ЗАПАСНЫМ ВАРИАНТОМ показа: если на занятии недоступна живая система n8n,
      кейс можно провести по одной этой принципиальной схеме и по разбору действий (n08), без обращения
      к стенду — архитектурное решение понятно без конкретного инструмента.'
- id: n10
  file: slides/n10-k1-shema-bez-llm.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Архитектурная схема версии 2: форма → извлечение → узел подстановки значений в шаблон →
    Telegram'
  learning_goal: Слой 1 (архитектура), вторая схема — без LLM. Разница с предыдущим экраном ровно в одном
    узле, не в остальной цепочке (прямое сравнение, а не отдельная история).
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-bez-llm.png
    primary: 'Та же принципиальная схема, что и на предыдущем экране, с заменой ровно одного блока: форма
      → извлечение полей → узел подстановки значений (шаблон) → отправка в Telegram.

      '
    backup: 'Системно-нейтральная формулировка — «подстановка значений в фиксированную форму вместо вызова
      модели» (канон §2, прямой пример корректной формулировки первого слоя). Фигура из списка §5 BRIEF-PROIZVODSTVO.md.
      Эта схема дополнительно служит ЗАПАСНЫМ ВАРИАНТОМ показа: если на занятии недоступна живая система
      n8n, кейс можно провести по двум принципиальным схемам (n09 и эта) и по разбору действий (n08),
      без обращения к стенду.'
- id: n11
  file: slides/n11-k1-n8n-versiya1.md
  type: mechanism_node_graph
  duration_min: 1.5
  assertion: 'Настоящая конфигурация версии с моделью: шесть узлов от формы заявки до Telegram, модель
    вызывается дважды — на извлечении полей и на сочинении текста уведомления'
  learning_goal: 'Слой 2 для версии 1 — ПЕРЕСМОТРЕН 2026-10-20 вечером по голосовой правке владельца (issue
    #274): «со скринами беда... фигура — это кроп canvas с коробками узлов в пустом поле, а РЕАЛЬНЫЙ текст
    промпта дан рядом прозой — читатель должен ВЕРИТЬ тексту слайда на слово, скрин этого не показывает».
    Это главное замечание по всем кейсам семинара. Прежняя фигура (кроп 1900×415, снята тем же утром)
    показывала только два узла — «Compose notification…» и «Notify coordinator (Telegram)» — в почти пустом
    поле. Новая фигура — тот же исходный файл (case1-before.png, НЕ пересниманный заново), кроп пошире:
    все шесть узлов главного пути на одном кадре. Текст промпта с этого слайда СНЯТ — на этом кадре он
    всё равно не виден, здесь видна только структура процесса; дословный текст с настоящей панели настройки
    узла — на отдельном слайде (летер-хвост n11a, вставлен между n11 и n12), где фигура — сама панель
    настройки, а не карточка на холсте.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-n8n-versiya1-real.png
    primary: 'Настоящий скрин холста n8n (воркфлоу «С8 · Кейс 1 (до) — LLM сочиняет уведомление», живой
      стенд), широкий кроп: форма заявки → извлечение полей → проверка по словарю тем → запись строки
      → «Compose notification…» (подпись обрывается многоточием — так ведёт себя интерфейс n8n при узкой
      карточке) → отправка координатору в Telegram. Под двумя узлами видна пометка «Model*» — обязательный
      параметр, вызов модели здесь не опционален.

      '
    backup: 'СКРИН ПЕРЕСНЯТ (только кроп, не заново) 2026-10-20 вечером из того же файла stend/n8n-screenshots-raw/case1-before.png,
      который уже использовался утром того же дня — исходный файл не менялся, вырезана более широкая область:
      (260, 250)–(1730, 645) исходных 1900×1100, landscape 1470×395 (3.7:1). Сохранена под тем же именем
      library/seminars/sem-08/rendered/figures/k1-n8n-versiya1-real.png, прежняя версия (1900×415, только
      2 узла из 6 в почти пустом поле) перезаписана.

      Причина правки — голосовая правка владельца 2026-10-20 вечером (issue #274), текст дословно см.
      в description поля learning_goal. Разбор проблемы на этом конкретном слайде: фигура была кропом
      canvas с коробками узлов в пустом поле, а настоящий текст промпта был дан рядом прозой — то есть
      читатель был обязан поверить тексту слайда на слово, сам скрин этого не подтверждал.

      Что видно на новом кадре буквально: Request form (триггер-форма, значок молнии) → Extract fields
      (`Set`, с пометкой «Model*» под ней — узел извлечения полей тоже вызывает модель; это не новое и
      не отличает версию 1 от версии 2, см. ту же пометку на фигуре n14) → Vocabulary check (`IF`) → Write
      row → «Compose notification…» (подпись обрывается многоточием на холсте; полное имя «Compose notification
      (LLM)» подтверждено stend/stage-1-before.json) → Notify coordinator (Telegram). Под узлом композиции
      — такая же пометка «Model*», и чуть ниже — дополнительный узел «Result screen Model (notification)»,
      которого нет у версии 2 (на фигуре n14 ровно то же место кадра пустое) — это и есть главная структурная
      разница между версиями, видная уже на уровне холста, без открытия панели настройки. Без id воркфлоу
      и прогона на кадре (канон §3) — хлебная крошка на исходном скрине показывает только название воркфлоу,
      в кроп она не попадает вовсе.

      Дословный текст промпта на этом кадре не виден (канвас показывает только карточки узлов, а не их
      открытые настройки) и здесь намеренно не приводится прозой — именно так получалось расхождение «текст
      слайда против того, что показывает скрин», которое поймал владелец. Текст промпта с его собственным
      настоящим скрином панели настройки — на следующем слайде (n11a).'
