# Что у Семинара 6 своё. Код сборщика — общий, в `tools/seminar-build/`.
#
# Эта дека ПРИНЯТА владельцем и проведена в двух группах: любое изменение её
# вида — регрессия, а не улучшение. Поэтому таблицы ниже перенесены из
# прежнего `rendered/build_sem06.py` один в один, включая записи, которые на
# новых занятиях сделаны иначе.

seminar: "06"
issue: 225

langs:
  ru:
    slides: slides
    deck: deck.yaml
    out: sem-06.pptx
    blocks: [Мостик, MCP, Субагент, Сборка]
  en:
    slides: slides-en
    deck: deck.en.yaml
    out: sem-06-en.pptx
    # Прозаическую шапку английского манифеста неоткуда вывести и нельзя
    # перенести с русского (кириллица в английском артефакте) — она лежит
    # отдельным файлом, и его отсутствие это отказ, а не пустая шапка.
    head: deck-head.en.yaml
    blocks: [Bridge, MCP, Subagent, Wrap-up]

# Границы блоков: [от, до, индекс блока, индекс ступени или null].
# Прежний сборщик выводил их по опорным приёмам (пять развилок + последняя
# `recap_table`) — защита от того, что параллельные сессии сдвинут номера.
# Замерено на этой деке: вывод по якорям даёт РОВНО эту таблицу, строка в
# строку. Вывод снят, таблица осталась.
razmetka:
  n:
    rows:
      - [1, 5, 0, null]
      - [6, 28, 1, 0]
      - [29, 60, 2, 1]
      - [61, 64, 3, null]
    stages: [1, 2]

genres:
  hero_cover: cover
  section_divider_macro: divider
  question_with_option_cards: question
  reflection_question: question
  recap_table: axis_table
  criteria_checklist_and_boundary: criteria
  base_and_edge: base_edge

pattern_role:
  question_with_option_cards: question
  reflection_question: question
  answer_breakdown_table: formula
  failure_vignette: formula
  failure_vignette_table: formula
  criteria_checklist_and_boundary: formula
  evidence_table_with_gap: formula
  lecture_map: fact
  base_and_edge: fact

vote_patterns: [question_with_option_cards]

divider_patterns: [section_divider_macro]

table_style:
  # Таблица свидетельств с честным пробелом: тиловый акцент вместо золотого и
  # ОТКЛЮЧЁННАЯ автоподсветка — целевой строки в ней нет, подсвечивать нечего.
  evidence_table_with_gap:
    accent: MID
    highlight: none
    label: свидетельства

# «Золото ≥1× на слайде» не выполнялось на четырёх repo-state/рекап-слайдах и
# на карте занятия: единственная цитата на них начинается с «ёлочки» и потому
# опознавалась как тихая реплика лектора. По содержанию это не реплика
# вразрез, а ЕДИНСТВЕННАЯ подпись-итог слайда — работа формулы, не речи.
# n64 несёт два блока-цитаты; золотой становится только последний.
gold_quote_sids:
  n02: all
  n05: all
  n61: all
  n62: all
  n64: last

quote_role_force:
  n28: formula

# На n16 схема (лестница приоритета) рисовалась первым блоком — глаз читал
# цветной список, хотя заголовок обещает собранный файл. Схема переносится
# ПОСЛЕ блоков: код читается первым, лестница-компаньон вторым.
fig_after: [n16]

deck_yaml:
  central_question_patterns: [reflection_question]
  axis_pattern: recap_table

# ── Сторожа и генераторы ────────────────────────────────────────────────────

notes:
  # Калибровка объёма заметок ЭТОГО занятия — своя, не курсовая: к концу
  # цепочки Семинара 6 содержательный слайд калиброван на 400–600, опорный на
  # 500–750. Класс «обложка» здесь не объявлен намеренно: у этой деки обложка
  # судится коридором содержательного, как судилась всё производство.
  bands:
    разделитель: [250, 450]
    голосование: [300, 550]
    содержательный: [400, 600]
    опорный: [500, 750]
  # Опорные экраны — ЗАКРЫТЫЙ список с причиной на каждый.
  anchor:
    n08: "схема «где что стоит» — расставляет фигуры, которые одностраничник разбирает по частям"
    n09: "одностраничник MCP — блок возвращается к нему трижды (n16, n17, n25)"
    n12: "разбор пяти способов доступа — пять карточек, у каждой своя цена и своя граница"
    n30: "база ступени субагента со схемой контекстов"
    n31: "одностраничник субагента — блок возвращается к нему четырежды (n29, n34, n36, n48)"
    n39: "практика: читатель раскладывает задачу сам, и разбор раскладки лежит здесь же"
    n58: "провал-самоизобличение — единственная опора кейса 6, которую читатель проверяет сам"

svodka:
  case_divider_patterns: [section_divider_macro]
  nachalo_default: "развилка, база, одностраничник"
  zal:
    question_with_option_cards: голосования
    cobuilding_config_reveal: со-сборка и практика
    reflection_question: вопрос занятия и обсуждение

sluzhebnoe:
  timing_patterns: [hero_cover, section_divider_macro, lecture_map, recap_table]
  razdely: ["МОСТИК", "MCP", "СУБАГЕНТ", "СБОРКА"]
