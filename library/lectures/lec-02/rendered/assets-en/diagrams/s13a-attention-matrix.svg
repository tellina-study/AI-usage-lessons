<rect x="200" y="495" width="60" height="60" fill="#1C7293"/><text x="230" y="532" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.2</text>
<rect x="270" y="495" width="60" height="60" fill="#065A82"/><text x="300" y="532" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.3</text>
<rect x="340" y="495" width="60" height="60" fill="#065A82"/><text x="370" y="532" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">0.3</text>
