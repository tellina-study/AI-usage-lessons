  visual:
    pattern: problem_scenario
    primary: 'Четыре шага нумерованным списком: вторая роль заведена, обе получают одну правку, обе возвращают
      PASS в границах своей задачи, заказчик находит сценарий между ними. Внизу выделенная строка: оба
      PASS правдивы по отдельности, промежуток не проверял никто.'
    backup: Источник — section-2-subagent.md §A.3 «Сцена» + section-2-subagent-part1b.md/-part1c.md n58
      «Речь», по содержанию; текст шагов слегка сжат в круге правок (issue 225, замечания 3/5) без потери
      фактов — ради читаемости за пять секунд.
- id: n59
  file: slides/n59-vopros-chto-delat-s-promezhutkom.md
  type: reflection_question
  duration_min: 1.0
  assertion: Два PASS честные в границах своей роли, и баг, который не поймал ни один из них — зал выбирает,
