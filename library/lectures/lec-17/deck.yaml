    section: 1
    chapter_ref: "§1.0 — общий список семи критериев"
    failure_bucket: strict_in
    media: true
    media_kind: "нумерованный список 1-7 с иконками per критерий"

  - id: s05
    file: slides/s05-criteria-1-2.md
    type: comparison
    duration_min: 2.5
    assertion: "Закрытая петля с быстрой обратной связью — AI работает; открытая среда с распределённым сдвигом — AI системно проваливается."
    learning_goal: "Критерий 1 (закрытая/открытая) + 2 (обучающие данные); two-column cross-industry cases"
    section: 1
    chapter_ref: "§1.1 — критерии 1 + 2"
    failure_bucket: strict_in
    media: true
    media_kind: "two-column compare: закрытая петля (See & Spray / Aidoc / склад) vs открытая среда (Zillow / Monarch / Cruise)"
    image_slot: see-and-spray

  - id: s06
    file: slides/s06-criteria-3-4.md
    type: comparison
    duration_min: 2.5
    assertion: "AI окупается на повторяемых задачах с низкой ценой ошибки — и опасен там, где цена ошибки умножается на большой радиус разрушения."
    learning_goal: "Критерий 3 (повторяемость+объём) + 4 (цена ошибки+blast radius)"
    section: 1
    chapter_ref: "§1.2 — критерии 3 + 4"
    failure_bucket: strict_in
    media: true
    media_kind: "blast-radius таблица: Copilot 1 dev → CrowdStrike 8,5 млн устройств (gold highlight на 8,5 млн)"
    image_slot: crowdstrike

  - id: s07
    file: slides/s07-criteria-5-6.md
    type: comparison
    duration_min: 2.5
    assertion: "Без быстрого эталона и без объяснимости AI остаётся на advisory — даже когда злого умысла нет, чёрная коробка разрушает доверие."
    learning_goal: "Критерий 5 (эталон/Pearl) + 6 (объяснимость+аудит); Apple Card reframed (explainability, не bias)"
