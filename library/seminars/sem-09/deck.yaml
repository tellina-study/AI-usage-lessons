      ДОСЛОВНЫЕ ПРОГОНЫ — `stend/zamery-k5-povtorno/README.md`, Замер Б, exec 809 и exec 816 (из десяти
      повторов 809–818), перенесены без правки. 809 — типичный ответ ветки «через руководителя». 816 —
      единственный из десяти, где модель заменяет сумму клиента «3000 рублей» на «более 3000 рублей» в
      самом тексте ответа.

      ПОЧЕМУ ЭТОТ ПРОГОН ВЫНЕСЕН ОТДЕЛЬНО ОТ ТАБЛИЦЫ n60: там граница правила — одна строка среди трёх,
      здесь — отдельный такт, потому что находка глубже, чем «ответ неверный десять раз из десяти». Exec
      816 показывает механизм этой неверности: модель не просто применяет порог неправильно, она переформулировала
      то, что написал клиент, под то решение, которое уже приняла. Это не разброс и не нестабильность
      — это подмена входных данных под готовый вывод (канон §8.11: находка, которая сильнее ожидавшейся).

      ЦЕНА НАЗВАНА КАЧЕСТВЕННО, без нового числа поверх уже данных в n60: на С8 этот же порог в коде устранил
      именно эту ошибку — сравнение не требует отдельного замера, оно прямое: тот же порог, тот же код,
