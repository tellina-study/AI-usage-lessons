      pt занимала 2,79″ из отведённых 2,81″ ещё ДО фигуры (`build.py`, замер до правки). С фигурой (натуральная
      высота ~3,81″ при текущем кропе) сумма естественных высот четырёх блоков (интро-строка 1,08″ + таблица
      3,81″ + находка 2,63″ + фигура 3,81″ — `DEBUG`-замер `tools/seminar-build/roles.py:compose()`) вчетверо
      превышала отведённые 5,89″, и пропорциональное сжатие уводило таблицу ниже пола ступени 2 (9 pt,
      2,30″) — `build.py` возвращал ПЕРЕПОЛНЕНИЕ (×3) и ЗА КРАЕМ ПОЛОТНА (композиция кончалась на 7,42″
      при высоте полотна 7,50″, нижний блок не виден). Снята вводная строка «20 тестовых пар: ...» целиком
      (её факты — состав 10/10, 3 близкие темы — дублируются в колонках таблицы, см. строку TF-IDF «2
      ложных срабатывания на близких темах»); «Честная находка» сжата с 3 развёрнутых предложений до 3
      компактных — все три находки (TF-IDF не спасает порог, jev обошёл модель-судью, обе платные схемы
      дешевле цента) сохранены, длина текста ~47% от исходной. После обеих правок — без ПЕРЕПОЛНЕНИЯ и
      без ЗА КРАЕМ ПОЛОТНА: таблица садится на пол ступени 2 (9 pt, «НА ДНЕ КЕГЛЯ» — ниже приём не умеет,
