# Первый работающий процесс
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n02    2.50 мин
#   Теория     n03–n05    6.50 мин
#   Кейсы      n06–n28   58.50 мин
#   Ось        n29–n30    5.50 мин
#   Выход      n31–n32    4.50 мин
#   ИТОГО                  77.50 мин при слоте 90

deck:
  seminar_number: 7
  title: Первый работающий процесс
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 77.5
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: null
  language: ru
  slide_count: 32
  axis: null
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: 'Первый работающий процесс: триггер, шаг модели, запись результата'
  learning_goal: Обложка. Называет занятие и его место в дуге.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок, тонкая золотая полоса, строка подзаголовка. Номера
      семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Круг 5, пересборка по переопределённой цели (KONTSEPTSIYA-7-12.md): семинар учит технике
      на уровне блоков инструмента. Прежние четыре деки в slides-v3-arhiv/ и slides-v4-arhiv/.'
- id: n02
  file: slides/n02-mostik.md
  type: problem_scenario
  duration_min: 2.0
  assertion: На прошлых занятиях собирали исполнителя; теперь собираем процесс, который им пользуется
  learning_goal: Шов с дугой С4–С6 и постановка задачи занятия. Знать прошлые занятия для участия не требуется.
  visual:
    pattern: problem_scenario
    primary: 'Две строки одна под другой: что собирали раньше (агент с правами, памятью, инструментами)
      и что собираем теперь (процесс: триггер, шаги, результат). Под ними золотая строка с задачей занятия.

      '
    backup: 'Форму шва взять с sem-06/slides/n02: без методических комментариев, всё нужное печатается
      на экране. Знать С4–С6 для участия не требуется (правило С5 n01).'
- id: n03
  file: slides/n03-teoriya-trigger-i-shagi.md
  type: taxonomy_compare_table
  duration_min: 2.0
  assertion: Процесс начинается с триггера и состоит из шагов; триггеры бывают трёх родов, и выбор между
    ними — первое проектное решение
  learning_goal: 'Теория 1 из 3, инструменто-агностичная: устройство процесса и роды триггеров. Имена
    блоков n8n даются справа, но главное слева.'
  visual:
    pattern: taxonomy_compare_table
    figure: teoriya-protsess-trigger-shagi.png
    primary: 'Схема сверху: триггер, затем три шага подряд, стрелками показано, что выход одного становится
      входом следующего. Под схемой таблица трёх родов триггера с примерами блоков n8n в правой колонке.

      '
    backup: 'Инструменто-агностичный слой идёт первым по §3 концепции: сначала устройство, потом его воплощение
      в конкретном инструменте.'
- id: n04
  file: slides/n04-teoriya-dannye-spiskom.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Между узлами ходит список элементов, и узел выполняется по разу на каждый элемент — отсюда
    половина странностей, которые встретятся дальше
  learning_goal: Теория 2 из 3, несущая. Без этого правила все четыре кейса читаются как магия, а вопросы
    «почему оно сделало это трижды» не разбираются.
  visual:
    pattern: mechanism_node_graph
    figure: teoriya-dannye-spiskom.png
    primary: 'Схема: слева список из трёх элементов, справа один узел, и от него три стрелки вниз — три
      выполнения. Под схемой правило крупно золотой строкой. Ниже — короткая строка про Execute Once.

      '
    backup: 'Главное теоретическое правило занятия. Из него прямо выводятся: цикл не нужен в большинстве
      случаев (С7), «нода выполнилась N раз» (С8), потеря данных при слиянии (С9). Произносится один раз
      здесь и дальше только вспоминается.'
- id: n05
  file: slides/n05-teoriya-shag-modeli-i-vyrazheniya.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Шаг модели — обычный узел: на вход данные, на выход данные; ответ приходит текстом и уходит
    наружу по сети, и из этих двух фактов следуют два сегодняшних кейса'
  learning_goal: Теория 3 из 3. Снимает ореол с шага модели и заранее объясняет, откуда возьмутся проблемы
    кейсов 2 и 3. Плюс синтаксис выражений — он понадобится сразу.
  visual:
    pattern: answer_breakdown_table
    primary: 'Две колонки: «что это значит» и «что из этого следует сегодня». Две строки — про текстовый
      ответ и про сетевой вызов. Под таблицей — блок про выражения с двумя строками синтаксиса и предупреждением
      про имена узлов.

      '
    backup: 'Связка теории с кейсами 2 и 3 сделана заранее и намеренно: когда проблема возникнет, она
      будет узнана, а не предъявлена как сюрприз.'
- id: n06
  file: slides/n06-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Их всё равно потом руками в таблицу перекладывают» — постановка первого кейса
  learning_goal: Дивайдер кейса 1. Называет наблюдаемую работу, не инструмент (правило А2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Внизу дорожка четырёх кейсов занятия, первый подсвечен.

      '
    backup: 'Сквозной пример дуги — обработка входящей заявки (KONTSEPTSIYA-7-12.md §7). Выбран вместо
      бота поддержки: бот не создаёт повода для циклов, слияния и сабфлоу, и ровно эти ступени в курсах
      рынка систематически пропускают.'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Из скольких узлов соберётся процесс, который решает задачу полностью — первое решение зала
  learning_goal: Первое голосование. Зал почти всегда отвечает «три»; разбор показывает, чего в трёх узлах
    не хватает, чтобы это было решение, а не показ.
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху постановка двумя строками с явным требованием к результату. Ниже вопрос в золотой
      рамке, четыре карточки равной ширины.

      '
    backup: 'Вводная про устройство идёт ПОСЛЕ разбора: назови блоки сейчас — и считать будет нечего.
      Слово «полностью» в вопросе стоит намеренно, оно и есть вся задача.'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: 'Три узла дают запись, но не решение: тема будет какой угодно, срочности не будет вовсе,
    а проверить результат можно только походом в таблицу'
  learning_goal: 'Разбор сразу за вопросом. Главное: разница между «заработало» и «можно поручиться» —
    это два узла, справочник и экран результата.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в три колонки на четыре строки. Под ней золотая строка про то, чего не хватает трём
      узлам.

      '
    backup: 'Пять узлов — это проверенная на стенде стадия 1 (`stend/stage-1.json`), а не оценка: форма,
      извлечение, справочник, запись, экран результата.'
- id: n09
  file: slides/n09-k1-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 7.0
  assertion: 'Пять узлов: форма, извлечение со схемой-перечислением, справочник, запись строки, экран
    результата — и вся дорога видна в одном окне'
  learning_goal: 'Такт «наше решение» кейса 1, собирается вживую. Главное, что уносит зал: модель предлагает,
    справочник решает, а результат показывается там, где его и так смотрят.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-pyat-uzlov.png
    screenshot: SCREENSHOT-TODO-k1-holst.png
    primary: 'Сверху принципиальная схема пяти узлов. Под ней таблица параметров по узлам. Справа место
      под снимок холста n8n.

      '
    backup: 'ЭКРАН ДЕМО. Процесс на стенде собран и проверен прогонами (`stend/stage-1.json`); снимок
      холста ещё не снят — съёмка интерфейса требует входа в UI, у производства есть только ключ управляющего
      API. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12 (n8n 2.42.7): четыре прогона из четырёх — тема и срочность заполнены
      и из справочника, включая прогон на бессмысленном вводе («ывавыав» → другое / не указано).'
- id: n10
  file: slides/n10-k1-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: 'Три переносимых правила: машинный выход — в закрытый список; гарантия двухуровневая; наблюдаемость
    с первого дня'
  learning_goal: Обобщающий такт кейса 1. Принцип формулируется так, чтобы переносился на любой оркестратор;
    имена блоков — одной строкой внизу.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Сверху одна строка про класс задачи. Ниже три правила списком, каждое — принцип и его следствие.
      Внизу одна строка «как это зовётся в инструментах».

      '
    backup: 'Обобщение требует владелец (2026-10-12): практики на кейс, а не перечень блоков. Класс задачи
      назван явно, чтобы пример читался как частный случай.'
- id: n11
  file: slides/n11-k1-problemy.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Схема гарантирует форму, а не смысл; гарантия действует не всегда; справочник в двух местах
    расходится
  learning_goal: Такт проблем кейса 1 — нюансы любого инструмента, с документированными границами гарантии
    структурированного вывода.
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки: нюанс и чем он проявляется. Под ней золотая строка с границей гарантии,
      как её формулирует сам поставщик.

      '
    backup: Три верхние строки — из документации OpenAI по структурированному выводу (гарантия только
      в строгом режиме; отказ по безопасности приходит отдельным полем; обрыв по лимиту даёт невалидный
      ответ; формат гарантируется, смысл нет). Нижние две — находки производства на стенде.
- id: n12
  file: slides/n12-k2-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «В заявке две темы, а в таблице одна» — наблюдаемый результат первого кейса
  learning_goal: Дивайдер кейса 2. Проблема видна прямо из того, что собрали минуту назад, и на том же
    экране результата.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Дорожка четырёх кейсов, второй подсвечен.

      '
    backup: 'Опирается на прогон кейса 1: заявка «перенести занятие и как оплатить» вернула одну тему.
      Проверено на стенде, прогоны 2 и 4.'
- id: n13
  file: slides/n13-k2-vopros.md
  type: question_with_option_cards
  duration_min: 3.0
  assertion: Что должно попасть в тему, когда в заявке их две — второе решение зала
  learning_goal: Второе голосование. Все четыре варианта встречаются в живых системах, и выбор между ними
    — не вкус, а решение про то, кто разбирает остаток.
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху текст заявки целиком, одной строкой в рамке. Ниже вопрос в золотой рамке, четыре
      карточки равной ширины.

      '
    backup: Карточки описаны поведением, не именами блоков. Третий вариант — задел Семинара 9 (несколько
      строк из одной заявки).
- id: n14
  file: slides/n14-k2-razbor.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: 'Четыре ответа различаются не сложностью сборки, а тем, кто разбирает остаток: никто, человек,
    следующий шаг или тот, кто читает пометку'
  learning_goal: 'Разбор сразу за вопросом. Ключ: выбор про то, кто доделывает работу за процессом, и
    «другое» — честный ответ, а не отказ.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в три колонки на четыре строки. Под ней золотая строка про то, что эти четыре ответа
      на самом деле различают.

      '
    backup: Третий вариант (две строки из одной заявки) — задел Семинара 9; здесь он назван и отложен
      явно, а не промолчан.
- id: n15
  file: slides/n15-k2-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: 'Берём «другое» плюс пометку: справочник получает четвёртое значение и отдельный столбец
    «ещё в заявке», и обе темы остаются видны'
  learning_goal: Такт «наше решение» кейса 2. Собирается вживую на четырёх трудных заявках; на экране
    результата видно, что решил справочник и что осталось в пометке.
  visual:
    pattern: mechanism_node_graph
    figure: k2-shema-trudnye-zayavki.png
    screenshot: SCREENSHOT-TODO-k2-vocabulary.png
    primary: 'Сверху та же схема пяти узлов, подсвечен третий — справочник. Под ней таблица четырёх трудных
      заявок и того, что получилось. Справа место под снимок узла справочника.

      '
    backup: 'ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12 (n8n 2.42.7), стадия 2, 10 строк таблицы: ни одной пустой
      темы, ни одной темы вне справочника — включая заявку из одного слова «ок» и бессмысленный ввод.
      Заявка с тремя темами дала «оплата» + пометку «перенос занятия · другое».'
- id: n16
  file: slides/n16-k2-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: «Не знаю» — законное значение, а не пустая клетка; многозначность входа решается до сборки;
    у очереди на разбор есть владелец и метрика
  learning_goal: 'Обобщающий такт кейса 2. Принцип переносимый: граница между «автоматика решила» и «автоматика
    передала человеку» проектируется явно.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три правила списком. Внизу одна строка «как это зовётся в инструментах».

      '
    backup: 'Приём «законный отказ от классификации» в литературе зовётся воздержанием (abstention): система,
      которая умеет сказать «не знаю», дороже в разработке и дешевле в эксплуатации.'
- id: n17
  file: slides/n17-k2-problemy.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Доля «другого» подозрительна и когда растёт, и когда падает; справочник нужно версионировать;
    «другое» без исходного текста бесполезно
  learning_goal: 'Такт проблем кейса 2 — нюансы любого инструмента. Главный: падение доли «другого» читают
    как улучшение, а это может быть обратное.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки: нюанс и чем он проявляется. Под ней золотая строка про падение доли
      «другого».

      '
    backup: 'Нижняя строка — находка прогонов на стенде: заявка с тремя темами вернула главную и пометку,
      но порядок «главной» ничем не задан.'
- id: n18
  file: slides/n18-k3-divider.md
  type: case_divider_fact
  duration_min: 0.5
  assertion: Понедельник, таблица, двое суток пропуска — дивайдер констатирует факт, а не передаёт чью-то
    реплику
  learning_goal: 'Дивайдер кейса 3. Форма сломана намеренно: два предыдущих дивайдера были репликами,
    третий — голая констатация, иначе зал предсказывает экраны (§4.2).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним одна приглушённая строка. Дорожка кейсов, третий подсвечен.

      '
    backup: 'Намеренный сбой ритма форм дивайдеров (§4.2): кейсы 1 и 2 входили репликой, этот входит фактом.
      Фрагмент таблицы с дыркой показывается на стенде вживую, на слайд не выносится — экран на полминуты.'
- id: n19
  file: slides/n19-k3-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Что должен делать узел, когда вызов не удался — третье решение зала
  learning_goal: Третье голосование. Все четыре карточки — реальные значения настроек узла; это выясняется
    на разборе и обычно становится сюрпризом.
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке сверху, четыре карточки равной ширины. Над вопросом одна строка контекста:
      что стоит дальше по процессу.

      '
    backup: 'Вводная не нужна: зал выбирает поведение, а не блок. Что каждая карточка — это готовая настройка,
      сообщается на разборе.'
- id: n20
  file: slides/n20-k3-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: Все четыре ответа — это значения настроек On Error и Retry On Fail в карточке любого узла;
    по умолчанию стоит Stop Workflow
  learning_goal: 'Разбор сразу за вопросом. Главный поворот: зал голосовал за поведение и, не зная того,
    выбирал из готового списка настроек инструмента.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки: имя настройки — поведение — когда уместно. Над таблицей одна строка-поворот.
      Настройка по умолчанию выделена.

      '
    backup: Четыре значения On Error плюс Retry On Fail — реальные настройки узла n8n, проверены по справочнику
      нод. Continue = Continue (regular output). Четыре значения On Error и Retry On Fail сверены со стендом
      (n8n 2.42.7); поведение `continueErrorOutput` проверено прогоном 6.
- id: n21
  file: slides/n21-k3-reshenie-demo.md
  type: mechanism_node_graph
  duration_min: 6.0
  assertion: 'Retry On Fail плюс выход error: заявка идёт в ту же таблицу со status = not_parsed и на
    свой экран — ни одна не теряется, и отказ видно сразу'
  learning_goal: 'Такт «наше решение» кейса 3, собирается вживую. Отказ демонстрируется честно: ключ провайдера
    портится на глазах у зала.'
  visual:
    pattern: mechanism_node_graph
    figure: k3-shema-dve-vetki.png
    screenshot: SCREENSHOT-TODO-k3-error-output.png
    primary: 'Схема: от узла извлечения два выхода — успешный в справочник, таблицу и экран, error в ту
      же таблицу с пометкой и свой экран. Под схемой две настройки. Справа место под снимок карточки настроек
      узла.

      '
    backup: 'ЭКРАН ДЕМО. Процесс на стенде собран и проверен; снимок карточки настроек ещё не снят — съёмка
      интерфейса требует входа в UI. Отказ для демонстрации вызывается порчей ключа провайдера — мгновенный
      и воспроизводимый отказ, в отличие от ожидания настоящего таймаута. В производстве тот же отказ
      воспроизведён подменой имени модели: поведение одного класса. ПРОВЕРЕНО НА СТЕНДЕ 2026-10-12, прогоны
      5 и 6: успешная ветка пишет три столбца; при испорченной модели журнал показал ТРИ попытки НА УЗЛЕ
      МОДЕЛИ, элемент ушёл в выход `error` с исходными данными формы плюс полем ошибки, строка «не разобрано»
      в таблице появилась, а статус прогона — success. Файл — `stend/stage-3.json`.'
- id: n22
  file: slides/n22-k3-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.5
  assertion: Повтор лечит только временные отказы; у отказа должен быть адресат; технический успех и деловой
    — разные вещи
  learning_goal: Обобщающий такт кейса 3. Три правила надёжности, которые живут в любой распределённой
    системе, не только в оркестраторе.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три правила списком. Внизу одна строка «как это зовётся в инструментах».

      '
    backup: Приём «очередь неразобранного» в индустрии зовётся dead letter queue; имя даётся залу, потому
      что встретится им в любой очереди сообщений.
- id: n23
  file: slides/n23-k3-problemy.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Повтор безопасен только на идемпотентной операции; повтор на каждом слое множит нагрузку;
    задержки нужны с разбросом; бюджет повторов зажат в коде
  learning_goal: 'Такт проблем кейса 3 — нюансы любого инструмента, с числом из инженерной практики: три
    попытки на пяти слоях дают 243-кратную нагрузку.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки: нюанс и чем он проявляется. Под ней золотая строка с числом про умножение
      нагрузки по слоям.

      '
    backup: 'Идемпотентность, лавина повторов, задержка с разбросом, бюджет повторов и «повторять в одном
      месте» — из библиотеки инженерных практик Amazon (Timeouts, Retries, and Backoff with Jitter). Число
      243 — её собственный пример: три попытки на каждом из пяти слоёв.'
- id: n24
  file: slides/n24-k4-divider.md
  type: case_divider_contradiction
  duration_min: 0.5
  assertion: На холсте правка есть, результатов по ней нет — оба утверждения верны одновременно
  learning_goal: Дивайдер кейса 4. Форма — два коротких утверждения, которые противоречат друг другу и
    оба верны; третий дивайдер был фактом, второй репликой, ритм не повторяется (§4.2).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, заголовок крупно, под ним две приглушённые строки подряд. Дорожка кейсов, четвёртый
      подсвечен.

      '
    backup: 'Намеренно не формулируется как чья-то ошибка: оба утверждения верны, в этом вся задача кейса.'
- id: n25
  file: slides/n25-k4-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Почему боевые прогоны идут по старому варианту — четвёртое решение зала
  learning_goal: 'Четвёртое голосование, и единственное, где правильных карточек две. Вводная идёт ПОСЛЕ:
    назови Publish заранее — вопроса не останется.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, четыре карточки. Без контекстной строки: весь контекст на предыдущем
      экране.

      '
    backup: Вводная про черновик и Publish идёт следующим экраном — иначе ответ выдан вместе с вопросом
      (§5 концепции).
- id: n26
  file: slides/n26-k4-razbor.md
  type: answer_breakdown_table
  duration_min: 3.0
  assertion: Сценарий автосохраняется в черновик постоянно, кнопки «Сохранить» нет; в боевой режим правка
    уходит отдельным действием Publish, и боевые прогоны исполняют опубликованную версию
  learning_goal: 'Вводная и разбор одним экраном: механика названа, и из неё сразу видно, какие две карточки
    верны и почему это одно и то же.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Сверху три строки механики. Ниже таблица четырёх карточек с вердиктом. Строка про исчезнувшее
      слово «активировать» — отдельной плашкой.

      '
    backup: Publish заменил Activate в n8n 2.x; слова «активировать» в интерфейсе больше нет. Проверено
      по справочнику; перед занятием сверить с версией стенда.
- id: n27
  file: slides/n27-k4-praktiki.md
  type: criteria_checklist_and_boundary
  duration_min: 2.0
  assertion: Среда редактирования и среда исполнения — всегда разные; проверка руками не покрывает путей,
    которые есть только в бою; работающая версия обязана быть опознаваемой и откатываемой
  learning_goal: Обобщающий такт кейса 4. Три правила про разрыв между тем, что видно, и тем, что работает
    — верны для любого инструмента с редактором.
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Три правила списком. Внизу одна строка «как это зовётся в инструментах».

      '
    backup: Различие «черновик — опубликованное» есть у каждого инструмента с визуальным редактором; у
      LangFlow его нет, и это ещё одна граница класса.
- id: n28
  file: slides/n28-k4-problemy.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Ручной прогон ведёт себя иначе боевого; обработчик ошибок ручным прогоном не проверяется;
    экспорт сценария уносит ссылки на учётные данные; холст редактирует один человек
  learning_goal: 'Такт проблем кейса 4 — нюансы любого инструмента. Включает единственный пункт про безопасность:
    что уезжает вместе с файлом сценария.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки: нюанс и чем он проявляется. Под ней золотая строка про экспорт и
      учётные данные.

      '
    backup: 'Строка про экспорт — прямое следствие производства: студенческий файл пришлось собирать со
      снятыми привязками, иначе в нём уезжали ссылки на учётные данные и таблицу этого стенда.'
- id: n29
  file: slides/n29-kc-vopros.md
  type: question_with_option_cards
  duration_min: 2.5
  assertion: Нижняя ступень лестницы — «одного вызова достаточно», и вопрос в том, по какому признаку
    её видно
  learning_goal: Концептуальный разбавитель, один на занятие. Техника разбавляется решением «строить или
    не строить», а не рассуждением о роли человека.
  visual:
    pattern: question_with_option_cards
    primary: 'Короткая постановка двумя строками. Вопрос в золотой рамке, четыре карточки.

      '
    backup: Единственный неинструментальный экран занятия. Концептуальных вопросов по §5 концепции допускается
      один-два, не больше.
- id: n30
  file: slides/n30-kc-razbor.md
  type: criteria_checklist_and_boundary
  duration_min: 3.0
  assertion: Процесс оправдан, когда поток растёт, типов входа становится больше или результат уходит
    дальше без человека; объём сам по себе признаком не является
  learning_goal: 'Разбор концептуального вопроса. Главное: «мало» — не критерий, критерий — куда уходит
    результат.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Две группы признаков друг под другом: не надо / надо. Внизу граница в прямой форме — одна
      строка.

      '
    backup: 'Ответ на карточку «спросить модель один раз» даётся прямо: это нижняя ступень лестницы, и
      она законная.'
- id: n31
  file: slides/n31-vyhod.md
  type: outcome_artifact
  duration_min: 2.5
  assertion: С занятия уносится файл процесса из пяти узлов, который встаёт в свой n8n одним импортом
  learning_goal: 'Выход занятия предъявляется как артефакт: что собрано, из чего, и что с этим делать
    дома. Условие сквозной линии С7→С12.'
  visual:
    pattern: outcome_artifact
    figure: vyhod-shema-protsess.png
    primary: 'Итоговая схема процесса целиком: шесть узлов с номерами шагов, две ветки. Рядом карточка
      файла с именем и тремя шагами импорта.

      '
    backup: 'Файл СОБРАН И ПРОВЕРЕН на стенде 2026-10-12 (n8n 2.42.7): все четыре стадии выложены через
      управляющий API, опубликованы и прогнаны настоящими отправками формы; в таблице 10 строк, ни одной
      пустой темы и ни одной вне справочника. Студенческий файл — та же стадия 4 со снятыми привязками
      к учётным данным и таблице этого стенда. Источник — `stend/sborka.py`.'
- id: n32
  file: slides/n32-mostik-k-s8.md
  type: bridge_forward
  duration_min: 2.0
  assertion: 'Процесс пока идёт одной дорогой: все заявки через один шаг; на Семинаре 8 появляются маршруты
    и проверка перед записью'
  learning_goal: Замыкание занятия и постановка следующего. Ступень называется своим именем, без обещания
    «будет интереснее».
  visual:
    pattern: bridge_forward
    primary: 'Схема текущего процесса бледно, поверх неё — развилка пунктиром в месте, где на С8 появится
      ветвление. Снизу три строки про следующее занятие.

      '
    backup: 'Ступень С8 по §6 концепции: ветвление и слияние, проверка результата шага. Не обещать сюда
      ни агентов, ни поиска по документам.'
