# library/lectures/lec-03/deck.en.yaml  —  EN translation (issue #172)
#
# English deck structure for Lecture 3 "AI system architectures: agents, RAG, API"
# (v6.3-en, 67 slides). Translated from deck.yaml + deck-part2.yaml + deck-part3.yaml
# (RU source of truth, 3 parts). Render target: rendered/build_lec03_en.py.
# Per-slide `file:` points to slides-en/<same-basename>.md (RU basenames mirrored).
#
# SPLIT (600-line doc-size limit, same 3-way split as the RU trio): this file
# holds header + palette + motif + glossary + slides s01..s-task-extract
# (Section 0 + Section 1). deck-part2.en.yaml holds Section 2 + Section 3.
# deck-part3.en.yaml holds Section 4 + Section 5 + totals + metrics.
#
# v6.3 order (67 slides, issue #196/#185 rework): "classical base" slides,
# one per section, right after the divider, before the AI part; plus WAVE 1-3
# / D1 / D2 deepening slides (prompt formats + task patterns; RAG hybrid
# search, vector stacks, chunking, design-at-scale, RAG cases, deep research;
# fine-tune cost + eval; MCP-vs-API, agent frameworks, agent judgment, agent
# cases). Seven pre-rework EN-only slides (s05a, s22c, s22e, s23, s27, s28,
# s29) are not part of this order; their slides-en/*.md files are kept on
# disk but are no longer referenced from any deck part:
#   R0: s01(meme) s02 s02a s03 s04
#   R1: s04a(div) [s-classic-prompt] s05 s05c s05b s-fmt s06 s07 s08 s08a
#       s-task-assistant s-task-tone s-task-extract
#   R2: s09(div) [s-classic-rag] s10 s-rag-hybrid s-rag-stack s-rag-elastic
#       s-rag-chunk1 s-rag-chunk2 s-rag-chunk3 s-rag-design s-rag-cases
#       s-rag-research s11 s12 s13
#   R3: s13a(div) [s-classic-ft] s13b s-ft-cost s15 s17 s14 s16 s-ft-eval
#   R4: s18(div) [s-classic-agents] s19 s19b s20 s21 s-mcp-api s22
#       s-agent-frameworks s-agent-when s22a_multi s22b s22d s25 s24 s25b
#       s-agent-cases s23b s23c
#   R5: s25a(div) [s-classic-framework] s26 s27b s30 s31

deck:
  lecture_number: 3
  title: "Lecture 3. AI system architectures: agents, RAG, API"
  audience: "3rd-year engineering students (universal)"
  duration_min: 100
  central_question: "I have a task and access to an LLM. Which architecture should I choose — and when is the right answer \"not AI\"?"
  learning_outcomes: [LO7, LO4]
  language: en
  status: final
  version: v6.3-en
  source: chapter v5.0 finalized + WAVE D1 §1/§2 + WAVE D2 §3/§4 rework (#196)
  total_slides: 67
  curriculum_level: introductory
  deck_parts: [deck.en.yaml, deck-part2.en.yaml, deck-part3.en.yaml]

palette:
  primary_deep: "#21295C"
  primary_mid: "#065A82"
  primary_light: "#1C7293"
  teal: "#028090"
  gold: "#F0AB00"
  surface: "#F4F7FA"
  background: "#FFFFFF"

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 46
    slide_assertion: 27
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 120

glossary_lock:
  - AI system architecture
  - prompt
  - few-shot (examples in the prompt)
  - role in the prompt (tone, not accuracy)
  - chain of thought (step-by-step reasoning)
  - faithfulness (faithfulness of the reasoning)
  - delimiters
  - context engineering
  - context rot (degradation on long context)
  - retrieval-augmented generation (RAG)
  - retrieval (finding the relevant)
  - grounding (relying on a source)
  - observability
  - golden set (reference evaluation set)
  - fine-tuning
  - PEFT (LoRA/QLoRA)
  - distillation (a standalone technique, NOT a kind of fine-tuning)
  - catastrophic forgetting
  - structured output
  - tool use / function calling
  - prompt caching
  - MCP (Model Context Protocol)
  - agent (plan -> act -> check -> iterate)
  - workflow (predefined paths)
  - harness (the agent's equipment)
  - skill / subagent
  - presence paradox
  - prompt injection
  - least-privilege
  - ZDR (Zero Data Retention)
  - BAA (Business Associate Agreement)
  - protocol roles system/user/assistant (markup of "who is speaking")
  - chat template (assembling the list of roles into a flat token stream)
  - special markup token (ChatML `<|im_start|>` / Llama 4)
  - STI / role spoofing (Special Token Injection)
  - instruction hierarchy (learned priority of the system role, not a guarantee)
  - agentic RAG (adaptive RAG as the 2026 default)
  - reranker (reordering retrieval candidates)
  - hybrid (RAG for knowledge + PEFT for behavior — the 2026 norm)
  - multi-agent (p^n: reliabilities multiply)
  - slopsquatting (registering hallucinated package names)
  - rug-pull (swapping a trusted MCP server/package)
  - runaway cost (a loop with no success criterion and no budget)

# ─────────────────────────────────────────────────────────────────────────
# Section 0. Opening
# ─────────────────────────────────────────────────────────────────────────
slides:
  - id: s01
    file: slides-en/s01-air-canada-hook.md
    type: hero_cover
    section: "Section 0. Opening"
    duration_min: 3
    assertion: "\"Magic pill\": the myth that the model is more accurate if you ask it as an expert and complicate the prompt"
    learning_outcomes: [LO7]
    chapter_ref: "§Introduction [for-slide-s01]"

  - id: s02
    file: slides-en/s02-cover-roadmap.md
    type: cover
    section: "Section 0. Opening"
    duration_min: 0.5
    assertion: "Lecture 3. AI system architectures: agents, RAG, API"
    chapter_ref: "§Introduction [for-slide-s02]"

  - id: s02a
    file: slides-en/s02a-lecture-map.md
    type: assertion_visual
    section: "Section 0. Opening"
    duration_min: 1
    assertion: "The lecture route — six sections, one load-bearing line of architecture choice"
    chapter_ref: "§Introduction + Chapter map"

  - id: s03
    file: slides-en/s03-recap-lec2-bridge.md
    type: assertion_visual
    section: "Section 0. Opening"
    duration_min: 1.5
    assertion: "Four wrappers are built around a single model call — RAG stands on Lecture 2's embeddings"
    chapter_ref: "§Introduction [for-slide-s03]"

  - id: s04
    file: slides-en/s04-central-question-ladder.md
    type: assertion_visual
    section: "Section 0. Opening"
    duration_min: 3
    assertion: "The answer to \"which architecture?\" is a ladder of 6 rungs; climb only for a requirement"
    chapter_ref: "§Introduction [for-slide-s04]"

  # ─── Section 1. The prompt and its limits ───

  - id: s04a
    file: slides-en/s04a-section1-divider-prompt.md
    type: section_divider
    section: "Section 1. The prompt and its limits"
    duration_min: 0.3
    assertion: "Section 1 — what a single call with a good prompt can do, and where its ceiling is"
    chapter_ref: "§1 [for-slide-s05]"

  - id: s-classic-prompt
    file: slides-en/s-classic-prompt-base.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "Before the prompt, a task was posed with a precise specification and a deterministic program; a prompt is posing the task to a probabilistic system in natural language"
    learning_outcomes: [LO7]
    chapter_ref: "§1.0 [for-slide-s-classic-prompt]"
    subtype: classic_base

  - id: s05
    file: slides-en/s05-default-one-call.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "The default is a single call; the model knows only what's in the prompt plus its weights"
    chapter_ref: "§1.1 [for-slide-s05]"

  - id: s05c
    file: slides-en/s05c-protocol-roles.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 3
    assertion: "Protocol roles system/user/assistant != a role-persona; the system priority is a tendency (~63.8%), not a boundary; STI spoofs the role"
    learning_outcomes: [LO7]
    chapter_ref: "§1.2 [for-slide-s05c]"
    references: [openai-instruction-hierarchy, chatinject-iclr2026, geng-2025-ih]
    verify_day_of: true

  - id: s05b
    file: slides-en/s05b-prompt-structure.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 1.5
    assertion: "Prompt structure: separate the instruction, the context, the data (parallel to structured output)"
    chapter_ref: "§1.3 [for-slide-s05b]"

  - id: s-fmt
    file: slides-en/s-fmt-prompt-format.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "Frontier models tolerate the input format; forcing an output format on a reasoning task costs quality (reasoning tax: GSM8K 76.6% -> 49.3%)"
    learning_outcomes: [LO7]
    chapter_ref: "§1.9 [for-slide-prompt-format-intro]"
    subtype: format_matrix

  - id: s06
    file: slides-en/s06-chain-of-thought.md
    type: case_study
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "Chain of thought helps on chained tasks — it is not a \"better\" toggle"
    chapter_ref: "§1.4 [for-slide-s06]"
    references: [wei-2022-cot]

  - id: s07
    file: slides-en/s07-cot-faithfulness.md
    type: case_study
    section: "Section 1. The prompt and its limits"
    duration_min: 2.5
    assertion: "Chain of thought cannot be audited: faithfulness of Claude 3.7 ~25% / R1 ~39%; check the result, not the self-explanation"
    learning_outcomes: [LO7, LO4]
    chapter_ref: "§1.5 [for-slide-s07]"
    references: [anthropic-2025-reasoning-faithfulness]
    verify_day_of: true

  - id: s08
    file: slides-en/s08-context-engineering.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2.5
    assertion: "Minimal high-signal context is an engineering requirement (context rot = lost in the middle, L2)"
    chapter_ref: "§1.6 [for-slide-s08]"
    references: [anthropic-2025-context-engineering, chroma-2025-context-rot]

  - id: s08a
    file: slides-en/s08a-prompt-cheatsheet.md
    type: summary
    section: "Section 1. The prompt and its limits"
    duration_min: 1.5
    assertion: "Cheat sheet: how to build a prompt — 8 points, the compact form of Section 1"
    chapter_ref: "§1.8 [for-slide-s08a]"

  - id: s-task-assistant
    file: slides-en/s-task-assistant.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "An assistant with tools is a mini-ladder -- one-shot -> tool-use -> agent; the failure is jumping straight to an agent (the $4,200 loop, §4)"
    learning_outcomes: [LO7]
    chapter_ref: "§1.10 [for-slide-task-assistant]"
    subtype: task_case

  - id: s-task-tone
    file: slides-en/s-task-tone.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "Text in a given tone is few-shot from 3-5 samples; the boundary -- detectors can't be trusted (some under 80% accurate, +30% false positives on non-native writers)"
    learning_outcomes: [LO7, LO4]
    chapter_ref: "§1.10 [for-slide-task-tone]"
    subtype: task_case

  - id: s-task-extract
    file: slides-en/s-task-extract.md
    type: assertion_visual
    section: "Section 1. The prompt and its limits"
    duration_min: 2
    assertion: "\"Asking for JSON\" != \"specifying a contract\": two levels of control (prompt ~80% / decoder ~100%), three ways to specify a schema, the invariant \"valid JSON != correct data\""
    learning_outcomes: [LO7]
    chapter_ref: "§1.10 [for-slide-task-json-frame] · [for-slide-task-json-howto] · [for-slide-task-json-goodbad] · [for-slide-task-json-guarantee]"
    subtype: task_case

