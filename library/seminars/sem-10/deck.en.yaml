- id: n09
  file: slides-en/n09-k1-struktura-zamera.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: The same set of ten questions runs through all three actions at each of four base sizes —
    not a single result on this frame
  learning_goal: 'Beat S2 (measurement structure, canon forma-keysa-s-zamerom.md §1): the model and its
    settings, what varies in the measurement, an example question and the expected answer — BEFORE a single
    outcome number appears on the frame. Inserted between n07 (the audience question) and n10 (the summary)
    so the audience sees the test''s structure before the first number (cost of skipping it — slide 12
    of the Seminar 9 deck, the 2026-10-29 review: ''I don''t understand whether it answered right or wrong,''
    when three beats are compressed into one).'
  visual:
    pattern: measured_outcome_table
    primary: 'A tile with the model and settings on top, below it a table of "what varies" (base size,
      action), below that a tile with an example question and the correct answer. Neither "correct," nor
      "incorrect," nor a single accuracy/cost number is on this frame.

      '
    backup: 'A NEW BEAT, added by this edit (S2 canon: "the test''s structure, before any results," `forma-keysa-s-zamerom.md`
      §1). Before this edit, n10 opened straight into a summary of results — with no separate frame for
      the test''s structure before it, exactly the defect the canon names by quoting the owner about Seminar
      9''s slide 12.

      MODEL AND SETTINGS (C5): `openai/gpt-4o-mini` — forms the final answer from the passed-in text;
      `openai/text-embedding-3-small` — computes embeddings of the question and the documents for vector
      search. Both calls go through the same rig webhook (`s10-raw-openrouter`), with no explicitly set
      additional settings (temperature and other parameters are default): `stend/harness2.py`, `CHAT_MODEL`/`EMBED_MODEL`.
      The system instruction for the answer call is shown literally on n18 — it isn''t repeated here,
      to avoid duplicating a frame.

      CORPUS AND WHAT VARIES: `stend/measure/case1_measure.py`. Ten SberQuAD questions (an open question-answering
      dataset built on Russian Wikipedia articles with gold-standard labeling) — THE SAME set across all
      twelve "base size × action" combinations. The corpus at each size consists of ten documents carrying
      the answers to these questions (the "needle") plus random distractor documents up to the needed
      volume: 10 = needle only, 50/200/500 = needle + distractors.

      EXAMPLE — verbatim from `raw/case1-results.json`, qid `q1`, base size 10 (the same question is asked,
      unchanged, at all four sizes). The expected answer is the protocol''s own `reference_answer` field,
      not my own wording; `gold_doc_id` is the document that contains this answer. Case 1''s questions
      were rebuilt on 2026-11-02 (issue #311) with lexical_gap/exact_match/neutral stratification — the
      same classification already used in Case 3 (`corpus/corpus_case1.json`, the `questions` field, `lexical_class`);
      q1 belongs to the lexical_gap class (overlap_ratio 0.2 — the question and the document share few
      words in their base form).

      NOT A SINGLE RESULT ON THE FRAME (C2): no accuracy, no cost, no recall, not the word "error." The
      test''s structure in full — and it stops here.'
