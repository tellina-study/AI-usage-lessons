# Один вызов, цепочка, маршрут
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n03    5.50 мин
#   Ступень 1  n04–n22   34.50 мин
#   Ступень 2  n23–n42   34.75 мин
#   Ось        n43–n43    2.00 мин
#   ИТОГО                  76.75 мин при слоте 90

deck:
  seminar_number: 7
  title: Один вызов, цепочка, маршрут
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 76.75
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + один вопрос без карточек
    (устная оценка числа) + механика на примерах; живого терминала нет
  cover_hook: null
  central_question: null
  language: ru
  slide_count: 43
  axis: 'Верный ответ — нигде; вопрос занятия переезжает на уровень выше: какому шагу процесса модель
    нужна, а какому не нужна'
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Первое занятие дуги про процессы на больших языковых моделях — поверх агентов, которых собирали
    на предыдущих занятиях
  learning_goal: Обложка называет занятие и его место в курсе. Содержания кейсов не касается.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный центрированный заголовок, тонкая золотая полоса, под ней
      одна строка подзаголовка. Номера семинара на экране нет (решение владельца, sem-06/qa/oblozhka-bez-nomera.md).

      '
    backup: 'Четвёртый круг производства (issue 233). Структура занятия пересобрана по указанию владельца:
      каждый кейс идёт порядком «рабочее решение → усложнение → вопрос залу → разбор → провал → граница».
      Прежние раскладки — в slides-v3-arhiv/.'
- id: n02
  file: slides/n02-zavyazka-gde-zdes-ii.md
  type: scene_question
  duration_min: 3.0
  assertion: Автоматизация, которая работает три года без единой правки и без единого вызова модели —
    и вопрос залу, где в ней искусственный интеллект
  learning_goal: Завязка занятия. Начинаем с автоматизации, которую зал писал сам и которая работает без
    ИИ. Голосование вслепую, верный ответ открывается следующим экраном.
  visual:
    pattern: scene_cards_and_question
    primary: 'Схема сверху: письмо в ящике, правило, карточка в трекере. Три шага подряд, каждый подписан
      тем, что он делает. Под схемой — строка о том, что скрипт не трогали с 2023 года. Ниже вопрос в
      золотой рамке и четыре карточки равной ширины, ни одна не подсвечена.

      '
    backup: 'Источник: rework/section-1-chaining.md §A.0, переработано под порядок «работает → усложнение
      → провал» (круг 4, указание владельца). Верный ответ («нигде») на этом экране НЕ подсвечен и в тексте
      не назван: прежний круг подсвечивал его золотом рядом с вопросом, и голосовать становилось не о
      чем. Разбор открывает n03. Схема здесь показывает сами шаги, без разговора про фигуры и стрелки
      (прежняя версия объясняла залу устройство картинки — «три коробки, две стрелки» — и владелец снял
      это как пустую метафору).'
- id: n03
  file: slides/n03-razbor-nigde-i-lestnitsa.md
  type: recap_table
  duration_min: 2.0
  assertion: 'Верный ответ — нигде; вопрос занятия переезжает на уровень выше: какому шагу процесса модель
    нужна, а какому не нужна'
  learning_goal: Разбор вопроса n02 сразу за ним (правило А1) и карта занятия. Лестница рисуется лестницей;
    три нижние ступени расшифрованы по-русски, остальные шесть помечены одной подписью.
  visual:
    pattern: ladder_steps_figure
    figure: mostik-n03-lestnitsa.png
    primary: 'Девять ступеней снизу вверх. Три нижние в золотой рамке с подписью «сегодня», у каждой русская
      формулировка и каноническое английское имя в скобках. Шесть верхних серые, под ними одна общая подпись
      «следующие занятия», английских имён у них нет. Под лестницей — вопрос к себе в золотой рамке.

      '
    backup: 'Круг 4: этот экран объединяет разбор вопроса n02 и карту занятия. Прежде карта стояла ВТОРЫМ
      экраном, до всякой завязки, и занимала 5 минут — зал узнавал устройство шести занятий вперёд, не
      получив ни одной причины слушать. Теперь карта идёт после завязки и занимает 2 минуты. Расшифровки
      нижних трёх ступеней обязательны: прежний круг печатал девять английских имён без перевода (правило
      курса про расшифровку сокращений при первом употреблении).'
- id: n04
  file: slides/n04-divider-sto-pisem.md
  type: section_divider
  duration_min: 0.5
  assertion: «Сто писем в день, и половина из них — одно и то же» — наблюдаемая проблема, с которой начинается
    первый кейс
  learning_goal: Дивайдер кейса A называет проблему, не решение (правило А2). Инструмента в заголовке
    нет.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, фраза крупно в кавычках. Внизу дорожка трёх кейсов ступени, кейс А подсвечен.
      Ни имени приёма, ни слова «модель» на экране.

      '
    backup: Круг 4. Кейс A ступени 1 — сквозной учебный сценарий, не документированный публичный случай;
      оговорка об этом стоит на видимом слое n05, чтобы её нельзя было пропустить, идя по слоту. Кейсы
      B и C этой же ступени — документированные случаи с источниками.
- id: n05
  file: slides/n05-rabotaet-spisok-slov.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Классификатор на списках слов работает: мгновенно, бесплатно, повторяемо, и всегда видно,
    какое слово сработало'
  learning_goal: Рабочее решение без единого вызова модели — то, с чего начинает каждый инженер и что
    на однотипном потоке закрывает большую часть задачи. База, от которой дальше считается всё остальное.
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица «если в письме есть» / «категория», три строки с живыми формулировками. Под ней
      золотая строка о свойствах решения. Справа внизу — серая пунктирная оговорка о статусе кейса.

      '
    backup: 'Круг 4, перестройка по указанию владельца: кейс начинается с рабочего решения без ИИ. Прежний
      круг открывал кейс готовой цепочкой и голосованием «отправляем ли этот ответ» — то есть вёл через
      отрицание и не объяснял, откуда цепочка взялась. Оговорка о статусе кейса перенесена сюда с дивайдера:
      на полуминутном экране её пропускали.'
- id: n06
  file: slides/n06-gde-konchilos-i-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Письмо без единого слова из списков ломает классификатор, а дописывание слов ломает следующее
    письмо — и здесь зал выбирает, что делать
  learning_goal: 'Точка, где рабочее решение кончилось. Голосование вслепую: зал выбирает следующий шаг,
    разбор идёт сразу за ним (правило А1).'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху два письма цитатами, между ними строка о том, что сломалось после правки. Ниже вопрос
      в золотой рамке и три карточки равной ширины, ни одна не подсвечена.

      '
    backup: 'Круг 4. Это первое голосование занятия, где зал принимает инженерное решение, а не оценивает
      готовую конструкцию. Третий вариант («нераспознанное человеку») намеренно стоит в списке как полноправный:
      на разборе он окажется часто правильным, и это снимает у зала ощущение, что голосование ведёт к
      заранее известному ответу.'
- id: n07
  file: slides/n07-razbor-chem-platit-kazhdyy.md
  type: answer_breakdown_table
  duration_min: 2.5
  assertion: Каждый из трёх вариантов чем-то платит, и второй — отдать нераспознанное человеку — часто
    и есть правильный ответ
  learning_goal: 'Разбор сразу за вопросом (А1), две содержательные колонки (А5). Поворот разбора: модель
    здесь не победитель по умолчанию; её зовут по конкретному признаку, который назван явно.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки: что делает вариант и чем он платит. Три строки по числу карточек
      вопроса. Под таблицей золотая строка с условием, при котором зовут модель.

      '
    backup: 'Круг 4. Прежний разбор этой ступени был устроен как спецификация четырёх продуктов (восемь
      ячеек одинаковой длины и грамматики) — владелец назвал такие разборы роботными. Здесь три строки
      разной длины, и у каждой названа своя цена. Поворот вынесен в золотую строку: условие, по которому
      выбирают модель, сформулировано как наблюдаемый признак («прочее растёт быстрее, чем успеваешь дописывать»),
      а не как предпочтение.'
- id: n08
  file: slides/n08-mehanika-dva-shaga.md
  type: mechanism_node_graph
  duration_min: 2.25
  assertion: Модель читает письмо и возвращает одно слово из вашего списка; ответ всё равно писать, и
    из этого получается цепочка из двух шагов
  learning_goal: Что именно добавляет модель (разбор незнакомых формулировок) и откуда берётся цепочка
    — из распада задачи на два разных действия, а не из моды на цепочки.
  visual:
    pattern: mechanism_node_graph
    figure: c1-graf-tsepochki.png
    primary: 'Схема слева направо: письмо, шаг «определить категорию», шаг «написать черновик по категории»,
      очередь человека, клиент. Шаги модели и обычный код различаются формой, легенда под схемой. Под
      схемой золотая строка про распад задачи на два действия.

      '
    backup: 'Круг 4. Схема показывает сами шаги; разговора про фигуры и стрелки в тексте нет (владелец
      снял «три коробки» как пустую метафору). Кода на схеме нет: подпись к проверке словесная. Имена
      узлов по-русски — прежняя версия подписывала их английскими именами функций, и ведущий был вынужден
      произносить их весь кейс.'
- id: n09
  file: slides/n09-proval-vezhlivo-i-mimo.md
  type: failure_vignette_table
  duration_min: 2.5
  assertion: Неверная метка выглядит точно так же, как верная, и второй шаг честно пишет по ней вежливый
    ответ — правило в такой ситуации молчало, модель молчать не умеет
  learning_goal: 'Провал кейса. Поворот: цена замены правил моделью — отказ от тишины. Именно отсюда следует
    проверка между шагом, который угадывает, и шагом, который действует.'
  visual:
    pattern: failure_vignette_table
    figure: c1-graf-pogasshiy-romb.png
    primary: 'Письмо Анны цитатой, под ним метка модели, под ней черновик ответа цитатой, рядом строка
      условий магазина. Та же схема, что экраном раньше, с погашенным шагом проверки. Внизу золотая строка
      про тишину.

      '
    backup: 'Круг 4. Условия магазина стоят НА ЭКРАНЕ: без них поворот держится на утверждении ведущего,
      и на вопрос «откуда известно, что Анне положен возврат» честного ответа нет (находка прожарки ведущего).
      Почему модель выбрала «доставку», тоже названо: письмо подходит к двум категориям сразу, описание
      возврата в инструкции узкое. Прежний круг оставлял это недосказанным, и механическая суть провала
      додумывалась ведущим на ходу.'
- id: n10
  file: slides/n10-granitsa-poslednyaya-stroka.md
  type: criteria_checklist_and_boundary
  duration_min: 2.0
  assertion: На чём кончается список категорий — на том и кончается цепочка; между шагом, который угадывает,
    и шагом, который действует, нужна проверка
  learning_goal: 'Граница ступени прямой формой (А7) и вопрос к себе на видимом слое. Критерий проверяемый:
    его можно задать своей задаче вслух и получить ответ.'
  visual:
    pattern: self_check_boundary
    primary: 'Таблица в две колонки: чем кончается список категорий и что из этого следует. Три строки.
      Под ней золотая строка про проверку между шагами. Последним блоком — вопрос к себе в золотой рамке.

      '
    backup: 'Круг 4. Прежняя граница была решёткой-зеркалом: правая колонка получалась из левой отрицанием
      слово в слово, и критерия, который можно унести, из неё не следовало. Здесь критерий сформулирован
      как действие над своей задачей — выписать категории и посмотреть, на чём список кончается.'
- id: n11
  file: slides/n11-divider-tsifra-stoyala-godami.md
  type: section_divider
  duration_min: 0.5
  assertion: «Эта цифра стояла на сайте годами, и ничего не ломалось» — та же дыра, что в первом случае,
    на несопоставимо большей цене
  learning_goal: Дивайдер кейса B называет наблюдаемое положение дел. Исход, компания и цифры на экран
    не выносятся — они кульминация через три экрана.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, фраза крупно. Дорожка трёх кейсов ступени, кейс Б подсвечен. Ни исхода, ни цифр,
      ни слова «провал».

      '
    backup: Круг 4. Прежняя версия держала на дивайдере приписку «Zestimate работает и сегодня, а бизнеса
      больше нет» — она называла исход за два экрана до цифр и обесценивала кульминацию. Поворот переехал
      заголовком на n12.
- id: n12
  file: slides/n12-rabotaet-otsenka-kak-podskazka.md
  type: scene_mechanism_diagram
  duration_min: 2.0
  assertion: 'Оценка работает подсказкой: ошибается она каждый день, поправляет человек, цена ошибки остаётся
    нулевой'
  learning_goal: 'Рабочее решение этого случая. Важно, что оно работает НЕ из-за точности модели: рядом
    с цифрой стоит человек, который решает.'
  visual:
    pattern: scene_mechanism_diagram
    figure: zillow-n11-dve-tsepochki.png
    primary: 'Верхняя строка схемы: оценка, затем человек (смотрит, сравнивает, торгуется), затем его
      собственное решение. Нижняя строка на этом экране пустая — заполнится на следующем. Под схемой золотая
      строка про нулевую цену ошибки.

      '
    backup: 'Круг 4. Схема заведена на две строки намеренно: вторая появляется экраном позже, и сравнение
      читается само, без объяснения словами.'
- id: n13
  file: slides/n13-uslozhnenie-i-vopros.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Бизнес просит покупать дома напрямую — для этого нужна цена на каждую сделку, и оценщик на
    каждый дом становится узким местом
  learning_goal: Второе голосование занятия. Решение, которое зал принимает здесь, — убирать ли человека
    из контура ради скорости; у всех трёх вариантов есть защитники в реальных командах.
  visual:
    pattern: question_with_option_cards
    primary: 'Короткая постановка сверху: что запускает бизнес и почему для этого нужна цена на каждую
      сделку. Ниже вопрос в золотой рамке, три карточки равной ширины, ни одна не подсвечена.

      '
    backup: 'Круг 4. Прежняя версия не давала залу решения вовсе — кейс шёл повествованием. Вопрос поставлен
      в точке реального выбора: именно это решение в 2018 году принимала команда Zillow, и принимала его
      на тех же доводах, что прозвучат в зале.'
- id: n14
  file: slides/n14-razbor-model-ne-menyalas.md
  type: answer_breakdown_table
  duration_min: 2.25
  assertion: Zillow выбрала первое; сама модель при этом не изменилась ни на строчку — изменилось то,
    что стоит сразу после неё
  learning_goal: 'Разбор сразу за вопросом. Поворот: предмет решения — не качество модели, а звено, которое
    идёт следом. Обе строки схемы встают рядом и показывают это без слов.'
  visual:
    pattern: answer_breakdown_table
    figure: zillow-n11-dve-tsepochki.png
    primary: 'Та же схема, теперь с обеими строками. Верхняя — оценка, человек, его решение. Нижняя —
      оценка, пустой слот на месте человека, покупка дома. Под схемой таблица в две колонки по трём вариантам,
      под ней золотая строка про неизменившуюся модель.

      '
    backup: Круг 4. Пустой слот во второй строке читается только рядом с заполненным — поэтому обе строки
      на одной схеме, а не две отдельные картинки.
- id: n15
  file: slides/n15-proval-9680-i-3032.md
  type: verdict_numbers_table
  duration_min: 2.5
  assertion: 9680 домов куплено за квартал, продано 3032; $304 млн списания за квартал и $407,9 млн за
    год; бизнес закрыт, 2000 человек уволены
  learning_goal: Провал с цифрами и базами. Каждое число стоит рядом с тем, с чем его читать (правило
    Baseline/Counterfactual). Источники названы на экране.
  visual:
    pattern: verdict_numbers_table
    primary: 'Таблица «цифра» / «рядом с чем её читать», пять строк. Под ней реплика генерального директора
      цитатой. Внизу золотая строка про людей. Рамка таблицы янтарная — единственный приём деки с цветным
      акцентом, маркер слайда-вехи.

      '
    backup: 'Круг 4. Источники: CNN 09.11.2021, Fortune 03.11.2021 (разбор Bank of America), форма 10-K
      за 2021 год, GeekWire по числу купленных и проданных домов. Знаменателя в виде годовой выручки компании
      в источниках по этому случаю нет, и выдумывать его ради красивой доли не стоит — базы, которые источники
      дают, стоят в таблице.'
- id: n16
  file: slides/n16-granitsa-tsena-i-obratimost.md
  type: cost_reversibility_spectrum
  duration_min: 2.0
  assertion: Одна и та же модель с одной и той же точностью безопасна как подсказка и опасна как решение;
    разбирается цена следующего шага и его обратимость
  learning_goal: 'Граница кейса прямой формой. Критерий переносимый: прикладывается к своей задаче без
    переделки.'
  visual:
    pattern: cost_reversibility_spectrum
    figure: zillow-n13-spektr.png
    primary: 'Горизонтальный клин слева направо: от «отменяется одним действием» к «одним действием не
      отменить». Две точки на нём — черновик письма и покупка дома. Под клином золотая строка критерия.

      '
    backup: Круг 4. Прежняя версия ставила «потерянное время» и «сотни миллионов» в соседние ячейки одной
      таблицы, и контраст гас в равной форме. Клин с двумя точками на разных концах держит разницу визуально.
- id: n17
  file: slides/n17-divider-za-polden.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «От идеи до работающего кода за полдня» — обещание инструмента, ради которого его и берут
  learning_goal: 'Дивайдер кейса C меняет форму: первые два были репликами людей, этот — обещанием инструмента.
    Сбой ритма в блоке (правило П4).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, обещание крупно в кавычках, под ним приглушённой строкой — «что было через год».
      Дорожка трёх кейсов, кейс В подсвечен.

      '
    backup: 'Круг 4. Форма дивайдера отличается от двух предыдущих намеренно: там говорили люди о своей
      работе, здесь говорит инструмент о себе. Третий кейс ступени — единственный, где провал приходит
      от добавленного, а не от пропущенного.'
- id: n18
  file: slides/n18-rabotaet-pryamye-vyzovy.md
  type: scene_mechanism_diagram
  duration_min: 1.75
  assertion: 'Прямой вызов модели из обычного кода: один класс, один вызов, дальше обычные ветвления и
    обработка текста'
  learning_goal: 'Рабочее решение этого случая. Важно показать, что оно не примитивное: на нём компания
    работала и продолжает работать сегодня.'
  visual:
    pattern: scene_mechanism_diagram
    primary: 'Слева один блок: «один класс · один вызов». Под ним три строки о том, что делает инженер
      — передать сообщение, забрать ответ, дальше обычный код. Справа пусто: место под сравнение, которое
      появится через два экрана. Листингов нет.

      '
    backup: 'Круг 4. Кода на экране нет по прямому указанию владельца («код нигде не нужен»), включая
      этот случай, где прошлый круг держал два листинга на полэкрана: счёт сущностей передаётся словами
      и блоками.'
- id: n19
  file: slides/n19-uslozhnenie-i-vopros-framework.md
  type: question_with_option_cards
  duration_min: 1.75
  assertion: 'Задача выросла: шагов больше, их надо связывать, хочется переиспользовать куски — и здесь
    зал решает, брать ли фреймворк'
  learning_goal: 'Третье голосование занятия. Выбор бинарный и настоящий: обе стороны защитимы, и в зале
    почти наверняка есть люди с личным опытом по обе стороны.'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху три строки о том, что выросло в задаче. Ниже вопрос в золотой рамке и две карточки
      равной ширины.

      '
    backup: 'Круг 4. Вариантов два, не четыре: выбор здесь действительно бинарный, и растягивать его до
      четырёх карточек ради симметрии с другими кейсами значило бы выдумывать позиции, которых никто не
      занимает.'
- id: n20
  file: slides/n20-razbor-odin-protiv-tryoh.md
  type: answer_breakdown_schema
  duration_min: 2.0
  assertion: На то же действие вместо одного класса и одного вызова получается три класса, четыре вызова
    и три новых понятия, которых в проекте не было
  learning_goal: Разбор сразу за вопросом, счётом сущностей вместо листингов. Три новых понятия названы
    поимённо, и про каждое сказано, что оно добавляет к самой задаче.
  visual:
    pattern: answer_breakdown_schema
    figure: c3-tsena-odnogo-deystviya.png
    primary: 'Схема-сравнение. Слева один блок «1 класс · 1 вызов». Справа три блока столбиком (шаблон
      запроса, разборщик ответа, связка) и ряд из четырёх меток вызовов. Под каждой стороной итоговый
      счёт. Листингов нет. Под схемой строка про три понятия.

      '
    backup: Круг 4. Сравнение взято из публичного разбора команды дословно по числам (один класс и один
      вызов против трёх классов и четырёх вызовов на одном и том же действии — переводе слова на другой
      язык).
- id: n21
  file: slides/n21-proval-god-i-vybrosili.md
  type: failure_vignette_before_after
  duration_min: 1.75
  assertion: 'Год в продакшене: за пределами стандартного сценария приходится пробиваться через слои,
    состояние агента наружу не отдаётся — фреймворк выбросили, и сложность ушла вместе с ним'
  learning_goal: 'Провал случая. Ключевое наблюдение: после снятия фреймворка сложность не вернулась в
    другом виде, то есть она целиком принадлежала ему.'
  visual:
    pattern: failure_vignette_before_after
    primary: 'Две строки: что мешало (пробиваться через слои; состояние агента наружу не выходит) и что
      произошло после снятия. Под ними цитата «We could just code» с переводом.

      '
    backup: Круг 4. Цитата дана с русским переводом рядом — правило курса про иноязычные вставки. Формулировка
      про наблюдаемость взята из разбора команды, формулировка про слои абстракции — из обсуждения на
      форуме, и эти два источника различены (прошлые круги сводили их в одно утверждение).
- id: n22
  file: slides/n22-granitsa-kogda-framework-okupaetsya.md
  type: criteria_checklist_and_boundary
  duration_min: 1.75
  assertion: Фреймворк окупается на множестве однотипных пайплайнов в команде и не окупается на одном-двух
    с нестандартными требованиями
  learning_goal: 'Граница случая прямой формой и мостик к ступени 2. Критерий работает в обе стороны:
    называет и где инструмент уместен.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки «окупается» / «не окупается», по три строки. Под ней приглушённая
      строка с позицией Anthropic. Последним блоком — золотой вопрос, открывающий ступень 2.

      '
    backup: 'Круг 4. Закрывающий вопрос ступени сформулирован без слова «маршрут»: имя приёма называет
      уже дивайдер следующего блока. Прежняя версия закрывала ступень таблицей «кейс / поворот» — пересказом
      того, что зал только что видел; таблица снята, повороты ушли в заметки.'
- id: n23
  file: slides/n23-divider-proshu-kategoriyu.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Я прошу категорию, а получаю абзац» — начало второй ступени занятия
  learning_goal: 'Дивайдер кейса A ступени 2. На экране явный сигнал смены ступени: дорожка кейсов начинает
    счёт заново, и без подписи зал читает это как возврат назад.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, реплика крупно. Приглушённой строкой под ней: «Ступень 2 начинается здесь».
      Дорожка трёх кейсов, кейс А подсвечен заново.

      '
    backup: 'Круг 4, находка симулятора студента: на прежней деке дорожка «Кейс А» загоралась второй раз
      без единого признака, что начался новый блок, и студент решил, что ведущий вернулся назад. Подпись
      о смене ступени решает это одной строкой.'
- id: n24
  file: slides/n24-rabotaet-chetyre-vetki.md
  type: scene_mechanism_diagram
  duration_min: 2.0
  assertion: 'Четыре категории, четыре ветки: у каждой свой промпт, своя база знаний, свой адресат — и
    это работает, пока категории известны заранее'
  learning_goal: Рабочее решение ступени 2. Развилка показана схемой, и у каждой ветки названа своя цена
    ошибки — она понадобится на провале.
  visual:
    pattern: scene_mechanism_diagram
    figure: marshrut-c4-razvilka-tseny.png
    primary: 'Схема: письмо, шаг определения категории, от него четыре расходящиеся ветки. Под каждой
      веткой подписано, что происходит дальше и чем обходится неверная метка. Ветка «спам» помечена как
      самая дорогая по цене ошибки.

      '
    backup: 'Круг 4. Цена ошибки каждой ветки выводится из механики первой ступени: ответ собирается по
      базе знаний, выбранной меткой, значит неверная метка даёт ответ по чужой теме. У ветки «спам» ответа
      нет вовсе, поэтому её цена максимальная.'
- id: n25
  file: slides/n25-uslozhnenie-panel-raskhodov.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: 'Шаг классификации обошёлся почти столько же, сколько шаг написания ответа: одно слово из
    четырёх против целого абзаца клиенту'
  learning_goal: 'Четвёртое голосование. Мотив кейса — счёт за вызовы — стоит на видимом слое, а не в
    заметках: без него вопрос повисает без причины.'
  visual:
    pattern: question_with_option_cards
    primary: 'Таблица расходов из четырёх строк сверху (поток, два шага, итог дня). Ниже вопрос в золотой
      рамке и четыре карточки равной ширины. Формулировки карточек описывают действие, имена приёмов в
      них не звучат.

      '
    backup: 'Круг 4, находка прожарки ведущего: довод про панель расходов жил только в заметках дивайдера
      на полминуты, и вопрос следующего экрана оставался без мотива. Карточки описаны действием намеренно:
      прежняя версия просила голосовать за «decision-модель, возвращающую типизированное значение», и
      оба термина звучали на том экране впервые.'
- id: n26
  file: slides/n26-razbor-tri-sporyat-ob-odnom.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: 'Первые три варианта спорят об одном и том же — как точнее угадать категорию; вопрос стоит
    в другом месте: зачем на этом шаге вообще текст'
  learning_goal: 'Разбор сразу за вопросом, первый такт. Поворот: три варианта снимаются одной общей причиной,
    и причина названа явно.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Три карточки вариантов в ряд, приглушённые. Под ними золотая строка-поворот во всю ширину.
      Четвёртый вариант на этом экране не раскрывается — он следующий.

      '
    backup: 'Круг 4. Разбор разделён на два такта двумя экранами: на одном экране золотая четвёртая строка
      перехватывает взгляд раньше, чем зал прочтёт снятие первых трёх, и порядок «сначала сняли, потом
      показали» не держится.'
- id: n27
  file: slides/n27-reshayushchaya-model-i-tsena.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Решающая модель возвращает значение вместе с уверенностью, без текста вокруг; платит она
    непрозрачностью — на выходе число без объяснения
  learning_goal: 'Второй такт разбора: четвёртый вариант раскрывается один, крупно, с собственной ценой.
    Имя приёма впервые называется здесь и тут же переводится.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Одна строка таблицы в две содержательные колонки — что даёт и чем платит. Под ней три коротких
      строки о том, что получается на выходе. Внизу золотой вопрос к себе.

      '
    backup: 'Круг 4. Пример с районами залива взят из публичной проверки Саймона Уилисона. `vfy_day_of`
      по бренду: продукт появился в сентябре 2026, у него уже есть открытый клон; перед занятием проверить,
      что расстановка на рынке не сменилась. Имя бренда при смене расстановки заменяется описанием класса,
      механика кейса от этого не зависит.

      '
- id: n28
  file: slides/n28-proval-pismo-mimo-vetok.md
  type: failure_vignette_table
  duration_min: 2.0
  assertion: Письмо, которому не подходит ни одна из четырёх веток, уезжает в ближайшую по сходству —
    сказать «подходящей нет» маршрутизатор не может
  learning_goal: 'Провал ступени. Причина структурная: варианта «подходящей нет» в формате ответа не предусмотрено,
    и ни решающая модель, ни генеративная тут не различаются.'
  visual:
    pattern: failure_vignette_table
    figure: marshrut-c4-razvilka-chuzhoe-pismo.png
    primary: 'Та же схема развилки, на входе письмо пятого рода. Три ветки пунктиром, золотая стрелка
      в «техподдержку» с подписью «ближайшая по сходству». Пятой строкой пунктиром — «такой ветки в списке
      нет». Слева панель о том, чего нет в формате ответа.

      '
    backup: Круг 4. Прежняя версия держала на одном экране этот провал и пример с районами залива — две
      несвязанные истории без перехода. Пример с районами переехал на n27, к механике решающей модели,
      где он и объясняет её цену.
- id: n29
  file: slides/n29-granitsa-polnota-spiska.md
  type: self_check_boundary
  duration_min: 1.75
  assertion: Маршрут хорош ровно настолько, насколько полон список классов; то, что попадёт в «прочее»,
    уедет в ближайшую ветку молча
  learning_goal: Граница кейса прямой формой и мостик к двум следующим случаям, где классификатор решает
    про людей.
  visual:
    pattern: self_check_boundary
    primary: 'Таблица в две колонки: чем кончается список категорий и что из этого следует. Под ней золотая
      строка про цену ветки по умолчанию. Последним блоком — переход к следующим двум случаям без называния
      компаний.

      '
    backup: 'Круг 4. Мостик к кейсу Б намеренно не называет ни компанию, ни домен: он говорит только о
      росте цены ошибки.'
- id: n30
  file: slides/n30-divider-ball-odin-tyazhest-raznaya.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Балл риска один и тот же, тяжесть разная» — наблюдаемое расхождение, с которого начинается
    случай
  learning_goal: Дивайдер кейса B ступени 2. Компания названа здесь же, в заметках и на следующем экране
    — прежняя дека держала её за кадром четыре слайда подряд.
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, фраза крупно. Дорожка трёх кейсов ступени, кейс Б подсвечен.

      '
    backup: 'Круг 4, находка прожарки ведущего: прежде имя Optum впервые появлялось на дивайдере СЛЕДУЮЩЕГО
      кейса, и четыре экрана подряд ведущий рассказывал про «коммерческий алгоритм», а на прямой вопрос
      «чей» отвечал из головы. Атрибуция: сама статья в Science поставщика не называет («one widely used
      commercial algorithm»), Optum назван прессой и зафиксирован в публичных разборах.'
- id: n31
  file: slides/n31-rabotaet-vrach-nazyvaet-imena.md
  type: problem_scenario
  duration_min: 1.75
  assertion: Пока пациентов немного, список составляет врач — и составляет точно, потому что учитывает
    то, чего нет ни в одной базе
  learning_goal: Рабочее решение этого случая — человек. Важно, что оно лучше любого алгоритма по качеству
    и проигрывает только в масштабе.
  visual:
    pattern: problem_scenario
    primary: 'Три короткие строки — примеры того, что видит врач. Под ними золотая строка о том, почему
      это работает точно.

      '
    backup: 'Круг 4. «Рабочим шагом 1» в этом случае выступает человек, а не алгоритм: это честно, потому
      что так задача и решалась до внедрения и так она решается сегодня в небольших практиках.'
- id: n32
  file: slides/n32-uslozhnenie-i-vopros-kakuyu-velichinu.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: Двести миллионов человек, врача на всех нет, прямого измерения потребности в базе нет — зал
    выбирает, какую доступную величину взять вместо него
  learning_goal: 'Пятое голосование, и самое близкое к реальной работе инженера: выбрать замещающую величину
    из того, что есть в данных. Все четыре варианта измеримы без нового сбора.'
  visual:
    pattern: question_with_option_cards
    primary: 'Короткая постановка сверху: масштаб и отсутствие прямого измерения. Ниже вопрос в золотой
      рамке и четыре карточки равной ширины, ни одна не подсвечена.

      '
    backup: Круг 4. Вопрос поставлен обобщённо (ранжировать людей, прямого измерения нет), чтобы зал решал
      задачу своего типа, а не разбирался сначала в устройстве американской страховой медицины. Институциональный
      контекст сведён к минимуму, необходимому для механизма.
- id: n33
  file: slides/n33-razbor-chto-schitaet-krome-bolezni.md
  type: answer_breakdown_table
  duration_min: 2.25
  assertion: Все четыре кандидата измеримы без нового сбора данных; различаются они тем, что каждый считает
    помимо болезни
  learning_goal: Разбор сразу за вопросом, две содержательные колонки. Про каждый вариант сказано конкретно
    — заглушек «не тот признак» нет.
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица в две колонки на четыре строки: величина и что в неё попадает помимо болезни. Строка
      «прошлые расходы» подсвечена золотом как выбранная в реальности. Под таблицей золотая строка-вывод.

      '
    backup: Круг 4. Прежняя версия отмечала три из четырёх строк как «не тот признак» без объяснения —
      отметка в бланке вместо разбора. Теперь у каждой строки свой механизм. Исследование измеряло один
      признак, использованный; три остальные строки разбирают путь числа в страховую базу и замера исследования
      им не приписывают.
- id: n34
  file: slides/n34-proval-26-protsentov.md
  type: verdict_numbers_table
  duration_min: 2.25
  assertion: При одном и том же балле риска у чёрных пациентов верхнего разряда на 26,3% больше активных
    хронических заболеваний; честный пересчёт поднял бы их долю в программе с 17,7% до 46,5%
  learning_goal: Провал случая с цифрами и объяснённым методом счёта. Контрфактическая цифра 46,5% получена
    пересчётом по числу заболеваний на тех же данных — метод назван, а не только результат.
  visual:
    pattern: verdict_numbers_table
    figure: optum-c5-odin-ball-dva-stolbika.png
    primary: 'Два столбика одинаковой подписи «один и тот же балл риска» и разной высоты, числовая шкала
      слева (0 · 50 · 100 · 126,3), прирост правого залит золотом. Под схемой две строки: как считали
      контрфактическую долю и что получилось.

      '
    backup: 'Круг 4. Метод контрфактического счёта назван по требованию прожарки ведущего: прежде на экране
      стояло только «46,5% при честном счёте», и на вопрос «как посчитали» ответа не было нигде. Источник:
      Obermeyer et al., Science, 24.10.2019, DOI 10.1126/science.aax2342.'
- id: n35
  file: slides/n35-granitsa-nazovite-s-chem-svyazana.md
  type: self_check_boundary
  duration_min: 1.75
  assertion: Замещающая величина допустима, когда вы можете вслух назвать, с чем ещё она связана, и проверили,
    что связь не бьёт по группе людей
  learning_goal: 'Граница случая как выполнимая процедура: взять прокси, взять прямое измерение хотя бы
    на выборке, сравнить ранжирование. Эта же проверка в следующем случае пройдёт чисто — и это будет
    поворотом.'
  visual:
    pattern: self_check_boundary
    primary: 'Три шага процедуры сверху, нумерованные. Под ними золотая строка-критерий. Последним блоком
      — вопрос к себе.

      '
    backup: 'Круг 4. Процедура сформулирована выполнимо (на выборке, а не на всей базе) — иначе критерий
      превращается в пожелание. Она же готовит поворот кейса C: там эта проверка проходит чисто, и в этом
      вся соль следующего случая.'
- id: n36
  file: slides/n36-divider-proverka-prohodit-chisto.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: «Проверка, которая вскрыла прошлый случай, здесь проходит чисто» — обещание поворота, а не
    процедуры
  learning_goal: 'Дивайдер кейса C ступени 2. Форма отличается от двух предыдущих: это утверждение о методе,
    которое зал только что освоил и которому сейчас предстоит не сработать.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, утверждение крупно. Дорожка трёх кейсов, кейс В подсвечен. Цифр нет.

      '
    backup: Круг 4. Прежний дивайдер повторял формой вопрос кейса Б; здесь он опирается на процедуру с
      экрана n35 и обещает, что она не сработает — это и есть поворот случая, предъявленный до разбора.
- id: n37
  file: slides/n37-rabotaet-sluchaynaya-vyborka.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'Случайная выборка: честно, непредвзято, статистически корректно — у каждого равный шанс'
  learning_goal: 'Рабочее решение этого случая. Оно обладает свойством, которого не будет ни у чего следующего:
    отсутствие систематического перекоса по построению.'
  visual:
    pattern: problem_scenario
    primary: 'Короткая постановка сверху: сколько деклараций и сколько инспекторов. Под ней три строки
      о свойствах случайной выборки. Золотая строка о главном её свойстве.

      '
    backup: 'Круг 4. Случайная выборка названа рабочим решением без оговорок: она действительно применялась
      и применяется, и её статистические свойства делают её единственным вариантом без систематического
      перекоса по построению.'
- id: n38
  file: slides/n38-uslozhnenie-i-vopros-chto-maksimizirovat.md
  type: question_with_option_cards
  duration_min: 2.0
  assertion: 'Случайная выборка тратит инспекторские часы впустую: большинство деклараций в порядке —
    и зал выбирает, что велеть системе максимизировать'
  learning_goal: Шестое и последнее голосование. На экране прямо сказано, что верного целиком варианта
    среди трёх нет — иначе приём читается подвохом после голосования.
  visual:
    pattern: question_with_option_cards
    primary: 'Короткая постановка сверху. Вопрос в золотой рамке, три карточки равной ширины. Под карточками
      — серая пунктирная рамка оговорки мелким курсивом: верного целиком варианта среди трёх нет.

      '
    backup: 'Круг 4, самая дорогая находка прожарки ведущего: это единственное голосование занятия без
      верного варианта среди карточек, и знание об этом жило одним предложением в середине заметок. Забытое,
      оно превращает голосование в подставу: зал собирает три позиции и слышит «все мимо». Оговорка стоит
      НА ЭКРАНЕ, под карточками, чтобы её видели даже если ведущий не прочитает.'
- id: n39
  file: slides/n39-razbor-vybrali-otdachu-ot-chasa.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Выбрали отдачу от часа инспектора; подмены признака здесь нет — всё, что считает система,
    читается прямо из декларации
  learning_goal: 'Разбор сразу за вопросом. Главное: процедура из предыдущего кейса применяется и проходит
    чисто, и это предъявляется явно, до того как прозвучит исход.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Три варианта приглушённо сверху, выбранный подсвечен. Под ними таблица в две колонки: что
      система считает и откуда это берётся. Внизу золотая строка о том, что проверка прошлого кейса здесь
      ничего не находит.

      '
    backup: 'Круг 4. Этот экран несёт поворот кейса и должен прозвучать ДО исхода: сначала зал убеждается,
      что с моделью всё в порядке, и только потом узнаёт результат.'
- id: n40
  file: slides/n40-proval-v-2-9-4-7-raza-chashche.md
  type: verdict_numbers_table
  duration_min: 2.0
  assertion: При сопоставимых декларациях чернокожих налогоплательщиков проверяли в 2,9–4,7 раза чаще,
    и расы в данных нет вообще
  learning_goal: 'Провал случая. Цепочка от настройки к исходу показана целиком, чтобы было видно: ни
    одного предвзятого шага в ней нет.'
  visual:
    pattern: verdict_numbers_table
    figure: irs-c6-lestnitsa-deshevizny.png
    primary: 'Спуск из четырёх ступеней, каждая стрелка подписана «верно»; верхняя ступень залита золотом
      и помечена «сломано здесь». Справа исход 2,9–4,7× с источником. Под схемой строка о том, что поля
      расы в декларации нет.

      '
    backup: 'Круг 4. Источник: Stanford Institute for Economic Policy Research совместно с IRS, 2023;
      IRS результат подтвердила и объявила о намерении исправить процесс отбора. EITC поясняется на экране
      одной строкой — прежняя дека использовала аббревиатуру без расшифровки в каждой строке таблицы.'
- id: n41
  file: slides/n41-formula-mera-ili-velichina.md
  type: synthesis_and_bridge
  duration_min: 2.0
  assertion: Один случай сломался на мере — взяли не ту линейку; другой на величине — линейка верная,
    мерили не то. Второго ни один тест модели не ловит
  learning_goal: Формула, ради которой шестой случай стоит в занятии. Она подана крупно и отдельно, не
    последней строкой на уходе.
  visual:
    pattern: synthesis_and_bridge
    primary: 'Две строки крупно, одна под другой, с именами случаев слева. Под ними золотая строка о том,
      почему тест модели второго не ловит. Больше на экране ничего.

      '
    backup: Круг 4. Прежде эта формула стояла последней и самой мелкой плашкой на уходе — то есть главное
      за всю ступень читалось в момент, когда внимание уже упало. Теперь ей отдан отдельный экран.
- id: n42
  file: slides/n42-granitsa-stupeni-chetyre-voprosa.md
  type: self_check_boundary
  duration_min: 2.0
  assertion: Четыре вопроса к своей задаче, и последний — какую величину системе велено максимизировать
    и кто её выбрал
  learning_goal: Граница ступени 2 целиком. Четыре вопроса собирают три случая ступени и добавляют четвёртый,
    который даёт только последний случай.
  visual:
    pattern: self_check_boundary
    primary: 'Четыре вопроса нумерованным списком, каждый с короткой второй колонкой «маршрута не хватит,
      если». Четвёртый вопрос подсвечен как вклад последнего случая.

      '
    backup: 'Круг 4. Первые три вопроса — граница ступени из плана; четвёртый добавлен последним случаем.
      Формулировки проверяемые: на каждый можно ответить про свою задачу вслух за минуту.'
- id: n43
  file: slides/n43-os-tri-stupeni-zakryty.md
  type: ladder_steps_figure
  duration_min: 2.0
  assertion: Три нижние ступени лестницы закрыты шестью случаями в двух блоках; шесть верхних ждут следующих
    занятий
  learning_goal: Закрытие занятия той же лестницей, что открывала его. Зеркало n03 — тот же экран с другим
    результатом, и движение видно.
  visual:
    pattern: ladder_steps_figure
    figure: os-n37-lestnitsa-tri-zakryty.png
    primary: 'Та же лестница, что на n03, та же геометрия. Три нижние ступени залиты золотом с галочкой,
      полоса справа читает «закрыто». Шесть верхних серые с подписью «следующие занятия». Под лестницей
      — рабочий порядок вопросов.

      '
    backup: Круг 4. Пара n03/n43 рисуется одной функцией с переключателем, геометрия открытия и закрытия
      разойтись не может по построению. Пересказа границы ступени здесь нет — её прямой формой даёт предыдущий
      экран.
