- id: n31
  file: slides/n31-artefakt-kak-pomerit-u-sebya.md
  type: code_artifact
  duration_min: 1.5
  assertion: 'Померить цену хука у себя — три шага: посчитать правки за задачу, умножить на цену прогона,
    сравнить с длительностью задачи; порог берётся как доля от задачи'
  learning_goal: 'Артефакт третьего кейса: не файл решения, а процедура измерения, которую можно применить
    к своему проекту в тот же день. Порог сформулирован как доля — с тремя посчитанными примерами от одной
    и той же измеренной цены'
  visual:
    pattern: mechanics_debug_toolkit
    primary: 'Верх — таблица четырёх средств: средство · что даёт. Ниже — процедура из трёх шагов, пронумерованных,
      одной строкой каждый. Внизу — три посчитанных примера от одной цены в задачах разной длины, с процентами.'
    backup: 'Четыре средства — STRUCTURE-PROPOSAL-part2.md К3 такт 6: прогон под time × число правок;
      профилировщик claudekit docs/guides/hook-profiling.md (сторонний автор); список хуков командой /hooks;
