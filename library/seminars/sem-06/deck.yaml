- id: n57
  file: slides/n57-svidetelstva-mast-i-tsena-koordinatsii.md
  type: research_evidence
  duration_min: 2.0
  assertion: От 41 до 87% размеченных трасс мультиагентных систем — провальные, и несогласованность между
