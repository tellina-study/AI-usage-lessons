      чтения то же, освобождается место в контексте.'
    backup: 'Слайд круга 3 владельца (issue 225). Пять строк разбора написаны под новую сцену и вопрос
      — прежний кейс о достоверности отчёта (журнал вызовов) снят целиком, см. section-2-subagent-otchet.md.
      Литературная правка: формат «не X, а Y» снят из всех видимых и речевых блоков слайда (правило деки,
      Часть Г ZADANIE-KRUG-2-VLADELTSA.md). Вторая прожарка (issue 225, P1-2): следующий по порядку слайд
      «что входит в окно роли, что из него выходит» снят целиком — он дословно пересказывал контрактный
      факт, уже названный в базе ступени (n36) и на одностраничнике (n37, блоки 3–4); форвард-ссылка на
      снятый слайд заменена ссылкой на одностраничник. Пересмотр по сторителлингу (issue 225, PERESMOTR-STORITELLING.md,
      правило П1 + причина 6 «один поворот на шесть кейсов»): поворот перенесён из вывода внизу слайда
      в ЗАГОЛОВОК и в первую фразу речи. Было: «Сорок файлов остаются в окне роли» — верное утверждение,
      но оно описывает механику, а не опровергает ожидание, и опровержение лежало третьей строкой таблицы
      плюс строкой вывода. Стало: заголовок отвечает прямо на то, что зал произнёс вслух экраном раньше.
      Содержание таблицы и вывода не менялось по фактам; третья строка второй колонки усилена словом «быстрее»,
