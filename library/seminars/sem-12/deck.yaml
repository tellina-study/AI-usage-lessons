    primary: 'Фигура сама несёт снимок + поле модели + строку разметки + вердикт — на кадре рядом текстом
      это не повторяется. Таблица — ещё четыре случая той же выборки, коротко.

      '
    backup: 'Пример на фигуре — снимок `2ebe189cf7049839` (deck_allowed: true). Остальные четыре — `stend/zamery-B/README.md`,
      подтверждённые строгие выдумки, каждая проверена по снимку, не только по тексту.'
- id: n34
  file: slides/n34-polya-tochnost-nol.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: Поля верны в 93,3% случаев на пяти предусмотренных вопросах — и дают структурный ноль на
    любом вопросе, которого в схеме нет, независимо от точности
  learning_goal: 'Слиты два такта плана (−1,0 мин по гейту оркестратора): слепота словаря уже показана
    механикой (n30) и числом (n32) — здесь коротким мостом; основное содержание такта — точность и структурный
    ноль полей (наследие К1 этого занятия на новом материале).'
  visual:
    pattern: measured_outcome_table
    primary: Плашка-мост про словарь детектора (одна строка) + таблица точности полей + список предусмотренного/непредусмотренного.
- id: n35
  file: slides/n35-gryaz-istiny.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: Даже человеческая пометка открытого набора неверна или спорна в одном случае из восьми —
    пол, ниже которого не опустится ни один замер на этой разметке
  learning_goal: Честный пол собственного замера (счёт грязи истины, наследуется из курации корпуса, не
