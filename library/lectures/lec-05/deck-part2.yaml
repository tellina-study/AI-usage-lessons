    slides: [s01, s06, s08, s11a, s11b, s12, s13a, s14a, s15, s17a, s19, s22, s24a, s24b,
             s24c, s26, s27, s29, s30a, s31a, s33, s34, s37, s38a, s38b, s40, s41, s42,
             s45, s45a, s45b, s47, s48, s51, s53, s55]
    count: 36
    semantics: >
      protected: true = слайд НЕ снимается с показа ни при каком тайминге. Сжатие содержимого
      внутри слайда остаётся разрешённым — именно это делают пункты 13–33 cut_order (тир 3).
      Резать целиком можно только из тиров 1–2: каталог инструментов, рамку, незащищённую базу
      и границы.
    why: >
      На Лекции 4 cut_order отсутствовал, и при нехватке времени срезался финал: под нож ушли
      инструмент решения и чек-лист — единственные носители учебной цели «когда ИИ да, когда
      нет». Ярус существует, чтобы закрывающий аппарат физически нельзя было потерять первым.
      Второе подтверждение — ретайминг 2026-09-30: получив цели по разделам, он срезал
      защищённый s49 и сжал содержательные слайды до 0,5 мин. Ярус и правило «цель раздела ≠
      цель слайда» существуют против обеих этих ошибок.
    resolved_open_question: >
      Открытый вопрос прежней редакции — включать ли чек-лист s54 в ярус — закрыт слиянием:
      s54 снят владельцем, его содержание вошло в s53, s53 остаётся в ярусе целиком и по
      фронтматтеру квалифицирован как in_bucket strict-in (перепроверено 2026-10-01 по
      видимому слою: пометка опирается на три оси и требование по каждой, а не на прогон
      двух случаев, который ушёл в заметки). s52 (триангуляция) из вопроса выбыл раньше,
      вместе со снятием слайда. Двенадцать слайдов-практик внесены в ярус целиком: без них
      пересборка теряет смысл, ради которого делалась.

