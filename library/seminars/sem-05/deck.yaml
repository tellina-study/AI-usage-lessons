      подпись слайда. Ни синтеза, ни тезисов на вынос, ни афоризма в рамке.'
    backup: 'СВЕДЕНО СЕССИЕЙ ОБОБЩЕНИЯ (круг 4, стык 7 сверки): из клетки скилла убран оборот «описание,
      а не содержимое» — он пришёл сюда из блока скиллов, где стоит на своём месте, и в закрытии читался
      чужой фразой. Сказано тем же, чем это сказано на базе n46 («Тела файла до срабатывания там нет»),
      то есть утверждением вместо сопоставления «не X, а Y», которое правило А8 запрещает прямо. Содержание
      клетки не тронуто. rework/block-z5-os-promezhutochnaya.md §A.1/§B.2. Формулировки строк сведены
      с axis_placement-слайдами нынешней деки, откуда они и взяты: строка «хук» — s20 («Решаем — правило
      уже было нарушено, когда мы взялись за барьер» / «поставили хук — коммит в main закрыт»), строка
      «скилл» — s32 («решаем, по сигналу» / «важно содержание; описание — деталь, допишем позже» / «без
      точного описания-триггера не сработает вообще: выбор идёт по описанию, а не по содержимому»). Колонка
      «проверка показала» у хука приведена к числу, которое блок «Хуки» реально предъявляет и печатает
      сам: из ШЕСТИ форм одной команды барьер отклоняет ОДНУ и молчит на пяти (n15, assets/captures/35-selftest-branch-guard-run.txt
      — 9 PASS / 5 LIMIT / 0 FAIL), плюс человека с терминалом он не видит вовсе (n15). Прежняя формулировка
      «обходится пятью воспроизведёнными способами» называла пять без базы сравнения; база — шесть форм.
      ВАЖНО: в новой деке axis_placement-слайдов внутри блоков НЕТ (см. STRUCTURE-PROPOSAL-slides.md),
      поэтому эта таблица — второй показ оси, а не третий; строки не дублируются больше нигде. Числа расхождений
      не называются: обещание «одного на ступень» с n03 не давалось. КРУГ 4, ДВЕ ПРАВКИ. ПЕРВАЯ: пара
      колонок «Вы ожидали / На деле» переформулирована в «Что обещает устройство / Что показала проверка»
      — владелец: «особенно „вы ожидали / на деле“ как-то странно звучит, то есть надо как-то переформулировать»
      (qa/zamechaniya-golosom-keysy-1-4.txt, 01:12). Новая пара снимает второе лицо: прежняя приписывала
      залу мысль, которой он не высказывал, и каждый кейс читался как его опровержение. Отвергнутая ранее
      пара «интуиция / проверка» ловушки не снимала — она ту же мысль залу приписывала, только другим
      словом; эта говорит про механизм, а не про зал. ВТОРАЯ: ведущая строка «Таблица та же, что открывала
      занятие пустой» снята как ставшая НЕВЕРНОЙ. Таблица открытия (n03) переписана в круге 4 целиком:
      пустых слотов там больше нет, вместо них пять определений. Сетап и выплата при этом сохранены —
      меняется только форма сетапа: открытие называет пять усилений, закрытие ставит замер против двух
      из них. ГДЕ ЖИВЁТ ПАРА КОЛОНОК ТЕПЕРЬ: только здесь. Требование «формулировки между двумя показами
      не расходятся» выполняется тем, что второго показа этой пары в деке нет вовсе; совпадать с n03 обязаны
      имена и порядок пяти строк, и они совпадают. ТРЕТЬЯ ПРАВКА КРУГА 4 — ПЕРЕНОСИМОСТЬ. Владелец после
      «явно указать в определениях» сказал «тогда надо будет это пояснить». Факт стоит на n03 третьей
      колонкой, разбор одного переноса — на n64, а здесь объяснение: ОДНА видимая строка под таблицей
      плюс абзац в речи. Пятой колонки здесь быть не может — четыре уже стоят, и пятая разрушила бы пару
      «что обещает устройство / что показала проверка», ради которой слайд переписан. Текст строки и абзаца
      — из research/perenosimost-stupeney.md §6 («формулировка самой разницы, один абзац вслух»), сжат
      под слот. Место выбрано тем, что таблица тех же пяти ступеней в том же порядке уже стоит здесь,
      и это ровно та точка, где зал спрашивает «а если я завтра на другом инструменте». Слот 2,00 → 2,25.
      Проверено 2026-10-01 по 17 первоисточникам.'
