  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица на четыре строки, две содержательные колонки: что делает · что не делает или ограничение.
      Строка decision-модели выделена золотом (целевой ответ). Под таблицей — отдельный блок: один действующий
      пример decision-модели, без карточек и без цифр эксперимента (эксперимент — на следующем экране).

      '
    backup: Таблица — дословно section-2-routing.md §A.1.4. Decision-модель — пример Jev (TypeSafe AI)
      из §A.1.4a; источники — Simon Willison (simonwillison.net/2026/Sep/21/jev/) и Wikipedia, «Jev (AI
      model)» (en.wikipedia.org/wiki/Jev_(AI_model)), прочитаны напрямую curl 2026-10-11 (см. SVERKA-PLAN.md;
      §8.7 tools/seminar-production/README.md — отрицательный ответ WebFetch не повод заключать, что источника
      нет, здесь это не потребовалось — обе страницы отдали контент).
- id: n23
  file: slides/n23-proval-marshrut-beryot-blizhayshiy-nevernyy-klass.md
  type: failure_vignette
  duration_min: 2.25
  assertion: 'У decision-модели задокументированное ограничение — непрозрачность; и отдельно от этого
    у самой идеи маршрута по заданным классам есть провал, который не зависит от способа вычисления метки:
    маршрутизатор берёт ближайший неверный класс на письме, которое ни на одну категорию не похоже, и
    делает это молча'
  learning_goal: 'Два слоя провала (А.1.5, part2b.md §B.4): непрозрачность конкретного инструмента (Jev,
    пример с городами залива Сан-Франциско) и провал самой идеи маршрута по заданным классам (берёт ближайший
    неверный класс, не сигнализирует неуверенность). Источник — section-2-routing.md §A.1.5, part2b.md
    §B.4 (n23).'
  visual:
    pattern: failure_vignette_table
    primary: 'Один документированный случай с источником и датой (эксперимент Jev), затем формула- итог:
      второй, более общий слой провала — маршрут берёт ближайший неверный класс молча.

      '
    backup: Источник — part2b.md §B.4 (n23). Эксперимент с городами Bay Area — Simon Willison, «Jev introduces
      a new shape of LLM—System One, aka Decision Models» (simonwillison.net/2026/Sep/21/jev/) и Wikipedia,
      «Jev (AI model)». Второй слой провала (маршрут берёт ближайший неверный класс) — зафиксирован планом,
      ARCHITECTURE.md §5.
- id: n24
  file: slides/n24-mostik-ot-pisma-k-sluchayam-s-drugoy-tsenoy.md
  type: case_bridge
  duration_min: 1.75
  assertion: Неверный маршрут в почтовом пайплайне стоит одно потерянное письмо; тот же механизм подмены
    удобного признака вместо нужного решал, кому достанется медицинская помощь и кого выберут для налоговой
    проверки — масштаб отличается в разы, которые нельзя сопоставлять напрямую
  learning_goal: 'Мостик от механики (кейс A) к двум документированным случаям (B, C). Масштаб и обратимость
    ошибки — главное отличие: письмо можно переслать в тот же день, решения о помощи или проверке — нет.
    Источник — part2b.md §B.5 (n24), ARCHITECTURE.md §5.'
  visual:
    pattern: case_bridge_statement
    primary: 'Короткий текстовый переход без таблицы и без карточек: одна строка про обратимую цену письма,
      одна — про необратимую цену двух следующих кейсов, одна — про общее внутреннее устройство (не область
      применения).

      '
    backup: Источник — part2b.md §B.5 (n24). Новый тип слайда для этой деки (`case_bridge`) — в библиотеке
      приёмов sem-06 прямого аналога нет; там мостик между кейсами одного блока решался внутри сцены следующего
      кейса. Решение выделить отдельным минимальным слайдом — дизайнерское, см. отчёт Фазы 4 presentation-designer.
- id: n25
  file: slides/n25-divider-odin-ball-riska-raznaya-tyazhest.md
  type: section_divider
  duration_min: 1.75
  assertion: Коммерческий алгоритм риск-прогнозирования, которым пользуются госпитали и страховщики в
    США, классифицирует пациентов по баллу риска тем же способом, что маршрутизатор из кейса A — вход
    превращается в одну метку, и эта метка решает, кто получит дополнительную помощь, без ручной перепроверки
  learning_goal: Дивайдер кейса B, форма — число, варьирует кейс A (правило П3 — дивайдеры разной формы).
    Масштаб сразу назван (~200 млн человек/год). Источник — section-2-routing.md §A.2.1, part3b.md §B.1
    (n25).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, два числа крупно (17,7% и 46,5%, стрелка между ними), золотая линия под
      ними. Ниже — короткая смысловая строка. Внизу — дорожка трёх кейсов ступени, кейс B подсвечен.

      '
    backup: Источник — section-2-routing.md §A.2.1, part3b.md §B.1 (n25). Числа и масштаб (~200 млн человек/год)
      — Obermeyer, Z. et al., «Dissecting racial bias in an algorithm used to manage the health of populations»,
      Science, 2019, DOI 10.1126/science.aax2342. Независимо перепроверено оркестратором на Фазе 3 (SVERKA-PLAN.md
      п.3) — совпадает точно.
- id: n26
  file: slides/n26-stsena-dva-patsienta-odin-ball-raznaya-tyazhest.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Два пациента с одинаковым баллом риска — белый и чёрный; при более внимательном измерении
    состояния здоровья чёрный пациент оказывается заметно более болен — и это не случайный шум измерения,
    а систематическое смещение, которое проявляется у всех пациентов этой группы сразу, в одну сторону
  learning_goal: Продолжение сцены n25 — конкретная пара пациентов + довод «шум гасится усреднением, смещение
    от усреднения крепнет», который направляет к вопросу классу. Источник — part3b.md §B.1 (n26).
  visual:
    pattern: problem_scenario
    primary: 'Два силуэта рядом, у каждого одинаковый балл риска (50-й процентиль), подпись под каждым
      — реальная тяжесть состояния по более внимательному измерению. Внизу — формула-итог про шум и систематическое
      смещение.

      '
    backup: Источник — part3b.md §B.1 (n26). Факт «чёрный пациент при идентичном балле оказывается более
      болен» — Obermeyer et al., Science, 2019.
- id: n27
  file: slides/n27-vopros-chto-vzyali-vmesto-potrebnosti-v-pomoshchi.md
  type: reflection_question
  duration_min: 1.75
  assertion: 'Расы на входе алгоритма нет вообще — ни прямо, ни через явный суррогат; вопрос классу: что
    из перечисленного алгоритм мог взять в качестве замены слову «потребность в помощи», и почему именно
    этот выбор мог пойти не так по линии расы'
  learning_goal: Вопрос классу кейса B (A.2.3). Четыре карточки — все правдоподобны, выбор по рассуждению
    о скрытой истории доступа к медицине, не по узнаванию. Источник — section-2-routing.md §A.2.3, part3b.md
    §B.2 (n27).
  visual:
    pattern: question_with_option_cards
    primary: 'В золотой рамке — вопрос дословно. Под рамкой четыре равные карточки, ни одна не подсвечена,
      фиксированный порядок. Ни цифр, ни источников на слайде.

      '
    backup: Источник — section-2-routing.md §A.2.3, part3b.md §B.2 (n27).
- id: n28
  file: slides/n28-razbor-proshlye-raskhody-kak-podmena-potrebnosti.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: Правильный ответ — прошлые расходы на здравоохранение; они действительно связаны со здоровьем,
    но в США чёрные пациенты исторически получают меньше медицинской помощи при той же тяжести заболевания,
    и это искажение алгоритм выучил целиком вместе с полезным сигналом
  learning_goal: 'Разбор карточек n27 — целевая строка выделена золотом. Форма — две содержательные колонки
    (правило А5): кандидат + что обнаружило исследование; измеримость — общая для всех четырёх кандидатов,
    поэтому вынесена во вводную фразу, а не в отдельную третью колонку (ИСПРАВЛЕНО фикс-кругом — было
    три колонки, нарушение А5). Числа и масштаб — Obermeyer et al., Science 2019. Источник — section-2-routing.md
    §A.2.4, part3b.md §B.3 (n28).'
  visual:
    pattern: answer_breakdown_table
    primary: 'Вводная фраза: все четыре кандидата измеримы без нового сбора данных. Таблица на четыре
      строки, две содержательные колонки — кандидат / что обнаружило исследование (кандидаты вопроса n27),
      целевая строка подсвечена золотом. Под таблицей — формула-итог с числами масштаба (вдвое меньше
      направленных, 17,7% → 46,5%, ~200 млн человек/год).

      '
    backup: Источник — part3b.md §B.3 (n28). Факты и числа — Obermeyer, Z. et al., «Dissecting racial
      bias in an algorithm used to manage the health of populations», Science, 2019, DOI 10.1126/science.aax2342.
      Независимо перепроверено Фазой 3 (SVERKA-PLAN.md п.3). Три других кандидата в тексте раздела по-отдельности
      не детализированы — правильный ответ («прошлые расходы») зафиксирован планом и первоисточником;
      остальные три на слайде отмечены как «не тот признак», без выдумывания механизма для каждого — см.
      отчёт Фазы 4.
- id: n29
  file: slides/n29-divider-chislo-bez-rasy-rezultat-raznyy-po-rase.md
  type: section_divider
  duration_min: 2.0
  assertion: Кейс Optum разобрал один домен и одно конкретное число — прошлые расходы; тот же вопрос стоит
    задать второй раз, в домене, где ответом окажется не расходы, а что-то совсем другое — и единственное,
    что переносится между двумя кейсами без изменений, это сама форма ошибки, не конкретный признак
  learning_goal: Дивайдер кейса C, форма — вопрос, третья вариация (правило П3). Методологическая связка
    «почему нужен второй случай, а не один» — два случая с разной механикой внутри показывают закономерность,
    один случай показывает только инцидент. Источник — section-2-routing.md §A.3.1, part4b.md §B.1 (n29).
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный Ocean-фон, вопрос крупно в кавычках, золотая линия под ним. Ниже — короткая смысловая
      строка про перенос формы ошибки, не признака. Внизу — дорожка трёх кейсов ступени, кейс C подсвечен.

      '
    backup: Источник — section-2-routing.md §A.3.1, part4b.md §B.1 (n29). Методологический довод «два
      случая — минимум для закономерности» — part4b.md §B.1, остаётся частью заметок дивайдера, не выносится
      отдельным тезис-слайдом.
- id: n30
  file: slides/n30-stsena-irs-otbor-deklaratsiy-na-proverku-eitc.md
  type: problem_scenario
  duration_min: 2.0
  assertion: Внутренние алгоритмы IRS отбирают декларации для аудита в основном через скрининг заявок
    на EITC — налоговый вычет для низкооплачиваемых работников; у двух налогоплательщиков с похожими декларациями,
    белого и чёрного, вероятность получить письмо о проверке заметно выше у второго, хотя раса нигде в
    данных не собирается
  learning_goal: 'Сцена кейса C: EITC поясняется inline при первом появлении (§5.8b), масштаб (десятки
    миллионов деклараций), устойчивость разницы по годам (не разовый разброс). Источник — section-2-routing.md
    §A.3.2, part4b.md §B.1 (n30).'
  visual:
    pattern: problem_scenario
    primary: 'Короткая подводка про отбор на аудит через EITC с inline-расшифровкой вычета. Ниже — пара
      налогоплательщиков с похожими декларациями, один белый, один чёрный. Внизу — строка про устойчивость
      разницы по годам работы алгоритма.

      '
    backup: Источник — part4b.md §B.1 (n30). EITC поясняется дословно по тексту раздела — вычет для работников
      с низким доходом.
- id: n31
  file: slides/n31-vopros-vo-skolko-raz-chashche-audirovali.md
  type: reflection_question
  duration_min: 1.5
  assertion: 'Вопрос здесь меняет форму намеренно: не выбрать карточку, а назвать число вслух — во сколько
    раз чаще, по сравнению с другими налогоплательщиками со схожими декларациями, по этим данным аудировали
    чернокожих налогоплательщиков'
  learning_goal: Сбой ритма блока (П4) — вопрос без карточек, зал называет число до разбора. Интуиция
    расходится в обе стороны (меньше двукратной / на порядок больше), и это свойство само по себе методически
    значимо, но не выносится на видимый слой как подсказка — иначе смещает ответ зала. Источник — section-2-routing.md
    §A.3.3, part4b.md §B.2 (n31).
  visual:
    pattern: guess_the_number
    primary: 'В золотой рамке — вопрос дословно, без карточек-вариантов. Под рамкой — пустая строка для
      устных ответов зала (не печатается заранее). Ни интуитивных якорей, ни распределения ответов на
      слайде — зал называет число, не выбирает из подсказанного диапазона.

      '
    backup: Источник — section-2-routing.md §A.3.3, part4b.md §B.2 (n31). Форма вопроса меняется намеренно
      (не карточки — число) — после кейса B у зала уже рабочая гипотеза про механизм, неизвестным остаётся
      масштаб. Обсуждение расхождения интуиций в обе стороны — в заметках, не на видимом слое, чтобы не
      подсказывать диапазон до голосования.
- id: n32
  file: slides/n32-razbor-tot-zhe-mekhanizm-drugoy-domen.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: Чёрных налогоплательщиков аудировали в 2,9–4,7 раза чаще при сравнимых декларациях; расового
    признака в алгоритме нет и не было — причина в том, как классификатор взвешивал дешевизну проверки
    и отношение возврата к доходу, тот же механизм, что в кейсе B, только без общего признака «расходы»
  learning_goal: 'Разбор кейса C: число (подтверждено самим IRS), механизм (дешёвые-для- аудита декларации
    с высоким отношением возврата к доходу), и прямая связка с кейсом B — общий признак подмены не «что
    измеряется», а «что считается удобным». Форма — две содержательные колонки (правило А5): кейс-метка
    + единый «механизм подмены», а не три отдельных измерения (ИСПРАВЛЕНО фикс-кругом — было три колонки,
    нарушение А5). Источник — section-2-routing.md §A.3.4, part4b.md §B.3 (n32).'
  visual:
    pattern: answer_breakdown_table
    primary: 'Число крупно и золотом (2,9-4,7×), подтверждено самой IRS. Ниже — короткая таблица на две
      строки и две содержательные колонки: кейс-метка / механизм подмены (что оптимизировал алгоритм и
      через что это ударило по расе — в одной ячейке на кейс).

      '
    backup: Источник — part4b.md §B.3 (n32). Число и подтверждение IRS — Stanford SIEPR, «IRS confirms
      Stanford study of racial bias in audits», 2023 (siepr.stanford.edu/news/irs-confirms-stanford-study-racial-bias-audits).
- id: n33
  file: slides/n33-granitsa-stupeni-kogda-marshruta-ne-hvataet.md
  type: criteria_boundary
  duration_min: 2.0
  assertion: Маршрут по заранее заданным классам работает, когда классы известны и не пересекаются, а
    ошибка видна по результату; маршрута не хватает, когда классы неизвестны или пересекаются и ошибка
    систематическая, видимая только на статистике по множеству решений — это предвестник одного агента
    (Семинар 10)
  learning_goal: Граница ступени (правило А7, прямая форма) после всех трёх кейсов. Таблица дословно из
    плана. Передача — предвестник одного агента, разбирается в С10, здесь только назван. Источник — section-2-routing.md
    §A.4, part4b.md §B.4 (n33).
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Таблица в две колонки, три строки: когда маршрут работает / когда не хватает. Третья строка
      — главный мостик кейсов B и C к кейсу A (ошибка видна по одному случаю / видна только на статистике).
      Под таблицей — прямая передача к Семинару 10, без разворота в декларацию синтеза.

      '
    backup: Таблица — дословно section-2-routing.md §A.4. Передача к Семинару 10 — part4b.md §B.4, ARCHITECTURE.md
      §5.
- id: n34
  file: slides/n34-os-promezhutochnaya.md
  type: recap_table
  duration_min: 6
  assertion: 'Три нижние строки лестницы закрыты: хватит одного вызова, цепочка, маршрут с decision-моделью.
    Шесть строк выше — пустые до следующих пяти занятий.'
  learning_goal: 'Контрольная точка в конце занятия: та же лестница из девяти строк, что мостик `b0` показал
    целиком пустой, теперь прочитана с тремя закрытыми нижними строками (ARCHITECTURE.md §6). Это не пересказ
    двух сегодняшних кейсов, а визуальное замыкание контракта, открытого в начале занятия — тот же объект,
    прочитанный в конце с другим результатом.

    '
  visual:
    pattern: recap_table
    primary: 'Тот же светлый фон и та же коробка-таблица на девять строк, что на `b0-mostik-urovenj` —
      зеркальная пара, не новый визуал. Четыре колонки без изменений («Строка», «Что», «Закрывает», «Статус»);
      меняются только значения колонки «Статус»: у строк 0–2 — «закрыто», у строк 3–8 — «пусто», без изменений.
      Внизу — подпись-формула во всю ширину, без кавычек-реплики.

      '
    backup: 'Источник: `ARCHITECTURE.md` §6 (три нижние строки закрыты, шесть пустых) и `SPLIT-PLAN-7-12.md`
      §2 (исходная лестница, те же девять строк и те же названия узлов, без переименования — правило §3
      "абстракции не изобретаются"). Таблица и порядок строк идентичны `b0-mostik-urovenj`: сравнение
