# library/lectures/lec-15/deck.yaml
#
# Deck-структура Лекции 15 «AI в научных исследованиях»
# v1: 39 слайдов (Phase 5 initial deck structure).
#
# Phase 5 multi-artifact pipeline. Issue #143.
#
# Pattern carry-forward от Лекций 11, 13, 14:
#   - 39 слайдов общим объёмом
#   - section dividers (6 шт.): s06 / s12 / s20 / s26 / s32 / s38
#   - cover (s02), lecture-map (s03), glossary (s04), central question (s05) — Введение
#   - dedicated Q&A slide (s38), bridge к lec-16 (s39 closing hero)
#   - Hero on s01 (Side-by-side AlphaFold Nobel + Galactica retraction, ≥40% area)
#   - Hero on s39 (AlphaFold DB website screenshot bridge к Lec-16, ≥40% area)
#
# Keystone (Variant A, LOCKED owner decision #1):
#   «Лестница научного цикла» из 6 ступеней Hypothesis → Design → Experiment → Analyse → Write → Review.
#   Cyclical (в отличие от sequential лестниц lec-13/14).

deck:
  lecture_number: 15
  title: "AI в научных исследованиях"
  audience: "студенты-инженеры 3 курса (универсальная, не отраслевые специалисты)"
  duration_min: 75
  central_question: "Где AI делает прорыв в науке, где он создаёт фабрику статей, и как инженер должен решать, в какой класс попадает его конкретный случай?"
  learning_outcomes: [LO4, LO5, LO6, LO8]
  language: ru
  status: draft
  version: v1
  source: chapter v2.2 multi-part (status=approved-USER-GATE-A, ~32 850 слов; chapter.md + chapter-part2.md + chapter-part3.md + chapter-part4.md)
  plan: notes/lecture-15-review/plan-v2.md + plan-v2-part2.md
  keystone_axis: "Лестница научного цикла (Hypothesis → Design → Experiment → Analyse → Write → Review) — cyclical, итеративная"

# Final slide list (39 slides). Подробный outline per slide см. plan-v2.md / plan-v2-part2.md
# Введение s01-s05 | §1 s06-s11 | §2 s12-s19 | §3 s20-s25 | §4 s26-s31 | §5 s32-s37 | §6 s38-s39
# Section dividers: s06, s12, s20, s26, s32 (Q&A s38 — dedicated lec-13/14 pattern)
# Hero slides: s01 (AlphaFold Nobel + Galactica composite) + s39 (AlphaFold DB → bridge к Лекции 16)
# Walked examples: s07 WE-1 (grant idea), s25 WE-TESS, s28 WE-2 (bibliography), s34 WE-3 (catalyst)
# Failure deep-dives: s10 Sakana cherry-pick, s17 Palgrave critique, s24 AlphaFold IDP, s29 Frontiers крыса, s30 NeurIPS fake citations

