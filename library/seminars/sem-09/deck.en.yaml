- id: n42
  file: slides-en/n42-k3-nyuansy-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.0
  assertion: A code check belongs where the criterion can be written and read; where there's no criterion,
    neither code nor a reliable judge can be built — and that's known before building anything
  learning_goal: 'Case 3''s nuances and boundary in the plain, imperative form the course requires (A7):
    ''when it''s needed · when it isn''t,'' with the technique''s own limit named — the fragility of a
    substring check to grammatical case, measured on our own rig.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Three numbered nuance banners, below them a two-column table "when it''s needed · when it
      isn''t" — strictly for contrast — and a closing banner on the limit of acceptance, with its own
      measurement.

      '
    backup: 'The nuances follow SETKA-KEYSOV-S9.md, section "Case 3," subsection "Nuances," all three.

      Nuance 1 rests on external numbers from CHISLA-SVERENO.md: row 12 (arXiv:2303.17651, status CHECKED
      — five step-by-step retry values found verbatim) and row 11 (Huang and co-authors, arXiv:2310.01798).
      The gain of the first step, 2.05 points, and of the fourth, 0.45, are computed from these five values
      and named on the frame as gains, not as independent measurements of their own. I narrowed the grid''s
      wording "with ground truth the curve plateaus" to what the fact check actually confirms: where there''s
      a gain, it plateaus fast; where there is no correctness criterion at all, the curve goes down. CHISLA-SVERENO.md
      doesn''t support claiming that the first measurement specifically used an external ground truth.
      Flagged to the orchestrator as a report.

      Nuance 2 is a property of the built-in loop: the attempt counter is set by hand. The template number
      and the expression name are not carried onto the frame (CHISLA-SVERENO.md, row 15, status "not re-checked
      this round"): the frame states the mechanism, which doesn''t depend on the template number.

      THE GRID''S MANDATORY CAVEAT STANDS AS A CLOSING BANNER, not a footnote: the fragility of an exact
      substring match to grammatical case, 1 case out of 6 (`stend/zamery-k1-k3/README.md`, the "not converged"
      breakdown and items 2 and 6 of the "What wasn''t confirmed" section). Alongside it, both honest
      halves from the same source: the same question, in a no-loop build, got an answer in the needed
      grammatical case and passed the check — meaning this is sample spread, not a difference between
      builds; and this particular check was written by the measurement''s own author, not taken as a model
      example — a more carefully written criterion wouldn''t have had this weakness.

      UPDATED 2026-10-26: this specific case was fixed and re-measured — `code_check_node()` got a regex
      branch for kb5, tolerant of grammatical case, and the re-measurement gave 6 of 6 (executions 829–834,
      `README.md` § "Fix 2026-10-26"). This doesn''t cancel the banner''s conclusion: the check catches
      form, not meaning — the fix removed one measured instance of this property showing up, not the property
      itself. The other five keywords in the check didn''t get a regex; their case-sensitivity risk is
      neither measured nor ruled out.

      The boundary is stated in the plain, two-column form. The right column rests on what this very case
      measured (cost in calls, false rejections), not on general words about applicability.'
