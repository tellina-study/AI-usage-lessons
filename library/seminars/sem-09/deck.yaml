      '
    backup: 'Решение — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Решение», слой 1: база знаний
      лежит в промте целиком, но порядок пунктов — явный параметр процесса, частые и критичные темы к
      началу или концу списка, не в порядке исторического добавления. Устройство промта — по настоящему
      тексту на стенде (`stend/sborka.py`, `case1_v1`).

      Имён узлов, имени оркестратора и латиницы на кадре нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящая панель — следующим экраном.

      РАСХОЖДЕНИЕ МЕЖДУ ТАКТОМ И ГОТОВОЙ ФИГУРОЙ, НАЙДЕНО 2026-10-26, ПРАВИТСЯ НЕ ЗДЕСЬ. Имя фигуры закреплено
      БРИФ §5 за слоем 1, и слайд его не меняет. Но готовая `rendered/figures/k2-shema-promt-i-kesh.png`
      нарисована не под этот такт, а под такт ловушки кэша: её собственный исходник (`rendered/make_figures_k2.py`,
      докстрока) так и говорит — «отсюда ловушка, ради которой схема и нарисована». На кадре стоят плашка
      цены (1,25× запись против 0,1× чтение) и правый столбец с выводом «сброшен весь накопленный кэш,
      не одна строка» — то есть содержание тактов n25 и n26, предъявленное на три-четыре экрана раньше.
      И при этом РЕШЕНИЯ ЭТОГО ТАКТА на схеме нет вовсе: порядка пунктов, перенесённых к краям, она не
      показывает ни одной линией.

      ЧТО НУЖНО ОТ ФИГУРЫ НА ЭТОМ ТАКТЕ: строение промта (указание → справочник → контрольная точка →
      вопрос клиента) и панель «порядок по истории против порядка по важности». Плашку цены и правый столбец
      со сбросом кэша — на такты n25 и n26, где они и разбираются. Решение за оркестратором: либо схема
      делится на две, либо этот такт получает свою, а нынешняя переезжает на n26.

      Видимый текст слайда написан так, чтобы он был верен при любом из этих решений: он называет строение
      промта и выбор порядка, цены не называет ни одной.'
- id: n23
  file: slides/n23-k2-n8n-promt.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Настоящее поле промта: справочник лежит в нём целиком, все десять пунктов полным текстом,
