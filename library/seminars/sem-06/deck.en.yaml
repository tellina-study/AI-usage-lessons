- id: n04
  file: slides-en/n04-vopros-dva-promaha-prichiny-protivopolozhnye.md
  type: reflection_question
  duration_min: 1.25
  assertion: 'Two misses in one week, with opposite causes: the first was not inside at all, the second
    fit inside whole and crowded the work out — hence the seminar''s question, which is asked twice today'
