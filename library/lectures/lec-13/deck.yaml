# library/lectures/lec-13/deck.yaml
#
# Deck-структура Лекции 13 «AI в логистике и транспорте»
# v1 по pattern lec-11.
#
# Phase 5-7 multi-artifact pipeline. Issue #135.
#
# Pattern carry-forward от Лекции 11:
#   - section dividers (4 шт.): s06 / s13 / s23 / s33
#   - cover (s02), lecture-map (s03), glossary mini (s04), keystone (s05) — Раздел 0
#   - dedicated Q&A slide (s40), bridge к lec-14 (s41 closing hero)
#   - Hero on s01 (Waymo Jaguar I-Pace, ≥40% area) + s41 (NOC bridge к lec-14, ≥40% area)
#
# Keystone axis: лестница структурированности среды (5 уровней)
#   уровень 1 controlled (склад/порт/рельсы) → §1
#   уровень 2 highway (магистраль) → §2
#   уровни 3+4 urban+last-mile (robotaxi+sidewalk+drone) → §3
#   уровень 5 exception (black-swan) + decision framework → §4
#   замыкание + bridge к lec-14 → §5

deck:
  lecture_number: 13
  title: "AI в логистике и транспорте"
  audience: "студенты-инженеры 3 курса (универсальная, не отраслевая)"
  duration_min: 75
  central_question: "Почему Waymo выжила, Cruise разорилась, Tesla только начинает? Дело не в технологии — дело в среде. Где AI работает в логистике, где нет — и как инженер должен решать?"
  learning_outcomes: [LO1, LO2, LO7]
  language: ru
  status: draft
  version: v1
  source: chapter v2 multi-part (status=draft, ~31k слов; chapter.md + chapter-part2.md + chapter-part3.md)
  plan: library/lectures/lec-13/lecture-outline.md
  keystone_axis: "Лестница структурированности среды — 5 уровней от controlled warehouse к exception black-swan"

# Final slide list:
#
# Section 0 — Открытие + keystone + lecture-map + glossary (5-7 мин):
#   s01 — hero hook: Waymo Jaguar I-Pace SF/LA (3 картинки рядом — Cruise / Waymo / Tesla)
#   s02 — cover (lecture title + meta + roadmap-bar)
#   s03 — lecture-map (5 horizontal section cards)
#   s04 — glossary mini (SAE J3016, ODD, AMR, AV, OR, HD-map, EOQ, HITL/HOOL/HOTL)
#   s05 — keystone: лестница 5 уровней структурированности среды
#
# Section divider 1
#   s06 — divider Section 1: Controlled (склад / порт / рельсы)
#
# Section 1 — Controlled environment (12 мин):
#   s07 — Symbotic + Walmart 400 APD ($5B backlog)
#   s08 — Amazon Robotics 1M+ роботов (Sparrow / Sequoia / Proteus / Vulcan)
#   s09 — AMR Locus + GreyOrange + Geek+ + worker workload pushback
#   s10 — Port automation ABB / Konecranes / ZPMC + ILA strikes 2024
#   s11 — KONUX rail PdM + границы humanoid hype / capital intensity / lights-out myth
#   s12 — Failure-matrix Раздел 1
#
# Section divider 2
#   s13 — divider Section 2: Highway (магистраль)
#
# Section 2 — Highway (15 мин):
#   s14 — Aurora Innovation Dallas-Houston май 2025 — первая commercial L4
#   s15 — Mobileye Chauffeur L3 + КамАЗ-54901 М-11 «Нева»
#   s16 — UPS ORION (canonical OR success, не RL) — fundamental slide
#   s17 — AV-bankruptcy timeline (Argo Oct 2022 / Embark Mar 2023 / TuSimple Jan 2024 / Waymo Via 2023 / Starsky Mar 2020)
#   s18 — Cumulative $20B+ chart non-survivors
#   s19 — Survivor consolidation 10:1 (Waymo / Aurora / Mobileye)
#   s20 — «AV решит trucker shortage» — false framing (78K дефицит vs ~10 Aurora trucks)
#   s21 — Failure-matrix Раздел 2
#   s22 — Stefan Seltz-Axmacher quote («sim-to-real has very real limits»)
#
# Section divider 3
#   s23 — divider Section 3: Urban robotaxi + last-mile
#
# Section 3 — Urban + last-mile (15 мин):
#   s24 — Waymo 500K rides/week, 14M cumulative, 10+ городов
#   s25 — Apollo Go (Baidu) + Pony.ai + WeRide — Китай 3 крупных
#   s26 — Pony.ai Гуанчжоу Nov 2025 + Шэньчжэнь Feb 2026 (positive unit profit) [P0 cascade fix]
#   s27 — Tesla Robotaxi Austin (14 ДТП / 800K миль / vision-only без HD-map)
#   s28 — Last-mile: Starship 9M+ / Coco 1K LA / Zipline 100M миль Africa + Nuro pivot
#   s29 — Cruise GM exit December 2024 — centerpiece ($10B → 0 timeline)
#   s30 — Uber Tempe 2018 (NTSB report) — first AV-pedestrian fatality
#   s31 — Tesla Autopilot NHTSA SGO (54 verified fatalities)
#   s32 — Failure-matrix Раздел 3
#
# Section divider 4
#   s33 — divider Section 4: Exception + decision framework
#
# Section 4 — Exception + decision (15 мин):
#   s34 — Houthi Red Sea 2024 — 90% drop за 2 месяца + Cape of Good Hope rerouting
#   s35 — Suez Ever Given 2021 — 12% world trade + AI не имела роли
#   s36 — COVID 2020 supply chain meltdown + JIT fragility
#   s37 — ATA trucker shortage 78K (2022) → 60K (2023) — структурный, не AI
#   s38 — Decision framework: 5 критериев «AI или не AI»
#   s39 — Alternative toolkit (OR / EOQ / scenario planning / rule-based / HITL) матрица
#
# Section 5 — Замыкание (5 мин):
#   s40 — Q&A + 5 вопросов вендору карточка
#   s41 — closing hero: telecom NOC (bridge к Лекции 14)

