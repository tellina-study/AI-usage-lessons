  central_question: "Модель посмотрела первой. Что теперь делает человек — и кто это измерял?"
  curriculum_level: "отраслевая лекция L7; strict-in ≥30% обязателен, waiver недоступен"
  deck_parts: [deck.yaml, deck-part2.yaml, deck-part3.yaml]
  builder: deck/build_lec07.py   # читает slides/*.md, НЕ этот файл
  sources:
    chapter_parts: 16            # chapter.md + 15 файлов chapter-part*.md
    plan: SLIDE-PLAN.md
    plan_tables: [SLIDE-PLAN-table.md, SLIDE-PLAN-desc-A.md, SLIDE-PLAN-desc-B.md, SLIDE-PLAN-desc-C.md]
    block_plans: plans/          # поимённые минуты кадров
    cut_order: CUT-ORDER.md
    decisions: decisions-owner.md
    images: deck/images.md
  generator: deck/make_deck_yaml.py   # выгружает ЭТОТ файл из slides/*.md; перезапускать после правок фронтматтера

