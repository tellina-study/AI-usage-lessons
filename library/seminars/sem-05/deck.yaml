    backup: 'STRUCTURE-PROPOSAL-part2.md, К3 такт 5, дословно. ДВЕ строки помечены жирным во всех трёх
      ячейках — по правилу rendered/RENDERER-NOTES.md п.2 обе получат золото, это намеренно: целевых ответов
      два. Номера 1 и 2 стоят в тексте ячейки, потому что порядок между ними — содержательная часть ответа,
      а не оформление. Числа 19 из 20 и 27 мс — из измерения в assets/captures/36-hook-latency-measured.md
