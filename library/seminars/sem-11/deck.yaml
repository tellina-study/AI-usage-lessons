# Продвинутые практики RAG
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 11
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n04    8.00 мин
#   Кейсы      n05–n94   81.75 мин
#   Закрытие   n95–n98    7.00 мин
#   ИТОГО                  96.75 мин при слоте 90

deck:
  seminar_number: 11
  title: Продвинутые практики RAG
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 96.75
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + настоящие скрины живого
    холста n8n.lessons.tellian.io во всех пяти кейсах + схемы постановки задачи (сплошным — то, что уже
    собрано, пунктиром — то, что предстоит сделать; канон `tools/seminar-production/forma-keysa-s-zamerom.md`)
    + пять измеренных замеров на этом стенде (корпус SberQuAD, переиспользован с Семинара 10), протоколы
    в `stend/`
  cover_hook: null
  central_question: Что сделать с вопросом перед поиском?
  language: ru
  slide_count: 98
  axis: Пять утверждений, каждое выглядит разумным следующим шагом после рецепта С10; чем каждое оказывается
    — заполняется измеренным, по строке за кейс
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Рецепт прошлого занятия — один способ резать, искать и смешивать — работал на базе, где его
    измеряли; сегодня он усложняется там, где перестаёт работать сам по себе
  learning_goal: 'Обложка. Называет тему занятия словами из ARCHITECTURE.md, не номер ступени дуги — он
    открытый вопрос (issue #346, ARCHITECTURE.md §1 явно запрещает его присваивать).'
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия и номера ступени дуги на экране нет.

      '
    backup: 'Название — дословно словами ARCHITECTURE.md (поле title, «Продвинутые практики RAG») и SETKA-KEYSOV.md
      («Тема занятия»). Номер семинара и номер ступени дуги на обложке не печатаются — тот же приём отсутствия
      номера, что у обложек С6/С8/С9 (sem-06/qa/oblozhka-bez-nomera.md), и отдельно обязателен здесь:
      issue #346 оставил номер ступени дуги С7–С12 открытым, присваивать его самовольно нельзя (ARCHITECTURE.md
      §1). Фигуры на обложке нет сознательно: ось занятия ставится дословно на n03 и возвращается на n95,
      третье место на обложке сбило бы счёт этих двух.'
- id: n02
  file: slides/n02-shov-s10-s11.md
  type: content
  duration_min: 2.5
  assertion: Семинар 10 закрылся заполненной осью о происхождении фактов — рецепт работал на базе, где
    его измерили; вопрос, который встаёт сразу за этим, открывает сегодняшнее занятие
  learning_goal: 'Шов с С10. Входное состояние — дословная цитата закрытой оси С10 (rework/section-0-otkrytie.md,
    раздел «Где мы остановились») + вопрос, с которого начинается С11 (канон §2 README: шов переносится
    дословно, не пересказывается).'
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: таблица закрытой оси С10 (4 строки, дословная цитата), под ней цитата
      долга предыдущего закрытия, под ней вопрос, которым открывается сегодняшнее занятие.

      '
    backup: Текст — дословно rework/section-0-otkrytie.md, раздел «Где мы остановились» = sem-10/rework/section-6-zakrytie.md,
      раздел «Ось занятия, теперь заполненная» + последний абзац раздела «Что переезжает дальше по циклу».
      Вопрос в конце — дословно из того же раздела section-0, последний абзац.
- id: n03
  file: slides/n03-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.5
  assertion: Пять утверждений, каждое выглядит разумным следующим шагом после рецепта С10; чем каждое
    оказывается — заполняется измеренным, по строке за кейс
  learning_goal: 'Несущая ось занятия: какую цену платит каждое усложнение рецепта С10, и когда эта цена
    оказывается дороже дефекта, который оно чинит. Вопрос занятия задаётся здесь дословно и дословно же
    возвращается на n95. Правая колонка открывается пустой и закрывается на n95, не здесь.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, пять строк. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — дословно из rework/section-0-otkrytie.md, раздел «Ось занятия», пять строк
      в том же порядке. Вопрос занятия — тоже дословно оттуда (раздел «Вопрос занятия»). Тот же текст,
      знак в знак, стоит на n95; сверка двух мест обязательна при пересборке. ЗАГОЛОВОК И ПЕРВАЯ СТРОКА
      — ПРО САМУ ОСЬ (Pre-USER-GATE §6): заголовок называет вопрос, которым занятие мерит каждый свой
      разбор. Пять строк (не четыре, как у С10) — по числу кейсов С11.'
- id: n04
  file: slides/n04-chto-segodnya.md
  type: content
  duration_min: 2.5
  assertion: Пять полноценных технических кейсов подряд, без лёгкого разбавителя между ними; каждый стоит
    на прогоне собственного стенда на реальных данных
  learning_goal: Обзор занятия. Называет пять кейсов по задаче (не по тезису), без раскрытия находок.
    У этого занятия нет концептуального разбавителя (ARCHITECTURE.md §4) — пять полноценных кейсов; шестой
    пункт-разбавитель не упоминается, его не существует.
  visual:
    pattern: content
    primary: 'Список из пяти пунктов, каждый — одна-две строки задачи без спойлера находки. Разбавителя
      в списке нет и не подразумевается.

      '
    backup: 'Источник — rework/section-0-otkrytie.md, раздел «Что разбирается сегодня», переложено в компактный
      список. Имена кейсов — по задаче (канон §1 проектирования). Находки (например, обратный эффект HyDE
      в Кейсе 1 или провал семантического чанкинга в Кейсе 2) сознательно НЕ вынесены на этот слайд: спойлер
      здесь нарушил бы А1/С2 (результат раньше самого кейса).'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Вопрос обратившегося и формулировка в базе расходятся словами — неясно, какой из способов
    «поправить вопрос перед поиском» не сделает хуже случай, который уже работал
  learning_goal: 'Дивайдер Кейса 1. Называет проблему (А2), не решение: расхождение словаря между вопросом
    и базой, и неопределённость, какой способ трансформации запроса безопасен. Не выдаёт измеренного результата
    (С2 — числа позже).'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка проблемы крупно. Внизу дорожка пяти кейсов занятия, первый подсвечен.

      '
    backup: Название кейса — «Трансформация и размножение запроса», по задаче, не по тезису/уроку (канон
      §1 проектирования). Формулировка — SETKA-KEYSOV.md, Кейс 1, «Дивайдер-проблема», дословно.
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Команда поддержки учебного центра Ольги включает multi-query и RAG-Fusion, чтобы поднять
    recall; тест показывает рост, через неделю тикеты показывают регресс — реранкер и обрезка выдачи съели
    выигрыш, видимый только на промежуточном шаге
  learning_goal: 'Такт сцены Кейса 1: живая постановка — что случилось у Ольги, версия 1 как естественное
    усложнение, и риск, который она несёт. Без вердикта и без полной формулировки разворота (правило А6/С2:
    находка — тактом разбора, числа — тактом замера).'
  visual:
    pattern: problem_scenario
    figure: case1-shema-postanovka.png
    primary: 'Сверху — схема С1 (канон forma-keysa-s-zamerom.md §2): сплошным — поток, уже работающий
      с Семинара 10 (вопрос обратившегося → гибрид keyword+vector RRF → ответ); пунктирная золотая рамка
      — новый узел, который пробует добавить этот кейс: ИИ-обработка вопроса перед эмбеддингом. Под схемой
      — сцена Ольги: что случилось, когда команда поддержки включила такой узел не глядя на тип вопроса.

      '
    backup: Сцена перенесена на сквозного персонажа Ольгу продюсерской правкой этой сессии (ARCHITECTURE.md
      §6, канон §A13 — «если кейсу нужен другой человек — отдельное явное решение продюсера», не default-замена;
      здесь исходный черновик `rework/section-1-transformatsiya-zaprosa.md` опирался на «инженера поддержки»
      без такого решения — пропуск Фазы 2, закрыт этой правкой slides-сессии). Механика и числа документированного
      случая (arXiv:2603.02153, Hit@10 0,51→0,48) перенесены на сюжет без изменений — тем же приёмом,
      каким Кейсы 2/4/5 уже перенесли Habr/WYDOT/Dharshiny5.
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.0
  assertion: Три действия перед поиском — ни одно не названо победителем заранее
  learning_goal: 'Вопрос Кейса 1: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор (§5 проектирования), не факт о возможностях модели. Сравниваются
    сразу три полноценные альтернативы (не последовательная итерация) — допустимое отступление по ARCHITECTURE.md
    §6/proektirovanie-keysa-i-voprosa.md §4.'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке, три карточки равной ширины, без доводов и вердиктов. Разбор — следующим
      экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV.md / rework/section-1-transformatsiya- zaprosa.md, «Вопрос
      залу»: три действия, каждая проверена подстановкой повелительного глагола («искать», «переформулировать»,
      «сочинить») — §5 проектирования.'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 1.0
  assertion: Три действия решают одну и ту же задачу разными средствами — какое из них безопасно на каком
    вопросе, этот такт ещё не говорит
  learning_goal: 'Качественный разбор трёх действий СРАЗУ после вопроса (n07 → n08), без единого числа
    результата — канон С2 (`forma-keysa-s-zamerom.md`) не нарушен: экспозиция и свод замера идут позже
    (n09/n10). 4-колоночная форма «Действие · Как делает · Преимущество · Недостатки» (правило А5). Названия
    действий дословно повторяют карточки вопроса n07.'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Три строки. Никаких чисел на
      кадре.

      '
    backup: 'Текст — очищенная от чисел версия разбора в rework/section-1- transformatsiya-zaprosa.md,
      «Разбор вариантов»: колонка «Как делает» и качественная часть «Преимущество»/«Недостатки», числа
      (recall@1, п.п.) убраны и появятся на n13/n14 после экспозиции замера.'
- id: n09
  file: slides/n09-k1-struktura-zamera.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: Пятьдесят вопросов, уже разделённые кодом на три класса по тому, насколько слова вопроса
    совпадают со словами верного документа, проходят через все три действия на одном и том же 500-документном
    корпусе — ни одного результата на этом кадре
  learning_goal: 'Такт С2 (структура замера, `forma-keysa-s-zamerom.md` §1): модель и её настройки, что
    варьируется, пример вопроса и ожидаемый ответ — до того, как на кадре появится хоть одно число исхода.
    Опора на память зала о корпусе С10 запрещена (С8) — корпус и стратификация описаны заново.'
  visual:
    pattern: measured_outcome_table
    primary: 'Плашка с моделями сверху, таблица «что варьируется» (lexical-класс, действие), плашка с
      примером вопроса и правильным ответом. Ни «верно», ни «неверно», ни одной accuracy/recall на этом
      кадре.

      '
    backup: 'Корпус и стратификация — SETKA-KEYSOV.md / rework/section-1- transformatsiya-zaprosa.md,
      «Разбор вариантов»; полные числа — stend/raw/case1-results.json (exec_id 9686-9841, 50 вопросов).

      МОДЕЛИ И НАСТРОЙКИ (С5): `openai/gpt-4o-mini` — генерирует 3 переформулировки одним вызовом (JSON-массив)
      или один HyDE-абзац; `openai/text-embedding-3-small` — эмбеддинг корпуса, вопросов, переформулировок
      и HyDE-документов. Оба — без явно заданных дополнительных настроек (температура по умолчанию), через
      вебхук стенда `s10-raw-openrouter` (`stend/measure/case1_query_transform_ measure.py`, `CHAT_MODEL`/`EMBED_MODEL`).

      КОРПУС И СТРАТИФИКАЦИЯ: 500-документный корпус SberQuAD, переиспользован буквально с Кейса 1/3 Семинара
      10 (10 needle + 8 confusable-кластеров + дистракторы). 50 вопросов — те же, что Кейс 3 Семинара
      10, отобраны КОДОМ (не руками) по доле общих токенов с верным документом: 16 exact_match (сущность/число
      из вопроса буквально есть в тексте), 16 lexical_gap (≤30% общих токенов — расплывчатая формулировка),
      18 neutral. Keyword-ранжирование оригинального вопроса — константа во всех трёх действиях (изолирует
      эффект именно трансформации на смысловой половине гибрида).

      ПРИМЕР — дословно из `raw/case1-results.json`, qid `c3q41`, класс exact_match, overlap_ratio 1,0
      (вопрос и документ делят все значимые токены).

      НИ ОДНОГО РЕЗУЛЬТАТА НА КАДРЕ (С2): ни recall, ни п.п., ни слова «ошибка». Устройство теста целиком
      — останавливается здесь.'
- id: n10
  file: slides/n10-k1-svod-rezultata.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: Multi-query воспроизводит ожидаемый разворот — вредит точному вопросу; HyDE идёт в обратную
    сторону от того же предсказания — помогает точному вопросу и вредит расплывчатому
  learning_goal: 'Такт С2 (свод) — прямое продолжение n09. Headline-находка вынесена отдельной золотой
    плашкой (правило А11). Метрики сопоставимы (С6): recall@1 — отдельной таблицей по лексическим классам,
    одна размерность.'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица recall@1 3×4 (лексический класс · baseline · multi-query · HyDE) — и golden-плашка
      с headline-находкой: HyDE разворачивается в обратную сторону от интуиции «помогает расплывчатому,
      вредит точному».

      '
    backup: Числа — `stend/raw/case1-results.json`, summary.by_lexical_class, 50 вопросов × 3 варианта
      на 500-документном корпусе; сводка та же, что `stend/README.md`. recall@1 — доля вопросов, где верный
      документ оказался на первом месте выдачи после RRF-фьюжна (keyword-якорь оригинала константой во
      всех трёх вариантах).
- id: n11
  file: slides/n11-k1-razbor-multiquery.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: Multi-query не только вредит точному вопросу — оно же, тем же усреднением голосов, иногда
    роняет уже верный документ далеко вниз на нейтральном вопросе
  learning_goal: 'Такт С2/С3/С4 (разбор по группам, преемник n10): явный вердикт на каждом примере (С3),
    систематическая находка отдельной плашкой (С4). Группа здесь — multi-query, два конкретных вопроса
    с разным лексическим классом и разным исходом регресса.'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица двух примеров multi-query: точный вопрос теряет 1 позицию, нейтральный вопрос теряет
      22 позиции. На каждой строке — вердикт НЕВЕРНО, под таблицей — вывод.

      '
    backup: 'Примеры — дословно из `stend/raw/case1-results.json` (поля `reformulations`, `*_rank_of_gold`).
      c3q41: `baseline_rank_of_gold=1`, `multiquery_rank_of_gold=2`. c3q42: `baseline_rank_of_gold=2`,
      `multiquery_rank_of_gold=24`. Оба — РЕАЛЬНЫЕ переформулировки модели, не сокращены по сути.'
- id: n12
  file: slides/n12-k1-razbor-hyde.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: HyDE проигрывает там, где модель вынуждена выдумать неизвестную ей деталь, и выигрывает там,
    где сочинённый текст просто стилистически точнее короткого вопроса — направление зависит не от лексического
    класса, а от того, насколько хорошо модель знает конкретную сущность
  learning_goal: 'Такт С2/С3/С4, продолжение n11: разбор HyDE на двух примерах, один из которых (c3q10)
    — тот же вопрос, что живой n8n-демонстрация на n18. Явный вердикт на каждом примере (С3), находка
    отдельной плашкой (С4).'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица двух примеров HyDE: расплывчатый вопрос о редкой исторической детали теряет ранг
      из-за выдумки модели; точный вопрос выигрывает ранг благодаря стилистически точному сочинённому
      тексту. Вердикты на кадре.

      '
