    visual:
      pattern: failure_mechanism_plus_lesson
      primary: "Слева — механизм в Ocean rounded box: distribution shift (inline-define) → асимметрия цены ошибки (≈0 рекомендация vs десятки тыс.$ × N) → 3 условия (необратимое+авто+нестационарно без circuit-breaker). Knight callback-плашка ($440M/45мин — тот же класс). Справа — Zillow vs Opendoor + критерий+альтернатива. Gold — «тот же тип ИИ, другая обвязка → банкротство vs выживание»."
    interaction: think_pause

