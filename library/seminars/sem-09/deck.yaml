      2. ДВА РАЗНЫХ ТЕКСТА КЛИЕНТА В ОДНОМ КЕЙСЕ. На фигуре стоит «Сумма возврата: 99000» при заказе на
      900 ₽ — это постановка из сетки кейсов, а не строка замера. Дивайдер n43 и такт n49 держат измеренный
      текст («Сумма возврата: 2500», честная цена 6500 ₽). Прошу свести фигуру к измеренному тексту, иначе
      кейс читается как два разных случая.

      Собственных чисел в тексте слайда нет вовсе — ни одного. Это сознательно: такт слоя 1 объясняет
      устройство, числа вскрывают такты n49–n53.'
- id: n48
  file: slides/n48-k4-n8n-tochka-vetvleniya.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящий холст: развилка — отдельный узел с двумя подписанными выходами, а модель висит
    сбоку от узла извлечения и в развилке не участвует'
  learning_goal: 'Слой 2 Кейса 4 (§2 канона замысла кейса): настоящий снимок живого стенда с настоящими
    именами узлов. На кадре видно, что решение принимает узел условия, а единственный вклад модели — число,
    которое в это условие попадает.'
  visual:
    pattern: mechanism_node_graph
    figure: k4-holst-vetvlenie.png
    primary: 'Настоящий снимок холста n8n живого стенда: `Refund request` → `Extract amount` → узел развилки
      `Amount over threshold?` с двумя подписанными выходами — `true` ведёт в `Result screen (escalate)`,
      `false` в `Result screen (approve)`. Под узлом извлечения на пунктире подвешена сама модель — `Model
      (extraction)`, и пометка `Model` со звёздочкой.

      '
    backup: 'Снимок настоящий: `rendered/figures/k4-holst-vetvlenie.png`, снят `stend/n8n_shots.py` на
      живом стенде; описание кадра и всё, что в него попало, — `rendered/OTCHET-SKRINY.md`, раздел 4.
      Стилизованной карточки вместо снимка здесь нет (БРИФ §5, [[no-mock-fallbacks]]).

      ЧЕСТНАЯ ОГОВОРКА ПРО ПРОИСХОЖДЕНИЕ КАДРА, и она важнее обычной. Снимок снят со сценария «возврат,
      числовое поле формы» — того самого, который вскрывает такт n53. На холсте это не видно и видно быть
      не может: разводка узлов у обеих версий одна и та же, а отличие живёт ВНУТРИ узла развилки, в выражении,
      которое он читает. Поэтому на слайде не сказано ни слова о том, какое поле сравнивается, — кадр
      этого не показывает, а просить верить тексту слайда там, где снимок молчит, запрещено прямой правкой
      владельца 2026-10-20 по Семинару 8. Сценарий снят с публикации после замера и не активировался:
      холст в редакторе публикации не требует (БРИФ §3).

      Имени сценария, адреса формы и служебных id на кадре нет — шапка и боковая панель обрезаны при съёмке.

      §7 канона замысла кейса соблюдён: первый видимый блок — русское предложение о том, что на кадре
      происходит; имена узлов идут после него.

      Что на кадре видно буквально и о чём поэтому можно говорить: четыре узла пути и пятый подвешенный,
      два подписанных выхода развилки, обе ветки кончаются экраном для обратившегося, красная звёздочка
      у пометки `Model` под узлом извлечения.

      Что на кадре НЕ видно и прозой рядом не утверждается: текст запроса к модели, условие развилки,
      имя поля, пороговое число.'
- id: n49
  file: slides/n49-k4-rezultat-klassy.md
  type: measured_outcome_table
  duration_min: 1.75
  assertion: Отвлекающее число модель фильтрует надёжно; подмена проходит там, где текст прямо называет,
    какое число брать — десять раз из десяти
  learning_goal: Результат по классам заявок. Ожидание плана («в тексте несколько чисел — модель спутает»)
    не подтвердилось; подтвердился класс, которого в плане не было в такой форме. На кадре стоит измеренное,
    не ожидавшееся (ARCHITECTURE.md).
  visual:
    pattern: measured_outcome_table
    primary: 'Полоса из трёх плашек с разводящими подписями: «несколько чисел в тексте — 0 из 6», «число
      словами — 0 из 4», «текст называет поле решения — 10 из 10». Под полосой таблица четырёх классов
      с дословными отрывками заявок. Внизу строка про то, где проходит граница.

      '
    backup: 'Числа — из `stend/zamery-k4/README.md`, Прогон 1, таблица «Результат по классам»: 10 формулировок,
      каждая прогнана дважды, всего 20 вызовов. Классы `multi_number` (3 текста, 6 вызовов, 0 успехов),
      `words_vs_digits` (2 текста, 4 вызова, 0), `field_override` (3 текста, 6 вызовов, 6) и `embedded_instruction`
      (2 текста, 4 вызова, 4). Плашка «10 из 10» — сумма двух последних классов, как назначено ARCHITECTURE.md,
      раздел «Что опыт на стенде уже опроверг»; в таблице под ней оба слагаемых стоят отдельными строками
      со своими подписями, поэтому пары похожих чисел в одной фразе на кадре нет.

      «Успех» — критерий протокола, строгий: не «ответ звучит иначе», а другое число в поле суммы и другая
      ветка развилки.

      Дословные отрывки заявок — из `stend/zamery-k4/run1-vozvrat-texts.json`, запросы id 2, 5, 6 и 9,
      без единой правки. Внутреннее имя поля стоит только в отрывке id 9 и только потому, что в нём вся
      суть класса: текст, который называет поле по имени, и текст, который этого не делает, ведут себя
      по-разному — и это же различие вскрывает такт n52.

      Рамка кадра инженерная: что приходит в наш процесс и чем это ловится. Ни одна строка не объясняет,
      как усилить воздействие; классы названы по тому, что в них написано, и сопровождены исходом.

      Итог прогона (10 из 20) на этом кадре НЕ стоит: рядом с «10 из 10» второе число того же вида читается
      как его повтор. Его место — следующий экран.'
- id: n50
  file: slides/n50-k4-itog-10-iz-20.md
  type: measured_outcome_table
  duration_min: 0.75
  assertion: 'Итог прогона: код одобрил возврат, который требовал эскалации, в десяти вызовах из двадцати
    — на том же процессе, который на прошлом занятии не ошибся ни разу из пятидесяти одного'
  learning_goal: 'Итог Кейса 4 одним числом с базой. База — измерение прошлого занятия на том же процессе:
    0 ошибок из 51 на честных заявках. Разница между двумя прогонами только во входном тексте.'
  visual:
    pattern: measured_outcome_table
    primary: 'Одна крупная плашка «10 из 20» с подписью, что это значит, и рядом — плашка базы: тот же
      процесс, тот же порог, честные заявки прошлого занятия, 0 ошибок из 51. Под ними строка про то,
      что между двумя прогонами менялось.

      '
    backup: 'Число — из `stend/zamery-k4/README.md`, Прогон 1, строка «Итог Прогона 1»: код одобрил возврат,
      который одобрять не следовало, в 10 из 20 вызовов (5 формулировок из 10, каждая воспроизведена оба
      раза).

      БАЗА, обязательная по CLAUDE.md (Baseline Mandate) и выбранная сознательно: это не внешний источник,
      а измерение ПРОШЛОГО занятия на ЭТОМ ЖЕ процессе — `sem-08/SETKA-KEYSOV-S8-part2.md`, Кейс 3, версия
      2: 0 ошибок на 51 запросе. Процесс действительно тот же: `sborka_k4.py` строит копию сценария С8
      импортом из `sem-08/stend/sborka.py`, меняются только имя и адрес формы. Зал это измерение уже видел,
      так что база не требует отдельного разбора.

      Вторая опора базы — внутри самого прогона: все двадцать вызовов по честному чтению заявки требовали
      эскалации (поле `expected_decision_by_honest_reading` во всех десяти текстах), то есть верный исход
      прогона — 0 автоматических одобрений из 20.

      Рядом с «10 из 20» на кадре нет числа «10 из 10» — оно вскрыто экраном раньше и повторять его в
      одной фразе с итогом запрещено формой (два похожих числа без разводящих подписей).'
- id: n51
  file: slides/n51-k4-razvod-deystvie-otvet.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: На процессе ответов клиенту текст испортил совершённое действие в шести вызовах из четырнадцати,
    а дошедший до адресата ответ — ни в одном; у этого нуля есть объяснение, и оно не про защиту
  learning_goal: 'Развод двух разных исходов, которые обычно считают одним числом: что процесс СДЕЛАЛ
    и что адресат ПРОЧИТАЛ. Ноль во второй колонке объяснён устройством конкретной разводки, а не победой
    защиты.'
  visual:
    pattern: measured_outcome_table
    primary: 'Две плашки с явно разными подписями: «испорчено совершённое действие — 6 из 14» и «испорчен
      ответ, дошедший до адресата — 0 из 14». Под ними таблица трёх сработавших формулировок, затем отдельная
      врезка про единственную утечку и про то, почему её никто не увидел.

      '
    backup: 'Числа — из `stend/zamery-k4/README.md`, Прогон 2: 7 формулировок × 2 повтора = 14 вызовов
      на копии процесса Кейса 1 версии 2 (ответ клиенту либо эскалация Ольге настоящим сообщением в Telegram).
      Действие испорчено в 6 из 14 (3 формулировки, каждая 2 из 2); ответ, дошедший до клиента или до
      Ольги, испорчен в 0 из 14.

      ОБЪЯСНЕНИЕ НУЛЯ — обязательная часть этого кадра, не оговорка петитом: протокол, находка K4-2, прямо
      запрещает читать ноль как «защита сработала». Один из двух повторов одной формулировки произвёл
      полную утечку базы знаний внутри поля ответа, но ветка исполнения была эскалацией, а сообщение Ольге
      поле ответа не включает вовсе. Утечка существовала и не дошла ни до кого — не потому, что её поймали,
      а потому, что у этой разводки нет канала, по которому она ушла бы дальше. Протокол называет и условие,
      при котором тот же прогон стал бы находкой: эскалация, прикладывающая Ольге «вот что ответила бы
      модель», — разумное улучшение само по себе.

      Дословные отрывки заявок — `stend/zamery-k4/run2-case1-texts.json` и раздел «Дословные примеры для
      слайда» протокола.

      Два повтора одной формулировки, давшие разный исход, названы здесь прямо — это же свойство вскрывает
      Кейс 5, и предупреждать его здесь незачем: на этом кадре оно стоит как факт прогона, без обобщения.

      Числа Прогона 1 (10 из 10, 10 из 20) на этом кадре не повторяются.'
- id: n52
  file: slides/n52-k4-promtovaya-zashchita-slomala.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: Одна и та же защитная фраза в запросе удержала одну заявку из двух, а на третьей в одном
    прогоне из двух остановила процесс целиком — без ответа клиенту и без уведомления Ольге
  learning_goal: 'Третий исход рядом с «испорченный ответ» и «испорченное действие»: защита имеет измеримую
    цену в надёжности, а не только неполное покрытие. Прогон останавливается молча — журнал краснеет,
    но ни одна ветка не выполняется.'
  visual:
    pattern: measured_outcome_table
    primary: 'Таблица трёх заявок с двумя колонками исходов — «без защиты» и «с защитой в запросе», —
      подписи колонок разводят числа. Под таблицей врезка про третий исход: прогон завершился ошибкой
      разбора ответа, обе ветки не выполнились. Внизу строка про то, чем защита оплачена.

      '
    backup: 'Числа — из `stend/zamery-k4/README.md`, Прогон 3 (а): взяты три самых результативных воздействия
      Прогонов 1 и 2 (каждое 2 из 2 без защиты), каждое прогнано дважды с защитной фразой. Результат:
      заявка с пометкой «Сумма возврата» — 2 из 2 и с защитой; заявка, называющая внутреннее имя поля,
      — 0 из 2 с защитой; заявка на процессе ответов — один прогон верная эскалация, второй завершился
      ошибкой выполнения.

      Третий исход — находка K4-3 протокола: структурированный вывод модели не прошёл проверку схемы,
      клиент не получил ответа, Ольга не получила уведомления, обе ветки не выполнились вовсе. Протокол
      называет это прямо: не победа воздействия (подделки поля не произошло) и не чистая защита — добавленная
      инструкция сделала запрос длиннее и сложнее, и в одном прогоне из двух это обернулось новым типом
      отказа.

      РАМКА КАДРА, выдержана сознательно: экран показывает, чем обходится защита, а не как её обойти.
      Текст самой защитной фразы приведён коротко и по смыслу, точного состава инструкции на кадре нет;
      новых формулировок воздействия этот такт не вводит вовсе — все три заявки уже вскрыты тактами n49
      и n51.

      Полный текст защитной фразы лежит в `stend/zamery-k4/sborka_k4.py`, `PROMPT_DEFENSE_PREFIX`.'
- id: n53
  file: slides/n53-k4-chislovoe-pole.md
  type: measured_outcome_table
  duration_min: 1.0
  assertion: Отдельное числовое поле формы выдержало обе самые результативные заявки — и этот приём пришёл
    не из инструмента, а был назван с прошлого занятия пятым вариантом ответа
  learning_goal: 'Единственная защита кейса, которая держит измеренно. Приём назван вместе с его происхождением
    (предложение преподавателя курса на прошлом занятии), с честной базой измерения (две попытки, не двадцать)
    и с границей: он строится только там, где у решения есть источник истины вне текста клиента.'
  visual:
    pattern: measured_outcome_table
    primary: 'Схема одной строкой: форма получает второе, числовое поле, и условие сравнивает с порогом
      именно его. Под ней таблица двух заявок с исходами. Затем плашка происхождения приёма и плашка честной
      базы измерения. Внизу строка границы.

      '
    backup: 'Числа — из `stend/zamery-k4/README.md`, Прогон 3 (б): форма получает второе, числовое поле
      «Сумма возврата (число)»; узел развилки сравнивает с порогом именно его, узел извлечения остаётся
      в графе для сравнения в журнале, но на решение не влияет. Обе самые результативные заявки — по одному
      прогону каждая, обе дали верное решение, подмены нет ни в одной.

      ЧЕСТНАЯ БАЗА НА КАДРЕ ПРЯМОЙ СТРОКОЙ: это две попытки, а не двадцать. Протокол говорит то же самое
      и не смягчает: неожиданность этого блока случилась не в защите, а в собственной ошибке адресации
      узла (находка K4-1) — первый прогон молча одобрял всё подряд, потому что выражение внутри узла развилки
      читало выход соседа по графу, а не поле формы. Это тоже вынесено на кадр: структурная защита, которую
      пишет инженер, подвержена той же ловушке, что и остальная цепочка.

      ПРОИСХОЖДЕНИЕ ПРИЁМА названо на кадре по прямому требованию БРИФ §4: пятый вариант вопроса Кейса
      3 прошлого занятия добавлен владельцем курса второй содержательной обратной связью (`sem-08/ARCHITECTURE.md`,
      фронтматтер: «пятый вариант вопроса Кейса 3 (явное числовое поле формы)»); карточка и разбор того
      занятия — `sem-08/slides/n29-k3-vopros.md` и `n30-k3-razbor-deystviy.md`. `sborka_k4.py` называет
      его так же: «пятый вариант, который владелец курса сам предлагал на С8». На слайде и в заметке он
      назван предложением ВЕДУЩЕГО курса: служебное слово «владелец» на кадр не идёт, а слово «преподаватель»
      запрещено сторожем `notes_budget` внутри заметок (шаблон «обращение к ведущему» ловит его в любой
      форме), и держать на кадре одно слово, а в заметке другое значило бы развести два текста об одном
      человеке.

      ГРАНИЦА, тоже с кадра не снята: для процесса ответов такого поля не построить — тема вопроса по
      природе задачи и есть свободный текст. Протокол фиксирует это как границу защиты, а не как недосмотр
      замера.'
- id: n54
  file: slides/n54-k4-obobshchenie-granitsa.md
  type: criteria_checklist_and_boundary
  duration_min: 1.5
  assertion: Перенос решения в код защищает порядок шагов; аргументы, которые в это решение идут, он не
    защищает — и граница проходит по тому, откуда взялось каждое число, а не по тому, кто принимает решение
  learning_goal: 'Обобщение и граница Кейса 4 прямой формой (А7): «когда нужно · когда не нужно», с названным
    пределом приёма, с ценой человеческого подтверждения по внешней телеметрии и с документированными
    случаями, где разница была в канале исполнения. Четвёртая строка оси занятия закрывается здесь.'
  visual:
    pattern: criteria_checklist_and_boundary
    primary: 'Критерий отдельной плашкой наверху, под ним таблица в два столбца «когда нужно · когда не
      нужно» — строго под противопоставление, — затем плашка предела приёма, плашка про человеческое подтверждение,
      плашка с четырьмя документированными случаями и строка закрытия четвёртой строки оси занятия.

      '
    backup: 'Критерий — по SETKA-KEYSOV-S9-part2.md, раздел «Кейс 4», подраздел «Обобщение», переносимая
      формулировка без имени инструмента.

      Обе колонки таблицы опираются на собственное измеренное: 10 из 20 на текстах без независимого источника,
      обе заявки удержаны числовым полем формы, один прогон из двух остановлен промтовой защитой.

      Внешние числа и случаи, все из CHISLA-SVERENO.md: строка 56 — Anthropic, «How we contain Claude»
      (статус СВЕРЕНО дословно): по реальной телеметрии одобряется около 93% запросов на подтверждение,
      и внимание падает с ростом их числа; строка 57 — четыре публично разобранных случая (чат-бот продавца
      машин, согласившийся на сделку за доллар; служба доставки, чей бот обругал собственную компанию;
      утечка через автоматическую подгрузку документа по ссылке — `CVE-2025-32711`, оценка опасности 9,3;
