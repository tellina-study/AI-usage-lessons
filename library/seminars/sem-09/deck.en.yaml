      a separate architectural decision about where the LIST ITSELF sits, orthogonal to the other three,
      which are about the order of ITEMS inside the list. Two ways to read this: (a) add "base at the
      start/at the end" as a fifth card -- then the vote becomes about two different questions at once,
      and the room picks one of five without knowing it''s picking along two axes; (b) keep four cards
      about the order of ITEMS (as now), and move the question of "where the list itself sits" into the
      solution beat (n22), where it''s discussed explicitly (K2-7, K2-8). Option (b) was chosen: it keeps
      the cards as votable actions (A6) and doesn''t spawn a fifth option that''s really answering a different
      question. The decision is flagged to the orchestrator for confirmation.

      The cards follow SETKA-KEYSOV-S9.md, section "Case 2", subsection "Question" in substance; this
      edit tightened the wording, not the substance.

      Checked for leaks (A6), card by card: none names a verdict, none names a price, none lists what
      a built solution would contain, and nowhere does it say how many options are reasonable. Outside
      measurements (the middle of the list, caching) aren''t on this screen at all -- they belong on the
