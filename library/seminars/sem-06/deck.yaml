  learning_goal: 'Последний экран сборки: файл собран, отметка зелёная — и ровно здесь названа ловушка,
    в которую попадают после удачного подключения. Мысль берётся шире самого MCP: отсутствие ошибки не
    доказывает работу, потому что ошибки не будет и там, где сигналов не приходит вовсе. Проверяемый ход
    один и дешёвый — назвать сервер в запросе и посмотреть, подписан ли вызов его именем'
  visual:
    pattern: mechanics_table
    primary: 'Три блока друг под другом. Первый тихой формой — что именно доказывает зелёная отметка.
      Второй коробкой из двух строк — доказательный вызов: что сказать в запросе и какой признак искать
      в выводе. Третий золотом — общее правило наблюдения: отсутствие ошибок и наличие связи.'
    backup: 'Источник — rework/section-1-mcp-part1a2.md §A.2a (свёрнутый кейс) и §B.8a (section-1-mcp-part1c2.md).
      Доказательный вызов и признак в выводе — VERIFIED фактчеком (qa/fact-check-mcp.md §2.2 п.9). Инцидент
      `[#49]` (тихая потеря доступа при живом статусе) — VERIFIED против notes/mcp-limitations.md, в заметках
      одной фразой.

      Правки после проведения (issue #225, qa/RAZBOR-PROVEDENIYA.md §A2): кейс «сервер подключён, а агент
      через него не ходит» — девять слайдов от развилки до критерия — ведущий снял вслух в обеих группах
      и оба раза проговорил его смысл одной фразой. Кейс свёрнут до этого экрана внутри кейса подключения;
      сцена с неделей, голосование, разбор четырёх проверок, провал и граница сняты целиком. Из снятого
      сюда перенесены две вещи, названные ведущим: правило наблюдения (следить надо и за наличием связи,
      а не только за наличием ошибки) и проверяемый ход (работу доказывает вызов, подписанный именем сервера).
      Числа, источники и формулировки перенесённого не менялись.

