- id: n58
  file: slides/n58-stsena-dva-pass-i-promezhutok-mezhdu-nimi.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Диф-ревьюер и тестировщик проверили одну и ту же крупную правку, каждый свою часть, и оба
