    figure: case2-s11-n8n-canvas-full.png
    primary: 'Настоящий снимок холста n8n живого стенда (широкий кадр, все одиннадцать узлов одного прогона):
      форма «Документ + вопрос» → код «Нарезка иерархическая: дети + родитель» → HTTP «Эмбеддинг вопроса
      и детей (text-embedding-3-small)» → код «Поиск top-1 ребёнка (cosine)» → код «Подстановка родителя»
      → HTTP «Ответ модели по родителю (gpt-4o-mini)» → код «Разбор ответа» → код «Нарезка семантическая:
      предложения» → HTTP «Эмбеддинг предложений (text-embedding-3-small)» → код «Разрыв смысла и порог
      (gap_threshold)» → экран результата.

      '
    backup: 'Снимок настоящий: stend/n8n-screenshots-raw/case2-s11-canvas-full.png, снят stend/n8n_shots_case2.py
      на n8n.lessons.tellian.io этой сессией (сценарий собран и опубликован этой же сессией через stend/sborka_case2.py
      --push, workflow id см. в сценарии — не на слайде, §3 проектирования). Цепочка построена ОДНОЙ последовательной
      линией, не двумя параллельными ветками: у n8n-формы с экраном результата только один слот ответа,
      вторая параллельная completion-нода на том же триггере оставляет прогон в состоянии "waiting" навсегда
      — проверено живым прогоном этой сессией, записано в notes/mcp-limitations.md.

      Прогон на РЕАЛЬНОМ вопросе и документе выборки замера (doc_idx=31, measure/case2_s11_measure.py,
      seed=7): документ про метромост, вопрос «Что такое метромост?», эталонный ответ «мост, по которому
      проходит линия метрополитена.» — тот же самый документ и вопрос, на котором прогон корпуса (case2-results.json
      → details, doc_idx=31) дал versию 1 неверный ответ («нет информации.»), а версию 2 — верный. Живой
      вызов этой сессии (execution id — в логе прогона, не на слайде) дал модели ответ «Метромост — это
      мост, по которому проходит линия метрополитена и который отличается повышенной прочностью.» — верно,
      содержит эталон.'
