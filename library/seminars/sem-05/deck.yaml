    backup: 'Круг 4, правило А7 (эталон — n10 кейса 1): колонка «Почему не здесь или почему целевой» заменена
      на «Ограничения» — свойство варианта, из которого вывод делает слушатель; «Где он работает» заполнено
      конкретными случаями. Ярлык «целевой — и это порядок» из клетки снят (PLAN-part2.md §К5): выбор
      теперь выводится строкой под таблицей. Жирная целиком строка снята намеренно — table_card в deck_kit
      подсвечивает такую строку золотом автоматически, и целевой ответ объявлялся бы цветом даже без словесного
      ярлыка; у n10 и n38 подсветки тоже нет. Слайд переставлен вплотную за вопрос n58 (правило А1); свидетельства
      n60 уехали за него. 68,8% из 125 функциональных провалов — дифференциальный анализ, тот же прогон
      со скиллом и без, на тех же задачах (arXiv:2608.11888); 68,8% от 125 даёт 86, и число обслуживает
      строку «взять как есть», больше нигде в кейсе не повторяясь. Карточка «не ставить» получает три
      условия, при которых она верна, и свои ограничения наравне с остальными — иначе она соломенное чучело
      ради целевого ответа. Формат сопоставления «не X, а Y» в переписанных строках не использован ни
      разу: прожарка насчитала три таких на этом слайде.'
- id: n60
