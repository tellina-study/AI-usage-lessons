    primary: 'Та же плашечная пара бок о бок, что на следующем слайде (n56), только с другими двумя заголовками:
      «подлинность суждения» и «цена самой проверки» — две вещи, которые не даёт ни формат, ни журнал.
      Внизу — короткая строка, разводящая эту границу с критерием цены ошибки следующего слайда.'
    backup: 'Ответ на замечание владельца 6 (круг правок, до круга 2) и на круг 2 (issue 225, §А2): кейс
      уже называл честный пробел (n51) и критерий цены ошибки (n56), но не называл, чего формат и журнал
      не дают принципиально. Обе плашки — прямое следствие уже установленных в разделе фактов, не новое
      исследование: левая — из разбора n50 («журнал — единственный канал видимости внутрь запуска», то
      есть действие, не понимание) и документации Agent tool («The parent doesn''t see the subagent''s
      intermediate tool calls or outputs, only that final result», mechanics-6-subagent.md §2.2); правая
      — из механики n52 («не читают по умолчанию; требует отдельного шага»). Числа и источники не менялись.
      Круг 2: формулировки обеих плашек и заметок переписаны без слов «правдивый/неправдивый» и «доверие»
      — кейс целиком пересобран под мысль о границе делегирования (§A.2), эта граница формулируется в
      тех же терминах. Таблица — одна строка, две колонки, тот же формат, что у n56, рендерится той же
      функцией (`criteria_checklist_and_boundary`) в две плашки бок о бок.'
- id: n56
  file: slides/n56-kriterii-kogda-formata-khvatit-a-kogda-chelovek.md
  type: criteria_boundary
  duration_min: 1.25
  assertion: Формат и журнал работают, пока цена пропущенной ошибки сопоставима с ценой лишней секунды
    проверки; где цена ошибки выше — невосстановимые данные, неоткатываемый релиз — нужен человек, который
    лично читает diff
  learning_goal: Обобщение второго кейса. Граница проходит по цене ошибки, не по числу прогонов. Закрывается
    строкой оси, которая решает, что возвращается через границу делегирования, по цене ошибки
  visual:
    pattern: criteria_checklist_and_boundary
