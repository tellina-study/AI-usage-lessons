      primary: "Слева — лесенка 5 уровней (Operator → Collaborator → Consultant → Approver → Observer; уровень 5 в gold). Справа — 4 рамки (Human-in-the-loop / on-the-loop / out-of-the-loop / Override modes) с короткими описаниями"

  - id: s20
