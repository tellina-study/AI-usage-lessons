deck:
  lecture_number: 11
  title: "ИИ на заводе: глубина вмешательства и скорость насыщения"
  subtitle: "Траектории, цены, откаты — от точечного машинного зрения до безлюдного производства"
  audience: "студенты-инженеры 3 курса, универсальная"
  duration_min: 75
  central_question: "Сколько завода можно отдать машине — и с какой скоростью туда идти?"
  axis: "Глава смотрит на завод через глубину вмешательства модели и скорость, с которой по этой глубине идут. Четыре ступени: модель смотрит на продукт (технический контроль качества) → модель смотрит на оборудование (техническое обслуживание и ремонт) → модель меняет режим процесса (управление технологическим процессом) → модель — часть завода целиком (безлюдное производство). Решение инженера об ИИ на заводе — это решение о следующей ступени глубины вмешательства модели и о скорости, с которой по ней идут, а не о конечной картинке. Keystone — три опорных измерения: Amberg (75% цепочки стоимости, ≈12 dpm, с 1989 года, штат не выросший), Tesla (план 5000 машин/нед. против факта 260/квартал в 2017 году — «избыточная автоматизация» признана ошибкой 13.04.2018), мир и Россия (плотность роботизации 74→162 на 10 тыс. занятых, мир 2016→2023, против 19→29 Россия 2023→2024 при цели 145 к 2030)."
  learning_outcomes: [LO1, LO2, LO3, LO4, LO5]
  language: ru
  chapter_ref: "library/lectures/lec-11/chapter.md (+ part2, part3, part4, part5)"
  status: draft
  version: v1
  issue: 353
  branch: "issue-353-lec-11-deck-rebuild"
  note: >
    Полная пересборка деки под новую ось #350 (глубина вмешательства ИИ × скорость
    насыщения) — глава переписана с нуля (issue #350/#352), 45 файлов слайдов
    написаны семью параллельными сессиями и прошли независимую проверку оркестратора
    (валидный YAML фронтматтер, ровно 2 H2-заголовка, 0 хитов тайминга/методологии/
    scaffold-маркеров, все media-пути существуют на диске). Этот deck.yaml и рендер
    (issue #353) собраны заново: предыдущий deck.yaml и rendered/ удалены коммитом
    5640476fa2 как артефакты старой оси «дискретное/процессное производство»
    (issue #338), не совместимые с новым содержанием. Из 55 случаев/рядов реестра
    `rework/REESTR-RAZBOROV.md` на слайды попало примерно 32 (s09-s42, не считая
    дивайдеров/обзорных кадров) — остальные ~23 остаются Q&A-резервом главы
    (`chapter-part5.md`) и не выведены на экран намеренно: полный реестр не умещается
    в слот без потери формы разбора §5.13. Реальная оценка минутного счёта деки —
    поле `estimated_runtime_min` ниже и `rendered/iteration-log.md` (плотные
    case_study/schema_layered-кадры оценены дороже норматива 1,98 мин/кадр,
    дивайдеры и qa — дешевле).
  estimated_runtime_min: "см. rendered/iteration-log.md § «Минутный счёт» — заполняется после рендера (Часть 3)"
  sections:
    - {n: 0, name: "Вход", slides: "s01-s07"}
    - {n: 1, name: "Технический контроль качества", term: "ОТК; quality control / quality assurance", slides: "s08-s15"}
    - {n: 2, name: "Техническое обслуживание и ремонт", term: "предиктивное обслуживание; обслуживание по состоянию, RCM", slides: "s16-s20"}
    - {n: 3, name: "Управление технологическим процессом", term: "АСУ ТП; APC/MPC над ПИД", slides: "s21-s26"}
    - {n: 4, name: "Безлюдное производство", term: "lights-out; завод целиком", slides: "s27-s37"}
    - {n: 5, name: "Цена решения и границы", term: "железо, интеграция, разметка, сертификация", slides: "s38-s42"}
    - {n: 6, name: "Сборка и закрытие", slides: "s43-s45"}

slides:
  # ===== Раздел 0. Вход =====
  - id: s01
    file: slides/s01-hook.md
    type: hook
    section: "0. Вход"
    assertion: "13 апреля 2018 года Маск назвал избыточную автоматизацию Tesla своей ошибкой — после квартала, в котором вместо плана 5000 машин в неделю Tesla выпустила 260 машин за весь квартал. Тем же семилетием мировая плотность роботизации удвоилась: 74 → 162 робота на 10 тысяч занятых (2016→2023). Это противоречие держит открытым вопрос лекции: сколько завода отдать машине и с какой скоростью туда идти."
    media: ""

  - id: s02
    file: slides/s02-cover.md
    type: cover
    section: "0. Вход"
    assertion: "Решение инженера об ИИ на заводе — это решение о следующей ступени глубины вмешательства модели и о скорости, с которой по ней идут, а не о конечной картинке. Конечную картинку рисуют в пресс-релизах; ступень покупают за деньги, труд и время."
    media: "library/lectures/lec-11/rendered/assets/screenshots/siemens-amberg-ewa-shopfloor.jpg"

  - id: s03
    file: slides/s03-lecture-map.md
    type: schema_matrix
    section: "0. Вход"
    assertion: "Шесть разделов идут по нарастанию глубины вмешательства модели — от взгляда на продукт до завода целиком — и заканчиваются ценой решения и сборкой"
    media: ""

  - id: s03a
    file: slides/s03a-os-lekcii-odnoy-frazoy.md
    type: summary
    section: "0. Вход"
    assertion: "Глубина вмешательства ИИ растёт по контурам — от оценки до завода целиком, — и цена ошибки, и цена входа растут вместе с ней быстрее насыщения; скорость следующего шага задаёт его окупаемость, а не дата из обещания"
    media: ""
    note: "НОВЫЙ кадр issue #353 правка 2 — содержательная сводка оси + keystone-тройки сразу после карты лекции, до разбора s05"

  - id: s04
    file: slides/s04-glossary.md
    type: norm
    section: "0. Вход"
    assertion: "Шесть терминов отрасли выдаются до первого употребления: ОТ и ИТ, статистическое управление процессом, ПИД-регулятор, усовершенствованное управление процессом, обучение с подкреплением, дефекты на миллион"
    media: ""

  - id: s05
    file: slides/s05-keystone.md
    type: keystone
    section: "0. Вход"
    assertion: "Ось лекции держится на трёх измеренных опорах — Amberg, Tesla, мир и Россия — и на одном открытом пробеле: собственного свидетельства преподавателя здесь нет. Решение инженера об ИИ на заводе — это решение о следующей ступени глубины вмешательства и о скорости, с которой по ней идут, а не о конечной картинке."
    media: ""

  - id: s06
    file: slides/s06-dynamics-traps.md
    type: norm
    section: "0. Вход"
    assertion: "Три ряда чисел отрасли, и у каждого своя ловушка: роботы в мире и в России растут неравномерно и несопоставимо по методике; опросы о внедрении ИИ показывают разрыв в разы между «пользуемся» и «есть измеримый эффект»; рыночные оценки одного рынка расходятся в 3–4,5 раза при методологии, которую никто не публикует"
    media: ""

  - id: s07
    file: slides/s07-factory-contours.md
    type: schema_matrix
    section: "0. Вход"
    assertion: "Завод состоит из семи функциональных контуров, в которых в принципе может появиться обученная модель; она приживается неравномерно — там, где много однотипных измерений с проверяемым ответом и ограниченной ценой ошибки. Большая часть того, что на заводе работает хорошо и называется ИИ, обученной моделью не является"
    media: ""

  # ===== Раздел 1. Технический контроль качества =====
  - id: s08
    file: slides/s08-divider-razdel-1.md
    type: divider
    section: "1. Технический контроль качества"
    assertion: "1. Технический контроль качества"
    media: "assets/screenshots/divider-s08-audi-neckarsulm-wps-team.jpg"

  - id: s09
    file: slides/s09-audi-foto-dashboard.md
    type: case_study
    section: "1. Технический контроль качества"
    assertion: "Пилот 2022 года в Неккарсульме идёт на три площадки группы в 2023-м, и к модели пристёгнут собственный контур сертификации"
    media: "assets/screenshots/audi-neckarsulm-wps-dashboard.jpg"

  - id: s10
    file: slides/s10-audi-cena-klassika-model.md
    type: case_study
    section: "1. Технический контроль качества"
    assertion: "WPS Analytics целится в охват до 100% сварных точек там, где ультразвук проверял выборку неизвестного размера — а учителем модели остаётся тот же ультразвук"
    media: "assets/screenshots/audi-neckarsulm-wps-production.jpg"

  - id: s11
    file: slides/s11-audi-ustroystvo.md
    type: schema_layered
    section: "1. Технический контроль качества"
    assertion: "Алгоритм отвечает за то, какие точки показать человеку; человек отвечает за судьбу кузова"
    media: ""

  - id: s12
    file: slides/s12-cv-upominaniya-collage.md
    type: norm
    section: "1. Технический контроль качества"
    assertion: "Три относительных эффекта, и ни один не сопровождён знаменателем"
    media: ""

  - id: s13
    file: slides/s13-boeing-sobytie-khronologiya.md
    type: case_study
    section: "1. Технический контроль качества"
    assertion: "Автоматического визуального контроля на этой операции не существовало вовсе — финальный отчёт расследования не упоминает машинное зрение ни разу"
    media: "assets/screenshots/s15-alaska-737-max9.jpg"

  - id: s14
    file: slides/s14-boeing-cena-podmena.md
    type: case_study
    section: "1. Технический контроль качества"
    assertion: "Финальная проверка четырёх болтов — задача ровно того класса, который машинное зрение решает хорошо: фиксированная геометрия, контролируемый свет, бинарный признак «есть / нет» — и зрение не спросили"
    media: ""

  - id: s15
    file: slides/s15-cv-granitsy.md
    type: norm
    section: "1. Технический контроль качества"
    assertion: "Пять категорий задач контроля качества структурно остаются вне обученной модели — по природе задачи, и насовсем"
    media: ""

  # ===== Раздел 2. Техническое обслуживание и ремонт =====
  - id: s16
    file: slides/s16-divider-razdel-2.md
    type: divider
    section: "2. Техническое обслуживание и ремонт"
    assertion: "Модель предсказывает состояние узла — расписание меняется, сам процесс модель не трогает"
    media: "assets/screenshots/divider-s16-robot-service-shop.jpg"

  - id: s17
    file: slides/s17-gm-fanuc-zero-down-time.md
    type: case_study
    section: "2. Техническое обслуживание и ремонт"
    assertion: "FANUC довела горизонт предупреждения об отказе робота с «нескольких недель» до шести месяцев — но заявленные $40 млн экономии не сходятся с открытой арифметикой простоя в 20–40 раз"
    media: "assets/screenshots/gm-fairfax-fanuc-zero-down-time-robots.jpg"

  - id: s18
    file: slides/s18-ge-predix-proval.md
    type: case_study
    section: "2. Техническое обслуживание и ремонт"
    assertion: "GE обещала $15 млрд выручки от Predix к 2020 году — получила фактически около $1 млрд, и бренд свёрнут"
    media: ""

  - id: s19
    file: slides/s19-toir-upominaniya-collage.md
    type: norm
    section: "2. Техническое обслуживание и ремонт"
    assertion: "Пять упоминаний подряд — минус часы, минус процент, плюс миллиард — и ни одно не называет исходное число"
    media: ""

  - id: s20
    file: slides/s20-kogda-pdr-ne-nuzhen.md
    type: norm
    section: "2. Техническое обслуживание и ремонт"
    assertion: "Предиктивное обслуживание продаётся лучше, чем работает — пять условий, при любом из которых правильный ответ — классический режим"
    media: ""

  # ===== Раздел 3. Управление технологическим процессом =====
  - id: s21
    file: slides/s21-divider-razdel-3.md
    type: divider
    section: "3. Управление технологическим процессом"
    assertion: "3. Управление технологическим процессом"
    media: "assets/screenshots/divider-s21-dcs-control-room.jpg"

  - id: s22
    file: slides/s22-yokogawa-foto-kolonna.md
    type: norm
    section: "3. Управление технологическим процессом"
    assertion: "Эффект (−40% пара) опубликован; цена разработки, лицензии и внедрения — нигде. Два с половиной года работы остаются за кадром пресс-релиза"
    media: "assets/screenshots/yokogawa-eneos-materials-overview.jpg"

  - id: s23
    file: slides/s23-yokogawa-cena-klassika-model.md
    type: case_study
    section: "3. Управление технологическим процессом"
    assertion: "FKDPP провёл дистилляционную колонну 35 суток (840 часов) без вмешательства человека и снизил расход пара и выбросов CO₂ на 40% — против ручного управления, не против работавшей рядом связки ПИД+APC"
    media: "assets/screenshots/yokogawa-eneos-yokkaichi-plant.jpg"

  - id: s24
    file: slides/s24-yokogawa-ustroystvo.md
    type: schema_layered
    section: "3. Управление технологическим процессом"
    assertion: "Модель заняла единственный слой — тот, на котором решается, какие уставки держать сейчас; ниже и в стороне всё осталось как было"
    media: ""

  - id: s25
    file: slides/s25-myagkie-datchiki-rubli.md
    type: mentions
    section: "3. Управление технологическим процессом"
    assertion: "У каждого из трёх упоминаний — своё число, и у каждого числа — именно та оговорка, которая делает его нестрогим"
    media: ""

  - id: s26
    file: slides/s26-regulyatorika-granitsy.md
    type: regulatory_comparison
    section: "3. Управление технологическим процессом"
    assertion: "Три регуляторные рамки и три технические границы ограничивают глубину автономии разными способами — и ни одна не снимается обучением модели"
    media: ""

  # ===== Раздел 4. Безлюдное производство =====
  - id: s27
    file: slides/s27-divider-razdel-4.md
    type: divider
    section: "4. Безлюдное производство"
    assertion: "Раздел 4. Безлюдное производство"
    media: "assets/screenshots/divider-s27-fanuc-cnc-factory.jpg"

  - id: s28
    file: slides/s28-amberg-foto-tsekh.md
    type: norm
    section: "4. Безлюдное производство"
    assertion: "Три четверти цепочки стоимости завода выполняют машины — вот как выглядит оставшаяся четверть, где работают люди"
    media: "assets/screenshots/siemens-amberg-ewa-shopfloor.jpg"

  - id: s29
    file: slides/s29-amberg-traektoriya.md
    type: case_study
    section: "4. Безлюдное производство"
    assertion: "Amberg в основном сам и есть классический режим: 75% цепочки стоимости машинами, штат не выросший — и один случай обученной модели на весь завод; множитель роста выпуска при этом называют четырьмя разными числами в четырёх публикациях"
    media: ""

  - id: s30
    file: slides/s30-amberg-ml-keys-ustroystvo.md
    type: schema_layered
    section: "4. Безлюдное производство"
    assertion: "Классификатор решает, нужен ли рентген конкретной зоне платы — сплошной рентген-контроль сократился на 29% без потери точности, и это редкий случай, где классика и модель посчитаны в одной единице"
    media: ""

  - id: s31
    file: slides/s31-tesla-otkat-tent.md
    type: case_study
    section: "4. Безлюдное производство"
    assertion: "План — 5000 Model 3 в неделю «в течение 2017 года»; факт Q3 2017 — 260 машин за квартал; цель достигнута через ручную линию в тентовой конструкции GA4, собранную за три недели и давшую пятую часть рекордной недели"
    media: "assets/screenshots/tesla-fremont-ga4-tent-interior.jpg"

  - id: s32
    file: slides/s32-tesla-otkat-otlivka-sintez.md
    type: comparison
    section: "4. Безлюдное производство"
    assertion: "Одна и та же компания откатилась от самой амбициозной версии технологии к проверенной дважды за шесть лет — и оба раза возврат к проверенному методу сработал"
    media: "assets/screenshots/tesla-fremont-model-y-single-piece-megacast.jpg"

  - id: s33
    file: slides/s33-fanuc-mif.md
    type: case
    section: "4. Безлюдное производство"
    assertion: "В истории про 50 роботов за смену и 30 суток без людей нет искусственного интеллекта вовсе — исходные материалы не упоминают ни ИИ, ни обучение; и даже у самой FANUC 72% операций производства по-прежнему выполняют люди"
    media: ""

  - id: s34
    file: slides/s34-foxconn-obeschanie.md
    type: case
    section: "4. Безлюдное производство"
    assertion: "От обещания миллиона роботов в 2011 году до замера 150–200 тысяч работников на пике сезона в 2025-м прошло 14 лет — не 3, как сама компания себе назначила"
    media: ""

  - id: s35
    file: slides/s35-adidas-speedfactory.md
    type: case_study
    section: "4. Безлюдное производство"
    assertion: "Суммарная мощность двух Speedfactory — 1 млн пар из 448 млн, выпущенных Adidas в 2019 году, — это 0,22% собственного объёма компании"
    media: ""

  - id: s36
    file: slides/s36-anons-ne-vnedrenie-collage.md
    type: norm
    section: "4. Безлюдное производство"
    assertion: "Заявленная автоматизация и анонсированный робот — не то же самое, что фактическая загрузка линии и робот, работающий на ней"
    media: ""

  - id: s37
    file: slides/s37-wef-nesovpadeniya.md
    type: comparison
    section: "4. Безлюдное производство"
    assertion: "Один и тот же источник даёт разные числа накопленных «маяков» для одного года в документах разных лет — расхождение от 8 до 24 сайтов на точку, и сходятся только старт и последний итог"
    media: ""

  # ===== Раздел 5. Цена решения и границы =====
  - id: s38
    file: slides/s38-divider-razdel-5.md
    type: divider
    section: "5. Цена решения и границы"
    assertion: "5. Цена решения и границы"
    media: "assets/screenshots/divider-s38-balance-scale.jpg"

  - id: s39
    file: slides/s39-tsena-resheniya.md
