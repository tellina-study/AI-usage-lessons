  - id: s55
    file: slides-en/s55-shest-razvilok-dve-logiki.md
    type: recap_table
    duration_min: 1.5
    assertion: "The six decision points of today's session split into two types: specific to the project (wait for a signal) and universal hygiene (set it up right away, on day 0)"
    learning_goal: "Section 3's synthesis, step 3.1 — the first time the shared axis 'day-0 vs wait for a signal' is named out loud, the one that unites the three decision points of section 1 and the three of section 2; the 'When' column is the only visual accent, and it is not evaluative"
