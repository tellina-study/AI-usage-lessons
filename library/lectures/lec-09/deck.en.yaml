    section: "3. Design and new capabilities"
    assertion: "A surrogate learns once from expensive simulations and from then on predicts almost for free — but only within the bounds of what it has seen"
    learning_goal: "§3.2a, part 1: the surrogate regression model — carries Raptor and generative design"

  - id: s41
