  learning_goal: 'Развилка третьего кейса, поданная сценой настоящего времени. Поворот кейса назван сразу,
    на развилке: плату за описания инструментов вносит подключённость, не использование, и вносится она
    в каждой сессии. Отличается от первого кейса (что подключать и с какими правами) и второго (как проверить,
