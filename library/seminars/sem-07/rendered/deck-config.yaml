# Что у Семинара 7 своё. Код сборщика — общий, в `tools/seminar-build/`.
#
# Правило, которое этот файл обслуживает (канон `tools/presentation-build/
# seminar-deck-kit.md`): дека собирается из ИМЕНОВАННОЙ БИБЛИОТЕКИ ПРИЁМОВ, и
# приём выбирается по полю `visual.pattern` слайда — ниже, в `genres`.
# Решение по каждому новому имени приёма пишет сам автор слайда, в поле
# `backup:` его фронтматтера; здесь только сводка соответствий.

seminar: "07"
issue: 233

langs:
  ru:
    slides: slides
    deck: deck.yaml
    out: sem-07.pptx
    # Имена блоков занятия — ими подписана дорожная карта на дивайдерах.
    blocks: [Введение, Ось, Кейсы, Закрытие]

# Границы блоков: [от, до, индекс блока, индекс ступени или null].
# Круг 5 (2026-10-12): введение n01–n04, ось n05, кейсы n06–n32, закрытие n33–n35.
razmetka:
  n:
    rows:
      - [1, 5, 0, null]
      - [6, 6, 1, null]
      - [7, 35, 2, 0]
      - [36, 38, 3, null]
    stages: [2]

# Дорожка кейсов на лёгком дивайдере: рисуется по этому списку, а не по трём
# зашитым именам — у деки 2026-10-12 кейсов четыре, и зашитое «Кейс А·Б·В»
# молча потеряло бы четвёртый.
case_track: [Кейс 1, Кейс 2, Кейс 3, Кейс 4]
case_idx:
  n07: 0
  n16: 1
  n23: 2
  n30: 3

# `visual.pattern` → жанр из библиотеки приёмов (`tools/seminar-build/
# genres.py`). Имя, которого здесь нет, рисуется жанром `content` — и это
# нормальный, самый частый случай: различие между приёмами несёт роль блока,
# а не отдельная раскладка. Записи, не встречающиеся сейчас ни на одном
# слайде, держатся про запас: готовый код лучше, чем код, который придётся
# писать с нуля при первой же нужде.
genres:
  hero_cover: cover_centered
  section_divider_macro: divider
  case_divider_quote: case_divider
  question_with_option_cards: question
  reflection_question: question
  guess_the_number: question
  recap_table: axis_table
  criteria_checklist_and_boundary: criteria
  base_and_edge: base_edge

# Роль блока-цитаты ПО УМОЛЧАНИЮ для этого приёма. Запись нужна только там,
# где умолчание (`formula`) неверно, или наоборот — где текст вопроса не
# означает вопроса залу.
pattern_role:
  question_with_option_cards: question
  reflection_question: question
  guess_the_number: question
  answer_breakdown_table: formula
  answer_breakdown_schema: formula
  failure_vignette: formula
  failure_vignette_table: formula
  failure_vignette_before_after: formula
  criteria_checklist_and_boundary: formula
  base_and_edge: fact
  recap_table: fact

# Приёмы, где зал ГОЛОСУЕТ карточками: их блок `cards` рисуется рядом
# «ВЫБЕРИ», а не пилюлями терминов, и к ним применяется аудит «ответ рядом с
# вопросом».
vote_patterns:
  - question_with_option_cards
  - guess_the_number
  - scene_cards_and_question

# Дивайдеры: у них другая грамматика — риторический вопрос в заголовке
# перехода не голосование, разбор ему не положен.
divider_patterns: [section_divider_macro, case_divider_quote]

# Осознанные исключения из стандартной рамки таблицы `#1C7293`.
table_style:
  verdict_numbers_table:
    accent: GOLD_DARK

# Слайды, где единственная подпись-итог начинается с «ёлочки» и потому была
# бы опознана как тихая реплика докладчика: `all` — все цитаты слайда,
# `last` — только последняя.
gold_quote_sids:
  n03: all
  n43: all

# Точечное переопределение роли там, где общий механизм («кончается на ?» →
# вопрос залу) неверен: разбор даёт не следующий экран, а весь блок.
quote_role_force:
  n27: formula

deck_yaml:
  central_question_patterns: [question_with_option_cards, guess_the_number]
  axis_pattern: ladder_steps_figure
  # Бутстрап шапки — только для самой первой сборки, когда deck.yaml ещё не
  # существует вовсе; дальше прозаические поля переносятся из него.
  head_defaults:
    seminar_number: 7
    audience: "3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами"
    format: >-
      слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) +
      один вопрос без карточек (устная оценка числа) + механика на примерах;
      живого терминала нет
    language: ru
    slot_min: 90

# ── Сторожа и генераторы ────────────────────────────────────────────────────

notes:
  # Калибровка объёма заметок ЭТОГО занятия. Канон называет один коридор
  # 250–450 на содержательный слайд; здесь он и стоит на всех четырёх
  # содержательных классах — разводить их без замера значило бы угадывать.
  bands:
    разделитель: [250, 450]
    голосование: [250, 450]
    содержательный: [250, 450]
    опорный: [250, 450]
    # Обложка по замыслу ничего не объясняет и бывает сколь угодно короткой
    # (реальный n01 — 90 слов): порога нет вовсе, проверяется только то, что
    # заметка не пуста.
    обложка: null
  # Опорных экранов у этого занятия не названо ни одного.
  anchor: {}

svodka:
  # Резка на кейсы смотрит на ОБА имени приёма дивайдера: `section_divider_
  # macro` остаётся на случай, если он понадобится по тому же назначению.
  case_divider_patterns: [section_divider_macro, case_divider_quote]
  nachalo_default: "развилка, одностраничник"
  # Время, которое по устройству слайда принадлежит залу. Считается по приёму,
  # а не по длине текста под слайдом, и разложено по видам, чтобы число можно
  # было проверить, а не принять на слово.
  zal:
    question_with_option_cards: голосования карточками
    scene_cards_and_question: голосование-сцена вслепую
    guess_the_number: устная оценка числа

sluzhebnoe:
  timing_patterns: [hero_cover, section_divider_macro, case_divider_quote, recap_table]
  razdely: ["МОСТИК", "СТУПЕНЬ 1", "СТУПЕНЬ 2", "ОСЬ"]
