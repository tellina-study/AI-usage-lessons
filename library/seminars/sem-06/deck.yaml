      subagent''s intermediate tool calls or outputs, only that final result»; пример работы, под которую
      изоляцию и заводят — субагент `refactorer` с описанием «Applies mechanical refactors across many
      files» и готовый приём, делящий одно крупное изменение на 5–30 изолированных субагентов; напарники
      — «Agent teams don''t isolate teammates in worktrees, so partition the work so each teammate owns
      a different set of files». ВАЖНО для сведения: задание круга 5 исходило из того, что копий субагентам
      «не создают»; проверка источника показала, что поле существует, поэтому кейс построен на цене возврата,
      а не на невозможности — см. qa/krug5-subagent-keys3.md §4.'
