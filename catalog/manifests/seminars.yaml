  - number: 13
    title: "Маршрутизация, склады и последняя миля: разбор трёх задач логистики"
    type: предметный
    module: M3
    related_lecture: 13
    summary: >-
      Команды получают три кейса (роботизация склада Wildberries / Ozon,
      маршрутизация курьеров «Достависта» по Москве, dynamic pricing
      «Яндекс Go» в час пик) и за 25 мин выбирают тип AI: RL для
      маршрутизации, CV+роботы для склада, ML-прогноз спроса для pricing.
      Защита у доски по 4 критериям (контроль, данные, ROI, риск).
      Преподаватель ломает обоснования вопросом «а если связь упала /
      робот сбил человека / алгоритм поднял цену в 8 раз?». Финал —
      разбор уровней SAE 0–5 на примере «КамАЗ-беспилотник М-11»: где
      реально сегодня, где маркетинг, какая ответственность водителя
      на L2 vs L4.
    learning_outcomes: [LO1, LO2, LO7]
    format: кейс+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 14
    title: "AI как щит и как меч: разбор атак и защиты сетевой инфраструктуры"
    type: предметный
    module: M3
    related_lecture: 14
    summary: >-
      Прямой профиль ИУ6. Демо: преподаватель показывает реальный
      deepfake-голос «директора» (15 сек аудио → клон через ElevenLabs)
      и AI-сгенерированный фишинг под Сбер/Госуслуги. Команды разбирают
      три инцидента (атака на Colonial Pipeline 2021, deepfake-CEO
      Arup 25 млн $ 2024, anomaly detection в МТС/Ростелеком) и для
      каждого определяют: какой AI у атакующего, какой у защитника,
      где human-in-the-loop обязателен. Параллельная мини-практика —
      разбор, что НЕЛЬЗЯ отправлять в облачный AI (NDA, схемы сети,
      пароли, PII). Финал — дискуссия «гонка вооружений: побеждает
      атакующий или защитник?» с обоснованием через цикл OODA и
      asymmetric cost AI-генерации фишинга.
    learning_outcomes: [LO1, LO2, LO3, LO7]
    format: демо+кейс+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 15
    title: "AI для ВКР: обзор литературы, кейсы AlphaFold и обязательность указания"
    type: предметный
    module: M3
    related_lecture: 15
    summary: >-
      Самый «прикладной для студента» семинар — мост к ВКР на 2-4 курсе.
      Мини-практика: каждая команда берёт свою тему (по выбору
      из 4 заранее заготовленных: «AI в медицинской диагностике»,
      «predictive maintenance», «автономный транспорт», «кибербезопасность
      IoT») и за 30 мин делает срез литературы через AI (Elicit /
      Consensus / Perplexity Scholar): 5 ключевых статей, расхождения,
      retracted papers. Защита — что AI нашёл лучше человека, где
      ошибся (галлюцинация цитаты, выдуманный DOI). Вторая часть —
      разбор кейса AlphaFold (Нобелевская 2024) и кейса retraction
      из-за неуказанного AI (Frontiers / Surgery Neurology Int.):
      команды формулируют для своего ВКР раздел «Использование AI».
      Финал — личный чек-лист «как использовать AI в ВКР, чтобы не
      отчислили».
    learning_outcomes: [LO4, LO5, LO6, LO8]
    format: мини_практика+кейс+опрос_дискуссия
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

  - number: 16
    title: "Сейсморазведка, трубопровод, скважина: AI-архитектура для нефтегаза"
    type: предметный
    module: M3
    related_lecture: 16
    summary: >-
      Кейс «Газпром нефть» / «Роснефть»: команды получают три задачи
      (интерпретация сейсмики 3D на новом участке, мониторинг 1200 км
      трубопровода на предмет утечек, оптимизация дебита 200 скважин
      Приобского м/р) и проектируют AI-архитектуру: где CV, где
      ML-регрессия, где RL, где digital twin. Защита у доски по
      4 критериям (контроль, OT-безопасность, ROI, риск экологический).
      Демо — преподаватель показывает реальные сейсмо-кубы и как CV
      ловит горизонты vs ручная интерпретация геолога. Параллельная
      дискуссия — почему Stuxnet (Натанз 2010) релевантен для
      промышленного IoT в добыче, и какие компенсирующие меры
      обязательны при внедрении ML на SCADA. Финал — мини-чек-лист
      «что проверять при внедрении AI на месторождении».
    learning_outcomes: [LO1, LO2, LO3, LO7]
    format: кейс+демо+групповой_анализ
    duration_min: 75
    duration_ahours: 2
    status: draft
    updated_at: "2026-04-29"

