    learning_outcomes: [LO1, LO4]
    references: [kreuzberger-2023-mlops, jumper-2021-alphafold]
    visual:
      pattern: pipeline_with_examples
      primary: "Сверху схема: 5 блоков по горизонтали (Сырой вход → Препроцессинг → Модель → Постпроцессинг → Выход); снизу 4 примера моделей (YOLO / Whisper / SD / AlphaFold) + кейс конвейера"

  - id: s16
    file: slides/s16-chat-cycle-schema.md
    type: process
    duration_min: 2
    assertion: "Как работает чат: 6 шагов цикла"
