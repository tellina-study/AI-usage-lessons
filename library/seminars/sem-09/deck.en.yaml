# The Process Answers the Human
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 09
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Introduction n01–n03    5.00 мин
#   Axis       n04–n04    2.00 мин
#   Cases      n05–n75  128.75 мин
#   Closing    n76–n78    7.00 мин
#   ИТОГО                 142.75 мин при слоте 90

deck:
  seminar_number: 9
  title: The Process Answers the Human
  audience: 3rd-year students, 09.03.01 — practicing engineers, all already use AI assistants
  duration_min: 142.75
  format: facilitator slides + open questions with option cards (question BEFORE the breakdown) + real
    screenshots of the live n8n.lessons.tellian.io rig + eight measured runs on that rig (1461 calls that
    reached the model, protocols in `stend/`); during the session the facilitator does not edit any node
    live — only runs already-prepared workflows (owner decision, ARCHITECTURE.md §4)
  cover_hook: null
  central_question: How do you build the "answer myself or hand off to a human" decision?
  language: en
  slide_count: 101
  axis: Six claims, each one sounds solid; what each turned out to be is filled in with a measurement,
    one row per case
  slot_min: 90
slides:
- id: n01
  file: slides-en/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: The process that, until today, only wrote to the table and to Olga starts answering the person
    who reached out
  learning_goal: Cover slide. Names the session's topic and its rung on the arc — answering a human (rung
    3), not new tool mechanics.
  visual:
    pattern: hero_cover
    primary: 'Dark Ocean gradient, a large title centered on the canvas, a subtitle line in the middle
      of the open band. No session number on screen.

      '
    backup: 'The title is verbatim from `ARCHITECTURE.md` (the `title` field) and from the "Session topic"
      in `SETKA-KEYSOV-S9.md`: the process answers the client itself. The session number is not printed
      on the cover — owner decision, `sem-06/qa/oblozhka-bez-nomera.md`, the same device as S8''s cover.
      There is deliberately no figure on the cover: the arc ladder (`lestnitsa-dugi.png`) sits one screen
      later, on n03, and repeating it here would show the rung before the gap is named. The session''s
      axis question is also not placed on the cover: it is asked on n04 and repeated verbatim on n77,
      and a third spot would throw off the count between those two.'
- id: n02
  file: slides-en/n02-shov-s8-s9.md
  type: content
  duration_min: 2.5
  assertion: The existing process is bundled into one file; today exactly one node changes — where its
    answer goes
  learning_goal: The S8→S9 seam. The input state is named in one sentence; the slide's load-bearing work
    is the change of the answer's addressee and the cost of that change — not a list of what comes next,
    and not a tour of the nodes.
  visual:
    pattern: content
    primary: 'A slide with no illustration: a line naming the input state, below it a contrast bar "where
      the answer used to go · where it goes now", below the bar a card about the cost of a mistake.

      '
    backup: 'The content source is `SETKA-KEYSOV-S9.md`, section "Opening," screen 1: the six nodes of
      last session''s chain plus S8''s four refinements, bundled into ONE file. The refinements are deliberately
      NOT broken out into bullets: the grid requires showing them bundled, not as a separate list — so
      the input state is named in one line, and the breakdown of the nodes lives in the notes.

      THERE IS NO FIGURE HERE — ORCHESTRATOR DECISION 2026-10-26, and this is a removal, not a gap. The
      slide''s first pass stood on a real screenshot of the canvas "S9 · input (S8''s output)," following
      the form of the S8 seam (`sem-08/slides/n02-shov-s7-s8.md`, the owner''s spoken correction 2026-10-20:
      a screenshot plus one line in words). No name for such a screenshot ever existed in `BRIEF-PROIZVODSTVO.md`
      §5 — the list of real screenshots starts from `k1-holst-v1.png`; the frame was never captured and
      is absent from `rendered/figures/`. Closed by removal: the slide is conceptual (what changes once
      text starts reaching a human), an "input" screenshot adds nothing to that argument, and the neighboring
      slides already carry an image — the n01 cover and the n03 ladder. A stylized mock of the interface
      was never drawn here on any round: mocking is forbidden by the course''s own rule, and removal is
      the honest way to close the absence of a figure.

      THE PATTERN WENT BACK TO `content` ALONG WITH THE SCREENSHOT''S REMOVAL. The first pass was named
      `mechanism_node_graph` — the S8 seam''s own name — and that was justified exactly because the slide
      carried a node graph as a screenshot. There is no screenshot anymore, no node graph on the slide,
      and the name came to describe something that isn''t happening on it. `BRIEF-PROIZVODSTVO.md` §4
      doesn''t name a pattern for n02 at all, and its own rule is "where none is named, `content`" — which
      is what''s been set. The genre doesn''t change with the swap: `mechanism_node_graph` was absent
      from the `genres` table and fell through to the same `content` anyway. If the orchestrator prefers
      to keep the seam''s name for the sake of the echo with S8, that''s a one-line edit here, and it
      won''t change the bundled slide itself.

      REVISION 2026-10-29 (BREAKDOWN, R-1/R-2/R-3): the title was renamed to "The Existing Process" (R-1)
      — the previous title named only the change of addressee, while the slide also carries a short inventory
      of what''s already been done. The line "not one of its nodes is being reworked today" was removed
      from both the Visual and the notes (R-2): the owner called it untrue — the node that decides the
      answer''s addressee is exactly what changes today, and claiming no change right next to a table
      about a changed addressee is a contradiction on one slide. The line "Olga will re-read it and rewrite
      it" was removed (R-3, "that''s some nonsense" — the owner''s own words): that''s not a fact about
      the process, it''s a guess about what Olga will do with someone else''s mistake, and a slide about
      the cost of an error doesn''t need that guess — the cost rests on the fact that "the message is
      already with the client," not on speculation about an office habit.'
