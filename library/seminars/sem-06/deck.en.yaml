- id: n09
  file: slides-en/n09-mcp-i-server-odnim-ekranom.md
  type: mechanics_map
  duration_min: 1.75
  assertion: 'MCP is built out of six parts: what a server is and where it runs, where the connection
    is declared, what happens on connection and on a call, what the context and the cost are made of,
    and what the server answers with'
  learning_goal: 'The one-pager — the section''s anchor slide, which the whole case returns to. Round
    2 of the owner''s edits (issue 225, part B.2): the slide was moved BEFORE the case (it used to come
    after the scene and the question), "what a server is" is now the first block, "where it is declared"
    carries a real mini-template of .mcp.json, "what is passed on a call" is presented explicitly as a
    call, and "context and cost" was rewritten concretely'
  visual:
    pattern: mechanics_with_figure
    figure: mcp-n09-mehanizm.png
    primary: 'A diagram filling the slide: six numbered blocks, two rows of columns, top and bottom —
      three columns. 1 — what a server is: a separate program, a local process or a remote service, who
      starts it. 2 — where it is declared: a mini-template of .mcp.json and the three scopes, briefly
      — the details come later in the case. 3 — what happens on connection: the client asks for the list
      of capabilities itself, with no involvement from the model; by default what lands in the context
      out of that answer is the tool names and the server''s instructions, and the full schemas come on
      demand, with the deferral cancelled by a flag on an individual server or by an environment variable.
      4 — the call: the agent brings the server up and passes the parameters — the full name and the arguments.
      5 — context and cost, three line items: tool names and the server''s instructions are always in
      the context, the full schema comes on demand (that is the default), and the result of a call has
      a budget of its own. 6 — what the server answers with: a separate channel, signed with the server''s
      name.'
    backup: 'Source — rework/section-1-mcp.md §A.1.3 (rewritten), §B.2 (part1c.md). The model is n11 of
      Seminar 5 (sem-05/slides/n11-struktura-khuka-tselikom.md, the diagram khuki-n12-ustroystvo.png):
      the same grammar of six numbered blocks, with its OWN contents. The source of the facts is sem-05/research/mechanics-5-mcp.md
      §1.1/§1.4 (the transports, who physically starts the process), §1.2 (the two files of a scope: local
      and user — both physically ~/.claude.json, different keys inside), §2.1 (tools/list, prompts/list,
      resources/list — the client itself, without the model), §2.2 (mcp__<server>__<tool>), §2.3 (tool
      search, ENABLE_TOOL_SEARCH, MAX_MCP_OUTPUT_TOKENS — the result''s budget separate from the definitions''
      budget), §2.4 (the call in the output is signed with the server''s name). The figure script is rendered/make_figures_mcp.py,
      section "n09". Round 2 of the owner''s edits (issue 225): the slide was moved from its position
      after the scene/question to a position before the case (part B item 2 — "a description of MCP...
      then we will tell the example with the issues"); the block "what a server is" was raised from position
      2 to position 1; the block "where it is declared" got a mini-template of the file instead of captions
      alone; the block "what is passed on a call" was explicitly named a call and its dark CODEBG card
      (rule A4) was replaced with a light one; the block "context and cost" was rewritten — it used to
      be the abstract label "the price is paid", and became three concrete line items of expenditure.
      Separating the contradictions (issue 225, 2026-10-07): block 3 no longer asserts what the server
      answers with by the protocol — the source speaks of what LANDS IN THE CONTEXT at start-up, and the
      condition is named on the spot ("by default"; the deferral is cancelled by alwaysLoad on a server
      and by ENABLE_TOOL_SEARCH=false). Block 5, the first line item: "the server''s name" was replaced
      by "the tool names and the server''s instructions" — verbatim per the documentation ("Only tool
      names and server instructions load at session start", code.claude.com/docs/en/mcp, read 2026-10-07
      in two passes, markdown and HTML, with no discrepancies); the tag on the second item became "by
      default". The numbers did not change. The storytelling revision (issue 225, P6): the speech was
      cut from 295 words (2.27 min against a slot of 1.75) to 180 (1.38 min) — the screen''s six blocks
      already carry the enumeration, and the speech was duplicating them. The details removed (a tool''s
      full name, the two files of the scopes, the governance of the protocol) were moved into the reference
      material in full, and not one fact was lost. The composition of the diagram and the six blocks did
      not change.'
- id: n10
  file: slides-en/n10-stsena-vtornik-perenos-rukami-dal-sboy.md
