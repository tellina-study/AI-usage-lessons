lectures:
  - number: 1
    title: "Введение: искусственный интеллект в современном мире"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO4, LO6]
    summary: >-
      Определение и классификация AI-систем; формы использования (модели,
      приложения, чаты, агенты). Первый опыт промптинга и демонстрация
      галлюцинаций как фундаментального ограничения генеративных моделей.
    doc_id: "1TsPeWdhgje3pj4yXMQrA9MDFb-hD9Ljed4hao7n-Ft8"
    status: draft
  - number: 2
    title: "Архитектура AI: от машинного обучения до трансформеров"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO6, LO7]
    summary: >-
      Классификация подходов (ML, DL, CV, audio, LLM); архитектура трансформера,
      авторегрессионная генерация, контекстное окно. После лекции студент
      понимает, почему определённые приёмы промптинга работают.
    doc_id: null
    status: draft
  - number: 3
    title: "Архитектуры AI-систем: агенты, RAG, API"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO7, LO4]
    summary: >-
      AI-агенты (plan-act-check-iterate), RAG, fine-tuning vs промптинг,
      работа через API, MCP и tool use. Понятийная база для обсуждения
      AI-решений в каждой последующей индустрии.
    doc_id: null
    status: draft
  - number: 4
    title: "AI в разработке программного обеспечения"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO4, LO7]
    summary: >-
      Самая близкая студентам индустрия. AI-инструменты в цикле разработки;
      84% разработчиков используют AI, 46% не доверяют результатам.
      Сравнение IDE-интеграции (Copilot, Cursor) vs чат vs coding agent.
    doc_id: null
    status: draft
  - number: 5
    title: "AI в финансовом секторе и ритейле"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO6]
    summary: >-
      90–100% крупных банков РФ используют AI: кредитный скоринг, fraud
      detection, голосовые ассистенты, рекомендательные системы, dynamic
      pricing. Первый опыт fact-checking на реальных данных.
    doc_id: null
    status: draft
  - number: 6
    title: "AI в инженерном проектировании и CAD/CAM"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO7]
    summary: >-
      Близкая Бауманке тема. Генеративный дизайн как оптимизационный ML,
      topology optimization, AI-ассистенты для расчётов. Критичность точности
      и допусков: ошибка в единицах = от неудобства до катастрофы.
    doc_id: null
    status: draft
  - number: 7
    title: "AI в медицине и фармацевтике"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO8]
    summary: >-
      Сильнейшие кейсы и острейшие дилеммы: drug discovery (DSP-1181),
      AI-диагностика (mosmed.ai), FDA AI/ML framework. Метрики sensitivity
      и specificity, вопрос ответственности за ошибку AI-диагноза.
    doc_id: null
    status: draft
  - number: 8
    title: "AI в креативных индустриях и медиа"
    module: M1
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO4, LO5]
    summary: >-
      Визуально самая яркая лекция: генеративные модели (текст, изображения,
      музыка, видео, 3D), диффузионные модели, мультимодальная и итеративная
      генерация. Правовой статус AI-контента в РФ, ЕС, США.
    doc_id: null
    status: draft
  - number: 9
    title: "AI в авиакосмической отрасли и оборонном комплексе"
    module: M2
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO7]
    summary: >-
      Digital twins для моделирования полётных нагрузок, CV для
      неразрушающего контроля, автономные системы и уровни автономности,
      сертификация AI в критических системах, робототехника в космосе.
    doc_id: null
    status: draft
  - number: 10
    title: "AI в сельском хозяйстве"
    module: M2
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO5]
    summary: >-
      AI в физическом мире: Cognitive Agro Pilot (1500+ комбайнов),
      precision farming (IoT + спутники + ML), дроны для мониторинга,
      роботы для сортировки. Специфика неструктурированной среды.
    doc_id: null
    status: draft
  - number: 11
    title: "AI в дискретном и процессном производстве"
    module: M2
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO7, LO8]
    summary: >-
      Predictive maintenance, CV для контроля качества на конвейере,
      коботы и принципы безопасного взаимодействия с человеком.
      500 млрд руб. дополнительной прибыли от AI в промышленности РФ.
    doc_id: null
    status: draft
  - number: 12
    title: "AI в автоматизации производства и цифровые двойники"
    module: M2
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO2, LO5, LO7]
    summary: >-
      Digital twin производственного процесса; AI для планирования и
      оптимизации цепочки поставок; промышленный IoT как фундамент данных.
      От отдельных AI-решений к интегрированной «умной фабрике».
    doc_id: null
    status: draft
  - number: 13
    title: "AI в логистике и транспорте"
    module: M3
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO7]
    summary: >-
      Reinforcement learning для маршрутизации, автономный транспорт
      (6 уровней SAE), CV для складов (Amazon-роботы), dynamic pricing
      в такси и авиакомпаниях, оптимизация «последней мили».
    doc_id: null
    status: draft
  - number: 14
    title: "AI в телекоммуникациях, сетевой инфраструктуре и кибербезопасности"
    module: M3
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO7]
    summary: >-
      Прямая область будущей работы студентов ИУ6. ML для оптимизации сетей,
      AI для кибербезопасности и AI как инструмент атаки (deepfakes,
      adversarial ML). Гонка вооружений AI в кибербезопасности.
    doc_id: null
    status: draft
  - number: 15
    title: "AI в научных исследованиях"
    module: M3
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO4, LO5, LO6, LO8]
    summary: >-
      Практическая ценность для ВКР: AI для literature review, AI в
      вычислительных экспериментах (AlphaFold, материаловедение),
      воспроизводимость и обязательность указания AI в исследованиях.
    doc_id: null
    status: draft
  - number: 16
    title: "AI в нефтегазовой отрасли и добыче ресурсов"
    module: M3
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO7]
    summary: >-
      Сейсморазведка (CV для интерпретации данных), оптимизация добычи,
      мониторинг трубопроводов (IoT + ML для предсказания утечек),
      роботы в опасных средах, кибербезопасность промышленного IoT.
    doc_id: null
    status: draft
  - number: 17
    title: "Систематизация знаний и навыков"
    module: M3
    duration_min: 75
    duration_ahours: 2
    learning_outcomes: [LO1, LO2, LO3, LO4, LO5, LO6, LO7, LO8]
