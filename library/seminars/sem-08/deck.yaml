    перед отправкой картинки'
  learning_goal: 'Выход занятия предъявляется как артефакт: что добавилось к сценарию и что с этим делать
    дома. Условие сквозной линии С7→С9.'
  visual:
    pattern: outcome_artifact
    primary: 'Карточка файла: что это, как поставить, что нужно, что делать дома. Та же форма, что в закрытии
      Семинара 7.

      '
    backup: 'ЧЕСТНО О СОСТОЯНИИ АРТЕФАКТА на момент написания этого слайда: каждая из четырёх доработок
      собрана и подтверждена отдельными настоящими прогонами на стенде (stend/stage-1-after.json, stage-2.json,
