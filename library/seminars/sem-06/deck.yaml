    владельца (issue 225, часть Б.2): слайд переставлен ДО кейса (был после сцены и вопроса), «что такое
    сервер» теперь первый блок, «где объявляется» несёт настоящий мини-шаблон .mcp.json, «что передаётся
    при вызове» подано явно как вызов, «контекст и цена» переписаны конкретно'
  visual:
    pattern: mechanics_with_figure
