      18:11–22:02). Внесено по разделу B разбора проведения (`qa/RAZBOR-PROVEDENIYA.md`), пункт 4.

      Дословные опоры. Момент выпуска: «он спрашивает, а какие действия вы доверите этому ключу» (гр.
      2, 19:09). Признание автора, которое разбор проведения называет сильнейшим местом обоих занятий
      (§C2): «ваш покорный слуга делает то же самое: все галочки, которые есть, я прощёлкиваю, но на самом
      деле это то, что делать не надо» (гр. 2, 19:09); «я обычно ленюсь, потому что думаю, а вдруг потом
      когда-нибудь что-нибудь понадобится сделать, не перевыпускать же для этого новый ключ» (гр. 2, 19:25);
      то же в группе 1 — «я грешу тем, что просто вот чё хочу, чтобы не думать дальше, что он будет делать»
      (16:54). Хранилище: «не стоит, конечно, их никогда хранить в репозитории» + вопрос про понятие секрета
      (гр. 1, 16:54–17:04). Поиск работающих ключей — его собственный опыт: «развлекался поиском в GitHub,
      забивал ключ OpenAI и находил много работающих ключей» (гр. 1, 17:04). Случай с блокировкой — рассказ
      студентов прошлого потока: «на предыдущем семинаре коллеги ваши рассказали прикольную штуку, которую
      я не знал: OpenRouter сейчас мониторит свои ключи в GitHub, и в случае, если вы светите ключом,
      он мгновенно, в течение буквально секунды, блокируется» (гр. 2, 20:25).

      Атрибуция в материале соблюдена по происхождению каждого куска: признание — автора курса, поиск
      работающих ключей — его собственный опыт, блокировка за секунды — рассказ студентов, названный рассказом.
      [FACT-CHECK: публикует ли названный поставщик сторожа утёкших ключей как заявленное свойство своего
      сервиса и каков объявленный срок блокировки — в материал внесено ИМЕННО как рассказ студентов прошлого
      потока, не как проверенное свойство сервиса; при желании поднять это до проверенного факта нужна
      ссылка на документацию поставщика и/или на программу сканирования секретов хостинга]

      Числа, которые автор называл, но в материал НЕ внесены: «их тысяча просто» про найденные в публичных
      репозиториях ключи (гр. 2, 22:02) — это пересказ чужого опыта («ребята проводили опыт»), счёт не
      его и не проверен; на экране стоит «находил работающие» без числа.

      Чего слайд не повторяет. Вычёркивание прав по списку операций разобрано на `n13` и здесь не пересобирается:
      этот экран про то, почему разобранное вычёркивание на практике не делают. Переменная окружения и
      её граница («диагностическая команда сама может оказаться каналом утечки») стоят на `n14`; здесь
      к ним добавлено хранилище секретов как место долгого хранения, которого в деке не было вовсе.'
