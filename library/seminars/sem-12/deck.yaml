- id: n80
  file: slides/n80-os-zakryta.md
  type: recap_table
  duration_min: 0.75
  assertion: 'Четыре кейса ответили на «чем» четырьмя разными способами, и ни один не сработал без проверки
    числом; на «как» ответ один для всех четырёх: верно и полно ровно настолько, насколько проверено на
