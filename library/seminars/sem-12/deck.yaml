  visual:
    pattern: measured_outcome_table
    primary: Два числа плашками, раздельно. Одна строка-мост к кейсу C.
- id: n36
  file: slides/n36-granitsa.md
  type: criteria
  duration_min: 1.0
  assertion: Рассказ — для непредсказуемых вопросов; теги — для предсказуемых предметов, дёшево и воспроизводимо;
    поля — для предсказуемых вопросов с ценой ошибки; ни один не решает, есть ли на фото наш материал
  learning_goal: 'Граница А7, прямой формой «когда нужно / когда не нужно», плюс явный мост к соседнему
