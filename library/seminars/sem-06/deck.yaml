  visual:
    pattern: section_divider_macro
    primary: 'Тёмный Ocean-фон, заголовок в две строки, золотая линия под ним. Ниже — смысловая строка:
      сколько серверов описалось при старте и сколько из них понадобилось. Внизу — дорожка кейсов блока.'
    backup: 'Источник — rework/section-1-mcp-part1b.md §A.3.1, §B.21 (part1e.md). Кейс написан заново
      по кругу 5 (ZADANIE-KRUG-5.md): владелец снял прежний третий кейс («одобрение, выданное один раз,
      перестаёт быть окончательным») целиком — «кто такой он, что за строки, почему появились — ничего
      не понятно… предлагаю его вообще заменить. давай лучше разберем проблему с переполнением контекста
      из-за слишком большого количества инструментов и/или описаний их». Прежняя фактура кейса (эксперимент
      с юникод-сокрытием, кампания Deadbugz, инцидент postmark-mcp, аннотация обязательного переспроса)
      из занятия выведена целиком, не перенесена в новый кейс. Доказательная база нового кейса — sem-05/research/mechanics-5-mcp.md
      §2.3 (отложенная загрузка определений, таблица ENABLE_TOOL_SEARCH, поле alwaysLoad, обрезка описаний
      2048 символов) и §1.2 (проектная область файла видна всем, кто клонирует), sem-05/research/stage-5-mcp.md
      §1.3 (42 000–55 000 токенов на 93 определения, ≈21% контекста в 200К) плюс research/mcp-kontekst-otkaz.md
      (внешние случаи отказа от загрузки описаний, прочитаны по первоисточникам). Форма развилки сохранена
      прежняя — сцена настоящего времени (кейс 1 — реплика), но читается иначе: там момент обнаружения
      подмены, здесь момент старта, когда ещё ничего не произошло. Правило А2 («название от наблюдаемой
      проблемы») держится на карте занятия (n05, вторая ячейка блока MCP). Правки после проведения (qa/RAZBOR-PROVEDENIYA.md
      §A2): прежний кейс 2 блока свёрнут до экрана n17, поэтому здесь второй случай блока, а не третий.'
- id: n22
  file: slides/n22-stsena-chetyre-servera-ponadobilsya-odin.md
  type: problem_scenario
  duration_min: 1.25
  assertion: Трекер он подключил сам, ещё три сервера дописал в тот же проектный файл коллега — и на длинной
    правке агент сжал разговор заметно раньше обычного; за всю задачу понадобился один сервер из четырёх
  learning_goal: 'Завязка третьего кейса: человек и названная цена. Переполнение обнаруживается по сжатию
    разговора на середине длинной задачи, а причина открывается, только когда человек сам смотрит, из
    чего набран контекст до его первого вопроса. Цена названа в рабочем регистре — час на повторное проговаривание
    решений и одна правка, сделанная по уже отменённому решению'
  visual:
    pattern: problem_scenario
    primary: 'Сверху — одна строка про состав проектного файла: один сервер его, три чужих. Ниже — четыре
      шага: что он заметил, из чего набрано, что нашёл в чужих строках, во что обошлось. Внизу — отдельной
      строкой счёт: обращений за задачу — к одному серверу из четырёх.'
    backup: 'Источник — rework/section-1-mcp-part1b.md §A.3.2, §B.22 (part1e.md). Круг 5 (issue 225, ZADANIE-KRUG-5.md):
      сцена написана заново под замену кейса. Прежняя сцена (описание инструмента, которое сменилось между
      одобрением и перечитыванием) снята вместе с кейсом. Человек — тот же разработчик, что в завязке
      занятия (n01/n04) и в первом случае блока: трекер в проектном файле — его собственный артефакт из
      первого случая (n16), и сцена начинается ровно с него. Три чужих сервера приходят механизмом, который
      зал уже разбирал на n14: проектная область файла подключения общая, её видит каждый, кто клонирует
      репозиторий (sem-05/research/mechanics-5-mcp.md §1.2). Поле alwaysLoad: true взято из документации,
      не придумано для сцены: оно принудительно грузит все инструменты сервера сразу, вне зависимости
      от отложенной загрузки, и документация прямо называет цену — «each upfront tool consumes context
      that would otherwise be available for your conversation» (mechanics-5-mcp.md §2.3, обращение 2026-09-27).
      Мотив коллеги («чтобы инструменты не терялись») — обычная причина, по которой этот флаг и ставят.
      Сцена учебная, как и все сцены занятия: проект настоящий, ситуация собрана из типовых. Измеренные
      числа стоят отдельно, на n25 и n27, и всегда с источником — в сцене ни одной доли контекста не названо
      намеренно, чтобы не выдать учебную оценку за замер.'
- id: n23
  file: slides/n23-vopros-chto-delat-s-zanyatym-kontekstom.md
  type: reflection_question
  duration_min: 1.0
  assertion: Четыре сервера подключены проектным файлом, за задачу понадобился один; зал сперва называет
    два своих числа — сколько серверов подключено у него и к скольким он обращался за неделю, — и на этой
    разнице выбирает, что ставит первым шагом и что добавляет следующим
  learning_goal: Открытый вопрос третьего кейса. Зал ожидаемо разделится между «отключить лишние» и «получать
    описания по требованию» — это материал разбора, где они окажутся шагами одной последовательности с
    разной ценой. Формулировка прямо называет два шага, не выбор одного пункта из пяти
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — строка про собственные числа зала: сколько серверов подключено в рабочем
      проекте и к скольким обращались за неделю. Ниже в золотой рамке — сам вопрос: что ставите первым
      шагом и что добавляете следующим. Под рамкой пять равных карточек, ни одна не выделена.'
    backup: 'Источник — rework/section-1-mcp-part1b.md §A.3.3, §B.23 (part1e.md). Круг 5 (issue 225):
      вопрос и карточки написаны заново под замену кейса. Владелец о прежнем: «подводки к вопросу нет
      никакой да и вопрос не понятен» — поэтому ситуация целиком предъявлена на двух предыдущих экранах
      (сколько серверов, кто их добавил, во что обошлось), а вопрос держится одной строкой и не вводит
      ни одного нового обстоятельства. Двухшаговая формулировка («что первым — что следующим») сохранена
      с прежнего круга: её ввела вторая прожарка (студент-симулятор: «карточки выглядят как альтернативы,
      а ответ — последовательность»), и для нового кейса она работает так же, потому что рабочих мер здесь
      тоже две. Пять карточек подобраны так, чтобы четыре из них зал называл сам: «контекст большой»,
      «отключить лишние», «сжимать чаще» — ходы, которые звучат первыми; «набор под задачу» опирается
      на области видимости из первого случая (n14); «описания по требованию» — поведение по умолчанию,
      о котором зал чаще всего не знает, что оно уже включено и что его можно отменить чужим флагом. Правка
      после двух проведённых занятий (issue 225, qa/RAZBOR-PROVEDENIYA.md §C3): вопросы про собственный
      опыт зала давали ответы, абстрактные — нет. Поэтому впереди вопроса встали два числа самого человека:
      сколько серверов подключено у него в рабочем проекте и к скольким он обращался за последнюю рабочую
      неделю. Разница этих двух чисел — та же, что на сцене, только своя. Карточки, их порядок и разбор
      (n24) не менялись; счёт в справке переставлен так, чтобы не повторять вопрос дважды.'
- id: n24
  file: slides/n24-razbor-server-kotorym-ne-polzovalis-stoit-stolko-zhe.md
  type: answer_breakdown
  duration_min: 2.25
  assertion: 'Плата идёт за подключённость: сервер, к которому за сессию не обратились ни разу, стоит
    столько же, сколько рабочий; работают две меры — проверить, что описания приходят по требованию, и
    держать набор серверов под задачу'
  learning_goal: 'Разбор всех пяти карточек в форме А5 — две содержательные колонки. Вывод называет поворот
    кейса и разводит две рабочие меры по порядку: одна ничего не стоит и часто уже включена, вторая требует
    работы с областями видимости'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает · что не делает или ограничение.
      Порядок строк совпадает с порядком карточек вопроса. Каждая ячейка — короткая фраза, не предложение:
      читается за один проход взгляда по строке.'
    backup: 'Источник — rework/section-1-mcp-part1b.md §A.3.4, §B.24 (part1e.md). Круг 5 (issue 225):
      таблица написана заново под замену кейса. Поворот вынесен в заголовок слайда и в вывод под таблицей:
      плата идёт за подключённость, и сервер, к которому за сессию не обратились, стоит столько же, сколько
      рабочий. Это следует прямо из механики отложенной загрузки (sem-05/research/mechanics-5-mcp.md §2.3):
      в контекст при старте попадают имена инструментов и инструкция сервера, и попадают они по факту
      подключения, без всякой связи с тем, обращался к серверу кто-нибудь или нет. Третья строка несёт
      честную оговорку, без которой слайд врал бы: получение описаний по требованию — поведение по умолчанию
      на актуальных моделях, поэтому действие зала здесь проверочное: смотрят, не отменён ли режим (mechanics-5-mcp.md
      §2.3, таблица ENABLE_TOOL_SEARCH и поле alwaysLoad). Пятая строка опирается на то, что определения
      инструментов приходят в каждый запрос отдельно от истории разговора, поэтому сжатие их не затрагивает.
      Форма таблицы — «вариант · что делает · что не делает / ограничение», та же, что на n12 (ZADANIE-KRUG-2-VLADELTSA.md
      §А5, третий содержательный столбец не заводится).'
- id: n25
