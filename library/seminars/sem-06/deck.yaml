- id: n55
  file: slides/n55-pravilo-v-bazovoy-instruktsii.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Договорённость о том, что каждая задача ведётся в своей рабочей копии, записывается в базовую
    инструкцию проекта — рядом с уже стоящим там требованием работать в ветке, и дописывается вторым концом:
    закончив задачу, предложить слияние и уборку копии'
  learning_goal: 'Артефакт кейса, и он возвращает занятие к первой ступени дуги: файл инструкций проекта,
    заведённый двумя занятиями раньше, принимает третью строку того же рода. Объясняет, почему порядок
    работы записывают, а не держат в памяти, и почему правило дописывают с двух концов — завести копию
    и закрыть её'
  visual:
    pattern: code_artifact
    primary: 'Три пункта на светлой карточке: файл и раздел, куда идут строки, сами строки инлайн-кодом
      и статус артефакта. Ниже — две строки: почему это записывается в инструкцию проекта и почему правило
      дописывают с двух концов; вторая несёт цену незакрытого конца — больше сотни старых копий на рабочей
      машине.'
    backup: 'Источник — прямая рекомендация автора курса, высказанная на проведённом занятии (расшифровка
      `qa/rasshifrovki/gruppa-2.txt`, 1:00:25). Внесено по разделу B разбора проведения (`qa/RAZBOR-PROVEDENIYA.md`),
      пункт 3.

      Дословные опоры. Сама рекомендация: «я бы рекомендовал здесь перенести эти правила в базовую инструкцию.
      Потому что у меня как организовано: помимо требования делать ветви… там соответственно ещё говорится,
      а потом в конце задачи не забудьте смержить» (гр. 2, 1:00:25). Мотив второго конца: «есть соблазн,
      особенно если какая-нибудь исходная задача, что ты в сессии что-то быстро порешал, сессию бросил,
      оно так ветка отдельно валяется, не смержена, мы к ней никогда не попадём, поэтому лучше в инструкции
      прописывать полный цикл решения задачи, как он должен её завершить» (гр. 2, 1:00:51). Цена незакрытого
      конца — его собственный случай, названный в группе 1: «я тут недавно обнаружил, что у меня рабочий
      комп забился из-за того, что там больше сотни воркtree старых лежат» (гр. 1, 47:45). Разбор проведения
      (§C2) называет такие признания сильнейшими местами обоих занятий и просит закладывать их в материал
      намеренно — здесь это и сделано, с явной атрибуцией.

      Состояние файла, в который дописываются строки, — не придумано: раздел `Repository etiquette` в
      `CLAUDE.md` демонстрационного репозитория существует со входа в прошлое занятие и содержит в том
      числе строку «Прямо в `main` не коммитим» (`sem-05/ARCHITECTURE.md` §2а, сверка по клону 2026-10-02).
      Оба вида правил стоят в этом файле рядом с прошлого занятия: раздел `Repository etiquette` — записанное
      словами, раздел `Хук защиты ветки` — исполняемый код (`sem-05/ARCHITECTURE.md` §2а). Слайд, который
      разбирал эту пару внутри Семинара 6 (`n25`), снят соседней сессией вместе со свёрнутым кейсом, поэтому
      опора взята напрямую из состояния файла, а не из соседнего экрана.

      Метка статуса — та же, что у двух сегодняшних артефактов на `n62`: «по плану, коммита нет и не будет».
      Демонстрационный репозиторий дальше не строится (`SPLIT-PLAN-6-7.md` §1, решение владельца), и прятать
      это у третьего артефакта было бы странно на занятии, которое весь час держится на разнице между
      написанным и уже работающим.

      Пересечение с соседней зоной названо прямо: строка этого артефакта добавлена в таблицу `n62` (седьмая
      строка), и это единственная правка существующего слайда, сделанная этой сессией.

      Терминология: слайд написан на «субагенте»; слово «роль» в нём не появляется.'
