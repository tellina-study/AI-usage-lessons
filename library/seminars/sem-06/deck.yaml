  learning_goal: 'Открытый вопрос кейса — зал уже видел источники данных (n07) и устройство MCP (n09),
    прочитал сцену (n10); теперь выбор конкретного способа. Карточки задают предметность: не абстрактная
    осторожность, а конкретный способ и его обоснование. Целевого ответа на слайде нет, разбор идёт следующим
    слайдом'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху тихой формой — строка про собственный опыт зала: у кого агент уже ходил наружу и
      чем это было сделано. Ниже в золотой рамке — сам выбор: найти свой способ среди пяти и сказать,
      выдержит ли он регулярный доступ. Под рамкой пять равных карточек в фиксированном порядке, ни одна
      не выделена. Ни цифр, ни источников на слайде.'
    backup: 'Источник — замечание владельца к кругу 1 правок (issue 225, п.2 дословно): «кроме работы
      собственно mcp положим выбор — api, Mcp удаленный, свой mcp Сервер…». Три обязательных варианта
      из цитаты — api, удалённый MCP-сервер, свой сервер; локальный MCP-сервер разводит «готовый сервер»
      на «где физически работает» (mechanics-5-mcp.md §1.4). Пятая карточка круга 2 (issue 225, построчный
      разбор n12): прежняя «обойтись разовой командой» была непонятна владельцу — «он не про подключение
      к трекеру». Заменена на конкретный, названный инструмент — `gh`, официальный CLI GitHub: он реально
      умеет то же самое действие без MCP, это ровно то, что сравнивает по цене в токенах Scalekit-бенчмарк
      дальше в кейсе (research/stage-5-mcp.md §1.3), не абстрактная «разовая команда». Вторая прожарка
      (issue 225 — студент-симулятор: «я держал в голове вопрос с n11 и ждал одного победителя. Получил
      два законных плюс оговорку… ощущение «ответ сложнее, чем вопрос предполагал»): вопрос в золотой
      рамке переформулирован с «и почему именно он» на «и объясните, чем остальные четыре подходят хуже
      для регулярного доступа» — зал настраивается сравнивать все пять карточек по сценарию (регулярный
      доступ), а не называть первую знакомую. Карточки и целевой разбор (n12) не менялись. Пересмотр по
      сторителлингу (issue 225, П2): первая фраза вопроса привязана к эпизоду сцены («чтобы того вторника
      не повторилось») — зал выбирает способ против конкретного промаха, не против общего состояния. Карточки,
      формулировка выбора и порядок не менялись; справка расширена четырьмя разборами ответов зала. Правка
      после двух проведённых занятий (issue 225, qa/RAZBOR-PROVEDENIYA.md §C3): вопросы про собственный
      опыт зала давали ответы, вопросы про абстрактный выбор — нет. Поэтому выбор теперь стоит вторым
      ходом: первая строка спрашивает, чем зал уже давал агенту доступ наружу, и свой способ человек ищет
      среди пяти карточек. Карточки, их порядок и разбор (n12) не менялись.'
