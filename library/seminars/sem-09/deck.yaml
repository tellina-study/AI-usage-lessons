# Процесс отвечает человеку
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 09
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    5.00 мин
#   Ось        n04–n04    2.00 мин
#   Кейсы      n05–n75  124.00 мин
#   Закрытие   n76–n78    7.00 мин
#   ИТОГО                 138.00 мин при слоте 90

deck:
  seminar_number: 9
  title: Процесс отвечает человеку
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 138.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + настоящие скрины живого
    стенда n8n.lessons.tellian.io + восемь измеренных замеров на этом стенде (1461 вызов, дошедший до
    модели, протоколы в `stend/`); на занятии ведущий ничего не редактирует в узлах вживую — только прогоняет
    уже готовые процессы (решение владельца, ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Как построить решение «отвечать самому или передать человеку»?
  language: ru
  slide_count: 95
  axis: Шесть утверждений, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным, по
    строке за разбор
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Процесс, который до сегодня писал только в таблицу и Ольге, начинает отвечать тому, кто обратился
  learning_goal: Обложка. Называет тему занятия и его ступень дуги — ответ человеку (ступень 3), не новую
    механику инструмента.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия на экране нет.

      '
    backup: 'Название — дословно из `ARCHITECTURE.md` (поле `title`) и из «Темы занятия» `SETKA-KEYSOV-S9.md`:
      процесс сам отвечает клиенту. Номер занятия на обложке не печатается — решение владельца, `sem-06/qa/oblozhka-bez-nomera.md`,
      тот же приём, что у обложки С8. Фигуры на обложке нет сознательно: лестница дуги (`lestnitsa-dugi.png`)
      стоит одним экраном позже, на n03, и дублировать её здесь значило бы показать ступень прежде, чем
      названа нехватка. Вопрос занятия на обложку тоже не вынесен: он задаётся на n04 и дословно повторяется
      на n77, и третье место сбило бы счёт этих двух.'
- id: n02
  file: slides/n02-shov-s8-s9.md
  type: content
  duration_min: 2.5
  assertion: Существующий процесс собран в один файл; сегодня меняется ровно один узел — куда уходит его
    ответ
  learning_goal: Шов С8→С9. Входное состояние названо одной строкой словами; несущая работа кадра — смена
    адресата ответа и цена этой смены, не перечень того, что будет дальше, и не экскурсия по узлам.
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: строка про входное состояние, под ней полоса противопоставления «куда
      уходил ответ · куда уходит», под полосой плашка про цену ошибки.

      '
    backup: 'Источник содержания — `SETKA-KEYSOV-S9.md`, раздел «Открытие», экран 1: шесть узлов прошлой
      цепочки плюс четыре доработки С8 ОДНИМ собранным файлом. Доработки сознательно НЕ вынесены буллитами:
      сетка требует показать их собранными, не списком порознь — поэтому входное состояние названо одной
      строкой, а разбор узлов живёт в заметках. ФИГУРЫ ЗДЕСЬ НЕТ — РЕШЕНИЕ ОРКЕСТРАТОРА 2026-10-26, и
      это снятие, а не пробел. Первый проход слайда стоял на настоящем снимке холста «С9 · вход (выход
      С8)» по форме шва С8 (`sem-08/slides/n02-shov-s7-s8.md`, голосовая правка владельца 2026-10-20:
      снимок плюс одна строка словами). Имени такого снимка в `BRIEF-PROIZVODSTVO.md` §5 не было вовсе
      — список настоящих снимков начинается с `k1-holst-v1.png`; кадр не снят и в `rendered/figures/`
      отсутствует. Закрыто снятием: кадр концептуальный (что меняется с приходом текста к человеку), снимок
      «входа» этому доводу ничего не добавляет, а изображение на соседних кадрах есть — обложка n01 и
      лестница n03. Стилизованной карточки под интерфейс здесь не рисовалось ни на одном круге: подделка
      запрещена правилом курса, и снятие — честный способ закрыть отсутствие кадра. ПРИЁМ ВЕРНУЛСЯ К `content`
      ВМЕСТЕ СО СНЯТИЕМ СНИМКА. Первый проход назывался `mechanism_node_graph` — именем шва С8, и оправдано
      это было ровно тем, что кадр нёс граф узлов снимком. Снимка больше нет, графа узлов на кадре нет,
      и имя стало описывать то, чего на нём не происходит. `BRIEF-PROIZVODSTVO.md` §4 приёма для n02 не
      называет вовсе, а его собственное правило — «где он не назван, `content`»; это и поставлено. Жанр
      от замены не меняется: `mechanism_node_graph` в таблице `genres` отсутствовал и падал в тот же `content`.
      Если оркестратор предпочтёт сохранить имя шва ради переклички с С8 — это одна строка правки здесь,
      собранный кадр от неё не изменится. ПРАВКА 2026-10-29 (РАЗБОР, В-1/В-2/В-3): заголовок переименован
      в «Существующий процесс» (В-1) — прежний заголовок называл только смену адресата, а кадр несёт ещё
      и короткий перечень уже сделанного. Снята фраза «ни один его узел сегодня не переделывается» и в
      Visual, и в заметках (В-2): владелец назвал её неправдой — узел, определяющий адресата ответа, это
      и есть то, что меняется сегодня, и заявлять об отсутствии изменений рядом с таблицей о смене адресата
      — противоречие на одном кадре. Снята строка «Ольга перечитает и перепишет» (В-3, «лажа какая-то»
      — цитата владельца): это не факт о процессе, а предположение о том, что сделает Ольга с чужой ошибкой,
      и кадру о цене ошибки такое предположение не нужно — цену несёт факт «сообщение уже у клиента»,
      а не гадание про канцелярскую привычку.'
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: arc_ladder_recap
  duration_min: 2.0
  assertion: Шесть ступеней доверия к модели, по одной на занятие; сегодняшняя — третья, ответ человеку
  learning_goal: 'Напоминание лестницы дуги, не повторный ввод. Кадр несёт фигуру лестницы: шесть ступеней,
    каждая названа своим вопросом, сегодняшняя обведена золотом, соседние видны — чтобы было понятно,
    чего на этом занятии ещё нет.'
  visual:
    pattern: arc_ladder_recap
    figure: lestnitsa-dugi.png
    primary: 'Фигура лестницы во всю ширину кадра: шесть ступеней снизу вверх, у каждой имя и вопрос ступени
      в одну строку, сегодняшняя обведена золотом. Под фигурой одна строка про то, где мы на этой лестнице
      стоим.

      '
    backup: 'Содержание фигуры — ДОСЛОВНО из `sem-07/KONTSEPTSIYA-7-12.md` §6 (лестница переписана решением
      владельца 2026-10-24, «переписать лестницу»); та же таблица повторена в `SETKA-KEYSOV-S9.md`, раздел
      «Открытие», экран 2. Ни одна формулировка не переписана своими словами: прежняя лестница была в
      примитивах инструмента, и кейсы под неё выходили про инструмент — переписанная держится вопросами,
      и вопрос обязан звучать так же, как в концепции. Проверять это надо в исходнике рисовалки (`rendered/make_figures_lestnitsa.py`),
      а не грепом по деке: подписи внутри схемы — пиксели (канон §7). ПРАВКА 2026-10-29 (РАЗБОР, С8/В-5):
      открывающая строка заметок снята — «эту лестницу вы видели на прошлом занятии, поэтому проходить
      её целиком я не стану» опиралась на память зала о прошлом занятии, ровно то, что С8 запрещает («не
      надо считать, что студенты прям дословно помнят»). Фигура и полный перечень шести ступеней в заметках
      остаются как были — это и есть повторное описание, требуемое С8; снята только фраза, которая заявляла
      о намерении его не делать. ПРИЁМ И ТАБЛИЦА — РЕШЕНИЕ ОРКЕСТРАТОРА 2026-10-26, в пользу фигуры. Первый
      проход этого слайда стоял на `recap_table` по брифу §4 и нёс лестницу таблицей. `recap_table` отображён
      в `rendered/deck-config.yaml` на жанр `axis_table`, а `axis_table` не входит в `genres.DRAWS_FIGURE`
      — фигура не нарисовалась бы никогда («СХЕМА НЕ ДОЙДЁТ»), а таблица дублировала бы её теми же шестью
      именами и теми же шестью вопросами. Приём заменён на `arc_ladder_recap`: этого имени в таблице `genres`
      намеренно нет, поэтому он падает в жанр `content`, а `content` фигуры рисует (рабочий механизм конфига,
      не пробел — `deck-config.yaml` править не нужно). Таблица снята с кадра тем же решением; `recap_table`
      остался за n76, где фигуры нет и таблица уместна. Шесть ступеней с их вопросами на кадре теперь
      ровно в одном месте.'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Шесть утверждений, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным,
    по строке за разбор
  learning_goal: 'Несущая ось занятия: кто поручится, что это можно отправлять. Вопрос занятия задаётся
    здесь дословно и дословно же возвращается на n77. Правая колонка открывается пустой и закрывается
    на n76, не здесь.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, шесть строк. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — ДОСЛОВНО из `SETKA-KEYSOV-S9.md`, раздел «Ось занятия», шесть строк в том
      же порядке. Вопрос занятия — тоже дословно оттуда: «процесс написал человеку — кто поручится, что
      это можно отправлять?» Тот же текст, знак в знак, стоит на n77; сверка двух мест — отчёт `rendered/OTCHET-SLAYDY-vvedenie.md`,
      отдельный раздел. В сетке правые клетки размечены служебными пометками «закроется в Кейсе N» — это
      разметка производства, на видимый слой она не идёт, колонка пуста целиком (тот же приём, что у n04
      Семинара 8). ЗАГОЛОВОК И ПЕРВАЯ СТРОКА — ПРО САМУ ОСЬ, по требованию Pre-USER-GATE §6: заголовок
      называет вопрос, которым занятие мерит каждый свой разбор, и ничего не говорит ни про устройство
      курса, ни про то, что нового на занятии нет. Шесть строк вместо четырёх (у С8 было четыре) — по
      числу кейсов С9; таблица из шести строк с длинными правыми клетками на n76 близка к пределу высоты,
      поэтому правые клетки там держатся коротким измеренным фактом, а подробность живёт в заметках.'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Процесс научился отвечать сам — и первый же вопрос приходит про то, чего в справочнике Ольги
    нет
  learning_goal: 'Дивайдер Кейса 1. Форма текста — СЦЕНА (БРИФ §4a: у каждого кейса занятия своя форма
    дивайдера, П3). Называет проблему (А2), измеренного результата не выдаёт.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Внизу дорожка шести кейсов занятия, первый подсвечен.

      '
    backup: 'Форма «сцена» назначена этому дивайдеру БРИФ-ПРОИЗВОДСТВО §4a (поправка оркестратора после
      первой волны): формы «вопрос», «цифра» и «цитата» отданы Кейсам 3, 2 и 4, чтобы шесть дивайдеров
      подряд не читались одной грамматикой (болезнь §4.1 №7, правило П3).

      Вопрос в строке — дословно один из трёх вопросов вне базы знаний первого прогона стенда (`stend/README.md`,
      прогон 611, «Есть ли бесплатное демо-занятие перед покупкой курса?»). Взят настоящий, не сочинённый:
      §4.3 канона.

      Что сознательно НЕ показано: чем этот прогон кончился. Числа «0 из 3» и «6 из 15» живут в тактах
      n12 и n13 — дивайдер, проговоривший итог, обнуляет и вопрос зала, и разбор (БРИФ §4a).

      Название кейса — «Отвечать или промолчать», по функции, как в дорожке кейсов `rendered/deck-config.yaml`
      (`case_track`), а не по уроку кейса («самоотчёту нельзя верить» — отклонённый вариант, §1 канона
      замысла кейса: по имени нельзя угадать, чем кейс кончится).'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга отвечает на одни и те же вопросы по одному и тому же справочнику — и хочет, чтобы часть
    из них закрывал процесс; но ответ пойдёт обратившемуся, а не ей на проверку
  learning_goal: 'Такт сцены Кейса 1: живая постановка потребности Ольги — кто она, что делает, что ломается
    и чем платит центр. Без версии решения и без находки прогонов (голосовая правка владельца 2026-10-20,
    issue #274: «а что показала практика» не место в постановке).'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой (тот же процесс, что ушёл с прошлого занятия), сразу под ней
      — ОТДЕЛЬНАЯ плашка «справочник весь — десять пунктов» (правка владельца 2026-10-27: размер базы
      не должен тонуть в абзаце, это самостоятельный факт, который держит весь дальнейший выбор решения
      кейса), дальше пронумерованная хронология рабочего дня Ольги, закрывающая плашка про цену и реплика-просьба.
      Версии решения на кадре нет, числа прогонов на кадре нет.

      '
    backup: 'Потребность — из SETKA-KEYSOV-S9.md, раздел «Кейс 1», «Форма входа» и «Постановка»: заявки
      с одними и теми же вопросами повторяются день за днём, и Ольга хочет, чтобы часть из них процесс
      закрывал сам. Рамка постановки — потребность, не «у нас стоит плохое решение» (§1 канона замысла
      кейса).

      Персонаж — Ольга, администратор учебного центра (А13), и тот же объём работы, с которым она пришла
      с прошлого занятия: двадцать заявок в день (`sem-08/slides/n06-k1-stsena.md`, тот же сценарий, не
      новое число).

      Десять пунктов справочника перечислены по `stend/sborka.py`, `KB_ITEMS` — это настоящий состав базы
      знаний на стенде, не придуманный для красоты список.

      Что сознательно НЕ показано: ни одной версии решения, ни одного числа прогона. Сцена ставит задачу
      и называет цену; что показали прогоны — такты n12, n13 и n16.'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Пять действий, спектром от «решает модель целиком» до «решает сравнение строк без модели»
  learning_goal: 'Вопрос Кейса 1: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор, то есть действие, которое можно совершить, а не факт о возможностях
    инструмента (§5 канона замысла кейса).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из пяти карточек равной ширины, расположенных спектром: слева
      «решение целиком у модели», справа «решения у модели нет вовсе», пятая карточка — отдельный способ
      (поиск во внешнем хранилище) рядом со спектром. Пояснений, доводов и пометок на карточках нет —
      разбор следующим экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S9.md, раздел «Кейс 1», подраздел «Вопрос»; формулировки
      не переписаны. Вопрос в рамке — тоже дословная строка оттуда.

      ПЯТАЯ КАРТОЧКА ДОБАВЛЕНА правкой 2026-10-29 (РАЗБОР, К1-4): «не хватает варианта с внешней базой
      (RAG) — добавить, чтобы явно отмести на этом этапе: база маленькая». Карточка держит ту же нейтральность
      А6, что и первые четыре — она называет действие («искать во внешнем хранилище»), а не вывод о нём;
      сам довод «база маленькая, искать незачем» — на разборе (n08), не здесь.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не перечисляет состав собираемого решения, нигде не сказано, сколько
      ответов верных. Собственные числа стенда (0 из 3, 6 из 15, 4 из 15, 2 из 15) на этом экране не стоят
      вовсе — им место в тактах n11a, n12, n13 и n16.

      Проверка на рамку факта (§5 канона замысла кейса): в каждую карточку подставляется повелительный
      глагол — «дать модели решать», «сравнивать строкой», «класть опору в поле», «спрашивать уверенность
      числом», «искать во внешнем хранилище». Ни одна не превращается при этом в утверждение о свойстве
      инструмента («модель ловит смысл, но путает похожее») — все пять остались действиями.

      Порядок карточек — спектр, а не вразнобой: первая отдаёт решение модели целиком, вторая не вызывает
      модель вовсе, третья и четвёртая делят работу между моделью и кодом двумя разными способами. Пятая
      стоит последней как отдельная ось (объём базы), а не продолжение того же спектра.'
