    разбирать четырнадцать строк кода на незнакомом фреймворке. Здесь то же сравнение дано блоками и числами
    — его видно за пять секунд, и оно читается без знания языка
  visual:
    figure: c3-tsena-odnogo-deystviya.png
    pattern: before_after_comparison
    primary: 'Схема во всю ширину, два блока рядом под одной шапкой «одно и то же действие — перевод слова
      на другой язык». Слева один прямоугольник: «1 класс», под ним «1 вызов функции». Справа три прямоугольника
      столбиком — «шаблон промпта», «парсер вывода», «цепочка» — и рядом с ними ряд из четырёх меток вызовов.
      Итоговые числа под каждой стороной, правое золотым. Листинга кода на экране нет.

      '
    backup: 'ПРОВИЗОРНАЯ НУМЕРАЦИЯ круга (пояснение целиком — `n15`): экран заменяет содержательную половину
      прежнего `n15-stsena-octomind-langchain-we-could-just-code.md`. КОД СНЯТ ЦЕЛИКОМ ПО ПРЯМОМУ РЕШЕНИЮ
      ВЛАДЕЛЬЦА («код нигде не нужен»). Это решение ОТМЕНЯЕТ рекомендацию прошлого круга ревью, которая
      оставляла листинг именно здесь на основании «содержание кейса буквально в объёме кода»; студенческая
      прожарка того же круга дала противоположное — экран провалил тест пяти секунд, и причиной назван
      ровно листинг. СХЕМА ЕЩЁ НЕ НАРИСОВАНА: `c3-tsena-odnogo-deystviya.png` объявлена здесь, генератора
      под кейс C в `rendered/` нет вовсе (есть `make_figures_c1/c2/c4/c5/c6/mostik.py`, c3 никогда не
      существовал — у этого кейса до сих пор не было ни одной иллюстрации). Писать `make_figures_c3.py`
      — вне зоны этой сессии; до него сборка честно скажет «НЕТ СХЕМЫ» и соберёт экран по таблице и цитате
