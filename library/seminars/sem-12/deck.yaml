- id: n23
  file: slides/n23-a-itog-mostik.md
  type: content
  duration_min: 0.75
  assertion: Эти значения лягут в карточку заявки; эталон, по которому всё мерили, грязен на 3,3% — и
    это нижняя граница
  learning_goal: 'Итог кейса + мост к Кейсу D (поиск), где корпус A входит контрольной точкой (PEREDELKA
    §6). Оговорка о чистоте эталона — числом, не самоуничижительно (С9). Находка 6 брифа issue #351: добавлена
    вторая вывод-плашка — обобщающий принцип из rework/section-A-dokumenty.md «Результат и обобщение».
    Литкритика Н5 (заголовок — предмет кадра: дефекты эталона, не метафора «ручаемся»), Болезнь2 (снята
    самопохвала «честная деталь»). Доводка (Веха 3, issue #351, 2026-11-24): дефекты эталона обновлены
    2/145 (1,4%) → 4/369 (1,1%) — тогда это было подано как «доля не выросла пропорционально объёму корпуса,
    значит доверие к данным крепче». ДОВОДКА 2026-11-26 (issue #351): **этот вывод СНЯТ целиком как неверный**,
    не пересчитан. Доля стала 12 из 369 = 3,3% (сводный лист §6): прежняя проверка искала дефекты фильтром
    правдоподобия, который требовал цифру в поле категории «дата/число», и потому структурно не видела
    `B-17-88`, `B 90`, `3433/ 3/ 95`, `(400) 840-0639` — цифры в них есть, неверны сами символы. То есть
    1,1% измеряли слепоту нашего фильтра, а не чистоту набора, и «доля не выросла» было утверждением о
    фильтре, выданным за утверждение о данных. Новый вывод на его месте: 3,3% — НИЖНЯЯ граница, потому
    что читались промахи одного метода (67 полей из 369), а дефект, который все четыре метода воспроизвели,
    этим способом не находится вовсе — и такие опаснее всего, они выглядят как согласие методов с истиной.
    Вторая плашка увязана с новой находкой n19 (поломка формата 0% на n=100 — измерение недетерминированности,
    не «риска нет»), не с устаревшим 92,3%.'
