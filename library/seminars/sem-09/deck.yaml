      '
    backup: 'ИСТОЧНИК ФИГУРЫ НАЗВАН ТОЧНО: `k2-promt-baza.png` снят с развёрнутого поля промта узла `Answer
      (free self-report)` — того самого узла версии 1 Кейса 1 (`stend/sborka.py`, функция `case1_v1`),
      исходный кадр `stend/n8n-screenshots-raw/case1-v1-prompt-expanded.png`. Фигура уже лежит в `rendered/figures/`,
      кадр прочитан глазами: видны вводная строка, строка «База знаний учебного центра:», все десять пунктов
      полным текстом, подстановка вопроса клиента и закрывающее указание «если не уверена — честно напиши,
      что не знаешь».

      ЭТО ТОТ ЖЕ КАДР, ЧТО У КЕЙСА 1, И ЭТО СКАЗАНО ВСЛУХ, не замаскировано. Сетка (подраздел «Решение»,
      слой 2) планировала снять панель узла `Answer with grounding (structured)` до и после перестановки
      пунктов. Снимка «после перестановки» на диске нет, и выдумывать его запрещено ([[no-mock-fallbacks]]).
      Взят настоящий имеющийся кадр, а предмет такта от этого не страдает: показать надо, что справочник
      лежит в промте ЦЕЛИКОМ, — и именно это кадр показывает лучше любого другого. Открытый пункт вынесен
      оркестратору отчётом: кадра «порядок пунктов переставлен» у занятия нет.

      Акцент смещён относительно Кейса 1 сознательно. Там тот же снимок работал на закрывающий абзац (просьба
      честно признать незнание), и разбор шёл по нему. Здесь работает середина кадра — сам блок справочника,
      его объём и то, что каждый пункт набран обычным текстом, как в записке человеку.

      Короткие ярлыки пунктов видны на самом снимке; в текст слайда они не вынесены (§7 канона замысла
      кейса: русское предложение раньше любого перечисления на латинице). Имени сценария и номера прогона
      на кадре нет (канон §3).'
- id: n24
  file: slides/n24-k2-rezultat.md
  type: result_preview
  duration_min: 1.0
  assertion: 'На экране не меняется ничего: ни у обратившегося, ни на холсте у Ольги — всё решение уместилось
    в порядок строк внутри одного поля'
  learning_goal: 'Такт результата Кейса 2. Честно назван единственный на занятии разбор без собственного
    прогона: что решение даёт — сказано внешним измерением и с именем работы, что оно стоит — сказано
    своими словами и прямо.'
  visual:
    pattern: result_preview
    primary: 'Два мокапа рядом: экран ответа, который видит обратившийся (до и после — неотличимы), и
      холст процесса (до и после — неотличимы). Под ними плашка о том, чем это решение держится, и плашка
      его цены.

      '
    backup: 'Содержание — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», подраздел «Результат»: новый узел на
      холсте не добавляется, меняется содержимое уже существующего промта; обратившийся не видит изменений.

      ФОРМУЛИРОВКА СЕТКИ СМЯГЧЕНА СОЗНАТЕЛЬНО, и это главное решение этого слайда. Сетка пишет: «по мере
      роста базы ответы на частые темы не теряют точность, а теряли бы, если бы порядок оставался историческим».
      Как утверждение о НАШЕМ процессе это не измерено ни разу: собственная проверка на коротких пунктах
      нашего справочника спроектирована и не прогнана (`[ЗАМЕР НЕ ГОТОВ]`, такт «нюансы» сетки, пункт
      3). На кадре поэтому стоит то, что правда: чем решение держится (внешней работой, с именем) и чего
      у него нет (своего прогона).

      ПЛАШКА «СВОЕГО ПРОГОНА НЕТ» ПОСТАВЛЕНА ИМЕННО ЗДЕСЬ, а не в конце кейса, потому что это такт, на
      котором у остальных пяти разборов стоят собственные числа. Пустое место лучше называть там, где
      его ищут. Формулировка согласована с закрытием занятия — `n76-os-zakryta.md` говорит о том же той
      же мыслью: «собственного прогона на этом стенде нет, опора внешняя».

      Мокапов «до и после» два, и они намеренно неотличимы: это и есть содержание такта. Для сборки фигуры
      они не нужны — оба состояния показываются текстовым представлением, как у `result_preview` Семинара
      8 (`sem-08/slides/n12-k1-rezultat-preview.md`).

      Числа на кадре: ни одного собственного. Внешнее — только ссылка на уже показанную работу разбора
      (n21), без повторного вынесения её цифр.'
- id: n25
  file: slides/n25-k2-kesh-mehanika.md
  type: content
  duration_min: 1.25
  assertion: 'Повторяющееся начало промта можно не оплачивать заново: прочитать его из кэша дешевле, чем
    записать туда, в десять–сорок раз'
  learning_goal: 'Механика кэша промта: три числа из опубликованного прайс-листа, каждое с названной базой
    — множитель к обычной цене входного токена. Внешние цифры названы внешними, модель нашего стенда работает
    через другого посредника.'
  visual:
    pattern: content
    primary: 'Полоса из трёх плашек-множителей с разводящими подписями (запись при коротком хранении ·
      запись при часовом · чтение), под ней плашка порога длины и отдельная врезка с опубликованным разбором
      чужой команды. Множители крупно, пояснение строкой под каждым.

      '
    backup: 'ЧИСЛА И ИХ ИСТОЧНИК, по порядку появления на кадре. 1,25× и 2× (запись), 0,1× (чтение, у
      большинства моделей), 0,05× и 0,025× (чтение у части моделей), 512–4096 токенов (минимальная кэшируемая
      длина), срок хранения — минуты либо час: CHISLA-SVERENO.md, строка 46 (документация Anthropic по
      кэшированию промта, статус СВЕРЕНО, «все значения совпали», на слайд «как есть»). 7% → 84% попаданий
      в кэш, счёт −59% на 9,8 миллиарда токенов: CHISLA-SVERENO.md, строка 47 (опубликованный разбор команды
      ProjectDiscovery, статус СВЕРЕНО).

      «В десять–сорок раз» — не отдельное число, а частное двух уже названных: 1,25 делить на 0,1 даёт
      двенадцать с половиной, 2 делить на 0,05 даёт сорок. Оба конца диапазона выводятся на кадре из множителей,
      которые на нём же и стоят, — чтобы зал не брал кратность на веру.

      БАЗА У КАЖДОГО ЧИСЛА НАЗВАНА ДВАЖДЫ (БРИФ §2, Baseline Mandate): множители — доля ОБЫЧНОЙ цены входного
      токена, а кратность — «дешевле ЗАПИСИ того же текста в кэш», не «дешевле вообще».

      Две пары похожих чисел разведены подписями, как требует форма §5.14: 1,25× и 2× различаются сроком
      хранения (минуты против часа), 0,1× и 0,05× — кругом моделей (большинство против части).

      ЧТО СКАЗАНО ЧЕСТНО И ПРЯМО НА КАДРЕ: это чужой прайс-лист, названный по имени. Модель нашего стенда
      работает через другого посредника, и его множителей мы не мерили. Порог длины подан тем же способом:
      не «наш справочник не кэшируется», а «у справочника такого размера это первое, что проверяют» —
      считать токены нашей базы никто не считал, и выдумывать счёт запрещено.

      Собственных чисел на кадре нет ни одного. У этого разбора их нет вовсе (ARCHITECTURE.md §7).'
- id: n26
  file: slides/n26-k2-kesh-lovushka.md
  type: content
  duration_min: 1.25
  assertion: Кэш читается только при стопроцентно совпадающем начале промта — и любая правка справочника
    стоит выше контрольной точки, поэтому сбрасывает весь накопленный кэш целиком
  learning_goal: 'Цена, названная вместе с условием: экономия кэша существует ровно до первой правки справочника,
    а дописывание в конец списка — такая же правка, как любая другая. Поворот кейса: самое безобидное
    движение Ольги оказывается самым дорогим.'
  visual:
    pattern: content
    figure: k2-shema-kesh-lovushka.png
    primary: 'Условие кэша тремя строками, под ним врезка про дописанный в конец пункт и плашка обратного
      случая: справочник, который правят чаще, чем живёт кэш, обходится дороже, чем если бы кэша не включали
      вовсе.

      '
    backup: 'ФИГУРА добавлена оркестратором 2026-10-26: `k2-shema-kesh-lovushka.png` — два одинаковых
      столбца, различие ровно в одной дописанной строке, контрольная точка поперёк обоих. Прежде эта схема
      называлась `k2-shema-promt-i-kesh.png` и стояла на `n22`, такте слоя 1 — то есть показывала «чем
      кончилось» за четыре экрана до этого такта. Под `n22` нарисована отдельная схема строения промта.
      СОДЕРЖАНИЕ — по SETKA-KEYSOV-S9.md, раздел «Кейс 2», такт «Нюансы», пункт 2: условие совпадения
      — на 100% идентичный префикс до контрольной точки, любое изменение базы ДО этой точки сбрасывает
      весь накопленный кэш целиком.

      ЧИСЛА И ИХ ИСТОЧНИК: 1,25× и 2× (запись), 0,1× (чтение), срок жизни кэша — CHISLA-SVERENO.md, строка
      46 (документация Anthropic, статус СВЕРЕНО). Новых чисел этот кадр не вводит: он берёт множители
      предыдущего такта и показывает случай, в котором их знак меняется — когда чтения не случается ни
      разу, за каждое обращение платят 1,25× вместо 1×.

      ЗАЧЕМ ОТДЕЛЬНЫЙ КАДР ПОСЛЕ МЕХАНИКИ. Это такт поворота кейса (П1). Зал только что увидел экономию
      в десять–сорок раз; здесь выясняется, что движение, которым Ольга пользуется ежедневно и которое
      выглядит самым щадящим — дописать строку в конец, не тронув ни одного старого пункта, — для кэша
      неотличимо от переписывания справочника заново. Разводить эти два такта по кадрам обязательно: на
      одном кадре экономия и её отмена читаются как общая оговорка.

      СВЯЗЬ С ПЕРВОЙ ПОЛОВИНОЙ КЕЙСА названа прямо: по чтению моделью конец списка — щадящее место (разбор
      n21), по кэшу конец списка стоит выше контрольной точки и ничем не отличается от середины. Одно
      и то же движение получает две разные оценки, и обе верны.

      Собственного прогона за этим кадром нет, как и за всем разбором; ни одна строка не выдаёт внешние
      числа за наш опыт.'
- id: n27
  file: slides/n27-k2-obobshchenie.md
