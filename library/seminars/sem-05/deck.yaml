    assertion: "Область видимости конфигурации — физически разные файлы, и при совпадении имени сервера побеждает вся запись приоритетной области целиком, а не смесь полей; поле command — не описание, а команда, которую реально запустят"
    learning_goal: "Механика ступени 5 — области видимости (local/project/user), приоритет при конфликте имён, транспорт stdio как исполняемая конфигурация, сравнение с http и sse"
