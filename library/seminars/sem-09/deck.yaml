      вызовов `zamery-k5-povtorno` — отдельный протокол, отдельная дата, названа отдельно.

      ФИГУРА `k5-shema-tri-ishoda.png` УМЕСТНА ТОЛЬКО ЗДЕСЬ (БРИФ §5, таблица «фигура → такт»): на n58
      (разбор) её ставить нельзя — числа в схеме живут только в том такте, где они вскрываются.'
