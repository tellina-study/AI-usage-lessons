# Когда просьбы недостаточно: барьер и загрузка по требованию
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Открытие   n01–n05    7.00 мин
#   Хук        n06–n33   37.50 мин
#   Скилл      n34–n63   38.25 мин
#   Сборка     n64–n67    6.25 мин
#   ИТОГО                  89.00 мин при слоте 90

deck:
  seminar_number: 5
  title: 'Когда просьбы недостаточно: барьер и загрузка по требованию'
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 89.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО исследования) + совместное формирование
    артефакта + механика на примерах; живого терминала нет
  central_question: Файл инструкций — это просьба. Что поставить рядом с ней, чтобы исполнение правила
    не зависело от решения агента?
  language: ru
  slide_count: 69
  axis: Каждое усиление либо заводится заранее, на день 0, либо только по сигналу — и у каждого есть место,
    где его действие отличается от ожидаемого
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka-tsentralnyy-vopros.md
  type: hero_cover
  duration_min: 0.75
  assertion: 'Файл инструкций — это просьба: агент его читает и может не выполнить; рядом с ним ставится
    механизм, который срабатывает самостоятельно, и механизм, который загружается по требованию'
  learning_goal: 'Открытие одним центральным вопросом, без разгона и без оглавления. Вопрос самодостаточен:
    он держится на состоянии этого репозитория, а не на памяти о прошлом занятии'
  visual:
    pattern: hero_cover
    figure: ramka-n01-hero.png
    primary: 'Тёмный Ocean-фон. Крупный заголовок, под ним одна ведущая строка тихой формой реплики, затем
      центральный вопрос занятия в золотой коробке. Нижняя треть во всю ширину — hero-иллюстрация figures/ramka-n01-hero.png
      (13,333 × 3,4 дюйма = 45% площади слайда): слева белая карточка «просьба» с подписями «записана
      · прочитана» и красной строкой «исполнять её некому», от неё стрелка к ряду из пяти сегментов; первые
      два залиты gold, с замком, подписаны «хук — исполняемый барьер» и «скилл — загрузка по требованию»,
      накрыты gold-скобкой «сегодня — две из пяти»; три остальных — «MCP» с расшифровкой «Model Context
      Protocol», «субагент», «процесс» — даны пунктиром под скобкой «следующее занятие — три».'
    backup: 'Двадцать строк — tellina-study/signup-landing-demo, ветка main, коммит d41f779, gh api …/contents/CLAUDE.md
      → wc -l = 20 (16 непустых), ARCHITECTURE.md §2а, сверено 2026-09-27. Отсутствие .claude/ на входе
      — ARCHITECTURE.md §2 п. 2, дерево снято через gh api …/git/trees. Утверждение «правило про ветки
      было записано заранее и агент его нарушил» на обложку НЕ выносится: строки репозиторного этикета
      на входе в занятие в репозитории нет вовсе (ARCHITECTURE.md §2а, следствие 1), она появляется вместе
      с хуком. Иллюстрация — rendered/make_figures_ramka.py, блок «n01 · обложка»; рисуется программно
      (PIL, шрифты DejaVu), matplotlib в окружении нет.'
- id: n02
  file: slides/n02-gde-my-ostanovilis.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Репозиторий, с которым работает занятие, — рабочий прототип с продуктовым, конфигурационным
    и документационным слоями, и каталога `.claude/` в нём нет вовсе: ни хука, ни скилла, ни субагента'
  learning_goal: 'Состояние репозитория, прочитанное с экрана, а не восстановленное по памяти: что за
    проект, что в нём уже есть, и чего в нём нет вовсе. Точка входа в занятие — последняя строка листинга'
  visual:
    pattern: file_tree_snapshot
    primary: Ведущая строка про то, что за проект и по какому критерию он считается рабочим. Под ней —
      моноширинный листинг дерева `signup-landing` целиком, с пометками слоёв справа от строк; последняя
      строка листинга, отбитая пустой, — про отсутствующий каталог `.claude/`. Внизу подписью во всю ширину
      — замыкающая строка про текст.
    backup: 'Дерево сверено 2026-09-27 напрямую по tellina-study/signup-landing-demo, ветка main (дуга
      Семинара 4 влита, коммит d41f779), через gh api …/git/trees — ARCHITECTURE.md §2. Двадцать строк
      / 16 непустых / 3 раздела — gh api …/contents/CLAUDE.md?ref=main, ARCHITECTURE.md §2а. `.tasks/`
      входит в состояние на входе (коммит 14fa124), без неё дерево не совпало бы с репозиторием. Устаревшие
      захваты assets/captures/22-tree-stage2.txt и 24…27-tree-stageN.txt на этот слайд НЕ идут — сняты
      с исчезнувшей версии репозитория (ARCHITECTURE.md §2 п. 3). Имена трёх пронумерованных ADR не называются:
      в сверенном источнике список обрезан. Слайд намеренно не ссылается на прошлое занятие: всё, что
