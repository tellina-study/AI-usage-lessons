deck:
  seminar_number: 2
  title: "Семинар 2. Воронка решений: когда ИИ, каким и на чём"
  audience: "студенты-инженеры (практикующие, многие/все работают в ИТ, активно пользуются AI-чатами и вайбкодят) — семинар идёт после Лекции 1, до Лекций 2-3"
  format: "разбор_дискуссия"
  central_question: "Правильный ответ зависит от вводных, которых нет в постановке — как задать вопрос, который его меняет?"
  learning_outcomes: [LO1, LO7]
  lo_note: "Закрепляет LO1 (выбор типа AI-решения под задачу) и LO7 (обоснованная критическая проверка) из Лекции 1 — на уровне применения к реалистичным инженерным постановкам, а не повторения определений."
  language: ru
  pivot_note: "issue #182 — деck полностью заменяет пре-пивотный вариант («классифицируй и не ошибись»), зафиксированный как устаревший в brief.md и facilitator-guide.md. Механика занятия — открытое обсуждение всей аудиторией (plenary), без малых групп и без формального подсчёта ответов."
  source_of_truth: "library/seminars/sem-02/brief.md + facilitator-guide.md + facilitator-guide-part2.md"

slides:
  - id: s01
    file: slides/s01-hero-cover.md
    type: hero_cover
    assertion: "Семинар 2. Воронка решений: когда ИИ, каким и на чём"
    learning_goal: "Emotional hook + hero-иллюстрация: цепочка инженерных выборов перед тем, как открыть редактор кода"
    visual:
      pattern: hero_cover_real_photo
      backup: assets/screenshots/s01-*.jpg

  - id: s02
    file: slides/s02-keystone-funnel.md
    type: assertion_visual
    assertion: "Воронка из четырёх выборов — и ответ зависит от вводных, которых нет в постановке"
    learning_goal: "Keystone-слайд: предъявить несущую ось занятия (4 последовательных выбора) до первого кейса"
    visual:
      pattern: vertical_funnel_4_questions

  - id: s03
    file: slides/s03-rag-schema.md
    type: assertion_visual
    assertion: "RAG одним потоком: вопрос → поиск по базе → фрагменты в контекст → ответ"
    learning_goal: "Интуиция RAG за один абзац — узнавать архитектуру, не устройство поиска внутри"
    visual:
      pattern: horizontal_flow_4_steps

  - id: s04
    file: slides/s04-agent-schema.md
    type: assertion_visual
    assertion: "Агент циклом: план → инструмент → проверка → дальше"
    learning_goal: "Интуиция агента за один абзац — цикл с внешними инструментами, не детали планирования"
    visual:
      pattern: circular_flow_4_steps

  - id: s05
    file: slides/s05-section1-divider.md
    type: section_divider
    assertion: "Выбор 1. ИИ или обычный код?"
    learning_goal: "Visual divider — переход в раздел 1, воронка-прогресс с подсветкой шага 1"
    visual:
      pattern: section_divider_with_funnel_progress

  - id: s06
    file: slides/s06-case-documents-setup.md
    type: case_study
    assertion: "Документы поставщиков: два примера, идентичные форматы — нужен ли здесь ИИ?"
    learning_goal: "Постановка кейса 1 — вариативность входа как критерий выбора ИИ vs код"
    visual:
      pattern: two_document_cards_plus_question

  - id: s07
    file: slides/s07-case-documents-reveal.md
    type: case_study
    assertion: "Полный корпус — три года, все поставщики: форматы разъехались. Кто передумал?"
    learning_goal: "Reveal вводной + официальный разбор: гибрид LLM-извлечение + валидация кодом; два примера — не выборка"
    visual:
      pattern: scattered_formats_illustration_plus_verdict

  - id: s08
    file: slides/s08-quickfire-logs.md
    type: case_study
    assertion: "Персоналка в логах — одна технология на всё, или нет?"
    learning_goal: "Quickfire: граница между regex и NER/LLM проходит внутри одной задачи"
    visual:
      pattern: two_column_split_verdict

  - id: s09
    file: slides/s09-from-life-1.md
    type: case_study
    assertion: "Из жизни: Epic Sepsis Model — провал; Ramp — успех"
    learning_goal: "Vendor-метрика без независимой проверки vs замена ручной обработки с мизерным покрытием"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s10
    file: slides/s10-section2-divider.md
    type: section_divider
    assertion: "Выбор 2. Встроить или делать своё?"
    learning_goal: "Visual divider — переход в раздел 2, воронка-прогресс с подсветкой шага 2"
    visual:
      pattern: section_divider_with_funnel_progress

  - id: s11
    file: slides/s11-case-support-setup.md
    type: case_study
    assertion: "Помощник поддержки — где он должен жить?"
    learning_goal: "Постановка кейса 2 — встроить в существующий интерфейс vs отдельный продукт"
    visual:
      pattern: single_card_plus_question

  - id: s12
    file: slides/s12-case-support-reveal.md
    type: case_study
    assertion: "У вендора нет открытого API — единственно верного ответа нет"
    learning_goal: "Reveal вводной + 3 варианта с ценой каждого: сбоку, смена вендора, пересмотр scope"
    visual:
      pattern: three_option_cards_with_cost

  - id: s13
    file: slides/s13-quickfire-product-descriptions.md
    type: case_study
    assertion: "Описания товаров — отдельный сервис, или кнопка в админке?"
    learning_goal: "Quickfire: кнопка в существующем интерфейсе побеждает отдельный продукт"
    visual:
      pattern: single_card_verdict

  - id: s14
    file: slides/s14-kite-vs-copilot.md
    type: case_study
    assertion: "Kite закрылся, Copilot — в 90% Fortune 100. Одна технология, разная встроенность"
    learning_goal: "Из жизни: коммерческая цена архитектурного выбора «встроить или своё»"
    visual:
      pattern: two_column_comparison_plus_footnote

  - id: s15
    file: slides/s15-section3-divider.md
    type: section_divider
    assertion: "Выбор 3. Разовый вызов, RAG или агент?"
    learning_goal: "Visual divider — переход в раздел 3, воронка-прогресс с подсветкой шага 3"
    visual:
      pattern: section_divider_with_funnel_progress

  - id: s16
    file: slides/s16-case-meeting-notes-setup.md
    type: case_study
    assertion: "Протоколы встреч — транскрипт помещается целиком: разовый вызов"
    learning_goal: "Постановка кейса 3 — простейший вариант, который решает текущую задачу"
    visual:
      pattern: single_card_plus_verdict

  - id: s17
    file: slides/s17-case-meeting-notes-rag.md
    type: case_study
    assertion: "База растёт — «что решали по проекту X за полгода?». Кто передумал?"
    learning_goal: "Reveal вводной 1 — рост базы обосновывает RAG"
    visual:
      pattern: growing_database_illustration

  - id: s18
    file: slides/s18-case-meeting-notes-agent.md
    type: case_study
    assertion: "Поручения сами в таск-трекер — действие во внешней системе. Кто передумал ещё раз?"
    learning_goal: "Reveal вводной 2 — действие во внешней системе обосновывает агента; итог: архитектуру двигают требования"
    visual:
      pattern: external_system_action_illustration_plus_verdict

  - id: s19
    file: slides/s19-quickfire-digest.md
    type: case_study
    assertion: "Еженедельный дайджест — агент нужен, RAG нет"
    learning_goal: "Quickfire: RAG ≠ много источников — частая практическая ошибка"
    visual:
      pattern: two_column_needed_not_needed

  - id: s20
    file: slides/s20-octomind-plus-positive.md
    type: case_study
    assertion: "Octomind отказался от LangChain после 12+ месяцев в проде. Deep Research и coding-агенты — где агент необходим"
    learning_goal: "Из жизни: негативный и позитивный пример агентных архитектур"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s21
    file: slides/s21-section4-divider.md
    type: section_divider
    assertion: "Выбор 4. Внешний API или локальный инференс?"
    learning_goal: "Visual divider — переход в раздел 4, воронка-прогресс с подсветкой шага 4"
    visual:
      pattern: section_divider_with_funnel_progress

  - id: s22
    file: slides/s22-case-calls-setup.md
    type: case_study
    assertion: "Саммаризация звонков продаж — сложно, значит облачный frontier API?"
    learning_goal: "Постановка хода 1 трёхходовки — интуиция тянет к мощному облаку"
    visual:
      pattern: single_card_plus_question

  - id: s23
    file: slides/s23-case-calls-pii.md
    type: case_study
    assertion: "В звонках — телефоны, адреса, паспортные данные. 420-ФЗ: оборотный штраф 1-3% выручки"
    learning_goal: "Reveal вводной 1 — персональные данные меняют расчёт; нормативная база"
    visual:
      pattern: fact_card_plus_regulation_strip

  - id: s24
    file: slides/s24-case-calls-local-model.md
    type: case_study
    assertion: "На выходе — шаблон из нескольких полей. Локальная модель 7-8 млрд параметров справляется"
    learning_goal: "Ход 3 — сужение задачи меняет ответ; двойной урок: сложно для человека ≠ сложно для модели"
    visual:
      pattern: single_card_plus_dual_lesson

  - id: s25
    file: slides/s25-samsung-plus-small-models.md
    type: case_study
    assertion: "Samsung: 3 утечки за 19 дней после разрешения ChatGPT. JetBrains и Apple — малые модели в проде уже сейчас"
    learning_goal: "Из жизни: негативный пример утечки + позитивный пример локальных моделей с counterfactual к frontier"
    visual:
      pattern: two_card_contrast_negative_positive

  - id: s26
    file: slides/s26-your-task-worksheet.md
    type: assertion_visual
    assertion: "Разберите вашу задачу — воронка как рабочий лист"
    learning_goal: "Перенос метода занятия на реальную задачу из профессионального опыта аудитории"
    visual:
      pattern: worksheet_4_steps

  - id: s27
    file: slides/s27-handout-memo.md
    type: summary
    assertion: "Памятка «Воронка решений + красные флаги»"
    learning_goal: "Итоговая компиляция четырёх вопросов и шести красных флагов — без нового материала"
    visual:
      pattern: two_column_cheatsheet

  - id: s28
    file: slides/s28-homework-reading.md
    type: summary
    assertion: "Домашнее чтение: Klarna, NYC MyCity, Chevrolet за доллар"
    learning_goal: "Необязательное чтение, закрывающее все четыре выбора воронки на одном длинном примере"
    visual:
      pattern: three_reading_cards

  # резерв — показываются только при остатке времени (лестница резерва, guide part2)
  - id: s28a
    file: slides/s28a-reserve-klarna.md
    type: case_study
    assertion: "Klarna, 2023-2025: одна история — четыре развилки"
    learning_goal: "Резерв: применить всю воронку целиком к одному длинному публичному кейсу вместо разбора нового материала"
    visual:
      pattern: four_row_funnel_case
      reserve: true

  - id: s28b
    file: slides/s28b-reserve-dedup.md
    type: case_study
    assertion: "Дедупликация новостей — интуиция тянет к LLM, но 90% случаев закрывает дешёвый фильтр"
    learning_goal: "Резерв: возврат к вопросу раздела 1 (дешёвый детерминированный фильтр + ИИ на остаток) на новом материале"
    visual:
      pattern: two_card_setup_vs_split_verdict
      reserve: true

  - id: s29
    file: slides/s29-hero-closing.md
    type: hero_closing
    assertion: "Сегодня — что строить. Дальше — как модель устроена внутри"
    learning_goal: "Bridge к Лекции 2; emotional payoff"
    visual:
      pattern: hero_closing_bridge_photo
      backup: assets/screenshots/s29-*.jpg
