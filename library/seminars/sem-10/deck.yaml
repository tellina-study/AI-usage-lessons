      был ошибкой». Прежний файл-генератор НЕ удалён (остаётся записью устройства прежнего решения), но
      слайды на него больше не ссылаются.

      Источник кадра: `stend/n8n-screenshots-raw/case3-canvas.png`, снят `stend/n8n_shots.py` на живом
      `n8n.lessons.tellian.io`, execution на этом демо-сценарии (workflow `s10-case3-search`, id не выносится
      на кадр — канон §3 проектирования). Кроп — `rendered/compose_case3_n8n_shots.py` (Pillow, тот же
      эффект, что `convert -crop`; ImageMagick в этой рабочей среде недоступен) — убран только висящий
      коннектор «+» справа от Result screen, сам холст не пересобран и не дорисован ни одним пикселем.

      ЧТО НА ХОЛСТЕ ВИДНО БУКВАЛЬНО, И ЭТО ВАЖНО: цепочка ЛИНЕЙНАЯ, не две параллельные ветви, сливающиеся
