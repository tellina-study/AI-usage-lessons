- id: n78
  file: slides/n78-mostik-k-s10.md
  type: bridge_forward
  duration_min: 2.0
  assertion: Сегодня вся база знаний лежала внутри запроса к модели; следующая ступень начинается с критерия,
    при котором так держать её перестаёт быть разумным
  learning_goal: Замыкание занятия и постановка следующего. Ступень 4 названа своим именем и своим вопросом;
    обещается ровно то, что на С10 заведомо есть — критерий перехода, названный сегодня. Отдельно сказано,
    чего С10 не чинит.
  visual:
    pattern: bridge_forward
    primary: 'Вопрос следующей ступени плашкой, под ним три условия сегодняшнего критерия списком, под
      ними строка о том, чего вынос базы наружу не чинит.

      '
    backup: 'СОДЕРЖАНИЕ ОБЕЩАНИЯ УРЕЗАНО СОЗНАТЕЛЬНО, и вот почему. Мостик С8 ровно на этом месте пообещал
      залу четыре темы («условие против переходника, классификация отдельным шагом, вход, не подошедший
      ни под одну ветку, видимость параллельных ветвей»), взятые из черновика распределения `sem-07/KONTSEPTSIYA-7-12.md`
      §7 — и все четыре были потом сняты решением владельца 2026-10-24; слайд `sem-08/slides/n57-mostik-k-s9.md`
      до сих пор обещает снятое (открытый пункт `ARCHITECTURE.md` §2 и §9.2). Поэтому здесь на кадр вынесено
      только то, что держится решениями, а не черновиком: (1) название и вопрос ступени 4 — ДОСЛОВНО из
      §6 той же концепции, а §6 переписана прямым решением владельца; (2) критерий перехода — из такта
      «нюансы» разбора «Оптимизация промта» (переименован К2-1, разбор 2026-10-29; `SETKA-KEYSOV-S9.md`,
      Кейс 2, пункт 3), то есть названный на этом же занятии и уже слышанный залом; §7 прямо фиксирует,
      что С10 с этого критерия и начинается.

      ВТОРОЕ УСЛОВИЕ ПЕРЕФОРМУЛИРОВАНО (К2-15, К2-19): прежняя редакция несла блaнкетное «любое изменение
      раньше контрольной точки сбрасывает накопленный кэш целиком» — перепрогон (119 вызовов) показал,
      что это верно только для раскладки «справочник одним блоком» и неверно как общее правило: при базе,
      разбитой на несколько блоков, с точкой на новом последнем, старое уцелевает. Условие сверено дословно
      с n28. ЧЕГО ЗДЕСЬ НЕТ И ПОЧЕМУ. Механика следующего занятия (векторное хранилище, циклы по элементам,
      шаг поиска) живёт в §7, помеченном «черновик, уточняется» — на кадр она не выносится, иначе повторится
      ошибка С8. Память разговора, модель с полномочиями и оценка качества шага вообще не упомянуты: это
      ступени 5 и 6, занятия С11 и С12. ОТДЕЛЬНАЯ ЧЕСТНАЯ СТРОКА про то, что вынос базы наружу НЕ чинит
      три находки разбора «Повторяемость ответа» — дословно по его такту «нюансы», пункт 4 (`SETKA-KEYSOV-S9-part2.md`):
      формулы пересчёта всё так же нет, порог всё так же надо применять, два пункта всё так же надо совмещать.'
