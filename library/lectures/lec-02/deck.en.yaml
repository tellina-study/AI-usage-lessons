# library/lectures/lec-02/deck.en.yaml
#
# EN translation of deck.yaml v3.3 (issue #188, bilingual production rule).
# Russian deck.yaml is the source of truth; this file is a full derived
# translation, not an independent edit surface. Do not hand-edit content
# drift between RU and EN — re-derive from deck.yaml on structural changes.
#
# Key facts (mirrored from RU v3.3): 47 slides, 100 min, 7 sections
# (Introduction / Tokenization / Embeddings / Attention / Sampling /
# Model Types and Sizes / Wrap-up). Source chapter: v2.3 (3 parts).
# Slide files live in slides-en/ (mirrors slides/ 1:1 by slug).
# See deck.yaml for full multi-round changelog and rationale.

deck:
  lecture_number: 2
  title: "Lecture 2. How Modern Large Language Models Work"
  audience: "3rd-year students, general audience; experienced LLM users, many write code with assistants daily"
  duration_min: 100
  central_question: "Examine how a language model actually works — and unpack the details that change how you build prompts, agents, and decisions."
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: en
  status: draft
  version: v3.3
  source: "chapter v2.3 (3 parts)"
  plan: "notes/lecture-2-review/final/rework-round2.md"
  total_slides: 47
  curriculum_level: introductory

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # v3 core — 25 terms (chat template / special token moved to Lecture 3 along
  # with s07; rest unchanged). Designer/critic enforce no drift.
  # Advanced-optional (chapter-only, no mandatory recall): prefill/decode, RoPE,
  # YaRN, TTFT, speculative decoding, MRL (matryoshka), adaptive thinking / effort, MoE.
  - token
  - tokenization
  - BPE (Byte-Pair Encoding)
  - embedding
  - semantic similarity
  - cosine similarity
  - attention mechanism
  - context window
  - in-context
  - sampling
  - temperature
  - top-p (nucleus sampling)
  - top-k
  - max_tokens
  - autoregressive
  - probability distribution
  - letter blindness
  - KV-cache
  - prompt caching
  - reasoning tokens (thinking)
  - constrained decoding
  - batch invariance
  - jagged intelligence
  - glitch token
  - mixture-of-experts (MoE, giants)

slides:
  # ─── Section 0. Introduction (6 slides, 9.0 min) ───
  - id: s01
    file: slides-en/s01-checklist-hook.md
    type: hook
    section: "Section 0. Introduction"
    duration_min: 2.5
    assertion: "temperature=0 — so the answer is always the same? Yes. → But no."
    learning_goal: "Meme hook: two-panel meme about temperature=0, no checklist and no poll — hook with a question, the answer unfolds in the sampling section"
    learning_outcomes: [LO7]
    chapter_ref: "§Введение [for-slide-s01]"
    visual:
      pattern: two_panel_meme_poster
      primary: "Intermission-style meme poster (custom flat illustration, Ocean palette, hero ≥40% of area): panel 1 — a big question 'temperature=0 — so the answer is always the same?' + a confident character, big 'Yes.' below it; panel 2 — the same character now doubtful, gold overlay '→ But no.' Small caption at the bottom: 'why — today.' No checklists, no interactivity."

  - id: s02
    file: slides-en/s02-cover.md
    type: cover
    section: "Section 0. Introduction"
    duration_min: 0.5
    assertion: "Lecture 2. How Modern Large Language Models Work"
    learning_goal: "Cover — title + lecture number + subtitle for the new structure (7 sections)"
    learning_outcomes: [LO1, LO4, LO6, LO7]
    chapter_ref: "§Введение [for-slide-s02]"
    visual:
      pattern: cover_clean
      primary: "Large '02' in gold outline, title, subtitle 'The inference pipeline — and the limits that change engineering decisions' + hero motif (4-stage pipeline icon). No roadmap bar (the map is s02a)."

  - id: s02a
    file: slides-en/s02a-lecture-map.md
    type: roadmap
    section: "Section 0. Introduction"
    duration_min: 0.5
    assertion: "Lecture map — 7 sections"
    learning_goal: "Route map through the inference pipeline + the new 'Model Types and Sizes' section"
    learning_outcomes: [LO1]
    chapter_ref: "§Карта главы [for-slide-s02a]"
    visual:
      pattern: lecture_roadmap_7_sections
      primary: "7 horizontal cards (0 Introduction / 1 Tokenization / 2 Embeddings / 3 Attention / 4 Sampling / 5 Model Types and Sizes / 6 Wrap-up) with one-line descriptions; active Section 0 — gold outline. No chips, no minutes, no references to checklist claims."

  - id: s03
    file: slides-en/s03-recap-lec1.md
    type: assertion_visual
    section: "Section 0. Introduction"
    duration_min: 1.5
    assertion: "Today's object is the 'model' layer from Lecture 1's four layers"
    learning_goal: "The object under examination (the 'model' layer in Lec-1's 4-layer picture) + bridge to the internals of inference"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s03]"
    visual:
      pattern: layers_recap_with_zoom
      primary: "Left — nested layers from Lec-1 (model → chat → agent → application), the bottom 'Model' layer in gold. Right — 2 lines: 'The \"model\" layer: stateless inference' → 'Today: we take apart what's inside this inference.'"

  - id: s04
    file: slides-en/s04-central-question.md
    type: assertion_visual
    section: "Section 0. Introduction"
    duration_min: 1.5
    assertion: "Lecture goal: examine how a language model works — and unpack the details that change engineering decisions"
    learning_goal: "Lecture goal + lecture promises mapped onto the new 7-section structure"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§Введение [for-slide-s04]"
    visual:
      pattern: central_question_with_promises
      primary: "Lecture goal, large (28–32pt bold #21295C). Below it — 7 compact promise chips (one per lecture section, no M-codes): 'why the patched strawberry proves nothing', 'why a role in the prompt actually changes the answer', 'what the 1M window really delivers', 'why T=0 doesn't give identical answers', 'how much invisible tokens cost', 'small model vs giant — which criterion to choose by', 'what to use instead of trusting benchmarks'. Gold marker on 'the details that matter'."

  - id: s04b
    file: slides-en/s04b-keystone-pipeline.md
    type: assertion_visual
    section: "Section 0. Introduction"
    duration_min: 2.5
    assertion: "Data flow in an LLM: words → tokens → vectors → LLM → vectors → tokens → words"
    learning_goal: "Keystone: the full 7-stage inference pipeline before the first deep dive; echoed by the progress indicator on every divider"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s04b]"
    visual:
      pattern: pipeline_7_stages_horizontal
      primary: "Horizontal 7-stage pipeline: Text → Tokens → Vectors → LLM (gold center) → Distribution → Token → Text; a short caption under each stage. Autoregression loop: an arrow from [Token] back to the input labeled 'tokens are generated one at a time; each is appended to the input.' Below the pipeline — 4 sub-cards for Sections 1/2/3/4 showing which stages they cover. Gold callout: 'words only exist at the boundaries; inside, it's vectors.'"

  # ─── Section 1. Tokenization (7 slides, 15.0 min; s07 removed → Lecture 3) ───
  - id: s05a
    file: slides-en/s05a-section1-divider.md
    type: section_divider
    section: "Section 1. Tokenization"
    duration_min: 0.5
    assertion: "Section 1 — Tokenization: how the model sees your text"
    learning_goal: "Divider: entry into pipeline stage 1"
    learning_outcomes: [LO1]
    chapter_ref: "§1"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "v3.2: Large 'Section 1' (140pt gold), below it 'Tokenization', frame phrase 'How the model sees your text', tag '3 case studies · 3 failures'. Below — mini pipeline from s04b with the 'Tokens' stage highlighted in gold. Right — Surprised Pikachu meme ('the model confidently gives a wrong answer — it sees chunks, not letters'), no source caption."

  - id: s05
    file: slides-en/s05-what-is-token.md
    type: assertion_visual
    section: "Section 1. Tokenization"
    duration_min: 2
    assertion: "A token is an id from the model's vocabulary. Not a letter and not a word; a statistically frequent subsequence"
    learning_goal: "Pin down the exact definition of a token (pace ×2 — the audience knows it roughly already)"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s05]"
    visual:
      pattern: token_examples_3_cases
      primary: "3 tokenization examples: cat → [cat], tokenization → [token][ization], hyperparameter → [hyper][param][eter] (o200k_base). Gold callout: '1 token ≈ 4 EN characters ≈ 2 RU characters.' Caption: the vocabulary and the model are two separate artifacts."

  - id: s06
    file: slides-en/s06-bpe-compromise.md
    type: comparison
    section: "Section 1. Tokenization"
    duration_min: 2.5
    assertion: "BPE is a compromise between an alphabet and a full vocabulary; the vocabulary is built once, before training"
    learning_goal: "BPE + the engineering detail 'built once / sampled at inference' + vendors count text differently"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§1.2 [for-slide-s06]"
    visual:
      pattern: before_after_no_iteration
      primary: "Two columns: training corpus 'low / lower / newest / widest' → BPE vocabulary 'low / er / new / est / wid'. Gold callout: 'the vocabulary is built once before training; at inference time it's just a lookup of ready-made rules.' Caption: different vendors slice the same text differently."

  - id: s08
    file: slides-en/s08-strawberry-2026.md
    type: case_study
    section: "Section 1. Tokenization"
    duration_min: 3
    assertion: "Patch race: strawberry got fixed in April, cranberry only in July; the underlying class of problem remains"
    learning_goal: "Mechanism of letter blindness (quick — the meme is familiar) + 2026 diagnosis: point patches instead of a real skill + jagged intelligence"
    learning_outcomes: [LO6, LO7]
    chapter_ref: "§1.4 [for-slide-s08]"
    visual:
      pattern: case_split_with_timeline
      primary: "v3.2: Left, compact — the mechanism: strawberry → [st][raw][berry], the model sees 3 tokens, not 10 letters; below the text — an Expanding Brain meme (4 panels, custom text over the template: GPT-5.2→5.5→5.6→StrawberryBench). Right — a timeline of the patch race: GPT-5.2 (Dec 2025) strawberry ✗; GPT-5.5 (Apr 2026) strawberry ✓ / cranberry ✗; GPT-5.6 (Jul 2026) cranberry ✓ (gold); StrawberryBench — 847 questions, 7 levels. Below, a 'jagged intelligence' callout + a 'What to do' line: test cranberry on your own domain; a viral pass ≠ a real skill."
    interaction: retrieval_live_attempt   # cranberry on current models, live
    verify_day_of: true

  - id: s09
    file: slides-en/s09-numbers-and-code.md
    type: comparison
    section: "Section 1. Tokenization"
    duration_min: 2.5
    assertion: "The tokenizer cuts by frequency, not by structure: numbers get chunked in groups of 3 digits, code gets cut by whole indentation blocks"
    learning_goal: "Numbers and code as the second/third case where the cut diverges from structure; compact-comparison format (not a case study, to avoid duplicating s08)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.5 [for-slide-s09]"
    visual:
      pattern: two_column_compare
      primary: "Motivation line: numbers and code are the most common 'non-text' inputs. Column 'Numbers': 1000000 → [100][000][0] — chunks left to right ≠ place values (which go right to left); right-to-left slicing improves arithmetic, special schemes up to +33% (gold). Column 'Code': GPT-2 — 16 tokens for one indent; GPT-4 — spaces grouped. Below, a 'What to do' block: digit separators, offload computation to a tool, consistent indentation + a line about ready-made chat products auto-routing arithmetic to a code interpreter. In the lower half of the 'Code' column — a Math Lady meme captioned '[123][456][78]?' (~2.4 inches, v3.3 r2)."

  - id: s10
    file: slides-en/s10-glitch-tokens.md
    type: assertion_visual
    section: "Section 1. Tokenization"
    duration_min: 2.5
    assertion: "Roughly 4% of the vocabulary is glitch tokens: the vocabulary is built separately from the model, and some entries end up undertrained"
    learning_goal: "Glitch tokens: from the SolidGoldMagikarp anecdote to a systemic property of the pipeline (GlitchMiner 2026)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.6 [for-slide-s10]"
    visual:
      pattern: anecdote_to_mechanism
      primary: "v3.2: Left — a compact story card: SolidGoldMagikarp (2023) + official Magikarp artwork (direct callback to the name, medium-sized — replaces the removed small Playground screenshot) + one line of mechanism: vocabulary corpus ≠ model training corpus → the embedding ends up with a random initialization. Center/right — an expanded 'What it affects in practice' block: parsing failures on exotic strings, production risks (logs, user-generated IDs), diagnosis via a placeholder, input sanitization. Fact card GlitchMiner (AAAI 2026): 'roughly 4% of the vocabulary' (gold), reproduced across Llama, Qwen, Gemma, Phi-3, Mistral. Footer: a systemic feature of the pipeline, not a version-specific bug."

  - id: s11
    file: slides-en/s11-language-cost.md
    type: comparison
    section: "Section 1. Tokenization"
    duration_min: 2
    assertion: "The same text in Russian costs ≈2× more tokens than in English; o200k narrowed the gap by a third, but didn't close it"
    learning_goal: "Cost of languages + 2024–2026 dynamics + consequences for chunking/max_tokens"
    learning_outcomes: [LO6]
    chapter_ref: "§1.7 [for-slide-s11]"
    visual:
      pattern: bar_chart_tokens_per_char
      primary: "Bar chart, tokens per character: EN ~0.25, RU ~0.5 (gold), ZH ~0.8, Python ~0.4. A dynamics line: o200k_base — roughly −35% for non-Latin scripts, the gap narrows but doesn't disappear. Below, a 'What to do' block: calibrate your limits in tokens for your own language (chunks, max_tokens, window); for batch processing, weigh translating to English first (≈2× cheaper). In the lower half of the right box — an Always Has Been meme: 'the Russian token costs more?' / 'always has been' (~2.8 inches, v3.3 r2)."

  # ─── Section 2. Embeddings (6 slides, 11.0 min) ───
  - id: s12a
    file: slides-en/s12a-section2-divider.md
    type: section_divider
    section: "Section 2. Embeddings"
    duration_min: 0.5
    assertion: "Section 2 — Embeddings: the space of meanings"
    learning_goal: "Divider: entry into pipeline stage 2"
    learning_outcomes: [LO1]
    chapter_ref: "§2"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "v3.2: Large 'Section 2' (140pt gold), below it 'Embeddings', frame phrase 'The space of meanings — and the boundary of similarity', tag '4 case studies · 1 failure'. Below — mini pipeline with the 'Vectors' stage highlighted in gold. Right — the Pam 'They're the same picture' meme (The Office) — 'different words, one meaning', a direct illustration of the similarity/embeddings theme, no source caption."

  - id: s12
    file: slides-en/s12-what-is-embedding.md
    type: assertion_visual
    section: "Section 2. Embeddings"
    duration_min: 1.5
    assertion: "Every token is mapped to a vector from an input lookup table; it's learned during training and then fixed"
    learning_goal: "Embedding as a lookup from the input table — sets up the 'three lives' idea (s13)"
    learning_outcomes: [LO1]
    chapter_ref: "§2.1 [for-slide-s12]"
    visual:
      pattern: token_to_vector_lookup
      primary: "Diagram: [cat] → lookup from the input table → vector [0.21, −0.45, 0.88, …, 0.13]. Mini dimensionality callout: text-embedding-3-small 1536 / -large 3072; flagship models' internal dimensions aren't published, order of magnitude is thousands. Gold callout: 'geometric closeness = semantic closeness.' Action line: a typo or different casing produces a different token and vector — normalize input before embedding."

  - id: s13
    file: slides-en/s13-three-lives.md
    type: assertion_visual
    section: "Section 2. Embeddings"
    duration_min: 3
    assertion: "Embeddings aren't only an internal part of inference: search and RAG run on a separate embedding model"
    learning_goal: "The 'three lives' of an embedding from a search-practice angle (term-lock 'three lives'); which 'life' actually powers RAG; reindexing isn't tied to the chat LLM"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§2.2 [for-slide-s13]"
    visual:
      pattern: three_lives_cards
      primary: "Thesis line: search and RAG run on the third life of the term. 3 vertical cards: (1) Input table — internal to inference, static; (2) The model's internal data representation — vectors the model recomputes as it reads through the context, after the attention layers; (3) Vectors for search — a standalone tool (gold outline, 'this is your actual search/RAG'): a separate embedding model. Below, a gold callout: 'updated the chat LLM → you do NOT need to reindex the database.'"

  - id: s14
    file: slides-en/s14-embedding-space.md
    type: assertion_visual
    section: "Section 2. Embeddings"
    duration_min: 1.5
    assertion: "Embedding space has hundreds to thousands of dimensions; tokens close in meaning sit near each other"
    learning_goal: "Intuition for the space: dimensionality, learned coordinates, 2D projection + a caveat that this is about comparisons, not absolutes"
    learning_outcomes: [LO1]
    chapter_ref: "§2.1–2.3 [for-slide-s14]"
    visual:
      pattern: embedding_space_2d_concept
      primary: "v3.2: Left — a 2D scatter plot (PCA-style) with labeled feature axes; 2 clusters + one outlier (same texts as the s15 heatmap): an SSL cluster, a React cluster, an outlier 'Borscht recipe.' Caption: 'each of the 1536+ axes is a learned feature; only two are shown here.' (The decorative 'star map' mock was removed — it duplicated the scatter itself.) Right — 3 fact cards: dimensionality (1536–3072, gold), training, projection + a gold action callout."

  - id: s15
    file: slides-en/s15-similarity-boundary.md
    type: case_study
    section: "Section 2. Embeddings"
    duration_min: 3
    assertion: "High similarity means 'about the same thing' — not 'the same meaning': similarity ≠ relevance"
    learning_goal: "Similarity heatmap (KEEP-core) + a failure boundary: 'enable SSL' ↔ 'disable SSL' — close vectors, opposite meaning; bridge to Lecture 3"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§2.4 [for-slide-s15] (heatmap — §2.3)"
    visual:
      pattern: heatmap_plus_failure_pair
      primary: "Left — a 5×5 cosine similarity heatmap (SSL/HTTPS ~0.85, React pair ~0.78, borscht 0.05–0.15), Ocean color scale. Right — a failure card: 'How to enable SSL' ↔ 'How to disable SSL' — very high similarity (gold outline), opposite practical meaning. Below the scale legend — a Spider-Man Pointing at Spider-Man meme ('similar' isn't the same as 'about the same thing'), a metaphor for similarity ≠ relevance (v3.3). Callout: similarity is a candidate-generation signal; relevance is a separate task (reranker, hybrid search, filters)."

  - id: s17
    file: slides-en/s17-embeddings-foundation.md
    type: assertion_visual
    section: "Section 2. Embeddings"
    duration_min: 1.5
    assertion: "Embeddings are the foundation of understanding an LLM: the model operates in vector space, not in strings"
    learning_goal: "Section wrap-up: the round-trip path + what 'understanding' actually gives you; one pointer line on choosing embedding models (chapter-only)"
    learning_outcomes: [LO1]
    chapter_ref: "§2.5 [for-slide-s17] (+§2.6 chapter-only)"
    visual:
      pattern: vertical_pipeline_plus_3_examples
      primary: "Left — a vertical two-way diagram (words → tokens → vectors → LLM gold center → vectors → tokens → words). Right — 2 cards: paraphrases and synonyms / cross-language closeness. Gold callout: 'sentence-level semantic closeness is the foundation of understanding.' Action line: a single embedding model/index can serve search+clustering+RAG together. Caption: choosing an embedding model (MTEB, matryoshka representations) — covered in the chapter."

  # ─── Section 3. Attention Mechanism (8 slides, 21.0 min) ───
  # v3.0 order: s18 → s19 → s21 (KV-cache right after Q/K/V) → s22 → s20 → s23 → s25
  - id: s18a
    file: slides-en/s18a-section3-attention.md
    type: section_divider
    section: "Section 3. Attention Mechanism"
    duration_min: 0.5
    assertion: "Section 3 — Attention Mechanism: how the model decides what to rely on in the context"
    learning_goal: "Section 3 divider — transition to the third pipeline stage"
    learning_outcomes: [LO1]
    chapter_ref: "§3 (chapter-part2.md) [for-slide-s18]"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "v3.2: Large 'Section 3' (140pt gold), below it 'Attention Mechanism', frame phrase, tag '4 case studies · 2 failures'. Below — mini pipeline with the 'LLM/Attention' stage highlighted in gold. Right — a stock photo of a theater spotlight (a beam lighting up the stage, darkness around it) — a literal illustration of attention, no source caption."

  - id: s18
    file: slides-en/s18-attention-matrix.md
    type: assertion_visual
    section: "Section 3. Attention Mechanism"
    duration_min: 2
    assertion: "Attention is checking every token against every other token: N × N at each step"
    learning_goal: "Attention as a matrix operation — the basis of quadratic cost and multi-head attention; what the weight distribution actually affects"
    learning_outcomes: [LO1]
    chapter_ref: "§3.1 (chapter-part2.md) [for-slide-s18]"
    visual:
      pattern: attention_matrix_7x7_heatmap
      primary: "Left 60% — a 7×7 attention-matrix heatmap for 'The cat ate the mouse because it was hungry,' the cell 'it'→'cat' in gold (gender agreement); the upper triangle grayed out. Right 40% — 3 properties: N×N and quadratic cost; recomputed at every step; multi-head. Callout 'what the weight distribution affects': the weights determine whose Value ends up in the current token's representation → directly affects the next prediction."

  - id: s19
    file: slides-en/s19-what-is-attention.md
    type: assertion_visual
    section: "Section 3. Attention Mechanism"
    duration_min: 2
    assertion: "Attention outputs a weight distribution over every token in the context — mechanically via three projections, Query/Key/Value"
    learning_goal: "Definition of attention via the spotlight metaphor + Q/K/V on a concrete example from our sentence (sets up KV-cache)"
    learning_outcomes: [LO1]
    chapter_ref: "§3.1 (chapter-part2.md) [for-slide-s19]"
    visual:
      pattern: qkv_worked_example_plus_bars
      primary: "Top — a gold callout 'Q is about the current step. K and V are about the context already processed' + three Query/Key/Value tiles. Below — a worked example: Q('it') = 'looking for: who could have been hungry', K('cat') = 'I am the animate subject', V('cat') = the content that will flow into the representation of 'it.' Right — a bar chart of weights over 7 tokens (leader 'cat' in gold, consistent with s18). Below, the spotlight metaphor in one line."

  - id: s21
    file: slides-en/s21-kv-cache.md
    type: assertion_visual
    section: "Section 3. Attention Mechanism"
    duration_min: 4
    assertion: "K and V for the context are cached; only Q is recomputed — hence the two generation phases and 'long chats slow down'"
    learning_goal: "KV-cache as the central inference optimization; the prefill/decode asymmetry and its observable consequences"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§3.3 (chapter-part2.md) [for-slide-s21]"
    visual:
      pattern: two_phase_schema_plus_vendors
      primary: "Top — a KV-cache diagram: context tokens with K/V tiles (teal, 'in cache'), the new token with Q (gold). Middle — two phases: Prefill (parallel, compute-bound) vs Decode (sequential, memory-bound). Bottom — a vendor table: OpenAI — automatic; Gemini — implicit; DeepSeek — automatic, disk-backed; Anthropic — explicit (cache_control). Gold callout: the cache makes resending history cheap and fast; 'slows down and gets expensive' is what happens when the cache misses."
    verify_day_of: true

  - id: s22
    file: slides-en/s22-prompt-caching-economics.md
    type: assertion_visual
    section: "Section 3. Attention Mechanism"
    duration_min: 3.5
    assertion: "Prompt caching is a bet on reuse: reads cost 0.1× the base rate, writes cost more than plain input, and one changed token invalidates everything after it"
    learning_goal: "Prompt-caching economics via a diagram of three sequential requests: write → cache hit → cache miss; the 'stable content goes first' rule"
    learning_outcomes: [LO4, LO6]
    chapter_ref: "§3.4 (chapter-part2.md) [for-slide-s22]"
    visual:
      pattern: three_requests_schema
      primary: "Left 55% — a diagram of THREE requests: Request 1 'the prefix gets written to cache' (write 1.25–2×, teal), Request 2 'the same prefix → cache hit' (read 0.1×, gold), Request 3 'a line was inserted at the front → prefix no longer matches → cache miss' (full price). A mini case: $45,000 → $8,000 (−82%). Right 45% — an exact-prefix diagram: a new line at the start breaks the cache for every block after it. Gold callout: 'Stable content goes first, variable content goes last.' No interactivity. To the right of the case-study bars — a Stonks meme (~1.65 inches) as an emotional anchor for the −82% savings (v3.3 r2)."
    verify_day_of: true

  - id: s20
    file: slides-en/s20-worked-example-role-effect.md
    type: case_study
