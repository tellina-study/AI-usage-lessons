- id: n07
  file: slides-en/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Five actions, spread from 'the model decides everything' to 'string comparison decides, no
    model at all'
  learning_goal: 'Case 1''s question: bare action cards, no verdicts, no cost, no description of the solution''s
    parts (A6). Each card is a design choice — an action you could take — not a fact about a tool''s capabilities
    (case-design canon §5).'
  visual:
    pattern: question_with_option_cards
    primary: 'The question in a gold frame and a row of five equal-width cards laid out as a spectrum:
      on the left "the decision lives entirely in the model", on the right "there''s no model in the decision
      at all", the fifth card is a separate approach (searching an external store) next to the spectrum.
      No explanations, arguments, or notes on the cards — the breakdown comes on the next screen.

      '
    backup: 'The cards are verbatim from SETKA-KEYSOV-S9.md, section "Case 1", subsection "Question";
      the wording hasn''t been rewritten. The question in the frame is also a verbatim line from there.

      FIFTH CARD ADDED by the 2026-10-29 edit (BREAKDOWN, K1-4): "missing the external-knowledge-base
      (RAG) option — add it so we can explicitly rule it out at this stage: the base is small." The card
      holds the same A6 neutrality as the first four — it names an action ("search an external store"),
      not a conclusion about it; the argument itself ("the base is small, no need to search") belongs
      in the breakdown (n08), not here.

      Checked against leaks (A6), card by card: none names a verdict, none names a cost, none lists what
      the solution it''s building is made of, and nowhere does it say how many answers are correct. The
      rig''s own numbers (0 of 3, 6 of 15, 4 of 15, 2 of 15) are absent from this screen entirely — they
      belong in beats n11a, n12, n13, and n16.

      Checked against the "fact frame" (case-design canon §5): each card is put in an imperative verb
      — "let the model decide", "compare by string", "put grounding in a field", "ask for confidence as
      a number", "search an external store." None of them turns into a statement about the tool''s properties
      ("the model grasps meaning but confuses similar things") — all five remain actions.

      Card order is a spectrum, not scattered: the first hands the decision entirely to the model, the
      second never calls the model at all, the third and fourth split the work between the model and code
      in two different ways. The fifth stands last as a separate axis (knowledge- base size), not a continuation
      of the same spectrum.'
