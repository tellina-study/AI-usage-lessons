      и до печатного слоя не доходила вовсе. Реплика сверена ДОСЛОВНО по API обсуждения на Hacker News
      в этом круге (комментарий `sc077y`, news.ycombinator.com/item?id=40739982, 21.06.2024, прямое чтение
      через hn.algolia.com — WebFetch по news.ycombinator.com отдаёт 403, см. `tools/seminar-production/README.md`
      §8.7). Оригинал: «I built a RAG agent during the past 3 months and a half for my internship. And
      literally everyone in my company was asking me why I wasn''t using llangchain or llamaindex like
      I was a lunatic. Everyone else that built a rag in my company used llangchain, one even went into
      prod. <…> it works well if you have a standard usage case but the second you need to something a
      little original you have to go through 5 layers of abstraction just to change a minute detail. Furthermore,
      you won''t really understand every step in the process, so if any issue arises or you need to be
      improve the process you will start back at square 1.» НАХОДКА КРУГА: в оригинале это работа СТАЖЁРА
      («for my internship») — деталь, которую прежние заметки опускали, называя автора просто разработчиком.
