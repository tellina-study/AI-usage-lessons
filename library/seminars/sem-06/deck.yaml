    backup: 'Источник — section-2-subagent-part1a2.md §A.2 «Свидетельства» + «Осторожность со счётом»
      + «Честный пробел», section-2-subagent-part1c.md n46, по содержанию дословно; числа не менялись
      (круг 3 владельца, issue 225 — материал переносится без изменения формулировок и источников). Атрибуция
      «Kim, Gu, Park и др.» — исправление fact-check round 2 (2026-10-05), сохранено как есть. Вторая
      прожарка (issue 225, студент-симулятор): слайд стоит на минуте ≈64–65, самой уязвимой точке занятия
      по вниманию, и нёс абстрактные проценты первым, привязку к нашим двум субагентам — третьей плашкой
