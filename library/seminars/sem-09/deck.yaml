      глазами.

      Четвёртая строка (порядок полей): собственный прогон этого же стенда (`stend/zamery-k5-k6/run_k5_order.py`)
      существует и дал знак обратный заявленному эффекту — назван качественно, без цифр, по тому же правилу:
      числа этого прогона на кадре нет, оно не из перемера, но и оно не причина распаковывать третий набор
