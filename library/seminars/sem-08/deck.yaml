      БАЗА/СЧЁТ (правка 2026-10-20, issue #274): цена ≈$0,034/картинку была дана голой, без привязки к
      реальному объёму рассылки этого кейса — структурный gap (CLAUDE.md § «Baseline / Counterfactual
      Mandate»: любое измеримое утверждение обязано иметь базу). Сцена кейса (n46) и соседние слайды (n45/n47/n48/n49/n50/n53/n54)
      НЕ называют явно, сколько карточек в день/месяц уходит в рассылке, — проверено прямым чтением всех
      файлов Кейса 4, частоты нет нигде. Единственный явно названный объём учебного центра во всей деке
      — Кейс 1 (n06, сцена): «двадцать заявок в день»; это общий поток заявок центра, а карточка в Кейсе
      4 заменяет собой то самое уведомление о каждой новой заявке (n46: «вместо сухого текста — карточка
      ... в том же уведомлении») — то есть при полном переходе на карточки объём карточек равен объёму
      заявок, тот же знаменатель, не выдуманный отдельно. Расчёт: ≈20 карточек/день × ≈30 дней ≈ 600 карточек/месяц
      × $0,034 ≈ $20,4/месяц. Это ИЛЛЮСТРАТИВНЫЙ ПРИМЕР РАСЧЁТА, НЕ ИЗМЕРЕННЫЙ ОБЪЁМ — ни частота рассылки,
      ни решение «переводить на карточку 100% уведомлений» в сцене явно не зафиксированы; если объём на
      практике меньше (не каждая заявка требует карточки) или больше (несколько рассылок в день), сумма
      пересчитывается по той же формуле. Добавлено третьей строкой в callout "Стоимость генерации" на
      фигуре `k4-shema-generatsii.png` (функция `generatsiya()`, `rendered/make_figures_k4.py`) — callout
      расширен с h=160 до h=185, канвас CH остался 560 (соотношение сторон не просело ниже `deck_kit.py:
      FIG_MIN_FILL`-безопасного порога ~2,84 — проверено: 2,857).'
- id: n52
  file: slides/n52-k4-szhatie-pered-proverkoy.md
  type: mechanism_node_graph
  duration_min: 2.5
  assertion: Механическая проверка идёт первой и отсекает брак дёшево, модель проверки содержимого — второй,
    и только на то, что уже прошло; сжимать картинку перед этим вторым шагом можно и обычно нужно — но
    умеренно, не ниже ~1024 px, если модель должна прочитать текст на карточке
  learning_goal: 'НОВЫЙ слайд, голосовая правка 2026-10-20 (issue #274), буквенный хвост между n51 и n53
    (канон README §1). Два явных требования владельца: (1) явная схема «механическая проверка → отправка
    в модель проверки содержимого», не прозой; (2) честный исследовательский ответ на вопрос «сжимать
    ли картинку перед проверкой», с точными цифрами из брифа, без выдумки. Таблица сжатия — новая 4-колоночная
    форма А5 (действие · как делает · преимущество · недостатки), владелец явно её запросил 2026-10-20
    для разборов действия/варианта.'
  visual:
    pattern: mechanism_node_graph
    figure: k4-shema-szhatie.png
    primary: 'Схема в две полосы. Верхняя — явная цепочка: файл получен → механическая проверка → ветка
      (не прошла → отклонить, дальше не идёт / прошла → модель проверки содержимого, не собрана на стенде).
      Нижняя — до/после размера картинки при умеренном сжатии перед отправкой в модель- проверяющую, с
      предупреждением про чтение текста на картинке.

      '
    backup: 'Порядок «механика → модель» — не произвольный: механическая проверка бесплатна по сути (условие
      над числом) и детерминирована, а любой вызов модели с распознаванием изображений стоит реальных
      денег за вызов (отдельная величина от стоимости ГЕНЕРАЦИИ на n51 — вход в модель-проверяющую тарифицируется
      по входным токенам изображения, не по той же шкале, что генерация на выходе, и эту конкретную цену
      здесь не оценивали, чтобы не смешивать две разные модели прайсинга без проверки); ставить дешёвый
      фильтр первым экономит вызовы модели на файлах, которые и так не пройдут по формату или размеру
      — та же логика экономии, что в гибридном решении Кейса 2 (хэш первым, jev на оставшееся), перенесённая
      на картинку. Ответ про сжатие — ДОСЛОВНО из брифа голосовой правки (`qa/BRIEF-GOLOSOVAYA-PRAVKA-2026-10-20.md`,
      строки 180-196, «Исследовательский вопрос по Кейсу 4 — ответ (WebSearch, не выдумка)»): 4032×3024
      без сжатия ≈1500 токенов, то же изображение 720×540 при JPEG Q85 ≈300 токенов — пятикратная экономия;
      оговорка про OCR-подобные задачи и предел ~1024 px по большей стороне — та же цитата, числа не менялись.
      Источник помечен на слайде как «общедоступные источники», не как измерение на этом стенде — модель-проверяющая
      сама на стенде не собрана (см. n49/n51), поэтому экономию токенов нельзя подтвердить собственным
      прогоном, только сослаться на неё честно.'
- id: n52a
  file: slides/n52a-k4-rezultat-preview.md
  type: result_preview
  duration_min: 0.75
  assertion: Координатор не видит узел, число байт или журнал прогона — он получает фото-карточку с подписью
    в том же чате уведомлений, где раньше приходил только текст
  learning_goal: 'НОВЫЙ слайд, letter-tail между n52 и n53 (канон README §1), голосовая правка 2026-10-20
    (issue #274), транскрипт 15:01: «кроме схем, обязательно должны быть дублирующие слайды со скринами
    и с тем, что получает пользователь на выходе видит» — повторное прямое подтверждение для Кейса 4.
    Тот же паттерн, что уже реализован для Кейса 1 (n12-k1-rezultat-preview.md) и Кейса 3 (n34b-k3-rezultat-preview.md,
    id поправлен тем же днём правкой Кейса 3: слот `n34a` занял новый слайд с панелями настройки узлов):
    позитивный мокап того, что видит реальный человек, вставлен перед обобщением кейса.'
  visual:
    pattern: result_preview
    primary: 'Мокап одного сообщения в чате Telegram — фото-карточка с короткой подписью, в том же чате
      уведомлений учебного центра, что и в Кейсе 1. Подпись под мокапом связывает его со сценой (n46):
      показан успешный случай, когда файл укладывается в измеренный лимит и карточка доходит целиком.

      '
    backup: 'Текст подписи — буквально тот же, что уже использован в мокапе Кейса 1 (n12-k1-rezultat-preview.md:
      «Новая заявка от Марии: тема «курс», также упомянуто: оплата.») — не придуман для этого слайда.
      Повторное использование обосновано самой архитектурой решения: n50 (speaker notes) прямо называет
      первый узел цепочки «тот же приём подстановки значений, что мы настраивали в кейсе «Уведомления»»
      — то есть текст подписи в Кейсе 4 собирается той же формулой, что текст сообщения в Кейсе 1, и расходится
      с ним только тем, что теперь он идёт подписью к фотографии, а не отдельным текстовым сообщением
      (та самая карточка, которую попросил маркетинг в сцене n46). На мокапе нет имени узла, числа байт,
      порога `sendPhoto` или workflow/execution id — только то, что реально видит координатор (канон §3
      proektirovanie-keysa-i-voprosa.md: служебные id — в документации производства, не на видимом экране).
      Показан УСПЕШНЫЙ случай (файл укладывается в лимит) как обратная сторона сцены (n46, где карточка
      пропала тихо) и измеренной границы (n50, где тот же файл, но крупнее, дал явную ошибку API) — тот
      же приём, что n34b: позитивный мокап перед обобщением кейса, не повтор сцены отказа. Фигуры/мокапа
      интерфейса на диске пока нет — слайд собран текстовым представлением чата (блок-цитата), как n12
      и n34b, готов для визуального воплощения дизайнером на фазе рендера.'
