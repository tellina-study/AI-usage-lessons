      и потому что на нём стоит разбор приоритетов на n23; «вернуть прежний режим» — это задокументированный
      обход из самого обращения anthropics/claude-code#92271 ({"env": {"CLAUDE_CODE_THRIFTY_SONIC": "0"}}),
      то есть законный ход, а не соломенный. Соломенных карточек нет ни одной: у каждой в разборе названы
      случаи, где она правильный ответ. СНЯТА подводка «Матчер вы бы уже поправили — он должен ловить
      оба пути правки»: решение было объявлено принятым от имени зала, который его не принимал (qa/roast3-redaktor-metodika.md
      §2), и зал не понимал, какие «оба пути» (qa/roast3-student.md §3.1). После перестройки фраза снимается
      сама — матчер стал предметом вопроса. Ни цифр, ни источников на слайде (AUTHOR-BRIEF.md §4). +0,25
      минуты на пять решений вместо пяти клеток, которые были короче.'
