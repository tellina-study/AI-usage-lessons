  visual:
    pattern: question_with_option_cards
    primary: Завязка тихой формой, затем строка о том, что одно из слов уже звучало, затем вопрос в золотой
      рамке. Под ним пять равных карточек. Ни цифр, ни источников, ни выделений.
    backup: 'Прежняя редакция спрашивала «что должно быть верно, чтобы вынос окупился» — это условие,
      а не действие, и владелец назвал это теорией вместо кейса. Теперь зал решает, что делает с конкретным
      файлом. Целевой ответ — порядок из двух действий; карточки «сократить до 600» и «дописать, какая
      копия главная» разбираются по существу, потому что обе реально делались в этом репозитории. КРУГ
      4, ОТСТУПЛЕНИЕ ОТ НАРЯДА: наряд требовал карточки не трогать, и основание было — развилку починили
      в круге 3 снятием предложения из подводки. Но переезд базы скилла ПЕРЕД дивайдером (наряд механики,
      часть Е п. 8) создал утечку заново: карточка «вынести в отдельный файл, который грузится по нужде»
      стала эхом определения с базы («скилл — процедура в отдельном файле; агент открывает её сам») и
      её же таблицы трёх уровней. Применено решение кейса 1 на n09, где тот же переезд базы хука дал тот
      же дефект: карточка сокращена до «вынести в скилл» (эхо снято, слово инструмента осталось), и на
      слайде появилась строка, признающая утечку вслух. Подводка и формулировка вопроса НЕ тронуты знак
      в знак — ровно то, что чинило развилку в круге 3; блоки только разделены по границе предложения,
      слов в них не изменено ни одного. Развилка остаётся «обоснуй», а не «угадай».'
- id: n38
  file: slides/n38-razbor-svesti-i-vynesti.md
  type: answer_breakdown
  duration_min: 2.0
  assertion: Все пять действий где-то правильные, у каждого названы случаи и ограничения; из сочетания
    следует порядок — сначала одна правда, потом её место, и вынос считается сделанным только после зачистки
  learning_goal: 'Разбор всех пяти карточек в единой форме: вариант · где он работает конкретными случаями
    · ограничения. Выбор выводится отдельной строкой из сочетания двух колонок, а не объявляется ярлыком.
    Первые две строки названы законными обе, и между ними назван порядок'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в три колонки: вариант · где он работает — конкретные случаи · ограничения.
      Порядок строк совпадает с порядком карточек на слайде вопроса. Ни одна строка не подсвечена: вывод
      стоит отдельной строкой под таблицей и кончается тем, что вынос без зачистки не считается.'
    backup: 'Форма А7 по эталону n10 (кейс 1). Продиктована владельцем дословно, qa/zamechaniya-golosom-keysy-1-4.txt
      13:52–14:52: «где он работает — надо кейсы написать… „почему не здесь“ тоже плохо, тут скорее должно
      быть ограничения. Как-то из этой комбинации должно явно следовать, почему выбираем». Что изменено
      против круга 3: (1) шестая строка-композит «свести копии, а потом вынести» СНЯТА из таблицы — она
      была целевым ответом, набранным жирным целиком, то есть автоматически подсвечивалась золотом (RENDERER-NOTES
      §2: строка, где жирные ВСЕ заполненные ячейки, подсвечивается как целевой ответ), и ярлык «целевой
      — и это порядок» стоял прямо в клетке; вывод вынесен отдельной строкой под таблицу по PLAN-part2.md
      §К5. Теперь строк ровно пять, по числу карточек n37, и в колонке «Вариант» нет ни одного жирного
      — подсветиться не может ни одна. (2) Колонка «Чего не чинит» → «Ограничения»: приговор варианту
      заменён его свойством. (3) Блок «три повода вынести» снят как отдельная форма и переселён в клетку
      «где работает» строки выноса — это и есть те конкретные случаи, которых требует А7. (4) ЦИФРЫ УБРАНЫ
      С ЭТОГО СЛАЙДА НАМЕРЕННО: 1650 сессий и 35,4% стояли здесь, пока свидетельства шли ПЕРЕД разбором
      и база у цифры была уже предъявлена. По правилу А1 свидетельства переехали ПОСЛЕ разбора, и повторять
      цифру на обоих слайдах значит печатать её дважды, а назвать её тут без базы — нарушить AUTHOR-BRIEF
      §4. Поэтому разбор утверждает механизм и говорит, что он измерен; n38 следом даёт величину с базой
      и читается как подтверждение. (5) Карточка выноса на n37 сокращена до «вынести в скилл», и строка
      таблицы названа так же. Факт про строку 216 проверен живьём: оговорка о приоритете дописана руками
      после того, как конфликт сработал на лекции.'
- id: n39
  file: slides/n39-svidetelstva-konflikt-i-dlina.md
  type: research_evidence
  duration_min: 1.5
  assertion: 'Каждый шаг принятого решения подтверждён замером: цена спора измерена, опровержение сокращения
    — контролируемый эксперимент, а выигрыш загрузки по нужде растёт к концу сессии'
  learning_goal: Свидетельства кейса на пятой позиции — после разбора. Слайд не подводит к выбору, а подтверждает
    уже сделанный и называет его цену. У каждой цифры своя база; обратная величина честно ограничена в
    применении
  visual:
    pattern: evidence_table_with_gap
    primary: 'Таблица четырёх замеров: что измерено, от какой базы, что это подтверждает. Ниже — оговорка
      пунктирной формой про обратную величину 64,6%.'
    backup: 'КРУГ 4, ПЕРЕЕЗД: слайд стоял между вопросом n37 и разбором n39 и переехал ПОСЛЕ разбора —
      правило А1 («ответ будем писать сразу… между вопросом и разбором не стоит ничего») плюс PLAN.md
      §1.2: увести его ДО вопроса нельзя, AUTHOR-BRIEF §4 запрещает цифры и источники на пути к вопросу.
      Владелец сохранил этот такт и возразил только против места: «откуда берётся час — тоже хорошие вычисления;
      как померить у себя — отличный слайд, тогда оставляем». Содержание и все четыре замера не тронуты.
      Переписана РАМКА: колонка «К какому действию ведёт» → «Что это подтверждает», её клетки переведены
      из повелительного наклонения («разводить», «не мерить длиной», «грузить по нужде», «выносить крупное»)
      в утверждения о уже принятом решении, и заголовок слайда назвал новую работу такта. Вводная строка
      «решение принято: свести копии, затем вынести» была написана и СНЯТА: приём `evidence_table_with_gap`
      рисует блок-цитату пунктиром, то есть формой оговорки, — на рендере она становилась в один вид с
      честным пробелом внизу и читалась как ещё одна оговорка. Рамку подтверждения несут заголовок, шапка
      третьей колонки и её первая клетка («который мы только что развели»), а прямое «мы только что решили»
      живёт в произносимой части заметки. Цифры 1650 и 35,4% сняты с разбора n39 именно затем, чтобы они
      жили здесь — вместе со своими базами и в одном экземпляре. Точные ссылки держим ЗДЕСЬ, а не на слайде:
      номера работ и даты из видимого слоя убраны по требованию владельца, в колонке источника осталось
      имя работы. 35,4% и 13 335 испытаний — abstract arXiv 2605.27784 (WIRE), сверено дословно в qa/fact-check-round1.md
      #22. 1650 сессий / 16 050 наблюдений и −5,6% шансов за функцию — arXiv 2605.10039, там же #21. Отказ
      от 64,6% как от оценки естественной частоты совпадает с собственным предупреждением авторов работы.
      Оборот «не на размер, а на глубину ссылок» в четвёртой строке оставлен как есть: вычистка «не X,
      а Y» — отдельная финальная фаза со своими счётчиками, и правка одной строки вне неё сбила бы её
      замер.'
- id: n40
  file: slides/n40-struktura-skilla-tselikom.md
