- id: n63
  file: slides-en/n63-tot-zhe-vopros-vtoroy-raz.md
  type: reflection_question
  duration_min: 1.5
  assertion: The same opening question, verbatim, a second time in the class; the room answers again,
    and it gets said out loud whose answer changed and what exactly changed it
  learning_goal: 'The closing of the loop opened on n04: the question is presented verbatim a second time,
    character for character, and it is answered by the room rather than by the lecturer. A full breakdown
    of what became checkable over the class is on the next slide'
  visual:
    pattern: reflection_question
    primary: 'A reminder of the first presentation — in the quiet form of a remark, and the same place
      says that the room answers out loud. The question itself — verbatim the same as on n04, in a gold
      frame, as one sentence. There are no option cards, as there were none at the first presentation.

      '
    backup: 'The source: `rework/block-3-os.md` §A.3. The wording is verbatim the same as on n04 of this
      seminar, under the idea of the owner''s round of edits (issue 225, §A2): the agent runs up against
      the boundaries of its own context, part of the work requires data from outside, part a separate
      worker with trimmed permissions. The room answers: first, whose answer changed, then two or three
      voices — what exactly changed it. The lecturer does not name his own answer and does not grade anyone
      else''s.

      Storytelling revision (issue 225, `PERESMOTR-STORITELLING.md`; the handover from the opening session
      — `qa/peresmotr-otkrytie.md` §3 and §7 item 1). The opening was rewritten: the seminar''s question
      is now asked on `n04` after the two misses and sounds different — "The work has run past the agent''s
      context — which do you set up first: bringing inside what is not inside, or carrying outside what
      does not fit inside?". This slide was carrying the former wording ("The agent sees only what is
      in the repository and in the conversation with you. Where does that context end — and what do you
      set up first: access to the outside or a separate worker with trimmed permissions?") — that is,
      the seminar''s loop was broken: a different question was standing on the screen the second time.
      Brought into line character for character.

      The second edit of the same round — the layout. `g_question` in `build_sem06.py` splits the block
      quote into the scene and the question at the FIRST sentence with a question mark. The former text
      held the question across two sentences, and what arrived on the finished PNG was a stub: "The agent
      sees only what…" went off into the quiet remark, and into the gold box went "Where does that context
      end…" with no beginning, and with an unpaired guillemet inside it as well (checked against the pre-edit
      snapshot). Now the question is one sentence, entirely inside one pair of quotes; the split runs
      exactly along the boundary "reminder | question", and the gold box holds the seminar''s full question.
      The addendum "What has changed in your answer — and what exactly changed it?" was taken off the
      screen and moved into the reminder above the question: two question marks in one gold box read as
      two different questions to the room.

      Literary editing (issue 225, qa/pravki-nahodok-svedeniya.md item 3). The gold box of this slide
      is `form_question`, the deck''s one and only form for a question to the room, and in it stands the
      same question in the same weight as on `n04` at the first presentation: removing the bold here would
      mean separating two presentations of one question and breaking the grammar "one job — one form".
      The form is untouched. A repetition of the headline was removed: the reminder began with the words
      "This question has already been asked at the start of the class" under the headline "This question
      has already been asked", and the first clause repeated it word for word. It became "At the start
      of the class you kept your answer to it to yourself" — the same sense, no echo. The split into the
      reminder and the question runs in the same place, at the first sentence with a question mark.'
- id: n64
  file: slides-en/n64-chem-zanyatie-konchaetsya.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: Of today's five cases, two carry a support — the server's status and the count of separate
    copies of the repository; the other three rest on documented research that cannot be reproduced by
    one command in class. What the room carries away is the question with which you choose between the
    two moves
  learning_goal: 'How the class ends: it is named what you can ask a checkable question about and get
    an answer by command, and after that a question to put to your own project, with which you choose
    between access to the outside and a separate worker. The asymmetry between the two supports and the
    three places where there is none is spoken out loud, once for the whole class'
  visual:
    pattern: answer_breakdown_table
    primary: 'A table of five rows: case, support ("yes" / blank), checked by what. The rows are in the
      order of the sections and cases of this class. No row is highlighted — there is no target answer
      here. Under the table — a quiet remark about the gap in checkability and the slide''s last caption:
      the question with which the room chooses its move at home.

      '
    backup: 'The source: `rework/block-3-os.md` §A.4. The supports for checkability are the course repository
      (self-incrimination, subagents without trimmed permissions) and the student''s machine (`claude
      mcp list`, `/mcp`, `/skill-doctor`, `/context`). The final grid is the one place in the class where
      the count is named in full: a support is carried by the connection check in case 1 of MCP and by
      the workers in one folder in the last case of the subagent section — exactly the two that `research/setka-keysov.md`
      §3 predicted before the sections were written. Revisions after the classes were held (issue 225,
      qa/RAZBOR-PROVEDENIYA.md §A2): the case "connected, and the agent does not go through it" was folded
      down to the n17 screen inside the connection case, which is why there are five rows in the grid,
      not six, and the checkable part moved into the row of the first case. Three cells with no support
      are not an oversight: most of the material here is documented research (CVE, arXiv, GitHub issues),
      which cannot be reproduced by one command in a classroom.

      The owner''s round of edits (issue 225, §A2): the closing paragraph referred to "the difference
      between a report and a fact" — the wording of an arc the round removed entirely. Replaced by a wording
      that fits the class''s new load-bearing thought: the agent runs up against the boundaries of its
      own context, extends it with data from outside or with a separate worker, and each extension has
      its own cost; an undeclared gap in what of this is checkable right now would cost more than a declared
      one. The line "four out of five, the fifth — the process — is ahead" was removed (§A1): the class''s
      axis is four rows, all four closed by the class''s axis.

      Storytelling revision (issue 225, `PERESMOTR-STORITELLING.md`, cause 4 "the close takes inventory
      instead of resolving"; rule P5 "the room applies the material to itself"). The slide used to end
      the class with a summing-up of the protocol: what became checkable, where there is no support. That
      is honest and stays on the screen unchanged — the table of five rows, both columns and the declaration
      of the gap are the same. What has been added is the thing the class was going for: the last caption
      is now the question with which the room chooses its move at home ("what is it short of — what is
      not inside at all, or the room taken up by reading?"), and straight after it, where each of the
      two cases goes. The former last caption ("The axis of this class is closed — all four rows can now
      be checked at least in part") was removed from here: the statement about the closed axis moved to
      `n61`, where the axis table itself stands next to it, and there is no point repeating it a second
      time at the end. The quiet remark about the gap in checkability was compressed by a third, so that
      the room for the question came out of this same slide rather than out of its slot. This is a question,
      not an assignment: the rule "a class ends on what became checkable, not on homework" (`AUTHOR-BRIEF.md`
      item 11) holds — nobody is asked to answer out loud or to send an answer in, and the notes say so
      directly.'
