- id: n05
  file: slides/n05-stsena-otvet-uzhe-napisan.md
  type: scene_question
  duration_min: 2.25
  assertion: 'Письмо про разбитую упаковку пришло утром, через секунду в очереди лежал готовый ответ —
    вежливый, грамотный, уверенный; вопрос один: отправляем'
  learning_goal: 'Поворот кейса заряжается здесь: зал голосует за отправку готового текста, потому что
