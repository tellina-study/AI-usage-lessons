- id: n22
  file: slides/n22-razbor-chetyre-sposoba-poluchit-odno-znachenie.md
  type: answer_breakdown
  duration_min: 3.0
  assertion: 'Первые три варианта спорят не о том, что разводит задачу на самом деле — все три отвечают
    на «как заранее угадать категорию точнее», хотя вопрос другой: зачем просить модель сочинить текст,
    если нужно одно значение из четырёх'
  learning_goal: 'Разбор четырёх карточек n21 в форме А5 (две содержательные колонки: что делает / что
    не делает-ограничение). Поворот кейса — несоответствие формы ответа форме задачи. Decision-модель
