- id: n26
  file: slides/n26-artefakt-opisaniya-po-trebovaniyu-i-nabor-pod-zadachu.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Четыре строки решения: у сервера в проектном файле нет флага принудительной загрузки описаний,
    отложенная загрузка в окружении не выключена, серверу передаются только нужные наборы инструментов,
    а свой набор серверов он держит в личной области'
