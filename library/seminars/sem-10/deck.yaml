- id: n43
  file: slides/n43-k3-rrf-mekhanika.md
  type: content
  duration_min: 0.5
  assertion: RRF складывает очки документа из обоих списков — наверх выходит самый ровный кандидат, а
    быть просто первым где-то один раз для этого недостаточно
  learning_goal: 'Явная просьба владельца (issue #311): «добавь в кейс пояснение что такое rrf» — не только
    имя формулы (это уже называет n42), а словесный механизм и числовой пример на нескольких документах,
    профессионального уровня, без формулы-литерала на кадре (пол кегля 15pt и запрет научной записи, §5.14
    trebovaniya-k-soderzhaniyu-forma.md). Letter-suffix до сведения деки (tools/seminar-production/README.md
    §1, issue #311), вставлен между n42 (действия, формула названа по имени) и n44 (четвёртое действие,
    реранкер) — RRF принадлежит третьему действию (гибрид), не четвёртому.'
  visual:
    pattern: content
    primary: 'Плашка-принцип словами + таблица на трёх иллюстративных кандидатах: место по словам · место
      по смыслу · итог после RRF. Числа — учебная иллюстрация механики, не измеренный результат стенда
      (измеренные числа — на n51/n58 дальше в этом же кейсе).

      '
    backup: 'k=60 — настоящая константа узла слияния стенда (`stend/measure/ case3_measure.py`, тот же
      узел, что настоящая панель n8n дальше в этом кейсе рисует буквальным кодом). Места трёх кандидатов
      — придуманный учебный пример, не вопрос из корпуса: подобраны так, чтобы НИКТО из трёх не был первым
      ни в одном из двух списков (первое место в обоих списках у кандидата за кадром) — ровно случай,
      где видно, что RRF награждает ровность, а не первенство в одном сигнале. Арифметика: очко документа
      в списке = 1/(k+место), k=60; очки из списков складываются; победитель — наибольшая сумма. А: 1/62+1/64=0,0318;
      Б: 1/63+1/62=0,0320; В: 1/64+1/63=0,0315 — Б выигрывает с минимальным отрывом, не разгромно, что
      и показывает механику честно (не подогнанный "удобный" пример с большим зазором).'
