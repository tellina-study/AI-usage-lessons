      '
    backup: 'Новый слайд по прямому требованию голосовой правки владельца (`qa/BRIEF-GOLOSOVAYA-PRAVKA-2026-10-20.md`,
      раздел «Кейс 4», абзац «Добавить схему генерации картинки»). Честно: этот шаг НЕ собран на стенде
