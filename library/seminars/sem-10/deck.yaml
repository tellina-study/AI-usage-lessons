      прежнем прогоне; у мягкого прежний прогон сохранял JPEG с качеством 60, опора здесь — 80, и совпали
      здесь результаты; входы разные.

      Два вопроса на предсказание, которые глава ставит на этот кадр, с видимого слоя сняты и живут в
      заметках: кадр структуры обязан обходиться без чисел результата, а оба вопроса опираются на опорные
