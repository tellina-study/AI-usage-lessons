deck:
  lecture_number: 3
  title: "Лекция 3. Архитектуры AI-систем: агенты, RAG, API"
  audience: "3 курс ИУ6, инженеры-разработчики (универсально, без локального binding в контенте)"
  duration_min: 75
  central_question: "У меня есть задача и доступ к LLM. Какую архитектуру выбрать — и когда правильный ответ «не ИИ»?"
  learning_outcomes: [LO7, LO4]
  language: ru
  status: draft
  version: v1
  source: chapter v1.1 finalized (~22450 слов, 3 части)
  plan: notes/lecture-3-review/final/plan-v2-final.md (v2-final)
  total_slides: 30
  curriculum_level: introductory

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # 25 canonical terms — from glossary.yaml (locked 2026-05-16, chapter v1.1).
  # designer/critic enforce no drift; alias только 1× при первом упоминании.
  - архитектура AI-системы
  - промпт
  - few-shot (примеры в промпте)
  - Chain-of-thought (пошаговое рассуждение)
  - faithfulness (верность рассуждения)
  - RAG (Retrieval-Augmented Generation)
  - retrieval (поиск релевантного)
  - grounding (опора на источник)
  - observability (наблюдаемость)
  - golden set (эталонный проверочный набор)
  - fine-tuning (дообучение)
  - PEFT (LoRA/QLoRA)
  - distillation (дистилляция)
  - контекст-инжиниринг
  - context rot (деградация на длинном контексте)
  - tool use / function calling
  - MCP (Model Context Protocol)
  - агент (plan → act → check → iterate)
  - workflow (предопределённые пути)
  - prompt injection (инъекция в промпт)
  - least-privilege (принцип наименьших привилегий)
  - ZDR (Zero Data Retention)
  - BAA (Business Associate Agreement)
  - catastrophic forgetting (катастрофическое забывание)
  - distillation (дистилляция)

slides:
  # ─── Раздел 0. Открытие + recap + ЦВ (8 мин, s01-s04) ───
  - id: s01
    file: slides/s01-air-canada-hook.md
    type: case_study
    section: "Раздел 0. Открытие"
    duration_min: 3
    assertion: "Air Canada заплатила за выдумку чат-бота — потому что выбрала генеративную архитектуру для задачи, требовавшей детерминированного lookup"
    learning_goal: "Hook: неправильный выбор архитектуры = реальное последствие; рамкирование тезиса лекции"
    learning_outcomes: [LO7]
    chapter_ref: "§Введение [for-slide-s01]"
    references: [mccarthy-tetrault-2024, aba-2024]
    visual:
      pattern: case_study_contrast
      primary: "Слева — assertion + краткая хроника дела (вопрос → выдуманный ответ → трибунал 14.02.2024 → компания платит) в Ocean rounded box. Справа — контраст-блок «что выбрали (генеративный чат) vs что было нужно (детерминированный lookup политики)». Gold highlight — дата решения трибунала / факт «компания отвечает за выдумку бота»."
      backup: none
    interaction: open_question

  - id: s02
    file: slides/s02-cover-roadmap.md
    type: cover
    section: "Раздел 0. Открытие"
    duration_min: 0.5
    assertion: "Лекция 3. Архитектуры AI-систем: агенты, RAG, API"
    learning_goal: "Cover + roadmap 5 разделов; gold-маркер «Раздел 0»"
    learning_outcomes: [LO7, LO4]
    chapter_ref: "§Введение [for-slide-s02]"
    references: []
    visual:
      pattern: cover_distinct
      primary: "Hero-cover: крупная outline «03» (200pt, Primary mid контур). Справа — title 36pt bold deep, под ним 16pt italic light: курс · 75 мин · дата. Внизу — roadmap-bar из 6 карточек (0 Открытие / 1 Промпт / 2 RAG / 3 Fine-tune / 4 API·агенты / 5 Фреймворк), текущая (0) подсвечена gold. БЕЗ Ocean rounded box callout (motif принадлежит content)."
    interaction: none

  - id: s03
    file: slides/s03-recap-lec2-bridge.md
    type: assertion_visual
    section: "Раздел 0. Открытие"
    duration_min: 1.5
    assertion: "Вокруг одного вызова модели надстраиваются 4 обвязки — и одна из них (RAG) стоит прямо на эмбеддингах Лекции 2"
    learning_goal: "Recap Лекции 2 (single-shot + эмбеддинги) + мост к RAG"
    learning_outcomes: [LO7]
    chapter_ref: "§Введение [for-slide-s03]"
    references: []
    visual:
      pattern: hub_and_spokes
      primary: "В центре — блок «один вызов LLM (single-shot, Лекция 2 §4)» в Ocean rounded box. Вокруг — 4 обвязки: RAG (помечено «= semantic search Лекции 2 §2 + LLM»), function calling, MCP, цикл агента. Стрелка от «эмбеддинги Л2 §2» к RAG-узлу подсвечена gold. Sub-caption: детали — Раздел 2."
    interaction: none

  - id: s04
    file: slides/s04-central-question-ladder.md
    type: assertion_visual
    section: "Раздел 0. Открытие"
    duration_min: 3
    assertion: "Ответ на «какую архитектуру?» — это лестница из 6 ступеней и правило подниматься только под требование задачи"
    learning_goal: "Центральный вопрос крупно + лестница (карта лекции) с disclaimer"
    learning_outcomes: [LO7, LO4]
    chapter_ref: "§Введение [for-slide-s04]"
    references: [anthropic-2024-building-effective-agents]
    visual:
      pattern: ladder_6_steps
      primary: "Центральный вопрос крупно (28pt bold deep) сверху. Под ним — лестница 6 ступеней снизу вверх: обычный код → один вызов → RAG/контекст → workflow → агент → multi-agent. Каждая ступень — Ocean rounded box. Нижняя ступень «обычный код (без ИИ)» с gold-акцентом (точка отсчёта). Disclaimer 12pt italic: «лестница — карта лекции, не требование понять всё сейчас; каждую ступень разберём отдельно»."
    interaction: none

  # ─── Раздел 1. Промпт и его границы (9 мин, s05-s08) ───
  - id: s05
    file: slides/s05-default-one-call.md
    type: assertion_visual
    section: "Раздел 1. Промпт и его границы"
    duration_min: 2
    assertion: "Дефолт — один вызов с хорошим промптом; любой подъём по лестнице оплачивается требованием задачи"
    learning_goal: "Точка отсчёта лестницы + распределение бремени доказательства"
    learning_outcomes: [LO7]
    chapter_ref: "§1.1 [for-slide-s05]"
    references: [anthropic-2024-building-effective-agents]
    visual:
      pattern: anchor_plus_cost_list
      primary: "Слева — крупный блок «1 вызов = минимум стоимости + латентности + максимум предсказуемости» в Ocean rounded box. Справа — список «что добавляет каждый подъём»: RAG → конвейер индексации/хранилище/деградация retrieval; агент → внешние вызовы/петли/недетерминизм/поверхность атаки. Gold — фраза-правило «усложнение оплачивается требованием задачи»."
    interaction: none

  - id: s06
    file: slides/s06-chain-of-thought.md
    type: case_study
    section: "Раздел 1. Промпт и его границы"
    duration_min: 2.5
    assertion: "Chain-of-thought повышает надёжность одного вызова на цепочечных задачах — но это инструмент под класс задач, не глобальный тумблер"
    learning_goal: "CoT как паттерн лекции + worked example без/с CoT + граница применимости"
    learning_outcomes: [LO7]
    chapter_ref: "§1.2 [for-slide-s06]"
    references: [wei-2022-cot]
    visual:
      pattern: before_after_contrast
      primary: "2 колонки в Ocean rounded boxes: «без CoT» (правдоподобный, но неверный ответ на задаче про яблоки) vs «с CoT» (шаги 23−7=16; 2×6=12; 16+12=28 → верно). Внизу — узкая плашка «когда CoT НЕ нужен: извлечение факта / простая классификация — удлиняет, может навредить». Gold — итог «28» в правильной колонке."
    interaction: think_pause

  - id: s07
    file: slides/s07-cot-faithfulness-limit.md
    type: case_study
    section: "Раздел 1. Промпт и его границы"
    duration_min: 2
    assertion: "Проговорённое рассуждение модели не обязано отражать реальную причину ответа — поэтому человек проверяет результат, а не самообъяснение"
    learning_goal: "Предел CoT: unfaithfulness как свойство класса + сквозная линия «человек-валидатор»"
    learning_outcomes: [LO7]
    chapter_ref: "§1.3 [for-slide-s07]"
    references: [anthropic-2025-reasoning-faithfulness]
    visual:
      pattern: stat_pair_plus_rule
      primary: "2 крупные метрики в Ocean rounded boxes: Claude 3.7 ~25% / DeepSeek R1 ~39% — доля случаев, где модель упомянула реально использованную подсказку. Самая низкая метрика (25%) — gold-акцент как «якорь тревоги». Под ними — правило-плашка: «контроль на self-rationale — не контроль; проверяй результат против внешнего источника». Footer 12pt italic — источник + caveat «freshness quarterly»."
    interaction: none

  - id: s08
    file: slides/s08-context-engineering.md
    type: assertion_visual
    section: "Раздел 1. Промпт и его границы"
    duration_min: 2.5
    assertion: "Минимальный высокосигнальный контекст — инженерное требование: точность падает с длиной (context rot = «lost in the middle» Лекции 2)"
    learning_goal: "Контекст-инжиниринг + context rot (явная сшивка) + критерий «когда НЕ RAG»"
    learning_outcomes: [LO7]
    chapter_ref: "§1.4 [for-slide-s08]"
    references: [anthropic-2025-context-engineering, chroma-2025-context-rot]
    visual:
      pattern: curve_plus_criterion
      primary: "Слева — нисходящая кривая «точность извлечения ↓ по мере роста токенов в контексте» (Ocean rounded box), подпись «context rot = lost in the middle Лекции 2 §3, новый термин». Справа — критерий-плашка «когда НЕ RAG: малый стабильный корпус → full-context + кэширование». Gold — точка/зона провала на кривой."
    interaction: none

  # ─── Раздел 2. RAG (12 мин, s09-s13) ───
  - id: s09
    file: slides/s09-section2-divider-rag.md
    type: section_divider
    section: "Раздел 2. RAG"
    duration_min: 1
    assertion: "Раздел 2 — RAG: поиск-дополненная генерация поверх эмбеддингов Лекции 2"
    learning_goal: "Section divider раздела 2 + одно-фразовое «что такое RAG»"
    learning_outcomes: [LO7]
    chapter_ref: "§2.1 [for-slide-s09]"
    references: []
    visual:
      pattern: section_divider_with_roadmap
      primary: "Большое «Раздел 2» по центру (mega 120pt gold-outline). Под ним — «RAG: поиск-дополненная генерация». Frame-фраза 20pt: «извлечь релевантное → положить в контекст → ответить с опорой на источник». Внизу — roadmap-bar (6 карточек) с gold-маркером на «2 RAG»."
    interaction: none

  - id: s10
    file: slides/s10-rag-principle.md
    type: process
    section: "Раздел 2. RAG"
    duration_min: 3
    assertion: "RAG = индексация → retrieval (semantic search Лекции 2) → генерация с опорой; «не знаю» — корректный ответ, выдумка — дефект"
    learning_goal: "Принцип RAG в 3 шага + инвариант grounding"
    learning_outcomes: [LO7]
    chapter_ref: "§2.1 [for-slide-s10]"
    references: [lewis-2020-rag]
    visual:
      pattern: pipeline_3_stages
      subtype: schema_pipeline
      primary: "Горизонтальный 3-stage pipeline (MSO_SHAPE.RIGHT_ARROW): (1) Индексация — корпус → чанки → эмбеддинги в хранилище; (2) Retrieval — вопрос → эмбеддинг → top-k фрагментов (помечено «= semantic search Л2 §2, не переобъясняем»); (3) Генерация с опорой — ответ + цитата источника. Под pipeline — gold-плашка инвариант: «ответ с цитатой ≠ правдоподобный текст; „не знаю“ — корректно»."
    interaction: none

  - id: s11
    file: slides/s11-when-rag-right.md
    type: assertion_visual
    section: "Раздел 2. RAG"
    duration_min: 2.5
    assertion: "RAG оправдан, когда 4 признака складываются ОДНОВРЕМЕННО: знание большое И меняется И нужен провенанс И приватное"
    learning_goal: "Когда RAG — правильный выбор (признаки в конъюнкции, не дизъюнкции)"
    learning_outcomes: [LO7]
    chapter_ref: "§2.2 [for-slide-s11]"
    references: [u-niah-2025]
    visual:
      pattern: four_conjunction_cards
      primary: "4 равные карточки-признака в Ocean rounded box: «большое/растущее», «меняется», «нужны свежесть+провенанс», «приватная база» — соединены явным знаком «И» (конъюнкция) к центральному «→ RAG». Под ними — worked example (корп. база регламентов: все 4 признака ✓). Gold — слово «ОДНОВРЕМЕННО» / знак И как смысловой якорь."
    interaction: none

  - id: s12
    file: slides/s12-when-not-rag.md
    type: comparison
    section: "Раздел 2. RAG"
    duration_min: 2.5
    assertion: "Знать, когда RAG НЕ нужен, ценнее: малый корпус → full-context; фиксированная политика → lookup; нет observability → скрытая бомба"
    learning_goal: "3 критерия «когда НЕ RAG» (вклад в LO7)"
    learning_outcomes: [LO7]
    chapter_ref: "§2.3 [for-slide-s12]"
    references: [anthropic-2025-context-engineering]
    visual:
      pattern: three_criteria_columns
      subtype: schema_matrix
      primary: "3 равные колонки в Ocean rounded box, каждая — критерий «не RAG» + правильная альтернатива: (1) корпус <~200k ток. → full-context + кэш; (2) фиксированная политика/значение → детерминированный lookup; (3) нет процесса наблюдения за retrieval → скрытая бомба (отложенный невидимый отказ). Gold — формулировка «скрытая бомба» как самый недооценённый случай."
    interaction: none

  - id: s13
    file: slides/s13-rag-fails-air-canada.md
    type: case_study
    section: "Раздел 2. RAG"
    duration_min: 3
    assertion: "«Вернул что-то ≠ вернул правильное»: RAG без observability тихо деградирует на масштабе; Air Canada — отказ grounding в чистом виде"
    learning_goal: "Провал RAG на масштабе (3 кейса) + Air Canada revisited как grounding"
    learning_outcomes: [LO7]
    chapter_ref: "§2.4, §2.5 [for-slide-s13]"
    references: [barnett-2024-rag-failures, mccarthy-tetrault-2024]
    visual:
      pattern: failure_cases_plus_callback
      primary: "Слева — 3 компактных кейса деградации в Ocean rounded box: legal-AI (нерелевантные прецеденты), medical-RAG (смешал пациентов), support-бот (тихо просел после ~10k док.). Справа — Air Canada revisited: диагноз «сгенерированный текст в роли извлечённого факта» + правильная альтернатива (lookup / strict grounding + цитата + «не знаю»). Gold — фраза-урок «вернул что-то ≠ вернул правильное». Footer 12pt italic — источники + framing «illustrative»."
    interaction: poll

  # ─── Раздел 3. Fine-tune vs промпт vs RAG (9 мин, s14-s17) ───
  - id: s14
    file: slides/s14-fine-tuning-narrowed.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2.5
    assertion: "Fine-tuning не «умер» — он сузился: в 2026 это поведение/стиль/формат/политика/дистилляция, НЕ знания"
    learning_goal: "Калибровка области fine-tuning + inline-define дообучения"
    learning_outcomes: [LO7]
    chapter_ref: "§3.1 [for-slide-s14]"
    references: [bigdata-boutique-2026]
    visual:
      pattern: scope_split
      primary: "Inline-define сверху 16pt italic: «дообучение = доп. обучение готовой модели на своих данных, меняются веса (в Л1 — тип использования, здесь — архитектурный выбор)». Ниже — 2 зоны в Ocean rounded box: «ушло из FT → RAG/длинный контекст: знание, факты, что меняется» vs «осталось за FT: поведение / стиль / формат / политика / дистилляция». Gold — слово «сузился» / граница знание↔поведение."
    interaction: none

  - id: s15
    file: slides/s15-peft-not-full-ft.md
    type: assertion_visual
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2
    assertion: "PEFT (LoRA/QLoRA) почти всегда лучше full fine-tuning: дешевле, модульнее и заметно снижает риск catastrophic forgetting"
    learning_goal: "PEFT вместо full-FT — 3 причины, третья архитектурная (надёжность)"
    learning_outcomes: [LO7]
    chapter_ref: "§3.2 [for-slide-s15]"
    references: []
    visual:
      pattern: frozen_base_plus_adapters
      primary: "Слева — схема в Ocean rounded box: большой замороженный блок «базовые веса (frozen)» + маленькие подключаемые «адаптеры LoRA». Справа — 3 причины: дешевле/быстрее; модульность (1 база — много адаптеров); ↓ риск forgetting (база не переписывается). DPO/RFT — 1 строка «спектр методов — в главе». Gold — «адаптеры мегабайты vs гигабайты» или причина №3 (архитектурная)."
    interaction: none

  - id: s16
    file: slides/s16-catastrophic-forgetting.md
    type: case_study
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2.5
    assertion: "Узкий агрессивный fine-tuning ломает общие способности; без eval-петли и версий датасета — это не риск, а критерий «не делай»"
    learning_goal: "Провал catastrophic forgetting + дисциплина превращает риск в критерий"
    learning_outcomes: [LO7]
    chapter_ref: "§3.3 [for-slide-s16]"
    references: [luo-2023-catastrophic-forgetting]
    visual:
      pattern: two_metrics_diverge
      primary: "Слева — 2 расходящиеся линии в Ocean rounded box: целевая метрика ↑ (модель отлично классифицирует), общие способности ↓ (рассуждение проседает незаметно). Подпись: «тяжелее с ростом масштаба модели». Справа — критерий-плашка: «нет eval-петли + версий датасета → нет сигнала о поломке и кнопки отката → НЕ делай FT». Gold — расходящаяся точка / слово «незаметно». Footer 12pt italic — источник + framing «исследования показывают»."
    interaction: none

  - id: s17
    file: slides/s17-criteria-what-where.md
    type: comparison
    section: "Раздел 3. Fine-tune vs промпт vs RAG"
    duration_min: 2
    assertion: "Знание меняется → RAG (не FT); поведение/тон/формат → fine-tuning (PEFT); детерминированное → код. Гибрид — норма 2026"
    learning_goal: "Критерии «что куда» (LO7) + почему гибрид — норма"
    learning_outcomes: [LO7]
    chapter_ref: "§3.4 [for-slide-s17]"
    references: [bigdata-boutique-2026]
    visual:
      pattern: criteria_table
