# Прозаическая часть карты слайдов и имена кейсов — то, что из слайдов не
# выводится. Всё остальное в `SVODKA-SLAIDOV.md` считает `make_svodka.py`:
# состав, номера, типы, заголовки, минуты и итоги. Руками карту не правят
# (канон §8.5) — правят этот файл либо сам слайд.

title: "Карта слайдов — Семинар 10"

# Имя кейса — короткое, для карты. Дивайдер называет проблему словами сцены,
# и в заголовок карты он не годится. Четыре кейса внутри дорожки; разбавитель
# (Google AI Overviews / NYC MyCity) — вне дорожки (ARCHITECTURE.md §4).
keysy:
  1: хранение базы знаний — промт-стаффинг против поиска при росте с 10 до 500 документов
  2: разбиение документа на части — резка по символам против резки по предложениям
  3: чем искать нужный кусок — слова против смысла против гибрида, и реранкер как следующий шаг
  4: поиск по изображениям — подпись против прямого сравнения картинок (честный провал), против perceptual hash

bloki:
  Введение: "Шов с Семинаром 9: дословный вопрос, которым закончилось прошлое занятие"
  Кейсы: "Четыре разбора, все на измеренном — четыре замера на живом стенде"
  Разбавитель: "Релевантно ≠ верно — Google AI Overviews и чат-бот NYC MyCity"
  Закрытие: "Ось заполнена, счёт занятия, мостик к С11"

nachalo: {}

vstupleniye: |
  Таблица собрана из файлов слайдов, а не из плана: номер, блок, тип, заголовок экрана и минуты
  взяты из фронтматтера и первой строки каждого файла. Границы блоков и кейсов — из
  `rendered/deck-config.yaml` этого занятия (`razmetka`, `case_idx`).

  Нумерация сквозная, без буквенных хвостов. Четвёртое занятие дуги (`sem-07/KONTSEPTSIYA-7-12.md`
  §6): четвёртая ступень лестницы доверия к модели — «знание вне промта». С9 решил, может ли
  процесс отвечать человеку сам; С10 меняет ставку дальше — база знаний, на которую процесс
  опирается, больше не помещается в один вызов модели. Вопрос занятия («откуда процесс берёт
  факты и почему считает их верными?») задаётся на n03 и получает ответ дословно второй раз на n81.

  Формат ведения — тот же, что у С7-С9: на занятии ведущий ничего не редактирует в узлах n8n
  вживую, только прогоняет уже готовые процессы. Слой 2 всех четырёх кейсов — настоящий скрин
  живого холста стенда и настоящие снимки развёрнутых панелей узлов, снятые Playwright через
  обход `~/.cache/page-shot-libs/x` (ограничение [#233-8] снято 2026-10-20, подтверждено на
  этом занятии третий семинар подряд). Схемами нарисована только постановка задачи — сплошным
  то, что уже собрано, пунктиром то, что в этом кейсе предстоит сделать (канон С1,
  `tools/seminar-production/forma-keysa-s-zamerom.md`).

  Четыре кейса стоят на четырёх самостоятельных замерах живого стенда: SberQuAD (открытый датасет
  вопросов-ответов по статьям Википедии с эталонной разметкой) для Кейсов 1-3, CORD (открытый
  датасет реальных чеков) для Кейса 4. Корпус Кейсов 1 и 3 пересобран 2026-11-01 по замечанию
  владельца «текущий замер слишком лёгкий» (200→500 документов, путающие кластеры, классификация
  вопросов кодом) — ось обоих кейсов развернулась или ужесточилась по факту этого доп. прохода, не
  по ожиданию исходного плана. Кейс 4 несёт честно показанный провал: испробованный по плану
  мультимодальный эмбеддинг на этом стенде не работает на реальном разрешении скана — отвечает без
  ошибки, но возвращает одинаковый вектор для разных изображений. Это не доработано суррогатом и не
  спрятано — разобрано как часть истории кейса, с полным протоколом в `stend/raw/`.

  Четыре строки оси занятия открываются пустыми на n03 и закрываются по ходу занятия — по одной на
  кейс, предметной парой «выглядит надёжным / чем оказывается», не абстрактной радостью.
