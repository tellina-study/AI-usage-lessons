  visual:
    pattern: scene_cards_and_question
    primary: 'Две колонки равной ширины: слева письмо клиента, справа готовый ответ целиком, крупным кеглем
      — зал обязан прочесть его за десять секунд и не найти к чему придраться. Под ними золотой коробкой
      вопрос и три карточки-варианта. Под вопросом — серая пунктирная рамка оговорки о статусе кейса,
      мелким курсивом: видно, но не спорит с вопросом за внимание.

      '
    backup: 'ПРОВИЗОРНАЯ НУМЕРАЦИЯ круга: файл заменяет прежнюю сцену кейса A (слайд 05 деки прошлого
      круга). Источник: `rework/section-1-chaining.md` §A.1.2 и §A.1.7, §A.00 (статус кейса), `-part1b.md`
      §B.3. Письмо про повреждённую упаковку и ответ по метке «другое» взяты из разбора провала раздела;
      здесь они предъявлены ДО механики, чтобы зал проголосовал прежде, чем узнает устройство. Как устроен
      автоответ внутри — на n06, граф целиком — на n08. ПРАВКА круга (находка ведущего): оговорка о статусе
      кейса перенесена сюда с дивайдера `n04`, где она жила четвёртым абзацем заметки на полуминутном
