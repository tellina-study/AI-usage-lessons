# Прозаическая часть карты слайдов и имена кейсов — то, что из слайдов не
# выводится. Всё остальное в `SVODKA-SLAIDOV.md` считает `make_svodka.py`:
# состав, номера, типы, заголовки, минуты и итоги. Руками карту не правят
# (канон §8.5) — правят этот файл либо сам слайд.

title: "Карта слайдов — Семинар 7"

# Имя кейса — короткое, для карты. Дивайдер называет проблему словами сцены,
# и в заголовок карты он не годится. Нумерация кейсов сквозная по занятию:
# 1-3 — ступень 1 (цепочка), 4-6 — ступень 2 (маршрут).
keysy:
  1: один вызов не отвечает за всех — нужна цепочка с проверкой
  2: автоматическая оценка дома без гейта перед обязывающей покупкой
  3: фреймворк поверх простой задачи — лишние слои абстракции
  4: классификация на развилке — нужен ли полный вызов модели или метки
  5: прошлые расходы вместо реальной потребности в помощи
  6: дешевизна проверки вместо вероятности нарушения

# Полные имена блоков для заголовков карты. Сборщик деки знает их короткими
# («Ступень 1», «Ступень 2»), дорожке больше и не нужно.
bloki:
  Ступень 1: "Ступень 1 — один вызов или цепочка"
  Ступень 2: "Ступень 2 — маршрут и decision-модель"

# Состав «начала ступени» — на этой деке ПУСТОЙ: оба блока начинаются сразу
# с дивайдера первого кейса (n04 и n19 — первые слайды своих блоков), без
# отдельного вступления перед ним. Запись держится про запас (перенесена из
# Семинара 6 без изменений алгоритма) — понадобится, если между границей
# блока и первым дивайдером появится экран.
nachalo: {}

vstupleniye: |
  Таблица собрана из файлов слайдов, а не из плана: номер, блок, тип, заголовок экрана и минуты
  взяты из фронтматтера и первой строки каждого файла. Границы блоков — из статической таблицы
  сборщика деки (`build_sem07.SECTIONS`, см. её же комментарий — деку не дописывают параллельные
  сессии, поэтому вывод по якорям здесь не заведён). Границы кейсов выведены по дивайдерам кейса
  — на этой деке под одну и ту же работу заведено ДВА разных имени приёма (`case_divider_quote`
  у ступени 1, `section_divider_macro` у ступени 2 — решение задокументировано в `build_sem07.py`,
  раздел «Решения по новым именам»), и резка карты смотрит на оба.

  Нумерация сквозная, `n01`…`n34`, без буквенных хвостов. Занятие открывает дугу из шести
  семинаров про процессы на LLM поверх агентов (`SPLIT-PLAN-7-12.md`): сегодня закрываются три
  нижние строки лестницы из девяти — хватит ли одного вызова, цепочка, маршрут с decision-моделью.

  Кейсов на занятии шесть: три в ступени 1 (механика email-пайплайна, Zillow Offers, Octomind/
  LangChain), три в ступени 2 (механика маршрутизации, Optum/UnitedHealth, IRS). Кейс A каждой
  ступени — учебная механика, несущая приём через кейсы B и C той же ступени, а не документированный
  публичный случай; это честно названо на самих дивайдерах (n04, n19) и в их заметках.
