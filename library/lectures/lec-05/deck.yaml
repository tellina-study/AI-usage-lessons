      primary: "2-колонка в Ocean rounded box: LLM (следующий токен текста · правдоподобие · нет понятия сезонность) vs прогноз ряда (следующее число · тренд+сезонность+шум · калиброванная ошибка). Тип ИИ: ARIMA-семейство / бустинг. Gold — «структурно разные задачи»."
    interaction: none

  - id: s06
    file: slides/s06-task-forecast-criterion.md
    type: assertion_visual
    section: "Раздел 1. Прогнозирование рядов"
    duration_min: 2.5
    assertion: "Прогноз спроса/cash-flow/оттока требует табличной модели с измеримой ошибкой — 3 аргумента почему не LLM: структура данных, калибровка, что сломается"
    learning_goal: "Развёрнутый критерий «почему классическая статистика/ML, не LLM» (граничный strict-in P1-1: in только при ≥3 аргумента)"
    learning_outcomes: [LO1, LO2]
    chapter_ref: "§1.2 [for-slide-s06]"
    references: []
    in_bucket: true   # граничный — развёрнут до ≥3 аргументов + альтернатива (P1-1)
    visual:
      pattern: three_argument_cards
      primary: "3 карточки-аргумента в Ocean rounded box: (1) структура данных — табличные ряды, не текст; (2) измеримость+калибровка — нужна численная ошибка+интервал; (3) что сломается — LLM даст правдоподобное число без обоснования × объём (механизм Zillow). Альтернатива+критерий-плашка. Gold — «измеримая ошибка». Footer — PII/ФЗ-152 caveat."
    interaction: none

