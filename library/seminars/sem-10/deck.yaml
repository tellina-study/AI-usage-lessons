      результат — объединённый ранг, id топ-10 и их текст — следующему узлу.

      МОДЕЛЬ НЕ НАЗВАНА, И ЭТО ЧЕСТНО (С5-следствие): в этом узле её и нет. RRF — классическая, не-ИИ
      формула; это явно видно по коду — ни одного вызова HTTP, ни одного обращения к OpenRouter. Единственные
      два числа, которые этот код решает сам, без модели, — `k=60` (сглаживающая константа формулы) и
      `TOP_N=10` (сколько кандидатов передать дальше реранкеру).'
