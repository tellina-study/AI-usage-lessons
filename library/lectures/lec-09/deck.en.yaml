  - id: s27
    file: slides-en/s27-stsena-korabl-parkuetsya-sam.md
    type: norm
    section: "2. Remote control"
    assertion: "The crew keeps its hands on the screen, while the spacecraft brings itself to the station on its own"
    learning_goal: "§2.1: a scene, a deliberate break in form instead of a term's definition"

  - id: s28
    file: slides-en/s28-stadiya-teleoperatsiya.md
    type: norm
    section: "2. Remote control"
    assertion: "Teleoperation — control at a distance, in which the decision stays with the human"
    learning_goal: "§2.2: the term and the stage's general description — after the scene, not before it"

  - id: s29
    file: slides-en/s29-gde-nuzhen-chelovek-granitsa-sdvinuta.md
    type: schema_timeline
    section: "2. Remote control"
    assertion: "Latency to the ISS is fractions of a second, to the Moon 1.3 seconds, to Mars 3 to 22 minutes: the speed of light cannot be worked around"
    learning_goal: "§2.3: where the human is needed in the loop, where the boundary has already shifted — the physics of the limitation"

  - id: s30
    file: slides-en/s30-metody-kontroller-i-tyoplyy-start.md
    type: schema_pipeline
    section: "2. Remote control"
    assertion: "A classical controller measures, compares, and corrects dozens of times a second; a warm start only suggests a good starting point for it"
