    Довод «шум гасится усреднением, смещение от усреднения крепнет» готовит вопрос следующего экрана.
    Источник — rework/section-2-routing-part3b.md §B.1.'
  visual:
    pattern: problem_scenario
    figure: optum-c5-odin-ball-dva-stolbika.png
    primary: 'Схема во всю ширину: два столбика разной высоты, под каждым одна и та же подпись «один и
      тот же балл риска». Слева у столбиков числовая шкала с метками 0 · 50 · 100 · 126,3 — левый столбик
      принят за базу 100, правый дотягивает до 126,3; прирост правого залит золотом и вынесен числом (+26,3%).
      Под схемой — один конкретный человек из правого столбика и формула про шум против систематического
      смещения.

      '
    backup: '26,3% — замер исследования среди пациентов самого высокого разряда риска (Obermeyer et al.,
      Science, 2019; формулировка сверена прямым чтением разбора Scientific American от 24.10.2019: «among
      all patients classified as very high-risk, black individuals turned out to have 26.3 percent more
      chronic illnesses than white ones (despite sharing similar risk scores)»). Разряд назван прямо на
      схеме — иначе число читалось бы как свойство любой пары пациентов с одинаковым баллом. Состав расходов
      («те же деньги ушли на экстренные визиты при обострениях диабета и давления») — оттуда же: «black
      patients tended to pay for more active interventions such as emergency visits for diabetes or hypertension
      complications». Прежняя версия слайда показывала таблицу из двух строк «белый пациент / чёрный пациент»
      с качественной оценкой «заметно тяжелее»; замена на замер и на одного человека — по разбору Опуса.
      Множественное число в подписях к столбикам обязательно: 26,3% измерены по группам, пара конкретных
      людей таким числом не описывается. ЧИСЛОВАЯ ШКАЛА У СТОЛБИКОВ — правка круга 5 по замечанию студента:
      без оси пропорцию высот приходится принимать на веру, а 26,3% читается как подпись к картинке. База
      100 и метка 126,3 делают отношение высот проверяемым глазом прямо на экране. Шкалу рисует `rendered/make_figures_c5.py`
      (зона сессии схем) — слайд её только требует. ИМЯ ПОСТАВЩИКА в первой плашке («балл Optum») — та
      же правка круга 5, что и на дивайдере кейса: до неё компания не называлась на экране четыре слайда
      подряд. Схема рисуется `rendered/make_figures_c5.py`. Провизорный идентификатор круга — n29; перед
      сборкой нужен проход сквозной перенумерации в `nNN`.'
