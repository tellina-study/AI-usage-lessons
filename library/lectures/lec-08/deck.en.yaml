    duration_min: 1.5
    assertion: "The 6 sections of the lecture — horizontal roadmap"
    learning_goal: "Lecture-map: 6-card horizontal roadmap"
    learning_outcomes: [LO1]
    chapter_ref: "§0 — Table of contents"
    references: []
