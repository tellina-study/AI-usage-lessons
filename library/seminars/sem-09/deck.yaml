# Процесс отвечает человеку
# Файл СОБРАН генератором: python3 tools/seminar-build/make_deck_yaml.py --seminar 09
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Введение   n01–n03    5.00 мин
#   Ось        n04–n04    2.00 мин
#   Кейсы      n05–n75   93.00 мин
#   Закрытие   n76–n78    7.00 мин
#   ИТОГО                 107.00 мин при слоте 90

deck:
  seminar_number: 9
  title: Процесс отвечает человеку
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 107.0
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + настоящие скрины живого
    стенда n8n.lessons.tellian.io + пять измеренных замеров на этом стенде (222 вызова, протоколы в `stend/`);
    на занятии ведущий ничего не редактирует в узлах вживую — только прогоняет уже готовые процессы (решение
    владельца, ARCHITECTURE.md §4)
  cover_hook: null
  central_question: Как построить решение «отвечать самому или передать человеку»?
  language: ru
  slide_count: 79
  axis: Шесть утверждений, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным, по
    строке за разбор
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka.md
  type: hero_cover
  duration_min: 0.5
  assertion: Процесс, который до сегодня писал только в таблицу и Ольге, начинает отвечать тому, кто обратился
  learning_goal: Обложка. Называет тему занятия и его ступень дуги — ответ человеку (ступень 3), не новую
    механику инструмента.
  visual:
    pattern: hero_cover
    primary: 'Тёмный Ocean-градиент, крупный заголовок по центру полотна, подзаголовок в середине свободной
      полосы. Номера занятия на экране нет.

      '
    backup: 'Название — дословно из `ARCHITECTURE.md` (поле `title`) и из «Темы занятия» `SETKA-KEYSOV-S9.md`:
      процесс сам отвечает клиенту. Номер занятия на обложке не печатается — решение владельца, `sem-06/qa/oblozhka-bez-nomera.md`,
      тот же приём, что у обложки С8. Фигуры на обложке нет сознательно: лестница дуги (`lestnitsa-dugi.png`)
      стоит одним экраном позже, на n03, и дублировать её здесь значило бы показать ступень прежде, чем
      названа нехватка. Вопрос занятия на обложку тоже не вынесен: он задаётся на n04 и дословно повторяется
      на n77, и третье место сбило бы счёт этих двух.'
- id: n02
  file: slides/n02-shov-s8-s9.md
  type: content
  duration_min: 2.5
  assertion: Процесс с прошлого занятия собран в один файл; меняется в нём одно — куда уходит его ответ
  learning_goal: Шов С8→С9. Входное состояние названо одной строкой словами; несущая работа кадра — смена
    адресата ответа и цена этой смены, не перечень того, что будет дальше, и не экскурсия по узлам.
  visual:
    pattern: content
    primary: 'Кадр без иллюстрации: строка про входное состояние, под ней полоса противопоставления «куда
      уходил ответ · куда уходит», под полосой плашка про цену ошибки.

      '
    backup: 'Источник содержания — `SETKA-KEYSOV-S9.md`, раздел «Открытие», экран 1: шесть узлов прошлой
      цепочки плюс четыре доработки С8 ОДНИМ собранным файлом. Доработки сознательно НЕ вынесены буллитами:
      сетка требует показать их собранными, не списком порознь — поэтому входное состояние названо одной
      строкой, а разбор узлов живёт в заметках. ФИГУРЫ ЗДЕСЬ НЕТ — РЕШЕНИЕ ОРКЕСТРАТОРА 2026-10-26, и
      это снятие, а не пробел. Первый проход слайда стоял на настоящем снимке холста «С9 · вход (выход
      С8)» по форме шва С8 (`sem-08/slides/n02-shov-s7-s8.md`, голосовая правка владельца 2026-10-20:
      снимок плюс одна строка словами). Имени такого снимка в `BRIEF-PROIZVODSTVO.md` §5 не было вовсе
      — список настоящих снимков начинается с `k1-holst-v1.png`; кадр не снят и в `rendered/figures/`
      отсутствует. Закрыто снятием: кадр концептуальный (что меняется с приходом текста к человеку), снимок
      «входа» этому доводу ничего не добавляет, а изображение на соседних кадрах есть — обложка n01 и
      лестница n03. Стилизованной карточки под интерфейс здесь не рисовалось ни на одном круге: подделка
      запрещена правилом курса, и снятие — честный способ закрыть отсутствие кадра. ПРИЁМ ВЕРНУЛСЯ К `content`
      ВМЕСТЕ СО СНЯТИЕМ СНИМКА. Первый проход назывался `mechanism_node_graph` — именем шва С8, и оправдано
      это было ровно тем, что кадр нёс граф узлов снимком. Снимка больше нет, графа узлов на кадре нет,
      и имя стало описывать то, чего на нём не происходит. `BRIEF-PROIZVODSTVO.md` §4 приёма для n02 не
      называет вовсе, а его собственное правило — «где он не назван, `content`»; это и поставлено. Жанр
      от замены не меняется: `mechanism_node_graph` в таблице `genres` отсутствовал и падал в тот же `content`.
      Если оркестратор предпочтёт сохранить имя шва ради переклички с С8 — это одна строка правки здесь,
      собранный кадр от неё не изменится.'
- id: n03
  file: slides/n03-lestnitsa-napominanie.md
  type: arc_ladder_recap
  duration_min: 2.0
  assertion: Шесть ступеней доверия к модели, по одной на занятие; сегодняшняя — третья, ответ человеку
  learning_goal: 'Напоминание лестницы дуги, не повторный ввод. Кадр несёт фигуру лестницы: шесть ступеней,
    каждая названа своим вопросом, сегодняшняя обведена золотом, соседние видны — чтобы было понятно,
    чего на этом занятии ещё нет.'
  visual:
    pattern: arc_ladder_recap
    figure: lestnitsa-dugi.png
    primary: 'Фигура лестницы во всю ширину кадра: шесть ступеней снизу вверх, у каждой имя и вопрос ступени
      в одну строку, сегодняшняя обведена золотом. Под фигурой одна строка про то, где мы на этой лестнице
      стоим.

      '
    backup: 'Содержание фигуры — ДОСЛОВНО из `sem-07/KONTSEPTSIYA-7-12.md` §6 (лестница переписана решением
      владельца 2026-10-24, «переписать лестницу»); та же таблица повторена в `SETKA-KEYSOV-S9.md`, раздел
      «Открытие», экран 2. Ни одна формулировка не переписана своими словами: прежняя лестница была в
      примитивах инструмента, и кейсы под неё выходили про инструмент — переписанная держится вопросами,
      и вопрос обязан звучать так же, как в концепции. Проверять это надо в исходнике рисовалки (`rendered/make_figures_lestnitsa.py`),
      а не грепом по деке: подписи внутри схемы — пиксели (канон §7). ПРИЁМ И ТАБЛИЦА — РЕШЕНИЕ ОРКЕСТРАТОРА
      2026-10-26, в пользу фигуры. Первый проход этого слайда стоял на `recap_table` по брифу §4 и нёс
      лестницу таблицей. `recap_table` отображён в `rendered/deck-config.yaml` на жанр `axis_table`, а
      `axis_table` не входит в `genres.DRAWS_FIGURE` — фигура не нарисовалась бы никогда («СХЕМА НЕ ДОЙДЁТ»),
      а таблица дублировала бы её теми же шестью именами и теми же шестью вопросами. Приём заменён на
      `arc_ladder_recap`: этого имени в таблице `genres` намеренно нет, поэтому он падает в жанр `content`,
      а `content` фигуры рисует (рабочий механизм конфига, не пробел — `deck-config.yaml` править не нужно).
      Таблица снята с кадра тем же решением; `recap_table` остался за n76, где фигуры нет и таблица уместна.
      Шесть ступеней с их вопросами на кадре теперь ровно в одном месте.'
- id: n04
  file: slides/n04-os-zanyatiya.md
  type: keystone_axis
  duration_min: 2.0
  assertion: Шесть утверждений, каждое выглядит надёжным; чем каждое оказалось — заполняется измеренным,
    по строке за разбор
  learning_goal: 'Несущая ось занятия: кто поручится, что это можно отправлять. Вопрос занятия задаётся
    здесь дословно и дословно же возвращается на n77. Правая колонка открывается пустой и закрывается
    на n76, не здесь.'
  visual:
    pattern: keystone_axis
    primary: 'Таблица в две колонки, шесть строк. Левая колонка заполнена, правая — пустая, клетки пунктирные.
      Под таблицей вопрос занятия отдельной плашкой.

      '
    backup: 'Левая колонка — ДОСЛОВНО из `SETKA-KEYSOV-S9.md`, раздел «Ось занятия», шесть строк в том
      же порядке. Вопрос занятия — тоже дословно оттуда: «процесс написал человеку — кто поручится, что
      это можно отправлять?» Тот же текст, знак в знак, стоит на n77; сверка двух мест — отчёт `rendered/OTCHET-SLAYDY-vvedenie.md`,
      отдельный раздел. В сетке правые клетки размечены служебными пометками «закроется в Кейсе N» — это
      разметка производства, на видимый слой она не идёт, колонка пуста целиком (тот же приём, что у n04
      Семинара 8). ЗАГОЛОВОК И ПЕРВАЯ СТРОКА — ПРО САМУ ОСЬ, по требованию Pre-USER-GATE §6: заголовок
      называет вопрос, которым занятие мерит каждый свой разбор, и ничего не говорит ни про устройство
      курса, ни про то, что нового на занятии нет. Шесть строк вместо четырёх (у С8 было четыре) — по
      числу кейсов С9; таблица из шести строк с длинными правыми клетками на n76 близка к пределу высоты,
      поэтому правые клетки там держатся коротким измеренным фактом, а подробность живёт в заметках.'
- id: n05
  file: slides/n05-k1-divider.md
  type: case_divider_quote
  duration_min: 0.5
  assertion: Процесс научился отвечать сам — и первый же вопрос приходит про то, чего в справочнике Ольги
    нет
  learning_goal: 'Дивайдер Кейса 1. Форма текста — СЦЕНА (БРИФ §4a: у каждого кейса занятия своя форма
    дивайдера, П3). Называет проблему (А2), измеренного результата не выдаёт.'
  visual:
    pattern: case_divider_quote
    primary: 'Тёмный фон, одна строка действия крупно. Внизу дорожка шести кейсов занятия, первый подсвечен.

      '
    backup: 'Форма «сцена» назначена этому дивайдеру БРИФ-ПРОИЗВОДСТВО §4a (поправка оркестратора после
      первой волны): формы «вопрос», «цифра» и «цитата» отданы Кейсам 3, 2 и 4, чтобы шесть дивайдеров
      подряд не читались одной грамматикой (болезнь §4.1 №7, правило П3).

      Вопрос в строке — дословно один из трёх вопросов вне базы знаний первого прогона стенда (`stend/README.md`,
      прогон 611, «Есть ли бесплатное демо-занятие перед покупкой курса?»). Взят настоящий, не сочинённый:
      §4.3 канона.

      Что сознательно НЕ показано: чем этот прогон кончился. Числа «0 из 3» и «6 из 15» живут в тактах
      n12 и n13 — дивайдер, проговоривший итог, обнуляет и вопрос зала, и разбор (БРИФ §4a).

      Название кейса — «Отвечать или промолчать», по функции, как в дорожке кейсов `rendered/deck-config.yaml`
      (`case_track`), а не по уроку кейса («самоотчёту нельзя верить» — отклонённый вариант, §1 канона
      замысла кейса: по имени нельзя угадать, чем кейс кончится).'
- id: n06
  file: slides/n06-k1-stsena.md
  type: problem_scenario
  duration_min: 1.5
  assertion: Ольга отвечает на одни и те же вопросы по одному и тому же справочнику — и хочет, чтобы часть
    из них закрывал процесс; но ответ пойдёт обратившемуся, а не ей на проверку
  learning_goal: 'Такт сцены Кейса 1: живая постановка потребности Ольги — кто она, что делает, что ломается
    и чем платит центр. Без версии решения и без находки прогонов (голосовая правка владельца 2026-10-20,
    issue #274: «а что показала практика» не место в постановке).'
  visual:
    pattern: problem_scenario
    primary: 'Рамка-врезка с обстановкой (тот же процесс, что ушёл с прошлого занятия), сразу под ней
      — ОТДЕЛЬНАЯ плашка «справочник весь — десять пунктов» (правка владельца 2026-10-27: размер базы
      не должен тонуть в абзаце, это самостоятельный факт, который держит весь дальнейший выбор решения
      кейса), дальше пронумерованная хронология рабочего дня Ольги, закрывающая плашка про цену и реплика-просьба.
      Версии решения на кадре нет, числа прогонов на кадре нет.

      '
    backup: 'Потребность — из SETKA-KEYSOV-S9.md, раздел «Кейс 1», «Форма входа» и «Постановка»: заявки
      с одними и теми же вопросами повторяются день за днём, и Ольга хочет, чтобы часть из них процесс
      закрывал сам. Рамка постановки — потребность, не «у нас стоит плохое решение» (§1 канона замысла
      кейса).

      Персонаж — Ольга, администратор учебного центра (А13), и тот же объём работы, с которым она пришла
      с прошлого занятия: двадцать заявок в день (`sem-08/slides/n06-k1-stsena.md`, тот же сценарий, не
      новое число).

      Десять пунктов справочника перечислены по `stend/sborka.py`, `KB_ITEMS` — это настоящий состав базы
      знаний на стенде, не придуманный для красоты список.

      Что сознательно НЕ показано: ни одной версии решения, ни одного числа прогона. Сцена ставит задачу
      и называет цену; что показали прогоны — такты n12, n13 и n16.'
- id: n07
  file: slides/n07-k1-vopros.md
  type: question_with_option_cards
  duration_min: 1.5
  assertion: Четыре действия, спектром от «решает модель целиком» до «решает сравнение строк без модели»
  learning_goal: 'Вопрос Кейса 1: голые карточки-действия, без вердиктов, без цены, без состава решения
    (А6). Каждая карточка — дизайн-выбор, то есть действие, которое можно совершить, а не факт о возможностях
    инструмента (§5 канона замысла кейса).'
  visual:
    pattern: question_with_option_cards
    primary: 'Вопрос в золотой рамке и ряд из четырёх карточек равной ширины, расположенных спектром:
      слева «решение целиком у модели», справа «решения у модели нет вовсе». Пояснений, доводов и пометок
      на карточках нет — разбор следующим экраном.

      '
    backup: 'Карточки — дословно из SETKA-KEYSOV-S9.md, раздел «Кейс 1», подраздел «Вопрос»; формулировки
      не переписаны. Вопрос в рамке — тоже дословная строка оттуда.

      Проверка на протечки (А6), пройдена по каждой карточке отдельно: ни одна не называет вердикт, ни
      одна не называет цену, ни одна не перечисляет состав собираемого решения, нигде не сказано, сколько
      ответов верных. Собственные числа стенда (0 из 3, 6 из 15, 4 из 15, 2 из 15) на этом экране не стоят
      вовсе — им место в тактах n12, n13 и n16.

      Проверка на рамку факта (§5 канона замысла кейса): в каждую карточку подставляется повелительный
      глагол — «дать модели решать», «сравнивать строкой», «класть опору в поле», «спрашивать уверенность
      числом». Ни одна не превращается при этом в утверждение о свойстве инструмента («модель ловит смысл,
      но путает похожее») — все четыре остались действиями.

      Порядок карточек — спектр, а не вразнобой: первая отдаёт решение модели целиком, вторая не вызывает
      модель вовсе, третья и четвёртая делят работу между моделью и кодом двумя разными способами.'
- id: n08
  file: slides/n08-k1-razbor.md
  type: answer_breakdown_table
  duration_min: 2.0
  assertion: Три из четырёх действий оставляют решение «отвечать или передать» там, где его потом нечем
    перепроверить
  learning_goal: 'Разбор сразу за вопросом (А1), 4-колоночная форма «действие · как делает · преимущество
    · недостатки» (А5, голосовая правка владельца 2026-10-20, issue #274). Без вердиктов «верно/неверно».'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица: действие · как делает · преимущество · недостатки. Четыре строки, колонки вердикта
      нет — решение следующим экраном. Внешние измерения в колонке недостатков набраны плашкой «было →
      стало», чтобы пара чисел читалась одним блоком.

      '
    backup: 'Текст разбора сведён из SETKA-KEYSOV-S9.md, раздел «Кейс 1», подраздел «Разбор», и уложен
      в 4-колоночную форму без переписывания по сути.

      ОДНО ОСОЗНАННОЕ ОТСТУПЛЕНИЕ ОТ СЕТКИ, вынесено оркестратору отчётом. В сетке колонка «недостатки»
      первой и третьей строк уже называет собственные числа стенда (6 из 15, 4 из 15, 2 из 15). Здесь
      они сняты и перенесены вперёд — в такты n12, n13 и n16, где эти прогоны показаны. Основание — записанная
      голосовая правка владельца 2026-10-20 (issue #274) ровно по этому такту Семинара 8: «ссылки на находку
      практики убраны из этого такта и перенесены вперёд, на настоящие прогоны — на момент этого разбора
      находка залу ещё не показана». Разбор, называющий итог прогона, лишает такты n12 и n13 того, что
      они вскрывают. Внешние измерения (не наш стенд) оставлены: они свойство инструмента, а не находка
      сегодняшнего кейса.

      Числа, оставшиеся в таблице, и их источники: 73,0% → 36,1% и «пропущенных отказов 4,3% при ошибочных
      отказах 62,8%» — CHISLA-SVERENO.md, строка 35 (RefusalBench, arXiv:2510.10390, статус СВЕРЕНО; атрибуция
      исправлена по пояснению №2 того же файла — числа принадлежат GPT-4o, не GPT-3.5). Калибратор 56%
      против порога 48% при одной и той же точности 80% — CHISLA-SVERENO.md, строка 37 (Kamath и соавторы,
      arXiv:2006.09462, статус СВЕРЕНО). «0 из 5 перефразировок при 15 из 20 пар» — измерение прошлого
      занятия, уже показанное этому же залу (`sem-08/slides/n20-k2-razbor.md`), не внешний источник.

      Из `research/*` не взято ничего (запрет БРИФ §2).

      ДОБАВЛЕНО 2026-10-27 (правка владельца): строка 4 раньше несла только внешнюю цитату (Kamath) без
      собственного измерения — владелец отметил, что сравнение подходов «не прозрачно по точности». Добавлена
      ссылка на собственный замер (n13a, `stend/zamery-k1-k3/README.md`, Замер 3): порог 70 на сырой самооценке
      не поймал ни одной из 5 ошибок на тех же 15 вопросах. Внешняя цитата оставлена — она объясняет МЕХАНИЗМ,
      собственный замер подтверждает его на нашей же задаче.'
- id: n09
  file: slides/n09-k1-reshenie-sloy1.md
  type: mechanism_node_graph
  duration_min: 1.0
  assertion: 'Одна и та же развилка «отвечать или передать» может жить в двух местах: внутри сочинённого
    текста или в отдельном поле, которое сверяет код'
  learning_goal: 'Слой 1 такта «наше решение» (§2 канона замысла кейса): архитектура без единого имени
    узла и без имени инструмента, одним кадром на обе формы — правило курса требует, чтобы сопоставление
    читалось с одного взгляда. Слой 2 обеих версий — экранами дальше.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-shema-samootchet-i-geyt.png
    primary: 'Две панели на одном кадре, читаются одним взглядом, построчно по трём вопросам слева: что
      делает модель · где записано решение · кто может его проверить. Слева «Версия 1 — решение внутри
      текста ответа», справа «Версия 2 — решение в отдельном поле». Палитра Ocean, кегль не ниже 7,5 pt.
      БЕЗ нижней строки с результатами прогонов — см. backup.

      '
    backup: 'ИМЯ ФИГУРЫ СМЕНЕНО решением оркестратора по ходу волны. Было две схемы на один такт (`k1-shema-samootchet.png`
      и `k1-shema-geyt.png`), а такт слоя 1 в карте §4 один — и правилось это не добавлением слайда, а
      сведением обеих форм в ОДНО сопоставление на одном кадре: `k1-shema-samootchet-i-geyt.png`. Основание
      — правило курса «сопоставление читается с одного взгляда» (CLAUDE.md, «Форма подачи слайда»); владелец
      называл его отсутствие системной ошибкой.

      Устройство обеих панелей — по SETKA-KEYSOV-S9.md, раздел «Кейс 1», подразделы «Постановка» и «Решение»,
      и по `stend/sborka.py`, функции `case1_v1` и `case1_v2`, то есть по настоящему составу сценариев
      на стенде.

      Имён узлов, имени оркестратора и латиницы на схеме нет сознательно: §2 канона требует от слоя 1
      формулировки, которая переживёт смену инструмента. Настоящие холсты и настоящие панели — n10, n11,
      n14, n15.

      Порядок рассказа при этом НЕ нарушен (§4 канона: история одной итерации, а не два заранее поставленных
      опыта). Обе формы названы здесь только как устройство — так же, как они уже названы на разборе n08
      среди четырёх действий. Собирать и мерить мы продолжаем по очереди: версия 1 (n10–n11), её прогоны
      (n12–n13), затем самый дешёвый промежуточный ход — уверенность числом и порог, измеренный первым
      и отдельно (n13a, правка владельца 2026-10-27) — и только после него версия 2 (n14–n15). Правая
      панель этого кадра остаётся верной и для n13a: решение там тоже лежит в структурированном поле,
      которое сверяет код, просто поле другое — число, а не пункт базы.

      ПРОТЕЧКА В САМОЙ ФИГУРЕ — НАЙДЕНА 2026-10-26, ПРАВИТСЯ НЕ ЗДЕСЬ. Готовая `rendered/figures/k1-shema-samootchet-i-geyt.png`
      несёт нижнюю строку «Чего это стоило» с измеренными числами: **6 из 15** под версией 1 и **4 из
      15 · 2 из 15** под версией 2. Это весь итог тактов n12, n13 и n16 целиком, предъявленный на четыре
      экрана раньше — до того, как зал увидел хоть один прогон. Такая строка обнуляет и n13, и n16 ровно
      так же, как протечка на карточке обнуляет голосование (А6), только уровнем выше. Туда же попала
      и подпись под заголовком: «пятнадцать трудных вопросов (тема в базе есть, деталь другая)» — это
      постановка трудного случая, её вскрывает n13.

      ЧТО НУЖНО ОТ ФИГУРЫ НА ЭТОМ ТАКТЕ: верхние три строки сопоставления (что делает модель · где записано
      решение · кто может его проверить) — они и есть то сравнение «с одного взгляда», ради которого схемы
      сводили в одну. Нижнюю строку с числами и уточнение про пятнадцать трудных вопросов снять. Полный
      вариант с числами — законный кадр, но для такта ПОСЛЕ прогонов (n16 или n17), не для слоя 1.

      Это ровно тот случай, о котором предупреждает канон §7: подписи внутри схем — пиксели, и греп по
      собранной деке даёт по ним ноль. Мой греп по тринадцати файлам нашёл 0 протечек; число лежало в
      картинке. Искать такое надо в исходнике рисовалки — `rendered/make_figures_k1.py`.'
- id: n10
  file: slides/n10-k1-n8n-versiya1.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящий холст версии 1: четыре узла главного пути и ни одной развилки после модели'
  learning_goal: 'Слой 2 для версии 1 (§2 канона замысла кейса): настоящий снимок живого стенда с настоящими
    именами узлов, не стилизованная схема. На кадре видно главное свойство версии — после модели путь
    один.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-holst-v1.png
    primary: 'Настоящий снимок холста n8n живого стенда, широкий кроп главного пути: `Client question`
      → `Answer (free self-report)` → `Write row` → `Result screen`, и отдельно снизу подвешен узел модели
      `Model (answer, free)`. Под узлом ответа видна пометка `Model*` — звёздочка означает обязательный
      параметр.

      '
    backup: 'Снимок настоящий: `stend/n8n-screenshots-raw/case1-v1-canvas.png`, снят `stend/n8n_shots.py`
      на `n8n.lessons.tellian.io`. Стилизованной карточки вместо снимка здесь нет (БРИФ §5, [[no-mock-fallbacks]]).

      ТРЕБОВАНИЕ К КРОПУ, адресовано сессии, которая готовит фигуру: на исходном кадре левую треть закрывает
      всплывающая панель `Production Checklist` (три пункта про настройку уведомлений об ошибках). В кадр
      она попадать НЕ должна — область левее узла `Client question` отрезается. Хлебная крошка сверху
      содержит название сценария и в кроп не берётся; id сценария на исходном кадре не виден нигде (канон
      §3).

      Что на кадре видно буквально и о чём поэтому можно говорить: четыре узла главного пути в один ряд,
      подвешенный снизу узел модели, пометка `Model*` под узлом ответа, и — главное — после узла ответа
      ни одной развилки: стрелка одна, и ведёт она прямо к записи строки.

      Что на кадре НЕ видно и поэтому прозой рядом не утверждается: текст промта. Холст показывает карточки
      узлов, а не их открытые настройки. Панель настройки — отдельным экраном (n11), с собственным снимком.
      Это прямое следствие правки владельца 2026-10-20 по Семинару 8: не просить зал верить тексту слайда
      там, где снимок этого не показывает.'
- id: n11
  file: slides/n11-k1-nastroyka-promta.md
  type: mechanism_node_graph
  duration_min: 0.75
  assertion: 'Настоящая панель настройки версии 1: весь справочник и просьба «если не уверена — напиши,
    что не знаешь» лежат в одном текстовом поле, и ничего, кроме текста, у модели не просят'
  learning_goal: 'Слой 2 для версии 1, вторая половина: настоящий снимок панели настройки узла. Строка,
    на которой держится вся версия 1, прочитана с кадра дословно — прозой рядом ничего не досказано.'
  visual:
    pattern: mechanism_node_graph
    figure: k1-promt-v1.png
    primary: 'Настоящий снимок панели узла `Answer (free self-report)` с РАЗВЁРНУТЫМ полем промта: текст
      виден целиком — вводная строка, десять пунктов справочника подряд, подстановка вопроса клиента и
      закрывающий абзац с просьбой честно признать незнание. Акцент — на последнем абзаце.

      '
    backup: 'ИСТОЧНИК ФИГУРЫ НАЗВАН ТОЧНО, адресовано сессии, которая готовит фигуру: `k1-promt-v1.png`
      собирается из `stend/n8n-screenshots-raw/case1-v1-prompt-expanded.png` — это развёрнутый вид того
      же поля, где текст промта виден ЦЕЛИКОМ, включая закрывающий абзац. Из `case1-v1-prompt-panel.png`
      (сжатый вид той же панели) фигуру брать нельзя: там в поле помещаются только первые две строки,
      и закрывающий абзац — та самая строка, на которой держится вся версия 1, — в кадр не попадает. Первый
      вариант этого слайда был написан по сжатому снимку и был вынужден приводить эту строку с оговоркой
      «ниже видимой части»; развёрнутый снимок появился в ходе волны и оговорку снял. Кадр брать по левой
      колонке (`Expression`), правая (`Result`) дублирует тот же текст и в кроп не нужна.

      Весь текст на видимом слое прочитан с кадра дословно и совпадает с `stend/sborka.py`, функция `case1_v1`.

      Что сознательно СНЯТО относительно первого варианта: блок про переключатель `Require Specific Output
      Format` в положении «выключено». Он виден на сжатом снимке панели и НЕ виден на развёрнутом — а
      говорить о нём прозой рядом с кадром, который его не показывает, значит просить зал поверить на
      слово (правка владельца 2026-10-20 по Семинару 8). Утверждение «ничего, кроме текста, у модели не
      просят» читается из самого текста промта, который на кадре есть целиком, и в переключателе не нуждается.

      На кадре видна хлебная крошка с именем узла; id сценария и id прогона не видны нигде (канон §3).'
- id: n12
  file: slides/n12-k1-rezultat-legkiy.md
  type: measured_outcome_table
  duration_min: 1.5
  assertion: На трёх вопросах, темы которых в справочнике нет вовсе, версия 1 честно призналась, что не
    знает, — 0 выдуманных ответов из 3
  learning_goal: 'Первый прогон версии 1 на живом стенде. Поворот кейса (П1) начинается здесь: ожидание
    «модель уверенно соврёт» не подтвердилось, и слайд говорит измеренное, а не ожидавшееся.'
  visual:
    pattern: measured_outcome_table
    primary: 'Плашка с несущей парой «3 вопроса вне справочника · 0 выдуманных ответов», под ней таблица
      трёх вопросов с дословными ответами, и отдельной врезкой внизу — побочная находка того же прогона
      про фрагмент на чужом языке.

      '
    backup: 'Все три вопроса и все три ответа — дословно из `stend/README.md`, раздел «Версия 1 — свободный
      ответ», прогоны 609, 610 и 611. Ещё три вопроса того же прогона (606, 607, 608) спрашивали про темы,
      которые в справочнике ЕСТЬ, и ответы на них верны по базе — отсюда база «3 из 6 заданных были вне
      справочника».

      Побочная находка — прогон 607, вопрос про документы: ответ верен по существу, но содержит посреди
      русского текста фрагмент китайскими иероглифами вместо слов «копия разворота». Тот же класс сбоя
      наблюдался на стенде Семинара 8 на варианте с инструментом-калькулятором — два независимых наблюдения
      на двух занятиях (ARCHITECTURE.md, «Побочная находка того же прогона, в кейс идёт как есть»). Сам
      фрагмент на слайде не воспроизводится: на кадре это была бы латиница-на-иероглифах без смысла для
      зала, достаточно назвать явление.

      Номера прогонов на видимом слое не стоят (БРИФ §2) — они здесь, в документации производства.

      Слово «лёгкий случай» на слайде названо прямо и объяснено признаком («темы нет вовсе»), а не оставлено
      оценкой: канон §8.11 требует, чтобы ноль был предъявлен вместе с признаком лёгкости, иначе он читается
      как свойство модели.'
- id: n13
  file: slides/n13-k1-rezultat-trudnyi.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: На пятнадцати вопросах, где нужный пункт в справочнике есть, а спрошенная деталь другая,
    версия 1 уверенно и неверно ответила 6 раз
  learning_goal: 'Трудный случай той же задачи (канон §8.11): ноль лёгкого прогона предъявлен рядом с
    шестью из пятнадцати на трудном. Самоотчёт молчит там, где вопрос грубо не покрыт, и перестаёт молчать
    там, где рядом есть похожий, но не тот пункт.'
  visual:
    pattern: measured_outcome_table
    primary: 'Полоса из двух плашек: «лёгкие вопросы — 0 неверных из 3» и «трудные вопросы — 6 неверных
      из 15», подписи разводят их явно. Под полосой — два разбора дословными цитатами: что сказано в справочнике,
      что спросили, что ответила версия 1. Внизу строка про то, чем трудный случай отличается от лёгкого.

      '
    backup: 'Числа — из `stend/zamery-k1-k3/README.md`, Замер 1: 15 вопросов через тот же сценарий версии
      1 без единой правки в нём, прогоны 619–647 (нечётные). Сводка замера: хороший исход (верный ответ
      либо верная эскалация) — 9 из 15; уверенный неверный ответ клиенту — 6 из 15. Оба числа на слайде,
      второе без первого было бы числом без базы.

      Разбор первый — вопрос Q4 про медицинскую справку, прогон 625: в справочнике про справку нет ничего,
      перечислены только паспорт, СНИЛС и согласие родителя; модель подтвердила отсутствие требования,
      которого справочник не упоминает. Разбор второй — вопрос Q15 про предупреждение за двое суток, прогон
      647: правило справочника «не позднее 24 часов», 48 часов в него укладываются, ответ модели противоположный.
      Обе цитаты дословны по протоколу.

      Оговорка, которую протокол требует держать рядом с числом (его раздел «Что не подтвердилось»): 15
      вопросов прогнаны по одному разу, без повторов, — это одна точка измерения, а не устойчивая доля.
      На слайде она стоит прямой строкой, а не прячется в заметки.

      Номера прогонов на видимом слое не стоят (БРИФ §2).'
- id: n13a
  file: slides/n13a-k1-reshenie-uverennost-porog.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Прежде чем строить опору на пункт базы, измерили самый дешёвый ход — число уверенности и
    порог в коде — и он оказался худшим из трёх проверенных вариантов, не промежуточным
  learning_goal: 'Правка владельца 2026-10-27: 4-я строка разбора n08 («модель называет число уверенности,
    порог в коде») до этого такта только цитировалась по внешним источникам как заведомо слабее структурной
    опоры — её ни разу не строили и не мерили на своей задаче. Этот такт строит и измеряет её ПЕРВОЙ,
    на тех же 15 трудных вопросах, что версии 1 (n13) и 2 (n16) — грounded-гейт на следующих тактах добавляется
    поверх неё, не вместо несуществующего сравнения.'
  visual:
    pattern: measured_outcome_table
    primary: 'Архитектурная строка сверху (один вызов модели: ответ + число уверенности 0-100 → код сверяет
      с порогом 70), под ней полоса плашек с итогом по всем трём вариантам на одних и тех же 15 вопросах,
      ниже — два разбора дословными цитатами тех ошибок, что порог пропустил.

      '
    backup: 'Числа — `stend/zamery-k1-k3/README.md`, Замер 3 (исполнения 840-854), построенный и измеренный
      `build_case1_confidence.py` на живом стенде, webhook `s9-answer-confidence`. Грейдинг — по тому
      же эталону `correct_by_base` (`voprosy_zamer1.py`), что уже применён к версии 1 на n13: молчание
      базы, прочитанное как подтверждённое отрицание, считается ошибкой независимо от того, насколько
      уверенно она звучит — та же мерка, что уже нашла ошибку в версии 1 на вопросе про медицинскую справку.

      ПОРЯДОК ТАКТА: этот слайд идёт МЕЖДУ n13 (результат версии 1, трудный случай) и n14 (экран n8n версии
      2) — архитектурно и хронологически версия 1.5 измерена ДО того, как собрана версия 2, именно так,
      как просил владелец: сначала простой и дешёвый ход, затем структурная опора добавляется поверх него,
      а не на пустом месте.

      Порог 70 выбран ДО измерения — круглое число-середина, не подогнан постфактум под результат.'
- id: n14
