      «нет информации» (n11/n10): не потому что модель не старается, а потому что ей явно разрешено и
      предписано сказать это, если факт не находится. На малой базе ей есть из чего искать; на большой,
      с ростом числа похожих документов-дистракторов, найти свой факт в сплошном тексте правильно получается
      у неё не всегда — и тогда срабатывает именно это предписание.'
