- id: n29
  file: slides/n29-vopros-gde-slomalos.md
  type: reflection_question
  duration_min: 1.75
  assertion: Отбор поднял наверх декларации, которые проверяются быстрее, — ровно то, что стояло в его
    задании; вопрос классу — где в этой цепочке поломка, и три предложенных места все лежат внутри алгоритма
  learning_goal: 'Вопрос кейса C и сбой ритма блока (правило П4): три места вместо четырёх кандидатов-признаков,
    и правильного ответа среди них нет — все три лежат внутри алгоритма, а сломана постановка над ним.
    Голосование честное: разбор следующего экрана проходит по каждому из трёх мест и показывает, почему
    оно чистое, прежде чем назвать четвёртое. Прежняя форма вопроса («во сколько раз чаще?») снята опус-ревью:
    после кейса Optum она спрашивала величину перекоса, то есть угадывание числа. Источник — section-2-routing.md
    §A.3.3, part4b.md §B.2–B.3.'
  visual:
    pattern: question_with_option_cards
    primary: 'Сверху — печатная карточка постановки задачи отбора в три поля (вход, ресурс, цель): моноширинный
      блок, зрительный якорь экрана и предмет суждения. Под ней — вопрос дословно в золотой рамке. Внизу
      — три равные карточки мест, ни одна не подсвечена, фиксированный порядок. Ни цифр, ни источников
      на слайде.

      '
    backup: Источник — part4b.md §B.2–B.3. Карточка постановки — РЕКОНСТРУКЦИЯ по тексту раздела («алгоритм
      заранее отбирает тех, у кого проверка с наибольшей вероятностью найдёт нарушение»; «алгоритм, оптимизированный
      так, чтобы находить нарушения при ограниченном числе инспекторских часов»), а не цитата из документа
      IRS; на экране она подписана как постановка, без кавычек и без ссылки на документ. Голосование без
      верного варианта среди предложенных — единственный такой экран занятия; разбор обязан открыться
      этим признанием, иначе приём читается подвохом.
- id: n30
  file: slides/n30-razbor-schitali-druguyu-velichinu.md
  type: answer_breakdown
  duration_min: 2.5
  assertion: 'Ни одно из трёх названных мест не сломано: обе величины классификатора читаются по самой
    декларации, порог меняет объём писем и не трогает долю, расы в данных нет вовсе — сломана постановка,
    в которой максимизировать велели экономию инспекторских часов'
  learning_goal: 'Разбор кейса C и его собственный поворот (правило П1): у Optum поломка в МЕРЕ — удобный
    признак встал на место нужной величины; здесь поломка в самой ВЕЛИЧИНЕ — считали точно, считали другое.
    Различие практическое: проверка, вскрывшая Optum (сравнить признак с прямым измерением), на этой лестнице
    проходит чисто, потому что сверяет ответ с поставленной целью, а сама цель остаётся вне проверки.
    Источник — section-2-routing.md §A.3.4, part4b.md §B.3.'
  visual:
    pattern: answer_breakdown_schema
    figure: irs-c6-lestnitsa-deshevizny.png
    primary: 'Схема `irs-c6-lestnitsa-deshevizny.png`: спуск из четырёх ступеней, каждая стрелка подписана
      «верно», верхняя ступень залита золотом и помечена «сломано здесь», справа крупно исход 2,9–4,7×
      с источником, внизу — строка про отсутствие расы на любой ступени. Форма сознательно расходится
      и с таблицей разбора кейса Optum, и с горизонтальным конвейером механики цепочки. Под схемой — два
      блока: снятие трёх названных мест и формула поворота.

      '
    backup: 'Источник — part4b.md §B.3. Схема рисуется `rendered/make_figures_c6.py` (функция `lestnitsa_deshevizny`),
      самый мелкий кегль 26 px = 9,5 pt на слайде, порог §7 — 7,5 pt. Два параметра классификатора (дешевизна
      проверки и отношение суммы возврата к сумме дохода) и вывод «смещается к декларациям, которые дешевле
      проверить, а не к декларациям, где нарушение более вероятно или более финансово значимо» — дословно
      part4b.md §B.3. Утверждение «измерения точные» в источнике отсутствует и на слайд НЕ вынесено: сказано
