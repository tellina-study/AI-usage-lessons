      вокруг него) — значит то же самое безусловное соединение сохраняется и после замены.

      Независимое текстовое подтверждение для буквального повтора — stend/README.md, раздел «Кейс 2 —
      дедупликация (первый проход, 2026-10-18 — числа утрачены)»: «Execution 51 (буквальный повтор) —
