  type: answer_breakdown
  duration_min: 1.5
  assertion: 'Произнесённая залом версия «быстрее» проверяется счётом и не подтверждается: субагент открывает
    те же сорок файлов и читает их то же время — выигрывает он двумя другими вещами, освобождённым контекстом
    и тем, что список возвращается в ту же сессию, где лежит правка'
  learning_goal: 'Поворот кейса, предъявленный прямо: зал только что назвал основание своего выбора вслух,
    и слайд проверяет именно его. Разбор пяти карточек, форма А5 — две содержательные колонки. Круг 5
    (issue 225): строка «вторая сессия» отвечает на вопрос, который владелец назвал неотвеченным, — чем
    вторая сессия отличается от субагента, если контекст у обоих свой. Концепт удерживается от переусложнения:
    два различия, время чтения против места, где оно ложится, и куда возвращается результат'
  visual:
    pattern: answer_breakdown_table
    primary: 'Таблица пяти строк в две содержательные колонки: что делает / что не делает — ограничение.
      Порядок строк совпадает с порядком карточек вопроса. Вывод — отдельной строкой под таблицей: время
      чтения то же, меняются двое — чей контекст держит чтение и куда возвращается итог.'
    backup: 'Слайд круга 3 владельца (issue 225). Пять строк разбора написаны под сцену и вопрос этого
      кейса — прежний кейс о достоверности отчёта (журнал вызовов) снят целиком, см. section-2-subagent-otchet.md.
      Литературная правка: формат «не X, а Y» снят из всех видимых и речевых блоков слайда (правило деки,
      Часть Г ZADANIE-KRUG-2-VLADELTSA.md). Вторая прожарка (issue 225, P1-2): следующий по порядку слайд
      «что входит в контекст роли, что из него выходит» снят целиком — он дословно пересказывал контрактный
      факт, уже названный базой ступени (n30) и одностраничником (n31, блоки 3–4). Пересмотр по сторителлингу
      (issue 225, PERESMOTR-STORITELLING.md, правило П1): поворот стоит в ЗАГОЛОВКЕ и в первой фразе речи,
      не в выводе внизу. Круг 5 (issue 225, ZADANIE-KRUG-5.md): строка «скилл» заменена строкой «вторая
      сессия» вслед за карточками n33, и вывод под таблицей достроен — прежде он называл одно изменение
      («меняется, чьё окно их держит»), теперь два, потому что только второе отличает субагента от второй
      сессии. Слово «окно» снято со слайда целиком (14 вхождений), заменено на «контекст».'
- id: n35
  file: slides/n35-svidetelstva-primer-est-izmereniy-net.md
