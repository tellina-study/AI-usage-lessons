      отменено этим кругом для всего занятия). Вторая прожарка (issue 225 — владелец отдельно смотрел
      этот слайд и подтвердил: «вывод под таблицей разбить на три коротких хода — что отпадает сразу,
      что остаётся для единичного случая, два законных варианта и почему берём один»; то же независимо
