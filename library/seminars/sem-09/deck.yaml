- id: n60a
  file: slides/n60a-k5-fewshot-opisanie-rezultat.md
  type: measured_outcome_table
  duration_min: 2.0
  assertion: Описание границы в промте почистило устойчивую ошибку полностью — 10 из 10 верно, и добавленный
    few-shot к этому результату ничего не добавляет. На втором вопросе кейса та же комбинация дала 5 из
    10 — меньше, чем одно описание (6 из 10), но на одном исполнении из десяти это не доказанное ухудшение
  learning_goal: 'Правка владельца 2026-10-27 (методология крупными блоками) + правка 2026-10-29 (З5,
    К5-7): владелец отдельно указал, что до сих пор проверялись только одиночные приёмы, недостающий третий
    вариант — комбинация few-shot и описания в одном промте. Третья строка таблицы и второй текстовый
    блок добавлены по точному списку адресов `stend/zamery-k5-povtorno/README-fewshot-desc.md`, раздел
    «Правки деки». Вывод кейса на кадр: приёмы не складываются — ни на одном из двух вопросов комбинация
    не превзошла одиночное описание.'
  visual:
    pattern: measured_outcome_table
    primary: 'Методология крупными блоками-бейджами в ряд (температура · модель · вопрос · повторов),
      под ними таблица на три строки — few-shot · описание · комбинация — с явной подписью «верно/неверно»
      на каждом числе. Ниже второй текстовый блок: те же три приёма на втором вопросе кейса (самопротиворечие
      про пересдачу), с тем же правилом подписи, и закрывающий вывод «приёмы не складываются» с оговоркой
      о недоказанном ухудшении.

      '
    backup: 'Числа сценария 1 (вопрос-граница) — `stend/zamery-k5-povtorno/ README-fewshot-desc.md`, execution
      946–965 (few-shot/описание по отдельности) и execution 1809–1818 (комбинация). Числа сценария 2
      (самопротиворечие про пересдачу) — execution 1055–1074 (по отдельности) и 1819–1828 (комбинация).
      Генерик-харнесс Кейса 2 (`s9-k2-experiment`), та же модель `qwen/qwen-2.5-7b-instruct`, T=0, 10
      повторов на вариант на каждом вопросе.

      ТРЕТЬЯ СТРОКА И ВТОРОЙ БЛОК — по точному списку правок в конце README-fewshot-desc.md («Правки деки
      — точный список адресов»), пункты 1–4, выполнены дословно: assertion дополнен третьим исходом, таблица
      получила строку комбинации, блок «Почему это неочевидно» дополнен предложением про потолок, последний
      абзац заметок переписан с третьим пунктом.

      ЧИСЛА — РУЧНАЯ ПРОВЕРКА, НЕ АВТОМАТИЧЕСКИЙ ГРЕЙДЕР. На обоих сценариях автоматический грейдер (`grade_q1`/`grade_q2`,
      взят из одиночных замеров без изменений) разошёлся с построчным чтением всех ответов: сценарий 1
      дал 9 из 10 по грейдеру против 10 из 10 при чтении (execution 1816 — грейдер поймал слово «руководителя»
      внутри «а не через руководителя», не заметив отрицания перед ним); сценарий 2 дал 4 из 10 по грейдеру
      против 5 из 10 при чтении (execution 1819, 1821, 1822 — грейдер не распознал непривычную ему формулировку
      оговорки). РЕШЕНИЕ ОРКЕСТРАТОРА: на кадр и в заметки идут только числа ПОСЛЕ ручной проверки — это
      числа самого замера, а не метод, которым их посчитали. Расхождение грейдера с чтением — находка
      о надёжности собственного скрипта (канон §8.6, та же находка в третий раз в этой папке замеров),
      не про поведение модели на вопросе клиента; студенту она не нужна для вывода кейса, и на кадр не
      ставится — её место здесь, в backup, и в самом README замера, для прослеживаемости.

      ПОЧЕМУ ЧИСЛО СЦЕНАРИЯ 1 — 10 ИЗ 10, А НЕ 9: на этом вопросе у описания уже потолок (десять из десяти
      без few-shot, n60). Добавление few-shot к потолку физически не может его превысить — различить «не
      мешает» от «не может помешать» на этом вопросе нельзя, это названо прямо на кадре.

      ПОЧЕМУ РАЗНИЦА «6 ПРОТИВ 5» НА СЦЕНАРИИ 2 НЕ НАЗВАНА УХУДШЕНИЕМ: один ответ в выборке из десяти
      — это одно другое бинарное исполнение модели; при n=10 такая разница не отличима от обычного прогонного
      разброса без повторного замера одного описания в этой же сессии (который не входил в бюджет — 20
      из 25 допустимых вызовов уже использовано). Твёрдо доказано только то, что комбинация не лучше одиночного
      описания; формулировка «few-shot вредит» на этих данных была бы натяжкой.'
