- id: n55
  file: slides/n55-divider-dve-sessii-odna-papka.md
  type: section_divider
  duration_min: 0.5
  assertion: Сессий у вас уже несколько, а исполнителей в одной папке почти всегда больше одного — и это
    нормально. Отдельную копию репозитория вы дадите сессии сразу и захотите дать роли. Поле изоляции
