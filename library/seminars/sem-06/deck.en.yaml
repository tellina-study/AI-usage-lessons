      of the "notes for the site" round (issue 225): it used to read "the vendor; the honest gap is in
      the evidence of the second case", and both halves were dangling — "vendor" was the only instance
      of that word on the deck''s visible layer, and the honest gap on n47 is about the mismatch between
      two parallel subagents, not about the cost of delegation; the figure''s previous carrier, n54, was
      replaced in round 5 by the mechanics of a working copy, after which n31 remained the deck''s one
      place where it stands. The gap is named outright on the spot: there are no measurements over a sample
      behind the estimate, it is an order of magnitude — in the same words the chapter names it in (`rework/section-2-subagent-part1b.md`,
      the note for n31). The owner''s round 2 (issue 225): block 1 was reassembled — the same request
      that enlarged the MCP one-pager n09 ("show a mini-template of the file") applied to the subagent.
      It was: five lines of field captions with no values (`.claude/agents/<name>.md`, `name:`, `description:`,
      `tools:`, `the body of the file`). It became: a real extract from `diff-reviewer.md` (n57) on a
      light card (`code_card`, `rendered/ make_figures_subagent.py`) — three lines with real values (`name:
      diff-reviewer`, `tools: Read, Grep, Glob`), plus the two remaining caption lines where the value
      does not fit briefly (`description:`, `the body of the file`). The facts did not change — the same
      content the previous version carried, presented as a verbatim extract instead of abstract captions.
      The form follows the model of sem-05/slides/n11 "The hook in full, in one screen" (a full map in
      one screen that people come back to; the visual content lives in the diagram, the markdown body
      of Visual is empty; every block''s number is a circle). The budget: the slide grew from 1.5 to 2.0
      minutes — the growth was compensated by cuts to n54/n56/n58 of this same case (qa/krug-vladeltsa-subagent-keys1.md).
      Round 5 (issue 225, ZADANIE-KRUG-5.md, cross-cutting decision C1): across the slide and the diagram''s
      canvas, "agent" and "role" were separated — the word "parent" was replaced by "the calling session"
      or "the agent" wherever the matter is who called the subagent; "the subagents'' tools" in block
      5 by "the tools available to the role". The block numbers, the facts and the layout were not touched:
      four neighboring slides refer to this screen''s blocks by number. The palette has no red; the gold
      is the number circles and the frame of block 6, no less than once on the slide. An edit after two
      delivered classes (issue 225, qa/RAZBOR-PROVEDENIYA.md §A1): the term "role" was replaced across
      the whole deck by "subagent" — the lecturer stumbled over it aloud in both groups. The records of
      round 5 above are left as they were said and are to be read with that correction: the caption of
      block 5 on the canvas now reads "the tools available to subagents", the canvas was renamed to `subagent-n31-subagent-tselikom.png`,
      and the slide''s title is "The subagent in full, in one screen". The figures, the blocks, the layout
      and `duration_min` did not change. Literary editing (issue 225, qa/pravki-nahodok-svedeniya.md item
      4): the note''s last sentence pointed at the diagram''s panels with the word "block" — "The field
      stands here, in the first block… and what each of its three states gives is in the fifth". There
      is no dangling reference there and the panels are on the screen, but the notes are published on
      the site, and a reader with no slide in front of them divides the seminar into the MCP and Subagent
      sections from the first minute. The panels are named by the work they do, not by their number; the
      panel numbers, the diagram and the facts were not touched.'
- id: n32
  file: slides-en/n32-stsena-nashyol-chetyre-mesta-pravku-nachal-zanovo.md
  type: problem_scenario
  duration_min: 1.5
  assertion: 'The developer found all four places where the limit on members is checked, having read forty
    files in the same session the edit had already been explained in — and when it came to the edit itself,
    the agent re-asked what had been explained that morning: the context is taken up with reading for
    something else, and half an hour went on the repeat'
  learning_goal: 'The hook of the case: the volume of reading needed for a short conclusion has no relation
    to the size of the conclusion, and the result of that reading is needed in the same place the work
    sits. A recognizable working situation (a new plan and a limit that has spread across the codebase),
    not one constructed for the sake of a moral — the owner outright rejected "examples pulled out of
    thin air". Round 5 (issue 225): the scene was replaced entirely. The previous one was about an unrelated
    question from the technical director, and the room justifiably asked why the protagonist had not opened
    a second session for it; the seminar did not answer that question. Now the reading serves an edit
    that sits in this same session, and the result of the reading has to come back here — a second session
    gives an answer but does not return it into the work. And the scene presents the opening''s second
    miss in full ("what was needed fit inside and crowded the work out", n04, the second row). The solution
    is not named'
  visual:
    pattern: problem_scenario
    primary: 'Five steps as a numbered list: the task of the day, fifteen minutes of explaining it to
      the agent, why a search is needed before the edit, where the limit actually lives (four places)
      and how many files have to be opened, and what happened when it came to the edit itself. At the
      bottom, a highlighted line: the cost — half an hour on repeating the explanation, and a direct reference
      to the opening''s second miss.'
    backup: 'Round 5 (issue 225, ZADANIE-KRUG-5.md, verbatim: "it is not clear why he did not raise a
      second session for an unrelated question. we need something more lifelike and logical"). It was:
      the technical director asked in the chat about the limit on the free plan, the protagonist read
      forty files and answered "yes, but…", and the edit the session had been opened for was deliberately
      NOT connected to the question — and along with that lack of connection went the reason to read precisely
      here. It became: the reading and the edit are one piece of work. The protagonist is editing the
      limit, and in order to edit it he needs a list of the places where the limit is checked; the list
      is needed by the agent that is doing the editing, that is, in this session. The turn of the case
      was not touched (a subagent does not read any faster, what is saved is room in the context) — all
      that changed is why the reading cannot be moved out. The class of the scene is exactly the one the
      owner named a round earlier: "work out where some behavior lives in the project, and read dozens
      of files in order to do it". The detail (a limit on members scattered across middleware / the config
      / the migrations / the client) is an ordinary situation in any product with pricing plans; the seminar''s
      demo repository is too small for an honest forty-file scene, so the scene runs in the protagonist''s
      working product, and that is said on the screen in the very first line. The cost was recalculated
      from an hour to half an hour: fifteen minutes of explaining, spent twice, plus the return into interrupted
      work — an hour with twenty minutes of reading read as a stretch. THE DAY OF THE WEEK IS DELIBERATELY
      NOT NAMED: the opening (n04) calls this miss Wednesday, while the scene of the MCP section''s first
      case (n10) stands on a Tuesday — a different episode; a third instance of a day of the week would
      have cemented the confusion.'
- id: n33
  file: slides-en/n33-vopros-chto-delat-s-etim-chteniem.md
  type: reflection_question
  duration_min: 0.75
  assertion: 'There are four places to edit, and finding them means opening forty files: the room first
    recalls an edit of its own in which finding the places cost more than making them, and on that edit
    it picks a card and says out loud what the card wins by'
  learning_goal: 'A question to the class with no hint at the target answer. The cards name the options,
    not the solution: read it yourself / a second session / a colleague / a subagent in its own context
    / edit from memory. Round 5 (issue 225): the card "a second session" was put into the set in place
    of the card "save the question as a skill" — the room names that option out loud in any case, and
    its place is on the slide rather than in the notes; the skill, meanwhile, answered repeatability,
    which a one-off edit does not have. Storytelling revision (issue 225, rule P1): the room is asked
    to name the REASON for its choice out loud — "faster" will almost certainly be said, and the turn
    of the case on the next slide refutes exactly the version the room said, not an imagined one. The
    breakdown is on the next slide'
  visual:
    pattern: question_with_option_cards
    primary: 'At the top, in a quiet form — a line about an edit of your own: who had an edit where finding
      the places cost more than making them, and how many files had to be opened. Below it, a gold box
      centered, carrying the choice verbatim, with the overline "· QUESTION" and the caption "the breakdown
      is on the next slide". Five cards of equal width at the bottom, none of them highlighted.'
    backup: 'Owner''s round-3 slide (issue 225). The cards are worded so as to separate the reading time
      (which no option changes) from the place where that reading lands and from where the result comes
      back to (both of which different options change differently). Round 5 (issue 225, ZADANIE-KRUG-5.md):
      the set of cards was touched once — "save the question as a skill for later" was replaced by "open
      a second session and carry the list over by hand". The reason: the owner pointed out that the seminar
      does not answer why the protagonist did not bring up a second session; while that option was not
      on the cards, the answer to it lived only in the notes, which is to say it did not exist for the
      room. The skill lost nothing and settled nothing in this scene: it answers repeatability, and a
      pricing-plan edit is a one-off. The technique does not drop out of the course — it was introduced
      in the previous class and comes back in the third case of this rung. Storytelling revision (PERESMOTR-STORITELLING.md,
      rule P1 "every case has a turn of its own"): the question requires the grounds for the choice to
      be named out loud, and the notes say to write down the word that was said rather than argue with
      it. Revision after the two classes held (issue 225, qa/RAZBOR-PROVEDENIYA.md §C3): questions about
      the room''s own experience produced answers, abstract ones did not. So picking a card now comes
      second, and first comes an edit of your own in which finding the places cost more than making them,
      with the number of files opened. The self-check the notes used to end with is moved to the front
      as the question itself; the cards, their order and the breakdown (n34) are unchanged.'
- id: n34
  file: slides-en/n34-razbor-bystree-ne-stalo-te-zhe-sorok-faylov.md
  type: answer_breakdown
  duration_min: 1.5
  assertion: 'The "faster" version the room said out loud is tested by counting and does not hold up:
    the subagent opens the same forty files and reads them for the same length of time — what it wins
    by is two other things, a freed-up context and the fact that the list comes back into the same session
    the edit sits in'
  learning_goal: 'The turn of the case, put directly: the room has just named the grounds for its choice
    out loud, and the slide tests exactly those. A breakdown of the five cards, form A5 — two substantive
    columns. Round 5 (issue 225): the row "a second session" answers the question the owner called unanswered
    — how a second session differs from a subagent, if both have a context of their own. The concept is
    held back from over-complication: two differences, the reading time against the place where the reading
    lands, and where the result comes back to'
  visual:
    pattern: answer_breakdown_table
    primary: 'A table of five rows in two substantive columns: what it does / what it does not do — the
      limit. The order of the rows matches the order of the question''s cards. The conclusion goes as
      a separate line under the table: the reading time is the same, two things change — whose context
      holds the reading and where the result comes back to.'
    backup: 'Owner''s round-3 slide (issue 225). The five breakdown rows were written for the scene and
      the question of this case — the former case about the trustworthiness of the report (the call log)
      was removed entirely, see section-2-subagent-otchet.md. Literary editing: the "not X, but Y" format
      was removed from every visible and spoken block of the slide (a deck rule, Part G of ZADANIE-KRUG-2-VLADELTSA.md).
      The second roast (issue 225, P1-2): the next slide in order, "what goes into the role''s context
      and what leaves it", was removed entirely — it restated word for word a contractual fact already
      named by the rung''s base (n30) and by the one-pager (n31, blocks 3-4). Storytelling revision (issue
      225, PERESMOTR-STORITELLING.md, rule P1): the turn stands in the HEADLINE and in the first sentence
      of the speech, not in the conclusion at the bottom. Round 5 (issue 225, ZADANIE-KRUG-5.md): the
      "skill" row was replaced by the "second session" row, following the cards of n33, and the conclusion
      under the table was built out — before it named one change ("what changes is whose window holds
      them"), now two, because only the second distinguishes a subagent from a second session. The word
      "window" was removed from the slide entirely (14 occurrences), replaced by "context".'
