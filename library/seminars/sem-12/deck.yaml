- id: n81
  file: slides/n81-deshevaya-opora.md
  type: content
  duration_min: 1.75
  assertion: 'Три кейса поставили дорогой метод против дешёвой опоры и дали три разных исхода — и во всех
    трёх величину разницы назвал только замер: на малой выборке она читалась и завышенной, и заниженной,
    и перевёрнутой'
  learning_goal: 'Нить первая закрытия (ZAKRYTIE-BRIEF.md §2), ПЕРЕВЕДЕНА на числа круга 3 (issue #351).
    Две объяснительные половины переписаны как утверждения, не подстановкой цифр. (1) Кейс A: прежнее
    «промахи связанные — одна сломанная строка губит все пять полей» стояло на формат-сбое 5/65=7,7%,
    который на 100 формах дал 0/139=0% даже на той же форме 83594639 — вердикт отчёта ПЕРЕВЕРНУЛОСЬ (по
    числу); правильный вывод отчёта не «риск исчез», а «частота не измерена стабильно ни одним прогоном»
    (stend/zamery-A/README.md § «Два разных по природе промаха»). Вместо связанности на кадр вынесено
    измеренное: 0 обрушенных форм из 139 промахов, 81 уверенно-неверный. Числа кейса A переведены на эталон
    после правки 2026-11-26 (12 дефектов внесено, знаменатель 364 → 363; stend/zamery-A/CHISLA-POSLE-PRAVKI-ETALONA.md):
    75,2% против 61,7%. Разрыв 13,5 пункта и кратность цены 34,7× НЕ меняются — разница осталась ровно
    теми же 49 полями. (2) Кейс B: прежние «86,7% своего потолка, предел это словарь» — вердикт ПЕРЕВЕРНУЛСЯ,
    на 732 строках детектор берёт 183 из 512 достижимых (35,7%); разбор причины в glava/20-zamery-50-perekhod-na-sotnyu.md
    §3 — сравнивали достижение рассказа с потолком детектора, и потолок тогда мерили строже, поэтому «доля
    потолка» между кругами несравнима, а достижение сравнимо (56,0% против 25,0%, разрыв 227 строк = 31,0
    п.п.). (3) Кейс C: корпус курения не трогался, 18/134 и 25/134 без изменений (stend/zamery-C/README.md).
    Словарь выровнен: «зрение» → «мультимодальная модель», SigLIP назван «сравнением с текстовым описанием»
    как на n42/n53.'
  visual:
    pattern: content
    primary: 'Три ряда «кейс | дорогой метод | дешёвая опора | разница», числа плашками; у A и B в колонке
      разницы названо, куда разрыв сдвинулся на большей выборке. Под таблицей — что стоит за разницей
      у A и B, затем природа ошибок у C, затем запрещённый вывод.

      '
    backup: Числа сверены построчно с отчётами круга 3, не с брифингом. Два объяснения (связанность промахов
      у A, словарный потолок у B) отчёты круга 3 пересмотрели — оба переписаны как утверждения, оба с
      названной причиной, почему малая выборка давала прежний ответ.
- id: n82
  file: slides/n82-istina-gryaznaya.md
  type: content
  duration_min: 1.0
  assertion: 'Доля грязи в разметке держится на расстоянии между нашим вопросом к архиву и вопросом человека,
    расставлявшего пометки: двум кейсам, чей вопрос почти совпал с его вопросом, достались первые проценты,
    кейсу, чей вопрос ушёл далеко, — треть; порядок величины расстояние предсказывает, различие внутри
    первых процентов — уже нет'
  learning_goal: 'Нить вторая закрытия (ZAKRYTIE-BRIEF.md §3), ПЕРЕВЕДЕНА на числа круга 3 (issue #351)
    и после правки эталона 2026-11-26 ПЕРЕСОБРАНА устройством, а не подстановкой цифры. Что случилось:
    доля грязи кейса A выросла втрое, 1,1% → 3,3% (12 подтверждённых дефектов из 369 вместо 4; stend/zamery-A/CHISLA-POSLE-PRAVKI-ETALONA.md
    §6), и строки A и B поменялись местами — у A теперь 3,3%, у B 3,1%. Строки упорядочены по ИЗМЕРЕННОЙ
    доле, потому что кадр учит читать числа и обязан читать свои: прежний порядок по росту расхождения
    вопросов на новых числах читался как 3,3 → 3,1 → 33,8 и монотонность терял. Вместе с перестановкой
    СНЯТ прежний вывод «доля не выросла пропорционально объёму» — он измерял слепоту проверки, а не чистоту
    набора: проверка правдоподобия требовала цифру в поле категории «дата»/«число» и потому структурно
    не видела `B-17-88`, `B 90`, `3433/ 3/ 95`, `(400) 840-0639`. Взамен на кадр вынесено сильное и честное:
    3,3% — НИЖНЯЯ граница, читались промахи одного метода (67 полей из 369), и дефект, который все четыре
    метода воспроизвели, так не находится вовсе. Утверждение кадра ослаблено до того, что числа держат:
    расстояние между вопросами предсказывает порядок величины (первые проценты против трети, вдесятеро),
    различие внутри первых процентов — нет, 3,1 и 3,3 различить нечем. B — 6 строго неверных и 10 спорных
    из 195 просмотренных кандидатов (было 3 и 5 из 60; stend/zamery-B/README.md § «Счёт грязи человеческих
    пометок», счёт круга 1 отчёт наследует отдельной строкой и НЕ складывает); C класс курения — 25 из
    74 (33,8%), 7 спорных (9,5%) — числа БЕЗ изменений, корпус курения не трогался. РАЗГРУЖЕН 2026-11-26
    (issue #351): видимое тело выросло до 3515 знаков, таблица встала на дно кегля (9 pt при 569 знаках)
    и затребовала ступень сжатия, завершающая плашка переполнилась на 0,13″. Следствия нити — срезы кейса
    C (29 снимков 69,0%; еда 31 из 69, 44,9%), собственные запросы (7 из 12) и перенос на практику — вынесены
    на новый кадр `n82a` вместе со своей частью заметки; здесь осталось ядро нити: три кейса, их доли
    и оговорка про нижнюю границу. Колонки «расхождение» и «что нашли» сжаты до телеграфной плотности
    без потери чисел; слово «строго» вынесено в шапку четвёртой колонки, потому что относится ко всем
    трём долям сразу (6/195, 12/369, 25/74 — везде строгий счёт, спорные считаны отдельно).'
  visual:
    pattern: content
    primary: 'Три строки «кейс — расхождение вопроса — что нашли — база», упорядоченные по измеренной
      доле грязи. Сразу под таблицей — плашка о том, что первые две строки стоят рядом и почему верхнюю
      границу у эталона документов не знает никто. Следствия нити — кадром дальше.

      '
    backup: Все числа сверены построчно с отчётами круга 3 и со сводным листом правки эталона. Малые знаменатели
      прежней редакции (60 и 14) выросли впятеро и больше — оговорка «малый знаменатель» с них снята,
      потому что стала неверной. Прежняя редакция ставила строки по росту расхождения вопросов и держала
      монотонность на числах 1,1 → 3,1 → 33,8; после правки эталона она сломалась, и порядок строк переведён
      на измеренную долю. Спорные пометки B и C счёт в долю не берёт и держит отдельным числом — отсюда
      «строго» в шапке базы.
- id: n82a
  file: slides/n82a-gryaz-na-uzkom-sreze.md
  type: content
  duration_min: 1.0
  assertion: У кейса, чей вопрос ушёл от вопроса разметчика дальше всех, на отдельных срезах доля неверных
    пометок оказывается выше трети; и тот же разрыв между вопросами живёт в наших собственных словах —
    придуманные заранее запросы не совпали с лексикой готовых описаний в семи формулировках из двенадцати
  learning_goal: 'Вторая половина нити второй закрытия (ZAKRYTIE-BRIEF.md §3), вынесенная с `n82` отдельным
    кадром 2026-11-26 (issue #351). Почему вынесена: после правки эталона кейса A видимое тело `n82` выросло
    с 2818 до 3515 знаков, и кадр упёрся в физический предел — таблица встала на дно кегля (9 pt, ниже
    приём не умеет) и потребовала ступени сжатия, а завершающая плашка переполнилась на 0,13″. Девять
    пунктов на таблице из зала не читаются. Шов проведён между НЕСУЩИМ утверждением нити и её СЛЕДСТВИЯМИ:
    на `n82` остались три кейса, их доли и оговорка про нижнюю границу; здесь — срезы, где доля выше объявленной
    трети, собственные запросы и перенос на практику. Содержание не сокращено ни на одно число. Числа:
    срез val/test кейса C — 20 из 29 (69,0%), класс «еда» — 31 из 69 (44,9%) против 35,7% на порции впятеро
    меньшей, собственные запросы — 7 из 12. Источники: stend/zamery-C/README.md § «Грязь человеческих
    пометок» (20/29, 31/69, 35,7%), stend/zamery-D/README.md § «Чего этот замер не может и не делает»
    (12 запросов не перемеряны на сотне). Правило малого знаменателя (notes/decisions.md 2026-11-24) применено
    к двум местам явно: 29 снимков и 12 запросов. Класс «еда» и срез val/test корпуса курения в этом круге
    не трогались — числа унаследованы без изменений. ФОРМА ПЕРЕСОБРАНА 2026-11-26 (issue #351, отдельный
    круг): содержание было верным, показано не было — четыре абзаца прозы подряд, каждое число внутри
    предложения, на рендере 150 dpi текстовая стена (`CLAUDE.md` § «Форма подачи слайда»: числа плашками,
    а не внутри абзаца; сплошной текст — в буллиты). Три измерения сведены в одну таблицу с общей шапкой
    «что смотрели · что оказалось не тем · база и доля» — та же раскладка, что у соседнего `n82` (база
    и доля одной колонкой, потому что у запросов доли не считали и пустая клетка в отдельной колонке «доля»
    читалась бы пропуском). Оговорки про малый знаменатель остались НА КАДРЕ числом, отдельной плашкой
    (29 снимков, 12 запросов), а не уехали в заметки: без них доли нечестны. Добавлено одно число из `stend/zamery-C/README.md`
    — база прежней порции «еды» 5 из 14: прежняя редакция давала 35,7% без знаменателя (P1 «missing denominator»
    по § «Baseline / Counterfactual Mandate»), и пара «было → стало» теперь стоит одной плашкой по §5.14.
    Заметки не тронуты побайтово (385 слов сторожем, 391 сырым, коридор 250–450). Минута 0,75 → 1,0 вровень
    с `n82`: кадр теперь несёт таблицу, которую залу надо прочесть. Предупреждений сборки на кадре — ноль.'
  visual:
    pattern: content
    primary: 'Таблица трёх измерений под одной шапкой «что смотрели · что оказалось не тем · база и доля»:
      два среза чужой разметки и наши собственные запросы одной строкой каждое. Под таблицей — плашка
      роста доли на объёме (было 5 из 14, стало 31 из 69), плашка двух малых знаменателей числом (29 снимков,
      12 запросов) и правило нити плашкой-итогом.

      '
    backup: 'Срез val/test — человеческие пометки Open Images с наивысшей отметкой уверенности, то есть
      та часть чужой разметки, которой доверяют больше всего; именно с него пришёл весь пул курения. Доля
      класса «еда» выросла при росте объёма впятеро, и это тот признак, по которому грязь считают устойчивой,
      а не недобранной. Находка про собственные запросы помечена как неперемеренная: отчёт D называет
      её непокрытой прямо. Случай пластилина взят из разбора кейса поиска (`n38`, отчёт D, раздел про
      запрос 3.13) и новых чисел не вносит.'
- id: n83
  file: slides/n83-chuzhoy-arkhiv-smertnost.md
  type: content
  duration_min: 1.25
  assertion: Два внешних основания занятия умерли за время, пока его производили — не из-за ошибки в коде,
    а потому что процесс, построенный на чужом архиве, наследует его смертность
  learning_goal: 'Нить третья закрытия (ZAKRYTIE-BRIEF.md §4). Модель — находка производства 21.11.2026,
    зафиксирована в SETKA-KEYSOV-KRUG-1.md (сетка круга 1, переименована сессией-оркестратором, потому
    что её состав кейсов из занятия ушёл; но конкретная запись о модели — дата и число — факт производства,
    не зависящий от состава кейсов; наследуется по PEREDELKA-2026-11-24.md §7, строка «Модель исчезла
    из каталога через 17 дней»). Бакет — notes/mcp-limitations.md [#351-4], замерено 2026-11-24 прямым
    HEAD-запросом, 18 из первых 40 проверенных отсутствуют (45,0%), пул — 796 подтверждённых человеком
    позитивов; число уточнено против брифинга («45% из 796») до точного «18 из 40 проверенных, пул 796»
    — чтобы не создавать видимость, что проверены все 796. ДОБАВЛЕНО кругом 3 (issue #351, находка этой
    сессии сверх списка оркестратора): область утверждения сужена замером — stend/zamery-B/README.md §
    «Оговорка о чистоте набора» ставит прямую контрточку к [#351-4], 195 снимков срезов validation+test
    скачались 195 из 195, 0 отсутствующих. Вывод записи не опровергнут, но «половина корпуса» без названия
    среза была шире измеренного, и итоговая плашка кадра исправлена на «почти половина одного проверенного
    среза».'
  visual:
    pattern: content
    primary: 'Два случая рядом, оба с явной базой и датой. Внизу — одна строка итога, без усреднения двух
      разных по природе смертей.

      '
    backup: 'Числа проверены первичными источниками: SETKA-KEYSOV-KRUG-1.md (модель) и notes/mcp-limitations.md
      [#351-4] (бакет). Знаменатель бакета назван точно — проверены первые 40 из пула 796, не весь пул.'
- id: n84
  file: slides/n84-opredelenie-reshaet.md
  type: content
  duration_min: 1.25
  assertion: Один и тот же ответ модели на два похожих кадра получил два разных вердикта — и разница не
    в модели, а в том, какое определение запрещённого выбрал владелец; на всём корпусе эта граница создаёт
    практически весь перекос ложных тревог
  learning_goal: 'Нить четвёртая закрытия (ZAKRYTIE-BRIEF.md §5) — качественная находка «ведро/плакат»
    закреплена решением владельца, PEREDELKA-2026-11-24.md §13.1 и §15.1. Пара чисел 24 из 25 / 1 из 68
    — подтверждена оркестратором напрямую как число этой же нити (сообщение в сессию) и проверена этой
    сессией лично по сырью: library/seminars/sem-12/stend/zamery-C/raw/vision_results.jsonl, срез по дир-каталогам
    C-smoking (валтест-жёсткий-негатив, предмет курения без человека) и C-smoking-negtrain (обычный негатив),
    коммит 12ab3f85c4 — независимый пересчёт совпал с присланными числами точно. Стык с кейсом B (выдумка
    поля) — по ZAKRYTIE-BRIEF.md §5, подан общей формулировкой без числа (не её зона — кейс C).'
  visual:
    pattern: content
    primary: 'Два кадра рядом текстом (ведро окурков / плакат с рекламой), один столбец «ответ модели»
      (одинаковый), один столбец «вердикт» (разный). Под ними — пара чисел на весь корпус («24 из 25»
      рядом с «1 из 68») и вывод про стык с кейсом B.

      '
    backup: Текст кадров — дословная передача находки PEREDELKA-2026-11-24.md §13.1 и §15.1 (решение владельца
      о определении класса курения, у1′). Пара 24/25 и 1/68 — проверена этой сессией по сырым данным,
      совпала с присланными оркестратором числами. Стык с кейсом B — по ZAKRYTIE-BRIEF.md §5, подан как
      названный случай, не как измеренная частота.
- id: n85
  file: slides/n85-skvoznoe-chislo.md
  type: content
  duration_min: 0.75
  assertion: Из четырёх прямых сравнений дорогого метода с дешёвой опорой два не окупили разницу в цене,
    а два дорогой метод выиграл решительно — и каждый раз исход решала мера, выбранная до замера, а не
    цена метода
  learning_goal: 'Сквозное число закрытия, ПЕРЕСЧИТАНО на числа круга 3 (issue #351). Прежний счёт «3
    из 4» стоял на выводах круга 2, и его основание изменилось: кейс B ушёл из счёта. На 73 строках разрыв
    рассказ–детектор был 6 строк при детекторе на 86,7% своего потолка, и дешёвый выглядел почти равным;
    на 732 строках сравнимая пара (достижение к достижению, протокол stend/zamery-B/README.md § «Словарный
    потолок») — 410 из 732 (56,0%) против 183 из 732 (25,0%), разрыв 31,0 п.п., дорогой выигрывает более
    чем вдвое. Кейс A в счёте остался, разрыв сузился 21 → 13,5 п.п. при цене 34,7× (stend/zamery-A/README.md
    § «Свод»). Числа кейса A переведены на эталон после правки 2026-11-26 (знаменатель 364 → 363, stend/zamery-A/CHISLA-POSLE-PRAVKI-ETALONA.md
    §9): 75,2% против 61,7%. Сторона строки ПРОВЕРЕНА прямым счётом, а не унаследована: правка подняла
    все четыре метода почти поровну, и разница «модель ↔ гибрид» осталась ровно теми же 49 полями — 13,46
    п. до правки, 13,50 после, оба округляются в 13,5. Кратность цены эталона не касается. Вердикт «цена
    не окупилась» и сквозное число «2 из 4» устояли. Четвёртый метод («картинка и распознанный текст вместе»,
    72,5% при цене 34,7× от гибрида) в этот счёт НЕ входит и строкой не добавлен: счёт ставит дорогой
    метод против ДЕШЁВОЙ опоры, а метод 4 стоит столько же, сколько метод 1 (+0,9% цены), — это сравнение
    дорогого с дорогим, и правило счёта к нему неприменимо. Его разбор живёт в главе. Кейс D остался:
    платная ветка смысла 0,475 — худшая из трёх одиночных веток (stend/zamery-D/README.md § «Свод»); ПРОВЕРЕНО
    отдельно — порядок трёх одиночных веток между кругами НЕ изменился (круг 2: 0,447 < 0,553 < 0,658;
    круг 3: 0,475 < 0,525 < 0,717), перевернулась пара ГИБРИДОВ (1+3 против 1+2+3), которой на этом кадре
    нет. Кейс C — корпус курения не трогался, числа 18/134 и 25/134 без изменений (stend/zamery-C/README.md
    § «Класс курение»). Правило счёта названо на кадре по прямому требованию брифа: число зависит от правила,
    и без него оно не проверяемо. Единицы по кейсам РАЗНЫЕ (доля полей, строки разметки, recall@1, сумма
    ошибок) — не усреднены.'
  visual:
    pattern: content
    primary: 'Таблица на 4 строки: кейс | сравнение | что измерили | вердикт. Первые две строки — те,
      что идут в счёт; две нижние — те, где дорогой выиграл. Число «2 из 4» вынесено в ЗАГОЛОВОК — единственное
      место, где оно набирается крупно: тело кадра у сборщика не идёт выше 15 pt, а одиночная короткая
      плашка на полном кадре ужимается до 11,5 pt, то есть МЕЛЬЧЕ соседних. Под таблицей то же число стоит
      первым словом плашки, следом правило счёта; ниже — два изменившихся вердикта и область действия
      счёта.

      '
    backup: 'Все четыре строки сверены построчно с отчётами замеров круга 3, не с брифингом. Пересчёт
      счёта — собственная работа этой сессии: прежнее «3 из 4» считалось по выводам круга 2, два из которых
      отчёты круга 3 пересмотрели. Порядок одиночных веток кейса D проверен отдельно и оказался неизменным.'
- id: n86
  file: slides/n86-mostik-k-s13.md
  type: bridge_forward
  duration_min: 1.25
  assertion: Сегодня, когда архив ошибался, цена падала на процесс — не нашёл, нашёл не то, склеил разное;
