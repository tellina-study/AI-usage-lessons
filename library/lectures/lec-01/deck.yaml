    learning_outcomes: [LO1]
    references: [mistral-7b-2023, deepseek-2025-r1, semianalysis-2025, bloomberg-2025-deepseek, openclaw-2025-steinberger, gerganov-llamacpp-2026]
    visual:
      pattern: 4_episodes_horizontal_timeline
      primary: "4 эпизода по горизонтали: Mistral 7B (Apache 2.0) → DeepSeek R1 ($589B Nvidia drop, gold) → OpenClaw (100K★ stars за квартал, P. Steinberger) → llama.cpp/ggml.ai (Georgi Gerganov, 100K+ stars март 2026, присоединение к Hugging Face)"

  # ─── Раздел 3. Четыре способа реализации (22.5 мин — после удаления s14 в Fix-17) ───
  - id: s10
    file: slides/s10-section3-divider.md
    type: section_divider
    duration_min: 0.5
    assertion: "Раздел 3 — Четыре способа реализации систем с AI"
    learning_goal: "Visual divider — переход в самый большой раздел лекции"
    learning_outcomes: [LO1]
    references: []
    visual:
      pattern: section_divider_with_progress
      primary: "Большое «Раздел 3» + title + 1-фраза-фрейм + roadmap-bar внизу с маркером «Вы здесь»"

