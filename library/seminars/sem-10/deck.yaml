      engines.api.points.300x450_q80_blur0.mean_b64_chars` = 21 546,3 знака; у повторного скана опора
      другая, 20 569,1, и доли по двум задачам расходятся на 1–3 сотых.

      Шесть опорных точек из шести воспроизвели числа замера n68 — сами эти числа на кадре не повторяются,
