      «калькулятор» честно измерен и честно хуже (n30); «числовое поле» снимает риск полностью там, где
      применимо. «Большинство голосов» не добавляет залу ничего, чего не закрыл уже сам эксперимент —
      оставлять её пятым вариантом значило бы тратить карточку на то, что уже решено, вместо новой развилки
      для рассуждения. Полная сводка всех вариантов и их измерений — `stend/refund-case3-all-variants-
      results.json`, раздел `card_majority_vote_REMOVED`.

      Четыре оставшихся — действия, не факты о модели (§5 канона): каждая карточка называет, ЧТО сделать
      с процессом, а не ЧТО умеет или не умеет модель.'
