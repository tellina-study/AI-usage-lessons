      же оговорка: оценка по публичному прайсу OpenRouter, не измеренный факт по этому прогону.

      ПЕРЕСЧЁТ ПОД ОБЪЁМ КЕЙСА (голосовая правка 2026-10-20, issue #274): владелец отдельно потребовал
      «оценка стоимости вызовов моделей должна приводиться именно для нашего кейса а не просто прайс»
      — голый прайс без объёма ничего не говорит о реальном бюджете. Расчёт, строго иллюстративный, с
      явными допущениями на каждом шаге:

      Объём — из n18 (`slides/n18-k2-stsena.md`): Ольга оценивает повторы «примерно 10 раз в день» — это
      её собственная оценка, не измеренная статистика (общий знаменатель заявок в день не замерян). Допущение
