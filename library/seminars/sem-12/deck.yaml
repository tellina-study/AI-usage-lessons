    читала скан верно), `Even Hurwitz`→`Even Huwitz` ДОБАВЛЕН (настоящий промах, виден только на исправленном
    эталоне). Со кадра снят ряд `November 1999` → `November 12, 1999`: он стоял как «модель достроила
    несуществующий день», а на бланке день есть — склейка разметки была неполной (блок `12,` помечен `other`
    и не попал в ответ). Модель там права, и держать её ответ в таблице промахов нельзя. На освободившееся
    место поставлен `Berlind`→`Berland` из того же подтверждённого состава класса. Плашка недетерминированности
    ПЕРЕПИСАНА по существу, а не поправлена цифрой: прежняя говорила «оба раза неверный», и после правки
    эталона это стало ложью. Проверено прогоном грейдера стенда (`score.py::normalize`): `Even-Hurwitz`
    → `evenhurwitz`, исправленный эталон `Even Hurwitz` → тот же `evenhurwitz`, то есть ответ круга n=30
    теперь ЗАЧЁТЕН, а ответ круга n=100 `Even Huwitz` → `evenhuwitz` — нет. Находка от этого сильнее:
    прогон решает не «какую ошибку даст модель», а попадёт она или промахнётся вовсе.'
