  # --- Блок 1. Хук: исполняемый барьер (16 слайдов, 23,0 мин) ---
  - id: s08
    file: slides/s08-divider-khuk-ispolnyaemyy-barer.md
    type: section_divider
    duration_min: 0.5
    assertion: "Ступень 3 — хук: первая из пяти развилок разбирается здесь, потому что производственная дуга проекта уже подвела к нарушенному правилу, а не потому что зал назвал её первой"
    learning_goal: "Разделитель ступени 3 (macro-уровень: gold 5-сегментный прогресс-бар пяти ступеней занятия, сегмент 1 — хук). Тег называет масштаб кейса, не его исход"
    visual:
      pattern: section_divider_macro
  - id: s09
    file: slides/s09-problema-etiket-i-narushenie.md
    type: problem_scenario
    duration_min: 1.0
    assertion: "CLAUDE.md вырос на секцию репозиторного этикета перед показом заказчику — и через несколько минут в той же сессии агент коммитит прямо в main, хотя правило уже записано и загружено"
    learning_goal: "Проблема ступени 3 — сцена на signup-landing, нейтральный тон, исход не предрешён: без вопроса, без карточек, без оценки"
    visual:
      pattern: problem_scenario
  - id: s10
    file: slides/s10-vopros-nevozmozhnym-a-ne-maloveroyatnym.md
    type: reflection_question
    duration_min: 1.0
    assertion: "Выбор из пяти карточек: как сделать нарушение правила невозможным, а не просто маловероятным"
    learning_goal: "Открытый вопрос ступени 3 — вопрос с готовым набором вариантов, БЕЗ цифр, БЕЗ источников, БЕЗ таблицы разбора"
    visual:
      pattern: question_with_option_cards
  - id: s11
    file: slides/s11-svidetelstva-i-chestnyy-probel.md
    type: research_evidence
    duration_min: 1.0
    assertion: "Шесть источников независимо сходятся на одном: правило, записанное только в тексте, обходится или игнорируется — а прямой цифры «как часто» ни один из них не даёт"
    learning_goal: "Свидетельства ступени 3 — таблица источник/тезис/сила доказательства + честный пробел (два смежных исследования, ни одно не отвечает на вопрос слайда)"
    visual:
      pattern: evidence_table_with_gap
  - id: s12
    file: slides/s12-razbor-pyati-kartochek.md
    type: answer_breakdown
    duration_min: 1.25
    assertion: "Из пяти вариантов только один исполняется средой без согласия агента — целевой ответ: хук; формула «правила в промпте — просьбы, правила в коде — законы» держит весь разбор"
    learning_goal: "Разбор пяти карточек ступени 3 — где работает / почему рано / что вместо, целевой ответ выделен"
    visual:
      pattern: answer_breakdown_table
  - id: s13
    file: slides/s13-cobuilding-pretooluse-i-stdin.md
    type: cobuilding
    duration_min: 1.25
    assertion: "Первые три решения хука: проверка до вызова, условие — только команды оболочки, источник знания о команде — JSON на стандартном вводе"
    learning_goal: "Совместное формирование хука ступени 3, вопросы 1–3: PreToolUse, matcher Bash, jq по stdin — фрагменты проявляются по мере ответов зала, готовый JSON целиком не показывается"
    visual:
      pattern: cobuilding_config_reveal
  - id: s14
    file: slides/s14-cobuilding-simvolicheskaya-ssylka-i-sprosit.md
    type: cobuilding
    duration_min: 1.75
    assertion: "Определять ветку — не через rev-parse, который падает на пустом репозитории, а через symbolic-ref; а на «это вообще не git-репозиторий» хук возвращает не тишину и не блокировку, а явный вопрос"
    learning_goal: "Совместное формирование хука ступени 3, вопросы 4–5: реальный контрпример symbolic-ref vs rev-parse на unborn HEAD и кульминационное решение «спросить»"
    visual:
      pattern: cobuilding_config_reveal
  - id: s15
    file: slides/s15-sobranny-khuk-artefakt.md
    type: code_artifact
    duration_min: 1.5
    assertion: "Собранный хук — реальный файл, который действительно исполнялся: три кадра подряд показывают запрет, пропуск и настоящий коммит, а в CLAUDE.md появляется дословное описание барьера"
    learning_goal: "Решение ступени 3 — реальный .claude/settings.json, дерево репозитория, четыре реальных срабатывания и дословная цитата раздела «Хук защиты ветки» из CLAUDE.md"
    visual:
      pattern: code_artifact
  - id: s16
    file: slides/s16-mekhanika-kogda-srabatyvaet.md
    type: mechanics
    duration_min: 1.75
    assertion: "Хук использует одно из тридцати трёх событий жизненного цикла агента — и срабатывает не тогда, когда модель решила вызвать инструмент, а после того, как она уже сформировала его аргументы"
    learning_goal: "Механика ступени 3 — когда срабатывает: 33 события по девяти группам, точная позиция PreToolUse, слияние уровней настроек и приоритет deny"
    visual:
      pattern: mechanics_event_map
  - id: s17
    file: slides/s17-mekhanika-chto-peredaetsya.md
    type: mechanics
    duration_min: 1.75
    assertion: "Хук получает на вход полное описание вызова, а вытаскивает из него одну строку через jq — не текстовым поиском, который сломался бы на экранированных кавычках внутри самой команды"
    learning_goal: "Механика ступени 3 — что передаётся: дословная схема stdin для PreToolUse, почему jq, а не текстовый разбор"
    visual:
      pattern: mechanics_payload
  - id: s18
    file: slides/s18-mekhanika-chto-vozvraschaetsya.md
    type: mechanics
    duration_min: 2.25
    assertion: "Хук отвечает двумя независимыми способами — кодом возврата и JSON, и код 2 блокирует безусловно, даже если тот же хук в JSON написал «разрешаю»; а мусорный ответ молчит четырьмя разными способами, а не одним"
    learning_goal: "Механика ступени 3 — что возвращается: код возврата vs hookSpecificOutput, четыре формы мусора и тишины"
    visual:
      pattern: mechanics_response_contract
  - id: s19
    file: slides/s19-mekhanika-kak-otladitsya.md
    type: mechanics
    duration_min: 2.0
    assertion: "Есть только два принципиально разных тихих отказа, не десяток: сломанный целиком файл настроек виден сразу в интерактивной сессии, а опечатка в одной записи не видна нигде, кроме отладочного лога; три шага проверяют барьер целиком, не только половину"
    learning_goal: "Механика ступени 3 — как отлаживается: инструменты /hooks, --debug-file, doctor; два разных тихих отказа; три шага проверки барьера. Несёт М-1 и входит в счёт strict-in"
    visual:
      pattern: mechanics_debug_toolkit
  - id: s20
    file: slides/s20-proval-odin-obkhod-khuka.md
    type: failure_vignette
    duration_min: 2.0
    assertion: "Самотест ровно этого хука печатает 9 PASS и 5 LIMIT: пять форм одной и той же команды проходят мимо барьера молча — не из-за небрежности паттерна, а потому что оболочка раскрывает слова уже после того, как хук принял решение"
    learning_goal: "Провал ступени 3, слой 1 — прямой обход этого хука: реальный прогон самотеста, таблица форм, структурная причина. Strict-in"
    visual:
      pattern: failure_vignette
  - id: s21
    file: slides/s21-proval-dva-tikhiy-otkaz.md
    type: failure_vignette
    duration_min: 2.0
    assertion: "Хук может отказать тихо даже написанный правильно, может приехать с чужим репозиторием уже скомпрометированным, и в любом случае не видит человека, который набрал команду в обход агента — сработал не значит принудил"
    learning_goal: "Провал ступени 3, слой 2 — тихий отказ, конфигурация как код, слепое пятно к человеку и к субагенту. Несёт М-1/М-2. Strict-in"
    visual:
      pattern: failure_vignette
  - id: s22
    file: slides/s22-kriterii-rano-i-ne-nuzhno.md
    type: criteria_boundary
    duration_min: 1.0
    assertion: "Хук становится тормозом раньше, чем это заметят как ошибку, а полное текстовое перечисление всех форм одной команды не «пока рано» — оно структурно недостижимо"
    learning_goal: "Критерий ступени 3 — «здесь ещё рано» и «здесь не нужно вообще», с явным разведением двух разных вопросов. Strict-in"
    visual:
      pattern: criteria_checklist_and_boundary
  - id: s23
    file: slides/s23-os-zanyatiya-i-samoizoblichenie.md
    type: axis_placement
    duration_min: 1.0
    assertion: "Решаем — правило уже было нарушено, когда мы взялись за барьер; и в репозитории этого же курса лежит незарегистрированный исполняемый хук — точно тот случай, который весь раздел разбирал как «файл есть, барьера нет»"
    learning_goal: "Строка в ось занятия ступени 3 + самоизобличающий живой пример (пустой settings.json курса) + мостик к разделу про скилл. Никогда не режется"
    visual:
      pattern: axis_placement
