deck:
  lecture_number: 2
  title: "Лекция 2. Как работают современные большие модели"
  audience: "3 курс ИУ6 МГТУ Баумана; опытные пользователи LLM, многие ежедневно пишут код с ассистентами"
  duration_min: 100
  central_question: "Рассмотреть, как работает языковая модель, — и разобраться с важными деталями, которые меняют то, как вы строите промпты, агентов и решения."
  learning_outcomes: [LO1, LO4, LO6, LO7]
  language: ru
  status: draft
  version: v3.0
  source: "chapter v2.3 (3 части)"
  plan: "notes/lecture-2-review/final/rework-round2.md"
  total_slides: 47
  curriculum_level: introductory

palette:
  primary_deep: "#21295C"      # Ocean deep — text on light bg, assertions
  primary_mid: "#065A82"       # Ocean mid — headings, accents, primary chart series
  primary_light: "#1C7293"     # Ocean light — icons, borders, motif strokes
  teal: "#028090"              # secondary accent — chart contrast, secondary icons
  gold: "#F0AB00"              # highlight — wow-stat, ≥1× per slide
  surface: "#F4F7FA"           # motif rounded box background
  background: "#FFFFFF"        # default slide background

motif:
  type: ocean_rounded_box
  radius_pt: 12
  stroke: "#1C7293"
  stroke_pt: 1.5
  surface: "#F4F7FA"
  padding_pt: 16
  cast_shadow: false

typography:
  heading_font: "Inter"
  mono_font: "JetBrains Mono"
  fallback_heading: "Arial"
  sizes:
    cover_title: 36
    cover_hero: 60
    slide_assertion: 28
    sub_heading: 20
    body: 16
    caption: 12
    mega_stat: 80

glossary_lock:
  # v3 core — 25 терминов (chat-шаблон/специальный токен ушли в Лекцию 3 вместе
  # с s07; остальное без изменений). Designer/critic enforce no drift.
  # Advanced-optional (chapter-only, без обязательного recall): prefill/decode, RoPE,
  # YaRN, TTFT, speculative decoding, MRL (matryoshka), adaptive thinking / effort, MoE.
  - токен
  - токенизация
  - BPE (Byte-Pair Encoding)
  - эмбеддинг
  - семантическое сходство
  - cosine similarity
  - механизм внимания
  - контекстное окно
  - in-context
  - сэмплинг
  - температура
  - top-p (nucleus sampling)
  - top-k
  - max_tokens
  - авторегрессионный
  - распределение вероятностей
  - слепота к буквам
  - KV-cache
  - prompt caching
  - reasoning-токены (thinking)
  - constrained decoding
  - batch-инвариантность
  - jagged intelligence («рваный интеллект»)
  - glitch-токен
  - mixture-of-experts (MoE, гиганты)

slides:
  # ─── Раздел 0. Введение (6 слайдов, 9.0 мин) ───
  - id: s01
    file: slides/s01-checklist-hook.md
    type: hook
    section: "Раздел 0. Введение"
    duration_min: 2.5
    assertion: "temperature=0 — значит, ответ всегда одинаковый? Да. → Но нет."
    learning_goal: "Мем-хук: двухпанельный мем про temperature=0, без чек-листа и голосования — заманить вопросом, ответ раскроется в разделе про сэмплинг"
    learning_outcomes: [LO7]
    chapter_ref: "§Введение [for-slide-s01]"
    visual:
      pattern: two_panel_meme_poster
      primary: "Афиша-мем на перемену (свой flat-рисунок, Ocean-палитра, hero ≥40% площади): панель 1 — крупный вопрос «temperature=0 — значит, ответ всегда одинаковый?» + уверенный персонаж, под ним крупно «Да.»; панель 2 — тот же персонаж с сомнением, поверх gold «→ Но нет.». Внизу мелко: «почему — сегодня». Без чек-листов, без интерактива."

  - id: s02
    file: slides/s02-cover.md
    type: cover
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Лекция 2. Как работают современные большие модели"
    learning_goal: "Cover — title + lecture number + subtitle под новую структуру (7 разделов)"
    learning_outcomes: [LO1, LO4, LO6, LO7]
    chapter_ref: "§Введение [for-slide-s02]"
    visual:
      pattern: cover_clean
      primary: "Большая «02» в outline gold, title, subtitle «Конвейер инференса — и границы, которые меняют инженерные решения» + hero motif (4-стадийная конвейер-иконка). Без roadmap-bar (карта — s02a)."

  - id: s02a
    file: slides/s02a-lecture-map.md
    type: roadmap
    section: "Раздел 0. Введение"
    duration_min: 0.5
    assertion: "Карта лекции — 7 разделов"
    learning_goal: "Карта маршрута по конвейеру инференса + новый раздел «Виды и размеры моделей»"
    learning_outcomes: [LO1]
    chapter_ref: "§Карта главы [for-slide-s02a]"
    visual:
      pattern: lecture_roadmap_7_sections
      primary: "7 горизонтальных карточек (0 Введение / 1 Токенизация / 2 Эмбеддинги / 3 Внимание / 4 Сэмплинг / 5 Виды и размеры моделей / 6 Финал) с однострочными описаниями; активный Раздел 0 — gold-обводка. Без чипов, без минут, без ссылок на утверждения чек-листа."

  - id: s03
    file: slides/s03-recap-lec1.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1.5
    assertion: "Объект сегодня — слой «модель» из четырёх слоёв Лекции 1"
    learning_goal: "Объект рассмотрения (слой «модель» в 4-слойной картине Lec-1) + bridge к внутренностям инференса"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s03]"
    visual:
      pattern: layers_recap_with_zoom
      primary: "Слева — nested layers из Lec-1 (модель → чат → агент → приложение), нижний слой «Модель» в gold. Справа — 2 строки: «Слой „модель“: stateless-инференс» → «Сегодня: разбираем, что внутри этого инференса»."

  - id: s04
    file: slides/s04-central-question.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 1.5
    assertion: "Цель лекции: рассмотреть, как работает языковая модель, — и разобраться с деталями, которые меняют инженерные решения"
    learning_goal: "Цель лекции + промисы лекции по новой 7-разделной структуре"
    learning_outcomes: [LO1, LO7]
    chapter_ref: "§Введение [for-slide-s04]"
    visual:
      pattern: central_question_with_promises
      primary: "Цель лекции крупно (28–32pt bold #21295C). Под ней — 7 компактных промис-чипов (по разделу лекции, без M-кодов): «почему исправленный strawberry ничего не доказывает», «почему промпт с ролью реально меняет ответ», «что на деле умеет окно 1M», «почему T=0 не даёт одинаковых ответов», «сколько стоят невидимые токены», «маленькая модель / гигант — по какому критерию выбирать», «чем заменить веру в бенчмарки». Gold-маркер на «важными деталями»."

  - id: s04b
    file: slides/s04b-keystone-pipeline.md
    type: assertion_visual
    section: "Раздел 0. Введение"
    duration_min: 2.5
    assertion: "Поток данных в LLM: слова → токены → векторы → LLM → векторы → токены → слова"
    learning_goal: "Keystone: 7-стадийный inference-конвейер целиком до первого погружения; повторяется прогрессом на всех дивайдерах"
    learning_outcomes: [LO1]
    chapter_ref: "§Введение [for-slide-s04b]"
    visual:
      pattern: pipeline_7_stages_horizontal
      primary: "Горизонтальный 7-стадийный конвейер: Текст → Токены → Векторы → LLM (gold center) → Распределение → Токен → Текст; под каждой стадией короткая подпись. Петля авторегрессии: стрелка от [Токен] назад ко входу с подписью «токены генерируются по одному; каждый добавляется ко входу». Под конвейером — 4 подкарточки Раздел 1/2/3/4 со стадиями, которые они разбирают. Gold callout: «слова — только на границах; внутри — векторы»."

  # ─── Раздел 1. Токенизация (7 слайдов, 15.0 мин; s07 удалён → Лекция 3) ───
  - id: s05a
    file: slides/s05a-section1-divider.md
    type: section_divider
    section: "Раздел 1. Токенизация"
    duration_min: 0.5
    assertion: "Раздел 1 — Токенизация: как модель видит ваш текст"
    learning_goal: "Divider: вход в стадию 1 конвейера"
    learning_outcomes: [LO1]
    chapter_ref: "§1"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "Большое «Раздел 1» (140pt gold), под ним «Токенизация», frame-фраза «Как модель видит ваш текст», tag «3 разбора · 3 провала». Внизу — мини-конвейер из s04b со стадией «Токены» в gold-подсветке (без текстовых маркеров, без минут). Маленькая иллюстрация «нож режет слово» (свой flat-рисунок, угловое размещение)."

  - id: s05
    file: slides/s05-what-is-token.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Токен — id из словаря модели. Не буква и не слово; статистически частая подпоследовательность"
    learning_goal: "Фиксация точного определения токена (темп ×2 — аудитория знает приблизительно)"
    learning_outcomes: [LO1]
    chapter_ref: "§1.1 [for-slide-s05]"
    visual:
      pattern: token_examples_3_cases
      primary: "3 примера разметки: cat → [cat], tokenization → [token][ization], клубника → [к][луб][ника] (o200k_base). Gold callout: «1 токен ≈ 4 символа EN ≈ 2 RU». Caption: словарь и модель — два разных артефакта."

  - id: s06
    file: slides/s06-bpe-compromise.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2.5
    assertion: "BPE — компромисс между алфавитом и словарём; словарь строится один раз перед обучением"
    learning_goal: "BPE + инженерная деталь «строится один раз / выборка на инференсе» + вендоры считают текст по-разному"
    learning_outcomes: [LO1, LO6]
    chapter_ref: "§1.2 [for-slide-s06]"
    visual:
      pattern: before_after_no_iteration
      primary: "Две колонки: обучающий корпус «low / lower / newest / widest» → BPE-словарь «low / er / new / est / wid». Gold callout: «словарь строится один раз до обучения; на инференсе — выборка готовых правил». Caption: разные вендоры режут один текст по-разному."

  - id: s08
    file: slides/s08-strawberry-2026.md
    type: case_study
    section: "Раздел 1. Токенизация"
    duration_min: 3
    assertion: "Гонка патчей: strawberry починили в апреле, cranberry — только в июле; класс задачи остаётся проблемным"
    learning_goal: "Механизм слепоты к буквам (быстро — мем знаком) + диагноз 2026: точечные патчи вместо навыка + jagged intelligence"
    learning_outcomes: [LO6, LO7]
    chapter_ref: "§1.4 [for-slide-s08]"
    visual:
      pattern: case_split_with_timeline
      primary: "Слева компактно — механизм: strawberry → [st][raw][berry], модель видит 3 токена, не 10 букв. Справа — временная шкала гонки патчей: GPT-5.2 (дек 2025) strawberry ✗; GPT-5.5 (апр 2026) strawberry ✓ / cranberry ✗; GPT-5.6 (июль 2026) cranberry ✓ (gold); StrawberryBench — 847 вопросов, 7 уровней. Внизу callout «рваный интеллект» + строка «Что делать»: тестируйте cranberry своей предметки; вирусное прохождение ≠ навык."
    interaction: retrieval_live_attempt   # cranberry на актуальных моделях, live
    verify_day_of: true

  - id: s09
    file: slides/s09-numbers-and-code.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2.5
    assertion: "Токенизатор режет по частоте, а не по структуре: числа — чанками по 3 цифры, код — целыми отступами"
    learning_goal: "Числа и код как второй/третий случай расхождения нарезки со структурой; формат compact comparison (не case-study, чтобы не дублировать s08)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.5 [for-slide-s09]"
    visual:
      pattern: two_column_compare
      primary: "Строка-мотивация: числа и код — самые частые «нетекстовые» входы. Колонка «Числа»: 1000000 → [100][000][0] — чанки слева направо ≠ разряды (справа налево); right-to-left нарезка улучшает арифметику, спецсхемы до +33% (gold). Колонка «Код»: GPT-2 — 16 токенов на отступ; GPT-4 — пробелы группами. Внизу блок «Что делать»: разделители разрядов, вычисления в инструмент, единообразные отступы + строка про авто-роутинг счёта в code interpreter у готовых чат-продуктов."

  - id: s10
    file: slides/s10-glitch-tokens.md
    type: assertion_visual
    section: "Раздел 1. Токенизация"
    duration_min: 2.5
    assertion: "Порядка 4% словаря — glitch-токены: словарь строится отдельно от модели, и часть записей остаётся недообученной"
    learning_goal: "Glitch-токены: от анекдота SolidGoldMagikarp к системному свойству конвейера (GlitchMiner 2026)"
    learning_outcomes: [LO6]
    chapter_ref: "§1.6 [for-slide-s10]"
    visual:
      pattern: anecdote_to_mechanism
      primary: "Слева — компактная story-карточка (свёрнута): SolidGoldMagikarp (2023) + одна строка механизма: корпус словаря ≠ корпус модели → эмбеддинг у случайной инициализации. Центр/справа — расширенный блок «На что влияет на практике»: сбои парсинга экзотических строк, прод-риски (логи, user-generated ID), диагностика плейсхолдером, санитизация входа. Факт-карточка GlitchMiner (AAAI 2026): «порядка 4% словаря» (gold), воспроизводится в Llama, Qwen, Gemma, Phi-3, Mistral. Footer: системная особенность конвейера, не баг версии."

  - id: s11
    file: slides/s11-language-cost.md
    type: comparison
    section: "Раздел 1. Токенизация"
    duration_min: 2
    assertion: "Один и тот же текст по-русски стоит ≈2× дороже английского; o200k сократил разрыв на треть, но не убрал"
    learning_goal: "Стоимость языков + динамика 2024–2026 + следствия для chunking/max_tokens"
    learning_outcomes: [LO6]
    chapter_ref: "§1.7 [for-slide-s11]"
    visual:
      pattern: bar_chart_tokens_per_char
      primary: "Bar chart токены/символ: EN ~0.25, RU ~0.5 (gold), ZH ~0.8, Python ~0.4. Строка динамики: o200k_base — примерно −35% нелатинским, разрыв сокращается, но не исчезает. Внизу — блок «Что делать»: калибруйте лимиты в токенах на своём языке (фрагменты, max_tokens, окно); пакетная обработка — оцените перевод на английский (≈2× дешевле)."

  # ─── Раздел 2. Эмбеддинги (6 слайдов, 11.0 мин) ───
  - id: s12a
    file: slides/s12a-section2-divider.md
    type: section_divider
    section: "Раздел 2. Эмбеддинги"
    duration_min: 0.5
    assertion: "Раздел 2 — Эмбеддинги: пространство смыслов"
    learning_goal: "Divider: вход в стадию 2 конвейера"
    learning_outcomes: [LO1]
    chapter_ref: "§2"
    visual:
      pattern: section_divider_pipeline_progress
      primary: "Большое «Раздел 2» (140pt gold), под ним «Эмбеддинги», frame-фраза «Пространство смыслов — и граница похожести», tag «4 разбора · 1 провал». Внизу — мини-конвейер со стадией «Векторы» в gold-подсветке (без текстовых маркеров, без минут). Маленькая иллюстрация «карта смыслов» (свой flat-рисунок, угловое размещение)."

  - id: s12
    file: slides/s12-what-is-embedding.md
    type: assertion_visual
