  visual:
    pattern: question_with_option_cards
    primary: 'At the top, in a quiet form — a line about your own experience: who has already driven a
      task through all at once and with what exactly. Below it, a gold box centered, carrying the choice
      verbatim, with the overline "· QUESTION". Five cards of equal width at the bottom, none of them
      highlighted.'
    backup: 'Owner''s round 5 (issue 225, ZADANIE-KRUG-5.md): "it''s not only subagents there, after all".
      The former four cards ("change nothing", "merge the three edits into one assignment", "first check
      the dependency, then one role call per edit", "always parallelize") are removed: all four were variations
      on a single means — the number of subagents — and admitted no conversation about other means at
      all. The new five were named by the owner verbatim: pieces one at a time · several sessions · roles
      all at once · the repeating part into a check that runs itself · narrow the task down. There remains
      one vote per case and it stays on n40 — the seminar''s fifth vote, its position in the deck did
      not change (CUT-ORDER.md, the protected list). The honesty of the single choice is preserved by
      a technique from the second roast: the card is asked for together with the piece, so the whole answer
