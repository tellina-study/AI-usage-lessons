      '
    backup: 'Форма карточки — круг 3, находка владельца «сформулируй по подходу»; раскладка в три такта
      согласована с сессией кейса C, чтобы у занятия была одна форма вопроса. Имена моделей — `stend/zamery-D/README.md`,
