      Кейс 5 (n60, n60a) — `stend/zamery-k5-povtorno/README-fewshot-desc.md`: вопрос-граница — few-shot
      0 из 10 верно (10 из 10 — одна и та же ошибка), описание границы прозой — 10 из 10 верно; второй
      вопрос (комбинация пунктов базы) — few-shot снова 0 из 10, описание — 6 из 10 верно без самопротиворечия
      (не 10 из 10, как на первом вопросе — эффект приёма не универсален).

      Кейс 6 (n70, n71) — `stend/zamery-k5-k6/README.md`, Замер 4.1, честный повтор 2026-10-27 после починки
      протечки промта (issue #299; 5 повторов на каждое из 6 разрешений одного файла): сумма — 25 из 30,
      верно на пяти разрешениях из шести, ломается на последнем (53×64 px, высота цифры 1,5 px, 0 из 5);
      дата — верна на трёх крупных разрешениях (до 424×518, собственная высота цифры даты 5,8 px), 0 из
      15 на трёх самых мелких разрешениях.

      ПОЧЕМУ НЕ РЕЙТИНГ: N у всех шести разный (15, 8, 20, 2-6, 10, 30), задача разная (ответ клиенту
      / структурирование базы / проверка ответа / защита поля / повтор ответа / чтение фотографии), базовая
      линия разная (есть кейсы без собственного «нуля» для сравнения). Сортировка процентов по убыванию
      была бы ровно той нечестной сверткой, которую БРИФ §2 и Baseline/Counterfactual Mandate запрещают
      — на кадре её нет: строки идут по порядку кейсов занятия (1→6), не по числу.

      ЧЕСТНЫЙ ВЫВОД ПРОВЕРЕН ПРОТИВ ВСЕХ ШЕСТИ, не выдуман (пересчитан после честного повтора Кейса 6,
      issue #299, 2026-10-27): во всех шести разборах решение, оставленное внутри текста, который модель
      сама пишет о себе (самооценка уверенности — Кейс 1, промт-инструкция — Кейс 2 и Кейс 4, демонстрация
      примером — Кейс 5, второй вызов той же модели как судья — Кейс 3), ни разу не дало безошибочного
      результата. Решение, вынесенное туда, где его проверяет что-то кроме текста модели (код — Кейс 3,
      то же правило, посчитанное кодом, — Кейс 4, прямое описание вместо примера — Кейс 5 на первом вопросе),
      безошибочным было три раза из шести измерений. Кейс 6 (прямое измерение точности чтения суммы по
      шести разрешениям) тоже выносит сигнал за пределы самоотчёта модели — но после честной починки промта
      и он не безошибочен: 25 из 30, не 30 из 30. ОГОВОРКА ВНУТРИ ВЫВОДА ОБЯЗАТЕЛЬНА и стоит на кадре:
      вынесенный приём снижает ошибку, но не гарантирует её отсутствие — комбинация код+судья (Кейс 3)
      просела до 85%, описание (Кейс 5) на втором вопросе дало уже не 10, а 6 из 10, а сумма Кейса 6 после
      честного повтора — 25 из 30, не 30. Кейс 2 в этот вывод не укладывается ни одной стороной: там ни
      один из пяти способов, включая попытки вынести правило из прозы в явную условную форму, не почистил
      ошибку — честно названо как шестой, не подтверждающий случай, а не спрятано.'
