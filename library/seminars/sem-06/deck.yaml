- id: n50
  file: slides/n50-divider-dve-sessii-odna-papka.md
  type: section_divider
  duration_min: 0.5
  assertion: Сессий у вас уже несколько, а исполнителей в одной папке почти всегда больше одного — и это
    нормально. Отдельную копию репозитория вы дадите сессии сразу и захотите дать субагенту. Поле изоляции
