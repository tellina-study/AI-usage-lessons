# Доступ наружу и урезанная роль
# Файл СОБРАН генератором: python3 rendered/make_deck_yaml.py
# Поля слайдов — из фронтматтера самих слайдов; правьте слайд, а не этот файл.
#
# Хронометраж по блокам (считан, не переписан):
#   Мостик     n01–n05    5.75 мин
#   MCP        n06–n35   38.50 мин
#   Субагент   n36–n64   34.00 мин
#   Сборка     n65–n68    6.00 мин
#   ИТОГО                  84.25 мин при слоте 90

deck:
  seminar_number: 6
  title: Доступ наружу и урезанная роль
  audience: 3 курс, 09.03.01 — практикующие инженеры, все пользуются ИИ-ассистентами
  duration_min: 84.25
  format: слайды фасилитатора + открытые вопросы с карточками (вопрос ДО разбора) + совместная сборка
    артефакта + механика на примерах; живого терминала нет
  cover_hook: Агент не поглупел — так что же перестало помещаться?
  central_question: 'Работа вышла за контекст агента — что вы заводите первым: приносите внутрь то, чего
    внутри нет, или выносите наружу то, что внутрь не помещается?'
  language: ru
  slide_count: 68
  axis: Две закрытые строки оси — хук и скилл — работают внутри репозитория; две пустые, которые закрываются
    сегодня, обе про его край
  slot_min: 90
slides:
- id: n01
  file: slides/n01-oblozhka-dostup-naruzhu-i-urezannaya-rol.md
  type: hero_cover
  duration_min: 0.75
  assertion: Агент, который знал про проект всё, начинает промахиваться — работа вышла за край его контекста;
    занятие разбирает два противоположных хода, которыми этот край раздвигают, и цену каждого
  learning_goal: 'Завязка, не оглавление: занятие открывается промахом на том самом проекте, который зал
    собрал на прошлых двух занятиях, с названной ценой. Вопрос занятия здесь НЕ задаётся — он прозвучит
    на n04, после второго промаха, когда нехватка уже почувствована'
  visual:
    pattern: hero_cover
    figure: ramka-n01-hero-sem06.png
    primary: 'Тёмный Ocean-фон, тот же приём, что у обложки прошлого занятия. Крупный заголовок, под ним
      две строки: сначала тихой репликой — что случилось на этой неделе, следом в золотой коробке — короткий
      вопрос-загадка, на который занятие отвечает в ближайшие три минуты. Вопрос занятия на обложке не
      стоит вовсе (он на n04). Нижняя треть во всю ширину — hero-схема (≥40% площади слайда): слева пунктирная
      карточка «контекст агента» с двумя строками внутри — «репозиторий» и «разговор с вами» — и подписью
      снизу «дальше агент не видит ничего»; от неё две стрелки к двум белым карточкам справа: «данные
      снаружи — MCP» и «своя роль, урезанные права — субагент». Под этой парой — ряд из четырёх сегментов:
      первые два (хук, скилл) залиты приглушённым серым с подписью «закрыты в прошлый раз», следующие
      два (MCP, субагент) залиты gold с подписью «решаем сегодня».

      '
    backup: 'Схема рисуется программно (тот же рендерер фигур, что строил иллюстрацию прошлого занятия)
      — не фотография и не скриншот. Это законный путь для hero-иллюстрации: схема, нарисованная кодом,
      не выдаёт себя за внешний источник и ничего не подделывает, в отличие от стилизованной карточки
      с подписью вместо настоящего изображения. Четыре сегмента нижнего ряда — это ось занятия (см. n03/n65),
      не отдельная придумка: тот же порядок строк, что на оси и на карте.

      Круг правок владельца (issue 225, §А2): прежняя иллюстрация («сообщение» против «факта») снята целиком
      вместе с вопросом, который она держала. Ряд оси сокращён с пяти сегментов до четырёх (§А1): процесс
      со схемы снят, лестница занятия — хук · скилл · MCP · субагент.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 3 — «открытие это оглавление,
      а не завязка»; правило П2 — «в каждом кейсе есть человек и цена»). Обложка несла вопрос занятия
      и больше ничего: зал получал вопрос до того, как почувствовал нехватку, и первые пять слайдов рассказывали
      устройство занятия. Теперь обложка несёт ПЕРВЫЙ ПРОМАХ сквозной истории: тот же проект, тот же разработчик,
      агент отвечает уверенно и мимо, потому что часть правды лежит вне репозитория; цена названа прямо
      (сорванный срок и разговор с заказчиком). Вопрос занятия перенесён на n04 — туда, где к нему уже
      есть два промаха с противоположными причинами. На обложке вместо него — короткий вопрос-загадка,
      который и есть завязка: агент не поглупел, так что же перестало помещаться.

      Механика вёрстки: `g_cover` раскладывает строки блока-цитаты по признаку «кончается вопросительным
      знаком» — такие идут в золотую коробку, остальные в тиховую реплику с тиловой полосой. Поэтому реплика
      и вопрос стоят ОТДЕЛЬНЫМИ блоками, каждый со своей парой кавычек: при наивном делении одной цитаты
      пополам открывающая « осталась бы в одной рамке, закрывающая » в другой (живой случай n04/n67 из
      той же сборки).

      Что следом за этим идёт у других сессий: `make_deck_yaml.py` тянет `deck.central_question` из вопроса
      в золотой коробке ОБЛОЖКИ. После этой правки там стоит вопрос-загадка, а не вопрос занятия; расхождение
      названо прямо, решение — за сессией сведения.

      Трекер здесь намеренно НЕ назван. Первый промах говорит только «не в репозитории»: механизм — трекер
      заказчика и ручной перенос несколько раз в неделю — предъявляет сцена первого кейса (`n10`), и повтор
      съел бы её.'
- id: n02
  file: slides/n02-gde-my-ostanovilis.md
  type: code_artifact
  duration_min: 1.25
  assertion: 'Четыре вещи уже есть в репозитории: хук подтверждён коммитом, скилл остаётся только планом,
    файл инструкций вырос, документационный слой с решениями на месте — и все четыре лежат внутри, поэтому
    агент и держал проект целиком'
  learning_goal: 'Состояние репозитория, прочитанное с экрана, а не восстановленное по памяти о прошлом
    занятии: что подтверждено коммитом, что только запланировано. Второй работой слайд объясняет промах
    с обложки: всё перечисленное лежит ВНУТРИ, и пока работа была здесь, агент не промахивался. Сюда же
    поставлен единственный вопрос «к себе» в открытии'
  visual:
    pattern: state_cards
    primary: 'Ведущая строка про то, с какой точки занятие продолжается. Под ней — светлая таблица-коробка
      на четыре строки, не тёмный терминал: «хук» (коммит есть), «скилл» (только план, коммита нет), «CLAUDE.md»
      (строк и разделов стало больше), «DECISIONS.md» (документационный слой, без изменений). Внизу подписью
      во всю ширину — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.2, проверено прямым чтением дерева (`ARCHITECTURE.md`
      §3): `.claude/settings.json` и `.claude/hooks/selftest-branch-guard.sh` подтверждены коммитом `9803643`;
      `.claude/skills/deploy/SKILL.md` существует только в плане раздела скилла, коммита у него нет; `CLAUDE.md`
      подрос с 24 строк / 4 разделов до 40 строк / 5 разделов — подтверждено коммитом; `DECISIONS.md`
      — часть документационного слоя репозитория с Семинара 4 (`sem-05/ARCHITECTURE.md` §2), в прошлое
      занятие не менялся и здесь показан без изменений — то, что уже заведено, не теряется между занятиями.
      Круг правок владельца (issue 225, §А2 карты): прежняя форма слайда — моноширинный листинг двух версий
      репозитория одна под другой в тёмном код-блоке — заменена на светлую таблицу; упоминание о том,
      что хук и CLAUDE.md лежат отдельно от того, что увидит любой, кто просто клонирует репозиторий,
      — снято со слайда целиком, это внутренняя деталь git-истории, а не состояние, которое читает инженер,
      открывший проект. Таблица показывает четыре вещи как они есть сейчас, без пояснения, где именно
      в истории репозитория каждая лежит.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 3 + правило П5). Таблица
      и её честные метки сохранены без единой правки — они работают. Изменились две вещи. Подпись-итог:
      вместо перечисления четырёх строк («хук подтверждён коммитом, скилл остаётся планом…»), которое
      таблица и так читает сама, она теперь называет ОБЩЕЕ у этих четырёх строк — все лежат внутри репозитория,
      — и тем объясняет промах с обложки. И сюда же поставлен единственный за открытие вопрос «к себе»
      (правило П5): держит ли агент слушателя его собственный рабочий проект целиком. Он стоит на второй
      минуте намеренно — дальше зал смотрит материал, уже примеряя его к своему репозиторию.

      Ревизия (issue 225, круг 2, сверка слайда с разделом): исходная форма «карточек» — отдельные блоки
      `**Название**` + путь + статус, разделённые пустой строкой — не распознаётся разборщиком `slide_parts.py`
      как отдельные карточки (формат `cards` там — ОДНА строка, пункты через «·» с обратными кавычками,
      не абзацы через пустую строку); такой текст схлопывался в один слитный жирный абзац без переносов,
      что прямо противоречило описанию «четыре отдельные карточки» в этом же `backup`. Заменено на таблицу
      («Ступень» / «Путь или артефакт» / «Статус») — ту же форму, что уже рендерится корректно на `n03`/`n65`
      этого занятия; факты не изменились.'
- id: n03
  file: slides/n03-os-dve-stroki-zakryty.md
  type: recap_table
  duration_min: 1.25
  assertion: Две закрытые строки оси — хук и скилл — работают внутри репозитория; две пустые, которые
    закрываются сегодня, обе про его край
  learning_goal: 'Контрольная точка, с которой занятие продолжается: та же таблица, что закрыла прошлое
    занятие, дословно, без изменений в заполненных строках. Поворот открытия — прочитать её по новому
    признаку: обе закрытые ступени живут внутри репозитория, обе пустые про его край'
  visual:
    pattern: recap_table
    primary: 'Светлый фон и коробка-таблица, не сетка PPTX. Таблица на четыре строки: две верхние (хук,
      скилл) заполнены целиком, две нижние (MCP, субагент) — пунктирные пустые слоты. Две содержательные
      колонки — «что делает» и «что не делает / ограничение» — плюс короткая колонка «предотвращаем /
      решаем». Внизу подписью — единственная подпись слайда.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.3. Формулировки двух заполненных строк несут тот
      же факт, что таблица, закрывшая прошлое занятие (файл `os-dve-stroki-zakryty.md` деки Семинара 5),
      — зал видел содержание в конце прошлого занятия, менять его здесь нет оснований. Круг правок владельца
      (issue 225, §А5): колонки «что обещает устройство» / «что показала проверка» заменены на «что делает»
      / «что не делает — ограничение» — прежняя форма читалась размыто. Строка «процесс» снята полностью
      (§А1): лестница занятия — хук, скилл, MCP, субагент, четыре ступени, не пять. Порядок строк — хук,
      скилл, MCP, субагент — тот же, что на вопросе следующего слайда и на карте занятия; не меняется,
      на этом совпадении держится возврат вопроса в блоке 3. Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`,
      причина 3). Таблица, обе заполненные строки и порядок строк не тронуты ни на знак — они проверены
      и защищены. Изменились заголовок и подпись-итог: прежние («Две строки закрыты» / «Две строки закрыты.
      Сегодня закрываются ещё две.») считали строки, и слайд читался как пункт оглавления. Теперь они
      называют ПРИЗНАК, по которому две закрытые строки отличаются от двух пустых: закрытые работают внутри
      репозитория, сегодняшние — про его край. Это и есть поворот открытия: тот же экран, прочитанный
      по новому признаку, и из него прямо следуют два противоположных хода занятия. Содержание таблицы
      при этом ровно то же, что закрыло прошлое занятие.

      Вторая прожарка (issue 225, P1-3 — «золотой акцент отсутствует на n03, по PNG 0 золотых пикселей»):
      закрывающая строка была обёрнута в « », что по правилам `quote_role()` в `build_sem06.py` рисует
      её тихой репликой докладчика (тиловая полоса), а не формулой-итогом, хотя это и есть единственная
      подпись-итог слайда. Кавычки сняты: у приёма `recap_table` роль по умолчанию не назначена в `PATTERN_ROLE`,
      поэтому без « » строка попадает в формулу (золотая планка) автоматически, без правки кода сборщика.
      Текст строки не менялся ни на знак.'
- id: n04
  file: slides/n04-vopros-dva-promaha-prichiny-protivopolozhnye.md
  type: reflection_question
  duration_min: 1.25
  assertion: 'Два промаха за неделю, причины противоположные: первого не было внутри вовсе, второе влезло
    внутрь целиком и вытеснило работу — отсюда вопрос занятия, который прозвучит сегодня дважды'
  learning_goal: 'Вопрос занятия задаётся ПОСЛЕ того, как нехватка почувствована: на экране оба промаха
    сквозной истории рядом, с противоположными причинами. Из этой противоположности прямо следуют два
    хода занятия — поэтому блоки дальше читаются как два ответа на один вопрос, а не как две темы подряд'
  visual:
    pattern: reflection_question
    primary: 'Таблица на две строки — два промаха одной недели, рядом с каждым его причина. Строки намеренно
      противоположны: у первой причина «внутри этого нет вовсе», у второй «всё нужное внутрь влезло и
      вытеснило работу». Под таблицей — сам вопрос занятия, дословно, крупно, в gold-рамке. Карточек-вариантов
      нет: голосование из вариантов здесь не повторяется.

      '
    backup: 'Источник: `rework/block-0-mostik.md` §A.4.

      Круг правок владельца (issue 225, §А2): прежний вопрос («сервер сообщает "подключён", роль сообщает
      "сделано" — чем это отличается от факта») снят целиком вместе с аркой достоверности, которую он
      держал. Несущая мысль, принятая тогда: часть работы агента требует данных снаружи, часть — отдельного
      исполнителя с урезанным контекстом и правами.

      Пересмотр по сторителлингу (issue 225, `PERESMOTR-STORITELLING.md`, причина 3 «открытие — оглавление,
      а не завязка» + правила П1 «у каждого кейса свой поворот» и П2 «человек и цена»). До этой правки
      слайд повторял своими словами то, что обложка уже сказала целиком, и задавал вопрос в пустоту —
      зал ещё ничего не потерял. Теперь на экране оба промаха сквозной истории: первый прозвучал на обложке,
      второй предъявляется здесь, и рядом стоят их причины. Поворот раздела — в том, что причины ПРОТИВОПОЛОЖНЫ:
      «не помещается» означает две разные вещи, и лечатся они встречными ходами. На этой противоположности
      держится карта занятия (n05) и весь порядок блоков.

      Формулировка вопроса переписана (прежняя: «Агент видит только то, что лежит в репозитории и в разговоре
      с вами. Где заканчивается этот контекст — и что вы заводите первым: доступ наружу или отдельного
      исполнителя с урезанными правами?»). Две причины. Первое предложение прежнего вопроса теперь показано
      сценой, а не произнесено отвлечённо. Второе называло два хода по их устройству («доступ наружу»,
      «урезанные права») — новая формулировка называет их по направлению («принести внутрь то, чего внутри
      нет» / «вынести наружу то, что внутрь не помещается»), и в этой паре слышно, что это два ответа
      на один вопрос. Правило «вопрос не называет MCP и субагента по имени» сохранено: имена вводит карта
      занятия следом и база каждого блока.

      ПЕТЛЯ: вопрос предъявляется дословно второй раз в блоке 3 (`n67`) — на совпадении формулировки держится
      возврат. После этой правки `n67` и `block-3-os.md` §A.3 несут ПРЕЖНИЙ текст и обязаны быть приведены
      к новому знак в знак; это зона сессии закрытия, здесь она не правится, расхождение названо прямо.

      Механика вёрстки: `g_question` делит блок-цитату на сцену и вопрос по первому предложению с вопросительным
      знаком. Поэтому вопрос записан ОДНИМ предложением — иначе его первая половина («работа вышла за
      контекст агента») уехала бы в тихую реплику, а в золотую коробку попал бы огрызок.'
- id: n05
  file: slides/n05-karta-dva-bloka-dva-otveta-na-odin-vopros.md
  type: lecture_map
  duration_min: 1.25
  assertion: 'Два блока — два встречных ответа на один вопрос: принести внутрь то, чего внутри нет, и
