    действий, а типы ОШИБКИ, обнаруженные в самих данных замера после пересборки вопросов 2026-11-02 (issue
    #311).'
  visual:
    pattern: measured_outcome_table
    primary: 'Две таблицы примеров подряд, каждая — своя систематическая ошибка: (1) keyword не находит
      документ из-за падежных форм, повторяется на любом размере базы; (2) vector на 500 документах находит
      содержательно уместный, но формально неверный абзац той же статьи. На каждой строке — вердикт НЕВЕРНО,
      под каждой таблицей — вывод.

      '
    backup: 'Оба примера — дословно из `stend/raw/case1-results.json` (поле `details`) и `corpus/corpus_case1.json`
      (тексты документов), без изменения ответов модели.

      Ошибка 1 (q4, q10 — keyword): `retrieved_doc_id` НЕ совпадает с `gold_doc_id` на ВСЕХ четырёх размерах
      базы одинаково, включая размер 10, где дистракторов вообще нет — значит причина не в масштабе базы,
      а в самом методе сравнения. q4: вопрос «палеонтологами... Элдриджем и ...Гулдом» (творительный падеж)
      против документа «палеонтологи Элдридж и Гулд» (именительный) — пересечение с верным документом
      needle-4 всего одно слово («году»); keyword нашёл needle-2 (про Моцарта, не по теме) — тоже одно
      общее слово («году»), случайное совпадение на бытовом слове; при равном счёте keyword взял не тот
      документ. q10: вопрос «модель системы мира... взята за основу» против документа needle-10 «кеплеровская
      система мира основана на модели Коперника» — пересечение с верным документом одно слово («мира»);
      keyword нашёл needle-3 (про марафон) — там совпали ДВА слова, «модель» (из фразы «всю модель подготовки»)
      и «мира» (из фразы «чемпионаты мира»), перевес 2 против 1 увёл выбор в сторону от верного документа.

      Ошибка 2 (q3 — vector, только на 500 документах): золотой документ needle-3 про марафон; на 500
      документах vector вместо него находит `distractor-237` — судя по общей сноске [17] в обоих текстах,
      вероятно, соседний абзац ТОЙ ЖЕ статьи Википедии про марафон, который содержит буквальный численный
      ответ («результат ухудшается... при температуре выше 14—16°C»), в отличие от needle-3, где факт
      сформулирован обобщённо («высокая температура... не позволяет показывать наилучшие результаты»).
      Модель ответила уверенно и содержательно разумно, но по эталонной разметке — неверно. На этом же
      вопросе keyword нашёл ПРАВИЛЬНЫЙ документ (needle-3), но модель всё равно ответила «нет информации»
      — потому что буквального числа в найденном тексте не было, он лежал в соседнем абзаце, который в
      этом прогоне достался distractor-237.

      МЕТОДОЛОГИЧЕСКИЙ ВЫВОД (говорить вслух, не прятать): на масштабе 500 документов часть «дистракторов»
      SberQuAD на самом деле — соседние абзацы той же статьи, что и needle-документ. Формально единственный
      `gold_doc_id` не означает, что остальной корпус по теме нерелевантен; метрика recall@1 против одного
      эталона здесь недооценивает то, что поиск нашёл содержательно уместный текст — просто не тот конкретный
      абзац, где лежит цифра.'
