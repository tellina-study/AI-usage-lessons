# library/lectures/lec-03/deck-part3.en.yaml  —  EN translation (issue #172), PART 3 of 3
#
# Continuation of the English deck for Lecture 3 (v6.3-en, 67 slides).
# THIS FILE — slides s18..s31 (Section 4. Agents + Section 5. The decision
# framework) + totals + metrics. Header / palette / motif / glossary and
# slides s01..s-task-extract (Section 0 + Section 1) are in deck.en.yaml;
# slides s09..s16 (Section 2 + Section 3) are in deck-part2.en.yaml.
#
# ORDER NOTE (#204): s21 sits BEFORE s19/s19b/s20 here, because that is the
# order the deck actually renders in (rendered/build_lec03_en.py, ported from
# the RU build_v3.py sid list, which is the source of truth for v6.4). The RU
# deck-part3.yaml still lists those four in the old order and so disagrees with
# its own render at positions 45-48; that desync is deliberately NOT mirrored
# here, since a spec that contradicts its artifact mis-maps commentary to
# slides for anyone reading it positionally. Worth fixing on the RU side too.

# ─────────────────────────────────────────────────────────────────────────
