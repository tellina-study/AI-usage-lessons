    learning_goal: "Механика ступени 5 — обнаружение (tools/list и другие), полное имя инструмента mcp__сервер__инструмент, режим отложенной загрузки и переменная ENABLE_TOOL_SEARCH — прямая опора под слайд цены в токенах"
