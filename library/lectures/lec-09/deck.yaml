deck:
  lecture_number: 9
  title: "Фронтир, который сам становится лабораторией"
  subtitle: "ИИ в гражданской космической отрасли"
  audience: "студенты-инженеры 3 курса, универсальная"
  duration_min: 75
  central_question: "Какие решения космос заставил придумать — и существовали ли они до того, как он потребовал их?"
  axis: "Космос — фронтир: экстремальные условия (расстояние, отсутствие готовой инфраструктуры, цена ошибки) делают готовые инженерные решения недостаточными и вынуждают создавать новые — причём не заимствованные из более мягких условий, а изобретённые именно под этим давлением."
  learning_outcomes: [LO1, LO2, LO3, LO4, LO5]
  language: ru
  chapter_ref: "library/lectures/lec-09/chapter.md (+ part1b, part2, part2b, part3)"
  status: draft
  version: v1
  issue: 310
  branch: "issue-310-lec-09-refresh"
  note: >
    Phase 5 (структура + содержимое слайдов). Рендер (PPTX, Phase 6) не выполнялся —
    media-поля указывают на реально скачанные ассеты где они есть
    (library/lectures/lec-09/assets/razdel-{1,2,3,4}/...) либо честно помечены
    media_needed/gap там, где ассет не найден (LeoLabs — gap, зафиксирован явно).
    Keystone Ряд 2 (§0.6) оставлен явным открытым плейсхолдером для владельца —
    не заполнять за него.
  sections:
    - {n: 0, name: "Вход", slides: "s01-s13"}
    - {n: 1, name: "Автономные роботы в космосе", term: "автономная робототехника", slides: "s14-s25"}
    - {n: 2, name: "Удалённое управление", term: "телеоперация", slides: "s26-s36"}
    - {n: 3, name: "Проектирование и новые возможности", term: "ИИ-ассистированное проектирование и прогноз", slides: "s37-s48"}
    - {n: 4, name: "Космос для ИИ", term: "орбитальные вычисления", slides: "s49-s56"}
    - {n: 5, name: "Сборка", slides: "s57-s66"}
    - {n: 6, name: "Закрытие", slides: "s67-s68"}
    - {n: "QA", name: "Вопросы", slides: "s69"}

slides:
  # ===== Раздел 0. Вход =====
  - id: s01
    file: slides/s01-cover.md
    type: hero_cover
    section: "0. Вход"
    assertion: "Фронтир, который сам становится лабораторией"
    learning_goal: "Hook + заявка темы: гражданский космос как фронтир, который вынуждает изобретать, не только применять"
    media: "assets/razdel-1/corob-x/corobx-12-pia12954-marius-hills-skylight-moon.jpg"

  - id: s02
    file: slides/s02-obval-stoimosti-zapuska.md
    type: norm
    section: "0. Вход"
    assertion: "Доставка килограмма на орбиту подешевела в 18–20 раз за два десятилетия — опора всей лекции"
    learning_goal: "§0.1: число, которое держит весь обзор отрасли, с методической оговоркой про прайс-лист"

  - id: s03
    file: slides/s03-sputnikov-i-dannykh-na-poryadok-bolshe.md
    type: norm
    section: "0. Вход"
    assertion: "Спутников стало в ~12 раз больше за 10 лет, данных — в разы больше: обслуживать это вручную уже нельзя"
    learning_goal: "§0.2: второй взрыв — рост числа спутников и объёма данных как прямое следствие первого"

  - id: s04
    file: slides/s04-kto-zapuskaet-i-s-kakoy-skorostyu.md
    type: schema_matrix
    section: "0. Вход"
    assertion: "Многоразовость — уже не привилегия одной компании, но больше половины мировых запусков — одна страна"
    learning_goal: "§0.2а: структура игроков, концентрация, скорость оборота ускорителя"

  - id: s05
    file: slides/s05-starship-plan-i-fakt.md
    type: norm
    section: "0. Вход"
    assertion: "Starship совершил 14 полётов и ловил бустер трижды — но вторую ступень не поймал ни разу"
    learning_goal: "§0.3: второй виток падения стоимости — честная грань факта и цели"

  - id: s06
    file: slides/s06-porog-a-ne-obeschanie.md
    type: norm
    section: "0. Вход"
    assertion: "Google называет порог $200/кг для орбитальных вычислений — сегодня они дороже земных в 2,5–3 раза"
    learning_goal: "§0.4: что открывает падение стоимости — порог, а не достигнутое состояние"

  - id: s07
    file: slides/s07-pochemu-seychas-tri-frontira.md
    type: schema_matrix
    section: "0. Вход"
    assertion: "Космическая энергетика, лунные базы и добыча на астероидах — идеи 1970-х; порог входа упал только сейчас"
    learning_goal: "§0.4а: почему именно сейчас — барьер входа против барьера экономики"

  - id: s08
    file: slides/s08-os-lektsii-i-adresa-platezha.md
    type: norm
    section: "0. Вход"
    assertion: "Фронтир не просто требует решений — он их порождает"
    learning_goal: "§0.5: ось лекции и четыре адреса платежа (расстояние, данные, время человека, новая возможность)"

  - id: s09
    file: slides/s09-keystone-ot-shakhty-do-lunnoy-trubki.md
    type: norm
    section: "0. Вход"
    assertion: "Решение для земной шахты оказалось пригодным для лунной лавовой трубки — фронтир сам стал лабораторией"
    learning_goal: "§0.6 Keystone: тройка NeBula/LAMP — предъявляет ось одним измеренным случаем"

  - id: s10
    file: slides/s10-vopros-lektsii.md
    type: norm
    section: "0. Вход"
    assertion: "Какие решения космос заставил придумать — и существовали ли они до того, как он потребовал их?"
    learning_goal: "§0.7: вопрос лекции, произносится здесь впервые"

  - id: s11
    file: slides/s11-karta-vechera-chetyre-fronta.md
    type: schema_matrix
    section: "0. Вход"
    assertion: "Четыре фронта: машина решает сама, человек управляет на расстоянии, модель проектирует, вычисления переезжают в космос"
    learning_goal: "§0.8: карта вечера — lecture-map слайд"

  - id: s12
    file: slides/s12-kak-chitat-chisla.md
    type: norm
    section: "0. Вход"
    assertion: "Число-факт, число-порог, число-оценка аналитика — три разных типа чисел, и путать их нельзя"
    learning_goal: "§0.8а: правило чтения чисел этой лекции"

  - id: s13
    file: slides/s13-forma-razbora-pyat-shagov.md
    type: schema_pipeline
    section: "0. Вход"
    assertion: "Каждый разбор дальше устроен одинаково: цена ошибки → классический режим → модель → устройство → что переехало"
    learning_goal: "§0.9: форма разбора — шаблон, по которому читаются все 13 случаев"

  # ===== Раздел 1. Автономные роботы в космосе =====
  - id: s14
    file: slides/s14-divider-razdel-1.md
    type: divider
    section: "1. Автономные роботы в космосе"
    assertion: "1. Автономные роботы в космосе"
    learning_goal: "Divider: AEGIS, SPOC, COROB-X, LeoLabs — максимум автономии главы"

  - id: s15
    file: slides/s15-stadiya-avtonomnaya-robototekhnika.md
    type: norm
    section: "1. Автономные роботы в космосе"
    assertion: "Автономная робототехника — решение и физическое действие без диспетчера на каждом шаге"
    learning_goal: "§1.1: термин, данные, способы их получения, решение, альтернатива — максимум автономии главы"

  - id: s16
    file: slides/s16-gde-klassika-gde-model.md
    type: norm
    section: "1. Автономные роботы в космосе"
    assertion: "Геометрия решена классикой без обучения; узнавание объекта среди шума — обучаемой моделью"
    learning_goal: "§1.2: граница между автоматикой и обученной моделью на материале раздела"

  - id: s17
    file: slides/s17-metody-geometriya-i-sluchayny-les.md
    type: norm
    section: "1. Автономные роботы в космосе"
    assertion: "Стереопара вычисляет дальность геометрией, не обучением; случайный лес — ансамбль деревьев, который можно прочитать до конца"
    learning_goal: "§1.2а, блоки 1–2: стереозрение/параллакс и random forest — держат AEGIS"

  - id: s18
    file: slides/s18-metody-karta-bez-gps-i-detektor.md
    type: schema_layered
    section: "1. Автономные роботы в космосе"
    assertion: "Три уровня SLAM сшивают карты роботов без GPS; детектор YOLO находит объект за один проход"
    learning_goal: "§1.2а, блоки 3–4: SLAM с графом поз и CNN-детекция — держат COROB-X, продолжают keystone"

  - id: s19
    file: slides/s19-primer-aegis.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "AEGIS поднял точность выбора цели с 24% до 93% — без единой команды с Земли"
    learning_goal: "§1.3: разбор AEGIS, граф а, keystone-уровень доказательности"

  - id: s19a
    file: slides/s19a-aegis-na-marse.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "То же AEGIS, что поднял точность до 93% на Curiosity, в 2022 году впервые сработало на Perseverance — с другим инструментом, SuperCam"

  - id: s19b
    file: slides/s19b-aegis-kak-vstroyeno.md
    type: schema_layered
    section: "1. Автономные роботы в космосе"
    assertion: "Человек настраивает профиль цели заранее, на Земле; выбор конкретной цели в моменте делает алгоритм на борту"

  - id: s20
    file: slides/s20-primer-spoc.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "SPOC размечает марсианский грунт глубокой сетью с точностью 98% — уже сейчас на Земле, бортом — только в будущем"
    learning_goal: "§1.4: разбор SPOC, граф б, Earth-side инструмент плюс форвард-часть"

  - id: s20a
    file: slides/s20a-spoc-marsianskiy-grunt.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "Три типа поверхности на этом снимке — исходные данные AI4Mars, того же проекта, на выборке которого продолжает учиться SPOC"

  - id: s20b
    file: slides/s20b-spoc-kak-vstroyeno.md
    type: schema_layered
    section: "1. Автономные роботы в космосе"
    assertion: "SPOC размечает карту проходимости, но ехать или не ехать решает водитель ровера, а не модель"

  - id: s21
    file: slides/s21-primer-corob-x.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "Три робота разведали лунную лавовую трубку там, где классического аналога на Земле не было вовсе"
    learning_goal: "§1.5: разбор COROB-X, граф в — задача новая"

  - id: s21a
    file: slides/s21a-corob-x-polevoy-test.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "Это настоящий полевой тест 2023 года на Земле, не Луна: ровер на тросе спускается в ту же лавовую трубку, которую раньше разведывал человек"

  - id: s21b
    file: slides/s21b-corob-x-kak-vstroyeno.md
    type: schema_layered
    section: "1. Автономные роботы в космосе"
    assertion: "SherpaTT, Coyote III и LUVMI-X картографируют каждый сам по себе; единую карту трубки сшивает ровно тот трёхуровневый SLAM, что разобран на соседнем кадре"

  - id: s22
    file: slides/s22-primer-leolabs.md
    type: case_study
    section: "1. Автономные роботы в космосе"
    assertion: "LeoLabs приоритизирует радар и выдаёт до 400% больше предупреждений о сближении — но не знает, сколько манёвров из них вышло"
    learning_goal: "§1.5a: разбор LeoLabs, четвёртый разбор раздела (исключение 3+6), граф б"

  - id: s22a
    file: slides/s22a-leolabs-kak-vstroyeno.md
    type: schema_layered
    section: "1. Автономные роботы в космосе"
    assertion: "Модель решает, что наблюдать следующим; маневрировать или нет — решает оператор конкретного спутника, не LeoLabs"

  - id: s23
    file: slides/s23-upominaniya-razdel-1.md
    type: norm
    section: "1. Автономные роботы в космосе"
    assertion: "Классика везёт Perseverance на 90% маршрута без единой нейросети; Starlink совершает 300 000 манёвров в год сам"
    learning_goal: "§1.6: шесть упоминаний — другой тип задачи, другой статус готовности"

  - id: s24
    file: slides/s24-chto-dalo-i-potrebovalo-razdel-1.md
    type: schema_matrix
    section: "1. Автономные роботы в космосе"
    assertion: "Выигрыш крупный там, где технология летает годами; там, где не летала — сказано прямо"
    learning_goal: "§1.7 + накопительная карта стадии: что дало, что потребовало, три клетки сетки занято"

  - id: s25
    file: slides/s25-vyvod-razdela-1.md
    type: norm
    section: "1. Автономные роботы в космосе"
    assertion: "Геометрия — классике, распознавание объекта среди шума — модели, совсем новая задача — не имеет классического аналога вовсе"
    learning_goal: "§1.8: вывод раздела 1, мост к разделу 2"

  # ===== Раздел 2. Удалённое управление =====
  - id: s26
    file: slides/s26-divider-razdel-2.md
    type: divider
    section: "2. Удалённое управление"
    assertion: "2. Удалённое управление"
    learning_goal: "Divider: Dragon, предсказательная компенсация задержки, Astrobee — минимум автономии главы"

  - id: s27
    file: slides/s27-stsena-korabl-parkuetsya-sam.md
    type: norm
    section: "2. Удалённое управление"
    assertion: "Экипаж держит руки на экране, а корабль сам подводит себя к станции"
    learning_goal: "§2.1: сцена, сознательный разрыв формы вместо определения термина"

  - id: s28
    file: slides/s28-stadiya-teleoperatsiya.md
    type: norm
    section: "2. Удалённое управление"
    assertion: "Телеоперация — управление на расстоянии, при котором решение остаётся за человеком"
    learning_goal: "§2.2: термин и общее описание стадии — после сцены, не до неё"

  - id: s29
    file: slides/s29-gde-nuzhen-chelovek-granitsa-sdvinuta.md
    type: schema_timeline
    section: "2. Удалённое управление"
    assertion: "Задержка до МКС — доли секунды, до Луны — 1,3 секунды, до Марса — от 3 до 22 минут: скорость света не обойти"
    learning_goal: "§2.3: где человек нужен в контуре, где граница уже сдвинута — физика ограничения"

  - id: s30
    file: slides/s30-metody-kontroller-i-tyoplyy-start.md
    type: schema_pipeline
    section: "2. Удалённое управление"
    assertion: "Классический контроллер меряет, сравнивает и правит десятки раз в секунду; тёплый старт только подсказывает ему хорошую точку начала"
    learning_goal: "§2.3а: механика классического контроллера, тёплого старта и предсказательной компенсации задержки"

  - id: s30a
    file: slides/s30a-metody-predskazatelnaya-kompensatsiya.md
    type: schema_layered
    section: "2. Удалённое управление"
    assertion: "Обучаемая модель предсказывает картину вперёд на величину задержки и меняет то, что оператор видит, — не то, что он решает"

  - id: s31
    file: slides/s31-primer-dragon.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "На дистанции 220 метров управление Dragon заранее передано автоматике — рутинно с 2020 года"
    learning_goal: "§2.4: разбор Dragon, граф б, override как принцип"

  - id: s31a
    file: slides/s31a-dragon-stykovochnyy-uzel.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "Это узлы настоящего оборудования NASA Docking System — то, что физически принимает автоматику Dragon на последних метрах"

  - id: s31b
    file: slides/s31b-dragon-kak-vstroyeno.md
    type: schema_layered
    section: "2. Удалённое управление"
    assertion: "Вход и выход автоматики Dragon известны по открытым данным; что происходит внутри — SpaceX публично не раскрывает"

  - id: s32
    file: slides/s32-primer-predskazatelnaya-kompensatsiya.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "Модель предсказывает картину на величину задержки и снижает время задачи до 26% — но решения всё равно принимает человек"
    learning_goal: "§2.5: разбор предсказательной компенсации задержки, исследовательская стадия"

  - id: s32a
    file: slides/s32a-luna-poligon.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "Это земной аналоговый полигон LUNA в Германии, не реальная лунная поверхность — именно здесь испытывают предсказательную компенсацию задержки"

  - id: s33
    file: slides/s33-primer-astrobee.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "Astrobee показал «тёплый старт»: модель предлагает траекторию, классический контроллер её уточняет"
    learning_goal: "§2.6: разбор Astrobee, TRL5, явно названная организация-разработчик"

  - id: s33a
    file: slides/s33a-astrobee-na-mks.md
    type: case_study
    section: "2. Удалённое управление"
    assertion: "Astrobee летает внутри станции сам, на вентиляторах, без троса и без рук — именно этим свободным полётом управляет тёплый старт"

  - id: s33b
    file: slides/s33b-astrobee-kak-vstroyeno.md
    type: schema_layered
    section: "2. Удалённое управление"
    assertion: "Astrobee летает без троса на вентиляторах; модель лишь подсказывает маршрут через модуль станции, финальную проверку несёт классический контроллер"

  - id: s34
    file: slides/s34-upominaniya-razdel-2.md
    type: norm
    section: "2. Удалённое управление"
    assertion: "Телехирургия через Starlink работает на задержке ~130 мс — но обученной модели в решении нет вовсе"
    learning_goal: "§2.7: экзоскелеты, задержка Земля–МКС, телехирургия как честный нулевой случай"

  - id: s35
    file: slides/s35-chto-dalo-i-potrebovalo-razdel-2.md
    type: schema_matrix
    section: "2. Удалённое управление"
